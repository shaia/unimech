#   W02 Δv = 2200 ln(850/810) = 106 m/s (one push 103.5);  W03 a0 = 5.2 m/s², a_end = 40.2 m/s²;
#   W04 m0/m1 = e^(9.5/3.0) = 23.7 (final 4.21 %), with u = 4.4 km/s 8.66 (11.5 %);
#   W06 F = 36 N, motor 86.4 W, kinetic 43.2 W, heat 43.2 W;  W07 v(30 s) = 3.75 m/s, x = 141 m (180 m without sand);
#   W08 T = 2.0·10⁴ N > 4900 N, t_b = 30 s, v_b = 1539 m/s (1833 − 294), y_b = 1.89·10⁴ m, apex 1.40·10⁵ m at 187 s;
#   W09 hover time (u/g) ln 1.5 = 103 s, burn rate 3.53 → 2.35 kg/s;  W10 F = 7.35 + 2.0 = 9.35 N, P = 18.7 W,
#       dU/dt = 14.7 W, dK/dt = 2.0 W, lost 2.0 W;
#   c1 v_T = √(g/k) = 49.5 m/s (k = 4.0·10⁻³ m⁻¹), 1/√(gk) = 5.05 s, v(10 s) = 47.6 m/s, 90 % after 7.44 s;
#   c2 6249, 3845, 3343, 7188 m/s; stage 1 μ = 1.35·10⁵ kg/s, thrust 4.06·10⁸ N, T/W = 1.47; one stage over 510 s
#      T/W = 0.525; g·510 s = 4998 m/s.

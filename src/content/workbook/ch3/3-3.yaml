#   W05 P = (1200 − 900)·9.8·2.0 = 5880 W, with 400 N of friction 6680 W;
#   W06 U = ½kx² − ¼βx⁴, k = 8.0 N/m, β = 2.0 N/m³, m = 0.50 kg: hills at ±2.0 m, U = 8.0 J, U″ = −16 N/m; trapped below
#       5.66 m/s; at 4.0 m/s turning points ±1.08 m;

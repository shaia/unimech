#   c2 I_tot = 25/6 MR², ω = (3ω₀ − 8v₀/R)/25, no rotation at ω₀ = 8v₀/(3R), K lost = (M/50)(11R²ω₀² + 8Rv₀ω₀ + 6v₀²)

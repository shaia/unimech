#   W05 uniform Earth: g(300 km up)/g_s = 0.912; the same g at depth d = 5.60e5 m (d/h = 1.87; small-h rule 2h);
#   W07 F_sun/F_moon on the Earth = 177 (3.52e22 N, 1.98e20 N; the mass ratio alone 2.71e7);
#   W08 four 2.0 kg masses on a square of side 0.40 m: U = −(4 + √2)Gm²/a = −3.61e-9 J (sides only −2.67e-9 J);
#   W09 ρ = C/r, M = 6.4e23 kg, R = 3.4e6 m: C = M/(2πR²) = 8.81e9 kg/m², g = GM/R² = 3.69 m/s² everywhere inside,
#       U/m at the centre −2GM/R = −2.51e7 J/kg;

# Workbook, lesson 0.4 (integrals: from sum to accumulation). Format and rules: .claude/CLAUDE.md, "The solution
# format" (law … limit, units, result). In a >- block, consecutive lines fold into one paragraph: every part
# (א, ב, …) starts after a blank line.
#
# Every number was recomputed in .scratch/ch0/0-4/numbers.ts with src/physics/accumulate.ts, calculus.ts (riemann)
# and G = 9.8 from constants.ts:
#   W-02: v = 0.60t², 0…5.0 s: Δx = 25.0 m, v(5) = 15 m/s (15·5 = 75 m is the wrong product);
#   W-03: λ = 0.30 + 0.60x/L at the middles of 5 pieces: 0.36, 0.48, 0.60, 0.72, 0.84 kg/m (ratio 2.33), mean 0.60
#         (moved in review off 0.20…0.80 kg/m, which is the lesson's own tapered rod);
#   W-09 and the lesson's ex-0-4-4 integrate (1 − z/h)² by expanding the square: the lesson never teaches substitution;
#   W-04: a = a_m sin(πt/τ), a_m = 1.5·10⁴ m/s², τ = 5.0 ms: Δv = 2a_mτ/π = 47.7 m/s (a_mτ = 75), ā = 9.55·10³,
#         −20 m/s → +27.7 m/s;
#   W-05: v = 4 − 2√t, 0…9 s: displacement 0, distance 32/3 = 10.7 m, x_max = 16/3 = 5.33 m at t = 4 s;
#   W-06: v = 0, 8, 14, 18, 20 m/s every 2.0 s: left 80 m, right 120 m, trapezoid 100 m;
#   W-07: λ = λ₀√(x/L), λ₀ = 0.60 kg/m, L = 1.5 m: M = 2λ₀L/3 = 0.600 kg, x_cm = 3L/5 = 0.900 m (λ₀L = 0.90);
#   W-08: a = a₀ sin(2πt/T), a₀ = 1.2 m/s², T = 8.0 s, from rest: v_max = a₀T/π = 3.06 m/s, Δy = a₀T²/(2π) = 12.2 m,
#         half of it, 6.11 m, by T/2;
#   W-09: cone R = 2.0 m, h = 6.0 m, ρ = 2.5·10³ kg/m³: M = ρπR²h/3 = 6.28·10⁴ kg, z_cm = h/4 = 1.50 m
#         (a cylinder 1.88·10⁵ kg);
#   W-10: a = 0, 1.2, 1.8, 1.2, 0 m/s² each 1.0 s: v = 0, 0.6, 2.1, 3.6, 4.2 m/s, x = 0, 0.3, 1.65, 4.5, 8.4 m;
#   c1:   hose L = 15 m, λ = 3.0 kg/m: W = λgL²/2 = 3.31·10³ J (MgL = 6.62·10³ J);
#   c2:   pail 1.0 kg, paint 5.0 kg, H = 9.0 m, 1/5 leaks: W = gH(m_b + 0.9m_p) = 485 J (529 J without the leak,

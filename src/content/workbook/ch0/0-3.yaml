#   W-02: θ = 0.3: sin error 4.48e-3 (estimate θ³/6 = 4.5e-3, 1.5%); cos error 3.36e-4 (θ⁴/24 = 3.4e-4, 0.035%);
#   W-03: helix R = 0.20 m, ω = 5.0 rad/s, u = 0.60 m/s: |v| = 1.17 m/s, |a| = 5.0 m/s², v at 59.0° to the axis;
#   W-04: cone, α = 30°, Q = 0.50 L/s, h = 0.40 m: ḣ = 2.98e-3 m/s (1.19e-2 at h = 0.20 m);
#   W-05: m = 1000 kg, h = 300 km, R = 6.37e6 m: mgh = 2.94e9 J, ×(1 − h/R) = 2.80e9 J, exact mghR/(R + h) = 2.81e9 J;
#   W-06: R = 2.0 m, α = 0.50 rad/s², t = 2.0 s: |v| = 2.0 m/s, d|v|/dt = 1.0 m/s², |a| = 2.24 m/s²;
#   W-07: e = 0.0167: ±2e = ±3.34%; exact +3.43% (perihelion), −3.26% (aphelion); max/min = 1.069;
#   W-08: A = 0.10 m, ω = 2π rad/s, error 1.0 mm: τ = (6·1e-3/(Aω³))^(1/3) = 0.0623 s (true error at t₀ = 0: 0.99 mm);
#   W-09: τ = 3.0 s: estimate t = 0.1τ = 0.30 s; exact (1 − e^(−u))/u = 0.95 at u = 0.1035, t = 0.310 s;
#   W-10: d = 50 m, θ = 30°, δθ = 0.50°: h = 28.9 m, δh = 0.582 m (exact 0.585), δh/h = 2.0%, 1.75% at 45°;
#         the degree slip gives 33.3 m;

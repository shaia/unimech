#       μ_min = (2/5) tan θ = 0.187;
#   W05 solid cylinder 3.0 kg at 2.0 m/s: K = 9.00 J, of which 3.00 J rotational;
#   W06 hollow sphere, v0 = 5.0 m/s, no spin, μk = 0.10: v = (3/5)v0 = 3.00 m/s after 2.04 s and 8.16 m; K kept 3/5;
#   W08 solid ball in a loop of radius 0.50 m: h_min = 2.7 r = 1.35 m (a point mass 1.25 m), v at the top √(gr) = 2.21 m/s;
#   W09 elastic head-on hit of a rolling ball (2.0 m/s) on an identical one at rest, μk = 0.20: striker 0.571 m/s,
#       target 1.43 m/s, both after 0.292 s; striker skids 0.0833 m, target 0.500 m; K kept 0.592;
#   W10 disc 2.0 kg rolling, pulled at its axle by 0.50 kg over a pulley: a = 1.40 m/s², f = 1.40 N, T = 4.20 N,
#       μ_min = 0.0714 (sliding block 1.96 m/s², a ring 1.09 m/s²);

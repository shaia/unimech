# Workbook, lesson 8.1 (kinematics of a rigid body). Format: CLAUDE.md, "The solution format".
# Every number was recomputed by .scratch/ch8/8-1/workbook.ts with src/physics/rigidbody.ts and rigidkinematics.ts:
#   W02 33⅓ rpm → 0 in 12 s: ω₀ = 3.49 rad/s, α = −0.291 rad/s², θ = 20.9 rad = 3.33 rev, rim (r = 0.15 m) 0.524 m/s;
#   W03 90 km/h = 25.0 m/s, R = 0.31 m: |ω| = 80.6 rad/s = 770 rpm, top 50.0 m/s;
#   W04 rod 0.80 m, v_cm = (0.30, 0.40) m/s, ω = 2.5 rad/s: v_A = (0.30, 1.4), 1.43 m/s; v_B = (0.30, −0.60), 0.671 m/s;
#       r_Q = (−0.16, 0.12) m, 0.200 m from the CM;
#   W05 3000 rpm = 314 rad/s, stops after 200 rev = 1257 rad: α = −39.3 rad/s², t = 8.00 s, after 100 rev ω₀/√2 = 222 rad/s;
#   W06 v_cm = 2.0 m/s, ω = +10 rad/s (backspin), R = 0.11 m: contact slides forward at 3.1 m/s, top 0.90 m/s,
#       r_Q = (0, 0.20) m;
#   W07 α = 4.0 rad/s² from rest, R = 0.10 m: a_c = a_t at t = 1/√α = 0.500 s after ½ rad, |a| = √2αR = 0.566 m/s²;
#   W08 80 rpm = 8.38 rad/s, r₁ = 0.10, r₂ = 0.040, R = 0.34 m: chain 0.838 m/s, ω₂ = 20.9 rad/s, v = 7.12 m/s
#       (25.6 km/h; 2.85 m/s if the pedal ω is put on the wheel);
#   W09 belt −1.5 m/s, centre +0.50 m/s, R = 0.25 m: ω = −8.0 rad/s, top 2.5 m/s;
#   W10 rollers R = 0.050 m under a board at 0.40 m/s: centres 0.20 m/s, |ω| = 4.0 rad/s; per revolution the roller
#       moves 0.314 m and the board 0.628 m; boards ±0.40 m/s: centre at rest, |ω| = 8.0 rad/s;
#   c1 (MIT 8.01 Fall 2016, Problem Set 12, Problem 1) arch length 8R checked by a midpoint sum (R = 0.35 m: 2.80 m);
#   c2 (same set, Problem 2) R = 0.50, b = 0.050 m, Ω = 2.0, ω = 10 rad/s: v = ΩR − ωb = 0.50 m/s, centre turns at

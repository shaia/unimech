# format": given → law → manipulation (symbolic result) → limit → units → substitution → result.
# Every number was recomputed in .scratch/ch2/2-6/workbook.ts with src/physics/circulardynamics.ts
# (bankedDesignSpeed, bankedSpeedRange, conicalPendulum, humpNormal, supportForceFromBottom) and curvilinear.ts
# (omegaFromFrequency, centripetalFromOmega), G = 9.8 from src/physics/constants.ts:
#   W-02 m = 0.50 kg, r = 0.80 m, 2.0 rev/s: ω = 12.6 rad/s, v = 10.1 m/s, T = 63.2 N (mg = 4.90 N);
#   W-03 hump R = 30 m, v = 12 m/s, m = 1200 kg: v²/R = 4.80, N = 6000 N (0.510 mg, mg = 11800 N); leaves at 17.1 m/s;
#   W-04 R = 250 m, v = 25 m/s: tanθ = 0.255, θ = 14.3°;
#   W-05 h = 0.50 m, L = 0.80 m and 1.20 m: both 1.42 s; θ = 51.3° and 65.4°; T = 1.60 mg and 2.40 mg;
#   W-06 m = 0.20 kg, M = 0.50 kg, r = 0.40 m: v = 3.13 m/s, ω = 7.83 rad/s, a turn in 0.803 s;
#   W-07 loop R = 10 m, v = 12 m/s, 60 kg: v²/R = 14.4, N = 276 N (0.469 mg), v_min = 9.90 m/s;
#   W-08 v = 100 m/s, 30°: R = 1770 m, the seat pushes 1.15 mg (792 N on 70 kg, mg = 686 N);
#   W-09 R = 60 m, θ = 30°: v₀ = 18.4 m/s; μs = 0.10: 16.3 to 20.6 m/s (gR = 588, ratios 0.451 and 0.719);
#     tan 30° = 0.577, cot 30° = 1.73;

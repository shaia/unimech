# Workbook, lesson 2.3 (weight, the normal force, tension and springs). Format: CLAUDE.md, "The solution format".
# Every number was recomputed by .scratch/ch2/2-3/numbers.ts against src/physics/tension.ts with G = 9.8:
#   W02 k = 49 N/m, relaxed length 20.0 cm, with 0.80 kg 36.0 cm;  W03 T = 29.4 N (the force on the pulley's axle
#   would be 2T cos 20° = 55.3 N);  W05 kΔx = 23.0 N, a = 1.7 m/s² up;  W06 F at the 3 kg block: a = 4.0 m/s²,
#   T = 4.0 N and 12 N; F at the 1 kg block: 12 N and 20 N;  W07 N = 2.14·10⁴ N, N/mg = 1.82;
#   W09 a = 3.27 m/s², T at the peg 2.61 N (the two sides weigh 3.92 N and 1.96 N; balanced, x = L/2: 2.94 N);
#   c1 λ₀ = πM/(2L) = 0.785 kg/m, T(0) = 19.6 N, T(L/3) = 14.7 N, T(L/2) = 9.80 N, T(L) = 0;
#   c2 T(0) = 5.40 N, T(l/2) = 4.73 N, T(l) = 2.70 N.
# In a >- block consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '2.3'
practice:
  - id: W-2.3-01
    level: basic
    qualitative: true
    objectives: [OBJ-2.3-1]
    prompt: >-
      אדם עומד על מאזניים במעלית. דרגו את מה שהמאזניים מראים בשישה מצבים, מהגדול לקטן, וציינו מצבים שבהם הקריאה
      שווה: (1) המעלית עומדת; (2) עולה במהירות קבועה; (3) עולה ומאיצה; (4) עולה ומאטה; (5) יורדת ומאיצה; (6) יורדת
      ומאטה. בכל מצב שבו המעלית מאיצה, גודל התאוצה זהה.
    answer: >-
      (3) = (6) > (1) = (2) > (4) = (5).
    solution:
      - kind: law
        text: >-
          הגוף הוא האדם, וציר חיובי כלפי מעלה. החוק השני: $N - mg = ma$, ולכן $N = m(g + a)$. המאזניים מראים $N$.
      - kind: reasoning
        text: >-
          הכוח הנורמלי תלוי רק בתאוצה, לא במהירות. ב-(1) וב-(2) $a = 0$. ב-(3) התאוצה בכיוון התנועה, כלפי מעלה; ב-(6) גוף
          שיורד ומאט מאיץ נגד התנועה, כלומר גם כן כלפי מעלה. ב-(4) וב-(5) התאוצה כלפי מטה.
      - kind: limit
        text: >-
          אם גודל התאוצה שואף לאפס, כל שש הקריאות מתאחדות ל-$mg$, כמו שצריך.
      - kind: units
        text: >-
          $m(g + a)$ ב-$\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: result
        text: >-
          (3) = (6) > (1) = (2) > (4) = (5). כיוון התנועה לא משנה; רק כיוון התאוצה.

  - id: W-2.3-02
    level: basic
    objectives: [OBJ-2.3-1]
    prompt: >-
      קפיץ חסר מסה תלוי אנכית. כשתולים עליו משקולת של $0.20\,\text{kg}$ האורך שלו $24.0\,\text{cm}$, וכשתולים
      משקולת של $0.50\,\text{kg}$ האורך שלו $30.0\,\text{cm}$. בשני המקרים המשקולת נחה.

      א. מה קבוע הקפיץ, ומה האורך הרפוי שלו?

      ב. מה יהיה האורך שלו עם משקולת של $0.80\,\text{kg}$?
    answer: >-
      א. $k = 49\,\text{N/m}$, אורך רפוי $20.0\,\text{cm}$. ב. $36.0\,\text{cm}$.
    solution:
      - kind: given
        text: >-
          $m_1 = 0.20\,\text{kg}$, $\ell_1 = 0.240\,\text{m}$; $m_2 = 0.50\,\text{kg}$, $\ell_2 = 0.300\,\text{m}$. ציר חיובי כלפי מעלה.
      - kind: law
        text: >-
          חוק הוק ושיווי משקל של המשקולת: $k\left(\ell - \ell_0\right) = mg$.
      - kind: manipulation
        text: >-
          מחסרים את שתי המשוואות: $k\left(\ell_2 - \ell_1\right) = \left(m_2 - m_1\right)g$, ולכן
          $k = \dfrac{\left(m_2 - m_1\right)g}{\ell_2 - \ell_1}$ ו-$\ell_0 = \ell_1 - \dfrac{m_1g}{k}$. ה-$\ell_0$ הלא ידוע מתבטל בחיסור.
      - kind: limit
        text: >-
          כש-$m \to 0$ האורך שואף ל-$\ell_0$, וכש-$k \to \infty$ האורך לא תלוי במסה, קפיץ קשיח לגמרי.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2$ חלקי מטר נותן $\text{N/m}$.
      - kind: substitution
        text: >-
          $k = 0.30\cdot9.8/0.060 = 49\,\text{N/m}$. $\ell_0 = 24.0 - 0.20\cdot9.8/49\cdot100 = 24.0 - 4.0 = 20.0\,\text{cm}$.
          עם $0.80\,\text{kg}$: $20.0 + 0.80\cdot9.8/49\cdot100 = 20.0 + 16.0 = 36.0\,\text{cm}$.
      - kind: result
        text: >-
          א. $k = 49\,\text{N/m}$, $\ell_0 = 20.0\,\text{cm}$. ב. $36.0\,\text{cm}$.

  - id: W-2.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-2.3-2]
    prompt: >-
      גוש בעל מסה $3.0\,\text{kg}$ תלוי בחוט חסר מסה. החוט עולה אל גלגלת חסרת מסה וחסרת חיכוך שקבועה בתקרה, ויורד
      ממנה אל יד שמחזיקה אותו, בזווית $40^\circ$ לאנך. הכול נח.

      א. באיזה כוח היד מושכת את החוט?

      ב. היד משנה את הזווית ל-$70^\circ$ לאנך, והגוש עדיין נח. האם הכוח של היד משתנה?
    answer: >-
      א. $29.4\,\text{N}$. ב. לא: המתיחות בכל החוט שווה ל-$mg$, בכל זווית.
    solution:
      - kind: given
        text: >-
          הגוף הראשון הוא הגוש, וציר חיובי כלפי מעלה. $m = 3.0\,\text{kg}$, והגוש נח.
      - kind: law
        text: >-
          החוק השני לגוש: $T - mg = 0$. לחוט חסר מסה על גלגלת חסרת מסה וחסרת חיכוך: אותה מתיחות בכל נקודה.
      - kind: reasoning
        text: >-
          המתיחות ליד הגוש היא $mg$. הגלגלת רק מסובבת את כיוון החוט, ולכן גם ליד היד המתיחות $mg$, והיד מושכת בכוח הזה,
          לאורך החוט. הזווית קובעת את **הכיוון** של המשיכה, לא את הגודל שלה. היא כן משנה את הכוח שהגלגלת מפעילה על
          הציר שלה: שתי המתיחויות על הגלגלת מצטרפות לפי הזווית ביניהן.
      - kind: limit
        text: >-
          אילו לגלגלת היה חיכוך בציר, המתיחות משני צדיה הייתה יכולה להיות שונה, והתשובה הייתה תלויה בכיוון שבו החוט
          נוטה להחליק. בגבול חסר החיכוך חוזרים ל-$mg$.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          $T = 3.0\cdot9.8 = 29.4\,\text{N}$.
      - kind: result
        text: >-
          א. $29.4\,\text{N}$. ב. לא, הכוח $29.4\,\text{N}$ בכל זווית; רק הכיוון שלו משתנה.

  - id: W-2.3-04
    level: mid
    qualitative: true
    objectives: [OBJ-2.3-1]
    prompt: >-
      לשני קפיצים חסרי מסה קבועים $k$ ו-$2k$.

      א. מחברים אותם בטור ותולים עליהם משקולת $m$. איזה קפיץ מתארך יותר, ופי כמה? מה קבוע הקפיץ השקול?

      ב. מחברים אותם במקביל, קצה ליד קצה, למוט אופקי קל שהמשקולת תלויה בנקודה שבה המוט נשאר אופקי. איזה קפיץ
      מושך חזק יותר, ופי כמה? מה קבוע הקפיץ השקול?
    answer: >-
      א. הקפיץ $k$ מתארך פי 2 מהקפיץ $2k$; $k_{\text{series}} = 2k/3$. ב. הקפיץ $2k$ מושך פי 2 מהקפיץ $k$;
      $k_{\text{parallel}} = 3k$.
    solution:
      - kind: law
        text: >-
          חוק הוק, $F = kx$ בגודל. קפיץ חסר מסה מושך את שני הקצוות שלו באותו כוח.
      - kind: reasoning
        text: >-
          בטור, כל קפיץ נושא את כל הכובד $mg$. לכן $x_1 = mg/k$ ו-$x_2 = mg/(2k)$: הקפיץ הרך מתארך פי 2. במקביל, המוט
          האופקי מכריח את שניהם להתארך באותו $x$, ולכן $F_1 = kx$ ו-$F_2 = 2kx$: הקפיץ הקשיח מושך פי 2.
      - kind: manipulation
        text: >-
          בטור: $x_1 + x_2 = \dfrac{mg}{k} + \dfrac{mg}{2k} = \dfrac{3mg}{2k}$, ולכן $k_{\text{series}} = \dfrac{2k}{3}$. במקביל:
          $kx + 2kx = mg$, ולכן $k_{\text{parallel}} = 3k$.
      - kind: limit
        text: >-
          אם הקפיץ השני היה קשיח לגמרי, בטור היה נשאר $k$ (הוא לא מתארך), ובמקביל הזוג היה קשיח לגמרי. התוצאות שואפות
          לזה: $1/k_{\text{series}} \to 1/k$ ו-$k_{\text{parallel}} \to \infty$.
      - kind: units
        text: >-
          שני הקבועים השקולים ב-$\text{N/m}$, כמו $k$.
      - kind: result
        text: >-
          א. הקפיץ $k$, פי 2; $k_{\text{series}} = 2k/3$, רך מכל אחד מהם. ב. הקפיץ $2k$, פי 2; $k_{\text{parallel}} = 3k$.

  - id: W-2.3-05
    level: mid
    objectives: [OBJ-2.3-1]
    prompt: >-
      במעלית תלוי מהתקרה קפיץ חסר מסה עם $k = 500\,\text{N/m}$, ועליו משקולת של $2.0\,\text{kg}$ שנחה ביחס למעלית.
      כשהמעלית בתנועה, הקפיץ מתארך $4.6\,\text{cm}$ מהאורך הרפוי שלו.

      א. מה התאוצה של המעלית, גודל וכיוון?

      ב. האם אפשר לדעת אם המעלית עולה או יורדת?
    answer: >-
      א. $1.7\,\text{m/s}^2$ כלפי מעלה. ב. לא: היא עולה ומאיצה, או יורדת ומאטה.
    solution:
      - kind: given
        text: >-
          הגוף הוא המשקולת, וציר חיובי כלפי מעלה. היא נחה ביחס למעלית, ולכן התאוצה שלה היא התאוצה $a$ של המעלית.
          $k = 500\,\text{N/m}$, $\Delta x = 0.046\,\text{m}$, $m = 2.0\,\text{kg}$.
      - kind: law
        text: >-
          החוק השני למשקולת: $k\,\Delta x - mg = ma$.
      - kind: manipulation
        text: >-
          $a = \dfrac{k\,\Delta x}{m} - g$.
      - kind: limit
        text: >-
          אם $k\,\Delta x = mg$ (התארכות של $3.92\,\text{cm}$), $a = 0$: מעלית שלא מאיצה. אם הקפיץ רפוי, $a = -g$: נפילה חופשית.
      - kind: units
        text: >-
          $\text{N/m}\cdot\text{m}/\text{kg} = \text{m/s}^2$.
      - kind: substitution
        text: >-
          $k\,\Delta x = 500\cdot0.046 = 23.0\,\text{N}$, ולכן $a = 23.0/2.0 - 9.8 = 1.7\,\text{m/s}^2$.
      - kind: result
        text: >-
          א. $1.7\,\text{m/s}^2$ כלפי מעלה. ב. לא. הקפיץ מגיב לתאוצה בלבד, וגם מעלית שיורדת ומאטה מאיצה כלפי מעלה.

  - id: W-2.3-06
    level: mid
    objectives: [OBJ-2.3-2]
    prompt: >-
      שלושה גושים, $1.0$, $2.0$ ו-$3.0\,\text{kg}$, עומדים בשורה על רצפה חלקה, מחוברים בחוטים קלים: הגוש של
      $1.0\,\text{kg}$ קשור לגוש של $2.0\,\text{kg}$, וזה לגוש של $3.0\,\text{kg}$. מושכים את הגוש של
      $3.0\,\text{kg}$ קדימה בכוח אופקי $F = 24\,\text{N}$.

      א. מה התאוצה, ומה המתיחות בכל חוט?

      ב. מושכים עכשיו באותו כוח את הגוש של $1.0\,\text{kg}$, בכיוון ההפוך. מה המתיחויות?
    answer: >-
      א. $a = 4.0\,\text{m/s}^2$; $4.0\,\text{N}$ בחוט שאחרי הגוש הקל ו-$12\,\text{N}$ בחוט שלפני הגוש הכבד.
      ב. $20\,\text{N}$ בחוט שליד הגוש הקל ו-$12\,\text{N}$ בחוט שליד הגוש הכבד.
    solution:
      - kind: given
        text: >-
          ציר חיובי בכיוון המשיכה. החוטים קלים ומתוחים, ולכן כל הגושים מאיצים יחד ב-$a$.
      - kind: law
        text: >-
          החוק השני לכל הגושים יחד: $F = \left(m_1 + m_2 + m_3\right)a$. החוק השני לגוף שמאחורי חוט: המתיחות בחוט היא
          הכוח האופקי היחיד שמאיץ את כל מה שמאחוריו.
      - kind: manipulation
        text: >-
          $a = F/\sum m$. המתיחות בחוט היא $a$ כפול המסה **שמאחוריו**: בחלק א' $T_1 = m_1a$ ו-$T_2 = (m_1 + m_2)a$, ובחלק ב'
          $T_1' = m_3a$ ו-$T_2' = (m_3 + m_2)a$.
      - kind: limit
        text: >-
          אם הגושים שמאחורי חוט חסרי מסה, המתיחות בו אפס: אין מה להאיץ. אם המושך מושך גוש יחיד (שני האחרים חסרי מסה),
          $a = F/m$, ושני החוטים רפויים.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          $a = 24/6.0 = 4.0\,\text{m/s}^2$. א: $T_1 = 1.0\cdot4.0 = 4.0\,\text{N}$, $T_2 = 3.0\cdot4.0 = 12\,\text{N}$. ב:
          $T_1' = 3.0\cdot4.0 = 12\,\text{N}$, $T_2' = 5.0\cdot4.0 = 20\,\text{N}$.
      - kind: result
        text: >-
          א. $4.0\,\text{m/s}^2$; $4.0\,\text{N}$ ו-$12\,\text{N}$. ב. $20\,\text{N}$ ליד הגוש הקל ו-$12\,\text{N}$ ליד הכבד. מי שמושכים מקדימה צריך
          חוטים חזקים יותר מאחוריו.

  - id: W-2.3-07
    level: mid
    objectives: [OBJ-2.3-1]
    prompt: >-
      מכונית בעלת מסה $1200\,\text{kg}$ עוברת במהירות $20\,\text{m/s}$ בתחתית של שקע בכביש. ליד התחתית הכביש הוא
      קשת של מעגל אנכי ברדיוס $50\,\text{m}$. מה הכוח הנורמלי של הכביש על המכונית, ופי כמה הוא גדול מהכובד שלה?
    answer: >-
      $N = 2.14\cdot10^{4}\,\text{N}$, פי $1.82$ מהכובד.
    solution:
      - kind: given
        text: >-
          הגוף הוא המכונית. בתחתית מרכז המעגל **מעליה**, ולכן התאוצה שלה $v^2/R$ כלפי מעלה. ציר חיובי כלפי מעלה.
          הכוחות: הכובד $mg$ כלפי מטה (כדור הארץ) ו-$N$ כלפי מעלה (הכביש).
      - kind: law
        text: >-
          החוק השני באנך: $N - mg = \dfrac{mv^2}{R}$.
      - kind: manipulation
        text: >-
          $N = m\left(g + \dfrac{v^2}{R}\right)$, ו-$\dfrac{N}{mg} = 1 + \dfrac{v^2}{gR}$.
      - kind: limit
        text: >-
          כש-$v \to 0$ או $R \to \infty$, $N \to mg$, מכונית עומדת או כביש ישר. בניגוד לפסגה של גבעה, אין כאן מהירות
          שבה המכונית מתנתקת: $N$ רק גדל עם $v$.
      - kind: units
        text: >-
          $v^2/R$ ב-$\text{m/s}^2$, כמו $g$.
      - kind: substitution
        text: >-
          $v^2/R = 400/50 = 8.0\,\text{m/s}^2$. $N = 1200\cdot(9.8 + 8.0) = 2.14\cdot10^{4}\,\text{N}$, ו-$N/mg = 17.8/9.8 = 1.82$.
      - kind: result
        text: >-
          $N = 2.14\cdot10^{4}\,\text{N}$, פי $1.82$ מהכובד. הנוסעים מרגישים כבדים, כמו במעלית שמאיצה כלפי מעלה.

  - id: W-2.3-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.3-1, OBJ-2.3-2]
    prompt: >-
      מרימים דלי בעל מסה $M$ מבאר בחבל אחיד בעל מסה $m$ ואורך $L$. כשהדלי עולה, היד שבראש החבל מאטה פתאום את
      העלייה, בתאוצה שגודלה $b$ כלפי מטה.

      א. מצאו את המתיחות כפונקציה של העומק $y$ מתחת ליד, כל עוד החבל מתוח.

      ב. מה קורה כש-$b > g$? האם החבל נעשה רפוי קודם ליד היד, קודם ליד הדלי, או בכל מקום יחד?
    answer: >-
      א. $T(y) = \left[M + \tfrac{m}{L}(L - y)\right]\left(g - b\right)$. ב. כש-$b > g$ החבל נעשה רפוי בכל מקום יחד, והדלי
      והחבל ממשיכים לעלות ומאטים ב-$g$.
    solution:
      - kind: given
        text: >-
          ציר חיובי כלפי מעלה. התאוצה של הדלי והחבל, כל עוד החבל מתוח, היא $-b$. $\lambda = m/L$.
      - kind: law
        text: >-
          החוק השני לגוף שמתחת לחתך בעומק $y$: הדלי וחלק החבל שמתחת, מסה $M + \lambda(L - y)$, עם המתיחות כלפי מעלה
          והכובד שלו כלפי מטה.
      - kind: manipulation
        text: >-
          $T(y) - \left[M + \lambda(L - y)\right]g = -\left[M + \lambda(L - y)\right]b$, ולכן
          $T(y) = \left[M + \lambda(L - y)\right]\left(g - b\right)$.
      - kind: reasoning
        text: >-
          לכל הנקודות יש אותו גורם, $g - b$. כש-$b > g$ הנוסחה נותנת מתיחות שלילית **בכל** נקודה, אבל חבל לא יכול לדחוף.
          לכן ההנחה שהחבל מתוח נשברת בבת אחת לאורך כולו: היד מאטה מהר יותר ממה שהכובד מאט את הדלי, והחבל מתרופף. הדלי
          והחבל נעים אז בזריקה אנכית, בתאוצה $-g$.
      - kind: limit
        text: >-
          כש-$b = 0$ חוזרים לחבל שעולה במהירות קבועה, $T = [M + \lambda(L - y)]g$. כש-$b = g$ המתיחות אפס בכל מקום: היד
          והדלי מאטים בדיוק כמו גופים בזריקה, ואין צורך במשיכה.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: result
        text: >-
          א. $T(y) = \left[M + \lambda(L - y)\right](g - b)$. ב. בכל מקום יחד, כי כל נקודה מחזיקה את מה שמתחתיה באותו
          גורם $g - b$.

  - id: W-2.3-09
    level: bagrut
    objectives: [OBJ-2.3-2]
    prompt: >-
      חבל אחיד בעל מסה $0.60\,\text{kg}$ ואורך $1.2\,\text{m}$ תלוי על יתד חלקה וקטנה: $0.80\,\text{m}$ מהחבל בצד אחד
      ו-$0.40\,\text{m}$ בצד השני. משחררים אותו ממנוחה. היתד חלקה, ולכן היא רק מסובבת את כיוון החבל, כמו גלגלת חסרת
      חיכוך.

      א. מה התאוצה של החבל ברגע השחרור?

      ב. מה המתיחות בחבל בנקודה שעל היתד באותו רגע? השוו לכובד של כל צד.
    answer: >-
      א. $3.27\,\text{m/s}^2$ (הצד הארוך יורד). ב. $2.61\,\text{N}$, בין $1.96\,\text{N}$ ל-$3.92\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $\lambda = 0.60/1.2 = 0.50\,\text{kg/m}$. אורכי הצדדים $x = 0.80\,\text{m}$ ו-$L - x = 0.40\,\text{m}$. לכל צד ציר
          משלו בכיוון התנועה שלו: הצד הארוך יורד והקצר עולה, באותה תאוצה $a$, כי החבל לא מתארך.
      - kind: law
        text: >-
          החוק השני לכל צד, כגוף שהמתיחות על היתד, $T$, מושכת אותו כלפי מעלה (היתד חלקה: אותה $T$ משני צדיה):
          $\lambda xg - T = \lambda xa$ ו-$T - \lambda(L - x)g = \lambda(L - x)a$.
      - kind: manipulation
        text: >-
          מחברים: $\lambda g\left(2x - L\right) = \lambda La$, ולכן $a = g\,\dfrac{2x - L}{L}$. מציבים בשנייה:
          $T = \lambda(L - x)(g + a) = \dfrac{2mg\,x(L - x)}{L^2}$.
      - kind: limit
        text: >-
          כש-$x = L/2$, $a = 0$ ו-$T = mg/2$: החבל מאוזן, וכל צד תלוי על היתד. כש-$x \to L$, $a \to g$ ו-$T \to 0$: כל החבל
          נופל חופשית.
      - kind: units
        text: >-
          $g\,(2x - L)/L$ ב-$\text{m/s}^2$; $mg\,x(L - x)/L^2$ בניוטון.
      - kind: substitution
        text: >-
          $a = 9.8\cdot0.40/1.2 = 3.27\,\text{m/s}^2$. $T = 2\cdot0.60\cdot9.8\cdot0.80\cdot0.40/1.44 = 2.61\,\text{N}$. הכובד של הצד
          הארוך $0.40\cdot9.8 = 3.92\,\text{N}$, ושל הקצר $1.96\,\text{N}$.
      - kind: result
        text: >-
          א. $3.27\,\text{m/s}^2$. ב. $2.61\,\text{N}$, בין הכובד של הצד הקצר לכובד של הצד הארוך, כמו במכונת אטווד. לאורך כל
          צד המתיחות יורדת מ-$2.61\,\text{N}$ ליד היתד לאפס בקצה החופשי.

  - id: W-2.3-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.3-1, OBJ-2.3-2]
    prompt: >-
      קפיץ רך ואחיד, בעל מסה $m$ (סלינקי), תלוי מהיד ונח, בלי משקולת.

      א. מה המתיחות בקפיץ בראשו, ומה המתיחות בחתיכה הקטנה שבקצה התחתון?

      ב. היד משחררת את הקפיץ. ברגע שאחרי השחרור, הצורה של הקפיץ עוד לא הספיקה להשתנות, ולכן ההתארכות של כל
      חתיכה, וגם המתיחות בה, עדיין כמו קודם, חוץ מהראש, שכבר לא מוחזק. מה התאוצה של החתיכה התחתונה באותו רגע, ומה
      התאוצה של החתיכה העליונה?
    answer: >-
      א. בראש $mg$, ובתחתית כמעט אפס. ב. החתיכה התחתונה לא מאיצה ($a = 0$); החתיכה העליונה מאיצה כלפי מטה הרבה יותר
      מ-$g$.
    solution:
      - kind: law
        text: >-
          כל נקודה בקפיץ כבד שנח מחזיקה את מה שמתחתיה: $T(\ell) = \dfrac{m\ell}{L}\,g$, עם $\ell$ המרחק מהקצה התחתון,
          נמדד לאורך הקפיץ הרפוי. החוק השני לחתיכה קטנה: הכוח השקול עליה הוא הפרש המתיחויות בקצותיה ועוד הכובד שלה.
      - kind: reasoning
        text: >-
          א. בראש $T = mg$; בחתיכה התחתונה, באורך $\Delta\ell$, המתיחות מלמעלה היא $mg\,\Delta\ell/L$, בדיוק הכובד שלה.
          ב. ברגע שאחרי השחרור, על החתיכה התחתונה פועלים אותם שני כוחות: הכובד שלה, ומלמעלה המתיחות שלא השתנתה,
          כי ההתארכות של החתיכה שמעליה עוד לא השתנתה. הם עדיין מתאזנים, ולכן התאוצה שלה אפס. על החתיכה העליונה
          פועלים עכשיו כלפי מטה הכובד שלה **וגם** המתיחות $mg$ של כל הקפיץ שמתחתיה, ואין מי שמושך אותה למעלה, ולכן התאוצה
          שלה בערך $mg/\left(m\,\Delta\ell/L\right)$, הרבה יותר מ-$g$.
      - kind: limit
        text: >-
          לחבל בלי מסה, $m \to 0$, אין מתיחות בכלל כשהוא תלוי בלי משקולת, ואין מה "לשחרר": השאלה מעניינת רק לקפיץ שהמסה
          שלו מותחת אותו. וכשהשינוי במתיחות מגיע סוף סוף אל הקצה התחתון, הוא מתחיל לנוע.
      - kind: units
        text: >-
          $mg$ בניוטון; $mg$ חלקי מסה ב-$\text{m/s}^2$.
      - kind: result
        text: >-
          א. $mg$ בראש, כמעט אפס בתחתית. ב. החתיכה התחתונה לא מאיצה; העליונה מאיצה כלפי מטה הרבה יותר מ-$g$. הקפיץ מתקפל
          מלמעלה, והתחתית נשארת תלויה באוויר עד שהשינוי מגיע אליה.

challenge:
  - id: W-2.3-c1
    stars: 1
    objectives: [OBJ-2.3-2]
    prompt: >-
      חבל בעל מסה $M$ ואורך $L$ תלוי מנקודה קבועה ונח. הצפיפות הקווית שלו משתנה עם המרחק $z$ מתחת לנקודת התלייה:
      $\lambda(z) = \lambda_0\sin\left(\pi z/L\right)$, כאשר $\lambda_0$ קבוע.

      א. מצאו את $\lambda_0$.

      ב. מה המתיחות בקצה התחתון, החופשי?

      ג. מצאו את המתיחות כפונקציה של $z$, והציבו $M = 2.0\,\text{kg}$, $L = 4.0\,\text{m}$ ב-$z = 0$, $z = L/3$ ו-$z = L/2$.
    answer: >-
      א. $\lambda_0 = \dfrac{\pi M}{2L}$. ב. אפס. ג. $T(z) = \dfrac{Mg}{2}\left(1 + \cos\dfrac{\pi z}{L}\right)$: $19.6\,\text{N}$,
      $14.7\,\text{N}$, $9.80\,\text{N}$.
    solution:
      - kind: given
        text: >-
          ציר $z$ כלפי מטה מנקודת התלייה. $\lambda(z) = \lambda_0\sin(\pi z/L)$, והחבל נח.
      - kind: law
        text: >-
          המסה היא האינטגרל של הצפיפות, $M = \int_0^L\lambda\,dz$. המתיחות ב-$z$ מחזיקה את החלק שמתחת:
          $T(z) = g\int_z^L\lambda(z')\,dz'$.
      - kind: manipulation
        text: >-
          $\int_0^L\lambda_0\sin(\pi z/L)\,dz = \dfrac{2L\lambda_0}{\pi} = M$. ובאותו אופן,
          $\int_z^L\lambda_0\sin(\pi z'/L)\,dz' = \dfrac{L\lambda_0}{\pi}\left(1 + \cos\dfrac{\pi z}{L}\right)$.
      - kind: limit
        text: >-
          ב-$z = 0$ התוצאה $Mg$, כל החבל תלוי בנקודה. ב-$z = L$ היא אפס, כמו בכל קצה חופשי. ב-$z = L/2$ היא $Mg/2$, כי
          הצפיפות סימטרית סביב האמצע.
      - kind: units
        text: >-
          $\lambda_0$ ב-$\text{kg/m}$; $Mg$ בניוטון.
      - kind: substitution
        text: >-
          $\lambda_0 = \pi\cdot2.0/8.0 = 0.785\,\text{kg/m}$. $T(0) = 19.6\,\text{N}$, $T(L/3) = 9.80\cdot1.5 = 14.7\,\text{N}$,
          $T(L/2) = 9.80\,\text{N}$.
      - kind: result
        text: >-
          א. $\pi M/(2L)$. ב. אפס. ג. $T(z) = \tfrac12Mg\left(1 + \cos(\pi z/L)\right)$; $19.6$, $14.7$ ו-$9.80\,\text{N}$.
    source:
      name: MIT 8.012 Physics I, Exam 1 (solutions)
      year: 2008
      problem: 'Problem 3: Hanging Rope'
      url: https://www.ocw.mit.edu/courses/8-012-physics-i-classical-mechanics-fall-2008/4592a0f28149124e7a6eee75ee76d934_exam1sol.pdf
      verified: '2026-11-09'
      adapted: true

  - id: W-2.3-c2
    stars: 2
    objectives: [OBJ-2.3-2]
    prompt: >-
      קצה אחד של חבל אחיד, בעל מסה $m_1$ ואורך $l$, קשור לציר דק שמסתובב במהירות זוויתית קבועה $\omega$, ובקצה השני
      קשור גוף נקודתי בעל מסה $m_2$. הכול מסתובב במישור אופקי, והחבל ישר ומתוח לאורך רדיוס. התעלמו מהכובד (הסיבוב
      מהיר מספיק כדי שהחבל כמעט אופקי).

      א. מצאו את המתיחות $T(r)$ כפונקציה של המרחק $r$ מהציר.

      ב. הציבו $m_1 = 0.40\,\text{kg}$, $m_2 = 0.20\,\text{kg}$, $l = 1.5\,\text{m}$ ו-$\omega = 3.0\,\text{rad/s}$, וחשבו את
      המתיחות ליד הציר, באמצע החבל ובקצה.
    answer: >-
      א. $T(r) = m_2\omega^2l + \dfrac{m_1\omega^2}{2l}\left(l^2 - r^2\right)$. ב. $5.40\,\text{N}$, $4.73\,\text{N}$, $2.70\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $r$ נמדד מהציר החוצה. $\lambda = m_1/l$. כל נקודה בחבל נעה במעגל אחיד ברדיוס $r$, ולכן התאוצה שלה $\omega^2r$
          אל הציר (שיעור 1.3).
      - kind: law
        text: >-
          החוק השני בכיוון הרדיאלי, חיובי אל הציר, לקטע בין $r$ ל-$r + dr$: הצד הפנימי מושך אותו פנימה ב-$T(r)$, והצד
          החיצוני החוצה ב-$T(r + dr)$:
          $T(r) - T(r + dr) = \lambda\,dr\,\omega^2r$, כלומר $\dfrac{dT}{dr} = -\lambda\omega^2r$.
      - kind: manipulation
        text: >-
          תנאי השפה בקצה: החבל הוא הכוח היחיד על הגוף $m_2$, ולכן $T(l) = m_2\omega^2l$. מבצעים אינטגרל מ-$r$ עד $l$:
          $T(r) = T(l) + \lambda\omega^2\dfrac{l^2 - r^2}{2}$.
      - kind: limit
        text: >-
          כש-$m_1 \to 0$ המתיחות $m_2\omega^2l$ בכל מקום: חוט חסר מסה. כש-$m_2 = 0$ המתיחות אפס בקצה החופשי, ומקסימלית
          ליד הציר, $\tfrac12m_1\omega^2l$, כמו גוף שכל המסה שלו במרחק $l/2$, מרכז החבל.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{s}^{-2}\cdot\text{m} = \text{N}$.
      - kind: substitution
        text: >-
          $T(l) = 0.20\cdot9.0\cdot1.5 = 2.70\,\text{N}$. ליד הציר: $2.70 + 0.40\cdot9.0\cdot2.25/3.0 = 5.40\,\text{N}$. באמצע,
          $r = 0.75\,\text{m}$: $2.70 + 0.40\cdot9.0\cdot1.6875/3.0 = 4.73\,\text{N}$.
      - kind: result
        text: >-
          א. $T(r) = m_2\omega^2l + \dfrac{m_1\omega^2\left(l^2 - r^2\right)}{2l}$. ב. $5.40$, $4.73$ ו-$2.70\,\text{N}$.
    source:
      name: MIT 8.01SC Classical Mechanics, Problem Set 4
      year: 2016
      problem: '3. Tension in Massive Rotating Rope with Object'
      url: https://www.ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/ff43aae2332b3882ac4a4727301cec56_MIT8_01F16_pset4.pdf
      verified: '2026-11-09'
      adapted: true

lesson: '2.2'
practice:
  - id: W-2.2-01
    level: basic
    qualitative: true
    objectives: [OBJ-2.2-1]
    prompt: >-
      מגנט בעל מסה $0.20\,\text{kg}$ ומסמר ברזל בעל מסה $0.010\,\text{kg}$ מונחים על שולחן חלק, במרחק קטן זה מזה, ומשוחררים
      ממנוחה. ברגע מסוים המגנט מושך את המסמר בכוח $0.050\,\text{N}$.

      א. באיזה כוח המסמר מושך את המגנט באותו רגע?

      ב. מה התאוצה של כל אחד מהם, ומי מאיץ יותר?
    answer: >-
      א. $0.050\,\text{N}$, אל המסמר.

      ב. המגנט $0.25\,\text{m/s}^2$, המסמר $5.0\,\text{m/s}^2$: המסמר מאיץ פי 20.
    solution:
      - kind: law
        text: >-
          נסמן את המגנט 1 ואת המסמר 2. החוק השלישי: $\vec F_{12} = -\vec F_{21}$ בכל רגע. החוק השני לכל גוף בנפרד: $a = F/m$. השולחן חלק,
          והכובד והנורמלי מתאזנים, ולכן הכוח האופקי היחיד על כל גוף הוא המשיכה המגנטית.
      - kind: reasoning
        text: >-
          המשיכה של המגנט על המסמר והמשיכה של המסמר על המגנט הן שני הכוחות של אותה פעולה. הם שווים בגודלם, ולא משנה שהמגנט "הוא
          המגנט" ושהמסה שלו גדולה. מה שתלוי במסה הוא התאוצה.
      - kind: limit
        text: >-
          אם המגנט היה מוצמד לשולחן (כאילו מסה אינסופית), רק המסמר היה זז, והמשיכה של המסמר הייתה עוברת דרך המגנט אל השולחן.
      - kind: units
        text: >-
          $\text{N}/\text{kg} = \text{m/s}^2$.
      - kind: substitution
        text: >-
          המגנט: $a_1 = 0.050/0.20 = 0.25\,\text{m/s}^2$; המסמר: $a_2 = 0.050/0.010 = 5.0\,\text{m/s}^2$.
      - kind: result
        text: >-
          א. $0.050\,\text{N}$. ב. $0.25\,\text{m/s}^2$ ו-$5.0\,\text{m/s}^2$; המסמר מאיץ פי 20 מהמגנט, באותו כוח.

  - id: W-2.2-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.2-1]
    prompt: >-
      ילד בעל מסה $40\,\text{kg}$ דוחף ארגז בעל מסה $20\,\text{kg}$ בכוח אופקי $60\,\text{N}$. הארגז מחליק על רצפה חלקה, והנעליים
      של הילד נאחזות ברצפה, כך שהוא נע יחד עם הארגז.

      א. שרטטו תרשים כוחות לארגז ולילד, וסמנו ליד כל חץ את הגוף שמפעיל אותו. חברו בקו כל זוג של החוק השלישי שיש לו חצי בשני
      התרשימים.

      ב. איזה כוח מאיץ את הילד קדימה, ומה גודלו?
    answer: >-
      א. ארגז: כובד, נורמלי מהרצפה, הדחיפה של הילד קדימה. ילד: כובד, נורמלי מהרצפה, הארגז דוחף אותו אחורה, והרצפה דוחפת את
      הנעליים קדימה (חיכוך). הזוג המשותף: הילד על הארגז והארגז על הילד.

      ב. החיכוך של הרצפה על הנעליים, $180\,\text{N}$.
    solution:
      - kind: given
        text: >-
          ילד $M = 40\,\text{kg}$, ארגז $m = 20\,\text{kg}$, דחיפה $P = 60\,\text{N}$. קדימה חיובי. שניהם נעים יחד, באותה תאוצה $a$.
      - kind: reasoning
        text: >-
          על הארגז: $mg$ (כדור הארץ), $N$ (הרצפה), $P$ קדימה (הילד). על הילד: $Mg$ (כדור הארץ), $N'$ (הרצפה), $P$ אחורה (הארגז,
          הזוג של הדחיפה), וחיכוך $f$ קדימה (הרצפה). אין חיכוך על הארגז: הרצפה חלקה שם. הזוגות האחרים חוצים את המערכת: כל כובד
          והזוג שלו על כדור הארץ, כל נורמלי וחיכוך והזוג שלהם על הרצפה.
      - kind: law
        text: >-
          ארגז: $P = ma$. ילד: $f - P = Ma$.
      - kind: manipulation
        text: >-
          $a = P/m$, ו-$f = P + Ma = P\,(1 + M/m)$.
      - kind: limit
        text: >-
          כש-$M \to 0$ (ילד קל מאוד) $f \to P$: הרצפה צריכה רק לאזן את הארגז שדוחף אחורה. אילו הרצפה הייתה חלקה גם מתחת לילד, $f = 0$,
          והילד היה נדחף אחורה בתאוצה $P/M$ בזמן שהארגז נדחף קדימה.
      - kind: units
        text: >-
          $P(1 + M/m)$ בניוטונים.
      - kind: substitution
        text: >-
          $a = 60/20 = 3.0\,\text{m/s}^2$; $f = 60 + 40\cdot3.0 = 180\,\text{N}$.
      - kind: result
        text: >-
          הרצפה דוחפת את הילד קדימה ב-$180\,\text{N}$; ממנה מגיעה התאוצה של כל המערכת.

  - id: W-2.2-03
    level: basic
    objectives: [OBJ-2.2-2]
    prompt: >-
      שלושה גושים צמודים בשורה על רצפה חלקה: $2.0\,\text{kg}$, $3.0\,\text{kg}$ ו-$5.0\,\text{kg}$, משמאל לימין. דוחפים את הגוש
      השמאלי ימינה בכוח $20\,\text{N}$. מצאו את התאוצה ואת שני כוחות המגע.
    answer: >-
      $a = 2.0\,\text{m/s}^2$; בין הראשון לשני $16\,\text{N}$, בין השני לשלישי $10\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $m_1 = 2.0$, $m_2 = 3.0$, $m_3 = 5.0\,\text{kg}$, $F = 20\,\text{N}$ על $m_1$. ימינה חיובי. $P$ בין 1 ל-2, $Q$ בין 2 ל-3.
      - kind: law
        text: >-
          לכל גוש: $m_1:\ F - P = m_1a$; $m_2:\ P - Q = m_2a$; $m_3:\ Q = m_3a$; אותה $a$ לכולם.
      - kind: manipulation
        text: >-
          חיבור שלוש המשוואות: $F = (m_1 + m_2 + m_3)\,a$. אחר כך מהגוש האחרון אחורה: $Q = m_3a$, $P = (m_2 + m_3)\,a$.
      - kind: limit
        text: >-
          כש-$m_3 \to 0$, $Q \to 0$. ו-$P < F$ תמיד, כי חלק מ-$F$ מאיץ את $m_1$ עצמו.
      - kind: units
        text: >-
          מסה כפול תאוצה: $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          $a = 20/10 = 2.0\,\text{m/s}^2$; $Q = 5.0\cdot2.0 = 10\,\text{N}$; $P = 8.0\cdot2.0 = 16\,\text{N}$.
      - kind: result
        text: >-
          $a = 2.0\,\text{m/s}^2$, $P = 16\,\text{N}$, $Q = 10\,\text{N}$.

  - id: W-2.2-04
    level: mid
    objectives: [OBJ-2.2-2]
    prompt: >-
      שתי משקולות, $m_1 = 3.0\,\text{kg}$ ו-$m_2 = 5.0\,\text{kg}$, תלויות משני צדי חוט קל שעובר על גלגלת קלה וחסרת חיכוך
      (המכונה של אטווד). משחררים ממנוחה. מצאו את התאוצה ואת המתיחות, והשוו את המתיחות לכובד של כל משקולת.
    answer: >-
      $a = 2.45\,\text{m/s}^2$, $T = 36.8\,\text{N}$, בין $m_1g = 29.4\,\text{N}$ ל-$m_2g = 49\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $m_1 = 3.0\,\text{kg}$, $m_2 = 5.0\,\text{kg}$. $m_2$ הכבדה יורדת: ל-$m_2$ ציר חיובי כלפי מטה, ל-$m_1$ כלפי מעלה. החוט מתוח,
          ולכן אותה תאוצה $a$.
      - kind: law
        text: >-
          $m_1:\ T - m_1g = m_1a$. $m_2:\ m_2g - T = m_2a$. אותה $T$ בשני הקצוות, כי החוט קל והגלגלת קלה וחסרת חיכוך.
      - kind: manipulation
        text: >-
          חיבור: $(m_2 - m_1)\,g = (m_1 + m_2)\,a$. הצבה חזרה: $T = m_1(g + a) = \dfrac{2m_1m_2}{m_1 + m_2}\,g$.
      - kind: limit
        text: >-
          כש-$m_1 = m_2$: $a = 0$ ו-$T = mg$. כש-$m_1 \to 0$: $a \to g$ ו-$T \to 0$, נפילה חופשית.
      - kind: units
        text: >-
          יחס מסות כפול $g$ ב-$\text{m/s}^2$; $T$ בניוטונים.
      - kind: substitution
        text: >-
          $a = 2.0\cdot9.8/8.0 = 2.45\,\text{m/s}^2$; $T = 3.0\,(9.8 + 2.45) = 36.8\,\text{N}$.
      - kind: result
        text: >-
          $a = 2.45\,\text{m/s}^2$, $T = 36.8\,\text{N}$: גדולה מ-$m_1g$ (הקלה מאיצה כלפי מעלה), קטנה מ-$m_2g$ (הכבדה מאיצה כלפי מטה).

  - id: W-2.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-1]
    prompt: >-
      אדם בעל מסה $60\,\text{kg}$ עומד על משקל אמבטיה במעלית שמאיצה כלפי מטה, $1.5\,\text{m/s}^2$.

      א. שרטטו תרשים כוחות לאדם ותרשים כוחות למשקל. מצאו את כל זוגות החוק השלישי, וקבעו ונמקו: האם הכוח הנורמלי על האדם הוא הזוג
      של הכובד שלו?

      ב. המשקל מראה את הכוח שהאדם לוחץ בו עליו (מחולק ב-$g$). מה הוא מראה?
    answer: >-
      א. לא. הזוג של הכובד הוא משיכת האדם את כדור הארץ; הזוג של הנורמלי הוא לחיצת האדם על המשקל.

      ב. $498\,\text{N}$, כלומר $50.8\,\text{kg}$.
    solution:
      - kind: given
        text: >-
          $m = 60\,\text{kg}$, התאוצה $1.5\,\text{m/s}^2$ כלפי מטה. ציר חיובי כלפי מטה.
      - kind: reasoning
        text: >-
          על האדם: $mg$ (כדור הארץ) ו-$N$ (המשקל, כלפי מעלה). על המשקל: הכובד שלו, $N$ כלפי מטה (האדם), והכוח של רצפת המעלית. זוגות:
          (המשקל על האדם, האדם על המשקל), (כדור הארץ על האדם, האדם על כדור הארץ), (הרצפה על המשקל, המשקל על הרצפה), (כדור הארץ על
          המשקל, המשקל על כדור הארץ). $N$ ו-$mg$ פועלים על אותו גוף, ולכן הם לא זוג, והם גם לא שווים כאן.
      - kind: law
        text: >-
          החוק השני לאדם: $mg - N = ma$. לפי החוק השלישי המשקל מקבל מהאדם את אותו $N$.
      - kind: limit
        text: >-
          כש-$a = 0$, $N = mg$: המשקל מראה $60\,\text{kg}$. כש-$a = g$ (נפילה חופשית), $N = 0$: המשקל מראה אפס.
      - kind: units
        text: >-
          $m(g - a)$ בניוטונים; חלוקה ב-$g$ נותנת קילוגרמים.
      - kind: substitution
        text: >-
          $N = 60\,(9.8 - 1.5) = 498\,\text{N}$; $498/9.8 = 50.8\,\text{kg}$.
      - kind: result
        text: >-
          א. לא. ב. $498\,\text{N}$, והמשקל מראה $50.8\,\text{kg}$.

  - id: W-2.2-06
    level: mid
    objectives: [OBJ-2.2-2]
    prompt: >-
      מכונית בעלת מסה $1200\,\text{kg}$ גוררת נגרר בעל מסה $400\,\text{kg}$ על כביש ישר ואופקי, ומאיצה ב-$1.5\,\text{m/s}^2$. הזניחו
      התנגדות אוויר וחיכוך בגלגלי הנגרר. מה הכוח בווי הגרירה, ומה הכוח האופקי שהכביש מפעיל על הגלגלים המונעים של המכונית?
    answer: >-
      בווי $600\,\text{N}$; הכביש על המכונית $2400\,\text{N}$.
    solution:
      - kind: given
        text: >-
          $M = 1200\,\text{kg}$, $m = 400\,\text{kg}$, $a = 1.5\,\text{m/s}^2$, קדימה חיובי.
      - kind: law
        text: >-
          נגרר: הכוח האופקי היחיד הוא הווי, $T = ma$. מכונית: הכביש קדימה, $F$, והווי אחורה, הזוג של $T$: $F - T = Ma$.
      - kind: manipulation
        text: >-
          $F = (M + m)\,a$: הכוח החיצוני האופקי היחיד על כל המערכת.
      - kind: limit
        text: >-
          כש-$m \to 0$, $T \to 0$ ו-$F \to Ma$, מכונית לבד. כש-$a = 0$, שני הכוחות אפס: בלי התנגדות אין צורך למשוך.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          $T = 400\cdot1.5 = 600\,\text{N}$; $F = 1600\cdot1.5 = 2400\,\text{N}$.
      - kind: result
        text: >-
          $T = 600\,\text{N}$, $F = 2400\,\text{N}$.

  - id: W-2.2-07
    level: mid
    qualitative: true
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      שתי גולשות על משטח קרח חלק עומדות זו מול זו במנוחה, ודוחפות זו את זו. המסות הן $50\,\text{kg}$ ו-$75\,\text{kg}$. במשך
      $0.40\,\text{s}$ כל אחת מפעילה על השנייה כוח קבוע.

      א. "הכבדה דחפה חזק יותר, כי היא כבדה יותר." קבעו ונמקו אם המשפט נכון.

      ב. אם הכוח בין הגולשות הוא $150\,\text{N}$, מה התאוצה של כל אחת, ומה המהירות שלה כשהן נפרדות?
    answer: >-
      א. לא נכון: הכוחות שווים.

      ב. $3.0\,\text{m/s}^2$ ו-$2.0\,\text{m/s}^2$; $1.2\,\text{m/s}$ ו-$0.80\,\text{m/s}$, בכיוונים הפוכים.
    solution:
      - kind: reasoning
        text: >-
          הדחיפה של הראשונה על השנייה והדחיפה של השנייה על הראשונה הן זוג של החוק השלישי: שוות בגודלן בכל רגע, בלי קשר למסות או
          למי "התחילה". בתרשים של כל גולשת יש כוח אופקי אחד, הדחיפה של השנייה.
      - kind: law
        text: >-
          לכל אחת, בכיוון שבו היא נדחפת: $F = m_ia_i$; תאוצה קבועה ממנוחה: $v_i = a_it$.
      - kind: manipulation
        text: >-
          $a_i = F/m_i$, ולכן $a_1/a_2 = m_2/m_1$, וגם $v_1/v_2 = m_2/m_1$.
      - kind: limit
        text: >-
          אם אחת מהן הייתה דוחפת קיר (מסה אינסופית), רק היא הייתה זזה, כמו בגלגיליות מול הקיר בפתיחת השיעור.
      - kind: units
        text: >-
          $\text{N/kg} = \text{m/s}^2$, ו-$\text{m/s}^2\cdot\text{s} = \text{m/s}$.
      - kind: substitution
        text: >-
          $a_1 = 150/50 = 3.0\,\text{m/s}^2$, $a_2 = 150/75 = 2.0\,\text{m/s}^2$; $v_1 = 3.0\cdot0.40 = 1.2\,\text{m/s}$,
          $v_2 = 2.0\cdot0.40 = 0.80\,\text{m/s}$.
      - kind: result
        text: >-
          א. לא: הכוחות שווים, והקלה מאיצה יותר. ב. $3.0$ ו-$2.0\,\text{m/s}^2$; $1.2$ ו-$0.80\,\text{m/s}$.

  - id: W-2.2-08
    level: bagrut
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      גוש B בעל מסה $3.0\,\text{kg}$ על שולחן חלק, ועליו גוש A בעל מסה $1.0\,\text{kg}$. B קשור בחוט קל שעובר על גלגלת קלה בקצה
      השולחן אל משקולת תלויה בעלת מסה $2.0\,\text{kg}$. A לא מחליק על B.

      א. שרטטו תרשים כוחות ל-A, ל-B ולמשקולת.

      ב. מצאו את התאוצה, את המתיחות ואת כוח החיכוך בין A ל-B.

      ג. מה מקדם החיכוך הסטטי הקטן ביותר שמאפשר תנועה כזו?
    answer: >-
      ב. $a = 3.27\,\text{m/s}^2$, $T = 13.1\,\text{N}$, $f = 3.27\,\text{N}$.

      ג. $0.333$.
    solution:
      - kind: given
        text: >-
          $m_A = 1.0$, $m_B = 3.0$, $m = 2.0\,\text{kg}$. ל-A ול-B ציר חיובי לכיוון הגלגלת; למשקולת, כלפי מטה. אותה $a$ לשלושתם.
      - kind: reasoning
        text: >-
          על A: $m_Ag$, $N_1$ (B), חיכוך $f$ לכיוון הגלגלת (B). על B: $m_Bg$, $N_2$ (השולחן), $N_1$ כלפי מטה (A), $f$ אחורה (A), $T$
          (החוט). על המשקולת: $mg$, $T$. הכובד של A לא בתרשים של B.
      - kind: law
        text: >-
          A: $f = m_Aa$. B: $T - f = m_Ba$. המשקולת: $mg - T = ma$. אנכית: $N_1 = m_Ag$.
      - kind: manipulation
        text: >-
          חיבור שלוש המשוואות: $mg = (m_A + m_B + m)\,a$. אחר כך $T = (m_A + m_B)\,a$, $f = m_Aa$, ו-$\mu_{\min} = f/N_1 = a/g$.
      - kind: limit
        text: >-
          כש-$m_A \to 0$ חוזרים לגוש ומשקולת של השיעור, ו-$f \to 0$. ו-$\mu_{\min} = a/g < 1$ תמיד, כי $a < g$.
      - kind: units
        text: >-
          $a$ ב-$\text{m/s}^2$; $T$ ו-$f$ ב-$\text{N}$; $\mu$ חסר ממדים.
      - kind: substitution
        text: >-
          $a = 2.0\cdot9.8/6.0 = 3.27\,\text{m/s}^2$; $T = 4.0\cdot3.27 = 13.1\,\text{N}$; $f = 3.27\,\text{N}$; $\mu_{\min} = 3.27/9.8 = 0.333$.
      - kind: result
        text: >-
          $a = 3.27\,\text{m/s}^2$, $T = 13.1\,\text{N}$, $f = 3.27\,\text{N}$, $\mu_s \ge 0.333$.

  - id: W-2.2-09
    level: bagrut
    objectives: [OBJ-2.2-2]
    prompt: >-
      שני גושים על מדרון חלק בזווית $30^\circ$ מחוברים בחוט קל המקביל למדרון: $m_1 = 2.0\,\text{kg}$ למעלה ו-$m_2 = 3.0\,\text{kg}$ מתחתיו.
      מושכים את $m_1$ במעלה המדרון בכוח $F = 40\,\text{N}$ המקביל למדרון.

      א. מצאו את התאוצה ואת המתיחות בחוט.

      ב. הראו שהמתיחות לא תלויה בזווית המדרון.
    answer: >-
      א. $a = 3.1\,\text{m/s}^2$ במעלה המדרון, $T = 24\,\text{N}$.

      ב. $T = m_2F/(m_1 + m_2)$.
    solution:
      - kind: given
        text: >-
          $m_1 = 2.0$, $m_2 = 3.0\,\text{kg}$, $\theta = 30^\circ$, $F = 40\,\text{N}$. ציר חיובי במעלה המדרון, לשני הגושים.
      - kind: law
        text: >-
          לכל גוש לאורך המדרון: $m_1:\ F - T - m_1g\sin\theta = m_1a$; $m_2:\ T - m_2g\sin\theta = m_2a$. הנורמלי ניצב למדרון ולא נכנס.
      - kind: manipulation
        text: >-
          חיבור: $a = \dfrac{F}{m_1 + m_2} - g\sin\theta$. הצבה במשוואה של $m_2$: $T = m_2(a + g\sin\theta) = \dfrac{m_2}{m_1 + m_2}\,F$.
      - kind: limit
        text: >-
          כש-$\theta = 0$, $a = F/(m_1 + m_2) = 8.0\,\text{m/s}^2$, ו-$T$ זהה: שני הארגזים והחבל של דוגמה 2 בשיעור. כש-$m_2 \to 0$, $T \to 0$.
      - kind: units
        text: >-
          $F/m$ ו-$g\sin\theta$ ב-$\text{m/s}^2$; $T$ ב-$\text{N}$.
      - kind: substitution
        text: >-
          $a = 40/5.0 - 9.8\cdot0.5 = 8.0 - 4.9 = 3.1\,\text{m/s}^2$; $T = 3.0\cdot40/5.0 = 24\,\text{N}$.
      - kind: result
        text: >-
          $a = 3.1\,\text{m/s}^2$, $T = 24\,\text{N}$. רכיב הכובד מאט כל גוש לפי המסה שלו, בדיוק כמו התאוצה, ולכן הוא לא משנה את החלוקה של $F$.

  - id: W-2.2-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      חבל קל עובר על גלגלת קלה וחסרת חיכוך. בצד אחד תלוי צרור בננות בעל מסה $10\,\text{kg}$, ובצד השני קוף בעל מסה $10\,\text{kg}$,
      ובהתחלה הכול במנוחה. הקוף מטפס על החבל, כך שהוא מאיץ כלפי מעלה ב-$1.0\,\text{m/s}^2$ ביחס לקרקע.

      א. שרטטו תרשים כוחות לקוף ולבננות. מי מפעיל על הקוף את הכוח שמאיץ אותו כלפי מעלה?

      ב. מה המתיחות בחבל, ומה התאוצה של הבננות? האם הקוף יכול להתקרב לבננות?
    answer: >-
      א. החבל, שהקוף מושך כלפי מטה.

      ב. $T = 108\,\text{N}$; הבננות עולות ב-$1.0\,\text{m/s}^2$, כמו הקוף, והמרחק ביניהם לא משתנה.
    solution:
      - kind: given
        text: >-
          $m = 10\,\text{kg}$ לקוף (1) ולבננות (2). ציר חיובי כלפי מעלה לשניהם. $a_1 = 1.0\,\text{m/s}^2$.
      - kind: reasoning
        text: >-
          על הקוף: $mg$ (כדור הארץ) ו-$T$ כלפי מעלה (החבל). הקוף מושך את החבל כלפי מטה בידיים, והחבל, לפי החוק השלישי, מושך אותו
          כלפי מעלה. על הבננות: $mg$ ו-$T$ כלפי מעלה (החבל). החבל קל, ולכן המתיחות שווה בשני הצדדים.
      - kind: law
        text: >-
          קוף: $T - mg = ma_1$. בננות: $T - mg = ma_2$.
      - kind: manipulation
        text: >-
          לשני הגופים אותה משוואה, עם אותם $m$ ו-$T$, ולכן $a_2 = a_1$: הם עולים יחד, וכל אחד מהם נשאר באותו גובה
          ביחס לשני.
      - kind: limit
        text: >-
          כשהקוף לא מטפס, $T = mg$, ושניהם במנוחה. אם הבננות היו כבדות יותר, למשל $12\,\text{kg}$, והקוף היה מטפס כמו קודם,
          המתיחות הייתה נשארת $108\,\text{N}$, פחות מהכובד של הבננות, $118\,\text{N}$: הן היו **יורדות**, בתאוצה
          $(108 - 117.6)/12 = -0.80\,\text{m/s}^2$, בזמן שהקוף עולה. התאוצה של הקוף ביחס לבננות הייתה
          $1.0 - (-0.80) = 1.8\,\text{m/s}^2$, והמרחק האנכי ביניהם היה הולך וקטן. רק במסות שוות הוא נשאר קבוע.
      - kind: units
        text: >-
          $m(g + a)$ בניוטונים.
      - kind: substitution
        text: >-
          $T = 10\,(9.8 + 1.0) = 108\,\text{N}$; $a_2 = (108 - 98)/10 = 1.0\,\text{m/s}^2$.
      - kind: result
        text: >-
          החבל מאיץ את הקוף; $T = 108\,\text{N}$; הבננות עולות ב-$1.0\,\text{m/s}^2$, והקוף לא מתקרב אליהן.

challenge:
  - id: W-2.2-c1
    stars: 1
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      טריז בעל מסה $M = 5.0\,\text{kg}$ וזווית $\theta = 30^\circ$ מונח על רצפה חלקה, והצד האנכי שלו צמוד לקיר. ארגז בעל מסה
      $m = 2.0\,\text{kg}$ מחליק במורד הפאה המשופעת, הרחק מהקיר. אין חיכוך בשום מקום.

      א. מה גודל הכוח השקול על הארגז?

      ב. באיזה כוח הקיר דוחף את הטריז? ובאיזה כוח הרצפה דוחפת אותו?
    answer: >-
      א. $mg\sin\theta = 9.8\,\text{N}$.

      ב. הקיר: $mg\sin\theta\cos\theta = 8.49\,\text{N}$. הרצפה: $Mg + mg\cos^2\theta = 63.7\,\text{N}$.
    solution:
      - kind: given
        text: >-
          לארגז צירים לאורך הפאה וניצב לה; לטריז, אופקי ואנכי. הטריז לא זז: הקיר מונע ממנו לזוז אופקית, והרצפה אנכית.
      - kind: law
        text: >-
          על הארגז: $mg$ ו-$N$ מהטריז, ניצב לפאה. בניצב לפאה הארגז לא מאיץ: $N = mg\cos\theta$. לאורך הפאה: $mg\sin\theta = ma$.
      - kind: reasoning
        text: >-
          על הטריז: $Mg$, הזוג של $N$ (הארגז לוחץ על הפאה, ניצב לה, אל תוך הטריז), הקיר (אופקי) והרצפה (אנכי). הרכיב האופקי של לחיצת
          הארגז, $N\sin\theta$, דוחף את הטריז אל הקיר, והקיר מאזן אותו. הרכיב האנכי, $N\cos\theta$, מתווסף לכובד של הטריז.
      - kind: manipulation
        text: >-
          השקול על הארגז: $mg\sin\theta$. קיר: $N\sin\theta = mg\sin\theta\cos\theta$. רצפה: $Mg + N\cos\theta = Mg + mg\cos^2\theta$.
      - kind: limit
        text: >-
          כש-$\theta \to 0$ הארגז שוכב על משטח אופקי: הקיר לא נדרש, והרצפה נושאת $(M + m)\,g$. כש-$\theta \to 90^\circ$ הפאה המשופעת נעשית
          אנכית, והארגז נופל חופשית לאורכה, בלי ללחוץ עליה: $N \to 0$, ולכן גם אז הקיר לא נדרש, והרצפה נושאת רק $Mg$. הרצפה נושאת פחות מ-$(M + m)\,g$ כי הארגז מאיץ כלפי מטה.
      - kind: units
        text: >-
          כל הכוחות הם מסה כפול $g$ כפול פונקציה חסרת ממדים של $\theta$: ניוטונים.
      - kind: substitution
        text: >-
          $\Sigma F = 2.0\cdot9.8\cdot0.5 = 9.8\,\text{N}$; $N = 17.0\,\text{N}$; הקיר $17.0\cdot0.5 = 8.49\,\text{N}$; הרצפה $49 + 14.7 = 63.7\,\text{N}$.
      - kind: result
        text: >-
          א. $9.8\,\text{N}$ במורד הפאה. ב. הקיר $8.49\,\text{N}$, הרצפה $63.7\,\text{N}$.
    source:
      name: MIT 8.01 Classical Mechanics (Fall 2016), Problem Set 2
      year: 2016
      problem: 'Problem 3: A wedge against a wall'
      url: https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/1ebafbf9c9cca8e1ab191ad5ad9026e0_MIT8_01F16_pset2.pdf
      verified: '2026-11-09'
      adapted: true

  - id: W-2.2-c2
    stars: 2
    objectives: [OBJ-2.2-1, OBJ-2.2-2]
    prompt: >-
      גוש עץ בצורת משולש ישר זווית, בעל מסה $M = 2.0\,\text{kg}$, מונח על שולחן, הזווית הישרה שלו למעלה. שתי הפאות העליונות שלו
      נוטות בזוויות $\alpha = 30^\circ$ ו-$\beta = 60^\circ$ לאופק. על כל פאה מחליקה קובייה בעלת מסה $m = 0.50\,\text{kg}$, וכל
      המשטחים חלקים. נתון שהגוש המשולש לא זז.

      א. מה הכוח הנורמלי שהשולחן מפעיל על הגוש בזמן ששתי הקוביות מחליקות? השוו לכובד הכולל של המערכת.

      ב. הראו שהכוח האופקי הכולל שהקוביות מפעילות על הגוש הוא אפס, ולכן הגוש באמת לא זז גם על שולחן חלק.
    answer: >-
      א. $(M + m)\,g = 24.5\,\text{N}$, פחות מ-$(M + 2m)\,g = 29.4\,\text{N}$.

      ב. כל קובייה דוחפת אופקית ב-$mg\sin\alpha\cos\alpha = mg\sin\beta\cos\beta = 2.12\,\text{N}$, בכיוונים הפוכים.
    solution:
      - kind: given
        text: >-
          $\alpha + \beta = 90^\circ$. לכל קובייה ציר ניצב לפאה שלה; לגוש, אופקי ואנכי.
      - kind: law
        text: >-
          כל קובייה לא מאיצה בניצב לפאה, ולכן $N_\alpha = mg\cos\alpha$ ו-$N_\beta = mg\cos\beta$. לפי החוק השלישי כל קובייה לוחצת על
          הגוש באותו כוח, ניצב לפאה, אל תוך הגוש.
      - kind: manipulation
        text: >-
          הרכיבים האנכיים על הגוש: $N_\alpha\cos\alpha + N_\beta\cos\beta = mg(\cos^2\alpha + \cos^2\beta) = mg$, כי $\cos\beta = \sin\alpha$.
          לכן השולחן דוחף ב-$Mg + mg$. הרכיבים האופקיים: $N_\alpha\sin\alpha = mg\sin\alpha\cos\alpha$ לכיוון אחד ו-$mg\sin\beta\cos\beta$
          לכיוון ההפוך, והם שווים כי $\sin\beta\cos\beta = \cos\alpha\sin\alpha$.
      - kind: reasoning
        text: >-
          השולחן דוחף פחות מהכובד הכולל, כי הקוביות מאיצות במורד הפאות, ולשתיהן יחד יש תאוצה כלפי מטה: $\Sigma F_{\text{ext}} = \Sigma m\vec a$
          לכל המערכת נותן $(M + 2m)\,g - N_t = m\,g(\sin^2\alpha + \sin^2\beta) = mg$, כש-$N_t$ הוא הכוח של השולחן.
      - kind: limit
        text: >-
          כש-$\alpha \to 0$ קובייה אחת שוכבת על פאה אופקית ומשתתפת במשקל כולו, והשנייה, על פאה אנכית, נופלת חופשית ולא לוחצת: שוב $(M + m)\,g$.
      - kind: units
        text: >-
          כל האיברים הם מסה כפול $g$: ניוטונים.
      - kind: substitution
        text: >-
          $N_\alpha = 0.50\cdot9.8\cdot0.866 = 4.24\,\text{N}$, $N_\beta = 2.45\,\text{N}$; אופקית $4.24\cdot0.5 = 2.12\,\text{N}$ ו-$2.45\cdot0.866 = 2.12\,\text{N}$;
          השולחן $2.5\cdot9.8 = 24.5\,\text{N}$, לעומת $2.0\cdot9.8 + 2\cdot0.50\cdot9.8 = 29.4\,\text{N}$.
      - kind: result
        text: >-
          א. $24.5\,\text{N}$, כאילו רק קובייה אחת מונחת על הגוש. ב. שני הרכיבים האופקיים $2.12\,\text{N}$, בכיוונים הפוכים.
    source:
      name: AAPT F = ma Exam
      year: 2013
      problem: Question 11
      url: https://www.aapt.org/physicsteam/2014/upload/exam1-2013-solutions.pdf
      verified: '2026-11-09'
      adapted: true

# src/physics/forcelaw.ts (integrateForceOfTime, decayingForceState, speedFromForce, travelTime,
# integrateForceOfPosition) and G, R_EARTH from constants.ts:
#   W01 v(3) = 10.5 m/s, x(3) = 13.5 m (a(3)·t = 15);  W03 compression 0.20 m, v(0.10 m) = 2.60 m/s (linear guess 1.5);
#   W04 v∞ = 3.0 m/s, stops at 0.575 s at x = −0.274 m, back at x = 0 at 1.21 s;  W05 v_max = 2.19 m/s, turns at 0.45 m;
#   W06 v(2x₀) = 6.32 m/s, v∞ = 8.94 m/s, half of v∞ at 0.667 m;  W07 v = 33.5 m/s, x(T) = 0.0838 m, F_avg = 382 N
#   (a rectangle of 600 N: 52.6 m/s);  W08 d = 0.180 m (frictionless 0.190), kd = 36.0 N > μmg = 1.96 N, back at x = 0
#   at 2.69 m/s;  W09 t_s = 3.0 s, x_s = 18 m, back at 0 at 5.20 s with v = −18 m/s;  W10 n = 2: t(2x₀)/t(x₀) = 0.707;
#   c1 a = 1.0 m/s², tensions 8640, 7840, 7040 N (the integrated history ends at 20.0 m, at rest);
#   c2 λ = 0.400, H = 1.59·10⁶ m (constant g: 1.28·10⁶ m), G(λ) = 1.35, T = 689 s (RK4: 688.8 s; constant g: 510 s).
# In a >- block consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '2.8'
practice:
  - id: W-2.8-01
    level: basic
    objectives: [OBJ-2.8-1]
    prompt: >-
      על גוף בעל מסה $2.0\,\text{kg}$, שנמצא במנוחה ב-$x = 0$ ברגע $t = 0$, פועל לאורך ציר $x$ כוח $F(t) = 4.0 + 2.0t$ (בניוטונים, כש-$t$ בשניות).

      א. מצאו את $v(t)$ ואת $x(t)$.

      ב. חשבו את המהירות ואת המקום ב-$t = 3.0\,\text{s}$.

      ג. תלמיד חישב את התאוצה ב-$t = 3.0\,\text{s}$ וכפל אותה בזמן. מה הוא קיבל, ולמה זה לא נכון?
    answer: >-
      א. $v = 2.0t + 0.5t^2$, $x = t^2 + \tfrac16t^3$ (יחידות SI). ב. $10.5\,\text{m/s}$ ו-$13.5\,\text{m}$. ג. $15\,\text{m/s}$; התאוצה גדלה מ-$2.0$ ל-$5.0\,\text{m/s}^2$, ולא הייתה $5.0\,\text{m/s}^2$ כל הזמן.
    solution:
      - kind: given
        text: >-
          $m = 2.0\,\text{kg}$, $F = 4.0 + 2.0t$; $x(0) = 0$, $v(0) = 0$; ציר $x$ בכיוון הכוח.
      - kind: law
        text: >-
          הכוח תלוי בזמן בלבד: $v(t) = v_0 + \dfrac1m\displaystyle\int_0^tF\,dt'$ ו-$x(t) = x_0 + \displaystyle\int_0^tv\,dt'$.
      - kind: manipulation
        text: >-
          א. $a = F/m = 2.0 + t$. אינטגרציה אחת: $v = 2.0t + \tfrac12t^2$. שנייה: $x = t^2 + \tfrac16t^3$.

          ג. $a(3.0) = 5.0\,\text{m/s}^2$, ו-$a(3.0)\cdot3.0 = 15\,\text{m/s}$. אבל $v(3.0)$ הוא השטח מתחת לגרף של $a(t)$ מ-$0$ עד $3.0\,\text{s}$, טרפז שגובהו עולה מ-$2.0$ ל-$5.0$, ולא מלבן בגובה $5.0$.
      - kind: limit
        text: >-
          בדיקת גבולות: אם החלק שגדל עם הזמן נעלם, $F = 4.0\,\text{N}$, התוצאות הן $v = 2.0t$ ו-$x = t^2$, תאוצה קבועה $2.0\,\text{m/s}^2$. וגזירה של $v(t)$ מחזירה את $a(t)$, וב-$t = 0$ גם $v$ וגם $x$ אפס.
      - kind: units
        text: >-
          ל-$2.0$ שב-$F$ יחידות $\text{N/s}$, ולכן $\tfrac{2.0}{m}t$ ב-$\text{m/s}^2$; כל אינטגרציה מוסיפה $\text{s}$: $\text{m/s}$ ואחר כך $\text{m}$.
      - kind: substitution
        text: >-
          $v(3.0) = 6.0 + 4.5 = 10.5\,\text{m/s}$; $x(3.0) = 9.0 + 4.5 = 13.5\,\text{m}$.
      - kind: result
        text: >-
          $v(3.0\,\text{s}) = 10.5\,\text{m/s}$, $x(3.0\,\text{s}) = 13.5\,\text{m}$; הכפל $a(3)\cdot t = 15\,\text{m/s}$ שגוי, כי התאוצה לא הייתה קבועה.

  - id: W-2.8-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.8-1]
    prompt: >-
      גוף על משטח אופקי חלק, ועליו פועל כוח אופקי שתלוי בזמן בלבד. קבעו לגבי כל טענה אם היא נכונה או לא, ונמקו במשפט.

      א. ברגע שהכוח מתאפס, הגוף נעצר.

      ב. גוף שיצא ממנוחה ועליו פועל כוח חיובי שהולך וקטן (אבל לא מתאפס) מאט.

      ג. גוף יצא ממנוחה ב-$t = 0$, והשטח מתחת לגרף של $F(t)$ מ-$0$ עד $T$ הוא אפס. לכן ב-$T$ הגוף חזר לנקודת ההתחלה.

      ד. שני גופים זהים, שעליהם פועל אותו $F(t)$ ושיצאו במהירויות התחלתיות שונות: ההפרש בין המהירויות שלהם קבוע בזמן.
    answer: >-
      א. לא נכון. ב. לא נכון. ג. לא נכון. ד. נכון.
    solution:
      - kind: law
        text: >-
          $v(t) = v_0 + \dfrac1m\displaystyle\int_0^tF\,dt'$: המהירות היא השטח שהצטבר, לא הכוח של הרגע.
      - kind: reasoning
        text: >-
          א. כשהכוח מתאפס **התאוצה** אפס, והמהירות פשוט מפסיקה להשתנות. הגוף ממשיך במהירות שצבר.

          ב. כל עוד $F \gt 0$ השטח גדל, ולכן המהירות **עולה**. היא רק עולה לאט יותר.

          ג. שטח אפס פירושו $v(T) = v(0) = 0$, ולא $x(T) = 0$. למשל $F = F_0$ בחצי הראשון של הזמן ו-$-F_0$ בחצי השני: הגוף מאיץ, מאט ונעצר ב-$x = \dfrac{F_0T^2}{4m} \gt 0$, בלי לחזור.

          ד. לשניהם אותו אינטגרל $\int F\,dt$, ולכן $v_1(t) - v_2(t) = v_{0,1} - v_{0,2}$ בכל רגע.
      - kind: limit
        text: >-
          בדיקה: בכוח קבוע, $F = F_0$, הטענה ד אומרת ששני הגופים מאיצים באותה תאוצה, כמו בזריקה של שיעור 1.2, ואז היא ודאי נכונה. והדוגמה של ג, כש-$T \to 0$, נותנת $x(T) \to 0$: רק בדחיפה קצרה מאוד הגוף "לא זז".
      - kind: units
        text: >-
          $\dfrac{F_0T^2}{m}$ ב-$\dfrac{\text{N}\cdot\text{s}^2}{\text{kg}} = \text{m}$.
      - kind: result
        text: >-
          א, ב, ג לא נכונות; ד נכונה.

  - id: W-2.8-03
    level: basic
    objectives: [OBJ-2.8-2]
    prompt: >-
      גוש בעל מסה $2.0\,\text{kg}$ מחליק על משטח אופקי חלק במהירות $3.0\,\text{m/s}$ ופוגע בקפיץ אופקי בעל קבוע $k = 450\,\text{N/m}$, שהקצה השני שלו קבוע בקיר.

      א. מה הכיווץ הגדול ביותר של הקפיץ?

      ב. מה מהירות הגוש כשהכיווץ $0.10\,\text{m}$?

      ג. תלמידה טענה שבחצי הכיווץ המרבי המהירות היא חצי מ-$3.0\,\text{m/s}$. מה הטעות?
    answer: >-
      א. $0.20\,\text{m}$. ב. $2.60\,\text{m/s}$. ג. המהירות לא יורדת קווית עם המקום: $v^2$ יורד כמו $x^2$.
    solution:
      - kind: given
        text: >-
          $m = 2.0\,\text{kg}$, $v_0 = 3.0\,\text{m/s}$, $k = 450\,\text{N/m}$; ציר $x$ בכיוון התנועה, הראשית בנקודת המגע עם הקפיץ, כך ש-$x$ הוא הכיווץ ו-$F = -kx$ כש-$x \gt 0$.
      - kind: law
        text: >-
          הכוח תלוי במקום: $\tfrac12mv^2 - \tfrac12mv_0^2 = \displaystyle\int_0^xF\,dx'$.
      - kind: manipulation
        text: >-
          $\tfrac12mv^2 = \tfrac12mv_0^2 - \tfrac12kx^2$, ולכן $v^2 = v_0^2 - \dfrac km\,x^2$. הכיווץ המרבי כש-$v = 0$: $x_{\max} = v_0\sqrt{m/k}$.

          ג. $v^2$ ולא $v$ יורד ב-$\tfrac km x^2$. בחצי הדרך $v^2 = v_0^2 - \tfrac14v_0^2$, ו-$v = \tfrac{\sqrt3}{2}v_0$.
      - kind: limit
        text: >-
          בדיקת גבולות: כש-$k \to \infty$ (קיר קשיח) $x_{\max} \to 0$; כש-$k \to 0$ הגוש לא נבלם, $v \to v_0$. וב-$x = 0$, $v = v_0$.
      - kind: units
        text: >-
          $\sqrt{m/k}$ ב-$\sqrt{\text{kg}/(\text{N/m})} = \text{s}$, ולכן $v_0\sqrt{m/k}$ במטרים.
      - kind: substitution
        text: >-
          $x_{\max} = 3.0\sqrt{2.0/450} = 0.20\,\text{m}$; $v^2 = 9.0 - 225\cdot0.010 = 6.75$, $v = 2.60\,\text{m/s}$.
      - kind: result
        text: >-
          כיווץ מרבי $0.20\,\text{m}$; בכיווץ $0.10\,\text{m}$ המהירות $2.60\,\text{m/s}$, $\tfrac{\sqrt3}{2}$ מ-$3.0\,\text{m/s}$ ולא חצי.

  - id: W-2.8-04
    level: mid
    objectives: [OBJ-2.8-1]
    prompt: >-
      סירה קטנה בעלת מסה $3.0\,\text{kg}$ (דגם, בלי התנגדות מים) נעה ב-$t = 0$ במהירות $1.0\,\text{m/s}$ בכיוון $-x$, ונמצאת ב-$x = 0$. ב-$t = 0$ מדליקים מנוע שדוחף אותה בכיוון $+x$ בכוח שדועך, $F = F_0e^{-t/T_d}$, עם $F_0 = 6.0\,\text{N}$ וזמן דעיכה $T_d = 2.0\,\text{s}$.

      א. מצאו את $v(t)$ ואת $x(t)$.

      ב. מתי הסירה נעצרת לרגע, ואיפה?

      ג. לאיזו מהירות היא מתקרבת? (רשות: בדקו במספרים שהיא חוזרת ל-$x = 0$ בערך ב-$t = 1.21\,\text{s}$.)
    answer: >-
      א. $v = -1.0 + 3.0\left(1 - e^{-t/2.0}\right)$, $x = -1.0t + 3.0\left[t - 2.0\left(1 - e^{-t/2.0}\right)\right]$ (SI). ב. ב-$0.575\,\text{s}$, ב-$x = -0.274\,\text{m}$. ג. $2.0\,\text{m/s}$ בכיוון $+x$.
    solution:
      - kind: given
        text: >-
          $m = 3.0\,\text{kg}$, $F_0 = 6.0\,\text{N}$, $T_d = 2.0\,\text{s}$; ציר $x$ חיובי בכיוון הכוח, הראשית במקום של הסירה ב-$t = 0$; $v_0 = -1.0\,\text{m/s}$, $x_0 = 0$.
      - kind: law
        text: >-
          הכוח תלוי בזמן בלבד: $v = v_0 + \dfrac1m\displaystyle\int_0^tF\,dt'$, $x = x_0 + \displaystyle\int_0^tv\,dt'$.
      - kind: manipulation
        text: >-
          א. $\int_0^te^{-t'/T_d}dt' = T_d\left(1 - e^{-t/T_d}\right)$, ולכן $v = v_0 + u\left(1 - e^{-t/T_d}\right)$ עם $u = F_0T_d/m$, ו-$x = v_0t + u\left[t - T_d\left(1 - e^{-t/T_d}\right)\right]$.

          ב. $v = 0$ כש-$1 - e^{-t/T_d} = -v_0/u$, כלומר $t_s = T_d\ln\dfrac{u}{u + v_0}$.

          ג. כש-$t \to \infty$, $v \to v_0 + u$.
      - kind: limit
        text: >-
          בדיקת גבולות: כש-$F_0 \to 0$, $u \to 0$: הסירה ממשיכה ב-$v_0$ ו-$x = v_0t$. וכש-$t \ll T_d$, $v \approx v_0 + \dfrac{F_0}{m}t$: תאוצה קבועה בכוח ההתחלתי, ואז $t_s \approx \dfrac{m|v_0|}{F_0} = 0.50\,\text{s}$, קרוב ל-$0.575\,\text{s}$, וקצת פחות, כי הכוח כבר נחלש.
      - kind: units
        text: >-
          $u = F_0T_d/m$ ב-$\text{N}\cdot\text{s}/\text{kg} = \text{m/s}$; $uT_d$ במטרים.
      - kind: substitution
        text: >-
          $u = 6.0\cdot2.0/3.0 = 4.0\,\text{m/s}$. $t_s = 2.0\ln\dfrac{4.0}{3.0} = 0.575\,\text{s}$; שם $1 - e^{-t_s/T_d} = 0.25$, ו-$x = -0.575 + 4.0\left[0.575 - 2.0\cdot0.25\right] = -0.274\,\text{m}$. המהירות הסופית $-1.0 + 4.0 = 3.0\,\text{m/s}$.
      - kind: result
        text: >-
          נעצרת ב-$0.575\,\text{s}$ ב-$x = -0.274\,\text{m}$, ומתקרבת ל-$3.0\,\text{m/s}$ בכיוון $+x$.

  - id: W-2.8-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.8-2]
    prompt: >-
      על גוף בעל מסה $m$, שמשתחרר ממנוחה ב-$x = 0$, פועל כוח שתלוי במקום: $F = +F_0$ כש-$0 \lt x \lt a$, ו-$F = -2F_0$ כש-$x \gt a$, עם $F_0 \gt 0$.

      א. בלי לחשב את התנועה בזמן, קבעו ונמקו: איפה המהירות של הגוף הגדולה ביותר, ואיפה הוא נעצר בפעם הראשונה?

      ב. מה הוא עושה אחר כך?

      ג. חשבו את המהירות המרבית ואת נקודת העצירה כש-$F_0 = 4.0\,\text{N}$, $a = 0.30\,\text{m}$ ו-$m = 0.50\,\text{kg}$.
    answer: >-
      א. מרבית ב-$x = a$; נעצר ב-$x = \tfrac32a$. ב. חוזר, ונע הלוך ושוב בין $0$ ל-$\tfrac32a$. ג. $2.19\,\text{m/s}$ ו-$0.45\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $F(x)$ קבוע למקוטעין; ציר $x$ בכיוון הכוח ההתחלתי, הראשית בנקודת השחרור; $v(0) = 0$.
      - kind: law
        text: >-
          $\tfrac12mv^2 = \displaystyle\int_0^xF\,dx'$: השטח מתחת לגרף של $F(x)$, עם סימן.
      - kind: reasoning
        text: >-
          א. עד $x = a$ השטח חיובי וגדל, ולכן $v$ גדלה; אחרי $a$ השטח קטן. המהירות מרבית ב-$a$, ושם $\tfrac12mv_{\max}^2 = F_0a$. הגוף נעצר כשהשטח השלילי, $2F_0(x - a)$, משלים את החיובי, $F_0a$: ב-$x - a = a/2$.

          ב. שם הכוח $-2F_0$, והגוף חוזר. בדרך חזרה אותו חשבון בסדר הפוך: הוא מגיע ל-$a$ באותה מהירות, ובקטע $0 \lt x \lt a$ הכוח $+F_0$ בולם אותו עד שהוא נעצר בדיוק ב-$x = 0$. התנועה חוזרת על עצמה בין $0$ ל-$\tfrac32a$.
      - kind: limit
        text: >-
          בדיקת גבולות: אילו הכוח אחרי $a$ היה $-F_0$, הגוף היה נעצר ב-$2a$, באותו מרחק כמו הדרך שבה האיץ; ככל שהכוח הבולם חזק יותר, הוא נעצר קרוב יותר ל-$a$. כאן פי 2 חזק, ולכן חצי מהמרחק.
      - kind: units
        text: >-
          $\dfrac{F_0a}{m}$ ב-$\dfrac{\text{N}\cdot\text{m}}{\text{kg}} = \text{m}^2/\text{s}^2$.
      - kind: substitution
        text: >-
          $v_{\max} = \sqrt{\dfrac{2F_0a}{m}} = \sqrt{\dfrac{2\cdot4.0\cdot0.30}{0.50}} = 2.19\,\text{m/s}$; נקודת העצירה $1.5\cdot0.30 = 0.45\,\text{m}$.
      - kind: result
        text: >-
          המהירות מרבית ב-$x = a$, $2.19\,\text{m/s}$; הגוף נעצר ב-$0.45\,\text{m}$, חוזר, ונע הלוך ושוב בין $0$ ל-$0.45\,\text{m}$.

  - id: W-2.8-06
    level: mid
    objectives: [OBJ-2.8-2]
    prompt: >-
      חלקיק בעל מסה $m = 0.10\,\text{kg}$ נדחה מנקודה קבועה (הראשית) בכוח $F = \dfrac{A}{x^2}$ לאורך ציר $x$, עם $A = 2.0\,\text{N}\cdot\text{m}^2$. הוא משתחרר ממנוחה ב-$x_0 = 0.50\,\text{m}$.

      א. מצאו את גודל המהירות כפונקציה של $x$.

      ב. מה המהירות ב-$x = 2x_0$? ולאיזו מהירות היא מתקרבת כש-$x \to \infty$?

      ג. הכוח פועל כל הזמן בכיוון התנועה. איך ייתכן שהמהירות לא גדלה בלי גבול?
    answer: >-
      א. $v = \sqrt{\dfrac{2A}{m}\left(\dfrac{1}{x_0} - \dfrac1x\right)}$. ב. $6.32\,\text{m/s}$; $8.94\,\text{m/s}$. ג. השטח מתחת ל-$A/x^2$ עד אינסוף סופי.
    solution:
      - kind: given
        text: >-
          $F = A/x^2$ (חיובי: מהראשית החוצה), $A = 2.0\,\text{N}\cdot\text{m}^2$, $m = 0.10\,\text{kg}$; $x_0 = 0.50\,\text{m}$, $v_0 = 0$.
      - kind: law
        text: >-
          הכוח תלוי במקום: $\tfrac12mv^2 = \displaystyle\int_{x_0}^{x}F\,dx'$.
      - kind: manipulation
        text: >-
          $\int_{x_0}^{x}\dfrac{A}{x'^2}dx' = A\left(\dfrac1{x_0} - \dfrac1x\right)$, ולכן $v^2 = \dfrac{2A}{m}\left(\dfrac1{x_0} - \dfrac1x\right)$. כש-$x \to \infty$: $v_\infty = \sqrt{\dfrac{2A}{mx_0}}$.

          ג. ככל שהחלקיק מתרחק הכוח נחלש כמו $1/x^2$, מהר מספיק כדי שהשטח הכולל, $A/x_0$, יהיה סופי. כוח שהיה יורד לאט יותר, כמו $1/x$, היה נותן שטח אינסופי.
      - kind: limit
        text: >-
          בדיקת גבולות: ב-$x = x_0$, $v = 0$. וכשהחלקיק זז רק מעט, $x = x_0 + \delta$, אז $\dfrac1{x_0} - \dfrac1x \approx \dfrac{\delta}{x_0^2}$ ו-$v^2 \approx 2\dfrac{F(x_0)}{m}\delta$: תאוצה קבועה בכוח ההתחלתי.
      - kind: units
        text: >-
          $\dfrac{A}{mx}$ ב-$\dfrac{\text{N}\cdot\text{m}^2}{\text{kg}\cdot\text{m}} = \text{m}^2/\text{s}^2$.
      - kind: substitution
        text: >-
          $\dfrac{2A}{m} = 40\,\text{m}^3/\text{s}^2$. ב-$2x_0 = 1.0\,\text{m}$: $v^2 = 40(2.0 - 1.0) = 40$, $v = 6.32\,\text{m/s}$. $v_\infty = \sqrt{40\cdot2.0} = 8.94\,\text{m/s}$.
      - kind: result
        text: >-
          $v(1.0\,\text{m}) = 6.32\,\text{m/s}$; $v \to 8.94\,\text{m/s}$, כי השטח מתחת ל-$F(x)$ עד אינסוף סופי.

  - id: W-2.8-07
    level: mid
    objectives: [OBJ-2.8-1]
    prompt: >-
      מחבט מכה בכדור טניס בעל מסה $0.057\,\text{kg}$ שעומד (בקירוב) במקום. בזמן המגע, $T = 5.0\,\text{ms}$, הכוח על הכדור הוא $F(t) = F_0\sin\left(\dfrac{\pi t}{T}\right)$, עם $F_0 = 600\,\text{N}$, ואחר כך אפס. הזניחו את הכובד בזמן המגע.

      א. מה מהירות הכדור כשהוא עוזב את המחבט?

      ב. כמה זז הכדור בזמן המגע?

      ג. מה הכוח הממוצע בזמן המגע? כמה הייתה המהירות אילו הכוח היה $600\,\text{N}$ כל זמן המגע?
    answer: >-
      א. $33.5\,\text{m/s}$. ב. $0.0838\,\text{m}$. ג. $382\,\text{N}$; $52.6\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $m = 0.057\,\text{kg}$, $F = F_0\sin(\pi t/T)$ כש-$0 \le t \le T$, $F_0 = 600\,\text{N}$, $T = 5.0\cdot10^{-3}\,\text{s}$; ציר $x$ בכיוון המכה, הראשית במקום ההתחלתי; $v(0) = 0$.
      - kind: law
        text: >-
          $v(t) = \dfrac1m\displaystyle\int_0^tF\,dt'$, $x(t) = \displaystyle\int_0^tv\,dt'$; הכוח הממוצע הוא $\dfrac1T\displaystyle\int_0^TF\,dt$.
      - kind: manipulation
        text: >-
          $v(t) = \dfrac{F_0T}{\pi m}\left(1 - \cos\dfrac{\pi t}{T}\right)$, ולכן $v(T) = \dfrac{2F_0T}{\pi m}$. אינטגרציה שנייה: $x(t) = \dfrac{F_0T}{\pi m}\left(t - \dfrac{T}{\pi}\sin\dfrac{\pi t}{T}\right)$, ו-$x(T) = \dfrac{F_0T^2}{\pi m}$. הכוח הממוצע: $\dfrac{2F_0}{\pi}$.
      - kind: limit
        text: >-
          בדיקת גבולות: $x(T) = \tfrac12v(T)\,T$, כמו בכל פולס סימטרי: בממוצע הכדור נע בחצי מהמהירות הסופית. וכש-$T \to 0$ עם אותו שטח, $x(T) \to 0$: מכה מיידית.
      - kind: units
        text: >-
          $\dfrac{F_0T}{m}$ ב-$\text{m/s}$; $\dfrac{F_0T^2}{m}$ במטרים.
      - kind: substitution
        text: >-
          $v(T) = \dfrac{2\cdot600\cdot5.0\cdot10^{-3}}{\pi\cdot0.057} = 33.5\,\text{m/s}$; $x(T) = \dfrac{600\cdot2.5\cdot10^{-5}}{\pi\cdot0.057} = 0.0838\,\text{m}$; $F_{\text{avg}} = 1200/\pi = 382\,\text{N}$; מלבן של $600\,\text{N}$: $\dfrac{600\cdot5.0\cdot10^{-3}}{0.057} = 52.6\,\text{m/s}$.
      - kind: result
        text: >-
          $33.5\,\text{m/s}$, אחרי $8.4\,\text{cm}$ של מגע; כוח ממוצע $382\,\text{N}$; כוח קבוע של $600\,\text{N}$ היה נותן $52.6\,\text{m/s}$.

  - id: W-2.8-08
    level: bagrut
    objectives: [OBJ-2.8-2]
    prompt: >-
      גוש בעל מסה $0.80\,\text{kg}$ מחליק על משטח אופקי במהירות $3.0\,\text{m/s}$ ופוגע בקפיץ בעל קבוע $k = 200\,\text{N/m}$. מקדם החיכוך הקינטי בין הגוש למשטח $\mu = 0.25$ (הניחו שגם החיכוך הסטטי בערך כזה).

      א. כתבו את הכוח השקול על הגוש כפונקציה של הכיווץ $x$, בזמן שהוא מכווץ את הקפיץ. מצאו את הכיווץ המרבי.

      ב. האם הגוש חוזר? אם כן, כתבו את הכוח השקול בדרך חזרה, ומצאו את מהירותו כשהקפיץ חוזר לאורך הרפוי.

      ג. למה הכוח השקול "תלוי במקום" רק בכל קטע של התנועה לחוד?
    answer: >-
      א. $F = -kx - \mu mg$; $0.180\,\text{m}$. ב. כן, כי $kx_{\max} = 36.0\,\text{N} \gt \mu mg = 1.96\,\text{N}$; בדרך חזרה $F = -kx + \mu mg$, ו-$v = 2.69\,\text{m/s}$. ג. החיכוך פונה נגד המהירות, ולכן הוא מחליף כיוון כשהמהירות מחליפה סימן.
    solution:
      - kind: given
        text: >-
          $m = 0.80\,\text{kg}$, $v_0 = 3.0\,\text{m/s}$, $k = 200\,\text{N/m}$, $\mu = 0.25$, $g = 9.8\,\text{m/s}^2$; ציר $x$ בכיוון התנועה ההתחלתית, הראשית בנקודת המגע, $x$ הכיווץ.
      - kind: law
        text: >-
          בכל קטע שבו הכוח השקול הוא פונקציה של המקום: $\tfrac12mv^2 - \tfrac12mv_1^2 = \displaystyle\int_{x_1}^{x}F\,dx'$. הכוחות האופקיים: הקפיץ, $-kx$ (מהקפיץ), והחיכוך הקינטי, $\mu mg$ נגד המהירות (מהמשטח).
      - kind: manipulation
        text: >-
          א. בדרך פנימה $v \gt 0$, ולכן $F = -kx - \mu mg$, ו-$0 - \tfrac12mv_0^2 = -\tfrac12kd^2 - \mu mgd$. זו משוואה ריבועית ב-$d$: $\tfrac12kd^2 + \mu mgd - \tfrac12mv_0^2 = 0$.

          ב. ב-$x = d$ הקפיץ דוחף ב-$kd$, והחיכוך הסטטי יכול להחזיק לכל היותר $\mu mg$; אם $kd \gt \mu mg$ הגוש חוזר. בדרך חזרה $v \lt 0$, והחיכוך פונה ל-$+x$: $F = -kx + \mu mg$. מ-$d$ (במנוחה) עד $0$: $\tfrac12mv^2 = \displaystyle\int_d^0\left(-kx + \mu mg\right)dx = \tfrac12kd^2 - \mu mgd$.
      - kind: limit
        text: >-
          בדיקת גבולות: כש-$\mu \to 0$, $d \to v_0\sqrt{m/k}$ והגוש חוזר ב-$v_0$, כמו בקפיץ בלי חיכוך. וכש-$k \to 0$, $d \to \dfrac{v_0^2}{2\mu g}$: מרחק הבלימה בחיכוך בלבד.
      - kind: units
        text: >-
          $\tfrac12kd^2$ ו-$\mu mgd$ שניהם ב-$\text{N}\cdot\text{m}$, כמו $\tfrac12mv^2$ ב-$\text{kg}\cdot\text{m}^2/\text{s}^2$.
      - kind: substitution
        text: >-
          $100d^2 + 1.96d - 3.6 = 0$, $d = 0.180\,\text{m}$ (בלי חיכוך $0.190\,\text{m}$). $kd = 36.0\,\text{N} \gg 1.96\,\text{N}$. בדרך חזרה: $v^2 = \dfrac{2}{0.80}\left(100\cdot0.0325 - 1.96\cdot0.180\right) = 7.23$, $v = 2.69\,\text{m/s}$.
      - kind: result
        text: >-
          כיווץ מרבי $0.180\,\text{m}$; הגוש חוזר, ויוצא מהקפיץ ב-$2.69\,\text{m/s}$. הכוח השקול תלוי במקום בכל קטע לחוד, כי כיוון החיכוך תלוי בסימן של המהירות.

  - id: W-2.8-09
    level: bagrut
    objectives: [OBJ-2.8-1]
    prompt: >-
      גוף בעל מסה $2.0\,\text{kg}$ נע ב-$t = 0$ במהירות $9.0\,\text{m/s}$ בכיוון $+x$ מהראשית, על משטח חלק. מ-$t = 0$ פועל עליו כוח בלימה שגדל עם הזמן, $F = -bt$, עם $b = 4.0\,\text{N/s}$.

      א. מתי הגוף נעצר, ואיפה?

      ב. מתי הוא חוזר לראשית, ובאיזו מהירות?

      ג. השוו את מרחק העצירה למרחק שהיה מתקבל בבלימה בתאוצה קבועה שעוצרת את הגוף באותו זמן. הסבירו את ההבדל בלי חשבון.
    answer: >-
      א. ב-$3.0\,\text{s}$, ב-$x = 18\,\text{m}$. ב. ב-$5.20\,\text{s}$, במהירות $18\,\text{m/s}$ בכיוון $-x$. ג. $18\,\text{m}$ לעומת $13.5\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $m = 2.0\,\text{kg}$, $v_0 = 9.0\,\text{m/s}$, $b = 4.0\,\text{N/s}$, $F = -bt$; ציר $x$ בכיוון התנועה ההתחלתית, הראשית במקום ב-$t = 0$.
      - kind: law
        text: >-
          $v = v_0 + \dfrac1m\displaystyle\int_0^tF\,dt'$, $x = \displaystyle\int_0^tv\,dt'$.
      - kind: manipulation
        text: >-
          $v = v_0 - \dfrac{b}{2m}t^2$, $x = v_0t - \dfrac{b}{6m}t^3$.

          א. $v = 0$ ב-$t_s = \sqrt{2mv_0/b}$, ושם $x_s = v_0t_s - \dfrac{b}{6m}\cdot\dfrac{2mv_0}{b}\,t_s = \tfrac23v_0t_s$.

          ב. $x = 0$ (חוץ מ-$t = 0$) כש-$t^2 = \dfrac{6mv_0}{b}$, כלומר $t = \sqrt3\,t_s$, ושם $v = v_0 - 3v_0 = -2v_0$.

          ג. בבלימה קבועה המהירות יורדת קווית, והממוצע שלה $v_0/2$: $x = \tfrac12v_0t_s$. כאן הבלימה חלשה בהתחלה, כשהגוף מהיר, וחזקה בסוף, ולכן הגוף מבלה יותר זמן במהירות גבוהה ועובר יותר.
      - kind: limit
        text: >-
          בדיקת גבולות: כש-$b \to 0$, $t_s \to \infty$: אין בלימה. וב-$t = t_s$ הגזירה של $x(t)$ אכן אפס: $v_0 - \dfrac{b}{2m}t_s^2 = v_0 - v_0 = 0$.
      - kind: units
        text: >-
          $\sqrt{mv_0/b}$ ב-$\sqrt{\text{kg}\cdot(\text{m/s})/(\text{N/s})} = \sqrt{\text{s}^2} = \text{s}$.
      - kind: substitution
        text: >-
          $t_s = \sqrt{2\cdot2.0\cdot9.0/4.0} = 3.0\,\text{s}$; $x_s = \tfrac23\cdot9.0\cdot3.0 = 18\,\text{m}$; חזרה ב-$\sqrt3\cdot3.0 = 5.20\,\text{s}$ במהירות $-18\,\text{m/s}$; בבלימה קבועה $\tfrac12\cdot9.0\cdot3.0 = 13.5\,\text{m}$.
      - kind: result
        text: >-
          נעצר ב-$3.0\,\text{s}$ אחרי $18\,\text{m}$; חוזר לראשית ב-$5.20\,\text{s}$ ב-$18\,\text{m/s}$ בכיוון $-x$; בלימה קבועה הייתה עוצרת אחרי $13.5\,\text{m}$.

  - id: W-2.8-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.8-2]
    prompt: >-
      גוף בעל מסה $m$ נע לאורך ציר $x$ תחת כוח מחזיר $F = -k\,|x|^n$ כש-$x \gt 0$ (ו-$+k|x|^n$ כש-$x \lt 0$), עם $k \gt 0$ ו-$n \gt 0$. הוא משתחרר ממנוחה ב-$x_0 \gt 0$.

      א. מצאו את גודל המהירות כפונקציה של $x$.

      ב. הראו, בעזרת ההצבה $u = x/x_0$, שהזמן מ-$x_0$ עד $0$ פרופורציוני ל-$x_0^{(1-n)/2}$.

      ג. בלי חשבון נוסף: לאילו ערכים של $n$ תנודה גדולה מהירה יותר מקטנה? מה המקרה $n = 1$?
    answer: >-
      א. $|v| = \sqrt{\dfrac{2k}{(n+1)m}\left(x_0^{n+1} - x^{n+1}\right)}$ כש-$0 \le x \le x_0$. ב. $t = \sqrt{\dfrac{(n+1)m}{2k}}\;x_0^{(1-n)/2}\displaystyle\int_0^1\frac{du}{\sqrt{1 - u^{n+1}}}$. ג. כש-$n \gt 1$; ב-$n = 1$ (קפיץ) הזמן לא תלוי ב-$x_0$.
    solution:
      - kind: given
        text: >-
          $F = -kx^n$ כש-$x \gt 0$; ציר $x$ מהנקודה שבה הכוח מתאפס; $x(0) = x_0$, $v(0) = 0$.
      - kind: law
        text: >-
          $\tfrac12mv^2 = \displaystyle\int_{x_0}^{x}F\,dx'$, ו-$t = \displaystyle\int\frac{dx}{|v|}$.
      - kind: manipulation
        text: >-
          א. $\tfrac12mv^2 = -k\displaystyle\int_{x_0}^{x}x'^n\,dx' = \dfrac{k}{n+1}\left(x_0^{n+1} - x^{n+1}\right)$.

          ב. עם $x = x_0u$: $dx = x_0\,du$ ו-$|v| = \sqrt{\dfrac{2k}{(n+1)m}}\,x_0^{(n+1)/2}\sqrt{1 - u^{n+1}}$, ולכן $t = \sqrt{\dfrac{(n+1)m}{2k}}\,x_0^{1-(n+1)/2}\displaystyle\int_0^1\frac{du}{\sqrt{1 - u^{n+1}}}$. האינטגרל הוא מספר טהור, והחזקה של $x_0$ היא $\tfrac{1-n}{2}$.
      - kind: reasoning
        text: >-
          ג. כש-$n \gt 1$ החזקה שלילית: תנודה גדולה מהירה יותר, כי הכוח גדל מהר מהמרחק ("קפיץ קשיח"). כש-$n \lt 1$ היא איטית יותר. ב-$n = 1$ החזקה אפס: בקפיץ רגיל הזמן לא תלוי בגודל התנודה.
      - kind: limit
        text: >-
          בדיקת גבולות: ב-$n = 1$ האינטגרל הוא $\int_0^1\dfrac{du}{\sqrt{1 - u^2}} = \dfrac{\pi}{2}$, והזמן $\dfrac{\pi}{2}\sqrt{m/k}$, כמו בקפיץ של השיעור. ב-$n = 3$ יוצא $\sqrt{2m/k}/x_0$ כפול $1.311$, כמו בקפיץ הקשיח של דוגמה 6. ובדיקה מספרית ב-$n = 2$: הכפלת $x_0$ מקטינה את הזמן פי $\sqrt2$, $0.707$.
      - kind: units
        text: >-
          ל-$k$ יחידות $\text{N/m}^n$, ולכן $\sqrt{m/k}\,x_0^{(1-n)/2}$ ב-$\sqrt{\dfrac{\text{kg}\cdot\text{m}^n}{\text{kg}\cdot\text{m/s}^2}}\cdot\text{m}^{(1-n)/2} = \text{m}^{(n-1)/2}\,\text{s}\cdot\text{m}^{(1-n)/2} = \text{s}$.
      - kind: result
        text: >-
          $t \propto x_0^{(1-n)/2}$: תנודה גדולה מהירה יותר כש-$n \gt 1$, איטית יותר כש-$n \lt 1$, ובקפיץ, $n = 1$, הזמן לא תלוי בגודל התנודה.

challenge:
  - id: W-2.8-c1
    stars: 1
    objectives: [OBJ-2.8-1]
    prompt: >-
      מעלית בעלת מסה $M$ עומדת בקומה הראשונה ועולה לקומה גבוהה יותר, בגובה $h$ מעל נקודת ההתחלה. הכבל מושך אותה בכוח שתלוי בזמן: $M(g + a)$ במשך זמן $T_0$, אחר כך $Mg$ במשך $4T_0$, ולבסוף $M(g - a)$ במשך $T_0$, כאשר $a$ קבוע שלא ידוע מראש. בסוף המעלית עוצרת בדיוק בקומה.

      א. כתבו את הכוח השקול על המעלית כפונקציה של הזמן, ושרטטו (באופן איכותי) את $v(t)$.

      ב. מצאו את $a$ בעזרת $h$ ו-$T_0$.

      ג. חשבו את $a$ ואת שלושת ערכי הכוח בכבל כש-$h = 20\,\text{m}$, $T_0 = 2.0\,\text{s}$ ו-$M = 800\,\text{kg}$.
    answer: >-
      א. $F = Ma$, אפס, $-Ma$ בשלושת הקטעים; $v(t)$ טרפז. ב. $a = \dfrac{h}{5T_0^2}$. ג. $a = 1.0\,\text{m/s}^2$; $8640\,\text{N}$, $7840\,\text{N}$, $7040\,\text{N}$.
    solution:
      - kind: given
        text: >-
          ציר $y$ כלפי מעלה, הראשית בנקודת ההתחלה; $y(0) = 0$, $v(0) = 0$; הכוחות על המעלית: הכבל (כלפי מעלה) והכובד, $Mg$ כלפי מטה (מכדור הארץ).
      - kind: law
        text: >-
          הכוח השקול תלוי בזמן בלבד: $v = \dfrac1M\displaystyle\int_0^tF\,dt'$, $y = \displaystyle\int_0^tv\,dt'$; תנאי ההתחלה של כל קטע הם הערכים בסוף הקטע הקודם.
      - kind: manipulation
        text: >-
          א. $F = T_{\text{cable}} - Mg$: $+Ma$ עד $T_0$, אפס עד $5T_0$, $-Ma$ עד $6T_0$. המהירות עולה קווית ל-$aT_0$, נשארת קבועה $4T_0$, ויורדת קווית לאפס: טרפז. היא מתאפסת ב-$6T_0$ כי השטח החיובי של $F$, $MaT_0$, שווה לשטח השלילי.

          ב. $h$ הוא השטח מתחת לגרף של $v(t)$: $\tfrac12aT_0^2 + aT_0\cdot4T_0 + \tfrac12aT_0^2 = 5aT_0^2$.
      - kind: limit
        text: >-
          בדיקת גבולות: כש-$a \to 0$ המעלית לא זזה, $h \to 0$. וכשקטע המהירות הקבועה נעלם (זמן $0$ במקום $4T_0$), השטח הוא שני משולשים, $h = aT_0^2$, כמו שהנוסחה הכללית $h = aT_0(T_0 + t_{\text{mid}})$ נותנת.
      - kind: units
        text: >-
          $h/T_0^2$ ב-$\text{m/s}^2$; $M(g + a)$ בניוטונים.
      - kind: substitution
        text: >-
          $a = \dfrac{20}{5\cdot4.0} = 1.0\,\text{m/s}^2$; $800\cdot10.8 = 8640\,\text{N}$, $800\cdot9.8 = 7840\,\text{N}$, $800\cdot8.8 = 7040\,\text{N}$.
      - kind: result
        text: >-
          $a = \dfrac{h}{5T_0^2} = 1.0\,\text{m/s}^2$; הכבל מושך ב-$8640$, $7840$ ו-$7040\,\text{N}$.
    source:
      name: MIT OpenCourseWare 8.01SC Classical Mechanics (Fall 2016), Problem Set 1
      year: 2016
      problem: 'Problem 2 (Elevator Trip)'
      url: https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/96231b21bccffc0c17c7d98629a52eb2_MIT8_01F16_pset1_new.pdf
      verified: '2026-11-09'
      adapted: true

  - id: W-2.8-c2
    stars: 2
    objectives: [OBJ-2.8-2]
    prompt: >-
      גוף נזרק אנכית כלפי מעלה מפני כדור הארץ במהירות $V$. השינוי של המשיכה עם הגובה לא זניח, וסיבוב כדור הארץ כן. הגובה $z(t)$ מקיים $\ddot z = -\dfrac{gR^2}{(R + z)^2}$, כאשר $R$ רדיוס כדור הארץ ו-$g$ תאוצת הנפילה על פניו.

      א. בעזרת כלל השרשרת, מצאו את גודל המהירות כפונקציה של הגובה, והראו שהגובה המרבי הוא $H = R\,\dfrac{\lambda}{2 - \lambda}$, כאשר $\lambda = \dfrac{V^2}{gR}$.

      ב. כתבו את הזמן $T$ עד הגובה המרבי כאינטגרל על $z$. הסבירו בעזרת ניתוח ממדים למה $T = \dfrac{V}{g}\,G(\lambda)$, עבור פונקציה $G$ כלשהי, ומה $G$ כש-$\lambda \to 0$.

      ג. חשבו את $H$ ואת $T$ כש-$V = 5.0\,\text{km/s}$, $g = 9.8\,\text{m/s}^2$ ו-$R = 6.37\cdot10^{6}\,\text{m}$ (את האינטגרל מספיק לחשב במחשב). השוו לתאוצה קבועה $g$.
    answer: >-
      א. $v^2 = V^2 - \dfrac{2gRz}{R + z}$, $H = \dfrac{V^2R}{2gR - V^2}$. ב. $T = \displaystyle\int_0^H\frac{dz}{\sqrt{V^2 - 2gRz/(R + z)}}$; $G \to 1$. ג. $H = 1.59\cdot10^{6}\,\text{m}$ ו-$T = 689\,\text{s}$, לעומת $1.28\cdot10^{6}\,\text{m}$ ו-$510\,\text{s}$ בתאוצה קבועה.
    solution:
      - kind: given
        text: >-
          ציר $z$ כלפי מעלה, הראשית על פני כדור הארץ; $\ddot z = -\dfrac{gR^2}{(R + z)^2}$; $z(0) = 0$, $\dot z(0) = V$.
      - kind: law
        text: >-
          הכוח (ליחידת מסה) תלוי במקום בלבד, ולכן כלל השרשרת, $\ddot z = v\,\dfrac{dv}{dz}$, נותן $\tfrac12v^2 - \tfrac12V^2 = \displaystyle\int_0^z\ddot z\,dz'$; הזמן הוא $\displaystyle\int dz/v$.
      - kind: manipulation
        text: >-
          א. $\displaystyle\int_0^z\frac{gR^2}{(R + z')^2}dz' = gR^2\left(\frac1R - \frac1{R + z}\right) = \frac{gRz}{R + z}$, ולכן $v^2 = V^2 - \dfrac{2gRz}{R + z}$. בגובה המרבי $v = 0$: $V^2(R + H) = 2gRH$, כלומר $H = \dfrac{V^2R}{2gR - V^2} = R\dfrac{\lambda}{2 - \lambda}$.

          ב. $T = \displaystyle\int_0^H\frac{dz}{v(z)}$. הבעיה תלויה רק ב-$g$, $R$ ו-$V$. מהם יש צירוף חסר ממדים אחד, $\lambda = V^2/(gR)$, ולכן כל זמן הוא $\dfrac Vg$ כפול פונקציה של $\lambda$. כש-$\lambda \to 0$ הגוף לא מתרחק ביחס ל-$R$, המשיכה קבועה, ו-$T \to V/g$: $G \to 1$.
      - kind: limit
        text: >-
          בדיקת גבולות: (1) כש-$V^2 \ll gR$, $H \approx \dfrac{V^2R}{2gR} = \dfrac{V^2}{2g}$, הגובה של זריקה בתאוצה קבועה. (2) כש-$\lambda \to 2$, כלומר $V \to \sqrt{2gR} = 11.2\,\text{km/s}$, $H \to \infty$: הגוף לא חוזר. (3) $v^2(H) = 0$ בדיוק, ו-$v^2(0) = V^2$.
      - kind: units
        text: >-
          $\lambda = V^2/(gR)$ ב-$\dfrac{\text{m}^2/\text{s}^2}{\text{m/s}^2\cdot\text{m}}$, חסר ממדים; $V/g$ בשניות; $\dfrac{gRz}{R + z}$ ב-$\text{m}^2/\text{s}^2$, כמו $V^2$.
      - kind: substitution
        text: >-
          $\lambda = \dfrac{(5.0\cdot10^3)^2}{9.8\cdot6.37\cdot10^6} = 0.400$; $H = 6.37\cdot10^6\cdot\dfrac{0.400}{1.600} = 1.59\cdot10^6\,\text{m}$. חישוב מספרי של האינטגרל נותן $G(0.400) = 1.35$, ולכן $T = \dfrac{5.0\cdot10^3}{9.8}\cdot1.35 = 689\,\text{s}$. בתאוצה קבועה: $\dfrac{V^2}{2g} = 1.28\cdot10^6\,\text{m}$ ו-$\dfrac Vg = 510\,\text{s}$.
      - kind: result
        text: >-
          $H = R\dfrac{\lambda}{2 - \lambda} = 1.59\cdot10^{6}\,\text{m}$ ו-$T = 689\,\text{s}$: גבוה ב-25% וארוך ב-35% מזריקה בתאוצה קבועה $g$, כי המשיכה נחלשת עם הגובה.

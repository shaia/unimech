#   W06 v_t = 2.45 m/s, τ = 0.25 s, t90 = 0.576 s, y90 = 0.859 m (free fall 1.62 m);
#   W07 m = 6.54·10⁻¹¹ kg, b = 8.0·10⁻⁹ kg/s, v_t = 0.0802 m/s, τ = 8.18 ms, ratio 6.3·10⁻³, 1 km in 1.25·10⁴ s = 3.46 h,
#       both drags 0.0797 m/s;

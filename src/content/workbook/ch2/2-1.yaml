# Workbook for lesson 2.1: ten practice problems and two sourced challenge problems.
# Every number recomputed in .scratch/ch2/2-1/workbook.ts with src/physics/secondlaw.ts (netForce, requiredForce,
# rotatingFrameAcceleration, wallContactTime, hangingInVehicle, reducedGravityFlightTime, constantForceMotion) and
# G = 9.8, G_NEWTON, M_MOON, R_MOON, OMEGA_EARTH, R_EARTH, AU, YEAR from src/physics/constants.ts.
# Challenge sources, both opened on 2026-11-09: MIT OCW 8.01SC Fall 2016, Problem Set 2, problem 2 (the PDF, read
# in full); AAPT 2021 F = ma Exam, question 9 (the exam PDF, and its solutions PDF: answer (B) 31 s, with g = 10).

lesson: '2.1'
practice:
  - id: W-2.1-01
    level: basic
    objectives: [OBJ-2.1-2]
    prompt: >-
      טבעת שמסתה $2.0\,\text{kg}$ מונחת על שולחן אוויר אופקי. שלושה חוטים אופקיים מושכים אותה: $6.0\,\text{N}$ מזרחה,
      $8.0\,\text{N}$ צפונה ו-$5.0\,\text{N}$ מערבה.

      (א) מה הכוח השקול על הטבעת, ברכיבים ובגודל?

      (ב) מה התאוצה שלה, בגודל ובכיוון?
    answer: >-
      (א) $\Sigma\vec F = (1.0,\ 8.0)\,\text{N}$, $8.06\,\text{N}$. (ב) $4.03\,\text{m/s}^2$, $82.9^\circ$ צפונית למזרח.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה וציר $y$ צפונה. $m = 2.0\,\text{kg}$; $\vec F_1 = (6.0,\ 0)$, $\vec F_2 = (0,\ 8.0)$, $\vec F_3 = (-5.0,\ 0)$, בניוטון.
          הכובד והכוח של השולחן אנכיים ומאזנים זה את זה.
      - kind: law
        text: >-
          $\sum F_x = ma_x$ ו-$\sum F_y = ma_y$ במערכת השולחן, שהיא אינרציאלית.
      - kind: manipulation
        text: >-
          $\sum F_x = 6.0 - 5.0 = 1.0\,\text{N}$, $\sum F_y = 8.0\,\text{N}$. $|\Sigma\vec F| = \sqrt{1.0^2 + 8.0^2}$, $a = |\Sigma\vec F|/m$,
          והכיוון $\arctan(8.0/1.0)$ מהמזרח.
      - kind: limit
        text: >-
          בלי הכוח המערבי השקול היה $(6.0,\ 8.0)\,\text{N}$, $10\,\text{N}$; הכוח המערבי מבטל כמעט את כל הרכיב המזרחי, ולכן התאוצה
          כמעט צפונה. מי שמחבר גדלים מקבל $19/2.0 = 9.5\,\text{m/s}^2$: יותר מפי שניים מדי.
      - kind: units
        text: >-
          $\text{N}/\text{kg} = \text{m/s}^2$.
      - kind: substitution
        text: >-
          $|\Sigma\vec F| = 8.06\,\text{N}$, $a = 4.03\,\text{m/s}^2$, $\arctan 8.0 = 82.9^\circ$.
      - kind: result
        text: >-
          (א) $(1.0,\ 8.0)\,\text{N}$, $8.06\,\text{N}$. (ב) $4.03\,\text{m/s}^2$, בזווית $82.9^\circ$ צפונית למזרח.

  - id: W-2.1-02
    level: basic
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      אוטובוס עומד בתחנה, וכדור מונח על הרצפה שלו. האוטובוס מתחיל לנסוע, והכדור מתגלגל לאחור. נוסע אומר: "כשהאוטובוס
      מתחיל לנסוע, נוצר כוח שדוחף את הכדור לאחור".

      (א) תארו את תנועת הכדור במערכת הקרקע. האם יש עליו כוח אופקי (בהזנחת החיכוך)?

      (ב) מה לא בסדר בטענה של הנוסע?

      (ג) מה היה קורה לכדור אילו האוטובוס היה נוסע כל הזמן במהירות קבועה?
    answer: >-
      (א) הכדור כמעט לא זז ביחס לקרקע; אין עליו כוח אופקי. (ב) אין גוף שמפעיל "כוח לאחור": האוטובוס המאיץ איננו מערכת
      אינרציאלית, ולכן בו כדור בלי כוח מאיץ. (ג) הוא היה נשאר במקומו באוטובוס.
    solution:
      - kind: law
        text: >-
          החוק הראשון מתקיים רק במערכת אינרציאלית. במערכת שתאוצתה $\vec A$, $\vec a\,' = \vec a - \vec A$.
      - kind: reasoning
        text: >-
          (א) במערכת הקרקע אין על הכדור כוח אופקי (הרצפה כמעט לא מושכת אותו אופקית), ולכן הוא שומר על המהירות שלו, אפס. האוטובוס
          זז קדימה מתחתיו.
      - kind: reasoning
        text: >-
          (ב) לכל כוח יש גוף שמפעיל אותו; ל"כוח לאחור" אין. במערכת האוטובוס $\vec a\,' = 0 - \vec A = -\vec A$: הכדור מאיץ לאחור בלי
          כוח, כלומר החוק הראשון לא מתקיים שם. זו בדיוק ההגדרה של מערכת שאיננה אינרציאלית, לא סימן לכוח חדש.
      - kind: limit
        text: >-
          (ג) כש-$\vec A \to 0$, $\vec a\,' \to 0$: באוטובוס שנוסע במהירות קבועה הכדור נשאר במקומו, כמו בתחנה.
      - kind: result
        text: >-
          (א) ביחס לקרקע הכדור כמעט נשאר במקום, בלי כוח אופקי. (ב) הנוסע כותב חוק של ניוטון במערכת שאיננה אינרציאלית. (ג) הכדור
          היה נשאר במקומו.

  - id: W-2.1-03
    level: basic
    objectives: [OBJ-2.1-2]
    prompt: >-
      ארגז שמסתו $12\,\text{kg}$ מונח על משטח אופקי חלק. תאוצת הנפילה על הירח היא
      $g_M = \dfrac{G_N M_M}{R_M^2}$, עם $M_M = 7.35\cdot10^{22}\,\text{kg}$ ו-$R_M = 1.74\cdot10^{6}\,\text{m}$.

      (א) מה המשקל של הארגז על כדור הארץ ועל הירח?

      (ב) באיזה כוח אופקי צריך לדחוף אותו כדי לתת לו תאוצה של $0.50\,\text{m/s}^2$, על כדור הארץ ועל הירח?
    answer: >-
      (א) $118\,\text{N}$ על כדור הארץ, $19.4\,\text{N}$ על הירח. (ב) $6.0\,\text{N}$ בשני המקומות.
    solution:
      - kind: given
        text: >-
          $m = 12\,\text{kg}$, $g = 9.8\,\text{m/s}^2$, $G_N = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$.
      - kind: law
        text: >-
          המשקל הוא הכוח $mg$, והוא תלוי ב-$g$ המקומי. בכיוון האופקי, $\sum F_x = ma_x$, עם אותה מסה בכל מקום.
      - kind: manipulation
        text: >-
          $g_M = \dfrac{6.67\cdot10^{-11}\cdot7.35\cdot10^{22}}{\left(1.74\cdot10^{6}\right)^2} = 1.62\,\text{m/s}^2$. המשקלים $mg$ ו-$mg_M$; הכוח
          האופקי $F = ma$, בלי $g$.
      - kind: limit
        text: >-
          גם בחלל, כש-$g \to 0$ והמשקל אפס, נדרש אותו $F = ma$: המשקל אינו מה שמתנגד לשינוי מהירות.
      - kind: units
        text: >-
          $\dfrac{\text{N}\cdot\text{m}^2/\text{kg}^2\cdot\text{kg}}{\text{m}^2} = \text{N}/\text{kg} = \text{m/s}^2$.
      - kind: substitution
        text: >-
          $12\cdot9.8 = 118\,\text{N}$, $12\cdot1.62 = 19.4\,\text{N}$, $F = 12\cdot0.50 = 6.0\,\text{N}$.
      - kind: result
        text: >-
          (א) $118\,\text{N}$ ו-$19.4\,\text{N}$: המשקל קטן פי 6 בערך. (ב) $6.0\,\text{N}$ בשני המקומות: המסה זהה.

  - id: W-2.1-04
    level: mid
    objectives: [OBJ-2.1-2]
    prompt: >-
      דסקית שמסתה $1.5\,\text{kg}$ על שולחן אוויר אופקי נעה בתאוצה $\vec a = (2.0,\ -1.0)\,\text{m/s}^2$ (ציר $x$ מזרחה, $y$ צפונה).
      פועלים עליה שני כוחות אופקיים בלבד; אחד מהם ידוע, $\vec F_1 = (4.0,\ 1.0)\,\text{N}$. מה הכוח השני, ברכיבים, בגודל ובכיוון?
    answer: >-
      $\vec F_2 = (-1.0,\ -2.5)\,\text{N}$: $2.69\,\text{N}$, בזווית $68.2^\circ$ דרומית למערב.
    solution:
      - kind: law
        text: >-
          $\vec F_1 + \vec F_2 = m\vec a$, ולכן $\vec F_2 = m\vec a - \vec F_1$, רכיב אחר רכיב.
      - kind: manipulation
        text: >-
          $m\vec a = (3.0,\ -1.5)\,\text{N}$. $F_{2x} = 3.0 - 4.0 = -1.0\,\text{N}$, $F_{2y} = -1.5 - 1.0 = -2.5\,\text{N}$.
      - kind: limit
        text: >-
          אילו $\vec a = 0$, היה יוצא $\vec F_2 = -\vec F_1$: שני כוחות שמבטלים זה את זה. וכאן $\vec F_1$ לבדו היה נותן תאוצה
          $(2.7,\ 0.67)\,\text{m/s}^2$, צפונה, אבל התאוצה בפועל דרומה: הכוח השני חייב למשוך דרומה.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          $|\vec F_2| = \sqrt{1.0^2 + 2.5^2} = 2.69\,\text{N}$, והזווית מתחת לכיוון מערב $\arctan(2.5/1.0) = 68.2^\circ$.
      - kind: result
        text: >-
          $\vec F_2 = (-1.0,\ -2.5)\,\text{N}$, $2.69\,\text{N}$ בזווית $68.2^\circ$ דרומית למערב.

  - id: W-2.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      מעבדה בירושלים, בקו רוחב $31.8^\circ$, מסתובבת עם כדור הארץ ($\omega = 7.29\cdot10^{-5}\,\text{rad/s}$, $R_E = 6.37\cdot10^{6}\,\text{m}$),
      ונעה איתו סביב השמש (מסלול מעגלי ברדיוס $1.5\cdot10^{11}\,\text{m}$, בשנה של $3.156\cdot10^{7}\,\text{s}$).

      (א) מה התאוצה של המעבדה בגלל הסיבוב, ומה בגלל התנועה סביב השמש? השוו ל-$g$.

      (ב) האם המעבדה היא מערכת אינרציאלית לניסוי של כמה שניות בדיוק של 1%? ולניסוי בדיוק של 0.1%?
    answer: >-
      (א) $0.0288\,\text{m/s}^2$ (0.29% של $g$) ו-$5.95\cdot10^{-3}\,\text{m/s}^2$ (0.06%). (ב) בדיוק של 1%, כן; בדיוק של 0.1%, לא:
      את הסיבוב כבר מרגישים.
    solution:
      - kind: given
        text: >-
          נקודה בקו רוחב $\lambda$ נעה במעגל שרדיוסו $R_E\cos\lambda$ סביב הציר. מהירות זוויתית סביב השמש $2\pi/T$.
      - kind: law
        text: >-
          נקודה שנעה במעגל ברדיוס $r$ במהירות זוויתית $\omega$ מאיצה לעבר המרכז ב-$\omega^2r$. מערכת אינרציאלית אם תאוצתה
          קטנה מהדיוק של הניסוי.
      - kind: manipulation
        text: >-
          $a_{\text{rot}} = \omega^2R_E\cos\lambda$, $a_{\text{sun}} = \left(\dfrac{2\pi}{T}\right)^2 R_{\text{orbit}}$.
      - kind: limit
        text: >-
          בקטבים, $\lambda = 90^\circ$, $a_{\text{rot}} = 0$: שם הנקודה לא נעה במעגל אלא רק מסתובבת במקום. על קו המשווה התאוצה
          הגדולה ביותר, $0.0339\,\text{m/s}^2$.
      - kind: substitution
        text: >-
          $a_{\text{rot}} = 0.0339\cdot\cos31.8^\circ = 0.0288\,\text{m/s}^2$, $0.29\%$ של $g$. $a_{\text{sun}} = 5.95\cdot10^{-3}\,\text{m/s}^2$, $0.06\%$.
      - kind: reasoning
        text: >-
          (ב) בדיוק של 1% שתי התאוצות קטנות מספיק. בדיוק של 0.1% התאוצה של הסיבוב, 0.29%, גדולה מהדיוק: גוף "בלי כוח" ייראה
          מאיץ מעט, והמעבדה כבר איננה אינרציאלית.
      - kind: result
        text: >-
          (א) $0.0288\,\text{m/s}^2$ ו-$5.95\cdot10^{-3}\,\text{m/s}^2$. (ב) אינרציאלית בדיוק של 1%, לא בדיוק של 0.1%.

  - id: W-2.1-06
    level: mid
    objectives: [OBJ-2.1-2]
    prompt: >-
      ארגז שמסתו $20\,\text{kg}$ מונח על רצפה אופקית חלקה. מושכים אותו בחבל בכוח $50\,\text{N}$, בזווית $30^\circ$ מעל האופק.

      (א) מה התאוצה של הארגז?

      (ב) מה הכוח שהרצפה מפעילה עליו?

      (ג) מאיזה כוח בחבל, באותה זווית, הארגז מתרומם מהרצפה?
    answer: >-
      (א) $2.17\,\text{m/s}^2$. (ב) $171\,\text{N}$ כלפי מעלה. (ג) $392\,\text{N}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ אופקי בכיוון המשיכה, ציר $y$ כלפי מעלה. $m = 20\,\text{kg}$, $F = 50\,\text{N}$, $\theta = 30^\circ$. הכוחות: החבל, הכובד $mg$,
          והכוח $N$ של הרצפה, כלפי מעלה.
      - kind: law
        text: >-
          $\sum F_x = ma_x$, $\sum F_y = ma_y$ עם $a_y = 0$ כל עוד הארגז על הרצפה.
      - kind: manipulation
        text: >-
          $F\cos\theta = ma_x$, ולכן $a_x = \dfrac{F\cos\theta}{m}$. $N + F\sin\theta - mg = 0$, ולכן $N = mg - F\sin\theta$. הארגז מתרומם כש-$N = 0$:
          $F = \dfrac{mg}{\sin\theta}$.
      - kind: limit
        text: >-
          כש-$\theta = 0$, $a_x = F/m$ ו-$N = mg$: משיכה אופקית לא משנה את הכוח של הרצפה. כש-$\theta \to 90^\circ$ אין תאוצה אופקית,
          וכל הכוח מקטין את $N$.
      - kind: units
        text: >-
          $\text{N}/\text{kg} = \text{m/s}^2$; $N$ ו-$mg/\sin\theta$ בניוטון.
      - kind: substitution
        text: >-
          $a_x = \dfrac{50\cdot0.866}{20} = 2.17\,\text{m/s}^2$. $N = 196 - 25 = 171\,\text{N}$. $F = \dfrac{196}{0.5} = 392\,\text{N}$.
      - kind: result
        text: >-
          (א) $2.17\,\text{m/s}^2$. (ב) $171\,\text{N}$, פחות מ-$mg = 196\,\text{N}$, כי החבל מרים חלק מהמשקל. (ג) $392\,\text{N}$.

  - id: W-2.1-07
    level: mid
    objectives: [OBJ-2.1-1, OBJ-2.1-2]
    prompt: >-
      מטוס מתחיל להאיץ על המסלול ממנוחה, בתאוצה קבועה של $3.0\,\text{m/s}^2$. על מגש חלק לגמרי, אופקי, מונח בקבוק,
      $0.30\,\text{m}$ מהשפה האחורית של המגש. מהתקרה תלוי על חוט תג שם.

      (א) תוך כמה זמן מגיע הבקבוק לשפה האחורית? ומה מהירות המטוס אז?

      (ב) בכמה מעלות נוטה החוט של התג מהאנך, ולאיזה כיוון, כשהתג במנוחה ביחס למטוס?

      (ג) באיזו מערכת פתרתם כל סעיף, ולמה?
    answer: >-
      (א) $0.447\,\text{s}$; המטוס נע אז ב-$1.34\,\text{m/s}$. (ב) $17.0^\circ$, לאחור. (ג) במערכת הקרקע, האינרציאלית.
    solution:
      - kind: given
        text: >-
          ציר $x$ בכיוון ההמראה. $A = 3.0\,\text{m/s}^2$, $d = 0.30\,\text{m}$.
      - kind: law
        text: >-
          במערכת הקרקע: $\Sigma\vec F = m\vec a$. על הבקבוק אין כוח אופקי; על התג פועלים הכובד והחוט, והתאוצה שלו $A$.
      - kind: manipulation
        text: >-
          (א) הבקבוק לא מאיץ ביחס לקרקע, והמגש מתקדם $\tfrac12At^2$. השפה מגיעה אליו כש-$\tfrac12At^2 = d$: $t = \sqrt{2d/A}$.
          (ב) $T\sin\theta = mA$, $T\cos\theta = mg$, ולכן $\tan\theta = A/g$.
      - kind: limit
        text: >-
          כש-$A \to 0$, $t \to \infty$ ו-$\theta \to 0$: מטוס שעומד, או נע במהירות קבועה, הוא מערכת אינרציאלית, והבקבוק והתג לא זזים בו.
      - kind: units
        text: >-
          $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$; $A/g$ חסר ממדים.
      - kind: substitution
        text: >-
          $t = \sqrt{0.60/3.0} = 0.447\,\text{s}$, $v = 3.0\cdot0.447 = 1.34\,\text{m/s}$. $\theta = \arctan(3.0/9.8) = 17.0^\circ$.
      - kind: result
        text: >-
          (א) $0.447\,\text{s}$, כשהמטוס נע ב-$1.34\,\text{m/s}$. (ב) $17.0^\circ$, החוט נוטה לאחור: רכיב המתיחות קדימה הוא מה שמאיץ את
          התג. (ג) במערכת הקרקע: במטוס המאיץ החוק השני לא מתקיים.

  - id: W-2.1-08
    level: bagrut
    objectives: [OBJ-2.1-2]
    prompt: >-
      על גוף שמסתו $5.0\,\text{kg}$, על משטח אופקי חלק, פועלים שני כוחות אופקיים, והוא מאיץ צפונה ב-$2.0\,\text{m/s}^2$. הכוח
      הראשון, $\vec F_1$, שגודלו $20\,\text{N}$, פונה בזווית $30^\circ$ מזרחית לצפון.

      (א) מה הכוח השני, בגודל ובכיוון?

      (ב) נניח שאפשר לשנות את **הגודל** של $\vec F_1$, אבל לא את הכיוון שלו. מה הגודל הקטן ביותר של הכוח השני שעדיין
      נותן את אותה תאוצה? מה גודל $\vec F_1$ אז, ולאן פונה הכוח השני?
    answer: >-
      (א) $12.4\,\text{N}$, בזווית $36.2^\circ$ דרומית למערב. (ב) $5.0\,\text{N}$, ניצב ל-$\vec F_1$ (לכיוון צפון-מערב, $30^\circ$ צפונית
      למערב), כש-$F_1 = 8.66\,\text{N}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה וציר $y$ צפונה. $m\vec a = (0,\ 10)\,\text{N}$. $\vec F_1 = 20\,(\sin30^\circ,\ \cos30^\circ) = (10,\ 17.3)\,\text{N}$.
      - kind: law
        text: >-
          $\vec F_1 + \vec F_2 = m\vec a$, ולכן $\vec F_2 = m\vec a - \vec F_1$.
      - kind: manipulation
        text: >-
          (א) $\vec F_2 = (0 - 10,\ 10 - 17.3) = (-10,\ -7.32)\,\text{N}$. (ב) עם $\vec F_1 = F_1\hat u$, $\hat u = (\sin30^\circ,\ \cos30^\circ)$:
          $\vec F_2 = m\vec a - F_1\hat u$. זה המרחק מנקודה, $m\vec a$, לנקודה על הקו שמכוון לאורך $\hat u$, והוא הקטן ביותר כשהוא ניצב
          לקו: $F_1 = m\vec a\cdot\hat u$ ו-$|\vec F_2|_{\min} = |m\vec a\times\hat u| = ma\sin30^\circ$.
      - kind: limit
        text: >-
          אילו $\vec F_1$ היה פונה צפונה בדיוק (זווית $0^\circ$), $|\vec F_2|_{\min} = 0$: הכוח הראשון לבדו מספיק. אילו היה ניצב לצפון
          ($90^\circ$), $|\vec F_2|_{\min} = ma$: הוא לא יכול לעזור בכלל.
      - kind: units
        text: >-
          כל האיברים בניוטון.
      - kind: substitution
        text: >-
          (א) $|\vec F_2| = \sqrt{10^2 + 7.32^2} = 12.4\,\text{N}$, $\arctan(7.32/10) = 36.2^\circ$ מתחת לכיוון מערב. (ב) $F_1 = 10\cos30^\circ = 8.66\,\text{N}$,
          $|\vec F_2|_{\min} = 10\sin30^\circ = 5.0\,\text{N}$, ו-$\vec F_2 = (-4.33,\ 2.50)\,\text{N}$.
      - kind: result
        text: >-
          (א) $12.4\,\text{N}$, $36.2^\circ$ דרומית למערב. (ב) $5.0\,\text{N}$, בכיוון $30^\circ$ צפונית למערב, ניצב ל-$\vec F_1$, כש-$F_1 = 8.66\,\text{N}$.

  - id: W-2.1-09
    level: bagrut
    qualitative: true
    objectives: [OBJ-2.1-1]
    prompt: >-
      מעלית תלויה בכבל. נוסעת משחררת כדור ממנוחה ביחס למעלית, $1.5\,\text{m}$ מעל הרצפה.

      (א) הכבל נקרע והמעלית נופלת חופשית. הנוסעת רואה את הכדור צף לידה. היא מסיקה: "המעלית היא מערכת אינרציאלית, כי
      הכדור נשאר במנוחה". מה התשובה, במכניקה של הפרק הזה?

      (ב) במקום זה המעלית מאיצה כלפי מעלה ב-$2.0\,\text{m/s}^2$. מה התאוצה של הכדור ביחס למעלית, ותוך כמה זמן הוא פוגע
      ברצפה? השוו למעלית שעומדת.
    answer: >-
      (א) לא: על הכדור פועל כוח הכובד, והוא לא מאיץ ביחס למעלית, כלומר החוק השני לא מתקיים בה. (ב) $11.8\,\text{m/s}^2$ כלפי
      מטה; $0.504\,\text{s}$, לעומת $0.553\,\text{s}$.
    solution:
      - kind: law
        text: >-
          במערכת שתאוצתה $\vec A$, $\vec a\,' = \vec a - \vec A$. במערכת הבניין, האינרציאלית, הכדור המשוחרר נופל ב-$\vec g$.
      - kind: reasoning
        text: >-
          (א) המעלית הנופלת מאיצה ב-$\vec A = \vec g$, ולכן $\vec a\,' = \vec g - \vec g = 0$. אבל על הכדור פועל כוח, $m\vec g$: כוח בלי
          תאוצה. החוק הראשון "מתקיים" רק במקרה, לכל גוף שעליו פועל רק כובד; כוח אחר, כמו קפיץ, היה נותן תאוצה שלא מתאימה
          ל-$\Sigma\vec F = m\vec a\,'$. המעלית איננה אינרציאלית.
      - kind: manipulation
        text: >-
          (ב) ציר כלפי מעלה. $\vec a = -g$, $A = +2.0\,\text{m/s}^2$, ולכן $a' = -(g + A)$. הזמן $t = \sqrt{\dfrac{2h}{g + A}}$.
      - kind: limit
        text: >-
          כש-$A \to 0$, $t = \sqrt{2h/g}$, כמו בבניין. כש-$A \to -g$ (נפילה חופשית), $t \to \infty$: הכדור לא מגיע לרצפה, כמו ב-(א).
      - kind: units
        text: >-
          $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$.
      - kind: substitution
        text: >-
          $g + A = 11.8\,\text{m/s}^2$, $t = \sqrt{3.0/11.8} = 0.504\,\text{s}$; במעלית שעומדת $\sqrt{3.0/9.8} = 0.553\,\text{s}$.
      - kind: result
        text: >-
          (א) המעלית הנופלת איננה אינרציאלית: על הכדור פועל כוח והוא לא מאיץ בה. (ב) $11.8\,\text{m/s}^2$ כלפי מטה, ופגיעה אחרי
          $0.504\,\text{s}$ במקום $0.553\,\text{s}$.

  - id: W-2.1-10
    level: bagrut
    objectives: [OBJ-2.1-2]
    prompt: >-
      דסקית נעה על שולחן אוויר אופקי צפונה, ב-$0.50\,\text{m/s}$. מרגע מסוים פועל עליה כוח קבוע, $0.60\,\text{N}$ מזרחה. אחרי
      $2.0\,\text{s}$ היא זזה $1.2\,\text{m}$ מזרחה.

      (א) מה המסה של הדסקית?

      (ב) איפה היא נמצאת אחרי $2.0\,\text{s}$, ומה המהירות שלה אז, בגודל ובכיוון?

      (ג) האם התאוצה פונה בכיוון המהירות? מה צורת המסלול?
    answer: >-
      (א) $1.0\,\text{kg}$. (ב) $(1.2,\ 1.0)\,\text{m}$ מנקודת ההתחלה; $1.30\,\text{m/s}$, $67.4^\circ$ מזרחית לצפון. (ג) לא: התאוצה מזרחה
      כל הזמן; המסלול פרבולה.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה וציר $y$ צפונה, הראשית במקום ההתחלתי. $\vec v_0 = (0,\ 0.50)\,\text{m/s}$, $\vec F = (0.60,\ 0)\,\text{N}$, $x(2.0\,\text{s}) = 1.2\,\text{m}$.
      - kind: law
        text: >-
          $\Sigma\vec F = m\vec a$ ברכיבים. כוח קבוע נותן תאוצה קבועה, ולכן $x = \tfrac12a_xt^2$, $y = v_0t$.
      - kind: manipulation
        text: >-
          $a_x = \dfrac{2x}{t^2}$, ולכן $m = \dfrac{F}{a_x} = \dfrac{Ft^2}{2x}$. ב-$y$ אין כוח: $a_y = 0$ ו-$v_y = v_0$. $v_x = a_xt$.
      - kind: limit
        text: >-
          מסה כפולה הייתה נותנת חצי מההעתק מזרחה באותו זמן. ובלי כוח, $F \to 0$, הדסקית הייתה ממשיכה ישר צפונה: רק הכוח מעקם
          את המסלול.
      - kind: units
        text: >-
          $\dfrac{\text{N}\cdot\text{s}^2}{\text{m}} = \dfrac{\text{kg}\cdot\text{m/s}^2\cdot\text{s}^2}{\text{m}} = \text{kg}$.
      - kind: substitution
        text: >-
          $a_x = \dfrac{2\cdot1.2}{4.0} = 0.60\,\text{m/s}^2$, $m = \dfrac{0.60}{0.60} = 1.0\,\text{kg}$. $y = 0.50\cdot2.0 = 1.0\,\text{m}$. $\vec v = (1.2,\ 0.50)\,\text{m/s}$,
          $|\vec v| = 1.30\,\text{m/s}$, $\arctan(1.2/0.50) = 67.4^\circ$ מהצפון.
      - kind: result
        text: >-
          (א) $1.0\,\text{kg}$. (ב) $1.2\,\text{m}$ מזרחה ו-$1.0\,\text{m}$ צפונה; $1.30\,\text{m/s}$ בזווית $67.4^\circ$ מזרחית לצפון. (ג) התאוצה
          מזרחה, בכיוון הכוח, ולא בכיוון המהירות; המסלול פרבולה, $x \propto y^2$.

challenge:
  - id: W-2.1-c1
    stars: 2
    objectives: [OBJ-2.1-2, OBJ-2.1-1]
    prompt: >-
      משאית נוסעת בקו ישר על כביש אופקי, ומאיצה בתאוצה קבועה שגודלה $a$. חבל קל ולא מתמתח קשור לגב המשאית, ובקצה השני שלו
      תלוי דלי שמסתו $M$. בהתחלה הדלי מיטלטל, אבל אחר כך הוא נשאר במרחק קבוע מאחורי המשאית, והחבל נטוי בזווית קבועה.

      (א) מה הזווית $\theta$ בין החבל לבין הדלת האחורית של המשאית (שהיא אנכית)? מה המתיחות בחבל? בטאו באמצעות $M$, $g$, $a$.

      (ב) המשאית מגיעה לקטע של ירידה, בזווית $\alpha$ מתחת לאופק, וממשיכה להאיץ באותה תאוצה $a$, לאורך הכביש. מה הזווית
      החדשה בין החבל לבין הדלת האחורית (שעכשיו ניצבת לכביש), ומה המתיחות?

      (ג) הציבו $a = 2.0\,\text{m/s}^2$, $\alpha = 10^\circ$, $M = 5.0\,\text{kg}$. באיזו תאוצה החבל ניצב לכביש בירידה?
    answer: >-
      (א) $\tan\theta = a/g$, $T = M\sqrt{a^2 + g^2}$. (ב) $\tan\theta = \dfrac{a - g\sin\alpha}{g\cos\alpha}$, $T = M\sqrt{a^2 + g^2 - 2ag\sin\alpha}$.
      (ג) $11.5^\circ$ ו-$50.0\,\text{N}$ במישור; $1.77^\circ$ ו-$48.3\,\text{N}$ בירידה; החבל ניצב לכביש כש-$a = g\sin\alpha = 1.70\,\text{m/s}^2$.
    solution:
      - kind: given
        text: >-
          מערכת הקרקע, האינרציאלית; לא מערכת המשאית, שמאיצה. כשהזווית קבועה, לדלי אותה תאוצה כמו למשאית. על הדלי פועלים הכובד
          $M\vec g$ והמתיחות $\vec T$, לאורך החבל.
      - kind: law
        text: >-
          $\vec T + M\vec g = M\vec a$, ולכן $\vec T = M\left(\vec a - \vec g\right)$: את הכיוון של החבל קובע הווקטור $\vec a - \vec g$.
      - kind: manipulation
        text: >-
          (א) ציר $x$ קדימה ו-$y$ למעלה: $\vec a - \vec g = (a,\ g)$. החבל נוטה מהאנך בזווית $\tan\theta = a/g$, והמתיחות $M\sqrt{a^2 + g^2}$.
          (ב) צירים לאורך הכביש (קדימה, במורד) וניצב לו: $\vec a = (a,\ 0)$ ו-$\vec g = (g\sin\alpha,\ -g\cos\alpha)$, ולכן
          $\vec a - \vec g = \left(a - g\sin\alpha,\ g\cos\alpha\right)$. הדלת ניצבת לכביש, ולכן $\tan\theta = \dfrac{a - g\sin\alpha}{g\cos\alpha}$, ו-
          $T = M\sqrt{\left(a - g\sin\alpha\right)^2 + g^2\cos^2\alpha} = M\sqrt{a^2 + g^2 - 2ag\sin\alpha}$.
      - kind: limit
        text: >-
          כש-$\alpha \to 0$, (ב) חוזר ל-(א). כש-$a \to 0$ במישור, החבל אנכי ו-$T = Mg$. בירידה, כש-$a = g\sin\alpha$, המשאית מאיצה בדיוק
          כמו גוף שמחליק בלי חיכוך במורד, החבל ניצב לכביש ו-$T = Mg\cos\alpha$. כש-$a < g\sin\alpha$ הנוסחה נותנת $\theta < 0$,
          כלומר דלי שנוטה קדימה, אל תוך הדלת. זה בלתי אפשרי: הדלי נשען על הדלת, והדלת דוחפת אותו בכוח נורמלי שהמודל שלנו
          (רק כובד ומתיחות) לא כולל. שם המודל נכשל, והפתרון שלו לא תקף.
      - kind: units
        text: >-
          $a/g$ חסר ממדים; $M\sqrt{a^2 + g^2}$ ביחידות $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          במישור: $\arctan(2.0/9.8) = 11.5^\circ$, $T = 5.0\cdot10.0 = 50.0\,\text{N}$. בירידה: $\tan\theta = \dfrac{2.0 - 1.70}{9.65} = 0.031$,
          $\theta = 1.77^\circ$; $T = 5.0\sqrt{4.0 + 96.0 - 6.81} = 48.3\,\text{N}$. והתאוצה שבה החבל ניצב: $9.8\sin10^\circ = 1.70\,\text{m/s}^2$.
      - kind: result
        text: >-
          (א) $\theta = \arctan(a/g)$ מהדלת, החבל נוטה לאחור, ו-$T = M\sqrt{a^2 + g^2}$. (ב) $\tan\theta = \dfrac{a - g\sin\alpha}{g\cos\alpha}$,
          $T = M\sqrt{a^2 + g^2 - 2ag\sin\alpha}$. (ג) $11.5^\circ$, $50.0\,\text{N}$; $1.77^\circ$, $48.3\,\text{N}$; $1.70\,\text{m/s}^2$.
    source:
      name: MIT OpenCourseWare 8.01SC Classical Mechanics (Fall 2016), Problem Set 2
      year: 2016
      problem: 'Problem 2 (Accelerating Truck and Suspended Bucket)'
      url: https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/1ebafbf9c9cca8e1ab191ad5ad9026e0_MIT8_01F16_pset2.pdf
      verified: '2026-11-09'
      adapted: true

  - id: W-2.1-c2
    stars: 1
    objectives: [OBJ-2.1-1]
    prompt: >-
      כדי לאמן אסטרונאוטים בחוסר משקל, נאס"א מטיסה מטוס במסלול פרבולי, בתאוצה קבועה $g$ כלפי הקרקע. המטוס יכול להישאר
      במסלול הזה $25\,\text{s}$ לכל היותר, בגלל השינוי הגדול בגובה שהוא דורש.

      (א) למה גוף שמשתחרר בתא נשאר בו במנוחה? האם התא הוא מערכת ייחוס אינרציאלית?

      (ב) עכשיו רוצים לדמות בתא את תאוצת הנפילה של מאדים, $3.7\,\text{m/s}^2$: גוף שמשתחרר בתא צריך ליפול ביחס לתא בתאוצה
      הזו. באיזו תאוצה כלפי מטה צריך המטוס לנוע?

      (ג) אם השינוי הגדול ביותר בגובה זהה בשני המסלולים, כמה זמן אפשר לדמות את הכובד של מאדים?
    answer: >-
      (א) הגוף והמטוס נופלים יחד באותה תאוצה $g$; התא איננו אינרציאלי. (ב) $6.1\,\text{m/s}^2$. (ג) $31.7\,\text{s}$ (במקור, עם
      $g = 10\,\text{m/s}^2$: כ-$31\,\text{s}$).
    solution:
      - kind: law
        text: >-
          במערכת הקרקע, האינרציאלית, גוף משוחרר נופל ב-$\vec g$. במערכת התא, שתאוצתו $\vec a_p$: $\vec a\,' = \vec g - \vec a_p$.
      - kind: reasoning
        text: >-
          (א) כש-$\vec a_p = \vec g$, $\vec a\,' = 0$: הגוף צף, אף שכוח הכובד פועל עליו. כוח בלי תאוצה: החוק השני לא מתקיים בתא, והוא
          איננו אינרציאלי.
      - kind: manipulation
        text: >-
          (ב) ציר כלפי מטה: $g - a_p = g_{\text{Mars}}$, ולכן $a_p = g - g_{\text{Mars}}$. (ג) במסלול שבו הרכיב האנכי של המהירות מתהפך
          מ-$+v_y$ ל-$-v_y$, הזמן $T = \dfrac{2v_y}{a_p}$ והשינוי הגדול ביותר בגובה $H = \dfrac{v_y^2}{2a_p}$. ב-$H$ קבוע, $v_y = \sqrt{2Ha_p}$ ו-
          $T = 2\sqrt{\dfrac{2H}{a_p}}$, כלומר $T \propto a_p^{-1/2}$, ו-$T = T_0\sqrt{\dfrac{g}{g - g_{\text{Mars}}}}$.
      - kind: limit
        text: >-
          כש-$g_{\text{Mars}} \to 0$, $T \to T_0$: חוזרים לחוסר משקל. כש-$g_{\text{Mars}} \to g$, $a_p \to 0$ ו-$T \to \infty$: מטוס בטיסה ישרה
          "מדמה" את כדור הארץ כמה זמן שרוצים.
      - kind: units
        text: >-
          $\sqrt{(\text{m/s}^2)/(\text{m/s}^2)}$ חסר ממדים, ולכן $T$ בשניות.
      - kind: substitution
        text: >-
          $a_p = 9.8 - 3.7 = 6.1\,\text{m/s}^2$. $T = 25\sqrt{\dfrac{9.8}{6.1}} = 31.7\,\text{s}$.
      - kind: result
        text: >-
          (א) הגוף והתא נופלים יחד; התא איננו אינרציאלי. (ב) $6.1\,\text{m/s}^2$ כלפי מטה. (ג) $31.7\,\text{s}$.
    source:
      name: AAPT F = ma Exam
      year: 2021
      problem: 'Question 9 (parabolic flight that simulates weightlessness, then Mars gravity)'
      url: https://www.aapt.org/physicsteam/upload/F-ma-2021.pdf
      verified: '2026-11-09'
      adapted: true

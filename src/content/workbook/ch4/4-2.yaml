lesson: '4.2'
practice:
  - id: W-4.2-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.2-1]
    prompt: >-
      שני גופים מתנגשים חזיתית על מסילה בלי חיכוך. לכל משפט, קבעו אם הוא נכון ונמקו.

      א. במערכת מרכז המסה התנע הכולל אפס, לפני ההתנגשות ואחריה.

      ב. מהירות מרכז המסה היא הממוצע של מהירויות הגופים.

      ג. בזמן ההתנגשות מערכת מרכז המסה מאיצה, כי הגופים מפעילים זה על זה כוחות גדולים.

      ד. המהירויות שמקבלים במערכת מרכז המסה אחרי ההתנגשות הן גם המהירויות במערכת המעבדה.
    answer: >-
      א. נכון. ב. לא נכון: ממוצע משוקלל במסות. ג. לא נכון: הכוחות פנימיים ומתבטלים. ד. לא נכון: מוסיפים לכל מהירות את $V$.
    solution:
      - kind: law
        text: >-
          $V = \dfrac{m_1v_1 + m_2v_2}{m_1 + m_2} = P/M$; בלי כוח חיצוני $P$ נשמר. במערכת מרכז המסה $u_i = v_i - V$.
      - kind: reasoning
        text: >-
          א: $m_1u_1 + m_2u_2 = P - MV = 0$, ובאותה דרך אחרי ההתנגשות, כי $P$ ו-$V$ לא משתנים. ב: הממוצע הפשוט שווה ל-$V$
          רק כשהמסות שוות. ג: הכוחות בין הגופים הם זוג של פעולה ותגובה, ובסכום הם מתבטלים, ולכן $V$ קבועה והמערכת
          אינרציאלית. ד: $u_i'$ היא מהירות ביחס למרכז המסה; במעבדה $v_i' = u_i' + V$.
      - kind: limit
        text: >-
          כש-$V = 0$ שתי המערכות הן אחת, ורק אז המשפט ד נכון.
      - kind: units
        text: >-
          $P/M$ ב-$\text{kg}\cdot\text{m/s}/\text{kg} = \text{m/s}$, מהירות.
      - kind: result
        text: >-
          א נכון; ב, ג ו-ד לא נכונים.

  - id: W-4.2-02
    level: basic
    objectives: [OBJ-4.2-1]
    prompt: >-
      על מסילה בלי חיכוך, כדור בעל מסה $0.50\,\text{kg}$ נע ימינה במהירות $6.0\,\text{m/s}$ אל כדור בעל מסה $2.5\,\text{kg}$
      שעומד.

      א. מה מהירות מרכז המסה, ומה מהירות כל כדור במערכת מרכז המסה? מה התנע של כל כדור במערכת הזו?

      ב. ההתנגשות אלסטית. מה המהירויות במעבדה אחריה?
    answer: >-
      א. $V = 1.0\,\text{m/s}$; $u_1 = 5.0$ ו-$u_2 = -1.0\,\text{m/s}$; התנעים $2.5$ ו-$(-2.5)\,\text{kg}\cdot\text{m/s}$.

      ב. $v_1' = -4.0\,\text{m/s}$, $v_2' = 2.0\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          הציר $x$ ימינה. $m_1 = 0.50\,\text{kg}$, $v_1 = 6.0\,\text{m/s}$; $m_2 = 2.5\,\text{kg}$, $v_2 = 0$; $e = 1$.
      - kind: law
        text: >-
          $V = P/M$, $u_i = v_i - V$, $u_i' = -e\,u_i$, $v_i' = u_i' + V$.
      - kind: manipulation
        text: >-
          כשגוף 2 עומד, $u_2 = -V$ ו-$u_1 = v_1 - V = \dfrac{m_2}{M}\,v_1$.
      - kind: limit
        text: >-
          אילו הכדור השני היה כבד מאוד, $V \to 0$ והכדור הראשון היה חוזר במהירות $6.0\,\text{m/s}$, כמו מקיר.
      - kind: units
        text: >-
          כל המהירויות ב-$\text{m/s}$, והתנעים ב-$\text{kg}\cdot\text{m/s}$.
      - kind: substitution
        text: >-
          $V = \dfrac{0.50\cdot6.0}{3.0} = 1.0\,\text{m/s}$; $u_1 = 5.0$, $u_2 = -1.0\,\text{m/s}$; $0.50\cdot5.0 = 2.5$ ו-$2.5\cdot(-1.0) = -2.5\,\text{kg}\cdot\text{m/s}$.
          אחרי ההתנגשות $u_1' = -5.0$ ו-$u_2' = 1.0$, ולכן $v_1' = -4.0$ ו-$v_2' = 2.0\,\text{m/s}$.
      - kind: result
        text: >-
          א. $V = 1.0\,\text{m/s}$, $u_1 = 5.0$, $u_2 = -1.0\,\text{m/s}$, תנעים $\pm2.5\,\text{kg}\cdot\text{m/s}$. ב. $v_1' = -4.0\,\text{m/s}$, $v_2' = 2.0\,\text{m/s}$.

  - id: W-4.2-03
    level: basic
    objectives: [OBJ-4.2-2]
    prompt: >-
      גוף בעל מסה $2.0\,\text{kg}$ נע ימינה במהירות $3.0\,\text{m/s}$, וגוף בעל מסה $1.0\,\text{kg}$ נע שמאלה במהירות
      $3.0\,\text{m/s}$. חשבו את האנרגיה של מרכז המסה, $\tfrac12MV^2$, ואת האנרגיה של התנועה היחסית, $\tfrac12\mu v_{\text{rel}}^2$,
      ובדקו שסכומן הוא האנרגיה הקינטית הכוללת.
    answer: >-
      $\tfrac12MV^2 = 1.5\,\text{J}$, $\tfrac12\mu v_{\text{rel}}^2 = 12\,\text{J}$, והסכום $13.5\,\text{J}$.
    solution:
      - kind: given
        text: >-
          הציר $x$ ימינה. $m_1 = 2.0\,\text{kg}$, $v_1 = 3.0\,\text{m/s}$; $m_2 = 1.0\,\text{kg}$, $v_2 = -3.0\,\text{m/s}$.
      - kind: law
        text: >-
          $K = \tfrac12MV^2 + \tfrac12\mu v_{\text{rel}}^2$, עם $\mu = \dfrac{m_1m_2}{m_1 + m_2}$ ו-$v_{\text{rel}} = v_1 - v_2$.
      - kind: manipulation
        text: >-
          $V = \dfrac{m_1v_1 + m_2v_2}{M}$. המהירות היחסית היא הפרש עם סימנים: גופים שנעים זה אל זה מתקרבים בסכום הגדלים.
      - kind: limit
        text: >-
          אילו הגופים נעו באותה מהירות, $v_{\text{rel}} = 0$ וכל האנרגיה הייתה של מרכז המסה.
      - kind: units
        text: >-
          $\text{kg}\cdot\left(\text{m/s}\right)^2 = \text{J}$.
      - kind: substitution
        text: >-
          $M = 3.0\,\text{kg}$, $V = \dfrac{6.0 - 3.0}{3.0} = 1.0\,\text{m/s}$, $\tfrac12MV^2 = 1.5\,\text{J}$. $\mu = \dfrac{2.0}{3.0} = 0.667\,\text{kg}$,
          $v_{\text{rel}} = 6.0\,\text{m/s}$, $\tfrac12\mu v_{\text{rel}}^2 = 12\,\text{J}$. בדיקה: $\tfrac12\cdot2.0\cdot9.0 + \tfrac12\cdot1.0\cdot9.0 = 13.5\,\text{J}$.
      - kind: result
        text: >-
          $1.5\,\text{J} + 12\,\text{J} = 13.5\,\text{J}$, האנרגיה הקינטית הכוללת.

  - id: W-4.2-04
    level: mid
    objectives: [OBJ-4.2-1]
    prompt: >-
      על מסילה בלי חיכוך, עגלה בעלת מסה $0.30\,\text{kg}$ נעה ימינה במהירות $2.0\,\text{m/s}$, ועגלה בעלת מסה $0.10\,\text{kg}$
      נעה שמאלה במהירות $6.0\,\text{m/s}$. העגלות מתנגשות התנגשות אלסטית. מצאו את המהירויות שלהן אחרי ההתנגשות, וחשבו כמה
      שפחות.
    answer: >-
      $v_1' = -2.0\,\text{m/s}$, $v_2' = 6.0\,\text{m/s}$: כל עגלה חוזרת במהירות שבה הגיעה.
    solution:
      - kind: given
        text: >-
          הציר $x$ ימינה. $m_1 = 0.30\,\text{kg}$, $v_1 = 2.0\,\text{m/s}$; $m_2 = 0.10\,\text{kg}$, $v_2 = -6.0\,\text{m/s}$; $e = 1$.
      - kind: law
        text: >-
          $V = P/M$; במערכת מרכז המסה, בהתנגשות אלסטית, $u_i' = -u_i$.
      - kind: reasoning
        text: >-
          $P = 0.30\cdot2.0 + 0.10\cdot(-6.0) = 0$, ולכן $V = 0$: המעבדה היא מערכת מרכז המסה, ו-$u_i = v_i$. אין צורך לעבור
          למערכת אחרת: כל מהירות פשוט מתהפכת.
      - kind: limit
        text: >-
          אם $V$ לא הייתה בדיוק אפס, היה צריך להוסיף אותה בסוף. כש-$V = 0$ גם $\tfrac12MV^2 = 0$, וכל האנרגיה הקינטית היא יחסית.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}$ לתנע, $\text{m/s}$ למהירויות.
      - kind: substitution
        text: >-
          $v_1' = -2.0\,\text{m/s}$ ו-$v_2' = 6.0\,\text{m/s}$. בדיקה: $0.30\cdot(-2.0) + 0.10\cdot6.0 = 0$, והאנרגיה $2.4\,\text{J}$ לפני ואחרי.
      - kind: result
        text: >-
          $v_1' = -2.0\,\text{m/s}$, $v_2' = 6.0\,\text{m/s}$.

  - id: W-4.2-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.2-1]
    prompt: >-
      שני גופים מתנגשים חזיתית, וההתנגשות מצוירת במערכת מרכז המסה.

      א. שרטטו את חצי המהירות במערכת מרכז המסה לפני ההתנגשות ואחריה, עבור $e = 1$, $e = 0.5$ ו-$e = 0$.

      ב. תלמיד טוען: "במערכת מרכז המסה התנע הכולל אפס, לכן אחרי ההתנגשות שני הגופים עומדים בה". מה נכון בטענה, ומה
      לא?
    answer: >-
      א. לפני: חצים מנוגדים, באורכים ביחס הפוך למסות. אחרי: הפוכים, באורך פי $e$; עם $e = 0$ אין חצים.

      ב. התנע הכולל אכן אפס תמיד, אבל זה דורש רק שהתנעים יהיו מנוגדים, לא שיתאפסו. הגופים עומדים רק כש-$e = 0$.
    solution:
      - kind: law
        text: >-
          במערכת מרכז המסה $m_1u_1 = -m_2u_2$, לפני ההתנגשות ואחריה, ו-$u_i' = -e\,u_i$.
      - kind: reasoning
        text: >-
          א: לפני ההתנגשות החצים פונים זה אל זה, והיחס בין האורכים הוא $|u_1|/|u_2| = m_2/m_1$. אחרי ההתנגשות כל חץ מתהפך
          וקטן פי $e$: עם $e = 1$ באותו אורך, עם $e = 0.5$ בחצי האורך, ועם $e = 0$ אפס. ב: התנע הכולל אפס גם כששני
          התנעים שווים ומנוגדים ושונים מאפס. אם הגופים היו עוצרים בהתנגשות אלסטית, האנרגיה הקינטית במערכת הזו,
          שנשמרת, הייתה מתאפסת.
      - kind: limit
        text: >-
          עם $e = 0$ הגופים אכן עומדים במערכת מרכז המסה, ובמעבדה הם נעים יחד במהירות $V$.
      - kind: units
        text: >-
          $e$ חסר ממדים, ולכן $-e\,u_i$ היא מהירות.
      - kind: result
        text: >-
          החצים מתהפכים וקטנים פי $e$; הגופים עומדים במערכת מרכז המסה רק בהתנגשות פלסטית.

  - id: W-4.2-06
    level: mid
    objectives: [OBJ-4.2-1, OBJ-4.2-2]
    prompt: >-
      על משטח חלק, גוש בעל מסה $3.0\,\text{kg}$ נע במהירות $5.0\,\text{m/s}$ ופוגע חזיתית בגוש בעל מסה $2.0\,\text{kg}$ שעומד.
      מקדם התקומה $e = 0.40$.

      א. מצאו את המהירויות אחרי ההתנגשות בעזרת מערכת מרכז המסה.

      ב. כמה אנרגיה קינטית אבדה? חשבו פעם מהנוסחה של האנרגיה הזמינה ופעם ישירות.
    answer: >-
      א. $v_1' = 2.2\,\text{m/s}$, $v_2' = 4.2\,\text{m/s}$.

      ב. $12.6\,\text{J}$.
    solution:
      - kind: given
        text: >-
          הציר בכיוון התנועה של הגוש הראשון. $m_1 = 3.0\,\text{kg}$, $v_1 = 5.0\,\text{m/s}$; $m_2 = 2.0\,\text{kg}$, $v_2 = 0$; $e = 0.40$.
      - kind: law
        text: >-
          המתכון: $V = P/M$, $u_i = v_i - V$, $u_i' = -e\,u_i$, $v_i' = u_i' + V$. האנרגיה שאובדת: $\left(1 - e^2\right)\tfrac12\mu v_{\text{rel}}^2$.
      - kind: manipulation
        text: >-
          $V = 3.0\,\text{m/s}$; $u_1 = 2.0$, $u_2 = -3.0\,\text{m/s}$; $u_1' = -0.80$, $u_2' = 1.20\,\text{m/s}$.
      - kind: limit
        text: >-
          כש-$e = 1$ לא אובד דבר; כש-$e = 0$ אובד כל החלק היחסי, $15\,\text{J}$, והגושים נעים יחד ב-$3.0\,\text{m/s}$.
      - kind: units
        text: >-
          $\text{kg}\cdot\left(\text{m/s}\right)^2 = \text{J}$.
      - kind: substitution
        text: >-
          $v_1' = 2.2$ ו-$v_2' = 4.2\,\text{m/s}$. $\mu = 1.2\,\text{kg}$, $\tfrac12\mu v_{\text{rel}}^2 = \tfrac12\cdot1.2\cdot5.0^2 = 15\,\text{J}$, ואובדים
          $0.84\cdot15 = 12.6\,\text{J}$. ישירות: $K$ לפני $37.5\,\text{J}$, אחרי $\tfrac12\cdot3.0\cdot2.2^2 + \tfrac12\cdot2.0\cdot4.2^2 = 24.9\,\text{J}$.
      - kind: result
        text: >-
          א. $v_1' = 2.2\,\text{m/s}$, $v_2' = 4.2\,\text{m/s}$. ב. $12.6\,\text{J}$ בשתי הדרכים.

  - id: W-4.2-07
    level: mid
    objectives: [OBJ-4.2-2]
    prompt: >-
      בניסוי של מבחן ריסוק, שתי עגלות זהות, כל אחת בעלת מסה $1.2\,\text{kg}$, צריכות להתנגש התנגשות פלסטית שבה יהפכו לפחות
      $15\,\text{J}$ לעיוות.

      א. מה המהירות הקטנה ביותר של כל עגלה אם הן נעות זו אל זו במהירויות שוות?

      ב. מה המהירות הקטנה ביותר של עגלה אחת אם השנייה עומדת? כמה אנרגיה קינטית צריך לתת למערכת בכל מקרה?
    answer: >-
      א. $3.54\,\text{m/s}$ כל אחת. ב. $7.07\,\text{m/s}$; $15\,\text{J}$ במקרה א לעומת $30\,\text{J}$ במקרה ב.
    solution:
      - kind: given
        text: >-
          $m_1 = m_2 = 1.2\,\text{kg}$, $e = 0$, נדרש $K_{\text{lost}} \ge 15\,\text{J}$.
      - kind: law
        text: >-
          בהתנגשות פלסטית $K_{\text{lost}} = \tfrac12\mu v_{\text{rel}}^2$, עם $\mu = m/2$ למסות שוות.
      - kind: manipulation
        text: >-
          $v_{\text{rel}} = \sqrt{2K_{\text{lost}}/\mu}$. התנאי הוא על המהירות היחסית בלבד: בא, כל עגלה נעה ב-$v_{\text{rel}}/2$; בב, העגלה הנעה ב-$v_{\text{rel}}$.
      - kind: limit
        text: >-
          כשהמהירויות שוות ומנוגדות $V = 0$ וכל האנרגיה זמינה; כשאחת עומדת, $V = v_{\text{rel}}/2$, ומחצית האנרגיה נשארת בתנועה של מרכז המסה.
      - kind: units
        text: >-
          $\sqrt{\text{J}/\text{kg}} = \text{m/s}$.
      - kind: substitution
        text: >-
          $\mu = 0.60\,\text{kg}$, $v_{\text{rel}} = \sqrt{2\cdot15/0.60} = 7.07\,\text{m/s}$. א: $3.54\,\text{m/s}$ כל אחת, $K = 15\,\text{J}$.
          ב: $7.07\,\text{m/s}$, $K = \tfrac12\cdot1.2\cdot7.07^2 = 30\,\text{J}$.
      - kind: result
        text: >-
          א. $3.54\,\text{m/s}$. ב. $7.07\,\text{m/s}$, ופי שניים אנרגיה קינטית לאותו עיוות.

  - id: W-4.2-08
    level: bagrut
    objectives: [OBJ-4.2-1]
    prompt: >-
      על מסילה ישרה בלי חיכוך, עגלה A בעלת מסה $m$ נעה ימינה במהירות $v$ אל עגלה B בעלת מסה $3m$ שעומדת. מימין ל-B אין
      דבר, ומשמאל ל-A, רחוק, יש קיר. ההתנגשות בין העגלות אלסטית, וגם ההתנגשות של עגלה בקיר.

      א. מצאו את המהירויות של העגלות אחרי ההתנגשות ביניהן, בעזרת מערכת מרכז המסה.

      ב. עגלה A פוגעת בקיר וחוזרת. האם היא תשיג את B ותתנגש בה שוב? נמקו.
    answer: >-
      א. $v_A' = -v/2$, $v_B' = v/2$.

      ב. לא: אחרי הקיר A נעה ימינה ב-$v/2$, בדיוק כמו B, והמרחק ביניהן נשאר קבוע.
    solution:
      - kind: given
        text: >-
          הציר $x$ ימינה. $m_A = m$, $v_A = v$; $m_B = 3m$, $v_B = 0$; $e = 1$. הקיר עומד וכבד מאוד.
      - kind: law
        text: >-
          $V = P/M$, $u_i' = -u_i$, $v_i' = u_i' + V$. בהתנגשות אלסטית בקיר עומד המהירות מתהפכת.
      - kind: manipulation
        text: >-
          $V = \dfrac{mv}{4m} = \dfrac v4$. $u_A = \dfrac{3v}{4}$, $u_B = -\dfrac v4$. אחרי ההתנגשות $u_A' = -\dfrac{3v}{4}$, $u_B' = \dfrac v4$, ולכן
          $v_A' = -\dfrac{3v}{4} + \dfrac v4 = -\dfrac v2$ ו-$v_B' = \dfrac v4 + \dfrac v4 = \dfrac v2$.
      - kind: reasoning
        text: >-
          A נעה שמאלה ב-$v/2$, פוגעת בקיר וחוזרת ימינה ב-$v/2$. B נעה ימינה ב-$v/2$. מהירות יחסית אפס: A לא מתקרבת ל-B.
      - kind: limit
        text: >-
          אילו B הייתה כבדה פי יותר משלושה, A הייתה חוזרת מהר יותר מ-B ומשיגה אותה; אילו פחות, A הייתה חוזרת לאט יותר, או
          ממשיכה ימינה בלי לחזור כלל, כש-$m_B \lt m_A$.
      - kind: units
        text: >-
          כל התוצאות הן מספר כפול $v$, ב-$\text{m/s}$.
      - kind: result
        text: >-
          א. $v_A' = -v/2$, $v_B' = v/2$. ב. לא תהיה התנגשות שנייה: שתי העגלות נעות ימינה ב-$v/2$.

  - id: W-4.2-09
    level: bagrut
    objectives: [OBJ-4.2-2]
    prompt: >-
      נפח מכה בפטיש בעל מסה $1.5\,\text{kg}$, במהירות $8.0\,\text{m/s}$, על חתיכת מתכת שמונחת על סדן. בזמן המכה הפטיש, המתכת
      והסדן נעים לרגע יחד, ואפשר לראות את המכה כהתנגשות של הפטיש בגוף אחד שמסתו מסת הסדן. האנרגיה שהופכת לעיוות היא
      שמעצבת את המתכת.

      א. הראו שאם הסדן עומד, החלק הזמין מהאנרגיה של הפטיש הוא $\dfrac{m_2}{m_1 + m_2}$, כאשר $m_1$ מסת הפטיש ו-$m_2$ מסת הסדן.

      ב. חשבו את החלק הזה לסדן של $60\,\text{kg}$ ולסדן של $3.0\,\text{kg}$. למה סדן כבד?

      ג. הפטיש קופץ מעט מהמתכת, עם מקדם תקומה $e = 0.30$. כמה אנרגיה הופכת לעיוות על הסדן הכבד?
    answer: >-
      א. $\tfrac12\mu v^2 / \tfrac12m_1v^2 = \mu/m_1$.

      ב. $0.976$ ו-$0.667$.

      ג. $42.6\,\text{J}$ מתוך $48\,\text{J}$.
    solution:
      - kind: given
        text: >-
          הציר בכיוון התנועה של הפטיש. $m_1 = 1.5\,\text{kg}$, $v_1 = 8.0\,\text{m/s}$, $v_2 = 0$; $m_2 = 60\,\text{kg}$ או $3.0\,\text{kg}$.
      - kind: law
        text: >-
          האנרגיה הזמינה $\tfrac12\mu v_{\text{rel}}^2$, והאנרגיה שאובדת $\left(1 - e^2\right)\tfrac12\mu v_{\text{rel}}^2$.
      - kind: manipulation
        text: >-
          כשהסדן עומד, $v_{\text{rel}} = v_1$, ולכן $\dfrac{\tfrac12\mu v_1^2}{\tfrac12m_1v_1^2} = \dfrac{\mu}{m_1} = \dfrac{m_2}{m_1 + m_2}$.
      - kind: limit
        text: >-
          כש-$m_2 \to \infty$ החלק שואף ל-1: כל האנרגיה של הפטיש זמינה. כש-$m_2 \to 0$ הוא שואף לאפס: הפטיש פשוט דוחף את המתכת
          לפניו.
      - kind: units
        text: >-
          יחס של מסות, חסר ממדים.
      - kind: substitution
        text: >-
          $K = \tfrac12\cdot1.5\cdot8.0^2 = 48\,\text{J}$. $60/61.5 = 0.976$, כלומר $46.8\,\text{J}$ זמינים; $3.0/4.5 = 0.667$, כלומר $32\,\text{J}$.
          עם $e = 0.30$, על הסדן הכבד: $0.91\cdot46.8 = 42.6\,\text{J}$.
      - kind: result
        text: >-
          ב. $0.976$ לעומת $0.667$: סדן כבד הופך כמעט את כל האנרגיה של הפטיש לעבודת עיצוב, וסדן קל מבזבז שליש ממנה על תנועה.
          ג. $42.6\,\text{J}$.

  - id: W-4.2-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.2-2, OBJ-4.2-1]
    prompt: >-
      גוף בעל מסה $0.40\,\text{kg}$ במהירות $3.0\,\text{m/s}$ פוגע בגוף בעל מסה $0.60\,\text{kg}$ שעומד, עם מקדם תקומה $e = 0.50$.

      א. הוכיחו, בעזרת הפירוק $K = \tfrac12MV^2 + \tfrac12\mu v_{\text{rel}}^2$, שהאנרגיה הקינטית שאובדת בהתנגשות זהה בכל
      מערכת ייחוס אינרציאלית, אף שהאנרגיה הקינטית עצמה תלויה במערכת.

      ב. בדקו במספרים: חשבו את האנרגיה הקינטית לפני ההתנגשות ואחריה במערכת המעבדה ובמערכת שנעה עם הגוף הראשון לפני
      ההתנגשות.
    answer: >-
      א. ההתנגשות משנה רק את החלק היחסי, ו-$\mu$ ו-$v_{\text{rel}}$ לא תלויים במערכת.

      ב. מעבדה: $1.8 \to 0.99\,\text{J}$; מערכת הגוף הראשון: $2.7 \to 1.89\,\text{J}$; בשתיהן אובדים $0.81\,\text{J}$.
    solution:
      - kind: law
        text: >-
          מעבר למערכת שנעה במהירות $W$ מחסיר $W$ מכל מהירות. $K = \tfrac12MV^2 + \tfrac12\mu v_{\text{rel}}^2$.
      - kind: reasoning
        text: >-
          בכל מערכת אינרציאלית התנע נשמר, ולכן $V$ של אותה מערכת לא משתנה בהתנגשות, ו-$\tfrac12MV^2$ מתבטל בהפרש לפני ואחרי. נשאר
          $\Delta K = \tfrac12\mu\left(v_{\text{rel}}'^2 - v_{\text{rel}}^2\right)$. $\mu$ תלויה רק במסות, והמהירות היחסית היא הפרש של מהירויות
          שכל אחת מהן זזה באותו $W$, ולכן גם היא לא תלויה במערכת. מכאן $\Delta K$ זהה בכל המערכות.
      - kind: limit
        text: >-
          בהתנגשות אלסטית $\Delta K = 0$ בכל המערכות, כמו שצריך: התנגשות לא יכולה להיות אלסטית בעיני צופה אחד ולא בעיני אחר.
      - kind: units
        text: >-
          כל האיברים ב-$\text{J}$.
      - kind: substitution
        text: >-
          מעבדה: $V = 1.2\,\text{m/s}$, $v_1' = 0.30\,\text{m/s}$, $v_2' = 1.8\,\text{m/s}$; $K$ יורדת מ-$1.8$ ל-$0.99\,\text{J}$. במערכת שנעה ב-$3.0\,\text{m/s}$:
          המהירויות $0$ ו-$(-3.0)$ לפני ההתנגשות, $(-2.7)$ ו-$(-1.2)\,\text{m/s}$ אחריה; $K$ יורדת מ-$2.7$ ל-$1.89\,\text{J}$. $\mu = 0.24\,\text{kg}$,
          $\left(1 - 0.25\right)\cdot\tfrac12\cdot0.24\cdot3.0^2 = 0.81\,\text{J}$.
      - kind: result
        text: >-
          בשתי המערכות אובדים $0.81\,\text{J}$, אף ש-$K$ שונה.

challenge:
  - id: W-4.2-c1
    stars: 1
    objectives: [OBJ-4.2-2, OBJ-4.2-1]
    prompt: >-
      על שולחן אופקי בלי חיכוך, גוש 1 בעל מסה $m_1$ נע ימינה במהירות $v_1$ אל גוש 2 בעל מסה $m_2$, שעומד. לצד השמאלי של גוש 2
      מחובר קפיץ חסר מסה עם קבוע $k$, והגוש הראשון פוגע בקצה החופשי של הקפיץ. התנועה בממד אחד.

      א. מה הכיווץ המרבי של הקפיץ? (רמז: מה המהירות היחסית של הגושים ברגע הזה?)

      ב. חשבו עבור $m_1 = 0.40\,\text{kg}$, $v_1 = 2.5\,\text{m/s}$, $m_2 = 1.6\,\text{kg}$ ו-$k = 250\,\text{N/m}$, והשוו לכיווץ אילו גוש 2 היה מחובר לקיר.

      ג. הקפיץ משתחרר והגושים נפרדים. מה המהירויות שלהם?
    answer: >-
      א. $x_{\max} = v_1\sqrt{\mu/k}$, $\mu = \dfrac{m_1m_2}{m_1 + m_2}$.

      ב. $0.0894\,\text{m}$, לעומת $0.100\,\text{m}$ מול קיר.

      ג. $v_1' = -1.5\,\text{m/s}$, $v_2' = 1.0\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          הציר $x$ ימינה. $m_1$, $v_1$; $m_2$, $v_2 = 0$; קפיץ בעל קבוע $k$. השולחן חלק, ולכן התנע של שני הגושים נשמר.
      - kind: law
        text: >-
          $K = \tfrac12MV^2 + \tfrac12\mu v_{\text{rel}}^2$, ושימור האנרגיה המכנית: הקפיץ משמר.
      - kind: reasoning
        text: >-
          הקפיץ מתכווץ כל עוד הגושים מתקרבים, ולכן בכיווץ המרבי $v_{\text{rel}} = 0$: שני הגושים נעים ב-$V$. החלק $\tfrac12MV^2$ לא
          משתנה, ולכן כל החלק היחסי, $\tfrac12\mu v_1^2$, נמצא באותו רגע בקפיץ.
      - kind: manipulation
        text: >-
          $\tfrac12kx_{\max}^2 = \tfrac12\mu v_1^2$, ולכן $x_{\max} = v_1\sqrt{\mu/k}$. בסוף, הקפיץ החזיר את כל האנרגיה, ולכן זו התנגשות
          אלסטית: במערכת מרכז המסה $u_i' = -u_i$.
      - kind: limit
        text: >-
          כש-$m_2 \to \infty$, $\mu \to m_1$ ו-$x_{\max} \to v_1\sqrt{m_1/k}$, הגוש שפוגע בקפיץ שמחובר לקיר. כש-$m_2 \to 0$, $x_{\max} \to 0$:
          גוש בלי מסה לא מתנגד לתנועה.
      - kind: units
        text: >-
          $\text{m/s}\cdot\sqrt{\text{kg}/\left(\text{N/m}\right)} = \text{m/s}\cdot\text{s} = \text{m}$.
      - kind: substitution
        text: >-
          $\mu = \dfrac{0.40\cdot1.6}{2.0} = 0.32\,\text{kg}$, $x_{\max} = 2.5\sqrt{0.32/250} = 0.0894\,\text{m}$; מול קיר $2.5\sqrt{0.40/250} = 0.100\,\text{m}$.
          בקפיץ נאגרים $1.0\,\text{J}$ מתוך $1.25\,\text{J}$. $V = 0.50\,\text{m/s}$, $u_1 = 2.0$, $u_2 = -0.50\,\text{m/s}$, ולכן $v_1' = -2.0 + 0.50 = -1.5$
          ו-$v_2' = 0.50 + 0.50 = 1.0\,\text{m/s}$.
      - kind: result
        text: >-
          א. $x_{\max} = v_1\sqrt{\mu/k}$. ב. $8.94\,\text{cm}$ לעומת $10.0\,\text{cm}$. ג. $v_1' = -1.5\,\text{m/s}$, $v_2' = 1.0\,\text{m/s}$.
    source:
      name: MIT OpenCourseWare 8.01SC Classical Mechanics, Problem Set 9
      year: 2016
      problem: Problem 4 (Spring Blocks Motion)
      url: https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/aa4bd69ba9ac09a42a3d75892d2c46c6_MIT8_01F16_pset9.pdf
      verified: '2026-11-10'
      adapted: true

  - id: W-4.2-c2
    stars: 2
    objectives: [OBJ-4.2-2, OBJ-4.2-1]
    prompt: >-
      גוש בעל מסה $m_b$ עומד על שולחן אופקי בלי חיכוך. בצדו גומחה בצורת קשת של מעגל ברדיוס $R$, שמתחילה בגובה השולחן ועולה
      כלפי מעלה. קובייה קטנה בעלת מסה $m_c$ נעה על השולחן במהירות $v_0$, נכנסת לגומחה ומחליקה עליה למעלה, בלי חיכוך. הגוש
      חופשי לנוע על השולחן.

      א. מה הגובה המרבי $h$ שהקובייה מגיעה אליו? הניחו $h \lt R$.

      ב. הקובייה מחליקה בחזרה ויוצאת מהגומחה. מה המהירויות של הקובייה ושל הגוש אז?

      ג. חשבו עבור $m_c = 0.50\,\text{kg}$, $m_b = 2.0\,\text{kg}$, $v_0 = 3.0\,\text{m/s}$ ו-$R = 0.50\,\text{m}$, והשוו את $h$ לגובה אילו הגוש היה מקובע לשולחן.
    answer: >-
      א. $h = \dfrac{m_b}{m_b + m_c}\,\dfrac{v_0^2}{2g}$.

      ב. $v_c' = \dfrac{m_c - m_b}{m_c + m_b}\,v_0$, $v_b' = \dfrac{2m_c}{m_c + m_b}\,v_0$.

      ג. $h = 0.367\,\text{m}$ (גוש מקובע: $0.459\,\text{m}$); $v_c' = -1.8\,\text{m/s}$, $v_b' = 1.2\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          הציר $x$ אופקי, בכיוון התנועה של הקובייה; גבהים מעל השולחן. $m_c$, $v_0$; $m_b$ במנוחה. אין חיכוך, ולכן הרכיב
          האופקי של התנע נשמר, והאנרגיה המכנית נשמרת.
      - kind: law
        text: >-
          $K = \tfrac12MV^2 + \tfrac12\mu v_{\text{rel}}^2$ לתנועה האופקית, $\mu = \dfrac{m_cm_b}{m_c + m_b}$; אנרגיה פוטנציאלית $m_cgh$.
      - kind: reasoning
        text: >-
          בגובה המרבי הקובייה לא נעה ביחס לגוש, ולכן שניהם נעים אופקית ב-$V$. $\tfrac12MV^2$ לא משתנה, ולכן כל החלק היחסי,
          $\tfrac12\mu v_0^2$, הפך באותו רגע לאנרגיה פוטנציאלית. כשהקובייה יוצאת שוב, היא שוב בגובה השולחן, והאנרגיה הקינטית
          שבה התחילה חוזרת כולה: זו התנגשות אלסטית, ובמערכת מרכז המסה כל מהירות מתהפכת.
      - kind: manipulation
        text: >-
          $m_cgh = \tfrac12\mu v_0^2$, ולכן $h = \dfrac{\mu}{m_c}\,\dfrac{v_0^2}{2g}$. ב: $V = \dfrac{m_cv_0}{M}$, $u_c = \dfrac{m_b}{M}\,v_0$, $u_b = -V$; $v_c' = V - u_c$,
          $v_b' = 2V$.
      - kind: limit
        text: >-
          כש-$m_b \to \infty$, $h \to v_0^2/(2g)$, גובה של זריקה על מסלול מקובע, והקובייה חוזרת ב-$(-v_0)$. כש-$m_b = m_c$, הקובייה
          נעצרת והגוש ממשיך ב-$v_0$: החלפת מהירויות.
      - kind: units
        text: >-
          $v_0^2/g$ ב-$\text{m}^2\text{s}^{-2}/\left(\text{m}\,\text{s}^{-2}\right) = \text{m}$; היחסים בין המסות חסרי ממדים.
      - kind: substitution
        text: >-
          $\mu = 0.40\,\text{kg}$, $h = 0.80\cdot\dfrac{3.0^2}{2\cdot9.8} = 0.367\,\text{m} \lt R$; מקובע $0.459\,\text{m}$. $V = 0.60\,\text{m/s}$, $u_c = 2.4\,\text{m/s}$:
          $v_c' = 0.60 - 2.4 = -1.8\,\text{m/s}$ ו-$v_b' = 1.2\,\text{m/s}$.
      - kind: result
        text: >-
          א. $h = \dfrac{m_b}{m_b + m_c}\,\dfrac{v_0^2}{2g}$. ב. $v_c' = \dfrac{m_c - m_b}{M}\,v_0$, $v_b' = \dfrac{2m_c}{M}\,v_0$. ג. $0.367\,\text{m}$; $(-1.8)\,\text{m/s}$ ו-$1.2\,\text{m/s}$.
    source:
      name: MIT OpenCourseWare 8.01SC Classical Mechanics, Problem Set 9
      year: 2016
      problem: Problem 3 (Block Sliding up Curved Surface)
      url: https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/aa4bd69ba9ac09a42a3d75892d2c46c6_MIT8_01F16_pset9.pdf
      verified: '2026-11-10'
      adapted: true

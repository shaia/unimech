lesson: '4.4'
practice:
  - id: W-4.4-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.4-1]
    prompt: >-
      קליע נתקע בגוש עץ שתלוי על שני חוטים, והגוש עולה לגובה מרבי ונעצר לרגע. לכל משפט, קבעו אם הוא נכון ונמקו.

      א. האנרגיה הקינטית של הקליע והגוש מיד אחרי ההתנגשות שווה לזו של הקליע לפניה.

      ב. התנע של הקליע והגוש מיד אחרי ההתנגשות שווה לתנע של הקליע לפניה.

      ג. התנע של הקליע והגוש נשמר גם בזמן העלייה.

      ד. האנרגיה המכנית של הקליע והגוש נשמרת בזמן העלייה.
    answer: >-
      א. לא נכון. ב. נכון. ג. לא נכון. ד. נכון.
    solution:
      - kind: law
        text: >-
          התנע של מערכת משתנה רק במתקף של הכוחות החיצוניים. האנרגיה המכנית נשמרת כשרק כוחות משמרים עושים עבודה.
      - kind: reasoning
        text: >-
          א: הקליע נתקע, ההתנגשות פלסטית, ואנרגיה קינטית הופכת לחום ולעיוות; נשאר רק החלק $m/(m + M)$.
          ב: בזמן ההתנגשות הקצרה פועלים הכובד והמתיחות, כוחות סופיים, והמתקף שלהם זניח.
          ג: בעלייה אותם כוחות פועלים בזמן ארוך, ובשיא התנע אפס.
          ד: הכובד משמר, והמתיחות ניצבת למהירות ולא עושה עבודה.
      - kind: limit
        text: >-
          כש-$M \to 0$ אין במה להיתקע, ושימור אנרגיה נכון לכל התהליך: הקליע עולה בעצמו. כל גוש עם $M > 0$ "בולע" חלק מהאנרגיה.
      - kind: units
        text: >-
          תנע ב-$\text{kg}\cdot\text{m/s}$ ואנרגיה ב-$\text{J}$: שני חוקים שונים, ולכן הם יכולים להיכשל בשלבים שונים.
      - kind: result
        text: >-
          ב ו-ד נכונים; א ו-ג לא נכונים.

  - id: W-4.4-02
    level: basic
    objectives: [OBJ-4.4-1]
    prompt: >-
      ראש פטיש בעל מסה $0.50\,\text{kg}$ פוגע במסמר במהירות $6.0\,\text{m/s}$ ונעצר תוך $2.0\,\text{ms}$. מה הכוח הממוצע של
      המסמר על הפטיש? פי כמה הוא גדול מהמשקל של הפטיש, ואיזה חלק מהשינוי בתנע נובע מהמשקל?
    answer: >-
      $1.5\cdot10^3\,\text{N}$, פי $306$ מהמשקל; המשקל אחראי ל-$0.33\%$ בלבד מהשינוי בתנע.
    solution:
      - kind: given
        text: >-
          ציר כלפי מטה, בכיוון התנועה של הפטיש. $m = 0.50\,\text{kg}$, $v = 6.0\,\text{m/s}$, $\Delta t = 2.0\cdot10^{-3}\,\text{s}$.
      - kind: law
        text: >-
          משפט המתקף-תנע: $\bar F\,\Delta t = |\Delta p|$. המתקף של המשקל באותו זמן $mg\,\Delta t$.
      - kind: manipulation
        text: >-
          $\bar F = mv/\Delta t$, והיחס $\dfrac{mg\,\Delta t}{mv} = \dfrac{g\,\Delta t}{v}$.
      - kind: limit
        text: >-
          כש-$\Delta t \to 0$ היחס שואף לאפס. פטיש עם ראש רך, שנעצר לאט, ייתן כוח קטן יותר, והמשקל יהיה חשוב יותר.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}/\text{s} = \text{N}$; $g\,\Delta t/v$ חסר ממדים.
      - kind: substitution
        text: >-
          $\Delta p = 3.0\,\text{N}\cdot\text{s}$, $\bar F = 3.0/0.0020 = 1.5\cdot10^3\,\text{N}$, משקל $4.9\,\text{N}$, יחס $306$;
          $g\,\Delta t/v = 9.8\cdot0.0020/6.0 = 0.0033$.
      - kind: result
        text: >-
          $\bar F = 1.5\cdot10^3\,\text{N}$, כ-$300$ פעם המשקל; המשקל משנה את התנע ב-$0.33\%$ בלבד, ומותר להזניח אותו.

  - id: W-4.4-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.4-2, OBJ-4.4-1]
    prompt: >-
      גוש עץ מונח על שולחן. יורים קליע אנכית כלפי מעלה, דרך חור בשולחן, אל הגוש. הקליע נתקע בגוש, והגוש עף למעלה
      ועולה לגובה מרבי.

      א. חלקו את התהליך לשלבים, וכתבו איזה חוק שימור מתאים לכל שלב.

      ב. השולחן דוחף את הגוש כלפי מעלה. האם הוא מפעיל כוח מתקפי בזמן ההתנגשות? נמקו.
    answer: >-
      א. שלב 1, ההתנגשות: שימור התנע האנכי. שלב 2, העלייה: שימור אנרגיה מכנית. ב. לא: השולחן יכול רק לדחוף, והגוש
      מתרחק ממנו, ולכן הכוח הנורמלי לא גדל אלא יורד לאפס.
    solution:
      - kind: given
        text: >-
          ציר $y$ כלפי מעלה. שני שלבים: הקליע נעצר בתוך הגוש (קצר), והגוש עם הקליע עולה עד שנעצר (ארוך).
      - kind: law
        text: >-
          $\Delta P_y = \int F_{\text{ext},y}\,dt$; ובשלב שבו רק הכובד עושה עבודה, האנרגיה המכנית נשמרת.
      - kind: reasoning
        text: >-
          בשלב 1 פועלים הכובד, סופי, והכוח הנורמלי של השולחן. כוח מתקפי של משטח מופיע כשהמשטח **מונע** תנועה, כמו
          רצפה שעוצרת כדור. כאן הקליע דוחף את הגוש **מעל** השולחן, והשולחן לא יכול למשוך אותו: הכוח הנורמלי רק
          יורד, מ-$Mg$ לאפס. לכן המתקף החיצוני זניח, והתנע האנכי נשמר. בשלב 2 הגוש באוויר, פועל רק הכובד, והוא משמר.
      - kind: limit
        text: >-
          אילו הקליע היה נורה כלפי מטה אל גוש שמונח על השולחן, השולחן היה מונע את התנועה ומפעיל כוח מתקפי, והתנע
          האנכי לא היה נשמר.
      - kind: units
        text: >-
          המתקף ב-$\text{N}\cdot\text{s}$ והתנע ב-$\text{kg}\cdot\text{m/s}$: אותה יחידה.
      - kind: result
        text: >-
          א. שימור תנע בהתנגשות, שימור אנרגיה בעלייה. ב. לא, כי הגוש מתרחק מהשולחן.

  - id: W-4.4-04
    level: mid
    objectives: [OBJ-4.4-1]
    prompt: >-
      קליע בעל מסה $8.0\,\text{g}$ נע במהירות $350\,\text{m/s}$ ונתקע בגוש בעל מסה $2.4\,\text{kg}$, שתלוי על חוטים באורך
      $1.0\,\text{m}$. לאיזה גובה עולה הגוש, ומה הזווית המרבית של החוטים? איזה חלק מהאנרגיה הקינטית של הקליע נשאר
      בתנועה אחרי ההתנגשות?
    answer: >-
      $h = 0.0690\,\text{m}$, $\theta = 21.4^\circ$; נשאר $0.33\%$ מהאנרגיה.
    solution:
      - kind: given
        text: >-
          $m = 0.0080\,\text{kg}$, $v = 350\,\text{m/s}$, $M = 2.4\,\text{kg}$, $L = 1.0\,\text{m}$. ציר $x$ בכיוון הקליע; הגובה
          נמדד מהמקום של הגוש לפני ההתנגשות.
      - kind: law
        text: >-
          שלב 1: $mv = (m + M)V$. שלב 2: $\tfrac12(m + M)V^2 = (m + M)gh$. גאומטריה: $h = L(1 - \cos\theta)$.
      - kind: manipulation
        text: >-
          $V = \dfrac{mv}{m + M}$, $h = \dfrac{V^2}{2g}$, $\cos\theta = 1 - \dfrac hL$. החלק שנשאר: $\dfrac{K'}{K} = \dfrac{m}{m + M}$.
      - kind: limit
        text: >-
          כש-$M \to \infty$, $V \to 0$ ו-$\theta \to 0$. כש-$h > L$ הנוסחה לזווית נכשלת: החוטים מתרופפים לפני השיא.
      - kind: units
        text: >-
          $V^2/g$ ב-$\text{m}^2/\text{s}^2 \cdot \text{s}^2/\text{m} = \text{m}$; $h/L$ חסר ממדים.
      - kind: substitution
        text: >-
          $V = 0.0080\cdot350/2.408 = 1.16\,\text{m/s}$, $h = 1.16^2/19.6 = 0.0690\,\text{m}$, $\cos\theta = 0.931$, $\theta = 21.4^\circ$;
          $m/(m + M) = 0.0080/2.408 = 0.33\%$.
      - kind: result
        text: >-
          $h = 0.0690\,\text{m}$, $\theta = 21.4^\circ$, ונשאר $0.33\%$ מהאנרגיה.

  - id: W-4.4-05
    level: mid
    qualitative: true
    objectives: [OBJ-4.4-1]
    prompt: >-
      בכל מצב, קבעו ונמקו אם התנע של שני הגופים המתנגשים (או הרכיב שמצוין) נשמר בין הרגע שלפני ההתנגשות לרגע שאחריה.

      א. כדור פוגע באלכסון ברצפה חלקה וקופץ ממנה. הרכיב האופקי והרכיב האנכי של התנע של הכדור (הרצפה היא הגוף השני, והיא מחוברת לכדור הארץ).

      ב. שני מחליקים על קרח חלק מתנגשים ונאחזים זה בזה.

      ג. חץ ננעץ במטרה שמוברגת לעץ. התנע של החץ והמטרה.

      ד. מחבט בייסבול, שהשחקן אוחז בידיו, פוגע בכדור. התנע של המחבט והכדור.
    answer: >-
      א. האופקי נשמר, האנכי לא. ב. נשמר. ג. לא נשמר. ד. נשמר בקירוב טוב.
    solution:
      - kind: law
        text: >-
          $\Delta\vec P = \int\vec F_{\text{ext}}\,dt$. בזמן קצר, כוח חיצוני סופי נותן מתקף זניח; כוח מתקפי של גוף שמונע
          תנועה לא זניח, בכיוון שבו הוא פועל.
      - kind: reasoning
        text: >-
          א: הרצפה החלקה דוחפת רק אנכית, בכוח מתקפי שהופך את התנע האנכי; אופקית אין כוח. ב: הקרח חלק, והכובד מאוזן
          בכוח הנורמלי: אין כוח חיצוני אופקי. ג: הבורג והעץ מונעים מהמטרה לזוז, ומפעילים כוח מתקפי שעוצר את החץ.
          ד: הידיים מפעילות כוח סופי, בסדר גודל של עשרות ניוטונים, לעומת אלפי ניוטונים בין המחבט לכדור, ולכן המתקף
          שלהן בזמן המגע זניח.
      - kind: limit
        text: >-
          אילו המטרה בסעיף ג הייתה תלויה על חוט ארוך, היא הייתה מטוטלת בליסטית, והתנע האופקי היה נשמר.
      - kind: units
        text: >-
          ההשוואה היא בין כוחות (ניוטון) באותו זמן, או בין מתקפים ($\text{N}\cdot\text{s}$).
      - kind: result
        text: >-
          א. רק האופקי. ב. כן. ג. לא. ד. כן, בקירוב.

  - id: W-4.4-06
    level: mid
    objectives: [OBJ-4.4-2]
    prompt: >-
      על רצפה חלקה, גוש בעל מסה $1.2\,\text{kg}$ נע במהירות $2.5\,\text{m/s}$ ונדבק לגוש בעל מסה $0.80\,\text{kg}$, שנשען
      על קפיץ רפוי עם $k = 500\,\text{N/m}$ שמחובר לקיר. מה הכיווץ המרבי? כמה אנרגיה הפכה לחום בהתנגשות?
    answer: >-
      $x = 0.0949\,\text{m}$; $1.5\,\text{J}$ הפכו לחום.
    solution:
      - kind: given
        text: >-
          $m = 1.2\,\text{kg}$, $v = 2.5\,\text{m/s}$, $M = 0.80\,\text{kg}$, $k = 500\,\text{N/m}$. ציר $x$ לכיוון הקיר.
      - kind: law
        text: >-
          שלב 1 (קצר, כוח הקפיץ מתחיל מאפס): $mv = (m + M)V$. שלב 2 (קפיץ משמר, רצפה חלקה): $\tfrac12(m + M)V^2 = \tfrac12kx^2$.
      - kind: manipulation
        text: >-
          $V = \dfrac{mv}{m + M}$, $x = V\sqrt{\dfrac{m + M}{k}}$. החום: $\tfrac12mv^2 - \tfrac12(m + M)V^2$.
      - kind: limit
        text: >-
          כש-$M \to 0$, $x \to v\sqrt{m/k}$: כל האנרגיה בקפיץ. שימור אנרגיה דרך ההתנגשות היה נותן את זה גם כאן, $0.122\,\text{m}$, וטועה.
      - kind: units
        text: >-
          $\sqrt{\text{kg}/(\text{N/m})}$ בשניות, כפול $\text{m/s}$: מטרים.
      - kind: substitution
        text: >-
          $V = 1.2\cdot2.5/2.0 = 1.5\,\text{m/s}$, $x = 1.5\sqrt{2.0/500} = 0.0949\,\text{m}$. $K$: $3.75\,\text{J} \to 2.25\,\text{J}$.
      - kind: result
        text: >-
          $x = 0.0949\,\text{m}$, ו-$1.5\,\text{J}$ הפכו לחום בהתנגשות.

  - id: W-4.4-07
    level: mid
    objectives: [OBJ-4.4-2]
    prompt: >-
      על משטח חלק, גוש בעל מסה $1.5\,\text{kg}$ נע במהירות $4.0\,\text{m/s}$ ונדבק לגוש בעל מסה $0.50\,\text{kg}$ שעומד.
      הזוג ממשיך ועולה במגלשה חלקה. לאיזה גובה הוא מגיע? השוו לגובה שאליו היה מגיע הגוש הראשון לבדו.
    answer: >-
      $0.459\,\text{m}$; לבדו הגוש היה מגיע ל-$0.816\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $m_1 = 1.5\,\text{kg}$, $v = 4.0\,\text{m/s}$, $m_2 = 0.50\,\text{kg}$. ציר $x$ בכיוון התנועה; גובה מהמשטח.
      - kind: law
        text: >-
          שלב 1: $m_1v = (m_1 + m_2)V$. שלב 2: $\tfrac12(m_1 + m_2)V^2 = (m_1 + m_2)gh$.
      - kind: manipulation
        text: >-
          $h = \dfrac{V^2}{2g} = \left(\dfrac{m_1}{m_1 + m_2}\right)^2\dfrac{v^2}{2g}$.
      - kind: limit
        text: >-
          כש-$m_2 \to 0$, $h \to v^2/(2g)$, הגוש לבדו. כש-$m_2 \gg m_1$, $h \to 0$.
      - kind: units
        text: >-
          $v^2/g$ במטרים.
      - kind: substitution
        text: >-
          $V = 1.5\cdot4.0/2.0 = 3.0\,\text{m/s}$, $h = 9.0/19.6 = 0.459\,\text{m}$. לבדו: $16/19.6 = 0.816\,\text{m}$. שימור
          אנרגיה דרך ההתנגשות היה נותן $0.612\,\text{m}$.
      - kind: result
        text: >-
          $h = 0.459\,\text{m}$, פי $(3/4)^2$ מהגובה של הגוש לבדו.

  - id: W-4.4-08
    level: bagrut
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    prompt: >-
      עגלה בעלת מסה $3.0\,\text{kg}$ עומדת על מסילה חלקה שנוטה ב-$30^\circ$, נשענת על מעצור בתחתית. קליע בעל מסה
      $20\,\text{g}$ נע במהירות $250\,\text{m/s}$ לאורך המסילה כלפי מעלה, ונתקע בעגלה תוך $2.0\,\text{ms}$.

      א. העריכו את המתקף של הכובד לאורך המסילה בזמן ההתנגשות, והשוו לתנע של הקליע. האם מותר לכתוב שימור תנע?

      ב. כמה מטרים עולה העגלה לאורך המסילה?
    answer: >-
      א. $0.0296\,\text{N}\cdot\text{s}$ לעומת $5.0\,\text{kg}\cdot\text{m/s}$, $0.59\%$: מותר. ב. $0.280\,\text{m}$.
    solution:
      - kind: given
        text: >-
          ציר $s$ לאורך המסילה, חיובי כלפי מעלה. $M = 3.0\,\text{kg}$, $m = 0.020\,\text{kg}$, $v = 250\,\text{m/s}$, $\alpha = 30^\circ$,
          $\Delta t = 2.0\cdot10^{-3}\,\text{s}$.
      - kind: law
        text: >-
          לאורך המסילה פועל רכיב הכובד $-(m + M)g\sin\alpha$, קבוע. המעצור דוחף רק כל עוד העגלה נוגעת בו, והיא
          מתרחקת ממנו מיד, ולכן הוא לא כוח מתקפי. שלב 2: שימור אנרגיה.
      - kind: manipulation
        text: >-
          $|J| = (m + M)g\sin\alpha\,\Delta t$, ו-$\dfrac{|J|}{mv} = \dfrac{g\sin\alpha\,\Delta t}{V}$ עם $V = mv/(m + M)$. בשלב 2,
          $\tfrac12(m + M)V^2 = (m + M)g\,s\sin\alpha$, ולכן $s = \dfrac{V^2}{2g\sin\alpha}$.
      - kind: limit
        text: >-
          היחס הוא $\Delta t/T_2$ עם $T_2 = V/(g\sin\alpha)$, משך העלייה: כוח קבוע נותן שגיאה ליניארית. כש-$\alpha \to 0$
          המתקף מתאפס ו-$s \to \infty$: מסילה אופקית חלקה.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2\cdot\text{s} = \text{N}\cdot\text{s}$; $V^2/g$ במטרים.
      - kind: substitution
        text: >-
          $V = 5.0/3.02 = 1.66\,\text{m/s}$. $|J| = 3.02\cdot9.8\cdot0.5\cdot0.0020 = 0.0296\,\text{N}\cdot\text{s}$, $0.59\%$ מ-$5.0$.
          $s = 1.66^2/(2\cdot9.8\cdot0.5) = 0.280\,\text{m}$; $T_2 = 0.338\,\text{s}$.
      - kind: result
        text: >-
          א. המתקף $0.59\%$ מהתנע: מותר להזניח. ב. $s = 0.280\,\text{m}$.

  - id: W-4.4-09
    level: bagrut
    objectives: [OBJ-4.4-2, OBJ-4.4-1]
    prompt: >-
      גוש בעל מסה $2.0\,\text{kg}$ תלוי על חוט אחד באורך $0.80\,\text{m}$, שעומד במתיחות של עד $30\,\text{N}$. קליע בעל מסה
      $25\,\text{g}$ נע אופקית במהירות $200\,\text{m/s}$ ונתקע בגוש.

      א. מה המתיחות בחוט מיד אחרי ההתנגשות? האם החוט ייקרע?

      ב. מה מהירות הקליע הגדולה ביותר שהחוט עומד בה?
    answer: >-
      א. $35.3\,\text{N}$: החוט נקרע מיד אחרי ההתנגשות. ב. $162\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          $M = 2.0\,\text{kg}$, $L = 0.80\,\text{m}$, $T_{\max} = 30\,\text{N}$, $m = 0.025\,\text{kg}$, $v = 200\,\text{m/s}$. ציר רדיאלי
          חיובי כלפי מעלה, אל נקודת התלייה.
      - kind: law
        text: >-
          שלב 1: $mv = (m + M)V$. מיד אחרי ההתנגשות הגוש בתחתית מסלול מעגלי ברדיוס $L$, והכוח השקול הרדיאלי הוא הכוח
          הצנטריפטלי (שיעור 2.6): $T - (m + M)g = (m + M)V^2/L$.
      - kind: manipulation
        text: >-
          $T = (m + M)\left(g + \dfrac{V^2}{L}\right)$. לסעיף ב: $T = T_{\max}$ נותן $V_{\max}^2 = L\left(\dfrac{T_{\max}}{m + M} - g\right)$,
          ו-$v_{\max} = \dfrac{m + M}{m}V_{\max}$.
      - kind: limit
        text: >-
          כש-$v \to 0$, $T \to (m + M)g$, המשקל. המתיחות הגדולה ביותר בכל התנועה היא ברגע הזה: בהמשך העלייה המהירות
          קטנה, והכובד מושך גם הוא פחות לאורך החוט.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: substitution
        text: >-
          $V = 0.025\cdot200/2.025 = 2.47\,\text{m/s}$, $T = 2.025\left(9.8 + 2.47^2/0.80\right) = 35.3\,\text{N}$ (לפני: $19.6\,\text{N}$).
          $V_{\max} = \sqrt{0.80\left(30/2.025 - 9.8\right)} = 2.00\,\text{m/s}$, $v_{\max} = 81\cdot2.00 = 162\,\text{m/s}$.
      - kind: result
        text: >-
          א. $35.3\,\text{N} > 30\,\text{N}$: החוט נקרע מיד אחרי ההתנגשות. ב. $v_{\max} = 162\,\text{m/s}$.

  - id: W-4.4-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.4-2]
    prompt: >-
      קליע בעל מסה $m$ ומהירות $v$ נתקע בגוש בעל מסה $M$ על רצפה חלקה. הגוש נשען על קפיץ רפוי עם קבוע $k$ שמחובר
      לקיר. שלושה סטודנטים מחשבים את הכיווץ המרבי $x$.

      סטודנט א: $\tfrac12mv^2 = \tfrac12kx^2$.

      סטודנט ב: $mv = (m + M)V$, ואחר כך $\tfrac12(m + M)V^2 = \tfrac12kx^2$.

      סטודנט ג: התנע נשמר עד הכיווץ המרבי, ושם המהירות אפס, ולכן $mv = 0$; מכאן שהבעיה סותרת את עצמה.

      א. מי צודק? מה הטעות של כל אחד מהאחרים?

      ב. מה היחס בין התשובה של א לתשובה של ב? באיזה גבול הם מסכימים?
    answer: >-
      א. ב צודק. א מניח שימור אנרגיה דרך התנגשות פלסטית; ג מניח שימור תנע בשלב שבו הקיר דוחף דרך הקפיץ. ב.
      $x_A/x_B = \sqrt{(m + M)/m}$; הם מסכימים כש-$M \ll m$.
    solution:
      - kind: law
        text: >-
          בכל שלב בודקים: האם פועל כוח חיצוני לא זניח, והאם אנרגיה הופכת לחום.
      - kind: reasoning
        text: >-
          בהתנגשות כוח הקפיץ מתחיל מאפס, והתנע נשמר; אבל הקליע נתקע, ואנרגיה הופכת לחום: א טועה. בכיווץ הקיר
          מחזיק את הקפיץ, והכוח שלו פועל בזמן ארוך ועוצר את הגוש: התנע לא נשמר, וג טועה. אבל כוח הקפיץ משמר, והרצפה
          חלקה, ולכן בשלב הזה האנרגיה נשמרת: ב צודק.
      - kind: manipulation
        text: >-
          א: $x_A = v\sqrt{m/k}$. ב: $V = mv/(m + M)$ ו-$x_B = V\sqrt{(m + M)/k} = \dfrac{mv}{\sqrt{k(m + M)}}$. היחס:
          $\dfrac{x_A}{x_B} = \sqrt{\dfrac{m + M}{m}}$.
      - kind: limit
        text: >-
          כש-$M \to 0$ היחס שואף ל-1: אין התנגשות פלסטית של ממש, וא צודק במקרה. לקליע בגוש כבד, $M \gg m$, א מגזים פי $\sqrt{M/m}$.
      - kind: units
        text: >-
          $v\sqrt{m/k}$ ב-$\text{m/s}\cdot\text{s} = \text{m}$, והיחס חסר ממדים.
      - kind: result
        text: >-
          א. ב. ב. $x_A/x_B = \sqrt{(m + M)/m}$, ושווה ל-1 רק כש-$M \ll m$.

challenge:
  - id: W-4.4-c1
    stars: 2
    qualitative: true
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    prompt: >-
      גוש עץ בעל מסה $M$ תלוי על חבל קל ממסמר. קליע בעל מסה $m$ ומהירות $v_0$ פוגע בגוש ברגע $t = 0$ ונתקע בו.
      המערכת $S$ היא הגוש והקליע.

      א. אילו מהגדלים הבאים נשמרים בין $t = -10\,\text{s}$ ל-$t = +10\,\text{s}$: התנע הכולל של $S$; הרכיב האופקי של התנע
      של $S$; האנרגיה המכנית של $S$; התנע הזוויתי של $S$ ביחס לציר דרך המסמר, ניצב למישור התנועה?

      ב. ואילו מהם נשמרים בין הרגע שלפני ההתנגשות לרגע שאחריה? נמקו כל אחד.
    answer: >-
      א. אף אחד מהם. ב. התנע הכולל, הרכיב האופקי שלו והתנע הזוויתי ביחס למסמר נשמרים; האנרגיה המכנית לא.
    solution:
      - kind: given
        text: >-
          לפני $t = 0$ הקליע עף והגוש תלוי במנוחה. אחרי ההתנגשות הגוש עם הקליע מתנדנד במשך 10 שניות, כמה תנודות.
      - kind: law
        text: >-
          $\Delta\vec P = \int\vec F_{\text{ext}}\,dt$; האנרגיה המכנית נשמרת רק כשכוחות לא משמרים לא עושים עבודה; והתנע
          הזוויתי ביחס לנקודה משתנה במומנט החיצוני ביחס אליה (שיעור 3.7).
      - kind: reasoning
        text: >-
          א: הקליע עף לפני ההתנגשות, ולכובד שעליו אין מאזן, ולכן כבר לפניה התנע האנכי משתנה. בזמן התנודות המתיחות
          והכובד משנים גם את התנע האופקי: בכל מחזור הוא מחליף כיוון. האנרגיה המכנית אובדת בהתנגשות הפלסטית. והתנע
          הזוויתי ביחס למסמר משתנה בזמן התנודה, כי לכובד יש מומנט ביחס למסמר כשהחבל נוטה. לכן אף אחד לא נשמר.
          ב: בזמן ההתנגשות הקצרה הכוחות החיצוניים סופיים, והמתקף שלהם זניח, ולכן התנע נשמר, ובפרט הרכיב האופקי. החבל
          אנכי ועובר דרך המסמר, ולכובד אין מומנט כשהגוש בדיוק מתחתיו, ולכן גם התנע הזוויתי נשמר. האנרגיה הקינטית
          הופכת לחום: האנרגיה המכנית לא נשמרת.
      - kind: limit
        text: >-
          בחלון זמן ששואף לאפס סביב $t = 0$ נשמר כל מה שכוחות סופיים לא יכולים לשנות: תנע ותנע זוויתי. בחלון ארוך, שכולל
          את שני השלבים, לא נשמר אף אחד מהם. חוק שימור תמיד שייך לשלב, לא לתהליך.
      - kind: units
        text: >-
          המתקף של כוח סופי, $F\,\Delta t$, ב-$\text{N}\cdot\text{s}$, שואף לאפס עם $\Delta t$; במשך $20\,\text{s}$ הוא גדול.
      - kind: result
        text: >-
          א. אף אחד. ב. התנע, הרכיב האופקי שלו והתנע הזוויתי ביחס למסמר נשמרים; האנרגיה המכנית לא.
    # Reopened 2026-11-10: the PDF is the "2009 F=ma Exam" with solutions (© 2009 AAPT), Question 14, answer (E)
    # "None of the above are conserved". The /2010/upload/ in its path is AAPT's upload folder, not the exam year.

  - id: W-4.4-c2
    stars: 1
    objectives: [OBJ-4.4-2]
    prompt: >-
      גוש בעל מסה $5.0\,\text{kg}$ נע במהירות $8.0\,\text{m/s}$ על משטח אופקי, מחליק $2.0\,\text{m}$ ומתנגש חזיתית, בהתנגשות
      אלסטית, בגוש בעל מסה $15.0\,\text{kg}$ שעומד. מקדם החיכוך הקינטי בין שני הגושים למשטח $0.35$.

      א. כמה מחליק הגוש של $15.0\,\text{kg}$ עד שהוא נעצר?

      ב. האם הגוש הראשון חוזר עד המקום שממנו יצא? מה המרחק בין הגושים כשהם נעצרים?
    answer: >-
      א. $1.83\,\text{m}$. ב. לא: הוא נעצר $0.168\,\text{m}$ לפני המקום שממנו יצא; המרחק בין הגושים $3.66\,\text{m}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ בכיוון התנועה של הגוש הראשון. $m_1 = 5.0\,\text{kg}$, $u = 8.0\,\text{m/s}$, $L = 2.0\,\text{m}$, $m_2 = 15.0\,\text{kg}$,
          $\mu_k = 0.35$.
      - kind: law
        text: >-
          שלושה שלבים. החלקה: משפט עבודה-אנרגיה, $v_1^2 = u^2 - 2\mu_k gL$. התנגשות אלסטית קצרה (החיכוך סופי):
          $v_1' = \dfrac{m_1 - m_2}{m_1 + m_2}v_1$, $v_2' = \dfrac{2m_1}{m_1 + m_2}v_1$ (שיעור 4.1).
          החלקה: $d = v^2/(2\mu_k g)$ לכל גוש.
      - kind: manipulation
        text: >-
          עם $m_2 = 3m_1$: $v_1' = -v_1/2$ ו-$v_2' = v_1/2$. שני הגושים יוצאים באותה מהירות, בכיוונים הפוכים, ולכן מחליקים
          אותו מרחק: $d = \dfrac{v_1^2}{8\mu_k g} = \dfrac{u^2 - 2\mu_k gL}{8\mu_k g}$.
      - kind: limit
        text: >-
          כש-$\mu_k \to 0$, $d \to \infty$. כש-$u^2 = 2\mu_k gL$, הגוש הראשון נעצר בדיוק כשהוא מגיע, ואין התנגשות: $d = 0$.
      - kind: units
        text: >-
          $\text{m}^2/\text{s}^2$ חלקי $\text{m/s}^2$: מטרים.
      - kind: substitution
        text: >-
          $v_1^2 = 64 - 2\cdot0.35\cdot9.8\cdot2.0 = 50.3\,\text{m}^2/\text{s}^2$, $v_1 = 7.09\,\text{m/s}$; שני הגושים יוצאים ב-$3.55\,\text{m/s}$,
          ו-$d = 3.55^2/(2\cdot0.35\cdot9.8) = 1.83\,\text{m}$. הגוש הראשון חוזר $1.83\,\text{m}$, $0.168\,\text{m}$ פחות מ-$2.0\,\text{m}$;
          המרחק בין הגושים $2\cdot1.83 = 3.66\,\text{m}$. (במקור $g = 10\,\text{m/s}^2$, והתשובה $1.79\,\text{m}$.)
      - kind: result
        text: >-
          א. $1.83\,\text{m}$. ב. לא; הגושים נעצרים במרחק $3.66\,\text{m}$ זה מזה.

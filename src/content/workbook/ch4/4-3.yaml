lesson: '4.3'
practice:
  - id: W-4.3-01
    level: basic
    qualitative: true
    objectives: [OBJ-4.3-1]
    prompt: >-
      שתי דיסקיות מתנגשות על שולחן אוויר אופקי, והחיכוך עם השולחן זניח. לכל משפט, קבעו אם הוא נכון ונמקו.

      א. הרכיב $x$ של התנע הכולל נשמר, וגם הרכיב $y$, כל אחד בנפרד.

      ב. סכום הגדלים של שני התנעים אחרי ההתנגשות שווה לגודל התנע הכולל לפניה.

      ג. כשאחת הדיסקיות עמדה, והדיסקיות חלקות, היא יוצאת לאורך קו המרכזים ברגע המגע.

      ד. אם ידועות המסות והמהירות ההתחלתית, וההתנגשות אלסטית, אפשר לחשב את שתי המהירויות שאחרי ההתנגשות בלי
      שום נתון נוסף.
    answer: >-
      א. נכון. ב. לא נכון. ג. נכון. ד. לא נכון: ארבעה נעלמים ושלוש משוואות.
    solution:
      - kind: law
        text: >-
          כשאין כוח חיצוני שקול במישור, $\vec p_1 + \vec p_2$ נשמר, וזו משוואה וקטורית: שתי משוואות, אחת לכל רכיב.
      - kind: reasoning
        text: >-
          א: כל רכיב של משוואה וקטורית נשמר בנפרד. ב: התנעים הם צלעות של משולש שהצלע השלישית שלו היא התנע הכולל, וסכום
          שתי צלעות גדול מהשלישית; שוויון רק כשהתנעים באותו כיוון. ג: בדיסקיות חלקות הכוח ביניהן ניצב למשטחים, כלומר
          לאורך קו המרכזים, ודיסקית שעמדה מקבלת רק את המתקף הזה. ד: שתי מהירויות במישור הן ארבעה מספרים, ויש רק שלוש
          משוואות (שני רכיבי תנע ואנרגיה).
      - kind: limit
        text: >-
          בפגיעה חזיתית כל התנועה על ציר אחד: שני נעלמים ושתי משוואות, ואז התוצאה כן נקבעת, כמו בשיעור 4.1.
      - kind: result
        text: >-
          א ו-ג נכונים; ב ו-ד לא נכונים.

  - id: W-4.3-02
    level: basic
    objectives: [OBJ-4.3-1]
    prompt: >-
      דיסקית במסה $0.40\,\text{kg}$ נעה מזרחה ב-$2.5\,\text{m/s}$ ופוגעת בדיסקית במסה $0.60\,\text{kg}$ שעומדת.
      אחרי ההתנגשות הדיסקית הראשונה נעה ב-$1.2\,\text{m/s}$ בכיוון $50^\circ$ צפונית למזרח.

      א. מצאו את המהירות של הדיסקית השנייה (גודל וכיוון).

      ב. האם ההתנגשות אלסטית?
    answer: >-
      א. $1.31\,\text{m/s}$, $28.0^\circ$ דרומית למזרח.

      ב. לא: האנרגיה הקינטית ירדה מ-$1.25$ ל-$0.799\,\text{J}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה, ציר $y$ צפונה. $m_1 = 0.40\,\text{kg}$, $\vec v_1 = (2.5,\ 0)\,\text{m/s}$; $m_2 = 0.60\,\text{kg}$ במנוחה;
          $\vec v_1' = 1.2\left(\cos50^\circ,\ \sin50^\circ\right) = (0.771,\ 0.919)\,\text{m/s}$.
      - kind: law
        text: >-
          שימור התנע בכל רכיב: $m_1v_{1x} = m_1v_{1x}' + m_2v_{2x}'$ ו-$0 = m_1v_{1y}' + m_2v_{2y}'$.
      - kind: manipulation
        text: >-
          $v_{2x}' = \dfrac{m_1\left(v_{1x} - v_{1x}'\right)}{m_2}$ ו-$v_{2y}' = -\dfrac{m_1v_{1y}'}{m_2}$.
      - kind: limit
        text: >-
          אם הדיסקית הראשונה הייתה ממשיכה ב-$2.5\,\text{m/s}$ מזרחה (לא פגעה), יוצא $\vec v_2' = 0$, כמו שצריך.
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}$ חלקי $\text{kg}$: מטר לשנייה.
      - kind: substitution
        text: >-
          $v_{2x}' = 0.40\left(2.5 - 0.771\right)/0.60 = 1.15\,\text{m/s}$, $v_{2y}' = -0.40\cdot0.919/0.60 = -0.613\,\text{m/s}$; הגודל
          $1.31\,\text{m/s}$ והכיוון $\arctan(0.613/1.15) = 28.0^\circ$ מתחת לציר $x$. האנרגיה: לפני $\tfrac12\cdot0.40\cdot2.5^2 = 1.25\,\text{J}$,
          אחרי $\tfrac12\cdot0.40\cdot1.2^2 + \tfrac12\cdot0.60\cdot1.31^2 = 0.799\,\text{J}$.
      - kind: result
        text: >-
          א. $1.31\,\text{m/s}$, $28.0^\circ$ דרומית למזרח. ב. לא אלסטית: $64\%$ מהאנרגיה נשאר.

  - id: W-4.3-03
    level: basic
    qualitative: true
    objectives: [OBJ-4.3-2]
    prompt: >-
      בתמונה של תא בועות פרוטון מהיר פוגע בפרוטון שעומד.

      א. אחרי ההתנגשות אחד הפרוטונים נע בזווית $25^\circ$ מעל הכיוון ההתחלתי. אם ההתנגשות אלסטית, באיזו זווית נע השני?

      ב. בתמונה אחרת, הזווית בין שני המסלולים אחרי ההתנגשות היא $80^\circ$, ושני הפרוטונים נעים. מה אפשר להסיק על
      ההתנגשות הזו?
    answer: >-
      א. $65^\circ$ מתחת לכיוון ההתחלתי.

      ב. היא לא אלסטית: חלק מהאנרגיה הקינטית הלך לצורה אחרת.
    solution:
      - kind: law
        text: >-
          במסות שוות, כשאחת עומדת: $p^2 = p_1'^2 + p_2'^2 + 2\,\vec p_1'\cdot\vec p_2'$ מהתנע, ו-$p^2 = p_1'^2 + p_2'^2$ מהאנרגיה
          אם ההתנגשות אלסטית.
      - kind: reasoning
        text: >-
          א: בהתנגשות אלסטית $\vec p_1'\cdot\vec p_2' = 0$, והמסלולים ניצבים. התנע ההתחלתי ברכיב הניצב אפס, ולכן השני
          בצד השני של הכיוון ההתחלתי, ב-$90^\circ - 25^\circ = 65^\circ$. ב: זווית קטנה מ-$90^\circ$ אומרת
          $\vec p_1'\cdot\vec p_2' \gt 0$, כלומר $p_1'^2 + p_2'^2 \lt p^2$: האנרגיה הקינטית אחרי ההתנגשות קטנה ממה שהייתה.
      - kind: limit
        text: >-
          אם הזווית של הראשון שואפת ל-$0$, השני יוצא ב-$90^\circ$ ובמהירות שואפת לאפס: פגיעה כמעט משיקה, שכמעט לא
          משנה דבר.
      - kind: result
        text: >-
          א. $65^\circ$ בצד השני. ב. ההתנגשות לא אלסטית.

  - id: W-4.3-04
    level: mid
    objectives: [OBJ-4.3-1]
    prompt: >-
      דיסקית במסה $0.50\,\text{kg}$ נעה צפונה ב-$2.0\,\text{m/s}$, ודיסקית במסה $0.25\,\text{kg}$ נעה ב-$4.0\,\text{m/s}$
      בכיוון $30^\circ$ דרומית למזרח. הן מתנגשות ונצמדות. מצאו את המהירות שלהן אחרי ההתנגשות (גודל וכיוון), ואת
      האנרגיה הקינטית שאבדה.
    answer: >-
      $1.33\,\text{m/s}$ בכיוון $30.0^\circ$ צפונית למזרח; אבדו $2.33\,\text{J}$, $78\%$ מהאנרגיה.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה, ציר $y$ צפונה. $\vec v_A = (0,\ 2.0)\,\text{m/s}$, $\vec v_B = 4.0\left(\cos30^\circ,\ -\sin30^\circ\right) = (3.46,\ -2.0)\,\text{m/s}$.
      - kind: law
        text: >-
          גופים שנצמדים: $\left(m_A + m_B\right)\vec v' = m_A\vec v_A + m_B\vec v_B$, בכל רכיב.
      - kind: manipulation
        text: >-
          $\vec p = (0 + 0.25\cdot3.46,\ 0.50\cdot2.0 - 0.25\cdot2.0) = (0.866,\ 0.500)\,\text{kg}\cdot\text{m/s}$, ו-$\vec v' = \vec p/0.75$.
      - kind: limit
        text: >-
          אם המסה של B שואפת לאפס, $\vec v'$ שואף ל-$\vec v_A$, צפונה. וכיוון התנע לא תלוי בכיוון של סכום המהירויות
          ($\vec v_A + \vec v_B = (3.46,\ 0)\,\text{m/s}$ פונה מזרחה בדיוק, הכיוון הלא נכון).
      - kind: units
        text: >-
          $\text{kg}\cdot\text{m/s}$ חלקי $\text{kg}$: מטר לשנייה; $\tfrac12mv^2$ בג׳אול.
      - kind: substitution
        text: >-
          $\vec v' = (1.155,\ 0.667)\,\text{m/s}$: גודל $1.33\,\text{m/s}$, וכיוון $\arctan(0.667/1.155) = 30.0^\circ$ צפונית
          למזרח. האנרגיה: לפני $\tfrac12\cdot0.50\cdot4.0 + \tfrac12\cdot0.25\cdot16 = 3.00\,\text{J}$, אחרי $\tfrac12\cdot0.75\cdot1.33^2 = 0.667\,\text{J}$.
      - kind: result
        text: >-
          $1.33\,\text{m/s}$, $30.0^\circ$ צפונית למזרח; אבדו $2.33\,\text{J}$.

  - id: W-4.3-05
    level: mid
    objectives: [OBJ-4.3-1]
    prompt: >-
      דיסקית חלקה במסה $0.10\,\text{kg}$ נעה ב-$2.4\,\text{m/s}$ ופוגעת בדיסקית חלקה במסה $0.40\,\text{kg}$ שעומדת. לשתיהן
      רדיוס $3.0\,\text{cm}$, פרמטר הפגיעה $1.5\,\text{cm}$, ומקדם התקומה $0.50$. מצאו את המהירות ואת כיוון התנועה של כל
      אחת אחרי ההתנגשות.
    answer: >-
      המטרה: $0.697\,\text{m/s}$ ב-$14.5^\circ$ מתחת לציר. הפוגעת: $0.759\,\text{m/s}$ ב-$113^\circ$, כלומר מעט אחורה.
    solution:
      - kind: given
        text: >-
          ציר $x$ בכיוון ההתחלתי, הראשית במרכז המטרה. $D = 6.0\,\text{cm}$, $\sin\varphi = 1.5/6.0 = 0.25$, $\varphi = 14.5^\circ$.
          $\mu = 0.10\cdot0.40/0.50 = 0.080\,\text{kg}$.
      - kind: law
        text: >-
          $J = (1 + e)\mu v\cos\varphi$ לאורך קו המרכזים; המטרה יוצאת לאורך הקו; הרכיב המשיק של הפוגעת נשמר.
      - kind: manipulation
        text: >-
          $v_2' = J/m_2$; $v_{1n}' = v\cos\varphi - J/m_1$; $v_{1t}' = v\sin\varphi$; $v_1' = \sqrt{v_{1n}'^2 + v_{1t}'^2}$.
      - kind: limit
        text: >-
          כש-$b \to 0$, $\varphi \to 0$, ו-$v_{1n}' \to \dfrac{m_1 - e\,m_2}{m_1 + m_2}v$: הנוסחה של שיעור 4.1 עם מקדם תקומה.
      - kind: units
        text: >-
          $J$ ב-$\text{kg}\cdot\text{m/s}$, ו-$J/m$ במטר לשנייה.
      - kind: substitution
        text: >-
          $w = 2.4\cos14.5^\circ = 2.32\,\text{m/s}$, $J = 1.5\cdot0.080\cdot2.32 = 0.279\,\text{N}\cdot\text{s}$. המטרה: $0.279/0.40 = 0.697\,\text{m/s}$.
          הפוגעת: $v_{1n}' = 2.32 - 0.279/0.10 = -0.465\,\text{m/s}$ ו-$v_{1t}' = 2.4\cdot0.25 = 0.600\,\text{m/s}$, ולכן $v_1' = 0.759\,\text{m/s}$, בזווית
          $113.3^\circ$ לכיוון ההתחלתי.
      - kind: result
        text: >-
          המטרה $0.697\,\text{m/s}$ ב-$(-14.5^\circ)$; הפוגעת $0.759\,\text{m/s}$ ב-$113^\circ$.

  - id: W-4.3-06
    level: mid
    objectives: [OBJ-4.3-2]
    prompt: >-
      כדור נע ב-$2.5\,\text{m/s}$ ומתנגש התנגשות אלסטית בכדור באותה מסה שעומד; הסיבוב של הכדורים זניח. אחרי ההתנגשות
      הכדור הפוגע נע ב-$1.5\,\text{m/s}$. מה מהירות הכדור השני, ובאילו זוויות לכיוון ההתחלתי נעים שניהם?
    answer: >-
      $2.0\,\text{m/s}$; הפוגע ב-$53.1^\circ$, והשני ב-$36.9^\circ$ לצד השני.
    solution:
      - kind: given
        text: >-
          מסות שוות, אחד עומד, התנגשות אלסטית; $v = 2.5\,\text{m/s}$, $v_1' = 1.5\,\text{m/s}$.
      - kind: law
        text: >-
          במסות שוות, אלסטית, אחד עומד: $\vec v = \vec v_1' + \vec v_2'$ ו-$v_1' \perp v_2'$, כלומר משולש ישר זווית שהיתר שלו $\vec v$.
      - kind: manipulation
        text: >-
          $v_2' = \sqrt{v^2 - v_1'^2}$; $\cos\theta_1 = v_1'/v$ ו-$\cos\theta_2 = v_2'/v$.
      - kind: limit
        text: >-
          כש-$v_1' \to v$, $v_2' \to 0$ ו-$\theta_1 \to 0$: פגיעה משיקה שלא שינתה כלום. כש-$v_1' \to 0$: פגיעה חזיתית.
      - kind: units
        text: >-
          כל הצלעות במטר לשנייה; הקוסינוסים חסרי ממדים.
      - kind: substitution
        text: >-
          $v_2' = \sqrt{6.25 - 2.25} = 2.0\,\text{m/s}$; $\theta_1 = \arccos0.60 = 53.1^\circ$, $\theta_2 = \arccos0.80 = 36.9^\circ$, וסכומן $90^\circ$.
      - kind: result
        text: >-
          $2.0\,\text{m/s}$; $53.1^\circ$ ו-$36.9^\circ$, משני צדי הכיוון ההתחלתי.

  - id: W-4.3-07
    level: mid
    qualitative: true
    objectives: [OBJ-4.3-2]
    prompt: >-
      דיסקית במסה $0.45\,\text{kg}$ מתנגשת התנגשות אלסטית בדיסקית במסה $0.20\,\text{kg}$ שעומדת.

      א. מה זווית הפיזור הגדולה ביותר של הדיסקית הכבדה? האם היא תלויה במהירות?

      ב. קבעו ונמקו: האם הדיסקית הקלה יכולה לצאת בזווית של יותר מ-$90^\circ$ לכיוון ההתחלתי?

      ג. מה החלק מהמהירות שנשאר לדיסקית הכבדה בפגיעה חזיתית?
    answer: >-
      א. $26.4^\circ$, לא תלויה במהירות. ב. לא. ג. $0.385$.
    solution:
      - kind: law
        text: >-
          $\sin\theta_{\max} = m_2/m_1$ כש-$m_1 \gt m_2$. בפגיעה חזיתית אלסטית $v_1' = \dfrac{m_1 - m_2}{m_1 + m_2}v$.
      - kind: reasoning
        text: >-
          א: היחס תלוי רק במסות; המהירות משנה את גודל כל הווקטורים באותו יחס (את $V$ ואת $u_1$), ולא את הזוויות. ב: המטרה
          עמדה, ולכן היא מקבלת רק את המתקף מהפוגעת, שיש לו רכיב קדימה; בדיסקיות חלקות היא יוצאת לאורך קו המרכזים,
          בזווית $\varphi \lt 90^\circ$. ובאופן כללי, התנע שלה הוא $\vec p - \vec p_1'$, ובמעגל התוצאות הרכיב שלו בכיוון
          ההתחלתי אינו שלילי.
      - kind: limit
        text: >-
          כש-$m_2 \to m_1$, $\theta_{\max} \to 90^\circ$ והחלק בפגיעה חזיתית שואף לאפס: חזרנו למסות שוות.
      - kind: units
        text: >-
          יחס מסות ויחס מהירויות, חסרי ממדים.
      - kind: substitution
        text: >-
          $\sin\theta_{\max} = 0.20/0.45 = 0.444$, $\theta_{\max} = 26.4^\circ$. בפגיעה חזיתית $0.25/0.65 = 0.385$.
      - kind: result
        text: >-
          א. $26.4^\circ$, בלי תלות במהירות. ב. לא. ג. $0.385$ מהמהירות.

  - id: W-4.3-08
    level: bagrut
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      דיסקית חלקה במסה $m$ ובמהירות $v$ מתנגשת התנגשות אלסטית בדיסקית חלקה במסה $5m$ שעומדת. אחרי ההתנגשות הדיסקית
      הכבדה נעה בזווית $40^\circ$ לכיוון ההתחלתי.

      א. מצאו את המהירות של כל אחת מהדיסקיות, כשבר מ-$v$, ואת הזווית שבה נעה הקלה.

      ב. בדקו את התשובה: מהזוויות בלבד, חשבו את יחס המסות.
    answer: >-
      א. הכבדה $0.255\,v$; הקלה $0.821\,v$ בזווית $88.5^\circ$, בצד השני. ב. $m_2/m_1 = 5.0$.
    solution:
      - kind: given
        text: >-
          ציר $x$ בכיוון ההתחלתי. הכבדה, שעמדה, יוצאת לאורך קו המרכזים, ולכן $\varphi = 40^\circ$. $m_1 = m$, $m_2 = 5m$, $e = 1$.
      - kind: law
        text: >-
          לאורך קו המרכזים התנגשות אלסטית בממד אחד, עם מהירות התקרבות $w = v\cos\varphi$; הרכיב המשיק של הקלה נשמר.
      - kind: manipulation
        text: >-
          $v_2' = \dfrac{2m_1}{m_1 + m_2}w = \tfrac13v\cos40^\circ$; $v_{1n}' = \dfrac{m_1 - m_2}{m_1 + m_2}w = -\tfrac23v\cos40^\circ$;
          $v_{1t}' = v\sin40^\circ$. בצירי $x$, $y$: $v_{1x}' = v_{1n}'\cos40^\circ + v_{1t}'\sin40^\circ$, $v_{1y}' = -v_{1n}'\sin40^\circ + v_{1t}'\cos40^\circ$.
      - kind: limit
        text: >-
          כש-$m_2 \to \infty$, $v_2' \to 0$ ו-$v_{1n}' \to -w$: הקלה נרתעת מקיר, וזווית ההחזרה שווה לזווית הפגיעה.
      - kind: units
        text: >-
          כל המהירויות כמכפלה של $v$ במספר.
      - kind: substitution
        text: >-
          $v_2' = 0.255\,v$; $v_{1n}' = -0.511\,v$, $v_{1t}' = 0.643\,v$, $v_1' = 0.821\,v$; $v_{1x}' = 0.022\,v$, $v_{1y}' = 0.821\,v$, ולכן
          $\theta_1 = 88.5^\circ$. ב: $\dfrac{\sin\theta_1}{\sin\left(\theta_1 + 2\theta_2\right)} = \dfrac{\sin88.5^\circ}{\sin168.5^\circ} = 5.0$.
      - kind: result
        text: >-
          א. $0.255\,v$ ו-$0.821\,v$ ב-$88.5^\circ$. ב. $5.0$.

  - id: W-4.3-09
    level: bagrut
    objectives: [OBJ-4.3-1]
    prompt: >-
      דיסקית חלקה במסה $0.12\,\text{kg}$ נעה ב-$2.0\,\text{m/s}$ ופוגעת בדיסקית חלקה במסה $0.18\,\text{kg}$ שעומדת. בצילום
      רואים את כיווני התנועה אחרי ההתנגשות: הפוגעת ב-$54.7^\circ$ מעל הכיוון ההתחלתי, והמטרה ב-$36.9^\circ$ מתחתיו.
      המהירויות לא נמדדו.

      א. מצאו את שתי המהירויות.

      ב. מצאו את מקדם התקומה ואת החלק מהאנרגיה הקינטית שאבד.
    answer: >-
      א. $1.20\,\text{m/s}$ ו-$1.09\,\text{m/s}$. ב. $e = 0.70$; כ-$19\%$ מהאנרגיה אבד.
    solution:
      - kind: given
        text: >-
          ציר $x$ בכיוון ההתחלתי, $y$ כלפי הצד של הפוגעת. $\theta_1 = 54.7^\circ$, $\theta_2 = -36.9^\circ$. שני כיוונים ידועים: זה
          הנתון הנוסף, ולכן שתי משוואות התנע מספיקות לשני הגדלים.
      - kind: law
        text: >-
          $m_1v = m_1v_1'\cos\theta_1 + m_2v_2'\cos\theta_2$ ו-$0 = m_1v_1'\sin\theta_1 + m_2v_2'\sin\theta_2$. בדיסקיות חלקות המטרה
          יוצאת לאורך קו המרכזים, ולכן $\hat n$ בכיוון $\theta_2$, ו-$e$ הוא יחס מהירויות ההתרחקות וההתקרבות לאורך $\hat n$.
      - kind: manipulation
        text: >-
          מהמשוואה השנייה $m_2v_2' = -m_1v_1'\sin\theta_1/\sin\theta_2$; מציבים בראשונה ומקבלים
          $v_1' = \dfrac{v\sin\theta_2}{\sin\left(\theta_2 - \theta_1\right)}$. לאורך $\hat n$: $w = v\cos\theta_2$, $e = \dfrac{v_2' - v_1'\cos\left(\theta_1 - \theta_2\right)}{w}$.
      - kind: limit
        text: >-
          אם $\theta_1 \to 0$ ו-$\theta_2 \to 0$ (פגיעה חזיתית), המכנה $\sin\left(\theta_2 - \theta_1\right)$ שואף לאפס: הכיוונים כבר לא
          מספיקים, וצריך נתון אחר, כמו בממד אחד.
      - kind: units
        text: >-
          יחס סינוסים חסר ממדים כפול $v$: מטר לשנייה. $e$ יחס מהירויות.
      - kind: substitution
        text: >-
          $\sin\left(\theta_2 - \theta_1\right) = \sin(-91.6^\circ) = -1.00$, ולכן $v_1' = 2.0\cdot\sin(-36.9^\circ)/(-1.00) = 1.20\,\text{m/s}$ ו-$v_2' = 0.12\cdot1.20\cdot\sin54.7^\circ/(0.18\cdot\sin36.9^\circ) = 1.09\,\text{m/s}$.
          $w = 2.0\cos36.9^\circ = 1.60\,\text{m/s}$; לאורך $\hat n$ הפוגעת נעה ב-$1.20\cos91.6^\circ = -0.034\,\text{m/s}$, ולכן
          $e = (1.09 + 0.034)/1.60 = 0.70$. האנרגיה: $0.240\,\text{J}$ לפני, $0.193\,\text{J}$ אחרי.
      - kind: result
        text: >-
          א. $1.20$ ו-$1.09\,\text{m/s}$. ב. $e = 0.70$; אבדו כ-$19\%$ מהאנרגיה.

  - id: W-4.3-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-4.3-2]
    prompt: >-
      שתי דיסקיות חלקות זהות נעות על שולחן אוויר באותו כיוון, לאורך ציר $x$: A ב-$2.0\,\text{m/s}$ ו-B, לפניה, ב-$0.5\,\text{m/s}$.
      A משיגה את B, וברגע המגע קו המרכזים נטוי ב-$30^\circ$ לציר $x$. ההתנגשות אלסטית.

      א. קבעו ונמקו, בלי חישוב: באיזו מערכת ייחוס יוצאות הדיסקיות בזווית ישרה זו לזו?

      ב. מצאו את המהירויות של שתיהן במערכת המעבדה, ואת הזווית ביניהן שם.
    answer: >-
      א. במערכת שנעה ב-$0.5\,\text{m/s}$ לאורך $x$, שבה B עומדת לפני ההתנגשות. ב. A: $1.09\,\text{m/s}$ ב-$36.6^\circ$; B:
      $1.75\,\text{m/s}$ ב-$(-21.8^\circ)$; ביניהן $58.4^\circ$.
    solution:
      - kind: law
        text: >-
          הזווית הישרה דורשת מסות שוות, התנגשות אלסטית ומטרה שעומדת. מעבר למערכת ייחוס שנעה במהירות קבועה (שיעור 1.5)
          משאיר את חוקי השימור כמו שהם, ולכן הם חלים גם שם.
      - kind: reasoning
        text: >-
          א: במערכת שנעה עם B, B עומדת ו-A נעה ב-$1.5\,\text{m/s}$, ולכן שם הדיסקיות נפרדות בזווית ישרה. במערכת המעבדה
          מוסיפים לשתי המהירויות את אותו וקטור, $(0.5,\ 0)\,\text{m/s}$, וזה משנה את הזווית ביניהן.
      - kind: manipulation
        text: >-
          במערכת של B: B יוצאת לאורך קו המרכזים ב-$1.5\cos30^\circ = 1.30\,\text{m/s}$, ו-A ב-$1.5\sin30^\circ = 0.75\,\text{m/s}$ ניצב לו.
          ברכיבים: A $(0.375,\ 0.650)$, B $(1.125,\ -0.650)\,\text{m/s}$. במעבדה מוסיפים $0.5$ לרכיב $x$.
      - kind: limit
        text: >-
          כשמהירות B שואפת לאפס, חוזרים למטרה שעומדת, והזווית במעבדה שואפת ל-$90^\circ$.
      - kind: units
        text: >-
          כל המהירויות במטר לשנייה; הזווית מ-$\cos\alpha = \vec v_A'\cdot\vec v_B'/\left(v_A'v_B'\right)$, חסר ממדים.
      - kind: substitution
        text: >-
          A: $(0.875,\ 0.650)\,\text{m/s}$, $1.09\,\text{m/s}$ ב-$36.6^\circ$; B: $(1.625,\ -0.650)\,\text{m/s}$, $1.75\,\text{m/s}$ ב-$-21.8^\circ$.
          הזווית ביניהן $36.6^\circ + 21.8^\circ = 58.4^\circ$. האנרגיה נשמרת: $2.125\,\text{J/kg}$ לפני ואחרי (ליחידת מסה של כל דיסקית).
      - kind: result
        text: >-
          א. במערכת שבה B עומדת. ב. $58.4^\circ$ במעבדה: הכלל של $90^\circ$ חל רק כשהמטרה עומדת.

challenge:
  - id: W-4.3-c1
    stars: 1
    objectives: [OBJ-4.3-1, OBJ-4.3-2]
    prompt: >-
      חלקיק 1 במסה $m$ נע במהירות $v$ בכיוון ציר $x$ ומתנגש התנגשות אלסטית בחלקיק 2 במסה $2m$ שעומד. אחרי ההתנגשות
      חלקיק 2 נע בזווית $45^\circ$ מעל ציר $x$, וחלקיק 1 בזווית $\theta_1$ מתחת לציר.

      א. מצאו את $\tan\theta_1$.

      ב. מצאו את המהירויות של שני החלקיקים, כשבר מ-$v$.

      ג. אם החלקיקים הם דיסקיות חלקות בעלות סכום רדיוסים $D$, באיזה פרמטר פגיעה התקבלה ההתנגשות הזו?
    answer: >-
      א. $\tan\theta_1 = 2$, כלומר $\theta_1 = 63.4^\circ$. ב. $v_1' = \tfrac{\sqrt5}{3}v = 0.745\,v$, $v_2' = \tfrac{\sqrt2}{3}v = 0.471\,v$.
      ג. $b = D/\sqrt2 = 0.707\,D$.
    solution:
      - kind: given
        text: >-
          $m_1 = m$, $m_2 = 2m$, $\theta_2 = 45^\circ$ מעל ציר $x$, $\theta_1$ מתחתיו; התנגשות אלסטית.
      - kind: law
        text: >-
          $x$: $mv = mv_1'\cos\theta_1 + 2mv_2'\cos45^\circ$. $y$: $0 = 2mv_2'\sin45^\circ - mv_1'\sin\theta_1$. אנרגיה:
          $v^2 = v_1'^2 + 2v_2'^2$.
      - kind: manipulation
        text: >-
          נסמן $a = \sqrt2\,v_2'$ (אז $2v_2'\cos45^\circ = 2v_2'\sin45^\circ = a$). מהמשוואות: $v_1'\cos\theta_1 = v - a$,
          $v_1'\sin\theta_1 = a$. מעלים בריבוע ומחברים: $v_1'^2 = v^2 - 2va + 2a^2$. האנרגיה נותנת $v_1'^2 = v^2 - a^2$.
          משווים: $3a^2 = 2va$, כלומר $a = \tfrac23v$. אז $\tan\theta_1 = \dfrac{a}{v - a} = 2$.
      - kind: limit
        text: >-
          אילו המסות היו שוות, הזווית הישרה הייתה נותנת $\theta_1 = 45^\circ$; המטרה כאן כבדה פי 2, והפוגע הקל מוסט יותר,
          ב-$63.4^\circ$. בדיקה בנוסחה של דוגמה 5 בשיעור: $\sin\theta_1/\sin\left(\theta_1 + 2\theta_2\right) = \sin63.4^\circ/\sin153.4^\circ = 2.00$.
          ובדיסקיות: כש-$b \to D$, $\theta_2 \to 90^\circ$ (פגיעה משיקה), וכש-$b \to 0$, $\theta_2 \to 0$.
      - kind: units
        text: >-
          $a$ ו-$v_1'$ כמכפלות של $v$; $b/D$ חסר ממדים.
      - kind: substitution
        text: >-
          $v_2' = a/\sqrt2 = \tfrac{\sqrt2}{3}v = 0.471\,v$; $v_1' = \sqrt{v^2 - a^2} = \tfrac{\sqrt5}{3}v = 0.745\,v$; $\theta_1 = \arctan2 = 63.4^\circ$.
          בדיסקיות חלקות המטרה יוצאת לאורך קו המרכזים, ולכן $\varphi = 45^\circ$ ו-$b = D\sin45^\circ = 0.707\,D$.
      - kind: result
        text: >-
          א. $\tan\theta_1 = 2$. ב. $0.745\,v$ ו-$0.471\,v$. ג. $b = 0.707\,D$.
    source:
      name: MIT 8.01 Classical Mechanics (OCW 8.01SC), Problem Set 9
      year: 2016
      problem: Problem 6, Elastic 2D Collision
      url: https://ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/aa4bd69ba9ac09a42a3d75892d2c46c6_MIT8_01F16_pset9.pdf
      verified: '2026-11-10'
      adapted: true

  - id: W-4.3-c2
    stars: 2
    objectives: [OBJ-4.3-1]
    prompt: >-
      כדור במסה $m$ נע כלפי מטה בדף במהירות $v$, וכדור במסה $2m$ נע ימינה במהירות $v$. הם מתנגשים, ואין כוחות חיצוניים.
      אחרי ההתנגשות הכדור הכבד נע כלפי מטה במהירות $v$, והקל נע במהירות $U$ בזווית $\theta$ מעל הכיוון ימינה.

      א. מצאו את $U$ ואת $\theta$.

      ב. כמה אנרגיה קינטית נוספה או אבדה? איזה סוג של התנגשות זו, ומה צריך להיות בתוך הכדורים כדי שתקרה?

      ג. הוכיחו שאין התנגשות **אלסטית** שבה הכדור הכבד יוצא כלפי מטה בדיוק, באיזו מהירות שהיא.
    answer: >-
      א. $U = \sqrt5\,v = 2.24\,v$, $\theta = \arctan\tfrac12 = 26.6^\circ$. ב. נוספו $2mv^2$: התנגשות שבה האנרגיה גדלה,
      שדורשת מקור אנרגיה בתוך הגופים, כמו קפיץ דרוך. ג. משוואת האנרגיה נותנת $3w^2 - 2wv + v^2 = 0$, שאין לה פתרון ממשי.
    solution:
      - kind: given
        text: >-
          ציר $x$ ימינה, ציר $y$ כלפי מעלה. לפני: הקל $(0,\ -v)$, הכבד $(v,\ 0)$. אחרי: הכבד $(0,\ -v)$, הקל $U(\cos\theta,\ \sin\theta)$.
      - kind: law
        text: >-
          שימור התנע בכל רכיב: $x$: $2mv = mU\cos\theta$; $y$: $-mv = -2mv + mU\sin\theta$.
      - kind: manipulation
        text: >-
          $U\cos\theta = 2v$ ו-$U\sin\theta = v$, ולכן $\tan\theta = \tfrac12$ ו-$U = \sqrt{(2v)^2 + v^2}$. ב: האנרגיה של הכבד לא
          השתנתה, ולכן $\Delta K = \tfrac12mU^2 - \tfrac12mv^2$. ג: נניח שהכבד יוצא כלפי מטה במהירות $w$. אז $U_x = 2v$ ו-$U_y = 2w - v$,
          ושימור האנרגיה, $\tfrac12mv^2 + \tfrac12(2m)v^2 = \tfrac12(2m)w^2 + \tfrac12m\left[4v^2 + (2w - v)^2\right]$, מצטמצם ל-$3w^2 - 2wv + v^2 = 0$.
      - kind: limit
        text: >-
          הדיסקרימיננטה של המשוואה בג היא $4v^2 - 12v^2 = -8v^2 \lt 0$: אין פתרון. ואכן, האנרגיה שאחרי ההתנגשות, כפונקציה
          של $w$, היא $m\left(3w^2 - 2wv + \tfrac52v^2\right)$, והמינימום שלה, ב-$w = v/3$, הוא $\tfrac{13}{6}mv^2$, יותר מ-$\tfrac32mv^2$
          שהיו לפני: כל תוצאה כזו מוסיפה אנרגיה.
      - kind: units
        text: >-
          כל איבר במשוואות התנע הוא מסה כפול מהירות, וכל איבר באנרגיה מסה כפול מהירות בריבוע.
      - kind: substitution
        text: >-
          $U = \sqrt5\,v = 2.24\,v$, $\theta = 26.6^\circ$. $\Delta K = \tfrac12m\left(5v^2 - v^2\right) = 2mv^2$: מ-$\tfrac32mv^2$ ל-$\tfrac72mv^2$.
      - kind: result
        text: >-
          א. $U = 2.24\,v$ ב-$26.6^\circ$. ב. נוספו $2mv^2$; נדרש מקור אנרגיה פנימי. ג. אין פתרון אלסטי.
    source:
      name: MIT 8.012 Physics I, Fall 2008 (OCW), Exam 2 (Quiz 2) with solutions
      year: 2008
      problem: Problem 2, Collision
      url: https://ocw.mit.edu/courses/8-012-physics-i-classical-mechanics-fall-2008/4f115573bb20efc33f9a73454ebca220_exam2sol.pdf
      verified: '2026-11-10'
      adapted: true

# gravitational acceleration without rotation, OMEGA_EARTH = 7.29e-5 rad/s, R_EARTH = 6.37e6 m),
# src/physics/rotating.ts and src/physics/earthrot.ts (ω²R = 0.0339 m/s²):
#   W01 |g_eff|: pole 9.800, 45° 9.783, ±30° 9.775, equator 9.766 m/s²;
#   W02 λ = 50°: ω²R cos λ = 0.0218, up 0.0140, toward the equator 0.0167 m/s²; R cos λ = 4.09e3 km;
#   W04 λ = 20°: α = 1.11e-3 rad = 0.0638°; a 30 m line: 33.4 mm;
#   W05 50 m at 10°: t = 3.19 s, d = 7.64 mm east;
#   W06 55°: 12.3°/h, 37.0° in 3 h (clockwise), a turn in 29.2 h;
#   W07 2.0e5 kg, 30 m/s north, 50°: 670 N toward the east rail (3.42e-4 of the weight);
#   W08 800 m/s over 1000 m at 45°: t = 1.25 s, ω sin λ v t² = 6.44 cm to the right (an RK4 run agrees);
#   W09 river 2 m/s north, 45°, 1 km: 2ωv sin λ = 2.06e-4 m/s², tilt 2.10e-5 rad, 2.10 cm, east bank higher;
#   W10 α = 1° at 45°: first order ω = 2.32e-4 rad/s (7.53 h); exact ω = 2.30e-4 rad/s, a day of 7.60 h (3.15 ω);
#   c1 52°: a puck at 5 m/s circles clockwise, r = 43.5 km, once in 15.2 h; a train at 50 m/s: φ = 5.86e-4 rad

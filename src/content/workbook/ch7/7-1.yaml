lesson: '7.1'
practice:
  - id: W-7.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-7.1-1]
    prompt: >-
      נוסע שמסתו $m$ יושב בכל אחד מכלי הרכב הבאים. במערכת הייחוס של כלי הרכב, קבעו ונמקו: האם יש על הנוסע כוח מדומה,
      ואם כן, לאיזה כיוון הוא פונה.

      א. מטוס שמאיץ על המסלול לפני ההמראה.

      ב. אוטובוס שבולם לפני תחנה.

      ג. מעלית שמתחילה לרדת מהקומה העליונה.

      ד. רכבת שנוסעת על מסילה ישרה במהירות קבועה של $300\,\text{km/h}$.
    answer: >-
      א. אחורה. ב. קדימה. ג. כלפי מעלה. ד. אין כוח מדומה.
    solution:
      - kind: law
        text: >-
          במערכת שמאיצה בתאוצה $\vec A$ ביחס למערכת אינרציאלית, $\vec F_{\text{fict}} = -m\vec A$: הפוך לתאוצה של המערכת, לא לכיוון התנועה שלה.
      - kind: reasoning
        text: >-
          א: המטוס מאיץ קדימה, ולכן הכוח המדומה פונה אחורה (הנוסע נלחץ למושב). ב: אוטובוס שבולם מאיץ אחורה, ולכן הכוח המדומה
          פונה קדימה. ג: מעלית שמתחילה לרדת ממנוחה מאיצה כלפי מטה, ולכן הכוח המדומה פונה כלפי מעלה (הנוסע "קל" לרגע). ד: מהירות
          קבועה בקו ישר: $\vec A = 0$, הרכבת היא מערכת אינרציאלית, ואין כוח מדומה, בכל מהירות.
      - kind: limit
        text: >-
          כש-$\vec A \to 0$ הכוח המדומה נעלם, בכל מהירות: זו מסקנת שיעור 1.5, שמערכות שנעות במהירות קבועה שקולות זו לזו.
      - kind: units
        text: >-
          $m\vec A$ ב-$\text{kg}\cdot\text{m/s}^2 = \text{N}$.
      - kind: result
        text: >-
          א. אחורה. ב. קדימה. ג. כלפי מעלה. ד. אין. בכל מקרה הכוח המדומה הפוך ל**תאוצה**, ואף גוף לא מפעיל אותו.

  - id: W-7.1-02
    level: basic
    objectives: [OBJ-7.1-2]
    prompt: >-
      בקרון של רכבת שמאיצה על מסילה ישרה ואופקית, משקולת תלויה בחוט מהתקרה ונמצאת במנוחה ביחס לקרון. החוט נוטה
      $12^\circ$ מהאנכי, אחורה. מה התאוצה של הרכבת?
    answer: >-
      $A = g\tan12^\circ = 2.08\,\text{m/s}^2$, קדימה.
    solution:
      - kind: given
        text: >-
          ציר $x$ בכיוון הנסיעה, ציר $y$ כלפי מעלה. $\theta = 12^\circ$ מהאנכי, המשקולת מאחורי נקודת התלייה.
      - kind: law
        text: >-
          במערכת הקרון המשקולת במנוחה: $\vec T + m\vec g - m\vec A = 0$.
      - kind: manipulation
        text: >-
          ברכיבים: $T\sin\theta - mA = 0$ ו-$T\cos\theta - mg = 0$. מחלקים: $\tan\theta = A/g$, ולכן $A = g\tan\theta$.
      - kind: limit
        text: >-
          כש-$\theta \to 0$, $A \to 0$; כש-$\theta \to 90^\circ$, $A \to \infty$. המסה ואורך החוט לא נכנסים.
      - kind: units
        text: >-
          $\tan\theta$ חסר ממדים, ו-$g\tan\theta$ ב-$\text{m/s}^2$.
      - kind: substitution
        text: >-
          $A = 9.8\cdot\tan12^\circ = 2.08\,\text{m/s}^2$.
      - kind: result
        text: >-
          $2.08\,\text{m/s}^2$, קדימה: החוט נוטה הפוך לתאוצה.

  - id: W-7.1-03
    level: basic
    objectives: [OBJ-7.1-2]
    prompt: >-
      תיק שמסתו $5.0\,\text{kg}$ תלוי על מאזני קפיץ שמחוברים לתקרת מעלית, והוא במנוחה ביחס למעלית. המאזניים מראים
      $41\,\text{N}$. מה גודל התאוצה של המעלית ומה כיוונה? האם אפשר לדעת אם המעלית עולה או יורדת?
    answer: >-
      $1.60\,\text{m/s}^2$ כלפי מטה. אי אפשר לדעת: היא יכולה לרדת ולהאיץ, או לעלות ולהאט.
    solution:
      - kind: given
        text: >-
          ציר $y$ כלפי מעלה. $m = 5.0\,\text{kg}$, הקריאה $T = 41\,\text{N}$, והתיק במנוחה ביחס למעלית.
      - kind: law
        text: >-
          במערכת המעלית: $T - mg - mA = 0$, כאשר $A$ התאוצה של המעלית ברכיב $y$.
      - kind: manipulation
        text: >-
          $A = \dfrac{T}{m} - g$.
      - kind: limit
        text: >-
          אם $T = mg$, $A = 0$: מהירות קבועה או מנוחה. אם $T = 0$, $A = -g$: נפילה חופשית.
      - kind: units
        text: >-
          $\text{N}/\text{kg} = \text{m/s}^2$.
      - kind: substitution
        text: >-
          $A = \dfrac{41}{5.0} - 9.8 = 8.2 - 9.8 = -1.60\,\text{m/s}^2$.
      - kind: result
        text: >-
          $1.60\,\text{m/s}^2$ כלפי מטה. הקריאה תלויה רק בתאוצה, ולכן היא לא מגלה את כיוון התנועה: מעלית שיורדת ומאיצה ומעלית
          שעולה ומאטה נותנות אותה קריאה.

  - id: W-7.1-04
    level: mid
    objectives: [OBJ-7.1-1]
    prompt: >-
      ארגז עומד על הרצפה האופקית של משאית פתוחה, $3.0\,\text{m}$ לפני הדופן האחורית, שאין בה דלת. מקדם החיכוך הסטטי
      בין הארגז לרצפה $0.35$, והקינטי $0.25$. המשאית מתחילה לנסוע ומאיצה קדימה ב-$4.5\,\text{m/s}^2$.

      א. מה התאוצה הגדולה ביותר שבה הארגז לא היה מחליק? האם הוא מחליק כאן?

      ב. מה התאוצה של הארגז ביחס למשאית?

      ג. אחרי כמה זמן הוא נופל מהמשאית, ובאיזו מהירות ביחס למשאית?
    answer: >-
      א. $3.43\,\text{m/s}^2$; כן, הוא מחליק. ב. $2.05\,\text{m/s}^2$ אחורה. ג. אחרי $1.71\,\text{s}$, ב-$3.51\,\text{m/s}$ אחורה ביחס למשאית.
    solution:
      - kind: given
        text: >-
          ציר $x$ קדימה. $A = 4.5\,\text{m/s}^2$, $\mu_s = 0.35$, $\mu_k = 0.25$, מרחק $d = 3.0\,\text{m}$ לדופן האחורית.
      - kind: law
        text: >-
          במערכת המשאית: $ma'_x = f - mA$, כאשר $f$ החיכוך על הארגז. החיכוך הסטטי מוגבל ב-$\mu_s mg$, והקינטי שווה ל-$\mu_k mg$
          ומתנגד להחלקה היחסית.
      - kind: manipulation
        text: >-
          א: כדי שהארגז יישאר במנוחה ביחס למשאית צריך $f = mA$, וזה אפשרי רק אם $mA \le \mu_s mg$, כלומר $A \le \mu_s g$.
          ב: בהחלקה הארגז נע אחורה ביחס לרצפה, והחיכוך עליו פונה קדימה: $ma'_x = \mu_k mg - mA$.
          ג: ממנוחה, בתאוצה קבועה: $d = \tfrac12|a'|t^2$, ו-$v' = |a'|t$.
      - kind: limit
        text: >-
          אם $\mu_k \to 0$, הארגז "נשאר במקום" ביחס לכביש, ו-$a' = -A$. אם $\mu_k$ היה גדול מ-$A/g$, הוא לא היה מחליק כלל (ואז
          גם $\mu_s \ge \mu_k$ מספיק). **בדיקה במערכת הכביש:** הארגז מאיץ קדימה ב-$\mu_k g = 2.45\,\text{m/s}^2$ והמשאית ב-$4.5$,
          וההפרש $2.05\,\text{m/s}^2$.
      - kind: units
        text: >-
          $\mu g$ ב-$\text{m/s}^2$; $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$.
      - kind: substitution
        text: >-
          א: $\mu_s g = 0.35\cdot9.8 = 3.43\,\text{m/s}^2 \lt 4.5$. ב: $a'_x = 0.25\cdot9.8 - 4.5 = -2.05\,\text{m/s}^2$.
          ג: $t = \sqrt{2\cdot3.0/2.05} = 1.71\,\text{s}$, $v' = 2.05\cdot1.71 = 3.51\,\text{m/s}$.
      - kind: result
        text: >-
          א. $3.43\,\text{m/s}^2$, ולכן ב-$4.5\,\text{m/s}^2$ הוא מחליק. ב. $2.05\,\text{m/s}^2$ אחורה. ג. $1.71\,\text{s}$, $3.51\,\text{m/s}$ אחורה ביחס למשאית.

  - id: W-7.1-05
    level: mid
    qualitative: true
    objectives: [OBJ-7.1-2]
    prompt: >-
      אסטרונאוטית סגורה בתא בלי חלונות, ויש לה כמה ניסויים. לכל ניסוי, קבעו ונמקו אם הוא מבחין בין שני המצבים.

      מצב 1: התא עומד על פני כדור הארץ. מצב 2: התא רחוק מכל כוכב, ומנוע מאיץ אותו ב-$9.8\,\text{m/s}^2$ "כלפי מעלה".

      א. מאזניים שהיא עומדת עליהם.

      ב. זמן המחזור של מטוטלת.

      ג. שחרור באותו רגע, מאותו גובה, של כדור עופרת ושל כדור עץ.

      ד. מדידה מדויקת מאוד של המרחק בין שני כדורים שהיא משחררת במקביל, זה לצד זה, בקצוות של תא ברוחב מאות מטרים.
    answer: >-
      א, ב, ג: לא מבחינים. ד: באופן עקרוני מבחין, כי על כדור הארץ שני הכדורים נופלים אל המרכז ומתקרבים מעט, ובחללית לא.
    solution:
      - kind: law
        text: >-
          בתא שמאיץ ב-$\vec A$ כל גוף "מרגיש" $\vec g_{\text{eff}} = \vec g - \vec A$. במצב 1, $\vec g_{\text{eff}} = \vec g$; במצב 2,
          $\vec g = 0$ ו-$\vec g_{\text{eff}} = -\vec A$, אותו וקטור. עקרון השקילות: בניסוי מקומי השניים לא ניתנים להבחנה.
      - kind: reasoning
        text: >-
          א: המאזניים מראים $mg_{\text{eff}}$, אותו מספר. ב: $2\pi\sqrt{L/g_{\text{eff}}}$, אותו זמן. ג: שני הכדורים נופלים
          באותה תאוצה $g_{\text{eff}}$ בשני המצבים, כי גם הכובד וגם הכוח המדומה פרופורציוניים למסה. בחללית זה ברור במיוחד
          במבט מבחוץ: הכדורים מרחפים, והרצפה עולה אל שניהם יחד.
      - kind: reasoning
        text: >-
          ד: על כדור הארץ הכובד על כל כדור פונה אל מרכז כדור הארץ, ושני הכיוונים נפגשים שם, ולכן הכדורים מתקרבים זה לזה
          בתאוצה יחסית של כ-$gd/R$. בחללית $\vec A$ זהה בכל מקום בתא, והם נופלים במקביל. זה כבר לא ניסוי מקומי.
      - kind: limit
        text: >-
          כש-$d/R \to 0$, ההבדל ב-ד נעלם: בתא קטן, ובזמן קצר, עקרון השקילות מדויק.
      - kind: units
        text: >-
          $gd/R$ ב-$\text{m/s}^2$, כמו תאוצה.
      - kind: result
        text: >-
          א, ב, ג לא מבחינים בין המצבים. ד מבחין, כי הוא לא מקומי: שדה הכובד של כוכב אינו אחיד.

  - id: W-7.1-06
    level: mid
    objectives: [OBJ-7.1-2]
    prompt: >-
      במעלית תלויה מטוטלת פשוטה באורך $1.2\,\text{m}$. כשהמעלית מאיצה בתאוצה קבועה, זמן המחזור של תנודות קטנות שנמדד
      במעלית הוא $2.0\,\text{s}$. מה התאוצה של המעלית, גודל וכיוון?
    answer: >-
      $2.04\,\text{m/s}^2$ כלפי מעלה.
    solution:
      - kind: given
        text: >-
          ציר $y$ כלפי מעלה. $L = 1.2\,\text{m}$, זמן המחזור $T_0 = 2.0\,\text{s}$ במעלית.
      - kind: law
        text: >-
          במערכת המעלית המטוטלת מתנודדת בשדה $g_{\text{eff}} = g + A$ ($A$ חיובי כלפי מעלה): $T_0 = 2\pi\sqrt{L/g_{\text{eff}}}$.
      - kind: manipulation
        text: >-
          $g_{\text{eff}} = \dfrac{4\pi^2L}{T_0^2}$, ו-$A = g_{\text{eff}} - g$.
      - kind: limit
        text: >-
          אם $T_0$ היה זמן המחזור במנוחה, $2\pi\sqrt{1.2/9.8} = 2.20\,\text{s}$, היה יוצא $A = 0$. זמן מחזור קצר יותר אומר $g_{\text{eff}} > g$, כלומר תאוצה כלפי מעלה.
      - kind: units
        text: >-
          $\text{m}/\text{s}^2$.
      - kind: substitution
        text: >-
          $g_{\text{eff}} = \dfrac{4\pi^2\cdot1.2}{2.0^2} = 11.8\,\text{m/s}^2$, ו-$A = 11.8 - 9.8 = 2.04\,\text{m/s}^2$.
      - kind: result
        text: >-
          $2.04\,\text{m/s}^2$ כלפי מעלה. (המעלית יכולה לעלות ולהאיץ, או לרדת ולהאט.)

  - id: W-7.1-07
    level: mid
    objectives: [OBJ-7.1-1]
    prompt: >-
      ספר מונח על שולחן חלק בקרון רכבת, בקצה הקדמי של השולחן, במנוחה ביחס לקרון. ברגע מסוים הרכבת מתחילה להאיץ קדימה
      ב-$0.80\,\text{m/s}^2$. השולחן באורך $1.0\,\text{m}$ לאורך הקרון. אחרי כמה זמן מגיע הספר לקצה האחורי של השולחן, ובאיזו
      מהירות ביחס לשולחן? תארו את התנועה גם במערכת הייחוס של הרציף.
    answer: >-
      אחרי $1.58\,\text{s}$, ב-$1.26\,\text{m/s}$ אחורה ביחס לשולחן. ביחס לרציף הספר לא זז כלל.
    solution:
      - kind: given
        text: >-
          ציר $x$ קדימה. $A = 0.80\,\text{m/s}^2$, $L = 1.0\,\text{m}$, השולחן חלק, הספר מתחיל ממנוחה ביחס לקרון.
      - kind: law
        text: >-
          במערכת הקרון: $ma'_x = -mA$, כי אין כוח אופקי אמיתי על הספר.
      - kind: manipulation
        text: >-
          $a'_x = -A$, קבועה. ממנוחה: $L = \tfrac12At^2$, ולכן $t = \sqrt{2L/A}$ ו-$v' = At = \sqrt{2AL}$.
      - kind: limit
        text: >-
          כש-$A \to 0$, $t \to \infty$: הספר נשאר במקומו. **בדיקה במערכת הרציף:** הספר לא זז (אין עליו כוח אופקי, והרכבת
          התחילה ממנוחה), והשולחן נע מתחתיו $\tfrac12At^2 = 1.0\,\text{m}$.
      - kind: units
        text: >-
          $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$; $\sqrt{(\text{m/s}^2)\cdot\text{m}} = \text{m/s}$.
      - kind: substitution
        text: >-
          $t = \sqrt{2\cdot1.0/0.80} = 1.58\,\text{s}$, $v' = 0.80\cdot1.58 = 1.26\,\text{m/s}$.
      - kind: result
        text: >-
          $1.58\,\text{s}$; $1.26\,\text{m/s}$ אחורה ביחס לשולחן. ביחס לרציף הספר נשאר במקום, והשולחן "נשלף" מתחתיו.

  - id: W-7.1-08
    level: bagrut
    objectives: [OBJ-7.1-1, OBJ-7.1-2]
    prompt: >-
      במעלית עומד טריז, ועליו מדרון חלק בזווית $30^\circ$ לאופק. גוש שמסתו $1.5\,\text{kg}$ משתחרר ממנוחה (ביחס למעלית) על
      המדרון, ברגע שבו המעלית מתחילה להאיץ כלפי מעלה ב-$2.6\,\text{m/s}^2$.

      א. מה התאוצה של הגוש לאורך המדרון, ביחס למעלית?

      ב. מה הכוח הנורמלי עליו?

      ג. כמה זמן לוקח לו להחליק $1.0\,\text{m}$ לאורך המדרון? השוו למעלית שעומדת.
    answer: >-
      א. $6.20\,\text{m/s}^2$ במורד המדרון. ב. $16.1\,\text{N}$. ג. $0.568\,\text{s}$, לעומת $0.639\,\text{s}$ במעלית שעומדת.
    solution:
      - kind: given
        text: >-
          $\alpha = 30^\circ$, $m = 1.5\,\text{kg}$, $A = 2.6\,\text{m/s}^2$ כלפי מעלה, המדרון חלק, $s = 1.0\,\text{m}$.
      - kind: law
        text: >-
          במערכת המעלית: $m\vec a' = \vec N + m\vec g_{\text{eff}}$, עם $\vec g_{\text{eff}} = \vec g - \vec A$: כלפי מטה, בגודל $g + A$.
      - kind: manipulation
        text: >-
          במערכת המעלית זה מדרון רגיל בשדה $g_{\text{eff}}$. צירים: לאורך המדרון כלפי מטה, וניצב לו. לאורך המדרון:
          $a' = g_{\text{eff}}\sin\alpha$. בניצב: $N = mg_{\text{eff}}\cos\alpha$. ממנוחה: $t = \sqrt{2s/a'}$.
      - kind: limit
        text: >-
          כש-$A \to 0$ חוזרים למדרון רגיל, $g\sin\alpha$. כש-$A \to -g$ (נפילה חופשית) $a' \to 0$ ו-$N \to 0$: הגוש מרחף ליד
          המדרון. כש-$\alpha \to 0$, $a' \to 0$ ו-$N \to mg_{\text{eff}}$, כמו על מאזניים.
      - kind: units
        text: >-
          $g_{\text{eff}}\sin\alpha$ ב-$\text{m/s}^2$, $mg_{\text{eff}}\cos\alpha$ ב-$\text{N}$.
      - kind: substitution
        text: >-
          $g_{\text{eff}} = 9.8 + 2.6 = 12.4\,\text{m/s}^2$. א: $a' = 12.4\cdot0.5 = 6.20\,\text{m/s}^2$. ב: $N = 1.5\cdot12.4\cdot\cos30^\circ = 16.1\,\text{N}$.
          ג: $t = \sqrt{2\cdot1.0/6.20} = 0.568\,\text{s}$; במעלית שעומדת $a' = 4.90\,\text{m/s}^2$ ו-$t = 0.639\,\text{s}$.
      - kind: result
        text: >-
          א. $6.20\,\text{m/s}^2$ במורד. ב. $16.1\,\text{N}$. ג. $0.568\,\text{s}$, מהר יותר מ-$0.639\,\text{s}$ במעלית שעומדת.

  - id: W-7.1-09
    level: bagrut
    objectives: [OBJ-7.1-1, OBJ-7.1-2]
    prompt: >-
      משקולת שמסתה $0.50\,\text{kg}$ תלויה בחוט באורך $1.0\,\text{m}$ מתקרת קרון, במנוחה, והחוט אנכי. ברגע מסוים הקרון
      מתחיל להאיץ קדימה בתאוצה קבועה $3.2\,\text{m/s}^2$.

      א. סביב איזה כיוון תתנודד המשקולת, ומה הזווית הגדולה ביותר של החוט מהאנכי?

      ב. מה המתיחות בחוט ברגע שבו המשקולת עוברת דרך מצב שיווי המשקל שלה, ומה המתיחות בנקודות הקיצון?
    answer: >-
      א. סביב $18.1^\circ$ אחורה מהאנכי; הזווית הגדולה ביותר $36.2^\circ$. ב. $5.66\,\text{N}$; בקיצון $4.90\,\text{N}$, בדיוק $mg$.
    solution:
      - kind: given
        text: >-
          ציר $x$ קדימה, $y$ כלפי מעלה. $m = 0.50\,\text{kg}$, $L = 1.0\,\text{m}$, $A = 3.2\,\text{m/s}^2$. ב-$t = 0$ החוט אנכי והמשקולת במנוחה ביחס לקרון.
      - kind: law
        text: >-
          במערכת הקרון המשקולת נמצאת בשדה אחיד $\vec g_{\text{eff}} = \vec g - \vec A$, שנוטה אחורה בזווית $\theta_0$ מהאנכי,
          $\tan\theta_0 = A/g$, וגודלו $\sqrt{g^2 + A^2}$. בשדה כזה המטוטלת היא מטוטלת רגילה ש"האנך" שלה הוא $\vec g_{\text{eff}}$.
      - kind: manipulation
        text: >-
          א: ברגע ההתחלה המשקולת במנוחה בזווית $\theta_0$ מהכיוון של $\vec g_{\text{eff}}$. זו נקודת קיצון, ולכן היא תתנודד סביב
          $\vec g_{\text{eff}}$ עד אותה זווית בצד השני: $2\theta_0$ מהאנכי (שימור האנרגיה בשדה האחיד $g_{\text{eff}}$, שיעור 3.3).
      - kind: manipulation
        text: >-
          ב: בשיווי המשקל, מגובה "אפקטיבי" $L(1 - \cos\theta_0)$ מעליו: $v^2 = 2Lg_{\text{eff}}(1 - \cos\theta_0)$. שם המשקולת נעה
          במעגל, והכוח השקול לאורך החוט הוא הכוח הצנטריפטלי (שיעור 2.6): $T - mg_{\text{eff}} = mv^2/L$, כלומר
          $T = mg_{\text{eff}}(3 - 2\cos\theta_0)$. בקיצון $v = 0$, ולכן $T = mg_{\text{eff}}\cos\theta_0 = mg$.
      - kind: limit
        text: >-
          כש-$A \to 0$, $\theta_0 \to 0$: אין תנודה, ו-$T = mg$ בכל מקום. כש-$A$ גדל, הזווית המרבית $2\theta_0$ שואפת ל-$180^\circ$:
          עם $A \gg g$ המשקולת מתנודדת כמעט עד התקרה. המתיחות בקיצון שווה ל-$mg$ בכל $A$: שם $v = 0$, ו-$T = mg_{\text{eff}}\cos\theta_0$,
          ו-$g_{\text{eff}}\cos\theta_0$ הוא בדיוק הרכיב האנכי של $\vec g_{\text{eff}}$, כלומר $g$. בקיצון אחד זה ברור: שם החוט
          אנכי, כמו ברגע ההתחלה.
      - kind: units
        text: >-
          $mg_{\text{eff}}$ ב-$\text{N}$; $Lg_{\text{eff}}$ ב-$\text{m}^2/\text{s}^2$.
      - kind: substitution
        text: >-
          $\theta_0 = \arctan(3.2/9.8) = 18.1^\circ$, $2\theta_0 = 36.2^\circ$. $g_{\text{eff}} = 10.3\,\text{m/s}^2$.
          $T = 0.50\cdot10.3\cdot(3 - 2\cos18.1^\circ) = 5.66\,\text{N}$; בקיצון $0.50\cdot9.8 = 4.90\,\text{N}$.
      - kind: result
        text: >-
          א. סביב $\vec g_{\text{eff}}$, $18.1^\circ$ אחורה מהאנכי, עד $36.2^\circ$. ב. $5.66\,\text{N}$ בשיווי המשקל, $4.90\,\text{N}$ בקיצון.

  - id: W-7.1-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-7.1-2]
    prompt: >-
      מד-תאוצה פשוט: צינור שקוף בצורת U, שהחלק האופקי שלו באורך $0.30\,\text{m}$, ובו נוזל. הצינור מונח במכונית כך שהחלק
      האופקי לאורך כיוון הנסיעה.

      א. כשהמכונית מאיצה קדימה, באיזו זרוע פני הנוזל גבוהים יותר? נמקו בעזרת $\vec g_{\text{eff}}$.

      ב. הפרש הגבהים בין הזרועות הוא $4.5\,\text{cm}$. מה התאוצה?

      ג. אותו מד-תאוצה הועבר לרכב על הירח, שבו תאוצת הנפילה $1.62\,\text{m/s}^2$. הרכב מאיץ ב-$0.50\,\text{m/s}^2$. מה הפרש הגבהים
      שם, ומה הוא היה על כדור הארץ באותה תאוצה? מה זה אומר על הכיול של המכשיר?
    answer: >-
      א. בזרוע האחורית. ב. $1.47\,\text{m/s}^2$. ג. $9.26\,\text{cm}$ על הירח, $1.53\,\text{cm}$ על כדור הארץ: הכיול תלוי ב-$g$.
    solution:
      - kind: law
        text: >-
          במערכת המכונית הנוזל במנוחה בשדה $\vec g_{\text{eff}} = \vec g - \vec A$. כמו בחדר רגיל, הקו שמחבר את שני פני
          הנוזל ניצב ל-$\vec g_{\text{eff}}$, כי הלחץ על שני פני הנוזל שווה (לחץ האוויר) והלחץ גדל רק לאורך $\vec g_{\text{eff}}$.
      - kind: reasoning
        text: >-
          א: $\vec g_{\text{eff}}$ נוטה אחורה, בזווית $\varphi$ מהאנכי, $\tan\varphi = A/g$. הקו שניצב לו עולה לכיוון האחורי, ולכן
          הנוזל גבוה יותר בזרוע האחורית: הוא "נערם" אחורה, כמו הקפה בכוס.
      - kind: manipulation
        text: >-
          ב: לאורך החלק האופקי, באורך $L$, הקו בין שני פני הנוזל עולה ב-$\Delta h = L\tan\varphi = LA/g$. לכן $A = g\Delta h/L$.
          ג: באותה נוסחה עם $g_{\text{Moon}}$: $\Delta h = LA/g_{\text{Moon}}$.
      - kind: limit
        text: >-
          כש-$A \to 0$, $\Delta h \to 0$. כש-$g \to 0$ (בחלל), כל תאוצה מטה את הנוזל לגמרי: המכשיר מודד את היחס $A/g$, לא את $A$.
      - kind: units
        text: >-
          $\Delta h/L$ חסר ממדים, ו-$g\Delta h/L$ ב-$\text{m/s}^2$.
      - kind: substitution
        text: >-
          ב: $A = 9.8\cdot0.045/0.30 = 1.47\,\text{m/s}^2$. ג: $\Delta h = 0.30\cdot0.50/1.62 = 0.0926\,\text{m}$; על כדור הארץ
          $0.30\cdot0.50/9.8 = 0.0153\,\text{m}$.
      - kind: result
        text: >-
          א. בזרוע האחורית. ב. $1.47\,\text{m/s}^2$. ג. $9.26\,\text{cm}$ על הירח, $1.53\,\text{cm}$ על כדור הארץ. המכשיר מודד את
          הזווית של $\vec g_{\text{eff}}$, כלומר $A/g$, ולכן סקאלה שכוילה על כדור הארץ טועה פי $6$ על הירח.

challenge:
  - id: W-7.1-c1
    stars: 1
    objectives: [OBJ-7.1-1]
    prompt: >-
      שני גושים, שמסותיהם $M$ ו-$2M$, מונחים על שולחן אופקי, ומקדם החיכוך (הסטטי והקינטי, שווים) בין כל גוש לשולחן הוא $\mu$.
      חוט קל מחבר את שני הגושים דרך גלגלת קלה, ושני קטעי החוט אופקיים ומקבילים. הגלגלת נמשכת, והיא מאיצה הרחק מהגושים
      בתאוצה קבועה $A$. בהתחלה הכול במנוחה.

      א. עברו למערכת הייחוס של הגלגלת. כתבו את החוק השני לכל גוש, עם הכוח המדומה, ואת אילוץ החוט. מצאו את התאוצה של כל
      גוש ביחס לשולחן, בהנחה ששניהם זזים.

      ב. מה התאוצה $A$ הגדולה ביותר שבה הגוש $2M$ נשאר במקומו? מה התאוצה של הגוש $M$ אז?

      ג. $M = 1.0\,\text{kg}$, $\mu = 0.20$, $A = 1.5\,\text{m/s}^2$. כמה זז כל גוש בשתי השניות הראשונות?
    answer: >-
      א. $a_M = \dfrac{4A + \mu g}{3}$, $a_{2M} = \dfrac{2A - \mu g}{3}$. ב. $A = \mu g/2$; אז $a_M = 2A$. ג. $5.31\,\text{m}$ ו-$0.693\,\text{m}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ לכיוון התנועה של הגלגלת. הגלגלת מאיצה ב-$A$, ושני הגושים נמשכים לכיוונה במתיחות $T$, אותה מתיחות בשני
          הקטעים (חוט וגלגלת קלים). החיכוך הקינטי על גוש שזז קדימה פונה אחורה.
      - kind: law
        text: >-
          במערכת הגלגלת, $S'$: $m a'_x = \sum F_x - mA$. אילוץ: אורך החוט הוא סכום המרחקים של שני הגושים מהגלגלת, ולכן
          ב-$S'$, שבה הגלגלת עומדת, $x_1' + x_2' = \text{const}$ ו-$a_1' = -a_2'$.
      - kind: manipulation
        text: >-
          לגוש $M$: $Ma_1' = T - MA - \mu Mg$. לגוש $2M$: $2Ma_2' = T - 2MA - 2\mu Mg$. כלומר כל גוש "מרגיש" כוח אחורה של
          $m(A + \mu g)$: זו מכונת אטווד רגילה, בשדה $A + \mu g$. עם $a_2' = -a_1'$ ובחיסור המשוואות: $3Ma_1' = M(A + \mu g)$, ולכן
          $a_1' = (A + \mu g)/3$ ו-$T = \tfrac43M(A + \mu g)$. חוזרים לשולחן: $a_1 = A + a_1'$, $a_2 = A - a_1'$.
      - kind: manipulation
        text: >-
          ב: הגוש $2M$ זז רק אם $a_2 > 0$, כלומר $A > \mu g/2$. עד אז הוא עומד, $a_2 = 0$, ומהאילוץ $a_1 = 2A$. בדיקה: המתיחות
          אז $T = M\cdot2A + \mu Mg$, ובאמת $T \le 2\mu Mg$ בדיוק כש-$A \le \mu g/2$.
      - kind: limit
        text: >-
          כש-$\mu \to 0$: $a_1 = 4A/3$ ו-$a_2 = 2A/3$, הגוש הקל מהיר פי 2, וממוצע התאוצות $A$, כמו שהאילוץ דורש. כש-$A = \mu g/2$
          שתי הנוסחאות של א ו-ב נפגשות: $a_2 = 0$ ו-$a_1 = \mu g = 2A$.
      - kind: units
        text: >-
          $A$ ו-$\mu g$ ב-$\text{m/s}^2$; $\tfrac12at^2$ במטרים.
      - kind: substitution
        text: >-
          $\mu g/2 = 0.980\,\text{m/s}^2 \lt 1.5$, ולכן שניהם זזים. $a_1 = (6.0 + 1.96)/3 = 2.65\,\text{m/s}^2$,
          $a_2 = (3.0 - 1.96)/3 = 0.347\,\text{m/s}^2$. $x_1 = \tfrac12\cdot2.65\cdot2.0^2 = 5.31\,\text{m}$, $x_2 = 0.693\,\text{m}$. $T = 4.61\,\text{N}$.
      - kind: result
        text: >-
          א. $a_M = (4A + \mu g)/3$, $a_{2M} = (2A - \mu g)/3$. ב. $A = \mu g/2$, ואז $a_M = 2A$. ג. $5.31\,\text{m}$ ו-$0.693\,\text{m}$.
    source:
      name: MIT 8.012 Physics I (Classical Mechanics), Quiz 1 of Fall 2007 (with solutions, on the Fall 2008 course site)
      year: 2007
      problem: Problem 2 (The Accelerated Atwood Machine)
      url: https://ocw.mit.edu/courses/8-012-physics-i-classical-mechanics-fall-2008/963f30fd7a51b7ed73cc76658141851b_2007_quiz1_sol.pdf
      verified: '2026-11-12'
      adapted: true

  - id: W-7.1-c2
    stars: 2
    objectives: [OBJ-7.1-1]
    prompt: >-
      גוש שמסתו $M_1$ מונח על גוש שמסתו $M_2 > M_1$, ושניהם על שולחן אופקי חלק. מקדם החיכוך (הסטטי והקינטי, שווים) בין
      שני הגושים הוא $\mu$. חוט קל מחבר את שני הגושים דרך גלגלת קלה, ושני קטעי החוט אופקיים. כוח $F$ מושך את הגלגלת, והיא
      מאיצה הרחק מהגושים בתאוצה $a$. בהתחלה הכול במנוחה.

      א. אם הגושים לא מחליקים זה על זה, מה התאוצות שלהם, ומה כוח החיכוך ביניהם?

      ב. מה הכוח $F$ הקטן ביותר שבו הגושים מתחילים להחליק זה על זה?

      ג. בהחלקה, עבדו במערכת הייחוס של הגלגלת ומצאו את התאוצה של כל גוש ביחס לשולחן. איזה גוש מהיר יותר?
    answer: >-
      א. שניהם $a$; החיכוך $(M_2 - M_1)a/2$. ב. $F = \dfrac{2\mu M_1g(M_1 + M_2)}{M_2 - M_1}$.
      ג. $a_{1,2} = a \pm b$ עם $b = \dfrac{(M_2 - M_1)a - 2\mu M_1g}{M_1 + M_2}$; העליון, הקל, מהיר יותר.
    solution:
      - kind: given
        text: >-
          ציר $x$ לכיוון התנועה של הגלגלת. $M_1$ למעלה. על כל גוש החוט מושך ב-$T$ לכיוון הגלגלת, ו-$F = 2T$ (גלגלת קלה). אילוץ:
          $a_1 + a_2 = 2a$, ובמערכת הגלגלת $a_1' = -a_2'$.
      - kind: law
        text: >-
          במערכת הגלגלת: $m a'_x = \sum F_x - ma$. החיכוך בין הגושים: על $M_1$ הוא $(-f)$, ועל $M_2$ הוא $(+f)$ (החוק השלישי), עם
          $|f| \le \mu M_1g$.
      - kind: manipulation
        text: >-
          א: בלי החלקה $a_1' = a_2' = 0$, ולכן $a_1 = a_2 = a$, ו-$F = (M_1 + M_2)a$. ל-$M_1$: $0 = T - M_1a - f$, עם $T = F/2$:
          $f = \tfrac12(M_2 - M_1)a$, חיובי, כלומר על $M_1$ החיכוך פונה אחורה: בלעדיו הגוש הקל היה מקדים.
      - kind: manipulation
        text: >-
          ב: ההחלקה מתחילה כש-$f = \mu M_1g$: $a = \dfrac{2\mu M_1g}{M_2 - M_1}$, ו-$F = (M_1 + M_2)a$.
      - kind: manipulation
        text: >-
          ג: נסמן $a_1' = b = -a_2'$. במערכת הגלגלת: $M_1b = T - M_1a - \mu M_1g$ ו-$-M_2b = T - M_2a + \mu M_1g$. מחסרים:
          $(M_1 + M_2)b = (M_2 - M_1)a - 2\mu M_1g$. חוזרים לשולחן: $a_1 = a + b$, $a_2 = a - b$.
      - kind: limit
        text: >-
          $b = 0$ בדיוק בסף של ב, והוא חיובי מעליו: הגוש העליון, הקל, מקדים. כש-$\mu \to 0$: $b = a(M_2 - M_1)/(M_1 + M_2)$, ושני
          הגושים מקבלים מהחוט אותו כוח $T$, ולכן תאוצות ביחס הפוך למסות. כש-$M_1 = M_2$ הסף אינסופי: גושים שווים לא מחליקים.
      - kind: units
        text: >-
          $\mu M_1g$ ב-$\text{N}$; $(M_2 - M_1)a/(M_1 + M_2)$ ב-$\text{m/s}^2$.
      - kind: result
        text: >-
          א. $a_1 = a_2 = a$, $f = (M_2 - M_1)a/2$. ב. $F_{\min} = 2\mu M_1g(M_1 + M_2)/(M_2 - M_1)$. ג. $a_1 = a + b$, $a_2 = a - b$, עם
          $b = [(M_2 - M_1)a - 2\mu M_1g]/(M_1 + M_2)$; העליון מהיר יותר.

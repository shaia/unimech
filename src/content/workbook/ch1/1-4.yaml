# "The solution format" (law … limit, units, result). In a >- block, consecutive lines fold into one
# paragraph: every part (א, ב, …) starts after a blank line.
#
# Every number was recomputed in .scratch/ch1/1-4/wb.ts with src/physics/polar.ts (polarVelocity,
# polarAcceleration, accelTerms, numericState, polarMotion) and G from constants.ts:

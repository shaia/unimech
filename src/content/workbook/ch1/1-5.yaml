# Workbook for lesson 1.5: ten practice problems and two sourced challenge problems.
# Every number recomputed in .scratch/ch1/1-5/workbook.ts with src/physics/galilean.ts (crossing, minimumDrift,
# relativeVelocity, toMovingFrame, velocityFromFrame) and G = 9.8 from src/physics/constants.ts.
# Challenge sources, both opened on 2026-11-08: MIT OCW 8.01SC Fall 2016, Problem Set 6, problem 1 (the PDF);
# J. Kalda, "Problems on kinematics" (version of 29 November 2017), problem 65, answer listed there: ≈ 12 m/s.

lesson: '1.5'
practice:
  - id: W-1.5-01
    level: basic
    objectives: [OBJ-1.5-1]
    prompt: >-
      מסוע הולכי רגל בשדה תעופה, באורך $72\,\text{m}$, נע במהירות $1.2\,\text{m/s}$. נוסעת הולכת במהירות $1.5\,\text{m/s}$
      ביחס למסוע.

      (א) כמה זמן נמשכת הדרך כשהיא הולכת על המסוע, בכיוון התנועה שלו?

      (ב) כמה זמן, אם היא עומדת על המסוע?

      (ג) ילד הולך על המסוע **נגד** כיוון התנועה שלו, באותה מהירות של $1.5\,\text{m/s}$ ביחס למסוע. כמה זמן נמשכת הדרך שלו?
    answer: >-
      (א) $26.7\,\text{s}$. (ב) $60\,\text{s}$. (ג) $240\,\text{s}$.
    solution:
      - kind: given
        text: >-
          ציר חיובי בכיוון תנועת המסוע. $L = 72\,\text{m}$, מהירות המסוע $w = 1.2\,\text{m/s}$, מהירות ההליכה ביחס למסוע $u = 1.5\,\text{m/s}$.
      - kind: law
        text: >-
          שרשרת המהירויות: המהירות ביחס לרצפה היא המהירות ביחס למסוע ועוד המהירות של המסוע, $v = u' + w$. הזמן הוא $L/v$.
      - kind: manipulation
        text: >-
          (א) $v = u + w$, ולכן $t = \dfrac{L}{u + w}$. (ב) $u' = 0$, ולכן $t = \dfrac{L}{w}$. (ג) $u' = -u$, ולכן $v = w - u$:
          שלילי, כלומר הילד מתקדם נגד כיוון המסוע ב-$u - w$, ו-$t = \dfrac{L}{u - w}$.
      - kind: limit
        text: >-
          כש-$w \to 0$, (א) ו-(ג) נותנים שניהם $L/u = 48\,\text{s}$, הליכה על רצפה רגילה. כש-$w \to u$, הילד ב-(ג) נשאר במקום
          והזמן שואף לאינסוף.
      - kind: units
        text: >-
          $\text{m}/(\text{m/s}) = \text{s}$.
      - kind: substitution
        text: >-
          (א) $\dfrac{72}{2.7} = 26.7\,\text{s}$. (ב) $\dfrac{72}{1.2} = 60\,\text{s}$. (ג) $\dfrac{72}{0.3} = 240\,\text{s}$.
      - kind: result
        text: >-
          (א) $26.7\,\text{s}$. (ב) $60\,\text{s}$. (ג) $240\,\text{s}$: הילד מתקדם רק $0.3\,\text{m/s}$ ביחס לרצפה.

  - id: W-1.5-02
    level: basic
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      להטוטנית מופיעה על סיפון של אונייה גדולה. קבעו ונמקו:

      (א) האונייה שטה במהירות קבועה, בקו ישר, בים שקט. האם הלהטוטנית צריכה לזרוק את הכדורים אחרת מאשר על הרציף?

      (ב) האונייה מאיצה קדימה. האם עכשיו היא צריכה לשנות משהו? לאן ינחתו הכדורים אם תזרוק כרגיל?
    answer: >-
      (א) לא: במערכת של אונייה שנעה במהירות קבועה התאוצה של כל כדור היא $\vec g$, כמו על הרציף. (ב) כן: במערכת של
      אונייה שמאיצה ב-$\vec A$, התאוצה של הכדור היא $\vec g - \vec A$, והוא ינחת מאחורי היד שאמורה לתפוס אותו.
    solution:
      - kind: law
        text: >-
          טרנספורמציית גליליי: $\vec v\,' = \vec v - \vec V$, ולכן $\vec a\,' = \vec a - d\vec V/dt$.
      - kind: reasoning
        text: >-
          (א) $\vec V$ קבוע, ולכן $\vec a\,' = \vec a = \vec g$. מסלול של כדור במערכת של האונייה נקבע בתאוצה ובמהירות
          ההתחלתית ביחס לאונייה, ושתיהן כמו על הרציף. הזריקות זהות.
      - kind: reasoning
        text: >-
          (ב) עכשיו $d\vec V/dt = \vec A$ קדימה, ולכן $\vec a\,' = \vec g - \vec A$: במערכת של האונייה לכדור יש גם תאוצה אופקית
          **אחורה**. כדור שנזרק כרגיל ינחת מאחורי היד; כדי לתפוס אותו צריך לזרוק מעט קדימה.
      - kind: limit
        text: >-
          כש-$A \to 0$, (ב) חוזר ל-(א). זה לא תלוי בגודל המהירות של האונייה, רק בשינוי שלה.
      - kind: result
        text: >-
          (א) אין צורך לשנות דבר. (ב) צריך לפצות: הכדורים נוחתים מאחור, כי במערכת של אונייה מאיצה $\vec a\,' = \vec g - \vec A$.

  - id: W-1.5-03
    level: basic
    objectives: [OBJ-1.5-1]
    prompt: >-
      מערכת $S'$ נעה ביחס למערכת $S$ במהירות $V = 30\,\text{m/s}$ לאורך ציר $x$, והראשיות מתלכדות ברגע $t = 0$.

      (א) מאורע קורה ב-$S$ ברגע $t = 2.0\,\text{s}$ בנקודה $(x,\ y) = (50,\ 3.0)\,\text{m}$. מה הקואורדינטות שלו ב-$S'$?

      (ב) מאורע אחר קורה ב-$S'$ ברגע $t' = 5.0\,\text{s}$ בנקודה $x' = 20\,\text{m}$. איפה הוא קורה ב-$S$?
    answer: >-
      (א) $t' = 2.0\,\text{s}$, $x' = -10\,\text{m}$, $y' = 3.0\,\text{m}$. (ב) $t = 5.0\,\text{s}$, $x = 170\,\text{m}$.
    solution:
      - kind: law
        text: >-
          $x' = x - Vt$, $y' = y$, $t' = t$; וההפוכה, $x = x' + Vt$.
      - kind: substitution
        text: >-
          (א) $x' = 50 - 30\cdot2.0 = -10\,\text{m}$, $y' = 3.0\,\text{m}$, $t' = 2.0\,\text{s}$.
      - kind: substitution
        text: >-
          (ב) $t = t' = 5.0\,\text{s}$ ו-$x = 20 + 30\cdot5.0 = 170\,\text{m}$.
      - kind: limit
        text: >-
          כש-$V \to 0$ הקואורדינטות זהות בשתי המערכות. וב-$t = 0$ אין הבדל בכל מהירות, כי הראשיות מתלכדות.
      - kind: units
        text: >-
          $Vt$ במטרים, כמו $x$.
      - kind: result
        text: >-
          (א) $(t',\ x',\ y') = (2.0\,\text{s},\ -10\,\text{m},\ 3.0\,\text{m})$: מאחורי הראשית של $S'$. (ב) $x = 170\,\text{m}$, ב-$t = 5.0\,\text{s}$.

  - id: W-1.5-04
    level: mid
    objectives: [OBJ-1.5-1]
    prompt: >-
      אין רוח, והגשם יורד אנכית. נהג אוטובוס שנוסע ב-$15\,\text{m/s}$ רואה שהטיפות משאירות על החלון הצדדי פסים בזווית
      $60^\circ$ מהאנך.

      (א) מה מהירות הירידה של הטיפות ביחס לקרקע?

      (ב) באיזו זווית מהאנך ייראו הפסים כשהאוטובוס ייסע ב-$25\,\text{m/s}$?
    answer: >-
      (א) $8.66\,\text{m/s}$. (ב) $70.9^\circ$.
    solution:
      - kind: given
        text: >-
          ציר $x$ לכיוון הנסיעה וציר $y$ כלפי מעלה. $\vec v_{\text{rain}} = (0,\ -u)$, $\vec v_{\text{bus}} = (V,\ 0)$ עם $V = 15\,\text{m/s}$.
      - kind: law
        text: >-
          $\vec v_{\text{rain,bus}} = \vec v_{\text{rain}} - \vec v_{\text{bus}} = (-V,\ -u)$. הפסים בכיוון המהירות היחסית, בזווית
          $\varphi$ מהאנך שבה $\tan\varphi = V/u$.
      - kind: manipulation
        text: >-
          $u = \dfrac{V}{\tan\varphi}$, ובמהירות החדשה $V_2$: $\varphi_2 = \arctan\dfrac{V_2}{u}$.
      - kind: limit
        text: >-
          כש-$V \to 0$ הפסים אנכיים, $\varphi \to 0$; כש-$V \gg u$ הם כמעט אופקיים.
      - kind: substitution
        text: >-
          $u = \dfrac{15}{\tan60^\circ} = 8.66\,\text{m/s}$, ו-$\varphi_2 = \arctan\dfrac{25}{8.66} = 70.9^\circ$.
      - kind: result
        text: >-
          (א) $8.66\,\text{m/s}$. (ב) $70.9^\circ$ מהאנך, הפסים נוטים לאחור.

  - id: W-1.5-05
    level: mid
    qualitative: true
    objectives: [OBJ-1.5-1]
    prompt: >-
      שתי סירות זהות יוצאות יחד מאותה נקודה על גדת נהר ברוחב $90\,\text{m}$ שזורם ב-$1.5\,\text{m/s}$. שתיהן נעות ב-$2.5\,\text{m/s}$
      ביחס למים. סירה P מכוונת ישר לרוחב הנהר. סירה Q מכוונת כך שתגיע בדיוק מול נקודת היציאה.

      (א) איזו סירה מגיעה ראשונה לגדה השנייה? נמקו בלי לחשב.

      (ב) לאיזו סירה מהירות גדולה יותר ביחס לקרקע?

      (ג) חשבו את זמני החצייה ובדקו את התשובה ל-(א).
    answer: >-
      (א) P. (ב) P. (ג) P: $36\,\text{s}$; Q: $45\,\text{s}$.
    solution:
      - kind: law
        text: >-
          $\vec v = \vec u + \vec c$, וזמן החצייה הוא הרוחב חלקי **הרכיב לרוחב** של $\vec v$, שהזרם לא תורם לו.
      - kind: reasoning
        text: >-
          (א) ב-P כל $\vec u$ לרוחב הנהר. ב-Q חלק מ-$\vec u$ הולך לביטול הזרם, ולרוחב נשאר פחות. לכן P מגיעה ראשונה, אף שהיא
          נסחפת ו-Q לא.
      - kind: reasoning
        text: >-
          (ב) ב-P שני הווקטורים ניצבים, והגודל $\sqrt{u^2 + c^2}$. ב-Q $\vec u$ הוא היתר, והגודל $\sqrt{u^2 - c^2}$. ל-P מהירות גדולה יותר.
      - kind: limit
        text: >-
          כש-$c \to 0$ שתי הסירות זהות. כש-$c \to u$, Q כבר לא מתקדמת לרוחב בכלל.
      - kind: substitution
        text: >-
          (ג) P: $\dfrac{90}{2.5} = 36\,\text{s}$, מהירות $2.92\,\text{m/s}$, נסחפת $54\,\text{m}$. Q: $\dfrac{90}{\sqrt{2.5^2 - 1.5^2}} = \dfrac{90}{2.0} = 45\,\text{s}$, מהירות $2.0\,\text{m/s}$.
      - kind: result
        text: >-
          P מגיעה ראשונה ($36\,\text{s}$ לעומת $45\,\text{s}$) ונעה מהר יותר ביחס לקרקע, אבל $54\,\text{m}$ במורד הזרם.

  - id: W-1.5-06
    level: mid
    objectives: [OBJ-1.5-1]
    prompt: >-
      טייס מכוון את המטוס צפונה. מהירות המטוס ביחס לאוויר $200\,\text{km/h}$, ורוח נושבת **מהמערב** ב-$50\,\text{km/h}$.

      (א) מה המהירות של המטוס ביחס לקרקע: גודל וכיוון?

      (ב) איפה המטוס נמצא, ביחס לנקודת ההמראה, אחרי $1.5\,\text{h}$?
    answer: >-
      (א) $206\,\text{km/h}$, $14.0^\circ$ מזרחה מהצפון. (ב) $75\,\text{km}$ מזרחה ו-$300\,\text{km}$ צפונה.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה וציר $y$ צפונה. רוח "מהמערב" נושבת **מזרחה**: $\vec v_{\text{air}} = (50,\ 0)\,\text{km/h}$. $\vec v_{\text{plane,air}} = (0,\ 200)\,\text{km/h}$.
      - kind: law
        text: >-
          $\vec v_{\text{plane}} = \vec v_{\text{plane,air}} + \vec v_{\text{air}}$, ובמהירות קבועה $\Delta\vec r = \vec v\,t$.
      - kind: manipulation
        text: >-
          $\vec v_{\text{plane}} = (50,\ 200)\,\text{km/h}$. הגודל $\sqrt{50^2 + 200^2}$, והזווית מהצפון $\arctan(50/200)$.
      - kind: limit
        text: >-
          בלי רוח המטוס היה טס צפונה בדיוק ב-$200\,\text{km/h}$; רוח צד מגדילה את גודל המהירות ומטה את הכיוון, אבל לא משנה את הרכיב הצפוני.
      - kind: substitution
        text: >-
          $|\vec v| = 206\,\text{km/h}$, $14.0^\circ$ מזרחה מהצפון. אחרי $1.5\,\text{h}$: $(50\cdot1.5,\ 200\cdot1.5) = (75,\ 300)\,\text{km}$.
      - kind: result
        text: >-
          (א) $206\,\text{km/h}$, $14.0^\circ$ מזרחה מהצפון. (ב) $75\,\text{km}$ מזרחה ו-$300\,\text{km}$ צפונה מנקודת ההמראה.

  - id: W-1.5-07
    level: mid
    objectives: [OBJ-1.5-2]
    prompt: >-
      מעלית עולה במהירות **קבועה** של $2.0\,\text{m/s}$. נוסע משחרר מטבע, ממנוחה ביחס למעלית, בגובה $1.5\,\text{m}$ מעל הרצפה.

      (א) אחרי כמה זמן המטבע פוגע ברצפה?

      (ב) במערכת של הבניין: כמה, ולאיזה כיוון, זז המטבע בזמן הזה? כמה זזה הרצפה? הראו שהתוצאות מתיישבות זו עם זו.
    answer: >-
      (א) $0.553\,\text{s}$, כמו במעלית עומדת. (ב) המטבע ירד $0.393\,\text{m}$, והרצפה עלתה $1.11\,\text{m}$; יחד $1.5\,\text{m}$.
    solution:
      - kind: law
        text: >-
          המעלית נעה במהירות קבועה, ולכן במערכת שלה התאוצה של המטבע היא $\vec g$ והמהירות ההתחלתית שלו אפס, כמו בחדר עומד.
      - kind: manipulation
        text: >-
          ציר כלפי מעלה. במערכת המעלית $y' = h - \tfrac12gt^2$, והפגיעה ב-$T = \sqrt{2h/g}$. במערכת הבניין המטבע יוצא ב-$+V$:
          $\Delta y_{\text{coin}} = VT - \tfrac12gT^2$, והרצפה זזה $\Delta y_{\text{floor}} = VT$.
      - kind: limit
        text: >-
          $\Delta y_{\text{floor}} - \Delta y_{\text{coin}} = \tfrac12gT^2 = h$, בכל $V$: הרצפה והמטבע נפגשים. וכש-$V \to 0$ המטבע פשוט נופל $h$.
      - kind: units
        text: >-
          $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$.
      - kind: substitution
        text: >-
          $T = \sqrt{2\cdot1.5/9.8} = 0.553\,\text{s}$. $\Delta y_{\text{coin}} = 2.0\cdot0.553 - 4.9\cdot0.553^2 = 1.107 - 1.500 = -0.393\,\text{m}$, ו-$\Delta y_{\text{floor}} = 1.11\,\text{m}$.
      - kind: result
        text: >-
          (א) $0.553\,\text{s}$, בלי קשר למהירות הקבועה של המעלית. (ב) המטבע ירד $0.393\,\text{m}$ והרצפה עלתה $1.11\,\text{m}$, ויחד הם סוגרים את $1.5\,\text{m}$.

  - id: W-1.5-08
    level: bagrut
    objectives: [OBJ-1.5-1]
    prompt: >-
      רוח נושבת מזרחה, וטיפות הגשם נעות ביחס לקרקע במהירות שרכיביה $2.0\,\text{m/s}$ מזרחה ו-$6.0\,\text{m/s}$ כלפי מטה.
      רוכבת אופניים נוסעת מזרחה.

      (א) באיזו מהירות היא צריכה לרכוב כדי שהגשם ייראה לה יורד אנכית?

      (ב) היא רוכבת ב-$8.0\,\text{m/s}$. באיזו זווית מהאנך, ולאיזה צד, עליה להטות את המטרייה כדי שהיא תהיה מול הגשם?

      (ג) באיזו מהירות פוגעות בה הטיפות?
    answer: >-
      (א) $2.0\,\text{m/s}$ מזרחה. (ב) $45^\circ$ קדימה. (ג) $8.49\,\text{m/s}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה וציר $y$ כלפי מעלה. $\vec v_{\text{rain}} = (2.0,\ -6.0)\,\text{m/s}$, $\vec v_{\text{bike}} = (V,\ 0)$.
      - kind: law
        text: >-
          $\vec v_{\text{rain,bike}} = \vec v_{\text{rain}} - \vec v_{\text{bike}} = (2.0 - V,\ -6.0)\,\text{m/s}$. המטרייה צריכה להצביע נגד המהירות הזו.
      - kind: manipulation
        text: >-
          (א) אנכי פירושו רכיב אופקי אפס: $V = 2.0\,\text{m/s}$. (ב) ב-$V = 8.0\,\text{m/s}$: $\vec v_{\text{rain,bike}} = (-6.0,\ -6.0)\,\text{m/s}$,
          כלומר הטיפות באות מלפנים ומלמעלה, בזווית $\arctan(6.0/6.0)$ מהאנך.
      - kind: limit
        text: >-
          כש-$V$ שווה לרכיב האופקי של הגשם, היא "נעה עם הרוח" והגשם אנכי; ככל שהיא מהירה יותר, המטרייה צריכה לנטות יותר קדימה.
      - kind: units
        text: >-
          מהירויות מחסרים רכיב-רכיב, ב-$\text{m/s}$.
      - kind: substitution
        text: >-
          (ב) $45^\circ$ מהאנך, קדימה. (ג) $\sqrt{6.0^2 + 6.0^2} = 8.49\,\text{m/s}$, לעומת $\sqrt{2.0^2 + 6.0^2} = 6.32\,\text{m/s}$ ביחס לקרקע.
      - kind: result
        text: >-
          (א) $2.0\,\text{m/s}$ מזרחה. (ב) $45^\circ$ מהאנך, קדימה, לכיוון הנסיעה. (ג) $8.49\,\text{m/s}$.

  - id: W-1.5-09
    level: bagrut
    objectives: [OBJ-1.5-1]
    prompt: >-
      נהר ברוחב $60\,\text{m}$ זורם ב-$1.0\,\text{m/s}$. מעבורת נעה ב-$2.0\,\text{m/s}$ ביחס למים, ויוצאת מנקודה A. היעד שלה הוא
      מזח על הגדה השנייה, $40\,\text{m}$ **במעלה הזרם** מהנקודה שמול A.

      (א) באיזו זווית מהכיוון הניצב לגדות, נגד הזרם, צריך לכוון את המעבורת?

      (ב) כמה זמן נמשכת החצייה? השוו לחצייה אל הנקודה שמול A.
    answer: >-
      (א) $58.3^\circ$ נגד הזרם. (ב) $57.0\,\text{s}$, לעומת $34.6\,\text{s}$ אל הנקודה שמול A.
    solution:
      - kind: given
        text: >-
          ציר $x$ במורד הזרם וציר $y$ לרוחב. $d = 60\,\text{m}$, $c = 1.0\,\text{m/s}$, $u = 2.0\,\text{m/s}$. היעד ב-$(-40,\ 60)\,\text{m}$ מ-A.
      - kind: law
        text: >-
          $\vec v = \vec u + \vec c = \left(c - u\sin\theta,\ u\cos\theta\right)$. כדי להגיע ליעד, $\vec v$ צריך להיות מקביל ל-$(-40,\ 60)$.
      - kind: manipulation
        text: >-
          תנאי ההקבלה: $60\left(c - u\sin\theta\right) + 40\,u\cos\theta = 0$, כלומר $6\sin\theta - 4\cos\theta = 3$. כותבים
          $6\sin\theta - 4\cos\theta = \sqrt{52}\,\sin\left(\theta - \varphi\right)$ עם $\tan\varphi = 4/6$, ולכן
          $\theta = \varphi + \arcsin\dfrac{3}{\sqrt{52}}$. זמן החצייה $T = \dfrac{d}{u\cos\theta}$.
      - kind: limit
        text: >-
          אם היעד היה מול A, התנאי היה $c - u\sin\theta = 0$, $\sin\theta = 1/2$, $\theta = 30^\circ$, ו-$T = \dfrac{60}{2.0\cos30^\circ} = 34.6\,\text{s}$.
          יעד במעלה הזרם דורש זווית גדולה יותר, ומשאיר פחות מהירות לרוחב.
      - kind: substitution
        text: >-
          $\varphi = 33.7^\circ$, $\arcsin(3/7.21) = 24.6^\circ$, ולכן $\theta = 58.27^\circ$, כלומר $58.3^\circ$. את הזמן מחשבים בלי לעגל את הזווית בדרך: $\cos\theta = 0.526$, ו-$T = \dfrac{60}{2.0\cdot0.526} = 57.0\,\text{s}$.
          בדיקה: $v_x = 1.0 - 2.0\sin\theta = -0.701\,\text{m/s}$, ובזמן הזה $v_xT = -40\,\text{m}$.
      - kind: result
        text: >-
          (א) $58.3^\circ$ מהניצב, נגד הזרם. (ב) $57.0\,\text{s}$, לעומת $34.6\,\text{s}$ אל הנקודה שמול A.

  - id: W-1.5-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-1.5-2]
    prompt: >-
      שני סטודנטים ברכבת רוצים לגלות אם היא נעה. כל אחד זורק כדור באותה מהירות ביחס לרכבת, $3.0\,\text{m/s}$ אופקית ו-$4.0\,\text{m/s}$
      אנכית, אחד לכיוון הקטר ואחד לכיוון הקרון האחרון, ומודד את הטווח על רצפת הקרון (נחיתה בגובה הזריקה).

      (א) הרכבת נוסעת במהירות קבועה. האם הטווחים שונים? נמקו בשתי מערכות ייחוס.

      (ב) הרכבת מאיצה קדימה ב-$1.0\,\text{m/s}^2$. חשבו את שני הטווחים ואת ההפרש ביניהם.

      (ג) מה אפשר ללמוד מהניסוי הזה על התנועה של הרכבת, ומה אי אפשר?
    answer: >-
      (א) לא, שניהם $2.45\,\text{m}$. (ב) קדימה $2.12\,\text{m}$, אחורה $2.78\,\text{m}$; הפרש $AT^2 = 0.666\,\text{m}$. (ג) אפשר למדוד את
      התאוצה שלה, לא את המהירות.
    solution:
      - kind: law
        text: >-
          במערכת של הרכבת $\vec a\,' = \vec a - \vec A$. ציר $x$ לכיוון הקטר וציר $y$ כלפי מעלה; $\vec a = (0,\ -g)$.
      - kind: reasoning
        text: >-
          (א) במהירות קבועה $\vec A = 0$ ו-$\vec a\,' = (0,\ -g)$. שתי הזריקות סימטריות, וזמן התעופה $T = 2u_y/g$, ולכן הטווחים
          שווים. במערכת הקרקע: לזריקה קדימה מהירות אופקית $V + u_x$ ולאחורה $V - u_x$, אבל גם הרצפה זזה ב-$V$, וההפרשים
          ביחס לנקודת הזריקה שוב $\pm u_xT$.
      - kind: manipulation
        text: >-
          (ב) עכשיו $\vec a\,' = (-A,\ -g)$. זמן התעופה לא משתנה, $T = 2u_y/g$. קדימה: $x' = u_xT - \tfrac12AT^2$. אחורה:
          $|x'| = u_xT + \tfrac12AT^2$. ההפרש $AT^2$.
      - kind: limit
        text: >-
          כש-$A \to 0$ ההפרש מתאפס, ו-(ב) חוזר ל-(א).
      - kind: units
        text: >-
          $AT^2$ ביחידות $\text{m/s}^2\cdot\text{s}^2 = \text{m}$.
      - kind: substitution
        text: >-
          $T = \dfrac{2\cdot4.0}{9.8} = 0.816\,\text{s}$. $u_xT = 2.45\,\text{m}$, $\tfrac12AT^2 = 0.333\,\text{m}$: קדימה $2.12\,\text{m}$, אחורה $2.78\,\text{m}$, הפרש $0.666\,\text{m}$.
      - kind: result
        text: >-
          (א) הטווחים שווים, $2.45\,\text{m}$, בכל מהירות קבועה. (ב) $2.12\,\text{m}$ קדימה ו-$2.78\,\text{m}$ אחורה. (ג) הניסוי מגלה תאוצה
          ($A = \Delta R/T^2$), אבל לא מהירות: זה עקרון היחסות של גליליי.

challenge:
  - id: W-1.5-c1
    stars: 1
    objectives: [OBJ-1.5-1]
    prompt: >-
      סטודנטית רוצה לחתור לרוחב נהר ברוחב $800\,\text{m}$, שזורם במהירות קבועה של $1.0\,\text{m/s}$. סירה שנייה נסחפת עם הזרם.
      מנקודת המבט של הסירה השנייה, הסטודנטית חותרת בניצב לזרם, ב-$0.5\,\text{m/s}$.

      (א) מה גודל המהירות של הסטודנטית ביחס לגדה, ומה הזווית שלה עם הגדה?

      (ב) כמה זמן נמשכת החצייה, וכמה רחוק במורד הזרם היא מגיעה לגדה השנייה?

      (ג) מהירות החתירה שלה קטנה ממהירות הזרם, ולכן אין כיוון שבו תגיע בדיוק מול נקודת היציאה. לאיזה כיוון עליה לכוון את
      הסירה כדי שהסחיפה תהיה הקטנה ביותר? מה הסחיפה אז, וכמה זמן נמשכת החצייה?
    answer: >-
      (א) $1.12\,\text{m/s}$, $26.6^\circ$ מהגדה. (ב) $1600\,\text{s}$ ו-$1600\,\text{m}$. (ג) $30^\circ$ נגד הזרם מהכיוון הניצב לגדות;
      סחיפה $1386\,\text{m}$, חצייה $1848\,\text{s}$.
    solution:
      - kind: given
        text: >-
          ציר $x$ במורד הזרם וציר $y$ לרוחב. הסירה השנייה נעה עם המים, ולכן המהירות שנמדדת ממנה היא המהירות ביחס למים:
          $u = 0.5\,\text{m/s}$, לרוחב. $c = 1.0\,\text{m/s}$, $d = 800\,\text{m}$.
      - kind: law
        text: >-
          $\vec v = \vec u + \vec c$. אם החרטום בזווית $\theta$ נגד הזרם מהניצב, $\vec v = \left(c - u\sin\theta,\ u\cos\theta\right)$,
          $T = \dfrac{d}{u\cos\theta}$ והסחיפה $x = v_xT$.
      - kind: substitution
        text: >-
          (א, ב) $\theta = 0$: $\vec v = (1.0,\ 0.5)\,\text{m/s}$, גודל $1.12\,\text{m/s}$, ו-$\arctan(0.5/1.0) = 26.6^\circ$ מהגדה. $T = 800/0.5 = 1600\,\text{s}$, והסחיפה $1.0\cdot1600 = 1600\,\text{m}$.
      - kind: manipulation
        text: >-
          (ג) הכיוון של $\vec v$ ביחס לגדה, $\alpha$, צריך להיות גדול ככל האפשר. במשולש המהירויות $\vec c$ קבוע, ו-$\vec u$ הוא וקטור
          באורך קבוע שיוצא מהקצה של $\vec c$: הקצה של $\vec v$ נמצא על מעגל ברדיוס $u$. הזווית $\alpha$ הגדולה ביותר מתקבלת
          כש-$\vec v$ משיק למעגל, כלומר $\vec u \perp \vec v$, ואז $\sin\alpha = u/c$. במצב הזה גם $\sin\theta = u/c$, והסחיפה
          $x = \dfrac{d}{\tan\alpha} = \dfrac{d\sqrt{c^2 - u^2}}{u}$.
      - kind: limit
        text: >-
          כש-$u \to c$ הסחיפה המינימלית שואפת לאפס: אפשר כמעט להגיע מול נקודת היציאה. כש-$u \to 0$ היא שואפת לאינסוף. והתנאי
          $\sin\theta = u/c$ קיים רק כש-$u < c$; אחרת אפשר להגיע לסחיפה אפס.
      - kind: units
        text: >-
          $d\sqrt{c^2 - u^2}/u$ במטרים.
      - kind: substitution
        text: >-
          $\sin\theta = 0.5$, $\theta = 30^\circ$. $x = \dfrac{800\sqrt{1.0^2 - 0.5^2}}{0.5} = 1386\,\text{m}$, $T = \dfrac{800}{0.5\cos30^\circ} = 1848\,\text{s}$.
      - kind: result
        text: >-
          (א) $1.12\,\text{m/s}$ בזווית $26.6^\circ$ מהגדה. (ב) $1600\,\text{s}$, $1600\,\text{m}$ במורד הזרם. (ג) לכוון $30^\circ$ נגד הזרם:
          הסחיפה קטנה ל-$1386\,\text{m}$, אבל החצייה מתארכת ל-$1848\,\text{s}$.
    source:
      name: MIT OpenCourseWare 8.01SC Classical Mechanics
      year: 2016
      problem: Problem Set 6, Problem 1 (Rowing Across the River)
      url: https://live.ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/44b46fb9ae75796759884a9a7f7bd167_MIT8_01F16_pset6.pdf
      verified: '2026-11-08'
      adapted: true

  - id: W-1.5-c2
    stars: 2
    objectives: [OBJ-1.5-1]
    prompt: >-
      סירה הפליגה מנמל הבית לאי שנמצא $4.0\,\text{km}$ דרומה. המסלול שלה היה שלושה קטעים ישרים, שהכיוונים שלהם לא נרשמו, ובכל
      קטע היא שמרה על מהירות קבועה. לאורך כל הדרך מדדו **מהסירה** את מהירות הרוח ואת הכיוון שממנו היא נושבת:

      - קטע 1, $3.0\,\text{min}$: הרוח נשבה ב-$15\,\text{m/s}$, מהמזרח.
      - קטע 2, $1.5\,\text{min}$: הרוח נשבה ב-$10\,\text{m/s}$, מדרום-מזרח.
      - קטע 3, $1.5\,\text{min}$: הרוח נשבה ב-$5.0\,\text{m/s}$, מדרום-מערב.

      ידוע שהרוח ביחס לקרקע הייתה קבועה, בגודל ובכיוון, כל הזמן. מה מהירות הרוח ביחס לקרקע, ומאיזה כיוון היא נשבה?
    answer: >-
      כ-$11.9\,\text{m/s}$ (כ-$12\,\text{m/s}$), מצפון-מזרח (היא נושבת לכיוון דרום-מערב).
    solution:
      - kind: given
        text: >-
          ציר $x$ מזרחה וציר $y$ צפונה. רוח "מהמזרח" נעה מערבה. הרוח היחסית בכל קטע: $\vec u_1 = (-15,\ 0)$,
          $\vec u_2 = 10\left(-\tfrac{1}{\sqrt2},\ \tfrac{1}{\sqrt2}\right)$, $\vec u_3 = 5.0\left(\tfrac{1}{\sqrt2},\ \tfrac{1}{\sqrt2}\right)\,\text{m/s}$;
          $t_1 = 180\,\text{s}$, $t_2 = t_3 = 90\,\text{s}$; ההעתק הכולל $\vec D = (0,\ -4000)\,\text{m}$.
      - kind: law
        text: >-
          הרוח ביחס לסירה היא $\vec u_i = \vec w - \vec v_i$, כאשר $\vec w$ הרוח ביחס לקרקע ו-$\vec v_i$ מהירות הסירה בקטע $i$. לכן
          $\vec v_i = \vec w - \vec u_i$.
      - kind: manipulation
        text: >-
          ההעתק הכולל: $\vec D = \sum_i\vec v_it_i = \vec w\,T - \sum_i\vec u_it_i$, עם $T = \sum t_i$. לכן
          $\vec w = \dfrac{\vec D + \sum_i\vec u_it_i}{T}$. זו בדיוק מערכת האוויר: בה הסירה זזה $-\sum\vec u_it_i$, והאוויר עצמו
          זז ביחס לקרקע $\vec wT$.
      - kind: substitution
        text: >-
          $\sum\vec u_it_i = (-2700 - 636 + 318,\ 636 + 318) = (-3018,\ 955)\,\text{m}$. $T = 360\,\text{s}$.
          $\vec w = \dfrac{(-3018,\ -3045)}{360} = (-8.38,\ -8.46)\,\text{m/s}$.
      - kind: limit
        text: >-
          אם הרוח הייתה אפס, $\vec u_i = -\vec v_i$, והמשוואה הייתה אומרת רק $\sum\vec u_it_i = -\vec D$: הרוח הנמדדת הייתה משקפת את
          ההעתק בלבד. ובדיקה: עם $\vec w$ שמצאנו, $\sum(\vec w - \vec u_i)t_i = (0,\ -4000)\,\text{m}$ בדיוק.
      - kind: units
        text: >-
          $\dfrac{\text{m}}{\text{s}}$: העתק חלקי זמן.
      - kind: result
        text: >-
          $|\vec w| = 11.9\,\text{m/s}$, כ-$12\,\text{m/s}$, בכיוון $(-8.38,\ -8.46)$: הרוח נושבת לדרום-מערב, כלומר **מצפון-מזרח**.
    source:
      name: Jaan Kalda, Problems on Kinematics (IPhO preparation)
      year: 2017
      problem: Problem 65
      url: https://www.ioc.ee/~kalda/ipho/kin_ENG.pdf
      verified: '2026-11-08'
      adapted: true

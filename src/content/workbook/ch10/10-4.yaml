#   W04 0.200 MeV at 120°: E′ = 0.126 MeV, λ = 6.21 pm → λ′ = 9.85 pm, K = 0.0740 MeV, cot φ = 2.41, φ = 22.5°;
#   W05 B(³He) = 7.718 MeV (2.57 per nucleon), B(³H) = 8.481 MeV (2.83), difference 0.763 MeV;
#   W06 2λ_C/λ: 500 nm 9.7e-6, 50 pm 0.097; E/mₑc² at 500 nm 4.9e-6;
#   W07 d + t → ⁴He + n: Q = 17.59 MeV, Q/(m_d + m_t)c² = 3.75e-3, 3.38e14 J/kg, 7.3e6 × 4.6e7 J/kg;
#   W08 0.662 MeV: Compton edge 0.478 MeV, backscattered photon 0.184 MeV;
#   W09 symbolic (an electron at rest cannot emit a photon: mc² = E′ + √(…) > mc²);
#   W10 14.4 keV, Mc² = 5.30e4 MeV: E_R = 1.96e-3 eV (E²/2Mc² to 3 figures), 1.36e-7 of the drop, v = 81.5 m/s;
#   c1 4p + 2e → ⁴He: 26.73 MeV, 7.12e-3 of 4m_p c², 6.41e14 J per kg of protons; methane 890 kJ per 16.0 g

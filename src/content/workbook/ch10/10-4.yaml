#   W01 633 nm: E = 3.14e-19 J = 1.96 eV, p = 1.05e-27 kg·m/s; 1.0 mW: 3.18e15 photons/s, F = P/c = 3.33e-12 N;
#   W02 1.0e4 J: Δm = 1.11e-13 kg; 1.00 MeV: Δm = 1.78e-30 kg;

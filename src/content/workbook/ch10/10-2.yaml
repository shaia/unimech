#       p′_y c = 703.5 MeV, speed 0.877c (= transverse velocity addition (−0.8, 0.36)), 24.2° above −x′;
#   W10 electron + 1 MeV photon (illustration): Mc² = √(0.511² + 2·0.511·1) = 1.13 MeV > 0.511;
#   c1 π⁰ 135 MeV → γγ at ±45°: Eγ = 95.5 MeV each, p c = 135 MeV, γβ = 1, β = 0.707, γ = 1.41,
#      mean length γβcτ = 2.52e-8 m with τ = 8.4e-17 s;
#   c2 10 GeV elastic pp at 90° in the cm frame: s = 20.52, t = u = −8.50, s + t + u = 3.519 = 4m² (GeV²);

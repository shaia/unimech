#       K ×2.98, v ×1.26 (Newton ×4, ×2);
#   W07 muon E = 1.0 GeV: pc = 994 MeV, β = 0.9944, γβ = 9.38, γβcτ = 6.19 km for τ = 2.2 μs (βcτ = 656 m);
#   W08 proton pc = mc²: K = (pc)²/((γ + 1)mc²) = 388.5 MeV = (√2 − 1)·938 (Newton 469);
#   W09 masses m at ±0.60c stick: in B's frame A moves at 0.882c, γ = 2.125, p = 1.875 mc; the lump moves at 0.60c
#       with M = 2.5m: p = 1.25·2.5·0.6 = 1.875 mc (with M = 2m: 1.50 mc; Newton: 0.882 m·c vs 1.2 m·c);
#   W10 pc = 500 MeV over 10 m: proton β = 0.4704, t = 70.9 ns; pion β = 0.963, t = 34.6 ns;
#       from t = 70.9 ns: β = 0.4701, mc² = pc√(1/β² − 1) = 939 MeV;
#   c1 10 GeV muon: γ = 94.3, 1 − β = 5.62e-5; 100 GeV electron: γ = 1.96e5, 1 − β = 1.31e-11;
#   c2 proton, η = 1, 2, 3, 10: E = 1447, 3529, 9443 MeV, 1.03e7 MeV (β = 0.762, 0.964, 0.995, 1 − 4e-9);

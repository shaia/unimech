# "The solution format". Every number was recomputed by .scratch/ch10/10-1/numbers.ts with src/physics/relenergy.ts,
# src/physics/relativity.ts and src/physics/constants.ts (C_LIGHT = 3.0e8 m/s, M_ELECTRON = 9.11e-31 kg,
# E_CHARGE = 1.6e-19 J/eV); rest energies are data stated in the prompts (electron 0.511, muon 106, pion 140,
# proton 938 MeV):
#   W01 β = 0.5: γ = 1.155, p = 0.577 mc, K = 0.155 mc² (½mv² = 0.125 mc²);
#   W02 electron at 0.60c: pc = 0.383, E = 0.639, K = 0.128 MeV (Newton 0.307, 0.0920); p = 2.05e-22 kg·m/s;
#       M_ELECTRON·c² = 0.512 MeV;
#   W03 E = 5.0 GeV, pc = 4.0 GeV: mc² = 3.0 GeV, β = 0.80, γ = 5/3, K = 2.0 GeV;
#   W04 K = 1.10·½mv² at β = 0.346 (series ¾β² = 0.1 gives 0.365), v = 1.04e8 m/s;

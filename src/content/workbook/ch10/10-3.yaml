#       pc = 188.9 MeV, β_α = 0.0506, β_d = 9.13e-4, speed ratio 55.4 (mass ratio 55.5);
#   W03 e⁺e⁻ → pp̄: head on 937.5 MeV per beam; positron on electron at rest 3.44e6 MeV = 3.44 TeV;
#   W04 K⁺ (494) → μ⁺ν: pc = 235.6, E_μ = 258.4, K_μ = 152.4 MeV, β = 0.912; K_ν = 235.6 of Q = 388;
#   W05 p + X → p + X + π⁰: on a proton 279.7 (Newton 270 + 9.7), on ⁴He (3727) 171.4 (169.0 + 2.4), M → ∞ 135;
#   W06 p + p → p + Λ⁰ + K⁺ (1116, 494): Σ = 2548, fixed 1584.7 MeV, head on 336 per beam (×4.72), β_cm = 0.677;
#   W07 K⁰ → π⁺π⁻ at β = 0.8 along the line: p* = 205.9, β* = 0.827; forward E = 689.6 (pₓ 675.2), backward
#       E = 140.4, pₓ = −11.2, K = 0.45 MeV; sums 830 = γM and 664 = γβM;
#   W08 p (1000 MeV/c) and π⁻ (200 MeV/c) at 36°: E_p = 1371.1, E_π = 244.1, M = 1115.9 MeV/c² (0°: 1081.2, 90°: 1252.6);
#   W09 LHC 2 × 6.8 TeV: √s = 13.6 TeV; fixed target E = 9.86e7 GeV (×14 500); the LHC beam on a fixed proton:
#       √s = 113 GeV;
#   W10 Δ⁺⁺ (1232) formed by π⁺ on p at rest: E_π = 329.6, K_π = 189.6 MeV, pc = 298.4, β_Δ = 0.235, γ = 1.029;
#       its decay back: p* = 227.2 MeV/c;
#   c1 (Oxford MT 2008 Problems 2, Q13) e⁻ 9.0 GeV, B⁰ 5.3 GeV: positron 3.12 GeV; E_tot = 12.12, p = 5.88 GeV,
#       β = 0.485, γ = 1.144, γβ = 0.555, mean flight 0.555 · 3.0e8 · 1.5e-12 = 2.50e-4 m (cτ = 4.5e-4 m);
#   c2 (Oxford MT 2008 Problems 2, Q15) D⁰ (1860) → K̄⁰ (500) + π⁰ (130): E_π = 867.3, K_π = 737.3, pc = 857.5 MeV,

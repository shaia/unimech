#       x′ = 0; meeting at t′ = 20.8, x′ = −16.7; return leg at −0.976c, 17.1 y of t′, proper time 3.75;
#   W05 L = 4.5 ly, β = 0.6, D = 2: Earth 15.0 y, traveller 12.0; she receives 3 + 12 = 15 yearly signals; Earth sees

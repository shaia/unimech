lesson: '9.6'
practice:
  - id: W-9.6-01
    level: basic
    objectives: [OBJ-9.6-1]
    prompt: >-
      אסטרונאוטית טסה במהירות $0.8c$ לכוכב שנמצא, במערכת של כדור הארץ, במרחק 5.0 שנות אור, מסתובבת מיד וחוזרת באותה
      מהירות. אחיה התאום נשאר על כדור הארץ. בכמה שנים הזדקן כל אחד מהם עד הפגישה, ומה הפרש הגילים?
    answer: >-
      האח $12.5$ שנים, האסטרונאוטית $7.50$ שנים; הפרש של $5.00$ שנים.
    solution:
      - kind: given
        text: >-
          $L = 5.0$ שנות אור במערכת $S$ של כדור הארץ, $\beta = 0.8$, $\gamma = 5/3$, $c = 1$ שנת אור לשנה.
      - kind: law
        text: >-
          כל שעון מראה את הזמן העצמי לאורך קו העולם שלו: $\tau = \sum_k\sqrt{\Delta t_k^2 - \Delta x_k^2/c^2}$, במערכת אינרציאלית
          אחת. נחשב ב-$S$.
      - kind: manipulation
        text: >-
          האח: $\Delta x = 0$, $\tau_{\text{home}} = 2L/v$. האסטרונאוטית: שני קטעים של $\Delta t = L/v$, $|\Delta x| = L$, ולכן
          $\tau_{\text{trav}} = \dfrac{2L}{v}\sqrt{1 - \beta^2} = \dfrac{2L}{\gamma v}$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$ ההפרש נעלם; כש-$\beta \to 1$, $\tau_{\text{trav}} \to 0$.
      - kind: units
        text: >-
          שנות אור חלקי שנות אור לשנה: שנים.
      - kind: substitution
        text: >-
          $\tau_{\text{home}} = 2\cdot5.0/0.8 = 12.5$ שנים; $\tau_{\text{trav}} = 12.5\cdot0.6 = 7.50$ שנים.
      - kind: result
        text: >-
          האח הזדקן $12.5$ שנים והאסטרונאוטית $7.50$: היא צעירה ממנו ב-$5.00$ שנים.

  - id: W-9.6-02
    level: basic
    qualitative: true
    objectives: [OBJ-9.6-1]
    prompt: >-
      שלוש אחיות על כדור הארץ. שתיים יוצאות יחד, באותה מהירות, בכיוונים הפוכים, כל אחת לכוכב במרחק שווה, מסתובבות מיד
      וחוזרות באותה מהירות. השלישית נשארת. קבעו ונמקו: מי מהשלוש הצעירה ביותר בפגישה? האם הנוסעות בנות אותו גיל, למרות
      שכל אחת מהן, בכל דרך, מוצאת שהשעון של השנייה מפגר?
    answer: >-
      שתי הנוסעות בנות אותו גיל, ושתיהן צעירות מהאחות שנשארה.
    solution:
      - kind: law
        text: >-
          כל שעון מראה את הזמן העצמי לאורך קו העולם שלו, ומחשבים אותו במערכת אינרציאלית אחת, כאן זו של כדור הארץ.
      - kind: reasoning
        text: >-
          במערכת של כדור הארץ שני קווי העולם של הנוסעות הם תמונת ראי זה של זה: אותם $\Delta t$ ואותם $|\Delta x|$ בכל קטע, ולכן
          אותו זמן עצמי, $2L/(\gamma v)$. קו העולם של האחות שנשארה הוא ישר, והזמן העצמי שלו, $2L/v$, הגדול ביותר. הטענה "השעון
          של השנייה מפגר" נכונה לכל נוסעת בכל דרך לחוד, במערכת שבה היא נמצאת אז, אבל כל אחת מחליפה מערכת בסיבוב.
      - kind: limit
        text: >-
          כש-$v \to 0$ שלוש האחיות מזדקנות אותו דבר.
      - kind: result
        text: >-
          המצב בין שתי הנוסעות סימטרי לגמרי, ולכן הן בנות אותו גיל. שתיהן צעירות מהאחות שנשארה, פי $\gamma$.

  - id: W-9.6-03
    level: basic
    objectives: [OBJ-9.6-2]
    prompt: >-
      רכבת שאורכה העצמי $30\,\text{m}$ נוסעת במהירות $0.6c$ דרך מנהרה שאורכה העצמי $25\,\text{m}$. מה אורך הרכבת במערכת
      של המנהרה, ומה אורך המנהרה במערכת של הרכבת? באיזו מהן יש רגע שבו הרכבת כולה בתוך המנהרה?
    answer: >-
      $24.0\,\text{m}$ ו-$20.0\,\text{m}$. רק במערכת של המנהרה יש רגע כזה.
    solution:
      - kind: given
        text: >-
          $\beta = 0.6$, $\gamma = 1.25$; אורכים עצמיים: רכבת $30\,\text{m}$, מנהרה $25\,\text{m}$.
      - kind: law
        text: >-
          התקצרות אורך: גוף נע נמדד באורך $L = L_0/\gamma$, ו-$L_0$ הוא האורך העצמי, במערכת שבה הוא נח.
      - kind: manipulation
        text: >-
          במערכת של המנהרה הרכבת נעה: $30/\gamma$. במערכת של הרכבת המנהרה נעה: $25/\gamma$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$ האורכים חוזרים ל-$30$ ו-$25\,\text{m}$, והרכבת לא נכנסת למנהרה בשום מערכת.
      - kind: units
        text: >-
          $\gamma$ חסר ממדים, והאורכים במטרים.
      - kind: substitution
        text: >-
          $30/1.25 = 24.0\,\text{m}$, קצר מ-$25\,\text{m}$; $25/1.25 = 20.0\,\text{m}$, קצר מ-$30\,\text{m}$.
      - kind: result
        text: >-
          במערכת של המנהרה הרכבת $24.0\,\text{m}$ ונכנסת כולה, לרגע. במערכת של הרכבת המנהרה $20.0\,\text{m}$ ואין רגע כזה.
          אין סתירה: "כולה בפנים" היא טענה על בו-זמניות בשני מקומות.

  - id: W-9.6-04
    level: mid
    objectives: [OBJ-9.6-1]
    prompt: >-
      במסע של בעיה 1 (כוכב במרחק 5.0 שנות אור, $0.8c$), חשבו את החשבון של האסטרונאוטית בשתי המערכות האינרציאליות שלה: בכמה
      מזדקן אחיה בכל דרך לפי המערכת שבה היא נמצאת, מה מראה השעון שלו "עכשיו" רגע לפני הסיבוב ורגע אחריו, והראו שהסכום
      שווה לגיל שלו מבעיה 1.
    answer: >-
      $2.25$ שנים בכל דרך; "עכשיו" קופץ מ-$2.25$ ל-$10.25$ שנים, קפיצה של $8.00$; $2.25 + 8.00 + 2.25 = 12.5$.
    solution:
      - kind: given
        text: >-
          הסיבוב ב-$S$: $(t, x) = (L/v,\ L) = (6.25,\ 5.0)$. בשעון שלה כל דרך נמשכת $L/(\gamma v) = 3.75$ שנים. $\gamma = 5/3$.
      - kind: law
        text: >-
          בכל אחת מהמערכות שלה השעון של כדור הארץ מפגר פי $\gamma$. הקריאה שמערכת במהירות $u$ מכנה "עכשיו" על כדור הארץ, יחד עם
          המאורע $(t, x)$: $t - ux/c^2$.
      - kind: manipulation
        text: >-
          בכל דרך: $\dfrac{L}{\gamma v}\cdot\dfrac1\gamma$. לפני הסיבוב ($u = +v$): $\dfrac{L}{v} - \dfrac{vL}{c^2}$; אחריו
          ($u = -v$): $\dfrac{L}{v} + \dfrac{vL}{c^2}$; הקפיצה $2vL/c^2$.
      - kind: limit
        text: >-
          כש-$L \to 0$ או $v \to 0$ הקפיצה נעלמת. הסכום $\dfrac{2L}{\gamma^2v} + \dfrac{2vL}{c^2} = \dfrac{2L}{v}$ בכל $\beta$.
      - kind: units
        text: >-
          $vL/c^2$ בשנים כש-$L$ בשנות אור ו-$c = 1$.
      - kind: substitution
        text: >-
          $3.75\cdot0.6 = 2.25$ שנים. $6.25 - 0.8\cdot5.0 = 2.25$ ו-$6.25 + 4.0 = 10.25$; הקפיצה $8.00$ שנים.
      - kind: result
        text: >-
          לפי המערכות שלה האח מזדקן $2.25$ שנים בכל דרך, וב"עכשיו" שלה יש קפיצה של $8.00$ שנים בסיבוב: יחד $12.5$, כמו בבעיה 1.

  - id: W-9.6-05
    level: mid
    objectives: [OBJ-9.6-1]
    prompt: >-
      טייסת טסה במהירות $0.6c$ לכוכב במרחק 4.5 שנות אור וחוזרת מיד באותה מהירות. היא ואחיה על כדור הארץ שולחים זה לזה אות
      רדיו בכל פעם שהשעון של השולח מראה שנה שלמה נוספת מהיציאה.

      א. כמה אותות מאחיה מקבלת הטייסת בדרך ההליכה, וכמה בדרך החזרה?

      ב. מתי, בשעון שלו, רואה האח את הסיבוב, וכמה אותות ממנה הוא מקבל לפני כן ואחרי כן?

      ג. הראו שכל ספירה שווה לגיל של השולח בפגישה.
    answer: >-
      א. 3 ו-12. ב. אחרי $12.0$ שנים; 6 לפני ו-6 אחרי. ג. 15 שנים לאח ו-12 לטייסת.
    solution:
      - kind: given
        text: >-
          $L = 4.5$ שנות אור, $\beta = 0.6$, $\gamma = 1.25$, $c = 1$. ב-$S$ המסע $2L/v = 15.0$ שנים; בשעון שלה $12.0$, $6.0$ בכל דרך.
      - kind: law
        text: >-
          דופלר היחסותי: בהתרחקות הזמן בין אותות נקלטים ארוך פי $D = \sqrt{(1 + \beta)/(1 - \beta)}$, ובהתקרבות קצר פי $D$.
      - kind: manipulation
        text: >-
          $D = \sqrt{1.6/0.4} = 2$. א: בהליכה $6.0/2 = 3$ אותות, בחזרה $6.0\cdot2 = 12$. ב: הסיבוב ב-$S$ ב-$t = 7.5$ שנים, $4.5$ שנות
          אור מכדור הארץ, והאור ממנו מגיע ב-$7.5 + 4.5 = 12.0$ שנים. עד אז האח קולט בקצב $1/D$: $12/2 = 6$ אותות; בשלוש השנים
          האחרונות בקצב $D$: עוד 6.
      - kind: limit
        text: >-
          כש-$\beta \to 0$, $D \to 1$: כל אחד קולט אות בכל שנה שלו, ושתי הספירות שוות. בכל $\beta$, $\tau_{\text{leg}}(D + 1/D) = 2L/v$.
      - kind: units
        text: >-
          $D$ חסר ממדים; אות אחד לכל שנה של השולח.
      - kind: result
        text: >-
          הטייסת קולטת $3 + 12 = 15$ אותות, הגיל של אחיה; האח קולט $6 + 6 = 12$, הגיל שלה. היא עוברת לקצב המהיר באמצע המסע שלה,
          והוא רק אחרי 12 מתוך 15 שנים, כי היא זו שמסתובבת.

  - id: W-9.6-06
    level: mid
    objectives: [OBJ-9.6-2]
    prompt: >-
      הרכבת של בעיה 3 ($30\,\text{m}$ עצמיים, $0.6c$) עוברת במנהרה ($25\,\text{m}$ עצמיים). במערכת של המנהרה, ברגע שהרכבת
      בדיוק באמצעה, נורה מהבהבת בכל אחד מפתחי המנהרה, באותו רגע. במערכת של הרכבת: איזו נורה מהבהבת קודם, כמה זמן לפני
      השנייה, ובאיזה מרחק מהקצה הקרוב של הרכבת קורה כל הבהוב?
    answer: >-
      הנורה בפתח היציאה, $62.5\,\text{ns}$ לפני השנייה; כל הבהוב $0.625\,\text{m}$ מחוץ לקצה הקרוב.
    solution:
      - kind: given
        text: >-
          $S$ מערכת המנהרה: כניסה ב-$x = 0$, יציאה ב-$x = 25\,\text{m}$, הבהובים ב-$t = 0$. ב-$t = 0$ הרכבת ($24.0\,\text{m}$) בין
          $0.5$ ל-$24.5\,\text{m}$. $S'$ מערכת הרכבת, $\gamma = 1.25$.
      - kind: law
        text: >-
          $t' = \gamma\left(t - vx/c^2\right)$ ו-$x' = \gamma(x - vt)$.
      - kind: manipulation
        text: >-
          ההבהוב בכניסה: $t' = 0$, $x' = 0$. ההבהוב ביציאה: $t' = -\gamma v\cdot25/c^2$, $x' = \gamma\cdot25 = 31.25\,\text{m}$. קצות
          הרכבת נחים ב-$S'$ ב-$x' = \gamma x$: $0.625\,\text{m}$ ו-$30.625\,\text{m}$.
      - kind: limit
        text: >-
          כש-$v \to 0$ ההבהובים בו-זמניים גם ב-$S'$. אם הרכבת הייתה נכנסת בדיוק ב-$S$, המרחקים היו אפס בשתי המערכות.
      - kind: units
        text: >-
          $\gamma vL/c^2$ בשניות.
      - kind: substitution
        text: >-
          $\gamma vL/c = 1.25\cdot0.6\cdot25\,\text{m} = 18.75\,\text{m}$, ולכן $\Delta t' = 18.75/(3.0\cdot10^8)\,\text{s} = 62.5\,\text{ns}$.
          המרחקים: $0.625 - 0 = 0.625\,\text{m}$ ו-$31.25 - 30.625 = 0.625\,\text{m}$.
      - kind: result
        text: >-
          במערכת של הרכבת הנורה בפתח היציאה מהבהבת $62.5\,\text{ns}$ לפני זו שבכניסה, $0.625\,\text{m}$ לפני החזית; ההבהוב בכניסה
          $0.625\,\text{m}$ מאחורי הסוף. אף הבהוב לא קורה ליד הרכבת, כמו במערכת של המנהרה.

  - id: W-9.6-07
    level: mid
    qualitative: true
    objectives: [OBJ-9.6-2]
    prompt: >-
      מוט עובר באסם, ובמערכת של האסם שתי הדלתות פועלות יחד, כשהמוט כולו בפנים ואף דלת לא נוגעת בו. קבעו ונמקו:

      א. האם יש מערכת ייחוס אינרציאלית שבה דלת הכניסה פועלת לפני דלת היציאה?

      ב. האם יש מערכת ייחוס שבה אחת הדלתות פוגעת במוט?

      ג. האם יש מערכת שבה פעולת דלת אחת יכולה להיות הסיבה לפעולת השנייה?
    answer: >-
      א. כן, כל מערכת שנעה ביחס לאסם בכיוון ההפוך לתנועת המוט. ב. לא. ג. לא: האינטרוול ביניהן מרחבי.
    solution:
      - kind: law
        text: >-
          מאורעות עם $\Delta t = 0$ ב-$S$ מופרדים במערכת שנעה במהירות $u$ ב-$\Delta t' = -\gamma u\Delta x/c^2$. מאורע במקום אחד הוא
          עובדה בכל מערכת. לזוג עם $s^2 < 0$ אין סדר זמנים מוחלט, ואין ביניהם קשר סיבתי.
      - kind: reasoning
        text: >-
          א: עם $\Delta x = L_{\text{barn}} > 0$ מהכניסה ליציאה, מערכת עם $u < 0$ (נעה נגד כיוון המוט) נותנת $\Delta t' > 0$ ליציאה:
          דלת הכניסה קודמת. ב: "הדלת פוגעת במוט" היא מאורע במקום אחד; ב-$S$ היא לא פוגעת, ולכן בשום מערכת. ג: $s^2 = -L_{\text{barn}}^2 < 0$:
          אות שנע לכל היותר ב-$c$ לא מגיע מפעולה אחת לשנייה, בשום מערכת.
      - kind: limit
        text: >-
          כש-$u \to 0$ הדלתות בו-זמניות; ככל ש-$|u|$ גדל, ההפרש גדל, בשני הכיוונים.
      - kind: result
        text: >-
          הסדר בין פעולות הדלתות תלוי במערכת, ויש מערכות לכל סדר. אבל בשום מערכת דלת לא נוגעת במוט, ואף פעולה לא גורמת לשנייה.

  - id: W-9.6-08
    level: bagrut
    objectives: [OBJ-9.6-1]
    prompt: >-
      במסע של בעיה 1 (5.0 שנות אור, $0.8c$), חשבו את שני הגילים בפגישה **כולם במערכת ההליכה $S'$** של האסטרונאוטית, שנעה
      ב-$+0.8c$ ביחס לכדור הארץ: מצאו ב-$S'$ את מאורעות הסיבוב והפגישה, את המהירות שלה בדרך החזרה, ואת הזמן העצמי לאורך כל
      קו עולם. האם $S'$ "מצילה" את הטענה שלה שהאח צעיר יותר?
    answer: >-
      סיבוב ב-$t' = 3.75$, $x' = 0$; פגישה ב-$t' = 20.8$, $x' = -16.7$; בחזרה $-0.976c$. זמנים עצמיים: האח $12.5$, היא $3.75 + 3.75 = 7.50$. לא.
    solution:
      - kind: given
        text: >-
          ב-$S$: יציאה $(0, 0)$, סיבוב $(6.25,\ 5.0)$, פגישה $(12.5,\ 0)$, בשנים ובשנות אור. $\beta = 0.8$, $\gamma = 5/3$.
      - kind: law
        text: >-
          טרנספורמציית לורנץ, $t' = \gamma(t - \beta x)$ ו-$x' = \gamma(x - \beta t)$ כש-$c = 1$, וזמן עצמי לאורך קו עולם, בכל
          מערכת אינרציאלית אחת.
      - kind: manipulation
        text: >-
          סיבוב: $t' = \tfrac53(6.25 - 4.0) = 3.75$, $x' = \tfrac53(5.0 - 5.0) = 0$: בדרך ההליכה היא נחה ב-$S'$. פגישה:
          $t' = \tfrac53\cdot12.5 = \tfrac{125}{6} = 20.8$, $x' = \tfrac53(0 - 10) = -\tfrac{50}{3} = -16.7$. כדור הארץ נע ב-$S'$ במהירות
          $-\tfrac{50}{3}\big/\tfrac{125}{6} = -0.8$. בחזרה היא עוברת $\Delta x' = -\tfrac{50}{3}$ ב-$\Delta t' = \tfrac{125}{6} - \tfrac{15}{4} = \tfrac{205}{12} = 17.1$,
          מהירות $-\tfrac{200}{205} = -0.976$, בדיוק $-2\beta/(1 + \beta^2)$ של חיבור מהירויות. חשבו את הזמנים העצמיים בשברים, כי
          הפרש של שני ריבועים קרובים רגיש לעיגול: האח $\sqrt{\left(\tfrac{125}{6}\right)^2 - \left(\tfrac{100}{6}\right)^2} = \tfrac{75}{6} = 12.5$; היא
          $3.75 + \sqrt{\left(\tfrac{205}{12}\right)^2 - \left(\tfrac{200}{12}\right)^2} = 3.75 + \tfrac{45}{12} = 3.75 + 3.75 = 7.50$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$ מהירות החזרה ב-$S'$, $2\beta/(1 + \beta^2)$, שואפת לאפס, ושני הגילים שווים. כש-$\beta \to 1$ היא שואפת ל-$c$, והזמן העצמי
          של החזרה לאפס.
      - kind: units
        text: >-
          כל הזמנים בשנים, המרחקים בשנות אור, והמהירות ביחידות של $c$.
      - kind: result
        text: >-
          גם ב-$S'$ האח מזדקן $12.5$ שנים והיא $7.50$. ב-$S'$ היא נחה בדרך ההליכה, אבל בדרך החזרה היא נעה מהר מאוד, $0.976c$, והשעון שלה
          מפגר שם מאוד. כל מערכת אינרציאלית אחת נותנת את אותה תשובה; הטענה שלה נשענת על שתי מערכות כאילו היו אחת.

  - id: W-9.6-09
    level: bagrut
    objectives: [OBJ-9.6-2]
    prompt: >-
      מוט שאורכו העצמי $8.0\,\text{m}$ ואסם שאורכו העצמי $6.0\,\text{m}$. במערכת של האסם שתי הדלתות פועלות יחד, כשמרכז המוט
      במרכז האסם. מצאו את המהירות הקטנה ביותר שבה אף דלת לא פוגעת במוט. במהירות הזו בדיוק: מה קורה בכל דלת, בשתי המערכות, וכמה
      זמן עובר במערכת של המוט בין פעולות הדלתות? בדקו שבמערכת של המוט, בזמן הזה, האסם עובר בדיוק את מה שחסר לו כדי "לכסות" את
      המוט.
    answer: >-
      $\beta = 0.661$ ($\gamma = 4/3$). כל דלת פועלת בדיוק בקצה של המוט, בשתי המערכות; $17.6\,\text{ns}$; $4.50 + 3.50 = 8.00\,\text{m}$.
    solution:
      - kind: given
        text: >-
          $L_p = 8.0\,\text{m}$, $L_b = 6.0\,\text{m}$, אורכים עצמיים; $S$ מערכת האסם, $S'$ מערכת המוט.
      - kind: law
        text: >-
          $L = L_0/\gamma$; $\Delta t' = \gamma vL_b/c^2$ בין פעולות הדלתות ב-$S'$; מאורע במקום אחד הוא עובדה בכל מערכת.
      - kind: manipulation
        text: >-
          ב-$S$ המוט לא נפגע כש-$L_p/\gamma \le L_b$, כלומר $\gamma \ge L_p/L_b$ ו-$\beta \ge \sqrt{1 - (L_b/L_p)^2}$. בשוויון
          המרווח ב-$S$ אפס: כל דלת פועלת בדיוק בקצה. ב-$S'$ האסם באורך $L_b/\gamma$ ונע ב-$v$; בין פעולות הדלתות הוא עובר
          $v\Delta t' = \gamma\beta^2L_b$. סך הכול $L_b/\gamma + \gamma\beta^2L_b = \gamma L_b\left(1 - \beta^2 + \beta^2\right) = \gamma L_b = L_p$.
      - kind: limit
        text: >-
          אם $L_p = L_b$, המהירות המינימלית אפס ו-$\Delta t' = 0$. כש-$L_p \gg L_b$ צריך $\beta \to 1$.
      - kind: units
        text: >-
          $\gamma vL/c^2$ בשניות; $\gamma\beta^2L_b$ במטרים.
      - kind: substitution
        text: >-
          $\gamma = 8.0/6.0 = 4/3$, $\beta = \sqrt{1 - 0.5625} = 0.661$. $\gamma\beta L_b = \tfrac43\cdot0.661\cdot6.0 = 5.29\,\text{m}$ של
          $ct'$, כלומר $17.6\,\text{ns}$. $L_b/\gamma = 4.50\,\text{m}$ ו-$\gamma\beta^2L_b = 3.50\,\text{m}$.
      - kind: result
        text: >-
          מ-$\beta = 0.661$ ומעלה אף דלת לא פוגעת במוט. בדיוק במהירות הזו כל דלת "מלטפת" קצה, בשתי המערכות. ב-$S'$ דלת היציאה
          פועלת בחזית, $17.6\,\text{ns}$ אחר כך דלת הכניסה בקצה האחורי, ובינתיים האסם בן $4.50\,\text{m}$ עבר $3.50\,\text{m}$: $8.00\,\text{m}$, אורך המוט.

  - id: W-9.6-10
    level: bagrut
    qualitative: true
    objectives: [OBJ-9.6-1]
    prompt: >-
      גרסה בלי שום תאוצה. חללית A חולפת על פני כדור הארץ במהירות $0.8c$, ובאותו רגע השעון שלה והשעון של כדור הארץ מתאפסים. ליד
      כוכב במרחק 5.0 שנות אור היא חולפת על פני חללית B, שטסה לעבר כדור הארץ באותה מהירות, ו-B מכוונת את השעון שלה לקריאה של A.
      כש-B חולפת על פני כדור הארץ, משווים את השעונים. אף אחד לא האיץ. כמה מראה כל שעון? האם בלי תאוצה חוזרת הסימטריה? היכן
      "מסתתר" חוסר הסימטריה?
    answer: >-
      כדור הארץ $12.5$ שנים, השעון שעבר מ-A ל-B $7.50$ שנים. הסימטריה לא חוזרת: הקריאה עברה בין שתי מערכות אינרציאליות.
    solution:
      - kind: law
        text: >-
          זמן עצמי לאורך קו עולם; הקריאה שעוברת בין A ל-B במאורע אחד (המפגש ליד הכוכב) היא עובדה בכל מערכת.
      - kind: reasoning
        text: >-
          הקריאה מתקדמת לאורך קו עולם שבור: קטע של A מכדור הארץ לכוכב, וקטע של B מהכוכב לכדור הארץ, בדיוק כמו בפרדוקס התאומים.
          ב-$S$ כל קטע תורם $\dfrac{L}{v}\sqrt{1 - \beta^2} = 3.75$ שנים, ולכן השעון של B מראה $7.50$, וכדור הארץ $2L/v = 12.5$.
          חוסר הסימטריה אינו תאוצה: השעון של כדור הארץ נשאר במערכת אינרציאלית אחת, והקריאה שמושווה איתו עברה ממערכת $S'$ של A
          למערכת $S''$ של B.
      - kind: limit
        text: >-
          כש-$\beta \to 0$ או $L \to 0$ שתי הקריאות שוות. ההפרש, $\dfrac{2L}{v}\left(1 - \dfrac1\gamma\right)$, גדל עם $L$, בלי שום תאוצה
          שתלויה ב-$L$.
      - kind: result
        text: >-
          השעון של B מראה $7.50$ שנים מול $12.5$ על כדור הארץ, בלי שאף גוף האיץ. מה ששובר את הסימטריה הוא המעבר בין שתי מערכות
          אינרציאליות, כאן כמעבר של קריאה מחללית לחללית, ולא התאוצה.

challenge:
  - id: W-9.6-c1
    stars: 1
    objectives: [OBJ-9.6-1]
    prompt: >-
      אליס ובוב מאפסים את השעונים שלהם ב-$x = 0$. ברגע $t = 0$ אליס יוצאת בחללית במהירות $v = \tfrac35c$. במערכת של בוב, ברגע
      $t_B = 10$ שנים היא מסתובבת מיד וחוזרת באותה מהירות, ופוגשת אותו ב-$t_B = 20$ שנים.

      א. שרטטו דיאגרמת מינקובסקי של קו העולם של אליס במערכת של בוב, וסמנו את המרחק של נקודת הסיבוב.

      ב. שרטטו באותה דיאגרמה את הצירים של המערכות של אליס, בהליכה ובחזרה.

      ג. כל אחד מהם יכול לומר שהשני הוא שנע ולכן הזדקן פחות. הסבירו איך נפתר הפרדוקס, ומצאו את הגילים בפגישה.
    answer: >-
      א. הסיבוב ב-$x = 6.0$ שנות אור. ב. הצירים נוטים ב-$31.0^\circ$ (בחזרה, בכיוון ההפוך). ג. אליס $16.0$ שנים, בוב $20.0$; "עכשיו"
      של אליס על בוב קופץ בסיבוב מ-$6.40$ ל-$13.6$ שנים.
    solution:
      - kind: given
        text: >-
          $\beta = 0.6$, $\gamma = 1.25$, $c = 1$ שנת אור לשנה. במערכת $S$ של בוב: יציאה $(0, 0)$, סיבוב ב-$t = 10$ שנים, פגישה $(20, 0)$.
      - kind: law
        text: >-
          זמן עצמי לאורך קו עולם, $\tau = \sum\sqrt{\Delta t^2 - \Delta x^2/c^2}$, במערכת אינרציאלית אחת. ציר $ct'$ של מערכת במהירות
          $\beta$ הוא הקו $x = \beta ct$, וציר $x'$ הוא $ct = \beta x$, שניהם נוטים ב-$\arctan\beta$ לעבר קו האור.
      - kind: manipulation
        text: >-
          הסיבוב ב-$x = \beta\cdot10 = 6.0$ שנות אור. בהליכה ציר $ct'$ של אליס הוא קו העולם שלה, וציר $x'$ נוטה ב-$\arctan0.6$ מעל
          ציר $x$; בחזרה הצירים נוטים לצד השני. הזמן העצמי שלה: $2\sqrt{10^2 - 6^2} = 16$. קו הבו-זמניות שלה דרך הסיבוב פוגש את בוב
          ב-$10 - 0.6\cdot6 = 6.4$ בהליכה וב-$10 + 3.6 = 13.6$ בחזרה.
      - kind: limit
        text: >-
          כש-$\beta \to 0$ הגילים שווים והקפיצה נעלמת. בדיקה: לפי המערכות שלה בוב מזדקן $8/1.25 = 6.4$ בכל דרך, ו-$6.4 + 7.2 + 6.4 = 20$.
      - kind: units
        text: >-
          שנים ושנות אור עם $c = 1$; $\arctan\beta$ בזווית.
      - kind: result
        text: >-
          בוב בן $20.0$ ואליס $16.0$ שנים בפגישה. הסימטריה נשברת כי בוב נמצא כל הזמן במערכת אינרציאלית אחת, ואליס בשתיים. בכל דרך
          כל אחד מוצא שהשעון של השני מפגר, אבל בסיבוב "עכשיו" של אליס על בוב קופץ $7.20$ שנים, מ-$6.40$ ל-$13.6$.
    source:
      name: MIT 8.20 Introduction to Special Relativity, Midterm
      year: 2021
      problem: Task 4 (Twin Paradox)
      url: https://ocw.mit.edu/courses/8-20-introduction-to-special-relativity-january-iap-2021/c982c90fb0a96eee1d4c2c6db354a0d0_MIT8_20iap21_midterm2.pdf
      verified: '2026-11-12'
      adapted: true

  - id: W-9.6-c2
    stars: 2
    objectives: [OBJ-9.6-2]
    prompt: >-
      רץ מחזיק מוט שאורכו העצמי $12\,\text{m}$ ורץ לעבר אסם שאורכו העצמי $10\,\text{m}$, במהירות $v = \tfrac{\sqrt3}{2}c$ ($\gamma = 2$). לאסם
      שתי דלתות: הדלת הקדמית, שדרכה נכנסים, פתוחה בהתחלה, והדלת האחורית סגורה. ליד כל דלת עומד חבר. החבר שליד הדלת הקדמית סוגר
      אותה ברגע שהמוט עבר אותה כולו. החבר שליד הדלת האחורית פותח אותה רגע לפני שהמוט היה פוגע בה.

      א. מה אורך המוט לפי שני החברים, ומה אורך האסם לפי הרץ?

      ב. לפי החברים, האם יש זמן שבו שתי הדלתות סגורות? אם כן, כמה זמן?

      ג. לפי הרץ, האם יש זמן שבו שתי הדלתות סגורות?

      ד. הסבירו את ההבדל בין שתי התשובות.
    answer: >-
      א. $6.00\,\text{m}$ ו-$5.00\,\text{m}$. ב. כן, $15.4\,\text{ns}$. ג. לא: הדלת האחורית נפתחת $26.9\,\text{ns}$ לפני שהקדמית נסגרת.
      ד. שני המאורעות במרחק מרחבי, $s^2 = -78.7\,\text{m}^2$, והסדר שלהם תלוי במערכת.
    solution:
      - kind: given
        text: >-
          $\gamma = 2$, $\beta = 0.866$. $S$ מערכת האסם: הדלת הקדמית ב-$x = 0$, האחורית ב-$x = 10\,\text{m}$. $S'$ מערכת הרץ. מאורע A: הקצה
          האחורי של המוט עובר את הדלת הקדמית, והיא נסגרת. מאורע B: החזית מגיעה לדלת האחורית, והיא נפתחת. נעבוד ב-$ct$ במטרים.
      - kind: law
        text: >-
          $L = L_0/\gamma$; $ct' = \gamma(ct - \beta x)$; $s^2 = c^2\Delta t^2 - \Delta x^2$, זהה בכל מערכת.
      - kind: manipulation
        text: >-
          ב-$S$ המוט באורך $6.0\,\text{m}$. ב-A, $ct = 0$, הקצה האחורי ב-$x = 0$ והחזית ב-$6.0\,\text{m}$; החזית עוברת עוד $4.0\,\text{m}$ עד
          B: $ct_B = 4.0/\beta = 4.62\,\text{m}$. בין A ל-B שתי הדלתות סגורות. ב-$S'$ האסם באורך $5.0\,\text{m}$ והמוט $12\,\text{m}$: החזית
          מגיעה לדלת האחורית (B) כשהקצה האחורי עוד $12 - 5 = 7.0\,\text{m}$ לפני הדלת הקדמית, והאסם צריך לעבור $7.0\,\text{m}$ עד A:
          $c\Delta t' = 7.0/\beta = 8.08\,\text{m}$, B קודם. בדיקה בטרנספורמציה: $ct'_B - ct'_A = 2(4.62 - 0.866\cdot10) = -8.08\,\text{m}$.
      - kind: limit
        text: >-
          אילו $L_0/\gamma = L_{\text{barn}}$, ב-$S$ A ו-B היו בו-זמניים וגם ב-$S'$ הפער היה $\gamma\beta L_{\text{barn}}$: המאורעות היו בדיוק "על הגבול".
          כש-$\beta \to 0$ המוט לא נכנס בכלל ולא היה זמן שבו שתי הדלתות סגורות.
      - kind: units
        text: >-
          $c\Delta t$ במטרים, ו-$\Delta t = 4.62\,\text{m}/(3.0\cdot10^8\,\text{m/s})$ בשניות.
      - kind: substitution
        text: >-
          ב-$S$: $4.62/(3.0\cdot10^8)\,\text{s} = 15.4\,\text{ns}$. ב-$S'$: $8.08/(3.0\cdot10^8)\,\text{s} = 26.9\,\text{ns}$. $s^2 = 4.62^2 - 10^2 = -78.7\,\text{m}^2$.
      - kind: result
        text: >-
          החברים: המוט $6.00\,\text{m}$, ושתי הדלתות סגורות יחד $15.4\,\text{ns}$. הרץ: האסם $5.00\,\text{m}$, והדלת האחורית נפתחת $26.9\,\text{ns}$
          לפני שהקדמית נסגרת, ולכן הן אף פעם לא סגורות יחד. A ו-B במרחק מרחבי, ולכן הסדר שלהם תלוי במערכת. על כל מאורע במקום אחד,
          למשל שהמוט אף פעם לא פוגע בדלת, שניהם מסכימים.
    source:
      name: MIT 8.20 Introduction to Special Relativity, Midterm
      year: 2021
      problem: Task 5 (The Barn Paradox)
      url: https://ocw.mit.edu/courses/8-20-introduction-to-special-relativity-january-iap-2021/c982c90fb0a96eee1d4c2c6db354a0d0_MIT8_20iap21_midterm2.pdf
      verified: '2026-11-12'
      adapted: true

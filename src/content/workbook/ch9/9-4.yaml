# (C_LIGHT = 3.0e8 m/s), src/physics/relativity.ts and src/physics/doppler.ts (speeds in units of c):
#   W02 0.80 ⊕ 0.40 = 0.909, (−0.80) ⊕ 0.40 = −0.588 (Galilean 1.20, −0.400);
#   W03 589 nm approaching at 0.10c: 532.8 nm (first order 530.1);
#   W04 muon 0.99c, frame 0.90c: u′ = 0.09/0.109 = 0.826c (Galilean 0.0900);
#   W05 β = ±0.10: λ/λ₀ = 1.106 and 0.9045 (+10.6%, −9.5%), mean 1.005 = γ;
#   W06 24.0 GHz, 30 m/s: β = 1.00e-7, Δf = 2βf₀/(1 − β) = 4800 Hz (one way 2400);
#   W07 (−0.75) ⊕ 0.50 = −0.400 (Galilean −0.250): D(0.4) = 1.53 (wrong D(0.25) = 1.29);
#   W08 (review: changed from 0.5c, which repeated the lesson's example 3, and the English word dropped)
#       φ(0.6) = artanh 0.6 = ln 2 = 0.693, tanh(4φ) = 255/257 = 0.992; artanh 0.999 = 3.80 = 5.48 φ: after 5 launches
#       0.99805, after 6 0.99951 (6 launches);
#   W09 β = 0.5 approaching: emission events (0, 0), (1.15, 0.577) in S, received 0.577 T₀ apart = √(1/3);
#   W10 Fizeau, n = 1.33, v = 5.0 m/s: u − c/n = 2.17 m/s = v(1 − 1/n²), drag coefficient 0.435;
#   c1 650 → 570 nm: β = (1 − r²)/(1 + r²) = 0.131, 3.92e7 m/s (first order 0.123);
#   c2 symbolic; check with v = 0.5c, u = 0.8c, T = 1.0 h: t′(E2) = 1.15 h, 0.577 light-h, t(E3) = 2.67 h,

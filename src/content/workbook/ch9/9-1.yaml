#   W10 L = 300 m, v = 250 m/s: Lv/(c² − v²) = 8.33e-13 s;
#   c2 R = 3.0e8 m, wind 1.0e5 m/s: returns between (2R/c)/√(1 − β²) and (2R/c)/(1 − β²), spread Rβ²/c = 1.11e-7 s.
# In a >- block consecutive lines fold into one paragraph: every part (א, ב, …) starts after a blank line.

lesson: '9.1'
practice:
  - id: W-9.1-01
    level: basic
    qualitative: true
    objectives: [OBJ-9.1-1]
    prompt: >-
      באינטרפרומטר של מייקלסון ומורלי אי אפשר היה לבנות שתי זרועות שאורכן שווה בדיוק של חלק קטן מאורך הגל של האור.
      קבעו ונמקו:

      א. האם המקום של פסי ההתאבכות במכשיר שעומד במקום מלמד משהו על רוח האתר?

      ב. למה סובבו את המכשיר, ומה בדיוק חיפשו בזמן הסיבוב?
    answer: >-
      א. לא: המקום של הפסים נקבע בעיקר מההפרש הקבוע בין אורכי הזרועות, שאינו ידוע בדיוק של אורך גל. ב. בסיבוב ב-$90^\circ$
      הזרועות מחליפות תפקיד ביחס לרוח, והתרומה של הרוח להפרש הזמנים מחליפה סימן; חיפשו **שינוי** בתבנית בזמן הסיבוב.
    solution:
      - kind: law
        text: >-
          התבנית נקבעת מההפרש בין זמני ההלוך-חזור בשתי הזרועות; שינוי של זמן מחזור אחד, $\lambda/c$, מזיז אותה בפס אחד.
      - kind: reasoning
        text: >-
          א: ההפרש הוא סכום של חלק קבוע, $2(L_1 - L_2)/c$, שתלוי באורכים, וחלק קטן שתלוי ברוח. החלק הקבוע שווה למספר לא ידוע
          של מחזורים (הדרך היא עשרות מיליוני אורכי גל), ולכן מהתבנית לבדה אי אפשר להפריד ביניהם. ב: סיבוב לא משנה את האורכים, אבל
          מחליף את הזרוע שלאורך הרוח. לכן החלק הקבוע נשאר, והחלק של הרוח משנה סימן: כל הזזה בזמן הסיבוב נובעת מהרוח בלבד.
      - kind: limit
        text: >-
          בלי רוח, $v \to 0$, הסיבוב לא משנה כלום, וגם לפי תאוריית האתר לא אמורה להיות הזזה.
      - kind: units
        text: >-
          $2(L_1 - L_2)/c$ בשניות, כמו זמן מחזור, $\lambda/c$; היחס ביניהם הוא מספר פסים.
      - kind: result
        text: >-
          א. לא. ב. כדי להחליף את תפקידי הזרועות; מחפשים הזזה של הפסים תוך כדי הסיבוב.

  - id: W-9.1-02
    level: basic
    objectives: [OBJ-9.1-1]
    prompt: >-
      חשבו את $\beta = v/c$ ואת $\beta^2$ עבור: א. מטוס נוסעים שטס במהירות $250\,\text{m/s}$; ב. כדור הארץ במסלולו סביב השמש,
      $3.0\cdot10^4\,\text{m/s}$. איזה מהשניים קובע את הגודל של האפקט בניסוי מייקלסון-מורלי, ולמה דווקא $\beta^2$?
    answer: >-
      א. $\beta = 8.33\cdot10^{-7}$, $\beta^2 = 6.94\cdot10^{-13}$. ב. $\beta = 1.0\cdot10^{-4}$, $\beta^2 = 1.0\cdot10^{-8}$. האפקט בהלוך-חזור
      הוא מסדר $\beta^2$.
    solution:
      - kind: given
        text: >-
          $c = 3.0\cdot10^8\,\text{m/s}$.
      - kind: law
        text: >-
          $\beta = v/c$. בהלוך-חזור, $t_\parallel - t_\perp \approx L\beta^2/c$: אפקט מסדר ראשון מתבטל בין שני הכיוונים.
      - kind: substitution
        text: >-
          א: $250/(3.0\cdot10^8) = 8.33\cdot10^{-7}$, בריבוע $6.94\cdot10^{-13}$. ב: $3.0\cdot10^4/(3.0\cdot10^8) = 1.0\cdot10^{-4}$, בריבוע $1.0\cdot10^{-8}$.
      - kind: limit
        text: >-
          כש-$v \to 0$ שני הגדלים מתאפסים; וכש-$\beta \ll 1$, $\beta^2$ קטן ממנו עוד הרבה יותר: זו הסיבה שהניסוי היה כל כך קשה.
      - kind: units
        text: >-
          $\beta$ ו-$\beta^2$ חסרי ממדים.
      - kind: result
        text: >-
          המסלול של כדור הארץ, עם $\beta^2 = 1.0\cdot10^{-8}$; המטוס זניח לגמרי, $6.94\cdot10^{-13}$.

  - id: W-9.1-03
    level: basic
    qualitative: true
    objectives: [OBJ-9.1-2]
    prompt: >-
      לכל טענה, קבעו אם היא אחת משתי הנחות היסוד של איינשטיין, מסקנה שנובעת מהן, או טענה שגויה. נמקו.

      א. מהירות האור בריק היא $c$ בכל מערכות הייחוס האינרציאליות.

      ב. שני מאורעות במקומות שונים, שבו-זמניים במערכת אחת, אינם בו-זמניים בכל מערכת אחרת שנעה לאורך הקו שמחבר אותם.

      ג. רק חוקי המכניקה זהים בכל המערכות האינרציאליות; חוקי האור תלויים במהירות של המעבדה.

      ד. ניסוי מייקלסון-מורלי, אם יבוצע בחללית שנעה במהירות קבועה, ייתן תוצאת אפס.
    answer: >-
      א. הנחה (השנייה). ב. מסקנה. ג. שגויה: ההנחה הראשונה חלה על כל הפיזיקה. ד. מסקנה.
    solution:
      - kind: law
        text: >-
          (1) חוקי הפיזיקה, כולם, זהים בכל המערכות האינרציאליות. (2) מהירות האור בריק היא $c$ בכל מערכת אינרציאלית, בלי קשר לתנועת המקור.
      - kind: reasoning
        text: >-
          א: זו ההנחה השנייה כלשונה. ב: זו יחסיות הבו-זמניות, שהסקנו מהרכבת והברקים בעזרת שתי ההנחות. ג: זה עקרון היחסות של גליליי,
          שאיינשטיין הרחיב מהמכניקה לכל הפיזיקה; בתאוריית האתר הוא היה נכון רק למכניקה. ד: החללית היא מערכת אינרציאלית, ולפי
          ההנחה השנייה האור נע בה במהירות $c$ בכל כיוון, ולכן אין הפרש בין הזרועות בשום זווית.
      - kind: limit
        text: >-
          חללית שעומדת היא מקרה פרטי של ד, $v \to 0$: גם תאוריית האתר נותנת שם אפס אם האתר נח במערכת הזו. ההבדל בין התאוריות הוא רק במערכת שנעה.
      - kind: units
        text: >-
          אין חישוב; $c$ במטרים לשנייה בכל מערכת.
      - kind: result
        text: >-
          הנחה: א. מסקנות: ב, ד. שגויה: ג.

  - id: W-9.1-04
    level: mid
    objectives: [OBJ-9.1-1]
    prompt: >-
      הקירוב הבינומי, $(1 + x)^n \approx 1 + nx$, טוב רק כש-$x$ קטן. בדקו עד כמה, עם רוח אתר מוגזמת, $\beta = 0.3$:

      א. השוו את $1/(1 - \beta^2)$ המדויק לקירוב $1 + \beta^2$, ואת $1/\sqrt{1 - \beta^2}$ לקירוב $1 + \beta^2/2$. מה השגיאה היחסית בכל אחד?

      ב. השוו את ההפרש $(t_\parallel - t_\perp)/(2L/c)$ המדויק לקירוב $\beta^2/2$. למה השגיאה כאן גדולה הרבה יותר?
    answer: >-
      א. $1.0989$ מול $1.09$ ($0.81\%$); $1.0483$ מול $1.045$ ($0.31\%$). ב. $0.0506$ מול $0.0450$, נמוך ב-$11\%$: ההפרש קטן משני הזמנים, ושגיאות מסדר $\beta^4$ לא מתבטלות בחיסור.
    solution:
      - kind: law
        text: >-
          $t_\parallel = \dfrac{2L}{c}\cdot\dfrac{1}{1 - \beta^2}$, $t_\perp = \dfrac{2L}{c}\cdot\dfrac{1}{\sqrt{1 - \beta^2}}$; הקירוב משמיט איברים מסדר $x^2 = \beta^4$.
      - kind: substitution
        text: >-
          $\beta^2 = 0.09$. $1/0.91 = 1.0989$, הקירוב $1.09$, שגיאה יחסית $0.81\%$. $1/\sqrt{0.91} = 1.0483$, הקירוב $1.045$, שגיאה $0.31\%$.
      - kind: manipulation
        text: >-
          ב: $1.0989 - 1.0483 = 0.0506$, והקירוב $0.09/2 = 0.045$. השגיאות הקטנות בכל זמן, מסדר $\beta^4 \approx 0.008$, לא מתבטלות בחיסור,
          אבל ההפרש עצמו הוא רק $0.05$. לכן השגיאה היחסית בו גדולה: $11\%$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$, השגיאה היחסית של ההפרש קטנה כמו $\beta^2$: ב-$\beta = 10^{-4}$ היא מסדר $10^{-8}$, וזניחה לגמרי.
      - kind: units
        text: >-
          כל הגדלים כאן יחסים חסרי ממדים.
      - kind: result
        text: >-
          א. $0.81\%$ ו-$0.31\%$. ב. $0.0506$ מדויק מול $0.0450$ בקירוב, $11\%$ נמוך.

  - id: W-9.1-05
    level: mid
    objectives: [OBJ-9.1-1]
    prompt: >-
      אינטרפרומטר מודרני בנוי בגרסה של מייקלסון-מורלי, עם זרועות שוות שהדרך האפקטיבית בכל אחת מהן $L = 25\,\text{m}$, ואור באורך
      גל $\lambda = 500\,\text{nm}$. א. בכמה פסים הייתה זזה התבנית, לפי תאוריית האתר, בסיבוב ב-$90^\circ$, אם רוח האתר
      $30\,\text{km/s}$? ב. ואם רוח האתר רק $1.5\,\text{km/s}$?
    answer: >-
      א. $1.0$ פס. ב. $2.5\cdot10^{-3}$ פס.
    solution:
      - kind: law
        text: >-
          $\Delta N \approx \dfrac{2L\beta^2}{\lambda}$, עם $\beta = v/c$.
      - kind: substitution
        text: >-
          א: $\beta = 1.0\cdot10^{-4}$, $\Delta N = \dfrac{2\cdot25\cdot10^{-8}}{5.0\cdot10^{-7}} = 1.0$. ב: $\beta = 5.0\cdot10^{-6}$, $\beta^2 = 2.5\cdot10^{-11}$,
          $\Delta N = \dfrac{2\cdot25\cdot2.5\cdot10^{-11}}{5.0\cdot10^{-7}} = 2.5\cdot10^{-3}$.
      - kind: reasoning
        text: >-
          מהירות קטנה פי 20 נותנת הזזה קטנה פי $20^2 = 400$: $1.0/400 = 2.5\cdot10^{-3}$. ניסוי שרוצה להגביל את רוח האתר לפי 20 פחות צריך
          להיות רגיש פי 400 יותר.
      - kind: limit
        text: >-
          כש-$v \to 0$, $\Delta N \to 0$; ו-$\Delta N$ גדל עם $L$ וקטן עם $\lambda$: זרועות ארוכות ואור קצר-גל מגבירים את הרגישות.
      - kind: units
        text: >-
          $L/\lambda$ חסר ממדים, ו-$\beta^2$ חסר ממדים: $\Delta N$ הוא מספר פסים.
      - kind: result
        text: >-
          א. $1.0$ פס. ב. $2.5\cdot10^{-3}$ פס.

  - id: W-9.1-06
    level: mid
    qualitative: true
    objectives: [OBJ-9.1-1]
    prompt: >-
      אחרי ניסוי מייקלסון-מורלי הוצע ש"האתר נגרר עם כדור הארץ", כמו האוויר בתוך מכונית סגורה שנוסעת. קבעו ונמקו:

      א. מה הייתה ההצעה הזו מנבאת לניסוי מייקלסון-מורלי?

      ב. האם תוצאת האפס לבדה מספיקה כדי להכריע בין "אתר שנגרר" לבין "אין אתר"? מה עוד צריך?
    answer: >-
      א. אפס הזזה: במעבדה האתר נח, אין רוח. ב. לא: שתי ההצעות מנבאות אפס. צריך תצפיות אחרות, כמו הסטייה של אור הכוכבים, שבהן
      אתר נגרר נותן תוצאה אחרת.
    solution:
      - kind: law
        text: >-
          לפי תאוריית האתר, ההזזה בסיבוב היא $\Delta N \approx 2L\beta^2/\lambda$, כש-$\beta = v/c$ ו-$v$ המהירות של המעבדה **ביחס לאתר שסביבה**.
      - kind: reasoning
        text: >-
          א: אם האתר ליד כדור הארץ נע איתו, המהירות של המעבדה ביחס אליו אפס, $\Delta N = 0$, כמו שנמדד. ב: גם "אין אתר, והאור נע
          במהירות $c$ בכל מערכת" נותן אפס. ניסוי אחד שבו שתי ההצעות מנבאות אותה תוצאה לא מבדיל ביניהן; צריך תצפית שבה הן נבדלות.
          הסטייה של אור הכוכבים, שנגרמת מהתנועה של כדור הארץ, היא תצפית כזו, והיא סתרה אתר שנגרר.
      - kind: limit
        text: >-
          אם האתר נגרר רק בחלקו, הרוח במעבדה היא חלק מ-$v$, וההזזה קטנה בריבוע החלק הזה: גם כאן תוצאת האפס מגבילה את החלק.
      - kind: units
        text: >-
          אין חישוב; $\Delta N$ מספר פסים.
      - kind: result
        text: >-
          א. אפס. ב. לא; צריך ניסוי שבו ההצעות נבדלות, כמו הסטייה של אור הכוכבים.

  - id: W-9.1-07
    level: mid
    objectives: [OBJ-9.1-2]
    prompt: >-
      רכבת נוסעת במהירות $0.8c$ ביחס לרציף, ואורכה **במערכת הרציף** $180\,\text{m}$. שני ברקים פוגעים בשני הקצוות שלה בו-זמנית
      במערכת הרציף. נוסעת יושבת באמצע הרכבת, וצופה עומד על הרציף באמצע בין סימני החריכה שעל הפסים. במערכת הרציף: מתי מגיע כל
      הבזק לנוסעת, ומתי לצופה, אחרי הפגיעות? ומה מסיקה הנוסעת, במערכת שלה, על סדר הפגיעות?
    answer: >-
      לנוסעת: הקדמי אחרי $0.167\,\mu\text{s}$, האחורי אחרי $1.50\,\mu\text{s}$; לצופה: שניהם אחרי $0.300\,\mu\text{s}$. הברק הקדמי פגע קודם במערכת הרכבת.
    solution:
      - kind: given
        text: >-
          מערכת הרציף, ציר $x$ לכיוון הנסיעה, הראשית אצל הצופה, $t = 0$ ברגע הפגיעות. הקצוות ב-$x = \pm90\,\text{m}$; הנוסעת ב-$x = vt$, $v = 2.4\cdot10^8\,\text{m/s}$.
      - kind: law
        text: >-
          במערכת הרציף כל הבזק נע במהירות $c$ (ההנחה השנייה); פגישה היא אותו מקום באותו זמן.
      - kind: manipulation
        text: >-
          קדמי: $90 - ct = vt$, $t_F = \dfrac{90}{c + v}$. אחורי: $-90 + ct = vt$, $t_R = \dfrac{90}{c - v}$. לצופה: $\dfrac{90}{c}$.
      - kind: limit
        text: >-
          כש-$v \to 0$, $t_F = t_R = 90/c$: הנוסעת מקבלת את שניהם יחד, כמו הצופה. כש-$v \to c$, $t_R \to \infty$.
      - kind: units
        text: >-
          $\text{m}/(\text{m/s}) = \text{s}$.
      - kind: substitution
        text: >-
          $t_F = \dfrac{90}{5.4\cdot10^8} = 0.167\,\mu\text{s}$, $t_R = \dfrac{90}{6.0\cdot10^7} = 1.50\,\mu\text{s}$, לצופה $\dfrac{90}{3.0\cdot10^8} = 0.300\,\mu\text{s}$.
      - kind: reasoning
        text: >-
          הקדמי מגיע אליה ראשון, וזו עובדה בכל מערכת. במערכת שלה היא נחה באמצע, המרחקים לשני הקצוות שווים, ושני ההבזקים נעים במהירות $c$: לכן הקדמי פגע קודם.
      - kind: result
        text: >-
          $0.167\,\mu\text{s}$ ו-$1.50\,\mu\text{s}$ לנוסעת, $0.300\,\mu\text{s}$ לצופה; במערכת הרכבת הברק הקדמי פגע קודם.

  - id: W-9.1-08
    level: bagrut
    qualitative: true
    objectives: [OBJ-9.1-2]
    prompt: >-
      שני ברקים פוגעים בשני הקצוות של רכבת נוסעת, בו-זמנית במערכת הרציף. ברכבת שני נוסעים: אחת יושבת באמצע הרכבת, ואחד יושב
      ממש בקצה האחורי שלה. כל אחד מהם רושם מתי, לפי שעון שלו, הגיע אליו כל הבזק. השעונים ברכבת מכוונים זה לזה במערכת הרכבת.
      קבעו ונמקו:

      א. איזה הבזק מגיע ראשון לנוסע שבקצה האחורי?

      ב. איך כל אחד מהם מחשב, במערכת הרכבת, מתי פגע כל ברק? האם שניהם מגיעים לאותו סדר?

      ג. האם הנוסע שבקצה האחורי יכול להסיק מזה שההבזק האחורי "פגע קודם", כי הוא ראה אותו קודם?
    answer: >-
      א. האחורי, מיד. ב. כל אחד מחסיר מזמן ההגעה את המרחק במערכת הרכבת חלקי $c$; שניהם מקבלים שהברק הקדמי פגע קודם. ג. לא: הוא
      חייב לתקן את זמן המעבר, וההבזק הקדמי עבר את כל אורך הרכבת.
    solution:
      - kind: law
        text: >-
          זמן של מאורע במערכת = זמן ההגעה של האור, על שעון שנח במערכת, פחות המרחק במערכת חלקי $c$ (ההנחה השנייה, במערכת הרכבת).
      - kind: reasoning
        text: >-
          א: הברק האחורי פוגע ממש לידו, ולכן האור שלו מגיע אליו מיד. ב: נסמן $\ell$ את אורך הרכבת במערכת שלה. הנוסעת באמצע מחסירה $\ell/(2c)$
          משני זמני ההגעה; הקדמי הגיע אליה קודם, ולכן פגע קודם. הנוסע שבקצה מחסיר אפס מזמן ההגעה של האחורי, ו-$\ell/c$ מזמן ההגעה של
          הקדמי. השעונים מכוונים במערכת הרכבת והמאורעות הם אותם מאורעות, ולכן אחרי התיקון הוא מקבל את אותם זמני פגיעה כמו הנוסעת:
          הקדמי פגע קודם. אם לא, היו לרכבת שני "סדרים" שונים, וזה לא מתיישב עם מערכת ייחוס אחת עם שעונים מכוונים.
      - kind: reasoning
        text: >-
          ג: לא. הסדר שבו הוא **רואה** תלוי במקום שלו; הסדר שבו הברקים **פגעו** במערכת הרכבת הוא מה שנשאר אחרי התיקון, והוא זהה לכל הצופים ברכבת.
      - kind: limit
        text: >-
          כשהרכבת עומדת, הברקים בו-זמניים גם במערכת שלה: הנוסע שבקצה מקבל את הקדמי אחרי $\ell/c$ בדיוק, ומסיק פגיעות בו-זמניות.
      - kind: units
        text: >-
          $\ell/c$ בשניות, כמו זמני ההגעה.
      - kind: result
        text: >-
          א. האחורי. ב. שניהם מקבלים: הקדמי פגע קודם, במערכת הרכבת. ג. לא; "ראה קודם" אינו "קרה קודם".

  - id: W-9.1-09
    level: bagrut
    objectives: [OBJ-9.1-1]
    prompt: >-
      מייקלסון ומורלי סובבו את המכשיר לאט, וקראו את מקום הפסים בכל זווית. נסמן $\theta$ את הזווית בין זרוע 1 לבין רוח האתר; זרוע 2
      ניצבת לה. לפי תאוריית האתר, זמן ההלוך-חזור בזרוע באורך $L$ שנוטה בזווית $\theta$ לרוח הוא
      $t(\theta) = \dfrac{2L}{c}\cdot\dfrac{\sqrt{1 - \beta^2\sin^2\theta}}{1 - \beta^2}$.

      א. בדקו שהנוסחה נותנת את $t_\parallel$ ואת $t_\perp$ המוכרים.

      ב. בעזרת הקירוב הבינומי, הראו שההזזה של התבנית ביחס ל-$\theta = 0$ היא $\Delta N(\theta) \approx \dfrac{2L\beta^2}{\lambda}\sin^2\theta$.

      ג. במכשיר של 1887 ($L = 11\,\text{m}$, $\lambda = 550\,\text{nm}$, $v = 30\,\text{km/s}$): מה ההזזה ב-$30^\circ$, ב-$45^\circ$ וב-$135^\circ$? כמה פעמים מגיעה ההזזה למקסימום בסיבוב שלם?
    answer: >-
      ב. $\Delta N = \dfrac{2L\beta^2}{\lambda}\sin^2\theta$. ג. $0.100$, $0.200$, $0.200$ פס; פעמיים בכל סיבוב (ב-$90^\circ$ וב-$270^\circ$).
    solution:
      - kind: law
        text: >-
          $\Delta t(\theta) = t(\theta) - t(\theta + 90^\circ)$, ו-$\Delta N(\theta) = \dfrac{c\left[\Delta t(0) - \Delta t(\theta)\right]}{\lambda}$.
      - kind: manipulation
        text: >-
          א: $\theta = 0$: $\sin\theta = 0$, ונשאר $\dfrac{2L}{c}\cdot\dfrac{1}{1 - \beta^2} = t_\parallel$. $\theta = 90^\circ$: $\dfrac{2L}{c}\cdot\dfrac{\sqrt{1 - \beta^2}}{1 - \beta^2} = \dfrac{2L}{c}\cdot\dfrac{1}{\sqrt{1 - \beta^2}} = t_\perp$.
      - kind: manipulation
        text: >-
          ב: בקירוב, $t(\theta) \approx \dfrac{2L}{c}\left(1 + \beta^2 - \tfrac12\beta^2\sin^2\theta\right)$. ל-$\theta + 90^\circ$ מחליפים $\sin^2\theta$ ב-$\cos^2\theta$.
          לכן $\Delta t(\theta) \approx \dfrac{L\beta^2}{c}\left(\cos^2\theta - \sin^2\theta\right)$, ו-$\Delta t(0) - \Delta t(\theta) \approx \dfrac{L\beta^2}{c}\cdot2\sin^2\theta$.
          מחלקים ב-$\lambda/c$.
      - kind: limit
        text: >-
          ב-$\theta = 90^\circ$ מתקבל $2L\beta^2/\lambda$, התוצאה של סיבוב ברבע; ב-$\theta = 180^\circ$, אפס: אחרי חצי סיבוב הזרועות שוב באותו מצב.
      - kind: units
        text: >-
          $L\beta^2/\lambda$ חסר ממדים: מספר פסים.
      - kind: substitution
        text: >-
          $2L\beta^2/\lambda = 0.400$. $\sin^2 30^\circ = 0.25$: $0.100$. $\sin^2 45^\circ = \sin^2 135^\circ = 0.5$: $0.200$.
      - kind: result
        text: >-
          $0.100$, $0.200$ ו-$0.200$ פס; $\sin^2\theta$ מגיע למקסימום פעמיים בכל סיבוב שלם, ב-$90^\circ$ וב-$270^\circ$.

  - id: W-9.1-10
    level: bagrut
    objectives: [OBJ-9.1-2]
    prompt: >-
      רכבת שאורכה **במערכת הרציף** $L$ נוסעת במהירות $v$. שני ברקים פוגעים בשני הקצוות שלה בו-זמנית במערכת הרציף, ונוסעת יושבת
      באמצע. א. הראו שבמערכת הרציף ההבזק האחורי מגיע לנוסעת $\dfrac{Lv}{c^2 - v^2}$ אחרי הקדמי, ובדקו את הביטוי בגבולות. ב. חשבו אותו
      למטוס סילון באורך $300\,\text{m}$, שטס במהירות $250\,\text{m/s}$, עם נוסעת באמצעו וברקים בשני קצותיו. מה זה אומר על הסיבה שבו-זמניות
      נראית לנו מוחלטת?
    answer: >-
      א. $t_R - t_F = \dfrac{Lv}{c^2 - v^2}$. ב. $8.33\cdot10^{-13}\,\text{s}$: זעיר לגמרי במהירויות של חיי היום-יום.
    solution:
      - kind: given
        text: >-
          מערכת הרציף, ציר $x$ לכיוון הנסיעה, $t = 0$ ברגע הפגיעות, הקצוות ב-$x = \pm L/2$, הנוסעת ב-$x = vt$.
      - kind: law
        text: >-
          במערכת הרציף כל הבזק נע במהירות $c$.
      - kind: manipulation
        text: >-
          $t_F = \dfrac{L/2}{c + v}$, $t_R = \dfrac{L/2}{c - v}$. ההפרש: $\dfrac{L}{2}\cdot\dfrac{(c + v) - (c - v)}{c^2 - v^2} = \dfrac{Lv}{c^2 - v^2}$.
      - kind: limit
        text: >-
          $v \to 0$: אפס, והבזקים מגיעים יחד. $v \to c$: אינסוף, כי האחורי לא משיג אותה. ובמהירויות קטנות, $\approx Lv/c^2$: לינארי ב-$v$ וקטן פי $v/c$ מ-$L/c$.
      - kind: units
        text: >-
          $\dfrac{\text{m}\cdot\text{m/s}}{\text{m}^2/\text{s}^2} = \text{s}$.
      - kind: substitution
        text: >-
          $\dfrac{300\cdot250}{9.0\cdot10^{16} - 6.25\cdot10^{4}} = 8.33\cdot10^{-13}\,\text{s}$.
      - kind: reasoning
        text: >-
          כשבמהירויות של מטוס ההבדל הוא פחות מטריליונית השנייה, אף מכשיר יומיומי ואף אדם לא יבחינו בו. לכן ה"עכשיו" המשותף של גליליי
          עבד כל כך טוב, עד שהמהירויות התקרבו ל-$c$.
      - kind: result
        text: >-
          א. $\dfrac{Lv}{c^2 - v^2}$. ב. $8.33\cdot10^{-13}\,\text{s}$.

challenge:
  - id: W-9.1-c1
    stars: 1
    objectives: [OBJ-9.1-2]
    prompt: >-
      מטוס טס במהירות קבועה $v$ מעל צופה על הקרקע; התייחסו לקרקע ולמטוס כמערכות אינרציאליות. ברגע שהמטוס מעל הצופה נשלח אות
      אור מאמצע המטוס. נוסעת A יושבת בחזית המטוס ונוסע B בעורף שלו, ולפי המדידה שלהם כל אחד מהם במרחק $d$ מאמצע המטוס.

      א. מהירות האור במערכת המטוס היא $c$. הסבירו למה A ו-B מסכימים שהאות הגיע אליהם בו-זמנית, וכמה זמן לקח לו להגיע.

      ב. מהירות האור במערכת הקרקע היא גם $c$. הסבירו למה לפי הצופה על הקרקע, ההגעה של האות ל-A ול-B אינם מאורעות בו-זמניים. למי
      הוא הגיע קודם לפי הקרקע?
    answer: >-
      א. מרחקים שווים ומהירות $c$ במערכת המטוס: שניהם אחרי $d/c$. ב. במערכת הקרקע B נע לקראת האות ו-A מתרחק ממנו, והאות נע במהירות $c$
      בשני הכיוונים: הוא מגיע ל-B (בעורף) קודם.
    solution:
      - kind: given
        text: >-
          מערכת המטוס $S'$ ומערכת הקרקע $S$; המטוס נע במהירות $v$ קדימה (מהעורף לחזית). האות יוצא מאמצע המטוס ברגע שהמטוס מעל הצופה.
      - kind: law
        text: >-
          ההנחה השנייה: מהירות האור $c$ בשתי המערכות. ובו-זמניות במערכת: אותו זמן של המערכת בשני המאורעות.
      - kind: reasoning
        text: >-
          א: במערכת המטוס, A, B ומקור האות נחים. האות נע לשני הכיוונים במהירות $c$, ועובר מרחק $d$ לכל אחד, ולכן מגיע לשניהם אחרי $d/c$: אותו זמן
          במערכת המטוס.
      - kind: reasoning
        text: >-
          ב: במערכת הקרקע האות יוצא מהנקודה שבה היה אמצע המטוס ברגע השליחה, ונע לשני הכיוונים במהירות $c$, **לא** $c \pm v$. בזמן שהוא בדרך,
          B (בעורף) נע קדימה, לקראתו, ו-A (בחזית) נע קדימה, הרחק ממנו. האור עובר ל-B מרחק קצר מהמרחק ל-A, באותה מהירות, ולכן מגיע ל-B
          קודם.
      - kind: limit
        text: >-
          כש-$v \to 0$ הקרקע והמטוס הם אותה מערכת, והאות מגיע לשניהם יחד גם לפי הקרקע. ובעולם של גליליי, עם $c \pm v$ במערכת הקרקע, הוא היה
          מגיע לשניהם יחד גם שם: את ההבדל יוצרת ההנחה השנייה.
      - kind: units
        text: >-
          $d/c$ בשניות.
      - kind: result
        text: >-
          א. בו-זמנית, אחרי $d/c$ במערכת המטוס. ב. לפי הקרקע, האות מגיע ל-B, בעורף, לפני A.
    source:
      name: MIT 8.20 Special Relativity, Problem Set 1
      year: 2008
      problem: Problem 19 (Relativity of simultaneity)
      url: https://stuff.mit.edu/afs/athena/course/8/8.20/www/psets/pset1.pdf
      verified: '2026-11-12'
      adapted: true

  - id: W-9.1-c2
    stars: 2
    objectives: [OBJ-9.1-1, OBJ-9.1-2]
    prompt: >-
      ניסוי המחשבה של אהרנפסט. אתם יושבים במרכז של קליפה כדורית ענקית ברדיוס $R = 3.0\cdot10^8\,\text{m}$ (שנית-אור אחת), שהדופן
      הפנימית שלה מחזירה אור לכל הכיוונים. מקור במרכז שולח הבזק קצר וחזק, שמתפשט לכל הכיוונים, ואתם מסתכלים על הדופן בשלוש
      השניות הבאות.

      א. נניח שנושבת דרך הקליפה רוח אתר במהירות $100\,\text{km/s}$, ושתאוריית האתר נכונה. מתי חוזר אליכם האור מהדופן, בכל
      כיוון? תארו מה תראו: איפה הדופן מוארת ראשונה, איפה אחרונה, וכמה זמן נמשך כל התהליך.

      ב. מה תראו לפי ההנחה השנייה של איינשטיין?

      ג. מה הקשר בין הניסוי הזה לניסוי מייקלסון-מורלי?
    answer: >-
      א. מכיוון בזווית $\theta$ לרוח האור חוזר אחרי $\dfrac{2R}{c}\cdot\dfrac{\sqrt{1 - \beta^2\sin^2\theta}}{1 - \beta^2}$. ראשונה נדלקת טבעת בניצב לרוח, אחרי
      $\dfrac{2R/c}{\sqrt{1 - \beta^2}}$; האור מתפשט ממנה לשני הקטבים שעל ציר הרוח, ושניהם נדלקים יחד, אחרונים, אחרי $\dfrac{2R/c}{1 - \beta^2}$.
      כל זה נמשך $R\beta^2/c = 1.11\cdot10^{-7}\,\text{s}$, בערך $2\,\text{s}$ אחרי ההבזק. ב. כל הדופן נדלקת בבת אחת, אחרי $2.00\,\text{s}$ בדיוק.
      ג. זה מייקלסון-מורלי עם "זרועות" בכל הכיוונים.
    solution:
      - kind: given
        text: >-
          $R = 3.0\cdot10^8\,\text{m}$, רוח $w = 1.0\cdot10^5\,\text{m/s}$, $\beta = w/c = 3.33\cdot10^{-4}$. $2R/c = 2.00\,\text{s}$.
      - kind: law
        text: >-
          לפי תאוריית האתר, הלוך-חזור לאורך כיוון בזווית $\theta$ לרוח לוקח $t(\theta) = \dfrac{2R}{c}\cdot\dfrac{\sqrt{1 - \beta^2\sin^2\theta}}{1 - \beta^2}$
          (במעבדה, $c$ ועוד הרוח כווקטורים; לאורך הרוח זה $t_\parallel$, ובניצב $t_\perp$). לפי ההנחה השנייה, האור נע במהירות $c$ בכל כיוון במערכת שלכם.
      - kind: manipulation
        text: >-
          $\sqrt{1 - \beta^2\sin^2\theta}$ הוא הקטן ביותר כש-$\sin^2\theta = 1$ (בניצב לרוח) והגדול ביותר כש-$\sin\theta = 0$, כלומר ב**שני** הכיוונים שעל ציר
          הרוח: במעלה הרוח ובמורדה $t$ שווה, כי $\sin^2$ זהה. לכן הדופן נדלקת ראשונה לאורך מעגל גדול שניצב לרוח, והחלק המואר מתרחב
          משם לשני הקטבים, שנדלקים יחד. משך התהליך: $t_\parallel - t_\perp \approx \dfrac{R\beta^2}{c}$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$, משך ההתפשטות מתאפס, וכל הדופן נדלקת יחד אחרי $2R/c$: התוצאה של ההנחה השנייה. וגם לפי תאוריית האתר, האור מזרם
          ומנגד לו חוזר יחד: אפקט מסדר ראשון ב-$\beta$ מתבטל בהלוך-חזור.
      - kind: units
        text: >-
          $R\beta^2/c$: $\text{m}/(\text{m/s}) = \text{s}$.
      - kind: substitution
        text: >-
          $\dfrac{R\beta^2}{c} = 1.0\,\text{s}\cdot(3.33\cdot10^{-4})^2 = 1.11\cdot10^{-7}\,\text{s}$. הטבעת נדלקת אחרי $2.00\,\text{s}$ ועוד $1.1\cdot10^{-7}\,\text{s}$, והקטבים אחרי $2.00\,\text{s}$ ועוד $2.2\cdot10^{-7}\,\text{s}$.
      - kind: reasoning
        text: >-
          ג: כל כיוון מהמרכז הוא "זרוע" באורך $R$, ומייקלסון-מורלי השוו רק שתי זרועות ניצבות. תוצאת האפס שלהם אומרת שבמעבדה
          ההלוך-חזור לא תלוי בכיוון, כלומר שהדופן תידלק כולה בבת אחת, כמו ב-ב.
      - kind: result
        text: >-
          א. טבעת בניצב לרוח נדלקת ראשונה, אחרי $2.00\,\text{s}$; התאורה מתפשטת לשני הקטבים שעל ציר הרוח, ונגמרת אחרי עוד $1.11\cdot10^{-7}\,\text{s}$.
          ב. כל הדופן נדלקת יחד, אחרי $2.00\,\text{s}$. ג. אותו ניסוי, בכל הכיוונים.
    source:
      name: MIT 8.20 Special Relativity, Problem Set 1
      year: 2008
      problem: Problem 13 (Ehrenfest's thought experiment)
      url: https://stuff.mit.edu/afs/athena/course/8/8.20/www/psets/pset1.pdf
      verified: '2026-11-12'
      adapted: true

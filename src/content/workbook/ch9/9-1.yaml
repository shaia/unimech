# src/physics/constants.ts (C_LIGHT = 3.0e8), src/physics/relativity.ts and src/physics/ether.ts:
#   W02 jet 250 m/s: β = 8.33e-7, β² = 6.94e-13; Earth's orbit 3.0e4 m/s: β = 1.0e-4, β² = 1.0e-8;
#   W04 β = 0.3: 1/(1 − β²) = 1.0989 vs 1.09 (0.81%), 1/√(1 − β²) = 1.0483 vs 1.045 (0.31%),
#       Δt/(2L/c) = 0.05062 exact vs β²/2 = 0.0450 (11% low);
#   W05 L = 25 m, λ = 500 nm: 1.0 fringe at 30 km/s, 0.0025 at 1.5 km/s;

# Past 77101 exams mapped onto the objectives of src/course.ts (the /exam-map skill).
#
# Source: the course page of Prof. Nir Shaviv, the 77101 coordinator, as archived by the Internet Archive on
# 2023-12-07 (http://web.archive.org/web/20231207125029/http://old.phys.huji.ac.il/~shaviv/students/77101/index.html;
# the live server refused connections). The four newest regular exams linked there were downloaded from the same
# snapshot and read on 2026-11-17:
#   2016-moed-a  .../77101-MoedA-2016.pdf            (7.2.2016, Prof. Re'em Sari and Prof. Nir Shaviv)
#   2016-moed-b  .../77101-moed-beit-2016.pdf        (12.4.2016, same lecturers)
#   2014-moed-a  .../77101-MoedA-regular-2014.pdf    (תשע"ד, Dr. Guy Ron and Prof. Nir Shaviv; the regular, not Talpiot)
#   2014-moed-b  .../2014-77101-MoedB-Reg.pdf        (תשע"ד, same lecturers)
# Each has a published solution on the same page (not needed for mapping).
#
# Format (all four): 3 hours; no aids except the student's own 2 formula sheets (4 A4 pages), a calculator, an
# integral table or mathematical handbook, a dictionary; every answer must be justified. 2016: answer 4 of 5
# questions (equal weight, 25 points each). 2014: part A 2 of 3 questions at 35 points, part B 2 of 3 at 15 points.
# No formula or constants sheet is supplied: the numbers a question needs are given in it.
#
# Questions are paraphrased in one line, never copied (the exams are the university's). `objectives: []` is a gap.
# The two gaps of the first mapping (velocity at an angle, aberration) were closed by OBJ-9.4-3 (2026-11-18).
# skills: derive | compute | show-that | explain | graph | diagram | estimate


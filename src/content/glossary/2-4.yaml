# Terms first defined in lesson 2.4. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: static-friction
  term: חיכוך סטטי
  en: static friction
  symbol: f_s
  unit: N
  definition: כוח החיכוך בין שני משטחים שלא מחליקים זה על זה. הוא מקבל את הגודל ואת הכיוון שדרושים כדי למנוע החלקה, עד לערך מרבי, fₛ ≤ μₛN. כשהערך המרבי לא מספיק, מתחילה החלקה.
  reject: [חיכוך סטאטי]
  lesson: '2.4'

- id: kinetic-friction
  term: חיכוך קינטי
  en: kinetic friction
  symbol: f_k
  unit: N
  definition: כוח החיכוך בין שני משטחים שמחליקים זה על זה. גודלו fₖ = μₖN, בערך בלי תלות במהירות, וכיוונו הפוך למהירות היחסית של המשטח ביחס למשטח השני.
  reject: [חיכוך דינמי]
  lesson: '2.4'

- id: friction-coefficient
  term: מקדם חיכוך
  en: coefficient of friction
  symbol: μ
  definition: מספר חסר ממדים שתלוי בשני המשטחים ומקשר בין החיכוך לכוח הנורמלי. μₛ קובע את הערך המרבי של החיכוך הסטטי, ו-μₖ את החיכוך הקינטי. בדרך כלל μₖ < μₛ.
  lesson: '2.4'

- id: c2-threshold-angle
  term: זווית סף
  en: angle of repose (threshold angle)
  symbol: θ_s
  definition: זווית השיפוע הגדולה ביותר שבה גוף יכול לנוח על מדרון בלי להחליק. בה החיכוך הסטטי מגיע לערך המרבי שלו, ולכן tan θ = μₛ, בלי תלות במסה.
  lesson: '2.4'

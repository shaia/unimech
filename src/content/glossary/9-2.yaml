# Terms first defined in lesson 9.2. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: lorentz-factor
  term: גורם לורנץ
  en: Lorentz factor
  symbol: γ
  definition: הגודל γ = 1/√(1 − v²/c²), שתמיד גדול מ-1 או שווה לו. הוא קרוב ל-1 במהירויות יומיומיות, וגדל בלי גבול כש-v מתקרבת ל-c. למשל, ב-v = 0.6c הוא 1.25, וב-v = 0.8c הוא 5/3.
  lesson: '9.2'

- id: proper-time
  term: זמן עצמי
  en: proper time
  symbol: τ
  unit: s
  definition: הזמן בין שני מאורעות שמודד שעון אחד שנמצא בשניהם, כלומר הזמן במערכת שבה שני המאורעות קורים באותו מקום. זה הזמן הקצר ביותר שמערכת אינרציאלית כלשהי מודדת בין שני המאורעות.
  lesson: '9.2'

- id: time-dilation
  term: התארכות זמן
  en: time dilation
  definition: במערכת שבה שעון נע במהירות v, הזמן בין שני תקתוקים שלו ארוך פי γ מהזמן העצמי שהשעון עצמו מודד, Δt = γΔτ. ההשפעה סימטרית, כל צופה מוצא שהשעונים שנעים ביחס אליו מפגרים.
  reject: [התרחבות זמן]
  lesson: '9.2'

- id: proper-length
  term: אורך עצמי
  en: proper length
  symbol: L₀
  unit: m
  definition: האורך של גוף במערכת שבה הוא נח. זה האורך הגדול ביותר שמודדים לו במערכת אינרציאלית כלשהי.
  lesson: '9.2'

- id: length-contraction
  term: התקצרות אורך
  en: length contraction
  definition: במערכת שבה גוף נע במהירות v, האורך שלו לאורך כיוון התנועה, כשמודדים את שני הקצוות באותו רגע, קצר פי γ מהאורך העצמי, L = L₀/γ. המידות הניצבות לתנועה לא משתנות.
  reject: [התכווצות אורך, התכווצות לורנץ]
  lesson: '9.2'

- id: c9-light-clock
  term: שעון אור
  en: light clock
  definition: שעון דמיוני שעשוי משתי מראות מקבילות, ופולס אור שקופץ ביניהן. כל הלוך-חזור של האור הוא תקתוק אחד. במערכת שבה השעון נח, כשהמראות במרחק L₀ זו מזו, תקתוק נמשך 2L₀/c. מכיוון שמהירות האור זהה בכל מערכת, זה השעון הפשוט ביותר להשוואה בין מערכות.
  lesson: '9.2'

- id: c9-muon
  term: מיואון
  en: muon
  definition: חלקיק יסודי לא יציב, דומה לאלקטרון אבל כבד ממנו בערך פי 200. מיואונים נוצרים בגובה רב באטמוספרה כשקרינה קוסמית פוגעת באוויר, ודועכים לחלקיקים אחרים.
  lesson: '9.2'

- id: c9-mean-lifetime
  term: זמן חיים ממוצע
  en: mean lifetime
  symbol: '\tau_\mu'
  unit: s
  definition: הזמן הממוצע שחלקיק לא יציב קיים לפני שהוא דועך, נמדד במערכת שבה החלקיק נח. מתוך הרבה חלקיקים כאלה, החלק שנשאר אחרי זמן עצמי Δτ הוא e^(−Δτ/τ_μ). למיואון τ_μ = 2.2 μs; לחלקיקים אחרים מסמנים לפי שם החלקיק (τ_π לפיון, τ_n לנייטרון). הסימן τ לבדו שמור לזמן עצמי.
  lesson: '9.2'

# Terms first defined in lesson 4.4. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: ballistic-pendulum
  term: מטוטלת בליסטית
  en: ballistic pendulum
  definition: גוש שתלוי על חוטים, שקליע נתקע בו. מגובה העלייה של הגוש מוצאים את מהירות הקליע בשני שלבים, שימור תנע בהתנגשות הפלסטית ושימור אנרגיה בעלייה שאחריה, v = ((m + M)/m)·√(2gh).
  lesson: '4.4'

- id: impulsive-force
  term: כוח מתקפי
  en: impulsive force
  definition: כוח שגדל מאוד לזמן קצר מאוד, כמו הכוח בין שני גופים מתנגשים, או כוח של קיר, רצפה או ציר שעוצרים גוף ברגע. המתקף שלו נשאר סופי גם כשמשך הפעולה שואף לאפס. כוח סופי, כמו כובד או חיכוך, אינו מתקפי, והמתקף שלו בזמן התנגשות קצרה זניח.
  lesson: '4.4'

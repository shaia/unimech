# Terms first defined in lesson 8.4. One spelling per concept, course-wide.

- id: rolling-without-slipping
  term: גלגול בלי החלקה
  en: rolling without slipping
  definition: תנועה של גוף עגול על משטח, שבה נקודת המגע של הגוף נמצאת בכל רגע במנוחה ביחס למשטח. התנאי הוא v_cm = ωR, ובעקבותיו a_cm = αR.
  lesson: '8.4'

- id: c8-slip-speed
  term: מהירות ההחלקה
  en: slip velocity
  symbol: 'u = v - \omega R'
  unit: m/s
  definition: המהירות של נקודת המגע של גוף עגול ביחס למשטח שעליו הוא נע, u = v − ωR, כש-ω נמדדת בכיוון הגלגול. בגלגול בלי החלקה u = 0. כש-u ≠ 0 נקודת המגע מחליקה, ופועל עליה חיכוך קינטי נגד כיוון ההחלקה.
  lesson: '8.4'

- id: c8-rolling-with-slipping
  term: גלגול עם החלקה
  en: rolling with slipping
  definition: תנועה של גוף עגול שמסתובב ונע על משטח, כשנקודת המגע שלו מחליקה ביחס למשטח (v ≠ ωR). החיכוך קינטי, μₖN נגד ההחלקה, והוא הופך חלק מהאנרגיה הקינטית לחום.
  lesson: '8.4'

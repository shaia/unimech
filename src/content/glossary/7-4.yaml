# Terms first defined in lesson 7.4. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it). `c7-` ids are terms the course's
# term table lacks.

- id: c7-latitude
  term: קו רוחב
  en: latitude
  symbol: λ
  definition: הזווית בין הקו ממרכז כדור הארץ אל נקודה על פניו לבין מישור קו המשווה. בקו המשווה היא 0, ובקוטב הצפוני 90 מעלות. ירושלים נמצאת בקו רוחב של כ-31.8 מעלות צפון. בחצי הכדור הדרומי נכתוב את קו הרוחב כמספר שלילי, עד מינוס 90 מעלות בקוטב הדרומי.
  lesson: '7.4'

- id: c7-plumb-line
  term: אנך
  en: plumb line
  definition: הכיוון שחוט עם משקולת תלויה מראה כשהיא במנוחה. הוא כיוון תאוצת הנפילה האפקטיבית, ועל כדור הארץ המסתובב הוא נוטה מעט מהקו אל המרכז, לכיוון קו המשווה.
  lesson: '7.4'

- id: c7-sidereal-day
  term: יום כוכבי
  en: sidereal day
  unit: h
  definition: הזמן שבו כדור הארץ משלים סיבוב אחד ביחס לכוכבים הרחוקים, 2π/ω, כ-23.9 שעות. הוא קצר במעט מהיממה של 24 שעות, הזמן שבו השמש חוזרת לאותו מקום בשמיים, כי במשך יממה כדור הארץ גם מתקדם במסלולו סביב השמש.
  lesson: '7.4'

- id: foucault-pendulum
  term: מטוטלת פוקו
  en: Foucault pendulum
  definition: מטוטלת ארוכה וכבדה שמתנודדת זמן רב, ומישור התנודה שלה מסתובב לאט ביחס לקרקע בקצב ω sin λ. במערכת הייחוס של כדור הארץ הסיבוב הזה נובע מכוח קוריוליס. בחצי הכדור הצפוני הסיבוב הוא עם כיוון השעון, במבט מלמעלה.
  lesson: '7.4'

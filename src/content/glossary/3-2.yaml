# Terms first defined in lesson 3.2. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: conservative-force
  term: כוח משמר
  en: conservative force
  definition: כוח שהעבודה שלו בין שתי נקודות לא תלויה במסלול, ובאופן שקול, שהעבודה שלו בכל מסלול סגור אפס. לכוח כזה יש אנרגיה פוטנציאלית, F = −∇U. כובד, כוח קפיץ וכוח חשמלי משמרים; חיכוך וגרר לא.
  reject: [כוח קונסרבטיבי]
  lesson: '3.2'

- id: potential-energy
  term: אנרגיה פוטנציאלית
  en: potential energy
  symbol: U
  unit: J
  definition: פונקציה של המקום, שמוגדרת רק לכוח משמר, עד כדי קבוע. ההפרש שלה בין שתי נקודות הוא מינוס העבודה של הכוח בדרך ביניהן, ΔU = −W, ובכל נקודה F = −∇U.
  reject: [אנרגית מצב, אנרגיית מצב]
  lesson: '3.2'

- id: curl
  term: רוטור
  en: curl
  symbol: ∇×F
  definition: מידה של הסיבוב של שדה וקטורי סביב נקודה. במישור, (∇×F)_z = ∂F_y/∂x − ∂F_x/∂y. כוח שהרוטור שלו אפס בכל תחום בלי חורים הוא משמר.
  reject: [סלסול]
  lesson: '3.2'

- id: c3-force-field
  term: שדה כוח
  en: force field
  symbol: F(r)
  definition: כוח שתלוי רק במקום של הגוף, ולכן יש לו ערך F(r) בכל נקודה, בלי תלות במהירות או בזמן. כובד, כוח קפיץ וכוח חשמלי של מטען נייח הם שדות כוח. חיכוך קינטי וגרר אינם שדות כוח, כי הכיוון שלהם נקבע לפי המהירות.
  lesson: '3.2'

- id: c3-level-curve
  term: קו גובה
  en: level curve (equipotential)
  definition: קו במישור שלאורכו האנרגיה הפוטנציאלית U קבועה. מפת קווי גובה במרווחים שווים של U מראה את הכוח המשמר כמו מפה טופוגרפית מראה את השיפוע. הכוח ניצב לקווי הגובה, פונה לעבר U נמוכה יותר, וגדול במקום שבו הקווים צפופים.
  lesson: '3.2'

- id: c3-partial-derivative
  term: נגזרת חלקית
  en: partial derivative
  symbol: \partial f/\partial x
  definition: 'הנגזרת של פונקציה של כמה משתנים לפי אחד מהם, כשכל השאר מוחזקים קבועים. למשל, לפונקציה x²y, ∂(x²y)/∂x = 2xy (y מתנהג כמו מספר) ו-∂(x²y)/∂y = x². הסימן ∂ מבדיל אותה מהנגזרת הרגילה d.'
  lesson: '3.2'

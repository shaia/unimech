# Terms first defined in lesson 5.2. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: harmonic-approximation
  term: קירוב הרמוני
  en: harmonic approximation
  definition: החלפת פוטנציאל כללי U(x) ליד מינימום x₀ בפרבולה, U(x) ≈ U(x₀) + ½U″(x₀)(x − x₀)², האיבר הראשון שלא מתאפס בפיתוח טיילור. הוא נותן תנודות הרמוניות עם ω₀² = U″(x₀)/m, ותקף כשההעתק קטן מספיק כדי שהאיבר הבא בפיתוח זניח.
  lesson: '5.2'

- id: c5-energy-method
  term: שיטת האנרגיה
  en: energy method
  definition: דרך למצוא את התדירות של מערכת בעלת דרגת חופש אחת q, בלי כוחות. כותבים את האנרגיה המכנית בצורה E = ½m_eff q̇² + ½k_eff q² (בקירוב, ליד שיווי משקל יציב), ואז ω₀² = k_eff/m_eff. גזירת E לפי הזמן, dE/dt = 0, נותנת את משוואת המתנד.
  lesson: '5.2'

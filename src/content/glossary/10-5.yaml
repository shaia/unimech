- id: c10-hyperbolic-motion
  term: תנועה היפרבולית
  en: hyperbolic motion
  definition: התנועה של גוף שמתחיל ממנוחה תחת כוח קבוע בכיוון קבוע, לפי F = dp/dt. התנע גדל קווית, p = Ft, המהירות v = (Ft/m)/√(1 + (Ft/(mc))²) שואפת ל-c, והמקום x = (mc²/F)(√(1 + (Ft/(mc))²) − 1). קו העולם שלה בדיאגרמת מינקובסקי הוא היפרבולה, ומכאן השם.
  lesson: '10.5'

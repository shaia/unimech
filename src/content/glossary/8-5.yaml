# Terms first defined in lesson 8.5. Chapter 8 terms outside the course's term table are prefixed c8-.

- id: c8-couple
  term: זוג כוחות
  en: couple
  definition: שני כוחות שווים בגודלם ומנוגדים בכיוונם, שקווי הפעולה שלהם מקבילים ולא מתלכדים. השקול שלהם אפס, והמומנט שלהם Fd זהה סביב כל נקודה, כאשר d הוא המרחק בין קווי הפעולה.
  lesson: '8.5'

- id: c8-static-equilibrium
  term: שיווי משקל סטטי
  en: static equilibrium
  definition: גוף צפיד במנוחה, שנשאר במנוחה. התנאים הם שני תנאים וקטוריים, הכוח החיצוני השקול אפס והמומנט החיצוני השקול אפס. כשהשקול אפס, המומנט השקול זהה סביב כל נקודה, ולכן מספיק לדרוש אותו סביב נקודה אחת שבוחרים.
  lesson: '8.5'

- id: c8-fulcrum
  term: נקודת משען
  en: fulcrum
  definition: הנקודה שעליה נשען מנוף ושסביבה הוא יכול להסתובב. סביבה הכוח שהיא מפעילה לא יוצר מומנט, ולכן במנוף בשיווי משקל F₁d₁ = F₂d₂, כאשר d₁ ו-d₂ הזרועות של שני הכוחות סביבה.
  lesson: '8.5'

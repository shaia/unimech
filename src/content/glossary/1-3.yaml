# Terms first defined in lesson 1.3. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: angular-velocity
  term: מהירות זוויתית
  en: angular velocity
  symbol: ω
  unit: rad/s
  definition: קצב השינוי של הזווית, ω = dθ/dt, ברדיאנים לשנייה. בתנועה מעגלית ברדיוס r גודל המהירות הוא v = ωr, ובסיבוב אחיד ω = 2πf, כאשר f מספר הסיבובים בשנייה.
  reject: [מהירות זויתית]
  lesson: '1.3'

- id: centripetal-acceleration
  term: תאוצה צנטריפטלית
  en: centripetal acceleration
  symbol: a_c
  unit: m/s²
  definition: רכיב התאוצה שניצב למהירות ופונה אל מרכז העקמומיות של המסלול. גודלו v²/ρ, ובתנועה מעגלית ω²r. הוא משנה את הכיוון של המהירות, לא את גודלה.
  reject: [תאוצה מרכזית]
  lesson: '1.3'

- id: tangential-acceleration
  term: תאוצה משיקית
  en: tangential acceleration
  symbol: a_t
  unit: m/s²
  definition: רכיב התאוצה לאורך המהירות, a_t = d|v|/dt. הוא משנה את גודל המהירות, לא את הכיוון שלה. בתנועה מעגלית בתאוצה זוויתית α, a_t = αr.
  lesson: '1.3'

- id: radius-of-curvature
  term: רדיוס עקמומיות
  en: radius of curvature
  symbol: ρ
  unit: m
  definition: הרדיוס של המעגל שמתאים למסלול הכי טוב בנקודה נתונה. מחשבים אותו מהרכיב הניצב של התאוצה, ρ = v²/a⊥ = |v|³/|v × a|. במעגל הוא הרדיוס של המעגל, ובקו ישר הוא אינסופי.
  lesson: '1.3'

- id: c1-osculating-circle
  term: מעגל העקמומיות
  en: osculating circle
  definition: המעגל שמשיק למסלול בנקודה נתונה ומתאים לו שם הכי טוב, עד סדר שני (נקרא גם המעגל המנשק). הרדיוס שלו הוא רדיוס העקמומיות ρ, והמרכז שלו, מרכז העקמומיות, נמצא בכיוון שאליו המסלול מתעקם, במרחק ρ מהנקודה. גוף שנע על המסלול נע ברגע הזה כאילו הוא על המעגל הזה.
  lesson: '1.3'

- id: angular-acceleration
  term: תאוצה זוויתית
  en: angular acceleration
  symbol: α
  unit: rad/s²
  definition: קצב השינוי של המהירות הזוויתית, α = dω/dt. בסיבוב סביב ציר קבוע, התאוצה המשיקית של נקודה במרחק r מהציר היא αr.
  lesson: '1.3'

- id: period
  term: זמן מחזור
  en: period
  symbol: T
  unit: s
  definition: הזמן שבו תנועה מחזורית חוזרת על עצמה, למשל הקפה אחת במעגל, T = 2π/ω. במתנד הרמוני (פרק 5) הוא לא תלוי באמפליטודה.
  lesson: '1.3'

- id: c1-frequency
  term: תדירות
  en: frequency
  symbol: f
  unit: 1/s (Hz)
  definition: מספר המחזורים (למשל סיבובים) ביחידת זמן, f = 1/T. בתנועה מעגלית אחידה ω = 2πf, כי בכל סיבוב הזווית גדלה ב-2π רדיאנים. לא להחליף בין f לבין ω.
  lesson: '1.3'

- id: c1-uniform-circular-motion
  term: תנועה מעגלית אחידה
  en: uniform circular motion
  definition: תנועה על מעגל במהירות זוויתית קבועה, ולכן בגודל מהירות קבוע. התאוצה בה פונה אל מרכז המעגל וגודלה v²/R = ω²R; אין לה רכיב משיקי.
  lesson: '1.3'

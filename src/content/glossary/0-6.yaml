# Terms first defined in lesson 0.6. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: complex-number
  term: מספר מרוכב
  en: complex number
  symbol: z = x + iy
  definition: מספר מהצורה x + iy, כאשר i² = −1, x החלק הממשי ו-y החלק המדומה. הוא נקודה במישור, ואפשר לכתוב אותו גם בהצגה קוטבית, z = |z|e^(iφ), עם הגודל |z| והזווית φ.
  lesson: '0.6'

- id: euler-formula
  term: נוסחת אוילר
  en: Euler's formula
  definition: הזהות e^(iθ) = cos θ + i sin θ. היא מציבה את e^(iθ) על מעגל היחידה בזווית θ, ולכן כפל ב-e^(iθ) הוא סיבוב, ותנודה A cos(ωt + φ) היא החלק הממשי של Ae^(i(ωt+φ)).
  reject: [נוסחת אויילר]
  lesson: '0.6'

- id: c0-complex-plane
  term: המישור המרוכב
  en: complex plane
  definition: המישור שבו מציירים מספר מרוכב z = x + iy כנקודה (x, y), או כחץ מהראשית אליה. הציר האופקי הוא הציר הממשי והאנכי הוא הציר המדומה. הגודל |z| הוא אורך החץ, והארגומנט הוא הזווית שלו מהציר הממשי החיובי, נגד כיוון השעון.
  lesson: '0.6'

- id: c0-complex-conjugate
  term: צמוד מרוכב
  en: complex conjugate
  symbol: \bar z
  definition: הצמוד של z = x + iy הוא z̄ = x − iy, השיקוף של z בציר הממשי. יש לו אותו גודל וארגומנט הפוך, והמכפלה z z̄ = |z|² ממשית. בעזרתו מחלקים, 1/z = z̄/|z|², ומוציאים חלק ממשי, Re z = (z + z̄)/2.
  lesson: '0.6'

# Terms first defined in lesson 5.1. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: harmonic-oscillator
  term: מתנד הרמוני
  en: harmonic oscillator
  definition: מערכת שהכוח המחזיר בה פרופורציוני להעתק מנקודת שיווי המשקל ובכיוון הפוך לו, F = −kx. משוואת התנועה שלה היא mẍ = −kx, והפתרון תנודה בקוסינוס עם תדירות שלא תלויה באמפליטודה.
  lesson: '5.1'

- id: amplitude
  term: אמפליטודה
  en: amplitude
  symbol: A
  definition: ההעתק המרבי מנקודת שיווי המשקל בתנודה, A ב-x = A cos(ω₀t + φ). היא נקבעת מתנאי ההתחלה, A = √(x₀² + (v₀/ω₀)²).
  reject: [משרעת]
  lesson: '5.1'

- id: phase
  term: פאזה
  en: phase
  symbol: \varphi
  unit: rad
  definition: הזווית φ ב-x = A cos(ω₀t + φ), שקובעת באיזה שלב של המחזור התנודה נמצאת ברגע t = 0. היא נקבעת מתנאי ההתחלה, x₀ = A cos φ ו-v₀ = −Aω₀ sin φ.
  lesson: '5.1'

- id: angular-frequency
  term: תדירות זוויתית
  en: angular frequency
  symbol: \omega
  unit: rad/s
  definition: קצב הגידול של הארגומנט של הקוסינוס בתנודה, ω = 2π/T. במתנד של מסה וקפיץ, בלי ריסון ובלי כוח מאלץ, מסמנים אותה ω₀ = √(k/m). התדירות f = ω/(2π) היא מספר המחזורים בשנייה.
  reject: [תדירות מעגלית]
  lesson: '5.1'

- id: c5-equivalent-spring-constant
  term: קבוע קפיץ שקול
  en: equivalent spring constant
  symbol: k_{\text{eq}}
  unit: N/m
  definition: קבוע הקפיץ של קפיץ יחיד שפועל על הגוף כמו מערכת הקפיצים כולה. במקביל הקבועים מתחברים, k = k₁ + k₂; בטור ההופכיים מתחברים, 1/k = 1/k₁ + 1/k₂.
  lesson: '5.1'

- id: c5-reference-circle
  term: מעגל ייחוס
  en: reference circle
  definition: מעגל ברדיוס A שעליו נקודה P מסתובבת נגד כיוון השעון בתדירות זוויתית ω₀, בזווית ω₀t + φ מהציר x. ההיטל של P על הציר x הוא x(t) = A cos(ω₀t + φ), והקואורדינטה השנייה שלה היא −v/ω₀. הזווית שלה ברגע t = 0 היא הפאזה.
  lesson: '5.1'

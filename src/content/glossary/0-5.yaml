# Terms first defined in lesson 0.5. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: ode
  term: משוואה דיפרנציאלית
  en: ordinary differential equation
  definition: משוואה שקושרת פונקציה של משתנה אחד, כמו x(t), לנגזרות שלה. הסדר שלה הוא הסדר של הנגזרת הגבוהה ביותר, והיא ליניארית כשהנעלם והנגזרות שלו מופיעים רק בחזקה ראשונה.
  lesson: '0.5'

- id: initial-conditions
  term: תנאי התחלה
  en: initial conditions
  definition: הערכים של הנעלם ושל הנגזרות שלו ברגע ההתחלה, כמו x(0) ו-v(0). משוואה מסדר n צריכה n תנאי התחלה כדי לקבוע את הפתרון.
  lesson: '0.5'

- id: separation-of-variables
  term: הפרדת משתנים
  en: separation of variables
  definition: שיטה לפתרון משוואה מסדר ראשון מהצורה dy/dt = f(y)g(t). מעבירים את כל מה שתלוי ב-y לאגף אחד עם dy ואת כל מה שתלוי ב-t לאגף השני עם dt, ומאנטגרלים את שני האגפים.
  lesson: '0.5'

- id: characteristic-equation
  term: משוואה אופיינית
  en: characteristic equation
  definition: המשוואה האלגברית שמתקבלת מהצבת הניחוש x = e^(st) במשוואה ליניארית עם מקדמים קבועים; ל-ẍ + γẋ + ω₀²x = 0 היא s² + γs + ω₀² = 0 (ול-mẍ + bẋ + kx = 0 היא ms² + bs + k = 0, אותה משוואה כפול m). שורשים ממשיים נותנים דעיכה בלי תנודה, שורשים מרוכבים נותנים תנודה, ושורש כפול s נותן גם את הפתרון te^(st).
  lesson: '0.5'

- id: direction-field
  term: שדה כיוונים
  en: direction field (slope field)
  definition: ציור של משוואה מסדר ראשון ẏ = f(t, y) במישור (t, y). בכל נקודה מצויר קטע קצר שהשיפוע שלו f(t, y), השיפוע שהמשוואה דורשת מפתרון שעובר שם. עקומת פתרון משיקה בכל נקודה לקטע שבה, ותנאי ההתחלה בוחר עקומה אחת.
  lesson: '0.5'

- id: general-solution
  term: פתרון כללי
  en: general solution
  definition: כל הפתרונות של משוואה דיפרנציאלית בביטוי אחד, עם קבועים חופשיים, למשל x = C₁e^(s₁t) + C₂e^(s₂t). למשוואה מסדר n יש n קבועים, ותנאי ההתחלה קובעים אותם.
  lesson: '0.5'

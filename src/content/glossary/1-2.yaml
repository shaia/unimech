- id: projectile
  term: זריקה
  en: projectile motion
  definition: התנועה של גוף שנזרק ומכאן ואילך נע רק בהשפעת הכובד, בלי התנגדות אוויר. התאוצה שלו קבועה, g כלפי מטה, ולכן r(t) = r₀ + v₀t + ½gt², והמסלול פרבולה במישור שבו נמצאים v₀ ו-g.

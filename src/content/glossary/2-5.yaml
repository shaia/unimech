# Terms first defined in lesson 2.5. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: constraint
  term: אילוץ
  en: constraint
  definition: תנאי גיאומטרי שמגביל את התנועה של גוף או קושר בין התנועות של כמה גופים, למשל חוט שאורכו קבוע או משטח שהגוף לא חודר אליו. האילוץ נכתב כמשוואה בין המקומות, ובגזירה פעמיים בין התאוצות. הכוחות שמקיימים אותו, כוח נורמלי ומתיחות, הם נעלמים שמוצאים מהחוק השני.
  lesson: '2.5'

- id: c2-atwood-machine
  term: מכונת אטווד
  en: Atwood machine
  definition: שני גופים תלויים בשני הקצוות של חוט אחד שעובר מעל גלגלת קבועה. כשהחוט והגלגלת חסרי מסה וחסרי חיכוך, המתיחות זהה בשני הצדדים, והגופים מאיצים באותו גודל ובכיוונים הפוכים, a = (m₂ − m₁)g/(m₁ + m₂).
  lesson: '2.5'

- id: c2-movable-pulley
  term: גלגלת נעה
  en: movable pulley
  definition: גלגלת שאינה מחוברת לנקודה קבועה, אלא תלויה על קטעים של חוט ונעה יחד עם המשא שתלוי עליה. כשהיא תלויה על n קטעים של אותו חוט, משוואת האילוץ קושרת את התזוזה שלה לתזוזת הקצה החופשי ביחס 1 ל-n, והחוט מחזיק אותה בכוח nT.
  lesson: '2.5'

# Terms first defined in lesson 4.3. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: scattering-angle
  term: זווית פיזור
  en: scattering angle
  symbol: θ
  definition: הזווית בין כיוון התנועה של הגוף הפוגע אחרי ההתנגשות לכיוון התנועה שלו לפניה. כשהפוגע כבד מהמטרה, שעומדת, והתנגשות אלסטית, זווית הפיזור שלו לא עולה על θmax, עם sin θmax = m₂/m₁.
  lesson: '4.3'

- id: impact-parameter
  term: פרמטר פגיעה
  en: impact parameter
  symbol: b
  unit: m
  definition: המרחק בין הקו שעליו נע מרכז הגוף הפוגע לפני ההתנגשות לבין מרכז המטרה. כש-b = 0 הפגיעה חזיתית; בשתי דיסקיות שסכום הרדיוסים שלהן D, הן נוגעות זו בזו רק כש-|b| קטן מ-D.
  lesson: '4.3'

- id: line-of-centres
  term: קו המרכזים
  en: line of centres
  definition: הקו שעובר דרך המרכזים של שני גופים עגולים ברגע שהם נוגעים זה בזה. כשהגופים חלקים, הכוח שכל אחד מהם מפעיל על השני ברגע המגע פועל לאורך הקו הזה, ולכן גם המתקף.
  lesson: '4.3'

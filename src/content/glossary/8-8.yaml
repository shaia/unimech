# Terms first defined in lesson 8.8. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: c8-matrix
  term: מטריצה
  en: matrix
  definition: טבלה של מספרים בשורות ובעמודות. מטריצה 3×3 פועלת על וקטור ונותנת וקטור חדש, שכל רכיב שלו הוא שורה אחת של המטריצה כפול רכיבי הווקטור, רכיב ברכיב, בסכום.
  lesson: '8.8'

- id: inertia-tensor
  term: טנזור ההתמד
  en: inertia tensor
  symbol: I
  unit: kg·m²
  definition: מטריצה 3×3 שמקשרת את התנע הזוויתי של גוף צפיד, ביחס לנקודה קבועה, למהירות הזוויתית שלו, L = Iω. על האלכסון מומנטי ההתמד סביב הצירים, ומחוץ לו מכפלות ההתמד, כמו I_xy = −∑mxy.
  lesson: '8.8'

- id: c8-product-of-inertia
  term: מכפלת התמד
  en: product of inertia
  definition: איבר של טנזור ההתמד מחוץ לאלכסון, למשל I_xz = −∑mxz. כשהיא שונה מאפס, סיבוב סביב ציר z נותן לתנע הזוויתי רכיב x. בגוף שיש לו מישור סימטריה, מכפלות ההתמד שמערבות את הציר הניצב למישור מתאפסות.
  lesson: '8.8'

- id: eigenvector
  term: וקטור עצמי
  en: eigenvector
  definition: וקטור שמטריצה רק מותחת או מכווצת, בלי לשנות את הכיוון שלו, Iv = λv. כל כפולה שלו היא וקטור עצמי גם כן, ולכן מה שחשוב הוא הכיוון.
  lesson: '8.8'

- id: eigenvalue
  term: ערך עצמי
  en: eigenvalue
  symbol: λ
  definition: המספר λ שבו מטריצה כופלת את הווקטור העצמי שלה, Iv = λv. הערכים העצמיים של טנזור ההתמד הם מומנטי ההתמד הראשיים.
  lesson: '8.8'

- id: principal-axes
  term: צירים ראשיים
  en: principal axes
  definition: שלושה צירים ניצבים זה לזה, בנקודה נתונה בגוף, בכיווני הווקטורים העצמיים של טנזור ההתמד. בבסיס שלהם הטנזור אלכסוני. בסיבוב סביב ציר ראשי התנע הזוויתי מקביל למהירות הזוויתית, L = Iω עם I מספר. ציר סימטריה הוא תמיד ציר ראשי.
  lesson: '8.8'

- id: c8-principal-moments
  term: מומנטי ההתמד הראשיים
  en: principal moments of inertia
  symbol: I_1, I_2, I_3
  unit: kg·m²
  definition: מומנטי ההתמד סביב שלושת הצירים הראשיים, הערכים העצמיים של טנזור ההתמד. בבסיס של הצירים הראשיים L = (I₁ω₁, I₂ω₂, I₃ω₃).
  lesson: '8.8'

- id: c8-spin
  term: סיבוב עצמי
  en: spin
  symbol: \omega_3
  unit: rad/s
  definition: הסיבוב של גוף סביב ציר הסימטריה שלו, כמו הסיבוב של הרוטור של ג׳ירוסקופ על הסרן שלו. ω₃ הוא הרכיב של המהירות הזוויתית לאורך הציר.
  lesson: '8.8'

- id: precession
  term: נקיפה
  en: precession
  symbol: \Omega
  unit: rad/s
  definition: סיבוב איטי של ציר הסיבוב של גוף שמסתובב מהר, כשמומנט חיצוני ניצב לתנע הזוויתי משנה את כיוונו. בסביבון מהיר קצב הנקיפה Ω = Mgd/(I₃ω₃), כאשר d המרחק מנקודת התמיכה למרכז המסה.
  reject: [פרצסיה]
  lesson: '8.8'

- id: c8-nutation
  term: נוטציה
  en: nutation
  definition: תנודה מהירה וקטנה של ציר של סביבון, למעלה ולמטה, שמתווספת לנקיפה. מופיעה כשמשחררים סביבון בלי שהציר שלו כבר נוקף. בסביבון מהיר התדירות שלה בערך I₃ω₃/I₁, והיא קטנה כמו 1/ω₃².
  lesson: '8.8'

- id: gyroscope
  term: ג׳ירוסקופ
  en: gyroscope
  definition: גוף בעל סימטריה סיבובית שמסתובב מהר סביב ציר הסימטריה שלו, כך שהתנע הזוויתי שלו גדול. מומנט חיצוני משנה את כיוון הציר רק לאט, בנקיפה, ולכן הוא משמש לשמירה על כיוון.
  lesson: '8.8'

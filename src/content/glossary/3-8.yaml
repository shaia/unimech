- id: c3-koenig-theorem
  term: משפט קניג
  en: König's theorem
  definition: האנרגיה הקינטית של מערכת היא האנרגיה של מרכז המסה, ½MV², ועוד האנרגיה הקינטית של החלקים ביחס למרכז המסה. באותו אופן התנע הזוויתי ביחס לנקודה הוא R × MV ועוד התנע הזוויתי ביחס למרכז המסה, שלא תלוי בנקודה.
  lesson: '3.8'

# Terms first defined in lesson 3.8. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: c3-koenig-theorem
  term: משפט קניג
  en: König's theorem
  definition: האנרגיה הקינטית של מערכת היא האנרגיה של מרכז המסה, ½MV², ועוד האנרגיה הקינטית של החלקים ביחס למרכז המסה. באותו אופן התנע הזוויתי ביחס לנקודה הוא R × MV ועוד התנע הזוויתי ביחס למרכז המסה, שלא תלוי בנקודה.
  lesson: '3.8'

- id: c3-strong-third-law
  term: הצורה החזקה של החוק השלישי
  en: strong form of Newton's third law
  definition: שני הכוחות שחלקיקים מפעילים זה על זה שווים בגודלם, הפוכים בכיוונם, ופועלים לאורך הקו שמחבר את החלקיקים. הצורה החלשה דורשת רק שווים והפוכים, ומספיקה לשימור התנע; הצורה החזקה נדרשת כדי שהכוחות הפנימיים לא ישנו את התנע הזוויתי.
  lesson: '3.8'

- id: c3-relative-angular-momentum
  term: התנע הזוויתי ביחס למרכז המסה
  en: angular momentum about the center of mass (spin angular momentum)
  symbol: L_rel
  unit: kg·m²/s
  definition: L_rel = Σ rᵢ′ × mᵢvᵢ′, כאשר rᵢ′ ו-vᵢ′ הם המקום והמהירות של כל חלק ביחס למרכז המסה. הוא לא תלוי בנקודה O שנבחרה, וקצב השינוי שלו הוא המומנט החיצוני ביחס למרכז המסה, גם כשמרכז המסה מאיץ.
  lesson: '3.8'

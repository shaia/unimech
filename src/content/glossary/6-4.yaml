# Terms first defined in lesson 6.4. One spelling per concept, course-wide. The orbit equation and the
# conic's parameter p are not in the course term table; their ids carry the chapter prefix c6-.
# Notation (review 2026-11-11): definitions are written per unit mass, as in lesson 6.3 and the figure readouts:
# ε the energy per unit mass, h the angular momentum per unit mass, GM = G(m₁ + m₂). For two bodies ε = E/μ,
# h = L/μ, GM = k/μ (lesson 6.4 derives in E, L, μ, k and gives this dictionary at its start).

- id: c6-orbit-equation
  term: משוואת המסלול
  en: orbit equation (Binet equation)
  definition: משוואה דיפרנציאלית לצורת המסלול בכוח מרכזי, כשהמשתנה הוא u = 1/r והזווית θ מחליפה את הזמן. בכוח שהולך כאחד חלקי ריבוע המרחק היא d²u/dθ² + u = GM/h², כאשר h התנע הזוויתי ליחידת מסה (בגדלים של שני גופים, μk/L²), ופתרונה הוא חתך חרוט.
  lesson: '6.4'

- id: conic-section
  term: חתך חרוט
  en: conic section
  definition: עקומה שמתקבלת מחיתוך של חרוט במישור, כלומר מעגל, אליפסה, פרבולה או היפרבולה. בקואורדינטות קוטביות שהראשית שלהן במוקד, r = p/(1 + e cos θ), והאקסצנטריות e קובעת איזה חתך זה.
  lesson: '6.4'

- id: c6-semi-latus-rectum
  term: פרמטר המסלול
  en: semi-latus rectum
  symbol: p
  unit: m
  definition: הקבוע p במשוואת חתך החרוט r = p/(1 + e cos θ), המרחק מהמוקד למסלול בכיוון הניצב לציר הראשי. בכבידה p = h²/GM (בגדלים של שני גופים, L²/(μk)), הרדיוס של המסלול המעגלי בעל אותו תנע זוויתי.
  lesson: '6.4'

- id: eccentricity
  term: אקסצנטריות
  en: eccentricity
  symbol: e
  definition: מספר חסר ממדים שקובע את צורת חתך החרוט, e = 0 מעגל, 0 < e < 1 אליפסה, e = 1 פרבולה ו-e > 1 היפרבולה. במסלול כבידה e² = 1 + 2εh²/(GM)², כאשר ε האנרגיה ליחידת מסה ו-h התנע הזוויתי ליחידת מסה, ולכן הסימן של ε קובע אם המסלול קשור.
  lesson: '6.4'

- id: semi-major-axis
  term: חצי הציר הראשי
  en: semi-major axis
  symbol: a
  unit: m
  definition: חצי האורך של הציר הארוך של אליפסה, הממוצע של המרחקים בנקודת הקרבה ובנקודת הריחוק, a = (r_p + r_a)/2 = p/(1 − e²). במסלול כבידה הוא נקבע רק על ידי האנרגיה, ε = −GM/(2a) (בגדלים של שני גופים, E = −k/(2a)), והוא קובע את זמן המחזור.
  lesson: '6.4'

- id: c6-focus
  term: מוקד
  en: focus (of an ellipse)
  definition: אחת משתי נקודות על הציר הראשי של אליפסה, במרחק ae ממרכז האליפסה, כאשר a חצי הציר הראשי ו-e האקסצנטריות. סכום המרחקים מכל נקודה על האליפסה אל שני המוקדים הוא 2a. במסלול כבידה מרכז הכוח (השמש) נמצא באחד המוקדים, החוק הראשון של קפלר.
  lesson: '6.4'

- id: c6-semi-minor-axis
  term: חצי הציר המשני
  en: semi-minor axis
  symbol: b
  unit: m
  definition: חצי האורך של הציר הקצר של אליפסה, b = a√(1 − e²). השטח של האליפסה הוא πab, ובמסלול כבידה b² = ap, כאשר p פרמטר המסלול.
  lesson: '6.4'

- id: c6-asymptote
  term: אסימפטוטה
  en: asymptote
  definition: ישר שעקומה מתקרבת אליו יותר ויותר כשמתרחקים לאינסוף. להיפרבולה שתי אסימפטוטות, שעוברות במרכז שלה. במסלול היפרבולי הגוף מגיע מאינסוף לאורך אחת מהן ומתרחק לאורך השנייה; הכיוונים שלהן, כפי שהם נראים מהמוקד, בזוויות θ∞ = arccos(−1/e) מכיוון נקודת הקרבה.
  lesson: '6.4'

# Terms first defined in lesson 10.2. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: four-vector
  term: ארבעה-וקטור
  en: four-vector
  definition: רביעייה של גדלים (A₀, A₁, A₂, A₃) שעוברת בין מערכות ייחוס בטרנספורמציית לורנץ בדיוק כמו (ct, x, y, z). הגודל A₀² − A₁² − A₂² − A₃² שלה זהה בכל המערכות. ארבעה-וקטור האנרגיה-תנע הוא (E/c, pₓ, p_y, p_z), והגודל האינווריאנטי שלו הוא (mc)².
  reject: [ארבע-וקטור, וקטור-4]
  lesson: '10.2'

- id: four-velocity
  term: ארבעה-מהירות
  en: four-velocity
  symbol: U
  definition: הקצב שבו משתנה המקום במרחב-זמן של גוף לפי הזמן העצמי שלו, U = (c dt/dτ, dx/dτ, dy/dτ, dz/dτ) = γ(c, uₓ, u_y, u_z). זה ארבעה-וקטור, כי dτ זהה בכל המערכות. ארבעה-וקטור האנרגיה-תנע הוא mU.
  reject: [ארבע-מהירות]
  lesson: '10.2'

- id: minkowski-product
  term: מכפלת מינקובסקי
  en: Minkowski product
  definition: המכפלה של שני ארבעה-וקטורים, A·B = A₀B₀ − A₁B₁ − A₂B₂ − A₃B₃, עם מינוס לפני הרכיבים המרחביים. היא זהה בכל מערכת ייחוס. המכפלה של ארבעה-וקטור עם עצמו היא הגודל האינווריאנטי שלו; לשני חלקיקים, P_A·P_B = E_A E_B/c² − p⃗_A·p⃗_B.
  lesson: '10.2'

- id: invariant-mass
  term: מסה אינווריאנטית
  en: invariant mass
  symbol: M
  unit: MeV/c²
  definition: המסה של מערכת חלקיקים, Mc² = √(E² − (pc)²), עם האנרגיה הכוללת E והתנע הכולל p של המערכת. היא זהה בכל מערכת ייחוס, ובמערכת מרכז המסה היא האנרגיה הכוללת חלקי c². היא אינה סכום המסות של החלקיקים.
  lesson: '10.2'

- id: c10-invariant
  term: אינווריאנטי
  en: invariant
  definition: גודל שיוצא אותו ערך בכל מערכות הייחוס האינרציאליות, כמו האינטרוול c²Δt² − Δx², מהירות האור, או E² − (pc)² של חלקיק. אינווריאנטי אינו "נשמר"; שימור הוא שוויון בין לפני לאחרי תהליך בתוך מערכת ייחוס אחת. האנרגיה, למשל, נשמרת אבל אינה אינווריאנטית.
  lesson: '10.2'

- id: c10-mass-hyperbola
  term: היפרבולת המסה
  en: mass hyperbola
  definition: בדיאגרמת אנרגיה-תנע (pc לרוחב, E לגובה), העקומה E² − (pc)² = (mc²)², שעליה נמצאים כל המצבים של חלקיק בעל מסה m. טרנספורמציית לורנץ מזיזה את הנקודה של החלקיק לאורך ההיפרבולה הזו ולא מורידה אותה ממנה. לחלקיק חסר מסה היא מתנוונת לקווים E = |pc|.
  lesson: '10.2'

- id: c10-pion
  term: פיון
  en: pion
  symbol: '\pi'
  definition: חלקיק לא יציב, קל מהפרוטון בערך פי 7. יש פיונים טעונים, π⁺ ו-π⁻, שאנרגיית המנוחה שלהם 140 MeV, ופיון ניטרלי, π⁰, עם 135 MeV. פיון טעון דועך בדרך כלל למיואון ולנייטרינו, ופיון ניטרלי לשני פוטונים.
  lesson: '10.2'

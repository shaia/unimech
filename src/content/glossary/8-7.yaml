# Terms first defined in lesson 8.7. Chapter 8 terms outside the course's term table are prefixed c8-.

- id: physical-pendulum
  term: מטוטלת פיזיקלית
  en: physical pendulum
  definition: גוף צפיד שתלוי על ציר אופקי שאינו עובר במרכז המסה שלו, ומתנודד תחת הכובד. בזוויות קטנות זמן המחזור שלו T = 2π√(I_P/(mgd)), כאשר I_P מומנט ההתמד סביב הציר ו-d המרחק מהציר למרכז המסה.
  lesson: '8.7'

- id: c8-radius-of-gyration
  term: רדיוס ההתמד
  en: radius of gyration
  symbol: k
  unit: m
  definition: המרחק k שבו מסה נקודתית, השווה למסת הגוף, הייתה נותנת את אותו מומנט התמד סביב ציר שעובר במרכז המסה, I_cm = mk². למוט באורך L, k = L/√12; לדסקה ברדיוס R, k = R/√2.
  lesson: '8.7'

- id: c8-angular-impulse
  term: מתקף זוויתי
  en: angular impulse
  unit: N·m·s
  definition: האינטגרל של מומנט הכוח בזמן, ∫τ dt, ביחס לנקודה או לציר שצריך לציין. הוא שווה לשינוי של התנע הזוויתי ביחס לאותה נקודה, כמו שהמתקף שווה לשינוי של התנע. במכה קצרה, שבזמנה הגוף לא זז, המתקף הזוויתי של כוח הוא הזרוע שלו כפול המתקף שלו.
  lesson: '8.7'

- id: c8-equivalent-length
  term: אורך שקול
  en: equivalent length
  symbol: \ell
  unit: m
  definition: אורכה של מטוטלת פשוטה שזמן המחזור שלה שווה לזה של מטוטלת פיזיקלית נתונה, ℓ = I_P/(md) = d + k²/d. הוא תמיד ארוך מ-d, והוא המרחק מהציר למרכז התנודה, שהוא גם מרכז ההקשה.
  lesson: '8.7'

- id: c8-centre-of-oscillation
  term: מרכז התנודה
  en: centre of oscillation
  definition: הנקודה על הקו שעובר מהציר דרך מרכז המסה, במרחק האורך השקול ℓ מהציר. מסה נקודתית שם, על חוט באורך ℓ, הייתה מתנודדת יחד עם הגוף. תליית הגוף בנקודה הזו נותנת אותו זמן מחזור.
  lesson: '8.7'

- id: center-of-percussion
  term: מרכז ההקשה
  en: center of percussion
  definition: הנקודה בגוף שתלוי על ציר שבה מכה בניצב לקו שבין הציר למרכז המסה לא גורמת לציר להפעיל מתקף. היא נמצאת על הקו הזה, במרחק I_P/(md) מהציר, כלומר במרכז התנודה. במחבט זו הנקודה המתוקה.
  lesson: '8.7'

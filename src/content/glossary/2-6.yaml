# Terms first defined in lesson 2.6. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it).

- id: c2-banked-curve
  term: כביש משופע
  en: banked curve
  definition: עקומה של כביש שנטויה לעבר מרכז העקומה בזווית θ, כך שהרכיב האופקי של הכוח הנורמלי עוזר לתת את הכוח הרדיאלי. בלי חיכוך יש מהירות אחת, v² = gR tan θ, ועם חיכוך טווח של מהירויות.
  lesson: '2.6'

- id: c2-conical-pendulum
  term: מטוטלת קונית
  en: conical pendulum
  definition: משקולת שתלויה בחוט ונעה במעגל אופקי, כשהחוט נטוי בזווית קבועה θ מהאנך ומשרטט חרוט. הרכיב האופקי של המתיחות הוא הכוח הרדיאלי, ו-ω² = g/(L cos θ).
  lesson: '2.6'

- id: c2-centripetal-force
  term: כוח צנטריפטלי
  en: centripetal force
  definition: >-
    שם לרכיב הרדיאלי של הכוח השקול על גוף שנע במעגל, ΣF_r = mv²/R, אל המרכז. זה לא כוח נוסף: בתרשים הכוחות מופיעים רק כוחות שיש גוף שמפעיל אותם, והרכיב הרדיאלי של השקול שלהם הוא הכוח הצנטריפטלי.
  lesson: '2.6'

- id: c2-design-speed
  term: מהירות התכנון
  en: design speed
  symbol: v_0
  unit: m/s
  definition: המהירות שבה מכונית עוברת כביש משופע בלי צורך בחיכוך, v₀² = gR tan θ. לאט ממנה החיכוך הסטטי פונה במעלה השיפוע, ומהר ממנה במורד.
  lesson: '2.6'

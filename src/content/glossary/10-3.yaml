# Terms first defined in lesson 10.3. One spelling per concept, course-wide; `reject` lists spellings
# that must not appear in course text (lint-content enforces it). `c10-` ids are terms chapter 10 added.

- id: threshold-energy
  term: אנרגיית סף
  en: threshold energy
  symbol: K_th
  unit: MeV
  definition: האנרגיה הקינטית המזערית של חלקיק בקרן שמאפשרת תגובה שיוצרת חלקיקים חדשים. בסף, כל התוצרים נחים במערכת מרכז המסה, ולכן √s שווה לסכום אנרגיות המנוחה שלהם. על מטרה נייחת היא גדולה מאנרגיית המנוחה של החלקיקים החדשים, כי התוצרים חייבים לשאת את התנע של הקרן.
  lesson: '10.3'

- id: c10-two-body-decay
  term: דעיכה לשני חלקיקים
  en: two-body decay
  definition: תהליך שבו חלקיק בעל מסה M הופך לשני חלקיקים, M → m₁ + m₂. הוא אפשרי רק כש-M > m₁ + m₂. במערכת המנוחה של החלקיק הדועך התוצרים יוצאים גב אל גב, עם תנעים שווים בגודלם, והאנרגיות שלהם קבועות, E₁ = (M² + m₁² − m₂²)c²/(2M). ההפרש Q = (M − m₁ − m₂)c² הוא האנרגיה הקינטית שמשתחררת.
  lesson: '10.3'

- id: c10-fixed-target
  term: מטרה נייחת
  en: fixed target
  definition: ניסוי שבו קרן של חלקיקים מהירים פוגעת בחלקיקים שנחים במעבדה. התנע הכולל שווה לתנע של הקרן, ולכן מרכז המסה נע, והתוצרים חייבים לנוע. האנרגיה במערכת מרכז המסה גדלה רק כמו השורש של אנרגיית הקרן. ההפך הוא התנגשות חזיתית של שתי קרניים זהות, שבה מערכת המעבדה היא מערכת מרכז המסה.
  lesson: '10.3'

- id: c10-neutrino
  term: נייטרינו
  en: neutrino
  symbol: '\nu'
  definition: חלקיק ניטרלי שכמעט לא מגיב עם החומר, ולכן לא משאיר מסלול בגלאי. המסה שלו זעירה, ובקורס מחשיבים אותו לחסר מסה, כך ש-E = pc והוא נע במהירות c. פאולי הניח את קיומו בשנת 1930 כדי שהאנרגיה והתנע יישמרו בדעיכת בטא.
  lesson: '10.3'

- id: c10-kaon
  term: קאון
  en: kaon
  symbol: 'K'
  definition: חלקיק לא יציב שמסתו בערך חצי ממסת הפרוטון. לקאון הניטרלי K⁰ אנרגיית מנוחה 498 MeV, ולקאון הטעון K⁺ 494 MeV. קאון דועך, למשל, לשני פיונים, או למיואון ולנייטרינו.
  lesson: '10.3'

- id: c10-lambda
  term: למבדה
  en: lambda (Λ⁰)
  symbol: '\Lambda^0'
  definition: חלקיק ניטרלי לא יציב, כבד מעט מהפרוטון, עם אנרגיית מנוחה 1116 MeV. בדרך כלל הוא דועך לפרוטון ולפיון, Λ⁰ → p + π⁻.
  lesson: '10.3'

- id: c10-antiparticle
  term: אנטי-חלקיק
  en: antiparticle
  definition: לכל חלקיק יש אנטי-חלקיק בעל אותה מסה ומטען הפוך. לאלקטרון, e⁻, האנטי-חלקיק הוא הפוזיטרון, e⁺; לפרוטון, p, האנטי-פרוטון, p̄. בהתנגשות נוצר אנטי-חלקיק תמיד יחד עם חלקיק, ולכן כדי ליצור אנטי-פרוטון צריך ליצור זוג שלם, פרוטון ואנטי-פרוטון.
  lesson: '10.3'

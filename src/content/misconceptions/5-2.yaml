# Misconceptions first detected in lesson 5.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. The anchors point at
# the figures, steps and examples of lesson 5.2 that refute each one.

- id: MC-5-energy-linear-in-x
  title: האנרגיה מתחלקת באופן ליניארי בהעתק
  belief: בחצי האמפליטודה חצי מהאנרגיה של המתנד פוטנציאלית וחצי קינטית.
  truth: האנרגיה הפוטנציאלית היא ½kx², ריבועית בהעתק. בחצי האמפליטודה היא רק רבע מהאנרגיה, ושלושה רבעים קינטיים.
  remedy: { lesson: '5.2', anchor: energy, label: 'שיעור 5.2: האנרגיה הקינטית והפוטנציאלית לאורך התנודה' }

- id: MC-5-most-time-at-center
  title: המתנד מבלה את רוב הזמן ליד המרכז
  belief: גוף מתנודד נמצא רוב הזמן ליד נקודת שיווי המשקל, שם הוא מהיר.
  truth: ליד המרכז הגוף מהיר ועובר שם מהר; ליד נקודות המפנה הוא איטי ומבלה שם את רוב הזמן. הממוצע בזמן של האנרגיה הקינטית ושל הפוטנציאלית שווה, E/2 כל אחד.
  remedy: { lesson: '5.2', anchor: averages, label: 'שיעור 5.2: ממוצעים בזמן של האנרגיה' }

- id: MC-5-frequency-from-depth
  title: עומק הבור קובע את התדירות
  belief: תדירות התנודות הקטנות בבור פוטנציאל נקבעת מהעומק שלו, כאילו הבור פרבולה באותו עומק ובאותו רוחב.
  truth: לתנודות קטנות רק העקמומיות בתחתית משנה, ω₀² = U″(x₀)/m. העומק קובע עד איזו אנרגיה החלקיק כלוא, לא כמה מהר הוא מתנודד.
  remedy: { lesson: '5.2', anchor: harmonic, label: 'שיעור 5.2: פיתוח טיילור סביב המינימום' }

- id: MC-5-transverse-like-longitudinal
  title: תנודה ניצבת בין קפיצים כמו תנודה לאורכם
  belief: חרוז בין שני קפיצים מתנודד בניצב לקפיצים באותה תדירות כמו לאורכם, √(2k/m).
  truth: בתנועה ניצבת הקפיצים כמעט לא משנים את אורכם, והכוח המחזיר בא מהמתיחות T₀ שכבר יש בהם, T₀/L לכל קפיץ באורך L במקום k. לשני קפיצים, ω₀ = √(2T₀/(mL)). כשהקפיצים רפויים בשיווי המשקל התנודה הניצבת כבר לא הרמונית.
  remedy: { lesson: '5.2', anchor: ex-5-2-5, label: 'שיעור 5.2: קפיץ שניצב למסילה, והכוח שבא מהדחיסה שכבר יש בו' }

- id: MC-5-isochronous-always
  title: זמן המחזור של מטוטלת לא תלוי באמפליטודה
  belief: זמן המחזור של מטוטלת, ושל כל גוף שמתנודד בבור, זהה בכל אמפליטודה, כמו במתנד הרמוני.
  truth: רק בבור שהוא פרבולה מדויקת זמן המחזור לא תלוי באמפליטודה. במטוטלת הכוח המחזיר mg sin θ חלש מ-mgθ, וזמן המחזור גדל עם האמפליטודה, בערך פי 1 + θ₀²/16; בבור שמתקשה הוא קטן.
  remedy: { lesson: '5.2', anchor: large, label: 'שיעור 5.2: מתי הקירוב ההרמוני נשבר' }

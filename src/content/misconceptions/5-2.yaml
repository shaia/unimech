# Misconceptions first detected in lesson 5.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 5.2
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-5-energy-linear-in-x
  title: האנרגיה מתחלקת באופן ליניארי בהעתק
  belief: בחצי האמפליטודה חצי מהאנרגיה של המתנד פוטנציאלית וחצי קינטית.
  truth: האנרגיה הפוטנציאלית היא ½kx², ריבועית בהעתק. בחצי האמפליטודה היא רק רבע מהאנרגיה, ושלושה רבעים קינטיים.
  remedy: { lesson: '5.2', label: 'שיעור 5.2: האנרגיה הקינטית והפוטנציאלית לאורך התנודה' }

- id: MC-5-most-time-at-center
  title: המתנד מבלה את רוב הזמן ליד המרכז
  belief: גוף מתנודד נמצא רוב הזמן ליד נקודת שיווי המשקל, שם הוא מהיר.
  truth: ליד המרכז הגוף מהיר ועובר שם מהר; ליד נקודות המפנה הוא איטי ומבלה שם את רוב הזמן. הממוצע בזמן של האנרגיה הקינטית ושל הפוטנציאלית שווה, E/2 כל אחד.
  remedy: { lesson: '5.2', label: 'שיעור 5.2: ממוצעים בזמן של האנרגיה' }

- id: MC-5-frequency-from-depth
  title: עומק הבור קובע את התדירות
  belief: תדירות התנודות הקטנות בבור פוטנציאל נקבעת מהעומק שלו, כאילו הבור פרבולה באותו עומק ובאותו רוחב.
  truth: לתנודות קטנות רק העקמומיות בתחתית משנה, ω² = U″(x₀)/m. העומק קובע עד איזו אנרגיה החלקיק כלוא, לא כמה מהר הוא מתנודד.
  remedy: { lesson: '5.2', label: 'שיעור 5.2: פיתוח טיילור סביב המינימום' }

- id: MC-5-transverse-like-longitudinal
  title: תנודה ניצבת בין קפיצים כמו תנודה לאורכם
  belief: חרוז בין שני קפיצים מתנודד בניצב לקפיצים באותה תדירות כמו לאורכם, √(2k/m).
  truth: בתנועה ניצבת הקפיצים כמעט לא משנים את אורכם, והכוח המחזיר בא מהמתיחות שכבר יש בהם, ω = √(2T₀/(mL)). כשהקפיצים רפויים בשיווי המשקל התנודה הניצבת כבר לא הרמונית.
  remedy: { lesson: '5.2', label: 'שיעור 5.2: חרוז בין שני קפיצים מתוחים' }

# Misconceptions first detected in lesson 9.6. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 9.6
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.
# Lesson 9.6 is written: each remedy now has an anchor, an element id in the lesson that refutes it.

- id: MC-9-twins-same-age
  title: התאומים בני אותו גיל כשהם נפגשים
  belief: מכיוון שכל תאום מוצא שהשעון של השני מפגר באותו גורם, ההשפעות מתקזזות והתאומים נפגשים בני אותו גיל.
  truth: המצב לא סימטרי. התאום שנשאר על כדור הארץ נמצא כל הזמן במערכת אינרציאלית אחת, והנוסע מחליף מערכת בנקודת הסיבוב. מחשבון במערכת של כדור הארץ, שתקף לכל המסע, הנוסע צעיר יותר כשהם נפגשים.
  remedy: { lesson: '9.6', label: 'שיעור 9.6: הגילים בשני החשבונות', anchor: 'two-ages' }

- id: MC-9-motion-absolute
  title: מי שבאמת נע הוא מי שהשעון שלו מאט
  belief: הנוסע צעיר יותר פשוט כי הוא זה שנע, וכדור הארץ באמת נח.
  truth: בין מערכות אינרציאליות אין "באמת נע". מה ששובר את הסימטריה בפרדוקס התאומים הוא שהנוסע מחליף מערכת אינרציאלית באמצע המסע, ותאום כדור הארץ לא. בפרדוקס המוט והאסם שתי המערכות צודקות, כל אחת לגבי מה שהיא מודדת.
  remedy: { lesson: '9.6', label: 'שיעור 9.6: מה שובר את הסימטריה בין התאומים', anchor: 'symmetry' }

- id: MC-9-acceleration-slows-clock
  title: התאוצה עצמה מאטה את השעון
  belief: בזמן הסיבוב הנוסע מאיץ, והתאוצה היא שמאטה את השעון שלו ויוצרת את הפרש הגילים.
  truth: אפשר לעשות את הסיבוב קצר כרצוננו, והשעון של הנוסע מתקתק בו כרגיל. הפרש הגילים גדל עם אורך המסע, גם כשהסיבוב זהה. התאוצה רק מסמנת את המעבר בין שתי מערכות אינרציאליות, ואיתו את הקפיצה בקו הבו-זמניות של הנוסע.
  remedy: { lesson: '9.6', label: 'שיעור 9.6: שני מסעות עם אותו סיבוב', anchor: 'same-turn' }

- id: MC-9-contraction-is-compression
  title: התקצרות אורך היא דחיסה של הגוף
  belief: המוט המהיר נדחס באמת, ולכן במערכת שלו הוא קצר יותר, והוא נכנס לאסם בכל מערכת.
  truth: במערכת שבה המוט נח האורך שלו הוא האורך העצמי, ואין עליו שום כוח שדוחס אותו. ההתקצרות היא תוצאה של מדידת הקצוות באותו רגע במערכת שבה המוט נע, ורגע כזה הוא רגע אחר בכל מערכת.
  remedy: { lesson: '9.6', label: 'שיעור 9.6: המוט והאסם בשתי המערכות', anchor: 'no-compression' }

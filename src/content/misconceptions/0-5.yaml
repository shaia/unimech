# Misconceptions first detected in lesson 0.5. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-0-linearity-confusion
  title: איבר קבוע או מקדם שתלוי בזמן הופכים משוואה ללא ליניארית
  belief: משוואה כמו m v̇ = mg − bv, או ẍ + t²x = 0, אינה ליניארית, בגלל האיבר הקבוע או בגלל המקדם שתלוי בזמן.
  truth: ליניאריות נוגעת רק לנעלם ולנגזרות שלו, שצריכים להופיע בחזקה ראשונה ובלי פונקציות שלהם. איבר שתלוי רק ב-t עושה את המשוואה לא הומוגנית, ומקדם שתלוי ב-t משאיר אותה ליניארית.
  remedy: { lesson: '0.5', label: 'שיעור 0.5: סדר וליניאריות של משוואה דיפרנציאלית' }

- id: MC-0-exponential-to-zero
  title: כל דעיכה אקספוננציאלית מגיעה לאפס
  belief: פתרון של משוואת קירור או האטה תמיד מהצורה Ae^(−t/τ), ולכן הגודל דועך לאפס.
  truth: מה שדועך הוא ההפרש מערך שיווי המשקל, כמו T − T_env. הגודל עצמו שואף לשיווי המשקל, ותנאי ההתחלה קובעים את הקבוע.
  remedy: { lesson: '0.5', label: 'שיעור 0.5: הפרדת משתנים בחוק הקירור' }

- id: MC-0-spring-always-oscillates
  title: מסה על קפיץ תמיד מתנודדת
  belief: כל מסה על קפיץ מתנודדת סביב שיווי המשקל, גם עם ריסון חזק.
  truth: כש-b² > 4mk שורשי המשוואה האופיינית ממשיים, והמסה חוזרת לשיווי משקל בלי לעבור אותו יותר מפעם אחת. תנודות יש רק כשהשורשים מרוכבים.
  remedy: { lesson: '0.5', label: 'שיעור 0.5: שלושת סוגי השורשים של המשוואה האופיינית' }

- id: MC-0-complex-roots-no-solution
  title: לדיסקרימיננטה שלילית אין פתרון
  belief: כשהדיסקרימיננטה של המשוואה האופיינית שלילית, אין לה פתרון, ולכן גם למשוואה הדיפרנציאלית אין פתרון פשוט.
  truth: 'יש שני שורשים מרוכבים, −γ ± iω. הפתרונות e^(rt) מרוכבים, והחלק הממשי שלהם, e^(−γt)cos(ωt + φ), הוא פתרון ממשי: תנודה דועכת.'
  remedy: { lesson: '0.6', label: 'שיעור 0.6: האקספוננט המרוכב כתנודה' }

- id: MC-0-damping-no-frequency-change
  title: הריסון לא משנה את התדירות
  belief: מתנד מרוסן מתנודד באותה תדירות זוויתית כמו בלי ריסון, √(k/m), ורק האמפליטודה שלו דועכת.
  truth: הריסון מקטין את התדירות ל-√(k/m − (b/2m)²). בריסון חלש ההבדל קטן, ובריסון שמתקרב לקריטי התדירות שואפת לאפס.
  remedy: { lesson: '0.5', label: 'שיעור 0.5: שורשים מרוכבים: דעיכה ותדירות' }

- id: MC-0-double-root-one-solution
  title: לשורש כפול יש פתרון אחד, ותנאי אחד מספיק
  belief: כשלמשוואה האופיינית יש שורש כפול, הפתרון הוא Ae^(rt) בלבד, ותנאי התחלה אחד קובע את התנועה.
  truth: משוואה מסדר שני צריכה תמיד שני פתרונות בלתי תלויים ושני תנאי התחלה. בשורש כפול הפתרון השני הוא te^(rt).
  remedy: { lesson: '0.5', label: 'שיעור 0.5: שורש כפול וריסון קריטי' }

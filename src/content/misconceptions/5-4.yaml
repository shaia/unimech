# Misconceptions first detected in lesson 5.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 5.4
# is written, the remedy link leads to its comprehension ladder on the chapter practice page; now each
# remedy has an anchor in the lesson.

- id: MC-5-resonance-in-phase
  title: בתהודה ההעתק באותה פאזה כמו הכוח
  belief: בתהודה הכוח המאלץ דוחף את הגוף הכי חזק כשהוא הכי רחוק, ולכן ההעתק והכוח באותה פאזה.
  truth: בתהודה ההעתק מפגר ב-90° אחרי הכוח, ולכן המהירות היא שבאותה פאזה כמו הכוח. כך הכוח דוחף תמיד בכיוון התנועה, וההספק שהוא מעביר מרבי.
  remedy: { lesson: '5.4', anchor: at-resonance, label: 'שיעור 5.4: מה קורה בתהודה' }

- id: MC-5-always-follows-force
  title: גוף מאולץ נע תמיד עם הכוח
  belief: גוף שכוח מחזורי פועל עליו נע תמיד לכיוון שהכוח דוחף, באותה פאזה.
  truth: רק בתדירות נמוכה מהתדירות העצמית ההעתק באותה פאזה כמו הכוח. בתהודה הוא מפגר ב-90°, והרחק מעליה בפאזה הפוכה, כי אז m·ẍ ≈ F, והתאוצה בתנודה הפוכה להעתק.
  remedy: { lesson: '5.4', anchor: phase-regimes, label: 'שיעור 5.4: מי מאזן את הכוח המאלץ בכל תדירות' }

- id: MC-5-initial-conditions-persist
  title: המצב היציב זוכר את תנאי ההתחלה
  belief: מתנד מאולץ שהתחיל עם יותר אנרגיה, או בפאזה אחרת, ימשיך לנוע אחרת גם אחרי זמן רב.
  truth: תנאי ההתחלה קובעים רק את התגובה המעברית, שדועכת כמו e^(−γt/2). המצב היציב, האמפליטודה והפאזה שלו, נקבע רק מהכוח המאלץ ומתכונות המתנד.
  remedy: { lesson: '5.4', anchor: transient, label: 'שיעור 5.4: התגובה המעברית והמצב היציב' }

- id: MC-5-peak-at-damped-frequency
  title: שיא התהודה בתדירות המרוסנת
  belief: האמפליטודה של מתנד מאולץ מרבית כשמאלצים אותו בתדירות של התנודות החופשיות המרוסנות, ω_d.
  truth: שיא האמפליטודה הוא ב-√(ω₀² − γ²/2), נמוך גם מ-ω_d = √(ω₀² − γ²/4) וגם מ-ω₀. בריסון חלש שלושתן כמעט שוות, אבל הן שונות.
  remedy: { lesson: '5.4', anchor: peak, label: 'שיעור 5.4: איפה שיא האמפליטודה' }

- id: MC-5-width-independent-of-damping
  title: הריסון משנה רק את גובה התהודה
  belief: הקטנת הריסון מגדילה את שיא התהודה, אבל הרוחב שלה לא משתנה.
  truth: רוחב התהודה הוא בערך γ = ω₀/Q. ריסון קטן יותר נותן תהודה גבוהה וגם צרה יותר.
  remedy: { lesson: '5.4', anchor: width-q, label: 'שיעור 5.4: גובה התהודה ורוחבה' }

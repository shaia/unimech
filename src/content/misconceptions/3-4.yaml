# Misconceptions first detected in lesson 3.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. The anchors point at the
# steps and sections of lesson 3.4 that refute each one.

- id: MC-3-cm-inside-body
  title: מרכז המסה חייב להיות בתוך החומר
  belief: מרכז המסה של גוף הוא נקודה בתוך החומר של הגוף.
  truth: מרכז המסה הוא ממוצע של מקומות, משוקלל במסה, והוא יכול ליפול מחוץ לחומר, כמו במרכז של טבעת, פרסה או צורת L.
  remedy: { lesson: '3.4', anchor: wire, label: 'שיעור 3.4: מרכז המסה של חצי טבעת, מחוץ לתיל' }

- id: MC-3-cm-same-for-any-filling
  title: מרכז המסה תלוי רק בצורה החיצונית
  belief: לגופים באותה צורה חיצונית יש אותו מרכז מסה, בלי קשר לאופן שבו המסה מפוזרת בתוכם, למשל תיל וחצי דיסקה, משולש וחרוט, מוט אחיד ומוט שצפיפותו משתנה.
  truth: מרכז המסה תלוי בפיזור המסה. תיל בחצי מעגל, שכל המסה שלו במרחק R, גבוה יותר מחצי דיסקה; בחרוט מלא, שהמסה של כל פרוסה גדלה כמו z², מרכז המסה נמוך יותר מאשר במשולש.
  remedy: { lesson: '3.4', anchor: continuous, label: 'שיעור 3.4: מרכז המסה של גוף רציף' }

- id: MC-3-internal-forces-move-cm
  title: כוחות פנימיים מזיזים את מרכז המסה
  belief: כוחות בין חלקי המערכת, כמו דחיפה בין שני מחליקים או כוח השרירים, יכולים להאיץ את מרכז המסה שלה.
  truth: M·a_cm = F_ext. הכוחות הפנימיים מתבטלים בזוגות לפי החוק השלישי, ולכן רק כוח חיצוני, כמו החיכוך מהרצפה, משנה את התנועה של מרכז המסה.
  remedy: { lesson: '3.4', anchor: cm-motion, label: 'שיעור 3.4: מה מזיז את מרכז המסה' }

- id: MC-3-relative-as-ground-displacement
  title: העתק ביחס לגוף נע מחושב כאילו הוא ביחס לקרקע
  belief: אם אדם הולך 4 מטרים לאורך סירה, או קופץ במהירות מסוימת ממנה, זה ההעתק או המהירות שלו ביחס לחוף.
  truth: הסירה עצמה זזה באותו זמן. ההעתק ביחס לחוף הוא ההעתק ביחס לסירה ועוד ההעתק של הסירה, ואת התנאי "מרכז המסה לא זז" כותבים עם ההעתקים ביחס לחוף, או ביחס למים שעומדים.
  remedy: { lesson: '3.4', anchor: plank, label: 'שיעור 3.4: הולכים על קרש שצף' }

- id: MC-3-fragment-keeps-trajectory
  title: רסיס ממשיך במסלול של הגוף לפני הפיצוץ
  belief: אחרי פיצוץ באוויר, כל רסיס, או לפחות הכבד, ממשיך בפרבולה המקורית.
  truth: רק מרכז המסה ממשיך בפרבולה המקורית, כי הפיצוץ פנימי. הרסיסים מקבלים דחיפות הפוכות ונוחתים משני צדי הנקודה שבה נוחת מרכז המסה.
  remedy: { lesson: '3.4', anchor: burst, label: 'שיעור 3.4: פגז שמתפוצץ באוויר' }

# Misconceptions first detected in lesson 8.6. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-8-skater-energy-conserved
  title: כשהתנע הזוויתי נשמר, גם האנרגיה נשמרת
  belief: מחליקה שמקרבת את זרועותיה בלי מומנט חיצוני שומרת גם על התנע הזוויתי וגם על האנרגיה הקינטית.
  truth: נשמר התנע הזוויתי, L = Iω. האנרגיה K = L²/(2I) גדלה כש-I קטן, והתוספת היא העבודה שהשרירים עושים כשהם מושכים את הזרועות פנימה.
  remedy: { lesson: '8.6', anchor: pull-work, label: 'שיעור 8.6: העבודה של החוטים שמקרבים משקולות לציר' }

- id: MC-8-momentum-conserved-with-pivot
  title: תנע קווי נשמר בהתנגשות עם גוף על ציר
  belief: בהתנגשות קצרה בין חלקיק לגוף שמחובר לציר קבוע, התנע הקווי של המערכת נשמר.
  truth: הציר מפעיל מתקף בזמן ההתנגשות, ולכן התנע הקווי משתנה. נשמר התנע הזוויתי סביב הציר, כי הכוח של הציר לא יוצר מומנט סביבו.
  remedy: { lesson: '8.6', anchor: pin-impulse, label: 'שיעור 8.6: מוט נעוץ, והמתקף של הציר' }

- id: MC-8-free-rod-pivots-at-end
  title: מוט חופשי שנפגע בקצה מסתובב סביב הקצה השני
  belief: מוט חופשי שנפגע בקצה אחד מסתובב סביב הקצה השני, כאילו הוא מחובר שם לציר.
  truth: מוט חופשי מתקדם עם מרכז המסה ומסתובב סביבו. מיד אחרי מכה בקצה, הקצה השני נע לאחור, והנקודה שבמנוחה נמצאת במרחק 2L/3 מהקצה שהוכה.
  remedy: { lesson: '8.6', anchor: free-vs-pin, label: 'שיעור 8.6: מוט חופשי מול מוט נעוץ' }

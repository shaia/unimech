# Misconceptions first detected in lesson 6.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 6.4
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-6-ellipse-center-at-sun
  title: השמש במרכז האליפסה
  belief: כוכב לכת נע באליפסה שהשמש נמצאת במרכזה.
  truth: במשוואה r = p/(1 + e cos θ) הראשית, השמש, נמצאת באחד המוקדים, במרחק ae ממרכז האליפסה. אליפסה סביב המרכז מתקבלת מכוח של קפיץ, לא מכבידה.
  remedy: { lesson: '6.4', label: 'שיעור 6.4: חתך חרוט בקואורדינטות קוטביות' }

- id: MC-6-unbound-is-parabola
  title: כל מסלול לא קשור הוא פרבולה
  belief: גוף שבורח מכוכב נע בפרבולה, כמו כדור שנזרק.
  truth: פרבולה היא המקרה הגבולי E = 0 בלבד, e = 1. גוף עם E > 0 נע בהיפרבולה, e > 1, ומגיע לאינסוף במהירות שונה מאפס.
  remedy: { lesson: '6.4', label: 'שיעור 6.4: סיווג המסלולים לפי האנרגיה' }

- id: MC-6-e-depends-on-energy-only
  title: האקסצנטריות נקבעת רק על ידי האנרגיה
  belief: שני מסלולים בעלי אותה אנרגיה הם בעלי אותה צורה.
  truth: האנרגיה קובעת את חצי הציר הראשי, a = −k/(2E). האקסצנטריות תלויה גם בתנע הזוויתי, e² = 1 + 2EL²/(μk²); באותה אנרגיה, L קטן נותן מסלול מוארך יותר.
  remedy: { lesson: '6.4', label: 'שיעור 6.4: האקסצנטריות מתוך האנרגיה והתנע הזוויתי' }

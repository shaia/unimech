# Misconceptions first detected in lesson 0.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-0-sin-cos-swap
  title: הרכיב הסמוך לזווית מחושב בסינוס
  belief: הרכיב האופקי של וקטור הוא תמיד F sin θ, או תמיד F cos θ, בלי קשר לזווית שנתונה.
  truth: הרכיב לאורך הצלע הסמוכה לזווית הנתונה הוא F cos θ, והרכיב לאורך הצלע שמולה הוא F sin θ. מה שקובע הוא ממה נמדדת הזווית.
  remedy: { lesson: '0.2', label: 'שיעור 0.2: פירוק וקטור לרכיבים במשולש ישר זווית' }

- id: MC-0-magnitudes-add
  title: גודל של סכום הוא סכום הגדלים
  belief: הגודל של סכום (או של הפרש) שני וקטורים הוא הסכום (או ההפרש) של הגדלים שלהם.
  truth: גדלים מתחברים כמספרים רק כשהווקטורים באותו כיוון. בכל מקרה אחר מחברים רכיב-רכיב, ורק אז מחשבים גודל; |A + B| ≤ |A| + |B|.
  remedy: { lesson: '0.2', label: 'שיעור 0.2: חיבור וקטורים ברכיבים' }

- id: MC-0-product-ignores-angle
  title: מכפלה של וקטורים היא מכפלת הגדלים
  belief: המכפלה הסקלרית, או גודל המכפלה הווקטורית, של שני וקטורים היא פשוט מכפלת הגדלים שלהם.
  truth: המכפלה הסקלרית היא AB cos θ והגודל של המכפלה הווקטורית הוא AB sin θ. הזווית בין הווקטורים קובעת, ואחת מהן מתאפסת כשהווקטורים ניצבים או מקבילים.
  remedy: { lesson: '0.2', label: 'שיעור 0.2: הזווית במכפלה הסקלרית ובמכפלה הווקטורית' }

- id: MC-0-dot-is-vector
  title: מכפלה סקלרית היא וקטור
  belief: למכפלה הסקלרית של שני וקטורים יש כיוון, כמו לגורמים שלה.
  truth: המכפלה הסקלרית היא מספר, סקלר, בלי כיוון. היא מודדת כמה אחד הווקטורים פונה בכיוון של השני.
  remedy: { lesson: '0.2', label: 'שיעור 0.2: מכפלה סקלרית כהיטל' }

- id: MC-0-cross-order
  title: הסדר במכפלה וקטורית לא משנה
  belief: A × B ו-B × A הם אותו וקטור, כמו במכפלה של מספרים.
  truth: המכפלה הווקטורית אנטי-סימטרית, B × A = −A × B. החלפת הסדר, או שימוש ביד שמאל, הופכת את הכיוון.
  remedy: { lesson: '0.2', label: 'שיעור 0.2: כלל יד ימין והסדר במכפלה' }

- id: MC-0-cross-in-plane
  title: המכפלה הווקטורית במישור של הגורמים
  belief: המכפלה הווקטורית של שני וקטורים מצביעה בכיוון של אחד מהם, או במישור שהם פורשים.
  truth: המכפלה הווקטורית ניצבת לשני הגורמים שלה. כששניהם במישור הדף, היא מצביעה החוצה מהדף או לתוכו.
  remedy: { lesson: '0.2', label: 'שיעור 0.2: המכפלה הווקטורית ניצבת לשני הגורמים' }

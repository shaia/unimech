# Misconceptions first detected in lesson 1.3. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 1.3
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-1-centripetal-points-outward
  title: בסיבוב התאוצה פונה החוצה
  belief: גוף שנע במעגל מאיץ כלפי חוץ, כי מרגישים "נזרקים" החוצה בסיבוב.
  truth: התאוצה של גוף בתנועה מעגלית פונה אל המרכז. התחושה של "נזרקים החוצה" היא תיאור מתוך מערכת ייחוס שמסתובבת, ובה עוסק פרק 7.
  remedy: { lesson: '1.3', label: 'שיעור 1.3: התאוצה הצנטריפטלית' }

- id: MC-1-acceleration-along-velocity
  title: התאוצה תמיד בכיוון התנועה
  belief: וקטור התאוצה מכוון לאורך המהירות, כמו שהגוף נע.
  truth: רק הרכיב המשיקי של התאוצה מכוון לאורך המהירות, והוא משנה את גודלה. הרכיב הניצב פונה אל מרכז העקמומיות ומשנה את הכיוון שלה.
  remedy: { lesson: '1.3', label: 'שיעור 1.3: פירוק התאוצה לרכיב משיקי ולרכיב ניצב' }

- id: MC-1-frequency-is-angular-velocity
  title: המהירות הזוויתית היא מספר הסיבובים בשנייה
  belief: גוף שמסתובב 50 פעמים בשנייה נע במהירות זוויתית של 50 rad/s.
  truth: סיבוב אחד הוא 2π רדיאנים, ולכן ω = 2πf. בנוסחאות כמו a = ω²r צריך את ω ברדיאנים לשנייה.
  remedy: { lesson: '1.3', label: 'שיעור 1.3: מהירות זוויתית ותדירות' }

- id: MC-1-circular-acceleration-always-central
  title: בתנועה מעגלית התאוצה תמיד פונה למרכז
  belief: על מסלול מעגלי וקטור התאוצה פונה תמיד בדיוק אל מרכז המעגל.
  truth: רק כשגודל המהירות קבוע. כשהגוף מאיץ או מאט לאורך המעגל יש לתאוצה גם רכיב משיקי, והיא נוטה מהמרכז לכיוון התנועה או נגדו.
  remedy: { lesson: '1.3', label: 'שיעור 1.3: תנועה מעגלית בתאוצה זוויתית' }

- id: MC-1-curvature-from-total-acceleration
  title: רדיוס העקמומיות הוא גודל המהירות בריבוע חלקי כל התאוצה
  belief: בכל נקודה במסלול רדיוס העקמומיות הוא v²/|a|.
  truth: רק הרכיב של התאוצה שניצב למהירות מעקם את המסלול, ולכן ρ = v²/a⊥. הרכיב המשיקי משנה את גודל המהירות ולא את הכיוון שלה.
  remedy: { lesson: '1.3', label: 'שיעור 1.3: רדיוס עקמומיות' }

- id: MC-1-curvature-radius-is-a-distance
  title: רדיוס העקמומיות הוא מרחק שרואים בציור
  belief: רדיוס העקמומיות של מסלול הוא מרחק גאומטרי שמופיע בבעיה, כמו הגובה המרבי של זריקה או המרחק של הגוף מציר הסיבוב.
  truth: רדיוס העקמומיות הוא הרדיוס של המעגל שמתאים למסלול בנקודה מסוימת, ρ = v²/a⊥. הוא נקבע מהמהירות ומהתאוצה באותה נקודה, ובדרך כלל לא שווה לאף מרחק בציור.
  remedy: { lesson: '1.3', label: 'שיעור 1.3: רדיוס העקמומיות בשיא של פרבולה' }

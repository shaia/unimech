# Misconceptions first detected in lesson 9.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in lesson 9.2 that refutes it (`anchor`, an element id).

- id: MC-9-proper-time-rest-frame
  title: הזמן העצמי הוא הזמן של מי שנח
  belief: את הזמן העצמי מודד תמיד הצופה ש"באמת" נח, למשל הצופה על הקרקע, ולכן את הזמן של הנוסע מכפילים בגורם לורנץ.
  truth: הזמן העצמי בין שני מאורעות הוא הזמן שמודד שעון שנמצא בשניהם, כלומר במערכת שבה שני המאורעות קורים באותו מקום. כל מערכת אחרת מודדת זמן ארוך יותר, פי γ. איזו מערכת "נחה" לא משנה דבר.
  remedy: { lesson: '9.2', label: 'שיעור 9.2: איזה שעון נמצא בשני המאורעות', anchor: 'proper-time' }

- id: MC-9-dilation-asymmetric
  title: אם השעון שלי מאט בעיניך, השעון שלך ממהר בעיניי
  belief: אם צופה על כדור הארץ מוצא ששעוני החללית מפגרים, הצוות בחללית מוצא ששעוני כדור הארץ ממהרים.
  truth: התארכות הזמן סימטרית. כל צופה אינרציאלי מוצא שהשעונים שנעים ביחס אליו מפגרים, פי γ. אין סתירה, כי כל אחד משווה שעון אחד של השני לשני שעונים שלו, ושני השעונים שלו מסונכרנים רק בעיניו.
  remedy: { lesson: '9.2', label: 'שיעור 9.2: כל צופה מוצא את השעונים של השני מפגרים', anchor: 'symmetric' }

- id: MC-9-own-clock-slow
  title: מי שנע מרגיש שהזמן שלו מאט
  belief: האסטרונאוטית בחללית המהירה מרגישה שהזמן שלה זורם לאט, ששעונה מפגר ושליבה פועם לאט.
  truth: במערכת שלה היא נחה, ולכן כל השעונים שלה, הלב שלה כלול, פועלים כרגיל. התארכות הזמן היא השוואה בין מערכות, לא תחושה בתוך מערכת. לפי עקרון היחסות, שום ניסוי בתוך החללית לא מגלה שהיא נעה.
  remedy: { lesson: '9.2', label: 'שיעור 9.2: המיואון במערכת שלו', anchor: 'muon-frame' }

- id: MC-9-contraction-all-directions
  title: גוף נע מתקצר בכל הכיוונים
  belief: גוף שנע מהר מתקצר בכל המידות שלו, ולכן קובייה נעה נראית כמו קובייה קטנה יותר.
  truth: ההתקצרות היא רק לאורך כיוון התנועה. המידות הניצבות לתנועה זהות בשתי המערכות; אחרת שני צופים היו חלוקים על השאלה איזו משתי טבעות זהות עוברת בתוך השנייה.
  remedy: { lesson: '9.2', label: 'שיעור 9.2: מה קורה למידות הניצבות לתנועה', anchor: 'perpendicular' }

- id: MC-9-moving-rod-longer
  title: מוט נע נמדד ארוך יותר
  belief: כמו שהזמן מתארך, גם האורך של גוף נע גדל פי γ.
  truth: האורך העצמי, במערכת שבה הגוף נח, הוא הארוך ביותר. בכל מערכת שבה הגוף נע, מודדים את שני הקצוות באותו רגע ומקבלים אורך קצר פי γ.
  remedy: { lesson: '9.2', label: 'שיעור 9.2: התקצרות האורך והאורך העצמי', anchor: 'contraction' }

- id: MC-9-double-counting
  title: התארכות זמן והתקצרות אורך באותה מערכת
  belief: כדי להסביר את המיואונים צריך להפעיל יחד את התארכות הזמן ואת התקצרות האורך, באותה מערכת.
  truth: כל מערכת משתמשת באחד מהם. במערכת של כדור הארץ השעון של המיואון מפגר והאטמוספרה באורכה העצמי; במערכת של המיואון השעון שלו כרגיל והאטמוספרה מתקצרת. שני החשבונות נותנים את אותו מספר שורדים.
  remedy: { lesson: '9.2', label: 'שיעור 9.2: המיואונים בשתי המערכות', anchor: 'double-counting' }

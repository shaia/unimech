# Misconceptions first detected in lesson 9.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in lesson 9.4 that refutes it (`anchor`, an element id).

- id: MC-9-galilean-velocity-addition
  title: מהירויות מתחברות בחיבור פשוט
  belief: גוף שנע במהירות u′ ביחס לחללית, שנעה במהירות v ביחס לכדור הארץ, נע ביחס לכדור הארץ במהירות u′ + v.
  truth: הכלל הזה נובע מטרנספורמציית גליליי ונכון רק כשהמהירויות קטנות מ-c בהרבה. הכלל היחסותי הוא u = (u′ + v)/(1 + u′v/c²), והוא תמיד נותן מהירות קטנה מ-c כששתי המהירויות קטנות מ-c.
  remedy: { lesson: '9.4', label: 'שיעור 9.4: חיבור מהירויות יחסותי, מטרנספורמציית לורנץ', anchor: 'velocity-addition' }

- id: MC-9-closing-speed-limited
  title: קצב ההתקרבות בין שני גופים לא יכול לעבור את c
  belief: אם שני גופים מתקרבים זה לזה ובמערכת של כדור הארץ המרחק ביניהם קטן בקצב 1.6c, משהו בתורת היחסות נשבר.
  truth: מהירות האור מגבילה את המהירות של גוף או של אות ביחס למערכת אינרציאלית. קצב השינוי של מרחק בין שני גופים, שנמדד במערכת שלישית, אינו מהירות של שום גוף, ויכול להגיע עד 2c. במערכת של כל אחד מהגופים, השני נע לאט מ-c.
  remedy: { lesson: '9.4', label: 'שיעור 9.4: קצב התרחקות הוא לא מהירות', anchor: 'closing-rate' }

- id: MC-9-classical-doppler
  title: אפקט דופלר של האור כמו של הקול
  belief: באור, כמו בקול, מקור שנע לקראת צופה נותן תדירות f₀/(1 − β), וצופה שנע לקראת מקור נותן f₀(1 + β).
  truth: לקול יש תווך, האוויר, ולכן יש הבדל בין מקור נע לצופה נע. לאור אין תווך, ורק המהירות היחסית קובעת. הנוסחה היחסותית, f = f₀√((1 + β)/(1 − β)) בהתקרבות, כוללת גם את התארכות הזמן, ונותנת תוצאה אחת לשני המקרים.
  remedy: { lesson: '9.4', label: 'שיעור 9.4: אפקט דופלר של האור ושל הקול', anchor: 'sound-contrast' }

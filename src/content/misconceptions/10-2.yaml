# Misconceptions first detected in lesson 10.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 10.2
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-10-energy-invariant
  title: האנרגיה זהה בכל מערכות הייחוס
  belief: מכיוון שאנרגיה נשמרת, לחלקיק יש אותה אנרגיה בכל מערכת ייחוס.
  truth: שימור הוא שוויון בין לפני לאחרי בתוך מערכת אחת. האנרגיה היא הרכיב הראשון של ארבעה-וקטור, ולכן היא משתנה בין מערכות, כמו ct. מה שזהה בכל המערכות הוא E² − (pc)² = (mc²)².
  remedy: { lesson: '10.2', label: 'שיעור 10.2: טרנספורמציית לורנץ של ארבעה-וקטור האנרגיה-תנע' }

- id: MC-10-mass-additive
  title: מסה של מערכת היא סכום המסות של חלקיה
  belief: המסה של מערכת חלקיקים, או של גוף מורכב, היא תמיד סכום המסות של החלקיקים שבה.
  truth: המסה של מערכת נקבעת מהאנרגיה ומהתנע הכוללים, Mc² = √(E² − (pc)²). היא כוללת את האנרגיה הקינטית של החלקיקים במערכת מרכז המסה ואת אנרגיית הקשר ביניהם. שני פוטונים, שלכל אחד מהם מסה אפס, יכולים להיות מערכת בעלת מסה.
  remedy: { lesson: '10.2', label: 'שיעור 10.2: המסה האינווריאנטית של מערכת' }

- id: MC-10-available-is-lab-energy
  title: כל האנרגיה במעבדה זמינה ליצירת חלקיקים
  belief: בהתנגשות, האנרגיה שעומדת לרשות יצירת חלקיקים היא האנרגיה הכוללת שנמדדת במעבדה.
  truth: התנע הכולל נשמר, ולכן החלקיקים בסוף התהליך חייבים לשאת אותו. האנרגיה הזמינה היא האנרגיה במערכת מרכז המסה, √s, שקטנה בהרבה מהאנרגיה במעבדה כשמטרה נייחת נפגעת בקרן מהירה.
  remedy: { lesson: '10.2', label: 'שיעור 10.2: האנרגיה במערכת מרכז המסה מתוך האינווריאנט' }

# Misconceptions first detected in lesson 1.5 (some of them by the chapter's review problems). Each is
# detected by at least one distractor (its `misconception:` tag) and has a remedy: the place in the
# course that refutes it. Until lesson 1.5 is written, the remedy link leads to its comprehension ladder
# on the chapter practice page.

- id: MC-1-relative-velocity-added
  title: מהירות יחסית מתקבלת בחיבור המהירויות
  belief: המהירות של A ביחס ל-B היא סכום המהירויות של A ושל B ביחס לקרקע.
  truth: המהירות של A ביחס ל-B היא ההפרש, v_A − v_B. מהמכונית, גשם שיורד אנכית נראה מגיע מלפנים, כי למכונית מוסיפים את מינוס המהירות שלה.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: מהירות יחסית כהפרש של וקטורים' }

- id: MC-1-dropped-object-lags
  title: גוף שמשחררים בכלי רכב נע נופל מאחור
  belief: כדור שמשחררים ברכבת נוסעת נופל מאחורי נקודת השחרור, כי הרכבת ממשיכה קדימה והכדור "נשאר מאחור".
  truth: ברגע השחרור לכדור יש אותה מהירות אופקית כמו לרכבת, ואין לו תאוצה אופקית. ברכבת שנוסעת במהירות קבועה הוא נופל אנכית, מתחת לנקודת השחרור.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: כדור שנופל ברכבת, משתי מערכות ייחוס' }

- id: MC-1-acceleration-depends-on-frame
  title: התאוצה תלויה במערכת הייחוס גם כשהמערכות נעות במהירות קבועה
  belief: צופה על הרציף ונוסע ברכבת שנוסעת במהירות קבועה מודדים תאוצות שונות לאותו גוף, כי הם מודדים מהירויות שונות.
  truth: המהירויות שונות בווקטור קבוע, V. הנגזרת של וקטור קבוע אפס, ולכן התאוצות זהות בכל המערכות שנעות זו ביחס לזו במהירות קבועה.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: הגזירה של טרנספורמציית גליליי' }

- id: MC-1-any-frame-is-galilean
  title: התאוצה זהה בכל מערכת ייחוס
  belief: מכיוון שתאוצה לא תלויה במערכת, אפשר להשתמש בחוקי התנועה הרגילים גם במערכת שמאיצה, כמו מעלית או רכב שבולם.
  truth: התאוצה זהה רק במערכות שנעות זו ביחס לזו במהירות קבועה. אם המערכת מאיצה בתאוצה A, התאוצה בה היא a − A, ופרק 7 עוסק בתוצאות.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: מה משתנה כשהמהירות בין המערכות לא קבועה' }

- id: MC-1-current-delays-crossing
  title: זרם בנהר מאריך את חציית הנהר
  belief: סירה שמכוונת ישר לגדה השנייה חוצה את הנהר לאט יותר כשיש זרם, כי הזרם מזיז אותה הצידה.
  truth: הזרם מזיז את הסירה במקביל לגדות ולא משנה את רכיב המהירות שלה לרוחב הנהר. זמן החצייה הוא רוחב הנהר חלקי הרכיב הזה, עם זרם או בלי.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: חציית נהר' }

- id: MC-1-wind-cancels-round-trip
  title: בטיסה הלוך-חזור ההשפעה של הרוח מתבטלת
  belief: מה שהרוח מוסיפה בכיוון אחד היא מחסירה בכיוון השני, ולכן טיסה הלוך-חזור ברוח נמשכת כמו בלי רוח.
  truth: ברוח מכל כיוון טיסה הלוך-חזור ארוכה יותר. ברוח נגדית המטוס מבלה יותר זמן בקטע האיטי, וברוח צד הוא מבזבז חלק מהמהירות כדי לבטל את הסחיפה.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: מטוס ברוח' }

- id: MC-1-velocity-forces-break-invariance
  title: כוחות שתלויים במהירות שונים במערכות שונות
  belief: כוח גרר תלוי במהירות, והמהירות שונה בין מערכות ייחוס, ולכן החוק השני לא יכול להיות נכון בשתיהן.
  truth: הגרר תלוי במהירות של הגוף ביחס לאוויר. זו מהירות יחסית בין שני גופים, והיא זהה בכל המערכות שנעות זו ביחס לזו במהירות קבועה.
  remedy: { lesson: '1.5', label: 'שיעור 1.5: למה החוק השני זהה בכל המערכות האלה' }

# Misconceptions first detected in lesson 8.8. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-8-L-parallel-omega
  title: התנע הזוויתי תמיד מקביל למהירות הזוויתית
  belief: לגוף צפיד L = Iω עם I מספר, ולכן L תמיד בכיוון ω, וסיבוב במהירות זוויתית קבועה לא צריך מומנט.
  truth: L = Iω עם I טנזור. L מקביל ל-ω רק בסיבוב סביב ציר ראשי. סביב ציר אחר L נטוי ממנו ומסתובב איתו, והמסבים צריכים להפעיל מומנט ω × L.
  remedy: { lesson: '8.8', label: 'שיעור 8.8: משקולת נטויה שמסתובבת סביב ציר קבוע' }

- id: MC-8-gyroscope-falls
  title: מומנט הכובד מפיל את הג׳ירוסקופ
  belief: ג׳ירוסקופ שנתמך בקצה אחד של צירו ייפול, כמו כל גוף שנתמך רק בצד אחד.
  truth: מומנט הכובד ניצב ל-L, ולכן הוא משנה את כיוון L ולא את גודלו. כשהסיבוב מהיר, הציר נע הצידה במעגל אופקי, בנקיפה, ולא נופל.
  remedy: { lesson: '8.8', label: 'שיעור 8.8: הכיוון של dL בג׳ירוסקופ' }

- id: MC-8-precession-proportional-to-spin
  title: נקיפה מהירה יותר כשהסיבוב מהיר יותר
  belief: ככל שסביבון מסתובב מהר יותר, גם הנקיפה שלו מהירה יותר, וכשהוא מאט היא מאטה.
  truth: קצב הנקיפה Ω = mgr/(Iω) ביחס הפוך לסיבוב העצמי. סביבון שמאט נוקף מהר יותר, עד שהקירוב של סביבון מהיר נשבר.
  remedy: { lesson: '8.8', label: 'שיעור 8.8: קצב הנקיפה של סביבון מהיר' }

- id: MC-8-gyroscope-defies-gravity
  title: ג׳ירוסקופ מסתובב שוקל פחות
  belief: הסיבוב מחזיק את הג׳ירוסקופ באוויר, ולכן העמוד או החוט שמחזיקים אותו נושאים פחות ממשקלו.
  truth: מרכז המסה לא עולה ולא יורד, ולכן הכוח האנכי של התמיכה שווה למשקל, Mg. הסיבוב רק מונע מהגוף להסתובב ולהיפול, כי מומנט הכובד משנה את כיוון L.
  remedy: { lesson: '8.8', label: 'שיעור 8.8: הכוחות על ג׳ירוסקופ בנקיפה' }

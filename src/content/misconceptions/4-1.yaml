# Misconceptions first detected in lesson 4.1. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until the lesson is
# written, the remedy link leads to its comprehension ladder on the chapter practice page. The 4.1 remedies
# and the 4.2 remedies point at an anchor (a step of the lesson) that refutes them.

- id: MC-4-equal-masses-share
  title: מסות שוות חולקות את המהירות
  belief: כשגוף פוגע התנגשות אלסטית בגוף שמסתו שווה לשלו ושעומד במנוחה, שניהם ממשיכים יחד בחצי המהירות.
  truth: בהתנגשות אלסטית של מסות שוות הגופים מחליפים מהירויות, והפוגע נעצר. תנועה משותפת בחצי המהירות היא התנגשות פלסטית, שבה מחצית מהאנרגיה הקינטית אובדת.
  remedy: { lesson: '4.1', anchor: equal-masses, label: 'שיעור 4.1: התנגשות אלסטית של מסות שוות' }

- id: MC-4-ke-always-conserved
  title: אנרגיה קינטית נשמרת בכל התנגשות
  belief: כמו התנע, גם האנרגיה הקינטית הכוללת נשמרת בכל התנגשות.
  truth: התנע נשמר בכל התנגשות שבה המתקף של הכוחות החיצוניים זניח. האנרגיה הקינטית נשמרת רק בהתנגשות אלסטית; בכל התנגשות אחרת חלק ממנה הופך לחום ולעיוות.
  remedy: { lesson: '4.1', anchor: energy-loss, label: 'שיעור 4.1: מקדם התקומה והאנרגיה שאובדת' }

- id: MC-4-all-ke-lost
  title: בהתנגשות פלסטית כל האנרגיה הקינטית אובדת
  belief: בהתנגשות פלסטית הגופים נעצרים, וכל האנרגיה הקינטית שלהם, או כל האנרגיה של הגוף הפוגע, הופכת לחום ולעיוות.
  truth: התנע נשמר, ולכן מרכז המסה ממשיך לנוע והאנרגיה שלו, חצי המסה הכוללת כפול ריבוע מהירות מרכז המסה, נשארת. אובדת לכל היותר האנרגיה של התנועה היחסית, חצי המסה המצומצמת כפול ריבוע המהירות היחסית.
  remedy: { lesson: '4.2', anchor: available, label: 'שיעור 4.2: האנרגיה של מרכז המסה והאנרגיה היחסית' }

- id: MC-4-vcm-plain-average
  title: מהירות מרכז המסה היא ממוצע המהירויות
  belief: מהירות מרכז המסה של שני גופים, וגם המהירות המשותפת שלהם אחרי התנגשות פלסטית, היא הממוצע הפשוט של המהירויות שלהם.
  truth: מהירות מרכז המסה היא ממוצע משוקלל במסות, התנע הכולל חלקי המסה הכוללת. היא שווה לממוצע הפשוט רק כשהמסות שוות.
  remedy: { lesson: '4.2', anchor: vcm, label: 'שיעור 4.2: מהירות מרכז המסה' }

- id: MC-4-separation-depends-on-masses
  title: מהירות ההתרחקות תלויה במסות
  belief: אחרי התנגשות אלסטית, המהירות שבה הגופים מתרחקים זה מזה תלויה במסות שלהם.
  truth: בהתנגשות אלסטית חזיתית המהירות היחסית מתהפכת, לכל זוג מסות. המסות קובעות איך מתחלקות המהירויות, לא את ההפרש ביניהן.
  remedy: { lesson: '4.1', anchor: relative-reversal, label: 'שיעור 4.1: המהירות היחסית מתהפכת' }

- id: MC-4-light-target-same-speed
  title: גוף קל שנפגע מגוף כבד נע במהירות של הכבד
  belief: כשגוף כבד מאוד פוגע התנגשות אלסטית בגוף קל שעומד, הגוף הקל ממשיך באותה מהירות שהייתה לגוף הכבד.
  truth: הגוף הכבד כמעט לא מאט, והמהירות היחסית מתהפכת, ולכן הגוף הקל נע בכמעט פי שניים ממהירות הגוף הכבד.
  remedy: { lesson: '4.1', anchor: heavy-frame, label: 'שיעור 4.1: גוף כבד שפוגע בגוף קל' }

- id: MC-4-moving-wall-same-speed
  title: מקיר נע חוזרים באותה מהירות
  belief: כדור שפוגע התנגשות אלסטית בקיר כבד חוזר תמיד באותה מהירות שבה הגיע, גם כשהקיר נע.
  truth: נשמרת המהירות של הכדור יחסית לקיר. כשהקיר נע לקראת הכדור, הכדור חוזר מהר יותר בפעמיים מהירות הקיר, וכשהקיר מתרחק, לאט יותר.
  remedy: { lesson: '4.1', anchor: heavy-frame, label: 'שיעור 4.1: התנגשות במערכת הייחוס של הגוף הכבד' }

- id: MC-4-loss-set-by-total-ke
  title: ככל שיש יותר אנרגיה, יותר ממנה אובדת
  belief: האנרגיה הקינטית שאובדת בהתנגשות פלסטית נקבעת על ידי האנרגיה הכוללת, ולכן גוף כבד ומהיר שפוגע בגוף קל מאבד את רוב האנרגיה שלו.
  truth: האנרגיה שאובדת תלויה רק במהירות היחסית ובמסה המצומצמת. גוף כבד שפוגע בגוף קל שעומד ממשיך לנוע ושומר את רוב האנרגיה שלו.
  remedy: { lesson: '4.2', anchor: trucks, label: 'שיעור 4.2: האנרגיה שזמינה בהתנגשות' }

- id: MC-4-restitution-is-height-ratio
  title: מקדם התקומה הוא יחס הגבהים
  belief: כשכדור מקפץ על רצפה, מקדם התקומה הוא היחס בין גובה הקפיצה לגובה הקודם.
  truth: מקדם התקומה הוא יחס בין מהירויות. הגובה פרופורציוני לריבוע המהירות, ולכן בכל קפיצה הגובה קטן פי ריבוע מקדם התקומה, וזמן המעוף פי מקדם התקומה עצמו.
  remedy: { lesson: '4.1', anchor: bouncing, label: 'שיעור 4.1: כדור שמקפץ' }

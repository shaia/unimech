# Misconceptions first detected in lesson 10.1. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 10.1
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-10-newtonian-momentum
  title: התנע הוא mv בכל מהירות
  belief: התנע של גוף הוא מסה כפול מהירות גם קרוב למהירות האור, ולכן הוא חסום על ידי mc.
  truth: התנע היחסותי הוא p = γmv. כש-v מתקרב ל-c גורם לורנץ שואף לאינסוף, והתנע גדל בלי גבול בעוד שהמהירות נשארת קטנה מ-c.
  remedy: { lesson: '10.1', label: 'שיעור 10.1: התנע היחסותי והגבול שלו במהירויות נמוכות' }

- id: MC-10-classical-ke
  title: האנרגיה הקינטית היא ½mv² בכל מהירות
  belief: האנרגיה הקינטית של גוף היא חצי מסה כפול ריבוע המהירות, גם קרוב למהירות האור.
  truth: האנרגיה הקינטית היא K = (γ − 1)mc². הביטוי ½mv² הוא האיבר הראשון בפיתוח שלה, והוא נכון רק כש-v ≪ c. כשהמהירות מתקרבת ל-c, K שואפת לאינסוף.
  remedy: { lesson: '10.1', label: 'שיעור 10.1: האנרגיה הקינטית היחסותית ופיתוח טיילור שלה' }

- id: MC-10-total-vs-kinetic
  title: האנרגיה היחסותית היא האנרגיה הקינטית
  belief: E = γmc² היא האנרגיה הקינטית של הגוף, או שאנרגיה קינטית ואנרגיה כוללת הן אותו דבר.
  truth: E = γmc² היא האנרגיה הכוללת, וגם גוף נח מחזיק אנרגיית מנוחה mc². האנרגיה הקינטית היא ההפרש, K = E − mc².
  remedy: { lesson: '10.1', label: 'שיעור 10.1: אנרגיית מנוחה, אנרגיה יחסותית ואנרגיה קינטית' }

- id: MC-10-massless-no-momentum
  title: לחלקיק חסר מסה אין תנע
  belief: מכיוון שהתנע הוא מסה כפול מהירות, לחלקיק בלי מסה, כמו פוטון או נייטרינו, אין תנע.
  truth: מהקשר E² = (pc)² + (mc²)² עם m = 0 מקבלים p = E/c. לחלקיק חסר מסה יש תנע, והוא נשמר בהתנגשויות ובדעיכות כמו כל תנע אחר.
  remedy: { lesson: '10.1', label: 'שיעור 10.1: הקשר בין אנרגיה, תנע ומסה עבור m = 0' }

- id: MC-10-massless-speed-varies
  title: מהירות של חלקיק חסר מסה תלויה באנרגיה שלו
  belief: פוטון או חלקיק חסר מסה אחר עם אנרגיה קטנה נע לאט יותר, או מאבד מהירות כשהוא מאבד אנרגיה.
  truth: לחלקיק חסר מסה E = pc, ולכן v = pc²/E = c בכל אנרגיה. כשפוטון מאבד אנרגיה, קטנים התנע שלו והתדירות שלו, לא המהירות.
  remedy: { lesson: '10.1', label: 'שיעור 10.1: המהירות v = pc²/E של חלקיק חסר מסה' }

- id: MC-10-relativistic-mass
  title: המסה של גוף גדלה עם המהירות
  belief: גוף מהיר כבד יותר, ומסתו γm. לכן קשה להאיץ אותו, ולכן אי אפשר להגיע ל-c.
  truth: 'המסה m של גוף זהה בכל מערכת ייחוס. גורם לורנץ שייך לתנע ולאנרגיה, p = γmv ו-E = γmc². אין גם מסה אחת שכופלים בתאוצה: כשהכוח מקביל למהירות F = γ³ma, וכשהוא ניצב לה F = γma.'
  remedy: { lesson: '10.1', label: 'שיעור 10.1: מסה אחת לכל גוף, וגורם לורנץ בתנע ובאנרגיה' }

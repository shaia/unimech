# Misconceptions first detected in lesson 7.1. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 7.1
# is written, the remedy link leads to its comprehension ladder on the chapter practice page. Anchors
# (added with the lesson) are Explain, Step and Example ids of lesson 7.1.

- id: MC-7-fictitious-along-acceleration
  title: הכוח המדומה פונה בכיוון התאוצה של המערכת
  belief: כשמכונית מאיצה קדימה, הכוח המדומה על הנוסע פונה קדימה, יחד עם התאוצה.
  truth: הכוח המדומה הוא מינוס המסה כפול תאוצת המערכת, ולכן הוא פונה הפוך לתאוצה. במכונית שמאיצה קדימה הנוסע נלחץ לאחור.
  remedy: { lesson: '7.1', anchor: no-agent, label: 'שיעור 7.1: מה מיוחד בכוח המדומה' }

- id: MC-7-fictitious-has-reaction
  title: לכוח המדומה יש זוג לפי החוק השלישי
  belief: גם הכוח המדומה הוא אינטראקציה בין שני גופים, ולפי החוק השלישי פועל כוח שווה והפוך לו על גוף אחר.
  truth: אף גוף לא מפעיל את הכוח המדומה. הוא נובע מבחירה במערכת ייחוס מואצת, ולכן אין לו זוג כוחות של החוק השלישי. החוק השלישי חל רק על הכוחות האמיתיים.
  remedy: { lesson: '7.1', anchor: no-agent, label: 'שיעור 7.1: לכוח המדומה אין גוף מפעיל ואין לו זוג לפי החוק השלישי' }

- id: MC-7-fictitious-force-in-inertial-frame
  title: כוחות מדומים פועלים גם במערכת אינרציאלית
  belief: הכוח שזורק נוסע לאחור, או הכוח הצנטריפוגלי שזורק גוף החוצה, הוא כוח אמיתי שכל צופה רואה.
  truth: כוחות מדומים קיימים רק במשוואות של מערכת לא-אינרציאלית. במערכת אינרציאלית אותה תנועה מוסברת בהתמד, בלי שום כוח נוסף.
  remedy: { lesson: '7.1', anchor: two-frames, label: 'שיעור 7.1: אותה משקולת בשתי מערכות ייחוס' }

- id: MC-7-scale-follows-velocity
  title: המאזניים במעלית מגיבים לכיוון התנועה
  belief: במעלית שיורדת המאזניים מראים פחות מהמשקל, ובמעלית שעולה יותר, בלי קשר לתאוצה.
  truth: הקריאה תלויה רק בתאוצה של המעלית. במהירות קבועה היא שווה למשקל, ומעלית שיורדת ומאטה מראה יותר מהמשקל.
  remedy: { lesson: '7.1', anchor: scale, label: 'שיעור 7.1: מאזניים במעלית' }

- id: MC-7-balloon-moves-back
  title: במכונית מאיצה הכול נוטה לאחור
  belief: בלון הליום במכונית שמאיצה קדימה נוטה לאחור, כמו הנוסעים וכמו משקולת תלויה.
  truth: האוויר במכונית נדחק לאחור, והעילוי על הבלון פונה הפוך לתאוצת הנפילה האפקטיבית, כלומר מעלה וקדימה. הבלון נוטה קדימה.
  remedy: { lesson: '7.1', anchor: ex-7-1-4, label: 'שיעור 7.1: נוזל וכוח עילוי במשאית מאיצה' }

- id: MC-7-equivalence-detectable
  title: אפשר להבחין בין כובד לתאוצה בניסוי מקומי
  belief: בתא סגור אפשר לגלות בניסוי מכני פשוט, למשל במאזניים או במטוטלת, אם התא עומד בשדה כובד או מאיץ בחלל.
  truth: הכוח המדומה פרופורציוני למסה כמו הכובד, ולכן כל ניסוי מכני מקומי נותן אותה תוצאה בשני המקרים. זה עקרון השקילות.
  remedy: { lesson: '7.1', anchor: equivalence, label: 'שיעור 7.1: עקרון השקילות' }

- id: MC-7-g-eff-adds-scalars
  title: תאוצת הנפילה האפקטיבית היא סכום של מספרים
  belief: בקרון שמאיץ אופקית, תאוצת הנפילה האפקטיבית היא g + A או g − A.
  truth: תאוצת הנפילה האפקטיבית היא הסכום הווקטורי של g ושל מינוס A. בתאוצה אופקית הם ניצבים, והגודל הוא שורש סכום הריבועים.
  remedy: { lesson: '7.1', anchor: g-eff, label: 'שיעור 7.1: תאוצת הנפילה האפקטיבית כסכום וקטורי' }

# Misconceptions first detected in lesson 2.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 2.4
# is written, the remedy link leads to its comprehension ladder on the chapter practice page. Lesson 2.4 is
# written: each remedy's anchor is a step of the lesson (a <Step id>) that refutes the belief.

- id: MC-2-static-friction-always-max
  title: החיכוך הסטטי תמיד שווה ל-μsN
  belief: על גוף במנוחה פועל תמיד חיכוך סטטי בגודל μsN.
  truth: μsN הוא רק הערך המרבי של החיכוך הסטטי. עד הערך הזה החיכוך מקבל בדיוק את הערך שהחוק השני דורש כדי שלא תהיה החלקה, מאפס ועד μsN.
  remedy: { lesson: '2.4', anchor: static-ceiling, label: 'שיעור 2.4: החיכוך הסטטי כנעלם עם ערך מרבי (איור 2.4א)' }

- id: MC-2-kinetic-when-at-rest
  title: חיכוך קינטי על גוף שלא מחליק
  belief: אפשר לחשב את החיכוך על גוף במנוחה, או על גוף שנע יחד עם המשטח, בעזרת μk.
  truth: חיכוך קינטי פועל רק כשיש החלקה בין המשטחים. כל עוד אין החלקה, החיכוך סטטי, והערך המרבי שלו הוא μsN.
  remedy: { lesson: '2.4', anchor: which-friction, label: 'שיעור 2.4: איך יודעים איזה חיכוך פועל' }

- id: MC-2-friction-opposes-motion
  title: חיכוך תמיד נגד כיוון התנועה
  belief: כוח החיכוך על גוף תמיד הפוך לכיוון התנועה שלו.
  truth: חיכוך מתנגד להחלקה היחסית בין שני משטחים, לא לתנועה ביחס לקרקע. ארגז על משאית שמאיצה, והנעל של מי שהולך, מקבלים חיכוך בכיוון התנועה, והוא מה שמאיץ אותם.
  remedy: { lesson: '2.4', anchor: stack-forward, label: 'שיעור 2.4: הגוש העליון נגרר קדימה בחיכוך (איור 2.4ג)' }

- id: MC-2-no-friction-without-sliding
  title: בלי החלקה אין חיכוך
  belief: אם שני משטחים לא מחליקים זה על זה, אין ביניהם חיכוך.
  truth: חיכוך סטטי פועל דווקא כשאין החלקה, כדי למנוע אותה. גוף שמאיץ יחד עם משטח, או שנח על מדרון, מחזיק בזכותו.
  remedy: { lesson: '2.4', anchor: stack-forward, label: 'שיעור 2.4: גושים שנעים יחד, בלי החלקה ועם חיכוך (איור 2.4ג)' }

- id: MC-2-heavier-slips-sooner
  title: המסה קובעת את זווית הסף
  belief: גוף כבד מתחיל להחליק על מדרון בזווית אחרת מגוף קל מאותו חומר.
  truth: גם הכוח במורד וגם החיכוך המרבי פרופורציוניים למסה, ולכן היא מצטמצמת. זווית הסף, tan θ = μs, תלויה רק במשטחים.
  remedy: { lesson: '2.4', anchor: threshold, label: 'שיעור 2.4: זווית הסף, והמסה שמצטמצמת (איור 2.4ב)' }

- id: MC-2-max-force-is-friction-limit
  title: הכוח המרבי על גושים מונחים הוא החיכוך המרבי
  belief: הכוח המרבי שבו גושים מונחים זה על זה עוד נעים יחד שווה לחיכוך המרבי ביניהם, ולא משנה על איזה גוש מושכים.
  truth: החיכוך מגביל את התאוצה של הגוש שהוא היחיד שמאיץ. הכוח החיצוני צריך להאיץ את שני הגושים בתאוצה הזו, ולכן הוא תלוי בשתי המסות ובגוש שמושכים.
  remedy: { lesson: '2.4', anchor: pull-top, label: 'שיעור 2.4: מושכים את הגוש העליון במקום את התחתון' }

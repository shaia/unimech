# Misconceptions first detected in lesson 3.6. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-3-exhaust-speed-ground-frame
  title: מהירות הפליטה נמדדת ביחס לקרקע
  belief: הגזים שיוצאים מרקטה נעים אחורה במהירות u ביחס למערכת האינרציאלית, בכל מהירות של הרקטה.
  truth: u היא מהירות הגזים ביחס לרקטה. ביחס למערכת האינרציאלית מהירותם v − u, ובשימור התנע צריך לכתוב אותה כך.
  remedy: { lesson: '3.6', label: 'שיעור 3.6: גזירת משוואת הרקטה בפרק זמן קצר', anchor: derivation }

- id: MC-3-thrust-means-delta-v
  title: דחף גדול יותר נותן שינוי מהירות גדול יותר
  belief: רקטה ששורפת את אותו דלק מהר יותר, ולכן בדחף גדול יותר, מגיעה למהירות סופית גדולה יותר.
  truth: בחלל השינוי במהירות הוא u·ln(m₀/m), ואינו תלוי בקצב השריפה. דחף גדול פועל זמן קצר יותר, והמתקף זהה.
  remedy: { lesson: '3.6', label: 'שיעור 3.6: משוואת הרקטה בחלל', anchor: rate-same }

- id: MC-3-gravity-loss-ignored
  title: הכובד לא משנה את מהירות הרקטה בזמן השריפה
  belief: גם ליד כדור הארץ מהירות הרקטה בסוף השריפה היא u·ln(m₀/m).
  truth: הכובד מוסיף מתקף −Mg·dt בכל רגע, ולכן בשיגור אנכי v = u·ln(m₀/m) − g·t_b. שריפה ארוכה מפסידה יותר.
  remedy: { lesson: '3.6', label: 'שיעור 3.6: רקטה בשדה כובד', anchor: gravity }

- id: MC-3-constant-velocity-no-force
  title: במהירות קבועה לא צריך כוח, גם כשהמסה גדלה
  belief: אם עגלה או מסוע נעים במהירות קבועה, הכוח השקול עליהם אפס, גם כשנוספת אליהם מסה.
  truth: החוק השני הוא F = dP/dt. כשנוספת מסה שצריכה להאיץ למהירות של העגלה, התנע גדל, ונדרש כוח v·dm/dt.
  remedy: { lesson: '3.6', label: 'שיעור 3.6: עגלה שמתמלאת בחול', anchor: sand-cart }

- id: MC-3-belt-power-equals-ke-rate
  title: הספק המנוע שווה לקצב העלייה באנרגיה הקינטית
  belief: מנוע של מסוע שעליו נופל חצץ מספק בדיוק את קצב העלייה באנרגיה הקינטית של החצץ, ½v²·dm/dt.
  truth: המנוע מספק v²·dm/dt, פי 2. המחצית השנייה הופכת לחום בזמן שהחצץ מחליק על המסוע, בכל מקדם חיכוך.
  remedy: { lesson: '3.6', label: 'שיעור 3.6: ההספק של מסוע', anchor: power }

- id: MC-3-fdmvdt-blind
  title: F = d(Mv)/dt לגוף שמסתו משתנה, בלי לשאול מאיפה המסה באה ולאן היא הולכת
  belief: לגוף שמסתו משתנה החוק השני הוא F = d(Mv)/dt = M·dv/dt + v·dM/dt, ולכן עגלה שחול נשפך ממנה מאיצה, ורקטה בחלל מאיצה רק אם היא כבר נעה.
  truth: החוק השני חל על אוסף קבוע של חלקיקים. המסה שנכנסת או יוצאת מביאה או לוקחת תנע משלה, ולכן M·dv/dt = F + (w − v)·dM/dt, כש-w מהירות המסה הזו. חול שנשפך במהירות העגלה (w = v) לא משנה את מהירותה.
  remedy: { lesson: '3.6', label: 'שיעור 3.6: עגלה שחול נשפך ממנה', anchor: leak }

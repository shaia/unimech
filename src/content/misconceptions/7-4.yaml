# Misconceptions first detected in lesson 7.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 7.4
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-7-plumb-points-to-center
  title: האנך מצביע בדיוק אל מרכז כדור הארץ
  belief: חוט עם משקולת תלויה מצביע תמיד בדיוק אל מרכז כדור הארץ.
  truth: האנך מתיישר לאורך תאוצת הנפילה האפקטיבית, שכוללת את הכוח הצנטריפוגלי. בכל קו רוחב מלבד הקטבים וקו המשווה הוא נוטה מעט לכיוון קו המשווה, עד כעשירית מעלה בקו רוחב 45 מעלות.
  remedy: { lesson: '7.4', label: 'שיעור 7.4: תאוצת הנפילה האפקטיבית וכיוון האנך' }

- id: MC-7-falling-lands-west
  title: גוף נופל נוחת מערבה
  belief: בזמן שגוף נופל, כדור הארץ מסתובב מזרחה מתחתיו, ולכן הוא נוחת מעט מערבה מהנקודה שמתחתיו.
  truth: לפני השחרור הגוף נע מזרחה עם ראש המגדל, מהר יותר מבסיסו, ולכן הוא נוחת מזרחה. במערכת כדור הארץ את ההסטה הזו נותן כוח קוריוליס.
  remedy: { lesson: '7.4', label: 'שיעור 7.4: ההסטה מזרחה של גוף נופל' }

- id: MC-7-foucault-one-day-everywhere
  title: מטוטלת פוקו משלימה סיבוב ביום בכל מקום
  belief: מכיוון שכדור הארץ מסתובב פעם ביום, מישור התנודה של מטוטלת פוקו משלים סיבוב ביום אחד בכל מקום.
  truth: המישור מסתובב בקצב ω sin λ. רק בקטבים הוא משלים סיבוב ביום כוכבי אחד; בירושלים זה לוקח כ-45 שעות, ובקו המשווה הוא לא מסתובב.
  remedy: { lesson: '7.4', label: 'שיעור 7.4: מטוטלת פוקו בקווי רוחב שונים' }

- id: MC-7-coriolis-zero-at-equator
  title: בקו המשווה אין כוח קוריוליס
  belief: מכיוון שמטוטלת פוקו לא מסתובבת בקו המשווה, כוח קוריוליס מתאפס שם.
  truth: בקו המשווה מתאפס רק הרכיב האופקי של כוח קוריוליס על תנועה אופקית. גוף שנופל או עולה שם מוסט מזרחה או מערבה, וגוף שנע מזרחה נדחף מעלה.
  remedy: { lesson: '7.4', label: 'שיעור 7.4: הרכיב האנכי והרכיב האופקי של ω' }

- id: MC-7-cyclone-follows-deflection
  title: הסטה ימינה פירושה סיבוב עם כיוון השעון
  belief: מכיוון שבחצי הכדור הצפוני כוח קוריוליס מסיט ימינה, סערות שם מסתובבות עם כיוון השעון.
  truth: האוויר זורם פנימה אל הלחץ הנמוך ומוסט ימינה מכיוון זרימתו, ולכן הוא מקיף את המרכז נגד כיוון השעון.
  remedy: { lesson: '7.4', label: 'שיעור 7.4: כיוון הסיבוב של סופות' }

- id: MC-7-coriolis-sets-sink-drain
  title: סיבוב כדור הארץ קובע את כיוון הניקוז בכיור
  belief: כוח קוריוליס גורם למים בכיור להתנקז בחצי הכדור הצפוני תמיד נגד כיוון השעון.
  truth: בכיור, בזמנים של שניות ובמרחקים של סנטימטרים, כוח קוריוליס זניח לעומת התנועות שנשארות במים מהמילוי. הוא קובע את הכיוון רק בזרימות ענק שנמשכות שעות, כמו סערות.
  remedy: { lesson: '7.4', label: 'שיעור 7.4: מתי כוח קוריוליס חשוב' }

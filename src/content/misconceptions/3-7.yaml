# Misconceptions first detected in lesson 3.7. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-3-straight-line-no-L
  title: לגוף שנע בקו ישר אין תנע זוויתי
  belief: תנע זוויתי יש רק לגוף שמסתובב, ולגוף שנע בקו ישר הוא אפס.
  truth: L = r × p מוגדר ביחס לנקודה. לגוף שנע בקו ישר שאינו עובר דרך הנקודה יש תנע זוויתי mvd, כאשר d המרחק הניצב מהנקודה לקו.
  remedy: { lesson: '3.7', label: 'שיעור 3.7: תנע זוויתי של חלקיק בקו ישר' }

- id: MC-3-L-independent-of-origin
  title: התנע הזוויתי לא תלוי בנקודה שביחס אליה מודדים
  belief: לגוף יש תנע זוויתי אחד, אותו ביחס לכל נקודה.
  truth: גם L וגם τ תלויים בנקודה שנבחרה, כי r נמדד ממנה. יש לבחור נקודה אחת ולחשב ביחס אליה את שניהם.
  remedy: { lesson: '3.7', label: 'שיעור 3.7: תנע זוויתי ומומנט ביחס לנקודה' }

- id: MC-3-torque-along-force
  title: המומנט פונה בכיוון הכוח
  belief: המומנט של כוח הוא וקטור בכיוון הכוח, או בכיוון שבו הגוף מסתובב במישור.
  truth: τ = r × F ניצב גם ל-r וגם ל-F. כשהשניים במישור הדף, המומנט ניצב לדף, והכיוון שלו נקבע בכלל יד ימין.
  remedy: { lesson: '3.7', label: 'שיעור 3.7: מומנט כוח כמכפלה וקטורית' }

- id: MC-3-central-force-no-work
  title: כוח מרכזי לא עושה עבודה
  belief: כוח שפונה תמיד אל נקודה קבועה לא עושה עבודה, ולכן גודל המהירות לא משתנה.
  truth: כוח מרכזי ניצב למהירות רק בתנועה מעגלית. כשהגוף מתקרב או מתרחק מהמרכז, לכוח יש רכיב לאורך המהירות והוא עושה עבודה, כמו המתיחות כשמושכים חוט דרך חור.
  remedy: { lesson: '3.7', label: 'שיעור 3.7: דסקית על חוט שנמשך דרך חור' }

- id: MC-3-v-inverse-r-everywhere
  title: בכוח מרכזי המהירות הפוכה למרחק בכל נקודה
  belief: משימור התנע הזוויתי נובע ש-v ∝ 1/r בכל נקודה של המסלול.
  truth: נשמר r·v·sinα, כאשר α הזווית בין r ל-v. רק בנקודות שבהן המהירות ניצבת ל-r, כמו הנקודה הקרובה והרחוקה של אליפסה, v ∝ 1/r.
  remedy: { lesson: '3.7', label: 'שיעור 3.7: שימור תנע זוויתי בכוח מרכזי' }

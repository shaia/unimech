# Misconceptions first detected in lesson 1.1. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 1.1
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-1-constant-speed-no-acceleration
  title: גודל מהירות קבוע פירושו תאוצה אפס
  belief: אם מד המהירות מראה מספר קבוע, הגוף לא מאיץ.
  truth: תאוצה היא קצב השינוי של וקטור המהירות. כשהכיוון של המהירות משתנה, כמו בסיבוב, התאוצה שונה מאפס גם כשגודל המהירות קבוע.
  remedy: { lesson: '1.1', label: 'שיעור 1.1: גזירה של וקטור מקום רכיב-רכיב' }

- id: MC-1-speed-is-rate-of-distance
  title: גודל המהירות הוא קצב השינוי של המרחק מהראשית
  belief: גודל המהירות הוא הנגזרת של המרחק |r| של הגוף מהראשית.
  truth: גודל המהירות הוא |dr/dt|, הגודל של הנגזרת של וקטור המקום, ולא d|r|/dt. גוף שנע על מעגל סביב הראשית שומר על מרחק קבוע ממנה, ובכל זאת נע.
  remedy: { lesson: '1.1', label: 'שיעור 1.1: וקטור המהירות מול גודל המהירות' }

- id: MC-1-acceleration-is-speed-rate
  title: גודל התאוצה הוא קצב השינוי של גודל המהירות
  belief: גודל התאוצה שווה ל-d|v|/dt.
  truth: d|v|/dt הוא רק הרכיב של התאוצה לאורך המהירות. לתאוצה יש גם רכיב ניצב למהירות, שמשנה את הכיוון שלה, וגודל התאוצה כולל את שניהם.
  remedy: { lesson: '1.1', label: 'שיעור 1.1: התאוצה כנגזרת של וקטור המהירות' }

- id: MC-1-constant-acceleration-formulas-always
  title: נוסחאות התאוצה הקבועה תמיד נכונות
  belief: אפשר תמיד לחשב מקום בנוסחה x = x₀ + v₀t + ½at², גם כשהתאוצה משתנה, אם מציבים בה את התאוצה של הרגע.
  truth: הנוסחה היא תוצאה של אינטגרציה של תאוצה קבועה. כשהתאוצה תלויה בזמן, במקום או במהירות, מבצעים את האינטגרציה מחדש.
  remedy: { lesson: '1.1', label: 'שיעור 1.1: שחזור מהירות ומקום מתאוצה באינטגרציה' }

- id: MC-1-acceleration-fixes-motion
  title: התאוצה לבדה קובעת את התנועה
  belief: שני גופים עם אותה פונקציית תאוצה נעים באותה צורה.
  truth: התאוצה קובעת את המהירות ואת המקום רק עד כדי קבועי אינטגרציה. את הקבועים קובעים תנאי ההתחלה, ושני גופים עם אותה תאוצה ותנאי התחלה שונים נעים אחרת.
  remedy: { lesson: '1.1', label: 'שיעור 1.1: תנאי התחלה וקבועי אינטגרציה' }

- id: MC-1-slowing-body-stops
  title: גוף שמאט כל הזמן חייב להיעצר
  belief: אם התאוצה של גוף מנוגדת כל הזמן למהירות שלו, הוא נעצר אחרי זמן סופי ומרחק סופי.
  truth: כשההאטה נחלשת יחד עם המהירות, המהירות יכולה לשאוף לאפס בלי להתאפס, והמרחק יכול לגדול בלי גבול. רק אינטגרציה של התנועה אומרת אם הגוף נעצר.
  remedy: { lesson: '1.1', label: 'שיעור 1.1: תאוצה שתלויה במהירות' }

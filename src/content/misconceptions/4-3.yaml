# Misconceptions first detected in lesson 4.3. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. The anchors point at
# element ids in src/content/lessons/ch4/4-3-collisions-2d.mdx (Step ids and an Example id).

- id: MC-4-momentum-enough-2d
  title: חוקי השימור קובעים לבד התנגשות במישור
  belief: כמו בממד אחד, שימור התנע ושימור האנרגיה מספיקים כדי לחשב את תוצאת ההתנגשות בשני ממדים.
  truth: בשני ממדים יש ארבעה נעלמים, שני רכיבים לכל מהירות, ולכל היותר שלוש משוואות שימור. צריך עוד נתון, כמו זווית היציאה של אחד הגופים, שתלוי במקום שבו הגופים נגעו.
  remedy: { lesson: '4.3', anchor: counting, label: 'שיעור 4.3: ספירת הנעלמים והמשוואות' }

- id: MC-4-speeds-add-like-scalars
  title: גודלי התנעים מתחברים כמספרים
  belief: בהתנגשות במישור, סכום הגדלים של התנעים אחרי ההתנגשות שווה לגודל התנע לפניה.
  truth: התנע הוא וקטור, וכל רכיב שלו נשמר בנפרד. גודלי התנעים מתחברים כמו וקטורים, ולכן סכום הגדלים אחרי ההתנגשות גדול בדרך כלל מגודל התנע הכולל.
  remedy: { lesson: '4.3', anchor: magnitudes, label: 'שיעור 4.3: גדלים לא מתחברים כמספרים' }

- id: MC-4-direction-from-velocities
  title: הכיוון אחרי ההתנגשות נקבע לפי המהירויות
  belief: גופים שנצמדים בהתנגשות במישור נעים בכיוון שנקבע על ידי היחס בין המהירויות שלהם לפני ההתנגשות.
  truth: הכיוון נקבע על ידי התנע הכולל, ולכן כל מהירות נשקלת במסה של הגוף שלה. גוף איטי וכבד יכול לקבוע את הכיוון יותר מגוף מהיר וקל.
  remedy: { lesson: '4.3', anchor: ex-4-3-2, label: 'שיעור 4.3: שתי דיסקיות שנצמדות' }

- id: MC-4-equal-masses-always-90
  title: מסות שוות תמיד נפרדות בזווית ישרה
  belief: אחרי כל התנגשות של שני גופים בעלי מסה שווה, הם נעים בזווית ישרה זה לזה; ובכלל, זווית הפיזור יכולה להגיע ל-90 מעלות.
  truth: הזווית הישרה מתקבלת רק בהתנגשות אלסטית שאינה חזיתית, כשאחד הגופים עומד. בהתנגשות לא אלסטית הזווית קטנה יותר. כשהמסות שונות והפוגע כבד, זווית הפיזור שלו מוגבלת, ו-sin θmax = m₂/m₁.
  remedy: { lesson: '4.3', anchor: inelastic-angle, label: 'שיעור 4.3: מתי הזווית הישרה לא נכונה' }

- id: MC-4-any-scattering-angle
  title: אפשר לפזר גוף לכל זווית
  belief: אם מכוונים את הפגיעה נכון, הגוף הפוגע יכול להיות מוסט לכל זווית, גם לאחור, בלי קשר למסות.
  truth: כשהפוגע כבד מהמטרה, מרכז המסה נע קדימה מהר יותר ממה שהפוגע נע ביחס אליו, ולכן הפוגע ממשיך תמיד קדימה, בזווית שאינה עולה על θmax, עם sin θmax = m₂/m₁. רק פוגע קל מהמטרה יכול להירתע לכל כיוון.
  remedy: { lesson: '4.3', anchor: theta-max-angle, label: 'שיעור 4.3: זווית הפיזור המרבית' }

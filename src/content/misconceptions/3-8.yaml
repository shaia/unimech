# Misconceptions first detected in lesson 3.8. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-3-weak-third-law-enough
  title: די בכך שהכוחות הפנימיים שווים והפוכים כדי שלא יתרמו מומנט
  belief: כוחות פנימיים שווים בגודלם והפוכים בכיוונם מבטלים זה את זה גם במומנט הכולל.
  truth: הם מתבטלים בסכום הכוחות, אבל במומנט נשאר (r₁ − r₂) × F₁₂. הוא מתאפס רק כשהכוחות פועלים לאורך הקו שמחבר את החלקיקים, הצורה החזקה של החוק השלישי.
  remedy: { lesson: '3.8', label: 'שיעור 3.8: מתי הכוחות הפנימיים לא תורמים מומנט' }

- id: MC-3-no-external-force-K-conserved
  title: בלי כוח חיצוני האנרגיה הקינטית נשמרת
  belief: אם אין כוח חיצוני על מערכת, האנרגיה הקינטית שלה נשמרת, כמו התנע והתנע הזוויתי.
  truth: כוחות פנימיים יכולים לעשות עבודה כשחלקי המערכת זזים זה ביחס לזה, ולשנות את האנרגיה הקינטית, על חשבון אנרגיה כימית, אלסטית או חום.
  remedy: { lesson: '3.8', label: 'שיעור 3.8: שתי דסקיות שמתקרבות זו לזו' }

- id: MC-3-faster-spin-more-L
  title: סיבוב מהיר יותר פירושו תנע זוויתי גדול יותר
  belief: כשמערכת מתחילה להסתובב מהר יותר, התנע הזוויתי שלה גדל.
  truth: התנע הזוויתי תלוי גם במרחק מהציר, L = Σmr²ω. כשהמסות מתקרבות לציר, ω גדלה ו-L יכול להישאר קבוע.
  remedy: { lesson: '3.8', label: 'שיעור 3.8: שתי דסקיות שמתקרבות זו לזו' }

- id: MC-3-rope-climb-other-side-stays
  title: מטפס על חבל לא משפיע על הצד השני
  belief: קוף שמטפס על חבל שעובר על גלגלת רק עולה בעצמו, והשק בצד השני נשאר במקום.
  truth: כדי לטפס הקוף מגדיל את המתיחות בחבל, והחבל מושך גם את השק. כשהמסות שוות, המומנט החיצוני ביחס לציר אפס, והשניים עולים באותה מהירות.
  remedy: { lesson: '3.8', label: 'שיעור 3.8: קוף מטפס על חבל מעל גלגלת' }

- id: MC-3-all-kinetic-energy-can-be-lost
  title: בהתנגשות אפשר לאבד את כל האנרגיה הקינטית
  belief: בהתנגשות פלסטית כל האנרגיה הקינטית יכולה להפוך לחום.
  truth: התנע הכולל נשמר, ולכן החלק של מרכז המסה, ½MV², נשאר. רק האנרגיה הקינטית ביחס למרכז המסה יכולה להפוך לחום.
  remedy: { lesson: '3.8', label: 'שיעור 3.8: פירוק האנרגיה הקינטית למרכז מסה ולתנועה יחסית' }

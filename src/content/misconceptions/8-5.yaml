# Misconceptions first detected in lesson 8.5. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-8-net-force-zero-is-equilibrium
  title: שקול אפס פירושו שיווי משקל
  belief: אם הכוח השקול על גוף אפס, הגוף בשיווי משקל.
  truth: שקול אפס מבטיח רק שמרכז המסה לא יאיץ. גוף צפיד בשיווי משקל צריך גם מומנט שקול אפס. זוג כוחות, שקולו אפס, מסובב את הגוף.
  remedy: { lesson: '8.5', label: 'שיעור 8.5: שני התנאים של שיווי משקל וזוג כוחות' }

- id: MC-8-torques-only-about-cm
  title: מומנטים מחשבים רק סביב מרכז המסה או ציר אמיתי
  belief: את משוואת המומנטים מותר לכתוב רק סביב מרכז המסה, או סביב ציר שהגוף באמת מסתובב סביבו.
  truth: כשהשקול אפס, המומנט השקול זהה סביב כל נקודה. בסטטיקה בוחרים את הנקודה שדרכה עוברים הכוחות הלא ידועים, כדי להוציא אותם מהמשוואה.
  remedy: { lesson: '8.5', label: 'שיעור 8.5: בחירת נקודה נוחה לחישוב המומנטים' }

- id: MC-8-supports-share-equally
  title: שתי תמיכות נושאות משקל שווה
  belief: קורה שמונחת על שתי תמיכות מתחלקת במשקלה ביניהן שווה בשווה.
  truth: חלוקת המשקל נקבעת ממאזן המומנטים. תמיכה שקרובה יותר לעומס נושאת יותר, וארגז מעבר לתמיכה יכול אף להרים את הקצה השני.
  remedy: { lesson: '8.5', label: 'שיעור 8.5: קורה על שתי תמיכות עם עומס בקצה' }

- id: MC-8-frictionless-wall-holds-up
  title: קיר חלק מחזיק את הסולם כלפי מעלה
  belief: קיר שהסולם נשען עליו נושא חלק מהמשקל, גם כשהוא חלק.
  truth: קיר בלי חיכוך מפעיל רק כוח ניצב לפניו, אופקי. את כל המשקל נושאת הרצפה, והחיכוך שלה מאזן את הדחיפה של הקיר.
  remedy: { lesson: '8.5', label: 'שיעור 8.5: תרשים הכוחות של סולם' }

- id: MC-8-torque-ignores-position
  title: חשוב רק כמה משקל, לא איפה
  belief: במצבי שיווי משקל חשוב רק המשקל הכולל, ולא הנקודה שבה כל משקל פועל.
  truth: מומנט הוא כוח כפול זרוע. אותו משקל במקום אחר משנה את המומנטים, ולכן גם את כוחות התמיכה ואת החיכוך הדרוש.
  remedy: { lesson: '8.5', label: 'שיעור 8.5: אדם שמטפס על סולם' }

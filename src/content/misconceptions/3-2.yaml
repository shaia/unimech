# Misconceptions first detected in lesson 3.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-3-closed-loop-always-zero
  title: במסלול סגור העבודה תמיד אפס
  belief: אם גוף חוזר לנקודת ההתחלה, העבודה של כל כוח עליו מתאפסת, כי ההעתק הכולל אפס.
  truth: העבודה במסלול סגור מתאפסת רק לכוח משמר. חיכוך, או כוח שמסתובב סביב נקודה כמו c(−y, x), עושים עבודה שונה מאפס גם כשהגוף חוזר למקומו.
  remedy: { lesson: '3.2', label: 'שיעור 3.2: עבודה במסלול סגור', anchor: 'vortex-loop' }

- id: MC-3-two-paths-prove-conservative
  title: שני מסלולים עם אותה עבודה מוכיחים שהכוח משמר
  belief: אם העבודה בשני מסלולים בין אותן נקודות יצאה שווה, הכוח משמר.
  truth: אי-תלות במסלול היא טענה על כל המסלולים. דוגמה אחת לא מוכיחה אותה; מבחן הרוטור, או מציאת U, כן.
  remedy: { lesson: '3.2', label: 'שיעור 3.2: שני מסלולים שמסכימים, ומבחן הרוטור', anchor: 's-curve' }

- id: MC-3-u-sign-of-integral
  title: האנרגיה הפוטנציאלית היא האינטגרל של הכוח
  belief: U מתקבלת מאינטגרל של הכוח, בלי סימן מינוס, והיא שווה לעבודה של הכוח.
  truth: U = −∫F·dr. כשהכוח עושה עבודה חיובית, האנרגיה הפוטנציאלית יורדת באותו שיעור, ΔU = −W.
  remedy: { lesson: '3.2', label: 'שיעור 3.2: אנרגיה פוטנציאלית מכוח משמר', anchor: 'potential' }

- id: MC-3-force-along-gradient
  title: הכוח פונה לכיוון שבו האנרגיה הפוטנציאלית עולה
  belief: הכוח פונה כמו הגרדיאנט של U, אל האנרגיה הגבוהה.
  truth: F = −∇U. הכוח פונה לכיוון שבו U יורדת הכי מהר, כמו כדור שמתגלגל במורד.
  remedy: { lesson: '3.2', label: 'שיעור 3.2: הכוח כמינוס הגרדיאנט על מפת קווי גובה', anchor: 'contours' }

- id: MC-3-force-along-contour
  title: הכוח פונה לאורך קווי הגובה
  belief: על מפת קווי גובה של U, הכוח פונה לאורך הקווים.
  truth: לאורך קו גובה U לא משתנה, ולכן לכוח אין רכיב לאורכו. הכוח ניצב לקווי הגובה, וגדול במקום שבו הם צפופים.
  remedy: { lesson: '3.2', label: 'שיעור 3.2: הכוח כמינוס הגרדיאנט על מפת קווי גובה', anchor: 'contours' }

- id: MC-3-equilibrium-always-stable
  title: כל נקודת שיווי משקל יציבה
  belief: בנקודה שבה הכוח מתאפס, גוף שמקבל דחיפה קטנה חוזר אליה.
  truth: שיווי משקל יציב רק במינימום של U, בכל הכיוונים. במקסימום, או באוכף שבו U יורדת בכיוון אחד, דחיפה קטנה מרחיקה את הגוף.
  remedy: { lesson: '3.3', label: 'שיעור 3.3: יציבות מתוך הנגזרת השנייה של U' }

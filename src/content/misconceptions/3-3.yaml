# Misconceptions first detected in lesson 3.3. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-3-constant-power-constant-force
  title: הספק קבוע פירושו כוח קבוע
  belief: מנוע שמספק הספק קבוע דוחף בכוח קבוע, ולכן התאוצה קבועה.
  truth: ההספק הוא P = F·v. בהספק קבוע הכוח הוא P/v, והוא קטן כשהמהירות גדלה; התאוצה קטנה גם היא.
  remedy: { lesson: '3.3', label: 'שיעור 3.3: הספק, P = F·v' }

- id: MC-3-speed-depends-on-launch-direction
  title: גודל המהירות בפגיעה תלוי בכיוון הזריקה
  belief: גוף שנזרק כלפי מטה פוגע בקרקע מהר יותר מגוף שנזרק כלפי מעלה מאותו גובה ובאותו גודל מהירות.
  truth: בלי אוויר האנרגיה המכנית נשמרת. לשני הגופים אותה אנרגיה קינטית ואותה אנרגיה פוטנציאלית בהתחלה, ולכן אותו גודל מהירות בכל גובה. רק הכיוון והזמן שונים.
  remedy: { lesson: '3.3', label: 'שיעור 3.3: שימור אנרגיה מכנית' }

- id: MC-3-rest-and-equilibrium-confused
  title: גוף שנעצר נמצא בשיווי משקל, וגוף בשיווי משקל עומד
  belief: בנקודה שבה המהירות אפס גם הכוח אפס, ובנקודה שבה הכוח אפס הגוף נעצר.
  truth: מהירות אפס וכוח אפס הם דברים שונים. בנקודת מפנה המהירות אפס והכוח לא; במינימום של U הכוח אפס, והמהירות שם דווקא מרבית.
  remedy: { lesson: '3.3', label: 'שיעור 3.3: נקודות מפנה ושיווי משקל בדיאגרמת אנרגיה' }

- id: MC-3-every-well-traps
  title: גוף בבור פוטנציאל תמיד כלוא בו
  belief: אם גוף נמצא בבור של U, הכוח המחזיר יחזיר אותו תמיד, והוא יתנודד שם.
  truth: הבור כולא רק גוף שהאנרגיה המכנית שלו נמוכה מהשפה הנמוכה של הבור. באנרגיה גבוהה יותר אין נקודת מפנה בצד הזה, והגוף בורח.
  remedy: { lesson: '3.3', label: 'שיעור 3.3: התחום המותר בדיאגרמת אנרגיה' }

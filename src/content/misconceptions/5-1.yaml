# Misconceptions first detected in lesson 5.1. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in lesson 5.1 that refutes it (an anchor: a step id).

- id: MC-5-amplitude-is-x0
  title: האמפליטודה היא ההעתק ההתחלתי
  belief: אם הגוף מתחיל במרחק x₀ מנקודת שיווי המשקל, האמפליטודה של התנודה היא x₀, גם אם הוא כבר נע.
  truth: האמפליטודה נקבעת גם מההעתק וגם מהמהירות ההתחלתיים, A = √(x₀² + (v₀/ω₀)²). היא שווה ל-x₀ רק כשהגוף מתחיל ממנוחה.
  remedy: { lesson: '5.1', anchor: outward, label: 'שיעור 5.1: גוף שמתחיל בתנועה החוצה לא נעצר ב-x₀' }

- id: MC-5-phase-sign-of-velocity
  title: לפאזה יש את הסימן של המהירות ההתחלתית
  belief: מהירות התחלתית חיובית נותנת פאזה חיובית.
  truth: ב-x = A cos(ω₀t + φ) המהירות ההתחלתית היא v₀ = −Aω₀ sin φ, ולכן מהירות חיובית פירושה sin φ שלילי. את הרביע קובעים הסימנים של cos φ ושל sin φ יחד.
  remedy: { lesson: '5.1', anchor: from-ic, label: 'שיעור 5.1: אמפליטודה ופאזה מתנאי ההתחלה' }

- id: MC-5-series-springs-add
  title: קבועי קפיצים בטור מתחברים
  belief: שני קפיצים בטור חזקים יותר מכל אחד מהם, וקבוע הקפיץ השקול הוא הסכום.
  truth: בטור כל קפיץ נושא את אותו כוח וההתארכויות מתחברות, ולכן 1/k = 1/k₁ + 1/k₂, והטור רך יותר מכל אחד מהם. הקבועים מתחברים במקביל.
  remedy: { lesson: '5.1', anchor: series, label: 'שיעור 5.1: קפיצים בטור, אותו כוח והתארכויות שמתחברות' }

- id: MC-5-gravity-changes-omega
  title: הכובד משנה את התדירות של קפיץ אנכי
  belief: קפיץ שתלוי אנכית מתנודד בתדירות אחרת מאותו קפיץ על שולחן, כי הכובד משתתף בכוח המחזיר.
  truth: הכובד קבוע ולא תלוי בהעתק, ולכן הוא רק מזיז את נקודת שיווי המשקל ב-mg/k. סביב הנקודה החדשה הכוח השקול הוא −kx, והתדירות אותה √(k/m). גם על הירח הקפיץ מתנודד באותה תדירות.
  remedy: { lesson: '5.1', anchor: moon, label: 'שיעור 5.1: אותו קפיץ על כדור הארץ, על הירח ובלי כובד' }

- id: MC-5-stops-at-equilibrium
  title: הגוף נעצר בנקודת שיווי המשקל
  belief: גוף ששוחרר מעל נקודת שיווי המשקל יורד עד אליה ונעצר שם.
  truth: בנקודת שיווי המשקל השקול אפס אבל המהירות מרבית. הגוף ממשיך באותו מרחק מעבר לה, ומתנודד סביבה כל עוד אין ריסון.
  remedy: { lesson: '5.1', anchor: natural, label: 'שיעור 5.1: קפיץ אנכי ששוחרר באורכו הרפוי' }

# Misconceptions first detected in lesson 8.3. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-8-same-tension-massive-pulley
  title: המתיחות שווה משני צדי גלגלת בעלת מסה
  belief: חבל אחד שעובר על גלגלת מתוח באותה מתיחות משני צדדיה, גם כשלגלגלת יש מסה והיא מאיצה.
  truth: גלגלת בעלת מומנט התמד I צריכה מומנט שקול (T₁ − T₂)R = Iα כדי להאיץ את סיבובה. המתיחויות שוות רק כש-I זניח או כשאין תאוצה.
  remedy: { lesson: '8.3', anchor: atwood-solve, label: 'שיעור 8.3: מכונת אטווד עם גלגלת בעלת מסה' }

- id: MC-8-nothing-falls-faster-than-g
  title: שום דבר לא נופל מהר יותר מנפילה חופשית
  belief: כל נקודה בגוף שנופל תחת כובד מאיצה לכל היותר ב-g, ומהירותה לא עולה על זו של נפילה חופשית מאותו גובה.
  truth: בגוף צפיד שמסתובב סביב ציר, כוחות פנימיים מעבירים תנע ואנרגיה בין חלקיו. הקצה של מוט שנופל סביב ציר בקצהו השני מאיץ ב-3g/2, ומגיע למהירות √(3gL) > √(2gL).
  remedy: { lesson: '8.3', anchor: rod-coin, label: 'שיעור 8.3: מוט שנופל סביב ציר בקצהו' }

- id: MC-8-same-torque-same-energy
  title: אותו מומנט כוח נותן אותה אנרגיה
  belief: שני גופים שפועל עליהם אותו מומנט כוח במשך אותו זמן מקבלים אותה אנרגיה קינטית.
  truth: מומנט לאורך זמן נותן תנע זוויתי, L = τt, ואנרגיה נקבעת מהעבודה, τθ. באותו זמן הגוף עם I הקטן מסתובב בזווית גדולה יותר ומקבל יותר אנרגיה, K = L²/(2I).
  remedy: { lesson: '8.3', anchor: torque-work, label: 'שיעור 8.3: עבודה של מומנט כוח מול השינוי בתנע הזוויתי' }

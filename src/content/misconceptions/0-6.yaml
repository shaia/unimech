# Misconceptions first detected in lesson 0.6. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-0-arg-arctan-quadrant
  title: הארגומנט הוא תמיד arctan(y/x)
  belief: הזווית של מספר מרוכב x + iy היא תמיד arctan(y/x).
  truth: arctan נותן זוויות רק בין −π/2 ל-π/2, ולא מבחין בין (x, y) ל-(−x, −y). כשהחלק הממשי שלילי מוסיפים π או מחסירים π, לפי הרביע.
  remedy: { lesson: '0.6', label: 'שיעור 0.6: הצגה קוטבית ורביעים במישור המרוכב' }

- id: MC-0-amplitudes-add
  title: אמפליטודות של תנודות מתחברות כמספרים
  belief: כשמחברים שתי תנודות באותה תדירות, האמפליטודה של הסכום היא סכום האמפליטודות.
  truth: האמפליטודות המרוכבות מתחברות כמו וקטורים במישור. רק כשהפאזות שוות האמפליטודה היא הסכום; בהפרש פאזה φ היא √(A₁² + A₂² + 2A₁A₂cos φ).
  remedy: { lesson: '0.6', label: 'שיעור 0.6: חיבור תנודות כחיבור של מספרים מרוכבים' }

- id: MC-0-re-of-product
  title: החלק הממשי של מכפלה הוא מכפלת החלקים הממשיים
  belief: בייצוג המרוכב של תנודות אפשר לבצע כל חישוב, כולל מכפלה של שני גדלים, ולקחת חלק ממשי בסוף.
  truth: החלק הממשי עובר רק דרך פעולות ליניאריות (סכום, כפל בקבוע ממשי, גזירה). Re(z₁z₂) = Re z₁·Re z₂ − Im z₁·Im z₂, ולכן מכפלה, כמו הספק, מחשבים מהגדלים הממשיים.
  remedy: { lesson: '0.6', label: 'שיעור 0.6: מה מותר לעשות בייצוג המרוכב' }

- id: MC-0-i-means-unphysical
  title: גודל שמופיע בו i אינו פיזיקלי
  belief: כשבביטוי של גודל פיזיקלי מופיע i, הגודל מדומה ואין לו משמעות.
  truth: בייצוג המרוכב הגודל הפיזיקלי הוא החלק הממשי. הכפל ב-i הוא סיבוב ב-90° במישור המרוכב, כלומר הזזה של הפאזה ברבע מחזור.
  remedy: { lesson: '0.6', label: 'שיעור 0.6: כפל ב-i כסיבוב' }

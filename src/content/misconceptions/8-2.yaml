# Misconceptions first detected in lesson 8.2. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-8-inertia-only-mass
  title: מומנט ההתמד תלוי רק במסה ובגודל
  belief: לשני גופים באותה מסה ובאותו רדיוס יש אותו מומנט התמד, ולגוף אחד יש מומנט התמד אחד, בלי קשר לציר.
  truth: I = ∫r² dm תלוי בפיזור המסה סביב הציר. טבעת קשה לסיבוב פי 2 מדסקה באותה מסה ורדיוס, ומוט סביב קצהו קשה לסיבוב פי 4 מאשר סביב מרכזו.
  remedy: { lesson: '8.2', anchor: disc, label: 'שיעור 8.2: טבעת מול דסקה באותה מסה ובאותו רדיוס' }

- id: MC-8-parallel-axis-any-axis
  title: משפט הצירים המקבילים בין כל שני צירים
  belief: אם יודעים את I סביב ציר כלשהו, מקבלים את I סביב כל ציר מקביל במרחק d ממנו בהוספת Md².
  truth: המשפט I = I_cm + Md² מקשר ציר שעובר במרכז המסה לציר מקביל לו. בין שני צירים אחרים עוברים דרך מרכז המסה.
  remedy: { lesson: '8.2', anchor: parallel-proof, label: 'שיעור 8.2: הוכחת משפט הצירים המקבילים ותנאי מרכז המסה' }

- id: MC-8-perpendicular-axis-any-body
  title: משפט הצירים הניצבים לכל גוף
  belief: I_z = I_x + I_y נכון לכל גוף, גם לכדור או לקובייה.
  truth: המשפט נכון רק לגוף שטוח שכל מסתו במישור xy. לגוף בעל עובי, I_x + I_y = I_z + 2∑mz².
  remedy: { lesson: '8.2', anchor: thick, label: 'שיעור 8.2: משפט הצירים הניצבים וגוף שיש לו עובי' }

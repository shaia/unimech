# Misconceptions first detected in lesson 10.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it. Until lesson 10.4
# is written, the remedy link leads to its comprehension ladder on the chapter practice page.

- id: MC-10-bound-heavier
  title: מערכת קשורה כבדה מחלקיה
  belief: אנרגיית הקשר מוסיפה מסה, ולכן גרעין כבד מסכום המסות של הפרוטונים והנייטרונים שבו.
  truth: אנרגיית הקשר היא האנרגיה שצריך להוסיף כדי לפרק את המערכת. לכן המערכת הקשורה קלה מחלקיה החופשיים, וההפרש, המסה החסרה, הוא B/c².
  remedy: { lesson: '10.4', label: 'שיעור 10.4: המסה החסרה של הדאוטרון' }

- id: MC-10-mass-defect-nuclear-only
  title: מסה חסרה יש רק בתגובות גרעיניות
  belief: רק בתגובות גרעיניות מסה הופכת לאנרגיה. בתגובה כימית המסה נשמרת בדיוק.
  truth: כל מערכת שמשחררת אנרגיה ΔE מאבדת מסה ΔE/c², בלי קשר לסוג הכוח. בתגובה כימית ההפרש הוא כ-10⁻¹⁰ מהמסה, קטן מכדי למדוד, ובתגובה גרעינית הוא גדול פי מיליונים.
  remedy: { lesson: '10.4', label: 'שיעור 10.4: מסה חסרה בבעירה ובהיתוך' }

- id: MC-10-energy-only
  title: שימור אנרגיה לבדו קובע אם תהליך אפשרי
  belief: אם יש מספיק אנרגיה, התהליך יכול לקרות. למשל, אלקטרון חופשי יכול לבלוע פוטון ולקבל את כל האנרגיה שלו.
  truth: תהליך צריך לשמור גם על האנרגיה וגם על התנע, יחד. אלקטרון חופשי לא יכול לבלוע פוטון לגמרי, כי הגודל האינווריאנטי לפני התהליך גדול מ-(mₑc²)², ולכן בפיזור קומפטון תמיד יוצא פוטון.
  remedy: { lesson: '10.4', label: 'שיעור 10.4: פיזור קומפטון משימור ארבעה-וקטור האנרגיה-תנע' }

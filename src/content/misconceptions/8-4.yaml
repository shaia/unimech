# Misconceptions first detected in lesson 8.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in lesson 8.4 that refutes it (an anchor: a step id).

- id: MC-8-rolling-needs-friction
  title: גלגול צריך חיכוך נגד התנועה
  belief: כדור שמתגלגל על רצפה אופקית במהירות קבועה מקבל ממנה כוח חיכוך אחורה, כי חיכוך תמיד מתנגד לתנועה.
  truth: בגלגול בלי החלקה במהירות קבועה החיכוך אפס, כי לא v ולא ω משתנות. חיכוך סטטי מופיע רק כשמשהו אחר מנסה לשנות אחת מהן, למשל כובד במדרון.
  remedy: { lesson: '8.4', anchor: level-roll, label: 'שיעור 8.4: כוחות על כדור שמתגלגל על רצפה אופקית' }

- id: MC-8-static-friction-does-work
  title: החיכוך בגלגול מאבד אנרגיה
  belief: גוף שמתגלגל בלי החלקה במדרון מאבד אנרגיה לחום בגלל החיכוך.
  truth: החיכוך הסטטי פועל בנקודת המגע, שנמצאת במנוחה, ולכן הוא לא עושה עבודה. האנרגיה המכנית נשמרת, והחיכוך רק מעביר אנרגיה מתנועת המרכז לסיבוב.
  remedy: { lesson: '8.4', anchor: no-work, label: 'שיעור 8.4: שימור אנרגיה בגלגול במדרון' }

- id: MC-8-friction-only-slows
  title: חיכוך קינטי רק מאט את המרכז
  belief: על כדור שמחליק, החיכוך רק מקטין את מהירות המרכז. הוא לא משנה את הסיבוב ולא יכול להפוך את כיוון התנועה.
  truth: החיכוך פועל בשפת הכדור, ולכן יש לו גם מומנט סביב המרכז, והוא מאט את המרכז ומשנה את הסיבוב בו זמנית, עד ש-v = ωR. כדור עם סיבוב לאחור חזק יכול לחזור.
  remedy: { lesson: '8.4', anchor: skid-equations, label: 'שיעור 8.4: כדור באולינג שמחליק ומתחיל להתגלגל' }

- id: MC-8-slipping-energy-conserved
  title: אנרגיה נשמרת גם בזמן החלקה
  belief: את המהירות הסופית של כדור שמחליק ומתחיל להתגלגל אפשר למצוא משימור אנרגיה.
  truth: בזמן ההחלקה החיכוך הקינטי הופך אנרגיה לחום. נשמר התנע הזוויתי סביב נקודה על המשטח, והוא נותן v = (5/7)v₀ לכדור מלא שנזרק בלי סיבוב.
  remedy: { lesson: '8.4', anchor: floor-l, label: 'שיעור 8.4: שימור תנע זוויתי סביב נקודה על המסלול' }

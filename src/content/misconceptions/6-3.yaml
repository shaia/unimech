# Misconceptions first detected in lesson 6.3. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in lesson 6.3 that refutes it (anchors are Step and
# section ids of the lesson).

- id: MC-6-l-only-circular
  title: התנע הזוויתי נשמר רק במסלול מעגלי
  belief: בכוח מרכזי התנע הזוויתי נשמר רק כשהמסלול מעגלי, כי רק אז המהירות ניצבת לרדיוס.
  truth: מומנט של כוח מרכזי הוא אפס בכל מסלול, ולכן L = μr²θ̇ קבוע גם באליפסה. כשהגוף מתקרב, θ̇ גדל.
  remedy: { lesson: '6.3', anchor: central, label: 'שיעור 6.3: שימור התנע הזוויתי בכוח מרכזי' }

- id: MC-6-l-needs-inverse-square
  title: שימור התנע הזוויתי דורש כוח שהולך כמו 1/r²
  belief: התנע הזוויתי, וחוק השטחים של קפלר, נשמרים רק בכוח כבידה שהולך כאחד חלקי ריבוע המרחק.
  truth: שימור התנע הזוויתי דורש רק שהכוח יהיה מרכזי, בכל תלות במרחק. חוק השטחים נכון לכל כוח מרכזי; הצורה האליפטית והחוק השלישי הם שדורשים 1/r².
  remedy: { lesson: '6.3', anchor: rosette, label: 'שיעור 6.3: כוח מרכזי אחר, אותו שימור' }

- id: MC-6-centrifugal-real-force
  title: האיבר הדוחה בפוטנציאל האפקטיבי הוא כוח אמיתי
  belief: האיבר L²/(2μr²) הוא אנרגיה פוטנציאלית של כוח צנטריפוגלי אמיתי שדוחף את הגוף החוצה.
  truth: במערכת אינרציאלית פועלת רק הכבידה, והיא מושכת. האיבר הוא האנרגיה הקינטית המשיקית, כתובה בעזרת L הקבוע; הוא קיים גם לגוף חופשי, שמתקרב לכל נקודה שאינה על הקו שלו עד מרחק מינימלי ואז מתרחק ממנה.
  remedy: { lesson: '6.3', anchor: barrier, label: 'שיעור 6.3: מאיפה בא המחסום של התנע הזוויתי' }

- id: MC-6-circular-where-ueff-zero
  title: המסלול המעגלי נמצא היכן שהפוטנציאל האפקטיבי מתאפס
  belief: המסלול המעגלי נמצא ברדיוס שבו U_eff = 0.
  truth: המסלול המעגלי נמצא במינימום של U_eff, שבו הנגזרת מתאפסת, ברדיוס L²/(μk). U_eff מתאפס ברדיוס קטן פי 2, וזו רק נקודת המפנה של המסלול הלא קשור שבו E = 0.
  remedy: { lesson: '6.3', anchor: minimum, label: 'שיעור 6.3: המינימום של הפוטנציאל האפקטיבי' }

- id: MC-6-turning-point-at-rest
  title: בנקודת מפנה הגוף נעצר
  belief: בנקודת הקרבה ובנקודת הריחוק הגוף נעצר לרגע, כמו כדור שנזרק כלפי מעלה.
  truth: בנקודת מפנה מתאפס רק הרכיב הרדיאלי של המהירות. הרכיב המשיקי, L/(μr), שונה מאפס, ובנקודת הקרבה המהירות היא הגדולה ביותר במסלול.
  remedy: { lesson: '6.3', anchor: apo, label: 'שיעור 6.3: נקודות המפנה בפוטנציאל האפקטיבי' }

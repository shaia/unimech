# Misconceptions first detected in lesson 0.4. Each is detected by at least one distractor (its
# `misconception:` tag) and has a remedy: the place in the course that refutes it.

- id: MC-0-integral-is-distance
  title: האינטגרל של המהירות הוא הדרך
  belief: האינטגרל של המהירות לפי הזמן נותן את הדרך הכוללת, כי שטח הוא תמיד חיובי.
  truth: האינטגרל צובר את ההעתקים עם הסימן שלהם, ולכן הוא נותן את ההעתק. הדרך היא האינטגרל של |v|, ומחשבים אותה בקטעים שבין נקודות העצירה.
  remedy: { lesson: '0.4', label: 'שיעור 0.4: שטח עם סימן מתחת לגרף המהירות' }

- id: MC-0-constant-rate-assumed
  title: כופלים קצב משתנה בזמן
  belief: כדי למצוא כמה הצטבר, כופלים את הקצב ההתחלתי (מהירות, תאוצה, צפיפות) באורך הקטע, גם כשהקצב משתנה.
  truth: 'מכפלה פשוטה נכונה רק כשהקצב קבוע. כשהוא משתנה, מחלקים לחתיכות קטנות שבכל אחת מהן הקצב כמעט קבוע, וסוכמים: זה האינטגרל.'
  remedy: { lesson: '0.4', label: 'שיעור 0.4: מסכום של חתיכות לאינטגרל' }

- id: MC-0-cm-at-middle
  title: מרכז המסה תמיד באמצע
  belief: מרכז המסה של מוט נמצא תמיד באמצע האורך שלו.
  truth: מרכז המסה הוא ממוצע של המקומות, משוקלל במסה. במוט שצפיפותו משתנה הוא זז לעבר הקצה הצפוף יותר.
  remedy: { lesson: '0.4', label: 'שיעור 0.4: מרכז המסה של מוט שצפיפותו משתנה' }

# Final exam B, question 3: a block m0 strikes, head-on and elastically, block 1 of a spring dumbbell (blocks 1 and 2,
# each of mass m, joined by a light relaxed spring k, at rest) on a frictionless table; the hit is much shorter than
# the spring's period. Joins chapter 4 (the elastic hit 4.1, the CM split of the energy 4.2, the short hit and the
# stages 4.4) with chapter 5 (the two-body oscillation 5.5, the oscillator 5.1/5.2) and 3.4 (the CM moves at a
# constant velocity). Parts: א the velocities just after the hit; ב V, the vibration energy (1/2)mu v1'^2 and
# s_max = v1'/omega, with numbers; ג x1(t), x2(t) and the block that stops but never goes back; ד does the striker get
# hit a second time: the gap d(t), never for m0 <= m, and a critical ratio m0/m = sqrt(1 + theta*^2) = 4.60 from
# tan theta = theta, the same for every k and v0; the limit m0 >> m (a dumbbell bouncing off a wall: back after T/2).
# Overlap found by grep: lesson 5.5's ex-5-5-5 (a dumbbell given a blow: V, omega = sqrt(k/mu), |r|max) and review
# problem Q-5-bagrut-5 (a ball that STICKS to block A of an equal-mass dumbbell: V, the lost energy, s_max, eta,
# v_B(t), does a block move backward). So here the hit is elastic, the striker stays in the problem, and the summit is
# new: whether and when the striker is struck again. V and s_max are footholds.
# Recomputed in .scratch/exam-b/q3.ts. Independent route: RK4 (src/physics/motion.ts) of all three blocks, where the
# collision is not assumed but modelled as a stiff repulsive contact spring Kc = 2e5..2e6 k (elastic, lasting
# ~4e-4 s << 1/omega = 0.05 s), and contacts are counted:
#   exam numbers m = 0.20 kg, m0 = 0.30 kg, k = 40 N/m, v0 = 1.5 m/s: omega = 20.0 rad/s, v0' = 0.300 m/s,
#   v1' = 1.80 m/s, V = 0.900 m/s, s_max = 0.0900 m; energy 0.3375 J = 0.0135 (striker) + 0.162 (CM) + 0.162 (vib) J.
#   RK4: v0', v1' (rel 4e-6), v2' = 0 during the hit, s_max (rel 6e-7), x1, x2, v1 = V(1 + cos wt) at 4 times
#   (rel < 5e-4, time from the middle of the finite contact), one contact only.
#   ג limits: x1 ~ v1't, x2 - l ~ v1' w^2 t^3/12 for wt << 1, and k -> 0.
#   ד: theta* = 4.49341 rad, (m0/m)* = -1/cos theta* = sqrt(1 + theta*^2) = 4.60334; a scan of theta + lambda sin theta
#   (no zero for lambda = 1, 4.55; a zero for 4.65); RK4 contact counts over 3 periods: one contact for m0/m = 1, 3,
#   4.4, two for 4.8 (at two different k, v0: the criterion is m0/m alone), 6 and 1000; the second-hit time agrees
#   with the first root of theta + (m0/m) sin theta (rel 1.5e-3 at the near-grazing 4.8, shrinking as Kc grows;
#   5e-4 at 1000, where w t = 3.145 ~ pi).
# reviewed 2026-11-20 (independent, .scratch/exam-b-review/q3.ts): every number recomputed from the printed values;
#   RK4 of (x0, x1, x2) with a stiff elastic contact (Kc = 1e6 k): v0', v1' (7e-7), v2' ~ 0, s_max (1e-7), x1(t) and
#   v1 = V(1 + cos wt) at five times, one contact; second-hit scan m0/m = 1, 3, 4.4, 4.55 none, 4.65, 4.8 (two k, v0)
#   and 1000 a second contact at the first root of theta + (m0/m) sin theta; theta_c = 4.49341 by bisection,
#   sqrt(1 + 4.493^2) = 4.603, d' -> -0.998 v0 at m0/m = 1000. The number 4.60 in ד stays: it is a pure number from a
#   given mathematical constant, not a second substitution of physical data. Changed: the pair is masculine (שלו,
#   מתנודד); K = (1/2)(m1 + m2)V^2 instead of an undefined M; ג states it holds until any second hit; the
#   dimensional argument for k, v0 dropping out of the criterion is made exact. ג(3) echoes Q-5-bagrut-5 ד(3) (does
#   a block move backward) in an equal-mass, position form: kept as a mid foothold that ד needs.
#   After the student read (timed 45-50 min): ב(3) no longer asks the energy split (kept in the solution as a check),
#   to trim time; ד(2)'s rubric accepts any proof, and the solution adds the short route (v0' <= 0 so x0 <= 0, and
#   x1 > 0 from part ג); ד(3)'s rubric accepts -1/cos(theta_c) or sqrt(1 + theta_c^2), and the solution notes that
#   -1/cos(4.493) = 4.59 on a calculator (cos is sensitive there; exact 4.603), so 4.59 and 4.60 both pass as ~4.6;
#   ג says x1(t), x2(t) hold only until a second hit.
#   After a second timed read (~48 min, target ~42): ג(4), the wt << 1 check, is no longer asked or graded (it only
#   re-checked the initial conditions ג imposed; the solution keeps it and the k -> 0 limit); ד(4)'s explanation in
#   block 0's frame stays, as the independent check of the summit. The one event is worded "הפגיעה השנייה בין גוש 0
#   לגוש 1" throughout ג and ד. ב(2) lists for E_vib only m0, m, v0. The stem defines omega first and compares the
#   hit with 2 pi/omega, the period of the pair's oscillation, not "the spring's period".
#   After a third timed read (45 min, ד 17 min): ד(4) no longer asks the explanation in block 0's frame (the limit
#   itself, t = pi/omega and relative speed v0, stays; the solution keeps the frame view as unasked); ב(1) and its
#   law step say V is constant only until a second hit, if any (for m0/m > 4.60 that hit changes the pair's momentum).
id: E-final-b-3
type: bagrut
title: גוש שפוגע בזוג גושים עם קפיץ
prompt: >-
  על שולחן אופקי חלק, בלי חיכוך, מונחים שני גושים, 1 ו-2, כל אחד בעל מסה $m$. ביניהם מחובר קפיץ קל בעל קבוע $k$,
  באורכו הרפוי $\ell$, והגושים במנוחה. לגושים 1 ו-2 עם הקפיץ נקרא "הזוג". גוש שלישי, 0, בעל מסה $m_0$, מחליק לאורך הקו של הקפיץ במהירות $v_0$ ופוגע
  חזיתית בגוש 1, מהצד הרחוק מגוש 2. סמנו $\omega = \sqrt{2k/m}$ (בחלק ג תראו שזו התדירות
  הזוויתית של התנודה של הזוג). ההתנגשות אלסטית, וקצרה בהרבה מ-$2\pi/\omega$, זמן המחזור של התנודה הזו. הגושים
  קטנים: הזניחו את
  הממדים שלהם, כך שגושים 0 ו-1 נוגעים זה בזה כשהם באותו מקום. ציר $x$ בכיוון של $v_0$, מגוש 1 אל גוש 2; הראשית
  במקום של גוש 1 לפני הפגיעה, ו-$t = 0$ הוא רגע הפגיעה. $x_0$, $x_1$ ו-$x_2$ הם המקומות של שלושת הגושים.
diagramAlt: >-
  מבט מהצד על שולחן. משמאל גוש שמסומן $m_0$, ומעליו חץ ימינה בצבע המהירות שמסומן $v_0$. מימינו, במרחק, גוש שמסומן
  $m$ ומעליו המספר 1, ממנו יוצא ימינה קפיץ בצורת זיגזג שמסומן $k$, ובקצה הקפיץ גוש שני שמסומן $m$ ומעליו המספר 2.
  מתחת לשולחן ציר $x$ ימינה, שהראשית שלו $0$ מתחת לגוש 1.

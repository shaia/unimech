# Final exam B, question 5: a photon rocket. A spaceship of initial mass M0 starts from rest and turns stored energy
# into light that it beams backwards; its mass M falls and it accelerates along +x. Joins chapter 10 (four-momentum
# conservation and E = pc of light 10.1, 10.4; the invariant 10.2-2; the boost of a photon's energy 10.2-1) with
# chapter 9 (velocity addition and the Doppler effect, 9.4), chapter 3 (momentum conservation 3.5, the rocket equation
# by a short-time balance 3.6) and chapter 0 (separation of variables 0.5, an integral built from pieces 0.4).
# Parts (as reviewed): א all the light at once: M/M0 = √((1 − β)/(1 + β)), β = (M0² − M²)/(M0² + M²), the M → M0
# check; ב γ = (M0² + M²)/(2M0M) from β, so E_γ = γMβc² = (M0² − M²)c²/(2M0), K = (M0 − M)²c²/(2M0),
# η = (M0 − M)/(2M0) with its Newtonian limit, and numbers (the only numeric part); ג step by step in the momentary
# rest frame: δE′ = −c²dM, dv′ = −c dM/M (the rocket equation with u = c), dβ = −(1 − β²)dM/M by velocity addition,
# integrated back to א, Tsiolkovsky as the β ≪ 1 check; ד the light reaches the launch point at f = f0 M/M0, and
# summing the Doppler-shifted pieces gives ב's E_γ again (the second, independent derivation of E_γ); M → 0: β → 1 and
# M0c² shared half and half.
# Overlap checked (2026-11-20): no photon rocket anywhere in the course (lessons, ladders, workbooks, review problems,
# exam-map, final-a). Nearest: workbook 10.4 (an Fe-57 nucleus emitting one gamma photon with recoil), 10.4 example 1
# and 10.5 example 2 (sails pushed by light from outside), 10.5 example 5 (constant force, arsinh), 3.6 (Newtonian
# rocket, parcelRocket). The alternative scenario (symmetric relativistic elastic collision) is Q-10-bagrut-5 and was
# not taken.
# Recomputed in .scratch/exam-b/q5.ts (all ok) by independent routes: a flight of photon emissions built from
# four-vectors (fourvector.photon emitted backwards in the rocket's rest frame, boostX to S, subtracted; massOf,
# velocityOf), at M/M0 = 0.95, 0.5, 1/3, 0.1, 0.01 and as one single pulse: the ratio √((1 − β)/(1 + β)) and β(M) at
# every state (rel < 1e-12), E_γ as the sum of the boosted photons, K = (γ − 1)Mc² by gammaOf, the energy balance;
# ג: the exact single emission at rest gives δE′/(−c²dM) − 1 and dv′/(−c dM/M) − 1 both = dM/(2M) (second order);
# (addVelocities(dv′, β) − β)/dv′ = 1 − β²; an RK4 of dβ/dM = −(1 − β²)/M to M/M0 = 0.9, 0.5, 1/3, 0.05 (rel < 1e-11);
# parcelRocket (u = c) agrees with β when Δm/M0 = 1e-3 (3e-7) and departs like β²/3; β(M0/e) = tanh 1 = 0.7616;
# ד: dopplerFactor(−β) = M/M0; the flight's Σ δE′·D(−β) equals the boosted sum; a midpoint quadrature of
# ∫ D(−β(M′)) c² dM′ = (M0² − M²)c²/(2M0); M → 0: γMc² and γMβc → M0c²/2 and M0c/2.
# Exam numbers (ב(3)): M0 = 1.00e3 kg, β = 0.800, c = 3.0e8 m/s → M/M0 = 1/3, M = 333 kg, γ = 5/3, M0c² = 9.00e19 J,
#   E_γ = (4/9)M0c² = 4.00e19 J, K = (2/9)M0c² = 2.00e19 J = (γ − 1)Mc², γMc² = 5.00e19 J, ratio 1/3; rest energy lost
#   6.00e19 J. Not asked: Tsiolkovsky with u = c would need M = M0e^(−0.8) = 449 kg.
# reviewed 2026-11-20 (independent, .scratch/exam-b-review/q5.ts): a flight of 2000 exact single-photon emissions, each
#   solved in the momentary rest frame by the invariant mass alone, velocities composed by rapidities (atanh/tanh, not
#   fourvector.ts), the S energy of each photon by the 9.4 Doppler factor: β(M), √((1 − β)/(1 + β)) = M/M0, E_γ, K,
#   momentum and energy balance at M/M0 = 0.95, 0.5, 1/3, 0.1, 0.01 (rel < 1e-11); ג first-order claims (residuals
#   dM/(2M)), the velocity-addition slope 1 − β², tanh 1, Tsiolkovsky at β = 1e-3; ב(3) numbers; ד quadrature to
#   M/M0 = 0.5 and 1e-4. Every step of ג is taught (10.1 conservation, 10.4 E = pc, 0.3 Taylor, 3.6 rocket equation,
#   9.4 velocity addition, which even differentiates u by u′, 0.5 separation) or given (S′, the partial fractions).
#   Changed: ג's solution used u both for 9.4's velocity and 3.6's exhaust speed (now w for the former) and now says dM
#   is the same in S and S′ (rest mass is invariant); ג(1) says why δE′ and not dE′; ג(3) and (4) merged, the
#   M0/e = (e² − 1)/(e² + 1) ask dropped (kept as a remark) to bring the question to ~45 min; ד's integration
#   variable M′ → M̃ (primes mean "in S′" here); ד(3) rubric also accepts the η → ½ route; ב(1) points to the invariant;
#   ב's four-vectors written (E/c, p) as in the glossary; ב(2) definition of η rephrased. Second pass (student timing,
#   51 -> ~42 min): ב(1) no longer re-derives E_γ by the invariant: it shows γ = (M0² + M²)/(2M0M) from β and uses
#   E_γ = γMβc² of א (objective OBJ-10.2-2 dropped from ב), so E_γ is derived twice (א/ב by conservation in S, ד by
#   the Doppler sum); the limits are each checked once (M → M0 in א, M → 0 with β → 1 and the half-and-half split in
#   ד; ב keeps its Newtonian limit); the editor-like notes in ג(1) and ד shortened; ג(2) states that dM is the same in
#   S and S′. γ(β) rechecked: (M0² + M²)/(2M0M) = 5/3 at M/M0 = 1/3. Third pass (46 -> ~42 min): ב gives γ(M) as a
#   fact (the 1 − β² algebra stays in the solution); ד defines M̃ (the mass when a given piece of light leaves,
#   M0 ≥ M̃ ≥ M) before using it.
id: E-final-b-5
type: bagrut
title: רקטת פוטונים
prompt: >-
  חללית נחה בחלל, רחוק מכל גוף, בראשית של מערכת אינרציאלית $S$, מערכת השיגור. המסה ההתחלתית שלה $M_0$. ברגע $t = 0$
  מופעל המנוע שלה: הוא הופך אנרגיה שאגורה בחללית לאור, ופולט את האור כקרן צרה לאחור, בכיוון ההפוך ל-$+x$. המנוע לא
  פולט שום דבר מלבד אור, ואין כוחות חיצוניים, ולכן החללית מאיצה לאורך ציר $x$; הציר החיובי $+x$ הוא כיוון התנועה
  שלה. המסה $M$ של החללית ברגע מסוים היא אנרגיית המנוחה שלה חלקי $c^2$. האור לוקח איתו אנרגיה מתוך החללית, ולכן
  $M$ קטנה בזמן שהמנוע פועל, אף שאף חומר לא יוצא ממנה (שיעור 10.4). סמנו ב-$\beta c$ את המהירות של החללית ב-$S$
  ברגע שבו המסה שלה $M$, ו-$\gamma = 1/\sqrt{1 - \beta^2}$. מהירות האור $c$.
diagramAlt: >-
  ציר $x$ אופקי בתחתית, וראשית $0$ משמאל. מעל הראשית נקודה שמסמנת את הצופה בנקודת השיגור. מימין, החללית: צורה
  מוארכת שהחרטום שלה פונה ימינה, ובתוכה האות $M$. מעליה חץ ימינה בצבע המהירות שמסומן $\beta c$. מהזנב של החללית
  יוצא גל בצבע של אור, שמתקדם שמאלה, אל הצופה, ובקצהו ראש חץ שמאלה.

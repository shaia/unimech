parts:
  - label: א
    type: open
    points: 5
    level: basic
    objectives: [OBJ-10.4-1, OBJ-10.1-1, OBJ-3.5-2]
    prompt: >-
      החשיבו את כל האור שנפלט מ-$t = 0$ ועד הרגע שבו המסה של החללית $M$ כמערכת אחת, שהאנרגיה הכוללת שלה ב-$S$ היא
      $E_\gamma$.

      (1) מה התנע הכולל של האור הזה ב-$S$, גודל וכיוון? בטאו אותו באמצעות $E_\gamma$ ו-$c$ ונמקו.

      (2) כתבו את שימור האנרגיה ואת שימור התנע ב-$S$, והראו ש-
      $$\frac{M}{M_0} = \sqrt{\frac{1 - \beta}{1 + \beta}}$$

      (3) בטאו את $\beta$ באמצעות $M$ ו-$M_0$, ובדקו את התוצאה בגבול $M \to M_0$.
    solution:
      - kind: law
        text: >-
          אין כוחות חיצוניים, ולכן האנרגיה הכוללת והתנע הכולל של החללית ושל האור נשמרים ב-$S$ (שיעורים 3.5 ו-10.1). לחללית
          $E = \gamma Mc^2$ ו-$p = \gamma M\beta c$. לאור, כמו לכל חלקיק חסר מסה, $E = pc$ (שיעור 10.4).
      - kind: manipulation
        text: >-
          כל פוטון נע לאורך ציר $x$ בכיוון ההפוך ל-$+x$, עם תנע שגודלו האנרגיה שלו חלקי $c$. התנעים של כל הפוטונים באותו
          כיוון, ולכן הם מסתכמים בגודל: לאור יש תנע שגודלו $E_\gamma/c$, בכיוון ההפוך ל-$+x$. לפני ההפעלה החללית נחה, עם
          אנרגיה $M_0c^2$ ובלי תנע. לכן
          $$M_0c^2 = \gamma Mc^2 + E_\gamma,\qquad 0 = \gamma M\beta c - \frac{E_\gamma}{c}$$
      - kind: manipulation
        text: >-
          מהשנייה $E_\gamma = \gamma M\beta c^2$. מציבים בראשונה: $M_0c^2 = \gamma Mc^2(1 + \beta)$, כלומר
          $$\frac{M}{M_0} = \frac{1}{\gamma(1 + \beta)} = \frac{\sqrt{(1 - \beta)(1 + \beta)}}{1 + \beta} = \sqrt{\frac{1 - \beta}{1 + \beta}}$$
          מעלים בריבוע: $M^2(1 + \beta) = M_0^2(1 - \beta)$, ולכן $\beta = \dfrac{M_0^2 - M^2}{M_0^2 + M^2}$.
      - kind: limit
        text: >-
          כש-$M = M_0$, $\beta = 0$ ו-$E_\gamma = \gamma M\beta c^2 = 0$: לא נפלט אור, והחללית נשארת במנוחה, כמו שחייב
          להיות. (הגבול $M \to 0$ נבדק בחלק ד.)
      - kind: units
        text: >-
          $\gamma Mc^2$ ו-$E_\gamma$ אנרגיות, ו-$\gamma M\beta c$ ו-$E_\gamma/c$ תנעים; $M/M_0$ ו-$\beta$ חסרי ממדים.
      - kind: result
        text: >-
          לאור תנע $E_\gamma/c$ בכיוון ההפוך ל-$+x$. משימור האנרגיה והתנע $\dfrac{M}{M_0} = \sqrt{\dfrac{1 - \beta}{1 + \beta}}$,
          כלומר $\beta = \dfrac{M_0^2 - M^2}{M_0^2 + M^2}$.
    rubric:
      - text: >-
          נימקתי שלאור תנע שגודלו $E_\gamma/c$, בכיוון ההפוך ל-$+x$, כי כל פוטון נע לאחור עם $E = pc$.
      - text: >-
          כתבתי $M_0c^2 = \gamma Mc^2 + E_\gamma$ ו-$0 = \gamma M\beta c - E_\gamma/c$, והגעתי ל-$M/M_0 = \sqrt{(1 - \beta)/(1 + \beta)}$.
        weight: 2
      - text: >-
          מצאתי $\beta = (M_0^2 - M^2)/(M_0^2 + M^2)$.
      - text: >-
          בדקתי ש-$\beta = 0$ כש-$M = M_0$: בלי אור החללית נשארת במנוחה.

  - label: ב
    type: open
    points: 6
    level: mid
    standalone: false
    objectives: [OBJ-10.1-1, OBJ-10.1-2]
    prompt: >-
      מחלק א, $\beta = \dfrac{M_0^2 - M^2}{M_0^2 + M^2}$ ו-$E_\gamma = \gamma M\beta c^2$. נתון שמכאן
      $\gamma = \dfrac{M_0^2 + M^2}{2M_0M}$.

      (1) בטאו באמצעות $M_0$, $M$ ו-$c$ את $E_\gamma$, האנרגיה ב-$S$ של כל האור שנפלט עד שהמסה של החללית $M$, ואת
      האנרגיה הקינטית $K = (\gamma - 1)Mc^2$ של החללית באותו רגע.

      (2) $\eta = \dfrac{K}{(M_0 - M)c^2}$ הוא היחס בין האנרגיה הקינטית של החללית לבין אנרגיית המנוחה שהיא איבדה.
      הראו ש-$\eta = \dfrac{M_0 - M}{2M_0}$. בדקו שכאשר $M_0 - M \ll M_0$, $K$ שווה לאנרגיה הקינטית של ניוטון,
      $\tfrac12M_0v^2$, עם המהירות $v = \beta c$ של חלק א.

      (3) חשבו את $M$, $E_\gamma$, $K$ ו-$\eta$ לחללית שהמסה ההתחלתית שלה $M_0 = 1.00\cdot10^{3}\,\text{kg}$ ומגיעה
      למהירות $0.800c$, עם $c = 3.0\cdot10^8\,\text{m/s}$.
    solution:
      - kind: law
        text: >-
          גורם לורנץ $\gamma = 1/\sqrt{1 - \beta^2}$, האנרגיה של האור מחלק א, $E_\gamma = \gamma M\beta c^2$, והאנרגיה
          הקינטית $K = \gamma Mc^2 - Mc^2$ (שיעור 10.1).
      - kind: manipulation
        text: >-
          $\gamma$ נתון; הוא נובע מ-$\beta$ של חלק א:
          $$1 - \beta^2 = \frac{(M_0^2 + M^2)^2 - (M_0^2 - M^2)^2}{(M_0^2 + M^2)^2} = \frac{4M_0^2M^2}{(M_0^2 + M^2)^2},\qquad \gamma = \frac{M_0^2 + M^2}{2M_0M}$$
          לכן $E_\gamma = \gamma M\beta c^2 = \dfrac{M_0^2 + M^2}{2M_0}\cdot\dfrac{M_0^2 - M^2}{M_0^2 + M^2}\,c^2 =
          \dfrac{(M_0^2 - M^2)c^2}{2M_0}$, והאנרגיה של החללית $\gamma Mc^2 = \dfrac{(M_0^2 + M^2)c^2}{2M_0}$, כך ש-
          $$K = \frac{\left(M_0^2 + M^2 - 2M_0M\right)c^2}{2M_0} = \frac{(M_0 - M)^2c^2}{2M_0}$$
          בדיקה: $\gamma Mc^2 + E_\gamma = M_0c^2$, שימור האנרגיה של חלק א.
      - kind: manipulation
        text: >-
          מחלקים ב-$(M_0 - M)c^2$: $\eta = \dfrac{M_0 - M}{2M_0}$. היחס תמיד קטן מחצי: לפחות חצי מאנרגיית המנוחה שהחללית
          איבדה יוצאת עם האור.
      - kind: limit
        text: >-
          נסמן $\Delta m = M_0 - M \ll M_0$. מחלק א, $\beta = \dfrac{(M_0 - M)(M_0 + M)}{M_0^2 + M^2} \approx
          \dfrac{\Delta m\cdot2M_0}{2M_0^2} = \dfrac{\Delta m}{M_0}$, ולכן $\tfrac12M_0v^2 \approx \tfrac12M_0c^2\dfrac{\Delta m^2}{M_0^2}
          = \dfrac{\Delta m^2c^2}{2M_0}$, בדיוק $K$. אז גם $\eta \to 0$ ו-$E_\gamma \approx \Delta m\,c^2$: כמו ברקטה של
          ניוטון שהגזים שלה מהירים בהרבה ממנה, כמעט כל האנרגיה הולכת לפליטה.
      - kind: units
        text: >-
          $M^2c^2/M_0$ ביחידות $\text{kg}\cdot\text{m}^2/\text{s}^2 = \text{J}$; $\eta$ חסר ממדים.
      - kind: substitution
        text: >-
          $M/M_0 = \sqrt{0.200/1.800} = 1/3$, ולכן $M = 333\,\text{kg}$. $M_0c^2 = 1.00\cdot10^{3}\cdot9.0\cdot10^{16} =
          9.00\cdot10^{19}\,\text{J}$. $E_\gamma = \tfrac12\left(1 - \tfrac19\right)M_0c^2 = \tfrac49M_0c^2 = 4.00\cdot10^{19}\,\text{J}$,
          $K = \tfrac12\left(\tfrac23\right)^2M_0c^2 = \tfrac29M_0c^2 = 2.00\cdot10^{19}\,\text{J}$, ו-$\eta = \tfrac{2/3}{2} = 0.333$.
          בדיקה: $\gamma = 1/0.600 = 5/3$, ו-$(\gamma - 1)Mc^2 = \tfrac23\cdot333\cdot9.0\cdot10^{16} = 2.00\cdot10^{19}\,\text{J}$; וגם
          $\gamma Mc^2 + E_\gamma = 5.00\cdot10^{19} + 4.00\cdot10^{19} = M_0c^2$.
      - kind: result
        text: >-
          $E_\gamma = \dfrac{(M_0^2 - M^2)c^2}{2M_0}$, $K = \dfrac{(M_0 - M)^2c^2}{2M_0}$, $\eta = \dfrac{M_0 - M}{2M_0}$. ב-$0.800c$:
          $M = 333\,\text{kg}$, $E_\gamma = 4.00\cdot10^{19}\,\text{J}$, $K = 2.00\cdot10^{19}\,\text{J}$, ו-$\eta = 1/3$: מתוך
          $6.00\cdot10^{19}\,\text{J}$ של אנרגיית מנוחה שאבדה, שליש נשאר בחללית כאנרגיה קינטית.
    rubric:
      - text: >-
          הצבתי את $\gamma$ ומצאתי $E_\gamma = (M_0^2 - M^2)c^2/(2M_0)$ ו-$K = (M_0 - M)^2c^2/(2M_0)$.
        weight: 2
      - text: >-
          הראיתי ש-$\eta = (M_0 - M)/(2M_0)$.
      - text: >-
          בדקתי שכש-$M_0 - M \ll M_0$, $v \approx c(M_0 - M)/M_0$ ו-$K \approx \tfrac12M_0v^2$.
      - text: >-
          חישבתי $M \approx 333\,\text{kg}$, $E_\gamma = 4.0\cdot10^{19}\,\text{J}$, $K = 2.0\cdot10^{19}\,\text{J}$ ו-$\eta = 1/3$.

  - label: ג
    type: open
    points: 7
    level: bagrut
    standalone: false
    objectives: [OBJ-3.6-1, OBJ-9.4-1, OBJ-0.5-2, OBJ-0.3-2]
    prompt: >-
      גזרו עכשיו את התוצאה של חלק א צעד אחר צעד, כמו שגזרנו את משוואת הרקטה בשיעור 3.6. ברגע מסוים המסה של החללית $M$
      ומהירותה ב-$S$ היא $\beta c$. $S'$ היא המערכת האינרציאלית שבה החללית נחה באותו רגע; היא נעה ביחס ל-$S$ במהירות
      $\beta c$ בכיוון $+x$. בפרק זמן קצר המנוע פולט אור, והמסה של החללית משתנה ב-$dM$, כאשר $dM < 0$.

      (1) כתבו את שימור האנרגיה ואת שימור התנע ב-$S'$ עד סדר ראשון בגדלים הקטנים. הראו שהאנרגיה של האור שנפלט, כפי
      שנמדדת ב-$S'$, היא $\delta E' = -c^2\,dM$, ושהחללית מקבלת ב-$S'$ את המהירות $dv' = -c\,dM/M$ ($\delta E'$: כמות
      קטנה שהאור לוקח, לא שינוי של גודל של החללית). השוו למשוואת הרקטה של שיעור 3.6, $M\,dv = -u\,dM$: מהי מהירות הפליטה?

      (2) היעזרו בחיבור מהירויות יחסותי, והראו שב-$S$ המהירות של החללית משתנה ב-$d\beta = -(1 - \beta^2)\,dM/M$.
      ($dM$, השינוי במסת המנוחה, זהה ב-$S$ וב-$S'$.)

      (3) פתרו את המשוואה בהפרדת משתנים, עם $\beta = 0$ כש-$M = M_0$, והראו שמתקבלת התוצאה של חלק א,
      $M/M_0 = \sqrt{(1 - \beta)/(1 + \beta)}$. נתון:
      $$\frac{1}{1 - \beta^2} = \frac12\left(\frac{1}{1 - \beta} + \frac{1}{1 + \beta}\right)$$
      בדקו שבגבול $\beta \ll 1$ מתקבלת משוואת ציולקובסקי של שיעור 3.6.
    solution:
      - kind: law
        text: >-
          כמו בשיעור 3.6, משווים את המצב לפני הפליטה למצב שאחריה ושומרים איברים מסדר ראשון. ב-$S'$, שהיא אינרציאלית,
          האנרגיה והתנע נשמרים (שיעור 10.1), ולאור $E = pc$. אחר כך עוברים ל-$S$ בחיבור מהירויות יחסותי (שיעור 9.4):
          גוף שנע ב-$S'$ במהירות $w'$ נע ב-$S$ במהירות $w = \dfrac{w' + v}{1 + w'v/c^2}$, כאשר $v = \beta c$ (זו
          הנוסחה של שיעור 9.4, שם עם $u$; כאן $u$ שמורה למהירות הפליטה).
      - kind: manipulation
        text: >-
          לפני: החללית נחה ב-$S'$, עם אנרגיה $Mc^2$ ובלי תנע. אחרי: החללית, במסה $M + dM$, נעה במהירות קטנה $dv'$, והאור
          נושא אנרגיה $\delta E'$ ותנע שגודלו $\delta E'/c$, בכיוון ההפוך ל-$+x$. גורם לורנץ של $dv'$ הוא
          $1 + \tfrac12(dv'/c)^2 + \dots$, כלומר 1 עד סדר ראשון. לכן
          $$Mc^2 = (M + dM)c^2 + \delta E',\qquad 0 = M\,dv' - \frac{\delta E'}{c}$$
          (במשוואת התנע השמטנו את $dM\,dv'$, מסדר שני). מהראשונה $\delta E' = -c^2\,dM$, ומהשנייה
          $M\,dv' = \delta E'/c = -c\,dM$. זו משוואת הרקטה $M\,dv = -u\,dM$ עם מהירות פליטה $u = c$: ברגע נתון, במערכת
          שבה היא נחה, רקטת פוטונים היא רקטה של ניוטון שהגזים שלה יוצאים במהירות האור.
      - kind: manipulation
        text: >-
          החללית נעה ב-$S'$ במהירות $w' = dv'$, ולכן ב-$S$
          $$v + dv = \frac{dv' + v}{1 + v\,dv'/c^2} \approx (v + dv')\left(1 - \frac{v\,dv'}{c^2}\right) \approx v + \left(1 - \frac{v^2}{c^2}\right)dv'$$
          עד סדר ראשון ב-$dv'$. $dM$ זהה בשתי המערכות (נתון: מסת מנוחה). לכן $d\beta = (1 - \beta^2)\,\dfrac{dv'}{c} = -(1 - \beta^2)\,\dfrac{dM}{M}$. הגורם
          $(1 - \beta^2)$ הוא החידוש של היחסות: אותה דחיפה ב-$S'$ מוסיפה ב-$S$ פחות ופחות מהירות ככל ש-$\beta$ גדל.
      - kind: manipulation
        text: >-
          מפרידים משתנים, $\dfrac{d\beta}{1 - \beta^2} = -\dfrac{dM}{M}$, ומבצעים אינטגרל מסוים, מ-$(M_0, 0)$ עד
          $(M, \beta)$. עם הזהות הנתונה:
          $$\frac12\left[-\ln(1 - \beta) + \ln(1 + \beta)\right] = -\left(\ln M - \ln M_0\right)$$
          כלומר $\tfrac12\ln\dfrac{1 + \beta}{1 - \beta} = \ln\dfrac{M_0}{M}$, ו-$\sqrt{\dfrac{1 + \beta}{1 - \beta}} = \dfrac{M_0}{M}$:
          התוצאה של חלק א.
      - kind: limit
        text: >-
          כש-$\beta \ll 1$, בפיתוח טיילור מסדר ראשון $\ln(1 \pm \beta) \approx \pm\beta$, ולכן
          $\tfrac12\ln\dfrac{1 + \beta}{1 - \beta} \approx \tfrac12(\beta + \beta) = \beta$, ו-$v = c\ln\dfrac{M_0}{M}$: משוואת
          ציולקובסקי, $v = u\ln(M_0/M)$, עם $u = c$, כמו שחלק (1) צפה. אבל ציולקובסקי היה נותן $v = c$ כבר
          ב-$M = M_0/e$, ושם לפי חלק א $\beta = \dfrac{e^2 - 1}{e^2 + 1} \approx 0.76$: שתי התשובות נפרדות כש-$\beta$
          מתקרב ל-1, כי הגורם $(1 - \beta^2)$ קרוב ל-1 רק כש-$\beta \ll 1$.
      - kind: units
        text: >-
          $dM/M$ חסר ממדים, ולכן $c\,dM/M$ ביחידות של מהירות, כמו $dv'$; $c^2\,dM$ ביחידות $\text{kg}\cdot\text{m}^2/\text{s}^2 =
          \text{J}$; $\beta$ והלוגריתם חסרי ממדים.
      - kind: result
        text: >-
          ב-$S'$: $\delta E' = -c^2\,dM$ ו-$M\,dv' = -c\,dM$, משוואת הרקטה עם $u = c$. ב-$S$:
          $d\beta = -(1 - \beta^2)\,dM/M$, ואחרי אינטגרציה $\tfrac12\ln\dfrac{1 + \beta}{1 - \beta} = \ln\dfrac{M_0}{M}$, התוצאה של
          חלק א. כש-$\beta \ll 1$ זו משוואת ציולקובסקי, $v = c\ln(M_0/M)$.
    rubric:
      - text: >-
          כתבתי את שימור האנרגיה והתנע ב-$S'$ עד סדר ראשון, והראיתי ש-$\delta E' = -c^2\,dM$ ו-$M\,dv' = -c\,dM$:
          משוואת הרקטה עם מהירות פליטה $c$.
        weight: 2
      - text: >-
          הראיתי בחיבור מהירויות ש-$d\beta = (1 - \beta^2)\,dv'/c$, ולכן $d\beta = -(1 - \beta^2)\,dM/M$.
      - text: >-
          הפרדתי משתנים, חישבתי את האינטגרל וקיבלתי $\tfrac12\ln\dfrac{1 + \beta}{1 - \beta} = \ln\dfrac{M_0}{M}$, התוצאה של חלק א.
      - text: >-
          בדקתי שכש-$\beta \ll 1$ מתקבל $v = c\ln(M_0/M)$, משוואת ציולקובסקי עם $u = c$.

  - label: ד
    type: open
    points: 7
    level: bagrut
    standalone: false
    objectives: [OBJ-9.4-2, OBJ-10.2-1, OBJ-0.4-2]
    prompt: >-
      המנוע הוא לייזר: במערכת שבה החללית נחה ברגע הפליטה, האור שלו תמיד בתדירות $f_0$. צופה נשאר בנקודת השיגור,
      $x = 0$, נח ב-$S$, וכל האור מגיע אליו. מחלק א, $\dfrac{M}{M_0} = \sqrt{\dfrac{1 - \beta}{1 + \beta}}$. נסמן ב-$\tilde M$
      את מסת החללית ברגע שבו היא פולטת אור מסוים ($M_0 \ge \tilde M \ge M$). מחלק ג, בזמן שהמסה יורדת מ-$\tilde M$
      ל-$\tilde M + d\tilde M$ ($d\tilde M < 0$), האור שנפלט נושא, במערכת שבה החללית נחה, את האנרגיה
      $\delta E' = -c^2\,d\tilde M$.

      (1) הראו שהאור שנפלט ברגע שבו המסה של החללית הייתה $M$ מגיע אל הצופה בתדירות $f = f_0\,M/M_0$.

      (2) האנרגיה של אור עוברת ממערכת למערכת באותו גורם דופלר כמו התדירות שלו (שיעור 10.4). בנו מכך אינטגרל, וחשבו את
      האנרגיה ב-$S$ של כל האור שנפלט עד שהמסה של החללית $M$. השוו ל-$E_\gamma$ של חלק ב,
      $E_\gamma = \dfrac{(M_0^2 - M^2)c^2}{2M_0}$.

      (3) בדקו את התוצאות בגבול $M \to 0$: מה $\beta$, ומה האנרגיה והתנע של החללית ב-$S$? הסבירו מדוע החללית והאור
      מתחלקים אז באנרגיה $M_0c^2$ שווה בשווה, אף שלחללית כמעט לא נשארה מסה.
    solution:
      - kind: law
        text: >-
          אפקט דופלר היחסותי לאורך קו הראייה (שיעור 9.4): $f = f_0\sqrt{\dfrac{1 + \beta}{1 - \beta}}$, עם $\beta > 0$ בהתקרבות
          ו-$\beta < 0$ בהתרחקות. האנרגיה של פוטון עוברת בין מערכות באותו גורם, כי $E/c$ הוא הרכיב הראשון של ארבעה-וקטור
          האנרגיה-תנע $(E/c,\ p)$ (שיעורים 10.2 ו-10.4). האנרגיה הכוללת היא סכום על כל חלקי האור.
      - kind: manipulation
        text: >-
          החללית מתרחקת מהצופה במהירות $\beta c$, והאור נע ממנה אליו: מחליפים $\beta$ ב-$(-\beta)$, ו-
          $f = f_0\sqrt{\dfrac{1 - \beta}{1 + \beta}} = f_0\dfrac{M}{M_0}$ לפי חלק א. גורם דופלר תלוי רק במהירות של החללית ברגע
          הפליטה. ובארבעה-וקטורים: לפוטון שנע ב-$S'$ בכיוון ההפוך ל-$+x$, באנרגיה $E'$, התנע לאורך $x$ הוא $(-E'/c)$,
          וב-$S$ האנרגיה שלו $\gamma\left(E' - \beta E'\right) = \gamma(1 - \beta)E' = \sqrt{\dfrac{1 - \beta}{1 + \beta}}\,E'$,
          אותו גורם. הצופה קורא את המסה של החללית מהצבע של האור: האור האחרון הוא האדום ביותר.
      - kind: manipulation
        text: >-
          האור שנפלט בזמן שהמסה ירדה מ-$\tilde M$ ל-$\tilde M + d\tilde M$ נושא ב-$S$ את האנרגיה
          $\dfrac{\tilde M}{M_0}\left(-c^2\,d\tilde M\right)$. מסכמים על כל השלבים, מ-$\tilde M = M_0$ עד $\tilde M = M$:
          $$\int_{M}^{M_0}\frac{\tilde M}{M_0}\,c^2\,d\tilde M =\frac{c^2}{M_0}\cdot\frac{M_0^2 - M^2}{2} = \frac{(M_0^2 - M^2)c^2}{2M_0}$$
          בדיוק $E_\gamma$ של חלק ב, בדרך אחרת לגמרי: שם שימור במערכת $S$ בבת אחת, וכאן סכום של אור שנפלט במערכות שונות,
          כל חלק בגורם דופלר שלו. האור מגיע לצופה עם פחות אנרגיה מאנרגיית המנוחה שהחללית איבדה, $(M_0 - M)c^2$; ההפרש,
          $(M_0 - M)c^2 - E_\gamma = \dfrac{(M_0 - M)^2c^2}{2M_0}$, הוא $K$ של חלק ב.
      - kind: limit
        text: >-
          כש-$M \to 0$: מחלק א $\beta = \dfrac{M_0^2 - M^2}{M_0^2 + M^2} \to 1$, ולכל $M > 0$, $\beta < 1$: כדי להתקרב
          למהירות האור צריך להפוך כמעט את כל המסה לאור, ולמהירות האור עצמה החללית לא מגיעה, כמו שחייב להיות לגוף בעל
          מסה (שיעור 10.5). האור שנפלט אחרון מגיע לצופה בתדירות $f_0M/M_0 \to 0$, ו-$E_\gamma \to M_0c^2/2$, ולכן לחללית נשארת האנרגיה $\gamma Mc^2 = M_0c^2 - E_\gamma \to M_0c^2/2$, ומשימור התנע
          (חלק א) התנע שלה הוא $E_\gamma/c \to M_0c/2$, בכיוון $+x$. הסיבה: התנע הכולל אפס, ולכן לחללית ולאור תנעים שווים
          בגודלם, $p$. לאור $E = pc$, ולחללית $E = \sqrt{(pc)^2 + (Mc^2)^2} \to pc$ כש-$M \to 0$. שתי אנרגיות שוות שסכומן
          $M_0c^2$: חצי וחצי. וזה מתאים ל-$\eta = (M_0 - M)/(2M_0) \to \tfrac12$ של חלק ב.
      - kind: units
        text: >-
          $\dfrac{c^2}{M_0}\cdot M^2$ ביחידות $\text{kg}\cdot\text{m}^2/\text{s}^2 = \text{J}$; $f$ ביחידות של $f_0$, כי
          $M/M_0$ חסר ממדים.
      - kind: result
        text: >-
          $f = f_0M/M_0$, ו-$\displaystyle\int_M^{M_0}\frac{\tilde M}{M_0}c^2\,d\tilde M =\frac{(M_0^2 - M^2)c^2}{2M_0} = E_\gamma$, כמו
          בחלק ב. כש-$M \to 0$ החללית והאור נושאים כל אחד $M_0c^2/2$ ותנע $M_0c/2$, בכיוונים הפוכים.
    rubric:
      - text: >-
          זיהיתי שהחללית מתרחקת מהצופה, כתבתי $f = f_0\sqrt{(1 - \beta)/(1 + \beta)}$, וקיבלתי מחלק א $f = f_0M/M_0$.
      - text: >-
          כתבתי שהאור של כל שלב נושא ב-$S$ את האנרגיה $(\tilde M/M_0)(-c^2\,d\tilde M)$, וחישבתי את האינטגרל עד
          $(M_0^2 - M^2)c^2/(2M_0)$, כמו $E_\gamma$ של חלק ב.
        weight: 2
      - text: >-
          מצאתי שכש-$M \to 0$, $\beta \to 1$ בלי להגיע אליו.
      - text: >-
          מצאתי שכש-$M \to 0$ לחללית אנרגיה $M_0c^2/2$ ותנע $M_0c/2$, והסברתי למה האנרגיה מתחלקת שווה בשווה: מתנעים
          שווים בגודלם ו-$E \to pc$, או מ-$\eta \to \tfrac12$ של חלק ב.

# E-final-b-1: a uniform rod (M, L) hangs from a light ring that slides without friction on a horizontal rail; a ball
# (m, v0 along +x) hits it a depth b below the ring and sticks; d = PG, the distance from the ring to the centre of
# mass of rod + ball (the formula sheet's b and d: b the strike distance from the axis, d the axis-to-CM distance).
# Joins chapter 8 (8.6 the hit as on a free rod, 8.1 the velocity of the ring, 8.7 the centre of percussion and the
# physical pendulum) with chapter 4 (4.4 the hit, then a stage with energy conserved), chapter 3 (3.5 p_x conserved,
# 3.4 G drifts at V, 3.8 Koenig, 3.3 energy) and chapter 5 (5.2 the energy method, 5.1 the initial conditions).
# Overlap: the pinned struck rod (omega, J_P, centre of percussion, swing, period) is solved in lesson 8.6 (text and
# ex-8-6-4), W-8.6-07/08/09, W-8.7-03/07/09 and Q-8-bagrut-1, so the pivot here is a ring free on a rail, which no
# lesson, bank, workbook or exam-map entry has: the hit is the free-rod hit (a foothold), b = 2L/3 now means "the ring
# stays at rest", the swing keeps (1/2)(M+m)V^2 in drift, and the small oscillations are about G (Omega^2 =
# (M+m) g d/I_cm). The 2014 moed-b exam (q1) has a point pendulum on a massive free cart: the theme is shared, the
# body, the hit and the asks are not.
# The author's script (.scratch/exam-b/q1.ts, g = 9.8) checked: the hit at three sample points against
# rigidangular.ts strike({mount: 'free', e: 0}), a generalized-impulse solve on (x_P, theta) and a time-domain hit
# (rk4Step); v_P the same three ways and v_P = 0 at b = 2L/3 for m = 1e-6 ... 5; the swing by the Lagrange equations of
# (x_P, theta) with rk4Step (1 - cos(theta_max) to 2e-4, the ratio I_cm/I_P -> 1/4); small oscillations (RK4 period
# = 2 pi/Omega and 2 pi/Omega_P to 1e-4, x_P(t) to 1.4e-5 of its amplitude); the limit m -> 0.
# Reviewed 2026-11-20 (independent, .scratch/exam-b-review/q1.ts): the hit re-solved from p_x and angular momentum
#   about the fixed point at P; the swing integrated by Newton-Euler (vertical force on G, torque of the ring force
#   about G) with rk4Step; quarter periods, x_P(t) (1e-6 of the amplitude), v_P = V at b = L/2, I_P omega = m v0 b at
#   b = 2L/3, all limits: every symbolic result agrees. Then, after a student read (65-75 min, target ~45):
#   symbols renamed to the formula sheet's (the author's strike depth d -> b, PG = h -> d, I_G -> I_cm); the
#   ring's vertical force is a given fact; v_P is given as "הראו ש"; ב(3) now goes through the angular momentum about
#   P (I_P omega = m v0 b), replacing the I_G algebra and the unclear sentence about the ball's force; the numeric part
#   ג(3) and the heavy-ball-on-the-ring limit (it contradicted 0 < b and the massless ring) are removed; θ(t) is no
#   longer asked separately; ד(1) says why the vertical-motion term is small (a factor θ^2), and the torque check in
#   the solution says why the ring's force is ≈ Mg. 25 points, one limit per part.
#   After a second timed student read (≈60 min, target ≈42): x_P(t) dropped (and OBJ-5.1-1 with it; ד 7 -> 6, ג 7 -> 8);
#   b = L/2 is checked only in א; ב's limit is now b = L, m << M against lesson 8.6's free rod (v_P -> -2 m v0/M, the
#   top end moves back) and ג's is m << M (ratio 1/4, three quarters of the energy stays in drift); ב(2) is one
#   line, omega = V/d = m v0 b/I_P with (M+m)d = I_P/b at b = 2L/3; ד(1) states that G moves only vertically in the
#   moving frame; the prompt says b is measured from P, not from the rod's centre as in 8.6; "מוט + כדור" -> "המוט
#   והכדור". The chapter-5 line above now means 5.2 only.
#   After a third timed read (46 min, target ≈41-42): ב(1) shows the identity I_cm + (M+m)d^2 = I_P it needs, and
#   no longer asks the ring's direction at b = L (the solution keeps it as ב's limit check).
id: E-final-b-1
type: bagrut
title: מוט שתלוי על טבעת חופשית
prompt: >-
  מוט אחיד במסה $M$ ובאורך $L$ תלוי בקצהו העליון, $P$, על טבעת קטנה שמסתה זניחה. הטבעת מושחלת על מסילה ישרה
  ואופקית ומחליקה עליה בלי חיכוך, והמוט מחובר אליה בציר בלי חיכוך, כך שהוא יכול להסתובב סביב $P$ במישור האנכי של
  המסילה. נתון שהכוח שהטבעת מפעילה על המוט אנכי תמיד, גם בזמן הפגיעה (הטבעת חסרת מסה, והמסילה חלקה). בהתחלה
  הכול במנוחה, והמוט תלוי אנכית. כדור קטן במסה $m$ נע אופקית, לאורך המסילה בכיוון $+x$, במהירות $v_0$, פוגע
  במוט בעומק $b$ מתחת ל-$P$, עם $0 < b \le L$ ($b$ נמדד מ-$P$, לא ממרכז המוט כמו בשיעור 8.6), ונדבק אליו. הפגיעה קצרה מאוד, והמוט לא זז בזמנה. תאוצת הכובד $g$.
  מזניחים את התנגדות האוויר ואת גודל הכדור.


  אחרי הפגיעה המוט והכדור הם גוף צפיד אחד, במסה $M + m$. נסמן ב-$G$ את מרכז המסה שלו, ב-$d$ את המרחק $PG$,
  וב-$I_P$ וב-$I_{cm}$ את מומנטי ההתמד שלו סביב צירים ניצבים למישור התנועה שעוברים דרך $P$ ודרך $G$:
  $$d = \frac{ML/2 + mb}{M + m},\qquad I_P = \tfrac13ML^2 + mb^2,\qquad I_{cm} = I_P - (M + m)d^2$$
  הזווית $\theta$ של המוט נמדדת מהאנך כלפי מטה, וחיובית כשהקצה התחתון זז בכיוון $+x$ (באיור, נגד כיוון השעון),
  ו-$\omega = \dot\theta$. להשוואה, **המוט הנעוץ** הוא אותו מוט עם אותו כדור, כשהטבעת מרותכת למסילה ו-$P$ ציר
  קבוע.
diagramAlt: >-
  מבט מהצד. למעלה קו אופקי, המסילה, ועליה עיגול קטן, הטבעת $P$. מהטבעת יורד מוט אנכי. משמאל למוט כדור קטן $m$,
  וחץ ממנו ימינה, אל המוט, מסומן $v_0$. קו מקווקו נוטה מ-$P$ ימינה ולמטה מראה את המוט בזווית $\theta$ מהאנך, וקשת
  בין המוט האנכי לקו המקווקו מסומנת $\theta$. משמאל שני חיצי מידה אנכיים: $b$, מגובה $P$ עד הקו של הכדור, ו-$L$,
  מגובה $P$ עד הקצה התחתון של המוט. מימין חץ למטה מסומן $g$, ולמטה משמאל חץ ימינה מסמן את הכיוון החיובי $x$.

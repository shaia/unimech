# E-final-b-2: a satellite on a circular orbit enters a thin dust cloud whose drag is linear, F = -b v, and spirals in
# slowly. Joins chapter 6 (6.5 the energy of a circular orbit, E = -K, U = 2E, Kepler III) with chapter 3 (3.3
# dE/dt = power of the non-conservative force; 3.7 dL/dt = torque about the planet, gravity central), chapter 2 (2.6 the
# radial second law; 2.7 linear drag, the rate b/m) and chapter 1 (1.4 the radial velocity component).
# Overlap: W-6.5-10 solves a finite energy loss (the satellite speeds up, dK = -dE, dU = 2dE) and W-3.2 (MIT 8.012)
# a quadratic drag per revolution (dr = -4 pi A r^2); here both are footholds at most. The asks are new: the linear
# drag gives r = r1 e^{-2bt/m} and v = v1 e^{+bt/m} (the 2.7 decay rate with the opposite sign); a second, exact
# route through the torque, dL/dt = -(b/m) L on any path; the power of gravity 2bv^2 through the radial velocity; the
# time and the number of revolutions of the fall, N = m(w2 - w1)/(6 pi b).
# Every number was recomputed by .scratch/exam-b/q2.ts, all checks passing:
#   א: E = -K, U = 2E, L = m sqrt(GMr), Kepler III, dE/dr by a finite difference;
#   a full 2D RK4 run (rk4Step, gravity + drag, no circular assumption; GM = 3.98e14, b/m = 1e-7 s^-1) reproduces,
#   orbit-averaged, r(t) and v(t) (relErr 4e-8), rdot = -2br/m and P_g = 2bv^2 = -2 P_d (relErr < 1e-5),
#   dK/dt = bv^2, the fall time t12 and the accumulated angle N (relErr 5e-6), and L = L1 e^{-bt/m} exactly
#   (relErr 1e-13); dimensionless runs with b/(m w1) = 1e-3 and 1e-2 keep L exact and the quasi-circular t12, N within
#   1e-5 and 1e-3 (second order in b/(m w)); the limit r2 -> r1 gives N -> w1 t12/(2 pi).
#   Numbers (ד): m/(2b) = 5.0e6 s, ln(r1/r2) = 0.0588, t12 = 2.94e5 s = 3.4 d; w1 = 1.077e-3 rad/s,
#   (r1/r2)^{3/2} = 1.0923, w2 = 1.177e-3 rad/s, N = 52.7; v1 = 7540 m/s, v2 = 7766 m/s, v2/v1 = 1.030;
#   4 pi b/(m w1) = 1.17e-3; T1 = 5833 s, T2 = 5340 s.
# reviewed 2026-11-20 (independent, .scratch/exam-b-review/q2.ts): every number recomputed from the printed values;
#   a 2D RK4 (gravity + drag, started on the spiral) gives L = L1 e^{-bt/m} to 3e-13, orbit-averaged r(t), v(t) to
#   1e-7, P_g = 2bv^2 = 2|P_d| to 5e-6, alpha = 2b/(m w), the time to reach r2 = t12 (5e-6) and N(t12) = 52.73.
#   Changed: b/m printed to three figures (1.00e-7, m/2b = 5.00e6); the circle that defines alpha is named as
#   centred at O. Overlap: W-6.5-10 states the qualitative "gravity does twice the drag's work"; ג derives it, fine.
#   After the student read (timed 40-45 min): ב(2) now asks to explain, from E = -K and U = 2E, where the extra K
#   comes from, and the rubric grades it (its line split in two). r(t) stays derived twice: ג(1)'s is one line and is
#   the point of the part, the exact torque law confirming the energy route's quasi-circular result.
#   After a second timed read (~48 min, target ~42): ג(1) no longer re-derives r(t) (kept in the solution as an
#   ungraded check) and separates the exact law dL/dt = -(b/m)L from the near-circular estimate of |dL| per turn;
#   ג(3) no longer asks P_g + P_d = dK/dt (ב(2)'s energy explanation covers it; the ratio 2 stays); ד(3) no longer
#   asks days or v2/v1; ב(2) defines the straight-line body's mass m and initial speed v0.
id: E-final-b-2
type: bagrut
title: לוויין שנבלם בענן אבק
prompt: >-
  לוויין במסה $m$ מקיף כוכב לכת במסה $M$, עם $M \gg m$, כך שכוכב הלכת נשאר במנוחה במערכת ייחוס אינרציאלית. הראשית
  $O$ במרכז כוכב הלכת, $r$ המרחק של הלוויין ממנה, ו-$G$ קבוע הכבידה. עד הרגע $t = 0$ הלוויין נע במסלול מעגלי ברדיוס
  $r_1$, במהירות $v_1$ ובמהירות זוויתית $\omega_1$. מ-$t = 0$ הוא נע בתוך ענן אבק דליל ואחיד, שנמצא במנוחה ביחס לכוכב
  הלכת ומפעיל על הלוויין כוח גרר ליניארי, $\vec F_d = -b\vec v$, עם $b > 0$ קבוע ($\vec v$ המהירות של הלוויין).


  הגרר חלש: בהקפה אחת הוא משנה את המסלול מעט מאוד, ולכן אפשר לתאר את התנועה כמסלול כמעט מעגלי שהרדיוס שלו, $r(t)$,
  קטן לאט (בחלק ב תנסחו את התנאי לכך). הרדיוס של כוכב הלכת קטן מכל המרחקים בשאלה, ומלבד הכבידה והגרר לא פועלים על
  הלוויין כוחות. האנרגיה הפוטנציאלית הכבידתית מתאפסת באינסוף.
diagramAlt: >-
  מבט מלמעלה על מישור המסלול. במרכז עיגול קטן, כוכב הלכת $M$. סביבו עיגול מקווקו, המסלול המעגלי ברדיוס $r_1$, וקו
  מהמרכז אליו מסומן $r_1$. מנקודה על העיגול המקווקו מימין יוצאת ספירלה שמתקרבת לאט למרכז, נגד כיוון השעון, ומסתיימת
  בלוויין $m$, נקודה מתחת למרכז. מהלוויין יוצאים שלושה חצים: המהירות $v$ ימינה, כמעט משיקה למעגל ונוטה מעט פנימה;
  כוח הגרר $F_d$ שמאלה, הפוך למהירות; וכוח הכבידה $F_g$ כלפי מעלה, אל מרכז כוכב הלכת.

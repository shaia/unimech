parts:
  - label: א
    type: open
    points: 5
    level: basic
    objectives: [OBJ-2.6-1, OBJ-6.5-2, OBJ-3.7-1]
    prompt: >-
      בלי גרר: בטאו באמצעות $G$, $M$, $m$ ו-$r$ את גודל המהירות $v$, את המהירות הזוויתית $\omega$ ואת גודל התנע הזוויתי
      $L$ סביב $O$ של לוויין במסלול מעגלי ברדיוס $r$, ואת האנרגיה הקינטית $K$, האנרגיה הפוטנציאלית $U$ והאנרגיה המכנית
      $E = K + U$. הראו ש-$E = -K$ ו-$U = 2E$, ובדקו שהקשר בין זמן המחזור $T$ ל-$r$ הוא החוק השלישי של קפלר.
    solution:
      - { kind: law, text: 'הכוח היחיד על הלוויין הוא כוח הכבידה שכוכב הלכת מפעיל עליו, $GMm/r^2$ אל $O$. במסלול מעגלי הוא הכוח השקול הרדיאלי, והחוק השני ברכיב הרדיאלי (כלפי $O$) נותן $\dfrac{mv^2}{r} = \dfrac{GMm}{r^2}$. האנרגיה הפוטנציאלית הכבידתית, עם אפס באינסוף: $U = -\dfrac{GMm}{r}$.' }
      - { kind: manipulation, text: '$v = \sqrt{\dfrac{GM}{r}}$, $\omega = \dfrac vr = \sqrt{\dfrac{GM}{r^3}}$, ו-$L = mvr = m\sqrt{GMr}$ (המהירות ניצבת לרדיוס). $K = \tfrac12mv^2 = \dfrac{GMm}{2r}$, ולכן $E = K + U = \dfrac{GMm}{2r} - \dfrac{GMm}{r} = -\dfrac{GMm}{2r}$. כלומר $E = -K$, ו-$U = -\dfrac{GMm}{r} = 2E$.' }
      - { kind: limit, text: '$T = \dfrac{2\pi}{\omega}$, ולכן $T^2 = \dfrac{4\pi^2r^3}{GM}$: החוק השלישי של קפלר, עם חצי הציר הראשי $a = r$ של מעגל, בלי תלות ב-$m$. וכש-$r \to \infty$: $v$, $K$ ו-$E$ שואפים לאפס, ו-$E$ שלילית תמיד, כמו שמתאים למסלול קשור.' }
      - { kind: units, text: '$GM/r$ ביחידות $\dfrac{\text{N}\cdot\text{m}^2}{\text{kg}^2}\cdot\dfrac{\text{kg}}{\text{m}} = \text{m}^2/\text{s}^2$, ולכן $v$ ב-$\text{m/s}$, $\omega$ ב-$\text{s}^{-1}$, $m\sqrt{GMr}$ ב-$\text{kg}\cdot\text{m}^2/\text{s}$, ו-$GMm/r$ ב-$\text{J}$.' }
      - { kind: result, text: '$v = \sqrt{GM/r}$, $\omega = \sqrt{GM/r^3}$, $L = m\sqrt{GMr}$; $K = \dfrac{GMm}{2r}$, $U = -\dfrac{GMm}{r}$, $E = -\dfrac{GMm}{2r} = -K$, $U = 2E$; $T^2 = 4\pi^2r^3/(GM)$.' }
    rubric:
      - text: 'כתבתי את החוק השני ברכיב הרדיאלי, עם הכבידה ככוח השקול, ומצאתי $v$, $\omega$ ו-$L = m\sqrt{GMr}$.'
      - text: 'מצאתי $K = GMm/(2r)$, $U = -GMm/r$ ו-$E = -GMm/(2r)$, והראיתי ש-$E = -K$ ו-$U = 2E$.'
        weight: 2
      - text: 'בדקתי ש-$T^2 = 4\pi^2r^3/(GM)$, החוק השלישי של קפלר.'

  - label: ב
    type: open
    points: 6
    level: mid
    standalone: false
    objectives: [OBJ-3.3-1, OBJ-2.7-1, OBJ-6.5-2]
    prompt: >-
      (1) עכשיו עם הגרר. כתבו את קצב השינוי של האנרגיה המכנית $E$ של הלוויין לפי ההספק של הגרר, והניחו שבכל רגע
      מתקיימים הקשרים של חלק א, עם $r(t)$ במקום $r$. מצאו את $\dot r$ באמצעות $b$, $m$ ו-$r$, ואת $r(t)$ ואת $v(t)$
      באמצעות $r_1$, $v_1$, $b$, $m$ ו-$t$.


      (2) לפי (1), גודל המהירות של הלוויין גדל, אף שהכוח היחיד מלבד הכבידה מנוגד לתנועה. הסבירו בעזרת הקשרים
      $E = -K$ ו-$U = 2E$ מחלק א מאין באה התוספת לאנרגיה הקינטית. השוו את $v(t)$ למהירות של גוף
      במסה $m$ שנע על קו ישר, במהירות התחלתית $v_0$, כשהכוח היחיד עליו הוא אותו גרר, $\vec F_d = -b\vec v$, ובדקו את $r(t)$ בגבול $b \to 0$.


      (3) ההנחה של מסלול כמעט מעגלי טובה כשבהקפה אחת הרדיוס משתנה בחלק קטן מאוד מעצמו. מצאו את השינוי היחסי
      $|\Delta r|/r$ בהקפה אחת, ונסחו את התנאי כאי-שוויון בין $b/m$ ל-$\omega$. האם התנאי משתפר או מחמיר בזמן שהלוויין
      יורד?
    solution:
      - { kind: law, text: 'הכבידה כוח משמר, והיא כלולה ב-$U$. הגרר הוא הכוח הלא משמר היחיד, ולכן קצב השינוי של האנרגיה המכנית הוא ההספק שלו: $\dfrac{dE}{dt} = \vec F_d\cdot\vec v = -bv^2$.' }
      - { kind: manipulation, text: '(1) מחלק א, $E = -\dfrac{GMm}{2r}$, ולפי כלל השרשרת $\dfrac{dE}{dt} = \dfrac{GMm}{2r^2}\,\dot r$. ובמסלול המעגלי $v^2 = GM/r$, ולכן ההספק של הגרר הוא $P_d = -bv^2 = -\dfrac{bGM}{r}$. משווים: $\dfrac{GMm}{2r^2}\,\dot r = -\dfrac{bGM}{r}$, כלומר $\dot r = -\dfrac{2b}{m}\,r$. בהפרדת משתנים, $\dfrac{dr}{r} = -\dfrac{2b}{m}\,dt$, ועם $r(0) = r_1$: $r(t) = r_1e^{-2bt/m}$. מכאן $v = \sqrt{GM/r} = v_1e^{bt/m}$.' }
      - { kind: manipulation, text: '(2) על קו ישר, $m\dot v = -bv$, ולכן $v = v_0e^{-bt/m}$: המהירות דועכת בקצב $b/m$, עם קבוע הזמן $m/b$. במסלול המהירות **גדלה** באותו קצב בדיוק, $v = v_1e^{+bt/m}$. ההסבר באנרגיה: $E$ יורדת, ומכיוון ש-$E = -K$, האנרגיה הקינטית עולה באותה מידה, $\dfrac{dK}{dt} = -\dfrac{dE}{dt} = bv^2$, בזמן ש-$U = 2E$ יורדת פי שניים. הירידה ב-$U$ משלמת גם על מה שהגרר לוקח וגם על התוספת ל-$K$.' }
      - { kind: manipulation, text: '(3) בהקפה אחת, $T = 2\pi/\omega$, ולכן $\dfrac{|\Delta r|}{r} = \dfrac{2b}{m}\cdot\dfrac{2\pi}{\omega} = \dfrac{4\pi b}{m\omega}$. התנאי: $\dfrac{4\pi b}{m\omega} \ll 1$, כלומר $\dfrac bm \ll \omega$, קבוע הזמן $m/b$ ארוך מאוד לעומת זמן המחזור. $\omega = \sqrt{GM/r^3}$ גדלה כש-$r$ קטן, ו-$b/m$ קבוע, ולכן התנאי **משתפר** בזמן שהלוויין יורד: אם הוא מתקיים ב-$r_1$, הוא מתקיים כל הדרך.' }
      - { kind: limit, text: '$b \to 0$: $r(t) = r_1$ ו-$v(t) = v_1$, המסלול המעגלי של חלק א. גם לוויין כבד מאוד, $m \to \infty$ עם $b$ קבוע, כמעט לא מושפע, כמו שקבוע הזמן $m/b$ גדל עם המסה בשיעור 2.7. ובזמנים קצרים, $t \ll m/b$: $r \approx r_1\left(1 - \dfrac{2bt}{m}\right)$, ירידה בקצב קבוע $2br_1/m$.' }
      - { kind: units, text: '$b$ הוא כוח חלקי מהירות, ב-$\text{kg/s}$, ולכן $b/m$ ב-$\text{s}^{-1}$ והמעריך $bt/m$ חסר יחידות; $\dot r = 2br/m$ ב-$\text{m/s}$; $b/(m\omega)$ חסר יחידות.' }
      - { kind: result, text: '$\dot r = -\dfrac{2b}{m}\,r$, $r(t) = r_1e^{-2bt/m}$ ו-$v(t) = v_1e^{bt/m}$: הלוויין יורד ומהירותו גדלה, באותו קצב $b/m$ שבו הגרר לבדו היה מאט אותו על קו ישר. התנאי: $\dfrac{4\pi b}{m\omega} \ll 1$, והוא משתפר בירידה.' }
    rubric:
      - text: 'כתבתי $dE/dt = -bv^2$ ואת $dE/dt = \dfrac{GMm}{2r^2}\,\dot r$, וקיבלתי $\dot r = -2br/m$.'
        weight: 2
      - text: 'מצאתי $r(t) = r_1e^{-2bt/m}$ ו-$v(t) = v_1e^{bt/m}$, והסברתי בעזרת $E = -K$ ו-$U = 2E$ ש-$K$ גדלה כי $U$ יורדת פי שניים ממה שהגרר לוקח.'
      - text: 'השוויתי לדעיכה $v_0e^{-bt/m}$ על קו ישר, ובדקתי שכש-$b \to 0$ חוזרים למעגל של חלק א.'
      - text: 'מצאתי $|\Delta r|/r = 4\pi b/(m\omega)$ בהקפה, ניסחתי את התנאי $b/m \ll \omega$, וקבעתי שהוא משתפר כש-$r$ קטן.'

  - label: ג
    type: open
    points: 7
    level: bagrut
    standalone: false
    objectives: [OBJ-3.7-1, OBJ-3.7-2, OBJ-1.4-1, OBJ-3.3-1]
    prompt: >-
      (1) חשבו את מומנט הכוח סביב $O$ של כל אחד משני הכוחות על הלוויין, והראו ש-$\dfrac{d\vec L}{dt} = -\dfrac bm\,\vec L$
      **בדיוק**: בכל מסלול, בלי ההנחה של מסלול כמעט מעגלי. מצאו מכאן את $L(t)$.
      אחר כך, בקירוב של מסלול כמעט מעגלי (עם $L$ וזמן המחזור של מסלול מעגלי מחלק א): כמה תנע זוויתי $|\Delta L|$
      הלוויין מאבד בהקפה אחת? בטאו באמצעות $b$ ו-$r$.


      (2) מחלק ב, $\dot r = -2br/m$: המסלול הוא ספירלה פנימה, ולמהירות יש רכיב רדיאלי. מצאו את הזווית הקטנה $\alpha$ בין
      המהירות $\vec v$ לבין המשיק למעגל שמרכזו ב-$O$ ושעובר דרך הלוויין, באמצעות $b$, $m$ ו-$\omega$.


      (3) חשבו את ההספק $P_g$ של כוח הכבידה על הלוויין ואת ההספק $P_d$ של הגרר, באמצעות $b$ ו-$v$. איזה כוח עושה על
      הלוויין עבודה חיובית, ופי כמה היא גדולה בערכה המוחלט מהעבודה של הגרר? בדקו מה קורה ל-$\alpha$ ול-$P_g$ בגבול $b \to 0$.
    solution:
      - { kind: law, text: 'כוכב הלכת במנוחה, ולכן $O$ נקודה קבועה במערכת אינרציאלית, ו-$\dfrac{d\vec L}{dt} = \sum\vec r\times\vec F$, עם $\vec L = \vec r\times m\vec v$. ההספק של כוח הוא $P = \vec F\cdot\vec v$. המהירות בקואורדינטות קוטביות: $\vec v = \dot r\,\hat r + r\dot\theta\,\hat\theta$.' }
      - { kind: manipulation, text: '(1) הכבידה פועלת לאורך $\vec r$ (כוח מרכזי), ולכן $\vec r\times\vec F_g = 0$. לגרר: $\vec r\times\left(-b\vec v\right) = -\dfrac bm\,\vec r\times m\vec v = -\dfrac bm\,\vec L$. לכן $\dfrac{d\vec L}{dt} = -\dfrac bm\,\vec L$ בכל מסלול: הכיוון של $\vec L$ קבוע (התנועה נשארת במישור), והגודל $L = L_1e^{-bt/m}$, בלי שום קירוב. (בדיקה, מעבר למה שנשאל: עם $L = m\sqrt{GMr}$ מחלק א, $\sqrt{r/r_1} = e^{-bt/m}$, כלומר $r = r_1e^{-2bt/m}$, כמו בחלק ב.) בקירוב של מסלול כמעט מעגלי, $L = mvr$ ו-$T = 2\pi r/v$, ובהקפה אחת: $|\Delta L| = \dfrac bm\,L\cdot T = \dfrac bm\cdot mvr\cdot\dfrac{2\pi r}{v} = 2\pi br^2$.' }
      - { kind: manipulation, text: '(2) הרכיב הרדיאלי של המהירות הוא $v_r = \dot r = -\dfrac{2b}{m}\,r$ (פנימה), והרכיב המשיקי $v_\theta = r\dot\theta \approx \omega r$. לכן $\tan\alpha = \dfrac{|v_r|}{v_\theta} = \dfrac{2b}{m\omega}$, ולפי התנאי של חלק ב זו זווית קטנה: $\alpha \approx \dfrac{2b}{m\omega}$, והמהירות נוטה פנימה מהמשיק.' }
      - { kind: manipulation, text: '(3) הכבידה, $\vec F_g = -\dfrac{GMm}{r^2}\,\hat r$, נותנת $P_g = \vec F_g\cdot\vec v = -\dfrac{GMm}{r^2}\,\dot r = \dfrac{GMm}{r^2}\cdot\dfrac{2br}{m} = \dfrac{2bGM}{r} = 2bv^2 > 0$. ובדרך הזווית: הרכיב של הכבידה לאורך המהירות הוא $\dfrac{GMm}{r^2}\sin\alpha = m\omega^2r\cdot\dfrac{2b}{m\omega} = 2b\,\omega r = 2bv$. הגרר: $P_d = -bv^2$. הכבידה עושה את העבודה החיובית, פי $2$ בערכה המוחלט מהעבודה של הגרר. (הסכום, $bv^2$, הוא $dK/dt$ של חלק ב: לאורך המהירות הכוח השקול הוא $bv$ קדימה.)' }
      - { kind: limit, text: '$b \to 0$: $\alpha \to 0$, המהירות משיקה למעגל וניצבת לכבידה, ו-$P_g \to 0$: במסלול מעגלי הכבידה לא עושה עבודה, כמו כל כוח שניצב למהירות. ובדיקה נוספת: $P_g = -\dfrac{dU}{dt}$, ומ-$U = 2E$ מקבלים $\dfrac{dU}{dt} = 2\dfrac{dE}{dt} = -2bv^2$, אותו $P_g = 2bv^2$.' }
      - { kind: units, text: '$bv^2$ ביחידות $\dfrac{\text{kg}}{\text{s}}\cdot\dfrac{\text{m}^2}{\text{s}^2} = \text{W}$; $br^2$ ביחידות $\text{kg}\cdot\text{m}^2/\text{s}$, כמו תנע זוויתי; $\dfrac{b}{m\omega}$ חסר יחידות, כמו זווית.' }
      - { kind: result, text: 'לכבידה אין מומנט סביב $O$, ולגרר $\vec r\times\vec F_d = -\tfrac bm\vec L$, ולכן $L = L_1e^{-bt/m}$ בדיוק; בקירוב של מסלול כמעט מעגלי, $|\Delta L| = 2\pi br^2$ בהקפה. $\alpha \approx \dfrac{2b}{m\omega}$. $P_g = 2bv^2$, $P_d = -bv^2$: הכבידה עושה עבודה חיובית כפולה מזו שהגרר לוקח, וההפרש, $bv^2$, הוא $dK/dt$.' }
    rubric:
      - text: 'הראיתי שלכבידה אין מומנט סביב $O$ ושלגרר יש מומנט $\vec r\times\vec F_d = -\tfrac bm\vec L$, וקיבלתי $L = L_1e^{-bt/m}$.'
        weight: 2
      - text: 'מצאתי, בקירוב של מסלול כמעט מעגלי, שהלוויין מאבד $|\Delta L| = 2\pi br^2$ בהקפה.'
      - text: 'מצאתי $\alpha \approx 2b/(m\omega)$ מהרכיב הרדיאלי של המהירות.'
      - text: 'חישבתי $P_g = 2bv^2$ ו-$P_d = -bv^2$, קבעתי שהכבידה עושה את העבודה החיובית, פי $2$ בערכה המוחלט מהעבודה של הגרר.'
      - text: 'בדקתי ש-$\alpha \to 0$ ו-$P_g \to 0$ כש-$b \to 0$.'

  - label: ד
    type: open
    points: 7
    level: bagrut
    standalone: false
    objectives: [OBJ-6.5-2, OBJ-2.7-1]
    prompt: >-
      מחלק ב, $r(t) = r_1e^{-2bt/m}$.


      (1) מצאו את הזמן $t_{12}$ שבו הלוויין יורד מ-$r_1$ לרדיוס $r_2 < r_1$, באמצעות $b$, $m$, $r_1$ ו-$r_2$.


      (2) מצאו את מספר ההקפות $N$ שהלוויין משלים בזמן הזה, באמצעות $b$, $m$, $\omega_1 = \sqrt{GM/r_1^3}$ ו-$\omega_2 =
      \sqrt{GM/r_2^3}$. בדקו את $N$ בגבול $r_2 \to r_1$: השוו למספר ההקפות של לוויין שנע כל הזמן $t_{12}$ במהירות הזוויתית
      הקבועה $\omega_1$.


      (3) חשבו את $t_{12}$ ואת $N$ כש-$GM = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$,
      $r_1 = 7.00\cdot10^{6}\,\text{m}$, $r_2 = 6.60\cdot10^{6}\,\text{m}$ ו-$b/m = 1.00\cdot10^{-7}\,\text{s}^{-1}$, ובדקו
      שהתנאי של חלק ב מתקיים.
    solution:
      - { kind: law, text: 'הזווית שהלוויין עובר היא האינטגרל של המהירות הזוויתית על הזמן, $\theta = \displaystyle\int\omega\,dt$, ומספר ההקפות $N = \theta/(2\pi)$. בכל רגע $\omega = \sqrt{GM/r^3}$ מחלק א.' }
      - { kind: manipulation, text: '(1) $r_2 = r_1e^{-2bt_{12}/m}$, ולכן $t_{12} = \dfrac{m}{2b}\ln\dfrac{r_1}{r_2}$.' }
      - { kind: manipulation, text: '(2) $\omega \propto r^{-3/2}$, ולכן $\omega(t) = \omega_1e^{3bt/m}$. $$N = \frac{1}{2\pi}\int_0^{t_{12}}\omega_1e^{3bt/m}\,dt = \frac{m\,\omega_1}{6\pi b}\left(e^{3bt_{12}/m} - 1\right)$$ ו-$e^{3bt_{12}/m} = \left(r_1/r_2\right)^{3/2} = \omega_2/\omega_1$, ולכן $N = \dfrac{m\left(\omega_2 - \omega_1\right)}{6\pi b}$.' }
      - { kind: limit, text: '$r_2 = r_1 - \Delta r$ עם $\Delta r \ll r_1$: $\ln\dfrac{r_1}{r_2} \approx \dfrac{\Delta r}{r_1}$, ולכן $t_{12} \approx \dfrac{m\,\Delta r}{2br_1} = \dfrac{\Delta r}{|\dot r|}$, ירידה בקצב הקבוע של חלק ב. ו-$\omega_2 \approx \omega_1\left(1 + \dfrac{3\Delta r}{2r_1}\right)$, ולכן $N \approx \dfrac{m\,\omega_1}{6\pi b}\cdot\dfrac{3\Delta r}{2r_1} = \dfrac{\omega_1}{2\pi}\cdot\dfrac{m\,\Delta r}{2br_1} = \dfrac{\omega_1t_{12}}{2\pi}$: מספר ההקפות במהירות זוויתית קבועה, כמו שצריך כשהרדיוס כמעט לא משתנה. וכש-$b \to 0$ עם $r_2$ קבוע, $t_{12}$ ו-$N$ שואפים לאינסוף: בלי גרר הלוויין לא יורד.' }
      - { kind: units, text: '$m/b$ ב-$\text{s}$, ולכן $t_{12}$ בשניות; $m\,\omega/b$ ביחידות $\text{s}\cdot\text{s}^{-1}$, ו-$N$ חסר יחידות, כמו מספר הקפות.' }
      - { kind: substitution, text: '$\dfrac{m}{2b} = 5.00\cdot10^{6}\,\text{s}$ ו-$\ln\dfrac{7.00}{6.60} = 0.0588$, ולכן $t_{12} = 2.94\cdot10^{5}\,\text{s}$, כ-$3.4$ ימים. $\omega_1 = \sqrt{\dfrac{3.98\cdot10^{14}}{\left(7.00\cdot10^{6}\right)^3}} = 1.077\cdot10^{-3}\,\text{s}^{-1}$ ו-$\left(r_1/r_2\right)^{3/2} = 1.0923$, ולכן $\omega_2 = 1.177\cdot10^{-3}\,\text{s}^{-1}$ ו-$N = \dfrac{1.077\cdot10^{-3}\cdot0.0923}{6\pi\cdot1.00\cdot10^{-7}} = 52.7$, כ-$53$ הקפות (בדיקה: זמני המחזור $5833\,\text{s}$ ו-$5340\,\text{s}$, ו-$t_{12}$ חלקי הממוצע שלהם נותן כ-$53$). התנאי: $\dfrac{4\pi b}{m\omega_1} = 1.17\cdot10^{-3} \ll 1$, והוא רק משתפר בירידה.' }
      - { kind: result, text: '$t_{12} = \dfrac{m}{2b}\ln\dfrac{r_1}{r_2}$ ו-$N = \dfrac{m\left(\omega_2 - \omega_1\right)}{6\pi b}$, ו-$N \to \omega_1t_{12}/(2\pi)$ כש-$r_2 \to r_1$. במספרים: $t_{12} = 2.94\cdot10^{5}\,\text{s}$ (כ-$3.4$ ימים) ו-$N = 52.7$.' }
    rubric:
      - text: 'מצאתי $t_{12} = \dfrac{m}{2b}\ln\dfrac{r_1}{r_2}$.'
      - text: 'כתבתי $\omega(t) = \omega_1e^{3bt/m}$, חישבתי את האינטגרל של $\omega$ על הזמן, וקיבלתי $N = m(\omega_2 - \omega_1)/(6\pi b)$.'
        weight: 2
      - text: 'בדקתי שכש-$r_2 \to r_1$, $N \to \omega_1t_{12}/(2\pi)$.'
      - text: 'חישבתי $t_{12} \approx 2.94\cdot10^{5}\,\text{s}$ ו-$N \approx 53$, ובדקתי ש-$4\pi b/(m\omega_1) \ll 1$.'

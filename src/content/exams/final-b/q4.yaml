# Final exam B, question 4: a puck on a frictionless table, tied by a light string through a small smooth hole O to a
# block hanging below it. Joins chapters 1 (1.4 polar components), 2 (2.5 the string constraint, 2.3 tension as an
# unknown, 2.6 circular motion), 3 (3.7 central force, L conserved; 3.3 energy; 3.5 impulse), 6 (6.3 the effective
# potential) and 5 (5.2 small oscillations with an effective inertia, 5.1 amplitude from initial conditions), with 4.4
# (a short blow).
# Overlap grep: workbook W-6.3-10 already solves this setup's L conservation, U_eff, boundedness, turning points and
# circular radius (with numbers), and W-2.6-06 its circular speed; Q-3-bagrut-2, ex-1-4-6, ex-3-1-6 and lesson 3.7
# solve the string pulled by a hand. U_eff is therefore only a foothold here (ג(1)). New: the tension
# T = mM/(m+M)(g + r thdot^2) and why the string never slackens; the radial frequency with radial inertia m + M and
# omega_r/Omega0 = sqrt(3m/(m+M)), so the near-circular orbit closes after one turn only for M = 2m; and a blow on the
# hanging block, its impulse shared through the string.
# Recomputed in .scratch/exam-b/q4.ts by an independent route: the full two-body system in Cartesian coordinates, the
# string a stiff, critically damped spring that can only pull (no polar coordinates, no constraint elimination),
# packed into one body in mass-weighted coordinates and stepped with rk4Step (src/physics/motion.ts):
#   א r(1.5 s) of a generic orbit (m = 0.7, M = 0.3, r = 0.5, rdot = 0.3, v_t = 1.2) against the derived r equation
#     (relErr 2e-6); L conserved; L = 0 gives r'' = -Mg/(m+M);
#   ב T = mM/(m+M)(g + r thdot^2) (relErr 1e-6); the smallest T over a large-amplitude orbit, 2.063 N, stays above
#     mMg/(m+M) = 2.058 N;
#   ג the radial period and the angle between minima of r at (m, M) = (0.7, 0.3), (0.2, 0.4), (0.3, 2.4) (relErr
#     < 2e-4): omega_r/Omega0 = 1.449, 1.000, 0.577 = sqrt(3m/(m+M)); U_eff''(r0) = 3Mg/r0 by finite difference;
#   ד a 1 ms pulse J on the block only: rdot after = -J/(m+M) (relErr 3e-3), r thdot unchanged, amplitude relErr
#     1.4e-3, r_min 0.4844 m (the angle of the first minimum, ~91 deg, is no longer asked).
# Asks now (after review): א equations, L conserved (net force central), the r equation with its L = 0 check; ב T,
#   T >= mMg/(m+M) while taut, the circle, the M >> m limit; ג E with U_eff given, stability, omega_r and
#   omega_r/Omega0, closure for M = 2m (the M << m limit, sqrt 3, is an ungraded remark in the solution); ד the blow
#   (ż = −ṙ during it given; rdot, r thdot, J_T, why L and U_eff are unchanged, limits), r(t), numbers Omega0,
#   omega_r, r_min, J_T.
# Exam numbers (ד): m = 0.20 kg, M = 0.40 kg, r0 = 0.50 m, J = 0.060 N s → Omega0 = omega_r = 6.26 rad/s,
#   rdot = -0.100 m/s, A = 0.0160 m, r_min = 0.484 m, J_T = 0.0200 N s.
# reviewed 2026-11-20 (independent, .scratch/exam-b-review/q4.ts): the puck in Cartesian coordinates stepped with
#   rk4Step, the tension solved each instant from Newton's law on each body plus z = l - r; energy
#   1/2 m v^2 + 1/2 M rdot^2 + M g r conserved to 1e-14 (checks T). (m+M) rdd = L^2/(m r^3) - Mg (1.7e-8), T formula and
#   T = M(g + rdd), L = 0 gives -Mg/(m+M); radial period and omega_r/Omega0 = sqrt(3m/(m+M)) at (0.2, 0.4), (0.7, 0.3),
#   (0.5, 0.01), (0.1, 3.0) (< 1e-7). Closure at M = 2m vs amplitude: angle between minima 359.997, 359.973, 359.70,
#   358.83, 355.57 deg for r in +-1%, 3%, 10%, 20%, ~40% of r0 (deviation ~A^2: closure to first order only). ד: 1 ms
#   pulse, rdot -0.0998, J_T 0.01997, r_min 0.4844 (r0 - A = 0.4840), first minimum at 91.4 deg, then 359.97 deg apart.
#   Changed: ב(1) the never-slack claim restricted to motions that start with the string taut (a block thrown up fast
#   slackens it); ג(1) U_eff given ("הראו ש") and the M >> m ask dropped, to bring the question to ~45 min; ג(3) rubric
#   no longer grades irrationality (never asked); the M << m step shows r0 Omega0^2 = Mg/m << g before T -> Mg; the
#   closure remark says first order in the amplitude with the computed 359.7 deg, and the 6.3 remark leads with "only
#   near-circular orbits close". Theme shared with final-a q3 (n = 0 gives sqrt 3); the radial inertia m + M and the
#   blow are new. Second pass (student timing, 48 -> ~42 min): ב(1) asks T >= mMg/(m+M) (the "smallest tension" ask
#   was ambiguous); ב(3)'s thdot = 0 limit dropped (repeats א's L = 0); ג(3) asks to show T ~ Mg for M << m from ב;
#   ד(1) asks why L, U_eff, r0 and omega_r are unchanged; ד(3)'s angle ask dropped; א(2) asks about the net force's
#   torque (gravity and the normal force each have a horizontal torque, which cancel). Third pass (49 -> ~42 min):
#   ג(3) keeps only the M = 2m closure (it feeds ד's omega_r = Omega0); the M << m limit and the spring comparison
#   moved to an ungraded remark; ד(1) states that the string stays taut during the blow, so ż = −ṙ holds in it.
id: E-final-b-4
type: bagrut
title: דסקית על שולחן ומשקולת מתחת לחור
prompt: >-
  דסקית קטנה בעלת מסה $m$ מחליקה בלי חיכוך על שולחן אופקי. חוט קל באורך $\ell$ קשור אליה, עובר דרך חור קטן וחלק
  $O$ בשולחן, ובקצהו התחתון תלויה משקולת קטנה בעלת מסה $M$, שנעה רק לאורך האנך שמתחת לחור. את מקום הדסקית על
  השולחן מתארים בקואורדינטות קוטביות $(r, \theta)$ עם ראשית ב-$O$, ו-$\hat r$ פונה מ-$O$ אל הדסקית. $z$ הוא העומק של
  המשקולת מתחת לחור, חיובי כלפי מטה, ולכן כל עוד החוט מתוח $r + z = \ell$. $T$ היא המתיחות בחוט, ו-$L = mr^2\dot\theta$
  הוא התנע הזוויתי של הדסקית ביחס ל-$O$ (הרכיב האנכי שלו). תאוצת הכובד היא $g$. הזניחו את החיכוך בחור, והניחו
  שהדסקית לא מגיעה לחור ושהמשקולת לא מגיעה לשולחן.
diagramAlt: >-
  מבט מהצד. שולחן אופקי עם חור קטן $O$ באמצעו. על השולחן, משמאל לחור, דסקית שמסומנת $m$, ומעליה סימן של עיגול עם נקודה
  בצבע המהירות, שמסומן $v$: המהירות שלה ניצבת לדף, החוצה. חוט יוצא מהדסקית לאורך השולחן אל החור, יורד דרכו, ובקצהו
  התחתון תלויה משקולת שמסומנת $M$. מתחת לשולחן קו מידה אופקי מהדסקית עד החוט שיורד מהחור, שמסומן $r$. מימין למשקולת
  חץ כלפי מטה שמסומן $z$, הכיוון החיובי של העומק, ובקצה הימני חץ כלפי מטה בצבע התאוצה שמסומן $g$.

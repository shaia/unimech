parts:
  - label: א
    type: open
    points: 5
    level: basic
    objectives: [OBJ-9.2-1, OBJ-10.1-1]
    prompt: >-
      נמקו מדוע $\tau_\pi$ הוא זמן עצמי, ובטאו את המרחק הממוצע $d$ שהפיון עובר במעבדה עד שהוא דועך באמצעות גודל התנע
      שלו במעבדה $p$, ו-$M$, $c$ ו-$\tau_\pi$. אחר כך חשבו את $d$ לפיון שהאנרגיה היחסותית שלו במעבדה
      $E_\pi = 540\,\text{MeV}$, כאשר $Mc^2 = 135.0\,\text{MeV}$, $\tau_\pi = 8.5\cdot10^{-17}\,\text{s}$ ו-$c = 3.0\cdot10^8\,\text{m/s}$.
      פי כמה $d$ גדול מהמרחק שהיה מתקבל בלי התארכות הזמן? בדקו את הביטוי ל-$d$ בגבול $\beta \to 0$.
    solution:
      - kind: law
        text: >-
          $\tau_\pi$ נמדד במערכת $S'$, שבה הפיון נח, ולכן שני המאורעות, היצירה והדעיכה, קורים בה באותו מקום: זה הזמן
          שמודד שעון שנע עם הפיון, זמן עצמי. בכל מערכת אחרת הזמן בין אותם מאורעות ארוך פי $\gamma$, $\Delta t = \gamma\,\Delta\tau$
          (התארכות זמן, שיעור 9.2). ותנע הפיון במעבדה $p = \gamma M\beta c$ (שיעור 10.1).
      - kind: manipulation
        text: >-
          במעבדה הפיון חי בממוצע $\gamma\tau_\pi$ ונע במהירות $\beta c$, ולכן $d = \beta c\cdot\gamma\tau_\pi$. מהתנע,
          $\gamma\beta = \dfrac{p}{Mc} = \dfrac{pc}{Mc^2}$, ולכן
          $$d = \gamma\beta\,c\tau_\pi = \frac{pc}{Mc^2}\,c\tau_\pi$$
      - kind: limit
        text: >-
          כש-$\beta \to 0$, $p \to 0$ ו-$d \to 0$: פיון שנח דועך במקום. בלי התארכות הזמן היה יוצא $\beta c\tau_\pi$, קטן פי
          $\gamma$; כש-$\beta \ll 1$, $\gamma \approx 1$ ושני הביטויים מתלכדים, הגבול של ניוטון. וכש-$\beta \to 1$, $d$ גדל
          בלי גבול יחד עם התנע, אף שהמהירות לא עוברת את $c$.
      - kind: units
        text: >-
          $pc/(Mc^2)$ חסר ממדים (שתי אנרגיות), ו-$c\tau_\pi$ ביחידות $\text{m/s}\cdot\text{s} = \text{m}$.
      - kind: substitution
        text: >-
          $\gamma = E_\pi/(Mc^2) = 540/135.0 = 4.00$, $\gamma\beta = \sqrt{\gamma^2 - 1} = \sqrt{15} = 3.87$ ($\beta = 0.968$),
          ו-$pc = \sqrt{15}\cdot135.0\,\text{MeV} = 523\,\text{MeV}$. $c\tau_\pi = 3.0\cdot10^8\cdot8.5\cdot10^{-17} = 2.55\cdot10^{-8}\,\text{m}$,
          ולכן $d = \sqrt{15}\cdot2.55\cdot10^{-8} = 9.88\cdot10^{-8}\,\text{m}$. בלי התארכות:
          $\beta c\tau_\pi = 0.968\cdot2.55\cdot10^{-8} = 2.47\cdot10^{-8}\,\text{m}$, קטן פי $\gamma = 4.00$.
      - kind: result
        text: >-
          $d = \dfrac{pc}{Mc^2}\,c\tau_\pi = \gamma\beta c\tau_\pi$. ב-$E_\pi = 540\,\text{MeV}$: $d \approx 9.9\cdot10^{-8}\,\text{m}$,
          כעשירית המיקרומטר, פי $4$ מהמרחק שבלי התארכות הזמן. גם פיון מהיר דועך כמעט במקום שבו נוצר, ולכן הגלאי רואה רק
          את הפוטונים.
    rubric:
      - text: >-
          נימקתי ש-$\tau_\pi$ זמן עצמי, כי הוא נמדד במערכת שבה הפיון נח, וכתבתי שבמעבדה זמן החיים הממוצע $\gamma\tau_\pi$.
      - text: >-
          קיבלתי $d = \gamma\beta c\tau_\pi = \dfrac{pc}{Mc^2}\,c\tau_\pi$.
        weight: 2
      - text: >-
          בדקתי שכש-$\beta \to 0$, $d \to 0$, ושבלי התארכות הזמן המרחק קטן פי $\gamma$.
      - text: >-
          חישבתי $\gamma = 4.00$ ו-$d \approx 9.9\cdot10^{-8}\,\text{m}$, פי $4$ מ-$2.5\cdot10^{-8}\,\text{m}$.

  - label: ב
    type: open
    points: 6
    level: mid
    objectives: [OBJ-10.3-1, OBJ-10.4-1, OBJ-10.2-1, OBJ-9.4-2]
    prompt: >-
      (1) הראו שב-$S'$ האנרגיה של כל אחד מהפוטונים היא $Mc^2/2$.

      (2) בדעיכה מסוימת פוטון אחד יוצא קדימה, $\theta' = 0$, והשני אחורה. בטאו באמצעות $M$, $c$ ו-$\beta$ את האנרגיות שלהם
      במעבדה, $E_F$ של הפוטון שנע קדימה ו-$E_B$ של זה שנע אחורה, וזהו בתוצאה את אפקט דופלר היחסותי.

      (3) בדקו את התוצאה בשימור האנרגיה והתנע במעבדה, והראו שהמכפלה $E_FE_B$ אינה תלויה ב-$\beta$. בדקו את $E_F$ ואת
      $E_B$ בגבולות $\beta \to 0$ ו-$\beta \to 1$.
    solution:
      - kind: law
        text: >-
          ב-$S'$ התנע הכולל אפס והאנרגיה הכוללת $Mc^2$. לפוטון $E = pc$ (שיעור 10.4). ארבעה-וקטור האנרגיה-תנע עובר מ-$S'$
          למעבדה בטרנספורמציה ההפוכה (שיעור 10.3): $E = \gamma\left(E' + \beta\,p'_xc\right)$, $p_xc = \gamma\left(p'_xc + \beta E'\right)$,
          $p_y = p'_y$.
      - kind: manipulation
        text: >-
          (1) התנע הכולל ב-$S'$ אפס, ולכן הפוטונים יוצאים גב אל גב עם אותו גודל תנע $p'$, ואותה אנרגיה $E' = p'c$. מ-$2E' = Mc^2$:
          $E' = Mc^2/2$.

          (2) לפוטון שיוצא קדימה $p'_xc = +E'$, ולזה שיוצא אחורה $p'_xc = -E'$:
          $$E_F = \gamma(1 + \beta)\frac{Mc^2}{2} = \frac{Mc^2}{2}\sqrt{\frac{1 + \beta}{1 - \beta}},\qquad E_B = \gamma(1 - \beta)\frac{Mc^2}{2} = \frac{Mc^2}{2}\sqrt{\frac{1 - \beta}{1 + \beta}}$$
          כי $\gamma(1 \pm \beta) = (1 \pm \beta)/\sqrt{(1 - \beta)(1 + \beta)}$. זו נוסחת דופלר של שיעור 9.4,
          $f = f_0\sqrt{(1 + \beta)/(1 - \beta)}$, עם $E = hf$: הפיון הוא מקור שמתקרב לגלאי שלפניו (הסחה לכחול) ומתרחק מגלאי
          שמאחוריו ($\beta$ בסימן הפוך).
      - kind: manipulation
        text: >-
          (3) שימור במעבדה: $E_F + E_B = \tfrac12\gamma Mc^2\left[(1 + \beta) + (1 - \beta)\right] = \gamma Mc^2$, האנרגיה של
          הפיון, ו-$p_xc = E_F - E_B = \gamma\beta Mc^2 = pc$, התנע שלו. והמכפלה
          $$E_FE_B = \gamma^2\left(1 - \beta^2\right)\left(\frac{Mc^2}{2}\right)^2 = \left(\frac{Mc^2}{2}\right)^2$$
          היא הגודל האינווריאנטי: $\left(Mc^2\right)^2 = (E_F + E_B)^2 - (E_F - E_B)^2 = 4E_FE_B$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$: $E_F = E_B = Mc^2/2$, הדעיכה במנוחה. כש-$\beta \to 1$: $E_F \to \gamma Mc^2$, כמעט כל האנרגיה של
          הפיון, ו-$E_B = \dfrac{Mc^2}{2\gamma(1 + \beta)} \to \dfrac{Mc^2}{4\gamma} \to 0$.
      - kind: units
        text: >-
          $\gamma$ ו-$\beta$ חסרי ממדים, ולכן $E_F$ ו-$E_B$ ביחידות של $Mc^2$, אנרגיה ($\text{MeV}$).
      - kind: result
        text: >-
          $E_F = \dfrac{Mc^2}{2}\sqrt{\dfrac{1 + \beta}{1 - \beta}}$ ו-$E_B = \dfrac{Mc^2}{2}\sqrt{\dfrac{1 - \beta}{1 + \beta}}$:
          האנרגיה $Mc^2/2$ של מערכת המנוחה, כפול גורם דופלר. סכומן $\gamma Mc^2$, ההפרש ביניהן $pc$, ומכפלתן $(Mc^2/2)^2$
          בכל מהירות.
    rubric:
      - text: >-
          הראיתי שב-$S'$ הפוטונים יוצאים גב אל גב, עם אנרגיה $Mc^2/2$ כל אחד.
      - text: >-
          העברתי את הארבעה-וקטור למעבדה, קיבלתי $E_{F,B} = \gamma(1 \pm \beta)Mc^2/2$ וזיהיתי בזה את גורם דופלר.
        weight: 2
      - text: >-
          בדקתי ש-$E_F + E_B = \gamma Mc^2$ ו-$E_F - E_B = pc$, ושהמכפלה היא $(Mc^2/2)^2$.
      - text: >-
          בדקתי את הגבולות $\beta \to 0$ ו-$\beta \to 1$.

  - label: ג
    type: open
    points: 6
    level: mid
    objectives: [OBJ-9.4-3, OBJ-10.2-1, OBJ-10.2-2]
    prompt: >-
      דעיכה סימטרית: ב-$S'$ הפוטונים יוצאים בניצב לתנועה, $\theta' = 90^\circ$. מצאו את האנרגיה של כל פוטון במעבדה ואת
      הזווית $\alpha$ בין כל אחד מהם לציר $+x$, והראו שהזווית ביניהם, $\varphi_s$, מקיימת $\sin(\varphi_s/2) = 1/\gamma$.
      בדקו את התוצאה בגבולות $\beta \to 0$ ו-$\beta \to 1$.
    solution:
      - kind: law
        text: >-
          אברציה (שיעור 9.4): אור שנע ב-$S'$ בזווית $\theta'$ לציר $x'$ נע ב-$S$ בזווית $\theta$, עם
          $\cos\theta = \dfrac{\cos\theta' + \beta}{1 + \beta\cos\theta'}$. ולחלופין, הטרנספורמציה של הארבעה-וקטור מחלק ב.
      - kind: manipulation
        text: >-
          ב-$\theta' = 90^\circ$: $\cos\alpha = \beta$, ולכן $\sin\alpha = \sqrt{1 - \beta^2} = 1/\gamma$. באותה דרך מהארבעה-וקטור:
          ב-$S'$, $p'_x = 0$, $p'_yc = Mc^2/2$ ו-$E' = Mc^2/2$, ולכן במעבדה
          $$E = \gamma\frac{Mc^2}{2},\qquad p_xc = \gamma\beta\frac{Mc^2}{2},\qquad p_yc = \frac{Mc^2}{2}$$
          ו-$\cos\alpha = p_xc/E = \beta$, כמו קודם. לפוטון השני $p_y$ הפוך, ולכן הוא נע בזווית $\alpha$ מתחת לציר:
          $\varphi_s = 2\alpha$, ו-$\sin(\varphi_s/2) = \sin\alpha = 1/\gamma$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$: $\gamma = 1$, $\sin(\varphi_s/2) = 1$ ו-$\varphi_s = \pi$, גב אל גב, כמו במנוחה. כש-$\beta \to 1$:
          $\varphi_s \approx 2/\gamma \to 0$, שני הפוטונים נזרקים קדימה בתוך חרוט צר, כמו האור של מקור מהיר בשיעור 9.4.
      - kind: units
        text: >-
          $\beta$ ו-$1/\gamma$ חסרי ממדים, כמו קוסינוס וסינוס של זווית; $E$ ביחידות של $Mc^2$.
      - kind: result
        text: >-
          לכל פוטון $E = \gamma Mc^2/2$ ו-$\cos\alpha = \beta$, כלומר $\sin\alpha = 1/\gamma$, והזווית ביניהם
          $\varphi_s = 2\alpha$ עם $\sin(\varphi_s/2) = 1/\gamma$.
    rubric:
      - text: >-
          מצאתי $\cos\alpha = \beta$ מנוסחת האברציה או מהטרנספורמציה של הארבעה-וקטור, ו-$E = \gamma Mc^2/2$ לכל פוטון.
        weight: 2
      - text: >-
          הסקתי מהסימטריה ש-$\varphi_s = 2\alpha$, ולכן $\sin(\varphi_s/2) = 1/\gamma$.
      - text: >-
          בדקתי ש-$\varphi_s = \pi$ כש-$\beta \to 0$ ו-$\varphi_s \approx 2/\gamma$ כש-$\beta \to 1$.

  - label: ד
    type: open
    points: 8
    level: bagrut
    objectives: [OBJ-10.2-2, OBJ-10.3-1, OBJ-10.2-1]
    prompt: >-
      (1) לזווית $\theta'$ כלשהי: בטאו את האנרגיות $E_1$ ו-$E_2$ של שני הפוטונים במעבדה באמצעות $M$, $c$, $\gamma$, $\beta$
      ו-$\theta'$, והראו ש
      $$\sin\frac{\varphi}{2} = \frac{1}{\gamma\sqrt{1 - \beta^2\cos^2\theta'}}$$

      (2) הסיקו שהזווית בין הפוטונים אינה קטנה אף פעם מ-$\varphi_s$ של חלק ג, ובאיזו דעיכה היא $\pi$.

      (3) ב-$S'$ כל הכיוונים במרחב שכיחים באותה מידה, לא רק הכיוונים שבמישור אחד. אפשר להראות שלכן החלק של הדעיכות
      שבהן $\cos\theta'$ נמצא בקטע כלשהו בתוך $[-1,\ 1]$ יחסי לאורך הקטע; השתמשו בזה בלי הוכחה. הראו שבמחצית מהדעיכות $\sin(\varphi/2) \le \dfrac{2}{\gamma\sqrt{4 - \beta^2}}$, ובדקו את
      החסם בגבולות $\beta \to 0$ ו-$\beta \to 1$. גלאי מודד את $\varphi$ של פיונים רבים, כולם באותה מהירות: מהי הזווית
      הקטנה ביותר שהוא ימדוד, ובאיזה תחום של $\varphi$ שמתחיל בה נמצאת מחצית מהזוגות?
    solution:
      - kind: law
        text: >-
          המסה האינווריאנטית של זוג הפוטונים היא מסת הפיון, בכל מערכת (שיעור 10.2):
          $\left(Mc^2\right)^2 = 2E_1E_2(1 - \cos\varphi) = 4E_1E_2\sin^2(\varphi/2)$. והאנרגיה עוברת מ-$S'$ למעבדה כמו בחלק ב:
          $E = \gamma\left(E' + \beta\,p'_xc\right)$.
      - kind: manipulation
        text: >-
          (1) ב-$S'$ לפוטון הראשון $p'_xc = \tfrac12Mc^2\cos\theta'$, ולשני רכיב הפוך, $p'_xc = -\tfrac12Mc^2\cos\theta'$; לשניהם
          $E' = \tfrac12Mc^2$. לכן
          $$E_{1,2} = \frac{\gamma Mc^2}{2}\left(1 \pm \beta\cos\theta'\right),\qquad E_1E_2 = \frac{\gamma^2\left(Mc^2\right)^2}{4}\left(1 - \beta^2\cos^2\theta'\right)$$
          מציבים במסה האינווריאנטית: $\sin^2\dfrac{\varphi}{2} = \dfrac{\left(Mc^2\right)^2}{4E_1E_2} = \dfrac{1}{\gamma^2\left(1 - \beta^2\cos^2\theta'\right)}$.
      - kind: manipulation
        text: >-
          (2) המכנה $1 - \beta^2\cos^2\theta'$ גדול ביותר, $1$, כש-$\cos\theta' = 0$, ולכן תמיד $\sin(\varphi/2) \ge 1/\gamma$:
          הזווית הקטנה ביותר היא $\varphi_s$ של הדעיכה הסימטרית. כש-$\cos^2\theta' = 1$, הפוטונים לאורך הציר כמו בחלק ב,
          $\sin(\varphi/2) = 1/\left(\gamma\sqrt{1 - \beta^2}\right) = 1$ ו-$\varphi = \pi$.
      - kind: manipulation
        text: >-
          (3) $\sin(\varphi/2)$ גדל עם $|\cos\theta'|$. הדעיכות עם $|\cos\theta'| \le \tfrac12$ הן הקטע $\left[-\tfrac12,\ \tfrac12\right]$,
          שאורכו $1$ מתוך $2$: מחצית מהדעיכות. בקצה הקטע
          $$\sin\frac{\varphi}{2} = \frac{1}{\gamma\sqrt{1 - \beta^2/4}} = \frac{2}{\gamma\sqrt{4 - \beta^2}}$$
          ובכל הדעיכות האלה $\sin(\varphi/2)$ קטן או שווה לזה. לכן הגלאי לא ימדוד אף זוג עם $\varphi < \varphi_s$ (חלק (2)),
          ומחצית מהזוגות נמצאים בתחום $\varphi_s \le \varphi \le \varphi_{1/2}$, כאשר
          $\sin(\varphi_{1/2}/2) = 2/\left(\gamma\sqrt{4 - \beta^2}\right)$: בדיוק הדעיכות עם $|\cos\theta'| \le \tfrac12$, כי
          $\varphi$ גדלה עם $|\cos\theta'|$.
      - kind: limit
        text: >-
          כש-$\beta \to 0$: $\gamma = 1$ ו-$\sin(\varphi/2) = 1$ לכל $\theta'$, כלומר $\varphi = \pi$ תמיד: פיון שנח זורק את
          הפוטונים גב אל גב, והחסם $2/\sqrt4 = 1$ מתאים. כש-$\beta \to 1$: החסם שואף ל-$\dfrac{2}{\sqrt3\,\gamma}$, פי $2/\sqrt3 \approx 1.15$
          מ-$\sin(\varphi_s/2) = 1/\gamma$. הזוויות קטנות, $\varphi \approx 2\sin(\varphi/2)$, ולכן במחצית מהזוגות $\varphi$ גדולה
          מ-$\varphi_s$ בפחות מ-$2/\sqrt3 - 1 \approx 15.5\%$. ובכל $\theta'$ קבוע שאינו $0$ או $\pi$, $\varphi \approx 2/(\gamma|\sin\theta'|) \to 0$.
      - kind: units
        text: >-
          $\beta$, $\gamma$ ו-$\cos\theta'$ חסרי ממדים, ולכן גם אגף ימין, כמו סינוס; $E_{1,2}$ ביחידות של $Mc^2$.
      - kind: result
        text: >-
          $E_{1,2} = \tfrac12\gamma Mc^2\left(1 \pm \beta\cos\theta'\right)$ ו-$\sin(\varphi/2) = 1/\left(\gamma\sqrt{1 - \beta^2\cos^2\theta'}\right)$.
          הזווית נעה בין $\varphi_s$, עם $\sin(\varphi_s/2) = 1/\gamma$ (פוטונים שווי אנרגיה), לבין $\pi$ (פוטונים לאורך הציר).
          במחצית מהדעיכות $\sin(\varphi/2) \le 2/\left(\gamma\sqrt{4 - \beta^2}\right)$. הזווית הקטנה ביותר שהגלאי ימדוד היא
          $\varphi_s$, ומחצית מהזוגות בתחום שבין $\varphi_s$ לזווית של החסם, כש-$\beta \to 1$ לכל היותר $2/\sqrt3 - 1 \approx 15.5\%$ מעל $\varphi_s$;
          מהקצה הזה אפשר לקרוא את $\gamma$ של הפיונים מהזוויות בלבד.
    rubric:
      - text: >-
          כתבתי $E_{1,2} = \tfrac12\gamma Mc^2(1 \pm \beta\cos\theta')$, הצבתי ב-$\left(Mc^2\right)^2 = 4E_1E_2\sin^2(\varphi/2)$ והגעתי
          לביטוי ל-$\sin(\varphi/2)$.
        weight: 2
      - text: >-
          הסקתי ש-$\sin(\varphi/2) \ge 1/\gamma$, עם שוויון בדעיכה הסימטרית, ו-$\varphi = \pi$ כשהפוטונים לאורך הציר.
      - text: >-
          הראיתי שמחצית מהדעיכות הן אלה עם $|\cos\theta'| \le 1/2$, וקיבלתי את החסם $2/\left(\gamma\sqrt{4 - \beta^2}\right)$.
      - text: >-
          בדקתי ש-$\varphi = \pi$ לכל $\theta'$ כש-$\beta \to 0$, ושכש-$\beta \to 1$ החסם גדול מ-$1/\gamma$ רק פי $2/\sqrt3$.
      - text: >-
          קבעתי שהזווית הקטנה ביותר שהגלאי ימדוד היא $\varphi_s$, ושמחצית מהזוגות בתחום שבין $\varphi_s$ לזווית שבה
          $\sin(\varphi/2) = 2/\left(\gamma\sqrt{4 - \beta^2}\right)$.

title: פיון ניטרלי שדועך לשני פוטונים בתנועה
prompt: >-
  פיון ניטרלי, $\pi^0$, שאנרגיית המנוחה שלו $Mc^2$, נע במעבדה בכיוון $+x$ במהירות $\beta c$, עם גורם לורנץ
  $\gamma = 1/\sqrt{1 - \beta^2}$, ודועך לשני פוטונים. זמן החיים הממוצע שלו, במערכת שבה הוא נח, הוא $\tau_\pi$. המעבדה
  היא $S$, ומערכת המנוחה של הפיון היא $S'$, שנעה ביחס למעבדה במהירות $\beta c$ בכיוון $+x$; גדלים שנמדדים ב-$S'$
  מסומנים בתג. ב-$S'$ פוטון אחד יוצא בזווית $\theta'$ לציר $+x'$, והשני בכיוון ההפוך. $\varphi$ היא הזווית בין כיווני
  התנועה של שני הפוטונים במעבדה, $0 \le \varphi \le \pi$. בכל דעיכה בוחרים את ציר $y$ כך ששני הפוטונים נעים במישור $x$–$y$.
diagramAlt: >-
  שני חלקים זה לצד זה. משמאל, מערכת $S'$: נקודה שמסמנת את הפיון במנוחה, ציר $x'$ אופקי מקווקו שעובר דרכה, ושני חצים
  בצבע של אור יוצאים ממנה בכיוונים מנוגדים: חץ 1 למעלה וימינה, בזווית $\theta'$ מציר $x'$ שמסומנת בקשת, וחץ 2 למטה
  ושמאלה. מימין, המעבדה $S$: ציר $x$ אופקי מקווקו. הפיון נוצר בנקודה משמאל, וחץ בצבע המהירות שמסומן $\beta c$ מראה
  שהוא נע ימינה עד נקודת הדעיכה. מתחת, קו מידה בין נקודת היצירה לנקודת הדעיכה מסומן $d$. מנקודת הדעיכה יוצאים שני
  חצים בצבע של אור, שניהם קדימה: חץ 1 נוטה מעט מעל הציר, וחץ 2, קצר יותר, נוטה מתחתיו בזווית גדולה יותר; קשת ביניהם
  מסומנת $\varphi$.

# Final exam A, question 5: a neutral pion moving at βc decays in flight to two photons. Joins chapter 10 (four-momentum
# and its transformation 10.2, the two-body decay 10.3, the photon E = pc 10.4, E and p of the pion 10.1) with chapter 9
# (time dilation and proper time 9.2, the Doppler effect and aberration 9.4).
# Parts: א the mean distance d = (pc/Mc²) cτ_π, with numbers (the only numeric part); ב the forward and backward photon
# energies (Mc²/2)√((1 ± β)/(1 ∓ β)) = Doppler, checked by conservation, E_F·E_B = (Mc²/2)²; ג the symmetric decay
# (θ' = 90°): cos α = β by aberration, sin(φ_s/2) = 1/γ, checked by the invariant mass; ד general θ':
# sin(φ/2) = 1/(γ√(1 − β²cos²θ')), so φ ≥ φ_s (also from E₁ + E₂ = γMc² and E₁E₂ ≤ (E₁ + E₂)²/4), and half of the
# decays have sin(φ/2) ≤ 2/(γ√(4 − β²)) (→ 2/(√3 γ), 15% above the minimum, as β → 1).
# Overlap checked (2026-11-19): W-10.2-c1 solves the symmetric π⁰ decay the other way round (angle ±45° given → E, β,
# distance); lesson 10.3's example 5 gives a product's lab energy range γ(1 ± β)p'c and tan θ = 1/(γβ) for θ' = 90°
# (a neutrino); Q-10-bagrut-1 boosts a forward neutrino; Q-10-bagrut-5 has tan(φ/2) = 1/γ_c for massive equal masses;
# lesson 9.4 has the aberration example θ' = 90° → cos θ = β. The minimum opening angle of a photon pair, φ(θ') and the
# distribution of φ are solved nowhere in the course; part ב adds the Doppler identification and the invariant E_F·E_B.
# Recomputed in .scratch/exam/q5.ts (209 checks, all ok) by independent routes: d against v·relativity.dilatedTime;
# every photon energy, angle and opening angle against reldecay.decayInFlight (a rest-frame decay boosted with
# fromPrimed) and reldecay.openingAngle, at β = 0.3, 0.6, 0.9, √15/4, 0.999 and eight θ' each; E_F against
# relativity.dopplerFactor; cos α against relativity.aberrationCos; 4E₁E₂sin²(φ/2) = (Mc²)² on the boosted pairs; the
# minimum of φ over a scan of 20 001 values of θ' (at θ' = 90°, = 2 arcsin(1/γ)); the half-of-the-decays bound by
# counting 200 000 equally spaced cos θ' (fraction 0.5000 to 1e-4); conservation of E and p of the pair.
# Exam numbers (א): Mc² = 135.0 MeV, E_π = 540 MeV, τ_π = 8.5e-17 s, c = 3.0e8 m/s → γ = 4.00, γβ = √15 = 3.87
#   (β = 0.968), pc = 523 MeV, cτ_π = 2.55e-8 m, γτ_π = 3.40e-16 s, d = 9.88e-8 m (with β = 0.968: 9.87e-8),
#   without dilation βcτ_π = 2.47e-8 m. Not asked: at γ = 4, φ_s = 29.0°, α = 14.5°, φ_½/φ_s = 1.147.
# Reviewed 2026-11-19 (independent recompute, .scratch/exam-review/q5.ts, all ok): d by the inverse Lorentz
#   transformation of the decay event (t′ = τ_π, x′ = 0); E_F, E_B against doppler.receivedPeriodSourceMoving; cos α by
#   photon velocities (transverseVelocity); E₁, E₂, φ, the invariant mass and the minimum by fourvector.boostX on rest-frame
#   pairs; the half-of-the-decays bound by 400 000 directions drawn isotropically in 3D (Gaussian on the sphere, not
#   uniform cos θ′): fraction 0.500 at every β; an in-plane uniform θ′ gives 1/3 instead. Fixed: the prompt said "all
#   motion in the x–y plane" and then "all directions equally likely, so cos θ′ is uniform", which is false in a plane
#   (1/3, not 1/2): now y is chosen per decay to contain the photons, and ד(3) gives the uniform cos θ′ as a fact for 3D
#   isotropy; pc and d computed from √15 (3.87·135.0 = 522, 3.87·2.55 = 9.87 contradicted the printed 523, 9.88);
#   "within 15% of φ_s" → 2/√3 − 1 ≈ 15.5% (the β → 1 value exceeds 15%); "most pairs" → half (only half is shown);
#   the diagram's photon 2 now at 60° below (θ′ = 60° at β = 0.8 gives 21.8° and 60.0°; it was 30°, matching no β).
# 2026-11-20, trimmed after a timed student read (≈43 min against ≈41 per question): ג no longer asks the check by the
#   invariant mass (ד(1) does it for every θ′); ד(2) no longer asks the second proof of φ ≥ φ_s from E₁ + E₂ = γMc² and
#   the AM–GM inequality; ד(3)'s open "what does a detector see" now asks two specific things (the smallest φ measured,
#   the range holding half of the pairs), which its rubric line grades. Points unchanged (5/6/6/8); the cut checks' share

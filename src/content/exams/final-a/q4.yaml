# Final exam A, question 4: a mass on a spring hangs from the ceiling of an elevator that accelerates upward at A for
# a time t1 and then moves at constant speed V1 = A t1. Joins chapters 7 (the accelerating frame, 7.1) and 5 (the
# oscillator, its energy, damping: 5.1, 5.2, 5.3) with 1.5 (relative velocity, a constant-velocity frame), 2.3
# (Hooke), 3.3 (work of a non-conservative force) and 3.5/4.4 (an impulse that vanishes in a short time).
# Parts: א the motion in S' during the acceleration; ב the amplitude after it, (2A/ω0²)|sin(ω0t1/2)|, with numbers;
# ג the same at fixed V1: the impulse limit V1/ω0, checked in the ground frame, and the slow limit;
# ד a weak damper and a long acceleration: amplitude A/ω0² after t1, heat m²A²/k independent of b.
# Recomputed in .scratch/exam/q4.ts by an independent route: RK4 (src/physics/motion.ts) of the mass in the GROUND
# frame (gravity, a spring to a ceiling whose motion is prescribed, a damper on the velocity relative to the
# elevator; no fictitious force), at a sample point m = 0.7, k = 23, A = 1.9:
#   א y'(t1), ẏ'(t1) at t1 = 0.83 and the lowest point −2A/ω0² (rel. error < 1e-10);
#   ב X after t1 and X = 0 for t1 = 2T0; ג X/(V1/ω0) = |sin(θ/2)/(θ/2)| for θ = 0.001 … 50 at V1 fixed, the
#   bound 2V1/(ω0²t1); ד y'(t1) = −A/ω0² and the heat ∫b ẏ'² dt = m²A²/k for γ = 0.3, 0.6, 1.2 and an overdamped
#   γ = 3ω0 (rel. error < 1e-4), and the average of ½kX² over t1 = mA²/ω0².
# Exam numbers (ב): m = 0.40 kg, k = 10 N/m, A = 1.0 m/s², t1 = 2.0 s → ω0 = 5.00 rad/s, A/ω0² = 0.0400 m,
#   |sin 5.00| = 0.959, X = 0.0767 m (bound 0.0800 m), T0 = 1.26 s.
# reviewed 2026-11-19 (independent, .scratch/exam-review/q4.ts): own ground-frame RK4 (spring to a prescribed ceiling,
# gravity g = 9.8, damper on the velocity relative to the elevator; y' formed afterwards). א y'(t1), ẏ'(t1) at
# m = 0.7, k = 23, A = 1.9, t1 = 0.83 (relErr 3e-11) and the lowest point -2A/w0^2; ב with the exam numbers RK4
# X = 0.07671 m, w0 = 5.000, T0 = 1.2566 s, X(t1 = T0) = 2e-12; ג X/(V1/w0) = |sin(theta/2)/(theta/2)| at theta =
# 0.001 ... 50 (to 6 digits); ד gamma = 0.1, 0.25, 0.5 with gamma t1 = 30: y'(t1) = -0.0400 m, E_th = 0.016000 J =
# m^2A^2/k (relErr < 3e-7), and the t1-average of (1/2)kX^2 = 0.016000 J. Every closed form re-derived, incl.
# E_th = -mA y'(t1) in general (why the damped E_th equals the t1-average). No physics defect; rubric line ד1 now asks the
# comparison with ב that the prompt asks. Second pass (student read): the heat is E_th, not Q (Q is the quality factor
# of 5.3); א and ב(1) ask the limit their rubric grades, and ב's limit and numbers are separate rubric lines; ג(3)
# says the bound holds for every t1 and is small against V1/w0 when w0 t1 >> 1; ד(2) gives the potential energy mAy'
# of the fictitious force as a fact; ד(3) says what is averaged (1/2 k X^2 of ב over t1); the solution says why the
# heat balance may be written in S' (b ẏ'^2 depends only on the relative velocity of the damper's ends).
id: E-final-a-4
type: bagrut
title: משקולת על קפיץ במעלית שמאיצה
prompt: >-
  משקולת בעלת מסה $m$ תלויה על קפיץ חסר מסה, בעל קבוע $k$, מתקרת מעלית; סמנו $\omega_0 = \sqrt{k/m}$ ו-$T_0 =
  2\pi/\omega_0$. בהתחלה המעלית עומדת, והמשקולת במנוחה בשיווי משקל. ברגע $t = 0$ המעלית מתחילה להאיץ כלפי מעלה
  בתאוצה קבועה $A$, עד הרגע $t_1$, ומאז היא נעה כלפי מעלה במהירות הקבועה $V_1 = At_1$. המשקולת נעה רק לאורך האנך.
  $S'$ היא מערכת הייחוס של המעלית, ו-$y'$ הוא המקום של המשקולת ב-$S'$, חיובי כלפי מעלה, שנמדד מנקודת שיווי המשקל
  שלה כשהמעלית עומדת (נקודה קבועה במעלית). תאוצת הכובד היא $g$. בחלקים א עד ג הזניחו כל ריסון.
diagramAlt: >-
  מבט מהצד. מעלית מלבנית תלויה על כבל. מתקרת המעלית יורד קפיץ שמסומן $k$, ובקצהו התחתון משקולת שמסומנת $m$. בתוך
  המעלית, משמאל למשקולת, ציר אנכי כלפי מעלה שמסומן $y'$, וקו מקווקו אופקי מסמן עליו את הראשית $0$ בגובה המשקולת.
  מימין למעלית, מחוץ לה, חץ כלפי מעלה בצבע התאוצה שמסומן $A$: התאוצה של המעלית.

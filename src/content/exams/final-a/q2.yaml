# E-final-a-2: a cue ball launched with backspin skids on a rough table, hits an identical ball head-on (elastic,
# frictionless contact) while still skidding, and both balls skid to rolling; the "draw shot" distance D*.
# Joins chapter 8 (8.4 skid-to-roll, L_Q about a point of the table) with chapter 4 (4.1 elastic exchange, 4.2 the
# energy of relative motion lost in a plastic collision, 4.4 a process in stages) and chapter 3 (3.8 internal forces on
# one line, Koenig). Overlap: W-8.4-09 solves a ball that arrives ROLLING (2/7, 5/7); here it appears only as the limit
# D -> s_roll, and the asks are the general impact during the skid, V1 + V2 = v_roll by total L_Q, the skid as a plastic
# collision of m and (2/5)m, and D*.
# Every number was recomputed by .scratch/exam/q2.ts (g = 9.8), all checks passing:
#   closed forms of t_roll, v_roll, s_roll and the heat against rigidbody.ts skidToRoll for three launches; the heat
#   (1/7) m u0^2 = K0 - K_roll = ½ reducedMass(m, (2/5)m) u0^2;
#   a time-stepped two-ball run (second law + torque about each centre, friction -sign(u) mu m g, the impact as an
#   event with collisions.ts elastic and spins unchanged, heat integrated as mu m g |u| dt) reproduces v1, omega1 R,
#   V1, V2, V1 + V2 = v_roll and the heat for four (v0, w0, mu, D); limits D -> 0 and D -> s_roll (and D > s_roll);
#   D* = 2 w0 (5 v0 - w0)/(25 mu g) against a bisection on the simulated V1 for three launches; D* < s_roll;
#   w0 -> 5v0/2 gives D* = s_roll = v0^2/(2 mu g).
#   Numbers (v0 = w0 = 3.0 m/s, mu_k = 0.20): 2 mu g = 3.92, v_roll = 9/7 = 1.29 m/s, s_roll = 1.87 m,
#   v0 - (2/5) w0 = 1.80, D* = 72/49 = 1.47 m; D = 1.00 m: v1 = sqrt(5.08) = 2.254 m/s, V1 = -0.324 m/s, V2 = 1.61 m/s.
#
# Reviewed 2026-11-19 (independent, .scratch/exam-review/q2.ts): a second route with no event logic and no assumed
# exchange: both balls integrated together (RK4 on x, v, omega R of each), smoothed kinetic friction on each, the
# impact a stiff elastic contact spring of finite duration with the table's friction acting through it. It
# reproduces t_roll, s_roll, v_roll and the heat (1/7) m u0^2 for three launches; V1, V2, V1 + V2 = v_roll and the
# total L_Q for five (v0, w0, mu, D) (relErr < 5e-5), no second meeting; D* by bisection on the simulated sign of
# V1 (relErr 1e-6); every printed number of part ד. Changes: part ג (3) now asks the limits D -> 0 and
# D -> s_roll that its rubric grades; part ד (1) defines D* as the threshold (at D = D* ball 1 stops, it does not
# come back), not "the largest D at which it comes back". After a student read: the heat is E_th (Q is the point
# on the table); the diagram's backspin arrow is labelled w0 (positive rim speed), not omega0 (negative in the
# rolling sense); ב (2) is scaffolded (conserved sum, then the two-body picture) and its weight-2 rubric line names
# 1/2 m* u0^2 with m* = (2/7) m; א and ב now ask the w0 = 0 checks their rubrics grade.
id: E-final-a-2
type: bagrut
title: כדור ביליארד עם סיבוב לאחור
prompt: >-
  כדור ביליארד 1 הוא כדור מלא ואחיד במסה $m$ וברדיוס $R$, ומומנט ההתמד שלו סביב מרכזו $I = \tfrac25mR^2$. מכה קצרה
  של מקל משאירה אותו ברגע $t = 0$ בנקודה $x = 0$ על שולחן אופקי, כשמרכזו נע במהירות $v_0$ בכיוון $+x$, והוא
  מסתובב **לאחור**, כך שמהירות השפה של הסיבוב היא $w_0$, עם $0 < w_0 < \tfrac52v_0$. המהירות הזוויתית $\omega$
  נמדדת בכיוון הגלגול קדימה (באיור, עם כיוון השעון), ולכן $\omega_0R = -w_0$, ומהירות ההחלקה של נקודת המגע היא
  $u = v - \omega R$. מקדם החיכוך הקינטי בין כל כדור לשולחן הוא $\mu_k$, ותאוצת הכובד $g$. מזניחים את התנגדות
  הגלגול ואת התנגדות האוויר.


  על הקו של התנועה עומד כדור 2, זהה לכדור 1, במנוחה ובלי סיבוב. מרכז כדור 1 עובר מרחק $D$ עד שהכדורים נוגעים זה
  בזה. הפגיעה חזיתית, אלסטית וקצרה מאוד, והמגע בין הכדורים חלק, בלי חיכוך. הכדורים לא נפגשים פעם שנייה.
diagramAlt: >-
  מבט מהצד. קו אופקי הוא השולחן, ועליו שלושה עיגולים באותו רדיוס. משמאל כדור 1, וחץ אופקי ימינה ממרכזו מסמן את
  המהירות $v_0$. חץ מעוקל בחלקו העליון של כדור 1, נגד כיוון השעון, מסמן את הסיבוב לאחור, ולידו $w_0$, מהירות השפה
  של הסיבוב לאחור (חיובית). מימין כדור 2.
  עיגול מקווקו שנוגע בכדור 2 משמאלו מראה את כדור 1 ברגע הפגיעה, וחץ מידה מעל הכדורים, בין מרכז כדור 1 בהתחלה
  למרכזו ברגע הפגיעה, מסומן $D$. מתחת לשולחן חץ קטן ימינה מסמן את הכיוון החיובי $x$, והכיתוב $\mu_k$ מציין את
  החיכוך עם השולחן.

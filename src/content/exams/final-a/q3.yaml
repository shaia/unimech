# Final exam A, question 3: a particle under the central force F = -k r^n r̂ — the circular orbit, its stability
# (n > -3), small radial oscillations (w_r/Omega = sqrt(n + 3)), the angle between successive pericentres
# (2 pi/sqrt(n + 3)) and when near-circular orbits close (n = p^2 - 3: Kepler p = 1, spring p = 2); then a star
# inside a uniform dust cloud (shell theorem: f = GM/r^2 + (4/3) pi G rho r), w_r^2/Omega^2 = (1 + 4 eta)/(1 + eta)
# and the pericentre falling back by 3 pi eta per radial period. Joins chapters 6 (6.1, 6.3, 6.4), 5 (5.1, 5.2) and
# 3 (3.7). Not a copy: W-6.3-c1 solves the single case n = 3, W-6.3-c2 the added beta/r^3 term and Q-6.4-precession
# a given Binet equation; here the general n, the closure condition and the dust cloud are new.
#
# .scratch/exam/q3.ts recomputed (2026-11-19):
# - u_eff'' at the circular radius by a finite difference = (k/m)(n + 3) r0^(n-1) for n = -2, 1, -1, 3, 6, -2.5
#   (relErr < 1e-9), and negative for n = -3.5 (unstable);
# - RK4 (rk4Step) of the 2D motion after a radial kick of 1e-3 v: w_r/Omega = sqrt(n + 3) (relErr < 2e-6) and the
#   pericentre-to-pericentre angle 360, 254.56, 227.68, 207.85, 180, 146.97, 120 deg for n = -2, -1, -0.5, 0, 1, 3, 6;
# - the apsidal-angle quadrature of src/physics/centralforce.ts at larger amplitude: n = -2 and n = 1 stay at 360
#   and 180 deg for r between 0.77 and 1.43 r0; n = 6 gives 120.00, 120.22, 121.94 deg for r between 0.997-1.00,
#   0.966-1.03, 0.897-1.10 r0 (closure only to first order in the amplitude);
# - dust cloud: u_eff'' by finite difference = GM/r0^3 + 4K; RK4 reproduces w_r/Omega = sqrt((1 + 4 eta)/(1 + eta))
#   at eta = 0.002, 0.05, 1, 100 (ratio 1.003, 1.069, 1.5811, 1.9926); delta theta at eta = 2.0e-3: first order
#   -3 pi eta = -1.885e-2 rad = -1.08 deg, exact small-oscillation value and RK4 both -1.073 deg (0.6% apart);
#   -1.08 deg x 1000 = -3.0 revolutions.
# The diagram is .scratch/exam/q3-diagram.ts: r = r0 (1 - 0.2 cos(sqrt(2) theta)), n = -1, P1 at 0 and P2 at 254.6 deg.
#
# reviewed 2026-11-19 (independent, .scratch/exam-review/q3.ts): Cartesian RK4 of the 2D motion, pericentres as minima
# of r, no effective potential. Circular orbit holds at r0 with h^2 = (k/m) r0^(n+3); after a 1e-3 radial kick
# w_r/Omega = sqrt(n + 3) and pericentre-to-pericentre 509.12, 360, 254.56, 207.85, 180, 146.97, 120 deg for
# n = -2.5, -2, -1, 0, 1, 3, 6; n = -3.5 runs away; n = 6 from 0.897 to 1.097 r0 gives 121.95 deg, n = -2 and n = 1
# stay at 360 and 180 deg between 0.70 and 1.75 / 1.43 r0. Dust cloud: RK4 w_r/Omega = 1.00299, 1.06904, 1.58114,
# 1.99256 at eta = 0.002, 0.05, 1, 100 (= sqrt((1 + 4 eta)/(1 + eta))); at eta = 2.0e-3 RK4 delta theta = -1.0730 deg,
# first order -1.080 deg, 1000 revolutions = -3.000 rev. Every closed form re-derived. Changed: part ג asks for
# Delta theta as n -> -3 (its rubric line graded an unasked check); "הציר הקטן" -> "הציר המשני" (glossary); diagramAlt
# says 255 degrees, not three quarters of a revolution. Second pass (student read): א and ד(2) now ask the Kepler-III
# check and the direct uniform-ball argument their rubrics grade; the n = -3 case of ב goes through du_eff/dr, without
# the expression for u that the prompt says is not needed.
# 2026-11-20, trimmed after a timed student read (≈44 min against ≈41 per question): ג(1) no longer asks Delta theta as
# n -> -3 (ב(3) asks the n = -3 case) and ד(2) no longer asks the eta -> ∞ limit "directly" from a uniform ball (ג(3)'s
# spring case); ג(3) states both closed shapes (ellipse with O at a focus; ellipse with O at its centre, which lesson 6.3
# only mentions) and asks only the pericentres per revolution against p; the potential energy is now U(r), dU/dr = k r^n,
# u_eff = h^2/(2r^2) + U/m (the formula sheet and chapter 6 use u = 1/r in the orbit equation); ב's rubric no longer
# grades the unasked "h unchanged by a radial kick" (ג's stem gives it). Points unchanged (5/6/6/8); in ג the result and
# closure line now weighs 2. No number changed.
id: E-final-a-3
type: bagrut
title: מסלולים שנסגרים, ומסלולים שלא
prompt: >-
  חלקיק בעל מסה $m$ נע תחת כוח מרכזי שמושך אותו אל נקודה קבועה $O$,
  $$\vec F = -k\,r^n\,\hat r$$
  כאשר $r$ המרחק מ-$O$, $k > 0$ קבוע ו-$n$ מספר ממשי. הראשית ב-$O$, $\hat r$ פונה מ-$O$ החוצה, והזווית $\theta$ של
  הרדיוס נמדדת בכיוון התנועה. נסמן ב-$h$ את התנע הזוויתי ליחידת מסה סביב $O$, וב-$U(r)$ את האנרגיה הפוטנציאלית של
  החלקיק, כך ש-$dU/dr = k\,r^n$ (אין צורך בביטוי ל-$U$ עצמו). אין כוחות אחרים, ו-$O$ נח במערכת ייחוס אינרציאלית.

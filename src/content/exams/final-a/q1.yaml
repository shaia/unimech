# Final exam A, question 1: a bead on a smooth vertical hoop of radius R that turns at constant omega about its
# vertical diameter, in gravity. In the hoop frame: U_eff = -mgR cos(theta) - (1/2) m omega^2 R^2 sin^2(theta), the
# equilibria and omega_c = sqrt(g/R); the small-oscillation frequencies about each stable equilibrium,
# Omega_1 = sqrt(omega_c^2 - omega^2) about the bottom and Omega_2 = omega sin(theta0) = sqrt(omega^2 - omega_c^4/omega^2)
# about theta0; the bead released at the (unstable) bottom above omega_c swings to cos(theta_max) = 2 cos(theta0) - 1
# and rises above the centre when omega > sqrt(2) omega_c; in the lab, the work of the hoop's force up to theta_max,
# W = m omega^2 R^2 sin^2(theta_max) = 4mgR(1 - g/(omega^2 R)), by lab energy and by W = omega Delta L_z.
# Joins chapters 7 (7.3), 5 (5.2) and 3 (3.3, 3.7).
# Not a copy: lesson 7.3 (Explain "bead") and example ex-2-6-5 solve the equilibria, omega_c and the normal force;
# the 7.3 ladder asks the angle and the parabola z = k rho^2. Those are only the foothold here (part א); the
# frequencies about both equilibria, the release from the bottom, the rise above the centre and the lab-frame work
# are solved nowhere in the course. The 2014 moed A q4 (exam-map) asks the frequency about the far points of a hoop
# WITHOUT gravity: here that is only the omega -> infinity limit of part ב (Omega_2 -> omega).
#
# .scratch/exam/q1.ts recomputed (2026-11-19), g = 9.8:
# - finite differences of U_eff: dU/dtheta = 0 at theta0; sqrt(U''/(mR^2)) = Omega_2 at omega = 6.0, R = 0.40
#   (relErr 1e-8) and Omega_1 at omega = 3.0 (1e-8); U''(pi) = -mgR - m omega^2 R^2 < 0;
# - a 3D RK4 integration (rk4Step) in the hoop frame with nonInertialForce of src/physics/rotating.ts (gravity +
#   centrifugal + Coriolis) and the hoop's force as the constraint force: periods 1.42924 s about theta0 at
#   omega = 6.0 and 1.59593 s about the bottom at omega = 3.0 (relErr < 1e-6); released 1e-6 rad off the bottom,
#   cos(theta_max) = 0.361111, -0.216000, 0.812130 at (omega, R) = (6.0, 0.40), (10, 0.25), (5.2, 0.40), and the
#   lab-frame work integrated as N . v_lab dt = 4mgR(1 - g/(omega^2 R)) (relErr < 1e-9); theta_max = 102.5 deg at
#   omega = 10, R = 0.25 (above the centre, omega > sqrt(2) omega_c);
# - limits: theta_max/theta0 -> sqrt(2) and Omega_2^2 -> 2(omega^2 - omega_c^2) near omega_c; Omega_2 -> omega and
#   W -> 4mgR at large omega; Omega_1 -> sqrt(g/R) as omega -> 0;
# - numbers of part ב: omega_c = 4.95 rad/s; omega = 3.0: Omega_1 = sqrt(15.5) = 3.94 rad/s, T = 1.60 s;
#   omega = 6.0: cos(theta0) = 0.681, theta0 = 47.1 deg, sin(theta0) = 0.733, Omega_2 = 4.40 rad/s, T = 1.43 s.
#
# Reviewed 2026-11-19 (independent, .scratch/exam-review/q1.ts): a second route in the LAB frame, no fictitious
# forces: the hoop as a moving frictionless constraint (stiff springs normal to its plane and along its radius),
# rk4Step. Periods 1.59592 s (omega = 3.0) and 1.42937 s (omega = 6.0) against 2 pi/Omega_1, 2 pi/Omega_2 (relErr
# 1e-5, 1e-4); released 1e-4 rad off the bottom, 1 - cos(theta_max) = 2(1 - cos theta0) at (6.0, 0.40), (10, 0.25),
# (5.2, 0.40) (relErr < 1e-4); the lab work of the hoop's force, integrated as N . v dt, = 4mgR(1 - g/(omega^2 R))
# = dK + dU_g = omega dL_z, half kinetic and half potential (relErr < 6e-5); every printed number of part ב.
# Changes: the centrifugal and Coriolis forces named as fictitious (part א); the
# omega -> infinity limit of part ג says the bead "tends to the top" (without gravity the top is an equilibrium it
# only approaches); theta0 added to the rubric of ב. After a student read: rho = R|sin theta|; part א points to the
# hoop's force component normal to its plane and asks the limits of theta0 its rubric grades; ג (2) asks
# theta_max ~ sqrt2 theta0 explicitly and the solution drops the double-well aside (a, b never given); ד (3) gives
# the torques about the axis as a stated fact (torque about an axis of a 3D force is not taught); ד (1) asks which
# component works, and its rubric line says N_perp is required.
id: E-final-a-1
type: bagrut
title: חרוז על חישוק מסתובב
prompt: >-
  חישוק דק וחלק ברדיוס $R$ עומד במישור אנכי ומסתובב סביב הקוטר האנכי שלו במהירות זוויתית קבועה $\omega$ (מנוע
  שומר עליה קבועה). חרוז קטן בעל מסה $m$ מושחל על החישוק ומחליק עליו בלי חיכוך. המקום של החרוז על החישוק נתון
  בזווית $\theta$, שנמדדת במרכז החישוק מהנקודה התחתונה שלו: $\theta = 0$ בנקודה התחתונה, $\theta = \pi$ בנקודה
  העליונה, ו-$\theta$ חיובית בצד אחד של הציר ושלילית בצד השני. המרחק של החרוז מציר הסיבוב הוא $\rho = R|\sin\theta|$
  (בחישובים מופיע רק $\rho^2 = R^2\sin^2\theta$), ותאוצת הנפילה החופשית היא $g$. "מערכת החישוק" היא מערכת הייחוס שמסתובבת יחד עם החישוק; בה החרוז נע רק לאורך
  החישוק, ו-$\theta$ היא הקואורדינטה היחידה שלו.

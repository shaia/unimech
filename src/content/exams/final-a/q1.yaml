diagramAlt: >-
  חישוק אנכי ברדיוס R, וציר הסיבוב האנכי, מקווקו, עובר דרך המרכז שלו לאורך הקוטר האנכי. חץ מעוגל סביב הציר מעל
  החישוק מסומן ω. חרוז בעל מסה m נמצא על החישוק בזווית θ מהנקודה התחתונה, שנמדדת במרכז החישוק, והמרחק האופקי שלו מהציר

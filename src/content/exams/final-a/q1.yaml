parts:
  - label: א
    type: open
    points: 5
    level: basic
    objectives: [OBJ-7.3-1, OBJ-3.3-2]
    prompt: >-
      עבדו במערכת החישוק.

      (1) אילו כוחות פועלים על החרוז במערכת הזו כשהוא נע לאורך החישוק? (לכוח של החישוק החלק יכול להיות, מלבד רכיב
      לאורך הרדיוס של החישוק, גם רכיב בניצב למישור החישוק.) נמקו אילו מהם לא עושים עבודה, וכתבו את
      האנרגיה הפוטנציאלית האפקטיבית $U_{\text{eff}}(\theta)$ של הכובד ושל הכוח הצנטריפוגלי, כך ש-$E^{\prime} =
      \tfrac12mR^2\dot\theta^2 + U_{\text{eff}}(\theta)$ נשמרת. קבעו את האפס של האנרגיה הפוטנציאלית של הכובד בגובה מרכז
      החישוק, ואת האפס של זו של הכוח הצנטריפוגלי על הציר.

      (2) מצאו את כל נקודות שיווי המשקל של החרוז ביחס לחישוק, ובטאו באמצעות $g$ ו-$R$ את המהירות הזוויתית הקריטית
      $\omega_c$ שרק מעליה יש שיווי משקל מחוץ לציר, בזווית $\theta_0$. בדקו את $\theta_0$ בגבולות $\omega \to \omega_c$
      ו-$\omega \to \infty$.
    solution:
      - kind: law
        text: >-
          מערכת החישוק מסתובבת ב-$\omega$ קבועה, ולכן אין בה כוח אוילר. על החרוז פועלים: הכובד $m\vec g$; הכוח של
          החישוק, שניצב לחישוק כי החישוק חלק (רכיב לאורך הרדיוס של החישוק ורכיב בניצב למישור שלו); הכוח הצנטריפוגלי,
          $m\omega^2\rho$, אופקי והחוצה מהציר; וכוח קוריוליס, $\vec F_{\text{cor}} = -2m\vec\omega\times\vec v^{\prime}$. שני האחרונים
          כוחות מדומים: הם קיימים רק כי מערכת החישוק לא אינרציאלית. לפי משפט עבודה-אנרגיה
          במערכת החישוק, השינוי ב-$\tfrac12mv^{\prime2}$ שווה לעבודה של כל הכוחות האלה.
      - kind: manipulation
        text: >-
          במערכת החישוק המהירות של החרוז לאורך החישוק, $v^{\prime} = R\dot\theta$. הכוח של החישוק ניצב לה, ולכן לא עושה
          עבודה. כוח קוריוליס ניצב ל-$\vec v^{\prime}$ תמיד, ולכן גם הוא לא עושה עבודה (ו-$\vec\omega$ ו-$\vec v^{\prime}$
          שניהם במישור החישוק, ולכן כוח קוריוליס ניצב למישור, והרכיב הניצב של הכוח של החישוק מאזן אותו). נשארים שני
          כוחות שיש להם אנרגיה פוטנציאלית: הגובה ביחס למרכז הוא $y = -R\cos\theta$, ו-$U_{\text{cf}} = -\tfrac12m\omega^2\rho^2$.
          $$U_{\text{eff}}(\theta) = -mgR\cos\theta - \tfrac12m\omega^2R^2\sin^2\theta$$
          והאנרגיה $E^{\prime} = \tfrac12mR^2\dot\theta^2 + U_{\text{eff}}$ נשמרת.
      - kind: manipulation
        text: >-
          שיווי משקל הוא נקודה שבה $dU_{\text{eff}}/d\theta = 0$:
          $$\frac{dU_{\text{eff}}}{d\theta} = mR\sin\theta\left(g - \omega^2R\cos\theta\right)$$
          הנגזרת מתאפסת כש-$\sin\theta = 0$, בנקודה התחתונה ($\theta = 0$) ובנקודה העליונה ($\theta = \pi$), בכל
          $\omega$; וכש-$\cos\theta_0 = \dfrac{g}{\omega^2R}$, בשתי נקודות סימטריות $\pm\theta_0$. לקוסינוס יש פתרון
          מחוץ לתחתית רק כש-$g/(\omega^2R) < 1$, כלומר כש-$\omega > \omega_c = \sqrt{g/R}$.
      - kind: limit
        text: >-
          כש-$\omega \to 0$ נשארות רק התחתית והנקודה העליונה: החישוק במנוחה, והחרוז הוא מטוטלת פשוטה באורך $R$, עם
          שיווי משקל למטה ושיווי משקל הפוך למעלה. כש-$\omega \to \infty$: $\cos\theta_0 \to 0$ ו-$\theta_0 \to \pi/2$.
          כאן הכובד זניח, ו-$U_{\text{cf}} = -\tfrac12m\omega^2\rho^2$ לבדו הכי נמוך בנקודה הרחוקה ביותר מהציר, בגובה
          המרכז. וכש-$\omega \to \omega_c$ מלמעלה, $\theta_0 \to 0$: שיווי המשקל החדש נולד מהתחתית.
      - kind: units
        text: >-
          $g/(\omega^2R)$ ביחידות $(\text{m/s}^2)/(\text{s}^{-2}\cdot\text{m})$, חסר ממדים כמו קוסינוס. $mgR$ ו-$m\omega^2R^2$
          ביחידות $\text{kg}\cdot\text{m}^2/\text{s}^2 = \text{J}$.
      - kind: result
        text: >-
          $U_{\text{eff}}(\theta) = -mgR\cos\theta - \tfrac12m\omega^2R^2\sin^2\theta$. שיווי משקל בנקודה התחתונה ובנקודה
          העליונה בכל $\omega$, וב-$\pm\theta_0$ עם $\cos\theta_0 = g/(\omega^2R)$ רק כש-$\omega > \omega_c = \sqrt{g/R}$.
    rubric:
      - text: >-
          מניתי את הכוחות במערכת החישוק ונימקתי שהכוח של החישוק וכוח קוריוליס ניצבים למהירות של החרוז, ולכן לא עושים
          עבודה.
      - text: >-
          כתבתי $U_{\text{eff}}(\theta) = -mgR\cos\theta - \tfrac12m\omega^2R^2\sin^2\theta$.
        weight: 2
      - text: >-
          מצאתי את התחתית, את הנקודה העליונה ואת $\cos\theta_0 = g/(\omega^2R)$, וקבעתי ש-$\theta_0$ קיימת רק כש-$\omega
          > \sqrt{g/R}$.
      - text: >-
          בדקתי ש-$\theta_0 \to \pi/2$ כש-$\omega \to \infty$, וש-$\theta_0 \to 0$ כש-$\omega \to \omega_c$.

  - label: ב
    type: open
    points: 7
    level: mid
    objectives: [OBJ-5.2-2, OBJ-3.3-2, OBJ-7.3-2]
    standalone: false
    prompt: >-
      מחלק א: $U_{\text{eff}}(\theta) = -mgR\cos\theta - \tfrac12m\omega^2R^2\sin^2\theta$, ו-$\omega_c = \sqrt{g/R}$.

      (1) קבעו, לכל אחת מנקודות שיווי המשקל, באילו מהירויות זוויתיות $\omega$ היא יציבה.

      (2) בטאו באמצעות $\omega$ ו-$\omega_c$ את התדירות הזוויתית של תנודות קטנות של החרוז לאורך החישוק סביב כל שיווי
      משקל יציב: $\Omega_1$ סביב הנקודה התחתונה כש-$\omega < \omega_c$, ו-$\Omega_2$ סביב $\theta_0$ כש-$\omega >
      \omega_c$. בדקו את התוצאות בגבולות $\omega \to 0$, $\omega \to \omega_c$ ו-$\omega \to \infty$.

      (3) חשבו את $\Omega_1$ ואת זמן המחזור כש-$\omega = 3.0\,\text{rad/s}$, ואת $\theta_0$, $\Omega_2$ וזמן המחזור כש-$\omega
      = 6.0\,\text{rad/s}$, עבור $R = 0.40\,\text{m}$ ו-$g = 9.8\,\text{m/s}^2$.
    solution:
      - kind: law
        text: >-
          הקירוב ההרמוני: $E^{\prime} = \tfrac12\left(mR^2\right)\dot\theta^2 + U_{\text{eff}}(\theta)$ היא האנרגיה של "חלקיק"
          בעל "מסה" $mR^2$ בפוטנציאל $U_{\text{eff}}$. ליד שיווי משקל $\theta_e$,
          $U_{\text{eff}} \approx U_{\text{eff}}(\theta_e) + \tfrac12\kappa\,(\theta - \theta_e)^2$ עם
          $\kappa = d^2U_{\text{eff}}/d\theta^2$ ב-$\theta_e$. שיווי המשקל יציב כש-$\kappa > 0$, ואז $\Omega^2 = \kappa/(mR^2)$.
      - kind: manipulation
        text: >-
          גוזרים פעמיים, עם $\tfrac{d}{d\theta}\sin^2\theta = \sin2\theta$:
          $$\frac{d^2U_{\text{eff}}}{d\theta^2} = mgR\cos\theta - m\omega^2R^2\cos2\theta$$
          בתחתית: $\kappa = mR^2\left(\omega_c^2 - \omega^2\right)$, חיובי רק כש-$\omega < \omega_c$, ואז
          $\Omega_1 = \sqrt{\omega_c^2 - \omega^2}$. בנקודה העליונה: $\kappa = -mgR - m\omega^2R^2 < 0$, אף פעם לא יציבה.
      - kind: manipulation
        text: >-
          ב-$\theta_0$, עם $g = \omega^2R\cos\theta_0$ ו-$\cos2\theta_0 = 2\cos^2\theta_0 - 1$:
          $$\kappa = m\omega^2R^2\left[\cos^2\theta_0 - \left(2\cos^2\theta_0 - 1\right)\right] = m\omega^2R^2\sin^2\theta_0 > 0$$
          ולכן $\theta_0$ יציבה בכל פעם שהיא קיימת, ו-$\Omega_2 = \omega\sin\theta_0$. עם $\cos\theta_0 = \omega_c^2/\omega^2$:
          $$\Omega_2 = \sqrt{\omega^2 - \frac{\omega_c^4}{\omega^2}}$$
      - kind: limit
        text: >-
          $\omega \to 0$: $\Omega_1 \to \sqrt{g/R}$, המטוטלת הפשוטה באורך $R$, כמו שצריך לחישוק שעומד. $\omega \to
          \omega_c$: גם $\Omega_1$ וגם $\Omega_2$ שואפות לאפס, משני הצדדים: ב-$\omega_c$ העקמומיות בתחתית מתאפסת והכוח
          המחזיר נעלם. (בקרבת $\omega_c$, $\Omega_2^2 \approx 2(\omega^2 - \omega_c^2)$, פי שניים מ-$\Omega_1^2$ באותו
          מרחק מתחת.) $\omega \to \infty$: $\Omega_2 \to \omega$. בלי כובד, $U_{\text{eff}} = -\tfrac12m\omega^2R^2\sin^2\theta$,
          והעקמומיות שלו ב-$\theta = \pi/2$ היא $m\omega^2R^2$, כלומר $\Omega = \omega$ בדיוק.
      - kind: units
        text: >-
          $\omega_c^2 - \omega^2$ ו-$\omega_c^4/\omega^2$ ביחידות $\text{s}^{-2}$, ולכן $\Omega$ ביחידות $\text{rad/s}$.
          $\kappa/(mR^2)$: $\text{J}/(\text{kg}\cdot\text{m}^2) = \text{s}^{-2}$.
      - kind: substitution
        text: >-
          $\omega_c = \sqrt{9.8/0.40} = \sqrt{24.5} = 4.95\,\text{rad/s}$. ב-$\omega = 3.0\,\text{rad/s}$ (מתחת ל-$\omega_c$):
          $\Omega_1 = \sqrt{24.5 - 9.0} = \sqrt{15.5} = 3.94\,\text{rad/s}$, וזמן המחזור $2\pi/\Omega_1 = 1.60\,\text{s}$.
          ב-$\omega = 6.0\,\text{rad/s}$ (מעל): $\cos\theta_0 = \dfrac{9.8}{36\cdot0.40} = 0.681$, $\theta_0 = 47.1^\circ$,
          $\sin\theta_0 = 0.733$, $\Omega_2 = 6.0\cdot0.733 = 4.40\,\text{rad/s}$, וזמן המחזור $1.43\,\text{s}$.
      - kind: result
        text: >-
          התחתית יציבה רק כש-$\omega < \omega_c$, הנקודה העליונה אף פעם, ו-$\pm\theta_0$ תמיד כשהן קיימות.
          $\Omega_1 = \sqrt{\omega_c^2 - \omega^2}$ ו-$\Omega_2 = \omega\sin\theta_0 = \sqrt{\omega^2 - \omega_c^4/\omega^2}$.
          במספרים: $\Omega_1 = 3.94\,\text{rad/s}$ ($1.60\,\text{s}$); $\theta_0 = 47.1^\circ$ ו-$\Omega_2 = 4.40\,\text{rad/s}$
          ($1.43\,\text{s}$).
    rubric:
      - text: >-
          כתבתי $\Omega^2 = \kappa/(mR^2)$, עם העקמומיות של $U_{\text{eff}}$ בשיווי המשקל ועם $mR^2$ במכנה.
      - text: >-
          הראיתי שהתחתית יציבה רק כש-$\omega < \omega_c$, שהנקודה העליונה אף פעם לא יציבה, וש-$\theta_0$ יציבה בכל פעם שהיא
          קיימת.
      - text: >-
          קיבלתי $\Omega_1 = \sqrt{\omega_c^2 - \omega^2}$ ו-$\Omega_2 = \omega\sin\theta_0 = \sqrt{\omega^2 - \omega_c^4/\omega^2}$.
        weight: 2
      - text: >-
          בדקתי את הגבולות: מטוטלת פשוטה כש-$\omega \to 0$, תדירות שואפת לאפס משני הצדדים של $\omega_c$, ו-$\Omega_2 \to
          \omega$ כש-$\omega \to \infty$.
      - text: >-
          חישבתי $\Omega_1 \approx 3.94\,\text{rad/s}$, $\theta_0 \approx 47.1^\circ$ ו-$\Omega_2 \approx 4.40\,\text{rad/s}$, זמני מחזור
          $1.60$ ו-$1.43\,\text{s}$.

  - label: ג
    type: open
    points: 6
    level: bagrut
    objectives: [OBJ-3.3-2, OBJ-7.3-2]
    standalone: false
    prompt: >-
      עכשיו $\omega > \omega_c$. החרוז מוחזק במנוחה ביחס לחישוק בנקודה התחתונה ומשוחרר, והפרעה זעירה מזיזה אותו
      ממנה לצד $\theta > 0$.

      (1) הסבירו מדוע החרוז לא נשאר בתחתית, ובטאו באמצעות $g$, $\omega$ ו-$R$ את הזווית הגדולה ביותר $\theta_{\max}$
      שאליה הוא מגיע. הראו ש-$\cos\theta_{\max} = 2\cos\theta_0 - 1$.

      (2) בדקו את התוצאה בגבולות $\omega \to \omega_c$ ו-$\omega \to \infty$. הראו שליד $\omega_c$, כששתי הזוויות קטנות,
      $\theta_{\max} \approx \sqrt2\,\theta_0$ (פתחו את שני הקוסינוסים לסדר שני).

      (3) שיווי המשקל $\theta_0$ תמיד מתחת לגובה של מרכז החישוק. מעל איזו מהירות זוויתית החרוז המשוחרר עולה גבוה יותר
      מהמרכז? בטאו אותה באמצעות $\omega_c$.
    solution:
      - kind: law
        text: >-
          מחלק א, $E^{\prime} = \tfrac12mR^2\dot\theta^2 + U_{\text{eff}}(\theta)$ נשמרת במערכת החישוק. מעל $\omega_c$
          העקמומיות של $U_{\text{eff}}$ בתחתית שלילית (חלק ב): התחתית היא מקסימום, שיווי משקל לא יציב, והפרעה זעירה
          גדלה. בנקודת מפנה $\dot\theta = 0$, ולכן $U_{\text{eff}}(\theta_{\max}) = E^{\prime} = U_{\text{eff}}(0) = -mgR$.
      - kind: manipulation
        text: >-
          $$-mgR\cos\theta_{\max} - \tfrac12m\omega^2R^2\sin^2\theta_{\max} = -mgR$$
          כלומר
          $$g\left(1 - \cos\theta_{\max}\right) = \tfrac12\omega^2R\left(1 - \cos\theta_{\max}\right)\left(1 + \cos\theta_{\max}\right)$$
          השורש $\cos\theta = 1$ הוא נקודת ההתחלה. מצמצמים ב-$1 - \cos\theta_{\max} \ne 0$:
          $$\cos\theta_{\max} = \frac{2g}{\omega^2R} - 1 = 2\cos\theta_0 - 1$$
          בין $0$ ל-$\theta_{\max}$ מתקיים $U_{\text{eff}} < U_{\text{eff}}(0)$ (שם הבור סביב $\theta_0$), ולכן החרוז אכן
          מגיע לשם. $\cos\theta_{\max} - \cos\theta_0 = \cos\theta_0 - 1 < 0$, ולכן $\theta_{\max} > \theta_0$: החרוז חולף
          על פני שיווי המשקל, נעצר ב-$\theta_{\max}$ וחוזר אל התחתית.
      - kind: manipulation
        text: >-
          מעל המרכז פירושו $\theta_{\max} > \pi/2$, כלומר $\cos\theta_{\max} < 0$: $\dfrac{2g}{\omega^2R} < 1$, או
          $\omega > \sqrt{2g/R} = \sqrt2\,\omega_c$. שיווי המשקל לא עולה מעל המרכז, אבל החרוז בתנועה כן.
      - kind: limit
        text: >-
          $\omega \to \omega_c$ מלמעלה: $\cos\theta_0 \to 1$ ו-$\theta_{\max} \to 0$, החרוז כמעט לא זז. בזוויות קטנות,
          עם $\cos x \approx 1 - \tfrac12x^2$: $1 - \tfrac12\theta_{\max}^2 = 1 - \theta_0^2$, ולכן $\theta_{\max} \approx \sqrt2\,\theta_0$:
          החרוז חולף על פני שיווי המשקל ועולה הלאה, כמו שמצפים מגוף שמשוחרר במנוחה מראש גבעה בבור. $\omega \to \infty$: $\cos\theta_{\max}
          \to -1$ ו-$\theta_{\max} \to \pi$. בלי כובד, $U_{\text{eff}} \propto -\sin^2\theta$ סימטרי סביב $\pi/2$, והחרוז
          שיוצא מהתחתית שואף בדיוק לנקודה העליונה, שגם היא על הציר (ושם הוא נעצר רק בגבול, כי היא שיווי משקל).
      - kind: units
        text: >-
          $2g/(\omega^2R)$ חסר ממדים, כמו קוסינוס, ו-$\sqrt{2g/R}$ ביחידות $\text{s}^{-1}$, של מהירות זוויתית.
      - kind: result
        text: >-
          $\cos\theta_{\max} = \dfrac{2g}{\omega^2R} - 1 = 2\cos\theta_0 - 1$, ו-$\theta_{\max} > \theta_0$. החרוז עולה מעל
          מרכז החישוק כש-$\omega > \sqrt2\,\omega_c = \sqrt{2g/R}$.
    rubric:
      - text: >-
          נימקתי שמעל $\omega_c$ התחתית היא מקסימום של $U_{\text{eff}}$, ולכן הפרעה זעירה מרחיקה ממנה את החרוז.
      - text: >-
          השוויתי $U_{\text{eff}}(\theta_{\max}) = U_{\text{eff}}(0)$ בנקודת המפנה, צמצמתי ב-$1 - \cos\theta$ וקיבלתי
          $\cos\theta_{\max} = 2g/(\omega^2R) - 1$.
        weight: 2
      - text: >-
          בדקתי ש-$\theta_{\max} \to 0$, ובקירוב $\sqrt2\,\theta_0$, כש-$\omega \to \omega_c$, ו-$\theta_{\max} \to \pi$ כש-$\omega
          \to \infty$.
      - text: >-
          מצאתי שהחרוז עולה מעל המרכז כש-$\omega > \sqrt2\,\omega_c$.

  - label: ד
    type: open
    points: 7
    level: bagrut
    objectives: [OBJ-3.7-1, OBJ-3.3-1, OBJ-7.3-2]
    standalone: false
    prompt: >-
      במצב של חלק ג, עברו למערכת החדר, שהיא אינרציאלית. מחלק ג, $\cos\theta_{\max} = \dfrac{2g}{\omega^2R} - 1$.

      (1) האנרגיה המכנית של החרוז בחדר לא נשמרת, אף ש-$E^{\prime}$ נשמרת במערכת החישוק. איזה כוח, ואיזה רכיב שלו, עושה
      עליו עבודה בחדר, ומדוע אותו רכיב לא עושה עבודה במערכת החישוק?

      (2) בטאו את העבודה $W$ שהחישוק עושה על החרוז, מרגע השחרור ועד שהחרוז מגיע ל-$\theta_{\max}$, באמצעות $m$, $\omega$,
      $R$ ו-$\theta_{\max}$, משינוי האנרגיה המכנית בחדר. הראו ש-$W = 4mgR\left(1 - \dfrac{g}{\omega^2R}\right)$.

      (3) נתון: לכובד ולרכיב של כוח החישוק שבמישור החישוק (מישור שמכיל את הציר) אין מומנט סביב הציר האנכי, ולרכיב
      $N_\perp$ שניצב למישור החישוק יש מומנט $\rho N_\perp$ סביבו. הראו שההספק של הכוח של החישוק בחדר הוא
      $\omega\,dL_z/dt$, כאשר $L_z$ התנע הזוויתי של החרוז סביב הציר האנכי, וקבלו מכאן את $W$ בדרך שנייה. בדקו את $W$ בגבולות $\omega \to \omega_c$, $\omega \to \infty$, ו-$g \to 0$ ב-$\omega$
      קבועה.
    solution:
      - kind: law
        text: >-
          בחדר: משפט עבודה-אנרגיה, $W = \Delta K + \Delta U_g$, כי מלבד הכובד רק החישוק מפעיל כוח על החרוז. וסביב הציר
          האנכי: $dL_z/dt = \tau_z$, סכום המומנטים של הכוחות סביב הציר.
      - kind: manipulation
        text: >-
          (1) בחדר למהירות של החרוז יש, מלבד $R\dot\theta$ לאורך החישוק, גם רכיב $\omega\rho$ בניצב למישור החישוק: החישוק
          סוחב אותו סביב הציר. לכוח של החישוק יש רכיב בניצב למישור, $N_\perp$ (במערכת החישוק הוא מאזן את כוח קוריוליס),
          והוא לאורך המהירות הזו (בכיוונה כש-$\rho$ גדל, ונגדה כש-$\rho$ קטן), ולכן ההספק שלו לא אפס. במערכת החישוק אין לחרוז מהירות בניצב למישור, ולכן שם אותו כוח
          ניצב למהירות ולא עושה עבודה: העבודה תלויה במערכת, כי המהירות תלויה בה. את האנרגיה מספק המנוע ששומר על $\omega$.
      - kind: manipulation
        text: >-
          (2) ברגע השחרור החרוז על הציר, $\rho = 0$ ו-$\dot\theta = 0$, ולכן הוא במנוחה בחדר. ב-$\theta_{\max}$, $\dot\theta = 0$
          ונשארת רק המהירות $\omega R\sin\theta_{\max}$:
          $$W = \tfrac12m\omega^2R^2\sin^2\theta_{\max} + mgR\left(1 - \cos\theta_{\max}\right)$$
          לפי תנאי נקודת המפנה מחלק ג, $g(1 - \cos\theta_{\max}) = \tfrac12\omega^2R\sin^2\theta_{\max}$, שני האיברים
          שווים: $W = m\omega^2R^2\sin^2\theta_{\max}$. עם $c_0 = \cos\theta_0 = g/(\omega^2R)$,
          $\sin^2\theta_{\max} = (1 - \cos\theta_{\max})(1 + \cos\theta_{\max}) = (2 - 2c_0)\cdot2c_0$, ולכן
          $W = 4m\omega^2R^2c_0(1 - c_0) = 4mgR\left(1 - \dfrac{g}{\omega^2R}\right)$.
      - kind: manipulation
        text: >-
          (3) לפי הנתון (הכובד מקביל לציר, והרכיב שבמישור החישוק נמצא במישור שמכיל את הציר), רק ל-$N_\perp$ יש מומנט
          סביב הציר, עם זרוע $\rho$: $\tau_z = \rho N_\perp = dL_z/dt$. ההספק
          שלו הוא $N_\perp\cdot\omega\rho = \omega\tau_z = \omega\,dL_z/dt$. כש-$\omega$ קבועה, $W = \omega\,\Delta L_z$.
          התנע הזוויתי סביב הציר בא רק מהמהירות $\omega\rho$: $L_z = m\rho\cdot\omega\rho = m\omega R^2\sin^2\theta$, שמתחיל
          באפס. לכן $W = \omega\cdot m\omega R^2\sin^2\theta_{\max} = m\omega^2R^2\sin^2\theta_{\max}$, כמו בדרך הראשונה.
      - kind: limit
        text: >-
          $\omega \to \omega_c$: $W \to 0$, כי החרוז כמעט לא עוזב את התחתית. $g \to 0$ ב-$\omega$ קבועה: $W \to 0$. בלי
          כובד החרוז נע מהתחתית אל הנקודה העליונה (חלק ג), מהציר בחזרה אל הציר, ולכן $L_z$ מתחיל ונגמר באפס: החישוק מחזיר
          את מה שנתן. $\omega \to \infty$: $W \to 4mgR$. החרוז מגיע כמעט לנקודה העליונה, ו-$\Delta U_g \to 2mgR$, ו-$\sin^2\theta_{\max}
          \approx 4g/(\omega^2R)$ נותן אנרגיה קינטית $\tfrac12m\omega^2R^2\cdot4g/(\omega^2R) = 2mgR$: חצי וחצי, כמו בתוצאה הכללית.
      - kind: units
        text: >-
          $m\omega^2R^2$ ו-$mgR$ ביחידות $\text{kg}\cdot\text{m}^2/\text{s}^2 = \text{J}$. ו-$\omega\,\Delta L_z$:
          $\text{s}^{-1}\cdot\text{kg}\cdot\text{m}^2/\text{s} = \text{J}$.
      - kind: result
        text: >-
          את העבודה בחדר עושה הרכיב של כוח החישוק שניצב למישור החישוק.
          $W = m\omega^2R^2\sin^2\theta_{\max} = \omega\,\Delta L_z = 4mgR\left(1 - \dfrac{g}{\omega^2R}\right)$, חציה אנרגיה קינטית
          בחדר וחציה אנרגיה פוטנציאלית של כובד.
    rubric:
      - text: >-
          כתבתי שבחדר עושה עבודה הרכיב של כוח החישוק שניצב למישור החישוק, $N_\perp$ (לא הרכיב שלאורך הרדיוס של
          החישוק), ונימקתי: בחדר לחרוז יש מהירות $\omega\rho$ בכיוון הזה, ואילו במערכת החישוק אין לו מהירות בניצב למישור.
      - text: >-
          כתבתי $W = \tfrac12m\omega^2R^2\sin^2\theta_{\max} + mgR(1 - \cos\theta_{\max})$, והשתמשתי בתנאי נקודת המפנה כדי
          לקבל $W = m\omega^2R^2\sin^2\theta_{\max} = 4mgR\left(1 - g/(\omega^2R)\right)$.
        weight: 2
      - text: >-
          הראיתי מהנתון, $\tau_z = \rho N_\perp = dL_z/dt$, ש-$P = N_\perp\omega\rho = \omega\,dL_z/dt$, וש-$W = \omega\,\Delta L_z$
          עם $L_z = m\omega R^2\sin^2\theta$ נותן אותה תוצאה.
      - text: >-
          בדקתי ש-$W \to 0$ כש-$\omega \to \omega_c$ וכש-$g \to 0$, ו-$W \to 4mgR$ כש-$\omega \to \infty$.

#   oQqskrRWGco: 325 s; transcript ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/
#     b08fe7afdc54f3902d4c3933f9aff7f0_oQqskrRWGco.srt: the path cut into small intervals Δs_j, the work of each piece
#     F_j·Δs_j = |F_j| cos θ_j |Δs_j| (the component of the force along the displacement), the sum, its dependence on the
#     number of pieces, and the limit n → ∞ named the line integral.
#   i2_731Gi9bg: 351 s; transcript ocw.mit.edu/courses/8-01sc-classical-mechanics-fall-2016/
#     5c91191d7a63e9e62bc19e9939118601_i2_731Gi9bg.pdf: W = ∫F·ds with F = m dv/dt and ds = v dt, so the work becomes
#     ∫m dv·v; in Cartesian components ∫m v_x dv_x + ∫m v_y dv_y = ΔK.

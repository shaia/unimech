#   NnMIhxWRGNw: minutephysics, "E=mc² is Incomplete", 2:07. Per the transcript summary: E² = (mc²)² + (pc)² drawn as a
#     right triangle with E the hypotenuse; p = 0 gives E = mc², m = 0 gives E = pc; v = c·pc/E, which approaches c
#     as p grows but never reaches it when there is mass ("the hypotenuse of a right triangle is longer than its legs").
#   aQAhRAn6ewc: MIT OpenCourseWare, "9.1 Momentum Conservation" (8.20, Markus Klute), 4:06. Per the transcript
#     summary: the sum of m·u is not conserved in a boosted frame; momentum is redefined with the proper velocity
#     (velocity with respect to proper time), and the boosted conservation law then reduces to the original one.


  why: 'קטע קצר מהקורס MIT 8.01. לפי התמליל, המרצה מסדר את בניית האינטגרל בשלבים: בוחר ראשית וכיוון לציר, מסמן חתיכה dm במקום כלשהו במוט (לא בקצה), מכניס משתנה אינטגרציה x′ שרץ מ-0 עד L, וכותב dm = (M/L)dx′, צפיפות קווית כפול אורך. התוצאה, L/2, היא מה שציפינו. זה המתכון של איור 0.4ב, עם צפיפות קבועה.'

  why: 'פרק מהסדרה של 3Blue1Brown, עם כתוביות בעברית. לפי גרסת הטקסט של השיעור באתר הסדרה, הנוסע במכונית רואה רק את מד המהירות, v(t) = t(8 − t), וכדי לדעת כמה נסע הוא חותך את הזמן לחתיכות dt שבהן המהירות כמעט קבועה, סוכם מלבנים, ונותן ל-dt לקטון. אחר כך הוא מראה שהשטח שמתחת לציר נספר עם סימן שלילי, ושהאינטגרל הוא F(b) − F(a) לכל פונקציה קדומה F: שני הצעדים של איור 0.4א.'

# Lesson 7.4 question bank: the comprehension ladder of "כדור הארץ המסתובב".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). Strings may hold $inline$ / $$display$$ TeX and **bold**; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8 taken as the gravitational acceleration
# without rotation, OMEGA_EARTH = 7.29e-5 rad/s, R_EARTH = 6.37e6 m) in .scratch/ch7/q.ts:
#   ω²R = 0.0339 m/s² (ωR = 464 m/s; R in km: 3.39e-5);
#   plumb deviation α(λ) = atan(ω²R sinλ cosλ / (g − ω²R cos²λ)): 0 at 0° and 90°, 0.0859° at 30°,
#     0.0991° at 45° (the maximum, found by a scan; first order ω²R/(2g) = 0.0990°), 0.0858° at 60°;
#     without the ½: 0.198°, in radians: 0.00173;
#   drop of 100 m at Jerusalem, λ = 31.8°: t = 4.52 s, d = (1/3)ωg t³ cosλ = 1.87 cm
#     (no cos 2.20, no ⅓ 5.60, ½ instead of ⅓ 2.80, sin instead of cos 1.16);
#   Foucault: sidereal day 2π/ω = 23.9 h; at 31.8°: 23.9/sinλ = 45.4 h (24/sinλ = 45.5 h;

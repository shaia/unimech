  - id: Q-7.3-bead-slow
    type: twotier
    objectives: [OBJ-7.3-2]
    qualitative: true
    level: bagrut
    prompt: >-
      תיל דק מכופף לצורת פרבולה, $z = k\rho^2$ עם $k = 2.5\,\text{m}^{-1}$, כאשר $z$ הגובה מעל הנקודה התחתונה של התיל
      ו-$\rho$ המרחק מהציר האנכי שעובר דרכה. התיל מסתובב סביב הציר הזה במהירות זוויתית קבועה
      $\omega = 5.0\,\text{rad/s}$, וחרוז מושחל עליו ונע בלי חיכוך. היכן נמצא החרוז בשיווי משקל **יציב** ביחס לתיל?
    choices:
      - text: בנקודה התחתונה, $\rho = 0$.
        correct: true
        feedback: >-
          נכון. במערכת התיל, לאורך התיל, $U_{\text{eff}}/m = gz - \tfrac12\omega^2\rho^2 = \left(gk - \tfrac12\omega^2\right)\rho^2
          = (24.5 - 12.5)\rho^2 = 12.0\,\rho^2$ ביחידות $\text{J/kg}$ כש-$\rho$ במטרים. המקדם חיובי, ולכן התחתית מינימום.
      - text: במרחק קטן מהציר, שגדל ככל ש-$\omega$ גדלה.
        feedback: >-
          על פרבולה גם הכובד וגם הכוח הצנטריפוגלי נותנים איבר של $\rho^2$ בדיוק, ולכן אין שיווי משקל מחוץ לתחתית, חוץ מבמהירות
          אחת, $\omega_c = \sqrt{2gk} = 7.0\,\text{rad/s}$. מתחתיה הכובד ״מנצח״ בכל מקום, והחרוז חוזר לתחתית.
        misconception: MC-7-bead-rises-at-any-speed
      - text: בכל נקודה על התיל, כלומר החרוז נשאר איפה שמניחים אותו.
        feedback: >-
          זה קורה רק ב-$\omega = \sqrt{2gk} = 7.0\,\text{rad/s}$ בדיוק, כשהמקדם של $\rho^2$ מתאפס. ב-$5.0\,\text{rad/s}$ המקדם
          חיובי.
      - text: אין שיווי משקל יציב, והחרוז בורח למעלה לאורך התיל.
        feedback: 'זה קורה מעל $7.0\,\text{rad/s}$, כש-$\tfrac12\omega^2 > gk$ והתחתית הופכת למקסימום של $U_{\text{eff}}$.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          לאורך התיל $U_{\text{eff}}/m = \left(gk - \tfrac12\omega^2\right)\rho^2$. כש-$\omega^2 < 2gk$ המקדם חיובי, והתחתית
          מינימום.
        correct: true
        feedback: >-
          זה הנימוק. **בדיקת גבולות:** כש-$\omega \to 0$ זו קערה רגילה, והחרוז בתחתית. ב-$\omega^2 = 2gk$, כלומר
          $k = \omega^2/(2g)$, התיל בדיוק בצורת פני המים בדלי שמסתובב באותה מהירות, והחרוז אדיש בכל מקום, כמו טיפת מים על
          פני המים.
      - text: כל סיבוב, איטי ככל שיהיה, יוצר כוח צנטריפוגלי שמרחיק את החרוז מעט מהציר.
        feedback: >-
          הכוח הצנטריפוגלי אכן פועל בכל $\omega$, $m\omega^2\rho$ החוצה. אבל השיפוע של התיל הוא $2k\rho$, ולכן הרכיב של הכובד
          לאורך התיל, כלפי מטה, הוא בערך $2mgk\rho$. היחס ביניהם, $\omega^2/(2gk) = 25/49$, קטן מ-1 בכל מקום: הכובד מחזיר את
          החרוז לתחתית.
        misconception: MC-7-bead-rises-at-any-speed
      - text: בתחתית אין לחרוז מהירות, ולכן אין עליו כוח קוריוליס.
        feedback: >-
          נכון שבשיווי משקל $\vec v' = 0$ וכוח קוריוליס אפס, אבל זה נכון בכל מצב שיווי משקל ולא מכריע היכן הוא. ההכרעה
          באה מהשוואת הכובד לכוח הצנטריפוגלי.
    hints:
      - 'כתבו את האנרגיה הפוטנציאלית האפקטיבית ליחידת מסה, $gz - \tfrac12\omega^2\rho^2$, והציבו $z = k\rho^2$.'

  - id: Q-7.3-bucket
    type: numeric
    objectives: [OBJ-7.3-2]
    level: bagrut
    prompt: >-
      דלי גלילי ברדיוס $R = 0.15\,\text{m}$ מלא חלקית במים, ועומד במנוחה. מסובבים אותו סביב הציר שלו ב-$\omega = 6.0\,\text{rad/s}$,
      ואחרי זמן מה המים מסתובבים עם הדלי כגוף אחד, בלי להישפך, ומרכז הקרקעית נשאר מכוסה במים. בכמה סנטימטרים עלו
      פני המים ליד הדופן, ביחס לגובה פני המים כשהדלי עמד? (התשובה לא תלויה בעומק המים.)
    answer: 2.07
    unit: cm
    correctFeedback: >-
      נכון. במערכת הדלי פני המים הם הפרבולואיד $z(\rho) = z_0 + \dfrac{\omega^2\rho^2}{2g}$, כש-$\rho$ המרחק מהציר. כמות
      המים לא השתנתה, ולכן הגובה הממוצע של פני המים על שטח הדלי נשאר $h_0$, הגובה במנוחה:
      $\dfrac{1}{\pi R^2}\displaystyle\int_0^R z(\rho)\,2\pi\rho\,d\rho = z_0 + \dfrac{\omega^2R^2}{4g} = h_0$. בדופן
      $z(R) - h_0 = \dfrac{\omega^2R^2}{2g} - \dfrac{\omega^2R^2}{4g} = \dfrac{\omega^2R^2}{4g} = \dfrac{36\cdot0.15^2}{4\cdot9.8} = 2.07\,\text{cm}$,
      ובמרכז פני המים ירדו באותה מידה. **בדיקת גבולות:** כש-$\omega \to 0$ אין שינוי.
    wrongFeedback: >-
      הפרבולואיד לא מתחיל בגובה של פני המים במנוחה: המרכז יורד והדופן עולה. השוו את **הנפח** מתחת לפרבולואיד לנפח
      במנוחה, $\pi R^2h_0$, כש-$h_0$ גובה המים כשהדלי עמד.
    commonWrong:
      - value: 4.13
        feedback: >-
          זה הפרש הגובה בין הדופן למרכז, $\omega^2R^2/(2g)$. אבל המרכז ירד מתחת לגובה במנוחה, ולכן הדופן עלתה רק בחלק
          מההפרש: בחצי ממנו.
      - value: 1.03
        feedback: 'הגובה הממוצע של הפרבולואיד מעל $z_0$ הוא $\omega^2R^2/(4g)$, מחצית מההפרש בין הדופן למרכז, ולא רבע ממנו.'
      - value: 0.344
        feedback: 'השתמשתם ב-$\omega$ במקום ב-$\omega^2$. בדקו יחידות: $\omega R^2/g$ יוצא ביחידות $\text{m}\cdot\text{s}$, לא מטר.'
    hints:
      - 'פני המים הם $z(\rho) = z_0 + \omega^2\rho^2/(2g)$, אבל $z_0$ אינו הגובה במנוחה.'
      - 'חשבו את נפח המים בטבעות דקות, $dV = z(\rho)\,2\pi\rho\,d\rho$, והשוו לנפח במנוחה, $\pi R^2h_0$ ($h_0$ גובה המים כשהדלי עמד).'

  - id: Q-7.3-puck-two-frames
    type: mc
    objectives: [OBJ-7.3-2]
    qualitative: true
    level: bagrut
    prompt: >-
      על פטיפון חלק, שמסתובב נגד כיוון השעון במבט מלמעלה, מצויר קו מהשפה אל המרכז. ילד שעומד על השפה, בקצה הקו, דוחף
      דיסקית אל המרכז, לאורך הקו **ביחס לפטיפון**. הדיסקית מחליקה בלי חיכוך. מה רואה הילד?
    choices:
      - text: >-
          הדיסקית לא עוברת במרכז. מסלולה מתעקל ימינה מכיוון התנועה שלה, כלומר אל הצד שאליו הפטיפון מסתובב, והיא חולפת
          על פני המרכז מהצד הזה.
        correct: true
        feedback: >-
          נכון. בחדר: ברגע הדחיפה לדיסקית יש, נוסף על המהירות פנימה, גם המהירות של השפה, $\omega\rho_0$, בכיוון הסיבוב.
          על קו ישר עם רכיב כזה היא לא עוברת במרכז. בפטיפון: כוח קוריוליס מסיט ימינה מכיוון התנועה, ולגוף שנע פנימה ימינה
          הוא כיוון הסיבוב. שני התיאורים מסכימים.
      - text: הדיסקית מחליקה לאורך הקו המצויר ועוברת במרכז, כי היא נדחפה לאורכו.
        feedback: >-
          בחדר המהירות שלה היא $\vec v' + \vec\omega\times\vec r'$, ולא רק $\vec v'$: היא נושאת איתה את המהירות של השפה.
          במערכת הפטיפון כוח קוריוליס מסיט אותה מהקו מהרגע הראשון.
      - text: >-
          הדיסקית מתעקלת אל הצד ההפוך לכיוון הסיבוב, ומפגרת אחרי הקו, כמו דיסקית שנדחפת מהמרכז החוצה.
        feedback: >-
          כוח קוריוליס מסיט ימינה מכיוון **התנועה**. לדיסקית שנעה החוצה ימינה פירושו נגד כיוון הסיבוב, אבל לדיסקית שנעה
          פנימה ימינה פירושו עם כיוון הסיבוב.
      - text: >-
          הדיסקית מאטה לאורך הקו, נעצרת לפני המרכז, והכוח הצנטריפוגלי מחזיר אותה החוצה לאורך אותו קו.
        feedback: >-
          הכוח הצנטריפוגלי אכן רדיאלי, אבל כל עוד הדיסקית נעה ביחס לפטיפון פועל עליה גם כוח קוריוליס, ניצב למהירות, והמסלול
          לא נשאר על הקו.
    hints:
      - 'פתרו קודם בחדר: מה המהירות של הדיסקית ברגע הדחיפה, כשהיא עדיין על השפה?'

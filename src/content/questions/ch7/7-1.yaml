  # ---------------------------------------------------------------- OBJ-7.1-1 the second law with a fictitious force
  - id: Q-7.1-fictitious-direction
    type: vector
    objectives: [OBJ-7.1-1]
    qualitative: true
    level: basic
    prompt: >-
      קרון רכבת מאיץ על מסילה ישרה ואופקית, ימינה בדף, בתאוצה קבועה $\vec A$. נוסע עומד בקרון ונאחז במוט. במערכת
      הייחוס של הקרון, שהיא מערכת ייחוס לא-אינרציאלית, החוק השני מקבל איבר נוסף: הכוח המדומה
      $\vec F_{\text{fict}} = -m\vec A$. לאיזה כיוון פונה הכוח המדומה על הנוסע?
    answer: w
    correctFeedback: >-
      נכון. $\vec F_{\text{fict}} = -m\vec A$ פונה הפוך לתאוצה של הקרון: שמאלה, אחורה. זה הכוח שהנוסע ״מרגיש״ מושך
      אותו לאחור, והמוט מאזן אותו בכוח קדימה. במערכת הקרון הנוסע במנוחה, ולכן $\vec F_{\text{pole}} - m\vec A = 0$.
    wrongFeedback: >-
      כתבו את החוק השני במערכת הקרון, $m\vec a' = \sum\vec F - m\vec A$, ושימו לב לסימן המינוס: הכוח המדומה הפוך
      לתאוצה של המערכת.
    wrong:
      - dir: e
        feedback: >-
          זה הכיוון של התאוצה $\vec A$ של הקרון. הכוח המדומה הוא $\vec F_{\text{fict}} = -m\vec A$, בכיוון ההפוך: כשהקרון מאיץ קדימה, הנוסע
          נלחץ לאחור, לא קדימה.
        misconception: MC-7-fictitious-along-acceleration
      - dir: zero
        feedback: >-
          הכוח המדומה מתאפס רק כשהמערכת אינרציאלית, $\vec A = 0$. הקרון מאיץ, ולכן במערכת שלו יש כוח מדומה שגודלו
          $mA$.
      - dir: s
        feedback: >-
          כלפי מטה פועל כוח הכובד, וכוח נורמלי מאזן אותו. הכוח המדומה $\vec F_{\text{fict}} = -m\vec A$ מקביל לתאוצה של הקרון, והיא אופקית.
    hints:
      - 'הכוח המדומה הוא המסה כפול התאוצה של המערכת, עם סימן מינוס.'

  - id: Q-7.1-fictitious-real
    type: mc
    objectives: [OBJ-7.1-1]
    qualitative: true
    level: basic
    prompt: >-
      במערכת הייחוס של מכונית שמאיצה בתאוצה $\vec A$ כותבים לנוסע $m\vec a' = \sum\vec F - m\vec A$, כאשר $\sum\vec F$
      הם הכוחות שגופים אחרים מפעילים עליו. מה נכון לגבי האיבר $\vec F_{\text{fict}} = -m\vec A$?
    choices:
      - text: >-
          אף גוף לא מפעיל אותו, ולכן אין לו כוח תגובה לפי החוק השלישי. הוא מופיע רק כשכותבים את החוק השני במערכת
          המואצת.
        correct: true
        feedback: >-
          נכון. $\vec F_{\text{fict}} = -m\vec A$ אינו אינטראקציה בין שני גופים: הוא תוצאה של בחירת מערכת ייחוס מואצת. במערכת אינרציאלית אותה
          תנועה מתוארת בלעדיו, והחוק השלישי חל רק על הכוחות שב-$\sum\vec F$.
      - text: >-
          המושב מפעיל אותו על הנוסע, ולכן לפי החוק השלישי הנוסע מפעיל על המושב כוח שווה בגודלו ובכיוון הפוך.
        feedback: >-
          המושב מפעיל על הנוסע כוח אמיתי, והוא כבר בתוך $\sum\vec F$, עם כוח תגובה. לאיבר $\vec F_{\text{fict}} = -m\vec A$ אין גוף שמפעיל
          אותו, ולכן גם אין לו כוח תגובה.
        misconception: MC-7-fictitious-has-reaction
      - text: >-
          הוא פועל גם במערכת הייחוס של הכביש, ולכן גם צופה על המדרכה רואה כוח שזורק את הנוסע לאחור.
        feedback: >-
          הצופה על המדרכה, במערכת אינרציאלית, לא רואה כוח כזה. הוא רואה את הנוסע ממשיך במהירותו עד שהמושב דוחף אותו
          קדימה. ה״זריקה לאחור״ היא תיאור של אותה תנועה במערכת המכונית.
        misconception: MC-7-fictitious-force-in-inertial-frame
      - text: הגודל שלו תלוי בנפח של הגוף, כמו כוח העילוי.
        feedback: >-
          הוא פרופורציוני ל**מסה** של הגוף, $mA$, בדיוק כמו כוח הכובד $mg$. התכונה הזו היא הבסיס לעקרון השקילות.
    hints:
      - 'שאלו את עצמכם: איזה גוף מפעיל את הכוח הזה? ומה צופה על המדרכה רואה?'

  - id: Q-7.1-crate-on-truck
    type: numeric
    objectives: [OBJ-7.1-1]
    level: mid
    prompt: >-
      ארגז מונח על הרצפה האופקית של משאית. מקדם החיכוך הקינטי בין הארגז לרצפה הוא $\mu_k = 0.15$. המשאית מאיצה
      קדימה בתאוצה $A = 3.0\,\text{m/s}^2$, והארגז מחליק על הרצפה. מה גודל התאוצה של הארגז **ביחס למשאית**, $a'$?
    answer: 1.53
    unit: m/s²
    correctFeedback: >-
      נכון. במערכת המשאית פועלים על הארגז הכוח המדומה $mA$ אחורה, וחיכוך $\mu_k mg$ קדימה, כי הארגז מחליק אחורה ביחס
      לרצפה והחיכוך מתנגד להחלקה. לכן $ma' = mA - \mu_k mg$, ו-$a' = 3.0 - 0.15\cdot9.8 = 1.53\,\text{m/s}^2$ אחורה.
      **בדיקה במערכת הכביש:** הארגז מאיץ קדימה ב-$\mu_k g = 1.47\,\text{m/s}^2$ והמשאית ב-$3.0\,\text{m/s}^2$, וההפרש
      הוא אותם $1.53\,\text{m/s}^2$.
    wrongFeedback: >-
      ציירו תרשים כוחות במערכת המשאית: הכוח המדומה $\vec F_{\text{fict}} = -m\vec A$, החיכוך, הכובד והכוח הנורמלי. לאיזה כיוון מחליק הארגז
      ביחס לרצפה, ולכן לאיזה כיוון פונה החיכוך?
    commonWrong:
      - value: 3.0
        feedback: 'זו התאוצה היחסית בלי חיכוך. החיכוך מתנגד להחלקה אחורה, ולכן מקטין את התאוצה היחסית ב-$\mu_k g$.'
      - value: 4.47
        feedback: >-
          הפניתם את החיכוך אחורה, יחד עם הכוח המדומה. החיכוך מתנגד לתנועה **היחסית** בין המשטחים, והארגז מחליק אחורה
          ביחס לרצפה, ולכן החיכוך עליו פונה קדימה.
      - value: 1.47
        feedback: >-
          זו התאוצה של הארגז ביחס לכביש, $\mu_k g$. השאלה היא ביחס למשאית: הפחיתו את התאוצה של המשאית עצמה.
    hints:
      - 'במערכת המשאית: $ma'' = \sum F - mA$. מה $\sum F$ האופקי?'

  - id: Q-7.1-hanging-tilt
    type: numeric
    objectives: [OBJ-7.1-1, OBJ-7.1-2]
    level: mid
    prompt: >-
      משקולת תלויה בחוט מתקרת מכונית שמאיצה על כביש אופקי בתאוצה קבועה $A = 4.0\,\text{m/s}^2$. המשקולת במנוחה ביחס
      למכונית. מה הזווית בין החוט לאנך, במעלות?
    answer: 22.2
    unit: °
    correctFeedback: >-
      נכון. במערכת המכונית המשקולת במנוחה, ולכן המתיחות מאזנת את הכובד ואת הכוח המדומה: $T\cos\theta = mg$ ו-$T\sin\theta = mA$.
      מחלקים: $\tan\theta = \dfrac{A}{g} = \dfrac{4.0}{9.8}$, ו-$\theta = 22.2^\circ$. המשקולת נוטה **אחורה**, והחוט
      מצביע בכיוון של תאוצת הנפילה האפקטיבית $\vec g_{\text{eff}} = \vec g - \vec A$.
    wrongFeedback: >-
      במערכת המכונית שלושה כוחות פועלים על המשקולת והיא במנוחה. פרקו את המתיחות לרכיב אנכי ולרכיב אופקי, וחלקו את
      המשוואות זו בזו.
    commonWrong:
      - value: 24.1
        feedback: >-
          חישבתם $\arcsin(A/g)$. הרכיב האופקי של המתיחות הוא $T\sin\theta$ והאנכי $T\cos\theta$, ולכן היחס $A/g$ הוא
          הטנגנס של הזווית, לא הסינוס.
      - value: 67.8
        feedback: 'זו הזווית בין החוט ל**אופק**: $\tan\theta = g/A$. מהאנך, $\tan\theta = A/g$.'
    hints:
      - 'כתבו את שיווי המשקל במערכת המכונית, עם הכוח המדומה $mA$ אחורה.'

  # ---------------------------------------------------------------- OBJ-7.1-2 elevator, car, equivalence principle
  - id: Q-7.1-equivalence
    type: mc
    objectives: [OBJ-7.1-2]
    qualitative: true
    level: basic
    prompt: >-
      אסטרונאוטית מתעוררת בתא סגור בלי חלונות. היא משחררת כדור, והוא נופל לרצפה בתאוצה $9.8\,\text{m/s}^2$. ייתכן
      שהתא עומד על פני כדור הארץ, וייתכן שהוא בחללית רחוק מכל כוכב, שמאיצה ״כלפי מעלה״ בתאוצה $9.8\,\text{m/s}^2$. האם
      ניסוי מכני קטן בתוך התא יכול להכריע בין שתי האפשרויות?
    choices:
      - text: לא. בניסוי מקומי אי אפשר להבחין בין שדה כובד אחיד לבין מערכת ייחוס בתאוצה קווית שווה לו.
        correct: true
        feedback: >-
          נכון, זה עקרון השקילות. הכוח המדומה $\vec F_{\text{fict}} = -m\vec A$ פרופורציוני למסה בדיוק כמו הכובד $m\vec g$, ולכן כל גוף בתא
          מאיץ באותה תאוצה בשני המקרים, וכל ניסוי מכני מקומי נותן אותה תוצאה.
      - text: כן. מאזניים קפיציים יראו בחללית משקל אפס, כי אין שם כובד.
        feedback: >-
          המאזניים מודדים את הכוח הנורמלי. בחללית המאיצה הרצפה צריכה לדחוף את האסטרונאוטית בכוח $mA = mg$ כדי להאיץ
          אותה, ולכן הם מראים בדיוק את אותו ערך כמו על כדור הארץ.
        misconception: MC-7-equivalence-detectable
      - text: כן. בחללית כדור כבד ״נופל״ מהר יותר מכדור קל, כי הרצפה פוגשת קודם את הגוף בעל האינרציה הגדולה.
        feedback: >-
          במערכת אינרציאלית שני הכדורים, אחרי השחרור, נעים במהירות קבועה, והרצפה מאיצה אל שניהם יחד: הם פוגעים בה
          באותו רגע. זה בדיוק מה שקורה גם על כדור הארץ.
        misconception: MC-7-equivalence-detectable
      - text: כן. מטוטלת תתנודד בחללית בזמן מחזור שונה, כי אין שם $g$.
        feedback: >-
          במערכת החללית תאוצת הנפילה האפקטיבית היא $g_{\text{eff}} = A = 9.8\,\text{m/s}^2$, ולכן זמן המחזור
          $2\pi\sqrt{L/g_{\text{eff}}}$ זהה לזה שעל כדור הארץ.
        misconception: MC-7-equivalence-detectable
    hints:
      - 'במערכת החללית, מה גודל הכוח המדומה על גוף בעל מסה $m$? והכובד על כדור הארץ?'

  - id: Q-7.1-elevator-slowing
    type: twotier
    objectives: [OBJ-7.1-2]
    qualitative: true
    level: mid
    prompt: >-
      אדם עומד על מאזניים במעלית. המעלית יורדת, וכשהיא מתקרבת לקומת הקרקע היא מאטה בקצב קבוע. מה מראים המאזניים בשלב
      ההאטה, בהשוואה למשקל $mg$?
    choices:
      - text: יותר מ-$mg$.
        correct: true
        feedback: >-
          נכון. מעלית שיורדת ומאטה מאיצה **כלפי מעלה**. במערכת המעלית הכוח המדומה $\vec F_{\text{fict}} = -m\vec A$ פונה כלפי מטה, מצטרף לכובד,
          והמאזניים מראים $m(g + A)$.
      - text: פחות מ-$mg$, כי המעלית נעה כלפי מטה.
        feedback: >-
          את הקריאה קובעת התאוצה, לא כיוון המהירות. מעלית שיורדת ומאיצה כלפי מטה מראה פחות מ-$mg$, אבל מעלית שיורדת
          ו**מאטה** מאיצה כלפי מעלה.
        misconception: MC-7-scale-follows-velocity
      - text: בדיוק $mg$, כי המעלית עדיין נעה כלפי מטה במהירות כמעט קבועה.
        feedback: >-
          המהירות משתנה בקצב קבוע, ולכן התאוצה אינה אפס. רק במהירות קבועה המעלית היא מערכת אינרציאלית והמאזניים מראים
          $mg$.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          התאוצה של המעלית פונה כלפי מעלה, ולכן הכוח המדומה במערכת שלה פונה כלפי מטה ומגדיל את תאוצת הנפילה האפקטיבית.
        correct: true
        feedback: >-
          זה הנימוק: $g_{\text{eff}} = g + A$ כשהמעלית מאיצה כלפי מעלה, בין שהיא עולה ומאיצה ובין שהיא יורדת ומאטה.
      - text: מי שיורד מרגיש קל יותר, ומי שעולה מרגיש כבד יותר.
        feedback: >-
          ההרגשה נקבעת על ידי הכוח הנורמלי, והוא תלוי בתאוצה. במהירות קבועה, כלפי מעלה או כלפי מטה, המאזניים מראים
          $mg$ בדיוק.
        misconception: MC-7-scale-follows-velocity
      - text: הכוח המדומה פונה בכיוון התנועה של המעלית, כלפי מטה.
        feedback: >-
          הכוח המדומה הפוך ל**תאוצה** של המעלית, לא קשור לכיוון התנועה. כאן הוא אכן כלפי מטה, אבל משום שהתאוצה כלפי
          מעלה.
        misconception: MC-7-fictitious-along-acceleration
    hints:
      - 'קבעו קודם את כיוון התאוצה: המהירות כלפי מטה וגודלה קטן.'

  - id: Q-7.1-rank-periods
    type: rank
    objectives: [OBJ-7.1-2]
    qualitative: true
    level: mid
    prompt: >-
      אותה מטוטלת מתמטית, באורך $L$, מתנודדת תנודות קטנות בארבעה מצבים. בכל המצבים שבהם יש תאוצה, גודלה
      $A = 2.0\,\text{m/s}^2$. דרגו את זמני המחזור, מהגדול לקטן.
    items:
      - { id: down, label: 'במעלית שמאיצה כלפי מטה' }
      - { id: rest, label: 'בחדר שעומד על הקרקע' }
      - { id: car, label: 'במכונית שמאיצה על כביש אופקי' }
      - { id: up, label: 'במעלית שמאיצה כלפי מעלה' }
    order: [down, rest, car, up]
    correctFeedback: >-
      נכון. במערכת המואצת המטוטלת ״מרגישה״ את תאוצת הנפילה האפקטיבית $\vec g_{\text{eff}} = \vec g - \vec A$, וזמן
      המחזור הוא $2\pi\sqrt{L/g_{\text{eff}}}$. הגדלים: $g - A = 7.8$, $g = 9.8$, $\sqrt{g^2 + A^2} = 10.0$ ו-$g + A = 11.8$,
      כולם ב-$\text{m/s}^2$. ככל ש-$g_{\text{eff}}$ גדולה יותר, זמן המחזור קצר יותר.
    wrongFeedback: >-
      חשבו את $\vec g_{\text{eff}} = \vec g - \vec A$ בכל מצב. בתאוצה אופקית שני הווקטורים ניצבים, והגודל הוא שורש סכום
      הריבועים, לא סכום.
    hints:
      - 'זמן המחזור של מטוטלת מתמטית הוא $2\pi\sqrt{L/g}$. מה מחליף את $g$ במערכת מואצת?'

  - id: Q-7.1-helium-balloon
    type: twotier
    objectives: [OBJ-7.1-2]
    qualitative: true
    level: bagrut
    prompt: >-
      בלון הליום קשור בחוט לרצפה של מכונית סגורה, והחלונות סגורים. המכונית עומדת, והחוט אנכי. עכשיו המכונית מאיצה
      קדימה בתאוצה קבועה. לאן נוטה הבלון, ביחס למכונית?
    choices:
      - text: קדימה, בכיוון התאוצה.
        correct: true
        feedback: >-
          נכון, אף שכל השאר במכונית, הנוסעים ומשקולת תלויה, נוטים לאחור. החוט מתיישר בכיוון ההפוך ל-$\vec g_{\text{eff}}$,
          ו-$\vec g_{\text{eff}} = \vec g - \vec A$ פונה מטה ואחורה. הבלון ״צף מעלה״ ביחס ל-$\vec g_{\text{eff}}$, כלומר
          מעלה וקדימה.
      - text: אחורה, כמו כל דבר אחר במכונית.
        feedback: >-
          משקולת תלויה אכן נוטה לאחור. הבלון קל מהאוויר שהוא דוחק, ולכן הוא מתנהג הפוך: כמו שבכובד הוא עולה במקום ליפול,
          כך במכונית המאיצה הוא נע נגד הכוח המדומה, קדימה.
        misconception: MC-7-balloon-moves-back
      - text: הוא נשאר אנכי, כי המסה שלו כמעט אפס ולכן הכוח המדומה עליו זניח.
        feedback: >-
          הכוח המדומה על הבלון באמת קטן, אבל כוח העילוי לא זניח: האוויר במכונית נדחק לאחור, והפרש הלחצים דוחף את הבלון
          קדימה.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          במערכת המכונית האוויר ״שוקע״ לאחור ולמטה, בכיוון $\vec g_{\text{eff}}$, ולכן הלחץ שלו גדל לאחור, ועל הבלון פועל
          עילוי בכיוון ההפוך ל-$\vec g_{\text{eff}}$.
        correct: true
        feedback: >-
          זה הנימוק. העילוי שווה למשקל האפקטיבי של האוויר הנדחק, $\rho_{\text{air}} V\vec g_{\text{eff}}$ בכיוון הפוך, והוא
          גדול מהמשקל האפקטיבי של הבלון. לכן השקול, בלי החוט, פונה נגד $\vec g_{\text{eff}}$.
      - text: הכוח המדומה דוחף כל גוף במכונית לאחור, ולכן גם את הבלון.
        feedback: >-
          הכוח המדומה $\vec F_{\text{fict}} = -m\vec A$ על הבלון אכן פונה לאחור, אבל הוא לא הכוח היחיד. כוח העילוי בכיוון ההפוך ל-$\vec g_{\text{eff}}$
          גדול ממנו, כמו שהעילוי גדול מהכובד ומרים את הבלון.
        misconception: MC-7-balloon-moves-back
      - text: הבלון נשאר במקומו ביחס לכביש בגלל ההתמד שלו, והמכונית נעה תחתיו.
        feedback: >-
          זה התיאור של משקולת: היא מפגרת אחרי המכונית. הבלון מוקף אוויר שגם הוא מפגר, ונדחק לחלק האחורי של המכונית,
          ולכן הבלון נדחף קדימה.
    hints:
      - 'במערכת המכונית $\vec g_{\text{eff}} = \vec g - \vec A$. לאן ״עולה״ בלון בשדה כובד אחיד?'

  - id: Q-7.1-tilted-pendulum
    type: numeric
    objectives: [OBJ-7.1-2]
    level: bagrut
    prompt: >-
      מטוטלת מתמטית באורך $L = 0.80\,\text{m}$ תלויה מתקרת קרון שמאיץ על מסילה אופקית בתאוצה קבועה
      $A = 5.0\,\text{m/s}^2$. המטוטלת מתנודדת תנודות קטנות סביב מצב שיווי המשקל המוטה שלה. מה זמן המחזור?
    answer: 1.69
    unit: s
    correctFeedback: >-
      נכון. במערכת הקרון המטוטלת נמצאת בשדה אחיד $\vec g_{\text{eff}} = \vec g - \vec A$, שגודלו
      $g_{\text{eff}} = \sqrt{g^2 + A^2} = \sqrt{9.8^2 + 5.0^2} = 11.0\,\text{m/s}^2$, והיא מתנודדת סביב הכיוון שלו:
      $$T = 2\pi\sqrt{\frac{L}{g_{\text{eff}}}} = 2\pi\sqrt{\frac{0.80}{11.0}} = 1.69\,\text{s}$$
      **בדיקת גבולות:** כש-$A \to 0$ מתקבל $2\pi\sqrt{L/g} = 1.80\,\text{s}$, המטוטלת בחדר רגיל, וכש-$A \gg g$ המטוטלת
      ״נופלת״ אופקית ו-$T \to 2\pi\sqrt{L/A}$.
    wrongFeedback: >-
      במערכת הקרון, מה תאוצת הנפילה האפקטיבית? היא הסכום הווקטורי $\vec g - \vec A$, ושני האיברים בו ניצבים זה לזה.
    commonWrong:
      - value: 1.8
        feedback: 'זה זמן המחזור בקרון שעומד. התאוצה של הקרון משנה את $g_{\text{eff}}$, ולכן גם את זמן המחזור.'
      - value: 1.46
        feedback: >-
          חיברתם $g + A = 14.8\,\text{m/s}^2$ כמספרים. $\vec g$ אנכי ו-$\vec A$ אופקי, ולכן גודל ההפרש $\vec g - \vec A$ הוא
          $\sqrt{g^2 + A^2}$.
        misconception: MC-7-g-eff-adds-scalars
      - value: 2.57
        feedback: 'חיסרתם $g - A$. זה נכון רק במעלית שמאיצה כלפי מטה, כש-$\vec A$ מקביל ל-$\vec g$.'
        misconception: MC-7-g-eff-adds-scalars
    hints:
      - 'במצב שיווי המשקל החוט מקביל ל-$\vec g_{\text{eff}}$. סביב הכיוון הזה, המטוטלת ״רואה״ שדה כובד אחיד.'

  - id: Q-7.1-coin-in-elevator
    type: numeric
    objectives: [OBJ-7.1-2]
    level: bagrut
    prompt: >-
      מעלית עולה במהירות $3.0\,\text{m/s}$, וברגע מסוים היא מאיצה כלפי מעלה בתאוצה $A = 2.2\,\text{m/s}^2$. באותו רגע נוסע
      משחרר מטבע מגובה $h = 1.5\,\text{m}$ מעל רצפת המעלית. אחרי כמה זמן פוגע המטבע ברצפה?
    answer: 0.5
    unit: s
    correctFeedback: >-
      נכון. במערכת המעלית המטבע משתחרר ממנוחה, ונופל בתאוצה $g_{\text{eff}} = g + A = 12.0\,\text{m/s}^2$. לכן
      $h = \tfrac12 g_{\text{eff}}t^2$ ו-$t = \sqrt{\dfrac{2h}{g + A}} = \sqrt{\dfrac{3.0}{12.0}} = 0.500\,\text{s}$.
      המהירות $3.0\,\text{m/s}$ לא נכנסת: היא משותפת למטבע ולמעלית. **בדיקת גבולות:** כש-$A \to 0$ מתקבל
      $\sqrt{2h/g} = 0.553\,\text{s}$, כמו בחדר שעומד, ובמעלית בנפילה חופשית, $A = -g$, המטבע לא נופל כלל.
    wrongFeedback: >-
      עברו למערכת המעלית. מה המהירות ההתחלתית של המטבע בה, ומה התאוצה שלו ביחס לרצפה?
    commonWrong:
      - value: 0.553
        feedback: 'זה זמן הנפילה בחדר שעומד. במערכת המעלית יש גם כוח מדומה, כלפי מטה, שמגדיל את תאוצת הנפילה ל-$g + A$.'
      - value: 0.628
        feedback: >-
          השתמשתם ב-$g - A$. המעלית מאיצה **כלפי מעלה**, ולכן הכוח המדומה $\vec F_{\text{fict}} = -m\vec A$ פונה כלפי מטה ומצטרף לכובד.
        misconception: MC-7-fictitious-along-acceleration
      - value: 0.938
        feedback: >-
          פתרתם במערכת הבניין, עם המטבע עולה ב-$3.0\,\text{m/s}$ ובתאוצה $g$ כלפי מטה, אבל השארתם את הרצפה במקום. הרצפה עולה
          ומאיצה לקראת המטבע. במערכת המעלית שתי התנועות האלה הופכות לנפילה אחת ממנוחה.
    hints:
      - 'במערכת המעלית, המהירות ההתחלתית של המטבע היא אפס.'
      - 'מה תאוצת הנפילה האפקטיבית במעלית שמאיצה כלפי מעלה?'

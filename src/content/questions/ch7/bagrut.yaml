      - label: ג
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-7.3-2]
        prompt: >-
          בשלב השני, הראו שבמערכת שמסתובבת עם המים פני המים הם פרבולואיד:
          $$z(r) = z_0 + \frac{\omega^2r^2}{2g}$$
          כאשר $z_0$ גובה פני המים על הציר ו-$r$ המרחק מהציר. בדקו את התוצאה בגבולות ובדקו את היחידות, והשוו לשלב הראשון.
        hints:
          - 'במערכת המסתובבת המים במנוחה. מה $\vec g_{\text{eff}}$ במרחק $r$ מהציר?'
          - 'השיפוע של פני המים, $dz/dr$, שווה ליחס בין הרכיב האופקי לרכיב האנכי של $\vec g_{\text{eff}}$.'
        solution:
          - { kind: law, text: 'במערכת המסתובבת המים במנוחה, ולכן כוח קוריוליס עליהם אפס, ו-$\omega$ קבועה, ולכן אין כוח אוילר. הכוח המדומה היחיד הוא הכוח הצנטריפוגלי, ויחד עם הכובד הוא נותן $\vec g_{\text{eff}} = \vec g + \omega^2r\,\hat r$. את שניהם מאזנים כוחות הלחץ של המים שמסביב, ולכן, כמו בשלב הראשון, פני נוזל במנוחה ניצבים בכל נקודה ל-$\vec g_{\text{eff}}$.' }
          - { kind: manipulation, text: 'בחתך אנכי דרך הציר, משיק לפני המים בנקודה $r$ ניצב ל-$\vec g_{\text{eff}}$. לכן השיפוע הוא היחס בין הרכיב האופקי לאנכי: $\dfrac{dz}{dr} = \dfrac{\omega^2r}{g}$.' }
          - { kind: manipulation, text: 'באינטגרציה מ-0 עד $r$: $z(r) - z_0 = \displaystyle\int_0^r\frac{\omega^2r''}{g}\,dr'' = \frac{\omega^2r^2}{2g}$. זה פרבולואיד. אותה תוצאה מתקבלת מהדרישה שפני המים יהיו משטח של אנרגיה פוטנציאלית אפקטיבית קבועה, $gz - \tfrac12\omega^2r^2 = \text{const}$.' }
          - { kind: limit, text: 'כש-$\omega \to 0$ פני המים שטוחים, $z = z_0$. במרחק $r$ השיפוע המקומי הוא $\omega^2r/g$: בדיוק $\tan\theta = A/g$ של השלב הראשון, עם $A = \omega^2r$, התאוצה הצנטריפטלית של המים במקום הזה במערכת האינרציאלית. על הציר, $r = 0$, השיפוע אפס, כי שם אין תאוצה.' }
          - { kind: units, text: '$\dfrac{\omega^2r^2}{g}$ ביחידות $\dfrac{\text{s}^{-2}\,\text{m}^2}{\text{m/s}^2} = \text{m}$, כמו גובה.' }
          - { kind: result, text: 'פני המים הם הפרבולואיד $z(r) = z_0 + \dfrac{\omega^2r^2}{2g}$. בכל נקודה הם נוטים כמו פני מים במשאית שמאיצה ב-$\omega^2r$.' }
        rubric:
          - text: כתבתי את $\vec g_{\text{eff}}$ במערכת המסתובבת, עם הכוח הצנטריפוגלי ליחידת מסה $\omega^2r$ החוצה.
          - text: נימקתי שפני המים ניצבים ל-$\vec g_{\text{eff}}$, וכתבתי $dz/dr = \omega^2r/g$.
          - text: אינטגרלתי וקיבלתי $\omega^2r^2/(2g)$.
          - text: בדקתי שכש-$\omega \to 0$ פני המים שטוחים, והשוויתי את השיפוע המקומי ל-$A/g$ של השלב הראשון.
          - text: בדקתי שהיחידות הן מטר.

      - label: ד
        type: open
        points: 9
        level: bagrut
        standalone: false
        objectives: [OBJ-7.3-2, OBJ-0.7-2]
        prompt: >-
          המים לא נשפכים, וכמותם לא משתנה. בטאו באמצעות $g$, $h_0$ ו-$R$ את המהירות הזוויתית $\omega$ שבה פני המים נוגעים
          בדיוק בתחתית המכל, במרכז שלו, ואת גובה המים בדופן ברגע הזה. בדקו את התוצאה בגבולות, וחשבו את שני הגדלים.
        hints:
          - 'חשבו את הנפח מתחת לפרבולואיד בטבעות דקות: $dV = z(r)\,2\pi r\,dr$, והשוו ל-$\pi R^2h_0$.'
        solution:
          - { kind: law, text: 'נפח המים קבוע, $\pi R^2h_0$. מחלק ג, במערכת המסתובבת פני המים הם $z(r) = z_0 + \dfrac{\omega^2r^2}{2g}$, ואת הנפח מתחתם מחשבים בטבעות דקות, $dV = z(r)\,2\pi r\,dr$.' }
          - { kind: manipulation, text: '$$V = \int_0^R\left(z_0 + \frac{\omega^2r^2}{2g}\right)2\pi r\,dr = \pi R^2\left(z_0 + \frac{\omega^2R^2}{4g}\right) = \pi R^2h_0$$ ולכן $z_0 = h_0 - \dfrac{\omega^2R^2}{4g}$. פני המים נוגעים בתחתית כש-$z_0 = 0$: $$\omega = \frac{2\sqrt{gh_0}}{R}$$ ואז בדופן $z(R) = \dfrac{\omega^2R^2}{2g} = 2h_0$.' }
          - { kind: manipulation, text: 'פני המים לא יורדים במרכז באותה מידה שהם עולים בדופן: הגובה הממוצע של הפרבולואיד מעל $z_0$ הוא $\omega^2R^2/(4g)$, חצי מההפרש בין הדופן למרכז. לכן כשהמרכז יורד ב-$h_0$, הדופן עולה ב-$h_0$, וההפרש ביניהם $2h_0$.' }
          - { kind: limit, text: 'כש-$\omega \to 0$: $z_0 \to h_0$, המים שטוחים בגובה ההתחלתי. כש-$h_0 \to 0$: $\omega \to 0$, שכבת מים דקה חושפת את התחתית כמעט מיד. וגובה המים בדופן, $2h_0$, לא תלוי ב-$R$ וב-$g$: את הגובה קובעים רק הצורה הפרבולית והנפח.' }
          - { kind: units, text: '$\dfrac{\sqrt{gh_0}}{R}$ ביחידות $\dfrac{\sqrt{\text{m/s}^2\cdot\text{m}}}{\text{m}} = \text{s}^{-1}$, כמו מהירות זוויתית.' }
          - { kind: substitution, text: '$\omega = \dfrac{2\sqrt{9.8\cdot0.10}}{0.30} = 6.60\,\text{rad/s}$, כסיבוב בשנייה, ובדופן המים בגובה $2h_0 = 0.20\,\text{m}$.' }
          - { kind: result, text: '$\omega = \dfrac{2\sqrt{gh_0}}{R} = 6.60\,\text{rad/s}$, ואז המים בדופן בגובה $2h_0 = 0.20\,\text{m}$.' }
        rubric:
          - text: 'כתבתי את הנפח מתחת לפרבולואיד כאינטגרל על טבעות, והשוויתי אותו ל-$\pi R^2h_0$.'
          - text: 'קיבלתי $z_0 = h_0 - \omega^2R^2/(4g)$, ומ-$z_0 = 0$ את $\omega = 2\sqrt{gh_0}/R$.'
          - text: 'בדקתי שכש-$\omega \to 0$ חוזרים לגובה $h_0$.'
          - text: 'חישבתי כ-$6.6\,\text{rad/s}$, ובדופן $0.20\,\text{m}$.'

  # ------------------------------------------------------------ 3: the plumb line and a falling stone in Jerusalem
  - id: Q-7-bagrut-3
    type: bagrut
    title: אנך ואבן נופלת במגדל בירושלים
    prompt: >-
      במגדל בגובה $h = 200\,\text{m}$ בירושלים, בקו רוחב $\lambda = 31.8^\circ$ צפון, תולים מראש המגדל משקולת על חוט עד
      הקרקע, ומסמנים את הנקודה שמתחתיה. אחר כך מורידים את המשקולת, ומשחררים אבן ממנוחה מאותה נקודה בראש המגדל. הזניחו את
      התנגדות האוויר. קחו $g = 9.8\,\text{m/s}^2$ כתאוצת הכובד בלי הסיבוב, $\omega = 7.29\cdot10^{-5}\,\text{rad/s}$ ו-$R = 6.37\cdot10^{6}\,\text{m}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-7.4-1]
        prompt: מה גודל התאוצה הצנטריפוגלית בירושלים, במערכת הייחוס של כדור הארץ?
        answer: 0.0288
        unit: m/s²
        correctFeedback: >-
          נכון. המרחק מציר כדור הארץ הוא $R\cos\lambda$, ולכן $\omega^2R\cos\lambda = \left(7.29\cdot10^{-5}\right)^2\cdot6.37\cdot10^{6}\cdot\cos31.8^\circ = 0.0288\,\text{m/s}^2$,
          הרחק מהציר.
        wrongFeedback: 'מה המרחק של ירושלים מציר הסיבוב של כדור הארץ? זה לא $R$.'
        commonWrong:
          - value: 0.0339
            feedback: 'זה $\omega^2R$, הערך בקו המשווה. בקו רוחב $\lambda$ המרחק מהציר קטן יותר, $R\cos\lambda$.'
          - value: 0.0245
            feedback: 'זה $\omega^2R\cos^2\lambda$, רק הרכיב של התאוצה לאורך הקו מהמרכז. השאלה שואלת על הגודל כולו.'
          - value: 0.0178
            feedback: 'השתמשתם ב-$\sin\lambda$. בקוטב, $\lambda = 90^\circ$, המרחק מהציר אפס, ולכן הגורם הוא $\cos\lambda$.'
        hints:
          - 'ציירו חתך של כדור הארץ דרך הקטבים, וסמנו את המרחק של ירושלים מהציר.'

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-7.4-1]
        prompt: >-
          בטאו באמצעות $\omega$, $R$, $g$ ו-$\lambda$ את הזווית $\alpha$ בין האנך לבין הקו אל מרכז כדור הארץ, ובדקו את
          התוצאה בקו המשווה ובקוטב. חשבו את $\alpha$ במעלות, ובכמה סנטימטרים, לאורך $200\,\text{m}$, האנך מתרחק מהקו אל
          המרכז.
        hints:
          - 'פרקו את התאוצה מחלק א לרכיב לאורך הקו מהמרכז ולרכיב ניצב לו.'
          - 'הרכיב הניצב של $\omega^2R\cos\lambda$ הוא $\omega^2R\cos\lambda\sin\lambda$.'
        solution:
          - { kind: law, text: 'במערכת כדור הארץ המשקולת במנוחה: המתיחות מאזנת את הכובד ואת הכוח הצנטריפוגלי, כוח מדומה, ולכן החוט פונה לאורך $\vec g_{\text{eff}} = \vec g - \vec\omega\times(\vec\omega\times\vec r)$, כאשר $\vec g$ פונה אל המרכז. כוח קוריוליס על המשקולת אפס, כי היא במנוחה במערכת הזו.' }
          - { kind: manipulation, text: 'התאוצה הצנטריפוגלית, $\omega^2R\cos\lambda$, פונה הרחק מהציר. ביחס לקו מהמרכז היא מתפרקת לרכיב לאורכו, החוצה, $\omega^2R\cos^2\lambda$, ולרכיב ניצב לו, לכיוון קו המשווה, $\omega^2R\sin\lambda\cos\lambda$. לכן $$\tan\alpha = \frac{\omega^2R\sin\lambda\cos\lambda}{g - \omega^2R\cos^2\lambda}$$ והמשקולת מוסטת מהקו אל המרכז לכיוון קו המשווה: דרומה בחצי הכדור הצפוני.' }
          - { kind: limit, text: 'בקו המשווה, $\lambda = 0$, $\sin\lambda = 0$; בקוטב, $\lambda = 90^\circ$, $\cos\lambda = 0$. בשניהם $\alpha = 0$: בקו המשווה הכוח הצנטריפוגלי לאורך הקו מהמרכז, ובקוטב הוא אפס. ביניהם $\sin\lambda\cos\lambda = \tfrac12\sin2\lambda$ מרבי ב-$45^\circ$. וכש-$\omega \to 0$ גם $\alpha \to 0$, והאנך מצביע אל המרכז.' }
          - { kind: units, text: '$\omega^2R$ ביחידות $\text{s}^{-2}\cdot\text{m} = \text{m/s}^2$, כמו $g$, ולכן $\tan\alpha$ חסר ממדים.' }
          - { kind: substitution, text: '$\omega^2R\sin\lambda\cos\lambda = 0.01516\,\text{m/s}^2$ ו-$\omega^2R\cos^2\lambda = 0.0245\,\text{m/s}^2$, ולכן $\tan\alpha = \dfrac{0.01516}{9.8 - 0.0245} = 1.55\cdot10^{-3}$ ו-$\alpha = 0.0889^\circ$ (המרבי, בקו רוחב $45^\circ$, הוא $0.0991^\circ$). לאורך $200\,\text{m}$: $200\cdot1.55\cdot10^{-3} = 0.310\,\text{m}$.' }
          - { kind: result, text: '$\tan\alpha = \dfrac{\omega^2R\sin\lambda\cos\lambda}{g - \omega^2R\cos^2\lambda}$. בירושלים $\alpha = 0.0889^\circ$, והאנך מגיע לקרקע כ-$31\,\text{cm}$ דרומה מהנקודה שהקו אל המרכז היה מגיע אליה.' }
        rubric:
          - text: 'כתבתי שבמערכת כדור הארץ החוט פונה לאורך $\vec g_{\text{eff}}$, הכובד ועוד הכוח הצנטריפוגלי.'
          - text: 'פירקתי את $\omega^2R\cos\lambda$ לרכיב לאורך הקו מהמרכז ולרכיב ניצב לו, וקיבלתי את $\tan\alpha$.'
          - text: 'בדקתי ש-$\alpha = 0$ בקו המשווה ובקוטב.'
          - text: 'חישבתי $\alpha \approx 0.089^\circ$, וכ-$31\,\text{cm}$ לאורך $200\,\text{m}$.'


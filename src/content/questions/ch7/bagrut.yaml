          - { kind: manipulation, text: 'בצירים מקומיים: $\vec\omega = \omega\cos\lambda\,\hat n + \omega\sin\lambda\,\hat u$. בתנודות קטנות $\vec v''$ כמעט אופקית. הרכיב $\omega\sin\lambda\,\hat u\times\vec v''$ אופקי וניצב ל-$\vec v''$. הרכיב $\omega\cos\lambda\,\hat n\times\vec v''$ מקביל ל-$\hat u$, כי מכפלה של שני וקטורים אופקיים אנכית, והוא רק משנה מעט את המתיחות הדרושה.' }
          - { kind: manipulation, text: 'לכן התנועה האופקית מקיימת את אותה משוואה כמו מטוטלת על פטיפון שמסתובב סביב האנך בקצב $\Omega = \omega\sin\lambda$: כוח קוריוליס אופקי $\vec F_{\text{cor}} = -2m\Omega\hat u\times\vec v''$. מחלקים א ו-ג, מישור התנודה מסתובב ביחס לפטיפון בקצב $\Omega$ בכיוון ההפוך לסיבוב שלו, כלומר עם כיוון השעון בחצי הכדור הצפוני.' }
          - { kind: limit, text: 'בקוטב, $\lambda = 90^\circ$: $\Omega = \omega$, והקרקע היא ממש פטיפון שמסתובב מתחת למטוטלת, סיבוב שלם ביום כוכבי, $2\pi/\omega = 23.9\,\text{h}$. בקו המשווה, $\lambda = 0$: $\Omega = 0$, והמישור לא מסתובב. בחצי הכדור הדרומי $\sin\lambda < 0$, והמישור מסתובב נגד כיוון השעון.' }
          - { kind: units, text: '$\omega\sin\lambda$ ביחידות $\text{rad/s}$, כמו מהירות זוויתית, ו-$2\pi/(\omega\sin\lambda)$ בשניות.' }
          - { kind: substitution, text: '$\omega = 7.29\cdot10^{-5}\,\text{rad/s}$ הם $15.04^\circ$ לשעה, ולכן בפריז המישור מסתובב ב-$15.04\cdot\sin48.85^\circ = 11.3^\circ$ לשעה. $T = \dfrac{2\pi}{\omega\sin\lambda} = \dfrac{2\pi}{7.29\cdot10^{-5}\cdot\sin48.85^\circ} = 1.14\cdot10^{5}\,\text{s} = 31.8\,\text{h}$.' }
          - { kind: result, text: 'רק הרכיב האנכי של $\vec\omega$ מסובב את התנועה האופקית, ולכן המישור מסתובב בקצב $\omega\sin\lambda$, עם כיוון השעון בצפון, ומשלים סיבוב בזמן $T = 2\pi/(\omega\sin\lambda)$. בפריז $11.3^\circ$ לשעה, וסיבוב שלם לוקח כ-$31.8\,\text{h}$.' }
        rubric:
          - text: פירקתי את $\vec\omega$ לרכיב אנכי $\omega\sin\lambda$ ולרכיב אופקי $\omega\cos\lambda$ צפונה.
          - text: הראיתי שעל מהירות אופקית רק הרכיב האנכי נותן כוח קוריוליס אופקי, והרכיב האופקי נותן כוח אנכי.
          - text: השוויתי למטוטלת על פטיפון בקצב $\Omega = \omega\sin\lambda$, וקבעתי את כיוון הסיבוב.
          - text: בדקתי את הקוטב (יום כוכבי), את קו המשווה (אין סיבוב) ואת חצי הכדור הדרומי (הכיוון מתהפך).
          - text: חישבתי בפריז כ-$11.3^\circ$ לשעה, וסיבוב שלם בכ-$32\,\text{h}$.

  # ------------------------------------------------------------ 5: a tower up to the geostationary radius
  - id: Q-7-bagrut-5
    type: bagrut
    title: גוף שמשוחרר ממגדל גבוה מאוד על קו המשווה
    prompt: >-
      ניסוי מחשבתי: מגדל דק וגבוה מאוד עומד על קו המשווה, לאורך הקו ממרכז כדור הארץ, ומסתובב עם כדור הארץ במהירות
      הזוויתית $\omega$. על המגדל, במרחק $r$ ממרכז כדור הארץ, מחזיקים גוף קטן בעל מסה $m$ ומשחררים אותו ממנוחה ביחס
      למגדל. $GM_E$ הוא קבוע הכבידה כפול מסת כדור הארץ. הזניחו את האוויר, את הכבידה של המגדל ואת התנועה של כדור הארץ
      סביב השמש: המערכת האינרציאלית היא זו שבה מרכז כדור הארץ במנוחה והצירים לא מסתובבים, ו״מערכת כדור הארץ״
      מסתובבת עם כדור הארץ ועם המגדל.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-7.3-1, OBJ-6.1-1]
        prompt: >-
          במערכת כדור הארץ, באיזה מרחק $r_g$ ממרכז כדור הארץ הכוח הצנטריפוגלי על גוף שנח ביחס למגדל מאזן בדיוק את
          הכבידה, כך שגוף ששוחרר שם נשאר במקומו? קחו $GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$ ו-$\omega = 7.29\cdot10^{-5}\,\text{rad/s}$.
        answer: 4.22e7
        unit: m
        correctFeedback: >-
          נכון. במערכת כדור הארץ הגוף במנוחה, ולכן כוח קוריוליס עליו אפס, והכוח הצנטריפוגלי, כוח מדומה, $m\omega^2r$
          החוצה, מאזן את הכבידה $GM_Em/r^2$: $r_g = \left(\dfrac{GM_E}{\omega^2}\right)^{1/3} = 4.22\cdot10^{7}\,\text{m}$, כ-$6.6\,R_E$.
          זה רדיוס המסלול הגאוסטציונרי: במערכת האינרציאלית הגוף פשוט מקיף את כדור הארץ במסלול מעגלי, בזמן מחזור של סיבוב
          אחד של כדור הארץ.
        wrongFeedback: 'השוו את הכוח הצנטריפוגלי, $m\omega^2r$, לכבידה, $GM_Em/r^2$, ובודדו את $r$.'
        commonWrong:
          - value: 5.31e7
            feedback: 'זה $(2GM_E/\omega^2)^{1/3}$: השוויתם את $\omega r$ למהירות המילוט. בחלק ד תראו שזה המרחק שממנו גוף ששוחרר בורח. כאן מבקשים איזון כוחות, $\omega^2r = GM_E/r^2$.'
          - value: 2.74e11
            feedback: 'זה $\sqrt{GM_E/\omega^2}$. הכבידה הולכת כמו $1/r^2$ והכוח הצנטריפוגלי כמו $r$, ולכן $r^3 = GM_E/\omega^2$: שורש שלישי.'
          - value: 3.58e7
            feedback: 'זה הגובה מעל פני הקרקע, $r_g - R_E$. השאלה שואלת על המרחק ממרכז כדור הארץ, שבו תלויה הכבידה.'
        hints:
          - '$\omega^2r = GM_E/r^2$.'

      - label: ב
        type: open
        points: 6
        level: mid
        objectives: [OBJ-7.3-1, OBJ-7.3-2, OBJ-3.3-2]
        prompt: >-
          במערכת כדור הארץ, לאורך המגדל, הכבידה והכוח הצנטריפוגלי הם שניהם כוחות שתלויים רק ב-$r$ ופונים לאורך הקו מהמרכז.

          (1) כתבו את האנרגיה הפוטנציאלית ליחידת מסה של שניהם יחד, $u(r)$, והראו ש-$r_g$ היא נקודת מקסימום שלה.

          (2) גוף משוחרר ממנוחה ביחס למגדל במרחק $r < r_g$, ובפעם אחרת במרחק $r > r_g$. לאן הוא מתחיל לנוע, במערכת כדור
          הארץ, בכל אחד מהמקרים? למה כוח קוריוליס לא משפיע על הכיוון הזה ברגע השחרור?
        hints:
          - 'הכוח הצנטריפוגלי ליחידת מסה, $\omega^2r$, הוא מינוס הנגזרת של איזו פונקציה של $r$?'
        solution:
          - { kind: law, text: 'במערכת כדור הארץ, שמסתובבת ב-$\omega$ הקבועה, פועלים על הגוף הכבידה $\vec F_g = -\dfrac{GM_Em}{r^2}\hat r$, הכוח הצנטריפוגלי $\vec F_{\text{cf}} = m\omega^2r\,\hat r$ וכוח קוריוליס $\vec F_{\text{cor}} = -2m\vec\omega\times\vec v''$; שני האחרונים כוחות מדומים. לכוח רדיאלי $F_r(r)$ שתלוי רק ב-$r$ יש אנרגיה פוטנציאלית, $F_r = -\dfrac{dU}{dr}$.' }
          - { kind: manipulation, text: 'ליחידת מסה: $$u(r) = -\frac{GM_E}{r} - \frac12\omega^2r^2$$ ואכן $F_r/m = -\dfrac{du}{dr} = -\dfrac{GM_E}{r^2} + \omega^2r$, הכבידה ועוד הכוח הצנטריפוגלי. הנגזרת מתאפסת כש-$r^3 = GM_E/\omega^2$, כלומר ב-$r_g$, ו-$\dfrac{d^2u}{dr^2} = -\dfrac{2GM_E}{r^3} - \omega^2 < 0$: מקסימום, שיווי משקל לא יציב.' }
          - { kind: manipulation, text: 'מתחת ל-$r_g$ הכוח השקול ליחידת מסה, $F_r/m = -du/dr$, פונה פנימה: הגוף מתחיל ליפול אל כדור הארץ. מעל $r_g$ הוא פונה החוצה: הגוף מתחיל להתרחק. ברגע השחרור הגוף במנוחה במערכת כדור הארץ, $\vec v'' = 0$, ולכן כוח קוריוליס אפס; הוא מופיע רק כשהגוף כבר נע, ומסיט אותו הצידה.' }
          - { kind: limit, text: 'כש-$\omega \to 0$: $u = -GM_E/r$ ו-$r_g \to \infty$: כל גוף ששוחרר נופל, כמו על כדור הארץ שלא מסתובב. ליד פני הקרקע, $r = R_E$, הכוח הצנטריפוגלי קטן מהכבידה פי $(r_g/R_E)^3 \approx 290$, ולכן גוף ששוחרר ממגדל רגיל נופל.' }
          - { kind: units, text: '$GM_E/r$ ו-$\omega^2r^2$ ביחידות $\text{m}^2/\text{s}^2 = \text{J/kg}$.' }
          - { kind: result, text: '$u(r) = -\dfrac{GM_E}{r} - \tfrac12\omega^2r^2$, מרבית ב-$r_g$. גוף ששוחרר מתחת ל-$r_g$ מתחיל ליפול פנימה, ומעליו מתחיל לנוע החוצה; ברגע השחרור כוח קוריוליס אפס.' }
        rubric:
          - text: 'כתבתי $u(r) = -GM_E/r - \tfrac12\omega^2r^2$, ובדקתי ש-$F_r/m = -du/dr$ הוא הכבידה ועוד הכוח הצנטריפוגלי.'
          - text: 'הראיתי ש-$u$ מרבית ב-$r_g$: שיווי משקל לא יציב.'
          - text: 'נימקתי שכוח קוריוליס אפס ברגע השחרור, כי הגוף במנוחה במערכת כדור הארץ.'
          - text: 'בדקתי שכש-$\omega \to 0$ כל גוף ששוחרר נופל.'

      - label: ג
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-7.3-2, OBJ-6.3-2, OBJ-6.4-2]
        prompt: >-
          פתרו עכשיו **במערכת האינרציאלית** את התנועה של גוף ששוחרר במרחק $r < r_g$. סמנו $x = r/r_g$.

          (1) הראו שנקודת השחרור היא נקודת הריחוק של מסלול אליפטי, ושהאקסצנטריות שלו היא $e = 1 - x^3$.

          (2) בטאו באמצעות $r$ ו-$x$ את המרחק הקטן ביותר של הגוף ממרכז כדור הארץ, $r_p$.
        hints:
          - 'מה מהירות הגוף ברגע השחרור במערכת האינרציאלית, ומה הכיוון שלה ביחס לרדיוס?'
          - 'השתמשו ב-$GM_E = \omega^2r_g^3$ מחלק א.'
        solution:
          - { kind: law, text: 'במערכת האינרציאלית פועלת על הגוף רק הכבידה, כוח מרכזי, ולכן נשמרים התנע הזוויתי $h$ והאנרגיה $\varepsilon$ ליחידת מסה. המסלול חתך חרוט עם $p = h^2/GM_E$, נקודת ריחוק $r_a = p/(1 - e)$ ונקודת קרבה $r_p = p/(1 + e)$. ברגע השחרור הגוף נע עם המגדל: מהירותו $\omega r$, ניצבת לרדיוס.' }
          - { kind: manipulation, text: 'מהירות ניצבת לרדיוס פירושה $\dot r = 0$: נקודת מפנה. המהירות המעגלית ב-$r$ היא $\sqrt{GM_E/r}$, והיחס $\dfrac{\omega r}{\sqrt{GM_E/r}} = \sqrt{\dfrac{\omega^2r^3}{GM_E}} = x^{3/2} < 1$: הגוף איטי מהמהירות המעגלית, ולכן זו נקודת הריחוק. $h = \omega r^2$, ועם $GM_E = \omega^2r_g^3$: $p = \dfrac{\omega^2r^4}{GM_E} = r\,x^3$. מ-$r = p/(1 - e)$: $1 - e = x^3$, כלומר $e = 1 - x^3$.' }
          - { kind: manipulation, text: '$$r_p = \frac{p}{1 + e} = \frac{r\,x^3}{2 - x^3}$$' }
          - { kind: limit, text: 'כש-$r \to r_g$, $x \to 1$: $e \to 0$ ו-$r_p \to r_g$, מסלול מעגלי, והגוף נשאר ליד המגדל, כמו בחלק א. כש-$r \ll r_g$: $e \to 1$ ו-$r_p \to 0$, אליפסה צרה מאוד, כמעט נפילה רדיאלית: גוף ששוחרר ממגדל רגיל נופל כמעט ישר למטה. ב-$x = \tfrac12$, למשל, $r_p = r/15$, קטן מ-$R_E$: הגוף פוגע בקרקע.' }
          - { kind: units, text: '$\dfrac{\omega^2r^3}{GM_E}$ ביחידות $\dfrac{\text{s}^{-2}\cdot\text{m}^3}{\text{m}^3/\text{s}^2}$, חסר ממדים, וכך גם $x$ ו-$e$; $r_p$ במטרים כמו $r$.' }
          - { kind: result, text: 'הגוף נע באליפסה שנקודת הריחוק שלה היא נקודת השחרור, עם $e = 1 - (r/r_g)^3$ ו-$r_p = \dfrac{r\,x^3}{2 - x^3}$.' }
        rubric:
          - text: 'קבעתי שבמערכת האינרציאלית מהירות השחרור היא $\omega r$, ניצבת לרדיוס, ולכן זו נקודת מפנה.'
          - text: 'השוויתי למהירות המעגלית והסקתי שזו נקודת הריחוק.'
          - text: 'מצאתי $p = r\,x^3$, $e = 1 - x^3$ ו-$r_p = r\,x^3/(2 - x^3)$.'
          - text: 'בדקתי ש-$x \to 1$ נותן מעגל, ו-$x \to 0$ נפילה כמעט רדיאלית.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-6.6-1, OBJ-7.3-2, OBJ-6.4-2]
        prompt: >-
          עכשיו הגוף משוחרר מעל $r_g$, כלומר $x > 1$.

          (1) הראו שעכשיו נקודת השחרור היא נקודת הקרבה, ומצאו את האקסצנטריות באמצעות $x$.

          (2) בטאו באמצעות $r_g$ את המרחק $r_e$ שממנו והלאה גוף ששוחרר בורח מכדור הארץ ולא חוזר, ואמרו מה צורת המסלול
          כשמשחררים בדיוק ב-$r_e$.

          (3) תארו במערכת כדור הארץ, בעזרת כוח קוריוליס, לאן הגוף מוסט ביחס למגדל בזמן שהוא מתרחק החוצה, והסבירו את אותה
          תוצאה במערכת האינרציאלית.
        hints:
          - 'גוף בורח כשהאנרגיה ליחידת מסה $\varepsilon = \tfrac12v^2 - GM_E/r$ לא שלילית.'
          - 'במערכת כדור הארץ $\vec v'' = v''\hat r$ כשהגוף מתרחק. חשבו $\hat z\times\hat r$.'
        solution:
          - { kind: law, text: 'במערכת האינרציאלית, כמו בחלק ג: מהירות השחרור $\omega r$ ניצבת לרדיוס, $p = r\,x^3$, והגוף בורח כש-$\varepsilon \ge 0$. במערכת כדור הארץ כוח קוריוליס, כוח מדומה, הוא $\vec F_{\text{cor}} = -2m\vec\omega\times\vec v''$.' }
          - { kind: manipulation, text: 'עכשיו $\dfrac{\omega r}{\sqrt{GM_E/r}} = x^{3/2} > 1$: הגוף מהיר מהמהירות המעגלית, ולכן נקודת השחרור היא נקודת הקרבה. מ-$r = p/(1 + e)$: $1 + e = x^3$, כלומר $e = x^3 - 1$.' }
          - { kind: manipulation, text: 'האנרגיה ליחידת מסה: $\varepsilon = \tfrac12\omega^2r^2 - \dfrac{GM_E}{r}$. היא לא שלילית כש-$\omega^2r^3 \ge 2GM_E = 2\omega^2r_g^3$, כלומר מ-$$r_e = 2^{1/3}\,r_g$$ שם $x^3 = 2$ ו-$e = 1$: פרבולה. מעל $r_e$ המסלול היפרבולה, ובין $r_g$ ל-$r_e$ אליפסה שנקודת הקרבה שלה היא נקודת השחרור.' }
          - { kind: manipulation, text: 'במערכת כדור הארץ, כשהגוף מתרחק, $\vec v'' = v''\hat r$ ו-$\vec F_{\text{cor}} = -2m\omega v''\,(\hat z\times\hat r) = -2m\omega v''\,\hat\varphi$: הפוך לכיוון הסיבוב, מערבה. הגוף מפגר אחרי המגדל. במערכת האינרציאלית זה שימור התנע הזוויתי: $h = \omega r^2$ קבוע, ולכן כש-$r$ גדל, המהירות הזוויתית של הגוף, $h/r^2$, קטנה מ-$\omega$ של המגדל.' }
          - { kind: limit, text: 'כש-$x \to 1$ מלמעלה: $e \to 0$, המסלול המעגלי של $r_g$, כמו בחלק ג מלמטה. ב-$x^3 = 2$: $e = x^3 - 1 = 1$, אותה פרבולה משני החישובים. כש-$\omega \to 0$: $r_g$ ו-$r_e$ שואפים לאינסוף, ושום גוף ששוחרר לא בורח.' }
          - { kind: units, text: '$r_e/r_g = 2^{1/3}$ חסר ממדים, ו-$\varepsilon$ ביחידות $\text{m}^2/\text{s}^2 = \text{J/kg}$.' }
          - { kind: result, text: 'מעל $r_g$ נקודת השחרור היא נקודת הקרבה, עם $e = (r/r_g)^3 - 1$. מ-$r_e = 2^{1/3}r_g \approx 1.26\,r_g$ והלאה הגוף בורח, וב-$r_e$ עצמו בפרבולה. במערכת כדור הארץ כוח קוריוליס מסיט אותו מערבה, והוא מפגר אחרי המגדל.' }
        rubric:
          - text: 'קבעתי שמעל $r_g$ הגוף מהיר מהמהירות המעגלית, ולכן נקודת השחרור היא נקודת הקרבה, ומצאתי $e = x^3 - 1$.'
          - text: 'דרשתי $\varepsilon \ge 0$ וקיבלתי $r_e = 2^{1/3}r_g$, עם $e = 1$ שם.'
          - text: 'קבעתי בעזרת כוח קוריוליס במערכת כדור הארץ שהגוף מוסט מערבה, וקישרתי את זה לשימור התנע הזוויתי במערכת האינרציאלית.'
          - text: 'בדקתי ש-$x \to 1$ נותן מעגל, ושכש-$\omega \to 0$ שום גוף לא בורח.'

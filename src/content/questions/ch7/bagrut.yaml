#   3 Jerusalem, λ = 31.8°: ω²R cos λ = 0.0288 m/s² (equator 0.0339, cos² 0.0245, sin 0.0178);
#     α = 0.0889° (½ dropped 0.177°, 45° 0.0991°, rad 0.00155); 200 m drop: t = 6.39 s, d = 5.28 cm
#     (no cos 6.21, no ⅓ 15.8, sin 3.27, ½ 7.92); plumb tilt over 200 m: 200·α = 30.9 cm south;
#   4 turntable Ω = 0.10 rad/s: 2π/Ω = 62.8 s; bob 2.0 kg at 0.50 m/s: 2mΩv' = 0.20 N; Paris λ = 48.85°:

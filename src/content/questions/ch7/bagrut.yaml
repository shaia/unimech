chapter: 7
questions:
  # ------------------------------------------------------------ 1: a rotating space station
  - id: Q-7-bagrut-1
    type: bagrut
    title: כובד מלאכותי בתחנת חלל מסתובבת
    prompt: >-
      תחנת חלל היא טבעת ברדיוס $R = 100\,\text{m}$, רחוק מכל כוכב, ומסתובבת סביב הציר שלה במהירות זוויתית קבועה
      $\omega$. האסטרונאוטים עומדים על הדופן החיצונית של הטבעת, שהיא ה״רצפה״ שלהם, והראש שלהם פונה אל הציר. מהירות
      הסיבוב נבחרה כך שעל הרצפה התאוצה הצנטריפוגלית שווה ל-$g = 9.8\,\text{m/s}^2$. אסטרונאוטית מחזיקה כדור בגובה
      $h = 1.5\,\text{m}$ מעל הרצפה, כלומר במרחק $R - h$ מהציר, ומשחררת אותו ממנוחה ביחס לתחנה. בתחנה אין אוויר שמשפיע
      על הכדור.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-7.3-1]
        prompt: מה המהירות הזוויתית $\omega$ של התחנה?
        answer: 0.313
        unit: rad/s
        correctFeedback: >-
          נכון. $\omega^2R = g$, ולכן $\omega = \sqrt{\dfrac{g}{R}} = \sqrt{\dfrac{9.8}{100}} = 0.313\,\text{rad/s}$: סיבוב שלם בכל
          $2\pi/\omega = 20.1\,\text{s}$.
        wrongFeedback: 'השוו את התאוצה הצנטריפוגלית על הרצפה, $\omega^2R$, ל-$g$, ובודדו את $\omega$.'
        commonWrong:
          - value: 0.098
            feedback: 'זה $g/R = \omega^2$. הוציאו שורש.'
          - value: 0.0498
            feedback: 'זו התדירות בסיבובים לשנייה, $\omega/(2\pi)$. ביחידות $\text{rad/s}$ לא מחלקים ב-$2\pi$.'
        hints:
          - 'על הרצפה $\omega^2R = g$.'

      - label: ב
        type: mc
        points: 4
        level: mid
        objectives: [OBJ-7.3-1]
        prompt: >-
          במערכת התחנה הכדור ״נופל״ אל הרצפה, כלומר נע הרחק מהציר. לאן פונה כוח קוריוליס עליו בזמן הנפילה?
        choices:
          - text: הפוך לכיוון הסיבוב של התחנה, ולכן הכדור נוחת מאחורי הנקודה שמתחתיו.
            correct: true
            feedback: >-
              נכון. אם התחנה מסתובבת נגד כיוון השעון, $\vec\omega = \omega\hat z$, ו-$\vec v'$ פונה החוצה, $\hat r$, אז
              $\vec\omega\times\hat r = \hat\varphi$, כיוון הסיבוב, ו-$\vec F_{\text{cor}} = -2m\vec\omega\times\vec v'$ פונה הפוך לו.
          - text: בכיוון הסיבוב של התחנה, ולכן הכדור נוחת לפני הנקודה שמתחתיו.
            feedback: 'זה הכיוון של $\vec\omega\times\vec v''$. כוח קוריוליס הוא מינוס $2m$ כפול הווקטור הזה.'
          - text: אל הרצפה, ולכן הכדור נופל מהר יותר.
            feedback: 'כוח קוריוליס ניצב למהירות, ולכן אינו מאיץ את הכדור לאורך המהירות: הוא רק מסיט אותו הצידה.'
          - text: אין כוח כזה, כי הכדור שוחרר ממנוחה ביחס לתחנה.
            feedback: >-
              ברגע השחרור הוא אכן אפס, אבל מיד אחר כך הכדור נע ביחס לתחנה, וכוח קוריוליס גדל עם המהירות שלו.
            misconception: MC-7-coriolis-on-resting-body
        hints:
          - 'בחרו $\vec\omega = \omega\hat z$ ו-$\vec v'' = v''\hat r$, וחשבו $\hat z\times\hat r$.'

      - label: ג
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-7.3-2]
        prompt: >-
          פתרו את הנפילה במערכת **אינרציאלית**.

          (1) כמה זמן עובר עד שהכדור פוגע ברצפה? השוו לזמן נפילה מאותו גובה על כדור הארץ.

          (2) הראו שהכדור נוחת במרחק $d = R(\tan\varphi - \varphi)$ מאחורי הרגליים של האסטרונאוטית, לאורך הרצפה, כאשר
          $\cos\varphi = \dfrac{R - h}{R}$, וחשבו את $d$.
        hints:
          - 'במערכת אינרציאלית אין שום כוח על הכדור אחרי השחרור. מה המהירות שלו ברגע השחרור?'
          - 'הכדור נע בקו ישר, משיק למעגל ברדיוס $R - h$, עד שהוא פוגש את המעגל ברדיוס $R$.'
        solution:
          - { kind: law, text: 'במערכת אינרציאלית אין כובד בתחנה ואין כוח על הכדור אחרי השחרור. לפי החוק הראשון הוא נע בקו ישר, במהירות שהייתה לו ברגע השחרור.' }
          - { kind: manipulation, text: 'ברגע השחרור הכדור נע עם התחנה, במרחק $R - h$ מהציר: מהירותו $v = \omega(R - h)$, משיקה. הקו הישר פוגש את הרצפה בנקודה שהרדיוס אליה יוצר זווית $\varphi$ עם רדיוס השחרור, $\cos\varphi = \dfrac{R - h}{R}$, אחרי דרך $s = R\sin\varphi$. לכן $t = \dfrac{s}{v} = \dfrac{R\sin\varphi}{\omega R\cos\varphi} = \dfrac{\tan\varphi}{\omega}$.' }
          - { kind: manipulation, text: 'באותו זמן הרגליים של האסטרונאוטית, על הרצפה ועל רדיוס השחרור, מסתובבות בזווית $\omega t = \tan\varphi$, גדולה מ-$\varphi$. הכדור נוחת בזווית $\varphi$, ולכן מאחורי הרגליים, במרחק $d = R(\tan\varphi - \varphi)$ לאורך הרצפה.' }
          - { kind: limit, text: 'כש-$h \ll R$: $\varphi \approx \sqrt{2h/R}$ ו-$\tan\varphi - \varphi \approx \varphi^3/3$. אז $t \approx \dfrac{\varphi}{\omega} = \sqrt{\dfrac{2h}{R}}\sqrt{\dfrac{R}{g}} = \sqrt{\dfrac{2h}{g}}$, זמן הנפילה על כדור הארץ, ו-$d \approx \dfrac{R}{3}\left(\dfrac{2h}{R}\right)^{3/2} = \dfrac{(2h)^{3/2}}{3\sqrt R}$, שמתאפס כש-$R \to \infty$: תחנה ענקית מתנהגת כמו רצפה שטוחה בכובד אחיד.' }
          - { kind: units, text: '$\tan\varphi - \varphi$ חסר ממדים, ולכן $d$ במטרים כמו $R$. $\tan\varphi/\omega$ בשניות.' }
          - { kind: substitution, text: '$\cos\varphi = \dfrac{98.5}{100} = 0.985$, $\varphi = 0.17342\,\text{rad}$, $\tan\varphi = 0.17518$. $t = \dfrac{0.17518}{0.313} = 0.560\,\text{s}$, לעומת $\sqrt{2h/g} = 0.553\,\text{s}$ על כדור הארץ. $d = 100\cdot(0.17518 - 0.17342) = 0.176\,\text{m}$.' }
          - { kind: result, text: 'הכדור פוגע ברצפה אחרי $0.560\,\text{s}$, כמעט כמו על כדור הארץ, ונוחת כ-$17.6\,\text{cm}$ מאחורי הרגליים, בכיוון הפוך לסיבוב.' }
        rubric:
          - text: כתבתי שבמערכת האינרציאלית אין כוח על הכדור, ושהוא נע בקו ישר במהירות המשיקית $\omega(R - h)$.
          - text: מצאתי את הזמן מהגאומטריה, $t = \tan\varphi/\omega$, והשוויתי לזמן הנפילה על כדור הארץ.
          - text: השוויתי את הזווית שהרגליים מסתובבות, $\omega t$, לזווית $\varphi$ שבה הכדור נוחת, וקיבלתי את $d$.
          - text: בדקתי שכש-$h \ll R$ הזמן חוזר ל-$\sqrt{2h/g}$.
          - text: קיבלתי $d$ של כ-$18\,\text{cm}$, מאחורי הרגליים.

      - label: ד
        type: numeric
        points: 5
        level: bagrut
        standalone: false
        objectives: [OBJ-7.3-2]
        prompt: >-
          מבדיקת הגבולות בחלק ג, כש-$h \ll R$: $d \approx \dfrac{(2h)^{3/2}}{3\sqrt R}$, כשהתאוצה על הרצפה נשארת $g$. מה
          הרדיוס הקטן ביותר של תחנה שבה כדור שמשוחרר מגובה $1.5\,\text{m}$ נוחת לכל היותר $1.0\,\text{cm}$ מאחורי הרגליים?
        answer: 30000
        unit: m
        correctFeedback: >-
          נכון. $\sqrt R = \dfrac{(2h)^{3/2}}{3d}$, ולכן $R = \dfrac{(2h)^3}{9d^2} = \dfrac{3.0^3}{9\cdot0.010^2} = 3.0\cdot10^{4}\,\text{m}$,
          טבעת ברדיוס $30\,\text{km}$. שימו לב ש-$g$ נעלם: ההסטה תלויה רק בגובה וברדיוס. חישוב מדויק במודל של חלק ג נותן
          ברדיוס הזה $1.00\,\text{cm}$.
        wrongFeedback: 'בודדו את $\sqrt R$ מהביטוי ל-$d$, ואז העלו בריבוע.'
        commonWrong:
          - value: 173
            feedback: 'זה $\sqrt R$, ב-$\text{m}^{1/2}$. העלו בריבוע.'
          - value: 67500
            feedback: 'השתמשתם ב-$\tfrac12$ במקום ב-$\tfrac13$. בדקו את הקירוב $\tan\varphi - \varphi \approx \varphi^3/3$.'
          - value: 270000
            feedback: 'שכחתם את ה-3 שבמכנה של $d$: הוא נכנס בריבוע, $R = (2h)^3/(9d^2)$.'
        hints:
          - 'הציבו $2h = 3.0\,\text{m}$ ו-$d = 0.010\,\text{m}$.'

      - label: ה
        type: mc
        points: 4
        level: bagrut
        objectives: [OBJ-7.1-2, OBJ-7.3-2]
        prompt: >-
          לפי עקרון השקילות, אי אפשר להבחין בניסוי מקומי בין כובד אחיד לבין תאוצה. האם אסטרונאוטית בתחנה ברדיוס $100\,\text{m}$,
          בתא סגור, יכולה לגלות שהיא לא על כדור הארץ?
        choices:
          - text: >-
              כן. עקרון השקילות מדבר על תאוצה קווית אחידה, ובמערכת מסתובבת יש כוח קוריוליס, שתלוי במהירות, ו-$g_{\text{eff}}$
              משתנה עם המרחק מהציר.
            correct: true
            feedback: >-
              נכון. כדור שנופל נוחת $17.6\,\text{cm}$ מאחורי הרגליים, ובגובה הראש, $1.8\,\text{m}$ מעל הרצפה,
              $g_{\text{eff}} = \omega^2(R - 1.8\,\text{m}) = 9.62\,\text{m/s}^2$, קטן בכ-2% מזה שעל הרצפה. שתי ההשפעות
              מתאפסות כש-$R \to \infty$.
          - text: לא. מאזניים על הרצפה מראים בדיוק את המשקל שעל כדור הארץ, ולכן לפי עקרון השקילות שום ניסוי לא יבחין.
            feedback: >-
              המאזניים מראים אותו ערך, אבל זה לא ניסוי היחיד. עקרון השקילות לא חל על מערכת מסתובבת: כוח קוריוליס תלוי
              במהירות, ושום שדה כובד אחיד לא מחקה אותו.
          - text: כן, כי בתחנה כדור כבד נופל מהר יותר מכדור קל.
            feedback: >-
              הכוחות המדומים פרופורציוניים למסה, כמו הכובד, ולכן גם בתחנה כל הכדורים נופלים יחד. ההבדל הוא בכיוון ובשינוי
              עם הגובה, לא בתלות במסה.
            misconception: MC-7-equivalence-detectable
          - text: רק אם יש בתא חלון, כי כל ניסוי מכני בתוך התא נותן תוצאה זהה לזו שעל כדור הארץ.
            feedback: >-
              בחלק ג חישבתם ניסוי מכני פשוט שנותן תוצאה אחרת: הכדור לא נוחת מתחת לנקודת השחרור.
        hints:
          - 'אילו כוחות מדומים קיימים במערכת מסתובבת ולא קיימים במערכת בתאוצה קווית?'

  # ------------------------------------------------------------ 2: a water tank, accelerated and then spun
  - id: Q-7-bagrut-2
    type: bagrut
    title: פני המים במערכת מואצת ובמערכת מסתובבת
    prompt: >-
      מכל גלילי פתוח, ברדיוס $R = 0.30\,\text{m}$, מלא מים לגובה $h_0 = 0.10\,\text{m}$. בשלב הראשון המכל עומד על משאית
      שמאיצה על כביש אופקי בתאוצה קבועה $A = 2.0\,\text{m/s}^2$, ומחכים שהמים יירגעו ביחס למשאית. בתא הנהג של המשאית קשור
      לרצפה בלון הליום. בשלב השני מעמידים את המכל, שוב עם מים בגובה $h_0$, במרכז של פטיפון, ומסובבים אותו סביב הציר שלו
      במהירות זוויתית קבועה $\omega$, עד שהמים מסתובבים איתו כגוף אחד. הזניחו מתח פנים.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-7.1-1]
        prompt: בשלב הראשון, מה הזווית בין פני המים לאופק, במעלות?
        answer: 11.5
        unit: °
        correctFeedback: >-
          נכון. במערכת המשאית המים במנוחה, ופני המים ניצבים ל-$\vec g_{\text{eff}} = \vec g - \vec A$. הזווית של
          $\vec g_{\text{eff}}$ עם האנך היא גם הזווית של פני המים עם האופק: $\tan\theta = \dfrac{A}{g} = \dfrac{2.0}{9.8}$,
          ו-$\theta = 11.5^\circ$.
        wrongFeedback: 'פני נוזל במנוחה ניצבים לתאוצת הנפילה האפקטיבית. מה הזווית שלה עם האנך?'
        commonWrong:
          - value: 78.5
            feedback: 'זו הזווית של $\vec g_{\text{eff}}$ עם האופק. פני המים ניצבים לה, ולכן נוטים מהאופק ב-$\arctan(A/g)$.'
        hints:
          - 'במערכת המשאית, $\vec g_{\text{eff}}$ הוא $g$ כלפי מטה ו-$A$ אחורה.'

      - label: ב
        type: mc
        points: 5
        level: mid
        objectives: [OBJ-7.1-2]
        prompt: בשלב הראשון, היכן פני המים במכל גבוהים יותר, ולאן נוטה בלון ההליום בתא הנהג?
        choices:
          - text: המים גבוהים יותר בצד האחורי, והבלון נוטה קדימה.
            correct: true
            feedback: >-
              נכון. $\vec g_{\text{eff}}$ פונה מטה ואחורה, ולכן המים ״שוקעים״ לאחור. גם האוויר בתא נדחס לאחור, והעילוי על
              הבלון, הפוך ל-$\vec g_{\text{eff}}$, דוחף אותו מעלה וקדימה. אותו פיזיקה, בשני נוזלים.
          - text: המים גבוהים יותר בצד האחורי, והבלון נוטה אחורה.
            feedback: >-
              המים נכון. הבלון קל מהאוויר שהוא דוחק, ולכן הוא ״צף״ נגד $\vec g_{\text{eff}}$, כמו שהוא עולה נגד הכובד.
            misconception: MC-7-balloon-moves-back
          - text: המים גבוהים יותר בצד הקדמי, והבלון נוטה קדימה.
            feedback: >-
              הכוח המדומה על המים פונה אחורה, ולכן הם נערמים מאחור, כמו קפה שנשפך לאחור כשהמכונית מאיצה.
            misconception: MC-7-fictitious-along-acceleration
          - text: המים גבוהים יותר בצד הקדמי, והבלון נוטה אחורה.
            feedback: >-
              הפכתם את שני הכיוונים. הכוח המדומה פונה אחורה: המים נערמים מאחור, והבלון, שקל מהאוויר, נע הפוך, קדימה.
            misconception: MC-7-fictitious-along-acceleration
        hints:
          - 'לאן פונה $\vec g_{\text{eff}}$? המים ״נופלים״ בכיוונה, והבלון ״עולה״ נגדה.'

      - label: ג
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-7.3-2]
        prompt: >-
          בשלב השני, הראו שבמערכת שמסתובבת עם המים פני המים הם פרבולואיד:
          $$z(r) = z_0 + \frac{\omega^2r^2}{2g}$$
          כאשר $z_0$ גובה פני המים על הציר ו-$r$ המרחק מהציר. בדקו את התוצאה בגבולות ובדקו את היחידות, והשוו לשלב הראשון.
        hints:
          - 'במערכת המסתובבת המים במנוחה. מה $\vec g_{\text{eff}}$ במרחק $r$ מהציר?'
          - 'השיפוע של פני המים, $dz/dr$, שווה ליחס בין הרכיב האופקי לרכיב האנכי של $\vec g_{\text{eff}}$.'
        solution:
          - { kind: law, text: 'במערכת המסתובבת המים במנוחה, ולכן כוח קוריוליס עליהם אפס, ועל כל חלק פועלים רק הכובד והכוח הצנטריפוגלי: $\vec g_{\text{eff}} = \vec g + \omega^2r\,\hat r$. פני נוזל במנוחה ניצבים בכל נקודה ל-$\vec g_{\text{eff}}$, כמו בשלב הראשון.' }
          - { kind: manipulation, text: 'בחתך אנכי דרך הציר, משיק לפני המים בנקודה $r$ ניצב ל-$\vec g_{\text{eff}}$. לכן השיפוע הוא היחס בין הרכיב האופקי לאנכי: $\dfrac{dz}{dr} = \dfrac{\omega^2r}{g}$.' }
          - { kind: manipulation, text: 'באינטגרציה מ-0 עד $r$: $z(r) - z_0 = \displaystyle\int_0^r\frac{\omega^2r''}{g}\,dr'' = \frac{\omega^2r^2}{2g}$. זה פרבולואיד. אותה תוצאה מתקבלת מהדרישה שפני המים יהיו משטח של אנרגיה פוטנציאלית אפקטיבית קבועה, $gz - \tfrac12\omega^2r^2 = \text{const}$.' }
          - { kind: limit, text: 'כש-$\omega \to 0$ פני המים שטוחים, $z = z_0$. ליד הדופן השיפוע המקומי הוא $\omega^2r/g$: בדיוק $\tan\theta = A/g$ של השלב הראשון, עם $A = \omega^2r$, התאוצה הצנטריפטלית של המים במקום הזה. על הציר, $r = 0$, השיפוע אפס, כי שם אין תאוצה.' }
          - { kind: units, text: '$\dfrac{\omega^2r^2}{g}$ ביחידות $\dfrac{\text{s}^{-2}\,\text{m}^2}{\text{m/s}^2} = \text{m}$, כמו גובה.' }
          - { kind: result, text: 'פני המים הם הפרבולואיד $z(r) = z_0 + \dfrac{\omega^2r^2}{2g}$. בכל נקודה הם נוטים כמו פני מים במשאית שמאיצה ב-$\omega^2r$.' }
        rubric:
          - text: כתבתי את $\vec g_{\text{eff}}$ במערכת המסתובבת, עם הכוח הצנטריפוגלי ליחידת מסה $\omega^2r$ החוצה.
          - text: נימקתי שפני המים ניצבים ל-$\vec g_{\text{eff}}$, וכתבתי $dz/dr = \omega^2r/g$.
          - text: אינטגרלתי וקיבלתי $\omega^2r^2/(2g)$.
          - text: בדקתי שכש-$\omega \to 0$ פני המים שטוחים, והשוויתי את השיפוע המקומי ל-$A/g$ של השלב הראשון.
          - text: בדקתי שהיחידות הן מטר.

      - label: ד
        type: numeric
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-7.3-2]
        prompt: >-
          המים לא נשפכים, וכמותם לא משתנה. באיזו מהירות זוויתית $\omega$ פני המים נוגעים בדיוק בתחתית המכל, במרכז שלו?
        answer: 6.6
        unit: rad/s
        correctFeedback: >-
          נכון. נפח המים קבוע, ולכן הגובה הממוצע של פני המים על פני שטח המכל נשאר $h_0$:
          $\dfrac{1}{\pi R^2}\displaystyle\int_0^R\left(z_0 + \frac{\omega^2r^2}{2g}\right)2\pi r\,dr = z_0 + \frac{\omega^2R^2}{4g} = h_0$.
          עם $z_0 = 0$: $\omega = \dfrac{2\sqrt{gh_0}}{R} = \dfrac{2\sqrt{9.8\cdot0.10}}{0.30} = 6.60\,\text{rad/s}$, כסיבוב בשנייה.
          בדופן המים מגיעים אז לגובה $2h_0 = 0.20\,\text{m}$.
        wrongFeedback: >-
          פני המים לא יורדים במרכז באותה מידה שהם עולים בדופן. השוו את **הנפח** מתחת לפרבולואיד לנפח ההתחלתי
          $\pi R^2h_0$.
        commonWrong:
          - value: 4.67
            feedback: >-
              הנחתם שהפרש הגובה בין הדופן למרכז הוא $h_0$. בפרבולואיד הגובה הממוצע הוא באמצע ההפרש, ולכן כשהמרכז יורד
              ב-$h_0$ הדופן עולה ב-$h_0$: ההפרש הוא $2h_0$.
          - value: 9.33
            feedback: 'קיבלתם הפרש גובה $4h_0$. הגובה הממוצע של הפרבולואיד מעל $z_0$ הוא חצי מההפרש בין הדופן למרכז, $\omega^2R^2/(4g)$.'
          - value: 3.3
            feedback: 'שכחתם את ה-2: מ-$\omega^2R^2/(4g) = h_0$ יוצא $\omega = 2\sqrt{gh_0}/R$.'
        hints:
          - 'חשבו את הנפח מתחת לפרבולואיד בטבעות דקות: $dV = z(r)\,2\pi r\,dr$.'

  # ------------------------------------------------------------ 3: the plumb line and a falling stone in Jerusalem
  - id: Q-7-bagrut-3
    type: bagrut
    title: אנך ואבן נופלת במגדל בירושלים
    prompt: >-
      במגדל בגובה $h = 200\,\text{m}$ בירושלים, בקו רוחב $\lambda = 31.8^\circ$ צפון, תולים מראש המגדל משקולת על חוט עד
      הקרקע, ומסמנים את הנקודה שמתחתיה. אחר כך מורידים את המשקולת, ומשחררים אבן ממנוחה מאותה נקודה בראש המגדל. הזניחו את
      התנגדות האוויר. קחו $g = 9.8\,\text{m/s}^2$ כתאוצת הכובד בלי הסיבוב, $\omega = 7.29\cdot10^{-5}\,\text{rad/s}$ ו-$R = 6.37\cdot10^{6}\,\text{m}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-7.4-1]
        prompt: מה גודל התאוצה הצנטריפוגלית בירושלים, במערכת הייחוס של כדור הארץ?
        answer: 0.0288
        unit: m/s²
        correctFeedback: >-
          נכון. המרחק מציר כדור הארץ הוא $R\cos\lambda$, ולכן $\omega^2R\cos\lambda = \left(7.29\cdot10^{-5}\right)^2\cdot6.37\cdot10^{6}\cdot\cos31.8^\circ = 0.0288\,\text{m/s}^2$,
          הרחק מהציר.
        wrongFeedback: 'מה המרחק של ירושלים מציר הסיבוב של כדור הארץ? זה לא $R$.'
        commonWrong:
          - value: 0.0339
            feedback: 'זה $\omega^2R$, הערך בקו המשווה. בקו רוחב $\lambda$ המרחק מהציר קטן יותר, $R\cos\lambda$.'
          - value: 0.0245
            feedback: 'זה $\omega^2R\cos^2\lambda$, רק הרכיב של התאוצה לאורך הקו מהמרכז. השאלה שואלת על הגודל כולו.'
          - value: 0.0178
            feedback: 'השתמשתם ב-$\sin\lambda$. בקוטב, $\lambda = 90^\circ$, המרחק מהציר אפס, ולכן הגורם הוא $\cos\lambda$.'
        hints:
          - 'ציירו חתך של כדור הארץ דרך הקטבים, וסמנו את המרחק של ירושלים מהציר.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-7.4-1]
        prompt: מה הזווית בין האנך לבין הקו אל מרכז כדור הארץ בירושלים, במעלות?
        answer: 0.0889
        unit: °
        correctFeedback: >-
          נכון. הרכיב של התאוצה הצנטריפוגלית שניצב לקו מהמרכז הוא $\omega^2R\cos\lambda\sin\lambda = 0.0152\,\text{m/s}^2$,
          ולכן $\alpha \approx \dfrac{0.0152}{9.8} = 1.55\cdot10^{-3}\,\text{rad} = 0.0889^\circ$. המשקולת מוסטת דרומה, לכיוון קו
          המשווה, קצת פחות מהערך המרבי, $0.099^\circ$, של קו רוחב $45^\circ$.
        wrongFeedback: >-
          פרקו את התאוצה מחלק א לרכיב לאורך הקו מהמרכז ולרכיב ניצב לו. הזווית הקטנה היא בקירוב הרכיב הניצב חלקי $g$.
        commonWrong:
          - value: 0.177
            feedback: 'השתמשתם ב-$\sin2\lambda$ במקום ב-$\sin\lambda\cos\lambda = \tfrac12\sin2\lambda$.'
          - value: 0.0991
            feedback: 'זה הערך המרבי, בקו רוחב $45^\circ$. בירושלים $\sin\lambda\cos\lambda = 0.448$, ולא $0.5$.'
          - value: 0.00155
            feedback: 'זו התשובה ברדיאנים. כפלו ב-$180/\pi$.'
        hints:
          - 'הרכיב הניצב של $\omega^2R\cos\lambda$ הוא $\omega^2R\cos\lambda\sin\lambda$.'

      - label: ג
        type: numeric
        points: 4
        level: mid
        objectives: [OBJ-7.4-2]
        prompt: >-
          בקירוב מסדר ראשון ב-$\omega$, אבן שנופלת ממנוחה מגובה $h$ מוסטת מזרחה מהנקודה שמתחת לאנך במרחק
          $d = \tfrac13\,\omega g t^3\cos\lambda$, כאשר $t = \sqrt{2h/g}$. בכמה סנטימטרים מוסטת האבן?
        answer: 5.28
        unit: cm
        correctFeedback: >-
          נכון. $t = \sqrt{\dfrac{400}{9.8}} = 6.39\,\text{s}$, ו-
          $d = \tfrac13\cdot7.29\cdot10^{-5}\cdot9.8\cdot6.39^3\cdot\cos31.8^\circ = 0.0528\,\text{m} = 5.28\,\text{cm}$, מזרחה.
        wrongFeedback: 'חשבו קודם את $t$, ואז הציבו. בנוסחה $\cos\lambda$ ו-$\tfrac13$.'
        commonWrong:
          - value: 6.21
            feedback: 'שכחתם את $\cos\lambda$.'
          - value: 15.8
            feedback: 'שכחתם את $\tfrac13$.'
          - value: 3.27
            feedback: 'השתמשתם ב-$\sin\lambda$. ההסטה של גוף נופל מתאפסת בקוטב, ולכן הגורם הוא $\cos\lambda$.'
          - value: 7.92
            feedback: 'השתמשתם ב-$\tfrac12$ במקום ב-$\tfrac13$.'
        hints:
          - 'זמן הנפילה מ-$200\,\text{m}$ הוא כ-$6.4\,\text{s}$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-7.4-2, OBJ-7.2-2]
        prompt: >-
          גזרו את הנוסחה של חלק ג מהחוק השני במערכת כדור הארץ. השתמשו בצירים מקומיים: $\hat e$ מזרחה, $\hat n$ צפונה ו-$\hat u$
          כלפי מעלה, לאורך האנך. בדקו את התוצאה בגבולות ובדקו את היחידות.
        hints:
          - 'פרקו את $\vec\omega$ לרכיב צפונה ולרכיב כלפי מעלה.'
          - 'בסדר אפס ב-$\omega$ האבן נופלת חופשית, $\vec v'' = -gt\,\hat u$. הציבו את זה בכוח קוריוליס.'
        solution:
          - { kind: law, text: 'במערכת כדור הארץ: $m\vec a'' = m\vec g_{\text{eff}} - 2m\vec\omega\times\vec v''$. הכוח הצנטריפוגלי כבר בתוך $\vec g_{\text{eff}}$, שפונה לאורך האנך, כלפי מטה. אין כוח אוילר, כי $\vec\omega$ קבועה.' }
          - { kind: manipulation, text: 'בקו רוחב $\lambda$: $\vec\omega = \omega\left(\cos\lambda\,\hat n + \sin\lambda\,\hat u\right)$. בסדר אפס $\vec v'' = -gt\,\hat u$, ולכן $\vec\omega\times\vec v'' = -gt\,\omega\cos\lambda\,(\hat n\times\hat u) = -gt\,\omega\cos\lambda\,\hat e$, כי $\hat u\times\hat u = 0$ ו-$\hat n\times\hat u = \hat e$.' }
          - { kind: manipulation, text: 'התאוצה המזרחית: $a''_e = -2(\vec\omega\times\vec v'')_e = 2\omega gt\cos\lambda$. מאינטגרציה ממנוחה: $v''_e = \omega gt^2\cos\lambda$, ו-$x_e = \tfrac13\omega gt^3\cos\lambda$. עם $t = \sqrt{2h/g}$: $d = \tfrac13\omega\cos\lambda\sqrt{\dfrac{8h^3}{g}}$.' }
          - { kind: limit, text: 'בקוטב, $\lambda = 90^\circ$, $\vec\omega$ מקבילה למהירות, $\cos\lambda = 0$ ו-$d = 0$. כש-$\omega \to 0$ גם $d \to 0$. הקירוב מסדר ראשון סביר כי $d \ll h$: $5\,\text{cm}$ לעומת $200\,\text{m}$.' }
          - { kind: units, text: '$[\omega gt^3] = \text{s}^{-1}\cdot\text{m}\,\text{s}^{-2}\cdot\text{s}^3 = \text{m}$.' }
          - { kind: result, text: '$d = \tfrac13\omega gt^3\cos\lambda$, מזרחה מהנקודה שמתחת לאנך, בחצי הכדור הצפוני וגם בדרומי.' }
        rubric:
          - text: כתבתי את החוק השני במערכת כדור הארץ, עם כוח קוריוליס, והסברתי שהכוח הצנטריפוגלי בתוך $\vec g_{\text{eff}}$.
          - text: פירקתי את $\vec\omega$ לרכיבים $\omega\cos\lambda$ צפונה ו-$\omega\sin\lambda$ מעלה, וחישבתי את המכפלה הווקטורית עם $\vec v'' = -gt\,\hat u$.
          - text: קיבלתי תאוצה מזרחית $2\omega gt\cos\lambda$ ואינטגרלתי פעמיים ממנוחה.
          - text: בדקתי שבקוטב ההסטה אפס, ושהיחידות הן מטר.

      - label: ה
        type: mc
        points: 4
        level: bagrut
        objectives: [OBJ-7.4-1, OBJ-7.4-2]
        prompt: >-
          מחלק ב, לאורך $200\,\text{m}$ האנך מגיע לקרקע כ-$31\,\text{cm}$ דרומה מהנקודה שהקו אל מרכז כדור הארץ היה מגיע אליה.
          תלמיד טוען שבגלל זה האבן תנחת $31\,\text{cm}$ דרומה מהסימון שמתחת לאנך. מה נכון?
        choices:
          - text: >-
              הטענה שגויה. האבן מרגישה את אותו כוח צנטריפוגלי כמו המשקולת, ולכן נופלת לאורך האנך, והסטייה מהסימון היא רק
              ההסטה של כוח קוריוליס, כ-$5.3\,\text{cm}$ מזרחה.
            correct: true
            feedback: >-
              נכון. הכוח הצנטריפוגלי תלוי רק במקום, ולכן הוא זהה לאבן ולמשקולת, ובשניהם הוא בתוך $\vec g_{\text{eff}}$. רק כוח
              קוריוליס, שתלוי במהירות, מבדיל בין אבן נופלת למשקולת במנוחה.
          - text: הטענה נכונה, והאבן נוחתת כ-$31\,\text{cm}$ דרומה ו-$5.3\,\text{cm}$ מזרחה מהסימון.
            feedback: >-
              הנטייה של האנך כבר כוללת את ההשפעה הצנטריפוגלית. אם נמדוד מהנקודה שמתחת לקו אל המרכז, האבן אכן תנחת דרומה
              ממנה, אבל הסימון נמצא שם בדיוק.
            misconception: MC-7-plumb-points-to-center
          - text: הטענה שגויה, כי האבן נוחתת $31\,\text{cm}$ **צפונה** מהסימון, לכיוון ההפוך.
            feedback: 'הכוח הצנטריפוגלי על האבן ועל המשקולת זהה בכיוונו ובגודלו, ולכן אין סיבה לסטייה צפונה או דרומה בסדר ראשון.'
          - text: הטענה שגויה, כי האבן נופלת תמיד אל מרכז כדור הארץ, ולכן תנחת בדיוק בסימון.
            feedback: >-
              האבן לא נופלת אל המרכז אלא לאורך $\vec g_{\text{eff}}$, כמו המשקולת, וכוח קוריוליס מסיט אותה כ-$5\,\text{cm}$
              מזרחה. בסימון בדיוק היא לא נוחתת.
        hints:
          - 'במה תלוי הכוח הצנטריפוגלי, ובמה כוח קוריוליס? מה שונה בין אבן נופלת למשקולת במנוחה?'

  # ------------------------------------------------------------ 4: a pendulum on a turntable, and Foucault's
  - id: Q-7-bagrut-4
    type: bagrut
    title: מטוטלת על פטיפון ומטוטלת פוקו
    prompt: >-
      במעבדה תולים מטוטלת בעלת מסה $m = 2.0\,\text{kg}$ מנקודה שנמצאת בדיוק מעל מרכז של פטיפון גדול, על ציר הסיבוב שלו.
      הפטיפון מסתובב, במבט מלמעלה, נגד כיוון השעון, במהירות זוויתית קבועה $\Omega = 0.10\,\text{rad/s}$. סטודנטית
      שעומדת על הפטיפון מסיטה את המטוטלת ומשחררת אותה, והיא מתנודדת תנודות קטנות דרך המרכז. בהמשך משווים אותה למטוטלת
      פוקו, שתלויה מתקרה ומתנודדת על פני כדור הארץ המסתובב, $\omega = 7.29\cdot10^{-5}\,\text{rad/s}$.
    parts:
      - label: א
        type: mc
        points: 5
        level: basic
        objectives: [OBJ-7.3-2]
        prompt: מה רואה הסטודנטית שעל הפטיפון?
        choices:
          - text: מישור התנודה מסתובב עם כיוון השעון, וחוזר למקומו ביחס לפטיפון אחרי $62.8\,\text{s}$.
            correct: true
            feedback: >-
              נכון. במערכת המעבדה הכוחות על המטוטלת, הכובד והמתיחות, נמצאים במישור התנודה, ולכן המישור קבוע. הפטיפון מסתובב
              מתחתיו נגד כיוון השעון, ולכן לסטודנטית המישור מסתובב בקצב $\Omega$ עם כיוון השעון: סיבוב שלם ב-$2\pi/\Omega = 62.8\,\text{s}$.

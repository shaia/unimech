#     h = 1.5 m: cos φ = 0.985, φ = 0.17342 rad, tan φ = 0.17518, t = tan φ/ω = 0.560 s (Earth: 0.553 s),
#     chord 17.3 m, d = R(tan φ − φ) = 17.6 cm (first order (2h)^{3/2}/(3√R) = 17.3 cm); g at 1.8 m above
#     the floor 9.62 m/s²; d = 1.0 cm needs R = (2h)³/(9d²) = 3.0e4 m (exact model there: 1.00 cm;
#     unsquared 173 m, ½ for ⅓ 6.75e4 m, no ⅓ 2.7e5 m);

      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-7.4-2, OBJ-7.2-2]
        prompt: >-
          הסבירו בעזרת כוח קוריוליס מדוע מישור התנודה של מטוטלת פוקו בקו רוחב $\lambda$ מסתובב בדיוק כמו מישור התנודה
          של מטוטלת על פטיפון שמסתובב סביב האנך בקצב $\Omega = \omega\sin\lambda$. בדקו את התוצאה בקוטב, בקו המשווה ובחצי
          הכדור הדרומי, ובדקו את היחידות. כמה זמן לוקח לו להשלים סיבוב בפריז?
        hints:
          - 'פרקו את $\vec\omega$ לרכיב אנכי ולרכיב אופקי, צפונה. המהירות של מטוטלת בתנודות קטנות כמעט אופקית.'
          - 'איזה רכיב של $\vec\omega$ נותן כוח קוריוליס **אופקי** על מהירות אופקית?'
        solution:
          - { kind: law, text: 'במערכת כדור הארץ: $m\vec a'' = m\vec g_{\text{eff}} + \vec T - 2m\vec\omega\times\vec v''$, כאשר $\vec T$ המתיחות בחוט. הכוח הצנטריפוגלי בתוך $\vec g_{\text{eff}}$.' }
          - { kind: manipulation, text: 'בצירים מקומיים: $\vec\omega = \omega\cos\lambda\,\hat n + \omega\sin\lambda\,\hat u$. בתנודות קטנות $\vec v''$ כמעט אופקית. הרכיב $\omega\sin\lambda\,\hat u\times\vec v''$ אופקי וניצב ל-$\vec v''$. הרכיב $\omega\cos\lambda\,\hat n\times\vec v''$ מקביל ל-$\hat u$, כי מכפלה של שני וקטורים אופקיים אנכית, והוא רק משנה מעט את המתיחות הדרושה.' }
          - { kind: manipulation, text: 'לכן התנועה האופקית מקיימת את אותה משוואה כמו מטוטלת על פטיפון שמסתובב סביב האנך בקצב $\Omega = \omega\sin\lambda$: כוח קוריוליס אופקי $\vec F_{\text{cor}} = -2m\Omega\hat u\times\vec v''$. מחלק א, מישור התנודה מסתובב ביחס לפטיפון בקצב $\Omega$ בכיוון ההפוך לסיבוב שלו, כלומר עם כיוון השעון בחצי הכדור הצפוני.' }
          - { kind: limit, text: 'בקוטב, $\lambda = 90^\circ$: $\Omega = \omega$, והקרקע היא ממש פטיפון שמסתובב מתחת למטוטלת, סיבוב שלם ביום כוכבי, $2\pi/\omega = 23.9\,\text{h}$. בקו המשווה, $\lambda = 0$: $\Omega = 0$, והמישור לא מסתובב. בחצי הכדור הדרומי $\sin\lambda < 0$, והמישור מסתובב נגד כיוון השעון.' }
          - { kind: units, text: '$\omega\sin\lambda$ ביחידות $\text{rad/s}$, כמו מהירות זוויתית, ו-$2\pi/(\omega\sin\lambda)$ בשניות.' }
          - { kind: substitution, text: '$T = \dfrac{2\pi}{\omega\sin\lambda} = \dfrac{2\pi}{7.29\cdot10^{-5}\cdot\sin48.85^\circ} = 1.14\cdot10^{5}\,\text{s} = 31.8\,\text{h}$.' }
          - { kind: result, text: 'רק הרכיב האנכי של $\vec\omega$ מסובב את התנועה האופקית, ולכן המישור מסתובב בקצב $\omega\sin\lambda$, עם כיוון השעון בצפון. בפריז סיבוב שלם לוקח כ-$31.8\,\text{h}$.' }
        rubric:
          - text: פירקתי את $\vec\omega$ לרכיב אנכי $\omega\sin\lambda$ ולרכיב אופקי $\omega\cos\lambda$ צפונה.
          - text: הראיתי שעל מהירות אופקית רק הרכיב האנכי נותן כוח קוריוליס אופקי, והרכיב האופקי נותן כוח אנכי.
          - text: השוויתי למטוטלת על פטיפון בקצב $\Omega = \omega\sin\lambda$, וקבעתי את כיוון הסיבוב.
          - text: בדקתי את הקוטב (יום כוכבי), את קו המשווה (אין סיבוב) ואת חצי הכדור הדרומי (הכיוון מתהפך).
          - text: חישבתי כ-$32\,\text{h}$ בפריז.


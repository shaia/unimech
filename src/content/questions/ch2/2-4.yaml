# Lesson 2.4 question bank: the comprehension ladder of "חיכוך".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), script .scratch/ch2/q.ts:
#   box 10 kg, μs = 0.50, μk = 0.30, pushed by 20 N at rest: f = 20 N (μsN = 49, μkN = 29.4);
#   truck: a_max = μs g = 3.92 m/s² (μk g = 2.94);
#   box 20 kg pulled by 100 N at 30° above the horizontal, μk = 0.30: N = 196 - 50 = 146 N,
#   a = (86.6 - 43.8)/20 = 2.14 m/s² (N = mg: 1.39; F not projected: 2.81);
#   threshold angle for μs = 0.60: atan 0.6 = 31.0° (asin: 36.9°, atan(1/μ): 59.0°);
#   A = 1.0 kg on B = 3.0 kg, μs = 0.40, μk = 0.30, smooth floor: pulling B, F_max = (mA+mB)μs g = 15.7 N
#   (μs mA g = 3.92, μs mB g = 11.8); pulling A, F_max = (mA+mB)μs mA g/mB = 5.23 N;
#   F = 20 N on B: they slip, a_A = μk g = 2.94, a_B = (20 - 2.94)/3 = 5.69 m/s² (together 5.00, μs 5.36, F/mB 6.67).

chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.4-1 static vs kinetic, and the direction
  - id: Q-2.4-static-value
    type: numeric
    objectives: [OBJ-2.4-1]
    level: basic
    prompt: >-
      ארגז בעל מסה $10\,\text{kg}$ מונח על רצפה אופקית. מקדם החיכוך הסטטי בינו לבין הרצפה $\mu_s = 0.50$, והקינטי
      $\mu_k = 0.30$. דוחפים אותו אופקית בכוח $20\,\text{N}$, והוא לא זז. מה גודל כוח החיכוך עליו?
    answer: 20
    unit: N
    correctFeedback: >-
      נכון. הארגז לא מאיץ, ולכן החיכוך מאזן בדיוק את הדחיפה: $f = 20\,\text{N}$. הביטוי $\mu_sN = 49\,\text{N}$ הוא
      רק **הגבול העליון** של החיכוך הסטטי. עד שהדחיפה מגיעה אליו, החיכוך הוא מה שהחוק השני דורש.
    wrongFeedback: 'הארגז במנוחה. מה החוק השני אומר על הכוח השקול האופקי עליו?'
    commonWrong:
      - value: 49
        feedback: >-
          זה $\mu_sN$, החיכוך הסטטי **המרבי**. אילו החיכוך היה $49\,\text{N}$ מול דחיפה של $20\,\text{N}$, הארגז היה
          מאיץ אל הדוחף. החיכוך הסטטי מקבל כל ערך בין 0 לגבול הזה.
        misconception: MC-2-static-friction-always-max
      - value: 29.4
        feedback: >-
          זה $\mu_kN$, החיכוך הקינטי, שפועל רק כשהארגז **מחליק**. כאן הוא במנוחה, והחיכוך סטטי. וחוץ מזה, חיכוך של
          $29.4\,\text{N}$ מול $20\,\text{N}$ היה מאיץ את הארגז אחורה.
        misconception: MC-2-kinetic-when-at-rest
    hints:
      - 'האם הארגז מחליק? אם לא, איזה חיכוך פועל, ומה קובע את הגודל שלו?'

  - id: Q-2.4-truck-box
    type: vector
    objectives: [OBJ-2.4-1]
    qualitative: true
    level: basic
    prompt: >-
      ארגז מונח על משטח המטען של משאית. המשאית מאיצה ימינה על כביש אופקי, והארגז נע איתה בלי להחליק. לאיזה כיוון
      פועל כוח החיכוך שמשטח המטען מפעיל על הארגז? (מבט מהצד: ימינה היא כיוון הנסיעה, למעלה היא כלפי מעלה.)
    answer: e
    correctFeedback: >-
      נכון. הארגז מאיץ ימינה יחד עם המשאית, והכוח האופקי היחיד עליו הוא החיכוך, ולכן הוא ימינה. החיכוך מתנגד
      להחלקה **יחסית**: בלעדיו הארגז היה נשאר מאחור ביחס למשטח, והחיכוך מונע את זה בכך שהוא מושך אותו קדימה. כאן
      החיכוך הוא שמניע את הארגז.
    wrong:
      - dir: w
        feedback: >-
          חיכוך מתנגד להחלקה של שני המשטחים זה ביחס לזה, לא לתנועה ביחס לקרקע. הארגז מאיץ ימינה, ולכן הכוח השקול
          עליו, שהוא החיכוך בלבד, חייב לפנות ימינה.
        misconception: MC-2-friction-opposes-motion
      - dir: zero
        feedback: >-
          הארגז לא מחליק, אבל הוא מאיץ, ולכן צריך כוח אופקי שקול. חיכוך סטטי פועל בדיוק כשאין החלקה, כדי למנוע
          אותה.
        misconception: MC-2-no-friction-without-sliding
    wrongFeedback: 'הארגז מאיץ ימינה. איזה כוח אופקי יכול לתת לו את התאוצה הזו?'
    hints:
      - 'כתבו את החוק השני לארגז ברכיב האופקי.'

  - id: Q-2.4-truck-max
    type: numeric
    objectives: [OBJ-2.4-1]
    level: mid
    prompt: >-
      באותה משאית, מקדם החיכוך הסטטי בין הארגז למשטח המטען $\mu_s = 0.40$, והקינטי $\mu_k = 0.30$. מה התאוצה המרבית
      של המשאית שבה הארגז עוד לא מחליק?
    answer: 3.92
    unit: m/s²
    correctFeedback: >-
      נכון. החיכוך הוא שמאיץ את הארגז: $f = ma$, ו-$f \le \mu_sN = \mu_smg$. לכן $a \le \mu_sg = 3.92\,\text{m/s}^2$,
      בלי תלות במסה של הארגז.
    wrongFeedback: 'החיכוך הסטטי לא יכול לעבור את $\mu_sN$. איזו תאוצה הגבול הזה מאפשר לארגז?'
    commonWrong:
      - value: 2.94
        feedback: 'זה $\mu_kg$. כל עוד הארגז לא מחליק, החיכוך סטטי, והגבול שלו הוא $\mu_sN$.'
        misconception: MC-2-kinetic-when-at-rest
      - value: 0.40
        feedback: 'זה המקדם עצמו, חסר ממדים. התאוצה המרבית היא $\mu_s$ כפול $g$.'
    hints:
      - 'בגבול, החיכוך הוא $\mu_smg$, והוא הכוח היחיד שמאיץ את הארגז.'

  - id: Q-2.4-walking
    type: twotier
    objectives: [OBJ-2.4-1]
    qualitative: true
    level: mid
    prompt: >-
      כשהולכים קדימה על רצפה, באיזה כיוון פועל כוח החיכוך של הרצפה על הנעל של הרגל שדוחפת, ואיזה חיכוך זה?
    choices:
      - text: קדימה, וזה חיכוך סטטי.
        correct: true
        feedback: נכון. ולמה דווקא קדימה, ולמה סטטי?
      - text: אחורה, וזה חיכוך קינטי.
        feedback: >-
          הנעל לא מחליקה על הרצפה (אם היא הייתה מחליקה, הייתם נופלים), ולכן החיכוך סטטי. והוא פונה קדימה, כי הוא
          הכוח שמאיץ אתכם קדימה.
        misconception: MC-2-friction-opposes-motion
      - text: קדימה, וזה חיכוך קינטי.
        feedback: 'הכיוון נכון, אבל חיכוך קינטי פועל רק כשיש החלקה. הנעל שדוחפת נחה על הרצפה עד שהיא מתרוממת.'
      - text: אין חיכוך. השרירים של הרגליים דוחפים את הגוף קדימה.
        feedback: >-
          כוחות השרירים פנימיים: הם פועלים בין חלקים של הגוף, בזוגות שמתבטלים בסכום. על קרח חלק השרירים עובדים, ובכל
          זאת אי אפשר לצאת לדרך. מה שמאיץ את הגוף הוא כוח חיצוני, החיכוך.
        misconception: MC-2-no-friction-without-sliding
    reasons:
      - text: הנעל דוחפת את הרצפה אחורה, והרצפה דוחפת אותה קדימה. הנעל לא מחליקה, ולכן החיכוך סטטי, והוא הכוח החיצוני האופקי היחיד על ההולך.
        correct: true
        feedback: >-
          זה הנימוק. החיכוך מתנגד להחלקה שהייתה נוצרת, החלקה של הנעל אחורה, ולכן הוא פונה קדימה. בלי חיכוך, כמו על
          קרח, הרגל הייתה מחליקה אחורה במקום לדחוף.
      - text: חיכוך תמיד פונה נגד כיוון התנועה של הגוף.
        feedback: 'חיכוך מתנגד להחלקה **יחסית** בין שני משטחים, לא לתנועה של הגוף ביחס לקרקע. ההולך נע קדימה, והחיכוך עליו קדימה.'
        misconception: MC-2-friction-opposes-motion
      - text: חיכוך קינטי גדול מחיכוך סטטי, ולכן הוא שמאפשר את ההליכה.
        feedback: 'בדרך כלל $\mu_k < \mu_s$, ובכל מקרה מה שקובע איזה חיכוך פועל הוא אם יש החלקה, ובהליכה אין.'
    hints:
      - 'מה הנעל עושה לרצפה כשהרגל דוחפת? ומה עושה הרצפה לנעל, לפי החוק השלישי?'

  # ---------------------------------------------------------------- OBJ-2.4-2 friction problems: threshold angle, stacked blocks
  - id: Q-2.4-threshold
    type: numeric
    objectives: [OBJ-2.4-2]
    level: basic
    prompt: >-
      מניחים מטבע על כריכה של ספר ומרימים בהדרגה צד אחד של הספר. מקדם החיכוך הסטטי בין המטבע לכריכה
      $\mu_s = 0.60$. באיזו זווית שיפוע, במעלות, המטבע מתחיל להחליק?
    answer: 31.0
    unit: °
    correctFeedback: >-
      נכון. עד הסף, לאורך המדרון $f = mg\sin\theta$, ובניצב $N = mg\cos\theta$. בסף $f = \mu_sN$, ולכן
      $\tan\theta = \mu_s$, ו-$\theta = \arctan0.60 = 31.0^\circ$. מודדים כך את $\mu_s$: מספיק למדוד זווית.
    wrongFeedback: 'בסף, החיכוך הסטטי שווה לגבול שלו, $\mu_sN$. כתבו את החוק השני לאורך המדרון ובניצב לו.'
    commonWrong:
      - value: 36.9
        feedback: 'פתרתם $\sin\theta = \mu_s$. הכוח הנורמלי הוא $mg\cos\theta$, ולכן היחס בין שני הכוחות הוא $\tan\theta$.'
      - value: 59.0
        feedback: >-
          פתרתם $\tan\theta = 1/\mu_s$: החלפתם את הרכיבים. רכיב הכובד **לאורך** המדרון הוא $mg\sin\theta$, והניצב הוא
          $mg\cos\theta$. בדקו בגבול: בלי חיכוך, $\mu_s = 0$, המטבע מחליק בכל זווית, כלומר הזווית צריכה להיות אפס.
    hints:
      - 'מה היחס בין $mg\sin\theta$ ל-$mg\cos\theta$?'

  - id: Q-2.4-incline-mass
    type: mc
    objectives: [OBJ-2.4-2]
    qualitative: true
    level: mid
    prompt: >-
      על אותו ספר שמים שני מטבעות מאותו חומר, אחד כבד פי 2 מהשני, ומרימים את הספר בהדרגה. מה קורה?
    choices:
      - text: שניהם מתחילים להחליק באותה זווית.
        correct: true
        feedback: >-
          נכון. גם הכוח שמושך את המטבע במורד, $mg\sin\theta$, וגם החיכוך המרבי, $\mu_smg\cos\theta$, פרופורציוניים
          למסה, והיא מצטמצמת: $\tan\theta = \mu_s$ תלוי רק במשטחים.
      - text: הכבד מתחיל להחליק ראשון, כי הכובד מושך אותו חזק יותר במורד.
        feedback: >-
          הכובד מושך אותו פי 2, אבל גם לוחץ אותו פי 2 אל הכריכה, ולכן גם החיכוך המרבי שלו גדול פי 2. היחס לא משתנה.
        misconception: MC-2-heavier-slips-sooner
      - text: הקל מתחיל להחליק ראשון, כי הכבד לוחץ חזק יותר ולכן נאחז טוב יותר.
        feedback: >-
          הכבד באמת לוחץ חזק יותר, אבל גם נמשך במורד חזק יותר, באותו יחס. בסף שני הגורמים מתאזנים באותה זווית.
        misconception: MC-2-heavier-slips-sooner
      - text: זה תלוי בגודל של המטבעות, כי למטבע גדול יש יותר שטח מגע.
        feedback: >-
          במודל של החיכוך היבש, $f \le \mu_sN$, השטח לא מופיע. מטבע גדול לוחץ על יותר שטח, אבל כל סנטימטר נלחץ פחות.
    hints:
      - 'כתבו את תנאי הסף, ובדקו אם המסה נשארת בו.'

  - id: Q-2.4-pull-angle
    type: numeric
    objectives: [OBJ-2.4-2]
    level: mid
    prompt: >-
      מושכים ארגז בעל מסה $20\,\text{kg}$ על רצפה אופקית בעזרת חבל, בכוח $100\,\text{N}$ בזווית $30^\circ$ מעל
      האופק. הארגז מחליק, ומקדם החיכוך הקינטי $\mu_k = 0.30$. מה התאוצה של הארגז?
    answer: 2.14
    unit: m/s²
    correctFeedback: >-
      נכון. באנך אין תאוצה: $N + F\sin\theta - mg = 0$, ולכן $N = 196 - 50 = 146\,\text{N}$. החבל מרים חלק מהכובד,
      והחיכוך קטן: $f = \mu_kN = 43.8\,\text{N}$. באופק: $a = \dfrac{F\cos\theta - f}{m} = \dfrac{86.6 - 43.8}{20} = 2.14\,\text{m/s}^2$.
    wrongFeedback: 'מצאו קודם את הכוח הנורמלי מהחוק השני באנך, עם הרכיב האנכי של החבל. רק אז חשבו את החיכוך.'
    commonWrong:
      - value: 1.39
        feedback: >-
          לקחתם $N = mg$. החבל מושך גם כלפי מעלה, $F\sin\theta = 50\,\text{N}$, ולכן הרצפה צריכה לדחוף פחות:
          $N = 146\,\text{N}$, והחיכוך קטן בהתאם.
        misconception: MC-2-normal-equals-weight
      - value: 2.81
        feedback: 'הצבתם את כל $100\,\text{N}$ באופק. רק הרכיב $F\cos\theta = 86.6\,\text{N}$ מאיץ את הארגז.'
    hints:
      - 'הרכיב האנכי של המשיכה הוא $F\sin\theta$. מה הוא עושה לכוח הנורמלי?'

  - id: Q-2.4-stack-max
    type: numeric
    objectives: [OBJ-2.4-2]
    level: bagrut
    prompt: >-
      גוש A בעל מסה $1.0\,\text{kg}$ מונח על גוש B בעל מסה $3.0\,\text{kg}$, ו-B מונח על רצפה חלקה. מקדם החיכוך
      הסטטי בין הגושים $\mu_s = 0.40$. מושכים את B, התחתון, בכוח אופקי $F$. מה הכוח המרבי שבו הגושים עוד נעים
      יחד?
    answer: 15.7
    unit: N
    correctFeedback: >-
      נכון. רק החיכוך מאיץ את A, ולכן $m_Aa = f \le \mu_sm_Ag$, כלומר $a \le \mu_sg = 3.92\,\text{m/s}^2$. כשהם נעים
      יחד, $F = (m_A + m_B)a$, ולכן $F_{\max} = (m_A + m_B)\mu_sg = 4.0\cdot3.92 = 15.7\,\text{N}$. **בדיקת גבולות:**
      כש-$m_B \to 0$, $F_{\max} \to \mu_sm_Ag$: מושכים מגש חסר מסה, והכוח עובר כולו דרך החיכוך.
    wrongFeedback: >-
      התחילו מ-A: איזה כוח מאיץ אותו, ומה התאוצה המרבית שהכוח הזה מאפשר? אחר כך כתבו את החוק השני לשני הגושים
      יחד.
    commonWrong:
      - value: 3.92
        feedback: >-
          זה החיכוך המרבי, $\mu_sm_Ag$, בניוטון. הכוח $F$ צריך להאיץ את **שני** הגושים בתאוצה הזו, ולא רק את A.
        misconception: MC-2-max-force-is-friction-limit
      - value: 11.8
        feedback: 'השתמשתם במסה של B בחיכוך. החיכוך בין הגושים תלוי בכוח הנורמלי ביניהם, והוא $m_Ag$.'
    hints:
      - 'תאוצה משותפת פירושה שהחיכוך על A נותן לו בדיוק את התאוצה של B.'

  - id: Q-2.4-stack-top
    type: twotier
    objectives: [OBJ-2.4-2]
    qualitative: true
    level: bagrut
    prompt: >-
      אותם גושים: A ($1.0\,\text{kg}$) על B ($3.0\,\text{kg}$), רצפה חלקה, $\mu_s = 0.40$ בין הגושים. מה משתנה
      בכוח המרבי שבו הם עוד נעים יחד, אם מושכים את A, העליון, במקום את B?
    choices:
      - text: הוא קטן פי 3, ל-$5.2\,\text{N}$ בערך.
        correct: true
        feedback: נכון. ולמה דווקא פי 3?
      - text: הוא לא משתנה, כי החיכוך המרבי בין הגושים לא משתנה.
        feedback: >-
          החיכוך המרבי אכן לא משתנה, אבל עכשיו הוא צריך להאיץ גוש אחר, את B, שכבד פי 3, ולכן התאוצה המשותפת המרבית
          קטנה פי 3.
        misconception: MC-2-max-force-is-friction-limit
      - text: הוא גדל, כי עכשיו הכוח פועל ישירות על הגוש שהחיכוך מחזיק.
        feedback: 'משיכה ישירה של A דווקא מקלה עליו להחליק. החיכוך צריך עכשיו לגרור את B, הכבד.'
    reasons:

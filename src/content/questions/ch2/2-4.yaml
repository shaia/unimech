  - id: Q-2.4-stack-slip
    type: numeric
    objectives: [OBJ-2.4-2]
    level: bagrut
    prompt: >-
      גוש A בעל מסה $2.0\,\text{kg}$ מונח על גוש B בעל מסה $3.0\,\text{kg}$, ו-B על רצפה חלקה. בין הגושים $\mu_s = 0.30$
      ו-$\mu_k = 0.25$. הגושים במנוחה, ומושכים את A, העליון, בכוח אופקי $F = 12\,\text{N}$. מה התאוצה של B?
    answer: 1.63
    unit: m/s²
    correctFeedback: >-
      נכון. קודם בודקים אם הגושים נעים יחד. אילו נעו יחד, $a = F/(m_A + m_B) = 2.40\,\text{m/s}^2$, והחיכוך שהיה צריך
      להאיץ את B הוא $m_Ba = 7.20\,\text{N}$, יותר מ-$\mu_sm_Ag = 5.88\,\text{N}$. לכן הם מחליקים, והחיכוך קינטי,
      $\mu_km_Ag = 4.90\,\text{N}$, קדימה על B: $a_B = \dfrac{\mu_km_Ag}{m_B} = 1.63\,\text{m/s}^2$. בדיקה: $a_A = (12 - 4.90)/2.0 = 3.55\,\text{m/s}^2 > a_B$,
      כלומר A מקדים את B, כמו שהנחנו על כיוון ההחלקה.
    wrongFeedback: >-
      הניחו קודם שהגושים נעים יחד, ובדקו איזה חיכוך זה דורש מ-B. אם הוא עובר את $\mu_sm_Ag$, יש החלקה, ולכל גוש תאוצה
      משלו.
    commonWrong:
      - value: 2.40
        feedback: >-
          זה $F/(m_A + m_B)$, התאוצה אילו הגושים נעו יחד. בדקו את ההנחה: ל-B היה דרוש חיכוך של $7.20\,\text{N}$, יותר
          מהמרבי, $5.88\,\text{N}$. (ואם השוויתם את $F$ ל-$(m_A + m_B)\mu_sg = 14.7\,\text{N}$: זה הכוח המרבי כשמושכים את
          **B**. כשמושכים את A, הכוח המרבי הוא $9.80\,\text{N}$.)
      - value: 1.96
        feedback: 'השתמשתם ב-$\mu_s$. כשיש החלקה, החיכוך קינטי: $\mu_km_Ag$.'
      - value: 3.55
        feedback: 'זו התאוצה של A, $(F - \mu_km_Ag)/m_A$. השאלה על B, שהכוח האופקי היחיד עליו הוא החיכוך מ-A.'
    hints:
      - 'כשמושכים את A, איזה כוח אופקי פועל על B? מה התאוצה המרבית שהוא יכול לתת לו?'
      - 'החיכוך על A ועל B הם זוג של החוק השלישי.'

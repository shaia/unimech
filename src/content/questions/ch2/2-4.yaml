# Lesson 2.4 question bank: the comprehension ladder of "חיכוך".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), script .scratch/ch2/q.ts:
#   box 10 kg, μs = 0.50, μk = 0.30, pushed by 20 N at rest: f = 20 N (μsN = 49, μkN = 29.4);
#   truck: a_max = μs g = 3.92 m/s² (μk g = 2.94);
#   box 20 kg pulled by 100 N at 30° above the horizontal, μk = 0.30: N = 196 - 50 = 146 N,
#   a = (86.6 - 43.8)/20 = 2.14 m/s² (N = mg: 1.39; F not projected: 2.81);
#   sin↔cos swapped in pull-angle: N = 196 - 86.6 = 109 N, a = (50 - 32.8)/20 = 0.859 m/s²;
# Review fixes (2026-11-09), script .scratch/ch2/2-4/review.ts; the exam rungs no longer use the lesson's numbers:
#   threshold angle for μs = 0.45: atan 0.45 = 24.2° (asin: 26.7°, atan(1/μ): 65.8°);
#   stops-on-slope: 3.0 kg on 25°, μs = 0.50, μk = 0.40; tan 25° = 0.466 < 0.50, it stays; f = mg sin θ = 12.4 N
#   (μk N = 10.7, μs N = 13.3, μk mg = 11.8);
#   stack-max: A 3.0 kg pulled on B 2.0 kg, μs = 0.50 between, floor μ = 0.10: a_max = (μs mA - μf M)g/mB = 4.90,
#   F_max = M g (μs - μf) mA/mB = 29.4 N (floor ignored 36.8, μs M g 24.5, μs mA g 14.7, (μs + μf) 44.1);
#   stack-top: A 4.0 kg on B 1.0 kg, μs = 0.30: pulling B 14.7 N, pulling A 58.8 N, 4 times larger;
#   stack-slip: A 2.0 kg on B 3.0 kg, μs = 0.30, μk = 0.25, 12 N on A: F_max(on A) = 9.80 N < 12, they slip;
#   a_B = μk mA g/mB = 1.63 m/s² (together 2.40, μs 1.96, a_A 3.55).

chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.4-1 static vs kinetic, and the direction
  - id: Q-2.4-static-value
    type: numeric
    objectives: [OBJ-2.4-1]
    level: basic
    prompt: >-
      ארגז בעל מסה $10\,\text{kg}$ מונח על רצפה אופקית. מקדם החיכוך הסטטי בינו לבין הרצפה $\mu_s = 0.50$, והקינטי
      $\mu_k = 0.30$. הארגז במנוחה, ודוחפים אותו אופקית בכוח $20\,\text{N}$. מה גודל כוח החיכוך עליו?
    answer: 20
    unit: N
    correctFeedback: >-
      נכון. קודם בודקים אם הוא מחליק: החיכוך הסטטי המרבי הוא $\mu_sN = \mu_smg = 49\,\text{N}$, יותר מהדחיפה, ולכן
      הארגז לא זז. הוא לא מאיץ, ולכן החיכוך מאזן בדיוק את הדחיפה: $f = 20\,\text{N}$. עד שהדחיפה מגיעה ל-$49\,\text{N}$,
      החיכוך הוא מה שהחוק השני דורש, לא הערך המרבי.
    wrongFeedback: 'השוו קודם את הדחיפה ל-$\mu_sN$: האם הארגז מחליק? ואם לא, מה החוק השני אומר על הכוח השקול האופקי עליו?'
    commonWrong:
      - value: 49
        feedback: >-
          זה $\mu_sN$, החיכוך הסטטי **המרבי**. אילו החיכוך היה $49\,\text{N}$ מול דחיפה של $20\,\text{N}$, הארגז היה
          מאיץ אל הדוחף. החיכוך הסטטי מקבל כל ערך בין 0 לערך המרבי הזה.
        misconception: MC-2-static-friction-always-max
      - value: 29.4
        feedback: >-
          זה $\mu_kN$, החיכוך הקינטי, שפועל רק כשהארגז **מחליק**. כאן $20\,\text{N} < \mu_sN = 49\,\text{N}$, ולכן הוא
          נשאר במנוחה, והחיכוך סטטי. וחוץ מזה, חיכוך של $29.4\,\text{N}$ מול $20\,\text{N}$ היה מאיץ את הארגז אחורה.
        misconception: MC-2-kinetic-when-at-rest
    hints:
      - 'האם הארגז מחליק? השוו את הדחיפה לחיכוך הסטטי המרבי, $\mu_sN$.'
      - 'אם הוא לא מחליק, איזה חיכוך פועל, ומה קובע את הגודל שלו?'

  - id: Q-2.4-truck-box
    type: vector
    objectives: [OBJ-2.4-1]
    qualitative: true
    level: basic
    prompt: >-
      ארגז מונח על משטח המטען של משאית. המשאית מאיצה ימינה על כביש אופקי, והארגז נע איתה בלי להחליק. לאיזה כיוון
      פועל כוח החיכוך שמשטח המטען מפעיל על הארגז? (מבט מהצד: ימינה היא כיוון הנסיעה, למעלה היא כלפי מעלה.)
    answer: e
    correctFeedback: >-
      נכון. הארגז מאיץ ימינה יחד עם המשאית, והכוח האופקי היחיד עליו הוא החיכוך, ולכן הוא ימינה. החיכוך מתנגד
      להחלקה **יחסית**: בלעדיו הארגז היה נשאר מאחור ביחס למשטח, והחיכוך מונע את זה בכך שהוא מושך אותו קדימה. כאן
      החיכוך הוא שמניע את הארגז.
    wrong:
      - dir: w
        feedback: >-
          חיכוך מתנגד להחלקה של שני המשטחים זה ביחס לזה, לא לתנועה ביחס לקרקע. הארגז מאיץ ימינה, ולכן הכוח השקול
          עליו, שהוא החיכוך בלבד, חייב לפנות ימינה.
        misconception: MC-2-friction-opposes-motion
      - dir: zero
        feedback: >-
          הארגז לא מחליק, אבל הוא מאיץ, ולכן צריך כוח אופקי שקול. חיכוך סטטי פועל בדיוק כשאין החלקה, כדי למנוע
          אותה.
        misconception: MC-2-no-friction-without-sliding
    wrongFeedback: 'הארגז מאיץ ימינה. איזה כוח אופקי יכול לתת לו את התאוצה הזו?'
    hints:
      - 'כתבו את החוק השני לארגז ברכיב האופקי.'

  - id: Q-2.4-truck-max
    type: numeric
    objectives: [OBJ-2.4-1]
    level: mid
    prompt: >-
      ארגז מונח על משטח המטען של משאית, שמאיצה קדימה על כביש אופקי. מקדם החיכוך הסטטי בין הארגז למשטח המטען
      $\mu_s = 0.40$, והקינטי $\mu_k = 0.30$. מה התאוצה המרבית של המשאית שבה הארגז עוד לא מחליק?
    answer: 3.92
    unit: m/s²
    correctFeedback: >-
      נכון. החיכוך הוא שמאיץ את הארגז: $f = ma$, ו-$f \le \mu_sN = \mu_smg$. לכן $a \le \mu_sg = 3.92\,\text{m/s}^2$,
      בלי תלות במסה של הארגז.
    wrongFeedback: 'החיכוך הסטטי לא יכול לעבור את $\mu_sN$. איזו תאוצה הערך המרבי הזה מאפשר לארגז?'
    commonWrong:
      - value: 2.94
        feedback: 'זה $\mu_kg$. כל עוד הארגז לא מחליק, החיכוך סטטי, והערך המרבי שלו הוא $\mu_sN$.'
        misconception: MC-2-kinetic-when-at-rest
      - value: 0.40
        feedback: 'זה המקדם עצמו, חסר ממדים. התאוצה המרבית היא $\mu_s$ כפול $g$.'
    hints:
      - 'ברגע שלפני ההחלקה, החיכוך הוא $\mu_smg$, והוא הכוח היחיד שמאיץ את הארגז.'

  - id: Q-2.4-walking
    type: twotier
    objectives: [OBJ-2.4-1]
    qualitative: true
    level: mid
    prompt: >-
      כשהולכים קדימה על רצפה, באיזה כיוון פועל כוח החיכוך של הרצפה על הנעל של הרגל שדוחפת, ואיזה חיכוך זה?
    choices:
      - text: קדימה, וזה חיכוך סטטי.
        correct: true
        feedback: נכון. ולמה דווקא קדימה, ולמה סטטי?
      - text: אחורה, וזה חיכוך קינטי.
        feedback: >-
          הנעל לא מחליקה על הרצפה (אם היא הייתה מחליקה, הייתם נופלים), ולכן החיכוך סטטי. והוא פונה קדימה, כי הוא
          הכוח שמאיץ אתכם קדימה.
        misconception: MC-2-friction-opposes-motion
      - text: קדימה, וזה חיכוך קינטי.
        feedback: 'הכיוון נכון, אבל חיכוך קינטי פועל רק כשיש החלקה. הנעל שדוחפת נחה על הרצפה עד שהיא מתרוממת.'
      - text: אין חיכוך. השרירים של הרגליים דוחפים את הגוף קדימה.
        feedback: >-
          כוחות השרירים פנימיים: הם פועלים בין חלקים של הגוף, בזוגות שמתבטלים בסכום. על קרח חלק השרירים עובדים, ובכל
          זאת אי אפשר לצאת לדרך. מה שמאיץ את הגוף הוא כוח חיצוני, החיכוך.
        misconception: MC-2-no-friction-without-sliding
    reasons:
      - text: הנעל דוחפת את הרצפה אחורה, והרצפה דוחפת אותה קדימה. הנעל לא מחליקה, ולכן החיכוך סטטי, והוא הכוח החיצוני האופקי היחיד על ההולך.
        correct: true
        feedback: >-
          זה הנימוק. החיכוך מתנגד להחלקה שהייתה נוצרת, החלקה של הנעל אחורה, ולכן הוא פונה קדימה. בלי חיכוך, כמו על
          קרח, הרגל הייתה מחליקה אחורה במקום לדחוף.
      - text: חיכוך תמיד פונה נגד כיוון התנועה של הגוף.
        feedback: 'חיכוך מתנגד להחלקה **יחסית** בין שני משטחים, לא לתנועה של הגוף ביחס לקרקע. ההולך נע קדימה, והחיכוך עליו קדימה.'
        misconception: MC-2-friction-opposes-motion
      - text: חיכוך קינטי גדול מחיכוך סטטי, ולכן הוא שמאפשר את ההליכה.
        feedback: 'בדרך כלל $\mu_k < \mu_s$, ובכל מקרה מה שקובע איזה חיכוך פועל הוא אם יש החלקה, ובהליכה אין.'
    hints:
      - 'מה הנעל עושה לרצפה כשהרגל דוחפת? ומה עושה הרצפה לנעל, לפי החוק השלישי?'

  - id: Q-2.4-stops-on-slope
    type: numeric
    objectives: [OBJ-2.4-1]
    level: bagrut
    prompt: >-
      גוש בעל מסה $3.0\,\text{kg}$ נשלח במעלה מדרון בזווית $25^\circ$. בין הגוש למדרון $\mu_s = 0.50$ ו-$\mu_k = 0.40$.
      הגוש מאט, ונעצר לרגע בנקודה הגבוהה ביותר שלו. מה גודל כוח החיכוך של המדרון על הגוש מהרגע הזה והלאה?
    answer: 12.4
    unit: N
    correctFeedback: >-
      נכון. ברגע העצירה אין החלקה, ולכן מריצים את המתכון מחדש. מניחים שהגוש נשאר במנוחה: לאורך המדרון
      $f_s = mg\sin\theta = 12.4\,\text{N}$, במעלה המדרון. בודקים מול הערך המרבי: $\mu_sN = \mu_smg\cos\theta = 13.3\,\text{N}$,
      יותר מזה, ולכן ההנחה נכונה והגוש נשאר. בעלייה החיכוך היה קינטי ופנה **במורד**; עכשיו הוא סטטי ופונה **במעלה**.
      **בדיקת גבולות:** הגוש נשאר כי $\tan25^\circ = 0.466 < \mu_s$. במדרון שזוויתו מעל זווית הסף הוא היה מחליק בחזרה,
      עם חיכוך קינטי.
    wrongFeedback: >-
      ברגע שהגוש נעצר, החיכוך הקינטי מפסיק לפעול. הניחו שהגוש נשאר במנוחה, מצאו איזה חיכוך זה דורש, ובדקו אם הוא לא
      עובר את $\mu_sN$.
    commonWrong:
      - value: 10.7
        feedback: >-
          זה $\mu_kN$, החיכוך בזמן העלייה. אחרי שהגוש נעצר אין החלקה, ולכן החיכוך הקינטי כבר לא פועל: צריך לבדוק מחדש אם
          החיכוך הסטטי מחזיק אותו.
        misconception: MC-2-kinetic-when-at-rest
      - value: 13.3
        feedback: >-
          זה $\mu_sN$, החיכוך הסטטי **המרבי**. הגוש במנוחה צריך רק חיכוך שמאזן את $mg\sin\theta = 12.4\,\text{N}$, וזה מה
          שפועל. $\mu_sN$ משמש רק כדי לבדוק שהחיכוך הזה אפשרי.
        misconception: MC-2-static-friction-always-max
      - value: 11.8
        feedback: 'זה $\mu_kmg$: גם חיכוך קינטי וגם $N = mg$. על מדרון $N = mg\cos\theta$, ואחרי העצירה החיכוך סטטי.'
        misconception: MC-2-normal-equals-weight
    hints:
      - 'אחרי העצירה, האם יש החלקה? אם לא, איזה חיכוך פועל, ומה קובע את הגודל שלו?'
      - 'הניחו שהגוש נשאר, ובדקו: האם $mg\sin\theta \le \mu_smg\cos\theta$?'

  # ---------------------------------------------------------------- OBJ-2.4-2 friction problems: threshold angle, stacked blocks
  - id: Q-2.4-threshold
    type: numeric
    objectives: [OBJ-2.4-2]
    level: basic
    prompt: >-
      מניחים מטבע על כריכה של ספר ומרימים בהדרגה צד אחד של הספר. מקדם החיכוך הסטטי בין המטבע לכריכה
      $\mu_s = 0.45$. באיזו זווית שיפוע, במעלות, המטבע מתחיל להחליק?
    answer: 24.2
    unit: °
    correctFeedback: >-
      נכון. עד הסף, לאורך המדרון $f = mg\sin\theta$, ובניצב $N = mg\cos\theta$. בסף $f = \mu_sN$, ולכן
      $\tan\theta = \mu_s$, ו-$\theta = \arctan0.45 = 24.2^\circ$. מודדים כך את $\mu_s$: מספיק למדוד זווית.
    wrongFeedback: 'בסף, החיכוך הסטטי שווה לערך המרבי שלו, $\mu_sN$. כתבו את החוק השני לאורך המדרון ובניצב לו.'
    commonWrong:
      - value: 26.7
        feedback: 'פתרתם $\sin\theta = \mu_s$. הכוח הנורמלי הוא $mg\cos\theta$, ולכן היחס בין שני הכוחות הוא $\tan\theta$.'
      - value: 65.8
        feedback: >-
          פתרתם $\tan\theta = 1/\mu_s$: החלפתם את הרכיבים. רכיב הכובד **לאורך** המדרון הוא $mg\sin\theta$, והניצב הוא
          $mg\cos\theta$. בדקו בגבול: בלי חיכוך, $\mu_s = 0$, המטבע מחליק בכל זווית, כלומר הזווית צריכה להיות אפס.
    hints:
      - 'מה היחס בין $mg\sin\theta$ ל-$mg\cos\theta$?'

  - id: Q-2.4-incline-mass
    type: mc
    objectives: [OBJ-2.4-2]
    qualitative: true
    level: mid
    prompt: >-
      על כריכה של ספר מונחים שני מטבעות מאותו חומר, אחד כבד פי 2 מהשני. מרימים בהדרגה צד אחד של הספר, כך שהכריכה
      הופכת למדרון שזוויתו גדלה. מה קורה?
    choices:
      - text: שניהם מתחילים להחליק באותה זווית.
        correct: true
        feedback: >-
          נכון. גם הכוח שמושך את המטבע במורד, $mg\sin\theta$, וגם החיכוך המרבי, $\mu_smg\cos\theta$, פרופורציוניים
          למסה, והיא מצטמצמת: $\tan\theta = \mu_s$ תלוי רק במשטחים.
      - text: הכבד מתחיל להחליק ראשון, כי הכובד מושך אותו חזק יותר במורד.
        feedback: >-
          הכובד מושך אותו פי 2, אבל גם לוחץ אותו פי 2 אל הכריכה, ולכן גם החיכוך המרבי שלו גדול פי 2. היחס לא משתנה.
        misconception: MC-2-heavier-slips-sooner
      - text: הקל מתחיל להחליק ראשון, כי הכבד לוחץ חזק יותר ולכן נאחז טוב יותר.
        feedback: >-
          הכבד באמת לוחץ חזק יותר, אבל גם נמשך במורד חזק יותר, באותו יחס. בסף שני הגורמים מתאזנים באותה זווית.
        misconception: MC-2-heavier-slips-sooner
      - text: זה תלוי בגודל של המטבעות, כי למטבע גדול יש יותר שטח מגע.
        feedback: >-
          במודל של החיכוך היבש, $f \le \mu_sN$, השטח לא מופיע. מטבע גדול לוחץ על יותר שטח, אבל כל סנטימטר נלחץ פחות.
    hints:
      - 'כתבו את תנאי הסף, ובדקו אם המסה נשארת בו.'

  - id: Q-2.4-pull-angle
    type: numeric
    objectives: [OBJ-2.4-2]
    level: mid
    prompt: >-
      מושכים ארגז בעל מסה $20\,\text{kg}$ על רצפה אופקית בעזרת חבל, בכוח $100\,\text{N}$ בזווית $30^\circ$ מעל
      האופק. הארגז מחליק, ומקדם החיכוך הקינטי $\mu_k = 0.30$. מה התאוצה של הארגז?
    answer: 2.14
    unit: m/s²
    correctFeedback: >-
      נכון. באנך אין תאוצה: $N + F\sin\theta - mg = 0$, ולכן $N = 196 - 50 = 146\,\text{N}$. החבל מרים חלק מהכובד,
      והחיכוך קטן: $f = \mu_kN = 43.8\,\text{N}$. באופק: $a = \dfrac{F\cos\theta - f}{m} = \dfrac{86.6 - 43.8}{20} = 2.14\,\text{m/s}^2$.
    wrongFeedback: 'מצאו קודם את הכוח הנורמלי מהחוק השני באנך, עם הרכיב האנכי של החבל. רק אז חשבו את החיכוך.'
    commonWrong:
      - value: 1.39
        feedback: >-
          לקחתם $N = mg$. החבל מושך גם כלפי מעלה, $F\sin\theta = 50\,\text{N}$, ולכן הרצפה צריכה לדחוף פחות:
          $N = 146\,\text{N}$, והחיכוך קטן בהתאם.
        misconception: MC-2-normal-equals-weight
      - value: 2.81
        feedback: 'הצבתם את כל $100\,\text{N}$ באופק. רק הרכיב $F\cos\theta = 86.6\,\text{N}$ מאיץ את הארגז.'
      - value: 0.859
        feedback: >-
          החלפתם בין $\sin$ ל-$\cos$: לקחתם $F\cos\theta$ כרכיב האנכי ו-$F\sin\theta$ כאופקי. הזווית נמדדת **מהאופק**, ולכן
          הרכיב האופקי הוא $F\cos\theta = 86.6\,\text{N}$, והאנכי $F\sin\theta = 50\,\text{N}$. בדיקה מהירה: כש-$\theta \to 0$
          כל הכוח צריך להיות אופקי, ו-$\cos0 = 1$.
    hints:
      - 'הרכיב האנכי של המשיכה הוא $F\sin\theta$. מה הוא עושה לכוח הנורמלי?'


  - id: Q-2.4-stack-max
    type: numeric
    objectives: [OBJ-2.4-2]
    level: bagrut
    prompt: >-
      גוש A בעל מסה $3.0\,\text{kg}$ מונח על גוש B בעל מסה $2.0\,\text{kg}$, ו-B מונח על רצפה. בין הגושים מקדם החיכוך
      הסטטי $\mu_s = 0.50$. בין B לרצפה מקדם החיכוך $0.10$ (סטטי וקינטי). מושכים את A, **העליון**, בכוח אופקי $F$,
      והגושים נעים יחד על הרצפה. מה הכוח המרבי שבו הגושים עוד נעים יחד?
    answer: 29.4
    unit: N
    correctFeedback: >-
      נכון. הגוש שמקבל את התאוצה שלו מהחיכוך בין הגושים הוא B, אבל עכשיו פועל עליו גם חיכוך הרצפה, $0.10\,(m_A + m_B)g = 4.90\,\text{N}$
      אחורה. לכן $m_Ba = f - 0.10\,(m_A + m_B)g$, ו-$f \le \mu_sm_Ag = 14.7\,\text{N}$ נותן $a_{\max} = 4.90\,\text{m/s}^2$.
      לשני הגושים יחד: $F - 0.10\,(m_A + m_B)g = (m_A + m_B)a$, ולכן $F_{\max} = 4.90 + 5.0\cdot4.90 = 29.4\,\text{N}$.
      **בדיקת גבולות:** כשמקדם הרצפה שואף לאפס מתקבל הכוח של רצפה חלקה, $(m_A + m_B)\mu_sg\,m_A/m_B = 36.8\,\text{N}$:
      החיכוך של הרצפה מקטין את הכוח המרבי, כי חלק מהחיכוך בין הגושים מושקע בהתגברות עליו.
    wrongFeedback: >-
      התחילו מ-B: אילו כוחות אופקיים פועלים עליו כשמושכים את A? מצאו את התאוצה המרבית שלו כשהחיכוך מ-A מגיע לערך המרבי
      שלו, ורק אז כתבו את החוק השני לשני הגושים יחד.
    commonWrong:
      - value: 36.8
        feedback: >-
          זה הכוח המרבי על רצפה **חלקה**, $(m_A + m_B)\mu_sg\,m_A/m_B$. כאן הרצפה מפעילה על B חיכוך אחורה, $4.90\,\text{N}$,
          והוא נכנס גם לחוק השני של B וגם לחוק השני של שני הגושים יחד.
      - value: 24.5
        feedback: >-
          זה $\mu_s(m_A + m_B)g$, הנוסחה של משיכת הגוש **התחתון** על רצפה חלקה (או ההנחה שהחיכוך בין הגושים פועל על שניהם
          יחד מול הרצפה). כאן מושכים את A, ולכן החיכוך בין הגושים הוא שמאיץ את B, ולא את A.
        misconception: MC-2-max-force-is-friction-limit
      - value: 14.7
        feedback: >-
          זה החיכוך המרבי בין הגושים, $\mu_sm_Ag$. הכוח $F$ צריך להאיץ את **שני** הגושים ולהתגבר על חיכוך הרצפה, ולכן הוא
          גדול ממנו.
        misconception: MC-2-max-force-is-friction-limit
      - value: 44.1
        feedback: >-
          חיברתם את מקדם הרצפה במקום לחסר אותו: $(\mu_s + 0.10)$. חיכוך הרצפה על B פועל **אחורה**, נגד החיכוך מ-A, ולכן
          הוא מקטין את התאוצה המרבית של B.
    hints:
      - 'כשמושכים את A, על B פועלים באופק שני כוחות: החיכוך מ-A קדימה, וחיכוך הרצפה אחורה.'
      - 'הכוח הנורמלי של הרצפה על B הוא $(m_A + m_B)g$.'

  - id: Q-2.4-stack-top
    type: twotier
    objectives: [OBJ-2.4-2]
    qualitative: true
    level: bagrut
    prompt: >-
      גוש A בעל מסה $4.0\,\text{kg}$ מונח על גוש B בעל מסה $1.0\,\text{kg}$, ו-B על רצפה חלקה. בין הגושים $\mu_s = 0.30$.
      פעם מושכים אופקית את B, התחתון, ופעם את A, העליון. באיזה מקרה הכוח המרבי שבו הגושים עוד נעים יחד גדול יותר?
    choices:
      - text: כשמושכים את A, העליון, הכוח המרבי גדול פי 4.
        correct: true
        feedback: נכון. ולמה דווקא פי 4?
      - text: כשמושכים את B, התחתון, כי משיכת הגוש העליון תמיד מקטינה את הכוח המרבי.
        feedback: >-
          זה נכון רק כשהגוש העליון קל מהתחתון. הכוח המרבי נקבע לפי הגוש שהחיכוך הוא הכוח היחיד עליו: כשמושכים את A זה B,
          ו-B כאן קל פי 4, ולכן קל לחיכוך להאיץ אותו.
      - text: הכוח המרבי זהה, כי החיכוך המרבי בין הגושים לא משתנה.
        feedback: >-
          החיכוך המרבי, $\mu_sm_Ag$, אכן לא משתנה, אבל הוא מאיץ כל פעם גוש אחר: פעם את A ($4.0\,\text{kg}$) ופעם את B
          ($1.0\,\text{kg}$). התאוצה המשותפת המרבית שונה, ולכן גם הכוח.
        misconception: MC-2-max-force-is-friction-limit
    reasons:
      - text: 'החיכוך מגביל את התאוצה של הגוש שהוא הכוח האופקי היחיד עליו: כשמושכים את B זה A, $a_{\max} = \mu_sg$; כשמושכים את A זה B, $a_{\max} = \mu_sg\,m_A/m_B$.'
        correct: true
        feedback: >-
          זה הנימוק. משיכת B: $F_{\max} = (m_A + m_B)\mu_sg = 14.7\,\text{N}$. משיכת A: $F_{\max} = (m_A + m_B)\mu_sg\,m_A/m_B = 58.8\,\text{N}$.
          היחס הוא $m_A/m_B = 4$. **בדיקת גבולות:** כש-$m_A = m_B$ שתי המשיכות נותנות אותו כוח מרבי.
      - text: הכוח המרבי הוא תמיד $\mu_sm_Ag$, החיכוך המרבי, ולא משנה איפה מושכים.
        feedback: 'הכוח המרבי מאיץ את שני הגושים, ולכן הוא תמיד גדול מהחיכוך המרבי, פי $(m_A + m_B)$ חלקי המסה שהחיכוך מאיץ.'
        misconception: MC-2-max-force-is-friction-limit
      - text: כשמושכים את הגוש העליון, הכוח הנורמלי בין הגושים קטן.
        feedback: 'המשיכה אופקית, ולכן היא לא משנה את הכוח הנורמלי בין הגושים: הוא עדיין $m_Ag$.'
    hints:

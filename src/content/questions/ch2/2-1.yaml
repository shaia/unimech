# Lesson 2.1 question bank: the comprehension ladder of "מערכות אינרציאליות והחוק השני".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), script .scratch/ch2/q.ts:
#   Earth's rotation at the equator: ω²R = (7.29e-5)²·6.37e6 = 0.0339 m/s² = 0.35% of g; ωR = 464 m/s;
#   g at 400 km: 9.8·(6.37/6.77)² = 8.68 m/s²;
#   puck: a = ((3,4) + (-1,2))/2 = (1,3) m/s², |a| = 3.16 (magnitudes added: 3.62; not divided by m: 6.32);
#   incline 30°, m = 2 kg, horizontal 20 N: a = (20cos30° - 2·9.8·sin30°)/2 = 3.76 m/s² (no projection 5.10,
#   no gravity 8.66), N = 26.97 N; hanging bob in a car at 2.5 m/s²: θ = atan(2.5/9.8) = 14.3° (atan(g/a) = 75.7°).
# Review fixes, script .scratch/ch2/2-1/review.ts:
#   incline-push, sin↔cos swap on F: (20 sin30° − 9.8)/2 = 0.100 m/s²;
#   earth-rotation moved to Jupiter (T = 9.93 h, R = 7.15e7 m): ω = 1.758e-4 rad/s, ω²R = 2.21 m/s² (22.5% of g,
#   65× Earth's 0.0339); ωR = 1.26e4 m/s; hours not converted 2.86e7; ω = 1/T without 2π: 0.0560.

chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.1-1 inertial frames
  - id: Q-2.1-braking-train
    type: mc
    objectives: [OBJ-2.1-1]
    qualitative: true
    level: basic
    prompt: >-
      רכבת נוסעת בקו ישר ובולמת. קובייה קטנה של קרח מונחת על רצפה חלקה לגמרי של הקרון, ובזמן הבלימה היא מתחילה
      להחליק קדימה, בכיוון הנסיעה, אף שאף גוף לא דוחף אותה אופקית. מה המסקנה הנכונה?
    choices:
      - text: הקרון איננו מערכת ייחוס אינרציאלית. ביחס לקרקע הקובייה ממשיכה במהירות שהייתה לה, והקרון מאט מתחתיה.
        correct: true
        feedback: >-
          נכון. במערכת הקרקע, שהיא אינרציאלית בקירוב טוב, הכוח השקול האופקי על הקובייה אפס, ולכן המהירות שלה לא משתנה.
          הקרון הוא שמאט. בקרון הקובייה מאיצה בלי כוח, כלומר החוק הראשון לא מתקיים בו: זו בדיוק ההגדרה של מערכת
          ייחוס שאיננה אינרציאלית.
      - text: הבלימה יוצרת כוח קדימה שפועל על הקובייה.
        feedback: >-
          לכל כוח יש גוף שמפעיל אותו, וכאן אין גוף כזה: הרצפה חלקה, ושום דבר אחר לא נוגע בקובייה. במערכת הקרקע רואים
          שהקובייה בכלל לא מאיצה. "הכוח קדימה" הוא רק מה שמי שיושב בקרון צריך להמציא כדי להסביר את מה שהוא רואה.
        misconception: MC-2-noninertial-force-real
      - text: האינרציה של הקובייה היא כוח שדוחף אותה קדימה.
        feedback: >-
          אינרציה איננה כוח: היא הנטייה של גוף לשמור על המהירות שלו כשהכוח השקול עליו אפס. היא לא מופיעה בתרשים
          הכוחות, ואין לה גוף שמפעיל אותה.
        misconception: MC-2-inertia-is-force
      - text: הקרון הוא מערכת ייחוס אינרציאלית, כי הוא נע בקו ישר.
        feedback: >-
          קו ישר לא מספיק. מערכת אינרציאלית נעה ביחס למערכת אינרציאלית אחרת במהירות קבועה, בגודל ובכיוון. קרון שבולם
          מאיץ, ולכן הוא לא אינרציאלי, גם אם הוא נוסע בקו ישר.
        misconception: MC-2-uniform-motion-inertial
    hints:
      - 'תארו את התנועה של הקובייה ממערכת הקרקע. האם המהירות שלה משתנה שם?'

  - id: Q-2.1-which-inertial
    type: multi
    objectives: [OBJ-2.1-1]
    qualitative: true
    level: mid
    prompt: >-
      ניסוי של כמה שניות בודק את החוק השני בדיוק של אחוז אחד: תאוצה של המערכת עצמה שקטנה מאחוז אחד של
      $g$ לא תורגש בו. אילו ממערכות הייחוס הבאות הן מערכות ייחוס אינרציאליות לצורך הניסוי? סמנו את כולן.
    choices:
      - text: מעבדה על פני כדור הארץ, על קו המשווה.
        correct: true
        feedback: >-
          נכון, בקירוב. המעבדה מסתובבת עם כדור הארץ, והתאוצה הצנטריפטלית שלה היא
          $\omega^2R \approx 0.034\,\text{m/s}^2$, כ-0.35% של $g$: פחות מהדיוק של הניסוי. בניסויים ארוכים או רגישים
          יותר הסיבוב כבר נמדד, למשל במטוטלת פוקו (פרק 7).
      - text: מכונית שנוסעת בכביש ישר ואופקי במהירות קבועה של $100\,\text{km/h}$.
        correct: true
        feedback: >-
          נכון. היא נעה ביחס לקרקע במהירות קבועה בגודל ובכיוון, ולכן לפי טרנספורמציית גליליי התאוצה של כל גוף זהה
          בשתי המערכות. אם הקרקע אינרציאלית, גם המכונית.
      - text: רכבת שבולמת בתאוצה שגודלה $2\,\text{m/s}^2$ בקו ישר.
        feedback: >-
          התאוצה שלה היא כ-20% של $g$, הרבה מעל הדיוק של הניסוי. תנועה בקו ישר לא הופכת אותה לאינרציאלית: צריך
          מהירות קבועה.
        misconception: MC-2-uniform-motion-inertial
      - text: תחנת חלל שמקיפה את כדור הארץ בגובה $400\,\text{km}$.
        feedback: >-
          התחנה מאיצה לעבר כדור הארץ, בתאוצה של כ-$8.7\,\text{m/s}^2$: בגובה הזה הכובד הוא כ-89% מהכובד על פני
          הקרקע. בתחנה גוף שמשתחרר נשאר במנוחה, אף שכוח הכובד פועל עליו, ולכן החוק השני לא מתקיים בה כמו שהוא.
        misconception: MC-2-weightless-no-gravity
      - text: קרוסלה שמסתובבת בקצב קבוע.
        feedback: >-
          קצב קבוע של סיבוב איננו מהירות קבועה: כל נקודה בקרוסלה משנה כל הזמן את כיוון המהירות שלה, ולכן מאיצה לעבר
          הציר.
        misconception: MC-2-uniform-motion-inertial
    hints:
      - 'מערכת אינרציאלית נעה ביחס למערכת אינרציאלית אחרת במהירות קבועה, בגודל ובכיוון. לכל מערכת, העריכו את התאוצה שלה והשוו ל-1% של $g$.'

  - id: Q-2.1-earth-rotation
    type: numeric
    objectives: [OBJ-2.1-1]
    level: mid
    prompt: >-
      כוכב הלכת צדק מסתובב סביב הציר שלו פעם ב-$9.93$ שעות, והרדיוס שלו בקו המשווה הוא
      $R = 7.15\cdot10^{7}\,\text{m}$. גשושית מרחפת בעננים מעל קו המשווה של צדק ומסתובבת יחד איתו. מה גודל התאוצה
      שלה ביחס למערכת שראשיתה במרכז צדק והצירים שלה פונים אל כוכבים רחוקים?
    answer: 2.21
    unit: m/s²
    correctFeedback: >-
      נכון. קודם המהירות הזוויתית, עם זמן המחזור בשניות:
      $\omega = \dfrac{2\pi}{9.93\cdot3600\,\text{s}} = 1.76\cdot10^{-4}\,\text{rad/s}$. אחר כך
      $a = \omega^2R = 2.21\,\text{m/s}^2$, פי 65 מהתאוצה של מעבדה על קו המשווה של כדור הארץ, ו-22.5% של $g$.
      מערכת שמסתובבת עם צדק רחוקה מאוד מלהיות אינרציאלית בדיוק של אחוז: הסיבוב המהיר והרדיוס הגדול מכפילים זה את זה.
    wrongFeedback: >-
      נקודה שנעה במעגל ברדיוס $R$ במהירות זוויתית $\omega$ מאיצה לעבר המרכז בתאוצה $\omega^2R$, ו-$\omega = 2\pi/T$, עם
      $T$ בשניות.
    commonWrong:
      - value: 12600
        feedback: 'זה $\omega R$, גודל **המהירות** של הגשושית, ביחידות $\text{m/s}$. את התאוצה נותן $\omega^2R$.'
      - value: 28600000
        feedback: >-
          השארתם את זמן המחזור בשעות. ב-$\omega = 2\pi/T$ הזמן צריך להיות בשניות, $9.93\cdot3600\,\text{s}$, אחרת
          $\omega$ גדול פי 3600 והתאוצה פי $3600^2$.
      - value: 0.056
        feedback: >-
          חישבתם $\omega = 1/T$. בזמן מחזור אחד הגשושית עוברת סיבוב שלם, $2\pi$ רדיאנים, ולכן $\omega = 2\pi/T$.
    hints:
      - 'מצאו קודם את $\omega$ מזמן המחזור. סיבוב שלם הוא $2\pi$ רדיאנים, ושעה היא $3600\,\text{s}$.'
      - 'בדקו יחידות: $\text{rad}^2/\text{s}^2$ כפול מטרים הן יחידות של תאוצה.'

  - id: Q-2.1-station
    type: twotier
    objectives: [OBJ-2.1-1]
    qualitative: true
    level: bagrut
    prompt: >-
      אסטרונאוטית בתחנת חלל שמקיפה את כדור הארץ בגובה $400\,\text{km}$ משחררת עט, והעט נשאר במנוחה ביחס לתחנה.
      האם התחנה היא מערכת ייחוס אינרציאלית?
    choices:
      - text: לא.
        correct: true
        feedback: 'נכון. אבל חשוב הנימוק: למה גוף שנשאר במנוחה מראה דווקא שהמערכת **לא** אינרציאלית?'
      - text: כן, כי גוף שמשתחרר נשאר בה במנוחה, כמו שהחוק הראשון אומר.
        feedback: >-
          החוק הראשון מדבר על גוף שהכוח השקול עליו אפס. על העט פועל כוח הכובד, ובכל זאת הוא לא מאיץ ביחס לתחנה. זה
          סותר את החוק השני, לא מקיים את הראשון.
        misconception: MC-2-weightless-no-gravity
      - text: כן, כי התחנה נעה במהירות קבועה בגודלה.
        feedback: >-
          גודל המהירות קבוע, אבל הכיוון שלה משתנה כל הזמן: התחנה מאיצה לעבר מרכז כדור הארץ. מערכת אינרציאלית צריכה
          מהירות קבועה גם בכיוון.
        misconception: MC-2-uniform-motion-inertial
    reasons:
      - text: 'על העט פועל כובד של כ-$8.7\,\text{N}$ לכל קילוגרם, ובכל זאת הוא לא מאיץ ביחס לתחנה: בתחנה החוק השני לא מתקיים בלי להוסיף כוח.'
        correct: true
        feedback: >-
          זה הנימוק. במערכת של מרכז כדור הארץ, העט והתחנה נופלים יחד באותה תאוצה. עם
          $R_E = 6.37\cdot10^{6}\,\text{m}$, רדיוס כדור הארץ, ו-$h = 400\,\text{km}$, התאוצה הזו היא
          $g\left(\dfrac{R_E}{R_E + h}\right)^2 = 9.8\cdot\left(\dfrac{6.37}{6.77}\right)^2 = 8.68\,\text{m/s}^2$, ולכן אין
          ביניהם תאוצה יחסית.
      - text: בגובה הזה כמעט אין כובד, ולכן העט צף.
        feedback: >-
          בגובה $400\,\text{km}$ הכובד הוא כ-89% מהכובד על פני הקרקע. העט "צף" כי הוא והתחנה נופלים יחד, לא כי
          אין כובד. בלי כובד התחנה הייתה ממשיכה בקו ישר ומתרחקת מכדור הארץ.
        misconception: MC-2-weightless-no-gravity
      - text: התחנה רחוקה מכל גוף אחר, ולכן אף כוח לא פועל עליה.
        feedback: 'כדור הארץ מושך את התחנה, וזה הכוח שמכופף את המסלול שלה למעגל. בלעדיו לא היה מסלול.'
    hints:
      - 'כתבו את החוק השני לעט במערכת של התחנה: מה הכוחות עליו, ומה התאוצה שלו שם?'
    explanation: >-
      התחנה איננה מערכת אינרציאלית: היא מאיצה לעבר כדור הארץ בכ-$8.7\,\text{m/s}^2$, וכל מה שבתוכה נופל יחד איתה.
      לכן את החוק השני כותבים במערכת של מרכז כדור הארץ, ולא במערכת התחנה. (איך עובדים בכל זאת במערכת שמאיצה, כמו
      התחנה, נלמד בפרק 7.)

  # ---------------------------------------------------------------- OBJ-2.1-2 the second law in components
  - id: Q-2.1-moon-push
    type: mc
    objectives: [OBJ-2.1-2]
    qualitative: true
    level: basic
    prompt: >-
      על הירח תאוצת הנפילה קטנה בערך פי 6 מאשר על כדור הארץ. אסטרונאוטית דוחפת שם עגלה על מסילה אופקית בלי חיכוך.
      כדי לתת לעגלה אותה תאוצה אופקית שהייתה מקבלת על כדור הארץ, באיזה כוח אופקי היא צריכה לדחוף?
    choices:
      - text: באותו כוח כמו על כדור הארץ.
        correct: true
        feedback: >-
          נכון. ברכיב האופקי $F_x = ma_x$, והמסה $m$ של העגלה, ההתנגדות שלה לשינוי מהירות, זהה בכל מקום. הכובד
          קטן על הירח, אבל הוא אנכי, ואין לו תפקיד בכיוון האופקי.
      - text: בכוח קטן בערך פי 6.
        feedback: >-
          פי 6 קטן **המשקל**, $mg$, הכוח שהירח מושך בו את העגלה. המסה, שקובעת כמה קשה להאיץ אותה, לא משתנה. גם
          בחלל, בלי כובד בכלל, צריך כוח כדי להאיץ עגלה.
        misconception: MC-2-mass-is-weight
      - text: כמעט בלי כוח, כי העגלה כמעט לא שוקלת שם.
        feedback: >-
          המשקל והמסה הם שני גדלים שונים. המשקל קטן, אבל בכיוון האופקי מה שקובע הוא $F_x = ma_x$, עם אותה מסה.
        misconception: MC-2-mass-is-weight
      - text: בכוח גדול יותר, כי על הירח אין אוויר שעוזר לעגלה לנוע.
        feedback: 'אוויר רק מתנגד לתנועה, ובמהירות נמוכה ההשפעה שלו זניחה. בלעדיו צריך, אם בכלל, קצת פחות כוח.'
    hints:
      - 'כתבו את החוק השני רק ברכיב האופקי. איזה גודל משתנה בין כדור הארץ לירח?'

  - id: Q-2.1-components
    type: numeric
    objectives: [OBJ-2.1-2]
    level: basic
    prompt: >-
      דסקית בעלת מסה $2.0\,\text{kg}$ מונחת על שולחן אוויר אופקי בלי חיכוך. במבט מלמעלה, ציר $x$ פונה מזרחה וציר
      $y$ צפונה. פועלים עליה שני כוחות אופקיים, $\vec F_1 = (3.0,\ 4.0)\,\text{N}$ ו-$\vec F_2 = (-1.0,\ 2.0)\,\text{N}$
      (הכובד והכוח של השולחן אנכיים ומאזנים זה את זה). מה גודל התאוצה של הדסקית?
    answer: 3.16
    unit: m/s²
    correctFeedback: >-
      נכון. ברכיבים, $\sum\vec F = (2.0,\ 6.0)\,\text{N}$, ולכן $\vec a = \sum\vec F/m = (1.0,\ 3.0)\,\text{m/s}^2$
      והגודל $\sqrt{1.0^2 + 3.0^2} = 3.16\,\text{m/s}^2$.
    wrongFeedback: 'חברו את הכוחות רכיב אחר רכיב, חלקו כל רכיב במסה, ורק בסוף חשבו גודל.'
    commonWrong:
      - value: 3.62
        feedback: >-
          חיברתם את **הגדלים**, $5.0 + 2.24 = 7.24\,\text{N}$. כוחות הם וקטורים: הם מתחברים ברכיבים, וגודל הסכום קטן
          מסכום הגדלים כשהכוחות לא באותו כיוון.
        misconception: MC-2-add-magnitudes
      - value: 6.32
        feedback: 'זה גודל הכוח השקול בניוטון, $\sqrt{2^2 + 6^2}$. התאוצה היא הכוח השקול חלקי המסה.'
    hints:
      - '$\sum F_x = F_{1x} + F_{2x}$, ובאותו אופן ב-$y$.'

  - id: Q-2.1-puck-direction
    type: vector
    objectives: [OBJ-2.1-2]
    qualitative: true
    level: mid
    prompt: >-
      דסקית על משטח קרח אופקי וחלק נעה מזרחה. ברגע מסוים מושכים אותה שני חבלים אופקיים: אחד בכוח $6\,\text{N}$
      צפונה, ואחד בכוח $6\,\text{N}$ מערבה. לאיזה כיוון התאוצה של הדסקית ברגע הזה? (מבט מלמעלה: צפון למעלה, מזרח
      ימינה.)
    answer: nw
    correctFeedback: >-
      נכון. $\vec a = \sum\vec F/m$ בכיוון הכוח השקול, $(-6,\ 6)\,\text{N}$: צפון-מערב. המהירות מזרחה לא משנה את
      כיוון התאוצה. היא רק קובעת לאן הדסקית נעה עכשיו: רכיב המהירות מזרחה יקטן, ויתווסף לה רכיב צפונה.
    wrong:
      - dir: e
        feedback: >-
          זה כיוון **המהירות**. החוק השני קושר את הכוח לתאוצה, לשינוי של המהירות, לא למהירות עצמה. הכוח השקול פונה
          לצפון-מערב.
        misconception: MC-2-acceleration-along-velocity
      - dir: ne
        feedback: >-
          הכוח מערבה לא מתבטל על ידי התנועה מזרחה: תנועה איננה כוח. ברכיב $x$ יש רק את הכוח מערבה, ולכן
          $a_x < 0$.
        misconception: MC-2-acceleration-along-velocity
      - dir: zero
        feedback: 'שני הכוחות ניצבים זה לזה, ולכן לא יכולים לבטל זה את זה. השקול שלהם $(-6,\ 6)\,\text{N}$.'
    wrongFeedback: 'חברו את שני הכוחות כווקטורים. התאוצה בכיוון השקול, בלי קשר לכיוון המהירות.'
    hints:
      - 'רשמו את שני הכוחות ברכיבים, $x$ מזרחה ו-$y$ צפונה, וחברו.'

  - id: Q-2.1-incline-push
    type: numeric
    objectives: [OBJ-2.1-2]
    level: mid
    prompt: >-
      גוש בעל מסה $2.0\,\text{kg}$ נמצא על מדרון חלק שזווית השיפוע שלו $30^\circ$. דוחפים אותו בכוח **אופקי**
      שגודלו $20\,\text{N}$, שפונה אל המדרון, כך שהוא דוחף את הגוש במעלה המדרון. מה גודל התאוצה של הגוש לאורך
      המדרון? (היא במעלה המדרון.)
    answer: 3.76
    unit: m/s²
    correctFeedback: >-
      נכון. בצירים לאורך המדרון ($x$, במעלה) וניצב לו ($y$): $ma_x = F\cos\theta - mg\sin\theta$, ולכן
      $a_x = \dfrac{20\cdot0.866 - 2.0\cdot9.8\cdot0.5}{2.0} = 3.76\,\text{m/s}^2$. ברכיב הניצב $a_y = 0$, ולכן הכוח
      הנורמלי $N = mg\cos\theta + F\sin\theta = 27.0\,\text{N}$, יותר מ-$mg\cos\theta$, כי גם הכוח שלכם לוחץ את הגוש
      אל המדרון.
    wrongFeedback: >-
      בחרו צירים לאורך המדרון וניצב לו, ופרקו כל כוח לשני הרכיבים. הכוח האופקי יוצר זווית $\theta$ עם המדרון.
    commonWrong:
      - value: 5.10
        feedback: >-
          הצבתם את כל $20\,\text{N}$ לאורך המדרון. הכוח אופקי, והמדרון נטוי ב-$30^\circ$: רק הרכיב
          $F\cos\theta = 17.3\,\text{N}$ פועל לאורך המדרון.
      - value: 8.66
        feedback: 'שכחתם את רכיב הכובד לאורך המדרון, $mg\sin\theta = 9.8\,\text{N}$, שפונה במורד.'
      - value: 0.1
        feedback: >-
          הצבתם $F\sin\theta = 10\,\text{N}$ לאורך המדרון. זה הרכיב של הכוח האופקי **הניצב** למדרון, זה שלוחץ את הגוש
          אל תוכו. לאורך המדרון פועל $F\cos\theta = 17.3\,\text{N}$. בדקו בגבול $\theta \to 0$: המדרון נעשה רצפה
          אופקית, והכוח האופקי כולו לאורכה, כלומר הרכיב לאורך המדרון צריך להיות $F\cos 0 = F$, לא $F\sin 0 = 0$.
    hints:
      - 'רכיב הכובד במורד המדרון הוא $mg\sin\theta$. מה הרכיב של כוח אופקי לאורך מדרון בזווית $\theta$?'
      - 'לא בטוחים אם $\sin$ או $\cos$? דמיינו $\theta \to 0$: רצפה אופקית, וכוח אופקי שכולו לאורכה.'

  - id: Q-2.1-accelerometer
    type: numeric
    objectives: [OBJ-2.1-2]
    level: bagrut
    prompt: >-
      משקולת קטנה תלויה בחוט מהתקרה של מכונית. המכונית מאיצה על כביש ישר ואופקי בתאוצה קבועה של
      $2.5\,\text{m/s}^2$, והמשקולת במנוחה ביחס למכונית, כשהחוט נטוי. מה הזווית בין החוט לאנך, במעלות?
    answer: 14.3
    unit: °
    correctFeedback: >-
      נכון. במערכת הקרקע, שהיא אינרציאלית, המשקולת מאיצה יחד עם המכונית. ברכיבים, עם $x$ בכיוון התאוצה:
      $T\sin\theta = ma$ ו-$T\cos\theta - mg = 0$. מחלקים: $\tan\theta = \dfrac{a}{g} = \dfrac{2.5}{9.8}$, ולכן
      $\theta = 14.3^\circ$, והחוט נוטה **אחורה**, נגד כיוון התאוצה. **בדיקת גבולות:** כש-$a \to 0$, $\theta \to 0$, חוט
      אנכי כמו במכונית שעומדת; כש-$a \gg g$, $\theta \to 90^\circ$. והמתיחות $T = m\sqrt{g^2 + a^2}$ חוזרת ל-$mg$
      כש-$a \to 0$.
    wrongFeedback: >-
      עבדו במערכת הקרקע. כתבו את החוק השני למשקולת בשני רכיבים: אופקי, שבו יש תאוצה, ואנכי, שבו אין.
    commonWrong:
      - value: 75.7
        feedback: >-
          זו הזווית בין החוט **לאופק**: חישבתם $\tan\theta = g/a$. בדקו בגבול: כשהמכונית לא מאיצה, החוט אנכי, כלומר
          הזווית לאנך צריכה להיות אפס, ולא $90^\circ$.
      - value: 0.255
        feedback: 'זה $a/g$, כלומר $\tan\theta$. הזווית עצמה היא $\arctan(0.255)$, במעלות.'
    hints:
      - 'הרכיב האופקי של המתיחות הוא הכוח היחיד שמאיץ את המשקולת קדימה.'
      - 'חלקו את המשוואה האופקית במשוואה האנכית: המתיחות מצטמצמת.'

# Lesson 2.5 question bank: the comprehension ladder of "אילוצים: גלגלות וטריזים נעים".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), script .scratch/ch2/q.ts:
#   Atwood 3 kg / 5 kg: a = 2g/8 = 2.45 m/s² (one mass in the denominator 3.92; (m2-m1)g/m1 = 6.53), T = 36.75 N;
#   three segments, free end at 0.60 m/s: the load rises at 0.20 m/s;
#   10 kg on a movable pulley held by two segments: T = 49 N;
#   m1 = 2.0 kg on the free end, m2 = 3.0 kg on the movable pulley (y1 + 2y2 = const):
#   a2 = (2m1 - m2)g/(4m1 + m2) = 0.891 m/s² up, a1 = 1.78 m/s² down, T = 16.0 N
#   (a1 = a2 assumed: 1.40; plain Atwood: 1.96);
# Review fixes (2026-11-09), script .scratch/ch2/2-5/review.ts (freeWedge, hangingPulleys of constraints.ts):
#   free wedge M = 4.0 kg, block m = 1.0 kg, θ = 30°, all smooth, x to the right, A signed:
#   A = −mg sinθ cosθ/(M + m sin²θ) = −0.998 m/s² (−0.998476), |A| = 0.998
#   (N = mg cosθ assumed: 1.06; M + m in the denominator: 0.849), N = −MA/sinθ = 7.99 N (7.98781) vs 8.49 N fixed;
#   three segments hold the movable pulley, at rest: 3T = m2 g, T = m1 g → m2/m1 = 3 (hangingPulleys(1, 3, 3): a = 0);
#   wedge-floor m = 2.0 kg, M = 2.0 kg, θ = 40°: N = mMg cosθ/(M + m sin²θ) = 10.6 N (10.6246), N cosθ = 8.14 N,
#   N_f = Mg + N cosθ = 27.7 N (27.7389) = (M + m)g + m a_y with a_y = −5.73 m/s², m a_y = −11.5 N
#   ((M + m)g = 39.2; fixed wedge Mg + mg cos²θ = 31.1 (31.1018); Mg = 19.6; Mg + N sinθ = 26.4 (26.4294)).

chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.5-1 constraint equations from fixed string lengths
  - id: Q-2.5-pulley-constraint
    type: mc
    objectives: [OBJ-2.5-1]
    qualitative: true
    level: basic
    prompt: >-
      חוט קשור לתקרה, יורד אל גלגלת נעה שגוש 2 תלוי עליה, עוקף אותה ועולה אל גלגלת קבועה בתקרה, ומשם יורד אל גוש 1,
      שתלוי בקצה החופשי. כל קטעי החוט אנכיים, והחוט לא נמתח. גוש 1 יורד $10\,\text{cm}$. מה קורה לגוש 2?
    choices:
      - text: הוא עולה $5\,\text{cm}$.
        correct: true
        feedback: >-
          נכון. נסמן ב-$y_1$ את העומק של גוש 1 מתחת לתקרה וב-$y_2$ את העומק של הגלגלת הנעה. האורך של החוט הוא
          $2y_2 + y_1$ ועוד קבוע, ולכן $\Delta y_1 = -2\,\Delta y_2$. גוש 1 יורד 10, ולכן שני הקטעים שמחזיקים את גוש 2
          מתקצרים יחד ב-10, כל אחד ב-5.
      - text: הוא עולה $10\,\text{cm}$.
        feedback: >-
          זה נכון בגלגלת קבועה, שבה שני הגופים תלויים על שני קצוות של אותו חוט. כאן גוש 2 תלוי על **שני** קטעים של
          החוט, וה-$10\,\text{cm}$ מתחלקים ביניהם.
        misconception: MC-2-constraint-equal-accel
      - text: הוא עולה $20\,\text{cm}$.
        feedback: >-
          הפכתם את היחס. בדקו בציור: כשגוש 2 עולה ב-$d$, כל אחד משני הקטעים שלו מתקצר ב-$d$, והחוט שהתפנה, $2d$,
          עובר לצד של גוש 1.
      - text: הוא יורד $5\,\text{cm}$.
        feedback: 'אם שני הגופים היו יורדים, החוט היה צריך להתארך. כשצד אחד מתארך, הצד השני מתקצר.'
    hints:
      - 'כתבו את האורך של החוט כסכום האורכים של הקטעים שלו, בעזרת $y_1$ ו-$y_2$.'

  - id: Q-2.5-atwood
    type: numeric
    objectives: [OBJ-2.5-1]
    level: basic
    prompt: >-
      במכונת אטווד, חוט חסר מסה עובר על גלגלת קבועה חסרת מסה וחסרת חיכוך, ובקצותיו תלויות משקולות
      $m_1 = 3.0\,\text{kg}$ ו-$m_2 = 5.0\,\text{kg}$. מה גודל התאוצה של המשקולות?
    answer: 2.45
    unit: m/s²
    correctFeedback: >-
      נכון. האילוץ: $y_1 + y_2 = \text{const}$, ולכן $a_1 = -a_2$, ואפשר לכתוב תאוצה אחת $a$, כלפי מטה ל-$m_2$.
      $m_2g - T = m_2a$ ו-$T - m_1g = m_1a$, ומחברים: $a = \dfrac{m_2 - m_1}{m_1 + m_2}\,g = \dfrac{2}{8}\cdot9.8 = 2.45\,\text{m/s}^2$.
    wrongFeedback: 'כתבו את החוק השני לכל משקולת. האילוץ אומר שהתאוצות שוות בגודלן והפוכות בכיוון.'
    commonWrong:
      - value: 3.92
        feedback: >-
          חילקתם רק ב-$m_2$. הכוח השקול $(m_2 - m_1)g$ מאיץ את **שתי** המשקולות, שקשורות זו לזו, ולכן מחלקים במסה
          הכוללת.
      - value: 6.53
        feedback: 'חילקתם ב-$m_1$. הכוח השקול מאיץ את שתי המשקולות יחד: $m_1 + m_2 = 8.0\,\text{kg}$.'
    hints:
      - 'חברו את שתי המשוואות, כך שהמתיחות תתבטל.'

  - id: Q-2.5-tackle
    type: numeric
    objectives: [OBJ-2.5-1]
    level: mid
    prompt: >-
      משא תלוי על גלגלת נעה. קצה של חוט קשור למסגרת של הגלגלת הנעה; מהקשר החוט עולה אל גלגלת קבועה בתקרה, יורד
      ועוקף את הגלגלת הנעה מלמטה, עולה אל גלגלת קבועה שנייה בתקרה, ומשם יורד אל הקצה החופשי. כך שלושה קטעים
      אנכיים של החוט מחזיקים את הגלגלת הנעה. מושכים את הקצה החופשי כלפי מטה במהירות $0.60\,\text{m/s}$. באיזו
      מהירות עולה המשא?
    answer: 0.20
    unit: m/s
    correctFeedback: >-
      נכון. אם המשא עולה ב-$d$, כל אחד משלושת הקטעים מתקצר ב-$d$, והקצה החופשי מתארך ב-$3d$: $v_{\text{free}} = 3v$,
      ולכן $v = 0.20\,\text{m/s}$. אותו אילוץ אומר גם שבמערכת חסרת מסה וחסרת חיכוך מחזיקים את המשא בשליש מהכובד שלו:
      מרוויחים בכוח ומשלמים במרחק.
    wrongFeedback: 'כתבו את האורך של החוט: שלושה קטעים באורך $y$ ועוד הקצה החופשי. גזרו לפי הזמן.'
    commonWrong:
      - value: 0.60
        feedback: 'זה נכון רק לחוט אחד שעובר מעל גלגלת קבועה. כאן המשא תלוי על שלושה קטעים, והם מתקצרים יחד.'
        misconception: MC-2-constraint-equal-accel
      - value: 1.8
        feedback: 'הכפלתם במקום לחלק. הקצה החופשי נע **יותר** מהר מהמשא: הוא אוסף את מה ששלושת הקטעים מוותרים עליו.'
      - value: 0.30
        feedback: >-
          חילקתם ב-2, כאילו רק שני הקטעים שעוקפים את הגלגלת הנעה מחזיקים אותה. גם הקטע שקשור למסגרת שלה מתקצר
          כשהיא עולה: שלושה קטעים.
    hints:
      - '$3y + \ell = \text{const}$, כאשר $y$ הוא העומק של המשא ו-$\ell$ האורך של הקצה החופשי.'

  # ---------------------------------------------------------------- OBJ-2.5-2 movable pulleys and wedges on a smooth floor
  - id: Q-2.5-hold-pulley
    type: numeric
    objectives: [OBJ-2.5-2]
    level: basic
    prompt: >-
      משא בעל מסה $10\,\text{kg}$ תלוי על גלגלת נעה חסרת מסה. החוט קשור בקצה אחד לתקרה, יורד אל הגלגלת, עוקף אותה,
      ועולה אל היד שלכם. שני קטעי החוט אנכיים. באיזה כוח צריך למשוך כדי להחזיק את המשא במנוחה?
    answer: 49
    unit: N
    correctFeedback: >-
      נכון. בתרשים הכוחות של הגלגלת והמשא שני קטעים מושכים כלפי מעלה, כל אחד ב-$T$, והמתיחות זהה לכל אורך החוט:
      $2T = mg$, ולכן $T = 49\,\text{N}$.
    wrongFeedback: 'שרטטו תרשים כוחות לגלגלת הנעה עם המשא. כמה קטעי חוט מושכים אותה?'
    commonWrong:
      - value: 98
        feedback: 'זה $mg$. המשא תלוי על שני קטעים של אותו חוט, וכל אחד מהם מושך כלפי מעלה ב-$T$.'
        misconception: MC-2-tension-equals-hanging-weight
      - value: 24.5
        feedback: 'זה רבע מהכובד. יש כאן רק שני קטעים שתומכים בגלגלת, ולכן כל אחד נושא חצי.'
    hints:
      - 'כל קטע של החוט מושך באותה מתיחות $T$.'

  # Added in review: the wedge had no basic rung, so the ladder started at the constraint formula.
  - id: Q-2.5-wedge-recoil
    type: vector
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: basic
    prompt: >-
      טריז מונח על רצפה חלקה, והפאה המשופעת והחלקה שלו יורדת ימינה. מניחים עליה גוש ומשחררים את שניהם ממנוחה. הגוש
      מתחיל להחליק במורד הפאה, ימינה ומטה. לאיזה כיוון מאיץ הטריז? (מבט מהצד: ימינה בדף הוא מזרח, ולמעלה הוא צפון.)
    answer: w
    correctFeedback: >-
      נכון. על הטריז פועלים הכובד והנורמלי של הרצפה, שניהם אנכיים, והכוח של הגוש. הכוח של הגוש הוא בן הזוג, לפי
      החוק השלישי, של הנורמלי שהטריז מפעיל על הגוש: ניצב לפאה ולתוכה, כלומר שמאלה ומטה. הרכיב האופקי שלו הוא הכוח
      האופקי היחיד על הטריז, ולכן הטריז מאיץ שמאלה. הגוש נע ימינה והטריז שמאלה, כי אין על השניים כוח אופקי חיצוני.
    wrong:
      - dir: zero
        feedback: >-
          הרצפה חלקה, אבל יש על הטריז כוח אופקי אחר. הגוש לא פועל על הטריז בכובד שלו (את הכובד מפעיל כדור הארץ על
          הגוש), אלא בכוח מגע ניצב לפאה. הפאה משופעת, ולכן לכוח הזה יש רכיב אופקי.
        misconception: MC-2-weight-transmits
      - dir: e
        feedback: >-
          הגוש לא גורר את הטריז אחריו: אין חיכוך ביניהם. הכוח היחיד שהגוש מפעיל על הטריז ניצב לפאה ולתוכה, וכשהפאה
          יורדת ימינה, "לתוך הפאה" הוא שמאלה ומטה.
      - dir: sw
        feedback: >-
          זה הכיוון של הכוח שהגוש מפעיל על הטריז, לא של התאוצה של הטריז. הרצפה לא נותנת לטריז לרדת: הנורמלי שלה מאזן
          את כל הכוחות האנכיים, ונשאר רק הרכיב האופקי.
    wrongFeedback: 'מה הכיוון של הכוח שהגוש מפעיל על הטריז? ואילו כוחות אחרים פועלים על הטריז, ובאיזה כיוון?'
    hints:
      - 'הכוח של הגוש על הטריז הוא בן הזוג של הנורמלי שהטריז מפעיל על הגוש. לאן הוא פונה?'

  - id: Q-2.5-equilibrium
    type: mc
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      גוש 2 תלוי על גלגלת נעה. קצה של חוט קשור למסגרת של הגלגלת הנעה; מהקשר החוט עולה אל גלגלת קבועה בתקרה, יורד
      ועוקף את הגלגלת הנעה מלמטה, עולה אל גלגלת קבועה שנייה בתקרה, ומשם יורד אל גוש 1, שתלוי בקצה החופשי. כל קטעי
      החוט אנכיים, והחוט והגלגלות חסרי מסה וחסרי חיכוך. באיזה יחס מסות $m_2/m_1$ המערכת יכולה לנוח?
    choices:
      - text: $m_2/m_1 = 3$
        correct: true
        feedback: >-
          נכון. במנוחה, לגוש 1: $T = m_1g$. את הגלגלת הנעה מחזיקים שלושה קטעים, כל אחד ב-$T$: הקטע שקשור למסגרת
          שלה ושני הקטעים שעוקפים אותה. לגוש 2 עם הגלגלת: $3T = m_2g$. לכן $m_2 = 3m_1$. כש-$m_2 < 3m_1$ גוש 1 יורד,
          וכש-$m_2 > 3m_1$ גוש 2 יורד.
      - text: $m_2/m_1 = 2$
        feedback: >-
          ספרתם רק את שני הקטעים שעוקפים את הגלגלת הנעה. גם הקטע שקשור למסגרת שלה מושך אותה כלפי מעלה ב-$T$: שלושה
          קטעים, $3T = m_2g$.
      - text: $m_2/m_1 = 1$
        feedback: >-
          זה שיווי המשקל של גלגלת קבועה אחת, שבה כל גוש תלוי על קטע אחד. כאן גוש 2 תלוי על שלושה קטעים, וכל אחד
          מהם מושך אותו כלפי מעלה.
        misconception: MC-2-constraint-equal-accel
      - text: $m_2/m_1 = 9$
        feedback: >-
          $n^2 = 9$ מופיע במכנה של **התאוצה**, $m_2 + n^2m_1$, כי גוש 1 נע פי $n$ מהגלגלת. בשיווי משקל אין תאוצות,
          ונשארים רק הכוחות: $3T = m_2g$ עם $T = m_1g$.
    hints:
      - 'כתבו את החוק השני לכל גוש עם תאוצה אפס. כמה קטעים של החוט מושכים את הגלגלת הנעה?'

  - id: Q-2.5-wedge-constraint
    type: mc
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      טריז מונח על רצפה אופקית, והפאה המשופעת שלו יורדת ימינה בזווית $\theta$. גוש מחליק במורד הפאה, והטריז עצמו
      חופשי להחליק על הרצפה. ציר $x$ ימינה וציר $y$ כלפי מעלה. התאוצה של הטריז היא $A$ (רכיב $x$ עם סימן, בלי רכיב
      $y$), ושל הגוש $(a_x,\ a_y)$. הגוש לא מתנתק מהפאה. איזו משוואה היא משוואת האילוץ?
    choices:
      - text: $a_y = -(a_x - A)\tan\theta$
        correct: true
        feedback: >-
          נכון. האילוץ הוא על התאוצה **היחסית** של הגוש ביחס לטריז: $(a_x - A,\ a_y)$ חייבת להיות לאורך הפאה, בכיוון
          $(\cos\theta,\ -\sin\theta)$. היחס בין הרכיבים של כל וקטור בכיוון הזה הוא $\dfrac{-\sin\theta}{\cos\theta} = -\tan\theta$,
          ולכן $a_y/(a_x - A) = -\tan\theta$. **בדיקת גבולות:** כשהטריז מקובע, $A = 0$, חוזרים ל-$a_y = -a_x\tan\theta$,
          תנועה לאורך המדרון.
      - text: $a_y = -a_x\tan\theta$
        feedback: >-
          זה האילוץ של טריז מקובע. כשהטריז זז, הגוש נע לאורך הפאה **ביחס לטריז**, אבל ביחס לרצפה המסלול שלו תלול
          יותר מהפאה.
        misconception: MC-2-wedge-fixed-constraint
      - text: $a_y = -(a_x + A)\tan\theta$
        feedback: 'תאוצה יחסית היא הפרש: התאוצה של הגוש פחות התאוצה של הטריז, $a_x - A$.'
      - text: $a_x = A$
        feedback: 'זה אומר שהגוש והטריז נעים יחד באופק, כלומר הגוש לא מחליק לאורך הפאה. כאן הוא מחליק.'
    hints:
      - 'במערכת של הטריז הגוש נע לאורך הפאה. איך עוברים מהתאוצה במערכת של הטריז לתאוצה במערכת של הרצפה?'

  - id: Q-2.5-wedge-free
    type: twotier
    objectives: [OBJ-2.5-2]
    qualitative: true
    level: mid
    prompt: >-
      גוש מחליק על פאה משופעת וחלקה של טריז, והטריז מונח על רצפה חלקה וחופשי לנוע. בהשוואה לאותו טריז כשהוא מקובע
      לרצפה, מה קורה לכוח הנורמלי בין הגוש לטריז?
    choices:
      - text: הוא קטן יותר.
        correct: true
        feedback: נכון. ולמה?
      - text: הוא שווה, $mg\cos\theta$, כמו בטריז מקובע.
        feedback: >-
          $mg\cos\theta$ הוא הנורמלי רק כשאין לגוש תאוצה בניצב לפאה. כשהטריז נסוג, הפאה "בורחת" מהגוש, ולגוש יש תאוצה
          לתוך המקום שבו הפאה הייתה.
        misconception: MC-2-normal-equals-weight
      - text: הוא גדול יותר.
        feedback: 'הטריז נסוג מהגוש, ולא נע לקראתו. משטח שבורח מגוף לוחץ עליו פחות, לא יותר.'
    reasons:
      - text: הגוש דוחף את הטריז אחורה, והטריז נסוג. לכן לגוש יש תאוצה בניצב לפאה, לתוך המקום שהפאה מפנה, והחוק השני בכיוון הזה נותן כוח נורמלי קטן מ-$mg\cos\theta$.
        correct: true
        feedback: >-
          זה הנימוק. עם $M$ למסה של הטריז, $N = \dfrac{mMg\cos\theta}{M + m\sin^2\theta}$. **בדיקת גבולות:** כש-$M \to \infty$,
          $N \to mg\cos\theta$, הטריז המקובע.
      - text: הכוח הנורמלי הוא תמיד הרכיב של הכובד הניצב למשטח.
        feedback: 'לכוח הנורמלי אין נוסחה קבועה. הוא נעלם שהאילוץ קובע, ומשתנה כשהמשטח מאיץ.'
        misconception: MC-2-normal-equals-weight
      - text: כשהטריז נע, חלק מהכובד של הגוש עובר אליו.
        feedback: 'הכובד של הגוש פועל רק על הגוש. מה שעובר לטריז הוא הכוח הנורמלי, והוא בדיוק מה שאנחנו מחפשים.'
        misconception: MC-2-weight-transmits
    hints:
      - 'מה הטריז עושה כשהגוש דוחף אותו? ומה זה עושה לתאוצה של הגוש בניצב לפאה?'

  - id: Q-2.5-wedge-accel
    type: numeric
    objectives: [OBJ-2.5-2]
    level: mid
    prompt: >-
      גוש בעל מסה $m = 1.0\,\text{kg}$ מחליק על פאה חלקה של טריז בעל מסה $M = 4.0\,\text{kg}$, שזווית השיפוע שלה
      $30^\circ$. הטריז מונח על רצפה חלקה. מה גודל התאוצה של הטריז?
    answer: 0.998
    unit: m/s²
    correctFeedback: >-
      נכון. ציר $x$ ימינה, ציר $y$ כלפי מעלה, והפאה יורדת ימינה; $A$ הוא הרכיב $x$ של התאוצה של הטריז, עם סימן. הכוח
      של הגוש על הטריז הוא בן הזוג של הנורמלי, $(-N\sin\theta,\ -N\cos\theta)$, ולכן באופק $MA = -N\sin\theta$. לגוש:
      $ma_x = N\sin\theta$ ו-$ma_y = N\cos\theta - mg$, ועוד האילוץ $a_y = -(a_x - A)\tan\theta$. מהפתרון של השיעור:
      $$A = -\frac{mg\sin\theta\cos\theta}{M + m\sin^2\theta} = -\frac{1.0\cdot9.8\cdot0.5\cdot0.866}{4.0 + 0.25} = -0.998\,\text{m/s}^2$$
      הסימן מינוס אומר שהטריז מאיץ שמאלה, והגודל הוא $0.998\,\text{m/s}^2$. **בדיקת גבולות:** כש-$M \to \infty$,
      $A \to 0$, טריז מקובע. כש-$\theta \to 0$, $A \to 0$: פאה אופקית לא דוחפת את הטריז הצידה. הנורמלי,
      $N = -MA/\sin\theta = 7.99\,\text{N}$ (חיובי, כי $A$ שלילי), קטן מ-$mg\cos\theta = 8.49\,\text{N}$.
    wrongFeedback: >-
      כתבו את החוק השני לגוש (שני רכיבים) ולטריז (רכיב אופקי), עם $N$ נעלם, ואת משוואת האילוץ. ארבע משוואות, ארבעה
      נעלמים: $a_x$, $a_y$, $A$, $N$.
    commonWrong:
      - value: 1.06
        feedback: >-
          לקחתם $N = mg\cos\theta$, הנורמלי של טריז מקובע, וקיבלתם גודל $mg\sin\theta\cos\theta/M$. אבל הטריז נסוג,
          והנורמלי קטן יותר. הוא נעלם, ומוצאים אותו יחד עם התאוצות.
        misconception: MC-2-normal-equals-weight
      - value: 0.849
        feedback: 'חילקתם ב-$M + m$, כאילו כוח אופקי חיצוני מאיץ את שני הגופים יחד. אין כוח אופקי חיצוני: הגוש והטריז נעים לכיוונים הפוכים.'
    hints:
      - 'הכוח האופקי היחיד על הטריז הוא הרכיב האופקי של הכוח שהגוש מפעיל עליו, לתוך הפאה: $MA = -N\sin\theta$.'
      - 'מהמשוואה של הטריז, $N = -MA/\sin\theta$ (חיובי, כי $A$ שלילי). הציבו במשוואות של הגוש ובאילוץ.'

  - id: Q-2.5-movable-accel
    type: numeric
    objectives: [OBJ-2.5-1, OBJ-2.5-2]
    level: bagrut
    prompt: >-
      חוט קשור לתקרה, יורד אל גלגלת נעה חסרת מסה שגוש $m_2 = 3.0\,\text{kg}$ תלוי עליה, עולה אל גלגלת קבועה, ויורד אל
      גוש $m_1 = 2.0\,\text{kg}$ בקצה החופשי. החוט והגלגלות חסרי מסה וחסרי חיכוך. משחררים את המערכת ממנוחה. מה גודל
      התאוצה של $m_1$?
    answer: 1.78
    unit: m/s²
    correctFeedback: >-
      נכון. האילוץ $y_1 + 2y_2 = \text{const}$ נותן $a_1 = 2a_2$ בגודל, כש-$m_1$ יורד ו-$m_2$ עולה. לגוש 1:
      $m_1g - T = m_1a_1$. לגוש 2: $2T - m_2g = m_2a_2$. מציבים $a_1 = 2a_2$:
      $a_2 = \dfrac{2m_1 - m_2}{4m_1 + m_2}\,g = \dfrac{1}{11}\cdot9.8 = 0.891\,\text{m/s}^2$, ו-$a_1 = 1.78\,\text{m/s}^2$.
      **בדיקת גבולות:** כש-$m_2 \to 0$, $a_2 \to g/2$ ו-$a_1 \to g$: גוש 1 נופל חופשית. כש-$m_2 = 2m_1$, שתי התאוצות אפס:
      שיווי המשקל של גלגלת נעה על שני קטעים.
    wrongFeedback: >-
      שלוש משוואות: החוק השני לכל גוש, ומשוואת האילוץ. שימו לב שהתאוצות של שני הגושים **לא** שוות.
    commonWrong:
      - value: 1.40
        feedback: >-
          הנחתם $a_1 = a_2$. מהאילוץ $y_1 + 2y_2 = \text{const}$, גוש 1 נע מהר פי 2 מגוש 2: $a_1 = 2a_2$.
        misconception: MC-2-constraint-equal-accel
      - value: 0.891
        feedback: 'זו התאוצה של $m_2$, שעולה. $m_1$ נע פי 2 מהר יותר.'
      - value: 1.96
        feedback: 'זו מכונת אטווד רגילה, $\dfrac{|m_1 - m_2|}{m_1 + m_2}\,g$. כאן גוש 2 תלוי על שני קטעים, והכובד שלו מתחלק ביניהם.'
    hints:
      - 'גזרו פעמיים את משוואת האילוץ $y_1 + 2y_2 = \text{const}$.'
      - 'מגוש 1, $T = m_1(g - a_1)$. הציבו במשוואה של גוש 2.'

  # Added in review: an exam rung that needs a result the lesson does not print (the floor's force on the wedge).
  - id: Q-2.5-wedge-floor
    type: numeric
    objectives: [OBJ-2.5-2]
    level: bagrut
    prompt: >-
      גוש בעל מסה $m = 2.0\,\text{kg}$ מחליק על הפאה החלקה של טריז בעל מסה $M = 2.0\,\text{kg}$, שזווית השיפוע שלה
      $40^\circ$. הטריז מונח על רצפה חלקה ונסוג בזמן שהגוש מחליק. מה הכוח הנורמלי שהרצפה מפעילה על הטריז בזמן הזה?
    answer: 27.7
    unit: N
    correctFeedback: >-
      נכון. תרשים כוחות לטריז, ציר $y$ כלפי מעלה: הכובד $Mg$ כלפי מטה; $N_f$, הנורמלי של הרצפה, כלפי מעלה; והכוח של
      הגוש, בן הזוג של הנורמלי $N$, ניצב לפאה ולתוכה, והרכיב האנכי שלו $F_y = -N\cos\theta$. הטריז לא נע באנך, ולכן
      $N_f = Mg + N\cos\theta$. את $N$ נותן הפתרון של גוש על טריז חופשי:
      $N = \dfrac{mMg\cos\theta}{M + m\sin^2\theta} = 10.6\,\text{N}$, ולכן $N_f = 19.6 + 8.14 = 27.7\,\text{N}$.
      בדיקה בדרך שנייה: למערכת גוש וטריז, $N_f - (M + m)g = ma_y$, עם $a_y = -5.73\,\text{m/s}^2$, ושוב
      $39.2 - 11.5 = 27.7\,\text{N}$. **בדיקת גבולות:** $N_f = Mg + \dfrac{mMg\cos^2\theta}{M + m\sin^2\theta}$. כש-$\theta \to 0$,
      $N_f \to (M + m)g$: גוש שעומד על משטח אופקי. כש-$\theta \to 90^\circ$, $N_f \to Mg$: הגוש נופל לאורך קיר אנכי
      בלי ללחוץ עליו.
    wrongFeedback: >-
      שרטטו תרשים כוחות לטריז לבד: כובד, הנורמלי של הרצפה, והכוח שהגוש מפעיל עליו. הטריז לא נע באנך.
    commonWrong:
      - value: 39.2
        feedback: >-
          זה $(M + m)g$, כאילו הכובד של הגוש פועל על הטריז והמערכת לא מאיצה באנך. אבל הגוש מאיץ כלפי מטה, ולכן הרצפה
          דוחפת פחות מהכובד הכולל: $N_f - (M + m)g = ma_y \lt 0$.
        misconception: MC-2-weight-transmits
      - value: 31.1
        feedback: >-
          לקחתם $N = mg\cos\theta$, הנורמלי של טריז מקובע. הטריז נסוג, והנורמלי קטן יותר:
          $N = \dfrac{mMg\cos\theta}{M + m\sin^2\theta} = 10.6\,\text{N}$, ולא $15.0\,\text{N}$.
        misconception: MC-2-normal-equals-weight
      - value: 19.6
        feedback: 'זה רק $Mg$. הגוש לוחץ על הפאה, ולכוח שלו על הטריז יש רכיב אנכי כלפי מטה, $N\cos\theta$.'
      - value: 26.4
        feedback: >-
          הוספתם $N\sin\theta$, הרכיב **האופקי** של הכוח של הגוש. הכוח ניצב לפאה, והפאה נטויה ב-$\theta$ מהאופק, ולכן
          הוא נטוי ב-$\theta$ מהאנך: הרכיב האנכי שלו הוא $N\cos\theta$.
    hints:
      - 'הכוח של הגוש על הטריז ניצב לפאה ולתוכה. מה הרכיב האנכי שלו?'
      - 'את $N$ מצאו כמו בשיעור: החוק השני לגוש ולטריז, ועוד האילוץ על התאוצה היחסית.'

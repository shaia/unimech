# Lesson 2.3 question bank: the comprehension ladder of "כוחות במכניקה: כובד, נורמלי, מתיחות וקפיץ".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), script .scratch/ch2/q.ts:
#   elevator, 60 kg, moving up and slowing at 2.0 m/s²: N = 60·7.8 = 468 N (mg 588, g+a 708);
#   hump R = 40 m, 1000 kg at 15 m/s: N = 1000(9.8 - 225/40) = 4175 N (a dip: 15 430 N); take-off √(gR) = 19.8 m/s
#   (gR = 392, √(2gR) = 28.0);
#   spring k = 200 N/m, 0.50 kg: Δx = mg/k = 2.45 cm (k/mg = 40.8, m/k = 0.25 cm);
#   rope 2.0 kg, 4.0 m hanging: T at 1.0 m below the top = λ·3.0·g = 14.7 N (above: 4.9, whole rope: 19.6);
#   rope 0.50 kg pulling block 2.0 kg with 10 N: a = 4.0 m/s², T(mid) = 2.25·4 = 9.0 N, T(block) = 8.0 N.
# Review fixes (2026-11-09), script .scratch/ch2/2-3/review.ts:
#   hump-takeoff: road y = -x²/c, c = 120 m: ρ = c/2 = 60 m at the top, v = √(gρ) = 24.2 m/s
#   (ρ = c or √(2gρ): 34.3; gρ: 588);
#   massless-pulley: 2 and 5 kg: T = 28.0 N, weights 19.6 and 49.0 N, together 68.6 N, axle 2T = 56.0 N;
#   rope-half: rope 3.0 kg, 6.0 m, load 1.0 kg, lifted at 2.0 m/s²: T(0) = 47.2 N, T = 23.6 N at y = 4.0 m
#   (mid-rope 3.0, from the bottom 2.0, load forgotten at the hand 5.0);
#   heavier-rope: F = 12 N, block 2.0 kg: T at the block 9.60 N with a 0.50 kg rope, 6.00 N with a 2.0 kg rope.

chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.3-1 what sets each force; N and T as constraint unknowns
  - id: Q-2.3-normal-what
    type: mc
    objectives: [OBJ-2.3-1]
    qualitative: true
    level: basic
    prompt: מה קובע את הגודל של הכוח הנורמלי שמשטח מפעיל על גוף שנוגע בו?
    choices:
      - text: האילוץ. הכוח מקבל את הגודל שדרוש כדי שהגוף לא ייכנס לתוך המשטח, ומוצאים אותו מהחוק השני בכיוון הניצב למשטח.
        correct: true
        feedback: >-
          נכון. לכוח הנורמלי אין נוסחה משלו, כמו $mg$ לכובד או $kx$ לקפיץ. הוא נעלם של הבעיה: המשטח קובע את רכיב
          התאוצה הניצב לו (אפס על משטח שטוח שעומד במקום), והחוק השני בכיוון הזה נותן את $N$.
      - text: הוא תמיד שווה למשקל של הגוף, $mg$.
        feedback: >-
          זה נכון רק לגוף על משטח אופקי, בלי כוחות אנכיים אחרים ובלי תאוצה אנכית. במעלית שמאיצה, על מדרון, או כשדוחפים
          את הגוף אל המשטח, $N \ne mg$.
        misconception: MC-2-normal-equals-weight
      - text: הוא תמיד $mg\cos\theta$, הרכיב של הכובד הניצב למשטח.
        feedback: >-
          זה נכון רק כשאין כוחות אחרים בכיוון הניצב, והמשטח לא מאיץ בכיוון הזה. דחיפה אל המדרון, או טריז שזז, משנים
          את $N$.
        misconception: MC-2-normal-equals-weight
      - text: הקשיחות של החומר. משטח קשה מפעיל כוח גדול יותר ממשטח רך.
        feedback: >-
          הקשיחות קובעת כמה המשטח **מתעוות** עד שהוא מפעיל את הכוח הדרוש, לא את גודל הכוח. ספר על שולחן עץ ועל מזרן
          מקבל אותו כוח נורמלי, ששווה לכובד שלו.
    hints:
      - 'נסו לכתוב נוסחה ל-$N$ שלא משתמשת בחוק השני. למה אי אפשר?'

  - id: Q-2.3-elevator
    type: numeric
    objectives: [OBJ-2.3-1]
    level: basic
    prompt: >-
      אדם בעל מסה $60\,\text{kg}$ עומד על מאזניים במעלית. המעלית עולה ומאטה, בתאוצה שגודלה $2.0\,\text{m/s}^2$.
      מה מראים המאזניים, כלומר מה הכוח הנורמלי שהם מפעילים על האדם?
    answer: 468
    unit: N
    correctFeedback: >-
      נכון. המעלית עולה ומאטה, ולכן התאוצה **כלפי מטה**. עם ציר כלפי מעלה: $N - mg = m(-a)$, ולכן
      $N = m(g - a) = 60\cdot7.8 = 468\,\text{N}$, פחות מ-$588\,\text{N}$. האדם מרגיש קל יותר.
    wrongFeedback: 'קבעו קודם את כיוון התאוצה: גוף שעולה ומאט מאיץ כלפי מטה. אחר כך כתבו את החוק השני באנך.'
    commonWrong:
      - value: 588
        feedback: 'זה $mg$. המאזניים מראים $mg$ רק כשהמעלית לא מאיצה: במהירות קבועה או במנוחה.'
        misconception: MC-2-normal-equals-weight
      - value: 708
        feedback: >-
          זה $m(g + a)$, שמתאים לתאוצה כלפי **מעלה**. המעלית עולה, אבל מאטה, ולכן התאוצה הפוכה למהירות: כלפי מטה.
        misconception: MC-2-acceleration-along-velocity
    hints:
      - 'כשגוף מאט, התאוצה שלו הפוכה לכיוון התנועה שלו.'

  - id: Q-2.3-hump
    type: numeric
    objectives: [OBJ-2.3-1]
    level: mid
    prompt: >-
      מכונית בעלת מסה $1000\,\text{kg}$ עוברת במהירות $15\,\text{m/s}$ בפסגה של גבעה. ליד הפסגה הכביש הוא קשת של
      מעגל אנכי ברדיוס $40\,\text{m}$. מה הכוח הנורמלי שהכביש מפעיל על המכונית בפסגה?
    answer: 4175
    unit: N
    correctFeedback: >-
      נכון. בפסגה המכונית נעה במעגל, ולכן התאוצה שלה $v^2/R$ **כלפי מטה**, אל המרכז. עם ציר כלפי מטה:
      $mg - N = \dfrac{mv^2}{R}$, ולכן $N = m\left(g - \dfrac{v^2}{R}\right) = 1000\cdot(9.8 - 5.63) = 4.18\cdot10^{3}\,\text{N}$.
      הכביש דוחף פחות מהכובד, והנוסעים מרגישים קלים.
    wrongFeedback: >-
      המסלול מכתיב את התאוצה: בפסגה של קשת היא $v^2/R$ כלפי מטה. כתבו את החוק השני באנך, ו-$N$ הוא הנעלם.
    commonWrong:
      - value: 9800
        feedback: 'זה $mg$. בפסגה המכונית מאיצה כלפי מטה, ולכן הכוח השקול כלפי מטה: $N < mg$.'
        misconception: MC-2-normal-equals-weight
      - value: 15430
        feedback: >-
          זה $m(g + v^2/R)$, הכוח הנורמלי בתחתית של **שקע**, שבו המרכז מעל המכונית. בפסגה של גבעה המרכז מתחת
          למכונית, והתאוצה כלפי מטה.
    hints:
      - 'איפה נמצא מרכז המעגל, מעל המכונית או מתחתיה? לשם פונה התאוצה.'

  - id: Q-2.3-hump-takeoff
    type: numeric
    objectives: [OBJ-2.3-1]
    level: bagrut
    prompt: >-
      כביש עובר מעל גבעה. ליד הפסגה הפרופיל של הכביש הוא $y = -x^2/c$, עם $c = 120\,\text{m}$: $x$ הוא המרחק
      האופקי מהפסגה, ו-$y$ הגובה ביחס לפסגה. מעל איזו מהירות בפסגה מכונית מתנתקת מהכביש?
    answer: 24.2
    unit: m/s
    correctFeedback: >-
      נכון. הכביש כאן אינו קשת של מעגל נתון, ולכן צריך קודם את רדיוס העקמומיות שלו בפסגה. שם $dy/dx = 0$
      ו-$d^2y/dx^2 = -2/c$, ולכן $\rho = 1/|d^2y/dx^2| = c/2 = 60\,\text{m}$. (דרך אחרת: הפרבולה $y = -x^2/c$ היא
      מסלול של זריקה אופקית עם $v_x^2 = gc/2$, ובשיא של זריקה $\rho = v_x^2/g$.) מכאן כמו בקשת של מעגל:
      $N = m\left(g - v^2/\rho\right) \ge 0$, כלומר $v \le \sqrt{g\rho} = \sqrt{9.8\cdot60} = 24.2\,\text{m/s}$.
      **בדיקת גבולות:** במהירות הזו המכונית, בלי כוח נורמלי, נעה בזריקה בדיוק על הפרבולה של הכביש: היא עוברת מעליו בלי
      ללחוץ עליו. וכש-$c \to \infty$, כביש ישר, $v_{\max} \to \infty$.
    wrongFeedback: >-
      הכוח הנורמלי בפסגה הוא $m(g - v^2/\rho)$, ו-$\rho$ הוא רדיוס העקמומיות של הכביש שם. מצאו אותו מהפרופיל, ואז דרשו
      $N \ge 0$.
    commonWrong:
      - value: 34.3
        feedback: >-
          לקחתם $\rho = c = 120\,\text{m}$ (או $\sqrt{2g\rho}$, שנותן אותו מספר). רדיוס העקמומיות בפסגה הוא $1/|d^2y/dx^2|$,
          ו-$d^2y/dx^2 = -2/c$, ולכן $\rho = c/2$. והתנאי להתנתקות הוא $v^2/\rho = g$, בלי 2.
      - value: 588
        feedback: 'זה $g\rho$, ביחידות $\text{m}^2/\text{s}^2$. המהירות היא השורש שלו.'
    hints:
      - 'כביש יכול לדחוף את המכונית, אבל לא למשוך אותה. מה זה אומר על הסימן של $N$?'
      - >-
        רדיוס העקמומיות: חשבו כאילו $x$ הוא הזמן, כך ש-$\vec v = (1, dy/dx)$ ו-$\vec a = (0, d^2y/dx^2)$, והשתמשו
        ב-$\rho = |\vec v|^3/|\vec v\times\vec a|$ משיעור 1.3. בפסגה $dy/dx = 0$.

  - id: Q-2.3-hooke
    type: numeric
    objectives: [OBJ-2.3-1]
    level: basic
    prompt: >-
      קפיץ בעל קבוע $k = 200\,\text{N/m}$ תלוי אנכית מהתקרה. תולים בקצה התחתון שלו משקולת בעלת מסה
      $0.50\,\text{kg}$, והיא נחה. בכמה סנטימטרים התארך הקפיץ?
    answer: 2.45
    unit: cm
    correctFeedback: >-
      נכון. לפי חוק הוק הקפיץ מושך בכוח $k\,\Delta x$, ובשיווי משקל $k\,\Delta x = mg$:
      $\Delta x = \dfrac{0.50\cdot9.8}{200} = 0.0245\,\text{m} = 2.45\,\text{cm}$. כאן, להבדיל מהכוח הנורמלי, לכוח יש
      נוסחה: הקפיץ קובע את הכוח לפי ההתארכות שלו.
    wrongFeedback: 'בשיווי משקל כוח הקפיץ מאזן את הכובד. בודדו את ההתארכות, והמירו מטרים לסנטימטרים.'
    commonWrong:
      - value: 0.0245
        feedback: 'זו ההתארכות במטרים. בסנטימטרים היא גדולה פי 100.'
      - value: 40.8
        feedback: 'חילקתם $k/(mg)$, ביחידות $1/\text{m}$. מ-$k\,\Delta x = mg$ מקבלים $\Delta x = mg/k$.'
      - value: 0.25
        feedback: 'חישבתם $m/k$ בלי $g$. הקפיץ מאזן **כוח**, הכובד $mg$, לא מסה.'
    hints:
      - 'בדקו יחידות: $\text{N}$ חלקי $\text{N/m}$ נותן מטרים.'

  - id: Q-2.3-springs-series
    type: mc
    objectives: [OBJ-2.3-1]
    qualitative: true
    level: mid
    prompt: >-
      שני קפיצים זהים וחסרי מסה, לכל אחד קבוע $k$, מחוברים בטור: הקצה התחתון של הראשון קשור לקצה העליון של השני.
      תולים משקולת בקצה התחתון של הזוג. מהו קבוע הקפיץ השקול של הזוג, כלומר היחס בין הכובד להתארכות הכוללת?
    choices:
      - text: $k/2$
        correct: true
        feedback: >-
          נכון. כל קפיץ חסר מסה מושך את שני הקצוות שלו באותו כוח, ולכן **שני** הקפיצים נושאים את כל הכובד $mg$. כל אחד
          מתארך $mg/k$, וביחד $2mg/k$: הזוג רך פי 2 מקפיץ אחד.
      - text: $2k$
        feedback: >-
          זה הקבוע של שני קפיצים **במקביל**, זה לצד זה, שכל אחד מהם נושא חצי מהכובד. בטור כל קפיץ נושא את כל הכובד,
          וההתארכויות מתחברות.
        misconception: MC-2-series-springs-add
      - text: $k$
        feedback: 'כל קפיץ אכן מתארך כמו קפיץ בודד, אבל יש שניים, וההתארכויות מתחברות. אותו כוח, התארכות כפולה.'
      - text: $k/4$
        feedback: 'כל קפיץ נושא את כל הכובד ומתארך $mg/k$. ההתארכות הכוללת כפולה, לא פי 4.'
    hints:
      - 'מה המתיחות בנקודת החיבור בין שני הקפיצים? שרטטו תרשים כוחות לנקודה הזו.'

  # ---------------------------------------------------------------- OBJ-2.3-2 tension: massless string and heavy rope
  - id: Q-2.3-massless-pulley
    type: mc
    objectives: [OBJ-2.3-2]
    qualitative: true
    level: basic
    prompt: >-
      חוט חסר מסה עובר על גלגלת חסרת מסה וחסרת חיכוך. בקצה אחד תלויה משקולת של $2\,\text{kg}$, ובקצה השני משקולת
      של $5\,\text{kg}$, והן מאיצות. מה נכון לגבי המתיחות בחוט משני צדי הגלגלת?
    choices:
      - text: היא שווה בשני הצדדים.
        correct: true
        feedback: >-
          נכון. לקטע של חוט חסר מסה, החוק השני נותן $T_1 - T_2 = 0\cdot a$, ולכן $T_1 = T_2$, גם כשהחוט מאיץ. גלגלת חסרת
          מסה וחסרת חיכוך רק מסובבת את כיוון החוט, ולא משנה את המתיחות.
      - text: היא גדולה יותר בצד של המשקולת הכבדה.
        feedback: >-
          אם המתיחות הייתה שונה, על קטע החוט שעל הגלגלת היה פועל כוח שקול, ובלי מסה הוא היה מקבל תאוצה אינסופית.
          המתיחות שונה בשני הצדדים רק בגלגלת בעלת מסה או חיכוך.
        misconception: MC-2-tension-differs-massless
      - text: בכל צד היא שווה לכובד של המשקולת שתלויה בו.
        feedback: >-
          המשקולות מאיצות, אחת למעלה ואחת למטה, ולכן אף אחת מהן לא בשיווי משקל: המתיחות שונה מהכובד של כל אחת מהן.
          היא בין $19.6\,\text{N}$ ל-$49.0\,\text{N}$ (בדיוק $28.0\,\text{N}$).
        misconception: MC-2-tension-equals-hanging-weight
      - text: היא שווה לכובד של שתי המשקולות יחד.
        feedback: >-
          זה הכובד הכולל, $68.6\,\text{N}$. המתיחות קטנה ממנו בהרבה, $28.0\,\text{N}$, וגם הציר של הגלגלת נושא רק
          $2T = 56.0\,\text{N}$, פחות מהכובד הכולל: המשקולת הכבדה יורדת בתאוצה, והמערכת לא בשיווי משקל.
    hints:
      - 'כתבו את החוק השני לקטע קטן של החוט. מה המסה שלו?'

  - id: Q-2.3-hanging-rope
    type: numeric
    objectives: [OBJ-2.3-2]
    level: mid
    prompt: >-
      חבל אחיד בעל מסה $2.0\,\text{kg}$ ואורך $4.0\,\text{m}$ תלוי אנכית מהתקרה ונח. מה המתיחות בחבל בנקודה
      שנמצאת $1.0\,\text{m}$ מתחת לתקרה?
    answer: 14.7
    unit: N
    correctFeedback: >-
      נכון. חותכים את החבל בנקודה הזו ומסתכלים על החלק **שמתחתיה**: $3.0\,\text{m}$, עם מסה
      $\lambda\cdot3.0 = 1.5\,\text{kg}$. הוא נח, והמתיחות מלמעלה מחזיקה אותו: $T = 1.5\cdot9.8 = 14.7\,\text{N}$. באופן
      כללי $T(y) = \lambda g\,(L - y)$: מקסימלית בתקרה, אפס בקצה התחתון.
    wrongFeedback: 'בחרו כגוף את החלק של החבל שמתחת לנקודה. אילו כוחות פועלים עליו, ומה המסה שלו?'
    commonWrong:
      - value: 4.9
        feedback: 'זה הכובד של החלק **שמעל** הנקודה, $0.5\,\text{kg}$. המתיחות בנקודה מחזיקה את מה שתלוי מתחתיה.'
      - value: 19.6
        feedback: >-
          זה הכובד של כל החבל, והוא המתיחות רק בתקרה. בחבל בעל מסה המתיחות משתנה לאורכו: כל נקודה מחזיקה רק את מה
          שמתחתיה.
        misconception: MC-2-tension-uniform-heavy-rope
    hints:
      - 'צפיפות קווית: $\lambda = m/L$, כש-$m$ היא המסה של החבל. מה המסה של $3.0\,\text{m}$ חבל?'

  - id: Q-2.3-rope-block
    type: numeric
    objectives: [OBJ-2.3-2]
    level: mid
    prompt: >-
      חבל אחיד בעל מסה $0.50\,\text{kg}$ קשור לגוש בעל מסה $2.0\,\text{kg}$ על רצפה חלקה. מושכים את הקצה הקדמי של
      החבל בכוח אופקי $F = 10\,\text{N}$, והחבל נשאר מתוח ואופקי. מה המתיחות באמצע החבל?
    answer: 9.0
    unit: N
    correctFeedback: >-
      נכון. הגוש והחבל מאיצים יחד, $a = \dfrac{F}{M + m} = 4.0\,\text{m/s}^2$. חותכים באמצע: מאחורי החתך הגוש וחצי
      חבל, שהמתיחות היא הכוח האופקי היחיד עליהם, ולכן $T = \left(M + \dfrac m2\right)a = 2.25\cdot4.0 = 9.0\,\text{N}$.
      ליד הגוש $T = Ma = 8.0\,\text{N}$, ובקצה המושך $T = F$. **בדיקת גבולות:** כש-$m \to 0$, $a \to F/M$ והמתיחות בכל נקודה
      היא $Ma = F$: החוט חסר המסה.
    wrongFeedback: >-
      מצאו קודם את התאוצה של הכול. אחר כך בחרו כגוף את מה שמאחורי אמצע החבל: הגוש ועוד חצי חבל.
    commonWrong:
      - value: 10
        feedback: >-
          זה נכון רק לחבל חסר מסה. לחבל הזה יש מסה, וחלק מהכוח מאיץ את החבל עצמו, ולכן המתיחות יורדת מ-$F$ בקצה המושך
          ל-$Ma$ ליד הגוש.
        misconception: MC-2-tension-uniform-heavy-rope
      - value: 8.0
        feedback: 'זו המתיחות ליד הגוש, $Ma$. באמצע החבל המתיחות מאיצה גם את החצי האחורי של החבל.'
      - value: 5.0
        feedback: 'המתיחות לא יורדת לחצי באמצע: היא יורדת מ-$10\,\text{N}$ ל-$8.0\,\text{N}$ לאורך כל החבל, לפי המסה שמאחור.'
    hints:
      - 'המתיחות בנקודה מאיצה את כל מה שמאחוריה.'

  - id: Q-2.3-rope-half
    type: numeric
    objectives: [OBJ-2.3-2]
    level: bagrut
    prompt: >-
      יד מרימה חבל אחיד בעל מסה $3.0\,\text{kg}$ ואורך $6.0\,\text{m}$, שבקצה התחתון שלו תלויה משקולת בעלת מסה
      $1.0\,\text{kg}$. הכול עולה בתאוצה $2.0\,\text{m/s}^2$ כלפי מעלה. באיזה עומק מתחת ליד, במטרים, המתיחות בחבל
      היא חצי מהמתיחות ביד?
    answer: 4.0
    unit: m
    correctFeedback: >-
      נכון. הגוף שמתחת לחתך בעומק $y$ הוא המשקולת ו-$\lambda(L - y)$ מהחבל, עם $\lambda = 0.50\,\text{kg/m}$, ולכן
      $T(y) = \left[M + \lambda(L - y)\right](g + a)$. ביד $T(0) = (M + m)(g + a) = 47.2\,\text{N}$. חצי ממנה פירושו
      שמתחת לחתך תלויה חצי מהמסה הכוללת: $M + \lambda(L - y) = 2.0\,\text{kg}$, כלומר $L - y = 2.0\,\text{m}$
      ו-$y = 4.0\,\text{m}$, שם $T = 23.6\,\text{N}$. התאוצה מצטמצמת: התשובה זהה גם לחבל נח. **בדיקת גבולות:** בלי
      משקולת, $M = 0$, החצי באמצע החבל, $y = L/2$; וכש-$M \ge m$ אין נקודה כזו, כי גם בתחתית $T = M(g + a)$, יותר
      מחצי.
    wrongFeedback: >-
      כתבו את המתיחות בעומק $y$ מהחוק השני לגוף שמתחת לחתך, ואת המתיחות ביד. חלקו אחת בשנייה: מה נשאר?
    commonWrong:
      - value: 3.0
        feedback: >-
          זה אמצע החבל, והוא נכון רק בלי משקולת. כאן המשקולת תלויה גם מתחת לאמצע, ולכן המתיחות שם יותר מחצי. היא יורדת
          לחצי רק כשמתחת לחתך נשארה חצי מכל המסה, $2.0\,\text{kg}$.
        misconception: MC-2-tension-uniform-heavy-rope
      - value: 2.0
        feedback: >-
          זה המרחק של הנקודה **מהתחתית**, $L - y$, או עומק שבו מעל החתך יש $2.0\,\text{kg}$. השאלה שואלת על העומק מתחת
          ליד, והמתיחות נקבעת לפי המסה **שמתחת** לחתך.
      - value: 5.0
        feedback: >-
          שכחתם את המשקולת במתיחות ביד. היד מחזיקה ומאיצה את כל מה שמתחתיה, החבל והמשקולת: $T(0) = (M + m)(g + a)$.
    hints:
      - 'בחרו כגוף את מה שמתחת לחתך: המשקולת וחלק מהחבל. מה המסה שלו?'
      - 'האם התאוצה משנה את היחס בין המתיחות בעומק $y$ למתיחות ביד?'

  - id: Q-2.3-heavier-rope
    type: twotier
    objectives: [OBJ-2.3-2]
    qualitative: true
    level: bagrut
    prompt: >-
      חבל אחיד מושך גוש על רצפה חלקה: כוח קבוע $F$ פועל על הקצה הקדמי של החבל, והקצה האחורי קשור לגוש. מחליפים את
      החבל בחבל כבד יותר, באותו אורך, ומושכים באותו כוח $F$. מה קורה למתיחות בקצה של החבל שקשור לגוש?
    choices:
      - text: היא קטנה.
        correct: true
        feedback: נכון. ולמה?
      - text: היא לא משתנה, כי היא שווה ל-$F$ בכל מקרה.
        feedback: >-
          המתיחות שווה ל-$F$ לאורך כל החבל רק בחוט חסר מסה. לחבל בעל מסה חלק מ-$F$ מאיץ את החבל עצמו, והמתיחות יורדת
          מ-$F$ בקצה המושך עד $Ma$ ליד הגוש.
        misconception: MC-2-tension-uniform-heavy-rope
      - text: היא גדלה, כי חבל כבד יותר מעביר כוח גדול יותר.
        feedback: >-
          החבל לא מגביר את הכוח: הוא מקבל $F$ בקצה אחד, ומשתמש בחלק ממנו כדי להאיץ את עצמו. מה שנשאר מגיע לגוש, ובחבל
          כבד נשאר פחות.
    reasons:
      - text: 'ליד הגוש המתיחות היא הכוח האופקי היחיד על הגוש, ולכן $T(0) = Ma$, ו-$a = F/(M + m)$ קטנה כשהחבל כבד יותר.'
        correct: true
        feedback: >-
          זה הנימוק: $T(0) = \dfrac{M}{M + m}\,F$. למשל, עם $F = 12\,\text{N}$ וגוש של $2.0\,\text{kg}$: חבל של
          $0.50\,\text{kg}$ נותן $9.60\,\text{N}$, וחבל של $2.0\,\text{kg}$ נותן $6.00\,\text{N}$. **בדיקת גבולות:** כש-$m \to 0$,
          $T(0) \to F$, החוט חסר המסה; כש-$m \to \infty$, $T(0) \to 0$: כל הכוח הולך לחבל, והגוש כמעט לא מאיץ.
      - text: בכל נקודה בחבל המתיחות שווה לכוח שמושכים בו בקצה.
        feedback: 'זה נכון רק לחוט חסר מסה. בחבל בעל מסה כל נקודה מושכת רק את מה שמאחוריה, ומה שמאחוריה מאיץ ב-$a = F/(M + m)$.'
        misconception: MC-2-tension-uniform-heavy-rope
      - text: חבל כבד מושך את הגוש גם בכובד שלו.
        feedback: 'הכובד של החבל פועל כלפי מטה, ניצב לחבל האופקי, ולכן הוא לא מושך את הגוש קדימה.'
    hints:
      - 'בחרו כגוף את הגוש לבד. איזה כוח אופקי פועל עליו, ומה התאוצה שלו?'

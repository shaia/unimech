# Chapter 2 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג…), 25 points each,
# climbing basic → mid → bagrut (exam level). Each problem joins objectives from at least two lessons,
# and the problems together touch every lesson of the chapter: 1 (2.2, 2.3, 2.4, 2.5), 2 (2.1, 2.4, 2.6),
# 3 (2.7, 2.8), 4 (2.2, 2.3, 2.6), 5 (2.1, 2.2, 2.3, 2.6 with 1.4 and 0.5: a 77101-style question in symbols).
# Rework 2026-11-18 toward the exam (/exam-map: 39 of 51 parts derive): open parts carry ≥ 13 of 25 points,
# the first part stays auto-graded, the last part is a symbolic result with a limit check. Open parts follow
# the course format: law → manipulation → limit → units → substitution → result.
#   1: mc 4, numeric 4, mc 3, open 8, open 6 (was open 9 + numeric 5): open 14
#   2: mc 4, open 6, twotier 5, open 10 (was mc 4, numeric 5, open 10, twotier 6): open 16
#   3: numeric 4, numeric 5, open 9, open 7 (was numeric 4, numeric 6, open 10, mc 5): open 16
#   4: mc 4, numeric 5, open 10, open 6 (was numeric 6 last): open 16
#   5: mc 4, open 6, open 8, open 7 (new): open 21
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), scripts .scratch/ch2/review.ts and
# .scratch/ch2/review-rework.ts (the rework: every changed or new part, closed forms checked by an independent route):
#   1: m1 = 2.0 kg on a 30° incline, μs = 0.40, μk = 0.30, m2 = 6.0 kg on a movable pulley (a1 = 2a2):
#      held at rest T = m2g/2 = 29.4 N, friction needed 29.4 - 9.8 = 19.6 N (part ב) > μs m1 g cos30° = 6.79 N
#      (part ג); a2 = g(m2 - 2m1 s)/(m2 + 4m1) = 2.07 m/s², s = sinθ + μk cosθ = 0.760, a1 = 4.15 m/s²;
#      ה (now open): T = m1 m2 g (2 + s)/(m2 + 4m1) = 23.2 N, equal to m1(a1 + gs) and to (m2 g - m2 a2)/2;
#      T < m2g/2 ⇔ 2m1 s < m2 ⇔ a2 > 0; limits s = 1: 3m1m2g/(m2 + 4m1), s = 0: 2m1m2g/(m2 + 4m1) (lesson 2.5);
#   2: R = 80 m, θ = 20°, μs = 0.25: ב (now open) v0 = √(gR tanθ) = √285 = 16.9 m/s (60.8 km/h);
#      ד v_max = √(gR(sinθ+μcosθ)/(cosθ-μsinθ)) = 23.0 m/s (82.8 km/h), v_min = 9.05 m/s;
#   3: boat 500 kg, v0 = 10 m/s, b = 100 kg/s: τ = 5.0 s, stopping distance m v0/b = 50 m
#      (constant deceleration b v0/m: 25 m; distance in one τ: 31.6 m); ג x(10 s) = 43.2 m;
#      ד (now open, quadratic drag, c = b/v0 = 10 kg/m): v = v0 e^(-cx/m), x(t) = (m/c) ln(1 + c v0 t/m),
#      cv0/m = 0.20 1/s, m/c = 50 m, x(10 s) = 50 ln 3 = 54.9 m, v(10 s) = 3.33 m/s (RK4 agrees to 1e-12);
#   4: R = 1.0 m, bucket 1.0 kg, water 2.0 kg: v_top,min = √(gR) = 3.13 m/s (√(5gR) = 7.00);
#      at the top at 4.0 m/s: N = m(v²/R - g) = 12.4 N, T = (M+m)(v²/R - g) = 18.6 N;
#      ד (now open) at the bottom at 7.43 m/s (= √(4² + 4gR), the energy result of chapter 3): v²/R = 55.2,
#      T_b = (M+m)(g + v²/R) = 195 N (6.63 weights), N_b = m(g + v²/R) = 130 N;
#   5: bead (m) on a spring (k, ℓ0) on a smooth rod turning at ω about its end, ω0 = √(k/m):
#      ב r_eq = ℓ0/(1 - ω²/ω0²); m = 0.20 kg, k = 20 N/m, ℓ0 = 0.30 m, ω = 6.0 rad/s: ω0 = 10 rad/s,
#      1 - ω²/ω0² = 0.64, r_eq = 0.469 m, spring force 3.38 N = mω²r_eq; ג ẍ + (ω0² - ω²)x = 0, Ω = 8.0 rad/s
#      at those values (RK4 period agrees), ω > ω0: cosh(√(ω² - ω0²) t) (RK4 at ω = 12 agrees), k → 0: r0 cosh ωt;
#      ד F_θ = 2mωṙ = -2mωΩA sin Ωt (m a_θ from the RK4 path in Cartesian coordinates agrees to 3.5e-6 N),
#      max 2mωΩA = 0.192 N at A = 0.01 m (not asked as a number).
#
# Independent review 2026-11-18 (.scratch/review/ch2/indep.ts, own routes): every number recomputed (≈45 values:
# 1 by a 2×2 linear solve for T, a2 and the s = 0, 1 lesson-2.5 limits; 2 by solving N, v² per unit mass; 3 by RK4
# of both drag laws; 4 by a bucket-only free-body diagram; 5 by RK4 of the radial equation, F_θ from the Cartesian
# second derivative, the ω > ω0 escape against the shifted cosh): all correct. Changed: standalone: false on 1ד,
# 3ג, 3ד and 5ג (they need earlier parts); 1 "לא נמתח" → "לא מתארך", clearer 29.4 feedback, rubric units lines and a
# rubric line matched to the solution; 2ג correct feedback; 3ב no longer asks "until it stops"; 3ג and 4ג name
# their symbols (4ג now in v, number at the end); √(5gR) and v_b now credited to lesson 2.6's tangential law, not
# chapter 3; 5ג rebuilt for ω > ω0 (no r_eq there): r̈ = κ²r + ω0²ℓ0, r = (r1 + ω0²ℓ0/κ²) cosh κt − ω0²ℓ0/κ², and
# the k → 0 check on it gives r1 cosh ωt; 5ד limits ω → 0 and A → 0 (ω → ω0 only restated the formula), the
# vertical rod force asked explicitly; inline math no longer starts with a minus next to Hebrew (1ה, 5א, 5ב).

chapter: 2
questions:
  # ------------------------------------------------------------ 1: a block on an incline pulled through a movable pulley
  - id: Q-2-bagrut-1
    type: bagrut
    title: גוש על מדרון וגלגלת נעה
    prompt: >-
      גוש בעל מסה $m_1 = 2.0\,\text{kg}$ מונח על מדרון קבוע שזווית השיפוע שלו $\theta = 30^\circ$. בין הגוש למדרון
      $\mu_s = 0.40$ ו-$\mu_k = 0.30$. מהגוש יוצא חוט, במקביל למדרון, אל גלגלת קבועה בראש המדרון. מהגלגלת החוט יורד
      אנכית אל גלגלת נעה, עוקף אותה מלמטה, ועולה אנכית אל וו קבוע בתקרה. על הגלגלת הנעה תלוי גוש בעל מסה
      $m_2 = 6.0\,\text{kg}$. החוט והגלגלות חסרי מסה וחסרי חיכוך, והחוט לא מתארך. משחררים את המערכת ממנוחה.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-2.5-1]
        prompt: הגוש $m_1$ עולה במדרון $20\,\text{cm}$. מה עושה הגוש $m_2$?
        choices:
          - text: הוא יורד $10\,\text{cm}$.
            correct: true
            feedback: >-
              נכון. האורך של החוט הוא $\ell + 2y_2$ ועוד קבוע, כאשר $\ell$ הוא הקטע על המדרון ו-$y_2$ העומק של הגלגלת
              הנעה. $\ell$ מתקצר ב-$20\,\text{cm}$, ולכן כל אחד משני הקטעים האנכיים מתארך ב-$10\,\text{cm}$. בתאוצות:
              $a_1 = 2a_2$.
          - text: הוא יורד $20\,\text{cm}$.
            feedback: '$m_2$ תלוי על **שני** קטעים של החוט. ה-$20\,\text{cm}$ שהתפנו מתחלקים ביניהם.'
            misconception: MC-2-constraint-equal-accel
          - text: הוא יורד $40\,\text{cm}$.
            feedback: 'הפכתם את היחס. הגלגלת הנעה זזה **פחות** מהקצה של החוט, כי כל תזוזה שלה מאריכה שני קטעים.'
          - text: 'זה תלוי במסות ובחיכוך.'
            feedback: 'משוואת האילוץ היא גיאומטריה בלבד: היא באה מאורך החוט, ולא תלויה בכוחות.'
        hints:
          - 'כתבו את האורך של החוט כסכום של הקטע על המדרון ושני הקטעים האנכיים.'

      - label: ב
        type: numeric
        points: 4
        level: mid
        objectives: [OBJ-2.4-1, OBJ-2.3-1]
        prompt: >-
          נניח לרגע שהמערכת נשארת במנוחה. מה היה צריך להיות הגודל של כוח החיכוך הסטטי על $m_1$?
        answer: 19.6
        unit: N
        correctFeedback: >-
          נכון. במנוחה, לגוש $m_2$: $2T = m_2g$, ולכן $T = 29.4\,\text{N}$. לגוש $m_1$, לאורך המדרון: $T - m_1g\sin\theta - f = 0$,
          ולכן $f = 29.4 - 9.8 = 19.6\,\text{N}$, במורד המדרון. בחלק הבא תבדקו אם החיכוך הסטטי יכול לספק כוח כזה.
        wrongFeedback: >-
          מצאו את המתיחות במנוחה מהגוש $m_2$ והגלגלת. אחר כך כתבו את החוק השני לגוש $m_1$ לאורך המדרון, עם החיכוך
          כנעלם.
        commonWrong:
          - value: 29.4
            feedback: 'זו המתיחות. גם רכיב הכובד במורד, $m_1g\sin\theta = 9.8\,\text{N}$, מאזן חלק ממנה, והחיכוך צריך לאזן רק את השאר: $29.4 - 9.8$.'
          - value: 39.2
            feedback: >-
              הוספתם את רכיב הכובד במקום לחסר. המתיחות מושכת במעלה, והכובד במורד. החיכוך משלים את מה שחסר לכובד:
              $29.4 - 9.8$.
          - value: 6.79
            feedback: >-
              זה $\mu_sN$, החיכוך הסטטי **המרבי**. השאלה היא כמה חיכוך היה דרוש. החיכוך הדרוש גדול מהמרבי, ולכן אין
              מנוחה.
            misconception: MC-2-static-friction-always-max
        hints:
          - 'שני קטעים של החוט מחזיקים את הגלגלת הנעה.'

      - label: ג
        type: mc
        points: 3
        level: mid
        qualitative: true
        standalone: false
        objectives: [OBJ-2.4-1]
        prompt: >-
          השוו את החיכוך הדרוש מחלק ב לחיכוך הסטטי המרבי בין $m_1$ למדרון. מה קורה כשמשחררים את המערכת?
        choices:
          - text: 'המערכת לא נשארת במנוחה: החיכוך הדרוש גדול מהחיכוך הסטטי המרבי, ו-$m_1$ מתחיל לעלות במדרון.'
            correct: true
            feedback: >-
              נכון. $N = m_1g\cos\theta$, ולכן $f_{\max} = \mu_sm_1g\cos\theta = 0.40\cdot2.0\cdot9.8\cdot0.866 = 6.79\,\text{N}$, הרבה
              פחות מ-$19.6\,\text{N}$. החיכוך לא יכול להחזיק: $m_1$ עולה במדרון ו-$m_2$ יורד, ומעכשיו פועל על $m_1$ חיכוך
              **קינטי**, $\mu_kN$, במורד המדרון.
          - text: 'המערכת נשארת במנוחה: החיכוך הסטטי מתאים את עצמו לכל כוח שנדרש.'
            feedback: >-
              החיכוך הסטטי אכן מתאים את עצמו, אבל רק עד הגבול $\mu_sN = 6.79\,\text{N}$. כדי להחזיק צריך $19.6\,\text{N}$,
              יותר מהגבול, ולכן אין מנוחה.
          - text: 'המערכת לא נשארת במנוחה, ו-$m_1$ מחליק במורד המדרון.'
            feedback: >-
              המתיחות שהייתה נדרשת למנוחה, $29.4\,\text{N}$ במעלה המדרון, גדולה מרכיב הכובד במורד, $9.8\,\text{N}$. לכן
              החיכוך היה צריך לפנות במורד, ו-$m_1$ נוטה לנוע במעלה המדרון.
          - text: אי אפשר לדעת בלי לחשב קודם את התאוצות.
            feedback: >-
              ההשוואה של חלק ב מספיקה: אם החיכוך שמנוחה דורשת גדול מהחיכוך הסטטי המרבי, המערכת לא יכולה להישאר במנוחה,
              בלי שום חישוב של תאוצות.
        hints:
          - 'החיכוך הסטטי המרבי הוא $\mu_sN$, עם $N = m_1g\cos\theta$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-2.5-2, OBJ-2.4-2, OBJ-2.2-2]
        prompt: >-
          בחלק ג מצאתם ש-$m_1$ עולה במדרון ו-$m_2$ יורד.

          (1) כתבו את משוואות התנועה של שני הגושים ואת משוואת האילוץ, ומצאו ביטוי לתאוצה $a_2$ של $m_2$, בעזרת $m_1$,
          $m_2$, $\theta$, $\mu_k$ ו-$g$.

          (2) בדקו את הביטוי בשני גבולות: $m_1 \to 0$, וגם מדרון אנכי חלק ($\theta = 90^\circ$, $\mu_k = 0$). בדקו יחידות.

          (3) חשבו את $a_1$ ואת $a_2$.
        hints:
          - 'הגוש $m_1$ עולה במדרון, ולכן החיכוך הקינטי עליו פונה במורד.'
          - 'מהמשוואה של $m_1$ בודדו את $T$, והציבו במשוואה של $m_2$ יחד עם $a_1 = 2a_2$.'
        solution:
          - { kind: law, text: 'החוק השני לכל גוש, עם הכיוון החיובי בכיוון התנועה: $m_1$ במעלה המדרון, $m_2$ כלפי מטה. בניצב למדרון $N = m_1g\cos\theta$, והחיכוך הקינטי $\mu_km_1g\cos\theta$ במורד. האילוץ מאורך החוט: $a_1 = 2a_2$.' }
          - { kind: manipulation, text: 'לגוש $m_1$: $T - m_1g\sin\theta - \mu_km_1g\cos\theta = m_1a_1$. לגוש $m_2$ עם הגלגלת: $m_2g - 2T = m_2a_2$. מהראשונה, עם $a_1 = 2a_2$: $T = m_1\left(2a_2 + g(\sin\theta + \mu_k\cos\theta)\right)$. מציבים בשנייה: $$a_2 = g\,\frac{m_2 - 2m_1\left(\sin\theta + \mu_k\cos\theta\right)}{m_2 + 4m_1}$$' }
          - { kind: limit, text: 'כש-$m_1 \to 0$: $a_2 \to g$. החוט לא מושך כלום, והגוש $m_2$ נופל חופשית. מדרון אנכי חלק: $a_2 = g\,\dfrac{m_2 - 2m_1}{m_2 + 4m_1}$, התוצאה של גלגלת נעה עם גוש תלוי בקצה החופשי (שיעור 2.5), ו-$a_2 = 0$ כש-$m_2 = 2m_1$.' }
          - { kind: units, text: 'המנה של המסות חסרת ממדים, וכך גם $\sin\theta + \mu_k\cos\theta$, ולכן $a_2$ ביחידות של $g$, $\text{m/s}^2$.' }
          - { kind: substitution, text: '$\sin\theta + \mu_k\cos\theta = 0.5 + 0.3\cdot0.866 = 0.760$. $a_2 = 9.8\cdot\dfrac{6.0 - 2\cdot2.0\cdot0.760}{6.0 + 8.0} = 9.8\cdot\dfrac{2.96}{14} = 2.07\,\text{m/s}^2$, ו-$a_1 = 2a_2 = 4.15\,\text{m/s}^2$.' }
          - { kind: result, text: '$a_2 = g\,\dfrac{m_2 - 2m_1(\sin\theta + \mu_k\cos\theta)}{m_2 + 4m_1} = 2.07\,\text{m/s}^2$ כלפי מטה, ו-$a_1 = 4.15\,\text{m/s}^2$ במעלה המדרון. הביטוי חיובי, כמו שהנחנו: $m_2$ באמת יורד.' }
        rubric:
          - text: 'כתבתי את משוואת האילוץ, $a_1 = 2a_2$, מאורך החוט.'
          - text: כתבתי את החוק השני לכל גוש, עם שני קטעי חוט על $m_2$ וחיכוך קינטי במורד המדרון על $m_1$.
          - text: חילצתי את $T$ וקיבלתי את הביטוי ל-$a_2$.
          - text: 'בדקתי את הגבולות: $a_2 \to g$ כש-$m_1 \to 0$, והתוצאה של גלגלת נעה במדרון אנכי חלק.'
          - text: 'בדקתי ש-$a_2$ ביחידות של $g$.'
          - text: 'חישבתי $a_2 \approx 2.07\,\text{m/s}^2$ ו-$a_1 \approx 4.15\,\text{m/s}^2$, ובדקתי שהסימן מתאים לכיוון שהנחתי.'

      - label: ה
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-2.3-1, OBJ-2.2-2]
        prompt: >-
          (1) בטאו את המתיחות $T$ בחוט בזמן התנועה באמצעות $m_1$, $m_2$, $\theta$, $\mu_k$ ו-$g$, כמנה אחת.

          (2) הראו ש-$T$ קטנה מהמתיחות במנוחה, $m_2g/2$, בדיוק כאשר $a_2 > 0$. בדקו את הביטוי בגבול $m_1 \to 0$ ובמדרון
          אנכי חלק, ובדקו יחידות.

          (3) חשבו את $T$.
        hints:
          - 'הציבו $a_1 = 2a_2$ ואת $a_2$ מחלק ד במשוואה של $m_1$ לאורך המדרון, וכתבו הכול על המכנה $m_2 + 4m_1$.'
          - 'אל תניחו ש-$T = m_2g/2$: זה נכון רק כש-$m_2$ לא מאיץ.'
        solution:
          - { kind: law, text: 'החוק השני לגוש $m_1$ לאורך המדרון, עם $a_1 = 2a_2$: $T = m_1\left(2a_2 + gs\right)$, כאשר $s = \sin\theta + \mu_k\cos\theta$. מחלק ד: $a_2 = g\,\dfrac{m_2 - 2m_1s}{m_2 + 4m_1}$.' }
          - { kind: manipulation, text: 'על המכנה המשותף: $T = m_1g\,\dfrac{2(m_2 - 2m_1s) + s(m_2 + 4m_1)}{m_2 + 4m_1}$. האיבר $4m_1s$ מופיע פעם עם מינוס ופעם עם פלוס ומתבטל, ונשאר $$T = \frac{m_1m_2\,g\,(2 + s)}{m_2 + 4m_1}$$' }
          - { kind: manipulation, text: 'השוואה למנוחה: $T < \dfrac{m_2g}{2}$ אם ורק אם $2m_1(2 + s) < m_2 + 4m_1$, כלומר $2m_1s < m_2$, וזה בדיוק התנאי ש-$a_2 > 0$. כש-$m_2$ מאיץ כלפי מטה, שני קטעי החוט מחזיקים פחות מהמשקל שלו. ההנחה ש-$T = m_2g/2$ גם בזמן התנועה מתעלמת מהתאוצה.' }
          - { kind: limit, text: 'כש-$m_1 \to 0$: $T \to 0$. אין מה למשוך, ו-$m_2$ נופל חופשית, כמו בחלק ד. מדרון אנכי חלק ($s = 1$): $T = \dfrac{3m_1m_2}{m_2 + 4m_1}\,g$, המתיחות של גלגלת נעה עם גוש תלוי בקצה החופשי (שיעור 2.5). ושולחן אופקי חלק ($s = 0$): $T = \dfrac{2m_1m_2}{m_2 + 4m_1}\,g$, גם היא משיעור 2.5.' }
          - { kind: units, text: '$\dfrac{m_1m_2}{m_2 + 4m_1}$ ביחידות $\text{kg}$, ו-$2 + s$ חסר ממדים, ולכן $T$ ביחידות $\text{kg}\cdot\text{m/s}^2 = \text{N}$.' }
          - { kind: substitution, text: '$s = 0.760$: $T = \dfrac{2.0\cdot6.0\cdot9.8\cdot2.76}{14} = 23.2\,\text{N}$. בדיקה מהגוש השני: $m_2g - 2T = 58.8 - 46.4 = 12.4\,\text{N} = m_2a_2$.' }
          - { kind: result, text: '$T = \dfrac{m_1m_2\,g\,(2 + \sin\theta + \mu_k\cos\theta)}{m_2 + 4m_1} = 23.2\,\text{N}$, פחות מ-$29.4\,\text{N}$ של המנוחה, כי $m_2$ מאיץ כלפי מטה.' }
        rubric:
          - text: 'הצבתי $a_1 = 2a_2$, ולא $a_1 = a_2$, במשוואה של $m_1$, וקיבלתי $T = m_1m_2g(2 + s)/(m_2 + 4m_1)$.'
          - text: 'הראיתי ש-$T < m_2g/2$ בדיוק כש-$a_2 > 0$.'
          - text: 'בדקתי את הגבולות: $T \to 0$ כש-$m_1 \to 0$, והמתיחות של גלגלת נעה משיעור 2.5 במדרון אנכי חלק. בדקתי ש-$T$ בניוטון.'
          - text: 'חישבתי $T \approx 23.2\,\text{N}$ ובדקתי אותה במשוואה של $m_2$.'

  # ------------------------------------------------------------ 2: a banked curve, and a plumb line inside the car
  - id: Q-2-bagrut-2
    type: bagrut
    title: עקומה משופעת ומטוטלת בתוך המכונית
    prompt: >-
      עקומה של כביש היא קשת של מעגל אופקי ברדיוס $R = 80\,\text{m}$, והכביש משופע לעבר מרכז העקומה בזווית
      $\theta = 20^\circ$. מקדם החיכוך הסטטי בין הצמיגים לכביש $\mu_s = 0.25$. מכונית עוברת את העקומה במהירות קבועה
      בגודלה. נוסעת במכונית תלתה משקולת קטנה על חוט מהמראה, והמשקולת במנוחה ביחס למכונית.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-2.6-1, OBJ-2.1-2]
        prompt: במערכת הקרקע, לאיזה כיוון פונה הכוח השקול על המכונית?
        choices:
          - text: אופקית, לעבר מרכז המעגל.
            correct: true
            feedback: >-
              נכון. המכונית נעה במעגל אופקי, ולכן התאוצה שלה $v^2/R$, אופקית ולעבר המרכז. לפי החוק השני, השקול באותו
              כיוון, ולא לאורך הכביש המשופע.
          - text: במורד השיפוע, במקביל לפני הכביש.
            feedback: >-
              המעגל שהמכונית מקיפה אופקי, ומרכזו באותו גובה כמוה. התאוצה הצנטריפטלית פונה אל המרכז, אופקית, ולא לאורך
              השיפוע.
          - text: 'אין כוח שקול: המהירות קבועה, והכוח הצנטריפוגלי מאזן את הכוחות האחרים.'
            feedback: >-
              גודל המהירות קבוע, אבל הכיוון שלה משתנה, ולכן יש תאוצה. במערכת הקרקע אין כוח צנטריפוגלי שיאזן אותה.
            misconception: MC-2-centrifugal-in-inertial
          - text: בכיוון הנסיעה, כי המנוע דוחף את המכונית.
            feedback: >-
              המהירות קבועה בגודלה, ולכן אין רכיב של תאוצה בכיוון הנסיעה. הדחיפה של המנוע, דרך החיכוך, רק מאזנת את
              הגרר.
            misconception: MC-2-acceleration-along-velocity

      - label: ב
        type: open
        points: 6
        level: mid
        objectives: [OBJ-2.6-2, OBJ-2.1-2]
        prompt: >-
          (1) בטאו את המהירות $v_0$ שבה המכונית עוברת את העקומה בלי שום חיכוך לרוחב הכביש, באמצעות $g$, $R$ ו-$\theta$.

          (2) בדקו את הביטוי בגבולות $\theta \to 0$ ו-$\theta \to 90^\circ$, ובדקו יחידות.

          (3) חשבו את $v_0$.
        hints:
          - 'בלי חיכוך, הנורמלי לבד צריך לתת גם את האיזון האנכי וגם את הכוח הרדיאלי. פרקו אותו לאנך ולאופק, ולא לאורך הכביש.'
          - 'חלקו את המשוואה האופקית באנכית. הרכיב האופקי של הנורמלי הוא $N\sin\theta$: איפה יוצא $\tan\theta$, במונה או במכנה?'
        solution:
          - { kind: law, text: 'החוק השני באנך ובאופק (לעבר המרכז). על המכונית פועלים רק הכובד והנורמלי, והנורמלי נטוי ב-$\theta$ מהאנך. התאוצה $v_0^2/R$, אופקית אל המרכז.' }
          - { kind: manipulation, text: 'באנך: $N\cos\theta = mg$. באופק: $N\sin\theta = \dfrac{mv_0^2}{R}$. מחלקים את השנייה בראשונה, ו-$N$ ו-$m$ מצטמצמים: $\tan\theta = \dfrac{v_0^2}{gR}$, ולכן $$v_0 = \sqrt{gR\tan\theta}$$' }
          - { kind: limit, text: 'כש-$\theta \to 0$: $v_0 \to 0$. בכביש שטוח בלי חיכוך אי אפשר לפנות בשום מהירות. כש-$\theta \to 90^\circ$: $v_0 \to \infty$. הנורמלי כמעט אופקי, וכדי שהרכיב האנכי הקטן שלו יישא את המשקל הוא חייב להיות עצום, ואיתו הכוח הרדיאלי. והמסה לא מופיעה: אותה מהירות למשאית ולאופנוע.' }
          - { kind: units, text: '$gR$ ביחידות $\text{m/s}^2\cdot\text{m} = \text{m}^2/\text{s}^2$, ו-$\tan\theta$ חסר ממדים, ולכן $v_0$ ב-$\text{m/s}$.' }
          - { kind: substitution, text: '$\tan20^\circ = 0.364$: $v_0 = \sqrt{9.8\cdot80\cdot0.364} = \sqrt{285\,\text{m}^2/\text{s}^2} = 16.9\,\text{m/s}$.' }
          - { kind: result, text: '$v_0 = \sqrt{gR\tan\theta} = 16.9\,\text{m/s}$, כ-61 קילומטר לשעה.' }
        rubric:
          - text: פירקתי את הנורמלי לרכיב אנכי ולרכיב אופקי, וכתבתי את החוק השני באנך ובאופק.
          - text: 'קיבלתי $v_0 = \sqrt{gR\tan\theta}$, עם $\tan\theta$ במונה ובלי $m$.'
          - text: 'בדקתי את הגבולות $\theta \to 0$ ו-$\theta \to 90^\circ$ ואת היחידות.'
          - text: 'חישבתי $v_0 \approx 16.9\,\text{m/s}$.'

      - label: ג
        type: twotier
        points: 5
        level: bagrut
        qualitative: true
        standalone: false
        objectives: [OBJ-2.1-1, OBJ-2.1-2, OBJ-2.6-2]
        prompt: >-
          המכונית נוסעת במהירות של חלק ב, שבה אין חיכוך לרוחב הכביש. באיזה כיוון נטוי החוט של המשקולת, ביחס למכונית?
        choices:
          - text: ניצב לפני הכביש. המשקולת נטויה מהאנך בזווית $\theta$, הרחק מהמרכז.
            correct: true
            feedback: 'נכון. המשקולת מאיצה יחד עם המכונית, אופקית אל המרכז, והחוט נטוי בדיוק כמו הכוח הנורמלי על המכונית. בחרו את הנימוק שמראה למה הזווית היא בדיוק $\theta$.'
          - text: אנכי, כי המכונית נעה במהירות קבועה.
            feedback: >-
              גודל המהירות קבוע, אבל המכונית מאיצה לעבר המרכז, ולכן היא לא מערכת ייחוס אינרציאלית. גם המשקולת מאיצה
              איתה, וחוט אנכי לא יכול לתת לה כוח אופקי.
            misconception: MC-2-uniform-motion-inertial
          - text: נטוי מהאנך לעבר מרכז העקומה.
            feedback: >-
              המתיחות צריכה רכיב אופקי **לעבר** המרכז. החוט מושך את המשקולת לכיוון נקודת התלייה, ולכן המשקולת עצמה
              נמצאת בצד הרחוק מהמרכז.
            misconception: MC-2-flies-outward
        reasons:
          - text: 'במערכת הקרקע: $T\sin\alpha = mv_0^2/R$ ו-$T\cos\alpha = mg$, ולכן $\tan\alpha = v_0^2/(gR) = \tan\theta$. החוט מקביל לכוח הנורמלי על המכונית.'
            correct: true
            feedback: >-
              זה הנימוק. המשקולת והמכונית מאיצות באותה תאוצה, ולכל אחת מהן כוח אחד, מלבד הכובד, שנותן אותה: הנורמלי
              למכונית, המתיחות למשקולת. במהירות התכנון הנוסעים מרגישים "כובד" ניצב למושב, בלי דחיפה הצידה.
          - text: כוח צנטריפוגלי דוחף את המשקולת החוצה, ומאזן את המתיחות.
            feedback: >-
              כיוון החוט הוא עובדה אחת, ורואים אותו אותו דבר מהקרקע ומתוך המכונית. כדי להסביר אותו עובדים במערכת הקרקע,
              שהיא אינרציאלית: המשקולת נעה במעגל, ולכן היא צריכה כוח שקול אל המרכז, $mv_0^2/R$. פועלים עליה רק הכובד
              והמתיחות, ולכן החוט חייב להיות נטוי כך שלמתיחות יהיה רכיב אופקי אל המרכז. המתיחות והכובד לא מאוזנים: השקול
              שלהם הוא בדיוק הכוח הרדיאלי הזה. "כוח צנטריפוגלי" הוא כוח מדומה, שקיים רק אם מתארים את התנועה ממערכת
              המכונית, שאינה אינרציאלית (פרק 7). אין גוף שמפעיל אותו, ואין בו צורך כדי להסביר את הנטייה.
            misconception: MC-2-centrifugal-in-inertial
          - text: החוט תמיד אנכי במכונית שלא מחליקה.
            feedback: 'החוט אנכי רק כשהמכונית לא מאיצה. במכונית שמאיצה בקו ישר, או סובבת, הוא נטוי.'
            misconception: MC-2-uniform-motion-inertial

      - label: ד
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-2.6-2, OBJ-2.4-2]
        prompt: >-
          (1) מצאו ביטוי למהירות המרבית שבה המכונית עוברת את העקומה בלי להחליק, בעזרת $g$, $R$, $\theta$ ו-$\mu_s$.

          (2) בדקו את הביטוי בגבולות $\mu_s \to 0$ ו-$\theta \to 0$, ובדקו יחידות.

          (3) חשבו את המהירות המרבית.
        hints:
          - 'במהירות המרבית המכונית נוטה להחליק החוצה, במעלה השיפוע. לאן פונה החיכוך?'
        solution:
          - { kind: law, text: 'החוק השני באנך ובאופק (לעבר המרכז). במהירות המרבית החיכוך הסטטי מגיע לגבול שלו, $\mu_sN$, ופונה במורד השיפוע. הנורמלי נטוי ב-$\theta$ מהאנך, והחיכוך ב-$\theta$ מהאופק.' }
          - { kind: manipulation, text: 'באנך: $N\cos\theta - \mu_sN\sin\theta = mg$. באופק: $N\sin\theta + \mu_sN\cos\theta = \dfrac{mv^2}{R}$. מחלקים את השנייה בראשונה, ו-$N$ ו-$m$ מצטמצמים: $$v_{\max}^2 = gR\,\frac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta}$$' }
          - { kind: limit, text: 'כש-$\mu_s \to 0$: $v_{\max}^2 \to gR\tan\theta$, המהירות של חלק ב. כש-$\theta \to 0$: $v_{\max}^2 \to \mu_sgR$, הכביש השטוח. ואם $\mu_s \to \cot\theta$, המכנה מתאפס: בשיפוע כזה החיכוך מחזיק בכל מהירות.' }
          - { kind: units, text: 'המנה חסרת ממדים, ו-$gR$ ביחידות $\text{m/s}^2\cdot\text{m} = \text{m}^2/\text{s}^2$, ולכן $v_{\max}$ ב-$\text{m/s}$.' }
          - { kind: substitution, text: '$\sin20^\circ = 0.342$, $\cos20^\circ = 0.940$: $v_{\max}^2 = 9.8\cdot80\cdot\dfrac{0.342 + 0.235}{0.940 - 0.0855} = 784\cdot0.675 = 530\,\text{m}^2/\text{s}^2$.' }
          - { kind: result, text: '$v_{\max} = \sqrt{gR\,\dfrac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta}} = 23.0\,\text{m/s}$, כ-83 קילומטר לשעה. (באותו אופן, עם החיכוך במעלה, המהירות המינימלית $9.05\,\text{m/s}$.)' }
        rubric:
          - text: קבעתי שבמהירות המרבית החיכוך הוא $\mu_sN$ ופונה במורד השיפוע.
          - text: כתבתי את החוק השני באנך ובאופק, לא לאורך הכביש, עם הרכיבים של הנורמלי ושל החיכוך.
          - text: חילקתי את המשוואות, וקיבלתי ביטוי בלי $N$ ובלי $m$.
          - text: בדקתי שהביטוי חוזר ל-$gR\tan\theta$ בלי חיכוך ול-$\mu_sgR$ בכביש שטוח.
          - text: 'חישבתי $v_{\max} \approx 23\,\text{m/s}$.'

  # ------------------------------------------------------------ 3: a boat coasting against water drag
  - id: Q-2-bagrut-3
    type: bagrut
    title: סירה שמנועה כבה
    prompt: >-
      סירה בעלת מסה $m = 500\,\text{kg}$ נעה במהירות $v_0 = 10\,\text{m/s}$ במים שקטים, ובזמן $t = 0$, בנקודה $x = 0$,
      המנוע שלה כבה. מכאן, לאורך קו התנועה, פועל עליה רק כוח הגרר של המים. ציר $x$ בכיוון התנועה, ובמודל הזה
      הגרר ליניארי במהירות, $F = -bv$, עם $b = 100\,\text{kg/s}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-2.7-1]
        prompt: מה קבוע הזמן $\tau$ של ההאטה?
        answer: 5.0
        unit: s
        correctFeedback: 'נכון. $m\,dv/dt = -bv$ נותן $v = v_0e^{-t/\tau}$, עם $\tau = m/b = 500/100 = 5.0\,\text{s}$.'
        wrongFeedback: 'בדקו יחידות: איזה צירוף של $m$ ו-$b$ יוצא בשניות?'
        commonWrong:
          - value: 0.2
            feedback: 'זה $b/m$, ביחידות $1/\text{s}$: קצב הדעיכה, לא קבוע הזמן. $\tau = m/b$.'
          - value: 50
            feedback: 'זה $mv_0/b$, ביחידות מטרים: מרחק, לא זמן. קבוע הזמן לא תלוי במהירות ההתחלתית.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-2.8-2]
        prompt: >-
          כוח שתלוי במהירות פותרים בדרך כלל בהפרדת משתנים לפי הזמן, אבל כשהשאלה היא על **מרחק**, כלל השרשרת
          $a = v\,\dfrac{dv}{dx}$ מפריד גם אותו: $\dfrac{mv\,dv}{F(v)} = dx$. כתבו כך את משוואת התנועה, ומצאו את $v$
          כפונקציה של $x$. לאיזה מרחק מתקרבת הסירה, ככל שהיא מאטה? (בחלק א ראיתם שבזמן היא אף פעם לא נעצרת לגמרי.)
        answer: 50
        unit: m
        correctFeedback: >-
          נכון. $mv\,\dfrac{dv}{dx} = -bv$, ולכן $\dfrac{dv}{dx} = -\dfrac bm$: המהירות יורדת **קווית** עם הדרך,
          $v = v_0 - \dfrac bm x$. היא מתאפסת ב-$x = \dfrac{mv_0}{b} = v_0\tau = 50\,\text{m}$. מרחק סופי, אף שבזמן, לפי
          חלק א, הסירה אף פעם לא נעצרת לגמרי.
        wrongFeedback: 'הציבו $a = v\,dv/dx$. ה-$v$ מצטמצם משני האגפים, ונשארת משוואה פשוטה מאוד.'
        commonWrong:
          - value: 25
            feedback: >-
              הנחתם האטה קבועה, בערך ההתחלתי שלה $bv_0/m = 2.0\,\text{m/s}^2$, וקיבלתם $v_0^2/(2a)$. אבל ההאטה קטנה
              יחד עם המהירות, ולכן הסירה עוברת יותר.
            misconception: MC-2-constant-acceleration-formulas
          - value: 31.6
            feedback: 'זה המרחק שהסירה עוברת עד $t = \tau$, $v_0\tau(1 - e^{-1})$. אז היא עוד נעה ב-37% מהמהירות ההתחלתית.'
            misconception: MC-2-time-constant-is-full-time
        hints:
          - '$mv\,dv/dx = -bv$. מה נשאר אחרי שמחלקים ב-$v$?'

      - label: ג
        type: open
        points: 9
        level: bagrut
        standalone: false
        objectives: [OBJ-2.7-1, OBJ-2.8-2]
        prompt: >-
          (1) מצאו את $v(t)$, ובאינטגרציה נוספת את $x(t)$, באמצעות $v_0$, $t$ ו-$\tau = m/b$.

          (2) הראו שכש-$t \to \infty$, $x(t)$ מתקרב למרחק של חלק ב, ובדקו את הביטוי גם בגבול $b \to 0$ וביחידות.

          (3) איזה מרחק עברה הסירה אחרי $t = 10\,\text{s}$?
        hints:
          - 'הפרידו משתנים: $\dfrac{dv}{v} = -\dfrac bm\,dt$.'
        solution:
          - { kind: law, text: 'החוק השני בכיוון התנועה: $m\dfrac{dv}{dt} = -bv$, עם $v(0) = v_0$ ו-$x(0) = 0$.' }
          - { kind: manipulation, text: 'הפרדת משתנים: $\displaystyle\int_{v_0}^{v}\frac{dv''}{v''} = -\frac1\tau\int_0^t dt''$, עם $\tau = m/b$, ולכן $v(t) = v_0e^{-t/\tau}$. אינטגרציה נוספת: $x(t) = \displaystyle\int_0^t v_0e^{-t''/\tau}\,dt'' = v_0\tau\left(1 - e^{-t/\tau}\right)$.' }
          - { kind: limit, text: 'כש-$t \to \infty$, $e^{-t/\tau} \to 0$, ו-$x \to v_0\tau = mv_0/b$: המרחק של חלק ב. כש-$b \to 0$, $\tau \to \infty$, ופיתוח $1 - e^{-t/\tau} \approx t/\tau$ נותן $x \approx v_0t$: תנועה במהירות קבועה, בלי מים.' }
          - { kind: units, text: '$v_0\tau$ ביחידות $\text{m/s}\cdot\text{s} = \text{m}$, והמעריך $t/\tau$ חסר ממדים.' }
          - { kind: substitution, text: 'ב-$t = 10\,\text{s} = 2\tau$: $x = 10\cdot5.0\cdot\left(1 - e^{-2}\right) = 50\cdot0.865 = 43.2\,\text{m}$, והמהירות $10e^{-2} = 1.35\,\text{m/s}$.' }
          - { kind: result, text: '$v(t) = v_0e^{-t/\tau}$ ו-$x(t) = v_0\tau\left(1 - e^{-t/\tau}\right)$, שמתקרב ל-$50\,\text{m}$ ולא עובר אותו. אחרי $10\,\text{s}$ הסירה עברה $43.2\,\text{m}$.' }
        rubric:
          - text: הפרדתי משתנים ומצאתי $v = v_0e^{-t/\tau}$ עם $\tau = m/b$.
          - text: 'ביצעתי אינטגרציה נוספת עם $x(0) = 0$, וקיבלתי $x = v_0\tau(1 - e^{-t/\tau})$, כולל קבוע האינטגרציה.'
          - text: הראיתי ש-$x \to v_0\tau$, המרחק של חלק ב, ושבגבול $b \to 0$ מתקבל $x \approx v_0t$.
          - text: 'חישבתי $x(10\,\text{s}) \approx 43\,\text{m}$.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-2.7-2, OBJ-2.8-2]
        prompt: >-
          במהירויות גבוהות הגרר של המים קרוב יותר לגרר ריבועי, $F = -cv^2$ (כאן $v \gt 0$). נניח שהגרר ריבועי בכל
          המהירויות, עם $c = b/v_0 = 10\,\text{kg/m}$, כך שברגע $t = 0$ הוא שווה לגרר הליניארי.

          (1) מצאו את $v$ כפונקציה של $x$ בעזרת כלל השרשרת, ואת $x(t)$, באמצעות $m$, $c$ ו-$v_0$. האם הסירה נעצרת במרחק
          סופי?

          (2) בדקו את $x(t)$ בגבול $c \to 0$ וביחידות.

          (3) איזה מרחק עברה הסירה אחרי $10\,\text{s}$? השוו לחלק ג.
        hints:
          - 'עם $a = v\,dv/dx$: $mv\,\dfrac{dv}{dx} = -cv^2$. הפעם $v$ אחד נשאר אחרי הצמצום.'
          - 'ל-$x(t)$: הפרידו משתנים בזמן, $\dfrac{dv}{v^2} = -\dfrac cm\,dt$, ואחר כך בצעו אינטגרציה של $v(t)$.'
        solution:
          - { kind: law, text: 'החוק השני בכיוון התנועה, $m\,\dfrac{dv}{dt} = -cv^2$, עם $v(0) = v_0$ ו-$x(0) = 0$. לשאלה על מרחק, כלל השרשרת: $\dfrac{dv}{dt} = v\,\dfrac{dv}{dx}$.' }
          - { kind: manipulation, text: 'במקום: $mv\,\dfrac{dv}{dx} = -cv^2$, ולכן $\dfrac{dv}{v} = -\dfrac cm\,dx$ ו-$v = v_0e^{-cx/m}$. בזמן: $\displaystyle\int_{v_0}^{v}\frac{dv''}{v''^2} = -\frac cm\,t$ נותן $\dfrac1v = \dfrac1{v_0} + \dfrac{ct}{m}$, כלומר $v = \dfrac{v_0}{1 + cv_0t/m}$. אינטגרציה נוספת: $$x(t) = \frac mc\ln\left(1 + \frac{cv_0}{m}\,t\right)$$' }
          - { kind: manipulation, text: '$v = v_0e^{-cx/m}$ לא מתאפסת באף $x$ סופי, ו-$x(t)$ גדל בלי גבול, לאט מאוד: הסירה לא נעצרת בשום מרחק סופי. גרר ריבועי חזק מהליניארי רק במהירות גבוהה; כשהסירה מאטה, $cv^2$ קטן מהר יותר מ-$bv$, והוא לבד לא עוצר אותה. לכן אי אפשר להעתיק את התוצאה של הגרר הליניארי, מרחק $m/c$, עם $c$ במקום $b$, ואי אפשר להניח שגרר ריבועי עוצר מוקדם יותר.' }
          - { kind: limit, text: 'כש-$c \to 0$: $\ln(1 + \epsilon) \approx \epsilon$ עם $\epsilon = cv_0t/m$, ולכן $x \approx v_0t$, תנועה במהירות קבועה. אותו פיתוח נותן $x \approx v_0t$ גם בזמן קצר, $t \ll m/(cv_0)$, כשהגרר עוד לא הספיק להאט.' }
          - { kind: units, text: '$c$ ביחידות $\text{N}/(\text{m/s})^2 = \text{kg/m}$, ולכן $m/c$ ב-$\text{m}$ ו-$cv_0t/m$ חסר ממדים.' }
          - { kind: substitution, text: '$\dfrac{cv_0}{m} = \dfrac{10\cdot10}{500} = 0.20\,\text{s}^{-1}$ ו-$\dfrac mc = 50\,\text{m}$. ב-$t = 10\,\text{s}$: $x = 50\ln3 = 54.9\,\text{m}$, ו-$v = \dfrac{10}{3} = 3.33\,\text{m/s}$.' }
          - { kind: result, text: '$v = v_0e^{-cx/m}$ ו-$x(t) = \dfrac mc\ln\left(1 + \dfrac{cv_0}{m}t\right)$: אין מרחק עצירה סופי. אחרי $10\,\text{s}$ הסירה עברה $54.9\,\text{m}$, יותר מ-$43.2\,\text{m}$ בגרר הליניארי, ויותר מכל מרחק העצירה שלו, $50\,\text{m}$, כי באותו כוח התחלתי הגרר הריבועי נחלש מהר יותר עם המהירות.' }
        rubric:
          - text: 'הפעלתי את כלל השרשרת ומצאתי $v = v_0e^{-cx/m}$, שלא מתאפסת באף מרחק סופי.'
          - text: 'מצאתי את $x(t) = (m/c)\ln(1 + cv_0t/m)$, כולל קבוע האינטגרציה עם $x(0) = 0$.'
          - text: 'בדקתי שכש-$c \to 0$ מתקבל $x \approx v_0t$, ובדקתי יחידות של $c$.'
          - text: 'חישבתי $x(10\,\text{s}) \approx 54.9\,\text{m}$ והשוויתי ל-$43.2\,\text{m}$ של חלק ג.'

  # ------------------------------------------------------------ 4: a bucket of water on a vertical circle
  - id: Q-2-bagrut-4
    type: bagrut
    title: דלי מים במעגל אנכי
    prompt: >-
      תלמידה מסובבת דלי בעל מסה $M = 1.0\,\text{kg}$, ובו $m = 2.0\,\text{kg}$ מים, במעגל אנכי, בעזרת חבל קל. הדלי
      והמים נעים במעגל ברדיוס $R = 1.0\,\text{m}$ (הזניחו את ההבדל ברדיוס בין המים לדלי). בנקודה העליונה פי הדלי
      פונה כלפי מטה.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-2.2-1]
        prompt: >-
          בנקודה העליונה, תחתית הדלי דוחפת את המים כלפי מטה, לעבר מרכז המעגל. מהו הכוח שיוצר איתו זוג של החוק
          השלישי?
        choices:
          - text: המים דוחפים את תחתית הדלי כלפי מעלה.
            correct: true
            feedback: >-
              נכון. זו אותה פעולה, מגע בין המים לתחתית, משני הצדדים. הכוח הזה פועל על הדלי, ולכן מופיע בתרשים הכוחות של
              הדלי, ולא של המים.
          - text: הכובד של המים, כלפי מטה.
            feedback: >-
              הכובד של המים הוא פעולה בין המים לכדור הארץ, והזוג שלו הוא המשיכה של המים את כדור הארץ. ושני הכוחות פועלים
              על המים, ולכן הם לא זוג.
            misconception: MC-2-normal-is-reaction
          - text: הכוח הצנטריפוגלי על המים, כלפי מעלה.
            feedback: 'במערכת הקרקע אין כוח צנטריפוגלי, ולכוח שאין גוף שמפעיל אותו אין זוג. השקול על המים פונה למרכז.'
            misconception: MC-2-centrifugal-in-inertial
          - text: המתיחות בחבל, שמושכת את הדלי כלפי מטה.
            feedback: 'המתיחות היא פעולה בין החבל לדלי. הזוג שלה הוא הכוח שהדלי מושך בו את החבל.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-2.6-2]
        prompt: מה המהירות המינימלית של הדלי בנקודה העליונה, כדי שהמים לא ייפלו ממנו?
        answer: 3.13
        unit: m/s
        correctFeedback: >-
          נכון. על המים בנקודה העליונה: $mg + N = mv^2/R$. תחתית הדלי רק דוחפת, $N \ge 0$, ולכן $v^2 \ge gR$, ו-$v_{\min} = \sqrt{9.8\cdot1.0} = 3.13\,\text{m/s}$.
          תחתית הדלי היא כמו חוט: היא יכולה לפעול רק בכיוון אחד.
        wrongFeedback: 'כתבו את החוק השני למים ברכיב הרדיאלי. מה הערך הקטן ביותר של הכוח שהתחתית מפעילה עליהם?'
        commonWrong:
          - value: 9.8
            feedback: 'זה $gR$, ביחידות $\text{m}^2/\text{s}^2$. הוציאו שורש.'
          - value: 0
            feedback: >-
              תחתית הדלי לא יכולה למשוך את המים כלפי מעלה. אם הדלי איטי מ-$\sqrt{gR}$, הכובד לבד גדול מהכוח הרדיאלי
              הדרוש, והמים עוזבים את הדלי.
            misconception: MC-2-string-like-rod
          - value: 7.0
            feedback: 'זה $\sqrt{5gR}$, המהירות המינימלית בנקודה **התחתונה** (מהרכיב המשיקי של החוק השני, שיעור 2.6).'

      - label: ג
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-2.6-2, OBJ-2.2-2, OBJ-2.3-1]
        prompt: >-
          בנקודה העליונה מהירות הדלי $v$.

          (1) בטאו את הכוח $N$ שתחתית הדלי מפעילה על המים, ואת המתיחות $T$ בחבל, באמצעות $M$, $m$, $v$, $R$ ו-$g$.

          (2) בדקו את שני הביטויים בגבול $v \to \sqrt{gR}$ ובדקו יחידות.

          (3) חשבו את $N$ ואת $T$ עבור $v = 4.0\,\text{m/s}$.
        hints:
          - 'שרטטו שני תרשימי כוחות: למים, ולמערכת של הדלי עם המים. מה הכוחות הפנימיים במערכת השנייה?'
        solution:
          - { kind: law, text: 'החוק השני ברכיב הרדיאלי, כלפי מטה אל המרכז, $\sum F_r = mv^2/R$, לכל גוף. כל הכוחות כאן אנכיים.' }
          - { kind: manipulation, text: 'למים: $mg + N = \dfrac{mv^2}{R}$, ולכן $N = m\left(\dfrac{v^2}{R} - g\right)$. למערכת דלי + מים, שבה $N$ והזוג שלו פנימיים ומתבטלים: $(M + m)g + T = \dfrac{(M + m)v^2}{R}$, ולכן $T = (M + m)\left(\dfrac{v^2}{R} - g\right)$.' }
          - { kind: limit, text: 'כש-$v \to \sqrt{gR}$, שני הביטויים מתאפסים יחד: הדלי והמים נופלים יחד חופשית בנקודה העליונה, בתאוצה $g = v^2/R$, ואף אחד לא דוחף את השני. כש-$v^2/R \gg g$ הכובד זניח, והכוחות הם $mv^2/R$ ו-$(M + m)v^2/R$, כמו במעגל אופקי.' }
          - { kind: units, text: '$v^2/R$ ביחידות $\text{m/s}^2$, כמו $g$, ולכן $m(v^2/R - g)$ בניוטון.' }
          - { kind: substitution, text: '$v^2/R = 16\,\text{m/s}^2$, ו-$v^2/R - g = 6.2\,\text{m/s}^2$. $N = 2.0\cdot6.2 = 12.4\,\text{N}$, ו-$T = 3.0\cdot6.2 = 18.6\,\text{N}$.' }
          - { kind: result, text: '$N = m\left(v^2/R - g\right) = 12.4\,\text{N}$ על המים, כלפי מטה, ו-$T = (M + m)\left(v^2/R - g\right) = 18.6\,\text{N}$. הדלי דוחף את המים, ולפי החוק השלישי המים דוחפים את תחתית הדלי כלפי מעלה ב-$12.4\,\text{N}$.' }
        rubric:
          - text: כתבתי את החוק השני ברכיב הרדיאלי, עם הכובד והכוח של התחתית שניהם כלפי המרכז.
          - text: מצאתי את $T$ ממערכת של הדלי והמים יחד, או מתרשים של הדלי עם הכוח של המים עליו כלפי מעלה, ושתי הדרכים נותנות אותה תוצאה.
          - text: 'בדקתי ש-$N$ ו-$T$ מתאפסים יחד כש-$v^2 = gR$.'
          - text: 'חישבתי $N \approx 12.4\,\text{N}$ ו-$T \approx 18.6\,\text{N}$.'

      - label: ד
        type: open
        points: 6
        level: bagrut
        objectives: [OBJ-2.6-2, OBJ-2.3-1]
        prompt: >-
          בנקודה התחתונה מהירות הדלי $v_b$.

          (1) בטאו את המתיחות $T_b$ בחבל שם, ואת הכוח $N_b$ שתחתית הדלי מפעילה על המים, באמצעות $M$, $m$, $v_b$, $R$ ו-$g$.

          (2) בדקו את הביטויים בגבול $v_b \to 0$ וביחידות.

          (3) חשבו את $T_b$ ואת $N_b$ עבור $v_b = 7.43\,\text{m/s}$.
        hints:
          - 'בנקודה התחתונה המרכז מעל הדלי. מי מהכוחות פונה אל המרכז, ומי הרחק ממנו?'
          - 'החבל מושך את הדלי ואת המים יחד: למערכת הזו המסה $M + m$.'
        solution:
          - { kind: law, text: 'החוק השני ברכיב הרדיאלי, הפעם כלפי מעלה אל המרכז: $\sum F_r = \dfrac{mv^2}{R}$ לכל גוף. בנקודה התחתונה המתיחות והכוח של התחתית פונים אל המרכז, והכובד הרחק ממנו.' }
          - { kind: manipulation, text: 'למערכת דלי + מים: $T_b - (M + m)g = \dfrac{(M + m)v_b^2}{R}$, ולכן $T_b = (M + m)\left(g + \dfrac{v_b^2}{R}\right)$. למים לבד: $N_b - mg = \dfrac{mv_b^2}{R}$, ולכן $N_b = m\left(g + \dfrac{v_b^2}{R}\right)$.' }
          - { kind: manipulation, text: 'בנקודה העליונה $g$ הופיע עם סימן מינוס, כי שם הכובד פונה אל המרכז ועוזר; למטה הוא פונה הרחק מהמרכז, והחבל צריך להתגבר גם עליו. מי שמעתיק את הביטוי של חלק ג ומחסר $g$ מקבל מתיחות קטנה מדי.' }
          - { kind: limit, text: 'כש-$v_b \to 0$: $T_b \to (M + m)g$ ו-$N_b \to mg$, דלי שתלוי במנוחה ונושא את המשקל של עצמו ושל המים. כש-$v_b^2/R \gg g$ הכובד זניח, ושוב מתקבל $(M + m)v_b^2/R$ של מעגל אופקי.' }
          - { kind: units, text: '$v_b^2/R$ ביחידות $\text{m/s}^2$, כמו $g$, ולכן שני הביטויים בניוטון.' }
          - { kind: substitution, text: '$v_b^2/R = 7.43^2/1.0 = 55.2\,\text{m/s}^2$. $T_b = 3.0\cdot(9.8 + 55.2) = 195\,\text{N}$, פי 6.6 מהכובד של הדלי והמים, ו-$N_b = 2.0\cdot65.0 = 130\,\text{N}$.' }
          - { kind: result, text: '$T_b = (M + m)\left(g + v_b^2/R\right) = 195\,\text{N}$ ו-$N_b = m\left(g + v_b^2/R\right) = 130\,\text{N}$. (המהירות $7.43\,\text{m/s}$ היא בדיוק מה שהרכיב המשיקי של החוק השני, $v_b^2 = v_{\text{top}}^2 + 4gR$ (שיעור 2.6), נותן מהנקודה העליונה במהירות $4.0\,\text{m/s}$.)' }
        rubric:
          - text: 'כתבתי את החוק השני כלפי מעלה, אל המרכז, עם המתיחות חיובית והכובד שלילי.'
          - text: 'השתמשתי במסה $M + m$ לחבל ובמסה $m$ לכוח על המים.'
          - text: 'בדקתי שבגבול $v_b \to 0$ מתקבל המשקל של דלי תלוי, ובדקתי יחידות.'
          - text: 'חישבתי $T_b \approx 195\,\text{N}$ ו-$N_b \approx 130\,\text{N}$.'

  # ------------------------------------------------------------ 5: a bead on a spring, on a rotating rod (joins 0.5, 1.4 and 2.x)
  - id: Q-2-bagrut-5
    type: bagrut
    title: חרוז על קפיץ, על מוט מסתובב
    prompt: >-
      מוט ישר, דק וחלק מונח אופקית ומסתובב סביב ציר אנכי שעובר בקצה שלו, $O$, במהירות זוויתית קבועה $\omega$ (מנוע
      שומר עליה קבועה). על המוט מושחל חרוז קטן בעל מסה $m$, והוא מחובר ל-$O$ בקפיץ קל בעל קבוע $k$ ואורך רפוי
      $\ell_0$, שמונח לאורך המוט. החרוז מחליק על המוט בלי חיכוך. סמנו $\omega_0 = \sqrt{k/m}$, ואת המרחק של החרוז
      מ-$O$ ב-$r$. עבדו במערכת הקרקע, בקואורדינטות קוטביות סביב $O$, כאשר הזווית של המוט היא $\theta = \omega t$.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-2.6-1, OBJ-1.4-2]
        prompt: >-
          החרוז מסתובב עם המוט במרחק קבוע $r$ מ-$O$. איזה כוח נותן לו את הכוח השקול הרדיאלי, ולאן הכוח הזה פונה?
        choices:
          - text: 'הקפיץ, שמתוח מעבר ל-$\ell_0$ ומושך את החרוז אל $O$ בכוח $k(r - \ell_0) = m\omega^2r$.'

  - id: Q-2.6-banked-range
    type: numeric
    objectives: [OBJ-2.6-2]
    level: bagrut
    prompt: >-
      עקומה של כביש היא קשת של מעגל אופקי ברדיוס $100\,\text{m}$, משופעת לעבר המרכז בזווית $25^\circ$. מקדם החיכוך
      הסטטי $\mu_s = 0.20$. מה המהירות המרבית שבה מכונית עוברת את העקומה בלי להחליק?
    answer: 26.8
    unit: m/s
    correctFeedback: >-
      נכון. במהירות המרבית המכונית נוטה להחליק החוצה, והחיכוך, $\mu_sN$, פונה במורד השיפוע. באנך:
      $N\cos\theta - \mu_sN\sin\theta = mg$. באופק: $N\sin\theta + \mu_sN\cos\theta = mv^2/R$. מחלקים:
      $$v_{\max}^2 = gR\,\frac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta},\qquad v_{\max} = 26.8\,\text{m/s}$$
      **בדיקת גבולות:** כש-$\mu_s \to 0$, $v^2 \to gR\tan\theta$, הכביש בלי חיכוך ($21.4\,\text{m/s}$). כש-$\theta \to 0$,
      $v^2 \to \mu_sgR$, הכביש השטוח ($14.0\,\text{m/s}$). באותו אופן, עם החיכוך במעלה, המהירות המינימלית היא
      $15.5\,\text{m/s}$.
    wrongFeedback: >-
      קבעו את כיוון החיכוך במהירות המרבית, פרקו את הנורמלי ואת החיכוך לאנך ולאופק, וחלקו את שתי המשוואות.
    commonWrong:
      - value: 21.4
        feedback: 'זו המהירות בלי חיכוך, $\sqrt{gR\tan\theta}$. החיכוך במורד השיפוע מוסיף כוח רדיאלי, ומאפשר לנסוע מהר יותר.'
      - value: 25.6
        feedback: >-
          חישבתם $\sqrt{gR(\tan\theta + \mu_s)}$, כאילו החיכוך פשוט מתווסף לשיפוע. אבל לחיכוך במורד יש גם רכיב אנכי
          כלפי מטה, שמגדיל את $N$, ובמכנה מופיע $\cos\theta - \mu_s\sin\theta$.
      - value: 14.0
        feedback: 'זו המהירות המרבית על כביש **שטוח**, $\sqrt{\mu_sgR}$. השיפוע מוסיף רכיב אופקי של הנורמלי.'
    hints:
      - 'במהירות המרבית החיכוך מגיע ל-$\mu_sN$ ופונה במורד השיפוע.'
      - 'שני נעלמים, $N$ ו-$v$. בחלוקת המשוואות $N$ ו-$m$ מצטמצמים.'

  - id: Q-2.6-vertical-top
    type: numeric
    objectives: [OBJ-2.6-2]
    level: bagrut
    prompt: >-
      כדור קשור בחוט ומסתובב במעגל אנכי ברדיוס $0.80\,\text{m}$. מה המהירות המינימלית שהכדור צריך בנקודה העליונה

      - value: 20.1
        feedback: >-
          זו המתיחות בנקודה התחתונה, $mg + mv_b^2/R$. בגובה המרכז גם המהירות קטנה יותר וגם הכובד כבר לא מושך
          החוצה מהמרכז.
        misconception: MC-2-vertical-speed-constant
      - value: 4.44
        feedback: >-
          הפחתתם $mg$, כאילו הכובד מושך אל המרכז כמו בנקודה העליונה. כשהחוט אופקי הכובד ניצב לחוט, ואין לו רכיב

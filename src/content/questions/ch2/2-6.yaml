  # Added in review: where a string goes slack, from v(φ) and T(φ) together.
  - id: Q-2.6-slack-angle
    type: numeric
    objectives: [OBJ-2.6-2]
    level: bagrut
    prompt: >-
      כדור קשור לחוט באורך $0.75\,\text{m}$ ומסתובב במעגל אנכי. בנקודה התחתונה המהירות שלו $5.0\,\text{m/s}$. הכדור
      עולה, והחוט מתרופף לפני שהכדור מגיע לנקודה העליונה. באיזו זווית $\varphi$, הנמדדת במרכז המעגל מהנקודה
      התחתונה, החוט מתרופף?
    answer: 118
    unit: '°'
    correctFeedback: >-
      נכון. מהרכיב המשיקי של החוק השני וכלל השרשרת, $v^2 = v_b^2 - 2gR(1 - \cos\varphi)$. ברכיב הרדיאלי, חיובי אל
      המרכז, $T - mg\cos\varphi = mv^2/R$, ואחרי הצבה $T = \dfrac{mv_b^2}{R} - 2mg + 3mg\cos\varphi$. החוט מתרופף כש-$T = 0$:
      $$\cos\varphi_s = \frac{2gR - v_b^2}{3gR} = \frac{14.7 - 25}{22.05} = -0.467$$
      כלומר $\varphi_s = 118^\circ$, מעל גובה המרכז. וזה אכן קורה בדרך:
      $\sqrt{2gR} = 3.83\,\text{m/s} \lt v_b \lt \sqrt{5gR} = 6.06\,\text{m/s}$. **בדיקת גבולות:** כש-$v_b^2 = 5gR$,
      $\cos\varphi_s = -1$: החוט מתרופף בדיוק בנקודה העליונה, כלומר בקושי משלים סיבוב. כש-$v_b^2 = 2gR$,
      $\cos\varphi_s = 0$: הכדור מגיע בדיוק לגובה המרכז ונעצר. כאן, ב-$118^\circ$, נשארת לכדור מהירות של
      $1.85\,\text{m/s}$, במשיק למעגל, ומשם הוא נע בזריקה.
    wrongFeedback: >-
      כתבו את $T(\varphi)$: את $v^2$ מהרכיב המשיקי, ואז את הרכיב הרדיאלי. החוט מתרופף בזווית שבה $T = 0$.
    commonWrong:
      - value: 134
        feedback: >-
          זו הזווית שבה המהירות הייתה מתאפסת, $\cos\varphi = 1 - v_b^2/(2gR)$. אבל החוט מתרופף קודם: מעל גובה המרכז
          לכובד יש רכיב אל המרכז, $F_r = -mg\cos\varphi \gt 0$, וכשהוא לבד גדול מ-$mv^2/R$, החוט היה צריך לדחוף. מוט היה מחזיק
          את הכדור עד שהוא נעצר; חוט לא.
        misconception: MC-2-string-like-rod
      - value: 62.2
        feedback: >-
          קיבלתם $\cos\varphi = +0.467$: הפכתם את הסימן של רכיב הכובד הרדיאלי, או מדדתם את הזווית מהנקודה העליונה. אל
          המרכז הרכיב הוא $F_r = -mg\cos\varphi$. מתחת לגובה המרכז ($\varphi \lt 90^\circ$) הכובד מושך החוצה מהמרכז, החוט חייב
          למשוך, ושם הוא לא יכול להתרופף.
      - value: 90
        feedback: >-
          בגובה המרכז הכובד ניצב לחוט, ו-$T = mv^2/R \gt 0$ כל עוד הכדור נע. החוט יכול להתרופף רק מעל גובה המרכז, שם
          לכובד יש רכיב אל המרכז.
      - value: 180
        feedback: >-
          החוט לא חייב להחזיק עד הנקודה העליונה. הוא מתרופף בזווית הראשונה שבה $T(\varphi) = 0$, וכש-$v_b$ קטן
          מ-$\sqrt{5gR} = 6.06\,\text{m/s}$ זה קורה לפני הנקודה העליונה.
    hints:
      - 'הציבו את $v^2(\varphi)$ מהרכיב המשיקי ברכיב הרדיאלי, וקבלו את $T(\varphi)$.'
      - 'חוט יכול רק למשוך. מה התנאי לזווית שבה הוא מתרופף?'

  - id: Q-2.6-rod-vs-string
    type: twotier
    objectives: [OBJ-2.6-2]
    qualitative: true
    level: bagrut
    prompt: >-
      במקום חוט, הכדור קשור לקצה של מוט קל וקשיח, שמסתובב במעגל אנכי סביב ציר בקצה השני. מה המהירות המינימלית
      בנקודה העליונה, כדי שהכדור יעבור אותה?
    choices:
      - text: כמעט אפס. כל מהירות חיובית מספיקה.
        correct: true
        feedback: נכון. ומה ההבדל בין המוט לחוט?
      - text: $\sqrt{gR}$, כמו בחוט.
        feedback: >-
          $\sqrt{gR}$ בא מהתנאי $T \ge 0$, וזה תנאי של חוט. מוט יכול גם לדחוף, ולכן התנאי הזה לא חל עליו.
        misconception: MC-2-string-like-rod
      - text: $\sqrt{2gR}$, כי המוט כבד מהחוט.
        feedback: 'המוט קל. ההבדל בינו לבין החוט הוא לא המסה, אלא הכיוון של הכוחות שהוא יכול להפעיל.'
    reasons:
      - text: 'מוט יכול גם לדחוף: כשהכדור איטי, המוט דוחף אותו כלפי מעלה בכוח שגודלו $mg - mv^2/R$, וכך הכוח הרדיאלי קטן כמה שצריך.'
        correct: true
        feedback: >-
          זה הנימוק. נסמן ב-$F$ את הכוח של המוט **אל המרכז**, כמו בשיעור. בנקודה העליונה המרכז מתחת לכדור, והחוק השני
          ברכיב הרדיאלי הוא $F + mg = mv^2/R$, כלומר $F = mv^2/R - mg$. כשהכדור איטי, $F \lt 0$: המוט דוחף אותו החוצה
          מהמרכז, כלפי מעלה. חוט יכול רק למשוך, $F = T \ge 0$, ולכן הוא דורש $v^2 \ge gR$.
      - text: המוט מחזיק את הכדור במעגל, ולכן הכדור לא יכול ליפול.
        feedback: 'זה נכון, אבל לא מסביר מה עושה המוט. המוט מחזיק אותו במעגל כי הוא יכול להפעיל כוח בשני הכיוונים.'
      - text: במוט אין כובד בנקודה העליונה.
        feedback: 'הכובד פועל על הכדור בכל נקודה. המוט רק מאזן חלק ממנו כשהכדור איטי.'
    hints:
      - 'כתבו את החוק השני ברכיב הרדיאלי, עם $F$, הכוח של המוט אל המרכז, שהסימן שלו לא ידוע.'

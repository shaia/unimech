chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.6-1 the net radial force
  - id: Q-2.6-flat-curve-force
    type: mc
    objectives: [OBJ-2.6-1]
    qualitative: true
    level: basic
    prompt: >-
      מכונית נוסעת במהירות קבועה בגודלה בעקומה של כביש אופקי, לא משופע. איזה כוח נותן לה את התאוצה הצנטריפטלית,
      לעבר מרכז העקומה?
    choices:
      - text: חיכוך סטטי של הכביש על הצמיגים, לעבר מרכז העקומה.
        correct: true
        feedback: >-
          נכון. הכובד והנורמלי אנכיים ומבטלים זה את זה, ולכן הכוח האופקי היחיד הוא החיכוך. הצמיגים לא מחליקים הצידה,
          ולכן החיכוך סטטי, וגודלו $mv^2/R$, כל עוד זה לא עובר את $\mu_sN$.
      - text: כוח צנטריפוגלי החוצה, שהחיכוך מאזן אותו.
        feedback: >-
          במערכת הקרקע אין כוח צנטריפוגלי: אין גוף שמפעיל אותו. ואם החיכוך היה מאוזן, השקול היה אפס, והמכונית הייתה
          נוסעת בקו ישר. בתנועה מעגלית השקול **לא** אפס: הוא פונה למרכז.
        misconception: MC-2-centrifugal-in-inertial
      - text: הכוח הצנטריפטלי, שפועל על כל גוף שנע במעגל, בנוסף לכוחות האחרים.
        feedback: >-
          "כוח צנטריפטלי" הוא שם לרכיב הרדיאלי של הכוח השקול, לא כוח נוסף. צריך לשאול איזה כוח אמיתי, עם גוף שמפעיל
          אותו, ממלא את התפקיד הזה. כאן זה החיכוך.
        misconception: MC-2-centripetal-is-extra-force
      - text: חיכוך קינטי, נגד כיוון הנסיעה.
        feedback: >-
          חיכוך נגד כיוון הנסיעה היה מאט את המכונית, לא מסובב אותה. והצמיגים מתגלגלים בלי להחליק, ולכן החיכוך סטטי.
        misconception: MC-2-friction-opposes-motion
    hints:
      - 'שרטטו תרשים כוחות למכונית. אילו מהכוחות אופקיים?'

  - id: Q-2.6-string-cut
    type: vector
    objectives: [OBJ-2.6-1]
    qualitative: true
    level: basic
    prompt: >-
      כדור קשור בחוט ומסתובב נגד כיוון השעון במעגל אופקי על שולחן חלק (מבט מלמעלה, צפון למעלה). ברגע שהכדור עובר
      בנקודה המזרחית ביותר של המעגל, החוט נקרע. לאיזה כיוון הכדור נע מיד אחר כך?
    answer: n
    correctFeedback: >-
      נכון. ברגע הקריעה הכוח האופקי היחיד, המתיחות, נעלם, והכדור ממשיך בקו ישר במהירות שהייתה לו: משיק למעגל. בנקודה
      המזרחית, בתנועה נגד כיוון השעון, המהירות פונה צפונה.
    wrong:
      - dir: e
        feedback: >-
          אין כוח שזורק את הכדור החוצה. בלי חוט הכוח השקול האופקי אפס, ולכן הכדור ממשיך במהירות שהייתה לו ברגע הקריעה,
          והיא משיקה למעגל, לא רדיאלית.
        misconception: MC-2-flies-outward
      - dir: ne
        feedback: >-
          הכדור לא "מתעקל החוצה". בלי כוח הוא נע בקו ישר, בכיוון המשיק. רק מהמערכת המסתובבת זה נראה כאילו הוא בורח
          מהמרכז.
        misconception: MC-2-flies-outward
      - dir: s
        feedback: 'זה הכיוון בתנועה **עם** כיוון השעון. נגד כיוון השעון, בנקודה המזרחית, הכדור נע צפונה.'
    wrongFeedback: 'מה הכוח השקול האופקי אחרי שהחוט נקרע? ומה זה אומר על המהירות?'
    hints:
      - 'החוק הראשון: בלי כוח, מהירות קבועה. מה הייתה המהירות ברגע הקריעה?'

  - id: Q-2.6-centripetal-net
    type: twotier
    objectives: [OBJ-2.6-1]
    qualitative: true
    level: mid
    prompt: >-
      כדור קשור בחוט ומסתובב במעגל אופקי על שולחן חלק, במהירות קבועה בגודלה. תלמידה משרטטת לכדור תרשים כוחות: כובד,
      כוח נורמלי, מתיחות לעבר המרכז, ו"כוח צנטריפטלי" לעבר המרכז. האם התרשים נכון?
    choices:
      - text: לא. הכוח הצנטריפטלי כאן הוא המתיחות עצמה, ואסור לשרטט אותו פעמיים.
        correct: true
        feedback: נכון. ומה העיקרון?
      - text: כן. בתנועה מעגלית פועל תמיד כוח צנטריפטלי.
        feedback: 'אילו היו שני כוחות לעבר המרכז, הכוח השקול היה גדול מ-$mv^2/R$, והכדור היה מתקרב למרכז.'
        misconception: MC-2-centripetal-is-extra-force
      - text: לא. חסר בו כוח צנטריפוגלי החוצה, שמאזן את המתיחות.
        feedback: >-
          אם משהו היה מאזן את המתיחות, השקול היה אפס, והכדור היה נע בקו ישר. בתנועה מעגלית, במערכת אינרציאלית, השקול
          פונה למרכז.
        misconception: MC-2-centrifugal-in-inertial
    reasons:
      - text: '"כוח צנטריפטלי" הוא שם לרכיב הרדיאלי של הכוח השקול. בתרשים מופיעים רק כוחות שיש גוף שמפעיל אותם.'
        correct: true
        feedback: >-
          זה העיקרון. כותבים את החוק השני ברכיב הרדיאלי, $\sum F_r = mv^2/R$, ושמים באגף של $\sum F_r$ רק כוחות אמיתיים. כאן
          $T = mv^2/R$.
      - text: תנועה מעגלית דורשת כוח מיוחד, בנוסף לכוחות הרגילים.
        feedback: 'תנועה מעגלית דורשת רק שהשקול של הכוחות הרגילים יפנה למרכז, בגודל $mv^2/R$.'
        misconception: MC-2-centripetal-is-extra-force
      - text: בלי כוח החוצה הכדור היה נופל אל המרכז.
        feedback: >-
          הכדור **כן** נופל כל הזמן אל המרכז, ביחס לקו הישר שהיה ממשיך בו. זו התאוצה הצנטריפטלית. בלי מהירות משיקית
          הוא היה מגיע למרכז, ועם מהירות משיקית הוא מסתובב.
        misconception: MC-2-centrifugal-in-inertial
    hints:
      - 'לכל חץ בתרשים, שאלו: איזה גוף מפעיל את הכוח הזה?'

  - id: Q-2.6-flat-max
    type: numeric
    objectives: [OBJ-2.6-1]
    level: basic
    prompt: >-
      עקומה של כביש אופקי היא קשת של מעגל ברדיוס $50\,\text{m}$. מקדם החיכוך הסטטי בין הצמיגים לכביש
      $\mu_s = 0.80$. מה המהירות המרבית שבה מכונית יכולה לעבור את העקומה בלי להחליק?
    answer: 19.8
    unit: m/s
    correctFeedback: >-
      נכון. החיכוך הוא הכוח הרדיאלי: $f = mv^2/R$, ו-$f \le \mu_smg$. לכן $v^2 \le \mu_sgR$, ו-$v_{\max} = \sqrt{0.80\cdot9.8\cdot50} = 19.8\,\text{m/s}$,
      כ-71 קילומטר לשעה, בלי תלות במסה.
    wrongFeedback: 'כתבו את החוק השני ברכיב הרדיאלי. מה הערך הגדול ביותר שהחיכוך הסטטי יכול לקבל?'
    commonWrong:
      - value: 392
        feedback: 'זה $\mu_sgR$, ביחידות $\text{m}^2/\text{s}^2$. המהירות היא השורש שלו.'
      - value: 6.32
        feedback: 'שכחתם את $g$: $\sqrt{\mu_sR}$ יוצא ביחידות $\sqrt{\text{m}}$, לא מהירות.'
    hints:
      - '$\mu_smg = mv^2/R$. המסה מצטמצמת.'

  # ---------------------------------------------------------------- OBJ-2.6-2 banked curve, conical pendulum, vertical circle
  # Added with the lesson: OBJ-2.6-2 had no basic rung, so the ladder jumped from the flat curve to the banked one.
  - id: Q-2.6-hump-normal
    type: mc
    objectives: [OBJ-2.6-2]
    qualitative: true
    level: basic
    prompt: >-
      מכונית עוברת במהירות קבועה בגודלה מעל פסגה של גבעה עגולה בכביש. ברגע שהיא בפסגה, איך משתווה הכוח הנורמלי של
      הכביש על המכונית למשקל שלה, $mg$?
    choices:
      - text: הנורמלי קטן מ-$mg$.
        correct: true
        feedback: >-
          נכון. מרכז הקשת מתחת למכונית, ולכן השקול צריך לפנות למטה, בגודל $mv^2/R$: $mg - N = mv^2/R$, כלומר
          $N = m(g - v^2/R)$. ב-$v = \sqrt{gR}$ הנורמלי מתאפס, ומהר יותר המכונית מתנתקת מהכביש.
      - text: הנורמלי שווה ל-$mg$, כי המכונית לא עולה ולא יורדת ברגע הזה.
        feedback: >-
          המהירות אופקית ברגע הזה, אבל הכיוון שלה מסתובב כלפי מטה: למכונית יש תאוצה צנטריפטלית למטה. אילו $N = mg$,
          השקול היה אפס, והמכונית הייתה ממשיכה בקו ישר, אל מעבר לגבעה.
        misconception: MC-2-normal-equals-weight
      - text: הנורמלי גדול מ-$mg$, כי הכביש צריך לאזן גם את הכוח הצנטריפוגלי שדוחף את המכונית החוצה.
        feedback: >-
          מהקרקע אין כוח צנטריפוגלי: אין גוף שמפעיל אותו. ובפסגה "החוצה" הוא למעלה, כך שגם במערכת המסתובבת הוא היה
          מקטין את הנורמלי, לא מגדיל. מה שגדול מ-$mg$ הוא הנורמלי בתחתית של **שקע**.
        misconception: MC-2-centrifugal-in-inertial
    hints:
      - 'איפה מרכז הקשת ביחס למכונית, ולאן צריך לפנות הכוח השקול?'

  - id: Q-2.6-banked-design
    type: numeric
    objectives: [OBJ-2.6-2]
    level: mid
    prompt: >-
      עקומה של כביש היא קשת של מעגל אופקי ברדיוס $100\,\text{m}$, והכביש משופע לעבר המרכז בזווית $15^\circ$. באיזו
      מהירות מכונית עוברת את העקומה בלי שום חיכוך?
    answer: 16.2
    unit: m/s
    correctFeedback: >-
      נכון. הכוח הנורמלי ניצב לכביש, ולכן נטוי ב-$\theta$ מהאנך. באנך אין תאוצה: $N\cos\theta = mg$. באופק, לעבר
      המרכז: $N\sin\theta = mv^2/R$. מחלקים: $\tan\theta = \dfrac{v^2}{gR}$, ו-$v = \sqrt{gR\tan\theta} = 16.2\,\text{m/s}$.
      **בדיקת גבולות:** כש-$\theta \to 0$, $v \to 0$: כביש שטוח בלי חיכוך לא מסובב אף מכונית.
    wrongFeedback: >-
      התאוצה אופקית, לעבר מרכז המעגל, ולא לאורך הכביש. לכן פרקו את הנורמלי לרכיב אנכי ולרכיב אופקי.
    commonWrong:
      - value: 263
        feedback: 'זה $gR\tan\theta$, ביחידות $\text{m}^2/\text{s}^2$. הוציאו שורש.'
      - value: 60.5
        feedback: >-
          חישבתם $\sqrt{gR/\tan\theta}$: החלפתם את הרכיבים. הרכיב **האופקי** של הנורמלי הוא $N\sin\theta$, והוא קטן
          כשהשיפוע קטן. בגבול $\theta \to 0$ הביטוי שלכם נותן מהירות אינסופית.
    hints:
      - 'כתבו את החוק השני באנך ובאופק, לא לאורך הכביש ובניצב לו.'

  - id: Q-2.6-banked-below
    type: twotier
    objectives: [OBJ-2.6-2]
    qualitative: true
    level: mid
    prompt: >-
      על כביש משופע בעקומה יש חיכוך, ומכונית עוברת בו **לאט** מהמהירות שבה אין צורך בחיכוך. לאיזה כיוון פועל כוח
      החיכוך על הצמיגים?
    choices:
      - text: במעלה השיפוע, הרחק ממרכז העקומה.
        correct: true
        feedback: נכון. ולמה דווקא במעלה?
      - text: במורד השיפוע, לעבר מרכז העקומה.
        feedback: >-
          זה כיוון החיכוך כשנוסעים **מהר** ממהירות התכנון, כשהמכונית נוטה להחליק החוצה. לאט ממנה היא נוטה להחליק
          פנימה, במורד, והחיכוך מתנגד לזה.
        misconception: MC-2-banked-friction-down
      - text: אין חיכוך, כי המכונית לא מחליקה.
        feedback: 'גם בלי החלקה יכול לפעול חיכוך סטטי, וכאן הוא דרוש: בלעדיו המכונית הייתה מחליקה במורד.'
        misconception: MC-2-no-friction-without-sliding
    reasons:
      - text: במהירות נמוכה צריך כוח רדיאלי קטן. בלי חיכוך, הנורמלי שמחזיק את המכונית באנך היה נותן כוח אופקי גדול מדי, והמכונית הייתה גולשת פנימה. חיכוך במעלה מקטין את הכוח הפנימי.
        correct: true
        feedback: >-
          זה הנימוק. במהירות $v = 0$ זו פשוט מכונית שחונה על מדרון, והחיכוך מחזיק אותה במעלה. מהירות המינימום היא זו
          שבה החיכוך במעלה מגיע ל-$\mu_sN$.
      - text: חיכוך על כביש משופע פונה תמיד לעבר מרכז העקומה, כי הוא עוזר לסובב את המכונית.
        feedback: 'הכיוון תלוי במהירות. החיכוך הסטטי מקבל את הכיוון ואת הגודל שחסרים לנורמלי כדי לתת בדיוק $mv^2/R$.'
        misconception: MC-2-banked-friction-down
      - text: חיכוך פונה תמיד נגד כיוון הנסיעה.
        feedback: 'חיכוך מתנגד להחלקה **יחסית**. כאן ההחלקה שעלולה לקרות היא לרוחב הכביש, ולא לאורכו.'
        misconception: MC-2-friction-opposes-motion
    hints:
      - 'מה קורה למכונית שעומדת במקום על הכביש המשופע?'

  - id: Q-2.6-conical
    type: numeric
    objectives: [OBJ-2.6-2]
    level: mid
    prompt: >-
      משקולת קטנה תלויה בחוט באורך $L = 1.0\,\text{m}$ ונעה במעגל אופקי, כשהחוט נטוי בזווית קבועה $30^\circ$ מהאנך
      (מטוטלת קונית). מה זמן הסיבוב של המשקולת?
    answer: 1.87
    unit: s
    correctFeedback: >-
      נכון. המעגל ברדיוס $r = L\sin\theta$. באנך: $T\cos\theta = mg$. באופק: $T\sin\theta = m\omega^2L\sin\theta$. מחלקים:
      $\omega^2 = \dfrac{g}{L\cos\theta}$, ולכן הזמן הוא $2\pi\sqrt{\dfrac{L\cos\theta}{g}} = 2\pi\sqrt{\dfrac{0.866}{9.8}} = 1.87\,\text{s}$.
      **בדיקת גבולות:** כש-$\theta \to 0$, הזמן מתקרב ל-$2\pi\sqrt{L/g} = 2.01\,\text{s}$, הזמן של מטוטלת רגילה
      בתנודות קטנות. כש-$\theta \to 90^\circ$, הזמן שואף לאפס והמתיחות, $mg/\cos\theta$, לאינסוף.
    wrongFeedback: >-
      הרדיוס של המעגל הוא $L\sin\theta$, לא $L$. כתבו את החוק השני באנך ובאופק, וחלקו כדי להיפטר מהמתיחות.
    commonWrong:
      - value: 2.01
        feedback: >-
          זה $2\pi\sqrt{L/g}$, הזמן של מטוטלת רגילה בזווית קטנה. במטוטלת קונית בזווית $30^\circ$ מופיע $L\cos\theta$,
          והזמן קצר יותר. שני הזמנים נפגשים רק בגבול $\theta \to 0$.
      - value: 1.42
        feedback: >-
          הצבתם $L\sin\theta$ במקום $L\cos\theta$. אחרי החלוקה, $\sin\theta$ מצטמצם משני האגפים, ונשאר $\cos\theta$
          מהרכיב האנכי.
    hints:
      - 'הכוחות: כובד ומתיחות. הרכיב האופקי של המתיחות הוא הכוח הרדיאלי.'

  # Added in review: the ladder had no question on v(φ) and T(φ), the hardest part of the lesson.
  - id: Q-2.6-side-tension
    type: numeric
    objectives: [OBJ-2.6-2]
    level: mid
    prompt: >-
      כדור בעל מסה $0.40\,\text{kg}$ קשור לחוט באורך $0.50\,\text{m}$ ומסתובב במעגל אנכי. בנקודה התחתונה המהירות
      שלו $4.5\,\text{m/s}$. מה המתיחות בחוט ברגע שהחוט אופקי, כשהכדור בגובה מרכז המעגל בדרכו למעלה?
    answer: 8.36
    unit: N
    correctFeedback: >-
      נכון. קודם המהירות, מהרכיב המשיקי של החוק השני וכלל השרשרת: $v^2 = v_b^2 - 2gR(1 - \cos\varphi)$, וב-$\varphi = 90^\circ$
      $v^2 = v_b^2 - 2gR = 20.25 - 9.8 = 10.45\,\text{m}^2/\text{s}^2$. ברכיב הרדיאלי, חיובי אל המרכז: כשהחוט אופקי
      הכובד ניצב לרדיוס, ואין לו רכיב רדיאלי. לכן $T = \dfrac{mv^2}{R} = \dfrac{0.40\cdot10.45}{0.50} = 8.36\,\text{N}$. ובנוסחה
      של השיעור: $T(90^\circ) = \dfrac{mv_b^2}{R} - 2mg = 16.2 - 7.84 = 8.36\,\text{N}$. **בדיקת גבולות:** אם
      $v_b = \sqrt{2gR} = 3.13\,\text{m/s}$, הכדור מגיע בדיוק לגובה המרכז ונעצר שם, ו-$T = 0$.
    wrongFeedback: >-
      שני צעדים: המהירות בגובה המרכז מהרכיב המשיקי, ואז המתיחות מהרכיב הרדיאלי. מה רכיב הכובד אל המרכז כשהחוט
      אופקי?
    commonWrong:
      - value: 16.2
        feedback: >-
          זה $mv_b^2/R$, עם המהירות של הנקודה התחתונה. אבל בדרך למעלה הכובד מאט את הכדור: הרכיב המשיקי שלו,

        misconception: MC-2-vertical-speed-constant
      - value: 12.3
        feedback: >-
          הוספתם $mg$, כמו בנקודה התחתונה. כשהחוט אופקי הכובד ניצב לרדיוס, ורכיב הכובד אל המרכז,

  - id: Q-2.7-raindrop-regime
    type: numeric
    objectives: [OBJ-2.7-2]
    level: bagrut
    prompt: >-
      טיפת גשם היא כדור מים בקוטר $D = 1.0\,\text{mm}$, שמסתו $5.24\cdot10^{-7}\,\text{kg}$. לכדור באוויר, הגרר
      הליניארי הוא בערך $F_1 = C_1Dv$ והריבועי בערך $F_2 = C_2D^2v^2$, עם $C_1 = 1.6\cdot10^{-4}\,\text{N}\cdot\text{s/m}^2$
      ו-$C_2 = 0.25\,\text{N}\cdot\text{s}^2/\text{m}^4$. הניחו שהגרר על הטיפה ריבועי בלבד ומצאו את המהירות הסופית שלה.
      אחר כך בדקו את ההנחה: מה היחס $F_2/F_1$ במהירות הסופית הזו?
    answer: 7.08
    unit: ''
    correctFeedback: >-
      נכון. $c = C_2D^2 = 2.5\cdot10^{-7}\,\text{kg/m}$, ולכן
      $v_t = \sqrt{\dfrac{mg}{c}} = \sqrt{\dfrac{5.24\cdot10^{-7}\cdot9.8}{2.5\cdot10^{-7}}} = 4.53\,\text{m/s}$, ושם
      $\dfrac{F_2}{F_1} = \dfrac{C_2}{C_1}Dv_t = 1562\cdot1.0\cdot10^{-3}\cdot4.53 = 7.08$. הגרר הריבועי שולט, וההנחה
      סבירה, אבל הליניארי עוד כשביעית ממנו: עם שני הגררים יחד המהירות הסופית $4.22\,\text{m/s}$, כ-7% פחות.
      **בדיקת גבולות:** בגרר ריבועי $v_t = \sqrt{mg/c}$, עם $m \propto D^3$ ו-$c \propto D^2$, ולכן $v_t \propto \sqrt D$
      ו-$F_2/F_1 \propto Dv_t \propto D^{3/2}$: טיפה קטנה יותר קרובה יותר לתחום הליניארי, וגדולה יותר עמוק יותר בריבועי.
    wrongFeedback: >-
      קודם המהירות הסופית לפי ההנחה: $cv_t^2 = mg$ עם $c = C_2D^2$. אחר כך היחס $\dfrac{F_2}{F_1} = \dfrac{C_2}{C_1}Dv_t$,
      עם $D$ במטרים.
    commonWrong:
      - value: 50.1
        feedback: >-
          זה היחס במהירות $mg/(C_1D) = 32.1\,\text{m/s}$, המהירות הסופית של גרר **ליניארי** בלבד. אבל יחס של 50 אומר
          שבמהירות הזו הגרר הליניארי זניח, ולכן המודל הליניארי סותר את עצמו. בודקים מודל במהירות שהוא עצמו נותן.
        misconception: MC-2-drag-always-linear
      - value: 0.141
        feedback: 'זה $F_1/F_2$, היחס ההפוך. השאלה שואלת כמה גדול הגרר הריבועי ביחס לליניארי.'
      - value: 4.53
        feedback: 'זו המהירות הסופית, $4.53\,\text{m/s}$, השלב הראשון. עכשיו הציבו אותה ביחס $F_2/F_1 = (C_2/C_1)Dv_t$.'
      - value: 7080
        feedback: 'הצבתם את $D$ במילימטרים. ביחידות SI, $D = 1.0\cdot10^{-3}\,\text{m}$, ואז היחס חסר ממדים באמת.'
    hints:

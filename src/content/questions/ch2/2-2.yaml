# Lesson 2.2 question bank: the comprehension ladder of "החוק השלישי ותרשים כוחות".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), script .scratch/ch2/q.ts:
#   Earth's acceleration from a 1 kg book: 9.8/5.97e24 = 1.64e-24 m/s²;
#   touching blocks 3 kg + 1 kg pushed by 12 N: a = 3 m/s², contact force 3.0 N (pushed from the light side 9.0 N);
#   train of 3 cars × 2.0e4 kg at 0.50 m/s²: coupling 1-2 carries 2 cars: 2.0e4 N (1 car 1.0e4, 3 cars 3.0e4);
#   table 3 kg + hanging 1 kg: a = g/4 = 2.45 m/s², T = Mmg/(M+m) = 7.35 N;
#   painter 70 kg + platform 10 kg rising at 1.0 m/s²: 2T = 80·10.8 → T = 432 N, platform on painter N = 324 N
#   (one rope segment: 864 N; no acceleration: 392 N).
# Added with the lesson (script .scratch/ch2/2-2/numbers.ts, bookScene of src/physics/bodies.ts):
#   A 2.0 kg on B 3.0 kg in an elevator accelerating down at 3.0 m/s²: A on B 2.0·6.8 = 13.6 N, floor on B 5.0·6.8 = 34 N
#   (A's weight 19.6 N).
# Review fixes (script .scratch/ch2/2-2/review.ts):
#   table-pulley now asks for the string's force on the pulley: √2·T = √2·7.35 = 10.4 N (T alone 7.35; 2T, magnitudes
#   added, 14.7; T taken as mg, √2·9.8 = 13.9);
#   bosun chair (new mid rung): person 55 kg + chair 5.0 kg at constant velocity, T = 60·9.8/2 = 294 N (one segment 588;
#   chair forgotten 55·9.8/2 = 270), chair on person N = 539 − 294 = 245 N.

chapter: 2
questions:
  # ---------------------------------------------------------------- OBJ-2.2-1 free-body diagrams and third-law pairs
  - id: Q-2.2-book-pair
    type: mc
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: basic
    prompt: >-
      ספר מונח במנוחה על שולחן. כדור הארץ מושך את הספר כלפי מטה: זה הכובד של הספר. איזה כוח יוצר איתו זוג כוחות
      של החוק השלישי?
    choices:
      - text: הספר מושך את כדור הארץ כלפי מעלה, בכוח שווה בגודלו.
        correct: true
        feedback: >-
          נכון. זוג של החוק השלישי הוא שני הכוחות של **אותה** פעולה בין שני גופים: כדור הארץ מושך את הספר, והספר מושך
          את כדור הארץ. התאוצה של כדור הארץ מספר של קילוגרם היא כ-$1.6\cdot10^{-24}\,\text{m/s}^2$, ולכן לא רואים
          אותה.
      - text: השולחן דוחף את הספר כלפי מעלה (הכוח הנורמלי).
        feedback: >-
          שני הכוחות האלה פועלים על **אותו** גוף, הספר, וזוג של החוק השלישי לעולם לא פועל על אותו גוף. הם שווים כאן
          רק כי הספר לא מאיץ: זו מסקנה מהחוק השני. במעלית שמאיצה כלפי מעלה הנורמלי גדול מהכובד, והחוק השלישי לא
          נפגע.
        misconception: MC-2-normal-is-reaction
      - text: הספר לוחץ על השולחן כלפי מטה.
        feedback: >-
          זה אכן חצי של זוג, אבל של זוג אחר: הוא מתאים לכוח הנורמלי, שהשולחן דוחף בו את הספר. הכובד הוא פעולה בין
          הספר לכדור הארץ, ולכן החצי השני שלו פועל על כדור הארץ.
        misconception: MC-2-normal-is-reaction
      - text: אין לכובד זוג, כי כדור הארץ לא זז.
        feedback: >-
          כדור הארץ כן מקבל כוח שווה בגודלו, אבל המסה שלו עצומה, ולכן התאוצה שלו זעירה. החוק השלישי חל על כל
          פעולה בין שני גופים, בלי יוצא מן הכלל.
    hints:
      - 'זוג של החוק השלישי: אם A פועל על B, אז B פועל על A. מי הגוף שמפעיל את הכובד על הספר?'

  - id: Q-2.2-truck-car
    type: mc
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: basic
    prompt: >-
      משאית בעלת מסה $10\,000\,\text{kg}$ מתנגשת חזיתית במכונית בעלת מסה $1\,000\,\text{kg}$. במהלך ההתנגשות,
      מה נכון לגבי הכוח שהמשאית מפעילה על המכונית והכוח שהמכונית מפעילה על המשאית?
    choices:
      - text: הם שווים בגודלם בכל רגע של ההתנגשות.
        correct: true
        feedback: >-
          נכון. אלה שני הכוחות של אותה פעולה, זוג של החוק השלישי. מה ששונה הוא **התאוצה**: אותו כוח נותן למכונית
          תאוצה גדולה פי 10, ולכן היא, והנוסעים בה, נפגעים יותר.
      - text: הכוח של המשאית על המכונית גדול יותר, כי המסה של המשאית גדולה יותר.
        feedback: >-
          המסה הגדולה קובעת שהמשאית **מאיצה** פחות, לא שהיא מפעילה יותר כוח. לפי החוק השלישי שני הכוחות שווים, ולפי
          החוק השני $a = F/m$ שונה לכל גוף.
        misconception: MC-2-bigger-pushes-harder
      - text: זה תלוי במהירויות. הגוף המהיר יותר מפעיל את הכוח הגדול יותר.
        feedback: >-
          החוק השלישי לא תלוי במהירויות, במסות או בשאלה מי "התחיל". המהירויות קובעות כמה גדול הכוח, אבל הוא שווה
          בשני הכיוונים בכל רגע.
        misconception: MC-2-bigger-pushes-harder
      - text: הכוח של המכונית על המשאית גדול יותר, כי המכונית נעצרת מהר יותר.
        feedback: >-
          המכונית נעצרת מהר יותר כי המסה שלה קטנה: אותו כוח נותן לה תאוצה גדולה יותר. העצירה המהירה היא תוצאה של
          החוק השני, לא של כוח גדול יותר.
    hints:
      - 'הפרידו בין שתי שאלות: מה גודל הכוחות (החוק השלישי), ומה התאוצות (החוק השני).'

  - id: Q-2.2-horse-cart
    type: twotier
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: mid
    prompt: >-
      סוס מושך עגלה, ולפי החוק השלישי העגלה מושכת את הסוס אחורה בכוח שווה בגודלו. בכל זאת, הסוס והעגלה יוצאים
      ממנוחה ומאיצים קדימה. איך זה ייתכן?
    choices:
      - text: הכוחות פועלים על גופים שונים. העגלה מאיצה כי הסוס מושך אותה, והסוס מאיץ כי הקרקע דוחפת את רגליו קדימה יותר משהעגלה מושכת אותו אחורה.
        correct: true
        feedback: נכון. ומה הנימוק הכללי שעומד מאחורי זה?
      - text: ברגע ההתחלה הסוס מושך את העגלה חזק יותר משהעגלה מושכת אותו.
        feedback: >-
          החוק השלישי מתקיים בכל רגע, גם כשהגופים מאיצים. הכוח של הסוס על העגלה והכוח של העגלה על הסוס שווים תמיד.
        misconception: MC-2-third-law-only-static
      - text: שני הכוחות מבטלים זה את זה, ולכן המערכת נעה רק בזכות התנופה שהסוס צבר.
        feedback: >-
          כוחות מתבטלים רק כשהם פועלים על **אותו** גוף. הכוח של הסוס פועל על העגלה, והכוח של העגלה פועל על הסוס,
          ולכן אין ביניהם מה לבטל.
        misconception: MC-2-third-law-cancel
    reasons:
      - text: התנועה של כל גוף נקבעת רק מהכוחות שפועלים עליו. שני הכוחות של זוג לעולם לא נמצאים באותו תרשים כוחות.
        correct: true
        feedback: >-
          זה הנימוק. בתרשים של העגלה: משיכת הסוס קדימה, וחיכוך קטן אחורה. בתרשים של הסוס: הקרקע קדימה, והעגלה
          אחורה. כל גוף מאיץ לפי השקול שלו.
      - text: החוק השלישי מתקיים רק כשהגופים במנוחה או במהירות קבועה.
        feedback: 'החוק השלישי לא תלוי בתנועה: הוא מתקיים גם בהתנגשות וגם בזינוק.'
        misconception: MC-2-third-law-only-static
      - text: המסה של הסוס גדולה מהמסה של העגלה.
        feedback: >-
          גם עגלה כבדה מהסוס יכולה לצאת לדרך, אם הקרקע דוחפת את הסוס חזק מספיק. המסות לא משנות את השוויון בין שני
          הכוחות של הזוג.
    hints:
      - 'שרטטו שני תרשימי כוחות נפרדים, אחד לסוס ואחד לעגלה. באיזה תרשים מופיע כל אחד מהכוחות?'

  - id: Q-2.2-stack-forces
    type: multi
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: mid
    prompt: >-
      גוש A מונח על גוש B, ו-B מונח על רצפה חלקה. כוח אופקי $\vec F$ מושך את B ימינה, ושני הגושים מאיצים יחד
      ימינה, בלי ש-A מחליק על B. אילו כוחות מופיעים בתרשים הכוחות של **הגוש B**? סמנו את כולם.
    choices:
      - text: הכובד של B, כלפי מטה.
        correct: true
        feedback: נכון. כדור הארץ מושך את B.
      - text: הכוח הנורמלי של הרצפה על B, כלפי מעלה.
        correct: true
        feedback: נכון. הוא שווה לכובד של שני הגושים יחד, כי אף גוש לא מאיץ אנכית.
      - text: הכוח הנורמלי ש-A לוחץ בו על B, כלפי מטה.
        correct: true
        feedback: 'נכון. זה החצי השני של הכוח הנורמלי ש-B דוחף בו את A כלפי מעלה.'
      - text: כוח החיכוך ש-A מפעיל על B, שמאלה.
        correct: true
        feedback: >-
          נכון. A מאיץ ימינה, והכוח האופקי היחיד עליו הוא החיכוך של B, ימינה. לפי החוק השלישי, A מפעיל על B חיכוך
          שווה בגודלו, שמאלה.
      - text: הכוח $\vec F$, ימינה.
        correct: true
        feedback: נכון. הוא מושך את B ישירות.
      - text: הכובד של A, כלפי מטה.
        feedback: >-
          את הכובד של A מפעיל כדור הארץ על A, ולכן הוא שייך לתרשים של A. ההשפעה של A על B עוברת דרך כוח המגע
          ביניהם, הנורמלי. כאן הם שווים, אבל במעלית שמאיצה הם כבר לא.
        misconception: MC-2-weight-transmits
      - text: כוח החיכוך של הרצפה על B, שמאלה.
        feedback: 'הרצפה חלקה, ולכן אין חיכוך בין B לרצפה.'
    hints:
      - 'לכל כוח בתרשים של B שאלו: איזה גוף מפעיל אותו? הכוח צריך לפעול **על** B.'

  - id: Q-2.2-elevator-stack
    type: multi
    objectives: [OBJ-2.2-1]
    qualitative: true
    level: bagrut
    prompt: >-
      גוש A, $2.0\,\text{kg}$, מונח על גוש B, $3.0\,\text{kg}$, ו-B מונח על רצפה של מעלית שמאיצה כלפי מטה בתאוצה
      $3.0\,\text{m/s}^2$. שני הגושים נעים עם המעלית. אילו מהמשפטים נכונים? סמנו את כולם.
    choices:
      - text: A לוחץ על B כלפי מטה בכוח $13.6\,\text{N}$.
        correct: true
        feedback: >-
          נכון. בתרשים של A: $m_Ag - N_1 = m_Aa$ (כלפי מטה חיובי), ולכן $N_1 = m_A(g - a) = 2.0\cdot6.8 = 13.6\,\text{N}$.
          לפי החוק השלישי A לוחץ על B באותו כוח.
      - text: הרצפה דוחפת את B כלפי מעלה בכוח $34\,\text{N}$.
        correct: true
        feedback: >-
          נכון. בתרשים של B: $m_Bg + N_1 - N_2 = m_Ba$, ולכן $N_2 = m_Bg + N_1 - m_Ba = 34\,\text{N}$. אותו דבר יוצא מהמערכת A ו-B יחד:
          $N_2 = (m_A + m_B)(g - a)$, כי $N_1$ פנימי ומתבטל.
      - text: A לוחץ על B בכוח $19.6\,\text{N}$, הכובד של A.
        feedback: >-
          את הכובד של A מפעיל כדור הארץ על A, והוא לא מופיע בתרשים של B. על B פועל רק כוח המגע של A, והוא קטן מהכובד של A,
          כי A מאיץ כלפי מטה.
        misconception: MC-2-weight-transmits
      - text: הכוח הנורמלי ש-B מפעיל על A והכובד של A הם זוג של החוק השלישי.
        feedback: >-
          שניהם פועלים על A, וזוג של החוק השלישי לעולם לא פועל על גוף אחד. הזוג של הנורמלי הוא הלחיצה של A על B; הזוג של הכובד של A
          הוא המשיכה של A את כדור הארץ. כאן הם גם לא שווים: $13.6\,\text{N}$ לעומת $19.6\,\text{N}$.
        misconception: MC-2-normal-is-reaction
      - text: B דוחף את A כלפי מעלה בכוח קטן מזה ש-A לוחץ על B, כי A מאיץ כלפי מטה.
        feedback: >-
          החוק השלישי מתקיים גם בתאוצה: שני הכוחות שווים, $13.6\,\text{N}$. התאוצה של A נקבעת מההפרש בין הכובד שלו לבין
          הנורמלי, שניהם על A.
        misconception: MC-2-third-law-only-static
    hints:
      - 'שרטטו תרשים ל-A לבד. מה התאוצה שלו, ואילו שני כוחות קובעים אותה?'

  # ---------------------------------------------------------------- OBJ-2.2-2 equations of motion of several bodies
  - id: Q-2.2-two-blocks
    type: numeric
    objectives: [OBJ-2.2-2]
    level: basic
    prompt: >-
      שני גושים צמודים זה לזה על רצפה חלקה: $m_1 = 3.0\,\text{kg}$ משמאל ו-$m_2 = 1.0\,\text{kg}$ מימין. דוחפים
      את $m_1$ ימינה בכוח אופקי $F = 12\,\text{N}$. מה גודל הכוח ש-$m_1$ מפעיל על $m_2$?
    answer: 3.0
    unit: N
    correctFeedback: >-
      נכון. שני הגושים מאיצים יחד: $a = \dfrac{F}{m_1 + m_2} = 3.0\,\text{m/s}^2$. הכוח האופקי היחיד על $m_2$ הוא
      כוח המגע, ולכן $P = m_2a = 3.0\,\text{N}$. בתרשים של $m_1$: $F - P = m_1a$, כלומר $12 - 3 = 9$, כמו שצריך.
    wrongFeedback: 'מצאו קודם את התאוצה המשותפת. אחר כך כתבו את החוק השני לגוש שעליו פועל רק כוח המגע.'
    commonWrong:
      - value: 12
        feedback: >-
          הכוח שדוחפים בו לא עובר כמו שהוא לגוש השני. אם $m_2$ היה מקבל $12\,\text{N}$, התאוצה שלו הייתה
          $12\,\text{m/s}^2$, והוא היה מתרחק מ-$m_1$. הוא מקבל בדיוק את הכוח שדרוש כדי להאיץ אותו יחד עם $m_1$.
        misconception: MC-2-push-transmits-fully
      - value: 9.0
        feedback: 'זה $m_1a$, הכוח השקול על $m_1$. כוח המגע מאיץ את $m_2$, ולכן הוא $m_2a$.'
    hints:
      - 'שרטטו תרשים כוחות נפרד לכל גוש. בתרשים של $m_2$ יש רק כוח אופקי אחד.'

  - id: Q-2.2-push-other-side
    type: mc
    objectives: [OBJ-2.2-2]
    qualitative: true
    level: mid
    prompt: >-
      אותם שני גושים ($m_1 = 3.0\,\text{kg}$ משמאל ו-$m_2 = 1.0\,\text{kg}$ מימין), אבל עכשיו דוחפים בכוח
      $12\,\text{N}$ את $m_2$, הקל, שמאלה. מה קורה לכוח המגע בין הגושים?
    choices:
      - text: הוא גדל ל-$9.0\,\text{N}$.
        correct: true
        feedback: >-
          נכון. התאוצה זהה, $3.0\,\text{m/s}^2$, אבל עכשיו כוח המגע צריך להאיץ את הגוש **הכבד**: $P = m_1a = 9.0\,\text{N}$.
          כשדוחפים שורה של גופים, הכוח במגע בין שני גופים שווה למסה של הגופים שהוא דוחף, אלה שנמצאים קדימה ממנו
          בכיוון התנועה, כפול התאוצה. כאן המגע דוחף את $m_1$, שנמצא קדימה כשהתנועה שמאלה.
      - text: הוא לא משתנה, $3.0\,\text{N}$, כי לפי החוק השלישי לא משנה מאיזה צד דוחפים.
        feedback: >-
          החוק השלישי אומר רק ששני הגושים דוחפים זה את זה בכוחות שווים. הגודל של הכוח הזה נקבע מהחוק השני, לפי הגוש
          שהוא צריך להאיץ, ועכשיו זה הגוש של $3.0\,\text{kg}$.
      - text: הוא $12\,\text{N}$, הכוח שדוחפים בו.
        feedback: >-

  - id: Q-2.2-table-pulley
    type: numeric
    objectives: [OBJ-2.2-2]
    level: bagrut
    prompt: >-
      גוש בעל מסה $M = 3.0\,\text{kg}$ על שולחן אופקי חלק קשור בחוט חסר מסה. החוט עובר על גלגלת חסרת מסה וחסרת
      חיכוך בקצה השולחן, ובקצהו השני תלויה משקולת בעלת מסה $m = 1.0\,\text{kg}$. משחררים את המערכת ממנוחה. בזמן
      התנועה, מה גודל הכוח הכולל שהחוט מפעיל על הגלגלת (הכוח שהציר שלה צריך לאזן)?
    answer: 10.4
    unit: N
    correctFeedback: >-
      נכון. קודם המתיחות. לגוש: $T = Ma$. למשקולת, עם כיוון חיובי כלפי מטה: $mg - T = ma$. מחברים:
      $a = \dfrac{mg}{M + m} = 2.45\,\text{m/s}^2$, ו-$T = \dfrac{Mm}{M + m}\,g = 7.35\,\text{N}$. אחר כך הגלגלת: החוט
      מושך אותה בשני הקצוות של הקטע שנוגע בה, ב-$T$ אופקית, לעבר הגוש, וב-$T$ כלפי מטה, לעבר המשקולת. שני הכוחות
      ניצבים, ולכן גודל הסכום $\sqrt{T^2 + T^2} = \sqrt2\,T = 10.4\,\text{N}$, בזווית $45^\circ$ מתחת לאופק.
      **בדיקת גבולות:** כש-$M \to \infty$, $T \to mg$ והכוח על הגלגלת שואף ל-$\sqrt2\,mg = 13.9\,\text{N}$: משקולת
      שתלויה במנוחה. כש-$M \to 0$, $T \to 0$: המשקולת נופלת חופשית, והחוט לא מושך את הגלגלת בכלל.
    wrongFeedback: >-
      שני צעדים. קודם המתיחות: החוק השני לכל גוף בנפרד, כל אחד בכיוון התנועה שלו. אחר כך הגלגלת: באילו כיוונים
      החוט מושך אותה, ובכמה נקודות?
    commonWrong:
      - value: 7.35
        feedback: >-
          זו המתיחות, $T$. אבל החוט מושך את הגלגלת **פעמיים**: בקטע האופקי, לעבר הגוש, ובקטע האנכי, לעבר המשקולת.
          הכוח הכולל הוא הסכום הווקטורי של שתי המשיכות.
      - value: 14.7
        feedback: >-
          חיברתם את הגדלים, $T + T = 2T$. שתי המשיכות ניצבות זו לזו, אופקית ואנכית, ולכן מחברים אותן ברכיבים:
          $\sqrt{T^2 + T^2} = \sqrt2\,T$.
        misconception: MC-2-add-magnitudes
      - value: 13.9
        feedback: >-
          זה $\sqrt2\,mg$: הנחתם שהמתיחות שווה לכובד של המשקולת. זה נכון רק כשהמשקולת לא מאיצה. כאן היא מאיצה כלפי
          מטה, ולכן $T < mg$: $T = 7.35\,\text{N}$.
        misconception: MC-2-tension-equals-hanging-weight
    hints:
      - 'מצאו קודם את $T$: שתי משוואות, שני נעלמים, $a$ ו-$T$. חברו אותן כך ש-$T$ יתבטל.'
      - 'החוט נוגע בגלגלת לאורך רבע עיגול, ומושך אותה בשני הקצוות שלו: לאיזה כיוון כל משיכה?'

  - id: Q-2.2-painter
    type: numeric
    objectives: [OBJ-2.2-2]
    level: bagrut
    prompt: >-
      צבעית בעלת מסה $M = 70\,\text{kg}$ עומדת על פיגום תלוי בעל מסה $m = 10\,\text{kg}$. חבל קשור לפיגום, עולה אל
      גלגלת קבועה בגג, ויורד חזרה אל הידיים של הצבעית. היא מושכת את החבל כלפי מטה, והיא והפיגום עולים יחד בתאוצה
      $1.0\,\text{m/s}^2$. החבל והגלגלת חסרי מסה וחסרי חיכוך. באיזה כוח היא מושכת בחבל?
    answer: 432
    unit: N
    correctFeedback: >-
      נכון. בוחרים מערכת של הצבעית והפיגום יחד: שני קטעי חבל מושכים אותה כלפי מעלה, כל אחד ב-$T$. לכן
      $2T - (M + m)g = (M + m)a$, ו-$T = \dfrac{(M + m)(g + a)}{2} = \dfrac{80\cdot10.8}{2} = 432\,\text{N}$. בתרשים של
      הצבעית לבדה: $T + N - Mg = Ma$, ולכן הפיגום דוחף אותה בכוח נורמלי $N = 324\,\text{N}$. **בדיקת גבולות:** כש-$a = 0$,
      $T = (M + m)g/2$: כל קטע חבל מחזיק חצי מהכובד.
    wrongFeedback: >-
      שרטטו את המערכת "צבעית + פיגום". כמה קטעי חבל מחוברים אליה, ובאיזה כוח מושך כל אחד?
    commonWrong:
      - value: 864
        feedback: >-
          ספרתם קטע חבל אחד. החבל מושך את המערכת בשני מקומות: בפיגום, ובידיים של הצבעית (לפי החוק השלישי, החבל מושך
          את הידיים כלפי מעלה בכוח שהיא מושכת אותו כלפי מטה).
      - value: 392
        feedback: 'זה $(M + m)g/2$, הכוח שמחזיק את המערכת במנוחה. כדי שהיא תאיץ כלפי מעלה, צריך גם $(M + m)a/2$.'
    hints:
      - 'כשהצבעית מושכת את החבל כלפי מטה, באיזה כיוון החבל מושך אותה?'

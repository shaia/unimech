    level: mid
    prompt: >-
      אדם בעל מסה $55\,\text{kg}$ יושב בכיסא תלוי בעל מסה $5.0\,\text{kg}$. חבל קשור לכיסא, עולה אל גלגלת קבועה
      בתקרה, ויורד חזרה אל הידיים של האדם. האדם מושך את החבל כלפי מטה, והוא והכיסא עולים יחד **במהירות קבועה**.
      החבל והגלגלת חסרי מסה וחסרי חיכוך. באיזה כוח הוא מושך בחבל?
    answer: 294
    unit: N
    correctFeedback: >-
      נכון. בוחרים כגוף אחד את המערכת "אדם + כיסא", $60\,\text{kg}$. החבל חוצה את הגבול שלה פעמיים, ומושך אותה
      כלפי מעלה בשתי הנקודות: בכיסא, שאליו הוא קשור, ובידיים, כי כשהאדם מושך את החבל כלפי מטה, החבל מושך אותו כלפי
      מעלה באותו כוח (החוק השלישי). החבל קל, ולכן בשני המקומות אותה מתיחות $T$. במהירות קבועה התאוצה אפס:
      $2T - 60\cdot9.8 = 0$, ולכן $T = 294\,\text{N}$, חצי מהכובד של המערכת. הכוח של הכיסא על האדם, מהתרשים שלו לבדו:
      $N = 55\cdot9.8 - 294 = 245\,\text{N}$.
    wrongFeedback: >-
      בחרו כגוף אחד את האדם והכיסא יחד. בכמה נקודות החבל מושך את המערכת הזו, ולאיזה כיוון?
    commonWrong:
      - value: 588
        feedback: >-
          זה הכובד של המערכת כולה, כאילו קטע חבל אחד מחזיק אותה. אבל החבל מושך את המערכת בשני מקומות: בכיסא,
          ובידיים של האדם, שהחבל מושך כלפי מעלה (לפי החוק השלישי). כל קטע נושא חצי.
      - value: 270
        feedback: >-
          זה $55\cdot9.8/2$: שכחתם את הכיסא. החבל מרים את האדם **ואת** הכיסא, $60\,\text{kg}$ יחד.
    hints:

# Chapter 1 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג…), 25 points each, graded
# easy → hard. Each problem joins at least two lessons, and the four together touch every lesson:
#   1 (projectile seen by a radar): 1.2, 1.3, 1.4;   2 (launcher on a flatcar, then braking): 1.2, 1.5;
#   3 (ring pushed along a rotating rod): 1.1, 1.3, 1.4;   4 (boat across a river with a curved current): 1.1, 1.3, 1.5;
#   5 (a moth spirals into a lamp, in symbols, in the format of a 77101 exam question): 1.1, 1.3, 1.4 with chapter 0
#     (0.2 dot product, 0.4 accumulation, 0.5 separation of variables, 0.7 polar arc length).
# Open parts follow the course format: law → derivation → limit check → unit check → numbers → result.
# Part types and points (exam-style rework, 2026-11-18: open parts ≥ 13 of 25, the first part auto-graded, the last
# a symbolic result with its limit check):
#   1: numeric 5 · numeric 5 · open 8 · open 7 (was numeric)  = open 15
#   2: vector 3 · numeric 4 · open 6 (was numeric) · mc 4 (was ה, now introduces the braking) · open 8 (was ד, now
#      in symbols)  = open 14
#   3: numeric 4 · open 7 · numeric 6 · open 8 (was numeric)  = open 15
#   4: numeric 4 · numeric 4 · open 10 · open 7 (was numeric)  = open 17
#   5: numeric 5 · open 6 · open 6 · open 8 (new)  = open 20
# The rework was recomputed in .scratch/ch1/review-rework.ts, each closed form against a second route:
#   1ד r̈ = (|v|² − ṙ² + r·a)/r = a_r + rθ̇² against finite differences of r(t) (1e-5): −3.55 m/s² (|v|² − ṙ² = 69.2,
#      −gy = −200, a_r = −5.44, rθ̇² = 1.88);
#   2ג D = 2|u_x|u_y/g against the ground-frame ball − launcher difference: 22.0 m (T = 2.45 s, 7.35 and 29.4 over ground);
#   2ה x_rel(T) = (2u_y/g)(u_x + Au_y/g) against ground-frame positions with braking: −16.0 m; car at 7.10 m/s;
#   3ד ρ = (u² + r²ω²)^{3/2}/(ω(2u² + r²ω²)) against tangentNormal of the Cartesian path by finite differences: 0.368 m
#      (|v|²/|a| 0.347, |v|²/|a_r| 0.625); r → 0 gives u/(2ω) = 0.15 m, checked by tangentNormal near the centre;
#   4ד ρ(y) = (u² + c²)^{3/2}/(u²|c′|) against the graph formula of x(y) at y = 0, 10, 20 m: ρ(0) = ud/(4c₀) = 20 m
#      (a = 0.20 m/s², dc/dy 0.10 s⁻¹ gives 40);
#   5 (v = 2.0 m/s, α = 120°, r₀ = 3.0 m in א only): T = r₀/(v|cos α|) = 3.00 s (sin 1.73, r₀/v 1.50, > 3% apart);
#      the flight integrated by RK4 in Cartesian coordinates: r after one turn = r₀e^{2π cot α} = 0.0797 m (a factor
#      37.6 per turn), time and path length down to r = 1 cm agree with (r₀ − r)/(v|cos α|) and (r₀ − r)/|cos α|
#      (1e-4), L = r₀/|cos α| = 6.0 m; a_r, a_θ from polar.ts polarAcceleration agree with −v² sin²α/r and
#      v² sin α cos α/r, pathComponents gives a_t = 0, ρ = v²/a_n = r/sin α.
# YAML note: never use "…" for TeX; in a single-quoted string a prime is written ''.
#
# Every number was computed in .scratch/ch1/q.ts with src/physics/constants.ts (G = 9.8):
#   1: v₀ = (15, 20) m/s: t_top = 2.04 s, H = 20.4 m (v₀²/2g 31.9, v_y²/g 40.8, v_x²/2g 11.5), x_top = 30.6 m,
#      ρ_top = v_x²/g = 23.0 m (v₀²/g 63.8); r = 36.8 m, ṙ = 12.5 m/s, θ̇ = −0.226 rad/s, a_r = −gy/r = −5.44 m/s²,
#      r̈ = a_r + rθ̇² = −3.55 m/s² (sign error −7.32); ṙ, θ̇ and r̈ also checked by finite differences of r(t), θ(t);
#   2: u = (−9.0, 12) m/s on a car at 12 m/s: ground speed 12.4 m/s (15, 24.2, 27); T = 2.45 s, lands 22.0 m behind
#      the launcher (ground 7.35, VT 29.4); braking A = 2.0 m/s²: ½AT² = 6.00 m, lands 16.0 m behind, car at 7.10 m/s;
#   3: r₀ = 0.10 m, u = 0.60 m/s, ω = 2.0 rad/s, t = 0.50 s: r = 0.40 m, v = (0.60, 0.80), |v| = 1.00 m/s;
#      a = (−1.6, 2.4), |a| = 2.88 m/s²; a_t = 0.96 m/s² (= rṙω²/|v|); a⊥ = 2.72 m/s², ρ = 0.368 m (v²/|a| 0.347,
#      v²/|a_r| 0.625); ρ by finite differences of the lab path agrees;
#   4: d = 60 m, current c₀ = 1.5 m/s, boat u = 2.0 m/s relative to the water: T = 30 s (24, 120); speed at
#      mid-river 2.5 m/s; drift 2c₀d/(3u) = 30 m (a midpoint sum agrees; uniform current 45 m); ρ at the bank
#      = ud/(4c₀) = 20 m (no chain rule 40). Recomputed in .scratch/ch1/1-5/bagrut.ts after the renaming.

chapter: 1
questions:
  # ------------------------------------------------------------ 1: a projectile seen by a radar at the launch point
  - id: Q-1-bagrut-1
    type: bagrut
    title: מכ״ם עוקב אחרי כדור
    prompt: >-
      כדור נזרק מהקרקע מהנקודה O במהירות $v_0 = 25\,\text{m/s}$, ברכיבים $v_{0x} = 15\,\text{m/s}$ אופקית ו-$v_{0y} = 20\,\text{m/s}$
      כלפי מעלה. אין התנגדות אוויר. מכ״ם שעומד בנקודה O עוקב אחרי הכדור ומודד בכל רגע שני גדלים: המרחק $r$ מ-O אל
      הכדור, וזווית ההגבהה $\theta$ של הכדור מעל האופק. כלומר, המכ״ם מתאר את התנועה בקואורדינטות קוטביות סביב O,
      עם $\hat r = (\cos\theta,\ \sin\theta)$ ו-$\hat\theta = (-\sin\theta,\ \cos\theta)$. ציר $x$ אופקי בכיוון הזריקה, וציר
      $y$ כלפי מעלה.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-1.2-2]
        prompt: מה הגובה המרבי של הכדור?
        answer: 20.4
        unit: m
        correctFeedback: 'נכון. בשיא $v_y = 0$, ולכן $H = \dfrac{v_{0y}^2}{2g} = \dfrac{400}{19.6} = 20.4\,\text{m}$, ברגע $t = v_{0y}/g = 2.04\,\text{s}$.'
        wrongFeedback: 'רק הרכיב האנכי של המהירות נאבק בכובד. כתבו $v_y^2 = v_{0y}^2 - 2gy$ ודרשו $v_y = 0$.'
        commonWrong:
          - value: 31.9
            feedback: 'הצבתם את כל $v_0 = 25\,\text{m/s}$, כמו בזריקה אנכית. הרכיב האופקי לא משתנה, ולכן הוא לא נכנס לגובה.'
          - value: 40.8
            feedback: 'שכחתם את ה-2 במכנה: $H = v_{0y}^2/(2g)$.'
          - value: 11.5
            feedback: 'הצבתם את הרכיב האופקי. את הגובה קובע הרכיב האנכי, $20\,\text{m/s}$.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-1.3-2]
        prompt: מה רדיוס העקמומיות של המסלול בנקודה הגבוהה ביותר?
        answer: 23
        unit: m
        correctFeedback: >-
          נכון. בשיא המהירות אופקית, $15\,\text{m/s}$, ו-$\vec g$ ניצב לה כולו. לכן
          $\rho = \dfrac{v_x^2}{g} = \dfrac{225}{9.8} = 23.0\,\text{m}$.
        wrongFeedback: 'בשיא, מה גודל המהירות ואיזה חלק מ-$\vec g$ ניצב לה? $\rho = v^2/a_\perp$.'
        commonWrong:
          - value: 20.4
            feedback: 'זה הגובה המרבי. רדיוס העקמומיות לא נמדד מהקרקע: הוא $v^2/a_\perp$ בנקודה עצמה.'
            misconception: MC-1-curvature-radius-is-a-distance
          - value: 30.6
            feedback: 'זה המרחק האופקי מ-O עד השיא. רדיוס העקמומיות נקבע מהמהירות ומהתאוצה בשיא, לא ממרחק בציור.'
            misconception: MC-1-curvature-radius-is-a-distance
          - value: 63.8
            feedback: 'הצבתם את מהירות הזריקה, $25\,\text{m/s}$. בשיא נשאר רק הרכיב האופקי, $15\,\text{m/s}$.'

      - label: ג
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-1.4-1, OBJ-1.4-2]
        prompt: >-
          (1) מ-$\vec v = \dot r\hat r + r\dot\theta\hat\theta$ הראו ש-$\dot r = \vec v\cdot\hat r$ ו-$r\dot\theta = \vec v\cdot\hat\theta$, וכתבו
          את $\dot r$ ואת $\dot\theta$ בעזרת $x$, $y$, $v_x$ ו-$v_y$.

          (2) בדקו את שני הביטויים בשני מקרים פשוטים: גוף שנע ישר הרחק מ-O, וגוף שנע על מעגל סביב O.

          (3) חשבו את $\dot r$ ואת $\dot\theta$ שהמכ״ם מודד ברגע שהכדור בנקודה הגבוהה ביותר.
        hints:
          - '$\hat r$ ו-$\hat\theta$ הם וקטורי יחידה ניצבים: $\hat r\cdot\hat r = 1$ ו-$\hat r\cdot\hat\theta = 0$.'
          - '$\hat r = (x,\ y)/r$ ו-$\hat\theta = (-y,\ x)/r$.'
        solution:
          - { kind: law, text: 'המהירות בקואורדינטות קוטביות: $\vec v = \dot r\hat r + r\dot\theta\hat\theta$, עם $\hat r = \dfrac{(x,\ y)}{r}$ ו-$\hat\theta = \dfrac{(-y,\ x)}{r}$.' }
          - { kind: manipulation, text: 'מכפילים סקלרית ב-$\hat r$: מכיוון ש-$\hat r\cdot\hat r = 1$ ו-$\hat\theta\cdot\hat r = 0$, נשאר $\dot r = \vec v\cdot\hat r = \dfrac{xv_x + yv_y}{r}$. מכפילים ב-$\hat\theta$: $r\dot\theta = \vec v\cdot\hat\theta = \dfrac{xv_y - yv_x}{r}$, ולכן $\dot\theta = \dfrac{xv_y - yv_x}{r^2}$.' }
          - { kind: limit, text: 'גוף שנע ישר הרחק מ-O: $\vec v \parallel \vec r$, ולכן $xv_y - yv_x = 0$ ו-$\dot\theta = 0$, ו-$\dot r = |\vec v|$. גוף על מעגל סביב O: $\vec v \perp \vec r$, ולכן $xv_x + yv_y = 0$ ו-$\dot r = 0$, ו-$|\dot\theta| = |\vec v|/r$. שני המקרים יוצאים נכון.' }
          - { kind: units, text: '$\dfrac{\text{m}\cdot\text{m/s}}{\text{m}} = \text{m/s}$ ל-$\dot r$, ו-$\dfrac{\text{m}\cdot\text{m/s}}{\text{m}^2} = \text{s}^{-1}$, רדיאנים לשנייה, ל-$\dot\theta$.' }
          - { kind: substitution, text: 'בשיא, $t = 2.04\,\text{s}$: $x = 15\cdot2.04 = 30.6\,\text{m}$, $y = 20.4\,\text{m}$, $r = \sqrt{30.6^2 + 20.4^2} = 36.8\,\text{m}$, ו-$\vec v = (15,\ 0)\,\text{m/s}$. לכן $\dot r = \dfrac{30.6\cdot15}{36.8} = 12.5\,\text{m/s}$ ו-$\dot\theta = -\dfrac{20.4\cdot15}{36.8^2} = -0.226\,\text{rad/s}$.' }
          - { kind: result, text: '$\dot r = \dfrac{xv_x + yv_y}{r}$ ו-$\dot\theta = \dfrac{xv_y - yv_x}{r^2}$. בשיא $\dot r = 12.5\,\text{m/s}$, פחות מגודל המהירות, $15\,\text{m/s}$, כי רק חלק ממנה לאורך $\hat r$; ו-$\dot\theta = -0.226\,\text{rad/s}$: זווית ההגבהה כבר יורדת, והמכ״ם מנמיך את האנטנה.' }
        rubric:
          - text: כתבתי $\vec v = \dot r\hat r + r\dot\theta\hat\theta$ והכפלתי סקלרית ב-$\hat r$ וב-$\hat\theta$ כדי לבודד כל רכיב.
          - text: 'ביטאתי את $\hat r$ ואת $\hat\theta$ בעזרת $x$, $y$ ו-$r$, וקיבלתי $\dot r = (xv_x + yv_y)/r$ ו-$\dot\theta = (xv_y - yv_x)/r^2$.'
          - text: בדקתי שבתנועה ישר הרחק מ-O יוצא $\dot\theta = 0$, ושבתנועה על מעגל סביב O יוצא $\dot r = 0$.
          - text: 'מצאתי את המקום בשיא, $(30.6,\ 20.4)\,\text{m}$, וקיבלתי $\dot r \approx 12.5\,\text{m/s}$ ו-$\dot\theta \approx -0.226\,\text{rad/s}$, עם הסימן.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-1.4-2, OBJ-1.4-1]
        prompt: >-
          המכ״ם מודד גם את $\ddot r$, הנגזרת השנייה של המרחק אל הכדור.

          (1) גזרו פעמיים לפי הזמן את $r^2 = \vec r\cdot\vec r$, והראו ש-$$\ddot r = \frac{|\vec v|^2 - \dot r^2 + \vec r\cdot\vec a}{r}$$

          (2) הראו שהביטוי מתאים לרכיב הרדיאלי של התאוצה הקוטבית, $a_r = \ddot r - r\dot\theta^2$.

          (3) בדקו את הביטוי בגבול $g \to 0$, כשהכדור חולף ליד O בקו ישר ובמהירות קבועה. מה הסימן של $\ddot r$, ולמה?

          (4) חשבו את $\ddot r$ ברגע שהכדור בנקודה הגבוהה ביותר, בעזרת התוצאות של חלק ג.
        hints:
          - '$\dfrac{d}{dt}\left(\vec r\cdot\vec r\right) = 2\vec r\cdot\vec v$, ו-$\dfrac{d}{dt}\left(\vec r\cdot\vec v\right) = |\vec v|^2 + \vec r\cdot\vec a$.'
          - 'בקואורדינטות קוטביות, $|\vec v|^2 = \dot r^2 + r^2\dot\theta^2$ ו-$\vec r\cdot\vec a = ra_r$.'
        solution:
          - { kind: law, text: '$r^2 = \vec r\cdot\vec r$, עם $\dot{\vec r} = \vec v$ ו-$\dot{\vec v} = \vec a$. בתאוצה הקוטבית $a_r = \ddot r - r\dot\theta^2$.' }
          - { kind: manipulation, text: 'גזירה ראשונה: $2r\dot r = 2\vec r\cdot\vec v$, כלומר $r\dot r = \vec r\cdot\vec v$. גזירה שנייה: $\dot r^2 + r\ddot r = |\vec v|^2 + \vec r\cdot\vec a$, ומכאן $$\ddot r = \frac{|\vec v|^2 - \dot r^2 + \vec r\cdot\vec a}{r}$$' }
          - { kind: manipulation, text: 'עם $|\vec v|^2 - \dot r^2 = r^2\dot\theta^2$ ו-$\vec r\cdot\vec a = ra_r$: $\ddot r = r\dot\theta^2 + a_r$, כלומר $a_r = \ddot r - r\dot\theta^2$. לכן $\ddot r$ אינו הרכיב הרדיאלי של התאוצה: הם שונים ב-$r\dot\theta^2$.' }
          - { kind: limit, text: 'כש-$g \to 0$, $\vec a = 0$ ו-$\ddot r = \dfrac{|\vec v|^2 - \dot r^2}{r} = r\dot\theta^2 \ge 0$, אף שאין תאוצה. כך צריך להיות: גוף שחולף ליד O בקו ישר מתקרב, עובר במרחק המינימלי ומתרחק, והגרף של $r(t) = \sqrt{b^2 + v^2t^2}$ (עם $b$ המרחק המינימלי) קעור כלפי מעלה. רק בתנועה לאורך קו שעובר דרך O, $\dot\theta = 0$ ו-$\ddot r = a_r$.' }
          - { kind: units, text: '$\dfrac{\text{m}^2/\text{s}^2}{\text{m}} = \text{m/s}^2$, וגם $\vec r\cdot\vec a/r$ ביחידות של תאוצה.' }
          - { kind: substitution, text: 'בשיא: $\vec v = (15,\ 0)\,\text{m/s}$, $\dot r = 12.5\,\text{m/s}$, $r = 36.8\,\text{m}$, ו-$\vec r\cdot\vec a = -gy = -9.8\cdot20.4 = -200\,\text{m}^2/\text{s}^2$. לכן $|\vec v|^2 - \dot r^2 = 225 - 155.8 = 69.2$ ו-$\ddot r = \dfrac{69.2 - 200}{36.8} = -3.55\,\text{m/s}^2$. בדרך הקוטבית: $a_r = -gy/r = -5.44\,\text{m/s}^2$ ו-$r\dot\theta^2 = 36.8\cdot0.226^2 = 1.88\,\text{m/s}^2$, וסכומם אותו $-3.55\,\text{m/s}^2$.' }
          - { kind: result, text: '$\ddot r = \dfrac{|\vec v|^2 - \dot r^2 + \vec r\cdot\vec a}{r} = a_r + r\dot\theta^2$, ובשיא $-3.55\,\text{m/s}^2$: הכדור עדיין מתרחק מהמכ״ם, $\dot r > 0$, אבל ההתרחקות מאטה.' }
        rubric:
          - text: 'גזרתי פעמיים את $r^2 = \vec r\cdot\vec r$ וקיבלתי $\dot r^2 + r\ddot r = |\vec v|^2 + \vec r\cdot\vec a$.'
          - text: 'הראיתי שזה $\ddot r = a_r + r\dot\theta^2$, ולכן $\ddot r$ שונה מ-$a_r$.'
          - text: בדקתי שבתנועה ישרה ואחידה שחולפת ליד O יוצא $\ddot r \ge 0$, אף ש-$\vec a = 0$, והסברתי למה.
          - text: 'הצבתי בשיא וקיבלתי $\ddot r \approx -3.55\,\text{m/s}^2$, עם הסימן.'

  # ------------------------------------------------------------ 2: a launcher on a flatcar, then the car brakes
  - id: Q-1-bagrut-2
    type: bagrut
    title: משגר על קרון נוסע
    prompt: >-
      קרון שטוח וארוך נוסע על מסילה ישרה ואופקית, מזרחה, במהירות קבועה $V = 12\,\text{m/s}$ ביחס לקרקע. משגר שמחובר
      לקרון יורה כדור **אחורה**: ביחס לקרון, למהירות ההתחלתית של הכדור יש רכיב אופקי של $9.0\,\text{m/s}$ מערבה ורכיב
      אנכי של $12\,\text{m/s}$ כלפי מעלה. הכדור נוחת על הקרון, באותו גובה שממנו נורה. אין התנגדות אוויר. ציר $x$
      פונה מזרחה, וציר $y$ כלפי מעלה.
    parts:
      - label: א
        type: vector
        points: 3
        level: basic
        qualitative: true
        objectives: [OBJ-1.5-2]
        prompt: >-
          במבט מהצד, שבו מזרח ימינה בדף ומעלה למעלה בדף: מה כיוון התאוצה של הכדור במערכת הייחוס של **הקרקע**, בזמן
          שהוא באוויר?
        answer: s
        correctFeedback: >-
          נכון. ביחס לקרון התאוצה היא $\vec g$, והקרון נע ביחס לקרקע במהירות קבועה. המהירויות בשתי המערכות שונות
          בווקטור קבוע, $\vec V$, ולכן התאוצות זהות: $\vec g$ כלפי מטה.
        wrongFeedback: 'מה ההפרש בין המהירות של הכדור ביחס לקרקע לבין המהירות שלו ביחס לקרון? האם ההפרש הזה משתנה בזמן?'
        wrong:
          - dir: e
            feedback: 'הקרון נע מזרחה, אבל במהירות קבועה. מהירות קבועה של המערכת מוסיפה למהירות של הכדור, לא לתאוצה שלו.'
            misconception: MC-1-acceleration-depends-on-frame
          - dir: w
            feedback: 'הכדור נורה מערבה ביחס לקרון, אבל זה כיוון של מהירות ההתחלה. בזמן התעופה אין עליו שום השפעה אופקית.'
            misconception: MC-1-acceleration-along-velocity
          - dir: zero
            feedback: 'הכדור באוויר, והכובד פועל עליו. התאוצה שלו $\vec g$ בכל מערכת שנעה ביחס לקרקע במהירות קבועה.'

      - label: ב
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-1.5-1]
        prompt: מה גודל המהירות ההתחלתית של הכדור ביחס לקרקע?
        answer: 12.4
        unit: m/s
        correctFeedback: >-
          נכון. $\vec v_{\text{ball,ground}} = \vec v_{\text{ball,car}} + \vec V = (-9.0 + 12,\ 12) = (3.0,\ 12)\,\text{m/s}$, ולכן
          $|\vec v| = \sqrt{3.0^2 + 12^2} = 12.4\,\text{m/s}$. ביחס לקרקע הכדור נע קדימה, מזרחה, אף שנורה אחורה.

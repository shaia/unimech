          - { kind: result, text: 'ביחס לקרון התאוצה של הכדור היא $(A,\ -g)$, והוא נוחת ב-$x_{\text{rel}} = \dfrac{2u_y}{g}\left(u_x + \dfrac{Au_y}{g}\right)$: $16.0\,\text{m}$ מאחורי המשגר, $6.0\,\text{m}$ קרוב יותר מאשר בנסיעה אחידה. במערכת של הקרון הבולם המסלול עדיין פרבולה, אבל הציר שלה נוטה בכיוון $(A,\ -g)$.' }

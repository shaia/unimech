          - value: 1.92
            feedback: 'לקחתם רק את $a_\theta v_\theta$. גם $a_r$ תורם, כי למהירות יש רכיב רדיאלי: $a_rv_r = -0.96\,\text{m/s}^2$.'
        hints:
          - 'במכפלה סקלרית ברכיבים קוטביים: $\vec a\cdot\vec v = a_rv_r + a_\theta v_\theta$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-1.3-2, OBJ-1.4-2]
        prompt: >-
          (1) בטאו את רדיוס העקמומיות $\rho$ של המסלול של הטבעת, במערכת של הרצפה, באמצעות $u$, $\omega$ ו-$r$. היעזרו
          ב-$\rho = |\vec v|^2/a_\perp$, וברכיבי התאוצה מחלק ב.

          (2) בדקו את הביטוי בשלושה גבולות: $u \to 0$, $\omega \to 0$ ו-$r \to 0$ (הטבעת עוברת דרך O). בגבול האחרון השוו
          לחישוב ישיר: מה $\vec v$ ומה $\vec a$ של טבעת שנמצאת ב-O?

          (3) חשבו את $\rho$ ברגע $t = 0.50\,\text{s}$, והשוו אותו למרחק $r$ של הטבעת מ-O.
        hints:
          - 'במישור, $|\vec v\times\vec a| = |v_ra_\theta - v_\theta a_r| = |\vec v|\,a_\perp$.'
          - 'רק הרכיב של התאוצה שניצב למהירות מעקם את המסלול, ו-$\hat r$ אינו ניצב למהירות כשהטבעת מתרחקת מ-O.'
        solution:
          - { kind: law, text: 'רדיוס העקמומיות: $\rho = \dfrac{|\vec v|^2}{a_\perp}$, עם $a_\perp = \dfrac{|\vec v\times\vec a|}{|\vec v|}$, ולכן $\rho = \dfrac{|\vec v|^3}{|\vec v\times\vec a|}$. ברכיבים קוטביים $|\vec v\times\vec a| = |v_ra_\theta - v_\theta a_r|$.' }
          - { kind: manipulation, text: 'כאן $v_r = u$ ו-$v_\theta = r\omega$, ומחלק ב $a_r = -r\omega^2$ ו-$a_\theta = 2u\omega$. לכן $v_ra_\theta - v_\theta a_r = 2u^2\omega + r^2\omega^3 = \omega\left(2u^2 + r^2\omega^2\right)$ ו-$|\vec v|^2 = u^2 + r^2\omega^2$: $$\rho = \frac{\left(u^2 + r^2\omega^2\right)^{3/2}}{\omega\left(2u^2 + r^2\omega^2\right)}$$' }
          - { kind: limit, text: 'כש-$u \to 0$: $\rho = \dfrac{r^3\omega^3}{\omega\cdot r^2\omega^2} = r$, תנועה על מעגל סביב O. כש-$\omega \to 0$: $\rho \to \infty$, קו ישר לאורך מוט שעומד. כש-$r \to 0$: $\rho \to \dfrac{u^3}{2u^2\omega} = \dfrac{u}{2\omega}$. ובחישוב ישיר: ב-O המהירות $u$ לאורך המוט, והתאוצה היחידה $2u\omega$, ניצבת לה, ולכן $\rho = \dfrac{u^2}{2u\omega} = \dfrac{u}{2\omega}$, אותו דבר.' }
          - { kind: units, text: '$\dfrac{(\text{m}^2/\text{s}^2)^{3/2}}{\text{s}^{-1}\cdot\text{m}^2/\text{s}^2} = \dfrac{\text{m}^3/\text{s}^3}{\text{m}^2/\text{s}^3} = \text{m}$.' }
          - { kind: substitution, text: '$|\vec v|^2 = 0.60^2 + 0.40^2\cdot2.0^2 = 1.00\,\text{m}^2/\text{s}^2$ ו-$2u^2 + r^2\omega^2 = 0.72 + 0.64 = 1.36\,\text{m}^2/\text{s}^2$, ולכן $\rho = \dfrac{1.00}{2.0\cdot1.36} = 0.368\,\text{m}$. (חלוקה ב-$|\vec a| = 2.88\,\text{m/s}^2$ הייתה נותנת $0.347\,\text{m}$, וב-$|a_r|$, $0.625\,\text{m}$: אף אחד מהם אינו הרכיב הניצב, $a_\perp = 2.72\,\text{m/s}^2$.)' }
          - { kind: result, text: '$\rho = \dfrac{\left(u^2 + r^2\omega^2\right)^{3/2}}{\omega\left(2u^2 + r^2\omega^2\right)}$, ובאותו רגע $0.368\,\text{m}$, פחות מ-$r = 0.40\,\text{m}$: הספירלה עקומה יותר מהמעגל סביב O שעובר דרך הטבעת.' }
        rubric:
          - text: 'כתבתי $\rho = |\vec v|^3/|v_ra_\theta - v_\theta a_r|$ והצבתי את הרכיבים מחלק ב.'
          - text: 'קיבלתי $\rho = \left(u^2 + r^2\omega^2\right)^{3/2}\big/\left(\omega\left(2u^2 + r^2\omega^2\right)\right)$.'
          - text: 'בדקתי שב-$u \to 0$ יוצא $\rho = r$, ב-$\omega \to 0$ קו ישר, וב-$r \to 0$ $u/(2\omega)$, כמו בחישוב ישיר ב-O.'
          - text: 'הצבתי וקיבלתי $0.368\,\text{m}$, פחות מ-$r = 0.40\,\text{m}$.'

  # ------------------------------------------------------------ 4: a boat across a river whose current varies with the width
  - id: Q-1-bagrut-4
    type: bagrut
    title: סירה בנהר שזורם מהר באמצע
    prompt: >-
      נהר ברוחב $d = 60\,\text{m}$ זורם במקביל לגדות, בכיוון ציר $x$. מהירות הזרם תלויה במרחק $y$ מהגדה שממנה יוצאים:
      $$c(y) = 4c_0\,\frac{y\left(d - y\right)}{d^2}$$
      עם $c_0 = 1.5\,\text{m/s}$, כלומר אפס ליד הגדות ו-$c_0$ באמצע. סירה יוצאת ברגע $t = 0$ מהנקודה $x = 0$ על הגדה
      $y = 0$, ומכוונת כל הזמן ישר לרוחב הנהר, במהירות $u = 2.0\,\text{m/s}$ **ביחס למים** שסביבה.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-1.5-1]
        prompt: כמה זמן נמשכת החצייה?
        answer: 30
        unit: s
        correctFeedback: >-

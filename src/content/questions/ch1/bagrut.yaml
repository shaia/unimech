          - { kind: manipulation, text: 'ביחס לקרקע $\vec a_{\text{ball}} = (0,\ -g)$ ו-$\vec a_{\text{car}} = (-A,\ 0)$, כי הקרון נע מזרחה ומאט. לכן $\vec a_{\text{rel}} = (A,\ -g)$, קבועה. אינטגרציה עם $\vec r_{\text{rel}}(0) = 0$ ו-$\vec v_{\text{rel}}(0) = (u_x,\ u_y)$ נותנת $x_{\text{rel}} = u_xt + \tfrac12At^2$ ו-$y_{\text{rel}} = u_yt - \tfrac12gt^2$. הרכיב האנכי לא השתנה, ולכן גם זמן התעופה לא: $T = 2u_y/g$. לכן $$x_{\text{rel}}(T) = u_xT + \tfrac12AT^2 = \frac{2u_y}{g}\left(u_x + \frac{Au_y}{g}\right)$$' }

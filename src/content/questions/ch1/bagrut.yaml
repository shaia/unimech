      - label: ד
        type: numeric
        points: 7
        level: bagrut
        objectives: [OBJ-1.3-2]
        prompt: >-
          מה רדיוס העקמומיות של המסלול של הסירה, במערכת של הקרקע, ברגע שהיא יוצאת מהגדה?
        answer: 20
        unit: m
        correctFeedback: >-
          נכון. ליד הגדה $u = 0$, ולכן $\vec v = (0,\ w)$. התאוצה היא $\vec a = \left(\dfrac{d}{dt}u(y(t)),\ 0\right)$, ובכלל השרשרת
          $\dfrac{du}{dt} = \dfrac{du}{dy}\cdot\dot y = \dfrac{4u_0}{d}\left(1 - \dfrac{2y}{d}\right)w$, ובגדה, $y = 0$,
          היא $\dfrac{4u_0w}{d} = 0.20\,\text{m/s}^2$. היא ניצבת למהירות כולה, ולכן
          $\rho = \dfrac{w^2}{4u_0w/d} = \dfrac{wd}{4u_0} = \dfrac{2.0\cdot60}{6.0} = 20\,\text{m}$.
          **בדיקת גבולות:** כש-$u_0 \to 0$, $\rho \to \infty$, קו ישר. ובאמצע הנהר $du/dy = 0$, התאוצה אפס, והמסלול שם
          ישר לרגע: זו נקודת פיתול. עד האמצע המסלול מתעקם במורד הזרם, ומשם הוא מתעקם לצד השני, עד שבגדה השנייה הסירה
          שוב נעה ישר לרוחב הנהר.
        wrongFeedback: 'מצאו את $\vec v$ ואת $\vec a$ ברגע היציאה. את $du/dt$ מקבלים מ-$du/dy$ בכלל השרשרת.'

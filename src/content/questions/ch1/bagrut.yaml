          - value: 0.5
            feedback: 'חיסרתם את הזרם. הוא לא נגד הסירה אלא ניצב לה, ולכן הוא מגדיל את גודל המהירות ביחס לקרקע.'
            misconception: MC-1-current-delays-crossing
          - value: 2
            feedback: 'זו המהירות ביחס למים. ביחס לקרקע מוסיפים את מהירות הזרם במקום שבו הסירה נמצאת.'

      - label: ג
        type: open
        points: 10
        level: bagrut
        standalone: false
        objectives: [OBJ-1.1-2, OBJ-1.5-1]
        prompt: >-
          (1) כתבו את $x(t)$, המרחק שהסירה נסחפה במורד הזרם עד הרגע $t$, בעזרת אינטגרל, וחשבו אותו.

          (2) כמה נסחפה הסירה כשהיא מגיעה לגדה השנייה?

          (3) השוו לנהר שזורם בכל רוחבו במהירות $c_0$, והסבירו את היחס בין התשובות.
        hints:
          - 'קודם $y(t)$. אחר כך $\dot x = c\left(y(t)\right)$, ואינטגרציה עם $x(0) = 0$.'
        solution:
          - { kind: law, text: 'מהירות יחסית: $\vec v_{\text{boat,ground}} = \vec v_{\text{boat,water}} + \vec v_{\text{water,ground}} = \left(c(y),\ u\right)$.' }
          - { kind: manipulation, text: 'ברכיב $y$: $\dot y = u$, ועם $y(0) = 0$, $y = ut$. ברכיב $x$: $\dot x = c(ut) = \dfrac{4c_0}{d^2}\left(dut - u^2t^2\right)$, ועם $x(0) = 0$: $$x(t) = \int_0^t\frac{4c_0}{d^2}\left(dut'' - u^2t''^2\right)dt'' = \frac{4c_0}{d^2}\left(\frac{dut^2}{2} - \frac{u^2t^3}{3}\right)$$ בגדה השנייה $t = T = d/u$, ושני האיברים בסוגריים הם $\dfrac{d^3}{2u}$ ו-$\dfrac{d^3}{3u}$: $x(T) = \dfrac{4c_0}{d^2}\cdot\dfrac{d^3}{6u} = \dfrac{2c_0d}{3u}$.' }
          - { kind: limit, text: 'בזרם אחיד $c_0$ הסחיפה היא $c_0T = \dfrac{c_0d}{u}$. כאן יוצא $\tfrac23$ ממנה, כי $\tfrac23c_0$ הוא הממוצע של $c(y)$ על רוחב הנהר: $\dfrac1d\int_0^d c\,dy = \dfrac{4c_0}{d^3}\left(\dfrac{d^3}{2} - \dfrac{d^3}{3}\right) = \tfrac23c_0$. וכש-$c_0 \to 0$ הסחיפה אפס.' }
          - { kind: units, text: '$\dfrac{c_0d}{u}$ ביחידות $\dfrac{\text{m/s}\cdot\text{m}}{\text{m/s}} = \text{m}$.' }
          - { kind: substitution, text: '$x(T) = \dfrac{2\cdot1.5\cdot60}{3\cdot2.0} = 30\,\text{m}$, לעומת $\dfrac{1.5\cdot60}{2.0} = 45\,\text{m}$ בזרם אחיד.' }
          - { kind: result, text: '$x(t) = \dfrac{4c_0}{d^2}\left(\dfrac{dut^2}{2} - \dfrac{u^2t^3}{3}\right)$, והסחיפה הכוללת $\dfrac{2c_0d}{3u} = 30\,\text{m}$ במורד הזרם: מהירות הזרם הממוצעת שהסירה עוברת בה, $\tfrac23c_0$, כפול זמן החצייה.' }
        rubric:
          - text: 'כתבתי את המהירות ביחס לקרקע כסכום, $\left(c(y),\ u\right)$, וקיבלתי $y = ut$.'
          - text: הצבתי $y = ut$ ב-$c(y)$ ואינטגרלתי מ-0 עד $t$, עם $x(0) = 0$.
          - text: 'קיבלתי $x(T) = \dfrac{2c_0d}{3u} = 30\,\text{m}$.'
          - text: 'בדקתי שזרם אחיד היה נותן $45\,\text{m}$, והסברתי שהפרופיל נותן את הממוצע שלו, $\tfrac23c_0$.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-1.3-2, OBJ-1.1-1]
        prompt: >-
          (1) מצאו את $\vec v$ ואת $\vec a$ של הסירה ביחס לקרקע, כפונקציות של המרחק $y$ מהגדה. את $dc/dt$ מקבלים בכלל
          השרשרת.

          (2) בטאו את רדיוס העקמומיות $\rho(y)$ של המסלול באמצעות $u$, $c(y)$ ו-$dc/dy$, ומצאו אותו ברגע היציאה מהגדה,
          באמצעות $u$, $d$ ו-$c_0$.

          (3) בדקו את הביטוי בגבול $c_0 \to 0$. מה קורה ל-$\rho$ באמצע הנהר, ומה זה אומר על צורת המסלול?

          (4) מה רדיוס העקמומיות ברגע היציאה מהגדה?
        hints:
          - 'ברגע היציאה, מה הזווית בין $\vec v$ לבין $\vec a$?'
          - 'התאוצה היא $dc/dt$, לא $dc/dy$: כלל השרשרת מוסיף את $\dot y = u$.'
        solution:
          - { kind: law, text: 'ביחס לקרקע $\vec v = \left(c(y),\ u\right)$ (חלק ג), $\vec a = d\vec v/dt$, ורדיוס העקמומיות $\rho = \dfrac{|\vec v|^3}{|\vec v\times\vec a|}$.' }
          - { kind: manipulation, text: 'הרכיב $u$ קבוע, ולכן $\vec a = \left(\dfrac{dc}{dt},\ 0\right)$, ובכלל השרשרת $\dfrac{dc}{dt} = \dfrac{dc}{dy}\,\dot y = u\dfrac{dc}{dy}$, עם $\dfrac{dc}{dy} = \dfrac{4c_0}{d}\left(1 - \dfrac{2y}{d}\right)$. אז $|\vec v\times\vec a| = |c\cdot0 - u\cdot u\,c''| = u^2\left|\dfrac{dc}{dy}\right|$, ו-$$\rho(y) = \frac{\left(u^2 + c^2\right)^{3/2}}{u^2\left|dc/dy\right|}$$ ברגע היציאה $c = 0$ ו-$dc/dy = 4c_0/d$: $\rho = \dfrac{u^3}{u^2\cdot4c_0/d} = \dfrac{ud}{4c_0}$. שם התאוצה, $4c_0u/d$, ניצבת למהירות כולה.' }
          - { kind: limit, text: 'כש-$c_0 \to 0$: $\rho \to \infty$, קו ישר לרוחב נהר עומד. באמצע הנהר, $y = d/2$: $dc/dy = 0$, התאוצה אפס ו-$\rho \to \infty$: המסלול ישר לרגע, נקודת פיתול. עד האמצע המסלול מתעקם במורד הזרם, ומשם לצד השני, עד שבגדה השנייה הסירה שוב נעה ישר לרוחב הנהר.' }
          - { kind: units, text: '$\dfrac{ud}{c_0}$ ביחידות $\dfrac{(\text{m/s})\cdot\text{m}}{\text{m/s}} = \text{m}$.' }
          - { kind: substitution, text: '$\rho = \dfrac{2.0\cdot60}{4\cdot1.5} = 20\,\text{m}$, עם תאוצה $\dfrac{4c_0u}{d} = 0.20\,\text{m/s}^2$. (מי שלוקח את $dc/dy = 0.10\,\text{s}^{-1}$ כאילו הוא התאוצה מקבל $40\,\text{m}$.)' }
          - { kind: result, text: '$\rho(y) = \dfrac{\left(u^2 + c^2\right)^{3/2}}{u^2\left|dc/dy\right|}$, וביציאה מהגדה $\rho = \dfrac{ud}{4c_0} = 20\,\text{m}$. באמצע הנהר המסלול ישר לרגע.' }
        rubric:
          - text: 'מצאתי $\vec a = \left(u\,dc/dy,\ 0\right)$ בכלל השרשרת.'
          - text: 'קיבלתי $\rho(y) = \left(u^2 + c^2\right)^{3/2}\big/\left(u^2|dc/dy|\right)$, ובגדה $\rho = ud/(4c_0)$.'
          - text: בדקתי שבלי זרם $\rho \to \infty$, ושבאמצע הנהר המסלול ישר לרגע, נקודת פיתול.
          - text: הצבתי וקיבלתי $20\,\text{m}$.

  # ------------------------------------------------------------ 5: a moth spirals into a lamp (joins chapter 0)
  - id: Q-1-bagrut-5
    type: bagrut
    title: עש מסתחרר אל פנס
    prompt: >-
      במודל פשוט של עש שעף סביב פנס, העש עף במישור אופקי, במהירות שגודלה $v$ קבוע, ושומר כל הזמן על זווית קבועה
      $\alpha$ בין וקטור המהירות שלו לבין $\hat r$, הכיוון מהפנס אליו, כאשר $90^\circ < \alpha < 180^\circ$. מתארים את
      התנועה בקואורדינטות קוטביות סביב הפנס, שנמצא בנקודה O. העש סובב נגד כיוון השעון, כך ש-$\dot\theta > 0$, וברגע
      $t = 0$ הוא במרחק $r_0$ מהפנס, בזווית $\theta = 0$. כלומר
      $$\vec v = v\cos\alpha\,\hat r + v\sin\alpha\,\hat\theta$$
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-1.4-1, OBJ-0.2-2]
        prompt: >-
          כתבו את $\dot r$ בעזרת מכפלה סקלרית, $\dot r = \vec v\cdot\hat r$. עם $v = 2.0\,\text{m/s}$, $\alpha = 120^\circ$
          ו-$r_0 = 3.0\,\text{m}$: אחרי כמה שניות העש מגיע לפנס?
        answer: 3
        unit: s
        correctFeedback: >-
          נכון. $\dot r = \vec v\cdot\hat r = v\cos\alpha = -1.0\,\text{m/s}$, קבוע: המרחק מהפנס יורד בקצב קבוע,
          $r = r_0 + vt\cos\alpha$, ומתאפס ב-$T = \dfrac{r_0}{v|\cos\alpha|} = \dfrac{3.0}{2.0\cdot0.50} = 3.0\,\text{s}$,
          אף שהעש לא עף ישר אל הפנס.
        wrongFeedback: '$\dot r$ הוא ההיטל של המהירות על $\hat r$, והזווית ביניהם $\alpha$ קבועה. האם $\dot r$ משתנה בזמן?'
        commonWrong:
          - value: 1.73
            feedback: >-
              השתמשתם ב-$\sin\alpha$. את העש מקרב אל הפנס ההיטל של המהירות על $\hat r$, $v\cos\alpha$. הרכיב
              $v\sin\alpha$, בכיוון $\hat\theta$, רק מסובב אותו סביב הפנס.
          - value: 1.5
            feedback: 'זה $r_0/v$, כאילו העש עף ישר אל הפנס. רק חלק מהמהירות, $v|\cos\alpha|$, מקרב אותו.'
        hints:
          - '$\vec v\cdot\hat r = |\vec v|\cos\alpha$, ו-$\cos120^\circ = -0.50$.'

      - label: ב
        type: open
        points: 6
        level: mid
        objectives: [OBJ-0.5-2, OBJ-1.4-1]
        prompt: >-
          (1) כתבו את $\dot r$ ואת $\dot\theta$ באמצעות $v$, $\alpha$ ו-$r$, והראו שהמסלול מקיים את המשוואה הדיפרנציאלית
          $\dfrac{dr}{d\theta} = r\cot\alpha$.

          (2) פתרו אותה בהפרדת משתנים, עם $r(0) = r_0$.

          (3) בדקו את הפתרון בגבולות $\alpha \to 90^\circ$ ו-$\alpha \to 180^\circ$.

          (4) כמה סיבובים סביב הפנס עושה העש עד שהוא מגיע אליו? הסבירו איך זה מתיישב עם זמן התעופה הסופי של חלק א.
        hints:
          - 'בכלל השרשרת, $\dfrac{dr}{d\theta} = \dfrac{\dot r}{\dot\theta}$.'
          - 'כש-$90^\circ < \alpha < 180^\circ$, $\cot\alpha < 0$. מה צריך לקרות ל-$\theta$ כדי ש-$r$ יגיע לאפס?'
        solution:
          - { kind: law, text: 'המהירות בקואורדינטות קוטביות: $\vec v = \dot r\hat r + r\dot\theta\hat\theta$. בהשוואה לנתון, $\dot r = v\cos\alpha$ ו-$r\dot\theta = v\sin\alpha$. ובכלל השרשרת $\dfrac{dr}{d\theta} = \dfrac{\dot r}{\dot\theta}$.' }
          - { kind: manipulation, text: '$\dot\theta = \dfrac{v\sin\alpha}{r}$, ולכן $\dfrac{dr}{d\theta} = \dfrac{v\cos\alpha}{v\sin\alpha/r} = r\cot\alpha$. מפרידים משתנים: $\dfrac{dr}{r} = \cot\alpha\,d\theta$, ומאנטגרלים מ-$r_0$ עד $r$ ומ-$0$ עד $\theta$: $\ln\dfrac{r}{r_0} = \theta\cot\alpha$, כלומר $$r = r_0e^{\theta\cot\alpha}$$ ספירלה לוגריתמית. כאן $\cot\alpha < 0$, ולכן $r$ קטן כש-$\theta$ גדלה.' }
          - { kind: manipulation, text: 'מספר הסיבובים: $r \to 0$ דורש $\theta\cot\alpha \to -\infty$, כלומר $\theta \to \infty$: העש עושה אינסוף סיבובים. ובכל זאת הזמן סופי, כי $\dot\theta = v\sin\alpha/r$ גדל בלי גבול כש-$r \to 0$. בכל סיבוב $r$ קטן פי $e^{2\pi\cot\alpha}$ (בערך פי 38 ב-$\alpha = 120^\circ$), וזמן הסיבוב, $\Delta r/(v|\cos\alpha|)$, קטן באותו יחס. סכום הזמנים הוא טור הנדסי מתכנס, ושווה ל-$T$ של חלק א.' }
          - { kind: limit, text: 'כש-$\alpha \to 90^\circ$: $\cot\alpha \to 0$ ו-$r = r_0$ קבוע, מעגל סביב הפנס, כמו שצריך כש-$\dot r = v\cos\alpha = 0$. כש-$\alpha \to 180^\circ$: $\cot\alpha \to -\infty$, ו-$r$ יורד לאפס כבר בזווית קטנה מאוד: העש עף ישר אל הפנס לאורך רדיוס, בלי להסתובב.' }
          - { kind: units, text: '$\theta\cot\alpha$ חסר ממדים, כמו שמעריך חייב להיות, ו-$r$ ביחידות של $r_0$.' }
          - { kind: result, text: '$r = r_0e^{\theta\cot\alpha}$: ספירלה לוגריתמית אל הפנס, עם אינסוף סיבובים בזמן סופי, $T = r_0/(v|\cos\alpha|)$.' }
        rubric:
          - text: 'כתבתי $\dot r = v\cos\alpha$ ו-$r\dot\theta = v\sin\alpha$, וקיבלתי $dr/d\theta = r\cot\alpha$ בכלל השרשרת.'
          - text: הפרדתי משתנים וקיבלתי $r = r_0e^{\theta\cot\alpha}$.
          - text: 'בדקתי שב-$\alpha \to 90^\circ$ יוצא מעגל, וב-$\alpha \to 180^\circ$ קו ישר אל הפנס.'
          - text: הסברתי שמספר הסיבובים אינסופי, ושהזמן סופי כי $\dot\theta$ גדל בלי גבול ליד הפנס.

      - label: ג
        type: open
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-0.7-2, OBJ-0.4-1, OBJ-1.1-1]
        prompt: >-
          (1) כתבו את אלמנט האורך בקואורדינטות קוטביות, $d\ell^2 = dr^2 + r^2d\theta^2$, לאורך המסלול של חלק ב, ובטאו
          אותו בעזרת $dr$ ו-$\alpha$.

          (2) בטאו באמצעות $r_0$ ו-$\alpha$ את האורך $L$ של המסלול של העש עד הפנס, ובדקו את התוצאה בדרך שנייה, בעזרת
          חלק א.

          (3) בדקו את $L$ בגבולות $\alpha \to 180^\circ$ ו-$\alpha \to 90^\circ$.
        hints:
          - 'מ-$\dfrac{dr}{d\theta} = r\cot\alpha$ יוצא $r\,d\theta = \tan\alpha\,dr$.'
        solution:
          - { kind: law, text: 'אורך המסלול הוא סכום אלמנטי האורך: $L = \displaystyle\int d\ell$, עם $d\ell^2 = dr^2 + r^2d\theta^2$ בקואורדינטות קוטביות.' }
          - { kind: manipulation, text: 'מחלק ב, $r\,d\theta = \tan\alpha\,dr$, ולכן $d\ell^2 = \left(1 + \tan^2\alpha\right)dr^2 = \dfrac{dr^2}{\cos^2\alpha}$, ו-$d\ell = \dfrac{|dr|}{|\cos\alpha|}$. לאורך המסלול $r$ יורד מ-$r_0$ עד $0$: $$L = \int_0^{r_0}\frac{dr}{|\cos\alpha|} = \frac{r_0}{|\cos\alpha|}$$ בדרך השנייה: גודל המהירות $v$ קבוע, והתעופה נמשכת $T = \dfrac{r_0}{v|\cos\alpha|}$ (חלק א), ולכן $L = vT = \dfrac{r_0}{|\cos\alpha|}$, אותו דבר. אינסוף סיבובים, אבל אורך סופי: אורכי הסיבובים יורדים כמו טור הנדסי.' }
          - { kind: limit, text: 'כש-$\alpha \to 180^\circ$: $|\cos\alpha| \to 1$ ו-$L \to r_0$, הדרך הישרה אל הפנס, הקצרה ביותר. כש-$\alpha \to 90^\circ$: $L \to \infty$, העש מסתובב במעגל ולא מתקרב.' }
          - { kind: units, text: '$r_0/|\cos\alpha|$ במטרים, כמו אורך.' }
          - { kind: result, text: '$d\ell = |dr|/|\cos\alpha|$ ו-$L = \dfrac{r_0}{|\cos\alpha|} = vT$.' }
        rubric:
          - text: 'כתבתי $r\,d\theta = \tan\alpha\,dr$ וקיבלתי $d\ell = |dr|/|\cos\alpha|$.'
          - text: 'קיבלתי $L = r_0/|\cos\alpha|$, ובדקתי שזה $vT$ עם $T$ של חלק א.'
          - text: 'בדקתי שב-$\alpha \to 180^\circ$ יוצא $L = r_0$, וב-$\alpha \to 90^\circ$ $L \to \infty$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-1.4-2, OBJ-1.3-2]
        prompt: >-
          (1) בטאו את $\dot\theta$ ואת $\ddot\theta$ באמצעות $v$, $\alpha$ ו-$r$.

          (2) חשבו את הרכיבים הקוטביים של התאוצה, $a_r$ ו-$a_\theta$, והראו ש-$\vec a \perp \vec v$. הסבירו למה זה היה
          צריך לצאת גם בלי חישוב.

          (3) בטאו את רדיוס העקמומיות $\rho$ של המסלול באמצעות $r$ ו-$\alpha$, ובדקו אותו בגבולות $\alpha \to 90^\circ$
          ו-$\alpha \to 180^\circ$.
        hints:
          - 'גזרו את $\dot\theta = v\sin\alpha/r$ לפי הזמן, עם $\dot r = v\cos\alpha$.'
          - 'מה $\dfrac{d}{dt}|\vec v|^2 = 2\vec v\cdot\vec a$, כשגודל המהירות קבוע?'
        solution:
          - { kind: law, text: 'התאוצה בקואורדינטות קוטביות: $\vec a = \left(\ddot r - r\dot\theta^2\right)\hat r + \left(r\ddot\theta + 2\dot r\dot\theta\right)\hat\theta$. רדיוס העקמומיות: $\rho = |\vec v|^2/a_\perp$.' }
          - { kind: manipulation, text: '$\dot r = v\cos\alpha$ קבוע, ולכן $\ddot r = 0$. $\dot\theta = \dfrac{v\sin\alpha}{r}$, ו-$\ddot\theta = -\dfrac{v\sin\alpha}{r^2}\dot r = -\dfrac{v^2\sin\alpha\cos\alpha}{r^2}$. לכן $$a_r = -r\dot\theta^2 = -\frac{v^2\sin^2\alpha}{r},\qquad a_\theta = -\frac{v^2\sin\alpha\cos\alpha}{r} + \frac{2v^2\sin\alpha\cos\alpha}{r} = \frac{v^2\sin\alpha\cos\alpha}{r}$$' }
          - { kind: manipulation, text: '$\vec a\cdot\vec v = a_rv\cos\alpha + a_\theta v\sin\alpha = \dfrac{v^3}{r}\left(-\sin^2\alpha\cos\alpha + \sin^2\alpha\cos\alpha\right) = 0$. בלי חישוב: גודל המהירות קבוע, ו-$\dfrac{d}{dt}|\vec v|^2 = 2\vec v\cdot\vec a = 0$, כך שאין לתאוצה רכיב לאורך המהירות. לכן כל התאוצה ניצבת למהירות: $a_\perp = |\vec a| = \dfrac{v^2\sin\alpha}{r}\sqrt{\sin^2\alpha + \cos^2\alpha} = \dfrac{v^2\sin\alpha}{r}$, ו-$$\rho = \frac{v^2}{a_\perp} = \frac{r}{\sin\alpha}$$' }
          - { kind: limit, text: 'כש-$\alpha \to 90^\circ$: $\rho \to r$, מעגל סביב הפנס, ו-$a_r \to -v^2/r$, התאוצה הצנטריפטלית. כש-$\alpha \to 180^\circ$: $\sin\alpha \to 0$ ו-$\rho \to \infty$, קו ישר אל הפנס, בלי תאוצה. ובכל $\alpha$, כש-$r \to 0$ התאוצה גדלה בלי גבול: עש אמיתי לא יכול לעקוב אחרי הספירלה עד הסוף, והוא פוגע בפנס.' }
          - { kind: units, text: '$v^2/r$ ביחידות $\text{m/s}^2$, ו-$\rho = r/\sin\alpha$ במטרים.' }
          - { kind: result, text: '$a_r = -\dfrac{v^2\sin^2\alpha}{r}$ ו-$a_\theta = \dfrac{v^2\sin\alpha\cos\alpha}{r}$: תאוצה בגודל $\dfrac{v^2\sin\alpha}{r}$, ניצבת למהירות, ורדיוס עקמומיות $\rho = \dfrac{r}{\sin\alpha}$, גדול מ-$r$.' }
        rubric:
          - text: 'מצאתי $\ddot r = 0$, $\dot\theta = v\sin\alpha/r$ ו-$\ddot\theta = -v^2\sin\alpha\cos\alpha/r^2$.'
          - text: 'קיבלתי $a_r = -v^2\sin^2\alpha/r$ ו-$a_\theta = v^2\sin\alpha\cos\alpha/r$, והראיתי ש-$\vec a\cdot\vec v = 0$.'
          - text: נימקתי שגודל המהירות קבוע, ולכן התאוצה ניצבת למהירות.
          - text: 'קיבלתי $\rho = r/\sin\alpha$ ובדקתי שב-$\alpha \to 90^\circ$ יוצא $r$, וב-$\alpha \to 180^\circ$ קו ישר.'

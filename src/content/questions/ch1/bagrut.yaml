        correctFeedback: 'נכון. באמצע, $y = d/2$, הזרם $c = c_0 = 1.5\,\text{m/s}$, והוא ניצב ל-$u$: $|\vec v| = \sqrt{1.5^2 + 2.0^2} = 2.5\,\text{m/s}$.'
        wrongFeedback: 'מצאו את $c(d/2)$, וחברו אותו כווקטור למהירות הסירה ביחס למים.'
        commonWrong:

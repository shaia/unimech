#   v₀ = 25 m/s at 40°: H = 13.2 m (no sin 31.9, sin 20.5, cos² 18.7, no 2 26.4);
#   h = 20 m, v₀ = 15 m/s at 30°: t = 2.93 s, x = 38.0 m (level range 19.9, √(2h/g) 26.2, v₀ instead of v₀cosθ 43.9);
#

#     level range at 60° 19.9, horizontal distance 14.5, level range at 35° 21.6);
#   down a 15° slope (β = −15°), v₀ = 12 m/s: best θ = 45° + β/2 = 37.5°, L_max = v₀²/(g(1 + sinβ)) = 19.8 m;

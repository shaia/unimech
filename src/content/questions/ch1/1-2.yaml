chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.2-1 constant-acceleration equations, vector form
  - id: Q-1.2-what-is-constant
    type: multi
    objectives: [OBJ-1.2-1]
    qualitative: true
    level: basic
    prompt: >-
      כדור נזרק באלכסון ונע בלי התנגדות אוויר עד שהוא פוגע בקרקע. אילו מהגדלים הבאים קבועים לאורך כל התנועה?
      סמנו את כולם.
    choices:
      - text: וקטור התאוצה
        correct: true
        feedback: 'נכון. התאוצה היא $\vec g$, אותו גודל ואותו כיוון בכל רגע, גם בנקודה הגבוהה ביותר.'
      - text: הרכיב האופקי של המהירות
        correct: true
        feedback: 'נכון. לתאוצה אין רכיב אופקי, ולכן $v_x = v_{0x}$ כל הזמן.'
      - text: הרכיב האנכי של המהירות
        feedback: 'הוא קטן בקצב קבוע, $v_y = v_{0y} - gt$: חיובי בעלייה, אפס בשיא ושלילי בירידה.'
      - text: גודל המהירות
        feedback: '$|\vec v| = \sqrt{v_x^2 + v_y^2}$, ו-$v_y$ משתנה. גודל המהירות קטן בעלייה, מזערי בשיא, ושווה ל-$v_x$ שם.'
      - text: וקטור התאוצה, פרט לנקודה הגבוהה ביותר, שבה התאוצה מתאפסת
        feedback: >-
          בשיא רק $v_y$ מתאפס. אם גם התאוצה הייתה מתאפסת שם, $v_y$ היה נשאר אפס והכדור היה ממשיך אופקית. התאוצה
          היא $\vec g$ גם בשיא, והיא שמתחילה את הירידה.
        misconception: MC-1-zero-acceleration-at-top
    hints:
      - 'כתבו את $\vec a$, ואחר כך את $\vec v(t) = \vec v_0 + \vec gt$ ברכיבים.'

  - id: Q-1.2-vector-position
    type: numeric
    objectives: [OBJ-1.2-1]
    level: basic
    prompt: >-
      גוף נזרק ברגע $t = 0$ מהנקודה $\vec r_0 = (0,\ 20)\,\text{m}$ במהירות $\vec v_0 = (6.0,\ 8.0)\,\text{m/s}$.
      ציר $y$ פונה כלפי מעלה, כך ש-$\vec a = \vec g = (0,\ -9.8)\,\text{m/s}^2$. מה הרכיב $y$ של המקום שלו ברגע
      $t = 2.0\,\text{s}$?
    answer: 16.4
    unit: m
    correctFeedback: >-
      נכון. אינטגרציה של $\vec a = \vec g$ פעמיים, עם תנאי ההתחלה, נותנת $\vec r(t) = \vec r_0 + \vec v_0t + \tfrac12\vec gt^2$.
      ברכיב $y$: $y = 20 + 8.0\cdot2.0 - \tfrac12\cdot9.8\cdot2.0^2 = 20 + 16 - 19.6 = 16.4\,\text{m}$. וברכיב $x$:
      $x = 6.0\cdot2.0 = 12\,\text{m}$.
    wrongFeedback: 'כתבו את $\vec r(t) = \vec r_0 + \vec v_0t + \tfrac12\vec gt^2$ ברכיב $y$, ושימו לב לסימן של $g_y$.'
    commonWrong:
      - value: 55.6
        feedback: 'הוספתם $\tfrac12gt^2$ במקום לחסר. הציר פונה כלפי מעלה, ולכן $g_y = -9.8\,\text{m/s}^2$.'
      - value: -3.2
        feedback: 'שכחתם את ה-$\tfrac12$: האינטגרל של $\vec gt$ לפי הזמן הוא $\tfrac12\vec gt^2$, לא $\vec gt^2$.'
      - value: 36
        feedback: 'זה $y_0 + v_{0y}t$ בלבד, תנועה במהירות קבועה. הכובד מוסיף את האיבר $\tfrac12g_yt^2$.'
    hints:
      - 'בצורה הווקטורית כל רכיב מתנהג כמו תנועה בממד אחד עם הרכיב המתאים של $\vec g$.'

  - id: Q-1.2-two-balls
    type: twotier
    objectives: [OBJ-1.2-1]
    qualitative: true
    level: mid
    prompt: >-
      באותו רגע זורקים שני כדורים: את A מהקרקע, באלכסון, ואת B מראש מגדל, אופקית ובכיוון אחר. אין התנגדות
      אוויר. איך משתנה עם הזמן הווקטור $\vec r_B - \vec r_A$, מ-A אל B, כל עוד שני הכדורים באוויר?
    choices:
      - text: הוא משתנה קווית בזמן, כמו וקטור המקום של גוף שנע במהירות קבועה.
        correct: true
        feedback: 'נכון. $\vec r_B - \vec r_A = \left(\vec r_{0B} - \vec r_{0A}\right) + \left(\vec v_{0B} - \vec v_{0A}\right)t$, בלי איבר של $t^2$.'
      - text: הוא משתנה כמו פרבולה, כי כל אחד מהכדורים נע על פרבולה.
        feedback: >-
          כל כדור אכן נע על פרבולה, אבל לשתי הפרבולות אותו איבר ריבועי, $\tfrac12\vec gt^2$, והוא מצטמצם בהפרש.
        misconception: MC-1-gravity-bends-relative-motion
      - text: הרכיב האנכי שלו קטן בקצב שגדל עם הזמן, כי B נופל מגובה רב יותר.
        feedback: >-
          הגובה ההתחלתי נכנס רק בתנאי ההתחלה, $\vec r_{0B}$. שני הכדורים נופלים באותה תאוצה, ולכן ההפרש ביניהם
          לא מאיץ.
        misconception: MC-1-gravity-bends-relative-motion
      - text: האורך שלו קבוע, כי שני הכדורים מקבלים אותה תאוצה.
        feedback: 'אותה תאוצה מבטלת את האיבר הריבועי, לא את האיבר הקווי: אם המהירויות ההתחלתיות שונות, המרחק משתנה.'
    reasons:
      - text: '$\vec r(t) = \vec r_0 + \vec v_0t + \tfrac12\vec gt^2$ לכל כדור, ובחיסור האיבר $\tfrac12\vec gt^2$, שזהה לשניהם, מצטמצם.'
        correct: true
        feedback: >-
          זה הנימוק. בשיעור 1.5 תראו את אותו דבר ממערכת ייחוס אחרת: מנקודת המבט של כדור A, כדור B נע בקו ישר
          ובמהירות קבועה.
      - text: ההפרש של שתי פרבולות הוא תמיד פרבולה.
        feedback: >-
          לא כשהמקדם הריבועי זהה. $\left(\tfrac12gt^2 + bt + c\right) - \left(\tfrac12gt^2 + b't + c'\right)$ הוא ביטוי
          קווי ב-$t$.
        misconception: MC-1-gravity-bends-relative-motion
      - text: הכדורים נזרקו בכיוונים שונים, ולכן ההפרש ביניהם תלוי בזוויות בצורה מסובכת.
        feedback: 'הזוויות נכנסות רק ל-$\vec v_{0A}$ ול-$\vec v_{0B}$, שהם וקטורים קבועים. ההפרש ביניהם הוא פשוט מהירות קבועה.'
    hints:
      - 'כתבו את $\vec r_A(t)$ ואת $\vec r_B(t)$ בצורה הווקטורית, וחסרו.'

  - id: Q-1.2-perpendicular
    type: numeric
    objectives: [OBJ-1.2-1]
    level: mid
    prompt: >-
      כדור נזרק מהקרקע במהירות $v_0 = 20\,\text{m/s}$ בזווית $60^\circ$ מעל האופק, בלי התנגדות אוויר. אחרי כמה זמן
      וקטור המהירות שלו ניצב לווקטור המהירות ההתחלתית $\vec v_0$?
    answer: 2.36
    unit: s
    correctFeedback: >-
      נכון. $\vec v(t) = \vec v_0 + \vec gt$, וניצבות פירושה מכפלה סקלרית אפס:
      $$\vec v\cdot\vec v_0 = v_0^2 + \left(\vec g\cdot\vec v_0\right)t = v_0^2 - gv_0\sin\theta\,t = 0$$
      ולכן $t = \dfrac{v_0}{g\sin\theta} = \dfrac{20}{9.8\cdot0.866} = 2.36\,\text{s}$. זה בירידה, לפני הנחיתה ב-$3.53\,\text{s}$.
    wrongFeedback: 'כתבו את $\vec v(t)$ בצורה הווקטורית ודרשו $\vec v(t)\cdot\vec v_0 = 0$. מה זה $\vec g\cdot\vec v_0$?'
    commonWrong:
      - value: 1.77
        feedback: >-
          זה הזמן עד השיא, $v_0\sin\theta/g$. שם המהירות ניצבת ל-$\vec g$ (היא אופקית), לא ל-$\vec v_0$. הזווית בין
          המהירות לבין $\vec v_0$ בשיא היא $60^\circ$ בלבד.
      - value: 2.04
        feedback: 'קיבלתם $v_0/g$: שכחתם שרק הרכיב של $\vec g$ לאורך $\vec v_0$ נכנס למכפלה, $\vec g\cdot\vec v_0 = -gv_0\sin\theta$.'
      - value: 4.08
        feedback: 'השתמשתם ב-$\cos\theta$ במקום $\sin\theta$. הזווית בין $\vec g$, שפונה מטה, לבין $\vec v_0$ היא $90^\circ + \theta$, ו-$\cos\left(90^\circ + \theta\right) = -\sin\theta$. וגם: $4.08\,\text{s}$ הוא אחרי הנחיתה.'
    hints:
      - 'וקטורים ניצבים: $\vec v\cdot\vec v_0 = 0$.'

  - id: Q-1.2-same-speed-pair
    type: numeric
    objectives: [OBJ-1.2-1]
    level: bagrut
    prompt: >-
      מאותה נקודה, באותו רגע, זורקים שני כדורים באותה מהירות $v_0 = 15\,\text{m/s}$: אחד בזווית $30^\circ$ מעל האופק
      ואחד בזווית $70^\circ$, באותו מישור אנכי. אין התנגדות אוויר, ושני הכדורים עדיין באוויר. מה המרחק בין הכדורים
      ברגע $t = 1.5\,\text{s}$?
    answer: 15.4
    unit: m
    correctFeedback: >-
      נכון. לכל כדור $\vec r = \vec v_0t + \tfrac12\vec gt^2$, ובהפרש האיבר של $\vec g$ מצטמצם:
      $\vec r_B - \vec r_A = \left(\vec v_{0B} - \vec v_{0A}\right)t$. שני וקטורי המהירות באותו גודל והזווית ביניהם $40^\circ$,
      ולכן אורך ההפרש שלהם הוא בסיס של משולש שווה שוקיים:
      $$\left|\vec r_B - \vec r_A\right| = 2v_0\sin\frac{40^\circ}{2}\,t = 2\cdot15\cdot0.342\cdot1.5 = 15.4\,\text{m}$$
      **בדיקת גבולות:** כשהזוויות שוות המרחק אפס בכל רגע; וכשהכדורים נזרקים בכיוונים מנוגדים ($180^\circ$ ביניהם)
      המרחק הוא $2v_0t$, כמו של שני גופים שמתרחקים זה מזה בלי כובד.
    wrongFeedback: 'כתבו את $\vec r_B - \vec r_A$ בצורה הווקטורית. מה קורה לאיבר $\tfrac12\vec gt^2$? ומה האורך של הפרש בין שני וקטורים שווים בגודלם?'
    commonWrong:
      - value: 11.8
        feedback: 'זה רק ההפרש ברכיב $x$. המרחק בין הכדורים כולל גם את ההפרש ברכיב $y$: $\sqrt{\Delta x^2 + \Delta y^2}$.'
      - value: 9.89
        feedback: 'זה רק ההפרש ברכיב $y$. חסר ההפרש ברכיב $x$.'
      - value: 34.5
        feedback: 'השתמשתם בחצי **סכום** הזוויות, $50^\circ$. האורך של $\vec v_{0B} - \vec v_{0A}$ תלוי בזווית **בין** הווקטורים, $40^\circ$, ולכן $2v_0\sin20^\circ$.'
    hints:
      - 'הכובד פועל על שני הכדורים באותה צורה. מה נשאר בהפרש $\vec r_B - \vec r_A$?'

  # ---------------------------------------------------------------- OBJ-1.2-2 projectiles: path, range, height, time, incline
  - id: Q-1.2-max-height
    type: numeric
    objectives: [OBJ-1.2-2]
    level: basic
    prompt: >-
      כדור נבעט מהקרקע במהירות $25\,\text{m/s}$ בזווית $40^\circ$ מעל האופק. בלי התנגדות אוויר, מה הגובה המרבי
      שהוא מגיע אליו?
    answer: 13.2
    unit: m
    correctFeedback: >-
      נכון. בשיא $v_y = 0$, ומ-$v_y^2 = v_{0y}^2 - 2gy$ מקבלים
      $H = \dfrac{v_0^2\sin^2\theta}{2g} = \dfrac{625\cdot0.413}{19.6} = 13.2\,\text{m}$.
    wrongFeedback: 'רק הרכיב האנכי של המהירות נכנס לגובה. כתבו $v_y^2 = v_{0y}^2 - 2gy$ ודרשו $v_y = 0$.'
    commonWrong:
      - value: 31.9
        feedback: 'זה $v_0^2/(2g)$, הגובה בזריקה אנכית. בזריקה באלכסון רק $v_{0y} = v_0\sin\theta$ נאבק בכובד.'
      - value: 20.5
        feedback: 'שכחתם להעלות את הסינוס בריבוע: $v_{0y}^2 = v_0^2\sin^2\theta$.'
      - value: 18.7
        feedback: 'השתמשתם בקוסינוס, הרכיב האופקי. הרכיב האופקי לא משתנה ולא קשור לגובה.'
      - value: 26.4
        feedback: 'שכחתם את ה-2 במכנה: מ-$0 = v_{0y}^2 - 2gH$ יוצא $H = v_{0y}^2/(2g)$.'
    hints:
      - 'מה הרכיב האנכי של המהירות בנקודה הגבוהה ביותר?'

  - id: Q-1.2-complementary
    type: twotier
    objectives: [OBJ-1.2-2]
    qualitative: true
    level: mid
    prompt: >-
      על קרקע מישורית, בלי התנגדות אוויר, זורקים כדור פעם בזווית $30^\circ$ מעל האופק ופעם בזווית $60^\circ$, באותה
      מהירות. מה נכון?
    choices:
      - text: הטווח זהה, אבל ב-$60^\circ$ הכדור עולה גבוה יותר ונמצא באוויר זמן רב יותר.
        correct: true
        feedback: 'נכון. הטווח שווה, $R = v_0^2\sin2\theta/g$, אבל זמן התנועה והגובה גדלים עם $\theta$.'
      - text: ב-$60^\circ$ הטווח גדול יותר, כי הכדור נמצא באוויר זמן רב יותר.
        feedback: >-
          הזמן באמת ארוך יותר, פי $\sqrt3$, אבל המהירות האופקית קטנה פי $\sqrt3$ בדיוק. הטווח הוא המכפלה שלהם,
          והוא לא משתנה.
        misconception: MC-1-longer-flight-longer-range
      - text: ב-$30^\circ$ הטווח גדול יותר, כי הרכיב האופקי של המהירות גדול יותר.
        feedback: 'הרכיב האופקי גדול יותר, אבל הכדור נמצא באוויר זמן קצר יותר. צריך את המכפלה של שניהם.'
      - text: הטווח, הגובה המרבי וזמן התנועה זהים בשתי הזריקות.
        feedback: 'רק הטווח זהה. הגובה, $v_0^2\sin^2\theta/(2g)$, גדול פי 3 ב-$60^\circ$.'
    reasons:
      - text: '$R = v_0\cos\theta\cdot\dfrac{2v_0\sin\theta}{g}$. כשמחליפים $\theta$ ב-$90^\circ - \theta$ הסינוס והקוסינוס מתחלפים, והמכפלה לא משתנה. הגובה וזמן התנועה תלויים רק ב-$\sin\theta$.'
        correct: true
        feedback: 'זה הנימוק. מאותה סיבה הטווח מרבי ב-$45^\circ$, הזווית שבה $\theta = 90^\circ - \theta$.'
      - text: זמן התנועה זהה בשתי הזריקות, כי בשתיהן הכדור עולה ויורד לאותה קרקע.
        feedback: 'זמן התנועה הוא $2v_0\sin\theta/g$, והוא תלוי בזווית: ב-$60^\circ$ הוא ארוך פי $\sqrt3$.'
      - text: הכובד מאט יותר כדור שנזרק בזווית גבוהה, ולכן הוא לא מגיע רחוק יותר.
        feedback: 'התאוצה של שני הכדורים זהה, $\vec g$, ואין לה רכיב אופקי. ההבדל כולו בתנאי ההתחלה.'
    hints:
      - 'כתבו את הטווח כמכפלה של המהירות האופקית בזמן התנועה.'

  - id: Q-1.2-cliff
    type: numeric
    objectives: [OBJ-1.2-2]
    level: mid
    prompt: >-
      אבן נזרקת מראש צוק שגובהו $20\,\text{m}$ מעל הים, במהירות $15\,\text{m/s}$ בזווית $30^\circ$ **מעל** האופק. בלי
      התנגדות אוויר, באיזה מרחק אופקי מהצוק היא פוגעת במים?
    answer: 38
    unit: m
    correctFeedback: >-
      נכון. עם ציר $y$ כלפי מעלה מפני הים: $y(t) = h + v_0\sin\theta\,t - \tfrac12gt^2 = 0$, משוואה ריבועית שהשורש
      החיובי שלה
      $$t = \frac{v_0\sin\theta + \sqrt{v_0^2\sin^2\theta + 2gh}}{g} = \frac{7.5 + 21.2}{9.8} = 2.93\,\text{s}$$
      ולכן $x = v_0\cos\theta\,t = 13.0\cdot2.93 = 38.0\,\text{m}$.
    wrongFeedback: 'הנחיתה היא ב-$y = 0$, $20\,\text{m}$ מתחת לנקודת הזריקה. פתרו את המשוואה הריבועית ב-$t$, וקחו את השורש החיובי.'
    commonWrong:
      - value: 19.9
        feedback: 'זה הטווח $v_0^2\sin2\theta/g$, שנכון רק כשהנחיתה בגובה הזריקה. כאן האבן ממשיכה לרדת עוד $20\,\text{m}$.'
      - value: 26.2
        feedback: 'השתמשתם בזמן הנפילה מהצוק ממנוחה, $\sqrt{2h/g}$. האבן נזרקה כלפי מעלה, ולכן היא באוויר זמן רב יותר.'
      - value: 43.9
        feedback: 'כפלתם את הזמן ב-$v_0$ ולא ב-$v_0\cos\theta$. המרחק האופקי נקבע רק על ידי הרכיב האופקי של המהירות.'
    hints:
      - 'למשוואה $y(t) = 0$ יש שני שורשים. מה המשמעות של השורש השלילי?'

  - id: Q-1.2-incline-range
    type: numeric
    objectives: [OBJ-1.2-2]
    level: bagrut
    prompt: >-
      מדרון עולה בזווית $\beta = 25^\circ$ מעל האופק. מרגלות המדרון זורקים כדור במעלה המדרון במהירות
      $v_0 = 15\,\text{m/s}$, בזווית $35^\circ$ מעל **פני המדרון** (לא מעל האופק). בלי התנגדות אוויר, באיזה מרחק, נמדד
      לאורך המדרון, הכדור פוגע בו?
    answer: 16.0
    unit: m
    correctFeedback: >-
      נכון. הדרך הקצרה: צירים נטויים, ציר $\xi$ לאורך המדרון וציר $\eta$ ניצב לו. זווית השיגור מעל המדרון, $\varphi = 35^\circ$,
      נתונה ישירות: $v_{0\xi} = v_0\cos\varphi$, $v_{0\eta} = v_0\sin\varphi$, ו-$g_\xi = -g\sin\beta$, $g_\eta = -g\cos\beta$. הגוף חוזר
      למדרון ב-$T = 2v_0\sin\varphi/(g\cos\beta) = 1.94\,\text{s}$, ואז
      $$L = v_0\cos\varphi\,T - \tfrac12g\sin\beta\,T^2 = \frac{2v_0^2\sin\varphi\cos(\varphi + \beta)}{g\cos^2\beta} = 16.0\,\text{m}$$
      (זו הנוסחה של השיעור עם $\theta = \varphi + \beta = 60^\circ$.) **בדיקת גבולות:** כש-$\beta = 0$ מתקבל $v_0^2\sin2\varphi/g$,
      הטווח על קרקע מישורית; וכש-$\varphi + \beta = 90^\circ$, זריקה אנכית, $L = 0$: הכדור נוחת בנקודת הזריקה.
    wrongFeedback: 'מה הזווית של $\vec v_0$ מעל **האופק**? או, בצירים נטויים, השתמשו ישירות בזווית מעל המדרון, ושימו לב שגם ל-$\vec g$ יש רכיב לאורך המדרון.'
    commonWrong:
      - value: 7.95
        feedback: 'הצבתם $\theta = 35^\circ$ כאילו זו הזווית מעל האופק. היא נמדדת מהמדרון, ולכן מעל האופק $\theta = 35^\circ + 25^\circ = 60^\circ$.'
      - value: 19.9
        feedback: 'זה הטווח על קרקע מישורית בזווית $60^\circ$, $v_0^2\sin120^\circ/g$. המדרון עולה לקראת הכדור, ולכן הוא פוגע בו מוקדם יותר.'
      - value: 14.5
        feedback: 'זה המרחק **האופקי** עד נקודת הפגיעה. לאורך המדרון המרחק ארוך יותר: חלקו ב-$\cos\beta$.'
      - value: 21.6
        feedback: 'זה הטווח על קרקע מישורית בזווית $35^\circ$: התעלמתם גם מהמדרון וגם מכך שהזווית נמדדת ממנו.'
    hints:
      - 'בצירים נטויים הזווית שנתונה כאן היא בדיוק הזווית בין $\vec v_0$ לבין ציר $\xi$.'
      - 'הגוף חוזר למדרון כש-$\eta = 0$. מצאו את $T$, ואז את $\xi(T)$.'

  - id: Q-1.2-incline-best-angle
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    level: bagrut
    prompt: >-
      מראש מדרון שיורד בזווית $15^\circ$ מתחת לאופק זורקים כדור **במורד** המדרון במהירות $12\,\text{m/s}$, ובוחרים את זווית
      הזריקה $\theta$ מעל האופק. באיזו זווית $\theta$ הכדור פוגע במדרון הכי רחוק, כשהמרחק נמדד לאורך המדרון?
    choices:
      - text: '$37.5^\circ$'
        correct: true
        feedback: >-
          נכון. הנוסחה $\theta_{\text{best}} = 45^\circ + \beta/2$ נכונה גם במורד מדרון, כש-$\beta$ שלילית: כאן $\beta = -15^\circ$,
          ולכן $\theta_{\text{best}} = 45^\circ - 7.5^\circ = 37.5^\circ$. הקרקע מתרחקת מהכדור כלפי מטה, ולכן משתלם לזרוק נמוך יותר
          ולתת לו "ליפול" לאורך המדרון. הטווח המרבי: $L_{\max} = v_0^2/\left(g(1 + \sin\beta)\right) = 19.8\,\text{m}$.
          **בדיקת גבולות:** כש-$\beta = 0$ מתקבל $45^\circ$; וכש-$\beta \to -90^\circ$, צוק אנכי, $\theta \to 0$ ו-$L_{\max} \to \infty$:
          לאורך צוק אנכי הכדור יורד בלי סוף.
      - text: '$45^\circ$, כמו תמיד'
        feedback: 'ב-$45^\circ$ הכדור פוגע $19.3\,\text{m}$ במורד המדרון, פחות מ-$19.8\,\text{m}$ ב-$37.5^\circ$. $45^\circ$ היא התשובה רק כשהזריקה והנחיתה באותו גובה.'
        misconception: MC-1-forty-five-always-best
      - text: '$52.5^\circ$'
        feedback: 'זו הזווית הטובה ביותר **במעלה** מדרון כזה, $45^\circ + 7.5^\circ$. במורד, $\beta$ שלילית, ולכן חצי ממנה **מוחסר**. ב-$52.5^\circ$ הכדור מגיע רק ל-$17.7\,\text{m}$.'
      - text: '$30^\circ$'
        feedback: 'החסרתם את כל זווית המדרון במקום חצי ממנה. ב-$30^\circ$ הכדור מגיע ל-$19.3\,\text{m}$, בדיוק כמו ב-$45^\circ$: הטווח סימטרי סביב $37.5^\circ$.'
    hints:
      - 'כתבו את הטווח כ-$\dfrac{v_0^2}{g\cos^2\beta}\left[\sin(2\theta - \beta) - \sin\beta\right]$ עם $\beta$ שלילית, ומצאו מתי הוא מרבי.'

  - id: Q-1.2-incline-clearance
    type: mc
    objectives: [OBJ-1.2-2]
    qualitative: true
    level: bagrut
    prompt: >-
      מרגלות מדרון שעולה בזווית $30^\circ$ זורקים כדור במעלה המדרון במהירות $15\,\text{m/s}$, בזווית $70^\circ$ מעל האופק, בלי
      התנגדות אוויר. הכדור פוגע במדרון אחרי $T = 2.27\,\text{s}$, $13.5\,\text{m}$ במעלה המדרון. באיזה רגע הכדור הכי רחוק מפני
      המדרון (במרחק שנמדד בניצב למדרון)?
    choices:
      - text: 'ב-$1.14\,\text{s}$, כשהמהירות שלו מקבילה למדרון'
        correct: true
        feedback: >-
          נכון. בצירים נטויים, ציר $\xi$ לאורך המדרון וציר $\eta$ ניצב לו, המרחק מהמדרון הוא $\eta$, והתאוצה בכיוון $\eta$ קבועה,
          $g_\eta = -g\cos\beta$. לכן $\eta(t)$ הוא פרבולה סימטרית: הוא עולה, מגיע למקסימום כש-$v_\eta = 0$, ויורד לאפס ב-$T$.
          המקסימום באמצע, ב-$T/2 = 1.14\,\text{s}$, והמהירות אז כולה לאורך המדרון. המרחק המרבי:
          $v_0^2\sin^2(\theta - \beta)/(2g\cos\beta) = 5.48\,\text{m}$.
          **בדיקת גבולות:** כשהמדרון אופקי ($\beta = 0$) זה הרגע של השיא, $T/2$, כמו בזריקה על קרקע מישורית.
      - text: 'ב-$1.44\,\text{s}$, בשיא הגובה, כשהמהירות שלו אופקית'
        feedback: >-
          בשיא הגובה המהירות ניצבת ל-$\vec g$, לא למדרון. המרחק מהמדרון מפסיק לגדול כשהמהירות מקבילה **למדרון**. במעלה
          המדרון זה קורה לפני השיא: כאן ב-$1.14\,\text{s}$, והשיא רק ב-$1.44\,\text{s}$. בין שני הרגעים הכדור עוד עולה, אבל
          המדרון שמתחתיו עולה מהר יותר.
        misconception: MC-1-farthest-from-incline-at-top
      - text: 'כשהכדור מעל אמצע הדרך לאורך המדרון, $6.73\,\text{m}$ מנקודת הזריקה'
        feedback: >-
          לאורך המדרון התאוצה היא $g_\xi = -g\sin\beta$: הכדור מאט בכיוון הזה, ולכן בחצי הזמן הוא כבר עבר יותר מחצי הדרך. ב-$T/2$ הוא
          נמצא $9.89\,\text{m}$ במעלה המדרון מתוך $13.5\,\text{m}$. המרחק מהמדרון מרבי בחצי **הזמן**, לא בחצי הדרך.
      - text: 'רגע לפני הפגיעה, כי אז הכדור הכי גבוה מעל נקודת השיגור'
        feedback: 'ברגע הפגיעה הכדור נמצא על המדרון, כלומר במרחק אפס ממנו. גובה מעל נקודת השיגור אינו המרחק מהמדרון.'
    hints:
      - 'בחרו צירים: ציר $\xi$ לאורך המדרון וציר $\eta$ ניצב לו. מה הרכיב של $\vec g$ בכיוון $\eta$, והאם הוא משתנה?'

  - id: Q-1.2-envelope-wall
    type: numeric
    objectives: [OBJ-1.2-2]
    level: bagrut
    prompt: >-
      זרנוק על הקרקע אמור להתיז מים דרך חלון פתוח בקיר: החלון במרחק אופקי $30\,\text{m}$ מהזרנוק ובגובה $12\,\text{m}$. את
      הזווית אפשר לבחור כרצונכם. בלי התנגדות אוויר, מה מהירות היציאה **הקטנה ביותר** של המים שבה הם עוד מגיעים לחלון?
    answer: 20.8
    unit: m/s
    correctFeedback: >-
      נכון. במהירות נתונה, אפשר להגיע לכל נקודה שמתחת למעטפת המסלולים, $y = v_0^2/(2g) - gx^2/(2v_0^2)$. במהירות
      הקטנה ביותר החלון נמצא **על** המעטפת:
      $$v_0^4 - 2gy\,v_0^2 - g^2x^2 = 0 \quad\Longrightarrow\quad v_0^2 = g\left(y + \sqrt{x^2 + y^2}\right)$$
      (השורש החיובי). כאן $v_0^2 = 9.8\left(12 + 32.3\right) = 434\,\text{m}^2/\text{s}^2$, ו-$v_0 = 20.8\,\text{m/s}$, בזווית
      $\tan\theta = v_0^2/(gx)$, כלומר $55.9^\circ$. **בדיקת גבולות:** כשהחלון על הקרקע ($y = 0$) מתקבל $v_0^2 = gx$, הטווח
      המרבי ב-$45^\circ$; וכשהוא ישר מעל הזרנוק ($x = 0$) מתקבל $v_0^2 = 2gy$, זריקה אנכית לגובה $y$.
    wrongFeedback: 'במהירות הקטנה ביותר יש רק זווית אחת שמגיעה לחלון: החלון על המעטפת. הציבו את $(x, y)$ במשוואת המעטפת, ופתרו בשביל $v_0^2$.'
    commonWrong:
      - value: 17.1
        feedback: 'זה $\sqrt{gx}$: המהירות שמגיעה ל-$30\,\text{m}$ **על הקרקע** ב-$45^\circ$. החלון גבוה $12\,\text{m}$, ולכן צריך יותר.'
      - value: 15.3
        feedback: 'זה $\sqrt{2gy}$: המהירות שמגיעה לגובה $12\,\text{m}$ בזריקה אנכית, בלי להתקדם אופקית בכלל.'
      - value: 22.1
        feedback: 'זו המהירות שמגיעה לחלון כשמכוונים ב-$45^\circ$. אבל $45^\circ$ אינה הזווית החסכונית כאן: ב-$55.9^\circ$ מספיקים $20.8\,\text{m/s}$.'
        misconception: MC-1-forty-five-always-best
    hints:
      - 'אם המהירות קטנה מדי, החלון מעל המעטפת. מה המצב בדיוק במהירות הקטנה ביותר?'
    explanation: >-
      הזווית החסכונית, $55.9^\circ$, חוצה את הזווית שבין הקו מהזרנוק אל החלון ($21.8^\circ$ מעל האופק) לבין האנך:
      $45^\circ + \tfrac12\cdot21.8^\circ$. זו אותה תוצאה כמו הזווית הטובה ביותר על מדרון, כאילו החלון יושב על מדרון.

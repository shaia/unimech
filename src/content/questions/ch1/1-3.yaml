  - id: Q-1.3-general-curve
    type: numeric
    objectives: [OBJ-1.3-2]
    level: bagrut
    prompt: >-
      גוף נע במישור, ווקטור המקום שלו
      $$\vec r(t) = \left(bt,\ ct^2\right)$$
      עם $b = 2.0\,\text{m/s}$ ו-$c = 1.0\,\text{m/s}^2$. מה רדיוס העקמומיות של המסלול ברגע $t = 2.0\,\text{s}$?
    answer: 22.4
    unit: m
    correctFeedback: >-
      נכון. $\vec v = (b,\ 2ct) = (2.0,\ 4.0)\,\text{m/s}$ ו-$\vec a = (0,\ 2c) = (0,\ 2.0)\,\text{m/s}^2$. הרכיב הניצב של התאוצה
      הוא $a_\perp = \dfrac{|v_xa_y - v_ya_x|}{|\vec v|} = \dfrac{4.0}{4.47} = 0.894\,\text{m/s}^2$, ולכן
      $\rho = \dfrac{|\vec v|^2}{a_\perp} = \dfrac{|\vec v|^3}{|v_xa_y - v_ya_x|} = \dfrac{20}{0.894} = 22.4\,\text{m}$.
      **בדיקת גבולות:** ב-$t = 0$, בקודקוד הפרבולה, הנוסחה נותנת $\rho = \dfrac{b^2}{2c} = 2.0\,\text{m}$, וזה הרדיוס
      בקודקוד של הפרבולה $y = \dfrac{c}{b^2}x^2$ שמוכר מחשבון דיפרנציאלי. ככל ש-$t$ גדל המסלול מתיישר, ו-$\rho$ גדל.
    wrongFeedback: 'חשבו את $\vec v$ ואת $\vec a$, פרקו את $\vec a$ לרכיב לאורך $\vec v$ ולרכיב ניצב לו, והשתמשו רק בניצב.'
    commonWrong:
      - value: 10
        feedback: 'חישבתם $|\vec v|^2/|\vec a| = 20/2.0$. רק הרכיב הניצב של $\vec a$ מעקם את המסלול; הרכיב המשיקי, $1.79\,\text{m/s}^2$, מגדיל את גודל המהירות.'
        misconception: MC-1-curvature-from-total-acceleration
      - value: 11.2
        feedback: 'חילקתם ברכיב **המשיקי**, $\vec v\cdot\vec a/|\vec v| = 1.79\,\text{m/s}^2$. רדיוס העקמומיות נקבע ברכיב הניצב, $0.894\,\text{m/s}^2$.'
      - value: 2
        feedback: 'זה רדיוס העקמומיות בקודקוד, ב-$t = 0$. ב-$t = 2.0\,\text{s}$ הגוף רחוק מהקודקוד, והמסלול שם שטוח בהרבה.'
    hints:
      - 'במישור, $|\vec v\times\vec a| = |v_xa_y - v_ya_x|$, וזה $|\vec v|\cdot a_\perp$.'

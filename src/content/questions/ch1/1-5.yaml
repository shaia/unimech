# Lesson 1.5 question bank: the comprehension ladder of "תנועה יחסית וטרנספורמציית גליליי".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). Strings may hold $inline$ / $$display$$ TeX and **bold**; never use "…" for TeX.
#
# Every number was computed in .scratch/ch1/q.ts with src/physics/constants.ts (G = 9.8):
#   rain 8.0 m/s down, car 20 m/s: streaks at atan(20/8) = 68.2° from the vertical (21.8° from the horizontal),
#     rain speed relative to the car 21.5 m/s;
#   river 120 m, current 1.5 m/s, swimmer 2.5 m/s: heading 36.9° upstream, t = 120/√(2.5² − 1.5²) = 60 s
#     (d/u = 48, d/√(u² + c²) = 41.2, d/(u − c) = 120);
#   lift accelerating up at 2.0 m/s², drop from 1.5 m: t = √(2h/(g + A)) = 0.504 s (g alone 0.553, g − A 0.620);
#   plane 250 km/h, crosswind 100 km/h, 500 km each way: ground speed 229 km/h, heading 23.6°, round trip 4.36 h
#     (no wind 4.00, wind added 3.71, head/tail wind 4.76);
#   train 15 m/s, ball up at 6.0 m/s: T = 2u/g = 1.22 s, D = VT = 18.4 m (half time 9.18, H = 1.84 m); in the
#     ground frame v = 16.2 m/s at 21.8°, v²sin2θ/g = 18.4 m as well.
# Q-1.5-closest-approach (added with the lesson) in .scratch/ch1/1-5/lesson.ts with closestApproach from
# src/physics/galilean.ts: A at (−400, 0) m with (6.0, 0) m/s, B at (0, −300) m with (0, 8.0) m/s: t* = 48 s,
#   d_min = 140 m (distance now 500; when B reaches the crossing 175; when A does 233).

chapter: 1
questions:
  # ---------------------------------------------------------------- OBJ-1.5-1 relative velocity and acceleration
  - id: Q-1.5-rain-direction
    type: vector
    objectives: [OBJ-1.5-1]
    qualitative: true
    level: basic
    prompt: >-
      אין רוח, וגשם יורד אנכית ביחס לקרקע. מכונית נוסעת על כביש ישר ואופקי מזרחה. במבט מהצד, מזרח הוא ימינה בדף
      וכלפי מעלה הוא למעלה בדף. מה כיוון המהירות של טיפות הגשם **ביחס למכונית**?
    answer: sw
    correctFeedback: >-
      נכון. $\vec v_{\text{rain,car}} = \vec v_{\text{rain}} - \vec v_{\text{car}}$: לרכיב כלפי מטה של הגשם מוסיפים את מינוס
      המהירות של המכונית, מערבה. לכן הטיפות פוגעות בשמשה הקדמית, ועל החלון הצדדי הן משאירות פסים שנוטים לאחור.
    wrongFeedback: 'מהירות ביחס למכונית היא הפרש: המהירות של הגשם פחות המהירות של המכונית. ציירו את שני הווקטורים.'
    wrong:
      - dir: se
        feedback: 'חיברתם את המהירות של המכונית במקום לחסר אותה. מהמכונית, העולם כולו נע מערבה, אחורה, וגם הגשם.'
        misconception: MC-1-relative-velocity-added
      - dir: s
        feedback: 'זה הכיוון ביחס לקרקע. במערכת של המכונית מוסיפים לכל דבר את מינוס המהירות שלה, ולכן לגשם יש גם רכיב מערבה.'
      - dir: w
        feedback: 'זה רק מינוס המהירות של המכונית. הגשם גם יורד, ולכן מחברים את שני הרכיבים.'
    hints:
      - 'כתבו $\vec v_{\text{rain,car}} = \vec v_{\text{rain}} - \vec v_{\text{car}}$, רכיב-רכיב.'

  - id: Q-1.5-rain-angle
    type: numeric
    objectives: [OBJ-1.5-1]
    level: basic
    prompt: >-
      טיפות גשם יורדות אנכית במהירות $8.0\,\text{m/s}$ ביחס לקרקע. מכונית נוסעת אופקית במהירות $20\,\text{m/s}$. באיזו
      זווית **מהאנך** נוטים הפסים שהטיפות משאירות על החלון הצדדי של המכונית?
    answer: 68.2
    unit: °
    correctFeedback: >-
      נכון. ביחס למכונית לטיפה יש רכיב אנכי של $8.0\,\text{m/s}$ ורכיב אופקי של $20\,\text{m/s}$ לאחור, ולכן
      $\tan\varphi = \dfrac{20}{8.0}$ ו-$\varphi = 68.2^\circ$ מהאנך. הטיפה נעה ביחס למכונית ב-$21.5\,\text{m/s}$, מהר בהרבה
      מאשר ביחס לקרקע.
    wrongFeedback: 'חשבו את שני הרכיבים של המהירות של הטיפה ביחס למכונית. הזווית מהאנך היא זו שה-tan שלה הוא הרכיב האופקי חלקי האנכי.'
    commonWrong:
      - value: 21.8
        feedback: 'זו הזווית **מהאופק**: $\arctan(8.0/20)$. מהאנך הזווית היא המשלימה ל-$90^\circ$.'
    hints:
      - 'ביחס למכונית, הרכיב האופקי של מהירות הטיפה שווה בגודלו למהירות המכונית.'

  - id: Q-1.5-river-cross
    type: numeric
    objectives: [OBJ-1.5-1]
    level: mid
    prompt: >-
      נהר ברוחב $120\,\text{m}$ זורם במהירות אחידה $1.5\,\text{m/s}$. שחיין שוחה במהירות $2.5\,\text{m/s}$ **ביחס למים**,
      ורוצה להגיע לנקודה שנמצאת בדיוק מול נקודת היציאה שלו. כמה זמן נמשכת החצייה?
    answer: 60
    unit: s
    correctFeedback: >-
      נכון. כדי לנוע ישר לרוחב, השחיין צריך לבטל את הזרם: הרכיב של המהירות שלו ביחס למים נגד הזרם הוא
      $1.5\,\text{m/s}$, כלומר הוא מכוון $\arcsin(1.5/2.5) = 36.9^\circ$ נגד הזרם. מה שנשאר לרוחב הנהר הוא
      $\sqrt{2.5^2 - 1.5^2} = 2.0\,\text{m/s}$, ולכן $t = \dfrac{120}{2.0} = 60\,\text{s}$.
    wrongFeedback: 'מהירות השחיין ביחס לקרקע היא סכום המהירות שלו ביחס למים והמהירות של המים. דרשו שהסכום יהיה ניצב לגדות.'
    commonWrong:
      - value: 48
        feedback: 'חילקתם ב-$2.5\,\text{m/s}$, כאילו כל המהירות של השחיין לרוחב הנהר. חלק ממנה הולך לבטל את הזרם, ונשאר $2.0\,\text{m/s}$ בלבד.'
      - value: 41.2
        feedback: 'חיברתם $2.5$ ו-$1.5$ בפיתגורס. זה גודל המהירות ביחס לקרקע כששוחים **ישר** לרוחב, אבל אז השחיין נסחף. כאן היתר הוא $2.5$, והניצב החסר הוא המהירות לרוחב.'
        misconception: MC-1-relative-velocity-added
      - value: 120
        feedback: 'חיסרתם $2.5 - 1.5$ כמספרים. זה נכון רק אם השחיין שוחה ישר נגד הזרם, ואז הוא לא חוצה בכלל. הווקטורים ניצבים, ולכן משתמשים בפיתגורס.'
    hints:
      - 'ציירו משולש ישר זווית: היתר הוא המהירות ביחס למים, ניצב אחד מבטל את הזרם, והניצב השני הוא המהירות לרוחב הנהר.'

  - id: Q-1.5-elevator
    type: numeric
    objectives: [OBJ-1.5-1]
    level: mid
    prompt: >-
      מעלית עולה ומאיצה כלפי מעלה בתאוצה קבועה $2.0\,\text{m/s}^2$. ברגע מסוים נוסע משחרר מטבע, במנוחה ביחס למעלית,
      בגובה $1.5\,\text{m}$ מעל הרצפה. אחרי כמה זמן המטבע פוגע ברצפה?
    answer: 0.504
    unit: s
    correctFeedback: >-
      נכון. ביחס לקרקע לכל אחד מהשניים יש תאוצה משלו: למטבע $a_{\text{coin}} = -g$ ולרצפה $a_{\text{floor}} = A$ (ציר כלפי מעלה). התאוצה של המטבע ביחס
      לרצפה היא ההפרש, $a_{\text{rel}} = -(g + A) = -11.8\,\text{m/s}^2$, והמהירות היחסית ההתחלתית אפס. לכן
      $t = \sqrt{\dfrac{2h}{g + A}} = \sqrt{\dfrac{3.0}{11.8}} = 0.504\,\text{s}$.
    wrongFeedback: 'עבדו עם תנועה יחסית: מה התאוצה של המטבע ביחס לרצפה, כש-$\vec a_{\text{rel}} = \vec a_{\text{coin}} - \vec a_{\text{floor}}$?'
    commonWrong:
      - value: 0.553
        feedback: >-
          זה $\sqrt{2h/g}$, כאילו המעלית לא מאיצה. התאוצה היחסית שווה לתאוצה ביחס לקרקע רק כשהמערכת נעה במהירות
          קבועה. כאן הרצפה מאיצה לקראת המטבע.
        misconception: MC-1-any-frame-is-galilean
      - value: 0.62
        feedback: 'חיסרתם את התאוצות בסימן הפוך: $g - A$. הרצפה עולה לקראת המטבע, ולכן היא מקצרת את הזמן, ותאוצת הנפילה היחסית היא $g + A$.'
    hints:
      - 'כתבו את התאוצה של המטבע ושל הרצפה ביחס לקרקע, עם סימנים, וחסרו.'

  - id: Q-1.5-plane-wind
    type: numeric
    objectives: [OBJ-1.5-1]
    level: bagrut
    prompt: >-
      מטוס טס במהירות $250\,\text{km/h}$ **ביחס לאוויר**. הוא טס מעיר A לעיר B, $500\,\text{km}$ צפונה, וחוזר ל-A. כל הזמן
      נושבת רוח מזרחה, במהירות $100\,\text{km/h}$ ביחס לקרקע. הטייס מכוון את המטוס כך שהוא נע ביחס לקרקע לאורך הקו
      בין הערים. כמה זמן נמשכת הטיסה הלוך-חזור?
    answer: 4.36
    unit: h
    correctFeedback: >-
      נכון. כדי לנוע צפונה ביחס לקרקע, הרכיב של מהירות המטוס ביחס לאוויר מערבה צריך לבטל את הרוח: הטייס מכוון
      $\arcsin(100/250) = 23.6^\circ$ מערבה מהצפון. מה שנשאר לאורך הקו הוא $\sqrt{250^2 - 100^2} = 229\,\text{km/h}$,
      ובחזרה, דרומה, אותו דבר. לכן $t = \dfrac{2\cdot500}{229} = 4.36\,\text{h}$, יותר מ-$4.00\,\text{h}$ בלי רוח.
      **מה משתנה אם** הרוח הייתה נושבת צפונה? אז הלוך $500/350$ וחזור $500/150$, יחד $4.76\,\text{h}$, עוד יותר.
      **בדיקת גבולות:** כשהרוח שואפת לאפס שני המקרים נותנים $4.00\,\text{h}$, וכשהיא שואפת ל-$250\,\text{km/h}$ המטוס כבר
      לא יכול להגיע לעיר B.
    wrongFeedback: 'המהירות ביחס לקרקע היא המהירות ביחס לאוויר ועוד מהירות הרוח. דרשו שהסכום יהיה לאורך הקו בין הערים, ומצאו את הגודל שלו.'
    commonWrong:
      - value: 4
        feedback: 'זה הזמן בלי רוח. ההשפעה של רוח צד לא מתבטלת בדרך חזרה: בשני הכיוונים המטוס מבזבז חלק מהמהירות שלו כדי לבטל את הסחיפה.'
        misconception: MC-1-wind-cancels-round-trip
      - value: 3.71
        feedback: 'חיברתם את הרוח למהירות המטוס בפיתגורס, $\sqrt{250^2 + 100^2}$. אבל מהירות כזו לא מכוונת לאורך הקו: היתר במשולש הוא $250$, המהירות ביחס לאוויר.'
        misconception: MC-1-relative-velocity-added
      - value: 4.76
        feedback: 'זה הזמן ברוח שנושבת **לאורך** הקו, $500/350 + 500/150$. כאן הרוח ניצבת לקו, ולכן המהירות ביחס לקרקע זהה בשני הכיוונים.'
    hints:
      - 'ציירו משולש: היתר הוא מהירות המטוס ביחס לאוויר, ניצב אחד מבטל את הרוח, והניצב השני הוא המהירות ביחס לקרקע.'

  - id: Q-1.5-closest-approach
    type: numeric
    objectives: [OBJ-1.5-1]
    level: bagrut
    prompt: >-
      שני רוכבי אופניים מתקרבים לצומת של שתי דרכים ניצבות. ברגע מסוים רוכבת A נמצאת $400\,\text{m}$ מערבית לצומת ורוכבת
      מזרחה ב-$6.0\,\text{m/s}$, ורוכב B נמצא $300\,\text{m}$ דרומית לצומת ורוכב צפונה ב-$8.0\,\text{m/s}$. שניהם שומרים על
      מהירות קבועה. מה המרחק הקטן ביותר ביניהם?
    answer: 140
    unit: m
    correctFeedback: >-
      נכון. במערכת של A, הרוכב B יוצא מ-$\vec r_0 = \vec r_B - \vec r_A = (400,\ -300)\,\text{m}$ ונע בקו ישר במהירות
      $\vec w = \vec v_B - \vec v_A = (-6.0,\ 8.0)\,\text{m/s}$, שגודלה $10\,\text{m/s}$. המרחק הקטן ביותר מ-A לקו הזה הוא האנך:
      $d_{\min} = \dfrac{|x_0w_y - y_0w_x|}{|\vec w|} = \dfrac{|400\cdot8.0 - (-300)(-6.0)|}{10} = 140\,\text{m}$, אחרי
      $t^* = -\dfrac{\vec r_0\cdot\vec w}{|\vec w|^2} = 48\,\text{s}$.
      **בדיקת גבולות:** אם $\vec w$ היה מכוון בדיוק אל A, המכפלה הווקטורית הייתה אפס, והם היו נפגשים בצומת.
    wrongFeedback: 'עברו למערכת של A. מאיפה B יוצא בה, ובאיזו מהירות הוא נע? המרחק הקטן ביותר מנקודה לקו ישר הוא האנך.'
    commonWrong:
      - value: 500
        feedback: >-
          זה המרחק עכשיו, $\sqrt{400^2 + 300^2}$. אותו מספר יוצא גם אם מחברים את המהירויות, $\vec v_A + \vec v_B$, במקום לחסר:
          המהירות של B ביחס ל-A היא $\vec v_B - \vec v_A$.
        misconception: MC-1-relative-velocity-added
      - value: 175
        feedback: 'זה המרחק ברגע ש-B מגיע לצומת, אחרי $37.5\,\text{s}$. אבל אז A עדיין מתקרבת; הם הכי קרובים מאוחר יותר, אחרי $48\,\text{s}$.'
      - value: 233
        feedback: 'זה המרחק ברגע ש-A מגיעה לצומת. אז B כבר עבר אותו ומתרחק. חפשו את הרגע שבו המקום היחסי ניצב למהירות היחסית.'
    hints:
      - 'כתבו את המקום ואת המהירות של B ביחס ל-A כווקטורים, עם ציר $x$ מזרחה וציר $y$ צפונה.'

  # ---------------------------------------------------------------- OBJ-1.5-2 the same acceleration in every such frame
  - id: Q-1.5-train-ball
    type: mc
    objectives: [OBJ-1.5-2]
    qualitative: true
    level: basic
    prompt: >-
      רכבת נוסעת במהירות קבועה על מסילה ישרה ואופקית. נוסעת משחררת כדור, במנוחה ביחס לרכבת, מעל הרצפה. אין
      התנגדות אוויר. מה נכון?
    choices:
      - text: 'ברכבת הכדור נופל אנכית, ועל הרציף הוא נע על פרבולה. בשתי המערכות התאוצה שלו $\vec g$ כלפי מטה.'
        correct: true
        feedback: >-
          נכון. למהירות של הכדור ביחס לרציף יש בנוסף רכיב אופקי קבוע, מהירות הרכבת, ולכן המסלול שונה. אבל המהירויות
          בשתי המערכות שונות בווקטור קבוע, ולכן התאוצות זהות.
      - text: הכדור נופל מאחורי הנקודה שמתחת לנקודת השחרור, כי הרכבת ממשיכה לנסוע.
        feedback: >-
          ברגע השחרור לכדור יש אותה מהירות אופקית כמו לרכבת, ואין כוח שמאט אותה. הוא ממשיך יחד עם הרכבת, ופוגע
          ברצפה בדיוק מתחת לנקודת השחרור.
        misconception: MC-1-dropped-object-lags
      - text: 'על הרציף הכדור נע על פרבולה, ולכן התאוצה שלו שם גדולה מ-$g$.'
        feedback: >-
          המסלול שונה, אבל התאוצה לא. ב-$\vec v' = \vec v - \vec V$, הווקטור $\vec V$ קבוע, ולכן $\vec a' = \vec a$. הצורה של
          המסלול תלויה במערכת; התאוצה לא.
        misconception: MC-1-acceleration-depends-on-frame
      - text: גם על הרציף הכדור נופל אנכית, כי הוא שוחרר ממנוחה.
        feedback: 'הוא שוחרר ממנוחה **ביחס לרכבת**. ביחס לרציף יש לו כבר ברגע השחרור מהירות אופקית, מהירות הרכבת.'
    hints:
      - 'מה המהירות של הכדור ברגע השחרור, בכל אחת מהמערכות?'

  - id: Q-1.5-invariants
    type: multi
    objectives: [OBJ-1.5-2]
    qualitative: true
    level: mid
    prompt: >-
      מערכת הייחוס $S'$ נעה ביחס ל-$S$ במהירות קבועה $\vec V$, כך ש-$\vec r' = \vec r - \vec Vt$ ו-$t' = t$. אילו מהגדלים
      הבאים זהים בשתי המערכות? סמנו את כולם.
    choices:
      - text: התאוצה של גוף
        correct: true
        feedback: 'נכון. $\vec v'' = \vec v - \vec V$, ו-$\vec a'' = \dfrac{d\vec v''}{dt} = \dfrac{d\vec v}{dt} - \dfrac{d\vec V}{dt} = \vec a$, כי $\vec V$ קבוע.'
      - text: המרחק בין שני גופים באותו רגע
        correct: true
        feedback: 'נכון. $\vec r_1'' - \vec r_2'' = \left(\vec r_1 - \vec Vt\right) - \left(\vec r_2 - \vec Vt\right) = \vec r_1 - \vec r_2$.'
      - text: המהירות של גוף אחד ביחס לגוף אחר
        correct: true
        feedback: 'נכון. $\vec v_1'' - \vec v_2'' = \vec v_1 - \vec v_2$: ה-$\vec V$ מצטמצם. לכן גם גרר, שתלוי במהירות ביחס לאוויר, זהה בשתי המערכות.'
      - text: משך הזמן בין שני מאורעות
        correct: true
        feedback: 'נכון, בטרנספורמציית גליליי $t'' = t$. בפרק 9 תראו שזה רק קירוב, טוב כשהמהירויות קטנות בהרבה ממהירות האור.'
      - text: המהירות של גוף
        feedback: 'היא שונה בווקטור $\vec V$: $\vec v'' = \vec v - \vec V$. גוף שעומד ב-$S$ נע ב-$S''$ במהירות $\vec v'' = -\vec V$.'
      - text: הצורה של המסלול של גוף
        feedback: 'לא: כדור שנופל אנכית ברכבת נע על פרבולה ביחס לרציף. המסלול תלוי במהירות, והמהירות תלויה במערכת.'
        misconception: MC-1-acceleration-depends-on-frame
    hints:
      - 'גזרו את $\vec r'' = \vec r - \vec Vt$ פעם ופעמיים, וזכרו ש-$\vec V$ קבוע.'

  - id: Q-1.5-newton-same
    type: twotier
    objectives: [OBJ-1.5-2]
    qualitative: true
    level: bagrut
    prompt: >-
      סטודנטית טוענת: "את החוק השני, $\vec F = m\vec a$, אפשר לכתוב באותה צורה ברכבת שנוסעת במהירות קבועה ועל הרציף."
      חבר שלה עונה: "זה לא נכון כשיש כוח גרר. הגרר תלוי במהירות, והמהירות שונה בשתי המערכות." מי צודק?
    choices:
      - text: הסטודנטית. גם הגרר זהה בשתי המערכות.
        correct: true
        feedback: >-
          נכון. הגרר תלוי במהירות של הגוף **ביחס לאוויר**, וזו מהירות יחסית בין שני גופים: היא זהה בשתי המערכות. אוויר
          שנח על הרציף הוא רוח בתוך הרכבת הפתוחה, והגרר יוצא אותו דבר.
      - text: החבר. כוחות שתלויים במהירות שונים בשתי המערכות, ולכן החוק השני נכון רק באחת מהן.
        feedback: >-
          זה היה נכון אם הגרר היה תלוי במהירות של הגוף ביחס למערכת הייחוס. אבל הוא תלוי במהירות ביחס לאוויר, והיא
          לא משתנה כשעוברים בין המערכות.
        misconception: MC-1-velocity-forces-break-invariance
      - text: הסטודנטית, אבל רק כשאפשר להזניח את הגרר.
        feedback: 'אין צורך להזניח אותו: הגרר עצמו זהה בשתי המערכות, ולכן החוק השני נכון בשתיהן גם עם גרר.'
        misconception: MC-1-velocity-forces-break-invariance
      - text: שניהם טועים. החוק השני נכון רק במערכת שבה הקרקע במנוחה.
        feedback: 'הקרקע לא מיוחדת. כל המערכות שנעות ביחס לקרקע במהירות קבועה שקולות, וזה מה שהשאלה בודקת.'
        misconception: MC-1-acceleration-depends-on-frame
    reasons:
      - text: 'התאוצה זהה, כי $\vec V$ קבוע; המסה זהה; והכוחות תלויים במרחקים ובמהירויות **יחסיות** בין גופים, שגם הם זהים.'
        correct: true
        feedback: >-
          זה הנימוק, ומכאן שחוקי ניוטון זהים בכל המערכות שנעות זו ביחס לזו במהירות קבועה: אין ניסוי מכני שמבדיל
          ביניהן. זה עקרון היחסות של גליליי.
      - text: כל הכוחות בטבע תלויים רק במקום, לא במהירות.
        feedback: 'יש כוחות שתלויים במהירות, כמו גרר. מה שחשוב הוא שהם תלויים במהירות **יחסית**, ולכן לא משתנים בין המערכות.'
      - text: המהירות של גוף זהה בשתי המערכות, ולכן גם הגרר.
        feedback: 'המהירות של גוף שונה: $\vec v'' = \vec v - \vec V$. מה שזהה הוא ההפרש בין המהירות שלו לבין המהירות של האוויר.'
        misconception: MC-1-acceleration-depends-on-frame
    hints:
      - 'במהירות של מה, ביחס למה, תלוי כוח הגרר?'
    explanation: >-
      יש כוח אחד שנראה כאילו הוא לא מתנהג כך: הכוח המגנטי על מטען תלוי במהירות שלו ביחס למעבדה. משוואות החשמל והמגנטיות
      לא נשמרות בטרנספורמציית גליליי, והניסיון ליישב את הסתירה הזו הוביל ליחסות הפרטית, נושא פרק 9.

  - id: Q-1.5-train-throw
    type: numeric
    objectives: [OBJ-1.5-2]
    level: bagrut
    prompt: >-
      נוסע ברכבת שנוסעת במהירות קבועה $15\,\text{m/s}$ זורק כדור אנכית כלפי מעלה, ביחס לרכבת, במהירות $6.0\,\text{m/s}$,
      ותופס אותו באותו גובה. אין התנגדות אוויר. מה המרחק האופקי, **ביחס לקרקע**, בין המקום שבו הכדור נזרק לבין
      המקום שבו הוא נתפס?
    answer: 18.4
    unit: m
    correctFeedback: >-
      נכון. התאוצה זהה בשתי המערכות, ולכן התנועה האנכית זהה בהן: זמן התנועה $T = \dfrac{2u}{g} = 1.22\,\text{s}$. בזמן
      הזה הרכבת, והנוסע איתה, מתקדמים $D = VT = 15\cdot1.22 = 18.4\,\text{m}$. ומהקרקע: הכדור נזרק ב-$16.2\,\text{m/s}$
      בזווית $21.8^\circ$, ו-$\dfrac{v^2\sin2\theta}{g} = 18.4\,\text{m}$, אותה תשובה. **בדיקת גבולות:** כש-$V \to 0$ גם
      $D \to 0$, והכדור חוזר ליד שזרקה אותו.
    wrongFeedback: 'חשבו את זמן התנועה ברכבת. האם הוא שונה במערכת של הקרקע? כמה הרכבת מתקדמת בזמן הזה?'
    commonWrong:
      - value: 0
        feedback: 'זה המרחק **ברכבת**: שם הכדור עולה ויורד אנכית. ביחס לקרקע גם הנוסע וגם הכדור מתקדמים יחד עם הרכבת.'
      - value: 9.18
        feedback: 'השתמשתם בזמן העלייה בלבד, $u/g$. הכדור גם יורד חזרה, ולכן זמן התנועה $2u/g$.'
      - value: 1.84
        feedback: 'זה הגובה המרבי של הכדור, $u^2/(2g)$, לא מרחק אופקי.'
    hints:
      - 'זמן התנועה לא תלוי במערכת הייחוס. חשבו אותו במערכת שבה החישוב הכי פשוט.'

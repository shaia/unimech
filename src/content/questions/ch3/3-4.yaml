# Lesson 3.4 question bank: the comprehension ladder of "מערכת חלקיקים ומרכז מסה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q.ts:
#   1 kg (0,0), 2 kg (3,0), 3 kg (0,4) m: y_cm = 12/6 = 2.00 m (1.33 unweighted; 4.00 divided by the count);
#   semicircular wire R = 0.30 m: 2R/π = 0.191 m (half-disc 4R/3π = 0.127; R/2 = 0.150);
#   solid cone h = 0.12 m: h/4 = 0.030 m above the base (h/3 = 0.040; h/2 = 0.060; 3h/4 = 0.090);
#   person 60 kg walks 4.0 m on a 120 kg boat: boat moves m d/(m + m_b) = 1.33 m (m d/m_b = 2.00; person 2.67).
# Review fixes (2026-11-10), recomputed in .scratch/ch3/3-4/review-fix.ts:
#   rod L = 1.5 m, λ = λ0√(x/L) (ch0 already has λ0(1 + x/L)): X = 3L/5 = 0.900 m (uniform 0.75; λ ∝ x 1.00);
#   shell: launch (20, 19.6) m/s, apex (40, 19.6) m at 2.0 s, two equal halves; half 1 lands 1.0 s after the burst
#   15 m to the side, so v1 = (0, −14.7, 15) and v2 = (40, 14.7, −15) m/s; half 2 lands 4.0 s after the burst at
#   (200, −60) m, 209 m from the launch point (121 if both landed together; 200 the x part only; 80 the shell's range).
#   The old exam rungs (fragments landing together; the walker pushed by floor friction) were answered by the lesson's
#   text (ex-3-4-6 and the plank step); the new ones need a step beyond it.
# Lesson 3.4's text names the centre of mass R_cm (components X_cm, Y_cm).

chapter: 3
questions:
  # ---------------------------------------------- OBJ-3.4-1 the centre of mass, discrete and continuous
  - id: Q-3.4-ring-centre
    type: mc
    objectives: [OBJ-3.4-1]
    qualitative: true
    level: basic
    prompt: היכן נמצא מרכז המסה של טבעת דקה ואחידה?
    choices:
      - text: במרכז הטבעת, אף שאין שם חומר.
        correct: true
        feedback: >-
          נכון. מכל אלמנט של הטבעת יש אלמנט שווה מולו, ולכן $\int\vec r\,dm = 0$ ביחס למרכז. מרכז המסה הוא ממוצע של
          מקומות, משוקלל במסה, והממוצע לא חייב ליפול על החומר. כך גם בפרסה, בבומרנג ובצורת L.
      - text: על הטבעת עצמה, כי מרכז המסה חייב להיות בתוך הגוף.
        feedback: >-
          אם מרכז המסה היה על הטבעת, באיזו נקודה? כל הנקודות על הטבעת שקולות, והסימטריה לא בוחרת אף אחת מהן. מרכז
          המסה הוא ממוצע, ולא חייב להיות בתוך החומר.
        misconception: MC-3-cm-inside-body
      - text: אין לטבעת מרכז מסה, כי אין חומר במרכז.
        feedback: 'לכל מערכת יש מרכז מסה, $\vec R_{\text{cm}} = \dfrac{1}{M}\int\vec r\,dm$. זה מקום גאומטרי, לא חתיכת חומר.'
        misconception: MC-3-cm-inside-body
    hints:
      - 'מרכז המסה הוא $\vec R_{\text{cm}} = \frac1M\int\vec r\,dm$. מה נותנת הסימטריה של הטבעת?'

  - id: Q-3.4-three-masses
    type: numeric
    objectives: [OBJ-3.4-1]
    level: basic
    prompt: >-
      שלוש מסות נקודתיות במישור: $1.0\,\text{kg}$ בנקודה $(0,\,0)$, $2.0\,\text{kg}$ בנקודה $(3,\,0)$ ו-$3.0\,\text{kg}$
      בנקודה $(0,\,4)$, במטרים. מהי קואורדינטת ה-$y$ של מרכז המסה?
    answer: 2
    unit: m
    correctFeedback: >-
      נכון. $Y_{\text{cm}} = \dfrac{\sum m_iy_i}{\sum m_i} = \dfrac{1\cdot0 + 2\cdot0 + 3\cdot4}{6} = 2.0\,\text{m}$. באותו אופן
      $X_{\text{cm}} = \dfrac{2\cdot3}{6} = 1.0\,\text{m}$.
    wrongFeedback: 'מרכז המסה הוא ממוצע משוקלל: $Y_{\text{cm}} = \sum m_iy_i / \sum m_i$.'
    commonWrong:
      - value: 1.33
        feedback: 'זה ממוצע פשוט של שלושת ה-$y$. כל נקודה נספרת לפי המסה שלה: המסה הכבדה, ב-$y = 4$, מושכת את הממוצע אליה.'
      - value: 4
        feedback: 'חילקתם את $\sum m_iy_i = 12\,\text{kg·m}$ במספר המסות, 3, במקום במסה הכוללת, $6\,\text{kg}$.'
    hints:
      - 'רק מסה אחת נמצאת מחוץ לציר $x$.'

  - id: Q-3.4-rod-density
    type: numeric
    objectives: [OBJ-3.4-1]
    level: mid
    prompt: >-
      מוט דק באורך $L = 1.5\,\text{m}$ מונח לאורך ציר $x$ מ-$x = 0$ עד $x = L$. הצפיפות הקווית שלו גדלה לאורכו כמו
      השורש של המרחק מהקצה: $\lambda(x) = \lambda_0\sqrt{x/L}$. היכן מרכז המסה שלו?
    answer: 0.9
    unit: m
    correctFeedback: >-
      נכון. $\sqrt{x/L} = x^{1/2}/\sqrt L$, והקבוע $\lambda_0/\sqrt L$ מצטמצם בין המונה למכנה:
      $X_{\text{cm}} = \dfrac{\int_0^Lx^{3/2}dx}{\int_0^Lx^{1/2}dx} = \dfrac{\tfrac25L^{5/2}}{\tfrac23L^{3/2}} = \dfrac35L = 0.90\,\text{m}$.
      **בדיקת גבולות:** הצפיפות גדלה לאורך המוט, ולכן מרכז המסה אחרי האמצע, $L/2$. אבל השורש גדל לאט יותר מ-$x$,
      ולכן הוא לפני $2L/3$, מרכז המסה של מוט שצפיפותו $\lambda \propto x$.
    wrongFeedback: >-
      כתבו $X_{\text{cm}} = \dfrac{\int x\,\lambda(x)\,dx}{\int\lambda(x)\,dx}$ ואינטגרלו את שניהם מ-0 עד $L$. פונקציה קדומה
      של $x^n$ היא $\dfrac{x^{n+1}}{n+1}$, גם כש-$n$ שבר.
    commonWrong:
      - value: 0.75
        feedback: 'זה מרכז המוט, נכון רק לצפיפות אחידה. כאן הצפיפות גדלה מאפס בקצה $x = 0$ ל-$\lambda_0$ בקצה $x = L$, ומרכז המסה זז לכיוון הקצה הכבד.'
        misconception: MC-3-cm-same-for-any-filling
      - value: 1
        feedback: 'זה $2L/3$, מרכז המסה כשהצפיפות $\lambda \propto x$. השורש גדל מהר ליד $x = 0$ ולאט אחר כך, ולכן יש כאן יותר מסה בחצי הקרוב מאשר במוט ש-$\lambda \propto x$.'
    hints:
      - 'כתבו $\sqrt{x/L} = x^{1/2}/\sqrt L$. איזה קבוע מצטמצם בין המונה למכנה?'
      - 'פונקציה קדומה של $x^{1/2}$ היא $\tfrac23x^{3/2}$, ושל $x^{3/2}$ היא $\tfrac25x^{5/2}$.'

  - id: Q-3.4-semicircle-wire
    type: numeric
    objectives: [OBJ-3.4-1]
    level: mid
    prompt: >-
      תיל דק ואחיד כפוף לחצי מעגל ברדיוס $R = 0.30\,\text{m}$, מעל ציר $x$, ומרכז המעגל בראשית. מהו גובה מרכז המסה
      שלו מעל ציר $x$?
    answer: 0.191
    unit: m
    correctFeedback: >-
      נכון. עם הזווית $\theta$ מציר $x$: $dm = \lambda R\,d\theta$, $y = R\sin\theta$, ולכן
      $Y_{\text{cm}} = \dfrac{\int_0^\pi R\sin\theta\cdot\lambda R\,d\theta}{\lambda\pi R} = \dfrac{2R}{\pi} = 0.191\,\text{m}$.
    wrongFeedback: 'כתבו את אלמנט המסה במונחי הזווית, $dm = \lambda R\,d\theta$, ואת הגובה שלו, $R\sin\theta$.'
    commonWrong:
      - value: 0.127
        feedback: >-
          זה $4R/(3\pi)$, מרכז המסה של חצי **דיסקה** מלאה. בדיסקה חלק מהמסה קרוב לציר, ובתיל כל המסה במרחק $R$
          מהמרכז, ולכן מרכז המסה של התיל גבוה יותר.
        misconception: MC-3-cm-same-for-any-filling
      - value: 0.15
        feedback: 'זה $R/2$, אמצע הגובה. אבל רוב התיל קרוב לראש הקשת: האלמנטים ליד $\theta = \pi/2$ גבוהים יותר מ-$R/2$.'
    hints:
      - '$\int_0^\pi\sin\theta\,d\theta = 2$.'

  - id: Q-3.4-solid-cone
    type: numeric
    objectives: [OBJ-3.4-1]
    level: bagrut
    prompt: >-
      חרוט מלא בגובה $h = 0.12\,\text{m}$, עשוי חומר אחיד שהצפיפות שלו, המסה ליחידת נפח, היא $\rho$, עומד על הבסיס
      שלו. מהו גובה מרכז המסה שלו מעל הבסיס?
    answer: 0.03
    unit: m
    correctFeedback: >-
      נכון. חותכים את החרוט לדיסקות. עם $z$ המרחק מהקודקוד, הרדיוס של דיסקה הוא $r = \dfrac{R}{h}z$, והמסה שלה
      $dm = \rho\pi r^2dz \propto z^2dz$. לכן
      $\dfrac{\int_0^hz\cdot z^2dz}{\int_0^hz^2dz} = \dfrac{h^4/4}{h^3/3} = \dfrac34h$ מהקודקוד, כלומר $\dfrac h4 = 0.030\,\text{m}$
      מעל הבסיס. **בדיקת גבולות:** במשולש שטוח (מסה $\propto z\,dz$) יוצא $h/3$ מהבסיס, ובחרוט, שבו יותר מסה ליד
      הבסיס, מרכז המסה נמוך יותר.
    wrongFeedback: 'חתכו את החרוט לדיסקות דקות. איך המסה של דיסקה תלויה במרחק שלה מהקודקוד?'
    commonWrong:
      - value: 0.04
        feedback: >-
          זה $h/3$, מרכז המסה של משולש שטוח (וגם של מעטפת חרוט ריקה). בחרוט מלא המסה של כל פרוסה גדלה כמו $z^2$,
          ולא כמו $z$, ולכן מרכז המסה קרוב יותר לבסיס.
        misconception: MC-3-cm-same-for-any-filling
      - value: 0.06
        feedback: 'זה אמצע הגובה. החרוט רחב בתחתית וצר למעלה, ולכן רוב המסה קרובה לבסיס.'
      - value: 0.09
        feedback: 'חישבתם $\tfrac34h$, המרחק מהקודקוד. השאלה מבקשת את הגובה מעל הבסיס: $h - \tfrac34h$.'
    hints:
      - 'השטח של פרוסה פרופורציוני ל-$z^2$, כש-$z$ נמדד מהקודקוד.'

  # ---------------------------------------- OBJ-3.4-2 M·a_cm = F_ext: internal forces do not move the CM
  - id: Q-3.4-skaters-push
    type: mc
    objectives: [OBJ-3.4-2]
    qualitative: true
    level: basic
    prompt: >-
      שני מחליקים עומדים זה מול זה על קרח חלק. המסה של אחד כפולה מזו של השני. הם דוחפים זה את זה ונעים לכיוונים
      הפוכים. מה עושה מרכז המסה של שניהם?
    choices:
      - text: הוא נשאר במקום.
        correct: true
        feedback: >-
          נכון. $M\vec a_{\text{cm}} = \vec F_{\text{ext}}$, והכוחות החיצוניים (כובד ונורמלי) מאזנים זה את זה. כוחות
          הדחיפה פנימיים: לפי החוק השלישי הם מתבטלים בסכום. מרכז המסה היה במנוחה ונשאר במנוחה.
      - text: הוא נע לכיוון של המחליק הכבד.
        feedback: >-
          המחליק הכבד אכן זז פחות, אבל זה בדיוק מה ששומר את מרכז המסה במקום: $m_1\Delta x_1 + m_2\Delta x_2 = 0$.
          כוחות פנימיים לא יכולים להזיז את מרכז המסה.
        misconception: MC-3-internal-forces-move-cm
      - text: הוא נע לכיוון של המחליק הקל, שנע מהר יותר.
        feedback: 'הקל נע מהר פי 2, והכבד כבד פי 2: התנע של שניהם שווה בגודלו והפוך בכיוונו. התנע הכולל אפס, ומרכז המסה לא זז.'
        misconception: MC-3-internal-forces-move-cm
    hints:
      - 'אילו כוחות חיצוניים פועלים על מערכת שני המחליקים, ומה השקול שלהם?'

  - id: Q-3.4-boat-walk
    type: numeric
    objectives: [OBJ-3.4-2]
    level: mid
    prompt: >-
      אדם בעל מסה $60\,\text{kg}$ עומד בקצה של סירה בעלת מסה $120\,\text{kg}$ שעומדת במים שקטים. הוא הולך $4.0\,\text{m}$
      לאורך הסירה, ביחס לסירה, אל הקצה השני. הזניחו את החיכוך עם המים. כמה זזה הסירה ביחס לחוף?
    answer: 1.33
    unit: m
    correctFeedback: >-
      נכון. אין כוח חיצוני אופקי, ולכן מרכז המסה לא זז: $m\Delta x_{\text{p}} + m_{\text{b}}\Delta x_{\text{b}} = 0$, עם $m$
      המסה של האדם ו-$m_{\text{b}}$ של הסירה. ההעתק של האדם ביחס לחוף הוא $\Delta x_{\text{p}} = d + \Delta x_{\text{b}}$, ולכן
      $\Delta x_{\text{b}} = -\dfrac{md}{m + m_{\text{b}}} = -\dfrac{60\cdot4.0}{180} = -1.33\,\text{m}$: $1.33\,\text{m}$ אחורה. האדם עצמו
      זז $2.67\,\text{m}$ ביחס לחוף.
    wrongFeedback: >-
      מרכז המסה של אדם + סירה לא זז. כתבו את ההעתק של האדם ביחס לחוף כסכום של ההעתק שלו ביחס לסירה ושל ההעתק של
      הסירה.
    commonWrong:
      - value: 2
        feedback: >-
          חישבתם $md/m_{\text{b}}$, כאילו האדם זז $4.0\,\text{m}$ ביחס לחוף. $4.0\,\text{m}$ הם ביחס לסירה, והסירה עצמה זזה אחורה
          בזמן ההליכה.
        misconception: MC-3-relative-as-ground-displacement
      - value: 2.67
        feedback: 'זה ההעתק של האדם ביחס לחוף, $4.0 - 1.33$. השאלה שואלת על הסירה.'
      - value: 4
        feedback: >-
          $4.0\,\text{m}$ הם המרחק שהאדם הלך **ביחס לסירה**, ונתתם אותו לסירה, כאילו האדם עמד במקום והסירה החליקה
          מתחתיו את כל הדרך. אבל גם האדם זז ביחס לחוף, והסירה כבדה ממנו פי 2, ולכן היא זזה פחות ממנו: ההעתקים ביחס לחוף
          ביחס הפוך למסות.
    hints:
      - 'תנו שם להעתק של הסירה ביחס לחוף, $\Delta x_{\text{b}}$. מה ההעתק של האדם ביחס לחוף?'

  - id: Q-3.4-exploding-shell
    type: numeric
    objectives: [OBJ-3.4-2]
    level: bagrut
    prompt: >-
      פגז נורה מקרקע מישורית. הרכיב האופקי של מהירות הירי $20\,\text{m/s}$, והאנכי $19.6\,\text{m/s}$. בשיא, $40\,\text{m}$
      מנקודת הירי ובגובה $19.6\,\text{m}$, הפגז מתפוצץ לשני חצאים שווים. החצי הראשון נוחת $1.0\,\text{s}$ אחרי הפיצוץ,
      בנקודה שנמצאת $15\,\text{m}$ הצידה, בניצב לכיוון הירי, מהנקודה שמתחת לפיצוץ. הזניחו את האוויר. כמה רחוק מנקודת
      הירי נוחת החצי השני?
    answer: 209
    unit: m
    correctFeedback: >-
      נכון. צירים: $x$ אופקי בכיוון הירי, $y$ כלפי מעלה, $z$ אופקי הצידה, לכיוון החצי הראשון. בשיא מהירות הפגז
      $(20,\ 0,\ 0)\,\text{m/s}$, והפיצוץ פנימי, ולכן מיד אחריו $M\vec v_{\text{cm}} = \tfrac M2\vec v_1 + \tfrac M2\vec v_2$
      עדיין שווה ל-$M\cdot(20,\ 0,\ 0)$: $\vec v_1 + \vec v_2 = (40,\ 0,\ 0)\,\text{m/s}$. החצי הראשון נוחת מתחת לפיצוץ
      ב-$x$ ו-$15\,\text{m}$ הצידה אחרי $1.0\,\text{s}$, ולכן $v_{1x} = 0$ ו-$v_{1z} = 15\,\text{m/s}$; ואנכית
      $19.6 + v_{1y}\cdot1.0 - 4.9\cdot1.0^2 = 0$, ולכן $v_{1y} = -14.7\,\text{m/s}$. מכאן
      $\vec v_2 = (40,\ 14.7,\ -15)\,\text{m/s}$. החצי השני נוחת אחרי $\tau$ שמקיים $19.6 + 14.7\tau - 4.9\tau^2 = 0$,
      כלומר $\tau = 4.0\,\text{s}$, בנקודה $x = 40 + 40\cdot4.0 = 200\,\text{m}$, $z = -15\cdot4.0 = -60\,\text{m}$, במרחק
      $\sqrt{200^2 + 60^2} = 209\,\text{m}$. **בדיקת גבולות:** אילו החצי הראשון היה נוחת אחרי $2.0\,\text{s}$, כמו הפגז,
      ובלי סטייה הצידה, היה $\vec v_1 = 0$, שני החצאים היו נוחתים יחד, ומרכז המסה בסוף הפרבולה, ב-$80\,\text{m}$.
    wrongFeedback: >-
      החצאים לא נוחתים יחד, ולכן אי אפשר להשתמש בנקודה שבה מרכז המסה היה נוחת. מצאו מהנחיתה של החצי הראשון את
      שלושת הרכיבים של מהירותו מיד אחרי הפיצוץ, ואת מהירות החצי השני מ-$M\vec v_{\text{cm}} = m_1\vec v_1 + m_2\vec v_2$,
      רכיב אחר רכיב.
    commonWrong:
      - value: 121
        feedback: >-
          הנחתם ששני החצאים נוחתים יחד, ולכן מרכז המסה נוחת בסוף הפרבולה, ב-$(80,\ 0)\,\text{m}$, והחצי השני ב-$x = 120\,\text{m}$
          ו-$15\,\text{m}$ לצד השני. אבל החצי הראשון נוחת אחרי $1.0\,\text{s}$, לפני הפגז: מאותו רגע הקרקע מפעילה עליו
          כוח חיצוני, ומרכז המסה עוזב את הפרבולה. מצאו את מהירות החצי השני ועקבו אחריו עד הקרקע.
      - value: 200
        feedback: 'זה רק רכיב $x$ של נקודת הנחיתה. החצי השני זז גם הצידה, $60\,\text{m}$ ב-$z$, והמרחק הוא האורך של הווקטור.'
      - value: 80
        feedback: >-

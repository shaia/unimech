          את הידיים קדימה **וגם** את העמוד אחורה, באותו גודל (החבל קל), ושני הכוחות פועלים על חלקים של אותה מערכת. הכוח
          החיצוני האופקי השקול אפס, ומרכז המסה נשאר במקום.

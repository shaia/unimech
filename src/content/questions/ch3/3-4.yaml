      - text: הכוח על הידיים שווה בשני הניסויים, ולכן גם התאוצה של מרכז המסה.
        feedback: >-
          הכוח על הידיים שווה, אבל הוא לא הכוח החיצוני השקול על המערכת. בניסוי ב מצטרף אליו הכוח של החבל על העמוד, אחורה.

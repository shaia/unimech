      הוא קשור לעמוד בחזית העגלה עצמה. בשני הניסויים האדם מושך את החבל באותו כוח, יד אחר יד, ונשאר צמוד למושב. באיזה
      ניסוי מרכז המסה של האדם והעגלה מתחיל לנוע?

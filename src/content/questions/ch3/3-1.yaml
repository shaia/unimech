chapter: 3
questions:
  # ---------------------------------------------------------------- OBJ-3.1-1 work as a line integral
  - id: Q-3.1-circle-tension
    type: mc
    objectives: [OBJ-3.1-1]
    qualitative: true
    level: basic
    prompt: >-
      אבן קשורה לחוט ומסתובבת על שולחן חלק במעגל אופקי ברדיוס $R$, בגודל מהירות קבוע. כוח המתיחות $\vec T$ פונה
      תמיד אל מרכז המעגל. כמה עבודה עושה המתיחות על האבן בחצי סיבוב?
    choices:
      - text: אפס.
        correct: true
        feedback: >-
          נכון. העבודה היא $W = \int \vec T\cdot d\vec r$, ובכל רגע ההעתק הקטן $d\vec r$ משיק למעגל והמתיחות ניצבת לו.
          לכן $\vec T\cdot d\vec r = 0$ בכל קטע, וגם הסכום אפס. זה מתאים לכך שגודל המהירות לא משתנה.
      - text: '$2TR$, כי ההעתק בחצי סיבוב הוא קוטר המעגל.'
        feedback: >-
          $W = \vec F\cdot\Delta\vec r$ נכון רק לכוח **קבוע**. המתיחות משנה כיוון כל הזמן, ולכן צריך לסכום
          $\vec T\cdot d\vec r$ לאורך המסלול, ושם כל איבר אפס.
        misconception: MC-3-work-magnitudes
      - text: '$\pi R T$, המתיחות כפול אורך המסלול.'
        feedback: >-
          כפלתם גודל כוח בגודל דרך, בלי לבדוק את הזווית ביניהם. בעבודה נכנס רק הרכיב של הכוח לאורך ההעתק, והוא כאן
          אפס.
        misconception: MC-3-work-magnitudes
      - text: חיובית, כי בלי המתיחות האבן הייתה עוזבת את המעגל.
        feedback: >-
          המתיחות אכן נחוצה כדי לכופף את המסלול, אבל כוח שמשנה רק את **כיוון** המהירות לא עושה עבודה. עבודה משנה את
          גודל המהירות, וכאן הוא קבוע.
        misconception: MC-3-force-implies-work
    hints:
      - 'מה הזווית בין $\vec T$ לבין ההעתק הקטן $d\vec r$ ברגע כלשהו?'

  - id: Q-3.1-constant-force
    type: numeric
    objectives: [OBJ-3.1-1]
    level: basic
    prompt: >-
      על חלקיק פועל כוח קבוע $\vec F = (3,\,-2)\,\text{N}$, והחלקיק עובר במסלול כלשהו מהנקודה $(0,\,0)$ לנקודה
      $(4,\,1)$, במטרים. כמה עבודה עושה הכוח?
    answer: 10
    unit: J
    correctFeedback: >-
      נכון. לכוח קבוע האינטגרל הקווי הוא מכפלה סקלרית עם ההעתק הכולל, בכל מסלול:
      $W = \vec F\cdot\Delta\vec r = 3\cdot4 + (-2)\cdot1 = 10\,\text{J}$.
    wrongFeedback: 'כתבו את ההעתק $\Delta\vec r$ ברכיבים, וחשבו את המכפלה הסקלרית $F_x\Delta x + F_y\Delta y$.'
    commonWrong:
      - value: 14.9
        feedback: >-
          זה $|\vec F|\,|\Delta\vec r| = \sqrt{13}\cdot\sqrt{17}$, כאילו הכוח וההעתק באותו כיוון. במכפלה הסקלרית נכנס
          גם הקוסינוס של הזווית ביניהם, ולכן מחשבים ברכיבים.
        misconception: MC-3-work-magnitudes
      - value: 14
        feedback: 'השמטתם את הסימן של $F_y$. הכוח פונה כלפי מטה והחלקיק עולה, ולכן הרכיב הזה תורם עבודה שלילית.'
      - value: -5
        feedback: 'כפלתם את $F_x$ ב-$\Delta y$ ואת $F_y$ ב-$\Delta x$. כל רכיב של הכוח נכפל ברכיב של ההעתק באותו ציר.'
    hints:
      - 'כשהכוח קבוע, $\int\vec F\cdot d\vec r = \vec F\cdot\int d\vec r$.'

  - id: Q-3.1-three-paths
    type: rank
    objectives: [OBJ-3.1-1]
    level: mid
    prompt: >-
      במישור פועל הכוח $\vec F = (cy,\,0)$, עם $c = 2\,\text{N/m}$ ($x$ ו-$y$ במטרים): רכיב $x$ שגדל עם הגובה, ורכיב
      $y$ אפס. חלקיק עובר מ-$(0,\,0)$ ל-$(1,\,1)$ בשלושה מסלולים. דרגו את העבודה של $\vec F$ בכל מסלול, מהגדולה
      לקטנה.
    items:
      - id: B
        label: 'מסלול ב: קודם לאורך $y$ עד $(0,\,1)$, ואז לאורך $x$'
      - id: C
        label: 'מסלול ג: לאורך האלכסון $y = x$'
      - id: A
        label: 'מסלול א: קודם לאורך $x$ עד $(1,\,0)$, ואז לאורך $y$'
    order: [B, C, A]
    correctFeedback: >-
      נכון. רק תנועה לאורך $x$ תורמת, $dW = cy\,dx$. במסלול א החלקיק נע לאורך $x$ ב-$y = 0$: $W = 0$. במסלול ב הוא נע
      לאורך $x$ ב-$y = 1\,\text{m}$: $W = c\cdot1\cdot1 = 2\,\text{J}$. במסלול ג, על האלכסון $y = x$:
      $W = \int_0^1 cx\,dx = \dfrac{c}{2} = 1\,\text{J}$. אותן נקודות קצה, שלוש עבודות שונות.
    wrongFeedback: >-
      כתבו $dW = F_x\,dx + F_y\,dy = cy\,dx$. בכל קטע של מסלול הציבו את $y$ שלו, ואז אינטגרלו. בקטעים לאורך $y$
      התרומה אפס, כי $dx = 0$ שם.
    hints:
      - 'בקטע שבו $y$ קבוע, $\int cy\,dx = cy\,\Delta x$. ובקטע לאורך $y$?'
      - 'על האלכסון הציבו $y = x$ ואינטגרלו מ-0 עד 1.'

  - id: Q-3.1-spring-work
    type: numeric
    objectives: [OBJ-3.1-1]
    level: mid
    prompt: >-
      קפיץ בעל קבוע $k = 200\,\text{N/m}$ מחובר לקיר, וכוח הקפיץ על הקצה החופשי הוא $F_x = -kx$, כאשר $x$ ההתארכות.
      מותחים את הקפיץ לאט מהתארכות $0.10\,\text{m}$ להתארכות $0.30\,\text{m}$. כמה עבודה עושה **כוח הקפיץ** בתהליך?
    answer: -8
    unit: J
    correctFeedback: >-
      נכון. הכוח משתנה עם $x$, ולכן עושים אינטגרל:
      $W = \int_{x_1}^{x_2}(-kx)\,dx = -\dfrac{k}{2}\left(x_2^2 - x_1^2\right) = -100\cdot(0.09 - 0.01) = -8.0\,\text{J}$.
      הסימן שלילי כי הכוח פונה נגד ההתארכות.
    wrongFeedback: 'הכוח לא קבוע, ולכן $W \ne F\,\Delta x$. אינטגרלו את $F_x = -kx$ מ-$x_1$ עד $x_2$.'
    commonWrong:
      - value: 8
        feedback: 'זו העבודה של היד שמותחת. הקפיץ מושך נגד ההתארכות, ולכן העבודה שלו שלילית.'
      - value: -4
        feedback: >-
          חישבתם $W = -\tfrac12k(x_2 - x_1)^2$, כאילו הקפיץ התחיל רפוי. האינטגרל נותן הפרש של ריבועים,
          $x_2^2 - x_1^2$, ולא ריבוע של הפרש.
      - value: -12
        feedback: 'כפלתם את הכוח הסופי $kx_2$ בהעתק. הכוח גדל במהלך המתיחה, ולכן העבודה קטנה מזה: צריך אינטגרל.'
        misconception: MC-3-work-magnitudes
    hints:
      - '$\int x\,dx = \tfrac12x^2$. הציבו את שני הגבולות.'

  # ---------------------------------------------------------------- OBJ-3.1-2 the work-energy theorem
  - id: Q-3.1-derivation-step
    type: mc
    objectives: [OBJ-3.1-2]
    qualitative: true
    level: basic
    prompt: >-
      בגזירת משפט עבודה-אנרגיה מהחוק השני כותבים
      $$\vec F\cdot d\vec r = m\frac{d\vec v}{dt}\cdot\vec v\,dt$$
      איזו זהות הופכת את אגף ימין לשינוי באנרגיה הקינטית?
    choices:
      - text: '$\dfrac{d\vec v}{dt}\cdot\vec v = \dfrac{d}{dt}\left(\tfrac12 v^2\right)$, ולכן $\vec F\cdot d\vec r = d\left(\tfrac12mv^2\right)$.'
        correct: true
        feedback: >-
          נכון. $\dfrac{d}{dt}(\vec v\cdot\vec v) = 2\vec v\cdot\dfrac{d\vec v}{dt}$. סוכמים לאורך המסלול ומקבלים
          $W_{\text{net}} = \tfrac12mv_2^2 - \tfrac12mv_1^2$. שימו לב שזה תקף לכל כוח שקול, גם לא קבוע.
      - text: '$d\vec r = \vec v\,dt$ בלבד; הזהות הזו לבדה כבר נותנת את המשפט.'
        feedback: >-
          את $d\vec r = \vec v\,dt$ כבר השתמשנו כדי להגיע לאגף ימין. עדיין צריך לזהות ש-$\vec v\cdot d\vec v$ הוא
          הדיפרנציאל של $\tfrac12v^2$.
      - text: '$\dfrac{d\vec v}{dt} = \vec a$ קבוע, ולכן $v^2 = v_0^2 + 2a\,\Delta x$.'
        feedback: >-
          זו נוסחה של תאוצה קבועה. המשפט נכון גם כשהכוח משתנה, והגזירה הכללית לא מניחה תאוצה קבועה.
      - text: '$\dfrac{d\vec v}{dt}\cdot\vec v = \dfrac{dv}{dt}\,v$ רק בתנועה בקו ישר, ולכן המשפט תקף רק בממד אחד.'
        feedback: >-
          הזהות $\vec v\cdot\dfrac{d\vec v}{dt} = v\dfrac{dv}{dt}$ נכונה תמיד, גם במסלול עקום: הרכיב של התאוצה הניצב
          למהירות לא משנה את גודלה. לכן המשפט תקף בכל מסלול.
    hints:
      - 'גזרו את $v^2 = \vec v\cdot\vec v$ לפי הזמן בכלל המכפלה.'

  - id: Q-3.1-bead-on-wire
    type: twotier
    objectives: [OBJ-3.1-2, OBJ-3.1-1]
    qualitative: true
    level: mid
    prompt: >-
      שני תילים, מכופפים בצורות שונות ובאורכים שונים, יורדים שניהם בגובה $h$ מנקודת ההתחלה שלהם לנקודה התחתונה.
      על כל תיל מושחל חרוז, שמתחיל **ממנוחה** ומחליק בלי חיכוך עד התחתית. האם גודל המהירות של שני החרוזים בתחתית שווה?
    choices:
      - text: כן, הוא תלוי רק ב-$h$.
        correct: true
        feedback: 'נכון. לפי משפט עבודה-אנרגיה, ממנוחה, $\tfrac12mv^2 = W_{\text{net}} = mgh$, ולכן $v = \sqrt{2gh}$ בשני התילים.'
      - text: לא, המהירות תלויה גם בצורה, כי הכוח הנורמלי שונה בכל תיל.
        feedback: >-
          הכוח הנורמלי אכן שונה בגודלו ובכיוונו מתיל לתיל, אבל הוא ניצב לתיל, ולכן גם למהירות, בכל רגע. התרומה שלו
          לעבודה אפס בכל מסלול.
        misconception: MC-3-force-implies-work
      - text: לא, החרוז על התיל הארוך יותר מהיר יותר, כי הכובד פועל עליו לאורך דרך ארוכה יותר.
        feedback: >-
          אורך המסלול משנה את הזמן, לא את העבודה של הכובד. העבודה של כוח קבוע תלויה רק בהעתק, וכאן רק ברכיב האנכי
          שלו.
    reasons:
      - text: 'הנורמלי ניצב ל-$d\vec r$ בכל רגע, והעבודה של הכובד הקבוע היא $m\vec g\cdot\Delta\vec r = mgh$ בכל מסלול.'
        correct: true
        feedback: זה הנימוק. שני החלקים חשובים, כי המשפט מדבר על העבודה של **כל** הכוחות.
      - text: העבודה של כל כוח תלויה רק בנקודת ההתחלה ובנקודת הסוף.
        feedback: >-
          לא כל כוח. לכוח $(cy,\,0)$, למשל, העבודה בין $(0,\,0)$ ל-$(1,\,1)$ שונה בכל מסלול. כאן זה עובד כי הכובד
          קבוע והנורמלי לא עושה עבודה.
        misconception: MC-3-work-path-independent-always
      - text: הכוח הנורמלי והכובד מבטלים זה את זה לאורך כל הדרך.
        feedback: 'אם הם היו מבטלים זה את זה, החרוז לא היה מאיץ. על תיל משופע הנורמלי מאזן רק את רכיב הכובד הניצב לתיל.'
    hints:
      - 'כתבו $W_{\text{net}} = W_g + W_N$. מה הזווית בין הכוח הנורמלי למהירות?'

  - id: Q-3.1-push-box
    type: numeric
    objectives: [OBJ-3.1-2]
    level: mid
    prompt: >-
      ארגז בעל מסה $2.0\,\text{kg}$ עומד על רצפה אופקית. דוחפים אותו בכוח אופקי קבוע של $15\,\text{N}$ לאורך
      $4.0\,\text{m}$. מקדם החיכוך הקינטי בין הארגז לרצפה הוא $0.30$. מה גודל המהירות של הארגז בסוף הדחיפה?
    answer: 6.04
    unit: m/s
    correctFeedback: >-
      נכון. החיכוך הוא $\mu_k mg = 0.30\cdot2.0\cdot9.8 = 5.88\,\text{N}$, נגד התנועה. העבודה הכוללת
      $W_{\text{net}} = (15 - 5.88)\cdot4.0 = 36.5\,\text{J}$, והמשפט נותן $v = \sqrt{\dfrac{2W_{\text{net}}}{m}} = 6.04\,\text{m/s}$.
    wrongFeedback: 'במשפט עבודה-אנרגיה נכנסת עבודת כל הכוחות: הדחיפה חיובית, החיכוך שלילי, והכובד והנורמלי אפס.'
    commonWrong:
      - value: 7.75
        feedback: 'זו המהירות בלי חיכוך. החיכוך הקינטי עושה עבודה שלילית, $W_f = -\mu_kmg\,d$, וגם היא נכנסת לעבודה הכוללת.'
      - value: 9.14
        feedback: 'הוספתם את עבודת החיכוך במקום להחסיר אותה. החיכוך פונה נגד התנועה, ולכן העבודה שלו שלילית.'
      - value: 4.27
        feedback: 'שכחתם את ה-$\tfrac12$ שבאנרגיה הקינטית: מ-$\tfrac12mv^2 = W$ יוצא $v = \sqrt{2W/m}$.'
    hints:
      - 'חשבו קודם את העבודה הכוללת, ורק אז השוו אותה ל-$\tfrac12mv^2$.'

  - id: Q-3.1-semicircle-wire
    type: numeric
    objectives: [OBJ-3.1-1, OBJ-3.1-2]
    level: bagrut
    prompt: >-
      חרוז במסה $m = 0.50\,\text{kg}$ מושחל על תיל חלק, שמכופף לחצי מעגל ברדיוס $R = 0.80\,\text{m}$ ומונח על שולחן
      אופקי. על השולחן צירים $x$ ו-$y$ (במטרים), ומרכז חצי המעגל בראשית. החרוז נע על התיל מהנקודה $A = (R,\,0)$, דרך
      $(0,\,R)$, אל $B = (-R,\,0)$. מלבד הכובד, הכוח הנורמלי של השולחן והכוח של התיל, פועל עליו כוח אופקי
      $\vec F = (cy,\,0)$, עם $c = 2.5\,\text{N/m}$. ב-A גודל המהירות שלו $4.0\,\text{m/s}$. מה גודל המהירות שלו ב-B?
    answer: 2.44
    unit: m/s
    correctFeedback: >-
      נכון. הכובד והנורמלי של השולחן אנכיים, והכוח של התיל החלק ניצב לתיל: אף אחד מהם לא עושה עבודה. נשאר
      $\vec F$, לאורך חצי המעגל: $\vec r(\varphi) = (R\cos\varphi,\,R\sin\varphi)$ עם $\varphi$ מ-0 עד $\pi$,
      $\dfrac{d\vec r}{d\varphi} = (-R\sin\varphi,\,R\cos\varphi)$, ועל המסלול $\vec F = (cR\sin\varphi,\,0)$. לכן
      $$W = \int_0^{\pi}\left(-cR^2\sin^2\varphi\right)d\varphi = -\frac{\pi}{2}cR^2 = -2.51\,\text{J}$$
      העבודה שלילית: מעל ציר $x$ הכוח דוחף ימינה, והחרוז נע שמאלה. משפט עבודה-אנרגיה:
      $K_B = \tfrac12\cdot0.50\cdot4.0^2 - 2.51 = 1.49\,\text{J}$, ולכן $v_B = \sqrt{2K_B/m} = 2.44\,\text{m/s}$.
      **בדיקת גבולות:** כש-$c \to 0$, $v_B \to v_A$. **יחידות:** $cR^2$ ב-$\text{N/m}\cdot\text{m}^2 = \text{J}$.
    wrongFeedback: >-
      מצאו קודם מי עושה עבודה. אחר כך כתבו את חצי המעגל בהצגה פרמטרית, חשבו את $\vec F\cdot\dfrac{d\vec r}{d\varphi}$,
      ואינטגרלו מ-0 עד $\pi$.
    commonWrong:
      - value: 4.0
        feedback: >-
          זו המהירות אם $W = 0$, כמו לאורך הקוטר, שעליו $y = 0$ והכוח אפס. אבל החרוז נע לאורך חצי המעגל, ושם
          $y > 0$: את העבודה של הכוח הזה מחשבים לאורך המסלול שעבר בפועל.
        misconception: MC-3-work-path-independent-always
      - value: 1.79
        feedback: >-
          המכפלה הסקלרית היא $\left(cR\sin\varphi\right)\left(-R\sin\varphi\right) = -cR^2\sin^2\varphi$, עם $\sin^2$.
          האינטגרל של $\sin^2\varphi$ מ-0 עד $\pi$ הוא $\pi/2$, לא 2.
      - value: 5.10
        feedback: >-
          איבדתם את הסימן. על המסלול $dx \lt 0$ (החרוז נע שמאלה) ו-$F_x \gt 0$, ולכן העבודה שלילית והחרוז מאט.
      - value: 3.31
        feedback: 'שכחתם את ה-$\tfrac12$ שבאנרגיה הקינטית: $v_B = \sqrt{2K_B/m}$.'
    hints:
      - 'אילו כוחות ניצבים לתנועה בכל רגע? רק $\vec F$ עושה עבודה.'
      - 'כתבו $\vec r(\varphi) = (R\cos\varphi,\,R\sin\varphi)$, $\varphi$ מ-0 עד $\pi$, והציבו $y = R\sin\varphi$ בכוח.'
      - 'מ-0 עד $\pi$ האינטגרלים של $\sin^2\varphi$ ושל $\cos^2\varphi$ שווים, וסכומם $\pi$.'

  - id: Q-3.1-two-frames
    type: mc
    objectives: [OBJ-3.1-2]
    level: bagrut
    prompt: >-
      עגלה במסה $2.0\,\text{kg}$ נמצאת על מסילה אופקית חלקה. כוח אופקי קבוע דוחף אותה קדימה, ובמערכת הקרקע גודל
      המהירות שלה עולה מ-$3.0\,\text{m/s}$ ל-$7.0\,\text{m/s}$. מסתכלים על הדחיפה ממערכת ייחוס אינרציאלית שנעה
      לאורך המסילה, קדימה, במהירות קבועה $u$ ביחס לקרקע. באיזה $u$ העבודה של הכוח הדוחף על העגלה, במערכת הזו, היא אפס?
    choices:
      - text: '$u = 5.0\,\text{m/s}$.'
        correct: true
        feedback: >-
          נכון. במערכת שנעה ב-$u$ המהירויות הן $v_1 - u$ ו-$v_2 - u$ (שיעור 1.5), והמשפט נכון בה, כי היא אינרציאלית:
          $$W' = \Delta K' = \tfrac12m\left[(v_2 - u)^2 - (v_1 - u)^2\right] = \tfrac12m\left(v_2^2 - v_1^2\right) - mu\,\Delta v = W - mu\,\Delta v$$
          את $mu\,\Delta v$ רואים גם ישירות: הכוח זהה בשתי המערכות, $F = m\,\Delta v/\Delta t$, אבל במערכת הנעה
          העגלה זזה בזמן הדחיפה פחות ב-$u\,\Delta t$, ולכן העבודה קטנה ב-$Fu\,\Delta t = mu\,\Delta v$. כאן $W = 40\,\text{J}$
          ו-$m\,\Delta v = 8.0\,\text{kg}\cdot\text{m/s}$, ולכן $W' = 0$ ב-$u = 5.0\,\text{m/s}$, הממוצע של $v_1$ ו-$v_2$.
          במערכת הזו העגלה נעה אחורה ב-$2.0\,\text{m/s}$, נעצרת וחוזרת קדימה ב-$2.0\,\text{m/s}$: הדחיפה בולמת ואז
          מאיצה, והעבודות מתקזזות.
      - text: 'אין מערכת כזו: העבודה של הכוח היא $40\,\text{J}$ בכל מערכת אינרציאלית, כי הכוח זהה בכולן.'
        feedback: >-
          הכוח אכן זהה, אבל העבודה היא $\int\vec F\cdot d\vec r$, וההעתק $d\vec r$ תלוי במערכת. לכן גם העבודה תלויה
          במערכת, ממש כמו האנרגיה הקינטית. בכל מערכת המשפט נכון עם המספרים שלה.
        misconception: MC-3-work-frame-independent
      - text: '$u = 3.0\,\text{m/s}$, המערכת שבה העגלה מתחילה ממנוחה.'
        feedback: >-
          במערכת הזו העגלה מאיצה מ-0 ל-$4.0\,\text{m/s}$, ו-$W' = \Delta K' = \tfrac12\cdot2.0\cdot4.0^2 = 16\,\text{J}$, לא
          אפס. עבודה אפס פירושה אותו **גודל** מהירות בהתחלה ובסוף.
      - text: '$u = 7.0\,\text{m/s}$, המערכת שבה העגלה מסיימת במנוחה.'
        feedback: >-
          במערכת הזו העגלה נבלמת מ-$4.0\,\text{m/s}$ ל-0, ו-$W' = -16\,\text{J}$: הכוח פונה קדימה והעגלה נעה אחורה. עבודה
          אפס פירושה אותו **גודל** מהירות בהתחלה ובסוף.
    hints:
      - 'מה המהירויות של העגלה, בהתחלה ובסוף, במערכת שנעה ב-$u$?'
      - 'המשפט נכון במערכת הזו: $W'' = \Delta K''$. מתי השינוי באנרגיה הקינטית אפס?'

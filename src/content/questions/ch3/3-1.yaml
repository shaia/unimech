# Lesson 3.1 question bank: the comprehension ladder of "עבודה ומשפט עבודה-אנרגיה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q.ts:
#   F = (3, −2) N, Δr = (4, 1) m: W = 10 J; |F||Δr| = 14.9 J; components swapped −5 J; signs dropped 14 J;
#   F = (cy, 0), c = 2 N/m, (0,0) → (1,1) m: x then y 0 J, the diagonal y = x 1 J, y then x 2 J;
#   k = 200 N/m, 0.10 → 0.30 m: W_spring = −8.0 J (−4.0 J from (Δx)², −12 J from k·x₂·Δx);
#   m = 2.0 kg, F = 15 N, μk = 0.30, d = 4.0 m: W_net = 36.5 J, v = 6.04 m/s (7.75 without friction,
#   9.14 with friction added, 4.27 without the factor 2);
#   review fixes, in .scratch/ch3/3-1/review-fixes.ts:
#   bead on a horizontal semicircle wire, F = (cy, 0), c = 2.5 N/m, R = 0.80 m, m = 0.50 kg, v_A = 4.0 m/s:
#   W = −πcR²/2 = −2.51 J (numeric line integral agrees), K_B = 1.49 J, v_B = 2.44 m/s (4.00 along the diameter,
#   1.79 with ∫sin φ, 5.10 with the sign dropped, 3.31 without the ½);
#   cart m = 2.0 kg pushed from 3.0 to 7.0 m/s: W = 40 J, mΔv = 8 kg·m/s, W′ = W − muΔv = 0 at u = 5.0 m/s

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-3.5-2, OBJ-3.3-1, OBJ-1.5-1]
        prompt: >-
          (1) בטאו את מהירות הגוש $v$ ואת מהירות העגלה $V$ ביחס לרצפה, ברגע שהגוש מגיע לנקודה התחתונה, ואת מהירות
          הגוש ביחס לעגלה באותו רגע, $u = v - V$, באמצעות $m$, $M$, $g$ ו-$R$.

          (2) בדקו את הביטויים בגבול $M \to \infty$ ובמקרה $m = M$, ובדקו יחידות.
        hints:
          - 'בנקודה התחתונה המסילה אופקית, ולכן שתי המהירויות אופקיות. כתבו שימור של $P_x$ ושימור אנרגיה.'
        solution:
          - { kind: law, text: 'שימור רכיב ה-$x$ של התנע, מאפס: $mv + MV = 0$. שימור אנרגיה מכנית, עם הגובה $R$ שהגוש יורד: $mgR = \tfrac12mv^2 + \tfrac12MV^2$. בנקודה התחתונה שתי המהירויות אופקיות. המהירות היחסית (שיעור 1.5): $u = v - V$.' }
          - { kind: manipulation, text: 'מהראשונה $V = -\dfrac mMv$. מציבים בשנייה: $mgR = \tfrac12mv^2\left(1 + \dfrac mM\right)$, ולכן $$v = \sqrt{\frac{2gRM}{M + m}},\qquad V = -\frac mM\,v,\qquad u = v\left(1 + \frac mM\right) = \sqrt{\frac{2gR(M + m)}{M}}$$' }
          - { kind: limit, text: 'כש-$M \to \infty$: $v \to \sqrt{2gR}$, $V \to 0$ ו-$u \to \sqrt{2gR}$, מסילה קבועה. כש-$m = M$: $v = \sqrt{gR}$ ו-$V = -\sqrt{gR}$, והמהירות היחסית $2\sqrt{gR}$, גדולה מ-$\sqrt{2gR}$ של מסילה קבועה. והיחס בין האנרגיות הקינטיות, $\tfrac12mv^2 : \tfrac12MV^2 = M : m$: הגוף הקל מקבל את רוב האנרגיה.' }
          - { kind: units, text: '$gR$ ביחידות $\text{m}^2/\text{s}^2$, ויחסי המסות חסרי ממדים, ולכן שלוש המהירויות ב-$\text{m/s}$.' }
          - { kind: result, text: '$v = \sqrt{2gRM/(M + m)}$, $V = -(m/M)\,v$ (העגלה נרתעת לאחור), ו-$u = \sqrt{2gR(M + m)/M}$.' }
        rubric:
          - text: 'כתבתי שימור של $P_x$ ושימור אנרגיה של המערכת כולה, עם מהירויות ביחס לרצפה.'
          - text: 'מצאתי את $v$ ואת $V$, וחישבתי את $u = v - V$ עם הסימנים (כאן $V < 0$), ולא $v + V$.'
          - text: 'בדקתי שכש-$M \to \infty$ מתקבלת המסילה הקבועה, $\sqrt{2gR}$, ובדקתי את המקרה $m = M$ ואת היחידות.'

      - label: ג
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-2.6-2, OBJ-1.5-1, OBJ-2.1-1]
        prompt: >-
          (1) הראו שברגע שהגוש בנקודה התחתונה, תאוצת העגלה אפס.

          (2) בטאו את הכוח הנורמלי $N$ שהמסילה מפעילה על הגוש באותו רגע באמצעות $m$, $M$ ו-$g$.

          (3) בדקו את התוצאה בגבול $M \to \infty$, ובדקו יחידות.
        hints:
          - 'מהו הכוח האופקי היחיד על העגלה, ולאן הוא פונה כשהגוש בנקודה התחתונה?'
          - 'ביחס לעגלה הגוש נע על מעגל ברדיוס $R$. איזו מהירות קובעת את התאוצה הצנטריפטלית שלו, $v$ או $u$?'
        solution:
          - { kind: law, text: 'על העגלה פועלים אופקית רק הכוח של הגוש (הרצפה חלקה, והכוח שלה אנכי). בנקודה התחתונה המסילה אופקית, ולכן הכוח בין הגוש למסילה אנכי, ותאוצת העגלה אפס באותו רגע. התאוצות (שיעור 1.5): $\vec a_{\text{block}} = \vec a_{\text{rel}} + \vec A_{\text{cart}} = \vec a_{\text{rel}}$. ביחס לעגלה הגוש נע על מעגל ברדיוס $R$ במהירות $u$, ולכן לתאוצה היחסית יש רכיב $u^2/R$ אל המרכז, כלפי מעלה; רכיב אופקי אין לה, כי גם על הגוש לא פועל שם כוח אופקי.' }
          - { kind: manipulation, text: 'החוק השני לגוש, בכיוון $y$: $N - mg = \dfrac{mu^2}{R}$. עם $u^2 = 2gR(M + m)/M$ מחלק ב: $$N = mg + 2mg\,\frac{M + m}{M} = mg\left(3 + \frac{2m}{M}\right)$$ להציב $v^2/R$ במקום $u^2/R$ זו טעות: המסלול של הגוש ביחס לרצפה אינו מעגל ברדיוס $R$; רק ביחס לעגלה הוא כזה, ורק משום שהעגלה לא מאיצה באותו רגע מותר להשתמש בתאוצה היחסית כתאוצה.' }
          - { kind: limit, text: 'כש-$M \to \infty$: $N \to 3mg$, התוצאה של מסילה קבועה ($v^2 = 2gR$, $N = mg + 2mg$). כשהעגלה קלה יותר, $N > 3mg$, כי העגלה נרתעת והמהירות היחסית גדלה.' }
          - { kind: units, text: '$3 + 2m/M$ חסר ממדים, ולכן $N$ ביחידות של $mg$, ניוטון.' }
          - { kind: result, text: 'בנקודה התחתונה תאוצת העגלה אפס, ו-$N = mg\left(3 + \dfrac{2m}{M}\right)$, כלפי מעלה.' }
        rubric:
          - text: 'נימקתי שהכוח של הגוש על העגלה אנכי בנקודה התחתונה, ולכן העגלה לא מאיצה באותו רגע.'
          - text: 'השתמשתי במהירות היחסית $u$, ולא ב-$v$, בתאוצה הצנטריפטלית $u^2/R$.'
          - text: 'קיבלתי $N = mg(3 + 2m/M)$, ובדקתי שכש-$M \to \infty$ מתקבל $3mg$.'

      - label: ד
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-2.2-1, OBJ-3.4-2]
        prompt: >-
          (1) בטאו את הכוח $N_f$ שהרצפה מפעילה על העגלה באותו רגע, באמצעות $m$, $M$ ו-$g$.

          (2) הראו שהתוצאה מתאימה לתנועה של מרכז המסה של המערכת: $N_f - (M + m)g$ שווה למסה הכוללת כפול רכיב ה-$y$ של
          תאוצת מרכז המסה. בדקו את התוצאה בגבול $M \to \infty$, ובדקו יחידות.
        hints:
          - 'מה הזוג של הכוח $N$ שהמסילה מפעילה על הגוש, ועל איזה גוף הוא פועל?'
        solution:
          - { kind: law, text: 'החוק השלישי: הגוש דוחף את המסילה כלפי מטה בכוח $N$, הזוג של הכוח שהמסילה מפעילה עליו. העגלה נעה רק אופקית, ולכן הכוחות האנכיים עליה מאוזנים: $N_f = Mg + N$.' }
          - { kind: manipulation, text: 'עם $N$ מחלק ג: $$N_f = Mg + mg\left(3 + \frac{2m}{M}\right) = (M + 3m)\,g + \frac{2m^2g}{M}$$ בדיקה ממרכז המסה: הכוחות החיצוניים האנכיים נותנים $N_f - (M + m)g = (M + m)\,a_{\text{cm},y} = m\,a_{\text{block},y} + M\cdot0 = \dfrac{mu^2}{R}$. מחלק ב, $\dfrac{mu^2}{R} = 2mg + \dfrac{2m^2g}{M}$, ובדיוק זה $N_f - (M + m)g$.' }
          - { kind: limit, text: 'כש-$M \to \infty$: $N_f - Mg \to 3mg$, הכוח שגוש מפעיל בנקודה התחתונה של מסילה קבועה. הרצפה דוחפת יותר מהמשקל הכולל, $(M + m)g$, כי באותו רגע מרכז המסה מאיץ כלפי מעלה.' }
          - { kind: units, text: 'כל איבר הוא מסה כפול $g$ (גם $m^2/M$ הוא מסה), ולכן $N_f$ בניוטון.' }
          - { kind: result, text: '$N_f = (M + 3m)\,g + \dfrac{2m^2g}{M}$, גדול מ-$(M + m)g$ בדיוק ב-$mu^2/R$, כמו שמשפט מרכז המסה דורש.' }
        rubric:
          - text: 'השתמשתי בחוק השלישי: הגוש דוחף את המסילה כלפי מטה ב-$N$, וכתבתי $N_f = Mg + N$.'
          - text: 'בדקתי ש-$N_f - (M + m)g = mu^2/R$, מהתנועה של מרכז המסה.'
          - text: 'בדקתי שכש-$M \to \infty$ העגלה מקבלת $3mg$ מעבר למשקלה, כמו מסילה קבועה, ובדקתי יחידות.'

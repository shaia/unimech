        wrongFeedback: 'מצאו את הגובה של המחסום, $U(0) - U(a)$, והשוו אותו לאנרגיה הקינטית ההתחלתית.'
        commonWrong:
          - value: 4.47
            feedback: 'שכחתם את ה-$\tfrac12$: $\tfrac12mv^2 = U_0$ נותן $v = \sqrt{2U_0/m}$.'
          - value: 8.94
            feedback: 'לקחתם מחסום של $2U_0 = 4.0\,\text{J}$. הגבעה ב-$O$ נמצאת ב-$U = 0$, והתחתית ב-$U = -U_0$: ההפרש $U_0$ בלבד.'

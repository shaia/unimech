            misconception: MC-3-central-force-no-work
          - text: האנרגיה הקינטית נשמרת, ולכן העבודה אפס.
            feedback: 'בחלק א המהירות גדלה מ-$2.0$ ל-$4.0\,\text{m/s}$: האנרגיה הקינטית גדלה פי 4.'

      - label: ג
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-3.1-1, OBJ-3.1-2, OBJ-3.7-2]
        prompt: >-
          (1) מצאו את המתיחות $T(r)$ כפונקציה של הרדיוס.

          (2) מצאו ביטוי לעבודה $W$ שהמתיחות עושה על הדסקית בזמן שהרדיוס קטן מ-$r_0$ ל-$r_1$, כאינטגרל של $T(r)$,
          באמצעות $m$, $v_0$, $r_0$ ו-$r_1$, והראו שהיא שווה לשינוי באנרגיה הקינטית.

          (3) בדקו את $T(r)$ ב-$r = r_0$ ואת $W$ בגבול $r_1 \to 0$, ובדקו יחידות. חשבו את $W$ עבור $r_1 = 0.25\,\text{m}$.
        hints:
          - 'במשיכה איטית, בכל רדיוס המתיחות היא הכוח השקול ברכיב הרדיאלי, ולכן היא שווה ל-$mv^2/r$, עם $v$ משימור $L$.'
        solution:
          - { kind: law, text: 'התנע הזוויתי ביחס ל-$O$ נשמר, $mrv = mr_0v_0$, והחוק השני ברכיב הרדיאלי (מסלול כמעט מעגלי): $T = \dfrac{mv^2}{r}$. העבודה: $W = \int\vec T\cdot d\vec r$.' }
          - { kind: manipulation, text: 'מ-$v = v_0r_0/r$: $$T(r) = \frac{mv_0^2r_0^2}{r^3}$$ ציר רדיאלי $\hat r$ החוצה מ-$O$: רכיב הכוח $F_r = -T$, והרדיוס יורד מ-$r_0$ ל-$r_1$. לכן $W = \displaystyle\int_{r_0}^{r_1}F_r\,dr = \int_{r_0}^{r_1}(-T)\,dr$, והפיכת גבולות האינטגרל מחליפה את הסימן: $$W = \int_{r_1}^{r_0}\frac{mv_0^2r_0^2}{r^3}\,dr = \frac{mv_0^2r_0^2}{2}\left(\frac1{r_1^2} - \frac1{r_0^2}\right) = \tfrac12mv_0^2\left(\frac{r_0^2}{r_1^2} - 1\right)$$ ומצד שני $\Delta K = \tfrac12m\left(v_0^2\dfrac{r_0^2}{r_1^2} - v_0^2\right)$, אותו ביטוי.' }
          - { kind: limit, text: 'ב-$r = r_0$: $T = mv_0^2/r_0$, המתיחות של תנועה מעגלית קצובה במהירות $v_0$, כמו בהתחלה. כש-$r_1 \to 0$ העבודה והמתיחות שואפות לאינסוף: אי אפשר למשוך את הדסקית עד החור, וזו הסיבה שהחוט בסוף נקרע.' }
          - { kind: units, text: '$\dfrac{\text{kg}\cdot(\text{m/s})^2\cdot\text{m}^2}{\text{m}^3} = \text{N}$ למתיחות, ו-$\tfrac12mv_0^2$ ב-$\text{J}$ לעבודה.' }
          - { kind: substitution, text: '$W = \tfrac12\cdot0.25\cdot2.0^2\cdot\left(\dfrac{0.25}{0.0625} - 1\right) = 0.50\cdot3 = 1.5\,\text{J}$, ו-$\Delta K = \tfrac12\cdot0.25\cdot(4.0^2 - 2.0^2) = 1.5\,\text{J}$.' }
          - { kind: result, text: '$T(r) = mv_0^2r_0^2/r^3$, והעבודה עד $r_1 = 0.25\,\text{m}$ היא $1.5\,\text{J}$, בדיוק השינוי באנרגיה הקינטית: המתיחות שומרת על $L$ ומשנה את $K$.' }
        rubric:
          - text: מצאתי את $v(r)$ משימור התנע הזוויתי, והצבתי ב-$T = mv^2/r$ כדי לקבל $T \propto 1/r^3$.
          - text: חישבתי את העבודה כאינטגרל של $T(r)$, עם הסימן הנכון, כי גם הכוח וגם ההעתק פונים פנימה.
          - text: הראיתי שהעבודה שווה ל-$\Delta K$ והצבתי מספרים, $1.5\,\text{J}$.
          - text: 'בדקתי ש-$T(r_0) = mv_0^2/r_0$ ושהעבודה שואפת לאינסוף כש-$r_1 \to 0$, ובדקתי יחידות.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-3.7-2, OBJ-3.7-1]
        prompt: >-
          ממשיכים למשוך.

          (1) בטאו את הרדיוס $r_b$ שבו החוט נקרע באמצעות $m$, $v_0$, $r_0$ והמתיחות המרבית $T_{\max}$ שהחוט עומד בה.

          (2) בדקו את הביטוי בגבולות $T_{\max} \to mv_0^2/r_0$ ו-$T_{\max} \to \infty$, ובדקו יחידות.

          (3) חשבו את $r_b$ עבור $T_{\max} = 20\,\text{N}$, ותארו את התנועה של הדסקית אחרי הקריעה.
        hints:
          - 'השוו את $T(r)$ מחלק ג ל-$T_{\max}$. שימו לב: המהירות לא נשארת $v_0$, ולכן $T$ לא $mv_0^2/r$.'
        solution:
          - { kind: law, text: 'מחלק ג: $L$ ביחס ל-$O$ נשמר, ולכן $v = v_0r_0/r$, והמתיחות במסלול כמעט מעגלי היא $T(r) = \dfrac{mv^2}{r} = \dfrac{mv_0^2r_0^2}{r^3}$. החוט נקרע כש-$T(r_b) = T_{\max}$.' }
          - { kind: manipulation, text: '$\dfrac{mv_0^2r_0^2}{r_b^3} = T_{\max}$, ולכן $$r_b = \left(\frac{mv_0^2r_0^2}{T_{\max}}\right)^{1/3} = r_0\left(\frac{T_0}{T_{\max}}\right)^{1/3},\qquad T_0 = \frac{mv_0^2}{r_0}$$ $T_0$ היא המתיחות בהתחלה. מי שמניח שהמהירות נשארת $v_0$ מקבל $T \propto 1/r$ ורדיוס קטן בהרבה, $0.050\,\text{m}$ כאן: המתיחות גדלה מהר יותר, כי המתיחות עושה עבודה והדסקית מאיצה.' }
          - { kind: limit, text: 'כש-$T_{\max} \to T_0$: $r_b \to r_0$. החוט בקושי מחזיק את התנועה ההתחלתית, ונקרע מיד כשמתחילים למשוך. כש-$T_{\max} \to \infty$: $r_b \to 0$, חוט שלא נקרע אפשר למשוך עד החור, אבל המתיחות והמהירות שואפות לאינסוף, כמו בחלק ג.' }
          - { kind: units, text: '$\dfrac{\text{kg}\cdot\text{m}^2/\text{s}^2\cdot\text{m}^2}{\text{N}} = \text{m}^3$, ולכן $r_b$ במטרים.' }
          - { kind: substitution, text: '$r_b^3 = \dfrac{0.25\cdot4.0\cdot0.25}{20} = 0.0125\,\text{m}^3$, ולכן $r_b = 0.232\,\text{m}$. שם $v = 2.0\cdot0.50/0.232 = 4.31\,\text{m/s}$.' }
          - { kind: result, text: '$r_b = \left(mv_0^2r_0^2/T_{\max}\right)^{1/3} = 0.232\,\text{m}$. אחרי הקריעה לא פועל כוח אופקי: הדסקית נעה בקו ישר, משיק למעגל, ב-$4.31\,\text{m/s}$. התנע הזוויתי שלה ביחס ל-$O$ נשאר $0.25\,\text{kg}\cdot\text{m}^2/\text{s}$, והמרחק הקטן ביותר של הקו מ-$O$ הוא $r_b$.' }
        rubric:
          - text: 'השתמשתי ב-$T(r) = mv_0^2r_0^2/r^3$, עם המהירות משימור $L$, ולא ב-$mv_0^2/r$.'
          - text: 'בודדתי $r_b = (mv_0^2r_0^2/T_{\max})^{1/3}$, עם השורש השלישי.'
          - text: 'בדקתי ש-$r_b \to r_0$ כש-$T_{\max} \to mv_0^2/r_0$, ו-$r_b \to 0$ כש-$T_{\max} \to \infty$.'
          - text: 'חישבתי $r_b \approx 0.232\,\text{m}$, ותיארתי תנועה בקו ישר משיק אחרי הקריעה.'

  # ------------------------------------------------------------ 3: a person on a raft
  - id: Q-3-bagrut-3
    type: bagrut
    title: אדם על רפסודה
    prompt: >-
      אדם בעל מסה $m = 70\,\text{kg}$ עומד בקצה של רפסודה בעלת מסה $M = 280\,\text{kg}$ ואורך $L = 5.0\,\text{m}$. הרפסודה
      עומדת במים שקטים, והזניחו כל כוח אופקי של המים עליה.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-3.4-2]
        prompt: האדם הולך לאורך הרפסודה אל הקצה השני ונעצר שם. כמה זזה הרפסודה ביחס למים?
        answer: 1
        unit: m
        correctFeedback: >-
          נכון. ציר $x$ בכיוון ההליכה. אין כוח חיצוני אופקי, ולכן מרכז המסה לא זז: $m\Delta x_{\text{p}} + M\Delta x_{\text{r}} = 0$, עם
          $\Delta x_{\text{p}} = L + \Delta x_{\text{r}}$. מכאן $\Delta x_{\text{r}} = -\dfrac{mL}{m + M} = -\dfrac{70\cdot5.0}{350} = -1.0\,\text{m}$,
          אחורה. האדם זז $4.0\,\text{m}$ ביחס למים.
        wrongFeedback: 'מרכז המסה של אדם + רפסודה לא זז. כתבו את ההעתק של האדם ביחס למים כסכום של ההעתק שלו על הרפסודה ושל ההעתק של הרפסודה.'
        commonWrong:
          - value: 1.25
            feedback: 'חישבתם $mL/M$, כאילו האדם זז $5.0\,\text{m}$ ביחס למים. $5.0\,\text{m}$ הם ביחס לרפסודה, שזזה אחורה בזמן ההליכה.'
            misconception: MC-3-relative-as-ground-displacement
          - value: 4
            feedback: 'זה ההעתק של האדם ביחס למים. הרפסודה כבדה ממנו פי 4, ולכן זזה פי 4 פחות.'
          - value: 5
            feedback: 'הרפסודה לא זזה את כל האורך שלה: ההעתקים ביחס למים הפוכים ביחס למסות.'
        hints:
          - 'השתמשו בכך ש-$m\Delta x_{\text{p}} + M\Delta x_{\text{r}} = 0$.'

      - label: ב
        type: mc
        points: 5
        level: mid
        qualitative: true
        objectives: [OBJ-3.4-2, OBJ-3.5-2]
        prompt: מה נכון לגבי התנועה של הרפסודה ושל מרכז המסה בזמן ההליכה של חלק א, וברגע שהאדם נעצר?
        choices:
          - text: מרכז המסה עומד כל הזמן. הרפסודה נעה אחורה רק בזמן שהאדם נע ביחס אליה, ונעצרת יחד איתו.
            correct: true
            feedback: >-
              נכון. התנע הכולל אפס כל הזמן: $mv_{\text{p}} + Mv_{\text{r}} = 0$. כשהאדם עומד ביחס למים, גם הרפסודה עומדת.
              הוא מאיץ אותה אחורה כשהוא מתחיל ללכת, ועוצר אותה כשהוא נעצר, דרך החיכוך בין כפות רגליו לרפסודה.
          - text: מרכז המסה נע קדימה עם האדם, כי האדם הוא שמפעיל כוח.
            feedback: 'האדם דוחף את הרפסודה, והרפסודה דוחפת אותו: זוג כוחות פנימיים. הם לא יכולים להזיז את מרכז המסה של שניהם.'
            misconception: MC-3-internal-forces-move-cm
          - text: הרפסודה ממשיכה לנוע אחורה גם אחרי שהאדם נעצר, כי אין חיכוך עם המים.
            feedback: >-
              אם הרפסודה הייתה ממשיכה לנוע כשהאדם עומד, היה לשניהם יחד תנע שונה מאפס, אף שהם התחילו ממנוחה ואין כוח
              חיצוני. כשהאדם נעצר, הוא עוצר גם את הרפסודה.
            misconception: MC-3-momentum-always-conserved
        hints:
          - 'מה התנע הכולל בהתחלה, ואיזה כוח חיצוני יכול לשנות אותו?'

      - label: ג
        type: open
        points: 6
        level: mid
        objectives: [OBJ-3.5-2]
        prompt: >-
          עכשיו האדם עומד שוב במנוחה על הרפסודה העומדת, וקופץ ממנה אופקית למים. הוא עוזב אותה במהירות אופקית $u$
          **ביחס לרפסודה**.

          (1) בטאו את מהירות הרפסודה $v_{\text{r}}$ ואת מהירות האדם $v_{\text{p}}$ ביחס למים, מיד אחרי הקפיצה,
          באמצעות $m$, $M$ ו-$u$.

          (2) בדקו את הביטויים בגבולות $M \to \infty$ ו-$M \to 0$, ובדקו יחידות.

          (3) חשבו את $v_{\text{r}}$ ואת $v_{\text{p}}$ עבור $u = 4.0\,\text{m/s}$.
        hints:
          - 'כתבו שתי משוואות: שימור התנע, עם מהירויות ביחס למים, והקשר בין המהירות היחסית למהירויות ביחס למים.'
          - 'האדם לא עוזב ב-$u$ ביחס למים: הרפסודה נרתעת לאחור בזמן הקפיצה.'
        solution:
          - { kind: law, text: 'אין כוח חיצוני אופקי, והכול מתחיל במנוחה, ולכן רכיב ה-$x$ של התנע נשמר ונשאר אפס (ציר $x$ בכיוון הקפיצה): $mv_{\text{p}} + Mv_{\text{r}} = 0$. המהירות היחסית: $v_{\text{p}} - v_{\text{r}} = u$.' }
          - { kind: manipulation, text: 'מציבים $v_{\text{p}} = u + v_{\text{r}}$: $m(u + v_{\text{r}}) + Mv_{\text{r}} = 0$, ולכן $$v_{\text{r}} = -\frac{mu}{m + M},\qquad v_{\text{p}} = \frac{Mu}{m + M}$$' }
          - { kind: limit, text: 'כש-$M \to \infty$ (רציף): $v_{\text{r}} \to 0$ ו-$v_{\text{p}} \to u$, הקפיצה הרגילה. כש-$M \to 0$: $v_{\text{p}} \to 0$ ו-$v_{\text{r}} \to -u$: הרגליים רק דוחפות את הרפסודה אחורה, והאדם לא זז. מי שמחשב $mu/M$, כאילו $u$ ביחס למים, מקבל ב-$M \to 0$ מהירות אינסופית.' }
          - { kind: units, text: 'המנות $m/(m + M)$ ו-$M/(m + M)$ חסרות ממדים, ולכן שתי המהירויות ביחידות של $u$.' }
          - { kind: substitution, text: '$v_{\text{r}} = -\dfrac{70\cdot4.0}{350} = -0.80\,\text{m/s}$ ו-$v_{\text{p}} = \dfrac{280\cdot4.0}{350} = 3.2\,\text{m/s}$. בדיקה: $3.2 - (-0.80) = 4.0\,\text{m/s}$, ו-$70\cdot3.2 = 224 = 280\cdot0.80$.' }
          - { kind: result, text: '$v_{\text{r}} = -\dfrac{mu}{m + M} = -0.80\,\text{m/s}$ (אחורה), ו-$v_{\text{p}} = \dfrac{Mu}{m + M} = 3.2\,\text{m/s}$.' }
        rubric:
          - text: 'כתבתי את שימור התנע עם מהירויות ביחס למים, ואת $v_{\text{p}} - v_{\text{r}} = u$.'
          - text: 'קיבלתי $v_{\text{r}} = -mu/(m + M)$ ו-$v_{\text{p}} = Mu/(m + M)$.'
          - text: 'בדקתי את הגבולות $M \to \infty$ ו-$M \to 0$ ואת היחידות.'
          - text: 'חישבתי $v_{\text{r}} = -0.80\,\text{m/s}$ ו-$v_{\text{p}} = 3.2\,\text{m/s}$.'

      - label: ד
        type: open
        points: 10
        level: bagrut
        standalone: false
        objectives: [OBJ-3.8-2, OBJ-3.3-1]
        prompt: >-
          כמה אנרגיה קינטית הרגליים של האדם צריכות ליצור בקפיצה של חלק ג?

          (1) מה מהירות מרכז המסה של אדם + רפסודה אחרי הקפיצה? הסבירו בעזרת משפט קניג למה כל האנרגיה הקינטית שנוצרה
          היא אנרגיה יחסית למרכז המסה.

          (2) בעזרת המהירויות של חלק ג, הראו שהאנרגיה הקינטית הכוללת היא $K = \tfrac12\mu u^2$, כאשר
          $\mu = \dfrac{mM}{m + M}$ (המסה המצומצמת של שיעור 3.8).

          (3) בדקו את הביטוי בגבולות $M \to \infty$ ו-$M \to 0$, ובדקו יחידות.

          (4) חשבו את $K$ עבור $u = 4.0\,\text{m/s}$, והשוו לאנרגיה של קפיצה באותה מהירות $u$ מרציף קבוע.
        hints:
          - 'מה מהירות מרכז המסה? מה אומר משפט קניג על האנרגיה הקינטית במקרה כזה?'
        solution:
          - { kind: law, text: 'משפט קניג: $K = \tfrac12(m + M)V^2 + K_{\text{rel}}$. התנע הכולל אפס, ולכן $V = 0$, וכל האנרגיה הקינטית שהרגליים יוצרות היא אנרגיה יחסית למרכז המסה.' }
          - { kind: manipulation, text: 'מחלק ג: $v_{\text{p}} = \dfrac{Mu}{m + M}$ ו-$v_{\text{r}} = -\dfrac{mu}{m + M}$. $$K = \tfrac12mv_{\text{p}}^2 + \tfrac12Mv_{\text{r}}^2 = \frac{u^2}{2(m + M)^2}\left(mM^2 + Mm^2\right) = \frac12\cdot\frac{mM}{m + M}\,u^2 = \tfrac12\mu u^2$$' }
          - { kind: limit, text: 'כש-$M \to \infty$ (רציף): $\mu \to m$ ו-$K \to \tfrac12mu^2$, הקפיצה הרגילה. כש-$M \to 0$ (רפסודה קלה כמו נוצה): $\mu \to 0$ ו-$K \to 0$: הרגליים רק דוחפות את הרפסודה אחורה, והאדם לא זז. תמיד $\mu < m$, ולכן הקפיצה מרפסודה זולה יותר באנרגיה, אבל האדם עוזב לאט יותר ביחס למים.' }
          - { kind: units, text: '$\mu = mM/(m + M)$ ביחידות $\text{kg}$, ו-$\tfrac12\mu u^2$ ב-$\text{J}$.' }
          - { kind: substitution, text: '$\mu = \dfrac{70\cdot280}{350} = 56\,\text{kg}$, $K = \tfrac12\cdot56\cdot4.0^2 = 448\,\text{J}$. בדיקה: $\tfrac12\cdot70\cdot3.2^2 + \tfrac12\cdot280\cdot0.80^2 = 358.4 + 89.6 = 448\,\text{J}$. מרציף: $\tfrac12\cdot70\cdot4.0^2 = 560\,\text{J}$.' }
          - { kind: result, text: '$K = \tfrac12\mu u^2 = 448\,\text{J}$, פחות מ-$560\,\text{J}$ של קפיצה מרציף באותה מהירות יחסית. הביטוי עובר את שני הגבולות.' }
        rubric:
          - text: נימקתי שמהירות מרכז המסה אפס, ולכן לפי משפט קניג כל האנרגיה הקינטית יחסית למרכז המסה.
          - text: כתבתי את מהירויות האדם והרפסודה ביחס למים בעזרת $u$, והגעתי ל-$K = \tfrac12\mu u^2$.
          - text: בדקתי את הגבולות $M \to \infty$ ו-$M \to 0$ ואת היחידות.
          - text: הצבתי מספרים, $448\,\text{J}$, והשוויתי ל-$560\,\text{J}$ מרציף.

  # ------------------------------------------------------------ 4: a puck in a "hat" potential
  - id: Q-3-bagrut-4
    type: bagrut
    title: דסקית בפוטנציאל בצורת כובע
    prompt: >-
      דסקית בעלת מסה $m = 0.10\,\text{kg}$ מחליקה בלי חיכוך על שולחן אופקי. מגנטים מתחת לשולחן נותנים לה אנרגיה
      פוטנציאלית שתלויה רק במרחק $r$ שלה מנקודה $O$ על השולחן:
      $$U(r) = U_0\left[\left(\frac ra\right)^4 - 2\left(\frac ra\right)^2\right],\qquad U_0 = 2.0\,\text{J},\quad a = 0.50\,\text{m}$$
      לגרף של $U$ על השולחן יש צורת כובע: גבעה נמוכה ב-$O$, שבה $U = 0$, ותעלה עגולה סביבה, שבה $U = -U_0$ ב-$r = a$.
      הראשית של מערכת הצירים $x,\,y$ על השולחן היא $O$.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-3.2-2, OBJ-3.7-2]
        prompt: לאן פונה הכוח על הדסקית בנקודה כלשהי על השולחן?
        choices:
          - text: לאורך הקו שבין הדסקית ל-$O$; אל $O$ כש-$r > a$, וממנה כש-$r < a$.
            correct: true
            feedback: >-
              נכון. $U$ תלויה רק ב-$r$, ולכן קווי הגובה הם מעגלים סביב $O$, ו-$\vec F = -\nabla U = -\dfrac{dU}{dr}\hat r$
              רדיאלי. מחוץ לתעלה $U$ עולה עם $r$ והכוח פונה פנימה; בתוכה $U$ יורדת עם $r$ והכוח פונה החוצה. זה כוח
              מרכזי ביחס ל-$O$.
          - text: לאורך המעגל שעליו נמצאת הדסקית, משיק לו.
            feedback: 'המעגלים סביב $O$ הם קווי הגובה של $U$. לאורך קו גובה $U$ לא משתנה, ולכן לכוח אין רכיב לאורכו: הוא ניצב לו.'
            misconception: MC-3-force-along-contour
          - text: תמיד אל $O$, כי שם הגבעה.
            feedback: 'הכוח פונה לכיוון שבו $U$ **יורדת**. בתוך התעלה, $r < a$, $U$ יורדת כשמתרחקים מ-$O$, והכוח דוחף החוצה, מהגבעה אל התעלה.'
            misconception: MC-3-force-along-gradient
          - text: לכיוון התנועה של הדסקית.
            feedback: 'הכוח נקבע לפי המקום בלבד, $\vec F = -\nabla U(\vec r)$, ולא לפי המהירות.'

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-3.2-2]
        prompt: מהו רכיב ה-$x$ של הכוח על הדסקית כשהיא בנקודה $(0.45,\,0.60)\,\text{m}$?
        answer: -18
        unit: N
        correctFeedback: >-
          נכון. $r = 0.75\,\text{m}$, ו-$\dfrac{dU}{dr} = U_0\left(\dfrac{4r^3}{a^4} - \dfrac{4r}{a^2}\right) = 2.0\cdot(27 - 12) = 30\,\text{N}$.
          הכוח $\vec F = -\dfrac{dU}{dr}\cdot\dfrac{\vec r}{r}$, ולכן $F_x = -30\cdot\dfrac{0.45}{0.75} = -18\,\text{N}$ (ו-$F_y = -24\,\text{N}$):
          פנימה, אל $O$, כי $r > a$.
        wrongFeedback: 'חשבו $dU/dr$ ב-$r = 0.75\,\text{m}$. הכוח רדיאלי, ורכיב ה-$x$ שלו הוא $F_x = -\dfrac{dU}{dr}\cdot\dfrac xr$.'
        commonWrong:
          - value: 18
            feedback: 'הסימן הפוך. $\vec F = -\nabla U$, ומחוץ לתעלה $U$ עולה עם $r$: הכוח פונה פנימה, אל $O$.'
            misconception: MC-3-force-along-gradient
          - value: -30
            feedback: 'זה גודל הכוח כולו. רכיב ה-$x$ הוא החלק שלו לאורך $x$: כפלו ב-$x/r = 0.6$.'
          - value: -24
            feedback: 'זה רכיב ה-$y$, $F_y = -30\cdot0.60/0.75$. לרכיב ה-$x$ כופלים ב-$x/r$.'
        hints:
          - '$\dfrac{\partial r}{\partial x} = \dfrac xr$, ולכן $\dfrac{\partial U}{\partial x} = \dfrac{dU}{dr}\cdot\dfrac xr$. ביחד עם $y$, זה $\vec F = -\dfrac{dU}{dr}\,\hat r$ (שיעור 3.2).'

      - label: ג
        type: open
        points: 6
        level: mid
        objectives: [OBJ-3.3-2, OBJ-3.3-1]
        prompt: >-
          הדסקית נחה בתחתית התעלה, בנקודה $(a,\,0)$, ומקבלת מהירות לאורך ציר $x$, אל $O$.

          (1) בטאו את המהירות המזערית $v_{\min}$ שבה היא עוברת מעל הגבעה ומגיעה לצד השני של התעלה, באמצעות $U_0$
          ו-$m$. מה קורה במהירות קטנה יותר?

          (2) בדקו את הביטוי מול מקרה מוכר: מחסום של כובד, גבעה בגובה $h$, שבה $U_0 = mgh$. בדקו יחידות.

          (3) חשבו את $v_{\min}$.
        hints:
          - 'מה הערכים של $U$ ב-$r = a$ וב-$r = 0$? המחסום הוא ההפרש ביניהם, לא $U$ בגבעה לבדו.'
          - 'אל תשכחו את ה-$\tfrac12$ באנרגיה הקינטית.'
        solution:
          - { kind: law, text: 'הכוח משמר ואין חיכוך, ולכן $\tfrac12mv^2 + U$ נשמרת. המהירות ההתחלתית לאורך ציר $x$, דרך $O$: התנע הזוויתי ביחס ל-$O$ אפס, הכוח רדיאלי, והדסקית נשארת על ציר $x$. זו בעיה בממד אחד עם $U(|x|)$.' }
          - { kind: manipulation, text: 'המחסום בין התחתית לגבעה: $U(0) - U(a) = 0 - (-U_0) = U_0$. כדי להגיע ל-$O$ עם מהירות חיובית צריך $\tfrac12mv^2 > U_0$, כלומר $$v > v_{\min} = \sqrt{\frac{2U_0}{m}}$$ במהירות קטנה יותר יש נקודת מפנה $x_t$ בין $0$ ל-$a$, שבה $U(x_t) = -U_0 + \tfrac12mv^2$, והדסקית חוזרת אל התעלה.' }
          - { kind: limit, text: 'מחסום של כובד בגובה $h$: $U_0 = mgh$ נותן $v_{\min} = \sqrt{2gh}$, המהירות המוכרת שגוף צריך כדי לעלות לגובה $h$, בלי תלות במסה. כאן המחסום נתון באנרגיה, $U_0$, ולכן גוף כבד יותר צריך מהירות קטנה יותר. ו-$v_{\min}$ לא תלויה ב-$a$: כובע רחב יותר באותו עומק נותן אותו סף.' }
          - { kind: units, text: '$\sqrt{\text{J}/\text{kg}} = \sqrt{\text{m}^2/\text{s}^2} = \text{m/s}$.' }
          - { kind: substitution, text: '$v_{\min} = \sqrt{\dfrac{2\cdot2.0}{0.10}} = \sqrt{40} = 6.32\,\text{m/s}$.' }
          - { kind: result, text: '$v_{\min} = \sqrt{2U_0/m} = 6.32\,\text{m/s}$. במהירות קטנה יותר הדסקית נעצרת לפני $O$ וחוזרת.' }
        rubric:
          - text: 'מצאתי את גובה המחסום, $U(0) - U(a) = U_0$, ולא $2U_0$.'
          - text: 'כתבתי שימור אנרגיה וקיבלתי $v_{\min} = \sqrt{2U_0/m}$.'
          - text: 'בדקתי שעם $U_0 = mgh$ מתקבל $\sqrt{2gh}$, ובדקתי יחידות.'
          - text: 'חישבתי $v_{\min} \approx 6.32\,\text{m/s}$.'

      - label: ד
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-3.7-2, OBJ-3.2-2]
        prompt: >-
          (1) הסבירו למה התנע הזוויתי של הדסקית ביחס ל-$O$ נשמר בכל תנועה על השולחן.

          (2) הדסקית נעה במעגל ברדיוס $r$ סביב $O$. מצאו את מהירותה $v(r)$, ובאילו רדיוסים מסלול מעגלי כזה אפשרי. בדקו
          את הביטוי בגבול $r \to a$ וביחידות, ומצאו את המהירות ב-$r = 0.75\,\text{m}$.
        hints:
          - 'בתנועה מעגלית, הכוח הרדיאלי פנימה הוא $mv^2/r$.'
        solution:
          - { kind: law, text: '$\vec F = -\nabla U = -\dfrac{dU}{dr}\hat r$, כוח מרכזי ביחס ל-$O$, ולכן $\vec\tau = \vec r\times\vec F = 0$ ו-$\vec L$ נשמר (והתנועה במישור השולחן). לתנועה מעגלית, החוק השני ברכיב הרדיאלי: $\dfrac{mv^2}{r} = \dfrac{dU}{dr}$, הכוח פנימה.' }
          - { kind: manipulation, text: '$\dfrac{dU}{dr} = \dfrac{4U_0}{a^2}\,r\left(\dfrac{r^2}{a^2} - 1\right)$, ולכן $$v(r) = \sqrt{\frac{r}{m}\cdot\frac{dU}{dr}} = \frac{2r}{a}\sqrt{\frac{U_0}{m}\left(\frac{r^2}{a^2} - 1\right)}$$ ביטוי ממשי וחיובי רק כש-$r > a$ (ב-$r = a$, $v = 0$: מנוחה בתחתית, לא מסלול): בתוך התעלה הכוח פונה החוצה, ואין רכיב רדיאלי פנימה של הכוח השקול שיספק את $mv^2/r$ של מסלול מעגלי.' }
          - { kind: limit, text: 'כש-$r \to a$: $v \to 0$. בתחתית התעלה הכוח אפס, והדסקית יכולה רק לנוח שם. כש-$r \gg a$: $v \approx \dfrac{2r^2}{a^2}\sqrt{U_0/m}$, גדלה מהר, כי הכוח גדל כמו $r^3$.' }
          - { kind: units, text: '$\sqrt{U_0/m}$ ביחידות $\sqrt{\text{J}/\text{kg}} = \text{m/s}$, ו-$\dfrac{2r}{a}$ ו-$\dfrac{r^2}{a^2} - 1$ חסרי ממדים.' }
          - { kind: substitution, text: 'ב-$r = 0.75\,\text{m}$: $\dfrac{r}{a} = 1.5$, ולכן $v = 2\cdot1.5\cdot\sqrt{\dfrac{2.0}{0.10}\cdot(2.25 - 1)} = 3\cdot\sqrt{25} = 15\,\text{m/s}$. בדיקה מחלק ב: $\dfrac{dU}{dr} = 30\,\text{N}$, ו-$\dfrac{mv^2}{r} = \dfrac{0.10\cdot225}{0.75} = 30\,\text{N}$.' }
          - { kind: result, text: 'הכוח מרכזי, ולכן $L$ נשמר. מסלול מעגלי אפשרי רק ב-$r > a$, במהירות $v = \dfrac{2r}{a}\sqrt{\dfrac{U_0}{m}\left(\dfrac{r^2}{a^2} - 1\right)}$, ו-$15\,\text{m/s}$ ב-$r = 0.75\,\text{m}$.' }
        rubric:
          - text: נימקתי ש-$U$ תלויה רק ב-$r$, ולכן הכוח רדיאלי, המומנט ביחס ל-$O$ אפס ו-$L$ נשמר.
          - text: השוויתי $mv^2/r$ לכוח הרדיאלי פנימה, $dU/dr$, והגעתי ל-$v(r)$.
          - text: הסברתי שמסלול מעגלי אפשרי רק ב-$r > a$, כי בתוך התעלה הכוח פונה החוצה.
          - text: בדקתי את הגבול $r \to a$ ואת היחידות, והצבתי ב-$r = 0.75\,\text{m}$ וקיבלתי $15\,\text{m/s}$.

  # ------------------------------------------------------------ 5: a block on a quarter-circle track cut in a free cart (joins 1.5, 2.x and 3.x)
  - id: Q-3-bagrut-5
    type: bagrut
    title: גוש במסילה של עגלה חופשית
    prompt: >-
      בתוך עגלה בעלת מסה $M$ חצובה מסילה חלקה בצורת רבע מעגל ברדיוס $R$. הקצה העליון של המסילה נמצא בגובה $R$ מעל
      הנקודה התחתונה שלה, ושם המסילה אנכית; בנקודה התחתונה היא אופקית. העגלה עומדת על רצפה אופקית חלקה. גוש קטן בעל
      מסה $m$ משוחרר ממנוחה בקצה העליון של המסילה, כשגם העגלה במנוחה. ציר $x$ אופקי, בכיוון שבו הגוש נע כשהוא מגיע
      לנקודה התחתונה, וציר $y$ כלפי מעלה.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-3.5-2, OBJ-3.3-1]
        prompt: מה נשמר במערכת גוש + עגלה בזמן שהגוש מחליק במסילה?
        choices:
          - text: 'רכיב ה-$x$ של התנע, והאנרגיה המכנית של המערכת; רכיב ה-$y$ של התנע לא נשמר.'
            correct: true
            feedback: >-
              נכון. הכוחות החיצוניים, הכובד והנורמלי של הרצפה, אנכיים, ולכן $P_x$ נשמר. אבל הם לא מאוזנים: הגוש יורד
              ואחר כך נעצר אנכית, ולכן $P_y$ משתנה. המסילה והרצפה חלקות, והנורמלי בין הגוש למסילה עושה על הגוש ועל
              העגלה עבודות שסכומן אפס, ולכן האנרגיה המכנית של שניהם יחד נשמרת.
          - text: התנע כולו, והאנרגיה המכנית.

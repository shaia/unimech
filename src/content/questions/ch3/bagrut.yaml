        objectives: [OBJ-3.7-2, OBJ-3.2-2]
        prompt: >-
          (1) הסבירו למה התנע הזוויתי של הדסקית ביחס ל-$O$ נשמר בכל תנועה על השולחן.

          (2) הדסקית נעה במעגל ברדיוס $r$ סביב $O$. מצאו את מהירותה $v(r)$, ובאילו רדיוסים מסלול מעגלי כזה אפשרי. בדקו
          את הביטוי בגבול $r \to a$ וביחידות, ומצאו את המהירות ב-$r = 0.75\,\text{m}$.
        hints:
          - 'בתנועה מעגלית, הכוח הרדיאלי פנימה הוא $mv^2/r$.'
        solution:
          - { kind: law, text: '$\vec F = -\nabla U = -\dfrac{dU}{dr}\hat r$, כוח מרכזי ביחס ל-$O$, ולכן $\vec\tau = \vec r\times\vec F = 0$ ו-$\vec L$ נשמר (והתנועה במישור השולחן). לתנועה מעגלית, החוק השני ברכיב הרדיאלי: $\dfrac{mv^2}{r} = \dfrac{dU}{dr}$, הכוח פנימה.' }
          - { kind: manipulation, text: '$\dfrac{dU}{dr} = \dfrac{4U_0}{a^2}\,r\left(\dfrac{r^2}{a^2} - 1\right)$, ולכן $$v(r) = \sqrt{\frac{r}{m}\cdot\frac{dU}{dr}} = \frac{2r}{a}\sqrt{\frac{U_0}{m}\left(\frac{r^2}{a^2} - 1\right)}$$ ביטוי שקיים רק כש-$r \ge a$: בתוך התעלה הכוח פונה החוצה, ואין כוח צנטריפטלי שיחזיק מסלול מעגלי.' }
          - { kind: limit, text: 'כש-$r \to a$: $v \to 0$. בתחתית התעלה הכוח אפס, והדסקית יכולה רק לנוח שם. כש-$r \gg a$: $v \approx \dfrac{2r^2}{a^2}\sqrt{U_0/m}$, גדלה מהר, כי הכוח גדל כמו $r^3$.' }
          - { kind: units, text: '$\sqrt{U_0/m}$ ביחידות $\sqrt{\text{J}/\text{kg}} = \text{m/s}$, ו-$\dfrac{2r}{a}$ ו-$\dfrac{r^2}{a^2} - 1$ חסרי ממדים.' }
          - { kind: substitution, text: 'ב-$r = 0.75\,\text{m}$: $\dfrac{r}{a} = 1.5$, ולכן $v = 2\cdot1.5\cdot\sqrt{\dfrac{2.0}{0.10}\cdot(2.25 - 1)} = 3\cdot\sqrt{25} = 15\,\text{m/s}$. בדיקה מחלק ב: $\dfrac{dU}{dr} = 30\,\text{N}$, ו-$\dfrac{mv^2}{r} = \dfrac{0.10\cdot225}{0.75} = 30\,\text{N}$.' }
          - { kind: result, text: 'הכוח מרכזי, ולכן $L$ נשמר. מסלול מעגלי אפשרי רק ב-$r > a$, במהירות $v = \dfrac{2r}{a}\sqrt{\dfrac{U_0}{m}\left(\dfrac{r^2}{a^2} - 1\right)}$, ו-$15\,\text{m/s}$ ב-$r = 0.75\,\text{m}$.' }
        rubric:
          - text: נימקתי ש-$U$ תלויה רק ב-$r$, ולכן הכוח רדיאלי, המומנט ביחס ל-$O$ אפס ו-$L$ נשמר.
          - text: השוויתי $mv^2/r$ לכוח הרדיאלי פנימה, $dU/dr$, והגעתי ל-$v(r)$.
          - text: הסברתי שמסלול מעגלי אפשרי רק ב-$r > a$, כי בתוך התעלה הכוח פונה החוצה.
          - text: בדקתי את הגבול $r \to a$ ואת היחידות, והצבתי ב-$r = 0.75\,\text{m}$ וקיבלתי $15\,\text{m/s}$.

            feedback: 'זה ההעתק של האדם ביחס למים. הרפסודה כבדה ממנו פי 4, ולכן זזה פי 4 פחות.'
          - value: 5
            feedback: 'הרפסודה לא זזה את כל האורך שלה: ההעתקים ביחס למים הפוכים ביחס למסות.'

chapter: 3
questions:
  # ------------------------------------------------------------ 1: where the fuel's energy goes
  - id: Q-3-bagrut-1
    type: bagrut
    title: רקטה בחלל - לאן הולכת האנרגיה של הדלק
    prompt: >-
      רקטה נמצאת במנוחה בחלל, רחוק מכל גוף. מסתה ההתחלתית $m_0 = 1200\,\text{kg}$, ומתוכה $900\,\text{kg}$ דלק.
      מהירות הפליטה ביחס לרקטה היא $u = 2000\,\text{m/s}$. המנוע אידאלי: כל האנרגיה הכימית של הדלק הופכת לאנרגיה
      קינטית, ובמערכת של הרקטה כל קילוגרם של גז יוצא עם אנרגיה קינטית $\tfrac12u^2$. לכן האנרגיה שהדלק משחרר היא
      $E_f = \tfrac12u^2\Delta m$, כאשר $\Delta m$ מסת הדלק. כל המהירויות בשאלה נמדדות במערכת האינרציאלית שבה הרקטה
      התחילה ממנוחה.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-3.6-1]
        prompt: מה מהירות הרקטה אחרי שכל הדלק נשרף?
        answer: 2773
        unit: m/s
        correctFeedback: 'נכון. $\Delta v = u\ln\dfrac{m_0}{m} = 2000\cdot\ln\dfrac{1200}{300} = 2000\ln4 = 2773\,\text{m/s}$.'
        wrongFeedback: 'בצעו אינטגרל על משוואת הרקטה, $M\,dv = -u\,dM$, מ-$m_0$ עד המסה בלי הדלק.'
        commonWrong:
          - value: 1500
            feedback: 'חישבתם $u\,\Delta m/m_0$, כאילו כל הדלק נפלט בבת אחת מרקטה שמסתה $m_0$. הרקטה נעשית קלה יותר בזמן השריפה, ולכן לוגריתם.'
          - value: 6000
            feedback: 'חישבתם $u\,\Delta m/m$, עם המסה הסופית. בתחילת השריפה הרקטה כבדה פי 4, וכל קילוגרם דלק מאיץ אותה פחות.'
          - value: 575
            feedback: 'בתוך הלוגריתם יש $m_0/m$, היחס בין המסה ההתחלתית למסה **הסופית**, $300\,\text{kg}$, ולא למסת הדלק.'
        hints:
          - 'מה המסה של הרקטה כשהדלק נגמר?'

      - label: ב
        type: open
        points: 7
        level: mid
        standalone: false
        objectives: [OBJ-3.3-1, OBJ-3.6-1]
        prompt: >-
          (1) בטאו את החלק $\eta$ של האנרגיה $E_f$ שנמצא בסוף השריפה באנרגיה הקינטית של הרקטה עצמה (בלי הגזים),
          באמצעות $r = m_0/m$ בלבד, כאשר $m$ המסה הסופית של הרקטה.

          (2) בדקו את הביטוי בגבולות $r \to 1$ ו-$r \to \infty$, ובדקו יחידות.

          (3) חשבו את $\eta$ לרקטה שבשאלה.
        hints:
          - 'האנרגיה הקינטית של הרקטה בסוף היא $\tfrac12m\,\Delta v^2$ עם המסה **הסופית** $m$, ולא $m_0$: עם $m_0$ יוצא חלק גדול מ-1.'
          - '$m_0 - m$ היא מסת הדלק. חלקו מונה ומכנה ב-$m$.'
        solution:
          - { kind: law, text: 'משוואת הרקטה (חלק א): $\Delta v = u\ln\dfrac{m_0}{m} = u\ln r$. האנרגיה הקינטית של הרקטה בסוף: $K_{\text{r}} = \tfrac12m\,\Delta v^2$. האנרגיה של הדלק: $E_f = \tfrac12u^2(m_0 - m)$.' }
          - { kind: manipulation, text: '$$\eta = \frac{K_{\text{r}}}{E_f} = \frac{\tfrac12mu^2(\ln r)^2}{\tfrac12u^2(m_0 - m)} = \frac{(\ln r)^2}{m_0/m - 1} = \frac{(\ln r)^2}{r - 1}$$ $u$ מצטמצם: החלק תלוי רק ביחס המסות.' }
          - { kind: limit, text: 'כש-$r \to 1$ (מעט דלק): $\ln r \approx r - 1$, ו-$\eta \approx r - 1 \to 0$. הרקטה עוד כמעט עומדת, והגז יוצא אחורה ב-$u$ ולוקח כמעט את כל האנרגיה. כש-$r \to \infty$: $(\ln r)^2$ גדל לאט מ-$r$, ו-$\eta \to 0$: כמעט כל המסה היא דלק, והרקטה שנשארת בסוף זעירה, ולכן האנרגיה הקינטית שלה קטנה לעומת האנרגיה של הדלק. ביניהם יש מקסימום (חלק ג). ותמיד $\eta < 1$, כמו ששימור אנרגיה דורש.' }
          - { kind: units, text: '$K_{\text{r}}$ ו-$E_f$ שניהם ב-$\text{J}$, ו-$\eta$ חסר ממדים, כמו שצריך לחלק מאנרגיה.' }
          - { kind: substitution, text: '$r = 1200/300 = 4$: $\eta = (\ln4)^2/3 = 1.922/3 = 0.641$. בדיקה: $K_{\text{r}} = \tfrac12\cdot300\cdot2773^2 = 1.15\cdot10^9\,\text{J}$ ו-$E_f = \tfrac12\cdot2000^2\cdot900 = 1.80\cdot10^9\,\text{J}$.' }
          - { kind: result, text: '$\eta = \dfrac{(\ln r)^2}{r - 1} = 0.641$: לרקטה מגיעים $64.1\%$ מהאנרגיה של הדלק, והיתר, $35.9\%$, נשאר בגזים (חלק ד).' }
        rubric:
          - text: 'כתבתי $K_{\text{r}} = \tfrac12m(u\ln r)^2$ עם המסה הסופית, וחילקתי ב-$E_f = \tfrac12u^2(m_0 - m)$.'
          - text: 'הגעתי ל-$\eta = (\ln r)^2/(r - 1)$, בלי $u$.'
          - text: 'בדקתי ש-$\eta \to 0$ גם כש-$r \to 1$ וגם כש-$r \to \infty$, והסברתי למה.'
          - text: 'חישבתי $\eta \approx 0.641$ לרקטה שבשאלה.'

      - label: ג
        type: numeric
        points: 5
        level: bagrut
        standalone: false
        objectives: [OBJ-3.3-1, OBJ-3.6-1]
        prompt: >-
          מהנדסת רוצה שהחלק $\eta$ של חלק ב יהיה גדול ככל האפשר. איזה אחוז מהמסה ההתחלתית של הרקטה צריך להיות דלק כדי ש-$\eta$
          יהיה מרבי? (המשוואה שתתקבל נפתרת במספרים.)
        answer: 79.7
        unit: '%'
        correctFeedback: >-
          נכון. $\dfrac{d\eta}{dr} = \dfrac{(2\ln r/r)(r - 1) - (\ln r)^2}{(r - 1)^2} = 0$ נותן $2\left(1 - \dfrac1r\right) = \ln r$.
          הפתרון המספרי $r \approx 4.92$, ושם $\eta \approx 0.648$. חלק הדלק הוא $1 - \dfrac1r = 0.797$, כלומר $79.7\%$.
          הרקטה שלנו, עם $75\%$ דלק, קרובה מאוד לאופטימום. **בדיקה:** ב-$r = 4.92$, $2(1 - 0.203) = 1.59 = \ln4.92$.
        wrongFeedback: 'גזרו את $\eta(r)$, השוו לאפס, וצמצמו ב-$\ln r$ (שאינו אפס כש-$r > 1$). פתרו את $2(1 - 1/r) = \ln r$ בניסוי וטעייה, ואז חשבו $1 - 1/r$.'
        commonWrong:
          - value: 86.5
            feedback: >-
              זה מתאים ל-$r = e^2$, שבו מרבית האנרגיה הקינטית של הרקטה **לכל קילוגרם התחלתי**, $(\ln r)^2/r$. כאן מחלקים
              באנרגיה של הדלק, שגדלה עם $r - 1$.
          - value: 63.2
            feedback: 'זה מתאים ל-$r = e$, שבו מרבי התנע של הרקטה לכל קילוגרם התחלתי, $(\ln r)/r$. השאלה שואלת על החלק של האנרגיה, $(\ln r)^2/(r - 1)$.'
          - value: 75
            feedback: 'זה חלק הדלק ברקטה שבשאלה, $r = 4$. הוא קרוב לאופטימום, אבל לא בדיוק: ב-$r = 4$, $2(1 - 1/4) = 1.5$, ו-$\ln4 = 1.39$.'
          - value: 20.3
            feedback: 'זה $1/r$, החלק של המסה **הסופית**. הדלק הוא השאר, $1 - 1/r$.'
        hints:
          - 'אחרי הגזירה וההשוואה לאפס, חלקו ב-$\ln r$.'
          - 'בדקו את ההפרש $2(1 - 1/r) - \ln r$ ב-$r = 4$ וב-$r = 6$. איפה הוא מחליף סימן?'

      - label: ד
        type: open
        points: 9
        level: bagrut
        standalone: false
        objectives: [OBJ-3.6-1, OBJ-3.1-2, OBJ-3.3-1]
        prompt: >-
          לאן הולך שאר האנרגיה של הדלק?

          (1) בפרק זמן קצר הרקטה, במהירות $v$, פולטת מסה $|dM| = -dM$, שיוצאת במהירות $v - u$ ביחס למערכת
          האינרציאלית. כתבו את השינוי באנרגיה הקינטית של הרקטה, $d\left(\tfrac12Mv^2\right)$, ואת האנרגיה הקינטית של
          הגז שנפלט, והשתמשו במשוואת הרקטה, $M\,dv = -u\,dM$, כדי להראות שהסכום שלהם הוא $\tfrac12u^2|dM|$, בלי תלות
          ב-$v$. הסיקו שבסוף השריפה האנרגיה הקינטית הכוללת של הרקטה ושל כל הגזים היא בדיוק $E_f$.

          (2) בטאו את האנרגיה הקינטית $K_{\text{g}}$ של כל הגזים בסוף השריפה באמצעות $u$, $m_0$ ו-$r$. בדקו את
          התוצאה של (1) ברגע הראשון, $v = 0$, ואת $K_{\text{g}}$ בגבול $r \to 1$, ובדקו יחידות.

          (3) חשבו את $K_{\text{g}}$.
        hints:
          - 'בכלל המכפלה, $d\left(\tfrac12Mv^2\right) = \tfrac12v^2\,dM + Mv\,dv$. האנרגיה של הגז שנפלט היא $\tfrac12(-dM)(v - u)^2$; פתחו את הריבוע, הציבו $Mv\,dv = -uv\,dM$, וחברו.'
          - '$K_{\text{g}} = E_f - K_{\text{r}} = E_f(1 - \eta)$, עם $\eta$ מחלק ב.'
        solution:
          - { kind: law, text: 'שימור התנע בפרק זמן קצר נותן את משוואת הרקטה, $M\,dv = -u\,dM$, כאשר $dM < 0$ והגז שנפלט נע במהירות $v - u$ ביחס למערכת האינרציאלית. האנרגיה הקינטית הכוללת היא של הרקטה ועוד של כל הגז שנפלט עד כה.' }
          - { kind: manipulation, text: 'הרקטה: $d\left(\tfrac12Mv^2\right) = \tfrac12v^2dM + Mv\,dv = \tfrac12v^2dM - uv\,dM$. הגז החדש: $\tfrac12(-dM)(v - u)^2 = -\tfrac12v^2dM + uv\,dM - \tfrac12u^2dM$. הגז הישן לא משתנה. בסכום, האיברים עם $v$ מתבטלים: $dK_{\text{tot}} = -\tfrac12u^2dM = \tfrac12u^2|dM|$. אינטגרל מ-$m_0$ עד $m$: $K_{\text{tot}} = \tfrac12u^2(m_0 - m) = E_f$.' }
          - { kind: manipulation, text: 'לגזים נשאר $K_{\text{g}} = E_f - K_{\text{r}} = \tfrac12u^2(m_0 - m) - \tfrac12m(u\ln r)^2$. עם $m = m_0/r$: $$K_{\text{g}} = \frac{u^2m_0}{2r}\left[(r - 1) - (\ln r)^2\right]$$' }
          - { kind: limit, text: 'ב-$v = 0$, הרגע הראשון: רקטה במנוחה זורקת $|dM|$ אחורה ב-$u$. הגז מקבל $\tfrac12u^2|dM|$, והרקטה רק $\tfrac12M\,dv^2$, מסדר שני, אפס בגבול. זו בדיוק התוצאה של (1): היא לא תלויה ב-$v$, ולכן בכל רגע החשבון זהה לחשבון במערכת שבה הרקטה עומדת באותו רגע. כש-$r \to 1$: $(\ln r)^2 \approx (r - 1)^2$ זניח לעומת $r - 1$, ו-$K_{\text{g}} \to \tfrac12u^2(m_0 - m) = E_f$: כמעט כל האנרגיה בגזים, כמו ש-$\eta \to 0$ בחלק ב.' }
          - { kind: units, text: '$\tfrac12u^2\,dM$ ו-$u^2m_0$ ביחידות $\text{kg}\cdot\text{m}^2/\text{s}^2 = \text{J}$, והסוגריים חסרי ממדים.' }
          - { kind: substitution, text: '$r = 4$, $m_0/r = 300\,\text{kg}$: $K_{\text{g}} = \tfrac12\cdot2000^2\cdot300\cdot(3 - 1.922) = 6.47\cdot10^8\,\text{J}$. בדיקה: $1.80\cdot10^9 - 1.15\cdot10^9 = 6.5\cdot10^8\,\text{J}$, $35.9\%$ מ-$E_f$.' }
          - { kind: result, text: 'האנרגיה הקינטית הכוללת של רקטה + גזים היא $\tfrac12u^2(m_0 - m) = E_f$: אף ג׳ול לא הולך לאיבוד, רק מתחלק. לגזים $K_{\text{g}} = \dfrac{u^2m_0}{2r}\left[(r - 1) - (\ln r)^2\right] = 6.47\cdot10^8\,\text{J}$, $35.9\%$ מהאנרגיה של הדלק.' }
        rubric:
          - text: כתבתי את השינוי באנרגיה הקינטית של הרקטה ושל הגז שנפלט, עם מהירות הגז $v - u$ במערכת האינרציאלית.
          - text: 'השתמשתי ב-$M\,dv = -u\,dM$ והראיתי שהאיברים עם $v$ מתבטלים, ו-$dK_{\text{tot}} = \tfrac12u^2|dM|$.'
          - text: 'בדקתי שב-$v = 0$ מתקבלת הפליטה מרקטה עומדת, ושכש-$r \to 1$ כמעט כל האנרגיה בגזים.'
          - text: 'חישבתי $K_{\text{g}} \approx 6.47\cdot10^8\,\text{J}$, ובדקתי שהיא $E_f - K_{\text{r}}$.'

  # ------------------------------------------------------------ 2: a puck on a string through a hole
  - id: Q-3-bagrut-2
    type: bagrut
    title: דסקית על חוט שעובר דרך חור
    prompt: >-
      דסקית בעלת מסה $m = 0.25\,\text{kg}$ מחליקה על שולחן אופקי חלק. היא קשורה לחוט קל שעובר דרך חור קטן $O$ במרכז
      השולחן, ומישהו מחזיק את הקצה השני מתחת לשולחן. בהתחלה הדסקית נעה במעגל ברדיוס $r_0 = 0.50\,\text{m}$ במהירות
      $v_0 = 2.0\,\text{m/s}$. מושכים את החוט כלפי מטה לאט מאוד, כך שבכל רגע המסלול כמעט מעגל. החוט נקרע אם המתיחות בו
      עולה על $20\,\text{N}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-3.7-2]
        prompt: מה מהירות הדסקית כשרדיוס המעגל $0.25\,\text{m}$?
        answer: 4
        unit: m/s
        correctFeedback: >-
          נכון. המתיחות מושכת תמיד אל $O$: כוח מרכזי, ולכן $L = mrv$ ביחס ל-$O$ נשמר. $v = v_0\dfrac{r_0}{r} = 2.0\cdot\dfrac{0.50}{0.25} = 4.0\,\text{m/s}$.
          (המתיחות שם $mv^2/r = 16\,\text{N}$, והחוט עוד מחזיק.)
        wrongFeedback: 'מה המומנט של המתיחות ביחס לחור? איזה גודל נשמר אז?'
        commonWrong:
          - value: 2
            feedback: 'המהירות משתנה: בזמן המשיכה הדסקית נעה גם פנימה, לאורך החוט, והמתיחות עושה עליה עבודה.'
            misconception: MC-3-central-force-no-work

        prompt: >-
          עכשיו האדם עומד שוב במנוחה על הרפסודה העומדת, וקופץ ממנה אופקית למים. הוא עוזב אותה במהירות אופקית
          $u = 4.0\,\text{m/s}$ **ביחס לרפסודה**. מה מהירות הרפסודה מיד אחרי?
        answer: 0.8
        unit: m/s
        correctFeedback: >-
          נכון. תנע אופקי: $mv_{\text{p}} + Mv_{\text{r}} = 0$, ומהירות יחסית: $v_{\text{p}} - v_{\text{r}} = u$. לכן
          $v_{\text{r}} = -\dfrac{mu}{m + M} = -\dfrac{70\cdot4.0}{350} = -0.80\,\text{m/s}$, ו-$v_{\text{p}} = 3.2\,\text{m/s}$.
        wrongFeedback: 'כתבו שתי משוואות: שימור התנע (עם מהירויות ביחס למים) והקשר בין המהירות היחסית למהירויות ביחס למים.'
        commonWrong:
          - value: 1
            feedback: 'חישבתם $mu/M$, כאילו האדם עוזב ב-$4.0\,\text{m/s}$ ביחס למים. ביחס למים הוא נע לאט יותר, כי הרפסודה נרתעת לאחור.'
            misconception: MC-3-relative-as-ground-displacement
          - value: 3.2
            feedback: 'זו המהירות של האדם ביחס למים. השאלה שואלת על הרפסודה.'
        hints:
          - 'אם מהירות הרפסודה $v_{\text{r}}$, מה מהירות האדם ביחס למים?'

      - label: ד
        type: open
        points: 10
        level: bagrut
        objectives: [OBJ-3.8-2, OBJ-3.3-1]
        prompt: >-
          כמה אנרגיה קינטית הרגליים של האדם צריכות ליצור בקפיצה של חלק ג? הראו שהתשובה היא
          $K = \tfrac12\mu u^2$ עם $\mu = \dfrac{mM}{m + M}$, השוו לקפיצה באותה מהירות $u$ מרציף, ובדקו את הביטוי
          בגבולות $M \to \infty$ ו-$M \to 0$.
        hints:
          - 'מה מהירות מרכז המסה? מה אומר משפט קניג על האנרגיה הקינטית במקרה כזה?'
        solution:
          - { kind: law, text: 'משפט קניג: $K = \tfrac12(m + M)V^2 + K_{\text{rel}}$. התנע הכולל אפס, ולכן $V = 0$, וכל האנרגיה הקינטית שהרגליים יוצרות היא אנרגיה יחסית למרכז המסה.' }
          - { kind: manipulation, text: 'מחלק ג: $v_{\text{p}} = \dfrac{Mu}{m + M}$ ו-$v_{\text{r}} = -\dfrac{mu}{m + M}$. $$K = \tfrac12mv_{\text{p}}^2 + \tfrac12Mv_{\text{r}}^2 = \frac{u^2}{2(m + M)^2}\left(mM^2 + Mm^2\right) = \frac12\cdot\frac{mM}{m + M}\,u^2 = \tfrac12\mu u^2$$' }
          - { kind: limit, text: 'כש-$M \to \infty$ (רציף): $\mu \to m$ ו-$K \to \tfrac12mu^2$, הקפיצה הרגילה. כש-$M \to 0$ (לקפוץ מעלה נוצה): $\mu \to 0$ ו-$K \to 0$: הרגליים רק דוחפות את הנוצה אחורה, והאדם לא זז. תמיד $\mu < m$, ולכן הקפיצה מרפסודה זולה יותר באנרגיה, אבל האדם עוזב לאט יותר ביחס למים.' }
          - { kind: units, text: '$\mu = mM/(m + M)$ ביחידות $\text{kg}$, ו-$\tfrac12\mu u^2$ ב-$\text{J}$.' }
          - { kind: substitution, text: '$\mu = \dfrac{70\cdot280}{350} = 56\,\text{kg}$, $K = \tfrac12\cdot56\cdot4.0^2 = 448\,\text{J}$. בדיקה: $\tfrac12\cdot70\cdot3.2^2 + \tfrac12\cdot280\cdot0.80^2 = 358.4 + 89.6 = 448\,\text{J}$. מרציף: $\tfrac12\cdot70\cdot4.0^2 = 560\,\text{J}$.' }
          - { kind: result, text: '$K = \tfrac12\mu u^2 = 448\,\text{J}$, פחות מ-$560\,\text{J}$ של קפיצה מרציף באותה מהירות יחסית. הביטוי עובר את שני הגבולות.' }
        rubric:
          - text: נימקתי שמהירות מרכז המסה אפס, ולכן כל האנרגיה הקינטית יחסית למרכז המסה.
          - text: כתבתי את מהירויות האדם והרפסודה ביחס למים בעזרת $u$, והגעתי ל-$K = \tfrac12\mu u^2$.
          - text: בדקתי את הגבולות $M \to \infty$ ו-$M \to 0$ ואת היחידות.
          - text: הצבתי מספרים, $448\,\text{J}$, והשוויתי ל-$560\,\text{J}$ מרציף.

  # ------------------------------------------------------------ 4: a puck in a "hat" potential
  - id: Q-3-bagrut-4
    type: bagrut
    title: דסקית בפוטנציאל בצורת כובע
    prompt: >-
      דסקית בעלת מסה $m = 0.10\,\text{kg}$ מחליקה בלי חיכוך על שולחן אופקי. מגנטים מתחת לשולחן נותנים לה אנרגיה
      פוטנציאלית שתלויה רק במרחק $r$ שלה מנקודה $O$ על השולחן:
      $$U(r) = U_0\left[\left(\frac ra\right)^4 - 2\left(\frac ra\right)^2\right],\qquad U_0 = 2.0\,\text{J},\quad a = 0.50\,\text{m}$$
      לגרף של $U$ על השולחן יש צורת כובע: גבעה נמוכה ב-$O$, שבה $U = 0$, ותעלה עגולה סביבה, שבה $U = -U_0$ ב-$r = a$.
      הראשית של מערכת הצירים $x,\,y$ על השולחן היא $O$.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-3.2-2, OBJ-3.7-2]
        prompt: לאן פונה הכוח על הדסקית בנקודה כלשהי על השולחן?
        choices:
          - text: לאורך הקו שבין הדסקית ל-$O$; אל $O$ כש-$r > a$, וממנה כש-$r < a$.
            correct: true
            feedback: >-
              נכון. $U$ תלויה רק ב-$r$, ולכן קווי הגובה הם מעגלים סביב $O$, ו-$\vec F = -\nabla U = -\dfrac{dU}{dr}\hat r$
              רדיאלי. מחוץ לתעלה $U$ עולה עם $r$ והכוח פונה פנימה; בתוכה $U$ יורדת עם $r$ והכוח פונה החוצה. זה כוח
              מרכזי ביחס ל-$O$.
          - text: לאורך המעגל שעליו נמצאת הדסקית, משיק לו.
            feedback: 'המעגלים סביב $O$ הם קווי הגובה של $U$. לאורך קו גובה $U$ לא משתנה, ולכן לכוח אין רכיב לאורכו: הוא ניצב לו.'
            misconception: MC-3-force-along-contour
          - text: תמיד אל $O$, כי שם הגבעה.
            feedback: 'הכוח פונה לכיוון שבו $U$ **יורדת**. בתוך התעלה, $r < a$, $U$ יורדת כשמתרחקים מ-$O$, והכוח דוחף החוצה, מהגבעה אל התעלה.'
            misconception: MC-3-force-along-gradient
          - text: לכיוון התנועה של הדסקית.
            feedback: 'הכוח נקבע לפי המקום בלבד, $\vec F = -\nabla U(\vec r)$, ולא לפי המהירות.'

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-3.2-2]
        prompt: מהו רכיב ה-$x$ של הכוח על הדסקית כשהיא בנקודה $(0.45,\,0.60)\,\text{m}$?
        answer: -18
        unit: N
        correctFeedback: >-
          נכון. $r = 0.75\,\text{m}$, ו-$\dfrac{dU}{dr} = U_0\left(\dfrac{4r^3}{a^4} - \dfrac{4r}{a^2}\right) = 2.0\cdot(27 - 12) = 30\,\text{N}$.
          הכוח $\vec F = -\dfrac{dU}{dr}\cdot\dfrac{\vec r}{r}$, ולכן $F_x = -30\cdot\dfrac{0.45}{0.75} = -18\,\text{N}$ (ו-$F_y = -24\,\text{N}$):
          פנימה, אל $O$, כי $r > a$.
        wrongFeedback: 'חשבו $dU/dr$ ב-$r = 0.75\,\text{m}$. הכוח רדיאלי, ורכיב ה-$x$ שלו הוא $F_x = -\dfrac{dU}{dr}\cdot\dfrac xr$.'
        commonWrong:
          - value: 18
            feedback: 'הסימן הפוך. $\vec F = -\nabla U$, ומחוץ לתעלה $U$ עולה עם $r$: הכוח פונה פנימה, אל $O$.'
            misconception: MC-3-force-along-gradient
          - value: -30
            feedback: 'זה גודל הכוח כולו. רכיב ה-$x$ הוא החלק שלו לאורך $x$: כפלו ב-$x/r = 0.6$.'
          - value: -24
            feedback: 'זה רכיב ה-$y$, $F_y = -30\cdot0.60/0.75$. לרכיב ה-$x$ כופלים ב-$x/r$.'
        hints:
          - '$\dfrac{\partial r}{\partial x} = \dfrac xr$, ולכן $\dfrac{\partial U}{\partial x} = \dfrac{dU}{dr}\cdot\dfrac xr$.'

      - label: ג
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-3.3-2, OBJ-3.3-1]
        prompt: >-
          הדסקית נחה בתחתית התעלה, בנקודה $(a,\,0)$, ומקבלים לה מהירות לאורך ציר $x$, אל $O$. מה המהירות המזערית שבה
          היא עוברת מעל הגבעה ומגיעה לצד השני של התעלה?
        answer: 6.32
        unit: m/s
        correctFeedback: >-
          נכון. התנועה לאורך ציר $x$, דרך $O$ (התנע הזוויתי אפס), ולכן זו בעיה בממד אחד. המחסום הוא הגבעה: $U(0) = 0$,
          גבוה ב-$U_0 = 2.0\,\text{J}$ מהתחתית. צריך $\tfrac12mv^2 > U_0$, כלומר $v > \sqrt{\dfrac{2U_0}{m}} = \sqrt{\dfrac{4.0}{0.10}} = 6.32\,\text{m/s}$.

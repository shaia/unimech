          $\Delta x_{\text{p}} = L + \Delta x_{\text{r}}$. מכאן $\Delta x_{\text{r}} = -\dfrac{mL}{m + M} = -\dfrac{70\cdot5.0}{350} = -1.0\,\text{m}$,
          אחורה. האדם זז $4.0\,\text{m}$ ביחס למים.
        wrongFeedback: 'מרכז המסה של אדם + רפסודה לא זז. כתבו את ההעתק של האדם ביחס למים כסכום של ההעתק שלו על הרפסודה ושל ההעתק של הרפסודה.'
        commonWrong:
          - value: 1.25
            feedback: 'חישבתם $mL/M$, כאילו האדם זז $5.0\,\text{m}$ ביחס למים. $5.0\,\text{m}$ הם ביחס לרפסודה, שזזה אחורה בזמן ההליכה.'
            misconception: MC-3-relative-as-ground-displacement

#   1: m0 = 1200 kg, 900 kg fuel, u = 2000 m/s: Δv = u ln 4 = 2773 m/s (1500 from uΔm/m0, 6000 from uΔm/m,
#      575 from u ln(m0/Δm)); ב (now open) K_rocket = 1.153·10⁹ J, ½u²Δm = 1.80·10⁹ J, η = (ln r)²/(r − 1)
#      = 1.922/3 = 0.641; ג η(r) peaks where 2(1 − 1/r) = ln r: r = 4.92, η = 64.8%, fuel
#      1 − 1/r = 79.7% (86.5% at r = e², which maximises K per initial mass; 63.2% at r = e, momentum per initial
#      mass; 75% the given rocket; 20.3% = 1/r); ד (now open) K_gas = (u²m0/2r)[(r − 1) − (ln r)²]
#      = 6.47·10⁸ J = 35.9% of E_f; a discrete burn in 2·10⁵ steps gives K_rocket + K_gas = E_f to 1e-5;
#   2: m = 0.25 kg, r0 = 0.50 m, v0 = 2.0 m/s: at 0.25 m v = 4.0 m/s (1.0 from v ∝ r, 2.83 from 1/√r, 8.0 from
#      1/r²), T = 16 N, W = ½mv0²(r0²/r² − 1) = 1.50 J = ΔK; ד (now open) r_b = (mv0²r0²/Tmax)^(1/3), r_b³ =
#      0.0125 m³, r_b = 0.232 m, v there 4.31 m/s, L = 0.25 kg·m²/s, T(r_b) = 20 N; 0.050 m with v fixed;
#      r_b → r0 as Tmax → T0 = mv0²/r0 = 2.0 N;
#   3: m = 70 kg, M = 280 kg, L = 5.0 m: raft moves mL/(m + M) = 1.00 m (1.25 from mL/M); ג (now open) jump at
#      u = 4.0 m/s relative: v_r = −mu/(m + M) = −0.80 m/s, v_p = Mu/(m + M) = 3.2 m/s; K = ½μu² = 448 J,
#      μ = 56 kg (560 J on land);
#   4: U = U0[(r/a)⁴ − 2(r/a)²], U0 = 2.0 J, a = 0.50 m, m = 0.10 kg: at (0.45, 0.60) m r = 0.75 m,
#      dU/dr = 30 N, F_x = −18 N (F_y = −24 N); ג (now open) crossing O from r = a needs v > √(2U0/m) = 6.32 m/s
#      (RK4 along x: crosses at 1.01 v_min, turns back at 0.99 v_min); circular orbit at 0.75 m:
#      v = √(r·dU/dr / m) = 15.0 m/s;
#   5: symbols only. v = √(2gRM/(M + m)), V = −(m/M)v, u = v − V = √(2gR(M + m)/M), N = mg(3 + 2m/M),
#      N_f = Mg + N; checked at m = 1, M = 3, R = 1 against RK4 of the Lagrange equations for (X, φ):
#      v = 3.83, V = −1.28 m/s, N = m(g + Rφ̇²) = 35.9 N, cart acceleration 0 at the bottom, cart displacement
#      −mR/(M + m); N_f − (M + m)g = mu²/R = 26.1 N (centre-of-mass check).
#
# Independent review 2026-11-18 (.scratch/review/ch3/indep.ts, own routes): every number recomputed (≈55 values:

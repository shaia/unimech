    level: bagrut
    prompt: >-
      על חלקיק במרחב פועל הכוח $\vec F = \left(2xy,\ x^2 + z,\ y + 2z\right)$, ב-$\text{N}$ כש-$x$, $y$ ו-$z$ במטרים.
      בדקו בעזרת שלושת הרכיבים של הרוטור שהכוח משמר, מצאו את $U$, וחשבו את העבודה שהכוח עושה על החלקיק כשהוא
      נע מהראשית לנקודה $(1,\,2,\,1)\,\text{m}$ לאורך מסלול מפותל כלשהו.
    answer: 5
    unit: J
    correctFeedback: >-
      נכון. הרוטור: $\partial F_z/\partial y - \partial F_y/\partial z = 1 - 1 = 0$,
      $\partial F_x/\partial z - \partial F_z/\partial x = 0 - 0 = 0$, $\partial F_y/\partial x - \partial F_x/\partial y = 2x - 2x = 0$,
      בכל המרחב, ולכן הכוח משמר. מ-$F_x$: $U = -x^2y + g(y,\,z)$. מ-$F_y$: $x^2 - \partial g/\partial y = x^2 + z$,
      ולכן $g = -yz + h(z)$. מ-$F_z$: $y - h'(z) = y + 2z$, ולכן $h = -z^2$. יחד $U = -\left(x^2y + yz + z^2\right)$, והעבודה
      $W = U(0,\,0,\,0) - U(1,\,2,\,1) = 2 + 2 + 1 = 5.00\,\text{J}$, בלי קשר לצורת המסלול.

# Lesson 3.3 question bank: the comprehension ladder of "שימור אנרגיה, הספק ודיאגרמת אנרגיה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q.ts:
#   m = 2.0 kg, h = 1.5 m, v = 4.0 m/s: W_f = ½mv² − mgh = 16 − 29.4 = −13.4 J (+13.4; −29.4; −45.4);
#   P = 60 kW, F_d = cv², c = 0.40 kg/m: v_max = (P/c)^(1/3) = 53.1 m/s (√(P/c) = 387; P in kW: 5.31);
#   m = 1000 kg, P = 50 kW from rest to 20 m/s: t = mv²/(2P) = 4.0 s, x = (2/3)vt = 53.3 m (40 at constant
#   acceleration, 80 at constant speed); the lesson's "הספק" section now shows ½mv² = Pt (1200 kg, 80 kW:
#   11.5 m/s at 1.0 s, 23.1 m/s at 4.0 s; .scratch/ch3/3-3/review-fixes.ts), so this exam rung adds only the
#   integration v(t) → distance;
#   U = x³ − 3x + 1 (J, x in m), m = 2.0 kg: equilibria x = ±1 m, U(1) = −1 J (stable), U(−1) = 3 J (unstable);
#   trapped below v = √(2·4/2) = 2.0 m/s (1.73 from K = U(−1); 1.41 without the ½).

chapter: 3
questions:
  # ------------------------------------------- OBJ-3.3-1 energy conservation, non-conservative work, power
  - id: Q-3.3-constant-power
    type: mc
    objectives: [OBJ-3.3-1]
    qualitative: true
    level: basic
    prompt: >-
      מכונית מאיצה על כביש ישר, והמנוע מספק לגלגלים הספק קבוע $P$. הזניחו את הגרר. מה קורה לכוח המניע $F$ ולתאוצה
      כשהמהירות גדלה?
    choices:
      - text: שניהם קטנים, כי $F = P/v$.
        correct: true
        feedback: >-
          נכון. ההספק של כוח הוא $P = \vec F\cdot\vec v$, ולכן בהספק קבוע $F = P/v$: ככל שהמכונית מהירה יותר, הכוח
          והתאוצה $a = P/(mv)$ קטנים. לכן קשה יותר להוסיף $10\,\text{km/h}$ במהירות גבוהה.
      - text: הכוח והתאוצה קבועים, כי ההספק קבוע.
        feedback: >-
          הספק קבוע הוא **קצב עבודה** קבוע, לא כוח קבוע. בכוח קבוע ההספק $Fv$ היה גדל עם המהירות.
        misconception: MC-3-constant-power-constant-force
      - text: הכוח קבוע והתאוצה קטנה, כי המסה האפקטיבית גדלה במהירות.
        feedback: 'המסה של המכונית לא משתנה (אנחנו רחוקים ממהירות האור). הכוח עצמו קטן, $F = P/v$.'
        misconception: MC-3-constant-power-constant-force
      - text: שניהם גדלים, כי המנוע מסתובב מהר יותר.
        feedback: 'אם הכוח היה גדל עם המהירות, ההספק $Fv$ היה גדל פעמיים, ולא היה קבוע.'
    hints:
      - 'כתבו את ההספק של הכוח המניע במונחים של $F$ ושל $v$.'

  - id: Q-3.3-ramp-friction
    type: numeric
    objectives: [OBJ-3.3-1]
    level: basic
    prompt: >-
      ארגז בעל מסה $2.0\,\text{kg}$ משתחרר ממנוחה בראש מגלשה מעוקלת ויורד בה $1.5\,\text{m}$ בגובה. בתחתית מהירותו
      $4.0\,\text{m/s}$. כמה עבודה עשה החיכוך בירידה?
    answer: -13.4
    unit: J
    correctFeedback: >-
      נכון. $W_{\text{nc}} = \Delta K + \Delta U = \tfrac12\cdot2.0\cdot4.0^2 - 2.0\cdot9.8\cdot1.5 = 16 - 29.4 = -13.4\,\text{J}$.
      לא צריך לדעת את הצורה של המגלשה: הכובד משמר, והנורמלי ניצב לתנועה.
    wrongFeedback: 'העבודה של הכוחות הלא משמרים היא השינוי באנרגיה המכנית: $W_{\text{nc}} = (K_2 + U_2) - (K_1 + U_1)$.'
    commonWrong:
      - value: 13.4
        feedback: 'זה הגודל הנכון בסימן הפוך. האנרגיה המכנית ירדה, והחיכוך פועל נגד התנועה: העבודה שלו שלילית.'
      - value: -29.4
        feedback: 'זה $W = -mgh$, כאילו כל האנרגיה הפוטנציאלית אבדה. אבל בתחתית לארגז יש $16\,\text{J}$ אנרגיה קינטית.'
      - value: -45.4
        feedback: 'חיברתם את $\tfrac12mv^2$ ל-$mgh$. הירידה בגובה **מוסיפה** אנרגיה קינטית; החיכוך לקח רק את מה שחסר.'
    hints:
      - 'כמה אנרגיה מכנית הייתה לארגז למעלה, וכמה נשארה למטה?'

  - id: Q-3.3-two-throws
    type: twotier
    objectives: [OBJ-3.3-1]
    qualitative: true
    level: mid
    prompt: >-
      מגג בגובה $H$ זורקים שני כדורים זהים באותו גודל מהירות $v_0$: אחד בזווית $30^\circ$ **מעל** האופק, והשני בזווית
      $30^\circ$ **מתחת** לאופק. הזניחו את האוויר. איזה כדור פוגע בקרקע במהירות גדולה יותר (בגודלה)?
    choices:
      - text: גודל המהירות זהה.
        correct: true
        feedback: 'נכון. $\tfrac12mv^2 = \tfrac12mv_0^2 + mgH$, ולכן $v = \sqrt{v_0^2 + 2gH}$ לשניהם. הכיוון של המהירות בפגיעה שונה.'
      - text: הכדור שנזרק כלפי מטה.
        feedback: >-
          הכדור שנזרק כלפי מטה פוגע **מוקדם** יותר, אבל לא מהר יותר. הכדור שעלה קודם חוזר לגובה הגג באותו גודל
          מהירות $v_0$, ומשם הוא יורד כמו השני.
        misconception: MC-3-speed-depends-on-launch-direction
      - text: הכדור שנזרק כלפי מעלה, כי הוא נופל מגובה רב יותר.
        feedback: >-
          הוא אכן מגיע לגובה רב יותר, אבל שם יש לו פחות אנרגיה קינטית. האנרגיה המכנית שלו זהה לזו של השני מההתחלה.
        misconception: MC-3-speed-depends-on-launch-direction
    reasons:
      - text: 'האנרגיה המכנית נשמרת, ולשני הכדורים אותה $K$ ואותה $U$ ברגע הזריקה.'
        correct: true
        feedback: 'זה הנימוק. האנרגיה הקינטית תלויה רק בגודל המהירות, לא בכיוון שלה.'
      - text: לשניהם אותו רכיב אופקי של המהירות.
        feedback: >-
          נכון שהרכיב האופקי זהה, $v_0\cos30^\circ$, אבל הוא לבדו לא קובע את גודל המהירות בפגיעה. הנימוק הוא שהעבודה
          של הכובד, $mgH$, זהה לשניהם.
      - text: הכובד פועל זמן רב יותר על הכדור שעלה, ולכן הוא מוסיף לו יותר מהירות.
        feedback: >-
          הכובד אכן פועל עליו זמן רב יותר, אבל בחלק מהזמן הזה הוא רק עוצר את העלייה ומחזיר את הכדור לגובה הגג,
          באותו גודל מהירות $v_0$. את גודל המהירות קובעת העבודה, $mgH$, שתלויה רק בהפרש הגובה, לא בזמן.
        misconception: MC-3-speed-depends-on-launch-direction
    hints:
      - 'כתבו את האנרגיה המכנית של כל כדור ברגע הזריקה ובקרקע.'

  - id: Q-3.3-top-speed-drag
    type: numeric
    objectives: [OBJ-3.3-1]
    level: mid
    prompt: >-
      המנוע של מכונית מספק לגלגלים הספק מרבי של $60\,\text{kW}$. כוח הגרר על המכונית הוא $F_d = cv^2$ עם
      $c = 0.40\,\text{kg/m}$, והזניחו כוחות התנגדות אחרים. מהי המהירות המרבית של המכונית על כביש אופקי?
    answer: 53.1
    unit: m/s
    correctFeedback: >-
      נכון. במהירות המרבית התאוצה אפס, ולכן הכוח המניע שווה לגרר, $F = cv^2$. ההספק שלו $P = Fv = cv^3$, ולכן
      $v_{\max} = \left(\dfrac{P}{c}\right)^{1/3} = \left(\dfrac{6.0\cdot10^4}{0.40}\right)^{1/3} = 53.1\,\text{m/s}$,
      כ-$190\,\text{km/h}$.
    wrongFeedback: 'במהירות המרבית הכוח המניע מאזן את הגרר. כתבו את ההספק כ-$Fv$ והציבו $F = cv^2$.'
    commonWrong:
      - value: 387
        feedback: 'השוויתם $P = cv^2$, כלומר את ההספק לכוח. ההספק הוא כוח **כפול מהירות**: $P = cv^2\cdot v$.'
      - value: 5.31
        feedback: 'הצבתם את ההספק בקילוואט. ביחידות SI, $P = 6.0\cdot10^4\,\text{W}$.'
    hints:
      - 'מה התאוצה במהירות המרבית, ומה זה אומר על הכוחות?'

  - id: Q-3.3-constant-power-distance
    type: numeric
    objectives: [OBJ-3.3-1]
    level: bagrut
    prompt: >-
      מכונית בעלת מסה $1000\,\text{kg}$ מתחילה ממנוחה ונוסעת בהספק קבוע $P = 50\,\text{kW}$, בלי גרר ובלי החלקה.
      איזה מרחק היא עוברת עד שמהירותה $20\,\text{m/s}$?
    answer: 53.3
    unit: m
    correctFeedback: >-
      נכון. ממשפט עבודה-אנרגיה $Pt = \tfrac12mv^2$, ולכן $v(t) = \sqrt{2Pt/m}$ ו-$t = \dfrac{mv^2}{2P} = 4.0\,\text{s}$.
      המרחק הוא $x = \int_0^t v\,dt' = \sqrt{\dfrac{2P}{m}}\cdot\dfrac23t^{3/2} = \dfrac23vt = \dfrac23\cdot20\cdot4.0 = 53.3\,\text{m}$.
      **בדיקת גבולות:** בתאוצה קבועה היינו מקבלים $\tfrac12vt$, ובמהירות קבועה $vt$; התוצאה $\tfrac23vt$ ביניהן, כי
      בהספק קבוע התאוצה גדולה בהתחלה וקטנה בסוף. (ב-$t \to 0$ הנוסחה דורשת כוח אינסופי, $F = P/v$: מכונית אמיתית
      מוגבלת בהתחלה בחיכוך של הצמיגים.)
    wrongFeedback: 'העבודה של המנוע עד זמן $t$ היא $Pt$. מצאו ממנה את $v(t)$, ואינטגרלו את $v(t)$ כדי לקבל מרחק.'
    commonWrong:
      - value: 40
        feedback: >-
          חישבתם $\tfrac12vt$, המרחק בתאוצה קבועה. בהספק קבוע התאוצה לא קבועה: $v \propto \sqrt t$, והמכונית מהירה
          יותר בתחילת הדרך מאשר בתאוצה קבועה.
        misconception: MC-3-constant-power-constant-force
      - value: 80
        feedback: 'חישבתם $vt$, כאילו המכונית נסעה כל הזמן ב-$20\,\text{m/s}$. היא התחילה ממנוחה.'
    hints:
      - 'מצאו קודם את הזמן מ-$Pt = \tfrac12mv^2$.'
      - '$\int_0^t\sqrt{t''}\,dt'' = \tfrac23t^{3/2}$.'

  # ----------------------------------------- OBJ-3.3-2 reading U(x): turning points, allowed region, stability
  - id: Q-3.3-turning-point
    type: mc
    objectives: [OBJ-3.3-2]
    qualitative: true
    level: basic
    prompt: >-
      חלקיק נע על ציר $x$ באנרגיה פוטנציאלית $U(x)$, והאנרגיה המכנית שלו $E$. בדיאגרמה, הקו האופקי $E$ חותך את העקומה
      $U(x)$ בנקודות $x_1$ ו-$x_2$, וביניהן $U < E$. מה נכון לגבי החלקיק בנקודה $x_1$?
    choices:
      - text: מהירותו אפס, אבל הכוח עליו שונה מאפס ומחזיר אותו אל התחום שבין $x_1$ ל-$x_2$.
        correct: true
        feedback: >-
          נכון. $K = E - U(x_1) = 0$, ולכן $x_1$ היא נקודת מפנה. השיפוע של $U$ שם לא אפס, והכוח $F = -U'(x_1)$ פונה
          לצד שבו $U$ יורדת, פנימה. לכן החלקיק לא נשאר שם.
      - text: מהירותו אפס והכוח עליו אפס, ולכן הוא נשאר שם.
        feedback: >-
          מהירות אפס לא אומרת כוח אפס. כוח אפס יש רק היכן ש-$U'(x) = 0$. בנקודת מפנה החלקיק נעצר לרגע וחוזר, כמו
          כדור שנזרק כלפי מעלה בשיא הגובה.
        misconception: MC-3-rest-and-equilibrium-confused
      - text: מהירותו מרבית, כי שם $E = U$.
        feedback: 'המהירות נקבעת על ידי $K = E - U$. ב-$x_1$ ההפרש הזה אפס, ולכן המהירות **מזערית**: אפס.'
      - text: החלקיק לא יכול להגיע ל-$x_1$, כי שם כל האנרגיה פוטנציאלית.
        feedback: 'הוא מגיע אליה ונעצר בה לרגע. אסור לו רק לעבור אותה, לאזור שבו $U > E$ ו-$K$ הייתה שלילית.'
    hints:
      - '$K = E - U(x)$. כמה זה ב-$x_1$?'

  - id: Q-3.3-cubic-stability
    type: mc
    objectives: [OBJ-3.3-2]
    level: mid
    prompt: >-
      האנרגיה הפוטנציאלית של חלקיק על ציר $x$ היא $U(x) = x^3 - 3x + 1$ (ב-$\text{J}$ כש-$x$ במטרים). מה נכון לגבי
      נקודות שיווי המשקל שלו?
    choices:
      - text: 'יש שתיים: $x = 1\,\text{m}$ יציבה, ו-$x = -1\,\text{m}$ לא יציבה.'
        correct: true
        feedback: >-
          נכון. $U'(x) = 3x^2 - 3 = 0$ ב-$x = \pm1\,\text{m}$. $U''(x) = 6x$: בנקודה $x = 1$ הוא חיובי (מינימום,
          יציב), ובנקודה $x = -1$ שלילי (מקסימום, לא יציב).
      - text: 'יש שתיים, ושתיהן יציבות, כי בשתיהן הכוח אפס.'
        feedback: 'הכוח אפס בכל נקודת שיווי משקל, יציבה או לא. היציבות נקבעת לפי הסימן של $U''''$.'
        misconception: MC-3-equilibrium-always-stable
      - text: 'יש שתיים: $x = -1\,\text{m}$ יציבה, כי שם $U$ גדולה יותר, ו-$x = 1\,\text{m}$ לא יציבה.'
        feedback: >-
          הפכתם את הקריטריון. ליד מקסימום של $U$ הכוח דוחף החוצה, כמו כדור על ראש גבעה. יציבות היא **מינימום**,
          $U'' > 0$.
        misconception: MC-3-equilibrium-always-stable
      - text: 'יש אחת, ב-$x = 0$, כי שם $U''''(x) = 0$.'
        feedback: >-
          ב-$x = 0$ יש נקודת פיתול, נקודה שבה $U''$ מחליפה סימן (כאן $U''(0) = 0$). שיווי משקל דורש כוח אפס, כלומר $U'(x) = 0$. ב-$x = 0$ הכוח הוא
          $F = -U'(0) = 3\,\text{N}$, והחלקיק לא נשאר שם.
    hints:
      - 'פתרו $U''(x) = 0$, ואז בדקו את הסימן של $U''''$ בכל פתרון.'

  - id: Q-3.3-molecule-release
    type: twotier
    objectives: [OBJ-3.3-2]
    qualitative: true
    # mid, not exam level: figure 3.3a's Morse well shows this very release (E > 0 from the steep wall) in a Step
    level: mid
    prompt: >-
      האנרגיה הפוטנציאלית של שני אטומים כפונקציה של המרחק $r$ ביניהם היא $U(r)$: תלולה מאוד ב-$r$ קטן, עם מינימום
      שלילי ב-$r_0$, ושואפת ל-0 כש-$r \to \infty$. מחזיקים את האטומים במנוחה במרחק $r_1 < r_0$ שבו $U(r_1) > 0$,
      ומשחררים. (חשבו על אטום אחד כבד מאוד ועומד.) מה קורה?
    choices:
      - text: 'האטום מתרחק, עובר את $r_0$ במהירות המרבית, ומתרחק לאינסוף.'
        correct: true
        feedback: >-
          נכון. $E = U(r_1) > 0$, והקו $E$ נמצא מעל העקומה בכל $r > r_1$: אין נקודת מפנה מימין. המהירות מרבית במינימום,
          ורחוק נשארת אנרגיה קינטית $K = E$.
      - text: האטום מתנודד בין $r_1$ לנקודת מפנה שנייה מימין למינימום.
        feedback: >-
          נקודת מפנה שנייה דורשת ש-$U$ תחזור לגובה $E$. אבל $U \le 0$ בכל מקום מימין למינימום, ו-$E > 0$. בור
          פוטנציאל כולא רק חלקיק עם $E$ נמוכה משפתו.
        misconception: MC-3-every-well-traps
      - text: האטום נע אל $r_0$ ונעצר שם, כי שם הכוח אפס.
        feedback: >-
          ב-$r_0$ הכוח אפס, אבל המהירות לא: שם היא דווקא מרבית. כוח אפס פירושו שהמהירות לא משתנה **ברגע הזה**, לא
          שהיא אפס.
        misconception: MC-3-rest-and-equilibrium-confused
    reasons:
      - text: 'בכל $r > r_1$ מתקיים $U(r) < E$, ולכן $K > 0$ לכל אורך הדרך.'
        correct: true
        feedback: 'זה הנימוק. התחום המותר הוא כל ה-$r$ שבהם $U(r) \le E$, וכאן הוא לא חסום מימין.'
      - text: האטום תמיד חוזר לשיווי המשקל היציב, כי הכוח שם מחזיר.
        feedback: 'הכוח מחזיר רק בסביבה של $r_0$, ורק אם האנרגיה לא מספיקה כדי לצאת מהבור. כאן היא מספיקה.'
        misconception: MC-3-every-well-traps
      - text: הכוח בין האטומים מושך בכל מרחק, ולכן הם לא יכולים להתרחק.
        feedback: >-
          ב-$r < r_0$ השיפוע של $U$ שלילי, והכוח $F = -dU/dr$ **דוחה**. הוא נותן לאטום את האנרגיה שמספיקה, אחר כך,

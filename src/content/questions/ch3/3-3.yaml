  - id: Q-3.3-cubic-escape
    type: numeric
    objectives: [OBJ-3.3-2, OBJ-3.3-1]
    level: bagrut
    prompt: >-
      חלקיק בעל מסה $2.0\,\text{kg}$ נע על ציר $x$ באנרגיה הפוטנציאלית $U(x) = x^3 - 3x + 1$ (ב-$\text{J}$ כש-$x$
      במטרים), בלי חיכוך. הוא נמצא בנקודת שיווי המשקל היציבה ומקבל שם מהירות $v$. מהי המהירות הגדולה ביותר שבה הוא
      עדיין נשאר כלוא סביב הנקודה הזו לנצח?
    answer: 2
    unit: m/s
    correctFeedback: >-
      נכון. החלקיק כלוא ב-$x = 1\,\text{m}$, שם $U = -1\,\text{J}$. מימין $U \to \infty$, ולכן מימין תמיד יש נקודת מפנה.
      משמאל המחסום הוא המקסימום ב-$x = -1\,\text{m}$, עם $U = 3\,\text{J}$, ואחריו $U \to -\infty$ והחלקיק בורח. הוא
      כלוא כל עוד $E < 3\,\text{J}$: $\tfrac12mv^2 < 3 - (-1) = 4\,\text{J}$, ולכן $v < \sqrt{\dfrac{2\cdot4}{2.0}} = 2.0\,\text{m/s}$.
    wrongFeedback: >-
      מצאו את הגובה של המחסום: הערך של $U$ במקסימום, **מעל** הערך שלה בנקודה שבה החלקיק מתחיל. האנרגיה הקינטית
      ההתחלתית צריכה להיות קטנה מההפרש.
    commonWrong:
      - value: 1.73
        feedback: >-
          השוויתם את $\tfrac12mv^2$ ל-$U(-1) = 3\,\text{J}$, כאילו החלקיק מתחיל ב-$U = 0$. הוא מתחיל ב-$U = -1\,\text{J}$,
          ולכן המחסום גבוה ממנו ב-$4\,\text{J}$.
      - value: 1.41
        feedback: 'שכחתם את ה-$\tfrac12$: $\tfrac12mv^2 = 4\,\text{J}$ נותן $v = \sqrt{8/2.0}$.'
    hints:
      - 'שרטטו את $U(x)$: איפה המינימום, איפה המקסימום, ומה קורה ב-$x \to \pm\infty$?'
      - 'בנקודת המפנה $E = U$. מתי נקודת המפנה השמאלית נעלמת?'

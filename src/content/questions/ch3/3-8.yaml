# Lesson 3.8 question bank: the comprehension ladder of "תנע זוויתי של מערכת חלקיקים".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# König: K = ½MV² + K_rel and L = R × MV + L_rel (L_rel about the CM, the same about every origin).
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q2.ts:
#   Atwood 3.0 kg / 1.0 kg, light pulley R = 0.10 m: dL/dt = (m1 − m2)gR = 1.96 N·m, a = (m1 − m2)g/(m1 + m2)
#   = 4.90 m/s² (6.53 dividing by m1 only; 7.35 from m1 g/(m1 + m2));
#   1.0 kg at 4.0 m/s and 3.0 kg at rest: K = 8.0 J, V = 1.0 m/s, ½MV² = 2.0 J, K_rel = 6.0 J;
#   dumbbell 2 × 0.50 kg on a 0.40 m rod, V = 3.0 m/s, ω = 10 rad/s: I_cm = 0.040 kg·m², K = 4.5 + 2.0 = 6.5 J
#   (12.5 with the full rod as the radius);
#   its CM along y = 2.0 m in +x: L_z = −MbV + I_cm ω = −6.0 + 0.40 = −5.6 kg·m²/s (−6.0; +6.4; 0.40; −6.4).

chapter: 3
questions:
  # ------------------------- OBJ-3.8-1 dL/dt = τ_ext for a system; when internal torques drop out
  - id: Q-3.8-strong-third-law
    type: mc
    objectives: [OBJ-3.8-1]
    qualitative: true
    level: basic
    prompt: >-
      במערכת של חלקיקים, זוג כוחות פנימיים $\vec F_{12}$ (של 2 על 1) ו-$\vec F_{21}$ תורם למומנט הכולל
      $\vec r_1\times\vec F_{12} + \vec r_2\times\vec F_{21}$. כדי ש-$\dfrac{d\vec L}{dt} = \vec\tau_{\text{ext}}$, התרומה
      הזו צריכה להתאפס. מה מבטיח זאת?
    choices:
      - text: 'שני הכוחות שווים בגודלם, הפוכים בכיוונם, **ופועלים לאורך הקו שמחבר את שני החלקיקים**.'
        correct: true
        feedback: >-
          נכון. עם $\vec F_{21} = -\vec F_{12}$, התרומה היא $(\vec r_1 - \vec r_2)\times\vec F_{12}$. היא מתאפסת רק אם
          $\vec F_{12}$ מקביל ל-$\vec r_1 - \vec r_2$: זו הצורה החזקה של החוק השלישי, שמקיימים כובד, קפיצים, חוטים
          וכוחות מגע.
      - text: מספיק ששני הכוחות שווים בגודלם והפוכים בכיוונם.
        feedback: >-
          זה מבטל אותם בסכום הכוחות, ולכן מספיק לתנע. במומנט נשאר $(\vec r_1 - \vec r_2)\times\vec F_{12}$: שני כוחות
          הפוכים על קווים מקבילים שונים הם זוג כוחות, ומומנט הזוג לא אפס.
        misconception: MC-3-weak-third-law-enough
      - text: שהמערכת צפידה, כך שהמרחקים בין החלקיקים לא משתנים.
        feedback: >-
          הצפידות לא נדרשת: $d\vec L/dt = \vec\tau_{\text{ext}}$ נכון גם לשני מחליקים שמושכים חבל, או לכוכבים
          בגלקסיה. מה שנדרש הוא הכיוון של הכוחות הפנימיים.
      - text: שהכוחות הפנימיים קטנים מהחיצוניים.
        feedback: 'הגודל לא משנה: גם כוחות פנימיים עצומים מתבטלים במומנט, אם הם בזוגות לאורך הקווים שמחברים את החלקיקים.'
    hints:
      - 'הציבו $\vec F_{21} = -\vec F_{12}$ ופשטו. מתי מכפלה וקטורית מתאפסת?'

  - id: Q-3.8-atwood-axle
    type: numeric
    objectives: [OBJ-3.8-1]
    level: mid
    prompt: >-
      מכונת אטווד: מסות של $3.0\,\text{kg}$ ו-$1.0\,\text{kg}$ תלויות משני צדי חוט קל שעובר על גלגלת קלה וחלקה ברדיוס
      $0.10\,\text{m}$. כתבו את התנע הזוויתי של המערכת (שתי המסות, החוט והגלגלת) ביחס לציר הגלגלת, ואת המומנט החיצוני
      ביחס אליו. מהי התאוצה של המסות?
    answer: 4.9
    unit: m/s²
    correctFeedback: >-
      נכון. כששתי המסות נעות במהירות $v$, שתיהן סובבות סביב הציר באותו כיוון, עם זרוע $R$: $L = (m_1 + m_2)vR$. המתיחות
      פנימית, והכוח מהציר עובר דרכו. נשאר מומנט הכובד, $(m_1 - m_2)gR = 1.96\,\text{N·m}$. לכן
      $(m_1 + m_2)Ra = (m_1 - m_2)gR$, ו-$a = \dfrac{(m_1 - m_2)g}{m_1 + m_2} = 4.9\,\text{m/s}^2$, בלי לחשב מתיחות.
    wrongFeedback: >-
      התנע הזוויתי הוא סכום התרומות של שתי המסות, וכל אחת תורמת $mvR$. המומנט החיצוני מגיע רק מהכובד על שתי המסות:
      אחד בכל כיוון.
    commonWrong:
      - value: 6.53
        feedback: 'חילקתם רק במסה הכבדה. שתי המסות מאיצות, ושתיהן תורמות לתנע הזוויתי: $L = (m_1 + m_2)vR$.'
      - value: 7.35
        feedback: 'לקחתם רק את המומנט של המסה הכבדה. גם הכובד על המסה הקלה נותן מומנט, בכיוון ההפוך.'
      - value: 9.8
        feedback: 'זו נפילה חופשית. המסה הקלה בצד השני מאטה את הכבדה: המומנטים של שני הכוחות מתקזזים בחלקם.'
    hints:
      - 'לכל מסה הזרוע ביחס לציר היא $R$. האם שתי התרומות לתנע הזוויתי באותו סימן?'

  - id: Q-3.8-pull-in
    type: twotier
    objectives: [OBJ-3.8-1]
    qualitative: true
    level: mid
    prompt: >-
      שתי דסקיות זהות על קרח חלק מחוברות בחוט, ומסתובבות סביב מרכז המסה שלהן. בתוך אחת מהן יש כננת קטנה, שמקצרת את
      החוט עד שהמרחק ביניהן קטן פי 2. מה קורה לתנע הזוויתי של המערכת ביחס למרכז המסה, ולאנרגיה הקינטית שלה?
    choices:
      - text: התנע הזוויתי לא משתנה, והאנרגיה הקינטית גדלה.
        correct: true
        feedback: >-
          נכון. הכוחות הפנימיים (המתיחות) פועלים לאורך הקו בין הדסקיות, ולכן לא משנים את $\vec L$. מ-$L = 2m\,rv$
          קבוע, $v$ גדלה פי 2, והאנרגיה הקינטית פי 4. את העבודה עשתה הכננת, על חשבון האנרגיה של הסוללה שלה.
      - text: שניהם לא משתנים, כי אין כוח חיצוני.
        feedback: >-
          בלי כוח חיצוני התנע והתנע הזוויתי נשמרים, אבל לא האנרגיה הקינטית: כוחות פנימיים יכולים לעשות עבודה, כי
          החלקים של המערכת זזים זה ביחס לזה.
        misconception: MC-3-no-external-force-K-conserved
      - text: שניהם גדלים, כי הדסקיות מסתובבות מהר יותר.
        feedback: >-
          המהירות הזוויתית אכן גדלה פי 4, אבל הזרוע קטנה פי 2: $L = 2m\,r^2\omega$ לא משתנה. סיבוב מהיר יותר לא
          אומר תנע זוויתי גדול יותר.
        misconception: MC-3-faster-spin-more-L
    reasons:
      - text: 'המומנט החיצוני אפס, אבל הכוחות הפנימיים עושים עבודה כשהמרחק בין הדסקיות משתנה.'
        correct: true
        feedback: 'זה הנימוק. $\vec L$ מגיב רק למומנט חיצוני; $K$ מגיבה לעבודה של **כל** הכוחות, גם הפנימיים.'
      - text: 'אנרגיה נשמרת תמיד, ולכן גם $K$ וגם $L$ נשמרים.'
        feedback: >-
          האנרגיה הכוללת נשמרת, אבל היא כוללת את האנרגיה הכימית בסוללה של הכננת. האנרגיה הקינטית לבדה גדלה, על
          חשבון הסוללה.
        misconception: MC-3-no-external-force-K-conserved
      - text: 'המהירות הזוויתית גדלה, ו-$L$ פרופורציוני לה.'
        feedback: '$L = I\omega$, ו-$I = 2m r^2$ קטן פי 4 כשהרדיוס קטן פי 2. המכפלה לא משתנה.'
        misconception: MC-3-faster-spin-more-L
    hints:
      - 'אילו כוחות פועלים על המערכת מבחוץ? ומה עושים הכוחות הפנימיים כשהדסקיות מתקרבות?'

  - id: Q-3.8-monkey-rope
    type: twotier
    objectives: [OBJ-3.8-1]
    qualitative: true
    level: bagrut
    prompt: >-
      חבל קל עובר על גלגלת קלה וחלקה. בצד אחד קוף נאחז בחבל, ובצד השני קשור שק בעל מסה שווה למסת הקוף. בהתחלה הכול
      במנוחה, ואז הקוף מתחיל לטפס על החבל. מה עושה השק?
    choices:
      - text: הוא עולה, בכל רגע באותה מהירות כמו הקוף (ביחס לקרקע).
        correct: true
        feedback: >-
          נכון. ביחס לציר הגלגלת, הכובד על הקוף ועל השק נותן מומנטים שווים והפוכים, והכוח מהציר עובר דרכו. לכן
          $\vec\tau_{\text{ext}} = 0$ ו-$L$ נשאר אפס: $mRv_{\text{monkey}} - mRv_{\text{bag}} = 0$. הם עולים יחד, ככל
          שהקוף מטפס מהר.
      - text: הוא נשאר במקום, כי הקוף רק מטפס על החבל ולא מושך את השק.
        feedback: >-
          כדי לטפס, הקוף מושך את החבל כלפי מטה בכוח גדול מהכובד עליו. החבל מעביר את המתיחות הזו לשק, והיא גדולה
          מהכובד על השק. השק מאיץ כלפי מעלה.
        misconception: MC-3-rope-climb-other-side-stays
      - text: הוא יורד, כי הקוף מושך את החבל כלפי מטה.
        feedback: >-
          הקוף מושך את החבל כלפי מטה בצד שלו, והמתיחות בחבל גדלה בשני הצדדים. בצד של השק החבל מושך כלפי **מעלה**.
      - text: הוא עולה, אבל לאט יותר מהקוף, כי הקוף הוא שמשקיע את המאמץ.
        feedback: >-
          המאמץ קובע את האנרגיה, לא את התנועה. על הקוף ועל השק פועלים אותם כוחות, מתיחות $T$ למעלה וכובד $mg$ למטה,
          ולכן יש להם אותה תאוצה.
        misconception: MC-3-rope-climb-other-side-stays
    reasons:
      - text: 'המומנט החיצוני ביחס לציר אפס, ולכן התנע הזוויתי, $mR(v_{\text{bag}} - v_{\text{monkey}})$, נשאר אפס.'
        correct: true
        feedback: 'זה הנימוק. אותה מסקנה מתקבלת מהחוק השני לכל אחד: $T - mg = ma$ לשניהם.'
      - text: הכוח של הקוף על החבל הוא כוח פנימי, ולכן הוא לא מזיז דבר במערכת.
        feedback: >-
          כוחות פנימיים לא משנים את התנע הזוויתי הכולל, אבל הם בהחלט מזיזים חלקים של המערכת: כאן הם מעלים גם את
          הקוף וגם את השק, כך שהתנע הזוויתי הכולל נשאר אפס.
        misconception: MC-3-rope-climb-other-side-stays
      - text: האנרגיה שהקוף משקיע מתחלקת שווה בשווה בינו ובין השק.
        feedback: 'האנרגיה אכן מתחלקת שווה, אבל זו תוצאה ולא נימוק. מה שקובע את המהירויות הוא שימור התנע הזוויתי.'
    hints:
      - 'רשמו את הכוחות החיצוניים על קוף + שק + חבל + גלגלת, ואת המומנטים שלהם ביחס לציר.'

  # ----------------------------------- OBJ-3.8-2 splitting L and K into CM and relative parts
  - id: Q-3.8-koenig-kinetic
    type: numeric
    objectives: [OBJ-3.8-2]
    level: basic
    prompt: >-
      על מסילה ישרה וחלקה, עגלה של $1.0\,\text{kg}$ נעה ב-$4.0\,\text{m/s}$ אל עגלה של $3.0\,\text{kg}$ שעומדת. מהי
      האנרגיה הקינטית של המערכת **ביחס למרכז המסה שלה**?
    answer: 6
    unit: J
    correctFeedback: >-
      נכון. $V = \dfrac{1.0\cdot4.0}{4.0} = 1.0\,\text{m/s}$. האנרגיה הכוללת $K = 8.0\,\text{J}$, החלק של מרכז המסה
      $\tfrac12MV^2 = 2.0\,\text{J}$, ולכן $K_{\text{rel}} = 6.0\,\text{J}$. בדיקה ישירה: ביחס למרכז המסה העגלות נעות
      ב-$3.0$ וב-$1.0\,\text{m/s}$, ו-$\tfrac12\cdot1\cdot9 + \tfrac12\cdot3\cdot1 = 6.0\,\text{J}$.
    wrongFeedback: 'מצאו את מהירות מרכז המסה, ואז השתמשו ב-$K = \tfrac12MV^2 + K_{\text{rel}}$.'
    commonWrong:
      - value: 2
        feedback: 'זה החלק של מרכז המסה, $\tfrac12MV^2$. השאלה שואלת על החלק היחסי, מה שנשאר אחריו.'
      - value: 8
        feedback: 'זו האנרגיה הקינטית הכוללת, במערכת המסילה. במערכת מרכז המסה המהירויות קטנות יותר.'
    hints:
      - 'המסה הכוללת $4.0\,\text{kg}$, והתנע הכולל $4.0\,\text{kg·m/s}$.'

  - id: Q-3.8-spin-origin
    type: mc
    objectives: [OBJ-3.8-2]
    qualitative: true
    level: mid
    prompt: >-
      את התנע הזוויתי של כדור הארץ ביחס לשמש מפרקים לשני חלקים: $\vec R\times M\vec V$, של מרכז המסה שנע במסלולו,
      ו-$\vec L_{\text{rel}}$, של הסיבוב העצמי ביחס למרכז המסה. אם מחשבים את התנע הזוויתי ביחס לנקודה אחרת, למשל כוכב
      רחוק, איזה חלק משתנה?
    choices:
      - text: רק החלק של מרכז המסה. הסיבוב העצמי זהה ביחס לכל נקודה.
        correct: true
        feedback: >-
          נכון. $\vec L_{\text{rel}} = \sum\vec r_i'\times m_i\vec v_i'$ מחושב עם מקומות ומהירויות **ביחס למרכז המסה**,
          ואין בו את הנקודה שנבחרה. כל התלות בנקודה נמצאת ב-$\vec R\times M\vec V$.
      - text: שני החלקים משתנים, כי תנע זוויתי תמיד תלוי בנקודה.
        feedback: >-
          התנע הזוויתי הכולל אכן תלוי בנקודה, אבל כל התלות נכנסת דרך $\vec R$, מקום מרכז המסה. הסיבוב העצמי נמדד ביחס
          למרכז המסה, ולא תלוי בנקודה.
        misconception: MC-3-L-independent-of-origin
      - text: רק הסיבוב העצמי משתנה, כי המסלול קבוע.
        feedback: 'המסלול לא משתנה, אבל $\vec R$, המקום של מרכז המסה, נמדד מהנקודה שבחרנו, ולכן $\vec R\times M\vec V$ משתנה.'
      - text: אף אחד, כי התנע הזוויתי של כדור הארץ נשמר.
        feedback: 'שימור הוא אי-תלות בזמן ביחס לנקודה נתונה, לא אי-תלות בנקודה. ביחס לשמש הוא נשמר, ובכל זאת ערכו תלוי בבחירה.'
    hints:
      - 'אילו גדלים בכל חלק נמדדים מהנקודה שנבחרה?'

  - id: Q-3.8-dumbbell-kinetic
    type: numeric
    objectives: [OBJ-3.8-2]
    level: mid
    prompt: >-
      משקולת: שתי מסות של $0.50\,\text{kg}$ בקצוות של מוט קל באורך $0.40\,\text{m}$, מחליקה על שולחן חלק. מרכז המסה
      שלה נע ב-$3.0\,\text{m/s}$, והיא מסתובבת סביבו ב-$10\,\text{rad/s}$. מהי האנרגיה הקינטית שלה?
    answer: 6.5
    unit: J
    correctFeedback: >-
      נכון. $K = \tfrac12MV^2 + K_{\text{rel}}$. מרכז המסה: $\tfrac12\cdot1.0\cdot3.0^2 = 4.5\,\text{J}$. כל מסה סובבת
      ברדיוס $0.20\,\text{m}$, במהירות $\omega r = 2.0\,\text{m/s}$ ביחס למרכז המסה:
      $K_{\text{rel}} = 2\cdot\tfrac12\cdot0.50\cdot2.0^2 = 2.0\,\text{J}$. סך הכול $6.5\,\text{J}$.
    wrongFeedback: 'חשבו בנפרד את האנרגיה של מרכז המסה, $\tfrac12MV^2$, ואת האנרגיה של הסיבוב ביחס אליו, וחברו.'
    commonWrong:
      - value: 4.5
        feedback: 'זה רק החלק של מרכז המסה. המסות גם סובבות סביבו, וזו אנרגיה קינטית נוספת.'
      - value: 2
        feedback: 'זה רק החלק של הסיבוב. מרכז המסה עצמו נע, ותורם $\tfrac12MV^2 = 4.5\,\text{J}$.'
      - value: 12.5
        feedback: 'לקחתם את אורך המוט כולו כרדיוס הסיבוב. כל מסה נמצאת חצי מוט ממרכז המסה, $0.20\,\text{m}$.'
    hints:
      - 'מרכז המסה באמצע המוט. באיזה רדיוס סובבת כל מסה?'

  - id: Q-3.8-dumbbell-L
    type: numeric
    objectives: [OBJ-3.8-2, OBJ-3.8-1]
    level: bagrut
    prompt: >-
      אותה משקולת ($2 \times 0.50\,\text{kg}$, מוט של $0.40\,\text{m}$) מחליקה על שולחן חלק. מרכז המסה שלה נע לאורך
      הקו $y = 2.0\,\text{m}$ בכיוון $+x$ ב-$3.0\,\text{m/s}$, והיא מסתובבת סביבו נגד כיוון השעון (במבט מלמעלה)
      ב-$10\,\text{rad/s}$. ציר $z$ פונה כלפי מעלה, כך שסיבוב נגד כיוון השעון חיובי. מהו $L_z$, התנע הזוויתי ביחס
      לראשית, ברגע כלשהו?
    answer: -5.6
    unit: kg·m²/s
    correctFeedback: >-
      נכון. $\vec L = \vec R\times M\vec V + \vec L_{\text{rel}}$. חלק מרכז המסה:
      $(\vec R\times M\vec V)_z = XMV_y - YMV_x = -2.0\cdot1.0\cdot3.0 = -6.0\,\text{kg·m}^2/\text{s}$ (עם כיוון השעון,
      כשמסתכלים מהראשית). הסיבוב: $L_{\text{rel}} = 2mr^2\omega = 2\cdot0.50\cdot0.20^2\cdot10 = +0.40\,\text{kg·m}^2/\text{s}$.
      סך הכול $L_z = -5.6\,\text{kg·m}^2/\text{s}$, קבוע בזמן כי אין מומנט חיצוני. **בדיקת גבולות:** ביחס לנקודה על קו
      התנועה, $Y = 0$, נשאר רק $L_{\text{rel}}$.
    wrongFeedback: 'חשבו בנפרד את התנע הזוויתי של מרכז המסה ביחס לראשית, ואת התנע הזוויתי של הסיבוב ביחס למרכז המסה, כל אחד עם הסימן שלו.'
    commonWrong:
      - value: -6
        feedback: 'זה רק החלק של מרכז המסה. המשקולת גם מסתובבת סביבו, ומוסיפה $L_{\text{rel}} = 0.40\,\text{kg·m}^2/\text{s}$.'
      - value: 6.4
        feedback: >-
          הסימן של חלק מרכז המסה הפוך. גוף שנע בכיוון $+x$ **מעל** הראשית חולף עליה עם כיוון השעון:
          $XV_y - YV_x = -YV_x < 0$.
      - value: 0.4
        feedback: 'זה רק הסיבוב העצמי. גם התנועה של מרכז המסה תורמת לתנע הזוויתי ביחס לראשית, כי הראשית לא על קו התנועה.'
        misconception: MC-3-straight-line-no-L
      - value: -6.4
        feedback: 'לקחתם את הסיבוב העצמי עם כיוון השעון. נגד כיוון השעון חיובי לפי הגדרת הציר.'
    hints:
      - 'חלק מרכז המסה הוא התנע הזוויתי של חלקיק אחד בעל מסה $1.0\,\text{kg}$ שנע בקו ישר.'
      - 'חלק הסיבוב: $L_{\text{rel}} = \sum m_ir_i^2\omega$, עם $r_i = 0.20\,\text{m}$.'

  - id: Q-3.8-max-loss
    type: mc
    objectives: [OBJ-3.8-2]
    qualitative: true
    level: bagrut
    prompt: >-
      שני גופים מתנגשים, ואין כוחות חיצוניים. האנרגיה הקינטית הכוללת לפני ההתנגשות היא $K = \tfrac12MV^2 + K_{\text{rel}}$.
      מהו החלק הגדול ביותר של האנרגיה הקינטית שיכול להפוך לחום?
    choices:
      - text: 'רק $K_{\text{rel}}$, והוא הופך כולו לחום כשהגופים נצמדים.'
        correct: true
        feedback: >-
          נכון. התנע הכולל $M\vec V$ נשמר, ולכן גם $\tfrac12MV^2$, החלק של מרכז המסה, לא יכול להשתנות. רק החלק היחסי
          יכול להיעלם, וזה קורה כשהגופים נעים יחד אחרי ההתנגשות, ב-$\vec V$. **בדיקה:** כשאחד הגופים כבד מאוד ועומד,
          $V \to 0$ ואפשר לאבד את כל האנרגיה, כמו בכדור שנתקע בקיר.
      - text: כל האנרגיה הקינטית, כשהגופים נעצרים.
        feedback: >-
          הגופים לא יכולים להיעצר שניהם אם התנע הכולל לא אפס. מרכז המסה ממשיך ב-$\vec V$, והאנרגיה $\tfrac12MV^2$
          נשארת קינטית.
        misconception: MC-3-all-kinetic-energy-can-be-lost
      - text: אף חלק, כי אנרגיה נשמרת.
        feedback: 'האנרגיה הכוללת נשמרת, אבל האנרגיה **הקינטית** יכולה להפוך לחום ולעיוות, כמו כשגופים נצמדים.'
        misconception: MC-3-kinetic-energy-conserved-in-collision
      - text: בדיוק מחצית, תמיד.
        feedback: 'החלק תלוי במסות ובמהירויות. מחצית מתקבלת במקרה מיוחד, למשל גוף שפוגע בגוף זהה שעומד.'
    hints:
      - 'איזה גודל נשמר בהתנגשות בלי כוחות חיצוניים, ואיזה חלק של $K$ הוא קובע?'

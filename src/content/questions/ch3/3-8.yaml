  - id: Q-3.8-skater-pole
    type: numeric
    objectives: [OBJ-3.8-2, OBJ-3.8-1]
    level: bagrut
    prompt: >-
      שני מחליקים על קרח, והזניחו את החיכוך. $B$, במסה $40\,\text{kg}$, עומד במקום ומחזיק קצה אחד של מוט קל באורך
      $1.0\,\text{m}$. $A$, במסה $60\,\text{kg}$, גולש במהירות $4.0\,\text{m/s}$ בקו ישר שהמרחק הניצב שלו מ-$B$ הוא
      $0.60\,\text{m}$. עוד לפני ש-$A$ חולף על פני $B$, ברגע שהמרחק ביניהם בדיוק $1.0\,\text{m}$, $A$ תופס את הקצה
      השני של המוט, ומאז שניהם מחזיקים בו חזק, והמרחק ביניהם נשאר $1.0\,\text{m}$. התייחסו לכל מחליק כאל חלקיק.
      כמה אנרגיה קינטית הפכה לחום ברגע התפיסה?
    answer: 123
    unit: J
    correctFeedback: >-
      נכון. אין כוח חיצוני אופקי, ולכן התנע הכולל נשמר, וגם $\tfrac12MV^2 = \tfrac12\cdot100\cdot2.4^2 = 288\,\text{J}$.
      המוט דוחף ומושך רק לאורך הקו בין המחליקים (הצורה החזקה של החוק השלישי), ולכן גם $L_{\text{rel}}$ נשמר. עם
      $\mu = \dfrac{60\cdot40}{100} = 24\,\text{kg}$: לפני התפיסה המהירות היחסית היא המהירות של $A$, והזרוע שלה ביחס
      ל-$B$ היא $b = 0.60\,\text{m}$, ולכן $L_{\text{rel}} = \mu bv = 57.6\,\text{kg·m}^2/\text{s}$ ו-$K_{\text{rel}} = \tfrac12\mu v^2 = 192\,\text{J}$.
      אחרי התפיסה המרחק קבוע, $d = 1.0\,\text{m}$, וכל התנועה היחסית היא סיבוב:
      $K_{\text{rel}} = \dfrac{L_{\text{rel}}^2}{2\mu d^2} = 69.1\,\text{J}$. האובדן: $192 - 69.1 = 123\,\text{J}$. **במילים:** המוט
      מאפס רק את רכיב המהירות היחסית לאורך המוט, $v_r = v\sqrt{1 - b^2/d^2} = 3.2\,\text{m/s}$, והאובדן הוא
      $\tfrac12\mu v_r^2$. **בדיקת גבולות:** כש-$d = b$, תפיסה ברגע שבו $A$ הכי קרוב ל-$B$, אין למהירות היחסית רכיב
      לאורך המוט, ולא אובדת אנרגיה; כש-$b = 0$, $A$ גולש ישר אל $B$, וכל $K_{\text{rel}}$ אובד.
    wrongFeedback: >-
      פרקו את האנרגיה הקינטית לפי משפט קניג. איזה חלק לא יכול להשתנות כשאין כוח חיצוני? ומה נשמר בחלק היחסי, כשהכוח
      של המוט פועל לאורך הקו בין המחליקים?
    commonWrong:
      - value: 192
        feedback: >-
          זו כל האנרגיה של התנועה היחסית, כאילו אחרי התפיסה אין תנועה יחסית. אבל $L_{\text{rel}}$ נשמר ואינו אפס, ולכן
          המחליקים ממשיכים להסתובב סביב מרכז המסה ושומרים $69.1\,\text{J}$.
      - value: 69.1
        feedback: 'זו האנרגיה של הסיבוב **אחרי** התפיסה, $L_{\text{rel}}^2/(2\mu d^2)$. האובדן הוא ההפרש בינה לבין $K_{\text{rel}}$ שלפני.'
      - value: 480
        feedback: >-
          זו כל האנרגיה הקינטית. מרכז המסה ממשיך לנוע ב-$2.4\,\text{m/s}$, כי התנע הכולל נשמר, ולכן $288\,\text{J}$ חייבים
          להישאר קינטיים.
        misconception: MC-3-all-kinetic-energy-can-be-lost
      - value: 288
        feedback: 'זה $\tfrac12MV^2$, החלק היחיד שהתפיסה **לא** יכולה לשנות: התנע הכולל נשמר.'
      - value: 0
        feedback: >-
          האנרגיה הקינטית נשמרת רק אם המוט לא משנה את המהירות היחסית. כאן, ברגע התפיסה, $A$ עוד מתקרב ל-$B$, והמוט
          עוצר בבת אחת את רכיב ההתקרבות.
        misconception: MC-3-kinetic-energy-conserved-in-collision
    hints:
      - 'אילו גדלים לא משתנים ברגע התפיסה? חשבו על התנע הכולל ועל הכיוון של הכוח שהמוט מפעיל על כל מחליק.'
      - >-
        לפני התפיסה $L_{\text{rel}} = \mu|\vec r\times\vec v|$, עם $\vec r$ ו-$\vec v$ המקום והמהירות של $A$ ביחס ל-$B$.
        אחרי, המרחק קבוע, ולכן $K_{\text{rel}} = \dfrac{L_{\text{rel}}^2}{2\mu d^2}$, כמו בסעיף "שתי מסות שמתקרבות זו
        לזו" בשיעור.

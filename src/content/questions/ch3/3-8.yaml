      הקו $y = 2.0\,\text{m}$ בכיוון $+x$ ב-$3.0\,\text{m/s}$, והיא מסתובבת סביבו נגד כיוון השעון (במבט מלמעלה)
      ב-$10\,\text{rad/s}$. ציר $z$ פונה כלפי מעלה, כך שסיבוב נגד כיוון השעון חיובי. מהו $L_z$, התנע הזוויתי ביחס
      לראשית, ברגע כלשהו?
    answer: -5.6
    unit: kg·m²/s
    correctFeedback: >-
      נכון. $\vec L = \vec R\times M\vec V + \vec L_{\text{rel}}$. חלק מרכז המסה:
      $(\vec R\times M\vec V)_z = XMV_y - YMV_x = -2.0\cdot1.0\cdot3.0 = -6.0\,\text{kg·m}^2/\text{s}$ (כלפי מטה,
      בכיוון $-z$: במבט מלמעלה, מרכז המסה חולף על פני הראשית עם כיוון השעון). הסיבוב: $L_{\text{rel}} = 2mr^2\omega = 2\cdot0.50\cdot0.20^2\cdot10 = +0.40\,\text{kg·m}^2/\text{s}$.
      סך הכול $L_z = -5.6\,\text{kg·m}^2/\text{s}$, קבוע בזמן כי אין מומנט חיצוני. **בדיקת גבולות:** ביחס לנקודה על קו
      התנועה, $Y = 0$, נשאר רק $L_{\text{rel}}$.
    wrongFeedback: 'חשבו בנפרד את התנע הזוויתי של מרכז המסה ביחס לראשית, ואת התנע הזוויתי של הסיבוב ביחס למרכז המסה, כל אחד עם הסימן שלו.'
    commonWrong:
      - value: -6
        feedback: 'זה רק החלק של מרכז המסה. המשקולת גם מסתובבת סביבו, ומוסיפה $L_{\text{rel}} = 0.40\,\text{kg·m}^2/\text{s}$.'

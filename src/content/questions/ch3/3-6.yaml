# Lesson 3.6 question bank: the comprehension ladder of "מסה משתנה: הרקטה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Rocket equation: M dv = −u dM (u the exhaust speed relative to the rocket), Δv = u ln(m0/m).
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q2.ts:
#   u = 2500 m/s, m0/m = 4: Δv = 3466 m/s (1875 from u·Δm/m0; 7500 from u·Δm/m);
#   two stages, u = 3000 m/s, 10 000 → 4000 kg, drop 1000 kg, 3000 → 1500 kg: Δv = 2749 + 2079 = 4828 m/s
#   (one stage 10 000 → 2500 kg: 4159; both casings dropped at the start, 10 000 → 1500: 5691);
#   lift-off, m0 = 5.0·10⁴ kg, u = 2800 m/s: |dm/dt| > m0 g/u = 175 kg/s (17.9 without g, 0.549 inverted);
#   vertical burn, u = 2500 m/s, m0/m = 3, t_b = 60 s: v = u ln 3 − g t_b = 2158 m/s (2746 without gravity,
#   3334 with its sign flipped);
#   cart at 2.0 m/s, sand 5.0 kg/s: F = v dm/dt = 10 N (5.0 from ½v dm/dt);
#   belt at 1.5 m/s, gravel 20 kg/s: P = v² dm/dt = 45 W, ½v² dm/dt = 22.5 W to kinetic energy, 22.5 W heat
#   (30 = v dm/dt is the force, in N).

chapter: 3
questions:
  # ------------------------------------------ OBJ-3.6-1 the rocket equation from momentum over dt
  - id: Q-3.6-exhaust-ground-velocity
    type: mc
    objectives: [OBJ-3.6-1]
    qualitative: true
    level: basic
    prompt: >-
      רקטה נעה בחלל במהירות $v$ (ביחס למערכת אינרציאלית), והגזים יוצאים ממנה אחורה במהירות $u$ **ביחס לרקטה**.
      בגזירת משוואת הרקטה כותבים את התנע לפני ואחרי פרק זמן קצר $dt$. מה המהירות של הגז שנפלט, ביחס למערכת
      האינרציאלית?
    choices:
      - text: '$v - u$ (עד כדי איבר זניח מסדר שני), בכיוון התנועה של הרקטה אם $v > u$.'
        correct: true
        feedback: >-
          נכון. מהירויות מתחברות: מהירות הגז היא מהירות הרקטה ועוד מהירות הגז ביחס אליה. עם זה שימור התנע נותן
          $Mv = (M + dM)(v + dv) + (-dM)(v - u)$, ואחרי צמצום $M\,dv = -u\,dM$.
      - text: '$-u$, אחורה, תמיד.'
        feedback: >-
          $u$ נמדדת ביחס לרקטה. במערכת שבה הרקטה נעה מהר, גם הגז יכול לנוע קדימה, רק לאט יותר ממנה. אם כותבים
          $v_{\text{gas}} = -u$ בשימור התנע, התוצאה תלויה במהירות של הרקטה, וזה לא נכון.
        misconception: MC-3-exhaust-speed-ground-frame
      - text: '$v + u$, כי הגז נדחף בכוח.'
        feedback: 'הגז נפלט **אחורה** ביחס לרקטה, ולכן מהירותו קטנה ממהירות הרקטה ב-$u$.'
      - text: אפס, כי הגז נשאר מאחור.
        feedback: 'הגז נשאר במנוחה רק במקרה המיוחד $v = u$. באופן כללי מהירותו $v - u$.'
        misconception: MC-3-exhaust-speed-ground-frame
    hints:
      - 'איך מחברים מהירות של גוף ביחס לרקטה עם מהירות הרקטה עצמה?'

  - id: Q-3.6-delta-v
    type: numeric
    objectives: [OBJ-3.6-1]
    level: basic
    prompt: >-
      רקטה בחלל, רחוק מכל גוף, מתחילה ממנוחה. מהירות הפליטה ביחס לרקטה היא $2500\,\text{m/s}$, ושלושה רבעים מהמסה
      ההתחלתית שלה הם דלק. מה מהירותה אחרי שכל הדלק נשרף?
    answer: 3466
    unit: m/s
    correctFeedback: >-
      נכון. $\Delta v = u\ln\dfrac{m_0}{m} = 2500\cdot\ln4 = 3466\,\text{m/s}$. שימו לב שהיא גדולה ממהירות הפליטה: לרקטה
      אין "מהירות מרבית", אבל כל תוספת דורשת יחס מסות גדול באקספוננט.
    wrongFeedback: 'אינטגרלו את $dv = -u\,\dfrac{dM}{M}$ מהמסה ההתחלתית $m_0$ עד המסה הסופית $m_0/4$.'
    commonWrong:
      - value: 1875
        feedback: >-
          חישבתם $u\cdot\dfrac{\Delta m}{m_0} = 2500\cdot\tfrac34$, כאילו כל הדלק נפלט בבת אחת מרקטה שמסתה $m_0$. במהלך
          השריפה הרקטה נעשית קלה יותר, וכל קילוגרם דלק מאיץ אותה יותר מהקודם: לכן לוגריתם.
      - value: 7500
        feedback: 'חישבתם $u\cdot\dfrac{\Delta m}{m}$, עם המסה **הסופית**. זה מגזים, כי בתחילת השריפה הרקטה כבדה. הלוגריתם הוא הדרך הנכונה לסכום.'
    hints:
      - 'אם שלושה רבעים הם דלק, מה היחס $m_0/m$ בסוף?'

  - id: Q-3.6-burn-rate
    type: twotier
    objectives: [OBJ-3.6-1]
    qualitative: true
    level: mid
    prompt: >-
      שתי רקטות זהות בחלל הרחוק, עם אותה כמות דלק ואותה מהירות פליטה. רקטה A שורפת את כל הדלק ב-$10\,\text{s}$, ורקטה
      B ב-$100\,\text{s}$. איזו מהן מגיעה למהירות סופית גדולה יותר?
    choices:
      - text: הן מגיעות לאותה מהירות סופית.
        correct: true
        feedback: >-
          נכון. $\Delta v = u\ln(m_0/m)$ תלויה רק ביחס המסות ובמהירות הפליטה. רקטה A מאיצה חזק יותר, אבל לזמן קצר
          יותר. (ליד כדור הארץ זה משתנה: שם שריפה איטית מפסידה $g\,t_b$.)
      - text: רקטה A, כי כוח הדחף שלה גדול פי 10.
        feedback: 'הדחף שלה אכן גדול פי 10, אבל הוא פועל עשירית מהזמן. המתקף שהגזים נותנים לרקטה זהה בשתיהן.'
        misconception: MC-3-thrust-means-delta-v
      - text: רקטה B, כי הדלק שלה פועל זמן רב יותר.
        feedback: 'הדחף של B קטן פי 10 מזה של A. זמן ארוך יותר בכוח קטן יותר נותן את אותו השינוי במהירות.'
        misconception: MC-3-thrust-means-delta-v
    reasons:
      - text: 'בגזירה $M\,dv = -u\,dM$ הזמן לא מופיע: כל קילוגרם דלק נותן את אותה תוספת מהירות, בכל קצב.'
        correct: true
        feedback: 'זה הנימוק. המשוואה מקשרת את $dv$ ל-$dM$ ישירות, ולכן גם האינטגרל שלה לא תלוי בקצב.'
      - text: כוח גדול יותר תמיד נותן שינוי מהירות גדול יותר.
        feedback: 'השינוי בתנע הוא המתקף, $\int F\,dt$, כוח **כפול זמן**. כוח גדול לזמן קצר יכול לתת את אותו מתקף.'
        misconception: MC-3-thrust-means-delta-v
      - text: האנרגיה של הדלק זהה, ולכן האנרגיה הקינטית של שתיהן זהה.
        feedback: >-
          התוצאה נכונה, אבל הנימוק לא מספיק: אנרגיה לבדה לא קובעת את המהירות, כי חלק מהאנרגיה נשאר בגזים. הנימוק
          הוא שימור התנע, שבו הזמן לא מופיע.
    hints:
      - 'האם $dt$ מופיע במשוואה $M\,dv = -u\,dM$?'

  - id: Q-3.6-two-stage
    type: numeric
    objectives: [OBJ-3.6-1]
    level: bagrut
    prompt: >-
      רקטה דו-שלבית בחלל, ממנוחה, עם מהירות פליטה $3000\,\text{m/s}$. המסה ההתחלתית $10\,000\,\text{kg}$: מטען של
      $1000\,\text{kg}$; שלב ראשון עם $6000\,\text{kg}$ דלק ומעטפת של $1000\,\text{kg}$; שלב שני עם $1500\,\text{kg}$
      דלק ומעטפת של $500\,\text{kg}$. כשהדלק של השלב הראשון נגמר, המעטפת שלו ננתקת (בלי לשנות את מהירות הרקטה),
      והשלב השני נדלק. מה המהירות הסופית?
    answer: 4828
    unit: m/s
    correctFeedback: >-
      נכון. שלב ראשון: $10\,000 \to 4000\,\text{kg}$, $\Delta v_1 = 3000\ln2.5 = 2749\,\text{m/s}$. אחרי הניתוק נשארים
      $3000\,\text{kg}$. שלב שני: $3000 \to 1500\,\text{kg}$, $\Delta v_2 = 3000\ln2 = 2079\,\text{m/s}$. סך הכול
      $4828\,\text{m/s}$, לעומת $3000\ln4 = 4159\,\text{m/s}$ לרקטה חד-שלבית שסוחבת את כל המעטפות עד הסוף.
      **בדיקת גבולות:** אם המעטפת של השלב הראשון חסרת מסה, הניתוק לא משנה דבר, ושתי הרקטות זהות.
    wrongFeedback: 'חשבו כל שלב בנפרד עם $u\ln(m_{\text{start}}/m_{\text{end}})$. בין השלבים המסה יורדת בלי לשנות את המהירות.'
    commonWrong:
      - value: 4159
        feedback: 'זו רקטה חד-שלבית, $10\,000 \to 2500\,\text{kg}$. שכחתם להוריד את המעטפת של השלב הראשון לפני שהשלב השני נדלק.'
      - value: 5691
        feedback: 'חישבתם $10\,000 \to 1500\,\text{kg}$, כאילו שתי המעטפות נעלמו כבר בהתחלה. המעטפת הראשונה נסחבת עד סוף השלב הראשון.'
    hints:
      - 'מה המסה מיד לפני הניתוק, ומה מיד אחריו?'

  # --------------------------- OBJ-3.6-2 a rocket in gravity, and mass added to a cart or a belt
  - id: Q-3.6-liftoff
    type: numeric
    objectives: [OBJ-3.6-2]
    level: basic
    prompt: >-
      רקטה בעלת מסה $5.0\cdot10^4\,\text{kg}$ עומדת על כן השיגור, ומהירות הפליטה שלה $2800\,\text{m/s}$. מהו קצב שריפת
      הדלק המזערי, בקילוגרמים לשנייה, שבו היא מתחילה לעלות?
    answer: 175
    unit: kg/s
    correctFeedback: >-
      נכון. כוח הדחף הוא $u\left|\dfrac{dm}{dt}\right|$, והוא צריך לעלות על הכובד:
      $\left|\dfrac{dm}{dt}\right| > \dfrac{mg}{u} = \dfrac{5.0\cdot10^4\cdot9.8}{2800} = 175\,\text{kg/s}$.
    wrongFeedback: 'השוו את כוח הדחף, מהירות הפליטה כפול קצב הפליטה, לכובד על הרקטה.'
    commonWrong:
      - value: 17.9
        feedback: 'חישבתם $m/u$, בלי $g$. הדחף צריך לאזן כוח, $mg$, ולא מסה. בדקו יחידות: $\text{kg}/(\text{m/s})$ אינו קצב.'
      - value: 0.549
        feedback: 'הפכתם את היחס. מ-$u\,|dm/dt| = mg$ יוצא $|dm/dt| = mg/u$.'
    hints:
      - 'כוח הדחף על הרקטה הוא $u\,|dm/dt|$.'

  - id: Q-3.6-gravity-loss
    type: numeric
    objectives: [OBJ-3.6-2]
    level: mid
    prompt: >-
      רקטה משוגרת אנכית ממנוחה, ליד פני כדור הארץ. מהירות הפליטה $2500\,\text{m/s}$, ושני שלישים מהמסה ההתחלתית הם
      דלק, שנשרף בקצב קבוע במשך $60\,\text{s}$. הזניחו את האוויר ואת השינוי ב-$g$ עם הגובה. מה מהירותה בסוף השריפה?
    answer: 2158
    unit: m/s
    correctFeedback: >-
      נכון. עם ציר כלפי מעלה, $M\dfrac{dv}{dt} = -u\dfrac{dM}{dt} - Mg$, ולכן $dv = -u\dfrac{dM}{M} - g\,dt$. אחרי
      אינטגרציה: $v = u\ln\dfrac{m_0}{m} - gt_b = 2500\ln3 - 9.8\cdot60 = 2746 - 588 = 2158\,\text{m/s}$.
      **בדיקת גבולות:** כש-$g \to 0$ חוזרים למשוואת הרקטה בחלל; וכש-$t_b \to 0$ ההפסד לכובד נעלם.
    wrongFeedback: 'הוסיפו לשימור התנע את המתקף של הכובד, $J = -Mg\,dt$. איזה איבר נוסף מופיע ב-$dv$?'
    commonWrong:
      - value: 2746
        feedback: 'זו המהירות בחלל, $u\ln3$. ליד כדור הארץ הכובד מוריד $g$ מהמהירות בכל שנייה של השריפה.'
        misconception: MC-3-gravity-loss-ignored
      - value: 3334
        feedback: 'הוספתם $gt_b$ במקום להחסיר. הכובד פועל נגד העלייה.'
    hints:
      - 'הכובד נותן מתקף $J = -Mg\,dt$ בכל פרק זמן $dt$.'

  - id: Q-3.6-sand-cart
    type: numeric
    objectives: [OBJ-3.6-2]
    level: mid
    prompt: >-
      עגלה נוסעת על מסילה אופקית חלקה במהירות קבועה $2.0\,\text{m/s}$. ממשפך שמעליה נופל לתוכה חול, אנכית, בקצב של
      $5.0\,\text{kg/s}$. איזה כוח אופקי צריך להפעיל על העגלה כדי שמהירותה תישאר קבועה?
    answer: 10
    unit: N
    correctFeedback: >-
      נכון. לחול אין תנע אופקי כשהוא נופל, וכל קילוגרם שנכנס צריך לקבל $2.0\,\text{m/s}$. לכן
      $F = \dfrac{dP}{dt} = v\dfrac{dM}{dt} = 2.0\cdot5.0 = 10\,\text{N}$, גם כשהמהירות קבועה.
    wrongFeedback: 'כתבו את התנע האופקי של עגלה + חול, $P = Mv$, וגזרו אותו לפי הזמן כש-$v$ קבוע ו-$M$ גדל.'
    commonWrong:
      - value: 0
        feedback: >-
          מהירות קבועה לא אומרת כוח אפס כשהמסה משתנה. החוק השני הוא $F = dP/dt$, והתנע גדל כי המסה שנעה גדלה.
        misconception: MC-3-constant-velocity-no-force
      - value: 5
        feedback: 'חישבתם $\tfrac12v\,dM/dt$, כאילו הכוח מגיע מקצב האנרגיה הקינטית. הכוח הוא קצב השינוי בתנע: $v\,dM/dt$.'
    hints:
      - 'כמה תנע אופקי נכנס לעגלה בכל שנייה?'

  - id: Q-3.6-belt-power
    type: numeric
    objectives: [OBJ-3.6-2]
    level: mid
    prompt: >-
      חצץ נופל אנכית על מסוע אופקי בקצב של $20\,\text{kg/s}$, והמסוע נע במהירות קבועה $1.5\,\text{m/s}$. החצץ מחליק
      מעט על המסוע עד שהוא נע איתו. איזה הספק צריך המנוע לספק כדי לשמור על מהירות המסוע?
    answer: 45
    unit: W
    correctFeedback: >-
      נכון. הכוח הוא $F = v\,\dfrac{dm}{dt} = 1.5\cdot20 = 30\,\text{N}$, וההספק $P = Fv = v^2\dfrac{dm}{dt} = 45\,\text{W}$.
      רק מחציתו, $22.5\,\text{W}$, הופכת לאנרגיה קינטית של החצץ.
    wrongFeedback: 'מצאו קודם את הכוח, קצב השינוי בתנע של החצץ, והכפילו במהירות של המסוע.'
    commonWrong:
      - value: 22.5
        feedback: >-
          זה קצב העלייה באנרגיה הקינטית של החצץ, $\tfrac12v^2\,dm/dt$. המנוע מספק יותר: חלק מהעבודה שלו הולך לחום
          בזמן שהחצץ מחליק על המסוע.
        misconception: MC-3-belt-power-equals-ke-rate
      - value: 30
        feedback: 'זה הכוח, $v\,dm/dt$, בניוטון. ההספק הוא הכוח כפול המהירות.'
    hints:
      - 'הספק של כוח: $P = Fv$.'

  - id: Q-3.6-belt-half-lost
    type: twotier
    objectives: [OBJ-3.6-2]
    qualitative: true
    level: bagrut
    prompt: >-
      חצץ נופל אנכית על מסוע שנע במהירות קבועה $v$, בקצב $\mu$ קילוגרמים לשנייה. המנוע מספק הספק $v^2\mu$, ואילו
      האנרגיה הקינטית של החצץ גדלה בקצב $\tfrac12v^2\mu$. לאן הולכת המחצית השנייה, ואיך היא תלויה במקדם החיכוך בין
      החצץ למסוע?
    choices:
      - text: היא הופכת לחום בזמן שהחצץ מחליק על המסוע, והיא תמיד מחצית, בכל מקדם חיכוך.
        correct: true
        feedback: >-
          נכון. במערכת של המסוע, החצץ נוחת עם מהירות אופקית $v$ אחורה, והחיכוך עוצר אותה: כל האנרגיה הקינטית של
          התנועה האופקית הזו, $\tfrac12v^2$ לכל קילוגרם, הופכת לחום. (האנרגיה של הנפילה האנכית אובדת בנחיתה, אבל היא
          לא באה מהמנוע.) זה לא תלוי בחיכוך: חיכוך גדול עוצר מהר, על דרך קצרה; חיכוך קטן עוצר לאט, על דרך ארוכה.
          העבודה זהה.
      - text: היא הופכת לחום, ובחיכוך גדול מספיק אפשר להקטין אותה כמעט לאפס.
        feedback: >-
          חיכוך גדול יותר מקצר את דרך ההחלקה באותו יחס שבו הוא מגדיל את הכוח. החום ליחידת מסה הוא תמיד
          $\tfrac12v^2$, האנרגיה הקינטית של החצץ ביחס למסוע.

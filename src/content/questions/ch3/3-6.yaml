# Lesson 3.6 question bank: the comprehension ladder of "מסה משתנה: הרקטה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Rocket equation: M dv = −u dM (u the exhaust speed relative to the rocket), Δv = u ln(m0/m).
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q2.ts:
#   u = 2500 m/s, m0/m = 4: Δv = 3466 m/s (1875 from u·Δm/m0; 7500 from u·Δm/m);
#   two stages, u = 3000 m/s, 10 000 → 4000 kg, drop 1000 kg, 3000 → 1500 kg: Δv = 2749 + 2079 = 4828 m/s
#   (one stage 10 000 → 2500 kg: 4159; both casings dropped at the start, 10 000 → 1500: 5691);
#   lift-off, m0 = 5.0·10⁴ kg, u = 2800 m/s: |dm/dt| > m0 g/u = 175 kg/s (17.9 without g, 0.549 inverted);
#   vertical burn, u = 2500 m/s, m0/m = 3, t_b = 60 s: v = u ln 3 − g t_b = 2159 m/s (2747 without gravity,
#   3335 with its sign flipped; u ln 3 = 2746.53, so each rounds up: review .scratch/review/ch3/r36.ts);
#   cart at 2.0 m/s, sand 5.0 kg/s: F = v dm/dt = 10 N (5.0 from ½v dm/dt);
#   belt at 1.5 m/s, gravel 20 kg/s: P = v² dm/dt = 45 W, ½v² dm/dt = 22.5 W to kinetic energy, 22.5 W heat
#   (30 = v dm/dt is the force, in N).
# Added with the lesson (2026-11-10), in .scratch/ch3/3-6/numbers.ts against src/physics/rocket.ts:
#   late lift-off, m0 = 3.0·10⁴ kg, m1 = 1.2·10⁴ kg, u = 2400 m/s, 100 kg/s: thrust 2.4·10⁵ N < m0 g = 2.94·10⁵ N,
#   lift-off at M = uμ/g = 24 490 kg, t_l = 55.1 s, t_b = 180 s, v_b = u ln(24 490/12 000) − g (t_b − t_l) = 488 m/s
#   (435 with the pad ignored, 2199 in free space, 1712 with no gravity loss after lift-off; RK4 agrees);
#   chute, belt 2.5 m/s, gravel 16 kg/s landing at 1.0 m/s along the belt: F = 24 N, motor 60 W, kinetic 42 W,
#   heat ½μ(v − w)² = 18 W (50 = ½μv² with w ignored).
# Review fixes (2026-11-10), in .scratch/ch3/3-6/review2.ts against src/physics/rocket.ts:
#   throw-forward, cart 250 kg at 4.0 m/s, gravel thrown forward at 6.0 m/s relative to the cart, 5.0 kg/s:
#   a = −w_rel μ/M = −0.12 m/s² (+0.12 the rocket formula copied, −0.04 gravel at 6.0 m/s in the ground frame,
#   +0.08 from F = d(Mv)/dt written blindly);  late-liftoff 975 = u ln(m0/m1) − g (t_b − t_l) (2199 − 1224);
#   chute-heat 10 = 60 − ½v²μ (the gravel's initial ½w²μ forgotten);  liftoff 0.549 = u g/m0;
#   gravity-loss thrust/weight at ignition u(⅔ m0/60 s)/(m0 g) = 2.83.
# Notation follows the lesson: M the current mass, m0 and m1 the initial and final masses, μ the burn rate (or the
# rate at which sand or gravel arrives).
# Belt-half-lost is mid since the lesson shows the half-and-half split; the exam rungs of OBJ-3.6-2 are
# late-liftoff and chute-heat, which climb above the lesson's formulas.

chapter: 3
questions:
  # ------------------------------------------ OBJ-3.6-1 the rocket equation from momentum over dt
  - id: Q-3.6-exhaust-ground-velocity
    type: mc
    objectives: [OBJ-3.6-1]
    qualitative: true
    level: basic
    prompt: >-
      רקטה נעה בחלל במהירות $v$ (ביחס למערכת אינרציאלית), והגזים יוצאים ממנה אחורה במהירות $u$ **ביחס לרקטה**.
      בגזירת משוואת הרקטה כותבים את התנע לפני ואחרי פרק זמן קצר $dt$. מה המהירות של הגז שנפלט, ביחס למערכת
      האינרציאלית?
    choices:
      - text: '$v - u$ (בדיוק $v + dv - u$, אבל $dv$ זניח כאן), בכיוון התנועה של הרקטה אם $v > u$.'
        correct: true
        feedback: >-
          נכון. מהירויות מתחברות: מהירות הגז היא מהירות הרקטה אחרי הפליטה, $v + dv$, ועוד מהירות הגז ביחס אליה,
          $(-u)$. שימור התנע נותן $Mv = (M + dM)(v + dv) + (-dM)(v + dv - u)$, ואחרי צמצום $M\,dv = -u\,dM$. אילו
          כתבתם $v - u$, ההבדל היה $(-dM)\,dv$, מכפלה של שני שינויים קטנים, שאחרי חלוקה ב-$dt$ שואפת לאפס.
      - text: '$-u$, אחורה, תמיד.'
        feedback: >-
          $u$ נמדדת ביחס לרקטה. במערכת שבה הרקטה נעה מהר, גם הגז יכול לנוע קדימה, רק לאט יותר ממנה. אם כותבים
          $v_{\text{gas}} = -u$ בשימור התנע, התוצאה תלויה במהירות של הרקטה, וזה לא נכון.
        misconception: MC-3-exhaust-speed-ground-frame
      - text: '$v + u$, כי הגז נדחף בכוח.'
        feedback: 'הגז נפלט **אחורה** ביחס לרקטה, ולכן מהירותו קטנה ממהירות הרקטה ב-$u$.'
      - text: אפס, כי הגז נשאר מאחור.
        feedback: 'הגז נשאר במנוחה רק במקרה המיוחד $v = u$. באופן כללי מהירותו $v - u$.'
        misconception: MC-3-exhaust-speed-ground-frame
    hints:
      - 'איך מחברים מהירות של גוף ביחס לרקטה עם מהירות הרקטה עצמה?'

  - id: Q-3.6-delta-v
    type: numeric
    objectives: [OBJ-3.6-1]
    level: basic
    prompt: >-
      רקטה בחלל, רחוק מכל גוף, מתחילה ממנוחה. מהירות הפליטה ביחס לרקטה היא $2500\,\text{m/s}$, ושלושה רבעים מהמסה
      ההתחלתית שלה הם דלק. מה מהירותה אחרי שכל הדלק נשרף?
    answer: 3466
    unit: m/s
    correctFeedback: >-
      נכון. $\Delta v = u\ln\dfrac{m_0}{m_1} = 2500\cdot\ln4 = 3466\,\text{m/s}$. שימו לב שהיא גדולה ממהירות הפליטה: לרקטה
      אין "מהירות מרבית", אבל כל תוספת דורשת יחס מסות גדול באקספוננט.
    wrongFeedback: 'בצעו אינטגרל על $dv = -u\,\dfrac{dM}{M}$, מהמסה ההתחלתית $m_0$ עד המסה הסופית $m_1 = m_0/4$.'
    commonWrong:
      - value: 1875
        feedback: >-
          חישבתם $u\cdot\dfrac{\Delta m}{m_0} = 2500\cdot\tfrac34$, כאילו כל הדלק נפלט בבת אחת מרקטה שמסתה $m_0$. במהלך
          השריפה הרקטה נעשית קלה יותר, וכל קילוגרם דלק מאיץ אותה יותר מהקודם: לכן לוגריתם.
      - value: 7500
        feedback: 'חישבתם $u\cdot\dfrac{\Delta m}{m_1}$, עם המסה **הסופית** $m_1$. זה מגזים, כי בתחילת השריפה הרקטה כבדה. הלוגריתם הוא הדרך הנכונה לסכום.'
    hints:
      - 'אם שלושה רבעים הם דלק, מה היחס $m_0/m_1$ בין המסה ההתחלתית למסה הסופית?'

  - id: Q-3.6-burn-rate
    type: twotier
    objectives: [OBJ-3.6-1]
    qualitative: true
    level: mid
    prompt: >-
      שתי רקטות זהות בחלל הרחוק, עם אותה כמות דלק ואותה מהירות פליטה. רקטה A שורפת את כל הדלק ב-$10\,\text{s}$, ורקטה
      B ב-$100\,\text{s}$. איזו מהן מגיעה למהירות סופית גדולה יותר?
    choices:
      - text: הן מגיעות לאותה מהירות סופית.
        correct: true
        feedback: >-
          נכון. $\Delta v = u\ln(m_0/m)$ תלויה רק ביחס המסות ובמהירות הפליטה. רקטה A מאיצה חזק יותר, אבל לזמן קצר
          יותר. (ליד כדור הארץ זה משתנה: שם שריפה איטית מפסידה $g\,t_b$.)
      - text: רקטה A, כי כוח הדחף שלה גדול פי 10.
        feedback: 'הדחף שלה אכן גדול פי 10, אבל הוא פועל עשירית מהזמן. המתקף שהגזים נותנים לרקטה זהה בשתיהן.'
        misconception: MC-3-thrust-means-delta-v
      - text: רקטה B, כי הדלק שלה פועל זמן רב יותר.
        feedback: 'הדחף של B קטן פי 10 מזה של A. זמן ארוך יותר בכוח קטן יותר נותן את אותו השינוי במהירות.'
        misconception: MC-3-thrust-means-delta-v
    reasons:
      - text: 'בגזירה $M\,dv = -u\,dM$ הזמן לא מופיע: כל קילוגרם דלק נותן את אותה תוספת מהירות, בכל קצב.'
        correct: true
        feedback: 'זה הנימוק. המשוואה מקשרת את $dv$ ל-$dM$ ישירות, ולכן גם האינטגרל שלה לא תלוי בקצב.'
      - text: כוח גדול יותר תמיד נותן שינוי מהירות גדול יותר.
        feedback: 'השינוי בתנע הוא המתקף, $\int F\,dt$, כוח **כפול זמן**. כוח גדול לזמן קצר יכול לתת את אותו מתקף.'
        misconception: MC-3-thrust-means-delta-v
      - text: האנרגיה של הדלק זהה, ולכן האנרגיה הקינטית של שתיהן זהה.
        feedback: >-
          התוצאה נכונה, אבל הנימוק לא מספיק: אנרגיה לבדה לא קובעת את המהירות, כי חלק מהאנרגיה נשאר בגזים. הנימוק
          הוא שימור התנע, שבו הזמן לא מופיע.
    hints:
      - 'האם $dt$ מופיע במשוואה $M\,dv = -u\,dM$?'

  - id: Q-3.6-throw-forward
    type: numeric
    objectives: [OBJ-3.6-1]
    level: mid
    prompt: >-
      עגלה נוסעת על מסילה אופקית חלקה, ואין עליה כוח אופקי. ברגע מסוים מסתה, יחד עם הפועל והחצץ שעליה,
      $M = 250\,\text{kg}$, ומהירותה $v = 4.0\,\text{m/s}$. הפועל זורק חצץ **קדימה**, בכיוון התנועה, במהירות
      $6.0\,\text{m/s}$ ביחס לעגלה, בקצב $\mu = 5.0\,\text{kg/s}$. כתבו את התנע של העגלה ושל החצץ שנזרק בפרק זמן קצר
      $dt$, לפני ואחרי. עם ציר בכיוון התנועה, מה התאוצה של העגלה ברגע הזה (עם סימן)?
    answer: -0.12
    unit: m/s²
    correctFeedback: >-
      נכון. המערכת: העגלה ועוד החצץ $(-dM)$ שנזרק בין $t$ ל-$t + dt$. לפני: $Mv$. אחרי: העגלה, $(M + dM)(v + dv)$, והחצץ
      במהירות $v + dv + 6.0$ ביחס לקרקע, $(-dM)(v + dv + 6.0)$. אין כוח אופקי, ולכן התנע נשמר; $v\,dM$ ו-$dM\,dv$
      מתקזזים, ונשאר $M\,dv = 6.0\,dM$. עם $dM = -\mu\,dt$:
      $a = -\dfrac{6.0\cdot5.0}{250} = -0.12\,\text{m/s}^2$. העגלה מאטה, כמו רקטה שהפנו את המנוע שלה קדימה.
      **בדיקת גבולות:** כש-$\mu \to 0$ אין תאוצה, וכשהחצץ נזרק במהירות $0$ ביחס לעגלה, הוא פשוט נשאר מאחור באותה
      מהירות, ושוב $a = 0$.
    wrongFeedback: >-
      כתבו את מהירות החצץ שנזרק ביחס לקרקע: מהירות העגלה ועוד מהירותו ביחס לעגלה. ואז השוו את התנע לפני ואחרי.
    commonWrong:
      - value: 0.12
        feedback: >-
          זו התאוצה של רקטה שפולטת **אחורה**, $u\mu/M$. כאן החצץ נזרק קדימה, ולכן מהירותו ביחס לעגלה היא $+6.0$ ולא
          $(-6.0)$: העגלה נדחפת אחורה, ומאטה.
      - value: -0.04
        feedback: >-
          כתבתם את מהירות החצץ $6.0\,\text{m/s}$ ביחס לקרקע, ואז קיבלתם $M\,dv = (6.0 - v)\,dM$. אבל $6.0\,\text{m/s}$ היא
          המהירות ביחס לעגלה; ביחס לקרקע החצץ נע ב-$v + 6.0 = 10.0\,\text{m/s}$.
        misconception: MC-3-exhaust-speed-ground-frame
      - value: 0.08
        feedback: >-
          כתבתם $0 = \dfrac{d(Mv)}{dt} = M\dfrac{dv}{dt} + v\dfrac{dM}{dt}$ לעגלה לבדה, ושכחתם את התנע שהחצץ לוקח איתו.
          לפי זה עגלה שזורקת חצץ **קדימה** הייתה מאיצה. החוק השני חל על אוסף קבוע של חלקיקים: העגלה **ועוד** החצץ
          שנזרק ב-$dt$.
        misconception: MC-3-fdmvdt-blind
    hints:
      - 'באיזו מהירות, ביחס לקרקע, נע החצץ ברגע שהוא עוזב את העגלה?'
      - 'מה מתקזז כשפותחים את הסוגריים, ומה נשאר?'

  - id: Q-3.6-two-stage
    type: numeric
    objectives: [OBJ-3.6-1]
    level: bagrut
    prompt: >-
      רקטה דו-שלבית בחלל, ממנוחה, עם מהירות פליטה $3000\,\text{m/s}$. המסה ההתחלתית $10\,000\,\text{kg}$: מטען של
      $1000\,\text{kg}$; שלב ראשון עם $6000\,\text{kg}$ דלק ומעטפת של $1000\,\text{kg}$; שלב שני עם $1500\,\text{kg}$
      דלק ומעטפת של $500\,\text{kg}$. כשהדלק של השלב הראשון נגמר, המעטפת שלו ננתקת (בלי לשנות את מהירות הרקטה),
      והשלב השני נדלק. מה המהירות הסופית?
    answer: 4828
    unit: m/s
    correctFeedback: >-
      נכון. שלב ראשון: $10\,000 \to 4000\,\text{kg}$, $\Delta v_1 = 3000\ln2.5 = 2749\,\text{m/s}$. אחרי הניתוק נשארים
      $3000\,\text{kg}$. שלב שני: $3000 \to 1500\,\text{kg}$, $\Delta v_2 = 3000\ln2 = 2079\,\text{m/s}$. סך הכול
      $4828\,\text{m/s}$, לעומת $3000\ln4 = 4159\,\text{m/s}$ לרקטה חד-שלבית שסוחבת את כל המעטפות עד הסוף.
      **בדיקת גבולות:** אם המעטפת של השלב הראשון חסרת מסה, הניתוק לא משנה דבר, ושתי הרקטות זהות.
    wrongFeedback: 'חשבו כל שלב בנפרד עם $u\ln(m_{\text{start}}/m_{\text{end}})$. בין השלבים המסה יורדת בלי לשנות את המהירות.'
    commonWrong:
      - value: 4159
        feedback: 'זו רקטה חד-שלבית, $10\,000 \to 2500\,\text{kg}$. שכחתם להוריד את המעטפת של השלב הראשון לפני שהשלב השני נדלק.'
      - value: 5691
        feedback: 'חישבתם $10\,000 \to 1500\,\text{kg}$, כאילו שתי המעטפות נעלמו כבר בהתחלה. המעטפת הראשונה נסחבת עד סוף השלב הראשון.'
    hints:
      - 'מה המסה מיד לפני הניתוק, ומה מיד אחריו?'

  # --------------------------- OBJ-3.6-2 a rocket in gravity, and mass added to a cart or a belt
  - id: Q-3.6-liftoff
    type: numeric
    objectives: [OBJ-3.6-2]
    level: basic
    prompt: >-
      רקטה בעלת מסה $m_0 = 5.0\cdot10^4\,\text{kg}$ עומדת על כן השיגור, ומהירות הפליטה שלה $u = 2800\,\text{m/s}$. מהו
      קצב השריפה המזערי $\mu$ (המסה שנפלטת בכל שנייה), בקילוגרמים לשנייה, שבו היא מתחילה לעלות?
    answer: 175
    unit: kg/s
    correctFeedback: >-
      נכון. כוח הדחף הוא $u\mu$, והוא צריך לעלות על הכובד ברגע ההצתה:
      $\mu > \dfrac{m_0g}{u} = \dfrac{5.0\cdot10^4\cdot9.8}{2800} = 175\,\text{kg/s}$.
    wrongFeedback: 'השוו את כוח הדחף, מהירות הפליטה כפול קצב השריפה, לכובד על הרקטה.'
    commonWrong:
      - value: 17.9
        feedback: 'חישבתם $m_0/u$, בלי $g$. הדחף צריך לאזן כוח, $m_0g$, ולא מסה. בדקו יחידות: $\text{kg}/(\text{m/s})$ אינו קצב.'
      - value: 0.549
        feedback: >-
          חישבתם $ug/m_0$: החלפתם בין $u$ ל-$m_0$ כשבודדתם את $\mu$. מ-$u\mu = m_0g$ יוצא $\mu = m_0g/u$. בדיקת יחידות
          תופסת את זה: $\text{m/s}\cdot\text{m/s}^2/\text{kg}$ אינו $\text{kg/s}$.
    hints:
      - 'כוח הדחף על הרקטה הוא $u\mu$.'

  - id: Q-3.6-gravity-loss
    type: numeric
    objectives: [OBJ-3.6-2]
    level: mid
    prompt: >-
      רקטה משוגרת אנכית ממנוחה, ליד פני כדור הארץ. מהירות הפליטה $2500\,\text{m/s}$, ושני שלישים מהמסה ההתחלתית הם
      דלק, שנשרף בקצב קבוע במשך $60\,\text{s}$. הזניחו את האוויר ואת השינוי ב-$g$ עם הגובה. מה מהירותה בסוף השריפה?
    answer: 2159
    unit: m/s
    correctFeedback: >-
      נכון. קודם בודקים שהיא מתרוממת מיד: קצב השריפה $\mu = \tfrac23m_0/60\,\text{s}$, ולכן היחס בין הדחף לכובד ברגע
      ההצתה, $u\mu/(m_0g) = 2500\cdot\tfrac23/(60\cdot9.8) = 2.83$, גדול מ-1 (והוא לא תלוי ב-$m_0$). עם ציר כלפי
      מעלה, $M\dfrac{dv}{dt} = u\mu - Mg$, ולכן $dv = -u\dfrac{dM}{M} - g\,dt$. אחרי אינטגרציה, מ-$m_0$ עד
      $m_1 = m_0/3$: $v = u\ln\dfrac{m_0}{m_1} - gt_b = 2500\ln3 - 9.8\cdot60 = 2747 - 588 = 2159\,\text{m/s}$.
      **בדיקת גבולות:** כש-$g \to 0$ חוזרים למשוואת הרקטה בחלל; וכש-$t_b \to 0$ ההפסד לכובד נעלם.

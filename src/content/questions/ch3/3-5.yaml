# Lesson 3.5 question bank: the comprehension ladder of "תנע, מתקף ושימור תנע".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8), in .scratch/ch3/q.ts and q2.ts:
#   triangle pulse, peak 600 N, 0.010 s: J = 3.0 N·s (6.0 from F_max·Δt);
#   0.20 kg ball, 15 m/s in, 12 m/s out, 0.0050 s: Δp = 5.4 N·s, F_avg = 1080 N (120 from 15 − 12);
#   F = F0 sin(πt/T), F0 = 50 N, T = 0.20 s, m = 0.40 kg, v0 = −2.0 m/s: J = 2F0T/π = 6.37 N·s, v = 13.9 m/s
#   (23 from F0·T, 10.5 from F0·T/2, 15.9 without v0);
#   50 g bullet at 300 m/s into a 1.0 kg block: v = 15/1.05 = 14.3 m/s (15 without the bullet's mass,
#   65.5 from energy conservation);
#   20 kg cart at 3.0 m/s, 5.0 kg bag dropped on it: v = 60/25 = 2.4 m/s;
#   wedge M = 3.0 kg, 30°, block m = 1.0 kg from h = 0.45 m, all frictionless: wedge V = 0.713 m/s
#   (closed form √(2gh m²cos²θ / ((M+m)(M + m sin²θ))); 0.643 from the fixed-wedge speed; 0.990 from
#   m√(2gh)/M; 1.71 from giving the wedge all of mgh).

chapter: 3
questions:
  # ------------------------------------------------ OBJ-3.5-1 impulse as ∫F dt, and Δp
  - id: Q-3.5-triangle-impulse
    type: numeric
    objectives: [OBJ-3.5-1]
    level: basic
    prompt: >-
      מחבט פוגע בכדור. הכוח על הכדור עולה בקו ישר מאפס ל-$600\,\text{N}$ ויורד בקו ישר חזרה לאפס, והמגע כולו נמשך
      $0.010\,\text{s}$. מה גודל המתקף שהמחבט נותן לכדור?
    answer: 3
    unit: N·s
    correctFeedback: >-
      נכון. המתקף הוא $J = \int F\,dt$, השטח מתחת לגרף הכוח-זמן. כאן זה משולש:
      $J = \tfrac12\cdot600\cdot0.010 = 3.0\,\text{N·s}$, וזה גם השינוי בתנע של הכדור.
    wrongFeedback: 'המתקף הוא השטח מתחת לגרף $F(t)$. מה השטח של משולש?'
    commonWrong:
      - value: 6
        feedback: 'כפלתם את הכוח **המרבי** בזמן. הכוח היה $600\,\text{N}$ רק לרגע; הכוח הממוצע הוא $300\,\text{N}$.'
    hints:
      - 'שרטטו את $F(t)$. איזו צורה מתקבלת?'

  - id: Q-3.5-cushion
    type: mc
    objectives: [OBJ-3.5-1]
    qualitative: true
    level: basic
    prompt: >-
      ביצה נופלת מאותו גובה פעם על בטון ופעם על כרית, ובשתי הפעמים נעצרת בלי לקפוץ. למה על הכרית היא לא נשברת?
    choices:
      - text: השינוי בתנע זהה, אבל על הכרית הוא נמשך זמן רב יותר, ולכן הכוח הממוצע קטן יותר.
        correct: true
        feedback: >-
          נכון. בשני המקרים $\Delta p = mv$, ולכן גם המתקף $\bar F\,\Delta t$ זהה. הכרית מאריכה את $\Delta t$, ובאותו
          יחס מקטינה את $\bar F$.
      - text: הכרית נותנת לביצה מתקף קטן יותר.
        feedback: >-
          המתקף שווה לשינוי בתנע, והביצה נעצרת בשני המקרים מאותה מהירות. לכן המתקף זהה. מה שהכרית משנה הוא הזמן
          שעל פניו הוא מתפזר.
        misconception: MC-3-soft-landing-less-impulse
      - text: הכרית מקטינה את מהירות הביצה לפני הפגיעה.
        feedback: 'הביצה פוגעת בשני המשטחים באותה מהירות, $\sqrt{2gh}$. ההבדל מתחיל רק כשהיא כבר נוגעת במשטח.'
      - text: על הכרית התנע של הביצה נשמר.
        feedback: 'גם על הכרית הביצה נעצרת, והתנע שלה יורד לאפס. הכרית מפעילה עליה כוח חיצוני, רק קטן יותר ולזמן ארוך יותר.'
        misconception: MC-3-soft-landing-less-impulse
    hints:
      - 'כמה תנע הביצה מאבדת בכל אחד מהמקרים?'

  - id: Q-3.5-wall-bounce
    type: numeric
    objectives: [OBJ-3.5-1]
    level: mid
    prompt: >-
      כדור בעל מסה $0.20\,\text{kg}$ פוגע בקיר בניצב במהירות $15\,\text{m/s}$ וחוזר לאחור במהירות $12\,\text{m/s}$.
      המגע עם הקיר נמשך $0.0050\,\text{s}$. מה גודל הכוח הממוצע שהקיר מפעיל על הכדור?
    answer: 1080
    unit: N
    correctFeedback: >-
      נכון. עם ציר מהקיר החוצה: $\Delta p = m(v_2 - v_1) = 0.20\cdot\left(12 - (-15)\right) = 5.4\,\text{N·s}$, ולכן
      $\bar F = \Delta p/\Delta t = 1080\,\text{N}$, מהקיר החוצה.
    wrongFeedback: 'התנע הוא וקטור. בחרו ציר, כתבו את המהירות לפני ואחרי עם סימנים, וחשבו את ההפרש.'
    commonWrong:
      - value: 120
        feedback: >-
          חיסרתם את גודלי המהירויות, $15 - 12$. הכדור הפך כיוון: המהירות השתנתה מ-$15\,\text{m/s}$ לכיוון אחד
          ל-$12\,\text{m/s}$ לכיוון ההפוך, כלומר ב-$27\,\text{m/s}$.
        misconception: MC-3-impulse-from-speed-change
      - value: 5.4
        feedback: 'זה המתקף, ב-$\text{N·s}$. הכוח הממוצע הוא המתקף חלקי זמן המגע.'
    hints:
      - 'אם הכדור נע לפני הפגיעה במהירות $v_1 = -15\,\text{m/s}$, מה הסימן של מהירותו אחרי?'

  - id: Q-3.5-sine-pulse
    type: numeric
    objectives: [OBJ-3.5-1]
    level: bagrut
    prompt: >-
      גוף בעל מסה $0.40\,\text{kg}$ נע על ציר $x$ במהירות $v_0 = -2.0\,\text{m/s}$. מ-$t = 0$ עד $t = T$ פועל עליו
      הכוח $F(t) = F_0\sin(\pi t/T)$, עם $F_0 = 50\,\text{N}$ ו-$T = 0.20\,\text{s}$, ואחר כך הכוח מפסיק. מה מהירותו
      בסוף?
    answer: 13.9
    unit: m/s
    correctFeedback: >-
      נכון. $J = \int_0^TF_0\sin\dfrac{\pi t}{T}\,dt = \dfrac{2F_0T}{\pi} = 6.37\,\text{N·s}$, ולכן
      $v = v_0 + \dfrac Jm = -2.0 + 15.9 = 13.9\,\text{m/s}$. **בדיקה:** הכוח הממוצע הוא $\dfrac2\pi F_0 \approx 0.64F_0$,
      בין 0 ל-$F_0$, כמו שצריך לחצי גל סינוס.
    wrongFeedback: 'חשבו את המתקף כאינטגרל של $F(t)$ בזמן, ואז השתמשו ב-$m v - m v_0 = J$ עם הסימן של $v_0$.'
    commonWrong:
      - value: 23
        feedback: 'כפלתם $F_0T$, כאילו הכוח היה מרבי כל הזמן. הכוח הממוצע בחצי גל סינוס הוא $2F_0/\pi$.'
      - value: 10.5
        feedback: 'לקחתם כוח ממוצע $F_0/2$, כמו במשולש. בחצי גל סינוס הממוצע $2F_0/\pi \approx 0.64F_0$, גדול מ-$F_0/2$.'
      - value: 15.9
        feedback: 'זה $J/m$, השינוי במהירות. הגוף לא התחיל ממנוחה: הוסיפו את $v_0 = -2.0\,\text{m/s}$.'
    hints:
      - '$\int_0^T\sin(\pi t/T)\,dt = 2T/\pi$.'

  # ------------------------------------ OBJ-3.5-2 when momentum is conserved, entirely or in one component
  - id: Q-3.5-falling-ball
    type: mc
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: basic
    prompt: כדור נופל חופשית אל כדור הארץ. מה נכון לגבי התנע?
    choices:
      - text: התנע של הכדור לא נשמר, אבל התנע של המערכת כדור + כדור הארץ נשמר.
        correct: true
        feedback: >-
          נכון. על הכדור לבדו פועל כוח חיצוני, הכובד, ולכן התנע שלו גדל. כשכדור הארץ בתוך המערכת, הכובד הוא כוח
          פנימי: כדור הארץ מקבל תנע שווה והפוך, ומהירותו זעירה כי מסתו עצומה.
      - text: התנע של הכדור נשמר, כי אין התנגשות.
        feedback: 'תנע של מערכת נשמר רק כשהכוח החיצוני השקול עליה אפס. על הכדור פועל הכובד, ו-$dp/dt = mg$.'
        misconception: MC-3-momentum-always-conserved
      - text: אף אחד מהם לא נשמר, כי הכובד פועל כל הזמן.
        feedback: 'הכובד פועל גם על כדור הארץ, בכיוון ההפוך ובאותו גודל. במערכת של שניהם הוא פנימי, והתנע הכולל נשמר.'
    hints:
      - 'מה הכוח החיצוני על הכדור לבדו? ועל המערכת של שניהם?'

  - id: Q-3.5-bullet-ice
    type: numeric
    objectives: [OBJ-3.5-2]
    level: basic
    prompt: >-
      כדור רובה בעל מסה $50\,\text{g}$ נע אופקית במהירות $300\,\text{m/s}$ ונתקע בבול עץ בעל מסה $1.0\,\text{kg}$
      שעומד על קרח חלק. מה מהירות הבול (עם הכדור שבתוכו) מיד אחרי?
    answer: 14.3
    unit: m/s
    correctFeedback: >-
      נכון. אין כוח חיצוני אופקי, ולכן התנע האופקי נשמר: $mv = (m + M)V$, ו-
      $V = \dfrac{0.050\cdot300}{1.05} = 14.3\,\text{m/s}$.
    wrongFeedback: 'כתבו את התנע האופקי לפני ואחרי. אחרי, הכדור והבול נעים יחד.'
    commonWrong:
      - value: 15
        feedback: 'שכחתם שגם הכדור נע עם הבול אחרי. המסה שנעה אחרי היא $m + M = 1.05\,\text{kg}$.'
      - value: 65.5
        feedback: >-
          השתמשתם בשימור אנרגיה קינטית. בהתנגשות שבה הכדור נתקע רוב האנרגיה הקינטית הופכת לחום ולעיוות. התנע
          נשמר; האנרגיה הקינטית לא.
        misconception: MC-3-kinetic-energy-conserved-in-collision
    hints:
      - 'איזה גודל נשמר כשהכוח החיצוני האופקי אפס?'

  - id: Q-3.5-sandbag-cart
    type: twotier
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: mid
    prompt: >-
      עגלה נוסעת על מסילה אופקית חלקה, ושק חול נופל עליה אנכית ונשאר בה. מה נכון לגבי התנע של המערכת עגלה + שק,
      מרגע לפני שהשק נוגע בעגלה עד שהוא נח בה?
    choices:
      - text: רק הרכיב האופקי של התנע נשמר.
        correct: true
        feedback: >-
          נכון. אופקית אין כוח חיצוני, ולכן $Mv_0 = (M + m)v$: עגלה של $20\,\text{kg}$ ב-$3.0\,\text{m/s}$ ושק של
          $5.0\,\text{kg}$ ממשיכים ב-$2.4\,\text{m/s}$. אנכית התנע של השק נעלם, כי המסילה דחפה אותו כלפי מעלה.
      - text: התנע כולו נשמר, כי זו התנגשות.
        feedback: >-
          לפני המגע לשק יש תנע כלפי מטה, ואחרי אין לאף אחד תנע אנכי. מי לקח אותו? המסילה, שהיא חיצונית למערכת,
          דחפה כלפי מעלה בכוח גדול מהכובד.
        misconception: MC-3-momentum-always-conserved
      - text: אף רכיב לא נשמר, כי השק עצר את העגלה בחלקה.
        feedback: >-
          העגלה אכן האטה, אבל בגלל כוח **פנימי**, החיכוך בין השק לעגלה. אופקית הכוח הזה פנימי, והתנע האופקי של
          שניהם יחד נשמר.
      - text: רק הרכיב האנכי נשמר, כי השק נופל אנכית.
        feedback: 'אנכית פועל כוח חיצוני גדול: הכוח הנורמלי מהמסילה, שעוצר את השק. אופקית אין כוח חיצוני.'
    reasons:
      - text: הכוח החיצוני השקול על המערכת אנכי בלבד, ולכן רק הרכיב שניצב לו נשמר.
        correct: true
        feedback: 'זה הנימוק: $\dfrac{d\vec P}{dt} = \vec F_{\text{ext}}$ רכיב אחר רכיב. רכיב שבו $F_{\text{ext}} = 0$ נשמר, גם אם הרכיב האחר לא.'
      - text: הכובד הוא הכוח החיצוני היחיד.
        feedback: 'אם הכובד היה היחיד, התנע האנכי היה רק גדל. בזמן העצירה הכוח הנורמלי מהמסילה גדול בהרבה מהכובד.'
      - text: אנרגיה קינטית נשמרת, ולכן גם תנע.
        feedback: 'האנרגיה הקינטית דווקא לא נשמרת כאן: השק מחליק על העגלה עד שהוא נח בה, וחלק מהאנרגיה הופך לחום.'
        misconception: MC-3-kinetic-energy-conserved-in-collision
    hints:
      - 'פרקו את הכוחות החיצוניים לרכיב אופקי ולרכיב אנכי.'

  - id: Q-3.5-crash-friction
    type: mc
    objectives: [OBJ-3.5-2]
    qualitative: true
    level: mid
    prompt: >-
      שתי מכוניות מתנגשות בצומת, והמגע ביניהן נמשך כעשירית שנייה. בוחנת תאונות משתמשת בשימור תנע בין רגע לפני
      ההתנגשות לרגע אחריה, אף שהכביש מפעיל על הצמיגים חיכוך, כוח חיצוני. למה זה מוצדק?
    choices:
      - text: הכוחות בין המכוניות גדולים בהרבה מהחיכוך, ובזמן הקצר המתקף של החיכוך קטן לעומת השינוי בתנע של כל מכונית.
        correct: true
        feedback: >-
          נכון. זה קירוב המתקף: בהתנגשות קצרה הכוחות הפנימיים עצומים. החיכוך חסום על ידי $\mu Mg$, והמתקף שלו
          $\mu Mg\,\Delta t$ קטן כשה-$\Delta t$ קצר. לכן התנע **כמעט** נשמר. אחרי ההתנגשות, לאורך זמן, החיכוך כן עוצר
          את המכוניות.
      - text: בהתנגשות התנע תמיד נשמר בדיוק, בלי קשר לכוחות אחרים.
        feedback: >-
          התנע של מערכת נשמר בדיוק רק כשהכוח החיצוני אפס. כאן הוא לא אפס, ולכן השימור הוא קירוב, שתקף בגלל הזמן
          הקצר.
        misconception: MC-3-momentum-always-conserved
      - text: החיכוך הוא כוח פנימי, כי הכביש והמכוניות נוגעים זה בזה.
        feedback: 'הכביש לא חלק מהמערכת "שתי מכוניות", ולכן הכוח שלו חיצוני. השאלה היא רק כמה גדול המתקף שלו.'
      - text: חיכוך לא פועל על מכונית בתנועה.
        feedback: 'על צמיג שמתגלגל או מחליק פועל חיכוך מהכביש. הוא קיים, רק קטן לעומת כוחות ההתנגשות.'
    hints:
      - 'השוו את המתקף של החיכוך במשך $0.1\,\text{s}$ לתנע של מכונית בנסיעה.'

  - id: Q-3.5-free-wedge
    type: numeric
    objectives: [OBJ-3.5-2]
    level: bagrut
    prompt: >-
      טריז בעל מסה $M = 3.0\,\text{kg}$ וזווית $30^\circ$ מונח על רצפה חלקה. גוש בעל מסה $m = 1.0\,\text{kg}$ משתחרר
      ממנוחה על הדופן המשופעת, בגובה $h = 0.45\,\text{m}$ מעל הרצפה, ומחליק עליה בלי חיכוך. גם הטריז מתחיל ממנוחה.
      מה גודל מהירות הטריז ברגע שהגוש מגיע לרצפה?
    answer: 0.713
    unit: m/s
    correctFeedback: >-
      נכון. אין כוח חיצוני אופקי, ולכן $MV = mv_x$ (בכיוונים הפוכים). ביחס לטריז הגוש נע לאורך הדופן, במהירות $u$,
      ולכן $v_x = u\cos\theta - V$ ו-$v_y = u\sin\theta$. אין חיכוך, והאנרגיה נשמרת:
      $mgh = \tfrac12MV^2 + \tfrac12m\left(v_x^2 + v_y^2\right)$. הפתרון:
      $$V = \sqrt{\frac{2ghm^2\cos^2\theta}{(M + m)\left(M + m\sin^2\theta\right)}} = 0.713\,\text{m/s}$$
      והגוש נע ב-$v_x = 2.14\,\text{m/s}$ אופקית ו-$v_y = 1.65\,\text{m/s}$ כלפי מטה. **בדיקת גבולות:** כש-$M \to \infty$
      הטריז לא זז, $V \to 0$; כש-$\theta \to 90^\circ$ הגוש נופל אנכית ולא דוחף את הטריז, $V \to 0$.
    wrongFeedback: >-
      יש שלושה נעלמים: $V$, ו-$v_x$, $v_y$ של הגוש. המשוואות: שימור התנע האופקי, שימור האנרגיה, והאילוץ שביחס לטריז
      הגוש נע לאורך הדופן.
    commonWrong:
      - value: 0.643
        feedback: >-
          לקחתם לגוש את המהירות $\sqrt{2gh}$ לאורך הדופן, כמו על טריז קבוע. אבל הטריז זז, ולוקח חלק מהאנרגיה. וגם
          הכיוון של מהירות הגוש ביחס לרצפה כבר לא לאורך הדופן.
      - value: 0.99

chapter: 8
questions:
  # ---------------------------------------------------------------- OBJ-8.4-1 rolling without slipping
  - id: Q-8.4-friction-level-roll
    type: vector
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: basic
    prompt: >-
      כדור מתגלגל בלי החלקה ימינה (מזרחה) על רצפה אופקית, במהירות קבועה. מזניחים את התנגדות האוויר ואת עיוות
      הכדור והרצפה. מה כיוון כוח החיכוך שהרצפה מפעילה על הכדור? למעלה בדף הוא כלפי מעלה.
    answer: zero
    correctFeedback: >-
      נכון: אין חיכוך. מהירות המרכז קבועה, ולכן הכוח האופקי השקול אפס. גם המהירות הזוויתית קבועה, ולכן גם המומנט
      סביב המרכז אפס. חיכוך היה משנה את שתיהן. תנאי הגלגול $v = \omega R$ מתקיים מעצמו, בלי שהרצפה צריכה "לאכוף"
      אותו.
    wrongFeedback: 'כתבו את החוק השני למרכז ואת משוואת המומנט סביב המרכז. אם $v$ ו-$\omega$ קבועות, מה יכול להיות כוח החיכוך?'
    wrong:
      - dir: w
        feedback: >-
          חיכוך שמאלה היה מאט את המרכז, אבל באותו זמן מגביר את הסיבוב (המומנט שלו סביב המרכז הוא בכיוון הגלגול),
          והגלגול היה מפסיק להיות "בלי החלקה". במהירות קבועה אין לו תפקיד.
        misconception: MC-8-rolling-needs-friction
      - dir: e
        feedback: 'חיכוך ימינה היה מאיץ את המרכז ומאט את הסיבוב. בגלגול במהירות קבועה שום דבר לא צריך להשתנות.'
    hints:
      - 'מה צריך לגרום לשינוי ב-$v$ או ב-$\omega$? האם משהו משתנה כאן?'

  - id: Q-8.4-cylinder-incline
    type: numeric
    objectives: [OBJ-8.4-1]
    level: basic
    prompt: >-
      גליל מלא ואחיד ($I = \tfrac12mR^2$) מתגלגל בלי החלקה במורד מדרון בזווית $30^\circ$. מה תאוצת המרכז שלו?
    answer: 3.27
    unit: m/s²
    correctFeedback: >-
      נכון. לאורך המדרון $mg\sin\theta - f = ma$, סביב המרכז $fR = I\alpha$, ובגלגול $a = \alpha R$. מכאן
      $a = \dfrac{g\sin\theta}{1 + I/(mR^2)} = \dfrac{9.8\cdot0.5}{1.5} = 3.27\,\text{m/s}^2$. החיכוך הסטטי לוקח
      שליש מרכיב הכובד, $f = \tfrac13mg\sin\theta$, כדי לסובב את הגליל.
    wrongFeedback: 'השתמשו ב-$a = \dfrac{g\sin\theta}{1 + I/(mR^2)}$, או גזרו אותו מהחוק השני, ממשוואת המומנט ומ-$a = \alpha R$.'
    commonWrong:
      - value: 4.9
        feedback: 'זה $g\sin\theta$, של גוף שמחליק בלי חיכוך. בגלגול החיכוך הסטטי פועל במעלה המדרון, ולכן התאוצה קטנה יותר.'
      - value: 2.45
        feedback: 'זה $\tfrac12g\sin\theta$, של טבעת ($I = mR^2$). לגליל מלא $I/(mR^2) = \tfrac12$.'
      - value: 3.5
        feedback: 'זה $\tfrac57g\sin\theta$, של כדור מלא ($I = \tfrac25mR^2$). לגליל מלא $I = \tfrac12mR^2$.'
    hints:
      - 'כמה זה $I/(mR^2)$ לגליל מלא?'

  - id: Q-8.4-race
    type: rank
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: mid
    prompt: >-
      חמישה גופים משתחררים ממנוחה מאותו גובה במדרון. ארבעה מתגלגלים בלי החלקה, והחמישי, קובייה, מחליק בלי חיכוך.
      לכל אחד מסה ורדיוס אחרים. סדרו אותם לפי גודל המהירות בתחתית המדרון, מהגדולה לקטנה.
    items:
      - id: block
        label: קובייה שמחליקה בלי חיכוך
      - id: sphere
        label: 'כדור מלא, $I = \tfrac25mR^2$'
      - id: disc
        label: 'גליל מלא, $I = \tfrac12mR^2$'
      - id: shell
        label: 'קליפה כדורית, $I = \tfrac23mR^2$'
      - id: ring
        label: 'טבעת, $I = mR^2$'
    order: [block, sphere, disc, shell, ring]
    correctFeedback: >-
      נכון. שימור אנרגיה: $mgh = \tfrac12mv^2\left(1 + \dfrac{I}{mR^2}\right)$, ולכן
      $v = \sqrt{\dfrac{2gh}{1 + I/(mR^2)}}$. המסה והרדיוס מצטמצמים: קובע רק **היחס** $I/(mR^2)$, כלומר עד כמה המסה
      רחוקה מהציר. היחסים ל-$\sqrt{2gh}$: $1$, $0.845$, $0.816$, $0.775$, $0.707$.
    wrongFeedback: 'כתבו שימור אנרגיה עם אנרגיה קינטית של תנועת המרכז ושל הסיבוב, והציבו $\omega = v/R$. מה נשאר מהמסה ומהרדיוס?'
    hints:
      - 'איזה חלק מהאנרגיה הולך לסיבוב בכל גוף?'

  - id: Q-8.4-friction-no-work
    type: twotier
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: mid
    prompt: >-
      דסקה מתגלגלת בלי החלקה במורד מדרון מגובה $h$. סטודנט טוען: "חיכוך פועל על הדסקה, ולכן חלק מהאנרגיה הופך
      לחום, ובתחתית האנרגיה הקינטית שלה קטנה מ-$mgh$." מה נכון?
    choices:
      - text: 'האנרגיה המכנית נשמרת: בתחתית, האנרגיה הקינטית של המרכז ועוד הסיבובית שוות ל-$mgh$.'
        correct: true
        feedback: 'נכון. החיכוך הסטטי לא מאבד אנרגיה. הוא רק מעביר חלק ממנה מתנועת המרכז לסיבוב.'
      - text: 'הסטודנט צודק: חיכוך תמיד הופך אנרגיה לחום.'
        feedback: 'חיכוך **קינטי**, בין משטחים שמחליקים זה על זה, הופך אנרגיה לחום. בגלגול בלי החלקה אין החלקה בנקודת המגע.'
        misconception: MC-8-static-friction-does-work
      - text: 'האנרגיה נשמרת, ולכן האנרגיה הקינטית של תנועת המרכז, $\tfrac12mv^2$, שווה ל-$mgh$.'
        feedback: 'זה היה נכון לקובייה שמחליקה בלי חיכוך. הדסקה גם מסתובבת, ושליש מהאנרגיה הולך לסיבוב: $\tfrac12mv^2 = \tfrac23mgh$.'
    reasons:
      - text: 'החיכוך פועל בנקודת המגע, והיא במנוחה, ולכן ההספק שלו, $\vec f\cdot\vec v_P$, אפס.'
        correct: true
        feedback: 'זה הנימוק. העבודה של כוח היא הכוח כפול **ההעתק של הנקודה שעליה הוא פועל**, ונקודת המגע לא זזה בזמן שהכוח פועל עליה.'
      - text: 'החיכוך מתנגד לתנועה, ולכן העבודה שלו שלילית.'
        feedback: 'החיכוך מאט את תנועת המרכז, אבל מאיץ את הסיבוב באותה מידה בדיוק: העבודה שלו על תנועת המרכז, $-fs$, מתקזזת עם העבודה של המומנט שלו, $+fR\theta = +fs$.'
        misconception: MC-8-static-friction-does-work
      - text: 'החיכוך קטן, ולכן אפשר להזניח את העבודה שלו.'
        feedback: 'החיכוך כאן לא קטן: הוא שליש מרכיב הכובד לאורך המדרון. העבודה שלו אפס בדיוק, לא קטנה.'
    hints:
      - 'מה המהירות של הנקודה שעליה פועל כוח החיכוך?'

  - id: Q-8.4-min-friction
    type: numeric
    objectives: [OBJ-8.4-1]
    level: bagrut
    prompt: >-
      כדור מלא ואחיד ($I = \tfrac25mR^2$) מונח על מדרון בזווית $40^\circ$ ומשתחרר ממנוחה. מה מקדם החיכוך הסטטי
      המינימלי שמאפשר לו להתגלגל בלי החלקה?
    answer: 0.24
    unit: ''
    correctFeedback: >-
      נכון. מהחוק השני, ממשוואת המומנט ומ-$a = \alpha R$: $f = \dfrac{I}{R^2}\cdot a = \dfrac{2/5}{1 + 2/5}mg\sin\theta = \tfrac27mg\sin\theta$.
      התנאי $f \le \mu_sN = \mu_smg\cos\theta$ נותן $\mu_s \ge \tfrac27\tan\theta = \tfrac27\cdot0.839 = 0.240$.
      **בדיקת גבולות:** כש-$\theta \to 0$ לא צריך חיכוך כלל, וכש-$I \to 0$ (מסה נקודתית) גם $f \to 0$, כי אין מה לסובב.
    wrongFeedback: 'מצאו את $f$ הדרוש לגלגול (מהחוק השני ומשוואת המומנט), ודרשו $f \le \mu_smg\cos\theta$.'
    commonWrong:
      - value: 0.839
        feedback: 'זה $\tan\theta$, המקדם שמחזיק קובייה **במנוחה** על המדרון. כדור מתגלגל לא צריך לעצור: החיכוך רק צריך לסובב אותו.'
      - value: 0.28
        feedback: 'זה $\tfrac13\tan\theta$, של גליל מלא. לכדור מלא $\dfrac{I/(mR^2)}{1 + I/(mR^2)} = \dfrac{2/5}{7/5} = \tfrac27$.'
      - value: 0.42
        feedback: 'זה $\tfrac12\tan\theta$, של טבעת. לכדור מלא, עם $I$ קטן יותר, צריך פחות חיכוך.'
      - value: 0.599
        feedback: 'זה $\tfrac57\tan\theta$: השתמשתם במקדם של התאוצה, $a = \tfrac57g\sin\theta$, במקום בזה של החיכוך. החיכוך הוא מה שנשאר, $mg\sin\theta - ma = \tfrac27mg\sin\theta$.'
    hints:
      - 'אחרי שמצאתם $a = \tfrac57g\sin\theta$, החיכוך הוא $mg\sin\theta - ma$.'

  # ---------------------------------------------------------------- OBJ-8.4-2 rolling with slipping
  - id: Q-8.4-slide-friction
    type: mc
    objectives: [OBJ-8.4-2]
    qualitative: true
    level: basic
    prompt: >-
      זורקים כדור באולינג על מסלול אופקי כך שהוא נוחת במהירות $v_0$ קדימה **בלי שום סיבוב**. בהתחלה הוא מחליק
      על המסלול. מה עושה כוח החיכוך הקינטי בזמן ההחלקה?
    choices:
      - text: 'הוא פועל אחורה: מאט את מהירות המרכז, ובאותו זמן מגביר את הסיבוב קדימה.'
        correct: true
        feedback: >-
          נכון. נקודת המגע מחליקה קדימה, ולכן החיכוך הקינטי פועל אחורה. הוא פועל בנקודה שמתחת למרכז, ולכן המומנט שלו
          סביב המרכז מסובב את הכדור קדימה. ההחלקה נמשכת עד ש-$v = \omega R$.
      - text: 'הוא פועל אחורה ומאט את הכדור, והסיבוב מתחיל רק אחרי שהכדור מפסיק להחליק.'
        feedback: 'אם הסיבוב לא היה משתנה, הכדור היה מחליק עד שהוא נעצר. החיכוך פועל בשפת הכדור, לא במרכזו, ולכן יש לו גם מומנט סביב המרכז.'
        misconception: MC-8-friction-only-slows
      - text: 'הוא פועל קדימה, כדי לגלגל את הכדור.'
        feedback: 'כיוון החיכוך הקינטי נקבע מכיוון ההחלקה של נקודת המגע ביחס למסלול. היא מחליקה קדימה, ולכן החיכוך אחורה.'
      - text: 'אין חיכוך, כי הכדור עוד לא מתגלגל.'
        feedback: 'דווקא כשיש החלקה יש חיכוך קינטי, $\mu_kmg$. הוא שמשנה את התנועה עד שההחלקה נגמרת.'
    hints:
      - 'לאיזה כיוון מחליקה נקודת המגע ביחס למסלול? ואיפה פועל החיכוך, ביחס למרכז?'

  - id: Q-8.4-bowling-final-speed
    type: numeric
    objectives: [OBJ-8.4-2]
    level: mid
    prompt: >-
      כדור באולינג (כדור מלא ואחיד, $I = \tfrac25mR^2$) נוחת על המסלול במהירות $8.0\,\text{m/s}$ בלי סיבוב. הוא
      מחליק עד שהוא מתחיל להתגלגל בלי החלקה. מה מהירותו ברגע הזה?
    answer: 5.71
    unit: m/s
    correctFeedback: >-
      נכון. הדרך הקצרה: תנע זוויתי סביב נקודה קבועה על קו המסלול נשמר, כי החיכוך עובר בה, והכובד והכוח הנורמלי
      מבטלים זה את זה. בהתחלה $L = mv_0R$, ובסוף $L = mvR + \tfrac25mR^2\cdot\dfrac vR = \tfrac75mvR$. לכן
      $v = \tfrac57v_0 = 5.71\,\text{m/s}$. התוצאה לא תלויה ב-$\mu_k$: חיכוך חזק מקצר רק את זמן ההחלקה.
    wrongFeedback: 'אפשר לפתור את $v(t)$ ו-$\omega(t)$ ולדרוש $v = \omega R$, או בדרך קצרה: איזה תנע זוויתי לא משתנה בזמן ההחלקה?'
    commonWrong:
      - value: 6.76
        feedback: >-
          זה $v_0\sqrt{5/7}$, משימור אנרגיה. אבל בזמן ההחלקה החיכוך **הקינטי** הופך אנרגיה לחום, ונשאר רק $\tfrac57$
          מהאנרגיה ההתחלתית. האנרגיה לא נשמרת כאן, התנע הזוויתי סביב נקודה על המסלול כן.
        misconception: MC-8-slipping-energy-conserved
      - value: 8.0
        feedback: 'החיכוך פועל אחורה כל זמן ההחלקה, ולכן המרכז מאט. חלק מהתנע עובר לסיבוב.'
        misconception: MC-8-friction-only-slows
      - value: 2.29
        feedback: 'זו המהירות שהכדור **מאבד**, $\tfrac27v_0$. מה שנשאר הוא $\tfrac57v_0$.'
    hints:
      - 'בחרו נקודה על קו המגע עם המסלול. מה המומנט של החיכוך סביבה?'

  - id: Q-8.4-bowling-slide-distance
    type: numeric
    objectives: [OBJ-8.4-2]
    level: bagrut
    prompt: >-
      אותו כדור באולינג נוחת במהירות $v_0 = 8.0\,\text{m/s}$ בלי סיבוב, ומקדם החיכוך הקינטי עם המסלול הוא
      $\mu_k = 0.20$. איזה מרחק הוא עובר עד שהוא מפסיק להחליק?
    answer: 8.0
    unit: m
    correctFeedback: >-
      נכון. בזמן ההחלקה $a = -\mu_kg$ ו-$\alpha = \dfrac{\mu_kmgR}{\tfrac25mR^2} = \dfrac{5\mu_kg}{2R}$. כלומר
      $v = v_0 - \mu_kgt$ ו-$\omega R = \tfrac52\mu_kgt$. ההחלקה נגמרת כשהם שווים:
      $t = \dfrac{2v_0}{7\mu_kg} = 1.17\,\text{s}$. המרחק: $s = v_0t - \tfrac12\mu_kgt^2 = \dfrac{12v_0^2}{49\mu_kg} = 8.00\,\text{m}$
      (שהוא גם המהירות הממוצעת, $\tfrac{8.0 + 5.71}{2}$, כפול $t$). **בדיקת גבולות:** כש-$\mu_k \to \infty$ המרחק
      והזמן שואפים לאפס, והמהירות הסופית נשארת $\tfrac57v_0$.
    wrongFeedback: 'כתבו את $v(t)$ מהחוק השני ואת $\omega(t)$ ממשוואת המומנט, מצאו את הזמן שבו $v = \omega R$, ואז את המרחק.'
    commonWrong:
      - value: 16.3
        feedback: 'זה $\dfrac{v_0^2}{2\mu_kg}$, המרחק עד **עצירה** של גוף מחליק. הכדור לא נעצר: אחרי $1.17\,\text{s}$ הוא מתגלגל, והחיכוך הקינטי נעלם.'
        misconception: MC-8-friction-only-slows
      - value: 9.33
        feedback: 'זה $v_0t$, כאילו המהירות לא ירדה בזמן ההחלקה. הכדור מאט מ-$8.0$ ל-$5.71\,\text{m/s}$.'
    hints:
      - 'הסיבוב מתחיל מאפס וגדל: $\omega(t) = \dfrac{5\mu_kg}{2R}t$.'

  - id: Q-8.4-backspin
    type: twotier
    objectives: [OBJ-8.4-2]
    qualitative: true
    level: bagrut
    prompt: >-
      כדור מלא ואחיד נוחת על שולחן אופקי במהירות $v_0$ קדימה, ועם סיבוב **לאחור** (נגד כיוון הגלגול), כך ש-$R\omega_0 = 3v_0$.
      הוא מחליק עד שהוא מתגלגל בלי החלקה. מה מצבו בסוף?
    choices:
      - text: 'הוא מתגלגל **אחורה**, לכיוון שממנו בא.'
        correct: true
        feedback: 'נכון. המהירות הסופית היא $\tfrac57\left(v_0 - \tfrac25R\omega_0\right) = -\tfrac17v_0$: לאחור. כך כדור ביליארד עם "סיבוב לאחור" חוזר.'
      - text: 'הוא ממשיך קדימה, לאט יותר, כי החיכוך רק מאט.'
        feedback: 'החיכוך פועל אחורה כל עוד נקודת המגע מחליקה קדימה. הוא מאט את המרכז עד אפס וממשיך להאיץ אותו אחורה, עד שהגלגול מתחיל.'
        misconception: MC-8-friction-only-slows
      - text: 'הוא נעצר ונשאר במנוחה.'
        feedback: 'בנקודה שבה $v = 0$ הכדור עדיין מסתובב לאחור, ונקודת המגע עדיין מחליקה. החיכוך ממשיך לפעול.'
      - text: 'הוא מתגלגל קדימה ב-$\tfrac57v_0$, כמו כדור בלי סיבוב.'
        feedback: 'זו התוצאה ל-$\omega_0 = 0$. הסיבוב ההתחלתי נכנס לתנע הזוויתי, ולכן משנה את התוצאה.'
    reasons:
      - text: 'התנע הזוויתי סביב נקודה על השולחן נשמר, ובהתחלה הוא $mv_0R - \tfrac25mR^2\omega_0 = -\tfrac15mv_0R$, שלילי.'
        correct: true
        feedback: >-
          זה הנימוק. בסוף $L = \tfrac75mvR$, ולכן $v = -\tfrac17v_0$. הסימן של $L$ ההתחלתי קובע את כיוון הגלגול
          הסופי: הכדור חוזר כש-$R\omega_0 > \tfrac52v_0$.
      - text: 'החיכוך תמיד פועל נגד התנועה, ולכן הוא לא יכול להפוך את כיוונה.'
        feedback: >-
          חיכוך קינטי פועל נגד ההחלקה של נקודת המגע, לא נגד תנועת המרכז. כאן נקודת המגע מחליקה קדימה כל הזמן,
          גם אחרי שהמרכז כבר נע אחורה, ולכן החיכוך דוחף אחורה עד שההחלקה נגמרת.
        misconception: MC-8-friction-only-slows
      - text: 'שימור אנרגיה: האנרגיה של הסיבוב לאחור הופכת לתנועה לאחור.'
        feedback: 'בזמן ההחלקה החיכוך הקינטי הופך אנרגיה לחום, ולכן האנרגיה לא נשמרת. את התוצאה קובע התנע הזוויתי.'
        misconception: MC-8-slipping-energy-conserved
    hints:
      - 'חשבו את התנע הזוויתי ההתחלתי סביב נקודה על השולחן: $mv_0R$ פחות $\tfrac25mR^2\omega_0$.'

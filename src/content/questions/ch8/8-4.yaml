questions:
  # ---------------------------------------------------------------- OBJ-8.4-1 rolling without slipping
  - id: Q-8.4-friction-level-roll
    type: vector
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: basic
    prompt: >-
      כדור מתגלגל בלי החלקה ימינה (מזרחה) על רצפה אופקית, במהירות קבועה. מזניחים את התנגדות האוויר ואת עיוות
      הכדור והרצפה. מה כיוון כוח החיכוך שהרצפה מפעילה על הכדור? (התרשים הוא מבט מהצד: ימינה בדף היא מזרח, ולמעלה בדף הוא כלפי מעלה.)
    answer: zero
    correctFeedback: >-
      נכון: אין חיכוך. מהירות המרכז קבועה, ולכן הכוח האופקי השקול אפס. גם המהירות הזוויתית קבועה, ולכן גם המומנט
      סביב המרכז אפס. חיכוך היה משנה את שתיהן. תנאי הגלגול $v = \omega R$ מתקיים מעצמו, בלי שהרצפה צריכה "לאכוף"
      אותו.
    wrongFeedback: 'כתבו את החוק השני למרכז ואת משוואת המומנט סביב המרכז. אם $v$ ו-$\omega$ קבועות, מה יכול להיות כוח החיכוך?'
    wrong:
      - dir: w
        feedback: >-
          חיכוך שמאלה היה מאט את המרכז, אבל באותו זמן מגביר את הסיבוב (המומנט שלו סביב המרכז הוא בכיוון הגלגול),
          והגלגול היה מפסיק להיות "בלי החלקה". במהירות קבועה אין לו תפקיד.
        misconception: MC-8-rolling-needs-friction
      - dir: e
        feedback: 'חיכוך ימינה היה מאיץ את המרכז ומאט את הסיבוב. בגלגול במהירות קבועה שום דבר לא צריך להשתנות.'
    hints:
      - 'מה צריך לגרום לשינוי ב-$v$ או ב-$\omega$? האם משהו משתנה כאן?'

  - id: Q-8.4-cylinder-incline
    type: numeric
    objectives: [OBJ-8.4-1]
    level: basic
    prompt: >-
      גליל מלא ואחיד ($I = \tfrac12mR^2$) מתגלגל בלי החלקה במורד מדרון בזווית $30^\circ$. מה תאוצת המרכז שלו?
    answer: 3.27
    unit: m/s²
    correctFeedback: >-
      נכון. לאורך המדרון $mg\sin\theta - f = ma$, סביב המרכז $fR = I\alpha$, ובגלגול $a = \alpha R$. מכאן
      $a = \dfrac{g\sin\theta}{1 + I/(mR^2)}$, כאן $\dfrac{9.8\cdot0.5}{1.5} = 3.27\,\text{m/s}^2$. החיכוך הסטטי לוקח
      שליש מרכיב הכובד, $f = \tfrac13mg\sin\theta$, כדי לסובב את הגליל.
    wrongFeedback: 'השתמשו ב-$a = \dfrac{g\sin\theta}{1 + I/(mR^2)}$, או גזרו אותו מהחוק השני, ממשוואת המומנט ומ-$a = \alpha R$.'
    commonWrong:
      - value: 4.9
        feedback: 'זה $g\sin\theta$, של גוף שמחליק בלי חיכוך. בגלגול החיכוך הסטטי פועל במעלה המדרון, ולכן התאוצה קטנה יותר.'
      - value: 2.45
        feedback: 'זה $\tfrac12g\sin\theta$, של טבעת ($I = mR^2$). לגליל מלא $I/(mR^2) = \tfrac12$.'
      - value: 3.5
        feedback: 'זה $\tfrac57g\sin\theta$, של כדור מלא ($I = \tfrac25mR^2$). לגליל מלא $I = \tfrac12mR^2$.'
    hints:
      - 'כמה זה $I/(mR^2)$ לגליל מלא?'

  - id: Q-8.4-race
    type: rank
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: mid
    prompt: >-
      חמישה גופים משתחררים ממנוחה מאותו גובה במדרון. ארבעה מתגלגלים בלי החלקה, והחמישי, קובייה, מחליק בלי חיכוך.
      לכל אחד מסה ורדיוס אחרים. סדרו אותם לפי גודל המהירות בתחתית המדרון, מהגדולה לקטנה.
    items:
      - id: block
        label: קובייה שמחליקה בלי חיכוך
      - id: sphere
        label: 'כדור מלא, $I = \tfrac25mR^2$'
      - id: disc
        label: 'גליל מלא, $I = \tfrac12mR^2$'
      - id: shell
        label: 'קליפה כדורית, $I = \tfrac23mR^2$'
      - id: ring
        label: 'טבעת, $I = mR^2$'
    order: [block, sphere, disc, shell, ring]
    correctFeedback: >-
      נכון. שימור אנרגיה: $mgh = \tfrac12mv^2\left(1 + \dfrac{I}{mR^2}\right)$, ולכן
      $v = \sqrt{\dfrac{2gh}{1 + I/(mR^2)}}$. המסה והרדיוס מצטמצמים: קובע רק **היחס** $I/(mR^2)$, כלומר עד כמה המסה
      רחוקה מהציר. היחסים ל-$\sqrt{2gh}$: $1$, $0.845$, $0.816$, $0.775$, $0.707$.
    wrongFeedback: 'כתבו שימור אנרגיה עם אנרגיה קינטית של תנועת המרכז ושל הסיבוב, והציבו $\omega = v/R$. מה נשאר מהמסה ומהרדיוס?'
    hints:
      - 'איזה חלק מהאנרגיה הולך לסיבוב בכל גוף?'

  - id: Q-8.4-friction-no-work
    type: twotier
    objectives: [OBJ-8.4-1]
    qualitative: true
    level: mid
    prompt: >-
      דסקה מתגלגלת בלי החלקה במורד מדרון מגובה $h$. סטודנט טוען: "חיכוך פועל על הדסקה, ולכן חלק מהאנרגיה הופך
      לחום, ובתחתית האנרגיה הקינטית שלה קטנה מ-$mgh$." מה נכון?
    choices:
      - text: 'האנרגיה המכנית נשמרת: בתחתית, האנרגיה הקינטית של המרכז ועוד הסיבובית שוות ל-$mgh$.'
        correct: true
        feedback: 'נכון. החיכוך הסטטי לא מאבד אנרגיה. הוא רק מעביר חלק ממנה מתנועת המרכז לסיבוב.'
      - text: 'הסטודנט צודק: חיכוך תמיד הופך אנרגיה לחום.'
        feedback: 'חיכוך **קינטי**, בין משטחים שמחליקים זה על זה, הופך אנרגיה לחום. בגלגול בלי החלקה אין החלקה בנקודת המגע.'
        misconception: MC-8-static-friction-does-work
      - text: 'האנרגיה נשמרת, ולכן האנרגיה הקינטית של תנועת המרכז, $\tfrac12mv^2$, שווה ל-$mgh$.'
        feedback: 'זה היה נכון לקובייה שמחליקה בלי חיכוך. הדסקה גם מסתובבת, ושליש מהאנרגיה הולך לסיבוב: $\tfrac12mv^2 = \tfrac23mgh$.'
    reasons:
      - text: 'החיכוך פועל בנקודת המגע, והיא במנוחה, ולכן ההספק שלו, $\vec f\cdot\vec v_P$, אפס.'
        correct: true
        feedback: 'זה הנימוק. העבודה של כוח היא הכוח כפול **ההעתק של הנקודה שעליה הוא פועל**, ונקודת המגע לא זזה בזמן שהכוח פועל עליה.'
      - text: 'החיכוך מתנגד לתנועה, ולכן העבודה שלו שלילית.'
        feedback: 'החיכוך מאט את תנועת המרכז, אבל מאיץ את הסיבוב באותה מידה בדיוק: העבודה שלו על תנועת המרכז, $-fs$, מתקזזת עם העבודה של המומנט שלו, $+fR\varphi = +fs$, כאשר $\varphi$ זווית הסיבוב של הדסקה.'
        misconception: MC-8-static-friction-does-work
      - text: 'החיכוך קטן, ולכן אפשר להזניח את העבודה שלו.'
        feedback: 'החיכוך כאן לא קטן: הוא שליש מרכיב הכובד לאורך המדרון. העבודה שלו אפס בדיוק, לא קטנה.'
    hints:
      - 'מה המהירות של הנקודה שעליה פועל כוח החיכוך?'

  - id: Q-8.4-min-friction-shell
    type: numeric
    objectives: [OBJ-8.4-1]
    level: mid
    prompt: >-
      קליפה כדורית דקה ($I = \tfrac23mR^2$) משתחררת ממנוחה על מדרון בזווית $30^\circ$. מה מקדם החיכוך הסטטי
      הקטן ביותר שמאפשר לה להתגלגל בלי החלקה?
    answer: 0.231
    unit: ''
    correctFeedback: >-
      נכון. בגלגול בלי החלקה $a = \dfrac{g\sin\theta}{1 + \beta}$ ו-$f = \beta ma = \dfrac{\beta}{1 + \beta}mg\sin\theta$,
      עם $\beta = \tfrac23$. התנאי $f \le \mu_smg\cos\theta$ נותן $\mu_s \ge \dfrac{\beta}{1 + \beta}\tan\theta = \tfrac25\tan30^\circ = 0.231$.
      המסה והרדיוס לא משנים דבר.
    wrongFeedback: 'כמה חיכוך סטטי צריך גלגול בלי החלקה, ומה הכי הרבה שהמדרון יכול לתת, $\mu_sN$?'
    commonWrong:
      - value: 0.577
        feedback: 'זה $\tan30^\circ$, המקדם שמחזיק גוש **במנוחה** על המדרון. הקליפה לא במנוחה: היא מאיצה במורד, והחיכוך צריך רק לסובב אותה.'
      - value: 0.385
        feedback: 'זה $\beta\tan\theta$. מהחוק השני $f = \beta ma$, ו-$a = \dfrac{g\sin\theta}{1 + \beta}$, לא $g\sin\theta$: חסר המכנה $1 + \beta$.'
      - value: 0.192
        feedback: 'זה $\tfrac13\tan30^\circ$, הסף של דסקה ($\beta = \tfrac12$). לקליפה כדורית $\beta = \tfrac23$, ו-$\dfrac{\beta}{1 + \beta} = \tfrac25$.'
    hints:
      - 'מצאו קודם את החיכוך הסטטי $f$ שהגלגול צריך, והשוו ל-$\mu_smg\cos\theta$.'

  - id: Q-8.4-incline-regime
    type: numeric
    objectives: [OBJ-8.4-1, OBJ-8.4-2]
    level: bagrut
    prompt: >-
      כדור מלא ואחיד ($I = \tfrac25mR^2$) משתחרר ממנוחה על מדרון בזווית $40^\circ$. מקדם החיכוך הסטטי בין הכדור
      למדרון $\mu_s = 0.20$, והקינטי $\mu_k = 0.15$. איזה חלק מהאנרגיה הקינטית של הכדור במורד המדרון הוא אנרגיה
      קינטית סיבובית? (מספר בין $0$ ל-$1$.)
    answer: 0.106
    unit: ''
    correctFeedback: >-
      נכון. קודם בודקים אם הכדור יכול להתגלגל בלי החלקה: זה דורש $\mu_s \ge \tfrac27\tan40^\circ = 0.240$, ויש רק
      $0.20$. לכן הכדור מחליק מההתחלה, והחיכוך קינטי, $\mu_kmg\cos\theta$, במעלה המדרון. החוק השני:
      $a = g(\sin\theta - \mu_k\cos\theta) = 5.17\,\text{m/s}^2$. המומנט סביב המרכז:
      $\mu_kmg\cos\theta\,R = \tfrac25mR^2\alpha$, כלומר $\alpha R = \tfrac52\mu_kg\cos\theta = 2.82\,\text{m/s}^2$. שתיהן
      קבועות, ולכן ממנוחה $v = at$ ו-$\omega R = \alpha Rt$, והחלק הסיבובי לא תלוי בזמן:
      $$\frac{\tfrac25(\alpha R)^2}{a^2 + \tfrac25(\alpha R)^2} = 0.106$$
      בגלגול בלי החלקה הוא היה $\tfrac27 = 0.286$: הכדור שמחליק מסתובב לאט מדי.
    wrongFeedback: 'קודם בדקו אם $\mu_s$ מספיק לגלגול בלי החלקה. אחר כך מצאו את $a$ מהחוק השני ואת $\alpha R$ ממשוואת המומנט סביב המרכז.'
    commonWrong:
      - value: 0.286
        feedback: >-
          זה $\tfrac27$, החלק הסיבובי בגלגול בלי החלקה. אבל גלגול כזה צריך $\mu_s \ge \tfrac27\tan40^\circ = 0.240$, ויש
          רק $0.20$: הכדור מחליק, והסיבוב שלו מפגר אחרי התנועה של המרכז.
      - value: 0.197
        feedback: 'השתמשתם ב-$\mu_s$. ברגע שנקודת המגע מחליקה, החיכוך קינטי: $\mu_kN$, עם $\mu_k = 0.15$, גם בחוק השני וגם במומנט.'
      - value: 0.118
        feedback: >-
          זה היחס בין האנרגיה הסיבובית לאנרגיה של תנועת המרכז, $\dfrac{\tfrac25(\alpha R)^2}{a^2}$. השאלה שואלת על
          החלק מכל האנרגיה הקינטית: חלקו בסכום של שתיהן.
    hints:
      - 'האם $\mu_s$ מספיק לגלגול? אם לא, החיכוך הוא $\mu_kN$, והוא קובע גם את $a$ וגם את $\alpha$.'

  # ---------------------------------------------------------------- OBJ-8.4-2 rolling with slipping
  - id: Q-8.4-slide-friction
    type: mc
    objectives: [OBJ-8.4-2]
    qualitative: true
    level: basic
    prompt: >-
      זורקים כדור באולינג על מסלול אופקי כך שהוא נוחת במהירות $v_0$ קדימה **בלי שום סיבוב**. בהתחלה הוא מחליק
      על המסלול. מה עושה כוח החיכוך הקינטי בזמן ההחלקה?
    choices:
      - text: 'הוא פועל אחורה: מאט את מהירות המרכז, ובאותו זמן מגביר את הסיבוב קדימה.'
        correct: true
        feedback: >-
          נכון. נקודת המגע מחליקה קדימה, ולכן החיכוך הקינטי פועל אחורה. הוא פועל בנקודה שמתחת למרכז, ולכן המומנט שלו
          סביב המרכז מסובב את הכדור קדימה. ההחלקה נמשכת עד ש-$v = \omega R$.
      - text: 'הוא פועל אחורה ומאט את הכדור, והסיבוב מתחיל רק אחרי שהכדור מפסיק להחליק.'
        feedback: 'אם הסיבוב לא היה משתנה, הכדור היה מחליק עד שהוא נעצר. החיכוך פועל בשפת הכדור, לא במרכזו, ולכן יש לו גם מומנט סביב המרכז.'
        misconception: MC-8-friction-only-slows
      - text: 'הוא פועל קדימה, כדי לגלגל את הכדור.'
        feedback: 'כיוון החיכוך הקינטי נקבע מכיוון ההחלקה של נקודת המגע ביחס למסלול. היא מחליקה קדימה, ולכן החיכוך אחורה.'
      - text: 'אין חיכוך, כי הכדור עוד לא מתגלגל.'
        feedback: 'דווקא כשיש החלקה יש חיכוך קינטי, $\mu_kmg$. הוא שמשנה את התנועה עד שההחלקה נגמרת.'
    hints:
      - 'לאיזה כיוון מחליקה נקודת המגע ביחס למסלול? ואיפה פועל החיכוך, ביחס למרכז?'

  - id: Q-8.4-bowling-final-speed
    type: numeric
    objectives: [OBJ-8.4-2]
    level: mid
    prompt: >-
      כדור באולינג (כדור מלא ואחיד, $I = \tfrac25mR^2$) נוחת על המסלול במהירות $8.0\,\text{m/s}$ בלי סיבוב. הוא
      מחליק עד שהוא מתחיל להתגלגל בלי החלקה. מה מהירותו ברגע הזה?
    answer: 5.71
    unit: m/s
    correctFeedback: >-
      נכון. הדרך הקצרה: תנע זוויתי סביב נקודה קבועה על קו המסלול נשמר, כי החיכוך עובר בה, והכובד והכוח הנורמלי
      מבטלים זה את זה. בהתחלה $L = mv_0R$, ובסוף $L = mvR + \tfrac25mR^2\cdot\dfrac vR = \tfrac75mvR$. לכן
      $v = \tfrac57v_0 = 5.71\,\text{m/s}$. התוצאה לא תלויה ב-$\mu_k$: חיכוך חזק מקצר רק את זמן ההחלקה.
    wrongFeedback: 'אפשר לפתור את $v(t)$ ו-$\omega(t)$ ולדרוש $v = \omega R$, או בדרך קצרה: איזה תנע זוויתי לא משתנה בזמן ההחלקה?'
    commonWrong:

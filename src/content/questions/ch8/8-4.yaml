  - id: Q-8.4-bowling-slide-distance
    type: numeric
    objectives: [OBJ-8.4-2]
    level: bagrut
    prompt: >-
      כדור באולינג (כדור מלא ואחיד, $I = \tfrac25mR^2$) נוחת על מסלול אופקי במהירות $v_0 = 8.0\,\text{m/s}$ בלי
      סיבוב, ומקדם החיכוך הקינטי עם המסלול הוא $\mu_k = 0.20$. הוא מחליק עד שהוא מתחיל להתגלגל בלי החלקה. איזה
      מרחק עובר המרכז שלו עד אז?
    answer: 8.0
    unit: m
    correctFeedback: >-
      נכון. בזמן ההחלקה $a = -\mu_kg$ ו-$\alpha = \dfrac{\mu_kmgR}{\tfrac25mR^2} = \dfrac{5\mu_kg}{2R}$. כלומר
      $v = v_0 - \mu_kgt$ ו-$\omega R = \tfrac52\mu_kgt$. ההחלקה נגמרת כשהם שווים:
      $t = \dfrac{2v_0}{7\mu_kg} = 1.17\,\text{s}$. המרחק: $s = v_0t - \tfrac12\mu_kgt^2$, כלומר $s = \dfrac{12v_0^2}{49\mu_kg} = 8.00\,\text{m}$
      (שהוא גם המהירות הממוצעת, $\tfrac{8.0 + 5.71}{2}$, כפול $t$). **בדיקת גבולות:** כש-$\mu_k \to \infty$ המרחק
      והזמן שואפים לאפס, והמהירות הסופית נשארת $\tfrac57v_0$.
    wrongFeedback: 'כתבו את $v(t)$ מהחוק השני ואת $\omega(t)$ ממשוואת המומנט, מצאו את הזמן שבו $v = \omega R$, ואז את המרחק.'
    commonWrong:
      - value: 16.3
        feedback: 'זה $\dfrac{v_0^2}{2\mu_kg}$, המרחק עד **עצירה** של גוף מחליק. הכדור לא נעצר: אחרי $1.17\,\text{s}$ הוא מתגלגל, והחיכוך הקינטי נעלם.'
        misconception: MC-8-friction-only-slows
      - value: 9.33
        feedback: 'זה $v_0t$, כאילו המהירות לא ירדה בזמן ההחלקה. הכדור מאט מ-$8.0$ ל-$5.71\,\text{m/s}$.'
    hints:
      - 'הסיבוב מתחיל מאפס וגדל: $\omega(t) = \dfrac{5\mu_kg}{2R}t$.'

  - id: Q-8.4-backspin
    type: twotier
    objectives: [OBJ-8.4-2]
    qualitative: true
    level: bagrut
    prompt: >-
      כדור מלא ואחיד ($I = \tfrac25mR^2$) נוחת על שולחן אופקי במהירות $v_0$ קדימה, ועם סיבוב **לאחור** שמהירות
      השפה שלו $2v_0$, כפולה ממהירות המרכז. במוסכמה של השיעור, $\omega$ חיובית בכיוון הגלגול קדימה, ולכן
      $R\omega_0 = -2v_0$. הכדור מחליק עד שהוא מתגלגל בלי החלקה. מה מצבו בסוף?
    choices:
      - text: 'הוא מתגלגל **קדימה**, ב-$\tfrac17v_0$.'
        correct: true
        feedback: >-
          נכון. $v = \dfrac{v_0 + \tfrac25R\omega_0}{1 + \tfrac25} = \dfrac{v_0 - \tfrac45v_0}{\tfrac75} = \tfrac17v_0$.
          הסיבוב לאחור מהיר מהתנועה קדימה, ובכל זאת הוא לא מספיק כדי להחזיר את הכדור: זה דורש
          $R|\omega_0| > \tfrac52v_0$.
      - text: 'הוא מתגלגל **אחורה**, כי הסיבוב לאחור מהיר מהתנועה קדימה.'
        feedback: >-
          ההשוואה הנכונה היא לא בין $R|\omega_0|$ ל-$v_0$, אלא הסימן של התנע הזוויתי סביב נקודה על השולחן,
          $mR\left(v_0 + \tfrac25R\omega_0\right) = mR\left(v_0 - \tfrac45v_0\right)$, וזה חיובי. בכדור מלא הסיבוב לאחור
          "שוקל" רק $\tfrac25$ מהמהירות שלו. (לחישוק, $\beta = 1$, אותו סיבוב היה מחזיר אותו.)
      - text: 'הוא נעצר ונשאר במנוחה.'
        feedback: 'כדור נעצר לגמרי רק כשהתנע הזוויתי סביב נקודה על השולחן אפס, כלומר כש-$R\omega_0 = -\tfrac52v_0$. כאן הוא חיובי.'
      - text: 'הוא מתגלגל קדימה ב-$\tfrac57v_0$, כמו כדור בלי סיבוב.'
        feedback: 'זו התוצאה ל-$\omega_0 = 0$. הסיבוב ההתחלתי נכנס לתנע הזוויתי, ולכן משנה את התוצאה.'
    reasons:
      - text: 'התנע הזוויתי סביב נקודה על השולחן נשמר, ובהתחלה הוא $mR\left(v_0 + \tfrac25R\omega_0\right) = \tfrac15mv_0R$, חיובי.'
        correct: true
        feedback: >-
          זה הנימוק. בסוף $L = mRv\left(1 + \tfrac25\right) = \tfrac75mRv$, ולכן $v = \tfrac17v_0$. הסימן של $L$
          ההתחלתי קובע את כיוון הגלגול הסופי.
      - text: 'החיכוך פועל נגד תנועת המרכז, ולכן הוא רק מאט אותו ולא יכול להפוך את כיוונו.'
        feedback: >-
          חיכוך קינטי פועל נגד ההחלקה של נקודת המגע, לא נגד תנועת המרכז. כאן הכדור אמנם ממשיך קדימה, אבל לא מהסיבה
          הזו: עם סיבוב לאחור של יותר מ-$\tfrac52v_0$ אותו חיכוך היה ממשיך לדחוף אחורה אחרי שהמרכז נעצר, ומחזיר את הכדור.
        misconception: MC-8-friction-only-slows
      - text: 'שימור אנרגיה: האנרגיה של הסיבוב גדולה מזו של תנועת המרכז, ולכן הסיבוב לאחור "מנצח".'
        feedback: 'בזמן ההחלקה החיכוך הקינטי הופך אנרגיה לחום, ולכן האנרגיה לא נשמרת. את התוצאה קובע התנע הזוויתי.'
        misconception: MC-8-slipping-energy-conserved
    hints:
      - 'חשבו את התנע הזוויתי ההתחלתי סביב נקודה על השולחן, $mR\left(v + \beta\omega R\right)$, עם הסימן של $\omega_0$.'

chapter: 8
questions:
  # ---------------------------------------------------------------- OBJ-8.7-1 period and equivalent length
  - id: Q-8.7-rod-period
    type: numeric
    objectives: [OBJ-8.7-1]
    level: basic
    prompt: >-
      מוט אחיד באורך $1.0\,\text{m}$ תלוי על ציר אופקי בקצהו העליון ומתנודד בזוויות קטנות. מה זמן המחזור שלו?
    answer: 1.64
    unit: s
    correctFeedback: >-
      נכון. למטוטלת פיזיקלית $T = 2\pi\sqrt{\dfrac{I_P}{mgd}}$, כאשר $I_P$ סביב הציר ו-$d$ המרחק מהציר למרכז המסה. כאן
      $I_P = \tfrac13mL^2$ ו-$d = L/2$, ולכן $T = 2\pi\sqrt{\dfrac{2L}{3g}} = 2\pi\sqrt{\dfrac{2\cdot1.0}{3\cdot9.8}} = 1.64\,\text{s}$.
    wrongFeedback: 'כתבו את משוואת המומנט סביב הציר לזווית קטנה, $I_P\ddot\theta = -mgd\,\theta$, והשוו למתנד הרמוני.'
    commonWrong:
      - value: 2.01
        feedback: 'זה $2\pi\sqrt{L/g}$, מטוטלת פשוטה באורך $L$, שכל מסתה בקצה. במוט רוב המסה קרובה לציר, ולכן הוא מתנודד מהר יותר.'
      - value: 1.42
        feedback: 'זה $2\pi\sqrt{(L/2)/g}$: מטוטלת פשוטה באורך המרחק למרכז המסה. אבל המוט אינו מסה נקודתית במרכז שלו: $I_P = \tfrac13mL^2$, לא $m(L/2)^2$.'
        misconception: MC-8-equivalent-length-is-cm-distance
    hints:
      - 'מה מומנט ההתמד של מוט סביב הקצה, ומה המרחק מהציר למרכז המסה?'

  - id: Q-8.7-hoop-on-nail
    type: mc
    objectives: [OBJ-8.7-1]
    qualitative: true
    level: basic
    prompt: >-
      טבעת דקה ברדיוס $R$ תלויה על מסמר שעובר דרך נקודה בשפתה, ומתנודדת בזוויות קטנות במישור שלה. מה האורך
      השקול שלה, כלומר האורך של מטוטלת פשוטה עם אותו זמן מחזור?
    choices:
      - text: '$2R$, הקוטר.'
        correct: true
        feedback: >-
          נכון. $\ell = \dfrac{I_P}{md}$. סביב המסמר, לפי משפט הצירים המקבילים, $I_P = mR^2 + mR^2 = 2mR^2$, ו-$d = R$.
          לכן $\ell = 2R$: הטבעת מתנודדת כמו מסה נקודתית בנקודה התחתונה שלה.
      - text: '$R$, המרחק מהמסמר למרכז הטבעת.'
        feedback: '$R$ הוא המרחק למרכז המסה. האורך השקול גדול ממנו, כי מסת הטבעת מפוזרת רחוק ממרכז המסה: $\ell = d + \dfrac{I_{cm}}{md}$.'
        misconception: MC-8-equivalent-length-is-cm-distance
      - text: '$\tfrac32R$'
        feedback: 'זה האורך השקול של **דסקה** מלאה שתלויה בשפתה. בטבעת כל המסה רחוקה מהמרכז, ולכן $I_{cm}$ גדול יותר והאורך השקול ארוך יותר.'
        misconception: MC-8-inertia-only-mass
      - text: 'אין לה אורך שקול, כי מרכז המסה שלה הוא נקודה ריקה.'
        feedback: 'מרכז המסה לא חייב להיות בתוך החומר. מה שקובע את התנודה הוא $I_P$ סביב הציר ו-$d$ עד מרכז המסה, ושניהם מוגדרים היטב.'
    hints:
      - 'השוו $T = 2\pi\sqrt{I_P/(mgd)}$ ל-$2\pi\sqrt{\ell/g}$.'

  - id: Q-8.7-disc-equivalent-length
    type: numeric
    objectives: [OBJ-8.7-1]
    level: mid
    prompt: >-
      דסקה אחידה ברדיוס $0.15\,\text{m}$ תלויה על ציר אופקי שעובר בנקודה על השפה שלה וניצב למישור הדסקה. מה האורך
      השקול שלה?
    answer: 0.225
    unit: m
    correctFeedback: >-
      נכון. $I_P = \tfrac12mR^2 + mR^2 = \tfrac32mR^2$ ו-$d = R$, ולכן $\ell = \dfrac{I_P}{md} = \tfrac32R = 0.225\,\text{m}$.
      המסה מצטמצמת, ולכן כל דסקה ברדיוס הזה מתנודדת באותו זמן מחזור, $2\pi\sqrt{0.225/9.8} = 0.952\,\text{s}$.
    wrongFeedback: '$\ell = \dfrac{I_P}{md}$, עם $I_P$ סביב הציר (משפט הצירים המקבילים) ו-$d$ עד מרכז המסה.'
    commonWrong:
      - value: 0.15
        feedback: 'זה $d = R$, המרחק למרכז המסה. האורך השקול כולל גם את מומנט ההתמד סביב מרכז המסה: $\ell = d + \dfrac{I_{cm}}{md}$.'
        misconception: MC-8-equivalent-length-is-cm-distance
      - value: 0.075
        feedback: 'זה $\dfrac{I_{cm}}{md}$ בלבד. הציר לא עובר במרכז: $I_P$ סביבו כולל גם $md^2$.'
      - value: 0.3
        feedback: 'זה $2R$, האורך השקול של **טבעת**. בדסקה המסה קרובה יותר למרכז, ו-$I_{cm} = \tfrac12mR^2$.'
    hints:
      - 'מומנט ההתמד סביב נקודה בשפה: $\tfrac12mR^2 + mR^2$.'

  - id: Q-8.7-pivot-toward-centre
    type: twotier
    objectives: [OBJ-8.7-1]
    qualitative: true
    level: mid
    prompt: >-
      במוט אחיד באורך $L$ קודחים חור במרחק $d$ ממרכזו ותולים אותו על מסמר דרך החור. מתחילים עם $d = L/2$ (החור
      בקצה) ומקרבים את החור למרכז, עד $d \to 0$. מה קורה לזמן המחזור של תנודות קטנות?
    choices:
      - text: 'הוא קטן תחילה, מגיע למינימום, ואחר כך גדל בלי גבול.'
        correct: true
        feedback: 'נכון. המינימום ב-$d = L/\sqrt{12} \approx 0.29L$, וכש-$d \to 0$ זמן המחזור שואף לאינסוף.'
      - text: 'הוא קטן כל הזמן, כמו מטוטלת פשוטה שמקצרים את החוט שלה.'
        feedback: 'במטוטלת פשוטה $T \propto \sqrt{\ell}$. במוט, כשהחור מתקרב למרכז, $I_P$ לא שואף לאפס: הוא נשאר לפחות $\tfrac{1}{12}mL^2$, בעוד שמומנט הכובד, $mgd\sin\theta$, נעלם.'
        misconception: MC-8-shorter-arm-shorter-period
      - text: 'הוא גדל כל הזמן.'
        feedback: 'בקצה, $T = 2\pi\sqrt{2L/(3g)}$, ופנימה יותר, ב-$d = 0.29L$, הוא קטן יותר: $2\pi\sqrt{0.58L/g}$. רק מתחת לזה הוא מתחיל לגדול.'
      - text: 'הוא לא משתנה, כי המסה והאורך של המוט לא משתנים.'
        feedback: 'גם $I_P$ סביב הציר וגם $d$ משתנים עם מקום החור, ולכן גם זמן המחזור.'
        misconception: MC-8-inertia-only-mass
    reasons:
      - text: '$T^2 \propto \dfrac{L^2/12 + d^2}{d}$: כש-$d$ גדול שולט $d$ במונה, וכש-$d$ קטן שולט $1/d$.'
        correct: true
        feedback: 'זה הנימוק. גזירה של $\dfrac{L^2/12 + d^2}{d}$ לפי $d$ והשוואה לאפס נותנת $d^2 = \dfrac{L^2}{12}$.'
      - text: '$d$ ממלא את תפקיד אורך החוט, ולכן $T \propto \sqrt d$.'
        feedback: 'אורך החוט של המטוטלת השקולה אינו $d$ אלא $\ell = d + \dfrac{L^2}{12d}$, והוא גדל גם כש-$d$ קטן.'
        misconception: MC-8-shorter-arm-shorter-period
      - text: 'ככל שהחור קרוב למרכז, המוט סימטרי יותר, והוא מתנודד בקלות.'
        feedback: 'סימטריה סביב הציר דווקא מבטלת את מומנט הכובד: כשהחור במרכז בדיוק, המוט בשיווי משקל אדיש ולא מתנודד כלל.'
    hints:
      - 'כתבו $T(d)$ בעזרת משפט הצירים המקבילים. מה קורה כש-$d \to 0$?'

  - id: Q-8.7-min-period
    type: numeric
    objectives: [OBJ-8.7-1]
    level: bagrut
    prompt: >-
      מוט אחיד באורך $1.0\,\text{m}$ ובמסה $0.20\,\text{kg}$, ובקצה אחד שלו מהודק גוש קטן במסה $0.20\,\text{kg}$.
      קודחים חורים לאורך המוט ותולים אותו על מסמר דרך אחד מהם. מה זמן המחזור **הקצר ביותר** של תנודות קטנות שאפשר
      לקבל כך?
    answer: 1.61
    unit: s
    correctFeedback: >-
      נכון. ציר $x$ לאורך המוט מהקצה החשוף. מרכז המסה של המערכת ב-$x_{cm} = \dfrac{0.20\cdot0.50 + 0.20\cdot1.0}{0.40} = 0.75\,\text{m}$.
      סביבו, לפי משפט הצירים המקבילים לכל חלק,
      $I_{cm} = \tfrac{1}{12}\cdot0.20\cdot1.0^2 + 0.20\cdot0.25^2 + 0.20\cdot0.25^2 = 0.0417\,\text{kg}\cdot\text{m}^2$, ולכן
      $k = \sqrt{I_{cm}/M} = 0.323\,\text{m}$. זמן המחזור הקצר ביותר הוא ב-$d = k$, שם $\ell = 2k$:
      $T_{min} = 2\pi\sqrt{2k/g} = 1.61\,\text{s}$, בחור שנמצא $0.427\,\text{m}$ מהקצה החשוף. (בצד של הגוש, $d = k$ כבר מחוץ למוט.)
      **בדיקת גבולות:** בלי הגוש $k = L/\sqrt{12}$ ו-$T_{min} = 1.53\,\text{s}$.
    wrongFeedback: 'מצאו קודם את מרכז המסה של המערכת, ואז את $I_{cm}$ סביבו ואת $k$. זמן המחזור הקצר ביותר הוא בחור שבו $d = k$.'
    commonWrong:
      - value: 1.53
        feedback: 'זה $T_{min}$ של מוט בלי הגוש. הגוש מזיז את מרכז המסה ומוסיף מומנט התמד, ולכן $k$ אחר.'
      - value: 1.81
        feedback: 'חישבתם את מומנט ההתמד סביב **מרכז המוט** וחילקתם במסה הכוללת. $k$ מוגדר סביב מרכז המסה של המערכת, $0.75\,\text{m}$ מהקצה החשוף, ושם $I$ קטן יותר.'
        misconception: MC-8-parallel-axis-any-axis
      - value: 1.14
        feedback: 'זה $2\pi\sqrt{k/g}$: מטוטלת פשוטה באורך $d = k$. אבל האורך השקול הוא $\ell = d + \dfrac{k^2}{d} = 2k$.'
        misconception: MC-8-equivalent-length-is-cm-distance
    hints:
      - 'זמן המחזור הקצר ביותר של כל גוף הוא $2\pi\sqrt{2k/g}$, כאשר $k^2 = I_{cm}/M$. מה $I_{cm}$ של המערכת?'
      - 'את $I_{cm}$ של המערכת מחשבים סביב מרכז המסה **של המערכת**, לא של המוט: משפט הצירים המקבילים לכל חלק בנפרד, מהמרכז שלו אל מרכז המסה המשותף, ואז סכום.'

  # ---------------------------------------------------------------- OBJ-8.7-2 centre of percussion
  - id: Q-8.7-sweet-spot
    type: mc
    objectives: [OBJ-8.7-2]
    qualitative: true
    level: basic
    prompt: >-
      שחקן מחזיק מחבט בקצה הידית. כשהכדור פוגע בנקודה מסוימת על המחבט, "הנקודה המתוקה", הידיים כמעט לא מרגישות
      מכה. מה מיוחד בנקודה הזו?
    choices:
      - text: 'מכה בה גורמת למחבט להתחיל להסתובב בדיוק סביב הידיים, ולכן הן לא צריכות להפעיל מתקף.'
        correct: true
        feedback: >-
          נכון. זה **מרכז ההקשה** ביחס לידיים. מכה בין הידיים לבינו מזיזה את הידית קדימה, ומכה רחוק ממנו מזיזה אותה
          אחורה. בנקודה עצמה שתי הנטיות מתקזזות, והידית נשארת במקום ברגע המכה.
      - text: 'היא מרכז המסה של המחבט: מכה שם לא מסובבת אותו.'
        feedback: >-
          מכה במרכז המסה של מחבט חופשי מזיזה אותו קדימה **בלי** סיבוב, כך שגם הידית נדחפת קדימה, והידיים צריכות
          לבלום אותה. מרכז ההקשה רחוק יותר מהידיים ממרכז המסה.
        misconception: MC-8-sweet-spot-is-cm
      - text: 'היא הקצה החופשי, שבו הזרוע הארוכה ביותר.'
        feedback: 'מכה בקצה מסובבת את המחבט הכי חזק, ולכן הידית נדחפת אחורה, אל תוך הידיים. מרכז ההקשה בתוך המחבט, לא בקצה.'
      - text: 'היא הנקודה שבה המחבט הכי עבה וכבד.'
        feedback: 'העובי משנה את פיזור המסה, ולכן את מקום מרכז ההקשה, אבל הנקודה מוגדרת על ידי תנועה: הנקודה שבמכה בה הידית לא זזה.'
    hints:
      - 'מכה במקום מסוים גם מזיזה את מרכז המסה וגם מסובבת את המחבט סביבו. מה זה עושה לידית?'

  - id: Q-8.7-bat-percussion
    type: numeric
    objectives: [OBJ-8.7-2]
    level: mid
    prompt: >-
      מתייחסים למחבט כמוט אחיד באורך $0.90\,\text{m}$, שמוחזק בקצה אחד. באיזה מרחק מהידיים נמצא מרכז ההקשה שלו?
    answer: 0.6
    unit: m
    correctFeedback: >-
      נכון. מכה $J$ במרחק $b$ מהציר נותנת $Jb = I_P\omega$ ו-$J + J_P = m\omega d$, כאשר $J_P$ הוא המתקף של הציר ו-$d = L/2$.
      $J_P = 0$ כש-$b = \dfrac{I_P}{md} = \dfrac{mL^2/3}{mL/2} = \tfrac23L = 0.600\,\text{m}$. זה בדיוק **האורך השקול** של
      המוט כמטוטלת פיזיקלית סביב אותה נקודה.
    wrongFeedback: 'כתבו את שינוי התנע הקווי (עם מתקף הציר $J_P$) ואת המתקף הזוויתי סביב הציר, ודרשו $J_P = 0$.'
    commonWrong:
      - value: 0.45
        feedback: 'זה מרכז המסה. מכה שם מזיזה את כל המוט קדימה, והידיים צריכות לבלום את הידית. מרכז ההקשה רחוק יותר: $\dfrac{I_P}{md} > d$.'
        misconception: MC-8-sweet-spot-is-cm
      - value: 0.9
        feedback: 'זה הקצה. מכה בקצה מסובבת את המוט חזק מדי, והידית נדחפת אחורה, אל הידיים.'
    hints:
      - 'מרכז ההקשה נמצא במרחק $\dfrac{I_P}{md}$ מהציר. האם הביטוי הזה מוכר מהשאלות על זמן המחזור?'

  - id: Q-8.7-pivot-impulse
    type: numeric
    objectives: [OBJ-8.7-2]
    level: bagrut
    prompt: >-
      דלת אחידה במסה $12\,\text{kg}$ וברוחב $0.90\,\text{m}$ תלויה על צירים אנכיים בלי חיכוך. לאורך הקצה החופשי שלה,
      $0.90\,\text{m}$ מהצירים, מחובר פס מתכת אנכי דק במסה $3.0\,\text{kg}$. הדלת פתוחה ונמצאת במנוחה. כדור במסה
      $0.40\,\text{kg}$ פוגע בה בניצב למישור הדלת, במרחק $0.30\,\text{m}$ מהצירים, במהירות $5.0\,\text{m/s}$, וניתר
      לאחור במהירות $3.0\,\text{m/s}$. מה גודל המתקף שהצירים מפעילים על הדלת בזמן הפגיעה?
    answer: 1.83
    unit: N·s
    correctFeedback: >-

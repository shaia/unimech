          הרבה פחות.
      - value: 4.97
        feedback: >-
          חישבתם את הדרך כ-$vt$ עם המהירות ב-$t = 6.0\,\text{s}$, $5.0\,\text{m/s}$. המהירות יורדת עד אפס, והממוצעת

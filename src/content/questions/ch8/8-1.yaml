# Lesson 8.1 question bank: the comprehension ladder of "קינמטיקה של גוף צפיד".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# Strings may hold $inline$ / $$display$$ TeX and **bold**. Never use "…" for TeX.
#
# Every number was computed in .scratch/ch8/q.ts with src/physics/constants.ts (G = 9.8):
#   rod on ice, L = 1.2 m, v_cm = 3.0 m/s, ω = 4.0 rad/s: ends 5.4 and 0.6 m/s, point at rest v/ω = 0.75 m from the centre;
#   fan 30 rad/s → 0 in 6.0 s: α = −5 rad/s², θ = 90 rad (14.3 revolutions);
#   disc R = 0.20 m, α = 3.0 rad/s², t = 1.0 s: a_t = 0.60, a_c = 1.8, |a| = 1.90 m/s²;
#   car 0 → 20 m/s in 8.0 s, wheel R = 0.32 m: 80 m, 250 rad, 39.8 revolutions (79.6 with s = vt).

chapter: 8
questions:
  # ---------------------------------------------------------------- OBJ-8.1-1 translation + rotation, v = v_cm + ω × r
  - id: Q-8.1-rolling-points
    type: multi
    objectives: [OBJ-8.1-1]
    qualitative: true
    level: basic
    prompt: >-
      גלגל ברדיוס $R$ מתגלגל בלי החלקה על כביש אופקי, ומרכזו נע ימינה במהירות $v$. בחרו את **כל** הטענות הנכונות
      לגבי המהירויות, ביחס לכביש, ברגע מסוים.
    choices:
      - text: 'הנקודה של הגלגל שנוגעת בכביש נמצאת ברגע זה במנוחה.'
        correct: true
        feedback: >-
          נכון. מהירות הנקודה היא $\vec v_{cm} + \vec\omega\times\vec r$. בנקודת המגע הסיבוב תורם $\omega R = v$ שמאלה,
          וההזזה תורמת $v$ ימינה, והסכום אפס. זה בדיוק התנאי "בלי החלקה".
      - text: 'הנקודה העליונה של הגלגל נעה ימינה במהירות $2v$.'
        correct: true
        feedback: 'נכון. למעלה שתי התרומות באותו כיוון: $v$ של ההזזה ועוד $\omega R = v$ של הסיבוב.'
      - text: 'כל נקודות הגלגל נעות ימינה במהירות $v$, כי הגלגל כולו מתקדם יחד.'
        feedback: >-
          במהירות $v$ נע רק המרכז. לכל נקודה אחרת מתווספת מהירות הסיבוב $\vec\omega\times\vec r$, שתלויה במקומה:
          למעלה היא מוסיפה, ולמטה מחסירה.
        misconception: MC-8-all-points-move-with-cm
      - text: 'נקודת המגע נעה שמאלה במהירות $v$, כי הגלגל מסתובב.'
        feedback: >-
          $v$ שמאלה היא מהירות נקודת המגע **ביחס למרכז הגלגל**, כאילו הציר היה קבוע. ביחס לכביש צריך להוסיף את
          מהירות המרכז, $v$ ימינה, והסכום אפס.
        misconception: MC-8-forget-translation
      - text: 'מרכז הגלגל נע ימינה במהירות $v$.'
        correct: true
        feedback: 'נכון, זה הנתון. במרכז $\vec r = 0$, ולכן הסיבוב לא תורם לו דבר.'
    hints:
      - 'כתבו את מהירות כל נקודה כסכום: מהירות המרכז ועוד מהירות הסיבוב סביב המרכז, $\omega R$ בכיוון המשיק.'

  - id: Q-8.1-rim-front
    type: vector
    objectives: [OBJ-8.1-1]
    level: mid
    prompt: >-
      גלגל מתגלגל בלי החלקה ימינה (מזרחה) על כביש אופקי, כשמרכזו נע במהירות $v$. מסתכלים על הנקודה בשפת הגלגל
      שנמצאת בגובה הציר, בצד הקדמי (הימני) שלו. מה כיוון המהירות שלה ביחס לכביש? למעלה בדף הוא צפון.
    answer: se
    correctFeedback: >-
      נכון. גלגל שמתגלגל ימינה מסתובב בכיוון השעון. בנקודה הימנית, מהירות הסיבוב $\omega R = v$ פונה מטה, ויחד עם
      מהירות המרכז $v$ ימינה מתקבל וקטור בזווית $45^\circ$ מתחת לאופק, בגודל $\sqrt2\,v$. אפשר לבדוק גם בדרך אחרת:
      הנקודה מסתובבת ברגע זה סביב נקודת המגע, ולכן מהירותה ניצבת לקו שמחבר אותה לנקודת המגע.
    wrongFeedback: 'חברו שני וקטורים: מהירות המרכז, ומהירות הסיבוב סביב המרכז. לאן פונה מהירות הסיבוב בנקודה הימנית כשהגלגל מסתובב בכיוון השעון?'
    wrong:
      - dir: e
        feedback: 'זו רק מהירות המרכז. הנקודה גם מסתובבת סביבו, ובצד הימני הסיבוב בכיוון השעון מוריד אותה מטה.'
        misconception: MC-8-all-points-move-with-cm
      - dir: s
        feedback: 'זו רק מהירות הסיבוב, כאילו ציר הגלגל עומד במקום. ביחס לכביש צריך להוסיף את מהירות המרכז, ימינה.'
        misconception: MC-8-forget-translation
      - dir: ne
        feedback: >-
          בדקו את כיוון הסיבוב. כדי שנקודת המגע תהיה במנוחה, הגלגל חייב להסתובב בכיוון השעון כשהוא נע ימינה, ואז
          הנקודה הימנית יורדת, לא עולה.
    hints:
      - 'גלגל שמתגלגל ימינה: האם הוא מסתובב בכיוון השעון או נגדו?'

  - id: Q-8.1-contact-acceleration
    type: twotier
    objectives: [OBJ-8.1-1]
    qualitative: true
    level: mid
    prompt: >-
      גלגל ברדיוס $R$ מתגלגל בלי החלקה במהירות קבועה $v$. ברגע מסוים נקודה $P$ על שפת הגלגל נוגעת בכביש, ולכן
      היא במנוחה. מה התאוצה של $P$ ברגע הזה?
    choices:
      - text: 'בגודל $v^2/R$, כלפי מעלה, אל מרכז הגלגל.'
        correct: true
        feedback: 'נכון. הנקודה נמצאת במנוחה רק לרגע, ומיד אחר כך היא עולה מהכביש. שינוי של מהירות הוא תאוצה.'
      - text: 'אפס, כי הנקודה נמצאת במנוחה.'
        feedback: >-
          מהירות אפס ברגע אחד לא אומרת שהמהירות לא משתנה. כדור שנזרק כלפי מעלה נמצא במנוחה בשיא, ותאוצתו שם $g$.
          גם $P$ עוצרת רק לרגע ומיד ממשיכה לעלות.
        misconception: MC-8-instant-rest-no-acceleration
      - text: 'בגודל $v^2/R$, כלפי מטה.'
        feedback: 'הגודל נכון, אבל תאוצה צנטריפטלית פונה אל מרכז המעגל, והמרכז נמצא מעל $P$.'
    reasons:
      - text: 'במערכת שנעה עם מרכז הגלגל, כל נקודה בשפה נעה במעגל במהירות $v$, והמערכת הזו אינרציאלית כי $v$ קבועה.'
        correct: true
        feedback: >-
          זה הנימוק. במערכת שנעה במהירות קבועה התאוצות זהות לתאוצות ביחס לכביש. שם $P$ בתנועה מעגלית קצובה,
          ולכן תאוצתה $v^2/R$ אל המרכז, בכל רגע ובכל מקום בשפה.
      - text: 'מהירות $P$ אפס, ולכן גם הנגזרת שלה אפס.'
        feedback: 'הנגזרת של פונקציה שמתאפסת בנקודה אחת לא חייבת להתאפס שם. תאוצה היא הקצב שבו המהירות משתנה, לא המהירות עצמה.'
        misconception: MC-8-instant-rest-no-acceleration
      - text: 'הכביש דוחף את $P$ כלפי מעלה, ולכן יש לה תאוצה כלפי מעלה.'
        feedback: 'השאלה היא קינמטית: התאוצה נקבעת מהתנועה, מבלי לדעת אילו כוחות פועלים. הכוח הנורמלי פועל על הגלגל כולו, לא מסביר תאוצה של נקודה אחת.'
    hints:
      - 'עברו למערכת שנעה עם מרכז הגלגל. איזו תנועה עושה $P$ שם?'

  - id: Q-8.1-rod-rest-point
    type: numeric
    objectives: [OBJ-8.1-1]
    level: bagrut
    prompt: >-
      מוט באורך $1.2\,\text{m}$ מחליק על קרח. ברגע מסוים הוא מונח לאורך הקו מזרח-מערב, מרכזו נע צפונה במהירות
      $3.0\,\text{m/s}$, והוא מסתובב במהירות זוויתית $4.0\,\text{rad/s}$ נגד כיוון השעון, במבט מלמעלה.
      דמיינו את המוט מוארך בקו ישר לשני הצדדים, כחלק מאותו גוף צפיד. באיזה מרחק ממרכז המוט נמצאת הנקודה של
      הקו הזה שמהירותה ברגע הזה אפס?
    answer: 0.75
    unit: m
    correctFeedback: >-
      נכון. נקודה במרחק $x$ מהמרכז לאורך המוט נעה במהירות $v_{cm} + \omega x$ צפונה, כאשר $x$ חיובי מזרחה
      (סיבוב נגד כיוון השעון דוחף את הקצה המזרחי צפונה). המהירות מתאפסת ב-$x = -\dfrac{v_{cm}}{\omega} = -\dfrac{3.0}{4.0} = -0.75\,\text{m}$:
      $0.75\,\text{m}$ מערבית למרכז, $0.15\,\text{m}$ מעבר לקצה. הקצה המזרחי נע ב-$5.4\,\text{m/s}$, והמערבי רק
      ב-$0.6\,\text{m/s}$. **בדיקת גבולות:** כש-$\omega \to 0$ הנקודה בורחת לאינסוף (הזזה טהורה), וכש-$v_{cm} \to 0$ היא
      המרכז עצמו (סיבוב טהור).
    wrongFeedback: 'כתבו את מהירות נקודה במרחק $x$ מהמרכז לאורך המוט: $v_{cm} + \omega x$, עם סימן לפי כיוון הסיבוב. מתי זה מתאפס?'
    commonWrong:
      - value: 0.6
        feedback: >-
          זה חצי אורך המוט. הקצה המערבי נע עדיין ב-$3.0 - 4.0\cdot0.6 = 0.6\,\text{m/s}$, ולכן הנקודה שבמנוחה נמצאת
          מעבר לקצה. הציר הרגעי לא חייב להיות בתוך הגוף.
      - value: 1.33
        feedback: 'חילקתם הפוך: $\omega/v_{cm}$ יוצא ביחידות $1/\text{m}$. מ-$v_{cm} = \omega x$ מקבלים $x = v_{cm}/\omega$.'
    hints:
      - 'מהירות הסיבוב של נקודה במרחק $x$ מהמרכז היא $\omega x$, ניצבת למוט.'

  # ---------------------------------------------------------------- OBJ-8.1-2 constant α, angular ↔ linear
  - id: Q-8.1-same-omega
    type: mc
    objectives: [OBJ-8.1-2]
    qualitative: true
    level: basic
    prompt: >-
      שני ילדים עומדים על קרוסלה שמסתובבת במהירות קבועה: A במרחק $1.0\,\text{m}$ מהציר, ו-B במרחק $2.0\,\text{m}$
      ממנו. מה נכון?
    choices:
      - text: 'למהירות הזוויתית שלהם אותו ערך, וגודל המהירות של B כפול מזה של A.'
        correct: true
        feedback: >-
          נכון. המהירות הזוויתית היא תכונה של הגוף הצפיד כולו: כל קו בקרוסלה מסתובב באותה זווית באותו זמן. גודל
          המהירות של נקודה הוא $v = \omega r$, ולכן הוא גדל עם המרחק מהציר.
      - text: 'גודל המהירות שלהם שווה, ולכן המהירות הזוויתית של B היא חצי מזו של A.'
        feedback: >-
          אם כך, B היה מפגר אחרי A והקו שמחבר אותם היה מתעקם, אבל הקרוסלה צפידה. B עובר באותו זמן דרך ארוכה פי
          2, ולכן מהירותו כפולה.
        misconception: MC-8-same-speed-at-every-radius
      - text: 'גם המהירות הזוויתית וגם גודל המהירות של B כפולים.'
        feedback: 'שני הילדים משלימים סיבוב באותו זמן בדיוק, ולכן המהירות הזוויתית שלהם שווה. רק המהירות הקווית גדלה עם $r$.'
      - text: 'גודל המהירות שלהם שווה, וגם המהירות הזוויתית שלהם שווה.'
        feedback: 'שני הדברים לא יכולים להתקיים יחד, כי $v = \omega r$ ו-$r$ שונה. B עובר בכל סיבוב היקף כפול באותו זמן.'
        misconception: MC-8-same-speed-at-every-radius

  - id: Q-8.1-fan-angle
    type: numeric
    objectives: [OBJ-8.1-2]
    level: basic
    prompt: >-
      מאוורר מסתובב במהירות זוויתית $30\,\text{rad/s}$. מכבים אותו, והוא מאט בתאוצה זוויתית קבועה עד שהוא עוצר
      אחרי $6.0\,\text{s}$. בכמה רדיאנים הוא מסתובב בזמן ההאטה?
    answer: 90
    unit: rad
    correctFeedback: >-
      נכון. $\alpha = \dfrac{0 - 30}{6.0} = -5.0\,\text{rad/s}^2$, ו-$\theta = \omega_0 t + \tfrac12\alpha t^2 = 30\cdot6.0 - \tfrac12\cdot5.0\cdot36 = 90\,\text{rad}$.
      קיצור דרך: בתאוצה קבועה הזווית היא המהירות הזוויתית הממוצעת כפול הזמן, $\tfrac12(30 + 0)\cdot6.0$. זה כ-14
      סיבובים.
    wrongFeedback: 'אלה אותן משוואות של תנועה בתאוצה קבועה, עם $\theta$, $\omega$ ו-$\alpha$ במקום $x$, $v$ ו-$a$. מצאו קודם את $\alpha$.'
    commonWrong:
      - value: 180
        feedback: 'זה $\omega_0 t$, כאילו המאוורר המשיך במהירות ההתחלתית כל הזמן. הוא מאט, ולכן המהירות הממוצעת היא חצי מ-$\omega_0$.'
      - value: 14.3
        feedback: 'זה מספר הסיבובים, $90/(2\pi)$. השאלה מבקשת רדיאנים.'
    hints:
      - 'בתאוצה קבועה, מה המהירות הזוויתית הממוצעת?'

  - id: Q-8.1-rim-acceleration
    type: numeric
    objectives: [OBJ-8.1-2]
    level: mid
    prompt: >-
      דסקה ברדיוס $0.20\,\text{m}$ מתחילה להסתובב ממנוחה סביב ציר קבוע בתאוצה זוויתית קבועה $3.0\,\text{rad/s}^2$.
      מה גודל התאוצה של נקודה בשפת הדסקה אחרי $1.0\,\text{s}$?
    answer: 1.9
    unit: m/s²
    correctFeedback: >-
      נכון. לתאוצה שני רכיבים ניצבים. המשיקי: $a_t = \alpha R = 3.0\cdot0.20 = 0.60\,\text{m/s}^2$. הצנטריפטלי, עם
      $\omega = \alpha t = 3.0\,\text{rad/s}$: $a_c = \omega^2R = 9.0\cdot0.20 = 1.8\,\text{m/s}^2$. הגודל
      $\sqrt{0.60^2 + 1.8^2} = 1.90\,\text{m/s}^2$. הרכיב המשיקי קבוע, והצנטריפטלי גדל כמו $t^2$.
    wrongFeedback: 'לנקודה בשפה יש תאוצה משיקית $\alpha R$ ותאוצה צנטריפטלית $\omega^2R$. הן ניצבות זו לזו.'
    commonWrong:
      - value: 0.6
        feedback: 'זו רק התאוצה המשיקית, $\alpha R$. הנקודה גם נעה במעגל, ולכן יש לה גם תאוצה אל המרכז, $\omega^2R$.'
      - value: 1.8
        feedback: 'זו רק התאוצה הצנטריפטלית. המהירות הזוויתית גדלה, ולכן יש גם רכיב משיקי, $\alpha R$.'
      - value: 2.4
        feedback: 'חיברתם את הגדלים, $0.60 + 1.8$. הרכיבים ניצבים זה לזה, ולכן מחברים אותם כמו ניצבים במשולש: שורש סכום הריבועים.'
    hints:
      - 'מצאו קודם את $\omega$ ברגע $t = 1.0\,\text{s}$.'

  - id: Q-8.1-wheel-turns
    type: numeric
    objectives: [OBJ-8.1-2]
    level: bagrut
    prompt: >-
      מכונית מאיצה ממנוחה בתאוצה קבועה עד $20\,\text{m/s}$ בתוך $8.0\,\text{s}$. רדיוס הגלגלים $0.32\,\text{m}$,
      והם מתגלגלים בלי החלקה. כמה סיבובים שלמים (בערך) עושה כל גלגל בזמן הזה?
    answer: 39.8
    unit: סיבובים
    correctFeedback: >-
      נכון. בגלגול בלי החלקה הדרך שהמרכז עובר שווה לאורך הקשת שהשפה "פורשת" על הכביש, $s = R\theta$. המכונית
      עוברת $s = \tfrac12\cdot20\cdot8.0 = 80\,\text{m}$, ולכן $\theta = \dfrac{80}{0.32} = 250\,\text{rad}$, כלומר
      $\dfrac{250}{2\pi} \approx 39.8$ סיבובים. באותה דרך גם $\alpha = a/R = 7.8\,\text{rad/s}^2$: כל גודל קווי של המרכז
      הוא $R$ כפול הגודל הזוויתי.
    wrongFeedback: 'מצאו את הדרך שהמכונית עוברת, והמירו אותה לזווית בעזרת $s = R\theta$. אחר כך המירו רדיאנים לסיבובים.'
    commonWrong:
      - value: 250

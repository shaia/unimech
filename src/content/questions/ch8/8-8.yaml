chapter: 8
questions:
  # ---------------------------------------------------------------- OBJ-8.8-1 L not parallel to ω, principal axes
  - id: Q-8.8-dumbbell-L
    type: mc
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: basic
    prompt: >-
      משקולת: שתי מסות שוות בקצות מוט קל, שמרכזו מחובר לסרן אנכי. המוט נטוי בזווית $30^\circ$ לסרן, והכול
      מסתובב סביב הסרן במהירות זוויתית קבועה $\vec\omega$, כלפי מעלה. מה כיוון התנע הזוויתי $\vec L$ ביחס למרכז המוט?
    choices:
      - text: 'ניצב למוט, במישור שמכיל את המוט ואת הציר, ולכן הוא מסתובב יחד עם המשקולת סביב הציר.'
        correct: true
        feedback: >-
          נכון. כל מסה נעה במעגל אופקי, ו-$\vec r\times m\vec v$ שלה ניצב גם ל-$\vec r$ (לאורך המוט) וגם ל-$\vec v$.
          שתי המסות תורמות אותו וקטור, ניצב למוט. הוא נטוי $60^\circ$ מ-$\vec\omega$, ולכן הוא סורק חרוט סביב הציר.
      - text: 'לאורך הציר, כמו $\vec\omega$.'
        feedback: >-
          $\vec L = I\vec\omega$ כשהסיבוב סביב ציר ראשי, כמו ציר סימטריה. כאן הציר נטוי למוט ואינו ציר ראשי של
          המשקולת, ולכן $\vec L$ פונה לכיוון אחר.
        misconception: MC-8-L-parallel-omega
      - text: 'לאורך המוט.'
        feedback: 'המסות נמצאות על המוט, ולכן $\vec r$ לאורך המוט, ו-$\vec r\times\vec v$ ניצב לו. לרכיב של $\vec L$ לאורך המוט אין מקור.'
      - text: 'אפס, כי שתי המסות נעות בכיוונים מנוגדים.'
        feedback: 'גם $\vec r$ שלהן מנוגד, ולכן $\vec r\times m\vec v$ של שתיהן שווה, לא מנוגד. התרומות מתחברות.'
    hints:
      - 'חשבו $\vec r\times m\vec v$ למסה העליונה: $\vec r$ לאורך המוט, ו-$\vec v$ אופקי ומשיק למעגל שלה.'

  - id: Q-8.8-tensor-apply
    type: numeric
    objectives: [OBJ-8.8-1]
    level: basic
    prompt: >-
      טנזור ההתמד של גוף צפיד, ביחס לנקודה קבועה $O$ ובצירים $x, y, z$, הוא

      $$\mathbf I = \begin{pmatrix} 0.20 & 0 & -0.06\\ 0 & 0.25 & 0\\ -0.06 & 0 & 0.10 \end{pmatrix}\ \text{kg}\cdot\text{m}^2$$

      הגוף מסתובב סביב ציר $z$ שעובר דרך $O$, במהירות זוויתית $\vec\omega = (0,\,0,\,4.0)\,\text{rad/s}$. מה הזווית
      בין התנע הזוויתי $\vec L = \mathbf I\vec\omega$ לבין $\vec\omega$, במעלות?
    answer: 31.0
    unit: °
    correctFeedback: >-
      נכון. כל רכיב של $\vec L$ הוא שורה של המטריצה כפול $\vec\omega$. רק $\omega_z$ שונה מאפס, ולכן $\vec L$ הוא העמודה
      השלישית כפול $4.0$: $\vec L = (-0.24,\,0,\,0.40)\,\text{kg}\cdot\text{m}^2/\text{s}$. הזווית מ-$z$:
      $\tan\alpha = 0.24/0.40$, $\alpha = 31.0^\circ$. מכפלת ההתמד $I_{xz} = -0.06$ היא שנותנת ל-$\vec L$ רכיב $x$.
    wrongFeedback: 'כפלו את המטריצה ב-$\vec\omega$, שורה אחרי שורה, ומצאו את הזווית של $\vec L$ מציר $z$.'
    commonWrong:
      - value: 59.0
        feedback: 'זו הזווית של $\vec L$ מציר $x$, $\arctan(0.40/0.24)$. השאלה שואלת על הזווית מ-$\vec\omega$, שפונה לאורך $z$.'
      - value: 0.540
        feedback: 'זו התשובה ברדיאנים. השאלה מבקשת מעלות: $0.540\,\text{rad} = 31.0^\circ$.'
    hints:
      - 'כש-$\vec\omega$ לאורך $z$, כל רכיב של $\vec L$ הוא האיבר בעמודה השלישית של אותה שורה, כפול $\omega_z$.'

  - id: Q-8.8-principal-axes
    type: multi
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: mid
    prompt: >-
      ציר ראשי של גוף, בנקודה נתונה, הוא ציר שאם הגוף מסתובב סביבו, $\vec L$ מקביל ל-$\vec\omega$. בחרו את **כל**
      הצירים שהם צירים ראשיים.
    choices:
      - text: 'בתיבה אחידה עם צלעות שונות $a \ne b \ne c$: שלושת הצירים שעוברים במרכזה ומקבילים לצלעות.'
        correct: true
        feedback: 'נכון. כל אחד מהם ניצב למישור סימטריה של התיבה, שעובר במרכזה ומקביל לפאות: לכל מסה יש מסה תאומה בצד השני של המישור, והתאומות מבטלות את מכפלות ההתמד, למשל $\sum mxz = 0$. הניצב למישור סימטריה הוא ציר ראשי.'
      - text: 'באותה תיבה: האלכסון הראשי, מפינה לפינה דרך המרכז.'
        feedback: >-
          בתיבה שצלעותיה שונות האלכסון אינו ציר ראשי. בבסיס של הצלעות $\vec L = (I_1\omega_1, I_2\omega_2, I_3\omega_3)$,
          ולאורך האלכסון שלושת הרכיבים של $\vec\omega$ שונים מאפס, ולכן כש-$I_1 \ne I_2 \ne I_3$, $\vec L$ לא מקביל ל-$\vec\omega$.
        misconception: MC-8-L-parallel-omega
      - text: 'בקובייה אחידה: כל ציר שעובר במרכזה.'
        correct: true
        feedback: 'נכון. בקובייה $I_1 = I_2 = I_3$, ולכן $\vec L = I\vec\omega$ לכל כיוון של $\vec\omega$, כמו בכדור.'
      - text: 'בדסקה דקה ואחידה: כל קוטר.'
        correct: true
        feedback: 'נכון. כל קוטר ניצב למישור סימטריה של הדסקה: המישור שמכיל את ציר הדסקה ואת הקוטר שניצב לקוטר הזה. לכן כל קוטר הוא ציר ראשי, עם אותו מומנט התמד, $\tfrac14MR^2$. גם הציר הניצב לדסקה ראשי: הוא ציר הסימטריה שלה.'
      - text: 'בתיבה עם צלעות שונות: ציר שעובר בפינה ולאורך אחת הצלעות.'
        feedback: >-
          לא. שימו את הפינה בראשית, ציר $z$ לאורך הצלע $c$, ו-$x$, $y$ לאורך שתי הצלעות האחרות. לכל חלקיק של התיבה
          $x \ge 0$ ו-$z \ge 0$, ולכן כל התרומות ל-$\sum mxz$ חיוביות, ואין תאומים שמבטלים אותן: $I_{xz} \ne 0$, ול-$\vec L$
          יש רכיב $x$, שניצב לציר. בלוח דק, כמו בדוגמה על הלוח המלבני בשיעור, המצב שונה: שם הציר ניצב ללוח, $z = 0$
          לכל המסה, ולכן הציר הניצב בפינה כן ראשי.
    hints:
      - 'ציר ראשי הוא כיוון שבו טנזור ההתמד פועל כמו מספר: $\mathbf I\vec\omega = \lambda\vec\omega$. סימטריה עוזרת למצוא אותו.'

  - id: Q-8.8-wheel-balance
    type: twotier
    objectives: [OBJ-8.8-1]
    qualitative: true
    level: mid
    prompt: >-
      גלגל של מכונית מורכב על הסרן כך שמרכז המסה שלו בדיוק על הסרן, אבל מישור הגלגל נטוי מעט: הסרן אינו ניצב לו
      בדיוק. הגלגל מסתובב במהירות זוויתית קבועה. האם המסבים של הסרן צריכים להפעיל עליו מומנט?
    choices:
      - text: 'כן, מומנט שמסתובב יחד עם הגלגל, ולכן הגלגל "מנדנד" את המכונית.'
        correct: true
        feedback: 'נכון. זה חוסר איזון **דינמי**. מוסך מאזן אותו בעזרת משקולות קטנות, בשני הצדדים של הגלגל, כדי להפוך את הסרן לציר ראשי.'
      - text: 'לא. מרכז המסה על הסרן, ולכן אין צורך בכוח, ו-$\omega$ קבועה, ולכן אין צורך במומנט.'
        feedback: >-
          מרכז מסה על הציר אכן מבטל את הצורך ב**כוח**. אבל $\omega$ קבועה לא אומרת ש-$\vec L$ קבוע: כשהסרן אינו ציר
          ראשי, $\vec L$ נטוי ממנו ומסתובב איתו, ו-$\dfrac{d\vec L}{dt} \ne 0$.
        misconception: MC-8-L-parallel-omega
      - text: 'רק כשהגלגל מאיץ.'
        feedback: 'כשהגלגל מאיץ צריך גם מומנט לאורך הסרן. אבל הרכיב הניצב לסרן נחוץ גם במהירות קבועה, כי $\vec L$ משנה כיוון.'
    reasons:
      - text: '$\vec L$ אינו מקביל לסרן ומסתובב איתו, ולכן $\vec\tau = \dfrac{d\vec L}{dt} = \vec\omega\times\vec L \ne 0$.'
        correct: true
        feedback: 'זה הנימוק. גודל המומנט $\omega L_\perp$, כאשר $L_\perp$ הרכיב של $\vec L$ שניצב לסרן. הוא גדל כמו $\omega^2$, ולכן מורגש במהירות גבוהה.'
      - text: '$\vec L = I\vec\omega$ תמיד, ולכן $\vec L$ קבוע כש-$\vec\omega$ קבועה.'
        feedback: '$\vec L = I\vec\omega$ עם $I$ מספר נכון רק לסיבוב סביב ציר ראשי. באופן כללי $\vec L = \mathbf{I}\vec\omega$, כאשר $\mathbf I$ טנזור, ו-$\vec L$ יכול לפנות לכיוון אחר.'
        misconception: MC-8-L-parallel-omega
      - text: 'המשקל של הגלגל יוצר מומנט סביב הסרן.'
        feedback: 'מרכז המסה על הסרן, ולכן למשקל אין מומנט סביבו. המומנט נדרש בגלל ש-$\vec L$ משנה כיוון, לא בגלל הכובד.'
    hints:
      - 'האם $\vec L$ של הגלגל מקביל לסרן? ואם לא, מה קורה לו כשהגלגל מסתובב?'

  - id: Q-8.8-bearing-torque
    type: numeric
    objectives: [OBJ-8.8-1]
    level: mid
    prompt: >-
      משקולת: שתי מסות של $0.50\,\text{kg}$ בקצות מוט קל באורך $0.40\,\text{m}$, שמרכזו מחובר לסרן אנכי. המוט
      נטוי בזווית $30^\circ$ לסרן, והמערכת מסתובבת במהירות זוויתית קבועה $10\,\text{rad/s}$. מה גודל המומנט שהמסבים
      של הסרן מפעילים עליו?
    answer: 1.73
    unit: N·m
    correctFeedback: >-
      נכון. כל מסה במרחק $r = 0.20\,\text{m}$ מהמרכז. $|\vec L| = 2m\omega r^2\sin\theta = 0.20\,\text{kg}\cdot\text{m}^2/\text{s}$,
      ניצב למוט, ולכן ב-$90^\circ - 30^\circ = 60^\circ$ מהציר. הרכיב לאורך הציר, $2m\omega r^2\sin^2\theta = 0.10$, קבוע,
      והרכיב הניצב, $L_\perp = 2m\omega r^2\sin\theta\cos\theta = 0.173$, מסתובב במעגל בקצב $\omega$. לכן
      $\tau = \omega L_\perp = 2m\omega^2r^2\sin\theta\cos\theta = 1.73\,\text{N}\cdot\text{m}$. **בדיקת גבולות:**
      ב-$\theta = 0$ (מוט לאורך הציר) וב-$\theta = 90^\circ$ (מוט ניצב לציר) המומנט אפס: אלה צירים ראשיים.
    wrongFeedback: 'חשבו את $\vec L$ של שתי המסות סביב המרכז, פרקו אותו לרכיב לאורך הציר ולרכיב ניצב, ושימו לב שהרכיב הניצב מסתובב בקצב $\omega$.'
    commonWrong:
      - value: 2.0
        feedback: 'זה $\omega|\vec L| = 2m\omega^2r^2\sin\theta$: לקחתם את כל $\vec L$ כמסתובב. רק הרכיב שניצב לציר משנה כיוון, $|\vec L|\cos\theta$.'
      - value: 4.0
        feedback: 'זה $2m\omega^2r^2$, בלי הזוויות. ב-$\theta = 0$ או $90^\circ$ הנוסחה הזו לא הייתה מתאפסת, אבל שם הציר ראשי ואין צורך במומנט.'
      - value: 0.866
        feedback: 'זה המומנט של מסה אחת. שתי המסות תורמות ל-$\vec L$ באותו כיוון, ולכן המומנט כפול.'
      - value: 6.93
        feedback: 'הצבתם $r = 0.40\,\text{m}$, את אורך המוט כולו. כל מסה נמצאת במרחק $r = 0.20\,\text{m}$ מהמרכז, ו-$\tau \propto r^2$.'
    hints:
      - 'המומנט שווה ל-$\vec\omega\times\vec L$, וגודלו $\omega L_\perp$.'

  - id: Q-8.8-rod-bearings
    type: numeric
    objectives: [OBJ-8.8-1]
    level: bagrut
    prompt: >-
      מוט דק ואחיד, במסה $0.90\,\text{kg}$ ובאורך $0.50\,\text{m}$, מחובר במרכזו לסרן אנכי, נטוי בזווית $25^\circ$
      לסרן, ומסתובב איתו במהירות זוויתית קבועה $12\,\text{rad/s}$. הסרן מוחזק בשני מסבים, אחד מעל המוט ואחד מתחתיו,
      במרחקים שווים ממרכזו, והמרחק בין המסבים $0.40\,\text{m}$. הזניחו את הכובד ואת מסת הסרן. מה גודל הכוח האופקי
      שכל מסב מפעיל על הסרן?
    answer: 2.59
    unit: N
    correctFeedback: >-
      נכון. במרכז המוט הצירים הראשיים הם לאורך המוט, עם מומנט התמד אפס, וכל כיוון ניצב למוט, עם
      $I_\perp = \tfrac1{12}m\ell^2 = 0.01875\,\text{kg}\cdot\text{m}^2$. רק הרכיב של $\vec\omega$ שניצב למוט, $\omega\sin\theta$,
      תורם, ולכן $|\vec L| = I_\perp\omega\sin\theta = 0.0951\,\text{kg}\cdot\text{m}^2/\text{s}$, בניצב למוט. הרכיב שלו שניצב
      לסרן, $L_\perp = |\vec L|\cos\theta = 0.0862$, מסתובב בקצב $\omega$, ולכן $\tau = \omega L_\perp = 1.03\,\text{N}\cdot\text{m}$.
      שני המסבים מפעילים זוג כוחות, $F$ ו-$-F$, במרחק $D$ זה מזה, ולכן $\tau = FD$ ו-$F = 2.59\,\text{N}$.
      **בדיקת גבולות:** ב-$\theta = 0$ וב-$\theta = 90^\circ$ הסרן ציר ראשי ו-$F = 0$.
    wrongFeedback: 'מצאו את $\vec L$ בעזרת הצירים הראשיים של המוט במרכזו, את המומנט $\omega L_\perp$ שהסרן צריך, ואת זוג הכוחות של המסבים שנותן אותו.'
    commonWrong:
      - value: 2.85
        feedback: 'השתמשתם ב-$\omega|\vec L|$. רק הרכיב של $\vec L$ שניצב לסרן מסתובב ומשתנה; הרכיב לאורך הסרן קבוע.'
      - value: 10.3
        feedback: 'זה מומנט ההתמד של מוט סביב **קצהו**, $\tfrac13m\ell^2$. המוט מחובר לסרן במרכזו, ושם $I_\perp = \tfrac1{12}m\ell^2$.'
      - value: 7.76
        feedback: 'חשבתם את המוט כשתי מסות נקודתיות בקצותיו, $\tfrac14m\ell^2$. המסה של מוט אחיד מפוזרת לאורכו, ו-$I_\perp = \tfrac1{12}m\ell^2$.'
      - value: 1.03
        feedback: 'זה המומנט, ב-$\text{N}\cdot\text{m}$. השאלה שואלת על הכוח של כל מסב: זוג כוחות במרחק $D$ זה מזה נותן $\tau = FD$.'
      - value: 5.17
        feedback: 'חילקתם את המומנט ב-$D/2$. שני הכוחות מפעילים יחד את המומנט: כל אחד בזרוע $D/2$, ולכן $\tau = 2F\cdot\dfrac D2 = FD$.'
    hints:
      - 'מה הצירים הראשיים של מוט דק במרכזו? פרקו את $\vec\omega$ לרכיב לאורך המוט ולרכיב שניצב לו.'
      - 'זוג כוחות $\pm\vec F$ במרחק $D$ זה מזה נותן מומנט בגודל $FD$, ביחס לכל נקודה.'

  # ---------------------------------------------------------------- OBJ-8.8-2 precession rate of a fast top or gyroscope
  - id: Q-8.8-precession-direction
    type: vector
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: basic
    allowOutIn: true
    prompt: >-
      מבט מלמעלה על ג׳ירוסקופ, כמו על מפה: צפון למעלה בדף ומזרח ימינה. הסרן האופקי שלו מונח בקצה אחד על עמוד,
      במרכז התמונה, ומשתרע ממנו מזרחה. הגלגל בקצה המזרחי מסתובב מהר, עם תנע זוויתי $\vec L$ מזרחה (הרחק מהעמוד).
      "כלפי מעלה" במציאות פירושו מהדף אליכם. לאיזה כיוון מתחיל לנוע הגלגל?
    answer: n
    correctFeedback: >-
      נכון. ביחס לעמוד, מומנט הכובד הוא $\vec\tau = \vec r\times M\vec g$, עם $\vec r$ מזרחה ו-$M\vec g$ כלפי מטה (לתוך
      הדף). כלל יד ימין נותן צפונה. $d\vec L = \vec\tau\,dt$ צפונה, ולכן $\vec L$, ואיתו הגלגל, פונה צפונה: הג׳ירוסקופ
      נוקף נגד כיוון השעון במבט מלמעלה, ולא נופל.
    wrongFeedback: 'חשבו את מומנט הכובד ביחס לעמוד, $\vec r\times M\vec g$, וזכרו ש-$\vec L$ משתנה בכיוון של $\vec\tau$.'
    wrong:
      - dir: in
        feedback: >-
          גלגל שלא מסתובב היה נופל. כאן $\vec L$ גדול, והמומנט משנה את **הכיוון** שלו: $d\vec L$ בכיוון של
          $\vec\tau$, שניצב גם ל-$\vec L$ וגם לכובד. לכן הגלגל זז הצידה, לא למטה.
        misconception: MC-8-gyroscope-falls
      - dir: s
        feedback: 'בדקו את כלל יד ימין: $\hat x\times(-\hat z) = +\hat y$, צפונה, כש-$\hat x$ מזרחה ו-$\hat z$ כלפי מעלה.'
      - dir: e
        feedback: 'תנועה מזרחה הייתה מגדילה את $|\vec L|$. המומנט ניצב ל-$\vec L$, ולכן הוא מסובב אותו ולא מאריך אותו.'
    hints:
      - '$\dfrac{d\vec L}{dt} = \vec\tau$: הקצה של $\vec L$ זז בכיוון המומנט.'

  - id: Q-8.8-top-rate
    type: numeric
    objectives: [OBJ-8.8-2]
    level: basic
    prompt: >-
      סביבון במסה $0.25\,\text{kg}$ מסתובב מהר סביב ציר הסימטריה שלו, בסיבוב עצמי $\omega_3 = 220\,\text{rad/s}$, ומומנט
      ההתמד שלו סביב הציר הזה $I_3 = 1.5\cdot10^{-4}\,\text{kg}\cdot\text{m}^2$. מרכז המסה שלו במרחק $d = 0.030\,\text{m}$
      מנקודת המגע עם הרצפה, שאינה זזה. מה קצב הנקיפה שלו?
    answer: 2.23
    unit: rad/s
    correctFeedback: >-
      נכון. $\Omega = \dfrac{Mgd}{I_3\omega_3} = \dfrac{0.25\cdot9.8\cdot0.030}{1.5\cdot10^{-4}\cdot220} = 2.23\,\text{rad/s}$.
      הקצב לא תלוי בזווית הנטייה של הסביבון: גם המומנט וגם הרכיב האופקי של $\vec L$ פרופורציוניים ל-$\sin\theta$.
      הקירוב טוב כי $\omega_3 = 220 \gg \Omega$.
    wrongFeedback: 'מומנט הכובד סביב נקודת המגע הוא $Mgd\sin\theta$, והוא מסובב את $\vec L$ בקצב $\Omega = \dfrac{\tau}{L\sin\theta}$.'
    commonWrong:
      - value: 0.449
        feedback: 'הפכתם את המנה: $\dfrac{I_3\omega_3}{Mgd}$ ביחידות שניות. קצב הנקיפה הוא המומנט חלקי התנע הזוויתי.'
      - value: 490
        feedback: 'שכחתם את $\omega_3$: חילקתם במומנט ההתמד, לא בתנע הזוויתי $I_3\omega_3$. בדקו יחידות: $\dfrac{\text{N}\cdot\text{m}}{\text{kg}\cdot\text{m}^2}$ הן $\text{s}^{-2}$.'
    hints:
      - 'מה גודל התנע הזוויתי של הסביבון, ומה גודל מומנט הכובד עליו?'

  - id: Q-8.8-spin-slows
    type: twotier
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: mid
    prompt: >-
      חיכוך קטן בנקודת המגע מאט לאט את הסיבוב העצמי של סביבון מהיר. מה קורה לקצב הנקיפה שלו, כל עוד הסביבון עדיין
      מהיר?
    choices:
      - text: 'הוא גדל.'
        correct: true
        feedback: 'נכון. $\Omega = \dfrac{Mgd}{I_3\omega_3}$, ולכן כש-$\omega_3$ קטנה, $\Omega$ גדלה. בסוף, כש-$\omega_3$ כבר לא גדולה בהרבה מ-$\Omega$, הקירוב נשבר והסביבון מתנדנד ונופל.'
      - text: 'הוא קטן, יחד עם הסיבוב.'
        feedback: 'נדמה שכל תנועה של הסביבון מאטה יחד, אבל הנקיפה נקבעת מהיחס בין המומנט לתנע הזוויתי, ותנע זוויתי קטן יותר מסתובב **מהר** יותר תחת אותו מומנט.'
        misconception: MC-8-precession-proportional-to-spin
      - text: 'הוא לא משתנה, כי מומנט הכובד לא משתנה.'
        feedback: 'המומנט אכן קבוע, אבל קצב הנקיפה הוא המומנט **חלקי** התנע הזוויתי, והתנע הזוויתי קטן.'
    reasons:
      - text: 'באותו מומנט, $|d\vec L|$ באותו זמן זהה, ולכן כש-$|\vec L|$ קטן, $\vec L$ מסתובב בזווית גדולה יותר.'
        correct: true
        feedback: 'זה הנימוק: $d\varphi = \dfrac{|d\vec L|}{L_\perp}$. אותו "דחף" הצידה מסובב חץ קצר יותר בזווית גדולה יותר.'
      - text: 'הנקיפה היא חלק מהסיבוב של הסביבון, ולכן היא פרופורציונית אליו.'
        feedback: 'הנקיפה היא סיבוב של **הציר**, בגלל מומנט הכובד. היא ביחס הפוך לסיבוב העצמי, לא ביחס ישר.'
        misconception: MC-8-precession-proportional-to-spin
      - text: 'החיכוך מפעיל מומנט שמאיץ את הנקיפה.'
        feedback: 'החיכוך מאט את הסיבוב העצמי. הנקיפה מואצת בגלל ש-$L$ קטן, לא בגלל מומנט נוסף שדוחף אותה.'
    hints:
      - 'כתבו את $\Omega$ כפונקציה של $\omega_3$.'

  - id: Q-8.8-support-force
    type: mc
    objectives: [OBJ-8.8-2]
    qualitative: true
    level: mid
    prompt: >-
      ג׳ירוסקופ שמסתו הכוללת $M$ מונח בקצה אחד של הסרן שלו על עמוד, והסרן אופקי. הרוטור מסתובב מהר, הג׳ירוסקופ
      נוקף בקצב קבוע, והסרן נשאר אופקי. מה גודל הרכיב האנכי של הכוח שהעמוד מפעיל על הג׳ירוסקופ?
    choices:
      - text: 'בדיוק $Mg$.'
        correct: true
        feedback: >-
          נכון. מרכז המסה נע במעגל אופקי ולא עולה ולא יורד, ולכן הרכיב האנכי של תאוצתו אפס. לפי החוק השני, הרכיב
          האנכי של הכוח השקול אפס: העמוד דוחף כלפי מעלה ב-$Mg$. הסיבוב לא מחזיק את הגוף, הוא רק הופך את המומנט
          לשינוי בכיוון של $\vec L$.
      - text: 'פחות מ-$Mg$, כי הסיבוב המהיר נושא חלק מהמשקל.'
        feedback: >-
          אין כוח "ג׳ירוסקופי" שנושא משקל. על הג׳ירוסקופ פועלים רק הכובד והכוח של העמוד, ומרכז המסה לא מאיץ אנכית.
          לכן הכוח האנכי של העמוד שווה ל-$Mg$, מהר ככל שהרוטור יסתובב.
        misconception: MC-8-gyroscope-defies-gravity
      - text: 'יותר מ-$Mg$, כי העמוד צריך גם לאזן את מומנט הכובד.'
        feedback: 'מומנט הכובד סביב העמוד לא מתאזן: הוא משנה את $\vec L$ בכל רגע, וזו הנקיפה. ולכוח של העמוד אין מומנט סביב העמוד בכלל, כי הוא פועל בנקודה עצמה.'
      - text: 'אפס, כי הג׳ירוסקופ מרחף.'
        feedback: 'אילו העמוד לא היה דוחף, הכוח היחיד היה הכובד, ומרכז המסה היה נופל בתאוצה $g$. הוא לא נופל, ולכן העמוד דוחף כלפי מעלה.'
        misconception: MC-8-gyroscope-defies-gravity
    hints:
      - 'כתבו את החוק השני בכיוון האנכי עבור מרכז המסה של הג׳ירוסקופ. האם הוא עולה או יורד?'

  - id: Q-8.8-toy-gyroscope
    type: numeric
    objectives: [OBJ-8.8-2]
    level: bagrut
    prompt: >-
      לג׳ירוסקופ צעצוע יש רוטור שהוא דסקה אחידה במסה $0.15\,\text{kg}$ וברדיוס $0.030\,\text{m}$, שמסתובבת
      ב-3000 סיבובים לדקה על סרן. הסרן הוא מוט דק ואחיד במסה $0.050\,\text{kg}$ ובאורך $0.12\,\text{m}$. קצה אחד של
      הסרן מונח על עמוד, ומרכז הרוטור על הסרן, $0.040\,\text{m}$ מהעמוד. הסרן נטוי $20^\circ$ מעל האופק. כמה זמן
      לוקח לג׳ירוסקופ להשלים סיבוב נקיפה אחד?
    answer: 1.51
    unit: s
    correctFeedback: >-
      נכון. הנקודה הקבועה $P$ היא קצה הסרן שעל העמוד, והמומנטים ביחס אליה. $\omega_3 = 3000\cdot\dfrac{2\pi}{60} = 314\,\text{rad/s}$,
      $I_3 = \tfrac12MR^2 = 6.75\cdot10^{-5}\,\text{kg}\cdot\text{m}^2$, ולכן $L = I_3\omega_3 = 0.0212\,\text{kg}\cdot\text{m}^2/\text{s}$.
      לסרן הדק אין כמעט מומנט התמד סביב עצמו, ולכן הוא לא מוסיף ל-$L$, אבל המשקל שלו, במרכזו, $0.060\,\text{m}$ מ-$P$,
      מוסיף למומנט. הסרן ב-$\theta = 70^\circ$ מהאנך, ושני המשקלים מסובבים לאותו צד:
      $\tau = g\left(0.15\cdot0.040 + 0.050\cdot0.060\right)\sin\theta = 0.0829\,\text{N}\cdot\text{m}$. הוא מסובב את הרכיב
      האופקי של $\vec L$, $L\sin\theta$, וה-$\sin\theta$ מצטמצם: $\Omega = \dfrac{0.0882}{0.0212} = 4.16\,\text{rad/s}$, וזמן הנקיפה
      $\dfrac{2\pi}{\Omega} = 1.51\,\text{s}$. **בדיקת גבולות:** בלי מסת הסרן הזמן היה $2.27\,\text{s}$; הנוסחה דורשת
      $\omega_3 \gg \Omega$, וכאן היחס כ-76.
    wrongFeedback: 'המירו סיבובים לדקה ל-$\text{rad/s}$ וחשבו $L = I_3\omega_3$. אחר כך המומנט ביחס לנקודה שעל העמוד: המשקל של הרוטור ושל הסרן, כל אחד במרכז שלו. ואז $\Omega$ ואת הזמן $\dfrac{2\pi}{\Omega}$.'
    commonWrong:
      - value: 2.27
        feedback: 'שכחתם את המשקל של הסרן. הוא פועל במרכז הסרן, $0.060\,\text{m}$ מהעמוד, ומוסיף למומנט באותו כיוון כמו משקל הרוטור.'
      - value: 1.7
        feedback: 'שמתם את מסת הסרן במרכז הרוטור. המשקל של מוט אחיד פועל במרכזו, $0.060\,\text{m}$ מהעמוד, לא ב-$0.040\,\text{m}$.'
      - value: 3.02
        feedback: 'השתמשתם ב-$I = MR^2$, של טבעת. עם $MR^2$ התנע הזוויתי כפול, הנקיפה איטית פי 2 וזמן הנקיפה כפול. הרוטור דסקה אחידה, $I_3 = \tfrac12MR^2$.'
      - value: 0.24
        feedback: 'המרתם $3000$ סיבובים לדקה ל-$50\,\text{rad/s}$, בלי $2\pi$. זה $50$ סיבובים **בשנייה**, כלומר $314\,\text{rad/s}$.'
      - value: 4.16
        feedback: 'זה $\Omega$ עצמו, ב-$\text{rad/s}$. השאלה מבקשת את הזמן של סיבוב נקיפה שלם, $2\pi/\Omega$.'
      - value: 1.61
        feedback: 'הכנסתם את $\sin\theta$ למומנט וחילקתם בכל $L$. המומנט האופקי מסובב רק את הרכיב **האופקי** של $\vec L$, $L\sin\theta$, ובו ה-$\sin\theta$ מצטמצם.'
    hints:
      - 'כמה רדיאנים לשנייה הם 3000 סיבובים לדקה?'
      - 'על הג׳ירוסקופ פועלים שני משקלים, של הרוטור ושל הסרן. איפה פועל כל אחד, ומה המומנט של כל אחד ביחס לעמוד?'
      - 'האם קצב הנקיפה תלוי בזווית הנטייה של הסרן?'

  - id: Q-8.5-ladder-min-angle
    type: numeric
    objectives: [OBJ-8.5-2]
    level: mid
    prompt: >-
      סולם אחיד במסה $M$ נשען על קיר **חלק**, ומקדם החיכוך הסטטי בין רגלי הסולם לרצפה הוא $\mu_s = 0.40$. אדם
      שמסתו $3M$ רוצה לעמוד על השלב שנמצא בשלושה רבעים מאורך הסולם, כשמודדים מהרגליים. מה הזווית הקטנה ביותר בין
      הסולם **לרצפה** שבה הסולם לא יחליק כשהאדם עומד שם?
    answer: 59.8
    unit: °
    correctFeedback: >-
      נכון. על הסולם: הכובד $Mg$ במרכזו, הדחיפה של האדם $3Mg$ על השלב, כוח אופקי $N_2$ מהקיר בראש, ו-$N_1$ וחיכוך $f$
      מהרצפה ברגליים. מהכוחות, $N_1 = 4Mg$ ו-$f = N_2$. סביב הרגליים:
      $N_2L\sin\theta = Mg\dfrac L2\cos\theta + 3Mg\dfrac{3L}{4}\cos\theta$, ולכן $f = \dfrac{11}{4}\dfrac{Mg}{\tan\theta}$.
      התנאי $f \le \mu_sN_1$ נותן $\tan\theta \ge \dfrac{11}{16\mu_s} = 1.72$, כלומר $\theta \ge 59.8^\circ$.
      **בדיקת גבולות:** בלי האדם יוצא $\tan\theta = 1/(2\mu_s)$, $51.3^\circ$, הסולם הריק; וכש-$\mu_s \to 0$ הזווית
      שואפת ל-$90^\circ$: על רצפה חלקה רק סולם אנכי עומד.
    wrongFeedback: 'כתבו את משוואת המומנטים סביב רגלי הסולם ואת שתי משוואות הכוחות, ודרשו $f \le \mu_sN_1$.'
    commonWrong:
      - value: 51.3
        feedback: 'זו הזווית של סולם ריק, $\tan\theta = 1/(2\mu_s)$. האדם על השלב מוסיף מומנט סביב הרגליים, ולכן הקיר צריך לדחוף חזק יותר.'
        misconception: MC-8-torque-ignores-position
      - value: 65.4
        feedback: 'זו הזווית כשהאדם עומד בראש הסולם. כאן הוא על השלב שבשלושה רבעים, והזרוע של הדחיפה שלו סביב הרגליים היא $\tfrac{3L}{4}\cos\theta$.'
        misconception: MC-8-torque-ignores-position
      - value: 81.7
        feedback: 'שכחתם שגם האדם נשען על הרצפה. $N_1 = 4Mg$, לא $Mg$, ולכן החיכוך המרבי $\mu_sN_1$ גדול פי ארבעה.'
      - value: 30.2
        feedback: 'זו הזווית בין הסולם **לקיר**, $90^\circ - 59.8^\circ$. השאלה שואלת על הזווית עם הרצפה.'
    hints:
      - 'סביב רגלי הסולם, הזרוע של הכוח של הקיר היא $L\sin\theta$, של הכובד של הסולם $\tfrac L2\cos\theta$, ושל הדחיפה של האדם $\tfrac{3L}{4}\cos\theta$.'

  - id: Q-8.5-stepladder
    type: numeric
    objectives: [OBJ-8.5-2]
    level: bagrut
    prompt: >-
      סולם כפול, בצורת האות Λ, בנוי משתי רגליים אחידות, כל אחת באורך $2.0\,\text{m}$ ובמסה $5.0\,\text{kg}$, שמחוברות
      בציר בראשן. אין חבל בין הרגליים. הסולם עומד על רצפה, ומקדם החיכוך הסטטי בין כל רגל לרצפה הוא $\mu_s = 0.50$.
      על הראש, בדיוק על הציר, מונח משא במסה $40\,\text{kg}$. מה הזווית הקטנה ביותר בין רגל לרצפה שבה הרגליים לא
      מחליקות והסולם לא נפתח?
    answer: 60.9
    unit: °
    correctFeedback: >-
      נכון. **כל הסולם כגוף אחד:** החיכוכים בשתי הרגליים מבטלים זה את זה, ו-$2N = (2M + m)g$, כלומר
      $N = (M + \tfrac m2)g$ על כל רגל. **רגל אחת, מומנטים סביב הציר בראש:** הכוח של הרגל השנייה והדחיפה של המשא
      פועלים שם, ונעלמים. נשארים $N$ בזרוע $L\cos\theta$, הכובד $Mg$ בזרוע $\tfrac L2\cos\theta$, והחיכוך $f$, שמושך
      את הרגל פנימה, בזרוע $L\sin\theta$: $fL\sin\theta = NL\cos\theta - Mg\tfrac L2\cos\theta$, ולכן
      $f = \dfrac{(M + m)g}{2\tan\theta}$. התנאי $f \le \mu_sN$ נותן
      $\tan\theta \ge \dfrac{M + m}{\mu_s(2M + m)} = \dfrac{45}{25} = 1.80$, $\theta \ge 60.9^\circ$.
      **בדיקת גבולות:** בלי משא, $\tan\theta = \dfrac{1}{2\mu_s}$, בדיוק כמו סולם ריק ליד קיר חלק: מהסימטריה, הרגל
      השנייה דוחפת את הראש רק אופקית, כמו קיר חלק. וכש-$m \gg M$, $\tan\theta \to 1/\mu_s$.
    wrongFeedback: >-
      שני שלבים. את $N$ על כל רגל מוצאים מכל הסולם כגוף אחד. את החיכוך מוצאים ממומנטים על רגל **אחת**, סביב הנקודה
      שבה פועלים הכוחות שלא ידועים לכם: הציר בראש.
    commonWrong:
      - value: 45.0
        feedback: 'זו הזווית בלי משא, $\tan\theta = 1/(2\mu_s)$. המשא מגדיל את $N$, אבל את החיכוך הדרוש הוא מגדיל יותר.'
      - value: 29.1
        feedback: 'זו הזווית בין רגל ל**אנך**, $90^\circ - 60.9^\circ$. השאלה שואלת על הזווית עם הרצפה.'
      - value: 83.7
        feedback: 'לקחתם $N = Mg$, בלי המשא. המשא נשען על שתי הרגליים, וכל רגל דוחפת את הרצפה גם בחצי ממשקלו: $N = (M + \tfrac m2)g$.'
    hints:
      - 'מה עושה כל רגל לראש של הרגל השנייה? מהסימטריה, הכוח ביניהן אופקי, כמו כוח של קיר חלק.'

chapter: 8
questions:
  # ---------------------------------------------------------------- OBJ-8.5-1 ΣF = 0, Στ = 0, a convenient point
  - id: Q-8.5-couple
    type: mc
    objectives: [OBJ-8.5-1]
    qualitative: true
    level: basic
    prompt: >-
      מוט מונח על שולחן אופקי חלק. מפעילים עליו, במקביל לשולחן, שני כוחות שווים בגודלם ומנוגדים בכיוונם: אחד
      בקצה אחד, ניצב למוט, והשני בקצה השני, ניצב למוט בכיוון ההפוך. האם המוט בשיווי משקל?
    choices:
      - text: 'לא. השקול אפס, ולכן מרכז המסה לא מאיץ, אבל המומנט השקול אינו אפס, והמוט מתחיל להסתובב.'
        correct: true
        feedback: >-
          נכון. זה **זוג כוחות**: שקולו אפס, והמומנט שלו $Fd$, כאשר $d$ הוא המרחק בין קווי הפעולה. שיווי משקל של
          גוף צפיד דורש שני תנאים: $\sum\vec F = 0$ **וגם** $\sum\vec\tau = 0$.
      - text: 'כן, כי הכוח השקול עליו אפס.'
        feedback: 'שקול אפס מבטיח רק שמרכז המסה לא יאיץ. גוף צפיד יכול גם להסתובב, ולכן צריך גם שהמומנט השקול יתאפס.'
        misconception: MC-8-net-force-zero-is-equilibrium
      - text: 'זה תלוי בנקודה שסביבה מחשבים את המומנט.'
        feedback: >-
          כשהשקול אפס, המומנט זהה סביב **כל** נקודה: $\vec\tau_E = \vec\tau_D + (\vec r_D - \vec r_E)\times\sum\vec F$.
          למומנט של זוג כוחות יש ערך אחד, $Fd$.
      - text: 'כן, כי שני הכוחות מבטלים זה את זה.'
        feedback: 'הם מבטלים זה את זה בסכום הכוחות, לא במומנט: שניהם מסובבים את המוט לאותו כיוון סביב מרכזו.'
        misconception: MC-8-net-force-zero-is-equilibrium

  - id: Q-8.5-torque-point
    type: twotier
    objectives: [OBJ-8.5-1]
    qualitative: true
    level: mid
    prompt: >-
      קורה מונחת במנוחה על שתי תמיכות, וכוחות התמיכה $N_1$ ו-$N_2$ לא ידועים. סטודנטית כותבת את משוואת המומנטים
      סביב תמיכה 1, אף שהקורה לא מסתובבת סביבה ומרכז המסה לא שם. האם זה מותר?
    choices:
      - text: 'כן. בשיווי משקל המומנט השקול אפס סביב כל נקודה, ובחירת תמיכה 1 מוציאה את $N_1$ מהמשוואה.'
        correct: true
        feedback: 'נכון. זה הטריק המרכזי של סטטיקה: בוחרים נקודה שדרכה עוברים כוחות לא ידועים, ומשוואה אחת נותנת נעלם אחד.'
      - text: 'לא. מומנטים מחשבים תמיד סביב מרכז המסה.'
        feedback: 'סביב מרכז המסה מותר, אבל לא חובה. בגוף בשיווי משקל כל נקודה טובה באותה מידה, גם נקודה מחוץ לגוף.'
        misconception: MC-8-torques-only-about-cm
      - text: 'לא. מומנטים מחשבים רק סביב ציר שהגוף באמת מסתובב סביבו.'
        feedback: 'בשיווי משקל הגוף לא מסתובב סביב שום ציר, ולכן המשוואה $\sum\tau = 0$ חלה סביב כל נקודה.'
        misconception: MC-8-torques-only-about-cm
    reasons:
      - text: 'אם $\sum\vec F = 0$, אז $\vec\tau_E = \vec\tau_D + (\vec r_D - \vec r_E)\times\sum\vec F = \vec\tau_D$, ולכן המומנט לא תלוי בנקודה.'
        correct: true
        feedback: 'זה הנימוק. תנאי הכוחות הוא שמאפשר את חופש הבחירה בנקודה.'
      - text: 'רק סביב מרכז המסה המשקל לא יוצר מומנט, ולכן רק שם המשוואה פשוטה.'
        feedback: 'זה נכון לגבי המשקל, אבל אין סיבה להעדיף אותו: כאן הנעלמים הם $N_1$ ו-$N_2$, ולכן כדאי לבחור נקודה שאחד מהם עובר בה.'
        misconception: MC-8-torques-only-about-cm
      - text: 'התמיכה דוחפת כלפי מעלה, ולכן הקורה "מסתובבת" סביבה.'
        feedback: 'הקורה במנוחה ולא מסתובבת סביב שום נקודה. הבחירה בתמיכה היא חשבונית בלבד.'
    hints:
      - 'כתבו את המומנט סביב נקודה $E$ בעזרת המומנט סביב נקודה $D$. מה עושה $\sum\vec F = 0$?'

  - id: Q-8.5-hanging-sign
    type: numeric
    objectives: [OBJ-8.5-1]
    level: mid
    prompt: >-
      שלט במסה $12\,\text{kg}$ תלוי בקצה של מוט אופקי אחיד באורך $1.5\,\text{m}$ ובמסה $4.0\,\text{kg}$. הקצה השני
      של המוט מחובר לקיר בציר. כבל מחבר את קצה המוט, שבו תלוי השלט, לנקודה על הקיר מעל הציר, והוא יוצר זווית
      $30^\circ$ עם המוט. מה המתיחות בכבל?
    answer: 274
    unit: N
    correctFeedback: >-
      נכון. סביב הציר בקיר, הכוח שהציר מפעיל, שאינו ידוע, נעלם מהמשוואה. שלושה מומנטים נשארים:
      $T\sin30^\circ\cdot L = mg\cdot L + Mg\cdot\dfrac L2$, ולכן
      $T = \dfrac{(m + M/2)g}{\sin30^\circ} = \dfrac{14\cdot9.8}{0.5} = 274\,\text{N}$. האורך $L$ מצטמצם. מהכוחות
      יוצא גם כוח הציר: $238\,\text{N}$ אופקית אל מחוץ לקיר, ו-$19.6\,\text{N}$ אנכית.
    wrongFeedback: 'כתבו את משוואת המומנטים סביב הציר בקיר. רק הרכיב של המתיחות שניצב למוט יוצר מומנט.'
    commonWrong:
      - value: 235
        feedback: 'זה $\dfrac{mg}{\sin30^\circ}$, בלי המשקל של המוט עצמו. גם המוט נתלה על הכבל: משקלו פועל במרכזו, ב-$L/2$.'
      - value: 137
        feedback: 'זה $(m + M/2)g$: שכחתם את $\sin30^\circ$. הכבל מושך בזווית, ורק הרכיב הניצב למוט, $T\sin30^\circ$, מאזן את המומנטים.'
      - value: 158
        feedback: 'השתמשתם ב-$\cos30^\circ$. הרכיב של $T$ שלאורך המוט עובר דרך הציר ולא מסובב. הרכיב הניצב הוא $T\sin30^\circ$.'
      - value: 314
        feedback: 'שמתם את כל משקל המוט בקצה. משקלו של מוט אחיד פועל במרכזו, ולכן הזרוע שלו $L/2$.'
        misconception: MC-8-torque-ignores-position
    hints:
      - 'אם בוחרים את הציר בקיר, כמה כוחות לא ידועים נשארים במשוואת המומנטים?'

  - id: Q-8.5-beam-overhang
    type: numeric
    objectives: [OBJ-8.5-1]
    level: mid
    prompt: >-
      קורה אחידה באורך $6.0\,\text{m}$ ובמסה $50\,\text{kg}$ מונחת על שתי תמיכות: אחת בקצה השמאלי, $x = 0$, ואחת
      ב-$x = 4.0\,\text{m}$. על הקצה הימני, $x = 6.0\,\text{m}$, מונח ארגז במסה $20\,\text{kg}$. מה הכוח שהתמיכה
      השמאלית מפעילה על הקורה?
    answer: 24.5
    unit: N
    correctFeedback: >-
      נכון. סביב התמיכה הימנית ($x = 4.0\,\text{m}$), $N_2$ נעלם:
      $N_1\cdot4.0 = 50g\cdot(4.0 - 3.0) - 20g\cdot(6.0 - 4.0)$, כי המשקל של הקורה (במרכזה, $x = 3.0\,\text{m}$) מסובב
      לצד אחד והארגז לצד השני. $N_1 = \dfrac{(50 - 40)\cdot9.8}{4.0} = 24.5\,\text{N}$, ומהכוחות $N_2 = 70g - N_1 = 662\,\text{N}$.
      **מה משתנה אם** הארגז כבד יותר: $N_1$ יורד, ומתאפס בארגז של $25\,\text{kg}$. ארגז כבד יותר היה מרים את הקצה
      השמאלי, כי תמיכה רק דוחפת ולא מושכת.
    wrongFeedback: 'בחרו את התמיכה הימנית כנקודה לחישוב המומנטים, וקבעו לכל משקל את הזרוע שלו ואת הצד שאליו הוא מסובב.'
    commonWrong:
      - value: 343
        feedback: 'זה חצי מהמשקל הכולל, $35g$: הנחתם ששתי התמיכות נושאות אותו משקל. זה נכון רק כשהעומס סימטרי ביחס אליהן, וכאן הוא לא.'
        misconception: MC-8-supports-share-equally
      - value: 122.5
        feedback: 'זה $N_1$ בלי הארגז. הארגז, מעבר לתמיכה הימנית, מסובב את הקורה לכיוון ההפוך ומקטין את $N_1$.'
      - value: 220.5
        feedback: 'שמתם את המומנט של הארגז באותו סימן כמו של משקל הקורה. סביב $x = 4.0\,\text{m}$ משקל הקורה, משמאל, מסובב לצד אחד, והארגז, מימין, לצד השני.'
    hints:
      - 'סביב התמיכה הימנית: משקל הקורה פועל במרחק $1.0\,\text{m}$ משמאל לה, והארגז במרחק $2.0\,\text{m}$ מימין לה.'

  - id: Q-8.5-hinge-pulls-down
    type: numeric
    objectives: [OBJ-8.5-1]
    level: bagrut
    prompt: >-
      קורה אחידה ואופקית באורך $2.0\,\text{m}$ ובמסה $10\,\text{kg}$ מחוברת בקצה אחד לקיר בציר. כבל קשור לאמצע הקורה
      ועולה ממנו אל הקיר, בזווית $40^\circ$ עם הקורה. מהקצה החופשי של הקורה תלוי משא במסה $15\,\text{kg}$. מה הרכיב
      האנכי של הכוח שהציר מפעיל על הקורה? כלפי מעלה חיובי.
    answer: -147
    unit: N
    correctFeedback: >-
      נכון. על הקורה: הכובד $Mg$ באמצעה, הכבל $T$ באמצעה, המשא $mg$ בקצה, וכוח הציר, $H$ אופקי ו-$V$ אנכי, בקיר.
      בוחרים את **אמצע הקורה** כנקודה למומנטים: $T$ ו-$Mg$ פועלים בה, וקו הפעולה של $H$ הוא הקו של הקורה, שעובר
      בה. נשארים שני מומנטים, $V$ בזרוע $\tfrac L2$ מצד הקיר ו-$mg$ בזרוע $\tfrac L2$ מהצד השני. כדי שיתבטלו, $V$ חייב
      להיות כלפי **מטה**: $V = -mg = -15\cdot9.8 = -147\,\text{N}$. הציר מושך את הקורה למטה. התשובה לא תלויה בזווית
      ולא במסה של הקורה; הכבל, $T = 610\,\text{N}$, נושא את שני המשקלים ועוד את המשיכה של הציר.
      **בדיקת גבולות:** בלי משא, $m = 0$, $V = 0$: הכבל באמצע נושא את הקורה לבדו.
    wrongFeedback: 'בחרו נקודה למומנטים שדרכה עוברים גם $T$ וגם $H$, ששניהם לא ידועים. איזה כוח נשאר עם זרוע מצד הקיר?'
    commonWrong:
      - value: 147
        feedback: 'הגודל נכון, הכיוון לא. סביב אמצע הקורה המשא מסובב את הקצה החופשי למטה; כדי לאזן, $V$ בצד השני חייב לסובב את הקצה של הקיר למטה, כלומר למשוך את הקורה כלפי מטה.'
      - value: 0
        feedback: 'הנחתם שכוח הציר לאורך הקורה. זה נכון רק לקורה קלה שעליה פועלים כוחות רק בשני הקצוות. כאן הכבל מחובר באמצע, והמשא בקצה.'
      - value: -49
        feedback: 'שכחתם את המשקל של הקורה במשוואת המומנטים סביב הציר. הוא פועל באמצע, באותה נקודה כמו הכבל; סביב הציר, זרועו $\tfrac L2$.'
      - value: -245
        feedback: 'במשוואת הכוחות האנכיים חסר המשקל של הקורה, $Mg = 98\,\text{N}$.'
      - value: 245
        feedback: 'זה $(M + m)g$: הנחתם שהציר נושא את כל המשקל. הכבל נושא יותר מכל המשקל, והציר מושך למטה.'
    hints:
      - 'שלושה כוחות פועלים באמצע הקורה או על קו שעובר בו. סביב אמצע הקורה, אילו כוחות נשארים במשוואת המומנטים?'

  # ---------------------------------------------------------------- OBJ-8.5-2 ladder, lever, beam, slipping threshold
  - id: Q-8.5-seesaw
    type: numeric
    objectives: [OBJ-8.5-2, OBJ-8.5-1]
    level: basic
    prompt: >-
      נדנדה היא קרש אחיד שמונח במרכזו על ציר. ילד במסה $30\,\text{kg}$ יושב במרחק $1.6\,\text{m}$ משמאל לציר. באיזה
      מרחק מימין לציר צריך לשבת ילד במסה $40\,\text{kg}$ כדי שהנדנדה תהיה בשיווי משקל במצב אופקי?
    answer: 1.2
    unit: m
    correctFeedback: >-
      נכון. סביב הציר, הקרש האחיד לא יוצר מומנט (מרכז המסה שלו על הציר), ו-$30g\cdot1.6 = 40g\cdot x$, ולכן
      $x = 1.20\,\text{m}$. הילד הכבד יותר יושב קרוב יותר לציר. זה עיקרון המנוף.
    wrongFeedback: 'השוו את המומנטים של שני הילדים סביב הציר: מסה כפול זרוע מכל צד.'
    commonWrong:
      - value: 2.13
        feedback: 'הפכתם את היחס: הילד **הכבד** יותר צריך זרוע **קצרה** יותר, כי $m_1x_1 = m_2x_2$.'
      - value: 1.6
        feedback: 'במרחקים שווים הילד הכבד יותר היה מטה את הנדנדה. מאזנים מומנטים, לא מרחקים.'
        misconception: MC-8-torque-ignores-position
    hints:
      - 'איזה מומנט יוצר הקרש עצמו סביב הציר שבמרכזו?'

  - id: Q-8.5-ladder-wall-force
    type: vector
    objectives: [OBJ-8.5-2]
    qualitative: true
    level: basic
    prompt: >-
      סולם נשען על קיר אנכי **חלק** (בלי חיכוך), ורגליו על רצפה מחוספסת. הקיר נמצא משמאל לסולם, והסולם נוטה
      ימינה ומטה מהקיר אל הרצפה. מה כיוון הכוח שהקיר מפעיל על הסולם? למעלה בדף הוא כלפי מעלה.
    answer: e
    correctFeedback: >-
      נכון. קיר בלי חיכוך מפעיל רק כוח נורמלי, ניצב לפני הקיר, כלומר אופקי, ימינה, הרחק מהקיר. את המשקל נושאת כולו
      הרצפה, והחיכוך שלה, שמאלה, מאזן את הכוח של הקיר.
    wrongFeedback: 'אילו כוחות יכול להפעיל משטח בלי חיכוך? בכיוון ניצב לו או מקביל לו?'
    wrong:
      - dir: n
        feedback: 'כוח כלפי מעלה לאורך הקיר הוא כוח חיכוך, והקיר חלק. הוא יכול רק לדחוף בניצב לעצמו.'
        misconception: MC-8-frictionless-wall-holds-up

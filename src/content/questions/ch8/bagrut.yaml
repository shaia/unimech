        prompt: >-
          איזה חלק מהאנרגיה הקינטית של הגליל הולך לאיבוד בפגיעה? בטאו אותו באמצעות $h/R$ בלבד, בדקו אותו בגבולות
          $h \to 0$ ו-$h \to R$, והסבירו לאן הולכת האנרגיה.
        hints:
          - 'לפני הפגיעה הגליל גם מתקדם וגם מסתובב. אחריה הוא רק מסתובב סביב $E$.'
        solution:
          - { kind: law, text: 'האנרגיה הקינטית של גוף צפיד היא $\tfrac12Mv_{cm}^2 + \tfrac12I_{cm}\omega^2$, ובסיבוב סביב ציר קבוע $E$ היא $\tfrac12I_E\Omega^2$.' }
          - { kind: manipulation, text: 'לפני: $K_0 = \tfrac12Mv_0^2 + \tfrac12\cdot\tfrac12MR^2\dfrac{v_0^2}{R^2} = \tfrac34Mv_0^2$. אחרי, עם $\Omega$ מחלק ב: $K_1 = \tfrac12\cdot\tfrac32MR^2\,\Omega^2 = \tfrac34Mv_0^2\left(1 - \dfrac{2h}{3R}\right)^2$. החלק שאבד: $$f = 1 - \frac{K_1}{K_0} = 1 - \left(1 - \frac{2h}{3R}\right)^2 = \frac{4h}{3R}\left(1 - \frac{h}{3R}\right)$$' }
          - { kind: manipulation, text: 'לאן הולכת האנרגיה: הגליל נצמד לשפה ולא חוזר ממנה, כמו גופים שנדבקים בהתנגשות פלסטית (שיעור 4.1). האנרגיה החסרה הולכת לעיוות ולחום באזור המגע. התנע הזוויתי סביב $E$ נשמר, והאנרגיה הקינטית לא: שימור של האחד לא גורר שימור של השני.' }
          - { kind: limit, text: 'כש-$h \to 0$, $f \to 0$: אין פגיעה. במדרגה נמוכה $f \approx \dfrac{4h}{3R}$, קטן ולינארי ב-$h$. כש-$h \to R$, $f \to \tfrac89$: נשארת רק תשיעית מהאנרגיה. $f$ גדל עם $h$ לאורך כל התחום, ולא תלוי ב-$M$ או ב-$v_0$.' }
          - { kind: units, text: '$f$ הוא יחס בין שתי אנרגיות, ולכן חסר ממדים, ותלוי רק ביחס חסר הממדים $h/R$.' }
          - { kind: result, text: '$f = 1 - \left(1 - \dfrac{2h}{3R}\right)^2$, מ-0 כש-$h \to 0$ עד $\tfrac89$ כש-$h \to R$.' }
        rubric:
          - text: כתבתי $K_0 = \tfrac34Mv_0^2$, עם האנרגיה של הסיבוב, ו-$K_1 = \tfrac12I_E\Omega^2$ עם $\Omega$ מחלק ב.
          - text: קיבלתי $f = 1 - \left(1 - \dfrac{2h}{3R}\right)^2$ ובדקתי ש-$f \to 0$ כש-$h \to 0$ ו-$f \to \tfrac89$ כש-$h \to R$, ושהוא חסר ממדים.
          - text: הסברתי שהאנרגיה אובדת כי הגליל נצמד לשפה, כמו בהתנגשות פלסטית.


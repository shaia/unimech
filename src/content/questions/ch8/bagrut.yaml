          - value: 2.29
            feedback: 'זה $\sqrt{2\cdot\tfrac g3\cdot h}$: השתמשתם בתאוצה $g/3$, שהיא היחס $T/M$, ולא בתאוצה, $\tfrac23g$.'
        hints:
          - 'בגלגול על החוט, $\omega = v/R$. כמה מהאנרגיה הקינטית הולך לסיבוב?'

      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-8.3-1, OBJ-8.4-1]
        prompt: >-
          עכשיו היד מושכת את החוט כלפי מעלה כך שמרכז היו-יו נשאר כל הזמן באותו גובה, והיו-יו רק מסתובב מהר יותר
          ויותר. בטאו את התאוצה $A$ שבה היד צריכה לנוע באמצעות $g$, $M$, $R$ ומומנט ההתמד $I$ של היו-יו, ובדקו את הביטוי
          בשני גבולות: יו-יו שהוא טבעת, ו-$I \to 0$. אחר כך הציבו את הדסקה של השאלה.
        hints:
          - 'אם מרכז המסה לא זז, מה המתיחות? היא כבר לא $\tfrac13Mg$ של חלק ב.'
          - 'החוט לא מחליק על השפה: החוט, והיד שמחזיקה אותו, מאיצים כמו נקודת השפה שבה החוט עוזב.'
        solution:
          - { kind: law, text: 'החוק השני למרכז המסה, עם ציר כלפי מעלה: $T - Mg = Ma_{cm}$. משוואת המומנט סביב מרכז המסה: $TR = I\alpha$. החוט לא מחליק, ולכן הוא נע כמו נקודת השפה שבה הוא עוזב: $A = a_{cm} + \alpha R$, עם $a_{cm}$ כלפי מעלה.' }
          - { kind: manipulation, text: 'המרכז לא זז, $a_{cm} = 0$, ולכן $T = Mg$. מכאן $\alpha = \dfrac{MgR}{I}$, ו-$$A = \alpha R = \frac{MR^2}{I}\,g$$ לדסקה, $I = \tfrac12MR^2$: $A = 2g$, כלפי מעלה.' }
          - { kind: limit, text: 'לטבעת, $I = MR^2$: $A = g$. ככל ש-$I$ קטן, היד צריכה למשוך מהר יותר, וכש-$I \to 0$ התאוצה הדרושה שואפת לאינסוף: ליו-יו בלי מומנט התמד אין במה "להיאחז", ואי אפשר להחזיק אותו בגובה קבוע בחוט שכרוך עליו. וכש-$I$ גדול מאוד, משיכה איטית מספיקה. שימו לב שזו לא התאוצה $\tfrac23g$ של חלק ב: שם היד עמדה והמרכז נפל.' }
          - { kind: units, text: '$\dfrac{MR^2}{I}$ חסר ממדים, ולכן $A$ ביחידות של $g$, $\text{m/s}^2$.' }
          - { kind: substitution, text: '$A = 2\cdot9.8 = 19.6\,\text{m/s}^2$.' }
          - { kind: result, text: '$A = \dfrac{MR^2}{I}\,g$, ולדסקה $2g = 19.6\,\text{m/s}^2$ כלפי מעלה.' }
        rubric:
          - text: כתבתי שהמרכז לא מאיץ, ולכן $T = Mg$, ולא $\tfrac13Mg$ של חלק ב.
          - text: כתבתי $TR = I\alpha$, וקשרתי את תאוצת היד ל-$\alpha R$ דרך תנאי אי-ההחלקה, וקיבלתי $A = \dfrac{MR^2}{I}g$.
          - text: בדקתי שטבעת נותנת $g$ ושכש-$I \to 0$ התאוצה שואפת לאינסוף, ובדקתי יחידות.
          - text: הצבתי וקיבלתי $19.6\,\text{m/s}^2$.

  # ------------------------------------------------------------ 3: a hinged rod held by a cable, then the cable is cut
  - id: Q-8-bagrut-3
    type: bagrut
    title: מוט על ציר בקיר, לפני ואחרי שהכבל נחתך
    prompt: >-
      מוט אחיד במסה $M = 3.0\,\text{kg}$ ובאורך $L = 1.2\,\text{m}$ מחובר בקצה אחד לקיר אנכי בציר אופקי, שסביבו
      הוא יכול להסתובב בלי חיכוך. כבל קל מחבר את הקצה השני של המוט לנקודה על הקיר מעל הציר, ומחזיק את המוט אופקי.
      הכבל יוצר זווית $30^\circ$ עם המוט.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-8.5-1]
        prompt: מה המתיחות בכבל?
        answer: 29.4
        unit: N
        correctFeedback: >-
          נכון. סביב הציר בקיר, כוח הציר הלא ידוע לא נכנס למשוואה: $T\sin30^\circ\cdot L = Mg\cdot\dfrac L2$, ולכן
          $T = \dfrac{Mg}{2\sin30^\circ} = Mg = 29.4\,\text{N}$.
        wrongFeedback: 'כתבו את משוואת המומנטים סביב הציר בקיר. רק הרכיב של המתיחות שניצב למוט מסובב אותו.'
        commonWrong:
          - value: 14.7
            feedback: 'זה $Mg/2$: שכחתם את $\sin30^\circ$. רק הרכיב הניצב של המתיחות, $T\sin30^\circ$, יוצר מומנט סביב הציר.'
          - value: 58.8
            feedback: 'שמתם את המשקל בקצה המוט. משקלו של מוט אחיד פועל במרכזו, ולכן הזרוע שלו $L/2$, לא $L$.'
            misconception: MC-8-torque-ignores-position
        hints:
          - 'איזו נקודה מוציאה מהמשוואה את הכוח שהציר מפעיל?'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-8.5-1]
        prompt: מה הרכיב **האנכי** של הכוח שהציר מפעיל על המוט?
        answer: 14.7
        unit: N
        correctFeedback: >-
          נכון. הדרך המהירה: מומנטים סביב הקצה שבו מחובר הכבל. שם $T$ נעלם, וגם הרכיב האופקי של כוח הציר, שעובר לאורך
          המוט: $F_y\cdot L = Mg\cdot\dfrac L2$, ולכן $F_y = \dfrac{Mg}{2} = 14.7\,\text{N}$, כלפי מעלה. או מהכוחות:
          $F_y = Mg - T\sin30^\circ = 29.4 - 14.7$. הכבל מושך את המוט גם אופקית, אל הקיר, ב-$T\cos30^\circ = 25.5\,\text{N}$,
          ולכן הרכיב האופקי של כוח הציר שווה לו בגודלו ודוחף את המוט הרחק מהקיר.
        wrongFeedback: 'בחרו נקודה שדרכה עוברים גם הכבל וגם הרכיב האופקי של כוח הציר, או השתמשו בסכום הכוחות האנכיים.'
        commonWrong:
          - value: 29.4
            feedback: 'זה כל המשקל. אבל הכבל מושך כלפי מעלה, ונושא חצי ממנו: $T\sin30^\circ = 14.7\,\text{N}$.'
          - value: 25.5
            feedback: 'זה הרכיב **האופקי**, $T\cos30^\circ$. הרכיב האנכי מאזן את מה שהכבל לא נושא מהמשקל.'
        hints:
          - 'סביב הקצה שבו מחובר הכבל, רק המשקל והרכיב האנכי של כוח הציר יוצרים מומנט.'

      - label: ג
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-8.3-1]
        prompt: >-
          חותכים את הכבל. מצאו את התאוצה הזוויתית של המוט ואת הכוח שהציר מפעיל עליו **ברגע הראשון** אחרי החיתוך,
          כביטויים ואחר כך כמספרים, והשוו לכוח האנכי של הציר מחלק ב. בדקו את הדרך בגבול שבו כל המסה מרוכזת בקצה
          החופשי של מוט חסר מסה: מה היא נותנת אז לכוח הציר?
        hints:
          - 'ברגע הראשון המוט עוד במנוחה, $\omega = 0$: למרכז המסה אין תאוצה צנטריפטלית, רק משיקית.'
        solution:
          - { kind: law, text: 'משוואת המומנט סביב הציר הקבוע: $\tau = I\alpha$, עם $I = \tfrac13ML^2$. החוק השני למרכז המסה: $M\vec a_{cm} = M\vec g + \vec F$, כאשר $\vec F$ כוח הציר.' }
          - { kind: manipulation, text: 'סביב הציר רק הכובד יוצר מומנט: $Mg\dfrac L2 = \tfrac13ML^2\alpha$, ולכן $\alpha = \dfrac{3g}{2L}$. ברגע הראשון $\omega = 0$, ולכן מרכז המסה מאיץ רק בניצב למוט, כלומר כלפי מטה: $a_{cm} = \alpha\dfrac L2 = \tfrac34g$. ציר אנכי כלפי מטה: $Mg - F = M\cdot\tfrac34g$, ולכן $F = \tfrac14Mg$ כלפי מעלה. הרכיב האופקי אפס, כי אין תאוצה אופקית.' }
          - { kind: limit, text: 'אילו כל המסה הייתה בקצה החופשי ($I = ML^2$, מומנט $MgL$): $\alpha = g/L$, הקצה נופל ב-$g$, ו-$F = 0$: נפילה חופשית, והציר לא נחוץ. אילו כל המסה הייתה על הציר: $a_{cm} = 0$ ו-$F = Mg$. המוט האחיד, $F = \tfrac14Mg$, בין שני הקצוות.' }
          - { kind: units, text: '$\dfrac{3g}{2L}$: $\dfrac{\text{m/s}^2}{\text{m}} = \text{s}^{-2}$, יחידות של תאוצה זוויתית. $\tfrac14Mg$ בניוטון.' }
          - { kind: substitution, text: '$\alpha = \dfrac{3\cdot9.8}{2\cdot1.2} = 12.25\,\text{rad/s}^2$ (בדיוק), $a_{cm} = \tfrac34\cdot9.8 = 7.35\,\text{m/s}^2$, ו-$F = \tfrac14\cdot3.0\cdot9.8 = 7.35\,\text{N}$. שני המספרים שווים רק במקרה: $F = \tfrac13Ma_{cm}$, ו-$\tfrac13M$ כאן הוא בדיוק $1.0\,\text{kg}$.' }
          - { kind: result, text: '$\alpha = \dfrac{3g}{2L} = 12.25\,\text{rad/s}^2$, וכוח הציר $\tfrac14Mg = 7.35\,\text{N}$, אנכי כלפי מעלה. הוא ירד בחצי, מ-$14.7\,\text{N}$, ברגע החיתוך: הציר לא צריך עוד להחזיק את המוט, רק להאט את הנפילה של הקצה הקרוב.' }
        rubric:
          - text: כתבתי $\tau = I\alpha$ סביב הציר עם $I = \tfrac13ML^2$ וזרוע $L/2$, וקיבלתי $\alpha = \dfrac{3g}{2L}$.
          - text: קבעתי שברגע הראשון $\omega = 0$, ולכן $a_{cm} = \alpha L/2 = \tfrac34g$ כלפי מטה, בלי רכיב אופקי.
          - text: כתבתי את החוק השני למרכז המסה וקיבלתי כוח ציר $\tfrac14Mg$ כלפי מעלה.
          - text: בדקתי את התוצאה בגבול של מסה בקצה (נפילה חופשית, $F = 0$) ובדקתי יחידות.

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-8.7-1, OBJ-8.2-2]
        prompt: >-
          מורידים את המוט מהקיר ותולים אותו באותו קצה על ציר אופקי בלי חיכוך, הרחק מכל קיר, כך שהוא תלוי אנכית
          מתחת לציר וחופשי להתנודד לשני הצדדים. גזרו את זמן המחזור $T_0$ של תנודות בזוויות קטנות סביב המצב הזה ואת
          האורך השקול $\ell$ של המוט, באמצעות $L$ ו-$g$. בדקו את הדרך בגבול שבו כל המסה מרוכזת בקצה התחתון, ואחר כך
          הציבו.
        hints:
          - 'מה מומנט ההתמד של המוט סביב הציר, ובאיזה מרחק ממנו נמצא מרכז המסה?'
          - 'האורך השקול הוא האורך של מטוטלת פשוטה עם אותו זמן מחזור. הוא לא המרחק מהציר למרכז המסה.'
        solution:
          - { kind: law, text: 'משוואת המומנט סביב הציר הקבוע $P$, עם $\theta$ הזווית של המוט מהאנך, חיובית נגד כיוון השעון: $I_P\ddot\theta = -Mgd\sin\theta$, כאשר $d = L/2$ המרחק מהציר למרכז המסה. משפט הצירים המקבילים: $I_P = I_{cm} + Md^2 = \tfrac{1}{12}ML^2 + \tfrac14ML^2 = \tfrac13ML^2$.' }
          - { kind: manipulation, text: 'בזוויות קטנות $\sin\theta \approx \theta$: $\ddot\theta = -\dfrac{Mgd}{I_P}\theta$, משוואת המתנד, עם $\omega_0^2 = \dfrac{Mgd}{I_P} = \dfrac{3g}{2L}$. לכן $$T_0 = 2\pi\sqrt{\frac{I_P}{Mgd}} = 2\pi\sqrt{\frac{2L}{3g}},\qquad \ell = \frac{I_P}{Md} = \frac23L$$ $M$ מתבטלת, כמו במטוטלת פשוטה.' }
          - { kind: limit, text: 'אילו כל המסה הייתה בקצה התחתון, $I_P = ML^2$ ו-$d = L$, והיינו מקבלים $\ell = L$ ו-$T_0 = 2\pi\sqrt{L/g}$, מטוטלת פשוטה באורך $L$, כמו שצריך. ובכל גוף $\ell = d + \dfrac{I_{cm}}{Md} > d$: האורך השקול שווה למרחק למרכז המסה רק כשכל המסה מרוכזת בו, $I_{cm} \to 0$. במוט, $\ell = \tfrac23L$, בין $\tfrac12L$ ל-$L$.' }
          - { kind: units, text: '$\sqrt{\dfrac{\text{m}}{\text{m/s}^2}} = \text{s}$, ו-$\ell$ במטרים.' }
          - { kind: substitution, text: '$T_0 = 2\pi\sqrt{\dfrac{2\cdot1.2}{3\cdot9.8}} = 1.80\,\text{s}$ ו-$\ell = \tfrac23\cdot1.2 = 0.80\,\text{m}$. מטוטלת פשוטה באורך $L$ הייתה נותנת $2.20\,\text{s}$, ובאורך $L/2$, $1.55\,\text{s}$.' }
          - { kind: result, text: '$T_0 = 2\pi\sqrt{\dfrac{2L}{3g}} = 1.80\,\text{s}$, והאורך השקול $\ell = \tfrac23L = 0.80\,\text{m}$.' }
        rubric:
          - text: כתבתי $I_P\ddot\theta = -Mgd\sin\theta$ סביב הציר, עם $I_P = \tfrac13ML^2$ (ולא $\tfrac{1}{12}ML^2$) ו-$d = L/2$.
          - text: קירבתי $\sin\theta \approx \theta$, זיהיתי את $\omega_0^2 = 3g/(2L)$, וקיבלתי $T_0 = 2\pi\sqrt{2L/(3g)}$ ו-$\ell = \tfrac23L$.
          - text: בדקתי שמסה מרוכזת בקצה מחזירה מטוטלת פשוטה באורך $L$, ושהאורך השקול ארוך מהמרחק למרכז המסה, ובדקתי יחידות.
          - text: הצבתי וקיבלתי $1.80\,\text{s}$ ו-$0.80\,\text{m}$.

  # ------------------------------------------------------------ 4: a bicycle wheel: a turning stool and a gyroscope
  - id: Q-8-bagrut-4
    type: bagrut
    title: גלגל אופניים, כיסא מסתובב וג׳ירוסקופ
    prompt: >-
      גלגל אופניים מסתובב סביב הסרן שלו במהירות זוויתית $\omega = 40\,\text{rad/s}$. מתייחסים אליו כטבעת דקה
      במסה $M = 2.0\,\text{kg}$ וברדיוס $R = 0.30\,\text{m}$, ומזניחים את מסת החישורים, הרכזת והסרן.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-8.2-1]
        prompt: מה גודל התנע הזוויתי של הגלגל סביב הסרן?
        answer: 7.2
        unit: kg·m²/s
        correctFeedback: 'נכון. $I = MR^2 = 0.18\,\text{kg}\cdot\text{m}^2$, כי כל המסה במרחק $R$, ו-$L = I\omega = 0.18\cdot40 = 7.2\,\text{kg}\cdot\text{m}^2/\text{s}$.'
        wrongFeedback: '$L = I\omega$, עם מומנט ההתמד של טבעת.'
        commonWrong:
          - value: 3.6
            feedback: 'השתמשתם ב-$I = \tfrac12MR^2$, של דסקה. בטבעת כל המסה בשפה: $I = MR^2$.'
            misconception: MC-8-inertia-only-mass
          - value: 24
            feedback: 'זה $MR\omega$, המסה כפול מהירות השפה, בלי הזרוע. התנע הזוויתי כולל עוד $R$: $L = MR\cdot R\omega$.'
        hints:
          - 'בטבעת דקה, כל המסה באותו מרחק מהסרן.'

      - label: ב
        type: open
        points: 6
        level: mid
        objectives: [OBJ-8.6-1]
        prompt: >-
          סטודנט יושב במנוחה על כיסא שמסתובב בלי חיכוך סביב ציר אנכי, ומחזיק את הגלגל כשהסרן אנכי ו-$\vec L$ כלפי
          מעלה. הוא הופך את הגלגל, כך שהתנע הזוויתי של הסיבוב העצמי של הגלגל, כפי שהוא נמדד ביחס לקרקע, שווה בגודלו
          לזה שהיה לו ופונה כלפי מטה. מומנט ההתמד של הסטודנט והכיסא סביב ציר הכיסא, יחד עם הגלגל כמסה שהסטודנט נושא
          איתו, הוא $I_s = 3.0\,\text{kg}\cdot\text{m}^2$. הסיבוב של הגלגל סביב הסרן לא נכלל ב-$I_s$: הוא כולו בתנע
          הזוויתי $\pm L$ של הגלגל, ולכן אינו נספר פעמיים. בטאו את המהירות הזוויתית $\Omega_s$ של הכיסא אחרי ההיפוך
          באמצעות $L$ ו-$I_s$. בדקו את הביטוי דרך הכללה: מה היה קורה אילו הסטודנט היה מטה את הסרן רק בזווית $\theta$
          מהאנך, ומה נותנת ההכללה ב-$\theta = 0$ וב-$\theta = 180^\circ$? אחר כך הציבו.
        hints:
          - 'כתבו את רכיב התנע הזוויתי הכולל לאורך הציר האנכי לפני ההיפוך ואחריו, עם סימנים.'
          - 'השינוי בתנע הזוויתי של הגלגל הוא $2L$, לא $L$: מ-$+L$ ל-$-L$.'
        solution:
          - { kind: law, text: 'ציר חיובי כלפי מעלה. הכוחות החיצוניים על הסטודנט, הכיסא והגלגל (הכובד, והכוח של הציר והרצפה על הכיסא) לא יוצרים מומנט סביב הציר האנכי של הכיסא, שמסתובב בלי חיכוך. לכן רכיב התנע הזוויתי הכולל לאורך הציר הזה נשמר, אף שהסטודנט מפעיל על הגלגל מומנטים פנימיים גדולים.' }
          - { kind: manipulation, text: 'לפני: הכיסא במנוחה, והגלגל תורם $+L$. אחרי: הגלגל תורם $-L$, והכיסא $I_s\Omega_s$. מכאן $L = -L + I_s\Omega_s$, ו-$$\Omega_s = \frac{2L}{I_s}$$ חיובי: הכיסא מסתובב בכיוון שבו הגלגל הסתובב בהתחלה.' }
          - { kind: limit, text: 'הכללה שבודקת את התוצאה: אם הסרן מוטה רק בזווית $\theta$ מהאנך, הגלגל תורם לרכיב האנכי $L\cos\theta$, ו-$\Omega_s = \dfrac{L(1 - \cos\theta)}{I_s}$. ב-$\theta = 0$, $\Omega_s = 0$: שום דבר לא השתנה. ב-$\theta = 90^\circ$, סרן אופקי, $\Omega_s = L/I_s$. ב-$\theta = 180^\circ$ חוזרים ל-$2L/I_s$. וכש-$I_s \to \infty$ (כיסא מקובע לרצפה), $\Omega_s \to 0$, והרצפה סופגת את השינוי.' }
          - { kind: units, text: '$\dfrac{\text{kg}\cdot\text{m}^2/\text{s}}{\text{kg}\cdot\text{m}^2} = \text{s}^{-1}$, יחידות של מהירות זוויתית.' }
          - { kind: substitution, text: 'עם $L = 7.2\,\text{kg}\cdot\text{m}^2/\text{s}$ מחלק א: $\Omega_s = \dfrac{2\cdot7.2}{3.0} = 4.8\,\text{rad/s}$. האנרגיה של הכיסא, $\tfrac12\cdot3.0\cdot4.8^2 = 34.6\,\text{J}$, באה מהעבודה של הסטודנט בזמן שהפך את הגלגל: תנע זוויתי נשמר, אנרגיה קינטית לא.' }
          - { kind: result, text: '$\Omega_s = \dfrac{2L}{I_s} = 4.8\,\text{rad/s}$, בכיוון הסיבוב ההתחלתי של הגלגל.' }
        rubric:
          - text: כתבתי שימור של רכיב התנע הזוויתי לאורך הציר האנכי, עם סימנים, והסברתי למה אין מומנט חיצוני סביבו.
          - text: לקחתי את השינוי של הגלגל, מ-$+L$ ל-$-L$, וקיבלתי $\Omega_s = 2L/I_s$.
          - text: בדקתי את הגבול של הטיה בזווית $\theta$ ($\theta = 0$ נותן אפס) ובדקתי יחידות.
          - text: הצבתי וקיבלתי $4.8\,\text{rad/s}$.

      - label: ג
        type: mc
        points: 6
        level: mid
        qualitative: true
        objectives: [OBJ-8.8-2]
        prompt: >-
          עכשיו תולים את הגלגל, שמסתובב ב-$40\,\text{rad/s}$, בחוט אנכי שקשור לקצה אחד של הסרן, במרחק
          $r = 0.15\,\text{m}$ ממרכז הגלגל. משחררים אותו כשהסרן אופקי, והוא נוקף סביב החוט בקצב קבוע, כשמרכזו נשאר
          באותו גובה. מה גודל הכוח שהחוט מפעיל על הגלגל?
        choices:
          - text: 'כמעט בדיוק $Mg = 19.6\,\text{N}$.'
            correct: true
            feedback: >-
              נכון. מרכז המסה לא עולה ולא יורד, ולכן הכוח האנכי של החוט שווה למשקל. מרכז המסה כן נע במעגל אופקי ברדיוס
              $r$, ולכן צריך גם כוח אופקי קטן, $M\Omega^2r$, והחוט נוטה מעט מהאנך. עם קצב הנקיפה שתמצאו בחלק ד,
              $\Omega = 0.408\,\text{rad/s}$, הוא $0.05\,\text{N}$: כמעט כלום.
          - text: 'פחות מ-$Mg$, כי הסיבוב מחזיק חלק מהמשקל.'
            feedback: >-
              הסיבוב לא נושא משקל. הוא משנה את מה שהמומנט של הכובד עושה: במקום להפיל את הגלגל, המומנט מסובב את $\vec L$
              הצידה. את המשקל עצמו, הכוח האנכי, חייב לאזן החוט, אחרת מרכז המסה היה מאיץ כלפי מטה.
            misconception: MC-8-gyroscope-defies-gravity
          - text: 'יותר מ-$Mg$, כי החוט צריך גם לאזן את מומנט הכובד.'
            feedback: 'החוט עובר בנקודת התלייה, ולכן אין לו מומנט סביבה. מומנט הכובד לא מאוזן: הוא זה שגורם לנקיפה.'
          - text: 'אפס: הגלגל מרחף, והחוט רק מכוון אותו.'
            feedback: 'בלי כוח מהחוט, הכוח היחיד היה הכובד, ומרכז המסה היה נופל ב-$g$. ג׳ירוסקופ לא מבטל את הכובד.'
            misconception: MC-8-gyroscope-defies-gravity
        hints:
          - 'כתבו את החוק השני למרכז המסה, בכיוון האנכי. האם מרכז המסה מאיץ כלפי מעלה או מטה?'

      - label: ד
        type: open
        points: 9
        level: bagrut
        standalone: false
        objectives: [OBJ-8.8-2]
        prompt: >-
          בתלייה של חלק ג, גזרו את קצב הנקיפה $\Omega$ באמצעות $M$, $g$, $r$ והתנע הזוויתי $L = I\omega$ של הגלגל.
          בדקו את הביטוי בגבולות, ואחר כך חשבו את $\Omega$ ואת זמן סיבוב הנקיפה, ובדקו את ההנחה שהגלגל מסתובב "מהר".
        hints:
          - 'מומנט הכובד סביב נקודת התלייה אופקי וניצב ל-$\vec L$. מה הוא עושה לגודל של $\vec L$, ומה לכיוון שלו?'
        solution:
          - { kind: law, text: 'משוואת המומנט סביב נקודת התלייה: $\dfrac{d\vec L}{dt} = \vec\tau$. בסיבוב מהיר $\vec L$ כמעט כולו לאורך הסרן, $\vec L \approx I\omega\,\hat s$.' }
          - { kind: manipulation, text: 'מומנט הכובד $\vec\tau = \vec r\times M\vec g$ אופקי וניצב לסרן, בגודל $Mgr$. מכיוון ש-$\vec\tau \perp \vec L$, הגודל של $\vec L$ לא משתנה, ורק הכיוון שלו מסתובב במישור האופקי: בזמן $dt$, $|d\vec L| = L\,d\varphi = Mgr\,dt$. לכן $$\Omega = \frac{d\varphi}{dt} = \frac{Mgr}{I\omega}$$' }
          - { kind: limit, text: 'כש-$\omega \to \infty$, $\Omega \to 0$: גלגל מהיר מאוד כמעט לא זז. כש-$r \to 0$ (תלייה במרכז המסה), $\Omega \to 0$, כי אין מומנט. וכש-$\omega$ קטנה, $\Omega$ גדלה עד שהיא כבר לא קטנה בהרבה מ-$\omega$, ואז ההנחה $\vec L \approx I\omega\,\hat s$ נשברת, והגלגל מתנדנד ונופל.' }
          - { kind: units, text: '$\dfrac{Mgr}{I\omega}$: $\dfrac{\text{N}\cdot\text{m}}{\text{kg}\cdot\text{m}^2\cdot\text{s}^{-1}} = \dfrac{\text{kg}\cdot\text{m}^2\cdot\text{s}^{-2}}{\text{kg}\cdot\text{m}^2\cdot\text{s}^{-1}} = \text{s}^{-1}$.' }
          - { kind: substitution, text: '$\Omega = \dfrac{2.0\cdot9.8\cdot0.15}{7.2} = 0.408\,\text{rad/s}$, וזמן סיבוב נקיפה $\dfrac{2\pi}{\Omega} = 15.4\,\text{s}$. היחס $\omega/\Omega \approx 98$, ולכן ההנחה של סיבוב מהיר טובה.' }
          - { kind: result, text: '$\Omega = \dfrac{Mgr}{I\omega} = 0.408\,\text{rad/s}$, סיבוב נקיפה אחד בכל $15.4\,\text{s}$, ו-$\omega \approx 98\,\Omega$.' }
        rubric:
          - text: כתבתי $d\vec L/dt = \vec\tau$, ומצאתי שמומנט הכובד, $Mgr$, ניצב ל-$\vec L$.
          - text: הסקתי שרק הכיוון של $\vec L$ משתנה, וכתבתי $L\,d\varphi = \tau\,dt$, וקיבלתי $\Omega = Mgr/(I\omega)$.
          - text: בדקתי גבולות ($\omega \to \infty$, $r \to 0$) ויחידות.
          - text: קיבלתי $0.408\,\text{rad/s}$ וזמן נקיפה של כ-$15\,\text{s}$, ובדקתי ש-$\omega \gg \Omega$.

  # ------------------------------------------------------------ 5 (exam format): a rolling cylinder hits a step
  - id: Q-8-bagrut-5
    type: bagrut
    title: גליל מתגלגל פוגע במדרגה
    prompt: >-
      גליל מלא ואחיד במסה $M$ וברדיוס $R$ מתגלגל בלי החלקה על רצפה אופקית, ומרכזו נע במהירות $v_0$. הוא פוגע בשפה
      $E$ של מדרגה בגובה $h < R$, שניצבת לכיוון התנועה. השפה מחוספסת: ברגע הפגיעה הגליל נצמד אליה, לא מחליק עליה
      ולא קופץ ממנה, ומכאן הוא מסתובב סביבה כמו סביב ציר קבוע. הפגיעה קצרה מאוד. הניחו שהגליל נשאר צמוד לשפה עד
      שהוא עולה על המדרגה, והזניחו את התנגדות האוויר.

        level: basic
        qualitative: true
        objectives: [OBJ-8.6-2, OBJ-4.4-1]
        prompt: איזה גודל של הגליל נשמר בזמן הפגיעה הקצרה בשפה?
        choices:
          - text: 'התנע הזוויתי סביב השפה $E$.'
            correct: true
            feedback: >-
              נכון. בזמן הפגיעה פועלים על הגליל הכובד, הכוח מהרצפה והכוח של השפה. רק הכוח של השפה מתקפי, גדול מאוד
              לזמן קצר מאוד. הכובד סופי. גם הכוח מהרצפה סופי: הרצפה יכולה רק לדחוף, והפגיעה מרימה את הגליל ממנה (אחריה
              הגליל מסתובב סביב $E$, ונקודת המגע שלו עם הרצפה נעה כלפי מעלה), ולכן אין צורך בדחיפה גדולה מהרצפה. המתקף
              של שני הכוחות הסופיים שואף לאפס עם משך הפגיעה. הכוח של השפה פועל
              ב-$E$ עצמה, ולכן אין לו מומנט סביבה, והתנע הזוויתי סביב $E$ נשמר.
          - text: 'התנע של הגליל, כי הפגיעה קצרה ומותר להזניח בה את הכוחות החיצוניים.'
            feedback: >-
              מותר להזניח רק כוחות סופיים, כמו הכובד. הכוח של השפה חיצוני ומתקפי: הוא עוצר את התנועה האופקית של מרכז
              הגליל ומפנה אותה כלפי מעלה, ולכן התנע משתנה. מה שהשפה לא יכולה לשנות הוא התנע הזוויתי סביב הנקודה שבה
              היא פועלת.
            misconception: MC-4-external-always-negligible
          - text: 'התנע הזוויתי סביב מרכז הגליל, כי הכוח של השפה מכוון אל המרכז.'
            feedback: >-
              רק הרכיב של הכוח הזה שניצב להיקף הגליל מכוון אל המרכז. כדי שהגליל לא יחליק על השפה, היא מפעילה עליו גם
              כוח חיכוך, משיק להיקף הגליל, ולו יש זרוע $R$ סביב המרכז.
          - text: 'האנרגיה הקינטית, כי הגליל לא מחליק על השפה ואין חיכוך שמחמם.'
            feedback: >-
              אי-החלקה לא מבטיחה שימור אנרגיה. הגליל נצמד לשפה, כמו גופים שנדבקים זה לזה בהתנגשות פלסטית, ואנרגיה
              הולכת לעיוות ולחום באזור המגע. בחלק ג תחשבו כמה.
            misconception: MC-4-ke-always-conserved
        hints:
          - 'איזה כוח על הגליל גדול מאוד בזמן הפגיעה, ואיפה הוא פועל?'

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-8.6-2, OBJ-3.8-2, OBJ-8.2-2, OBJ-8.4-1]
        prompt: >-
          בטאו את המהירות הזוויתית $\Omega$ של הגליל מיד אחרי הפגיעה באמצעות $v_0$, $R$ ו-$h$. בדקו את הביטוי בשני
          גבולות, $h \to 0$ ו-$h \to R$, ובדקו יחידות.
        hints:
          - 'פרקו את התנע הזוויתי סביב $E$ לפני הפגיעה לחלק של מרכז המסה ולחלק של הסיבוב סביב מרכז המסה, כמו בשיעור 3.8. באיזה גובה מעל $E$ נע מרכז המסה?'
          - 'השפה נמצאת על היקף הגליל, במרחק $R$ מהמרכז. מה מומנט ההתמד סביבה?'
        solution:
          - { kind: law, text: 'חיובי בכיוון שבו הגליל מסתובב (עם כיוון השעון כשהוא נע ימינה). התנע הזוויתי סביב $E$ נשמר בפגיעה (חלק א). לפניה הוא סכום של חלק מרכז המסה ושל הסיבוב סביב מרכז המסה: $L_E = Mv_0\,d_\perp + I_{cm}\omega_0$, כאשר $d_\perp$ המרחק של $E$ מהקו שלאורכו נע מרכז המסה. אחריה הגליל מסתובב סביב $E$: $L_E = I_E\Omega$.' }
          - { kind: manipulation, text: 'מרכז המסה נע אופקית בגובה $R$, והשפה בגובה $h$, ולכן $d_\perp = R - h$. בגלגול $\omega_0 = v_0/R$, ו-$I_{cm} = \tfrac12MR^2$. שני האיברים באותו כיוון: מרכז המסה נמצא מעל $E$ (ומשמאלה) ונע ימינה, ולכן $\vec r\times M\vec v_0$ סביב $E$ פונה עם כיוון השעון, כמו הסיבוב העצמי. $L_E = Mv_0(R - h) + \tfrac12MRv_0 = Mv_0\left(\tfrac32R - h\right)$. לפי משפט הצירים המקבילים, $I_E = \tfrac12MR^2 + MR^2 = \tfrac32MR^2$. לכן $$\Omega = \frac{Mv_0\left(\tfrac32R - h\right)}{\tfrac32MR^2} = \frac{v_0}{R}\left(1 - \frac{2h}{3R}\right)$$' }
          - { kind: limit, text: 'כש-$h \to 0$, $\Omega \to v_0/R = \omega_0$: שפה בגובה אפס היא נקודת המגע עם הרצפה, שסביבה הגליל ממילא מסתובב בגלגול, ושום דבר לא משתנה. כש-$h \to R$, לתנועת מרכז המסה אין זרוע סביב $E$, ונשאר רק הסיבוב העצמי: $\Omega = \tfrac13\omega_0$. בין שני הקצוות $\Omega$ קטנה ככל שהמדרגה גבוהה יותר. $M$ מתבטלת.' }
          - { kind: units, text: '$\dfrac{v_0}{R}$ ב-$\dfrac{\text{m/s}}{\text{m}} = \text{s}^{-1}$, ו-$\dfrac hR$ חסר ממדים.' }
          - { kind: result, text: '$\Omega = \dfrac{v_0}{R}\left(1 - \dfrac{2h}{3R}\right)$, באותו כיוון סיבוב כמו לפני הפגיעה.' }
        rubric:
          - text: כתבתי שימור תנע זוויתי סביב השפה $E$, ולא סביב מרכז הגליל.
          - text: כתבתי את התנע הזוויתי לפני הפגיעה כ-$Mv_0(R - h) + I_{cm}\omega_0$, עם הזרוע $R - h$ ועם הסיבוב העצמי, ובדקתי ששני האיברים באותו כיוון.
          - text: חישבתי $I_E = \tfrac32MR^2$ במשפט הצירים המקבילים וקיבלתי $\Omega = \dfrac{v_0}{R}\left(1 - \dfrac{2h}{3R}\right)$.
          - text: בדקתי ש-$h \to 0$ מחזיר $\Omega = v_0/R$ ושב-$h \to R$ נשאר רק הסיבוב העצמי, $\omega_0/3$, ובדקתי יחידות.

      - label: ג

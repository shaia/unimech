# Chapter 8 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג…), 25 points each, the
# parts climbing basic → mid → bagrut (exam level). Open parts are solved in the course format: general law
# (law) → derivation (manipulation) → limit check (limit) → unit check (units) → numbers (substitution) →
# result. Together the first four problems touch every lesson of the chapter:
#   1 rod struck on ice: 8.1, 8.2, 8.3, 8.6 · 2 yo-yo: 8.2, 8.3, 8.4 · 3 hinged rod, cable cut: 8.3, 8.5, 8.7 ·
#   4 bicycle wheel, stool and gyroscope: 8.2, 8.6, 8.8 ·
#   5 (exam format, given in symbols) a rolling cylinder hits the edge of a step: 8.2, 8.3, 8.4, 8.6 with 3.3, 3.8,
#     4.1, 4.4.
#
# Rework of 2026-11-18 (toward the 77101 exams, which ask mostly for derivations): in every problem the open parts
# carry ≥ 13 of the 25 points, the first part is auto-graded and the last part is a symbolic result with a limit
# check. Converted to open: 1ד (K_r/K for a strike at distance b from the centre), 2ד (the hand's acceleration in
# terms of I), 3ד (physical-pendulum period and equivalent length), 4ב (the stool, generalised to a tilt θ); 4ג and 4ד
# swapped (the string-force mc now comes before the precession derivation). Problem 5 is new.
# Numbers of the rework recomputed in .scratch/ch8/review-rework.ts (G = 9.8), each closed form checked at a sample
# point against an independent route:
#   1ד: K_r/K = 12b²/(L² + 12b²) = 0.75 at b = L/2 (K_t 0.15 J, K_r 0.45 J), 0.429 at b = 0.2 m, closed form = direct
#       ½Mv² + ½Iω² from the impulse.
#   2ד: a_hand = gMR²/I = 2g = 19.6 m/s² (ring g = 9.8), equal to αR with α = MgR/I.
#   3ד: T = 2π√(2L/(3g)) = 1.80 s, ℓ = 2L/3 = 0.80 m (simple L 2.20 s); RK4 of θ'' = −(Mgd/I)sin θ at 0.01 rad gives 1.795 s.
#   4ב: Ω_s = L(1 − cos θ)/I_s: 4.8 rad/s at θ = π, 2.4 at θ = π/2; chair energy 34.6 J.
#   5 (symbols; numbers only in ד, R = 0.20 m, h = 0.050 m): Ω = (v0/R)(1 − 2h/(3R)) — checked by summing r × v of
#       mass elements of the disc about the edge (grid 1200², L_E = 1.25 Mv0R, I_E = 1.50 MR², Ω 4.17 = closed form at
#       v0 = 1 m/s); lost fraction 1 − (1 − 2h/(3R))² = 0.306 (= from K before/after; 8/9 at h = R);
#       v_min = 2R√(3gh)/(3R − 2h) = 0.970 m/s (no-impact √(4gh/3) 0.808), RK4 of the rotation about the edge climbs
#       at 1.01 v_min and not at 0.99 v_min; contact with the edge at v_min needs h ≤ 3R/7 (Ω²R 3.27 ≤ g cos φ0 7.35).
#
# Original numbers (2026-11-12):
# Every number was computed in .scratch/ch8/r.ts with src/physics/constants.ts (G = 9.8):
#   1: M = 1.2 kg, L = 0.80 m, J = 0.60 N·s: I_cm = 0.064 (end 0.256, ML² 0.768) kg·m², v_cm = 0.50 m/s, ω = 3.75 rad/s
#      (I_end 0.94, lever L 7.5), point at rest 0.133 m past the centre = 0.533 m from the struck end (0.267 from the far
#      end), K_t = 0.15 J, K_r = 0.45 J, K_r/K = 0.75 (K_r/K_t = 3); far end −1.0 m/s, struck end 2.0 m/s.
#   2: M = 0.12 kg, R = 0.030 m: I = 5.4e-5 kg·m², a = 2g/3 = 6.53 m/s², T = Mg/3 = 0.392 N, after 0.80 m v = 3.23 m/s
#      (free fall 3.96, a = g/3 2.29), hovering: hand a = 2g = 19.6 m/s².
#   3: M = 3.0 kg, L = 1.2 m, cable at 30°: T = 29.4 N (no sin 14.7, weight at the end 58.8), hinge 14.7 N up and 25.5 N
#      out; after the cut α = 3g/(2L) = 12.25 rad/s², a_cm = 3g/4 = 7.35 m/s², hinge Mg/4 = 7.35 N; hanging period
#      2π√(2L/(3g)) = 1.80 s (simple L 2.20, L/2 1.55, I_cm 0.898).
#   4: ring M = 2.0 kg, R = 0.30 m, ω = 40 rad/s: L = 7.2 (disc 3.6) kg·m²/s; stool I = 3.0 kg·m²: 2L/I = 4.8 rad/s
#      (forgot 2: 2.4); string at r = 0.15 m: Ω = Mgr/L = 0.408 rad/s, period 15.4 s, ω/Ω = 98, horizontal force MΩ²r = 0.05 N.
# Independent review 2026-11-18 (.scratch/review/ch8/indep.ts, own routes; the authors' scripts not opened): 59 numbers
#   and 24 symbolic results recomputed, all correct. Routes: I by numeric integration (rod, disc); 1 by blowFree of
#   physpendulum.ts and a sum of ½dm v² over the rod at b = 0.1–0.4 m; 2c by integrating the descent; 3 statics by
#   netTorque about three points, 3ד by smallPeriod/periodAt and an own RK4; 5 by a 1200² grid sum of r × v about E
#   (L_E = 1.25 Mv0R, I_E = 1.50 MR²), an RK4 of the climb (climbs at 1.01 v_min, not at 0.99), the floor contact point
#   rising after the impact (v_y > 0), and v_min/√(4gh/3) → 1 as h → 0. No wrong value. Changed: 1ב, 3ג, 3ד name the
#   limit they check (the derived expressions have no free parameter); 3ג standalone: false (compares with ב), α written
#   12.25 (exact), and why a_cm and F share the number 7.35; 3ב says the hinge's horizontal component balances the
#   cable's; 4ב says the wheel enters I_s only as carried mass, and calls the θ tilt a generalisation; 5 gets a diagram
#   (E, φ0, R − h); 5א says why the floor force stays finite; 5ב gives the r × v reason both terms add; 5ג rubric adds
#   h → R and units; 5ד limit is the ratio v_min/√(4gh/3) → 1, and the stays-on-the-edge check is labelled an assumption
#   check (a manipulation step) with φ0 defined; "היקף" for the cylinder's rim, "שפה" only for the step's edge.
# Reviewed 2026-11-12: every number above recomputed independently from closed forms in
# .scratch/review/ch8/bagrut/r.ts (g = 9.8, 3-sig-fig rounding by toPrecision, commonWrong separation > 3%).

chapter: 8
questions:
  # ------------------------------------------------------------ 1: a rod struck on ice
  - id: Q-8-bagrut-1
    type: bagrut
    title: מוט שנפגע על הקרח
    prompt: >-
      מוט אחיד במסה $M = 1.2\,\text{kg}$ ובאורך $L = 0.80\,\text{m}$ מונח במנוחה על קרח חלק. מקל הוקי פוגע בקצה
      אחד שלו מכה קצרה, אופקית ובניצב למוט, עם מתקף $J = 0.60\,\text{N}\cdot\text{s}$. הזניחו כל חיכוך עם הקרח.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-8.2-1]
        prompt: מה מומנט ההתמד של המוט סביב ציר אנכי שעובר במרכזו?
        answer: 0.064
        unit: kg·m²
        correctFeedback: >-
          נכון. $I_{cm} = \displaystyle\int_{-L/2}^{L/2}x^2\frac ML\,dx = \frac{1}{12}ML^2 = \frac{1.2\cdot0.64}{12} = 0.064\,\text{kg}\cdot\text{m}^2$.
        wrongFeedback: 'חשבו את האינטגרל של $x^2\,dm$, עם $dm = (M/L)\,dx$, מ-$-L/2$ עד $L/2$.'
        commonWrong:
          - value: 0.256
            feedback: 'זה $\tfrac13ML^2$, סביב **הקצה**. הציר עובר במרכז, ושם האינטגרל רץ מ-$-L/2$ עד $L/2$.'
            misconception: MC-8-inertia-only-mass
          - value: 0.768
            feedback: 'זה $ML^2$, כאילו כל המסה במרחק $L$ מהציר. במוט המסה מפוזרת, ורובה קרובה למרכז.'
        hints:
          - 'סביב המרכז, המסה מגיעה עד מרחק $L/2$ מכל צד.'

      - label: ב
        type: open
        points: 8
        level: mid
        objectives: [OBJ-8.6-2, OBJ-8.1-1]
        prompt: >-
          מצאו את מהירות מרכז המסה $v_{cm}$ ואת המהירות הזוויתית $\omega$ של המוט מיד אחרי המכה, קודם כביטויים
          ב-$J$, $M$ ו-$L$ ואחר כך כמספרים. בדקו את הדרך בגבול של מכה במרכז המוט (מה היא נותנת למכה במרחק $b$
          מהמרכז, כש-$b \to 0$?), ובדקו יחידות.
        hints:
          - 'מתקף משנה את התנע הקווי. והמומנט של המתקף סביב מרכז המסה משנה את התנע הזוויתי סביבו.'
        solution:
          - { kind: law, text: 'מתקף ותנע: $J = \Delta p = Mv_{cm}$. מתקף זוויתי סביב מרכז המסה: $\int\tau_{cm}\,dt = \Delta L_{cm} = I_{cm}\omega$. משוואת המומנט סביב מרכז המסה תקפה גם כשמרכז המסה מאיץ.' }
          - { kind: manipulation, text: 'המכה במרחק $L/2$ ממרכז המסה ובניצב למוט, ולכן המתקף הזוויתי שלה $J\dfrac L2$. מכאן $v_{cm} = \dfrac JM$ ו-$\omega = \dfrac{JL/2}{ML^2/12} = \dfrac{6J}{ML}$.' }
          - { kind: limit, text: 'אם המכה הייתה במרחק $b$ ממרכז המסה, $\omega = \dfrac{Jb}{I_{cm}}$: ב-$b = 0$ (מכה במרכז) המוט רק מתקדם, בלי סיבוב, כמצופה. ו-$v_{cm}$ לא תלוי במקום המכה כלל.' }
          - { kind: units, text: '$\dfrac JM$: $\dfrac{\text{N}\cdot\text{s}}{\text{kg}} = \text{m/s}$. $\dfrac{J}{ML}$: $\dfrac{\text{N}\cdot\text{s}}{\text{kg}\cdot\text{m}} = \text{s}^{-1}$, יחידות של מהירות זוויתית.' }
          - { kind: substitution, text: '$v_{cm} = \dfrac{0.60}{1.2} = 0.50\,\text{m/s}$, ו-$\omega = \dfrac{6\cdot0.60}{1.2\cdot0.80} = 3.75\,\text{rad/s}$.' }
          - { kind: result, text: '$v_{cm} = \dfrac JM = 0.50\,\text{m/s}$ בכיוון המכה, ו-$\omega = \dfrac{6J}{ML} = 3.75\,\text{rad/s}$.' }
        rubric:
          - text: כתבתי $J = Mv_{cm}$ וקיבלתי $v_{cm} = 0.50\,\text{m/s}$.
          - text: כתבתי מתקף זוויתי סביב מרכז המסה, $J\cdot L/2 = I_{cm}\omega$, עם $I_{cm} = \tfrac{1}{12}ML^2$, ולא סביב הקצה.
          - text: בדקתי שמכה במרכז נותנת $\omega = 0$, ובדקתי את היחידות של שני הביטויים.
          - text: קיבלתי $\omega = 3.75\,\text{rad/s}$.

      - label: ג
        type: numeric
        points: 5
        level: mid
        standalone: false
        objectives: [OBJ-8.1-1]
        prompt: >-
          מיד אחרי המכה, נקודה אחת של המוט נמצאת במנוחה רגעית. באיזה מרחק מהקצה **שהוכה** היא נמצאת?
        answer: 0.533
        unit: m
        correctFeedback: >-
          נכון. נמדוד מהירויות חיוביות בכיוון המכה. נקודה במרחק $x$ ממרכז המסה, לכיוון הקצה השני, נעה ב-$v_{cm} - \omega x$. היא במנוחה ב-
          $x = \dfrac{v_{cm}}{\omega} = \dfrac{0.50}{3.75} = 0.133\,\text{m} = \dfrac L6$, ולכן במרחק
          $\dfrac L2 + \dfrac L6 = \dfrac23L = 0.533\,\text{m}$ מהקצה שהוכה. הקצה השני נע **אחורה**, ב-$1.0\,\text{m/s}$,
          והקצה שהוכה קדימה ב-$2.0\,\text{m/s}$. ואילו המוט היה תלוי על ציר בנקודה הזו, הקצה שהוכה היה מרכז ההקשה
          שלו: מכה בו לא הייתה גורמת לציר להפעיל מתקף.
        wrongFeedback: 'מהירות נקודה על המוט היא $v_{cm}$ ועוד מהירות הסיבוב, $\omega x$, שסימנה תלוי בצד. איפה הן מבטלות זו את זו?'
        commonWrong:
          - value: 0.4
            feedback: 'זה מרכז המוט, אבל הוא נע ב-$v_{cm} = 0.50\,\text{m/s}$. המוט מסתובב **סביב** מרכז המסה, אבל מרכז המסה עצמו זז.'
            misconception: MC-8-all-points-move-with-cm
          - value: 0.8
            feedback: 'זה הקצה השני. המוט אינו מחובר שם לציר: הקצה הזה נע אחורה ב-$v_{cm} - \omega\dfrac L2 = -1.0\,\text{m/s}$.'
            misconception: MC-8-free-rod-pivots-at-end
          - value: 0.267
            feedback: 'זה המרחק של הנקודה מהקצה **השני**, $L/2 - L/6 = L/3$. השאלה שואלת על המרחק מהקצה שהוכה.'
        hints:
          - 'בצד של הקצה השני, מהירות הסיבוב פונה נגד $v_{cm}$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-8.3-2, OBJ-3.8-2]
        prompt: >-
          נניח שהמקל היה פוגע באותו מתקף $J$, אבל במרחק $b$ ממרכז המוט, כאשר $0 \le b \le L/2$. בטאו את החלק מהאנרגיה
          הקינטית של המוט אחרי המכה שהוא אנרגיה של סיבוב סביב מרכז המסה, $\dfrac{K_r}{K_t + K_r}$, באמצעות $b$ ו-$L$.
          האם הוא תלוי ב-$J$ או ב-$M$? בדקו את הביטוי בגבול, ואחר כך הציבו את המכה של השאלה, בקצה.
        hints:
          - 'אנרגיה קינטית של גוף צפיד היא $\tfrac12Mv_{cm}^2 + \tfrac12I_{cm}\omega^2$. בחלק ב מצאתם $v_{cm}$ ו-$\omega$ למכה בזרוע $L/2$. כאן הזרוע היא $b$: החליפו את $L/2$ ב-$b$.'
          - 'השאלה מבקשת את החלק מהאנרגיה **הכוללת**, $\dfrac{K_r}{K_t + K_r}$, ולא את היחס $K_r/K_t$.'
        solution:
          - { kind: law, text: 'האנרגיה הקינטית של גוף צפיד מתפרקת לאנרגיה של תנועת מרכז המסה ולאנרגיה של הסיבוב סביבו: $K = \tfrac12Mv_{cm}^2 + \tfrac12I_{cm}\omega^2$. מחלק ב, עם זרוע $b$: $v_{cm} = \dfrac JM$ ו-$\omega = \dfrac{Jb}{I_{cm}}$, עם $I_{cm} = \tfrac{1}{12}ML^2$.' }
          - { kind: manipulation, text: '$K_t = \dfrac{J^2}{2M}$ ו-$K_r = \dfrac{J^2b^2}{2I_{cm}}$, ולכן $\dfrac{K_r}{K_t} = \dfrac{Mb^2}{I_{cm}} = \dfrac{12b^2}{L^2}$. החלק של הסיבוב: $$\frac{K_r}{K_t + K_r} = \frac{12b^2}{L^2 + 12b^2}$$ $J$ ו-$M$ מתבטלים: המתקף קובע כמה אנרגיה יש, ונקודת המכה קובעת איך היא מתחלקת.' }
          - { kind: limit, text: 'כש-$b \to 0$ (מכה במרכז) החלק שואף ל-0: המוט רק מתקדם, כמו ש-$\omega = 0$ בחלק ב. הוא גדל עם $b$, ובקצה, $b = L/2$, מגיע למקסימום שלו במוט, $\tfrac34$. ולכל גוף, $\dfrac{Mb^2}{I_{cm} + Mb^2}$ שואף ל-1 כש-$b$ גדול בהרבה מרדיוס ההתמד. שימו לב גם שהאנרגיה הכוללת, $\dfrac{J^2}{2M}\left(1 + \dfrac{12b^2}{L^2}\right)$, גדלה עם $b$: אותו מתקף, מחוץ למרכז, עושה יותר עבודה.' }
          - { kind: units, text: 'שתי האנרגיות ב-$\dfrac{(\text{N}\cdot\text{s})^2}{\text{kg}} = \text{J}$, והיחס חסר ממדים, כמו ש-$\dfrac{b^2}{L^2}$ חסר ממדים.' }
          - { kind: substitution, text: '$K_t = \dfrac{0.60^2}{2\cdot1.2} = 0.15\,\text{J}$ ו-$K_r = 3K_t = 0.45\,\text{J}$. ב-$b = L/2$: $\dfrac{12\cdot\tfrac14}{1 + 12\cdot\tfrac14} = \dfrac34 = 0.75$.' }
          - { kind: result, text: '$\dfrac{K_r}{K_t + K_r} = \dfrac{12b^2}{L^2 + 12b^2}$, בלי תלות ב-$J$ או ב-$M$. במכה בקצה, $0.75$: שלושה רבעים מהאנרגיה הם סיבוב.' }
        rubric:
          - text: כתבתי $K = \tfrac12Mv_{cm}^2 + \tfrac12I_{cm}\omega^2$ עם $v_{cm} = J/M$ ו-$\omega = Jb/I_{cm}$.
          - text: קיבלתי $\dfrac{12b^2}{L^2 + 12b^2}$, והראיתי ש-$J$ ו-$M$ מתבטלים.
          - text: בדקתי שמכה במרכז, $b = 0$, נותנת חלק 0, ובדקתי שהיחס חסר ממדים.
          - text: הצבתי $b = L/2$ וקיבלתי $0.75$, עם $K_t = 0.15\,\text{J}$ ו-$K_r = 0.45\,\text{J}$.

  # ------------------------------------------------------------ 2: a yo-yo
  - id: Q-8-bagrut-2
    type: bagrut
    title: יו-יו
    prompt: >-
      יו-יו הוא דסקה אחידה במסה $M = 0.12\,\text{kg}$ וברדיוס $R = 0.030\,\text{m}$. חוט דק וקל כרוך סביב השפה
      שלו, והקצה העליון של החוט מוחזק ביד. החוט אנכי כל הזמן ולא מחליק על השפה. משחררים את היו-יו ממנוחה.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-8.2-1]
        prompt: מה מומנט ההתמד של היו-יו סביב הציר שלו?
        answer: 5.4e-5
        unit: kg·m²
        correctFeedback: 'נכון: $I = \tfrac12MR^2 = \tfrac12\cdot0.12\cdot0.030^2 = 5.4\cdot10^{-5}\,\text{kg}\cdot\text{m}^2$.'
        wrongFeedback: 'מומנט ההתמד של דסקה אחידה סביב ציר הסימטריה שלה, עם $R$ במטרים.'
        commonWrong:
          - value: 1.08e-4
            feedback: 'זה $MR^2$, של טבעת. בדסקה אחידה $I = \tfrac12MR^2$.'
            misconception: MC-8-inertia-only-mass
          - value: 0.54
            feedback: 'הצבתם את $R$ בסנטימטרים, $3.0$. הציבו $R = 0.030\,\text{m}$.'
        hints:
          - 'סכמו טבעות דקות, עם צפיפות משטחית $\sigma = M/(\pi R^2)$: $I = \int_0^R r^2\,\sigma\,2\pi r\,dr$.'

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-8.3-1, OBJ-8.4-1]
        prompt: >-
          מצאו את תאוצת מרכז היו-יו ואת המתיחות בחוט, קודם כביטויים ואחר כך כמספרים. בדקו את התוצאה בשני גבולות:
          יו-יו בלי מומנט התמד, ויו-יו שהוא טבעת.
        hints:
          - 'תנאי "החוט לא מחליק" הוא תנאי גלגול: הנקודה של השפה שבה החוט עוזב נמצאת במנוחה רגעית.'
        solution:
          - { kind: law, text: 'החוק השני למרכז המסה, עם ציר כלפי מטה: $Mg - T = Ma$. משוואת המומנט סביב מרכז המסה, חיובי בכיוון שבו היו-יו מסתובב כשהוא יורד: $TR = I\alpha$. ותנאי הגלגול על החוט: $a = \alpha R$.' }
          - { kind: manipulation, text: 'מהמשוואה השנייה ומהתנאי, $T = \dfrac{I}{R^2}a$. הצבה בראשונה: $Mg = \left(M + \dfrac{I}{R^2}\right)a$, ולכן $$a = \frac{g}{1 + I/(MR^2)},\qquad T = \frac{Mg}{1 + MR^2/I}$$ לדסקה, $I/(MR^2) = \tfrac12$: $a = \tfrac23g$ ו-$T = \tfrac13Mg$.' }
          - { kind: limit, text: 'כש-$I \to 0$: $a \to g$ ו-$T \to 0$, נפילה חופשית, כי אין מה לסובב. לטבעת, $I = MR^2$: $a = \tfrac12g$ ו-$T = \tfrac12Mg$. ככל שהמסה רחוקה יותר מהציר, היו-יו נופל לאט יותר והחוט מתוח יותר. ובכל מקרה $T < Mg$, כמו שצריך לגוף שמאיץ כלפי מטה.' }
          - { kind: units, text: '$a$ הוא $g$ כפול מספר חסר ממדים, ולכן ב-$\text{m/s}^2$, ו-$T$ הוא $Mg$ כפול מספר, ולכן בניוטון.' }
          - { kind: substitution, text: '$a = \tfrac23\cdot9.8 = 6.53\,\text{m/s}^2$, ו-$T = \tfrac13\cdot0.12\cdot9.8 = 0.392\,\text{N}$.' }
          - { kind: result, text: '$a = \dfrac{g}{1 + I/(MR^2)} = \tfrac23g = 6.53\,\text{m/s}^2$ כלפי מטה, ו-$T = \tfrac13Mg = 0.392\,\text{N}$.' }
        rubric:
          - text: כתבתי את החוק השני למרכז ואת משוואת המומנט סביב מרכז המסה, עם אותה מתיחות בשתיהן.
          - text: כתבתי את תנאי הגלגול על החוט, $a = \alpha R$, והשתמשתי בו כדי לסלק את $\alpha$.
          - text: קיבלתי $a = \tfrac23g$ ו-$T = \tfrac13Mg$, ובדקתי ש-$I \to 0$ נותן נפילה חופשית ושטבעת נותנת $g/2$.
          - text: הצבתי וקיבלתי $6.53\,\text{m/s}^2$ ו-$0.392\,\text{N}$, עם יחידות.

      - label: ג
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-8.3-2]
        prompt: >-
          מה מהירות מרכז היו-יו אחרי שהוא ירד $0.80\,\text{m}$? פתרו בעזרת שימור אנרגיה.
        answer: 3.23
        unit: m/s
        correctFeedback: >-
          נכון. החוט מושך בנקודה שנמצאת במנוחה רגעית, ולכן הוא לא עושה עבודה, והאנרגיה המכנית נשמרת:
          $Mgh = \tfrac12Mv^2 + \tfrac12\cdot\tfrac12MR^2\left(\dfrac vR\right)^2 = \tfrac34Mv^2$, ולכן
          $v = \sqrt{\tfrac43gh} = \sqrt{\tfrac43\cdot9.8\cdot0.80} = 3.23\,\text{m/s}$. שליש מהאנרגיה הולך לסיבוב. אותה
          תוצאה מ-$v = \sqrt{2ah}$ עם $a = \tfrac23g$.
        wrongFeedback: 'כתבו שימור אנרגיה עם אנרגיה קינטית של תנועת המרכז ושל הסיבוב, והציבו $\omega = v/R$.'
        commonWrong:

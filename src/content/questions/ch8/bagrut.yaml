          של מדרגה נמוכה מאוד, $h \ll R$, בהשוואה לגליל שמתגלגל לגובה $h$ במדרון, בלי פגיעה. אחר כך הציבו
          $R = 0.20\,\text{m}$ ו-$h = 0.050\,\text{m}$.
        hints:
          - 'אחרי הפגיעה, האם יש כוח שעושה עבודה מלבד הכובד? השפה מחזיקה נקודה של הגליל שנמצאת במנוחה.'
          - 'אל תכתבו שימור אנרגיה מלפני הפגיעה: בפגיעה אנרגיה אובדת (חלק ג).'
        solution:
          - { kind: law, text: 'התהליך בשני שלבים (שיעור 4.4). בפגיעה נשמר התנע הזוויתי סביב $E$ (חלק ב). אחריה הגליל מסתובב סביב $E$: הכוח של השפה פועל בנקודה שנמצאת במנוחה ולכן לא עושה עבודה, והאנרגיה המכנית נשמרת.' }
          - { kind: manipulation, text: 'ציר אנכי כלפי מעלה, מהרצפה. מרכז הגליל עולה מגובה $R$ לגובה $R + h$, הגובה שלו כשהוא בדיוק מעל $E$, ומשם הוא עובר אל המדרגה. הוא עובר את הנקודה הזו אם $\tfrac12I_E\Omega^2 \ge Mgh$, כלומר $\tfrac34MR^2\Omega^2 \ge Mgh$, או $\Omega \ge \dfrac{2}{R}\sqrt{\dfrac{gh}{3}}$. הצבה של $\Omega$ מחלק ב: $$v_{\min} = \sqrt{\frac{4gh}{3}}\;\frac{1}{1 - \dfrac{2h}{3R}} = \frac{2R\sqrt{3gh}}{3R - 2h}$$' }
          - { kind: manipulation, text: 'בדיקת ההנחה של השאלה (לא בדיקת גבולות) שהגליל נשאר צמוד לשפה: מיד אחרי הפגיעה הקו מ-$E$ אל מרכז הגליל יוצר עם האנך זווית $\varphi_0$ (באיור), עם $\cos\varphi_0 = \dfrac{R - h}{R}$, ומרכז הגליל נע במעגל ברדיוס $R$ סביב $E$. לכך צריך כוח צנטריפטלי $M\Omega^2R$ לכיוון $E$. הכובד נותן בכיוון הזה $Mg\cos\varphi_0$, והשפה יכולה רק לדחוף, לא למשוך. לכן צריך $\Omega^2R \le g\cos\varphi_0$, ובהמשך העלייה התנאי רק נעשה קל יותר: $\Omega$ קטנה ו-$\varphi$ קטנה. ב-$v_{\min}$, $\Omega^2 = \dfrac{4gh}{3R^2}$, והתנאי הוא $h \le \tfrac37R$.' }
          - { kind: limit, text: 'במדרגה נמוכה גם $v_{\min}$ וגם $\sqrt{4gh/3}$ שואפים לאפס, ולכן משווים את היחס ביניהם: $\dfrac{v_{\min}}{\sqrt{4gh/3}} = \dfrac{1}{1 - 2h/(3R)} \to 1$ כש-$h \ll R$. ו-$\sqrt{4gh/3}$ היא בדיוק המהירות שבה גליל מתגלגל עולה לגובה $h$ במדרון, בלי פגיעה, מ-$\tfrac34Mv^2 = Mgh$: במדרגה נמוכה האנרגיה שאובדת בפגיעה זניחה (חלק ג). ככל ש-$h$ גדל היחס גדל מעל 1 (ב-$h = R$ הוא 3): הפגיעה גוזלת אנרגיה, וצריך להגיע מהר יותר.' }
          - { kind: units, text: '$\sqrt{gh}$ ביחידות $\sqrt{\text{m/s}^2\cdot\text{m}} = \text{m/s}$, והגורם $\dfrac{R}{3R - 2h}$ חסר ממדים.' }
          - { kind: substitution, text: '$v_{\min} = \dfrac{2\cdot0.20\sqrt{3\cdot9.8\cdot0.050}}{3\cdot0.20 - 2\cdot0.050} = 0.970\,\text{m/s}$, לעומת $\sqrt{4gh/3} = 0.808\,\text{m/s}$ בלי הפגיעה. כאן $h/R = 0.25$, פחות מ-$\tfrac37$, ולכן הגליל אכן נשאר צמוד לשפה. בפגיעה אובד $f = 0.306$ מהאנרגיה.' }
          - { kind: result, text: '$v_{\min} = \dfrac{2R\sqrt{3gh}}{3R - 2h} = 0.970\,\text{m/s}$. במדרגה נמוכה היחס שלה ל-$\sqrt{4gh/3}$, המהירות של עלייה לגובה $h$ בלי פגיעה, שואף ל-1.' }
        rubric:

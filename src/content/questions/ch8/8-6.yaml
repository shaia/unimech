chapter: 8
questions:
  # ---------------------------------------------------------------- OBJ-8.6-1 L conserved while I changes
  - id: Q-8.6-skater-omega
    type: numeric
    objectives: [OBJ-8.6-1]
    level: basic
    prompt: >-
      מחליקה על קרח מסתובבת סביב עצמה במהירות זוויתית $3.0\,\text{rad/s}$, כשזרועותיה פרושות ומומנט ההתמד שלה
      $4.0\,\text{kg}\cdot\text{m}^2$. היא מקרבת את זרועותיה לגוף, ומומנט ההתמד שלה יורד ל-$1.6\,\text{kg}\cdot\text{m}^2$.
      מה מהירותה הזוויתית עכשיו? הזניחו את החיכוך עם הקרח.
    answer: 7.5
    unit: rad/s
    correctFeedback: >-
      נכון. הקרח החלק לא מפעיל מומנט סביב הציר האנכי, ולכן $L = I\omega$ נשמר:
      $\omega_2 = \dfrac{I_1}{I_2}\omega_1 = \dfrac{4.0}{1.6}\cdot3.0 = 7.5\,\text{rad/s}$.
    wrongFeedback: 'אין מומנט חיצוני סביב הציר האנכי. איזה גודל נשמר, ואיך הוא תלוי ב-$I$ וב-$\omega$?'
    commonWrong:
      - value: 1.2
        feedback: 'הפכתם את היחס. כש-$I$ קטן, $\omega$ חייבת לגדול כדי ש-$I\omega$ יישאר קבוע.'
      - value: 4.74
        feedback: 'זה $3.0\sqrt{4.0/1.6}$, משימור אנרגיה. האנרגיה לא נשמרת כאן: המחליקה עושה עבודה כשהיא מושכת את זרועותיה פנימה. נשמר התנע הזוויתי.'
        misconception: MC-8-skater-energy-conserved
    hints:
      - '$I_1\omega_1 = I_2\omega_2$.'

  - id: Q-8.6-skater-energy
    type: twotier
    objectives: [OBJ-8.6-1]
    qualitative: true
    level: mid
    prompt: >-
      מחליקה על קרח מסתובבת סביב עצמה, ומקרבת את זרועותיה לגוף. מומנט ההתמד שלה יורד מ-$4.0$
      ל-$1.6\,\text{kg}\cdot\text{m}^2$, והקרח החלק לא מפעיל עליה מומנט סביב הציר האנכי. מה קרה לאנרגיה הקינטית שלה?
    choices:
      - text: 'היא גדלה פי 2.5.'
        correct: true
        feedback: 'נכון. $K = \dfrac{L^2}{2I}$, ועם $L$ קבוע, $K$ גדלה ביחס $\dfrac{I_1}{I_2} = 2.5$.'
      - text: 'היא לא השתנתה, כי אין מומנט חיצוני.'
        feedback: 'היעדר מומנט חיצוני שומר על **התנע הזוויתי**, לא על האנרגיה. אנרגיה משתנה כשנעשית עבודה, גם עבודה של כוחות פנימיים.'
        misconception: MC-8-skater-energy-conserved
      - text: 'היא קטנה פי 2.5.'
        feedback: 'אם $L$ קבוע ו-$I$ קטן, $K = L^2/(2I)$ גדלה. וגם בלי נוסחה: היא מסתובבת מהר יותר בהרבה.'
    reasons:
      - text: 'השרירים שלה עשו עבודה חיובית: הם משכו את הידיים פנימה, נגד הנטייה שלהן להמשיך בקו ישר החוצה.'
        correct: true
        feedback: >-
          זה הנימוק. ידיים שנעות במעגל צריכות כוח פנימה, וכשהן גם מתקרבות לציר, הכוח הזה פועל לאורך ההעתק ועושה
          עבודה. העבודה הזו היא בדיוק תוספת האנרגיה.
      - text: 'גם תנע זוויתי וגם אנרגיה נשמרים כשאין מומנט חיצוני.'
        feedback: 'תנע זוויתי נשמר. אנרגיה קינטית נשמרת רק כשלא נעשית עבודה, וכאן כוחות פנימיים עושים עבודה.'
        misconception: MC-8-skater-energy-conserved
      - text: 'הקרח עשה עליה עבודה.'
        feedback: 'הקרח חלק: הוא מפעיל רק כוח אנכי, והמחליקה לא זזה אנכית. מקור האנרגיה פנימי.'
    hints:
      - 'כתבו את $K$ בעזרת $L$ ו-$I$.'

  - id: Q-8.6-merry-go-round
    type: numeric
    objectives: [OBJ-8.6-1]
    level: mid
    prompt: >-
      קרוסלה היא דסקה אחידה במסה $100\,\text{kg}$ וברדיוס $2.0\,\text{m}$, שמסתובבת בלי חיכוך סביב ציר אנכי
      במהירות זוויתית $1.2\,\text{rad/s}$. ילד במסה $25\,\text{kg}$ עומד בשפתה, והולך אל המרכז. מה המהירות הזוויתית
      של הקרוסלה כשהוא מגיע למרכז? התייחסו לילד כמסה נקודתית.
    answer: 1.8
    unit: rad/s
    correctFeedback: >-
      נכון. בהתחלה $I_1 = \tfrac12\cdot100\cdot2.0^2 + 25\cdot2.0^2 = 200 + 100 = 300\,\text{kg}\cdot\text{m}^2$, ובמרכז
      הילד לא תורם: $I_2 = 200\,\text{kg}\cdot\text{m}^2$. $\omega_2 = \dfrac{300}{200}\cdot1.2 = 1.8\,\text{rad/s}$. האנרגיה
      הקינטית עולה מ-$216$ ל-$324\,\text{J}$, ואת ההפרש נותנות רגלי הילד.
    wrongFeedback: 'מומנט ההתמד של המערכת הוא של הדסקה ועוד $mr^2$ של הילד. מה הוא בשפה ומה במרכז?'
    commonWrong:
      - value: 1.5
        feedback: 'השתמשתם ב-$I = MR^2$ לקרוסלה. היא דסקה אחידה, $I = \tfrac12MR^2 = 200\,\text{kg}\cdot\text{m}^2$.'
        misconception: MC-8-inertia-only-mass
      - value: 0.8
        feedback: 'הפכתם את היחס. כשהילד מתקרב לציר, מומנט ההתמד קטן, ולכן המהירות הזוויתית גדלה.'
    hints:
      - 'כמה תורם הילד למומנט ההתמד כשהוא עומד על הציר?'

  - id: Q-8.6-stool-flip
    type: numeric
    objectives: [OBJ-8.6-1]
    level: bagrut
    prompt: >-
      סטודנטית יושבת במנוחה על כיסא שמסתובב בלי חיכוך סביב ציר אנכי. בידיה גלגל אופניים שמסתובב סביב ציר אנכי,
      עם תנע זוויתי $4.0\,\text{kg}\cdot\text{m}^2/\text{s}$ כלפי מעלה. היא הופכת את הגלגל, כך שהוא מסתובב באותה
      מהירות (ביחס לידיים שלה) אבל עם התנע הזוויתי כלפי מטה. כשהסטודנטית, הכיסא והגלגל מסתובבים יחד סביב ציר
      הכיסא כגוף אחד, מומנט ההתמד שלהם סביב הציר הזה הוא $4.0\,\text{kg}\cdot\text{m}^2$; התנע הזוויתי של הסיבוב של
      הגלגל סביב הציר שלו נוסף על זה. באיזו מהירות זוויתית מסתובב הכיסא אחרי ההיפוך?
    answer: 2.0
    unit: rad/s
    correctFeedback: >-
      נכון. אין מומנט חיצוני סביב הציר האנכי, ולכן התנע הזוויתי הכולל, $4.0$ כלפי מעלה, נשמר. אחרי ההיפוך הגלגל
      תורם $-4.0$, ולכן הכיסא צריך לשאת $+8.0$: $\omega = \dfrac{2L_w}{I} = \dfrac{8.0}{4.0} = 2.0\,\text{rad/s}$, באותו
      כיוון שבו הגלגל הסתובב בהתחלה. מה שמסובב את הכיסא הוא המומנט שהגלגל מפעיל על הידיים בזמן ההיפוך: כוח פנימי של המערכת.
    wrongFeedback: 'כתבו את התנע הזוויתי הכולל לפני ואחרי, עם סימנים: הגלגל עבר מ-$+L_w$ ל-$-L_w$.'
    commonWrong:
      - value: 1.0
        feedback: 'זה $L_w/I$. השינוי בתנע הזוויתי של הגלגל הוא מ-$+L_w$ ל-$-L_w$, כלומר $2L_w$, והכיסא מקבל את כולו.'
    hints:
      - 'התנע הזוויתי של המערכת כולה לפני ההיפוך שווה לזה שאחריו.'

  # ---------------------------------------------------------------- OBJ-8.6-2 particle hits a rigid body, pivot vs free
  - id: Q-8.6-pivot-conserved
    type: mc
    objectives: [OBJ-8.6-2]
    qualitative: true
    level: basic
    prompt: >-
      מוט תלוי אנכית מציר קבוע בקצהו העליון. כדור פלסטלינה פוגע בו אופקית ונדבק לקצה התחתון. מה נשמר בזמן
      ההתנגשות הקצרה, למערכת מוט + כדור?
    choices:
      - text: 'רק התנע הזוויתי סביב הציר.'
        correct: true
        feedback: >-
          נכון. בזמן ההתנגשות הציר מפעיל על המוט כוח גדול ולא ידוע, ולכן התנע הקווי משתנה. אבל הכוח הזה פועל
          **בציר**, והמומנט שלו סביבו אפס. גם הכובד לא מספיק לפעול בזמן הקצר, ולכן התנע הזוויתי סביב הציר נשמר.
      - text: 'גם התנע הקווי וגם התנע הזוויתי סביב הציר.'
        feedback: 'התנע הקווי היה נשמר אילו לא היו כוחות חיצוניים. הציר מחזיק את קצה המוט במקום, ולכן הוא מפעיל מתקף בזמן הפגיעה.'
        misconception: MC-8-momentum-conserved-with-pivot
      - text: 'רק התנע הקווי, כי ההתנגשות קצרה.'
        feedback: 'ההתנגשות קצרה, אבל גם המתקף של הציר מתרחש בזמן הקצר הזה, והוא לא זניח. מה שהציר לא יכול לשנות הוא התנע הזוויתי סביבו.'
        misconception: MC-8-momentum-conserved-with-pivot
      - text: 'האנרגיה הקינטית.'
        feedback: 'הכדור נדבק: זו התנגשות פלסטית, ואנרגיה קינטית הופכת לחום ולעיוות.'
    hints:
      - 'איזה כוח חיצוני פועל בזמן ההתנגשות, ואיפה?'

  - id: Q-8.6-pivoted-rod
    type: numeric
    objectives: [OBJ-8.6-2]
    level: mid
    prompt: >-
      מוט אחיד במסה $2.0\,\text{kg}$ ובאורך $1.0\,\text{m}$ תלוי במנוחה מציר קבוע בקצהו העליון. כדור פלסטלינה
      במסה $0.20\,\text{kg}$ פוגע בקצה התחתון במהירות אופקית $10\,\text{m/s}$ ונדבק אליו. מה המהירות הזוויתית של
      המוט מיד אחרי הפגיעה?
    answer: 2.31
    unit: rad/s
    correctFeedback: >-
      נכון. תנע זוויתי סביב הציר: לפני, $mvL = 0.20\cdot10\cdot1.0 = 2.0\,\text{kg}\cdot\text{m}^2/\text{s}$. אחרי,
      $\left(\tfrac13ML^2 + mL^2\right)\omega = (0.667 + 0.20)\,\omega$. לכן $\omega = \dfrac{2.0}{0.867} = 2.31\,\text{rad/s}$.
    wrongFeedback: 'השוו את התנע הזוויתי של הכדור סביב הציר, $mvL$, לתנע הזוויתי של מוט + כדור אחרי הפגיעה.'
    commonWrong:
      - value: 3.0
        feedback: 'שכחתם את הכדור במומנט ההתמד שאחרי הפגיעה. הוא נדבק בקצה, ותורם $mL^2 = 0.20\,\text{kg}\cdot\text{m}^2$.'
      - value: 5.45
        feedback: 'השתמשתם ב-$\tfrac{1}{12}ML^2$, סביב מרכז המוט. המוט מסתובב סביב הציר בקצה, שם $I = \tfrac13ML^2$.'
        misconception: MC-8-inertia-only-mass
      - value: 1.67
        feedback: >-
          השתמשתם בשימור תנע קווי, $mv = M\dfrac{\omega L}{2} + m\omega L$. הציר מפעיל מתקף בזמן הפגיעה, ולכן התנע
          הקווי לא נשמר. סביב הציר, המתקף הזה לא יוצר מומנט.
        misconception: MC-8-momentum-conserved-with-pivot
    hints:
      - 'סביב איזו נקודה הכוח של הציר לא יוצר מומנט?'

  - id: Q-8.6-free-rod-spin
    type: numeric
    objectives: [OBJ-8.6-2]
    level: mid
    prompt: >-
      מוט אחיד במסה $1.2\,\text{kg}$ ובאורך $0.80\,\text{m}$ מונח חופשי על קרח חלק. דסקית פוגעת בו בניצב למוט, במרחק
      $0.25\,\text{m}$ ממרכזו, וניתזת. המתקף שהדסקית נותנת למוט בפגיעה הוא $0.60\,\text{N}\cdot\text{s}$. מה המהירות
      הזוויתית של המוט מיד אחרי הפגיעה?
    answer: 2.34
    unit: rad/s
    correctFeedback: >-
      נכון. בלי ציר, המוט מקבל את המתקף $J$ כולו: הוא משנה את התנע שלו, $Mv_c = J$, והמומנט שלו סביב מרכז המוט משנה
      את התנע הזוויתי סביב המרכז, $I_{cm}\omega = Jb$. עם $I_{cm} = \tfrac{1}{12}ML^2 = \tfrac{1}{12}\cdot1.2\cdot0.80^2 = 0.0640\,\text{kg}\cdot\text{m}^2$:
      $\omega = \dfrac{0.60\cdot0.25}{0.0640} = 2.34\,\text{rad/s}$. מרכז המוט נע ב-$v_c = J/M = 0.500\,\text{m/s}$.
    wrongFeedback: 'במוט חופשי משתמשים במומנט ההתמד סביב מרכז המוט, ובזרוע של המתקף סביב המרכז.'
    commonWrong:
      - value: 0.586
        feedback: 'השתמשתם ב-$\tfrac13ML^2$, מומנט ההתמד סביב הקצה. המוט חופשי, ואין ציר בקצה: הסיבוב הוא סביב מרכז המוט.'
        misconception: MC-8-free-rod-pivots-at-end
      - value: 3.75
        feedback: 'השתמשתם בזרוע $\tfrac L2$, כאילו הפגיעה בקצה. הדסקית פוגעת $0.25\,\text{m}$ מהמרכז.'
      - value: 2.0
        feedback: 'זה $v_c/b$: הנחתם שמרכז המוט מסתובב סביב נקודת הפגיעה. את $\omega$ קובע המומנט של המתקף סביב המרכז, $I_{cm}\omega = Jb$.'
    hints:
      - 'מה המומנט של המתקף $J$ סביב מרכז המוט, ומה מומנט ההתמד סביבו?'

  - id: Q-8.6-free-rod-ice
    type: numeric
    objectives: [OBJ-8.6-2]
    level: bagrut
    prompt: >-
      מוט אחיד במסה $2.0\,\text{kg}$ ובאורך $1.0\,\text{m}$ מונח **חופשי** על קרח חלק. דסקית במסה $0.20\,\text{kg}$
      מחליקה על הקרח במהירות $10\,\text{m/s}$ בניצב למוט, פוגעת בקצה אחד שלו ונדבקת. מה מהירות הקצה **השני** של
      המוט מיד אחרי הפגיעה? הכיוון שבו נעה הדסקית חיובי.
    answer: -1.43
    unit: m/s
    correctFeedback: >-
      נכון. בלי ציר, גם התנע נשמר וגם התנע הזוויתי סביב כל נקודה קבועה. מרכז המסה של מוט + דסקית נע
      ב-$v_{cm} = \dfrac{0.20\cdot10}{2.2} = 0.909\,\text{m/s}$, והוא נמצא $d = \dfrac{0.20\cdot0.50}{2.2} = 0.0455\,\text{m}$
      ממרכז המוט לכיוון הדסקית. סביב הנקודה הקבועה שבה הוא נמצא ברגע הפגיעה, התנע הזוויתי לפני הוא
      $mv\left(\tfrac L2 - d\right) = 0.909\,\text{kg}\cdot\text{m}^2/\text{s}$, ואחרי $I\omega$ עם
      $I = \tfrac{1}{12}ML^2 + Md^2 + m\left(\tfrac L2 - d\right)^2 = 0.212\,\text{kg}\cdot\text{m}^2$, ולכן
      $\omega = 4.29\,\text{rad/s}$. הקצה השני נמצא $\tfrac L2 + d = 0.545\,\text{m}$ ממרכז המסה, בצד שמול הדסקית, ושם
      הסיבוב פועל נגד $v_{cm}$: $0.909 - 4.29\cdot0.545 = -1.43\,\text{m/s}$. הקצה השני נע **אחורה**. **בדיקת גבולות:**
      כש-$m \ll M$, $\omega \to \dfrac{6mv}{ML}$ ומהירות הקצה השני שואפת ל-$\dfrac{mv}{M} - \dfrac{6mv}{ML}\cdot\dfrac L2 = -\dfrac{2mv}{M}$.
      **דרך שקולה, זו של השיעור:** סביב $O$, הנקודה שבה מרכז המוט נמצא ברגע הפגיעה, עם המסה המצומצמת
      $\mu = \dfrac{mM}{m + M} = 0.182\,\text{kg}$ ו-$b = \tfrac L2$: $\omega = \dfrac{\mu vb}{I_{cm} + \mu b^2} = 4.29\,\text{rad/s}$,
      מרכז המוט נע ב-$v_c = \dfrac{m(v - \omega b)}{m + M} = 0.714\,\text{m/s}$, והקצה השני ב-$v_c - \omega\tfrac L2 = -1.43\,\text{m/s}$.
      שתי הדרכים נותנות אותה תשובה.
    wrongFeedback: 'שלושה שלבים: מרכז המסה של מוט + דסקית ומהירותו; תנע זוויתי סביבו לפני ואחרי, שנותן את $\omega$; ומהירות הקצה, $v_{cm}$ ועוד מהירות הסיבוב שלו סביב מרכז המסה.'

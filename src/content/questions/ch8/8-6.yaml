  - id: Q-8.6-struck-ring-far-side
    type: twotier
    objectives: [OBJ-8.6-2]
    qualitative: true
    level: bagrut
    prompt: >-
      טבעת דקה ואחידה במסה $M$ וברדיוס $R$ מונחת חופשית על קרח חלק. דסקית פוגעת בנקודה על השפה שלה ונותנת לה מכה
      קצרה, מתקף $J$ בכיוון המשיק לטבעת בנקודה הזו. מה עושה הנקודה של הטבעת שנמצאת מול נקודת הפגיעה, בקצה השני של
      הקוטר, מיד אחרי המכה?
    choices:
      - text: 'היא במנוחה רגעית.'
        correct: true
        feedback: >-
          נכון. מרכז הטבעת נע קדימה ב-$J/M$, והסיבוב סביב המרכז נותן לנקודה שמול הפגיעה בדיוק $J/M$ אחורה. ברגע הזה
          הטבעת מסתובבת סביב הנקודה הזו. במוט חופשי שנפגע בקצה, לעומת זאת, הקצה השני נע אחורה: התשובה תלויה באיך
          המסה מפוזרת, דרך $I_{cm}$.
      - text: 'היא נעה אחורה, נגד כיוון המכה, במהירות $J/M$.'
        feedback: >-
          זה היה נכון לדסקה אחידה, עם $I_{cm} = \tfrac12MR^2$, שמסתובבת מהר פי 2. בטבעת דקה כל המסה במרחק $R$ מהמרכז,
          $I_{cm} = MR^2$. וגם לא כל "צד רחוק" נע אחורה, כמו בקצה של מוט חופשי: זה תלוי ב-$I_{cm}$.
      - text: 'היא נעה קדימה במהירות $J/M$, כמו מרכז הטבעת.'
        feedback: 'במהירות $J/M$ נע רק המרכז. הטבעת גם מסתובבת, ובנקודה שמול הפגיעה מהירות הסיבוב פונה אחורה.'
        misconception: MC-8-all-points-move-with-cm
      - text: 'היא נעה קדימה במהירות $2J/M$.'
        feedback: 'זו המהירות של נקודת **הפגיעה**, $J/M + \omega R$. בנקודה שמולה מהירות הסיבוב פונה לכיוון ההפוך, ומחסירים אותה.'
    reasons:
      - text: '$v_{cm} = \dfrac JM$, ו-$\omega = \dfrac{JR}{MR^2} = \dfrac{J}{MR}$ סביב המרכז. בנקודה שמול הפגיעה מהירות הסיבוב היא $\omega R = \dfrac JM$, ופונה נגד $v_{cm}$.'
        correct: true
        feedback: 'זה הנימוק: המתקף קובע את התנע, המומנט שלו סביב המרכז קובע את התנע הזוויתי סביב המרכז, ושניהם יחד נותנים את המהירות של כל נקודה.'
      - text: 'על הנקודה שמול הפגיעה לא פעל שום כוח, ולכן היא לא זזה.'
        feedback: >-
          התוצאה נכונה כאן, אבל הנימוק לא. בגוף צפיד כוחות פנימיים מעבירים את המכה לכל נקודה בו מיד. בקצה של מוט חופשי
          שנפגע גם לא פעל שום כוח חיצוני, והוא נע אחורה במהירות $2J/M$.
        misconception: MC-8-free-rod-pivots-at-end
      - text: 'הצד הרחוק של גוף חופשי שנפגע תמיד נע אחורה, כמו הקצה השני של מוט.'
        feedback: 'זה תלוי ב-$I_{cm}$: ככל שהמסה רחוקה יותר מהמרכז, הסיבוב איטי יותר. בטבעת דקה מהירות הסיבוב בצד הרחוק שווה בדיוק למהירות המרכז.'
    hints:
      - 'מצאו את $v_{cm}$ מהמתקף, ואת $\omega$ מהמומנט של המתקף סביב המרכז, $JR$. מה מומנט ההתמד של טבעת דקה סביב מרכזה?'

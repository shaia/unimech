        misconception: MC-8-all-points-move-with-cm
      - value: -2.0
        feedback: 'זה $-2mv/M$, הגבול של דסקית קלה מאוד. כאן $m/M = 0.1$: הדסקית שנדבקה מוסיפה למומנט ההתמד ומזיזה את מרכז המסה.'

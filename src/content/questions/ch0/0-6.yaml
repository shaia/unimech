chapter: 0
questions:
  # ---------------------------------------------------------------- OBJ-0.6-1 Cartesian and polar forms, Euler's formula
  - id: Q-0.6-phase-arg
    type: numeric
    objectives: [OBJ-0.6-1]
    level: basic
    prompt: >-
      תנודה מתוארת כ-$x(t) = \operatorname{Re}\left(\tilde A e^{i\omega t}\right)$, עם האמפליטודה המרוכבת
      $\tilde A = \left(-1 + i\sqrt3\right)\,\text{cm}$. כתבו את $\tilde A$ בהצגה קוטבית, $|\tilde A|e^{i\varphi}$. מה
      הפאזה $\varphi$, ברדיאנים, בתחום $-\pi < \varphi \le \pi$?
    answer: 2.09
    unit: rad
    correctFeedback: >-
      נכון. $|\tilde A| = \sqrt{1 + 3} = 2\,\text{cm}$, והנקודה $(-1, \sqrt3)$ ברביע השני, ולכן $\varphi = \pi - \dfrac{\pi}{3} = \dfrac{2\pi}{3} = 2.09$.
      התנודה היא $x(t) = 2\cos\left(\omega t + \dfrac{2\pi}{3}\right)\,\text{cm}$.
    wrongFeedback: 'סמנו את הנקודה $(-1, \sqrt3)$ במישור המרוכב. באיזה רביע היא? הזווית נמדדת מהציר הממשי החיובי.'
    commonWrong:
      - value: -1.05
        feedback: >-
          זה $\arctan(\sqrt3/(-1)) = -\pi/3$, נקודה ברביע הרביעי. $\arctan$ לא מבחין בין $(-1, \sqrt3)$ ל-$(1, -\sqrt3)$:
          צריך להסתכל על הסימנים של שני הרכיבים. כאן החלק הממשי שלילי והמדומה חיובי, רביע שני, ולכן מוסיפים $\pi$
          (ברביע השלישי, שבו גם המדומה שלילי, מחסירים $\pi$).
        misconception: MC-0-arg-arctan-quadrant
      - value: 1.05
        feedback: 'זו הזווית של $1 + i\sqrt3$, ברביע הראשון. כאן החלק הממשי שלילי, והנקודה ברביע השני.'
        misconception: MC-0-arg-arctan-quadrant
      - value: 2
        feedback: 'זה הגודל $|\tilde A|$, בסנטימטרים. הפאזה היא הזווית, ברדיאנים.'
    hints:
      - '$\cos\varphi = -\tfrac12$ ו-$\sin\varphi = +\tfrac{\sqrt3}{2}$. איזו זווית מקיימת את שניהם?'

  - id: Q-0.6-euler-point
    type: vector
    objectives: [OBJ-0.6-1]
    qualitative: true
    level: basic
    prompt: >-
      במישור המרוכב הציר הממשי פונה ימינה והציר המדומה למעלה. לאיזה כיוון מהראשית נמצא המספר $e^{3\pi i/4}$?
    answer: nw
    correctFeedback: >-
      נכון. לפי נוסחת אוילר, $e^{i\theta} = \cos\theta + i\sin\theta$: נקודה על מעגל היחידה בזווית $\theta$ מהציר
      הממשי. $e^{3\pi i/4} = \dfrac{-1 + i}{\sqrt2}$, ב-$135^\circ$: למעלה ושמאלה.
    wrong:
      - dir: ne
        feedback: 'זה $e^{i\pi/4}$, בזווית $45^\circ$. כאן הזווית $3\pi/4 = 135^\circ$, ברביע השני.'
      - dir: n
        feedback: 'זה $e^{i\pi/2} = i$, בזווית $90^\circ$. הזווית כאן גדולה יותר, $135^\circ$.'
      - dir: sw
        feedback: 'זה $-e^{3\pi i/4}$, ב-$315^\circ$. בדקו את הסימן של $\sin(3\pi/4)$: הוא חיובי.'
    wrongFeedback: 'חשבו $\cos(3\pi/4)$ ו-$\sin(3\pi/4)$: הם החלק הממשי והחלק המדומה.'

  - id: Q-0.6-driven-amplitude
    type: numeric
    objectives: [OBJ-0.6-1, OBJ-0.6-2]
    level: bagrut
    prompt: >-
      גוף על קפיץ, שכוח מחזורי דוחף אותו וגרר $(-b\dot x)$ מאט אותו, מקיים $m\ddot x + b\dot x + kx = F_0\cos\omega t$, עם $m = 1.0\,\text{kg}$, $k = 100\,\text{N/m}$,
      $b = 2.0\,\text{kg/s}$, $F_0 = 10\,\text{N}$ ו-$\omega = 8.0\,\text{rad/s}$. כותבים $F_0\cos\omega t = \operatorname{Re}\left(F_0e^{i\omega t}\right)$
      ומחפשים פתרון יציב $x = \operatorname{Re}\left(\tilde Ae^{i\omega t}\right)$. ההצבה נותנת
      $$\tilde A = \frac{F_0}{k - m\omega^2 + ib\omega}$$
      מה האמפליטודה של התנודה, $|\tilde A|$?
    answer: 0.254
    unit: m
    correctFeedback: >-
      נכון. המכנה הוא $36 + 16i$ (ב-$\text{N/m}$), והגודל שלו $\sqrt{36^2 + 16^2} = 39.4$, ולכן
      $|\tilde A| = \dfrac{10}{39.4} = 0.254\,\text{m}$. הפאזה של $\tilde A$ היא $-\arctan\dfrac{16}{36} = -0.418\,\text{rad}$:
      ההעתק מפגר אחרי הכוח. **בדיקת גבולות:** כש-$\omega \to 0$, $\tilde A \to F_0/k = 0.1\,\text{m}$, המתיחה הסטטית
      של הקפיץ. בלי גרר, $b = 0$, המכנה ממשי ו-$|\tilde A| = F_0/|k - m\omega^2|$, שמתבדר ב-$\omega = \sqrt{k/m}$.
    wrongFeedback: 'הגודל של מנה הוא מנת הגדלים: $|\tilde A| = \dfrac{F_0}{|k - m\omega^2 + ib\omega|}$, ו-$|\alpha + i\beta| = \sqrt{\alpha^2 + \beta^2}$.'
    commonWrong:
      - value: 0.278
        feedback: 'זה $F_0/(k - m\omega^2)$, בלי החלק המדומה. הגרר מוסיף למכנה $ib\omega = 16i$, והגודל של המכנה גדל.'
      - value: 0.192
        feedback: 'חיברתם את החלק הממשי והמדומה, $36 + 16 = 52$. הגודל של מספר מרוכב $\alpha + i\beta$ הוא $\sqrt{\alpha^2 + \beta^2}$, כמו אורך של וקטור.'
        misconception: MC-0-magnitudes-add
      - value: 0.00644
        feedback: 'חילקתם ב-$|z|^2 = 1552$ במקום ב-$|z|$. הוציאו שורש.'
      - value: 0.0607
        feedback: 'שימו לב לסימן: $\ddot x$ של $e^{i\omega t}$ נותן $-\omega^2$, ולכן במכנה $k - m\omega^2$, ולא $k + m\omega^2$.'
    hints:
      - 'חשבו קודם את המכנה: $k - m\omega^2 = 100 - 64$, ו-$b\omega = 16$.'

  - id: Q-0.6-multiply-polar
    type: numeric
    objectives: [OBJ-0.6-1]
    level: mid
    prompt: >-
      כוח במישור $xy$ מיוצג במספר מרוכב: הרכיב $F_x$ הוא החלק הממשי והרכיב $F_y$ החלק המדומה. הכוח הוא
      $F = 6.0e^{i\cdot100^\circ}\,\text{N}$. מסובבים את הכוח ומגדילים אותו בבת אחת: כופלים אותו במספר
      $z = 2.0e^{i\cdot40^\circ}$. מה הרכיב $x$ של הכוח החדש, $\operatorname{Re}(Fz)$?
    answer: -9.19
    unit: N
    correctFeedback: >-
      נכון. במכפלה הגדלים מוכפלים והזוויות מתחברות: $Fz = 12e^{i\cdot140^\circ}\,\text{N}$, ולכן
      $\operatorname{Re}(Fz) = 12\cos140^\circ = -9.19\,\text{N}$ (והרכיב $y$ הוא $12\sin140^\circ = 7.71\,\text{N}$).
      הכוח החדש באורך $12\,\text{N}$, ברביע השני.
    wrongFeedback: 'כתבו את המכפלה בהצגה קוטבית: מה הגודל שלה ומה הזווית שלה? רק אחר כך חזרו לרכיבים.'
    commonWrong:
      - value: -1.60
        feedback: >-
          כפלתם את החלקים הממשיים, $6.0\cos100^\circ\cdot2.0\cos40^\circ$. החלק הממשי של מכפלה הוא
          $\operatorname{Re}F\operatorname{Re}z - \operatorname{Im}F\operatorname{Im}z$: גם החלקים המדומים תורמים.
        misconception: MC-0-re-of-product
      - value: -6.13
        feedback: 'חיברתם את הגדלים, $6.0 + 2.0$. בכפל הגדלים **מוכפלים**, והזוויות הן שמתחברות.'
      - value: 6.00
        feedback: 'החסרתם את הזוויות, $100^\circ - 40^\circ$. זה המנה $F/z$ (עם גודל $3.0$, לא $12$). בכפל הזוויות מתחברות.'
      - value: 12
        feedback: 'זה הגודל של הכוח החדש. הרכיב $x$ הוא הגודל כפול הקוסינוס של הזווית, $140^\circ$.'
    hints:
      - '$r_1e^{i\alpha}\cdot r_2e^{i\beta} = r_1r_2e^{i(\alpha + \beta)}$.'

  # ---------------------------------------------------------------- OBJ-0.6-2 oscillations as Re(A e^{iωt}), adding them
  - id: Q-0.6-read-oscillation
    type: mc
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: basic
    prompt: >-
      ההעתק של מסה הוא $x(t) = \operatorname{Re}\left(\tilde Ae^{i\omega t}\right)$, עם $\tilde A = 3i\,\text{cm}$. איזו פונקציה
      ממשית היא $x(t)$?
    choices:
      - text: $x(t) = -3\sin\omega t\,\text{cm}$
        correct: true
        feedback: >-
          נכון. $3i\left(\cos\omega t + i\sin\omega t\right) = 3i\cos\omega t - 3\sin\omega t$, והחלק הממשי הוא
          $-3\sin\omega t$. במילים אחרות, $i = e^{i\pi/2}$, ו-$3\cos\left(\omega t + \tfrac\pi2\right) = -3\sin\omega t$.
      - text: $x(t) = 3\cos\omega t\,\text{cm}$
        feedback: 'זה $\tilde A = 3$. הכפל ב-$i$ מסובב את האמפליטודה המרוכבת ב-$90^\circ$, ומזיז את הפאזה של התנודה ברבע מחזור.'
      - text: $x(t) = 3\sin\omega t\,\text{cm}$
        feedback: 'הסימן הפוך. $i\cdot i\sin\omega t = -\sin\omega t$: זה מה שנשאר בחלק הממשי.'
      - text: $x(t) = 3i\cos\omega t\,\text{cm}$
        feedback: 'זה לא מספר ממשי, והעתק של מסה הוא מספר ממשי. ה-$\operatorname{Re}$ לוקח רק את החלק הממשי של המכפלה.'
    hints:
      - 'כפלו את $3i$ ב-$\cos\omega t + i\sin\omega t$, וקחו רק את החלק הממשי.'

  - id: Q-0.6-add-quadrature
    type: numeric
    objectives: [OBJ-0.6-2]
    level: mid
    prompt: >-
      מסה מתנודדת בשתי תנודות באותה תדירות בבת אחת: $x_1 = 3\cos\omega t$ ו-$x_2 = 4\sin\omega t$ (בסנטימטרים). ההעתק הכולל
      $x_1 + x_2$ היא תנודה הרמונית אחת. מה האמפליטודה שלה?
    answer: 5
    unit: cm
    correctFeedback: >-
      נכון. $x_1 = \operatorname{Re}(3e^{i\omega t})$ ו-$x_2 = \operatorname{Re}(-4ie^{i\omega t})$, ולכן הסכום הוא
      $\operatorname{Re}\left((3 - 4i)e^{i\omega t}\right)$, עם אמפליטודה $|3 - 4i| = 5\,\text{cm}$. שתי התנודות מוזזות ברבע
      מחזור, ולכן הן לא מגיעות לשיא יחד.
    wrongFeedback: 'כתבו כל תנודה כ-$\operatorname{Re}(\tilde A_je^{i\omega t})$, חברו את האמפליטודות המרוכבות, וחשבו את הגודל של הסכום.'
    commonWrong:
      - value: 7
        feedback: 'חיברתם את האמפליטודות כמספרים. זה נכון רק כשהתנודות באותה פאזה. כאן $x_1$ בשיא כש-$x_2 = 0$.'
        misconception: MC-0-amplitudes-add
      - value: 1
        feedback: 'זה $4 - 3$, כאילו התנודות בפאזות הפוכות. ביניהן רבע מחזור, וזה מקרה ביניים: $\sqrt{3^2 + 4^2}$.'
    hints:
      - '$\sin\omega t = \operatorname{Re}\left(-ie^{i\omega t}\right)$.'

  - id: Q-0.6-velocity-lead
    type: mc
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: mid
    prompt: >-
      ההעתק של מתנד הוא $x(t) = \operatorname{Re}\left(\tilde Ae^{i\omega t}\right)$. גוזרים לפי הזמן:
      $v(t) = \operatorname{Re}\left(i\omega\tilde Ae^{i\omega t}\right)$. מה אומר הגורם $i\omega$ על המהירות לעומת ההעתק?
    choices:
      - text: האמפליטודה של המהירות $\omega|\tilde A|$, והמהירות **מקדימה** את ההעתק ברבע מחזור.
        correct: true
        feedback: >-
          נכון. $i\omega = \omega e^{i\pi/2}$: הכפל מגדיל את הגודל פי $\omega$ ומוסיף $\pi/2$ לפאזה. לכן המהירות
          מגיעה לשיא רבע מחזור לפני ההעתק, כשהמסה עוברת בשיווי המשקל.
      - text: המהירות וההעתק באותה פאזה, והמהירות גדולה פי $\omega$.
        feedback: >-
          אילו היו באותה פאזה, המהירות הייתה מרבית בקצה, כשההעתק מרבי. אבל בקצה המסה נעצרת ומסתובבת לאחור:
          המהירות שם אפס.
      - text: המהירות **מפגרת** אחרי ההעתק ברבע מחזור.
        feedback: 'הכפל ב-$i$ מוסיף $+\pi/2$ לפאזה. פאזה גדולה יותר פירושה שהשיא מגיע מוקדם יותר: $\cos(\omega t + \varphi)$ בשיא כש-$\omega t = -\varphi$. לכן המהירות מקדימה.'
      - text: 'המהירות מדומה, כי מופיע בה $i$, ולכן אין לה משמעות פיזיקלית.'
        feedback: 'המהירות היא החלק **הממשי** של $i\omega\tilde Ae^{i\omega t}$, וזה מספר ממשי לגמרי. ה-$i$ רק מזיז את הפאזה.'
        misconception: MC-0-i-means-unphysical
    hints:
      - 'כתבו את $i$ בהצגה קוטבית: גודל 1, וזווית?'

  - id: Q-0.6-product-trap
    type: twotier
    objectives: [OBJ-0.6-2]
    qualitative: true
    level: bagrut
    prompt: >-
      הכוח על מתנד הוא $F = \operatorname{Re}\left(\tilde Fe^{i\omega t}\right)$ והמהירות שלו $v = \operatorname{Re}\left(\tilde ve^{i\omega t}\right)$.
      ההספק הוא $P = Fv$. סטודנט מחשב $P = \operatorname{Re}\left(\tilde F\tilde ve^{2i\omega t}\right)$. האם זה נכון?
    choices:
      - text: לא. את החלק הממשי מותר לקחת בסוף בחיבור ובגזירה, אבל לא במכפלה.
        correct: true
        feedback: 'נכון. $\operatorname{Re}$ הוא פעולה ליניארית: הוא עובר דרך סכומים, דרך כפל בקבוע ממשי ודרך נגזרות, אבל לא דרך מכפלה של שני מספרים מרוכבים.'
      - text: כן. הייצוג המרוכב מדויק, ולכן מותר לחשב בו הכול ולקחת חלק ממשי בסוף.
        feedback: >-
          דוגמה נגדית: $z_1 = z_2 = i$. $\operatorname{Re}\,z_1\cdot\operatorname{Re}\,z_2 = 0$, אבל $\operatorname{Re}(z_1z_2) = \operatorname{Re}(-1) = -1$.
          הייצוג מדויק רק לפעולות ליניאריות.
        misconception: MC-0-re-of-product
      - text: כן, אבל רק בתהודה, כשהכוח והמהירות באותה פאזה.
        feedback: 'גם באותה פאזה זה לא נכון: עם $\tilde F = \tilde v = 1$, $P = \cos^2\omega t \ge 0$, והביטוי של הסטודנט, $\cos2\omega t$, שלילי בחצי מהזמן.'
        misconception: MC-0-re-of-product
    reasons:
      - text: '$\operatorname{Re}(z_1z_2) = \operatorname{Re}\,z_1\,\operatorname{Re}\,z_2 - \operatorname{Im}\,z_1\,\operatorname{Im}\,z_2$, והאיבר השני לא מתאפס בדרך כלל.'
        correct: true
        feedback: >-
          זה הנימוק. הנכון הוא לכתוב $\operatorname{Re}\,z = \tfrac12(z + \bar z)$ לפני הכפל. בממוצע על מחזור מתקבל
          $\langle P\rangle = \tfrac12\operatorname{Re}\left(\tilde F\bar{\tilde v}\right)$, נוסחה שחוזרת בפרק 5.
      - text: כל פעולה אלגברית עוברת דרך $\operatorname{Re}$, כמו בוקטורים.
        feedback: 'גם בווקטורים לא כל פעולה עוברת רכיב-רכיב: הרכיב $x$ של מכפלה וקטורית תלוי ברכיבים $y$ ו-$z$. כאן הכפל מערבב את החלק הממשי והמדומה.'
        misconception: MC-0-re-of-product
      - text: 'הביטוי שגוי רק כי בו התדירות $2\omega$, והכוח והמהירות בתדירות $\omega$.'
        feedback: 'במכפלה האמיתית $Fv$ יש דווקא איבר בתדירות $2\omega$, ועוד איבר קבוע. השגיאה היא שהאיבר הקבוע, שנושא את ההספק הממוצע, חסר.'
    hints:
      - 'נסו את הדוגמה $\tilde F = \tilde v = 1$: מה $Fv$, ומה הביטוי של הסטודנט?'

  - id: Q-0.6-add-phase
    type: numeric
    objectives: [OBJ-0.6-2]
    level: bagrut
    prompt: >-
      שני מקורות מזיזים את אותה מסה באותה תדירות $\omega$. כל אחד לבד היה מזיז אותה בתנודה הרמונית: הראשון
      באמפליטודה $A_1 = 3.0\,\text{cm}$ והשני באמפליטודה $A_2 = 2.0\,\text{cm}$. כששניהם פועלים יחד, האמפליטודה של
      ההעתק הכולל היא $4.0\,\text{cm}$. מה הפרש הפאזה $\Delta\varphi$ בין שתי התנודות, ברדיאנים, בתחום

# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# Directions in `vector` questions on the complex plane: e = the positive real axis, n = the positive imaginary axis.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed in .scratch/ch0/ladder.ts:
#   arg(−1 + i√3) = 2π/3 = 2.09 rad (atan(y/x) = −1.05; π/3 = 1.05), modulus 2;
#   m = 1 kg, k = 100 N/m, b = 2 kg/s, F₀ = 10 N, ω = 8 rad/s: k − mω² + ibω = 36 + 16i, |Ã| = 0.254 m, phase −0.418 rad
#     (no damping 0.278; 10/52 = 0.192; 10/|den|² = 0.00644; with k + mω² 0.0607);
#   3cos ωt + 4sin ωt: amplitude 5 (amplitudes added 7; 4 − 3 = 1).
#   Q-0.6-add-phase, rebuilt with the lesson (whose text now adds two given cosines itself): A₁ = 3.0, A₂ = 2.0,
#     A = 4.0 cm: cos Δφ = 0.25, Δφ = 1.32 rad = 75.5° (without the 2: 1.05; with a minus: 1.82); limits 5.0, 3.61, 1.0 cm.
#   Q-0.6-multiply-polar (added with the lesson, .scratch/ch0/0-6/bank.ts): 6.0e^(i·100°)·2.0e^(i·40°) = 12e^(i·140°)
#     = −9.19 + 7.71i N (moduli added 8cos 140° = −6.13; Re·Re = −1.60; angles subtracted 12cos 60° = 6.00; 12).
# Notation follows lessons 5.3–5.4 and the lesson text: Re as \operatorname{Re}, the conjugate as \bar z.
# Review (2026-11-17, .scratch/review/ch0/0-6/check.ts): every number above recomputed independently, all agree.

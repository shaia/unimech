          - 'הארגומנט של $p + iq$ מקיים $\tan\varphi = q/p$: החלק המדומה חלקי הממשי, ולא ההפך. באיזה רביע נמצא המכנה?'
        solution:
          - { kind: law, text: 'הארגומנט של מנה הוא הארגומנט של המונה פחות זה של המכנה. כאן $\tilde A = F_0/z$, עם $z = (k - m\omega^2) + ib\omega$ ו-$F_0$ ממשי וחיובי, ולכן $\arg\tilde A = -\arg z$, כלומר $\delta = \arg z$.' }
          - { kind: manipulation, text: '$$\tan\delta = \frac{\operatorname{Im}z}{\operatorname{Re}z} = \frac{b\omega}{k - m\omega^2}$$ החלק המדומה, $b\omega$, חיובי תמיד, ולכן $z$ בחצי העליון של המישור המרוכב ו-$0 < \delta < \pi$. כש-$\omega < \omega_0$ החלק הממשי חיובי, ו-$z$ ברביע הראשון. כש-$\omega > \omega_0$ הוא שלילי, $z$ ברביע השני, ו-$\delta = \pi + \arctan\dfrac{b\omega}{k - m\omega^2}$: לא הערך השלילי שהמחשבון נותן.' }
          - { kind: limit, text: 'כש-$\omega \to 0$: $\tan\delta \to 0^+$ ו-$\delta \to 0$, המסה זזה יחד עם הכוח, כמו קפיץ שנמתח לאט. ב-$\omega = \omega_0 = \sqrt{k/m}$: החלק הממשי מתאפס ו-$\delta = \pi/2$, התזוזה מפגרת ברבע מחזור, והמהירות בפאזה עם הכוח. כש-$\omega \to \infty$: $-m\omega^2$ גובר על $b\omega$, ו-$\delta \to \pi$: המסה נעה נגד הכוח, וההתמד שלה קובע את התנועה.' }
          - { kind: units, text: '$b\omega$ ו-$k - m\omega^2$ שניהם ביחידות $\text{N/m}$, ולכן $\tan\delta$ חסר ממדים, כמו שצריך.' }
          - { kind: substitution, text: '$\tan\delta = \dfrac{4.0\cdot8.0}{50 - 0.50\cdot8.0^2} = \dfrac{32}{18}$. כאן $\omega = 8.0\,\text{rad/s} < \omega_0 = 10\,\text{rad/s}$, הרביע הראשון, ו-$\delta = \arctan1.78 = 1.06\,\text{rad} = 60.6^\circ$.' }
          - { kind: result, text: '$\tan\delta = \dfrac{b\omega}{k - m\omega^2}$ עם $0 < \delta < \pi$, ו-$\delta = 1.06\,\text{rad}$ ב-$\omega = 8.0\,\text{rad/s}$, קצת פחות מ-$\pi/2$, כי $\omega$ קצת מתחת ל-$\omega_0$.' }
        rubric:
          - text: 'קיבלתי $\tan\delta = b\omega/(k - m\omega^2)$ מ-$\delta = \arg\left(k - m\omega^2 + ib\omega\right)$.'
          - text: נימקתי ש-$b\omega > 0$ ולכן $0 < \delta < \pi$, ושמעל $\omega_0$ צריך להוסיף $\pi$ לערך של $\arctan$.
          - text: 'בדקתי ש-$\delta \to 0$ בתדירות נמוכה, $\delta = \pi/2$ ב-$\omega_0$ ו-$\delta \to \pi$ בתדירות גבוהה.'
          - text: הצבתי וקיבלתי $\delta \approx 1.06\,\text{rad}$.

  # ------------------------------------------------------------ 4: a planet with a density profile: shells, gradient, Taylor
  - id: Q-0-bagrut-4
    type: bagrut
    title: כוכב לכת שצפיפותו יורדת כלפי חוץ
    prompt: >-
      במודל של כוכב לכת כדורי ברדיוס $R$, הצפיפות תלויה רק במרחק $r$ מהמרכז:
      $$\rho(r) = \rho_0\left(1 - \frac{r^2}{R^2}\right)$$
      מחוץ לכוכב הלכת, האנרגיה הפוטנציאלית של גוף בעל מסה $m$ במרחק $r$ מהמרכז היא $U(r) = -\dfrac{GMm}{r}$, כאשר $M$
      המסה של כוכב הלכת ו-$G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-0.7-2]
        prompt: 'איזה ביטוי נותן את המסה $M$ של כוכב הלכת?'
        choices:
          - text: $\displaystyle\int_0^R\rho(r)\,4\pi r^2\,dr$
            correct: true
            feedback: 'נכון. מחלקים לקליפות כדוריות דקות: בכל קליפה הצפיפות כמעט קבועה, והנפח שלה $4\pi r^2\,dr$.'
          - text: $\displaystyle\int_0^R\rho(r)\,dr$
            feedback: 'זה ביחידות $\text{kg/m}^2$, לא מסה. צפיפות נפחית כופלים בנפח, ולא באורך: חסר $4\pi r^2$.'
            misconception: MC-0-element-no-jacobian
          - text: $\rho(R/2)\cdot\tfrac43\pi R^3$
            feedback: >-
              הצפיפות באמצע הרדיוס אינה הצפיפות הממוצעת. הממוצע על הנפח משוקלל ב-$r^2$, ולכן השכבות החיצוניות קובעות
              אותו יותר.
            misconception: MC-0-mean-density-midpoint
          - text: $\displaystyle\int_0^R\rho(r)\,4\pi r\,dr$
            feedback: 'בדקו יחידות: $\text{kg/m}^3\cdot\text{m}^2 = \text{kg/m}$. שטח הספרה הוא $4\pi r^2$, ולא $4\pi r$.'
            misconception: MC-0-element-no-jacobian
        hints:
          - 'מה הנפח של קליפה כדורית ברדיוס $r$ ובעובי $dr$?'

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-0.4-2, OBJ-0.7-2]
        prompt: >-
          (1) חשבו את $M$ בעזרת $\rho_0$ ו-$R$.

          (2) חשבו באותה דרך את $M$ לפרופיל הכללי $\rho = \rho_0\left(1 - (r/R)^n\right)$, בדקו שב-$n = 2$ חוזרת התוצאה של
          (1), ובדקו את הגבול $n \to \infty$: איזה כוכב לכת מתקבל, והאם $M$ מתאים לו? ובדקו יחידות.

          (3) מצאו את $\rho_0$ כך שלכוכב הלכת יהיו המסה והרדיוס של כדור הארץ, $M = 5.97\cdot10^{24}\,\text{kg}$ ו-$R = 6.37\cdot10^6\,\text{m}$.
        hints:
          - '$\displaystyle\int_0^R\left(r^2 - \frac{r^4}{R^2}\right)dr = \frac{R^3}{3} - \frac{R^3}{5}$.'
        solution:
          - { kind: law, text: 'המסה היא סכום הקליפות: $M = \displaystyle\int_0^R\rho(r)\,4\pi r^2\,dr$.' }
          - { kind: manipulation, text: '$M = 4\pi\rho_0\displaystyle\int_0^R\left(r^2 - \frac{r^4}{R^2}\right)dr = 4\pi\rho_0\left(\frac{R^3}{3} - \frac{R^3}{5}\right) = \frac{8\pi\rho_0R^3}{15}$. הצפיפות הממוצעת היא $M\big/\tfrac43\pi R^3 = \tfrac25\rho_0$.' }
          - { kind: limit, text: 'לפרופיל הכללי, $\displaystyle\int_0^R\frac{r^{n + 2}}{R^n}\,dr = \frac{R^3}{n + 3}$, ולכן $M = 4\pi\rho_0R^3\left(\dfrac13 - \dfrac{1}{n + 3}\right)$. ב-$n = 2$ זה $\dfrac{8\pi\rho_0R^3}{15}$. כש-$n \to \infty$, $(r/R)^n \to 0$ בכל נקודה פנימית, הכוכב אחיד, ו-$M \to \tfrac43\pi\rho_0R^3$, כמו שצריך. כש-$n \to 0$, $\rho \to 0$ ו-$M \to 0$.' }
          - { kind: units, text: '$[\rho_0R^3] = \text{kg/m}^3\cdot\text{m}^3 = \text{kg}$.' }
          - { kind: substitution, text: '$\rho_0 = \dfrac{15M}{8\pi R^3} = \dfrac{15\cdot5.97\cdot10^{24}}{8\pi\cdot(6.37\cdot10^6)^3} = 1.38\cdot10^4\,\text{kg/m}^3$, והצפיפות הממוצעת $\tfrac25\rho_0 = 5.51\cdot10^3\,\text{kg/m}^3$.' }
          - { kind: result, text: '$M = \dfrac{8\pi\rho_0R^3}{15}$, כלומר צפיפות ממוצעת $\tfrac25\rho_0$, ובנתוני כדור הארץ $\rho_0 = 1.38\cdot10^4\,\text{kg/m}^3$.' }
        rubric:
          - text: כתבתי את המסה כאינטגרל על קליפות, עם $4\pi r^2\,dr$.
          - text: חישבתי את האינטגרל וקיבלתי $8\pi\rho_0R^3/15$.
          - text: 'חישבתי את $M$ לפרופיל הכללי, $4\pi\rho_0R^3\left(\tfrac13 - \tfrac{1}{n + 3}\right)$, ובדקתי שבגבול $n \to \infty$ חוזרים לכדור אחיד, $\tfrac43\pi\rho_0R^3$, ושהיחידות קילוגרם.'
          - text: הצבתי את נתוני כדור הארץ וקיבלתי $\rho_0 \approx 1.4\cdot10^4\,\text{kg/m}^3$.

      - label: ג
        type: vector
        points: 4
        level: mid
        qualitative: true
        objectives: [OBJ-0.7-3]
        prompt: >-
          כוכב הלכת במרכז הדף, ונקודה P נמצאת מחוץ לו, ימינה ממרכזו. מה הכיוון של הגרדיאנט $\nabla U$ בנקודה P?
        answer: e
        correctFeedback: >-
          נכון. $U = -GMm/r$ **עולה** (נעשה פחות שלילי) כשמתרחקים, ולכן $\nabla U = \dfrac{dU}{dr}\hat r = \dfrac{GMm}{r^2}\hat r$:
          החוצה, ימינה. הכוח $\vec F = -\nabla U$ מצביע הפוך, אל כוכב הלכת.
        wrong:
          - dir: w
            feedback: 'זה הכיוון של הכוח, $-\nabla U$. הגרדיאנט מצביע לכיוון שבו $U$ גדל, ו-$-GMm/r$ גדל כש-$r$ גדל.'
          - dir: zero
            feedback: '$U$ משתנה עם $r$, ולכן הגרדיאנט לא אפס. הוא אפס רק בנקודה שבה $U$ לא משתנה באף כיוון.'
          - dir: n
            feedback: 'לאורך מעגל סביב כוכב הלכת $U$ לא משתנה, ולכן לגרדיאנט אין רכיב משיקי. הוא רדיאלי.'
        wrongFeedback: '$U$ תלוי רק ב-$r$. באיזה כיוון $r$ גדל, והאם $-GMm/r$ גדל או קטן איתו?'

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-0.3-2, OBJ-0.1-2]
        prompt: >-
          ליד פני השטח מקרבים $U(R + h) - U(R) \approx mgh$, עם $g = GM/R^2$.

          (1) חשבו את ההפרש המדויק $\Delta U = U(R + h) - U(R)$, והראו ש-$\dfrac{mgh}{\Delta U} = 1 + \dfrac hR$ בדיוק.

          (2) פתחו את $U(R + h)$ בטור טיילור ב-$h$ עד סדר שני, וזהו את $mgh$ כאיבר מסדר ראשון. פי כמה קטן האיבר מסדר שני
          מהאיבר מסדר ראשון?

          (3) בדקו את התוצאות בגבולות $h \to 0$ ו-$h \gg R$, ובדקו יחידות.

          (4) בכמה אחוזים הקירוב $mgh$ גדול מההפרש המדויק, כשמרימים גוף לגובה $h = 100\,\text{km}$ מעל כוכב לכת ברדיוס
          $R = 6.37\cdot10^6\,\text{m}$?
        hints:
          - '$\dfrac1R - \dfrac{1}{R + h} = \dfrac{h}{R(R + h)}$.'
          - 'הנגזרת של $1/r^2$ היא $-2/r^3$. אל תשכחו את ה-2.'
        solution:
          - { kind: law, text: 'מחוץ לכוכב הלכת $U(r) = -\dfrac{GMm}{r}$. פיתוח טיילור סביב $R$: $U(R + h) \approx U(R) + U''(R)\,h + \tfrac12U''''(R)\,h^2$.' }
          - { kind: manipulation, text: 'ההפרש המדויק: $\Delta U = GMm\left(\dfrac1R - \dfrac{1}{R + h}\right) = \dfrac{GMmh}{R(R + h)}$. עם $mgh = \dfrac{GMm}{R^2}h$: $$\frac{mgh}{\Delta U} = \frac{R(R + h)}{R^2} = 1 + \frac hR$$' }
          - { kind: manipulation, text: 'טיילור: $U''(r) = \dfrac{GMm}{r^2}$, ולכן $U''(R) = mg$; $U''''(r) = -\dfrac{2GMm}{r^3}$, ולכן $U''''(R) = -\dfrac{2mg}{R}$. מכאן $\Delta U \approx mgh - \dfrac{mgh^2}{R} = mgh\left(1 - \dfrac hR\right)$: $mgh$ הוא האיבר מסדר ראשון, והאיבר מסדר שני קטן ממנו פי $R/h$. זה מתאים לתוצאה המדויקת, כי $\dfrac{1}{1 - h/R} \approx 1 + \dfrac hR$.' }
          - { kind: limit, text: 'כש-$h \to 0$: המנה שואפת ל-1, והשגיאה נעלמת: ליד הקרקע $mgh$ מדויק. כש-$h \gg R$: $mgh$ גדל בלי גבול, אבל $\Delta U \to \dfrac{GMm}{R}$, ערך סופי (האנרגיה הדרושה כדי להתרחק לאינסוף). המנה $1 + h/R$ גדלה בלי גבול, והקירוב חסר ערך.' }
          - { kind: units, text: '$\dfrac{GMm}{R^2}h$ ביחידות $\text{N}\cdot\text{m} = \text{J}$, כמו $\Delta U$. $h/R$ חסר ממדים, כמו שגיאה יחסית.' }
          - { kind: substitution, text: '$\dfrac hR = \dfrac{1.00\cdot10^5}{6.37\cdot10^6} = 1.57\%$. בגובה טיסה, $10\,\text{km}$, רק $0.157\%$. (זה לא $2h/R = 3.14\%$, הירידה היחסית ב-$g$ עצמו: $1/r$ יורד לאט יותר מ-$1/r^2$.)' }
          - { kind: result, text: '$\dfrac{mgh}{\Delta U} = 1 + \dfrac hR$: הקירוב גדול מהערך המדויק ב-$h/R$, $1.57\%$ בגובה $100\,\text{km}$.' }
        rubric:
          - text: 'חישבתי $\Delta U = GMmh/\left(R(R + h)\right)$ והראיתי ש-$mgh/\Delta U = 1 + h/R$.'
          - text: 'בפיתוח טיילור מצאתי $U''''(R) = -2mg/R$ ואיבר מסדר שני $-mgh\cdot h/R$.'
          - text: בדקתי שהשגיאה נעלמת כש-$h \to 0$, ושכש-$h \gg R$ הקירוב נכשל כי $\Delta U$ שואף לערך סופי.
          - text: 'בדקתי ש-$\dfrac{GMm}{R^2}h$ ביחידות $\text{J}$, כמו $\Delta U$, ושהשגיאה $h/R$ חסרת ממדים.'
          - text: הצבתי וקיבלתי $1.57\%$.

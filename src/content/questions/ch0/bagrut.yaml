        objectives: [OBJ-0.7-2, OBJ-0.4-1]
        prompt: >-
          (1) בקואורדינטות גליליות $(s,\ \varphi,\ z)$, $s$ הוא המרחק מהציר $z$ ו-$\varphi$ הזווית סביבו, ואלמנט
          האורך הוא $d\ell^2 = ds^2 + s^2d\varphi^2 + dz^2$. על הסליל $s = R$ ו-$\varphi = \omega t$. כתבו את $d\ell$ לאורך
          הסליל, ובטאו אותו בעזרת $d\varphi$.

          (2) בטאו את האורך $L$ של מגלשה שעושה $N$ סיבובים באמצעות $R$, $u$, $\omega$ ו-$N$. בדקו את הביטוי בדרך שנייה,
          בצבירה $\int|\vec v|\,dt$.

          (3) בדקו את הביטוי בגבולות $u \to 0$ ו-$R \to 0$, ובדקו יחידות.

          (4) מה האורך של המגלשה, לאורך שלושת הסיבובים?
        hints:
          - 'בכל סיבוב $\varphi$ גדלה ב-$2\pi$, והמגלש יורד $2\pi u/\omega$.'
          - 'את הדרך סביב העמוד ואת הירידה אי אפשר לחבר כמספרים: בכל קטע קטן הן ניצבות זו לזו.'
        solution:
          - { kind: law, text: 'האורך של מסלול הוא סכום אלמנטי האורך שלו: $L = \displaystyle\int d\ell$, עם $d\ell^2 = ds^2 + s^2d\varphi^2 + dz^2$ בקואורדינטות גליליות.' }
          - { kind: manipulation, text: 'על הסליל $s = R$ קבוע, ולכן $ds = 0$. $\varphi = \omega t$ ו-$z = H - ut$, ולכן $dz = -u\,dt = -\dfrac{u}{\omega}\,d\varphi$. מכאן $d\ell = \sqrt{R^2 + (u/\omega)^2}\,d\varphi$, שלא תלוי ב-$\varphi$, ובאינטגרל על $N$ סיבובים, $\varphi$ מ-$0$ עד $2\pi N$: $$L = 2\pi N\sqrt{R^2 + \left(\frac{u}{\omega}\right)^2}$$ בדרך השנייה: $|\vec v| = \sqrt{R^2\omega^2 + u^2}$ קבוע (חלק א), והזמן של $N$ סיבובים $2\pi N/\omega$, ולכן $L = |\vec v|\cdot\dfrac{2\pi N}{\omega}$, אותו ביטוי.' }
          - { kind: manipulation, text: 'בדיקה בציור: פורשים את הגליל למישור. כל סיבוב נעשה קו ישר, היתר של משולש ישר זווית שניצביו $2\pi R$ (ההיקף) ו-$2\pi u/\omega$ (הירידה בסיבוב). היתר הוא בדיוק $2\pi\sqrt{R^2 + (u/\omega)^2}$.' }
          - { kind: limit, text: 'כש-$u \to 0$: $L \to 2\pi NR$, $N$ היקפים של מעגל אופקי. כש-$R \to 0$: $L \to 2\pi Nu/\omega$, הירידה האנכית בלבד, לאורך הציר.' }
          - { kind: units, text: '$u/\omega$ ביחידות $\dfrac{\text{m/s}}{\text{1/s}} = \text{m}$, כמו $R$, ולכן $L$ במטרים.' }
          - { kind: substitution, text: '$L = 6\pi\sqrt{3.0^2 + 0.80^2} = 6\pi\cdot3.10 = 58.5\,\text{m}$. שלושת ההיקפים לבדם $6\pi R = 56.5\,\text{m}$, והירידה $6\pi u/\omega = 15.1\,\text{m}$. הסכום שלהם, $71.6\,\text{m}$, גדול מדי.' }
          - { kind: result, text: '$L = 2\pi N\sqrt{R^2 + (u/\omega)^2}$, ועם שלושה סיבובים $58.5\,\text{m}$.' }
        rubric:
          - text: 'כתבתי את $d\ell$ על הסליל עם $ds = 0$ ו-$dz = -(u/\omega)\,d\varphi$, וקיבלתי $L = 2\pi N\sqrt{R^2 + (u/\omega)^2}$.'
          - text: בדקתי שאותו ביטוי יוצא מ-$|\vec v|$ כפול זמן הנסיעה.
          - text: 'בדקתי ש-$u/\omega$ במטרים, כמו $R$, ולכן $L$ במטרים.'
          - text: 'בדקתי שב-$u \to 0$ יוצאים $N$ היקפים, וב-$R \to 0$ הירידה האנכית בלבד.'
          - text: הצבתי וקיבלתי $58.5\,\text{m}$.

  # ------------------------------------------------------------ 3: a driven damped oscillator: roots and complex amplitudes
  - id: Q-0-bagrut-3
    type: bagrut
    title: מתנד מרוסן ומאולץ
    prompt: >-
      מסה $m = 0.50\,\text{kg}$ קשורה לקפיץ שקבועו $k = 50\,\text{N/m}$ ולבולם עם מקדם ריסון $b = 4.0\,\text{kg/s}$.
      התזוזה שלה מקיימת
      $$m\ddot x + b\dot x + kx = F(t)$$
      כאשר $F(t)$ כוח חיצוני. אחרי חלוקה ב-$m$ זו המשוואה
      $$\ddot x + \gamma\dot x + \omega_0^2x = \frac{F(t)}{m},\qquad \gamma = \frac bm,\quad \omega_0 = \sqrt{\frac km}$$
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-0.5-3]
        prompt: 'בלי כוח חיצוני, $F = 0$, מצאו את שורשי המשוואה האופיינית. מה התדירות הזוויתית של התנודות החופשיות?'
        answer: 9.17
        unit: rad/s
        correctFeedback: >-
          נכון. $0.5s^2 + 4s + 50 = 0$ נותן $s = \dfrac{-4 \pm \sqrt{16 - 100}}{1} = -4 \pm 9.17i$. התנודות דועכות כמו
          $e^{-\gamma t/2} = e^{-4t}$, כלומר בקבוע זמן $0.25\,\text{s}$, ומתנודדות ב-$9.17\,\text{rad/s}$, קצת מתחת ל-$\omega_0 = \sqrt{k/m} = 10\,\text{rad/s}$.
        wrongFeedback: 'הציבו $x = e^{st}$ וקבלו $ms^2 + bs + k = 0$. התדירות היא החלק המדומה של השורש.'
        commonWrong:
          - value: 10
            feedback: 'זה $\omega_0 = \sqrt{k/m}$, התדירות בלי ריסון. הריסון מקטין אותה ל-$\sqrt{\omega_0^2 - (\gamma/2)^2} = \sqrt{100 - 16}\,\text{rad/s}$.'
            misconception: MC-0-damping-no-frequency-change
          - value: 4
            feedback: 'זה החלק **הממשי** של השורש, בגודלו: קצב הדעיכה, $\gamma/2 = b/(2m)$. התדירות היא החלק המדומה.'
        hints:
          - 'הדיסקרימיננטה: $b^2 - 4mk = 16 - 100$.'

      - label: ב
        type: open
        points: 8
        level: mid
        objectives: [OBJ-0.6-2, OBJ-0.5-1]
        prompt: >-
          עכשיו $F(t) = F_0\cos\omega t$. כותבים $F_0\cos\omega t = \operatorname{Re}\left(F_0e^{i\omega t}\right)$ ומחפשים פתרון
          יציב מהצורה $x = \operatorname{Re}\left(\tilde Ae^{i\omega t}\right)$.

          (1) הסבירו למה מותר לפתור את המשוואה עם הכוח המרוכב ולקחת חלק ממשי רק בסוף.

          (2) הציבו והראו ש-$\tilde A = \dfrac{F_0}{k - m\omega^2 + ib\omega}$.

          (3) בדקו את הביטוי בגבולות $\omega \to 0$ ו-$b \to 0$, ובדקו את היחידות של המכנה.
        hints:
          - 'אילו פעולות מופיעות במשוואה? האם יש בה מכפלה של $x$ בעצמו?'
          - 'אם $z = \tilde Ae^{i\omega t}$, אז $\dot z = i\omega z$ ו-$\ddot z = -\omega^2z$.'
        solution:
          - { kind: law, text: 'המשוואה ליניארית ובעלת מקדמים ממשיים, ו-$\operatorname{Re}$ עובר דרך סכומים, כפל בקבוע ממשי ונגזרות. לכן אם $z(t)$ פותר את $m\ddot z + b\dot z + kz = F_0e^{i\omega t}$, החלק הממשי שלו פותר את המשוואה עם $F_0\cos\omega t$. (במכפלה של שני גדלים זה כבר לא נכון.)' }
          - { kind: manipulation, text: 'מציבים $z = \tilde Ae^{i\omega t}$: $\left(-m\omega^2 + ib\omega + k\right)\tilde Ae^{i\omega t} = F_0e^{i\omega t}$, ומחלקים ב-$e^{i\omega t} \ne 0$: $$\tilde A = \frac{F_0}{k - m\omega^2 + ib\omega}$$' }
          - { kind: limit, text: 'כש-$\omega \to 0$: $\tilde A \to F_0/k$, המתיחה הסטטית של קפיץ תחת כוח קבוע. כש-$b \to 0$: $\tilde A \to \dfrac{F_0}{k - m\omega^2}$, ממשי, ו-$x = \dfrac{F_0\cos\omega t}{k - m\omega^2}$. בדיקה ישירה במשוואה בלי ריסון, $m\ddot x + kx = F_0\cos\omega t$: עם $\ddot x = -\omega^2x$ האגף השמאלי הוא $(k - m\omega^2)x = F_0\cos\omega t$, נכון. מתחת ל-$\omega_0 = \sqrt{k/m}$ המסה זזה עם הכוח, ומעליה נגדו (המכנה שלילי); וב-$\omega_0$ המכנה מתאפס, ובלי ריסון האמפליטודה מתבדרת (תהודה, פרק 5).' }
          - { kind: units, text: 'כל איבר במכנה ביחידות $\text{N/m} = \text{kg/s}^2$: $k$, $m\omega^2$ ($\text{kg}\cdot\text{s}^{-2}$) ו-$b\omega$ ($\text{kg/s}\cdot\text{s}^{-1}$). לכן $\tilde A$ במטרים.' }
          - { kind: result, text: '$\tilde A = \dfrac{F_0}{k - m\omega^2 + ib\omega}$, והתנודה היציבה היא $x = |\tilde A|\cos(\omega t + \arg\tilde A)$.' }
        rubric:
          - text: נימקתי שהמשוואה ליניארית עם מקדמים ממשיים, ולכן מותר לקחת חלק ממשי בסוף.
          - text: הצבתי $\dot z = i\omega z$ ו-$\ddot z = -\omega^2z$ וקיבלתי את $\tilde A$.
          - text: 'בדקתי שב-$\omega \to 0$ מתקבל $F_0/k$, ושבלי ריסון $x = F_0\cos\omega t/(k - m\omega^2)$ פותר ישירות את $m\ddot x + kx = F_0\cos\omega t$.'
          - text: בדקתי שכל איברי המכנה באותן יחידות, $\text{N/m}$.


          - text: חישבתי $\vec v\cdot\vec a = 0$ והסקתי מ-$\dfrac{d}{dt}|\vec v|^2 = 2\vec v\cdot\vec a$ שגודל המהירות קבוע.
          - text: 'בדקתי שב-$\omega \to 0$ וב-$R \to 0$ התאוצה אפס (ירידה בקו ישר), והסברתי מההיטל האופקי, תנועה מעגלית אחידה, למה $\vec a$ לא תלויה ב-$u$.'

      - label: ד
        type: open

# Chapter 0 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג…), 25 points each,
# climbing basic → mid → bagrut (exam level). Each problem joins objectives of at least two lessons, and the four
# together touch every lesson of the chapter:
#   1 (fog droplet): 0.1, 0.4, 0.5 · 2 (helical slide): 0.2, 0.3, 0.4, 0.7 · 3 (driven oscillator): 0.5, 0.6
#   · 4 (planet with a density profile): 0.1, 0.3, 0.4, 0.7.
# Open parts are solved in the course format: general law (law) → derivation (manipulation) → limit check (limit)
# → unit check (units) → numbers (substitution) only when asked, ending in a result step.
# Part types and points (exam-style rework, 2026-11-18: open parts ≥ 13 of 25, the first part auto-graded, the last
# a symbolic result with its limit check; chapter 0 has no fifth problem, there is no earlier chapter to join):
#   1: mc 4 · open 8 · numeric 6 · open 7 (was numeric)  = open 15
#   2: numeric 5 · numeric 5 · open 7 · open 8 (was numeric)  = open 15
#   3: numeric 5 · open 8 · numeric 5 · open 7 (was numeric)  = open 15
#   4: mc 4 · open 9 · vector 4 · open 8 (was numeric)  = open 17
# The four converted parts were recomputed in .scratch/ch0/review-rework.ts, each closed form against a second route:
#   1ד x(t) = v_t[t − τ(1 − e^{−t/τ})] against RK4 of dv/dt = g − v/τ plus trapezoid accumulation (agree to 1e-6),
#      x ≈ ½gt² at t = 0.01τ; T = H/v_t + τ against Newton on x(T) = H (agree to 1e-9): 8.27e4 s = 23.0 h, τ = 1.2 ms,
#      free fall 14.3 s;
#   2ד L = 2πN√(R² + (u/ω)²) against a sum of 2e5 chords of the helix: 58.5 m (6πR 56.5, drop 15.1, sum 71.6);
#   3ד tan δ = bω/(k − mω²), δ = arg(k − mω² + ibω) against RK4 of the driven ODE projected on cos/sin over ten periods
#      at steady state (|Ã| 5.45 cm and δ agree to 1e-3): δ = 1.06 rad = 60.6°, ω₀ = 10 rad/s;
#   4ד mgh/ΔU − 1 = h/R with M_EARTH, R_EARTH, G_NEWTON: 1.57% (agrees to 1e-9), 0.157% at 10 km, 2h/R 3.14%.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
# Independent review 2026-11-18 (.scratch/review/ch0/indep.ts, written before opening the authors' scripts): 37
#   numbers and 12 symbolic results recomputed, every one confirmed. 1: m, b, τ, v_t and its three commonWrong, Re;
#   v(t), x(t) against RK4 of m dv/dt = mg − bv at 0.01τ, τ, 5τ (1e-6); T by bisection on the exact x(T) = H, 82653 s.
#   2: |v|, the slope by the dot product with −ẑ, a by finite differences (|a| = 3.0, a_z = 0, v·a = 0), L by 2e5
#   chords. 3: the roots; Ã by complex division and δ = −arg Ã against RK4 of the driven ODE projected on cos/sin
#   (5.447 cm, 1.058 rad); δ = π + arctan above ω₀ (checked at 30 rad/s). 4: M and the general-n mass by Simpson;
#   ρ₀; mgh/ΔU − 1 = h/R at 100 and 10 km; U″(R) = −2g/R by a numeric second difference. Changed: 1ד asked for T
#   in the limit τ → 0, which is not a limit of this model (v_t = gτ goes to zero with τ, and T → ∞); now the limit
#   τ ≪ H/v_t (transient length gτ² = 1.5e-5 m ≪ H) and the opposite case H ≪ gτ² (free fall); its substitution
#   printed 1000/0.0121 = 8.27e4 s, which is 8.26e4 (8.27e4 only with v_t unrounded), now ≈ 8.3e4 s = 23 h.
#   After the student read: 1 gives η in SI without its units (א asks them) and states ρ_air = 1.2 kg/m³ (used
#   in ג's Re check); 1ב shows the integral step (−(m/b)[ln(g − bv/m) − ln g]) and lesson 0.5's shift w = v − v_t;
#   2ג's limits are ω → 0 and R → 0 plus the projection argument for why a does not depend on u (u → 0 could not
#   fail); 2ד defines s and φ in the prompt; 3 writes the characteristic root s (lesson 0.5), not r, and p + iq for
#   a complex number (b is the damping); 3ב's b → 0 check substitutes the undamped solution into m ẍ + kx = F₀cos ωt;
#   4ב asks for the general-n mass explicitly; units lines added to the rubrics of 2ד and 4ד; לוליינית.
#
# Every number was computed in .scratch/ch0/review.ts with src/physics/constants.ts (G = 9.8, G_NEWTON, M_EARTH, R_EARTH),
# and recomputed independently in the physics review (2026-11-17, .scratch/ch0/bagrut/review.ts, values as printed;
# every pair of answer/commonWrong values checked > 3% apart; the shell integral and the general-n mass checked by

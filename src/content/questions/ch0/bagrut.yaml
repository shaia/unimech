chapter: 0
questions:
  # ------------------------------------------------------------ 1: a fog droplet: dimensions, an ODE, accumulation
  - id: Q-0-bagrut-1
    type: bagrut
    title: טיפת ערפל נופלת באוויר
    prompt: >-
      טיפת ערפל היא כדור מים זעיר בקוטר $D = 20\,\mu\text{m}$, עם צפיפות $\rho_\text{w} = 1000\,\text{kg/m}^3$. על גוף
      זעיר ואיטי כל כך כוח הגרר ליניארי במהירות, ולפי חוק סטוקס הוא $F = 3\pi\eta Dv$, נגד כיוון התנועה. הצמיגות
      של האוויר היא $\eta = 1.8\cdot10^{-5}$ ביחידות SI (את היחידות עצמן תמצאו בחלק א). הזניחו את כוח הציפה: צפיפות
      האוויר, $\rho_\text{air} = 1.2\,\text{kg/m}^3$, קטנה מזו של המים בערך פי 830. הטיפה מתחילה ליפול ממנוחה, באוויר
      שקט.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-0.1-1]
        prompt: 'בדקו את חוק סטוקס בניתוח ממדים: מה צריכות להיות היחידות של הצמיגות $\eta$ כדי ש-$3\pi\eta Dv$ יהיה כוח?'
        choices:
          - text: $\text{kg}/(\text{m}\cdot\text{s})$
            correct: true
            feedback: >-
              נכון. $\dfrac{\text{kg}}{\text{m}\cdot\text{s}}\cdot\text{m}\cdot\dfrac{\text{m}}{\text{s}} = \dfrac{\text{kg}\cdot\text{m}}{\text{s}^2} = \text{N}$.
              $3\pi$ חסר ממדים, ולכן לא משפיע על היחידות.
          - text: $\text{kg/s}$
            feedback: >-
              אלה היחידות של כל המקדם של $v$, $b = 3\pi\eta D$. הצמיגות עצמה מוכפלת עוד באורך $D$, ולכן היחידות שלה
              הן $\text{kg/s}$ חלקי מטר.
          - text: $\text{kg}\cdot\text{m/s}$
            feedback: 'אלה יחידות של תנע. עם $Dv$ בנוסף יוצא $\text{kg}\cdot\text{m}^3/\text{s}^2$, ולא ניוטון.'
          - text: $\text{kg}/(\text{m}^2\cdot\text{s})$
            feedback: 'עם זה $\eta Dv$ יוצא $\text{kg}/\text{s}^2$, חסר מטר אחד. ניוטון הוא $\text{kg}\cdot\text{m/s}^2$.'
        hints:
          - 'כתבו $[\eta] = [F]/([D][v])$.'

      - label: ב
        type: open
        points: 8
        level: mid
        objectives: [OBJ-0.5-2, OBJ-0.5-1]
        prompt: >-
          (1) כתבו את משוואת התנועה למהירות $v(t)$ של הטיפה, עם ציר כלפי מטה ועם $b = 3\pi\eta D$. מה הסדר שלה,
          והאם היא ליניארית?

          (2) פתרו אותה בהפרדת משתנים, עם התנאי $v(0) = 0$. בטאו את התשובה בעזרת המהירות הסופית $v_t$ וקבוע הזמן
          $\tau$.

          (3) בדקו את הפתרון בשני גבולות, $t \ll \tau$ ו-$t \to \infty$, ובדקו את היחידות של $v_t$ ושל $\tau$.
        hints:
          - 'על הטיפה פועלים שני כוחות: כוח הכובד של כדור הארץ, $mg$, כלפי מטה, וכוח הגרר של האוויר, $bv$, כלפי מעלה.'
          - 'אספו את $v$ לאגף אחד: $\dfrac{dv}{g - (b/m)v} = dt$.'
        solution:
          - { kind: law, text: 'החוק השני של ניוטון לטיפה, עם ציר חיובי כלפי מטה. כדור הארץ מפעיל עליה $mg$ כלפי מטה, והאוויר מפעיל עליה גרר $bv$ כלפי מעלה: $m\dfrac{dv}{dt} = mg - bv$, עם $b = 3\pi\eta D$. זו משוואה מסדר ראשון, ליניארית ב-$v$, לא הומוגנית (בגלל $mg$).' }
          - { kind: manipulation, text: 'מפרידים משתנים: $\dfrac{dv}{g - (b/m)v} = dt$. האינטגרל של $\dfrac{1}{g - kv}$ לפי $v$, עם $k = b/m$, הוא $-\dfrac1k\ln(g - kv)$ (גזרו ובדקו: כלל השרשרת מביא את $-k$). מחשבים את האינטגרלים מ-$0$ עד $v$ ומ-$0$ עד $t$: $$-\frac{m}{b}\left[\ln\left(g - \frac{bv}{m}\right) - \ln g\right] = -\frac{m}{b}\ln\left(1 - \frac{bv}{mg}\right) = t$$ ומכאן $1 - \dfrac{bv}{mg} = e^{-bt/m}$, כלומר $$v(t) = v_t\left(1 - e^{-t/\tau}\right),\qquad v_t = \frac{mg}{b},\qquad \tau = \frac{m}{b}$$ דרך קצרה, כמו בשיעור 0.5: עם $w = v - v_t$ המשוואה נעשית $\dot w = -w/\tau$, ולכן $w = w(0)\,e^{-t/\tau} = -v_te^{-t/\tau}$, אותה תוצאה.' }
          - { kind: limit, text: 'כש-$t \ll \tau$: $e^{-t/\tau} \approx 1 - t/\tau$, ולכן $v \approx v_t\,t/\tau = gt$: בהתחלה הגרר אפס, והטיפה בנפילה חופשית. כש-$t \to \infty$: $v \to v_t$, המהירות שבה $bv_t = mg$ והשקול מתאפס.' }
          - { kind: units, text: '$[b] = \text{N}/(\text{m/s}) = \text{kg/s}$, ולכן $\tau = m/b$ בשניות, ו-$v_t = mg/b = g\tau$ ב-$\text{m/s}^2\cdot\text{s} = \text{m/s}$.' }
          - { kind: result, text: '$v(t) = v_t\left(1 - e^{-t/\tau}\right)$, עם $v_t = mg/b$ ו-$\tau = m/b$. בהתחלה נפילה חופשית, ובסוף מהירות קבועה.' }
        rubric:
          - text: כתבתי את החוק השני עם שני הכוחות, וקבעתי שהמשוואה מסדר ראשון וליניארית.
          - text: הפרדתי משתנים, חישבתי את האינטגרלים עם $v(0) = 0$, וקיבלתי $v_t\left(1 - e^{-t/\tau}\right)$.
          - text: זיהיתי $v_t = mg/b$ ו-$\tau = m/b$.
          - text: בדקתי שבזמן קצר $v \approx gt$ ושבזמן ארוך $v \to v_t$.
          - text: בדקתי ש-$\tau$ בשניות ו-$v_t$ ב-$\text{m/s}$.

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-0.5-2, OBJ-0.1-2]
        prompt: 'חשבו את המסה של הטיפה, את קבוע הזמן ואת המהירות הסופית. מה המהירות הסופית, בסנטימטרים לשנייה?'
        answer: 1.21
        unit: cm/s
        correctFeedback: >-
          נכון. $m = \rho_\text{w}\dfrac{\pi}{6}D^3 = 4.19\cdot10^{-12}\,\text{kg}$ ו-$b = 3\pi\eta D = 3.39\cdot10^{-9}\,\text{kg/s}$,
          ולכן $\tau = m/b = 1.23\,\text{ms}$ ו-$v_t = g\tau = 1.21\cdot10^{-2}\,\text{m/s}$. בסדר גודל: סנטימטר לשנייה,
          ולכן ערפל כמעט מרחף. **בדיקה:** חוק סטוקס, גרר ליניארי, מתאים כשהגודל חסר הממדים
          $\rho_\text{air}v_tD/\eta$ קטן בהרבה מ-1, וכאן הוא $0.016$.
        wrongFeedback: 'הנפח של כדור בקוטר $D$ הוא $\dfrac{\pi}{6}D^3$. חשבו $m$ ו-$b$ במטרים ובקילוגרמים, ורק בסוף עברו לסנטימטרים.'
        commonWrong:
          - value: 9.68
            feedback: 'במסה השתמשתם ב-$D$ כאילו הוא הרדיוס, $m = \tfrac43\pi D^3$, והמסה יצאה גדולה פי 8. הרדיוס הוא $D/2$, ולכן $m = \tfrac43\pi(D/2)^3 = \tfrac{\pi}{6}D^3$.'
          - value: 2.31
            feedback: 'לקחתם את המסה $\rho_\text{w}D^3$, הנפח של קובייה. נפח הכדור $\dfrac{\pi}{6}D^3$, קטן כמעט פי 2.'
          - value: 11.4
            feedback: 'השמטתם את $3\pi$ מחוק סטוקס. קבוע חסר ממדים לא משנה יחידות, אבל הוא משנה את המספר.'
            misconception: MC-0-dimensions-give-constant
        hints:
          - '$D = 2\cdot10^{-5}\,\text{m}$, ולכן $D^3 = 8\cdot10^{-15}\,\text{m}^3$.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-0.4-1, OBJ-0.3-2, OBJ-0.1-2]
        prompt: >-
          (1) כתבו את המרחק $x(t)$ שהטיפה עברה עד הרגע $t$ כאינטגרל של $v(t)$ מחלק ב, וחשבו אותו.

          (2) הראו שכש-$t \gg \tau$, $x \approx v_t(t - \tau)$, ובטאו בעזרת $H$, $v_t$ ו-$\tau$ את זמן הנפילה $T$ מגובה $H$.

          (3) בדקו את $x(t)$ בגבול $t \ll \tau$, בפיתוח טיילור של האקספוננט עד סדר שני, ואת $T$ בגבול שבו $\tau$ זניח
          לעומת $H/v_t$. (שימו לב: $v_t = g\tau$, ולכן אי אפשר לקחת $\tau \to 0$ בלי לשנות גם את $v_t$.)

          (4) הטיפה נופלת מבסיס של ענן בגובה $H = 1.0\,\text{km}$. כמה זמן, בשעות, נמשכת הנפילה עד הקרקע?
        hints:
          - 'השוו את $\tau$ לזמן הנפילה כולו. אפשר להזניח את השלב שבו הטיפה מאיצה?'
          - 'כש-$s \ll 1$: $e^{-s} \approx 1 - s + \tfrac12s^2$.'
        solution:
          - { kind: law, text: 'המרחק הוא הצבירה של המהירות: $x(t) = \displaystyle\int_0^tv(t'')\,dt''$, עם $x(0) = 0$ ועם $v(t'') = v_t\left(1 - e^{-t''/\tau}\right)$ מחלק ב.' }
          - { kind: manipulation, text: '$x(t) = v_t\left[t'' + \tau e^{-t''/\tau}\right]_0^t = v_t\left[t - \tau\left(1 - e^{-t/\tau}\right)\right]$. כש-$t \gg \tau$ האקספוננט זניח, ו-$x \approx v_t(t - \tau)$: הטיפה מאחרת ב-$\tau$ לעומת גוף שנע במהירות $v_t$ מההתחלה. לכן $H = v_t(T - \tau)$, ו-$$T = \frac{H}{v_t} + \tau$$' }
          - { kind: limit, text: 'כש-$t \ll \tau$: $1 - e^{-t/\tau} \approx \dfrac t\tau - \dfrac{t^2}{2\tau^2}$, ולכן $x \approx \dfrac{v_t}{2\tau}t^2 = \tfrac12gt^2$ (כי $v_t = g\tau$): נפילה חופשית, כמו בגבול הזמן הקצר של חלק ב. כש-$\tau \ll H/v_t$, כלומר כשהדרך שהטיפה עוברת בזמן ההאצה, בערך $v_t\tau = g\tau^2$, זניחה לעומת $H$: $T \to H/v_t$, כאילו הטיפה מגיעה ל-$v_t$ מייד ונעה בה כל הדרך, תנועה במהירות קבועה. (בגבול ההפוך, $H \ll g\tau^2$, הנפילה כולה בשלב שבו $t \ll \tau$, ו-$T \approx \sqrt{2H/g}$ מהנפילה החופשית למעלה; הביטוי $H/v_t + \tau$ לא תקף שם.)' }
          - { kind: units, text: '$v_tt$ ו-$v_t\tau$ במטרים, כמו $x$. $H/v_t$ ו-$\tau$ בשניות, כמו $T$.' }
          - { kind: substitution, text: '$T = \dfrac{1000}{0.0121} + 0.0012 \approx 8.3\cdot10^4\,\text{s} = 23\,\text{h}$. התיקון $\tau = 1.2\,\text{ms}$ זניח לגמרי: כאן $g\tau^2 = 1.5\cdot10^{-5}\,\text{m}$, הרבה פחות מ-$H$. בלי אוויר הנפילה הייתה נמשכת $\sqrt{2H/g} = 14\,\text{s}$ בלבד.' }
          - { kind: result, text: '$x(t) = v_t\left[t - \tau\left(1 - e^{-t/\tau}\right)\right]$ ו-$T = H/v_t + \tau \approx 23\,\text{h}$. בפועל זרמי אוויר ואידוי משפיעים הרבה לפני כן: טיפות ערפל לא מגיעות לקרקע בנפילה.' }
        rubric:
          - text: 'כתבתי את $x(t)$ כאינטגרל של $v(t)$ וקיבלתי $v_t\left[t - \tau\left(1 - e^{-t/\tau}\right)\right]$.'
          - text: הראיתי שבזמן ארוך $x \approx v_t(t - \tau)$, וקיבלתי $T = H/v_t + \tau$.
          - text: בדקתי שבזמן קצר $x \approx \tfrac12gt^2$, ושכש-$\tau$ זניח לעומת $H/v_t$ נשאר $T = H/v_t$, תנועה במהירות קבועה.
          - text: הצבתי וקיבלתי כ-$23\,\text{h}$, וראיתי ש-$\tau$ זניח לעומת $H/v_t$.

  # ------------------------------------------------------------ 2: a helical slide: vector derivatives, angles, arc length
  - id: Q-0-bagrut-2
    type: bagrut
    title: מגלשה לוליינית
    prompt: >-
      מגלשה בפארק מים מתפתלת סביב עמוד אנכי. במודל פשוט, המגלש נע על סליל ברדיוס $R = 3.0\,\text{m}$ סביב הציר $z$
      (כלפי מעלה), במהירות זוויתית קבועה $\omega = 1.0\,\text{rad/s}$, ויורד בקצב קבוע $u = 0.80\,\text{m/s}$:
      $$\vec r(t) = \left(R\cos\omega t,\ R\sin\omega t,\ H - ut\right)$$

# Lesson 6.1 question bank: the comprehension ladder of "חוק הכבידה ומשפט הקליפה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). YAML note: plain, single-quoted and >- strings keep backslashes literally; never "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (.scratch/ch6/q.ts):
#   GM_E = 6.67e-11 · 5.97e24 = 3.982e14 m³/s², g_s = GM_E/R_E² = 9.81 m/s² (R_E = 6.37e6 m);
#   inside a uniform Earth g(R/2) = g_s/2 = 4.91 m/s² (full mass at R/2: 39.3; M(r) over R²: 1.23);
#   tunnel through the centre: T = 2π√(R_E³/GM_E) = 5062 s = 84.4 min (one way 42.2, 1/ω 13.4, to the centre 21.1);
#   lifting 1000 kg from R_E to 2R_E: ΔU = GM_E m/(2R_E) = 3.13e10 J (mgh with h = R_E: 6.24e10 J).

chapter: 6
questions:
  # ---------------------------------------------------------------- OBJ-6.1-1 gravitational force and potential energy
  - id: Q-6.1-force-distance
    type: mc
    objectives: [OBJ-6.1-1]
    qualitative: true
    level: basic
    prompt: >-
      שני כדורים נמשכים זה לזה בכוח כבידה שגודלו $F$. מרחיקים אותם כך שהמרחק בין המרכזים שלהם גדל פי 3, והמסות
      לא משתנות. מה גודל כוח הכבידה ביניהם עכשיו?
    choices:
      - text: $F/9$
        correct: true
        feedback: >-
          נכון. לפי חוק הכבידה $F = \dfrac{Gm_1m_2}{r^2}$: הכוח הפוך לריבוע המרחק, ולכן מרחק פי 3 נותן כוח קטן פי
          $3^2 = 9$.
      - text: $F/3$
        feedback: >-
          זה היה נכון אילו הכוח היה הפוך למרחק עצמו. בחוק הכבידה המרחק מופיע בריבוע, $F = Gm_1m_2/r^2$, ולכן הכוח
          קטן פי 9.
        misconception: MC-6-gravity-inverse-r
      - text: $F$, כי כוח הכבידה תלוי רק במסות.
        feedback: >-
          המסות קובעות את המכפלה $Gm_1m_2$, אבל הכוח תלוי גם במרחק בין המרכזים. גוף רחוק מכדור הארץ שוקל פחות מאשר על
          פני הקרקע.
      - text: $F/27$
        feedback: 'הכוח הולך כמו $1/r^2$, לא כמו $1/r^3$. מרחק פי 3 נותן $1/3^2 = 1/9$.'
    hints:
      - 'כתבו את חוק הכבידה של ניוטון, והציבו $3r$ במקום $r$.'

  - id: Q-6.1-net-direction
    type: vector
    objectives: [OBJ-6.1-1]
    level: basic
    prompt: >-
      שתי מסות שוות $M$ קבועות בנקודות $(-d,\,0)$ ו-$(d,\,0)$. הציר $x$ פונה ימינה והציר $y$ כלפי מעלה בדף. גוף
      קטן בעל מסה $m$ נמצא בנקודה $(0,\,d)$, מעל האמצע שבין שתי המסות. מה הכיוון של כוח הכבידה השקול על הגוף הקטן?
    answer: s
    correctFeedback: >-
      נכון. כל מסה מושכת את הגוף לעברה, באלכסון למטה: אחת למטה-שמאלה, השנייה למטה-ימינה, באותו גודל. הרכיבים
      האופקיים מתבטלים, והרכיבים האנכיים מתחברים: השקול כלפי מטה, אל האמצע שבין המסות.
    wrongFeedback: >-
      ציירו את שני הכוחות בנפרד. כל אחד מהם פונה מהגוף הקטן אל המסה שמושכת אותו. אחר כך פרקו כל כוח לרכיב אופקי ולרכיב
      אנכי, וחברו.
    wrong:
      - dir: zero
        feedback: >-
          רק הרכיבים האופקיים מתבטלים. שתי המסות נמצאות מתחת לגוף, ולכן שתיהן מושכות אותו כלפי מטה, והרכיבים האנכיים
          מתחברים.
      - dir: n
        feedback: 'כוח הכבידה תמיד מושך, אף פעם לא דוחה: כל כוח פונה מהגוף אל המסה שמפעילה אותו.'
      - dir: sw
        feedback: 'זה הכוח של המסה השמאלית בלבד. הוסיפו את המשיכה של המסה הימנית, שפונה למטה-ימינה באותו גודל.'
      - dir: se
        feedback: 'זה הכוח של המסה הימנית בלבד. הוסיפו את המשיכה של המסה השמאלית, שפונה למטה-שמאלה באותו גודל.'
    hints:
      - 'כוח כבידה פונה תמיד אל המסה שמפעילה אותו. מה הסימטריה בין שני הכוחות?'

  - id: Q-6.1-potential-sign
    type: twotier
    objectives: [OBJ-6.1-1]
    qualitative: true
    level: mid
    prompt: >-
      האנרגיה הפוטנציאלית הכבידתית של לוויין בעל מסה $m$ במרחק $r$ ממרכז כדור הארץ, שמסתו $M$, היא
      $$U(r) = -\frac{GMm}{r}$$
      כאשר האפס נבחר באינסוף. מעבירים את הלוויין ממסלול ברדיוס $r$ למסלול ברדיוס $2r$. מה קורה ל-$U$?
    choices:
      - text: 'האנרגיה הפוטנציאלית גדלה: היא עוברת מ-$-GMm/r$ ל-$-GMm/(2r)$.'
        correct: true
        feedback: >-
          נכון. $-GMm/(2r)$ גדול מ-$-GMm/r$, כי הוא פחות שלילי. ההפרש, $\Delta U = +\dfrac{GMm}{2r}$, חיובי: צריך להשקיע
          אנרגיה כדי להרחיק גוף מכדור הארץ.
      - text: האנרגיה הפוטנציאלית קטנה, כי הגודל שלה קטן פי 2.
        feedback: >-
          הגודל $|U|$ אכן קטן פי 2, אבל $U$ שלילית. מספר שלילי שהגודל שלו קטן מתקרב לאפס מלמטה, כלומר **גדל**: $-5$ גדול
          מ-$-10$.
        misconception: MC-6-negative-u-magnitude
      - text: 'האנרגיה הפוטנציאלית גדלה פי 2, כי $U = mgh$ והגובה גדל.'
        feedback: >-
          $U = mgh$ הוא קירוב שמתאים רק לגבהים קטנים בהרבה מרדיוס כדור הארץ, שבהם $g$ כמעט קבוע. במרחקים של מסלולים $g$
          משתנה, ו-$U = -GMm/r$ אינה פרופורציונית לגובה.
        misconception: MC-6-mgh-everywhere
      - text: האנרגיה הפוטנציאלית לא משתנה, כי שני המסלולים רחוקים מכדור הארץ.
        feedback: '$U(r)$ משתנה בכל מרחק סופי. רק באינסוף היא מתקרבת לאפס, ושם השינוי בה זניח.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: '$U$ שלילית ומתקרבת לאפס מלמטה כש-$r$ גדל. בהרחקה הכבידה עושה עבודה שלילית, ולכן $U$ גדלה.'
        correct: true
        feedback: >-
          זה הנימוק. $\Delta U = -W_{\text{grav}}$, וכשמרחיקים את הלוויין הכוח פונה פנימה וההעתק החוצה: $W_{\text{grav}} < 0$,
          ולכן $\Delta U > 0$.
      - text: הכוח נחלש עם המרחק, ולכן גם האנרגיה הפוטנציאלית נחלשת.
        feedback: >-
          "נחלשת" מתאר את הגודל $|U|$, לא את הערך. מה שקובע אם $U$ גדלה הוא סימן העבודה של הכבידה, והוא שלילי בהרחקה.
        misconception: MC-6-negative-u-magnitude
      - text: האנרגיה הפוטנציאלית היא הכוח כפול המרחק, $\frac{GMm}{r^2}\cdot r$, ולכן היא קטנה עם $r$.
        feedback: >-
          $U$ אינה מכפלה של הכוח במרחק, אלא מינוס העבודה של הכבידה מאינסוף עד $r$, $U(r) = -\int_\infty^r F\,dr'$. שאלו
          מה סימנה, לא רק מה גודלה.
    hints:
      - 'השוו את שני המספרים $-GMm/r$ ו-$-GMm/(2r)$. איזה מהם גדול יותר?'

  - id: Q-6.1-lift-work
    type: numeric
    objectives: [OBJ-6.1-1]
    level: bagrut
    prompt: >-
      גשושית בעלת מסה $m = 1000\,\text{kg}$ עומדת על פני כדור הארץ. כמה עבודה צריך להשקיע, לכל הפחות, כדי להעלות
      אותה לגובה $h = R_E$ מעל פני הקרקע, כלומר למרחק $2R_E$ ממרכז כדור הארץ, ולהשאיר אותה שם במנוחה? הזניחו את
      האוויר ואת סיבוב כדור הארץ. השתמשו ב-$G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$,
      $M_E = 5.97\cdot10^{24}\,\text{kg}$ ו-$R_E = 6.37\cdot10^{6}\,\text{m}$.
    answer: 3.13e10
    unit: J
    correctFeedback: >-
      נכון. הגשושית מתחילה ומסיימת במנוחה, ולכן העבודה המינימלית היא השינוי באנרגיה הפוטנציאלית:
      $$W = \Delta U = GMm\left(\frac{1}{R_E} - \frac{1}{R_E + h}\right) = \frac{GMm\,h}{R_E(R_E + h)}$$
      עם $h = R_E$: $W = \dfrac{GMm}{2R_E} = \dfrac{3.98\cdot10^{14}\cdot1000}{2\cdot6.37\cdot10^{6}} = 3.13\cdot10^{10}\,\text{J}$.
      **בדיקת גבולות:** כש-$h \ll R_E$, $W \approx \dfrac{GM}{R_E^2}\,m h = mg h$, הביטוי המוכר. ב-$h = R_E$ הקירוב
      הזה מגזים פי 2, כי $g$ קטן בדרך.
    wrongFeedback: >-
      $g$ לא קבוע לאורך הדרך, ולכן $mgh$ לא מתאים. חשבו את ההפרש $U(2R_E) - U(R_E)$ עם $U(r) = -GMm/r$.
    commonWrong:
      - value: 6.24e10
        feedback: >-
          זה $mgh$ עם $h = R_E$, והוא גם $GMm/R_E$, האנרגיה שצריך כדי להרחיק את הגשושית עד אינסוף. אבל בדרך למעלה $g$
          קטן: ב-$2R_E$ הוא רבע מערכו על הקרקע. ההפרש המדויק בין האנרגיות הוא חצי מזה.
        misconception: MC-6-mgh-everywhere
      - value: -3.13e10
        feedback: 'זו העבודה של כוח הכבידה, שפונה פנימה בזמן שהגשושית עולה. אתם מתבקשים לחשב את העבודה שלנו, נגד הכבידה, והיא חיובית.'
    hints:
      - 'העבודה המינימלית שווה לשינוי באנרגיה הפוטנציאלית, כי האנרגיה הקינטית אפס בהתחלה ובסוף.'
      - 'כתבו $\Delta U$ בצורה כללית עם $h$, ובדקו מה קורה כש-$h \ll R_E$.'

  # ---------------------------------------------------------------- OBJ-6.1-2 the shell theorem outside and inside
  - id: Q-6.1-shell-inside
    type: mc
    objectives: [OBJ-6.1-2]
    qualitative: true
    level: basic
    prompt: >-
      קליפה כדורית דקה ואחידה, בעלת מסה $M$ ורדיוס $R$, תלויה בחלל. גוף קטן נמצא בתוכה, במרחק $R/2$ מהמרכז, קרוב
      יותר לצד אחד של הקליפה. מה כוח הכבידה שהקליפה מפעילה עליו?
    choices:
      - text: אפס.
        correct: true
        feedback: >-
          נכון. לפי משפט הקליפה, הכוח של קליפה כדורית אחידה על גוף שבתוכה הוא אפס בכל מקום בתוכה, לא רק במרכז. החלק
          הקרוב של הקליפה מושך חזק יותר, אבל החלק הרחוק גדול יותר, והם מתאזנים בדיוק כשהכוח הולך כמו $1/r^2$.
      - text: כוח לכיוון הדופן הקרובה, כי היא קרובה יותר.
        feedback: >-
          הדופן הקרובה אכן מושכת חזק יותר כל יחידת מסה שלה, אבל יש בה פחות מסה: קונוס צר מהגוף פוגש פיסה קטנה של הקליפה
          הקרובה, ופיסה גדולה יותר של הרחוקה. השטח גדל כמו $r^2$ והכוח קטן כמו $1/r^2$, והתרומות מתבטלות.
        misconception: MC-6-shell-zero-only-center
      - text: 'כוח לכיוון המרכז, שגודלו $\dfrac{GMm}{(R/2)^2}$.'
        feedback: >-
          כאילו כל המסה מרוכזת במרכז: זה נכון רק **מחוץ** לקליפה. בתוכה המסה לא "מתחת" לגוף אלא מכל עבריו, והמשיכות
          מתבטלות.
        misconception: MC-6-inside-full-mass
      - text: כוח לכיוון הדופן הרחוקה, כי שם רוב המסה.
        feedback: >-
          בצד הרחוק אכן יותר מסה, אבל היא רחוקה יותר, והכוח שלה חלש יותר באותה מידה בדיוק. משפט הקליפה אומר שהשקול
          אפס בכל נקודה בתוך הקליפה.
        misconception: MC-6-shell-zero-only-center
    hints:
      - 'משפט הקליפה עוסק בשני מקרים: גוף מחוץ לקליפה וגוף בתוכה. מה הוא אומר על המקרה השני?'

  - id: Q-6.1-g-rank
    type: rank
    objectives: [OBJ-6.1-2]
    qualitative: true
    level: mid
    prompt: >-
      מודל: כדור הארץ הוא כדור אחיד בעל רדיוס $R$, ודרכו קודחים פירים צרים. סדרו את גודל תאוצת הכבידה $g$ בארבע
      הנקודות, מהגדול לקטן.
    items:
      - { id: a, label: 'במרחק $R/2$ מהמרכז, בתוך הכדור' }
      - { id: b, label: 'על פני הכדור, במרחק $R$ מהמרכז' }
      - { id: c, label: 'במרחק $3R/4$ מהמרכז, בתוך הכדור' }
      - { id: d, label: 'במרחק $2R$ מהמרכז, מחוץ לכדור' }
    order: [b, c, a, d]
    correctFeedback: >-
      נכון. בתוך כדור אחיד מושכת רק המסה שבתוך הרדיוס $r$, $M(r) = M\,r^3/R^3$, ולכן $g(r) = \dfrac{GM(r)}{r^2} = g_s\dfrac{r}{R}$:
      $0.75\,g_s$ ב-$3R/4$ ו-$0.5\,g_s$ ב-$R/2$. בחוץ $g = g_s\left(\dfrac{R}{r}\right)^2$: $0.25\,g_s$ ב-$2R$. הכבידה
      הכי חזקה על פני השטח.
    wrongFeedback: >-
      בתוך הכדור, לפי משפט הקליפה, הקליפות שמעל הנקודה לא מושכות בכלל. כתבו את המסה שבתוך רדיוס $r$ ואת $g(r)$, ובנפרד
      את $g$ מחוץ לכדור.
    hints:
      - 'איזה חלק מהמסה מושך גוף שנמצא במרחק $r < R$ מהמרכז?'

  - id: Q-6.1-g-inside
    type: numeric
    objectives: [OBJ-6.1-2]
    level: mid
    prompt: >-
      מודל: כדור הארץ הוא כדור אחיד בעל מסה $M_E = 5.97\cdot10^{24}\,\text{kg}$ ורדיוס $R_E = 6.37\cdot10^{6}\,\text{m}$.
      מה גודל תאוצת הכבידה בתחתית פיר צר שמגיע לעומק $R_E/2$, כלומר במרחק $R_E/2$ מהמרכז? השתמשו ב-$G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$.
    answer: 4.91
    unit: m/s²
    correctFeedback: >-
      נכון. המסה שבתוך הרדיוס $R_E/2$ היא $M_E/8$, ולכן
      $$g = \frac{G\,M_E/8}{(R_E/2)^2} = \frac{1}{2}\cdot\frac{GM_E}{R_E^2} = \frac{9.81}{2} = 4.91\,\text{m/s}^2$$
      בתוך כדור אחיד $g$ גדל בקו ישר עם המרחק מהמרכז, ובמרכז הוא אפס.
    wrongFeedback: >-
      לפי משפט הקליפה, השכבות שמעל הפיר לא מושכות. מצאו איזה חלק מהמסה נמצא בתוך הרדיוס $R_E/2$ (הנפח הולך כמו $r^3$),
      וחשבו $g = GM(r)/r^2$.
    commonWrong:
      - value: 39.3
        feedback: >-
          שמתם את כל מסת כדור הארץ במרחק $R_E/2$, $GM_E/(R_E/2)^2 = 4g_s$. כך הכבידה הייתה גדלה ככל שיורדים, והייתה
          אינסופית במרכז. אבל השכבות שמעליכם לא מושכות, ורק שמינית מהמסה נמצאת מתחתיכם.
        misconception: MC-6-inside-full-mass
      - value: 1.23
        feedback: 'לקחתם נכון את המסה $M_E/8$, אבל חילקתם ב-$R_E^2$. המרחק אל מרכז המסה המושכת הוא $R_E/2$, ולכן מחלקים ב-$(R_E/2)^2$.'
      - value: 9.81
        feedback: 'זו התאוצה על פני השטח. בתוך הכדור היא לא נשארת קבועה: רק המסה שמתחת לנקודה מושכת, והיא קטנה ככל שיורדים.'
    hints:
      - 'מסה בתוך רדיוס $r$ בכדור אחיד: $M(r) = M_E\left(\dfrac{r}{R_E}\right)^3$.'

  - id: Q-6.1-tunnel-period
    type: numeric
    objectives: [OBJ-6.1-2]
    level: bagrut
    prompt: >-
      קודחים מנהרה ישרה דרך מרכז כדור הארץ, מצד אחד לצד השני, ומשחררים בפתח שלה כדור ממנוחה. מודל: כדור הארץ כדור אחיד
      ($M_E = 5.97\cdot10^{24}\,\text{kg}$, $R_E = 6.37\cdot10^{6}\,\text{m}$, $G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$),
      בלי אוויר, בלי חיכוך ובלי סיבוב. הכדור נע הלוך ושוב במנהרה. מה זמן המחזור של התנועה, בדקות?
    answer: 84.4
    unit: min
    correctFeedback: >-
      נכון. במרחק $r$ מהמרכז הכוח הוא $F = -\dfrac{GM(r)m}{r^2} = -\dfrac{GM_Em}{R_E^3}\,r$: כוח מחזיר שפרופורציוני
      להעתק, כמו של קפיץ. זו תנועה הרמונית עם $\omega = \sqrt{GM_E/R_E^3}$, ולכן
      $$T = 2\pi\sqrt{\frac{R_E^3}{GM_E}} = 5.06\cdot10^{3}\,\text{s} = 84.4\,\text{min}$$
      **בדיקת גבולות ויחידות:** $\sqrt{R^3/(GM)} = \sqrt{R/g_s}$ ביחידות שניות. וזה בדיוק זמן המחזור של לוויין במסלול
      מעגלי צמוד לפני הקרקע: ההיטל של תנועה מעגלית אחידה על קוטר הוא תנועה הרמונית באותו זמן מחזור.
    wrongFeedback: >-
      כתבו את הכוח על הכדור במרחק $r$ מהמרכז בעזרת משפט הקליפה. אם הוא מהצורה $F = -\kappa r$, התנועה הרמונית עם
      $\omega = \sqrt{\kappa/m}$.
    commonWrong:
      - value: 42.2
        feedback: 'זה הזמן להגיע לצד השני, חצי מחזור. מחזור שלם הוא הלוך וחזור: הכדור חוזר לפתח שממנו שוחרר.'
      - value: 13.4
        feedback: 'זה $1/\omega = \sqrt{R_E^3/(GM_E)}$, בלי $2\pi$. זמן המחזור הוא $T = 2\pi/\omega$.'
      - value: 21.1
        feedback: 'זה הזמן עד המרכז, רבע מחזור. מחזור שלם הוא עד הצד השני וחזרה.'
    hints:
      - 'בתוך הכדור $g(r) = g_s\,r/R_E$. איזה סוג של כוח זה?'
      - 'השוו לקפיץ: $m\ddot r = -\kappa r$ נותן $\omega^2 = \kappa/m$.'

  - id: Q-6.1-tunnel-chord
    type: mc
    objectives: [OBJ-6.1-2]

# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). Notation: k = Gm₁m₂, μ the reduced mass, L the angular momentum, a the semi-major axis;
# dA/dt = L/(2μ), T² = 4π²a³/(G(m₁+m₂)), E = −k/(2a). YAML note: never "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (.scratch/ch6/q.ts), GM_E = 3.982e14, GM_S = 1.327e20 m³/s²,
# 1 yr = 3.156e7 s (T(1 AU) = 1.004 yr with these constants):

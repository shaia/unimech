#   2000 kg, perigee 500 km and apogee 4000 km above the ground: a = 8.62e6 m, E = −GMm/(2a) = −4.62e10 J
#     (altitudes only −1.77e11, without the 2 −9.24e10, a = r_p −5.80e10);
#   comet r_p = 0.59 AU, r_a = 35 AU: a = 17.8 AU, T = 75.4 yr (a = r_a 208, a = (r_a − r_p)/2 71.6).

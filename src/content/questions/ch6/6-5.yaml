  - id: Q-6.5-period-from-speed
    type: numeric
    objectives: [OBJ-6.5-2]
    level: bagrut
    prompt: >-
      גשושית נמצאת במרחק $2.00\cdot10^{7}\,\text{m}$ ממרכז כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$), ונעה
      במהירות $3.50\,\text{km/s}$ בכיוון שיוצר זווית של $60^\circ$ עם הקו מכדור הארץ אליה. המנועים כבויים, ומלבד כדור הארץ
      אין כוחות. מה זמן המחזור של המסלול שלה, בשעות?
    answer: 4.80
    unit: h
    correctFeedback: >-
      נכון. האנרגיה ליחידת מסה לא תלויה בכיוון המהירות: $\varepsilon = \tfrac12v^2 - \dfrac{GM_E}{r} = -1.38\cdot10^{7}\,\text{J/kg}$.
      מ-$\varepsilon = -\dfrac{GM_E}{2a}$ יוצא $a = 1.44\cdot10^{7}\,\text{m}$, ומהחוק השלישי
      $T = 2\pi\sqrt{a^3/(GM_E)} = 1.73\cdot10^{4}\,\text{s} = 4.80\,\text{h}$. **בדיקת גבולות:** אילו המהירות הייתה
      ניצבת לרדיוס ושווה למהירות המעגלית, $\sqrt{GM_E/r}$, היה יוצא $a = r$, המסלול המעגלי. הזווית קובעת את $L$ ואת
      הצורה, לא את $a$ ולא את $T$.
    wrongFeedback: 'זמן המחזור נקבע על ידי $a$, ו-$a$ על ידי האנרגיה. חשבו את האנרגיה ליחידת מסה ברגע הנתון.'
    commonWrong:
      - value: 4.10
        feedback: 'השתמשתם רק ברכיב הניצב לרדיוס, $v\sin60^\circ$. באנרגיה הקינטית נכנס כל גודל המהירות: $\tfrac12v^2$.'
      - value: 3.12
        feedback: 'השתמשתם רק ברכיב שלאורך הרדיוס, $v\cos60^\circ$. באנרגיה הקינטית נכנס כל גודל המהירות.'
      - value: 7.82
        feedback: 'הנחתם שהמסלול מעגלי, $a = r$. אבל המהירות לא ניצבת לרדיוס ולא שווה למהירות המעגלית: את $a$ קובעת האנרגיה.'
      - value: 13.6
        feedback: 'שכחתם את ה-2: $\varepsilon = -GM_E/(2a)$, ולכן $a = GM_E/(2|\varepsilon|)$.'
    hints:
      - 'האם האנרגיה הקינטית תלויה בכיוון של המהירות?'
      - '$a = -\dfrac{GM_E}{2\varepsilon}$, ואז החוק השלישי.'

chapter: 6
questions:
  # ---------------------------------------------------------------- OBJ-6.5-1 deriving Kepler's three laws
  - id: Q-6.5-second-law-why
    type: mc
    objectives: [OBJ-6.5-1]
    qualitative: true
    level: basic
    prompt: >-
      החוק השני של קפלר: הקו שבין השמש לכוכב לכת מכסה שטחים שווים בזמנים שווים. מאיזה חוק שימור הוא נובע, ובאילו
      כוחות הוא נכון?
    choices:
      - text: 'משימור התנע הזוויתי, $\dfrac{dA}{dt} = \dfrac{L}{2\mu}$, ולכן הוא נכון בכל כוח מרכזי.'
        correct: true
        feedback: >-
          נכון. בזמן $dt$ הקו מכסה משולש צר בשטח $dA = \tfrac12r^2\,d\theta$, ולכן $\dfrac{dA}{dt} = \tfrac12r^2\dot\theta = \dfrac{L}{2\mu}$.
          בכוח מרכזי $L$ קבוע, בלי קשר לתלות של הכוח במרחק.
      - text: משימור האנרגיה, כי כוכב הלכת מהיר יותר כשהוא קרוב.
        feedback: >-
          שימור האנרגיה אכן אומר שהוא מהיר יותר כשהוא קרוב, אבל לא כמה. השטח ליחידת זמן הוא $\tfrac12r^2\dot\theta$,
          והגודל הזה קבוע בגלל שימור התנע הזוויתי.
      - text: משימור התנע הזוויתי, אבל רק בכוח שהולך כמו $1/r^2$.
        feedback: >-
          הצורה האליפטית והחוק השלישי דורשים $1/r^2$. החוק השני דורש רק כוח מרכזי, $\vec r\times\vec F = 0$, ונכון גם
          לכוח של קפיץ או לכל $f(r)$ אחר.
        misconception: MC-6-l-needs-inverse-square
      - text: הוא נכון רק במסלול מעגלי, שבו המהירות קבועה.
        feedback: >-
          במסלול מעגלי הוא טריוויאלי. החוק אומר משהו דווקא באליפסה: קרוב לשמש הקו קצר, ולכן הוא חייב להסתובב מהר יותר
          כדי לכסות אותו שטח.
        misconception: MC-6-l-only-circular
    hints:
      - 'מה השטח של משולש צר שצלעותיו $r$ והזווית ביניהן $d\theta$?'

  - id: Q-6.5-areal-speed
    type: numeric
    objectives: [OBJ-6.5-1]
    level: mid
    prompt: >-
      שביט נע סביב השמש באליפסה. בנקודת הקרבה הוא במרחק $0.60\,\text{AU}$ מהשמש ומהירותו $53.4\,\text{km/s}$, ונקודת
      הריחוק שלו במרחק $18\,\text{AU}$. מה מהירותו בנקודת הריחוק?
    answer: 1.78
    unit: km/s
    correctFeedback: >-
      נכון. בשתי נקודות המפנה המהירות ניצבת לרדיוס, ולכן לפי החוק השני $\tfrac12r_pv_p = \tfrac12r_av_a$:
      $v_a = v_p\dfrac{r_p}{r_a} = 53.4\cdot\dfrac{0.60}{18} = 1.78\,\text{km/s}$. היחס בין המרחקים הוא 30, והשביט איטי פי
      30 בנקודת הריחוק.
    wrongFeedback: 'בנקודת הקרבה ובנקודת הריחוק $\vec v \perp \vec r$, ולכן $L = \mu rv$ בשתיהן. השוו.'
    commonWrong:
      - value: 1602
        feedback: 'הפכתם את היחס: רחוק מהשמש השביט איטי, לא מהיר. $r_pv_p = r_av_a$, ולכן $v_a = v_pr_p/r_a$.'
      - value: 0.0593
        feedback: 'העליתם את יחס המרחקים בריבוע. בתנע הזוויתי המרחק מופיע בחזקה ראשונה, $L = \mu rv$ כשהמהירות ניצבת לרדיוס.'
      - value: 9.75
        feedback: 'לקחתם שורש של יחס המרחקים, כמו בהשוואה בין מהירויות של מסלולים מעגליים. כאן זה אותו מסלול, ו-$L$ קבוע לאורכו: $v \propto 1/r$ בנקודות המפנה.'
    hints:
      - 'מה הזווית בין המהירות לרדיוס בנקודת קרבה ובנקודת ריחוק?'

  - id: Q-6.5-planet-mass
    type: twotier
    objectives: [OBJ-6.5-1]
    qualitative: true
    level: mid
    prompt: >-
      שני כוכבי לכת מקיפים אותו כוכב במסלולים בעלי אותו חצי ציר ראשי $a$. מסת כוכב הלכת השני גדולה פי 10 מזו של הראשון,
      ושתיהן זניחות לעומת מסת הכוכב $M$. איך משתווים זמני המחזור שלהם זה לזה?
    choices:
      - text: כמעט שווים; זמן המחזור של הכבד קצר מעט יותר.
        correct: true
        feedback: >-
          נכון. $T^2 = \dfrac{4\pi^2a^3}{G(M + m)}$. כש-$m \ll M$ ההבדל זניח, אבל הוא קיים: בכוכב לכת כבד יותר גם הכוכב
          המרכזי נע יותר, והתנועה היחסית מהירה מעט יותר.
      - text: הכבד מקיף מהר יותר בהרבה, כי הכוח עליו גדול פי 10.
        feedback: >-
          הכוח אכן גדול פי 10, אבל גם האינרציה של כוכב הלכת גדולה פי 10. התאוצה שלו, $GM/r^2$, לא תלויה במסה שלו. מסת
          כוכב הלכת משפיעה רק דרך התנועה של הכוכב, שהוא מושך, כלומר דרך הסכום $M + m$, וכאן זה הבדל זניח.
        misconception: MC-6-period-depends-on-planet-mass
      - text: הכבד מקיף לאט יותר, כי קשה יותר להזיז אותו.
        feedback: 'האינרציה הגדולה מתקזזת בדיוק עם הכוח הגדול, כמו בנפילה חופשית. מה שנשאר הוא תלות חלשה דרך הסכום $M + m$.'
        misconception: MC-6-period-depends-on-planet-mass
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'הכוח והאינרציה שניהם פרופורציוניים ל-$m$, ומה שנשאר בחוק השלישי הוא $M + m \approx M$.'
        correct: true
        feedback: 'זה הנימוק. בגזירה $k/\mu = Gm_1m_2/\mu = G(m_1 + m_2)$: המסה של כוכב הלכת נכנסת רק דרך הסכום.'
      - text: הכוח על כוכב הלכת הכבד גדול פי 10.
        feedback: 'נכון שהכוח גדול פי 10, אבל זה לא נימוק לזמן מחזור שונה: התאוצה היא הכוח חלקי המסה.'
        misconception: MC-6-period-depends-on-planet-mass
      - text: החוק השלישי של קפלר נכון רק לכוכבי הלכת של מערכת השמש.
        feedback: 'החוק השלישי נגזר מחוקי ניוטון לכל זוג גופים שמושכים זה את זה בכבידה, גם בכוכב כפול וגם בלוויינים.'
    hints:
      - 'כתבו את החוק השלישי של קפלר לשני גופים. איפה מופיעה בו מסת כוכב הלכת, ועד כמה היא משנה?'

  - id: Q-6.5-third-law-derivation
    type: mc
    objectives: [OBJ-6.5-1]
    qualitative: true
    level: mid
    prompt: >-
      בגזירת החוק השלישי מחלקים את שטח האליפסה בקצב כיסוי השטח: $T = \dfrac{\pi ab}{L/(2\mu)}$, עם $b^2 = ap$ ו-$p = \dfrac{L^2}{\mu k}$.
      מתקבל $T^2 = \dfrac{4\pi^2\mu}{k}a^3 = \dfrac{4\pi^2a^3}{G(m_1 + m_2)}$. כאן $a$ ו-$b$ חצאי הצירים של האליפסה, $p$
      פרמטר המסלול, $L$ התנע הזוויתי של התנועה היחסית, $\mu$ המסה המצומצמת ו-$k = Gm_1m_2$. מאיפה בא סכום המסות?
    choices:
      - text: 'מהיחס $k/\mu$: $\dfrac{Gm_1m_2}{m_1m_2/(m_1 + m_2)} = G(m_1 + m_2)$.'
        correct: true
        feedback: >-
          נכון. $T^2 = \dfrac{4\pi^2a^3}{k/\mu}$, והיחס בין עוצמת הכוח לאינרציה של התנועה היחסית הוא $G(m_1 + m_2)$. כאן $a$
          הוא חצי הציר הראשי של המסלול **היחסי**, מגוף לגוף. **בדיקת גבולות:** כש-$m_1 \ll m_2$ מתקבל $T^2 = 4\pi^2a^3/(Gm_2)$,
          החוק שקפלר מצא לכוכבי הלכת.
      - text: 'מהשטח $\pi ab$, שתלוי במסות של שני הגופים.'
        feedback: 'השטח $\pi ab$ הוא גיאומטריה של האליפסה בלבד. המסות נכנסות דרך $L/(2\mu)$ ודרך $p = L^2/(\mu k)$.'
      - text: 'זה תיקון קירובי: הגוף הכבד קבוע, ואת המסה של הקל מוסיפים בסוף.'
        feedback: >-
          הגזירה עם $\mu$ מדויקת, בלי שום קירוב: היא כבר כוללת את התנועה של שני הגופים. הגוף הכבד קבוע רק בגבול
          $m_1 \to 0$, כשמסת הגוף הקל זניחה.
        misconception: MC-6-heavy-body-fixed
      - text: 'מ-$a$, שנמדד ממרכז המסה ולא מהגוף הכבד.'
        feedback: 'ב-$T^2 \propto a^3/(m_1 + m_2)$, $a$ הוא חצי הציר של המסלול היחסי, ממרכז גוף אחד למרכז השני. הסכום בא מ-$k/\mu$.'
    hints:
      - 'הציבו $b = \sqrt{ap}$ ו-$p = L^2/(\mu k)$ ב-$T^2$, ובדקו מה נשאר מ-$L$ ומ-$\mu$.'

  - id: Q-6.5-spring-kepler
    type: mc
    objectives: [OBJ-6.5-1]
    qualitative: true
    level: bagrut
    prompt: >-
      דסקית בעלת מסה $m$ נעה על שולחן אופקי חלק, קשורה בקפיץ לנקודה קבועה $C$ על השולחן. אורכו הרפוי של הקפיץ אפס,
      ולכן הכוח שלו על הדסקית הוא $\vec F = -k_s\vec r$, כאשר $\vec r$ המקום של הדסקית ביחס ל-$C$ ו-$k_s$ קבוע הקפיץ.
      כשנותנים לדסקית מהירות הצידה, היא נעה באליפסה שהמרכז שלה ב-$C$. משווים שתי תנועות כאלה, שבאחת כל ממדי האליפסה
      גדולים פי 2 מאשר בשנייה. מה נכון?
    choices:
      - text: הקו מ-$C$ לדסקית מכסה שטחים שווים בזמנים שווים בשתיהן, וזמני המחזור שלהן שווים.
        correct: true
        feedback: >-
          נכון. הכוח מרכזי ביחס ל-$C$, ולכן התנע הזוויתי ביחס ל-$C$ נשמר, וזה כל מה שהחוק השני צריך. אבל באליפסה
          גדולה פי 2 הכוח גדל פי 2 יחד עם המרחק, וכך גם התאוצה: זו אותה תנועה בדיוק, מוגדלת, באותו זמן. זמן המחזור הוא
          $T = 2\pi\sqrt{m/k_s}$ של מתנד, לכל גודל של אליפסה, ולא $T \propto a^{3/2}$. וגם $C$ במרכז האליפסה, לא במוקד: מחוקי
          קפלר נשאר רק השני. **בדיקת גבולות:** כשהמהירות ההתחלתית היא לאורך הקפיץ, האליפסה נמעכת לקו, והדסקית מתנודדת דרך $C$
          באותו זמן מחזור.
      - text: 'השטחים שווים בזמנים שווים בשתיהן, וזמן המחזור של הגדולה ארוך פי $2^{3/2}$, כמו בחוק השלישי.'
        feedback: >-
          החוק השלישי נגזר מכוח שהולך כמו $1/r^2$: השתמשנו ב-$p = L^2/(\mu k)$, שנכון רק בכבידה. בכבידה, ככל שהמסלול
          גדול יותר הכוח חלש יותר; בקפיץ הוא חזק יותר, בדיוק ביחס למרחק, ולכן זמן המחזור לא משתנה.
      - text: 'השטחים לא שווים בזמנים שווים, כי הכוח לא הולך כמו $1/r^2$.'
        feedback: >-
          החוק השני הוא היחיד שלא תלוי בצורת הכוח: הוא נובע משימור התנע הזוויתי, $\vec r\times\vec F = 0$, בכל כוח
          מרכזי. הכוח של הקפיץ מכוון תמיד אל $C$.
        misconception: MC-6-l-needs-inverse-square
      - text: 'השטחים שווים בזמנים שווים, וזמן המחזור של הגדולה ארוך פי 2, כי הדרך ארוכה פי 2.'
        feedback: >-
          הדרך אכן ארוכה פי 2, אבל גם המהירות: הכוח, ולכן התאוצה, גדלים פי 2 בכל נקודה מקבילה. הזמן לא משתנה, כמו
          בזמן המחזור של מתנד הרמוני, שלא תלוי באמפליטודה.
    hints:
      - 'מה צריך החוק השני: כוח מרכזי בלבד, או כוח שהולך כמו $1/r^2$? ומה צריך החוק השלישי?'
      - 'מה קורה לכוח של הקפיץ ולתאוצה כשמגדילים את כל המסלול פי 2?'

  # ---------------------------------------------------------------- OBJ-6.5-2 period, semi-major axis and energy
  - id: Q-6.5-same-a
    type: mc
    objectives: [OBJ-6.5-2]
    qualitative: true
    level: basic
    prompt: >-
      שני לוויינים זהים מקיפים את כדור הארץ, שרדיוסו $R$. לוויין A במסלול מעגלי ברדיוס $2R$. לוויין B באליפסה שנקודת הקרבה
      שלה במרחק $1.2R$ ממרכז כדור הארץ ונקודת הריחוק במרחק $2.8R$. מה נכון?
    choices:
      - text: לשניהם אותה אנרגיה ואותו זמן מחזור.
        correct: true
        feedback: >-
          נכון. ל-B, $a = \dfrac{1.2R + 2.8R}{2} = 2R$, כמו הרדיוס של A. האנרגיה $E = -\dfrac{GMm}{2a}$ וזמן המחזור
          $T \propto a^{3/2}$ תלויים רק ב-$a$, לא באקסצנטריות.
      - text: ל-B זמן מחזור ארוך יותר, כי הוא מגיע רחוק יותר.
        feedback: >-
          B אכן מגיע רחוק יותר, אבל גם קרוב יותר, ושם הוא מהיר. החוק השלישי אומר שהשניים מתקזזים בדיוק: זמן המחזור תלוי
          רק ב-$a$.
        misconception: MC-6-period-depends-on-e
      - text: ל-B אנרגיה גדולה יותר, כי בנקודת הקרבה הוא מהיר יותר מ-A.
        feedback: >-
          בנקודת הקרבה B מהיר יותר, אבל גם האנרגיה הפוטנציאלית שלו שם נמוכה יותר. הסכום קבוע לאורך המסלול, ושווה
          $-GMm/(2a)$, כמו של A.
        misconception: MC-6-period-depends-on-e
      - text: ל-A זמן מחזור ארוך יותר, כי המסלול המעגלי ארוך יותר.
        feedback: 'היקף האליפסה קצר מעט מהיקף המעגל, אבל זמן המחזור לא נקבע על ידי האורך בלבד. הוא תלוי רק ב-$a$, ושניהם עם $a = 2R$.'
    hints:
      - 'חשבו את חצי הציר הראשי של B.'

  - id: Q-6.5-mars-period
    type: numeric
    objectives: [OBJ-6.5-2]
    level: basic
    prompt: >-

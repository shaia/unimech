    level: bagrut
    prompt: >-
      שביט עובר בנקודת הקרבה שלו לשמש במרחק $r_p = 0.50\,\text{AU}$ (כאשר $1\,\text{AU} = 1.5\cdot10^{11}\,\text{m}$), במהירות
      $v_p = 55\,\text{km/s}$, ניצבת לקו אל השמש. מסת השמש $M_S = 1.99\cdot10^{30}\,\text{kg}$, ומסת השביט זניחה. מה
      האקסצנטריות של המסלול? השתמשו ב-$G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$.

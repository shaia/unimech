# Lesson 6.4 question bank: the comprehension ladder of "משוואת המסלול וחתכי חרוט".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). Notation: k = Gm₁m₂, μ the reduced mass, L the angular momentum, u = 1/r,
# r = p/(1 + e cos θ) with p = L²/(μk) and e² = 1 + 2EL²/(μk²). YAML note: never "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (.scratch/ch6/q.ts), GM_E = 3.982e14, GM_S = 1.327e20 m³/s²:
#   p = 1.2e7 m, e = 0.40: r_a = p/(1 − e) = 2.00e7 m (r_p 8.57e6, p(1 + e) 1.68e7, a = p/(1 − e²) 1.43e7);
#   u'' + (1 − δ)u = C, δ = 0.010: periapsis every 360°/√(1 − δ) = 361.81°, advance 1.81° (360δ = 3.6);
#   ε = −1.5e7 J/kg, h = 6.5e10 m²/s: e² = 0.201, e = 0.448 (sign flipped 1.34, factor 2 dropped 0.775);
#   comet r_p = 0.50 AU, v_p = 55 km/s: e = r_p v_p²/(GM_S) − 1 = 0.709 (without −1: 1.71, e² = 0.503).

chapter: 6
questions:
  # ---------------------------------------------------------------- OBJ-6.4-1 the orbit equation gives a conic
  - id: Q-6.4-why-u
    type: mc
    objectives: [OBJ-6.4-1]
    qualitative: true
    level: basic
    prompt: >-
      כדי למצוא את צורת המסלול מחליפים משתנה, $u = 1/r$, ומשתמשים בזווית $\theta$ במקום בזמן. בכבידה מתקבלת המשוואה
      $$\frac{d^2u}{d\theta^2} + u = \frac{\mu k}{L^2}$$
      למה ההחלפה הזו מועילה?
    choices:
      - text: המשוואה ל-$u(\theta)$ ליניארית עם אגף ימין קבוע, כמו מתנד הרמוני תחת כוח קבוע, ופתרונה ידוע.
        correct: true
        feedback: >-
          נכון. הפתרון הוא קבוע ועוד קוסינוס: $u = \dfrac{\mu k}{L^2} + A\cos(\theta - \theta_0)$. במשתנה $r$ המשוואה לא
          ליניארית, ופתרונה לא נראה לעין.
      - text: היא נותנת ישירות את $r$ כפונקציה של הזמן.
        feedback: >-
          היא נותנת את **צורת** המסלול, $r(\theta)$, ולא את $r(t)$. את הזמן מוציאים מהמשוואה בעזרת
          $\dot\theta = L/(\mu r^2)$, וזה בדיוק מה שמפשט אותה.
      - text: ב-$u$ כוח הכבידה נעשה קבוע.
        feedback: >-
          הכוח הוא $F = -ku^2$, לא קבוע. מה שקבוע הוא אגף ימין של המשוואה, אחרי שמחלקים ב-$u^2$, ורק בכוח שהולך כמו
          $1/r^2$.
      - text: היא נכונה רק למסלולים מעגליים, ושם $u$ קבוע.
        feedback: 'המשוואה נכונה לכל מסלול בכוח הזה. מסלול מעגלי הוא רק הפתרון הפרטי עם $A = 0$.'
    hints:
      - 'איזו משוואה מכירים מהפרק על מתנדים שנראית כך, עם $\theta$ במקום $t$?'

  - id: Q-6.4-solution
    type: mc
    objectives: [OBJ-6.4-1]
    level: mid
    prompt: >-
      הפתרון הכללי של $\dfrac{d^2u}{d\theta^2} + u = \dfrac{\mu k}{L^2}$ הוא $u = \dfrac{\mu k}{L^2} + A\cos\theta$ (כשבוחרים
      $\theta = 0$ בנקודה הקרובה ביותר). מה צורת המסלול $r(\theta)$?
    choices:
      - text: '$r = \dfrac{p}{1 + e\cos\theta}$ עם $p = \dfrac{L^2}{\mu k}$ ו-$e = \dfrac{AL^2}{\mu k}$'
        correct: true
        feedback: >-
          נכון. $r = 1/u = \dfrac{1}{(\mu k/L^2)(1 + e\cos\theta)}$. זו המשוואה של חתך חרוט בקואורדינטות קוטביות, כשהראשית
          במוקד. $p$ ביחידות מטר, ו-$e$ חסר ממדים.
      - text: '$r = p\,(1 + e\cos\theta)$ עם $p = \dfrac{L^2}{\mu k}$'
        feedback: 'שכחתם להפוך: $u$ הוא $1/r$. הביטוי $1 + e\cos\theta$ שייך ל-$u$, ולכן הוא במכנה של $r$.'
      - text: '$r = \dfrac{p}{1 + e\cos\theta}$ עם $p = \dfrac{\mu k}{L^2}$'
        feedback: 'בדקו יחידות: $\mu k/L^2$ הוא $u$, ביחידות $1/\text{m}$. הפרמטר $p$ הוא ההופכי שלו, $L^2/(\mu k)$, במטרים.'
      - text: '$r = \dfrac{p}{1 + e\cos\theta}$ עם $p = \dfrac{L^2}{2\mu k}$'
        feedback: >-
          $L^2/(2\mu k)$ הוא הרדיוס שבו $U_{\text{eff}}$ מתאפס. הפרמטר $p$ הוא ההופכי של אגף ימין במשוואה,
          $L^2/(\mu k)$: הרדיוס של המסלול המעגלי בעל אותו תנע זוויתי.
    hints:
      - 'הוציאו את $\mu k/L^2$ כגורם משותף, והפכו.'

  - id: Q-6.4-focus
    type: twotier
    objectives: [OBJ-6.4-1]
    qualitative: true
    level: mid
    prompt: >-
      מסלול של כוכב לכת הוא $r = \dfrac{p}{1 + e\cos\theta}$ עם $0 < e < 1$, כאשר $r$ נמדד מהשמש. איפה נמצאת השמש ביחס
      לאליפסה?
    choices:
      - text: באחד המוקדים של האליפסה.
        correct: true
        feedback: >-
          נכון. זה החוק הראשון של קפלר: המסלול אליפסה והשמש באחד המוקדים. המרכז של האליפסה נמצא באמצע בין נקודת הקרבה
          לנקודת הריחוק, במרחק $ae$ מהשמש.
      - text: במרכז האליפסה.
        feedback: >-
          אילו השמש הייתה במרכז, המרחק ממנה לשני קצות הציר הראשי היה שווה. אבל ב-$\theta = 0$ המרחק $p/(1 + e)$ וב-$\theta = \pi$
          הוא $p/(1 - e)$, שונה. אליפסה סביב המרכז מתקבלת מכוח של קפיץ, $\vec F = -\kappa\vec r$, לא מכבידה.
        misconception: MC-6-ellipse-center-at-sun
      - text: בנקודת הקרבה, על המסלול עצמו.
        feedback: 'בנקודת הקרבה $r = p/(1 + e) > 0$: כוכב הלכת לא מגיע לשמש. השמש בתוך האליפסה, במוקד.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'המרחקים מהשמש לשני קצות הציר הראשי, $p/(1 + e)$ ו-$p/(1 - e)$, שונים, ולכן השמש לא באמצע ביניהם.'
        correct: true
        feedback: >-
          זה הנימוק. הסכום שלהם הוא $2a$, הציר הראשי, וההפרש $2ae$: השמש מוזזת מהמרכז במרחק $ae$, בדיוק המרחק של מוקד
          ממרכז האליפסה.
      - text: האליפסה סימטרית, ולכן הכוח חייב לבוא ממרכז הסימטריה.
        feedback: 'לאליפסה שתי נקודות מיוחדות על הציר הראשי מלבד המרכז: המוקדים. המשוואה בקואורדינטות קוטביות מראה שהראשית באחד מהם.'
        misconception: MC-6-ellipse-center-at-sun
      - text: הכוח הכי חזק בנקודת הקרבה, ולכן השמש שם.
        feedback: 'הכוח הכי חזק בנקודת הקרבה מפני שהיא הכי קרובה לשמש, לא מפני שהשמש עליה. המרחק שם הוא $p/(1 + e)$, לא אפס.'
    hints:
      - 'חשבו את $r$ ב-$\theta = 0$ וב-$\theta = \pi$. האם הם שווים?'

  - id: Q-6.4-apoapsis-from-p
    type: numeric
    objectives: [OBJ-6.4-1]
    level: mid
    prompt: >-
      מסלול של לוויין סביב כדור הארץ הוא $r = \dfrac{p}{1 + e\cos\theta}$ עם $p = 1.2\cdot10^{7}\,\text{m}$ ו-$e = 0.40$,
      כאשר $r$ נמדד ממרכז כדור הארץ. מה המרחק של נקודת הריחוק ממרכז כדור הארץ?
    answer: 2.0e7
    unit: m
    correctFeedback: >-
      נכון. $r$ מקסימלי כש-$\cos\theta = -1$: $r_a = \dfrac{p}{1 - e} = \dfrac{1.2\cdot10^{7}}{0.60} = 2.0\cdot10^{7}\,\text{m}$.
      נקודת הקרבה ב-$\theta = 0$: $r_p = p/(1 + e) = 8.57\cdot10^{6}\,\text{m}$, וחצי הציר הראשי $a = (r_p + r_a)/2 = 1.43\cdot10^{7}\,\text{m}$.
    wrongFeedback: 'איפה המכנה $1 + e\cos\theta$ הכי קטן? הציבו את הזווית הזו.'
    commonWrong:
      - value: 8.57e6
        feedback: 'זו נקודת הקרבה, ב-$\theta = 0$, כשהמכנה הכי גדול. נקודת הריחוק היא כשהמכנה הכי קטן, ב-$\theta = \pi$.'
      - value: 1.68e7
        feedback: 'כפלתם את $p$ ב-$1 + e$. $p$ מחולק במכנה, ונקודת הריחוק היא $p/(1 - e)$.'
      - value: 1.43e7
        feedback: 'זה חצי הציר הראשי, $a = p/(1 - e^2)$, הממוצע של נקודת הקרבה ונקודת הריחוק. נקודת הריחוק רחוקה יותר.'
    hints:
      - 'ב-$\theta = \pi$, $\cos\theta = -1$.'

  - id: Q-6.4-precession
    type: numeric
    objectives: [OBJ-6.4-1]
    level: bagrut
    prompt: >-
      נניח שבנוסף לכבידה פועל על כוכב לכת כוח מרכזי קטן נוסף, כך שמשוואת המסלול נעשית
      $$\frac{d^2u}{d\theta^2} + (1 - \delta)\,u = C$$
      כאשר $C$ קבוע ו-$\delta = 0.010$. במסלול כזה נקודת הקרבה לא חוזרת לאותו מקום אחרי סיבוב: היא מתקדמת. בכמה מעלות
      מתקדמת נקודת הקרבה בכל סיבוב?
    answer: 1.81
    unit: °
    correctFeedback: >-
      נכון. הפתרון הוא $u = \dfrac{C}{1 - \delta} + A\cos\left(\sqrt{1 - \delta}\,\theta\right)$, ונקודת הקרבה חוזרת
      כשהארגומנט של הקוסינוס גדל ב-$2\pi$:
      $$\Delta\theta = \frac{360^\circ}{\sqrt{1 - \delta}} = 361.81^\circ$$
      ההתקדמות היא $1.81^\circ$ לסיבוב. **בדיקת גבולות:** כש-$\delta \to 0$, $\Delta\theta \to 360^\circ$ והמסלול נסגר: זו
      אליפסה של כוח $1/r^2$ טהור. ל-$\delta$ קטן, $\Delta\theta - 360^\circ \approx 180^\circ\cdot\delta$.
    wrongFeedback: >-
      פתרו את המשוואה כמו מתנד עם "תדירות" $\sqrt{1 - \delta}$ במקום 1. אחרי איזו זווית $\theta$ הקוסינוס חוזר לערך
      המקסימלי?
    commonWrong:
      - value: 361.81
        feedback: 'זו הזווית בין שתי נקודות קרבה עוקבות. השאלה שואלת בכמה היא עולה על סיבוב שלם, $360^\circ$.'
      - value: 3.6
        feedback: >-
          זה $360^\circ\cdot\delta$: שכחתם את השורש. התדירות היא $\sqrt{1 - \delta} \approx 1 - \delta/2$, ולכן ההתקדמות
          היא בערך חצי מזה.
    hints:
      - 'הפתרון של $u'''' + \Omega^2u = C$ הוא $u = C/\Omega^2 + A\cos(\Omega\theta)$.'

  # ---------------------------------------------------------------- OBJ-6.4-2 eccentricity from E and L; classifying orbits
  - id: Q-6.4-classify
    type: mc
    objectives: [OBJ-6.4-2]
    qualitative: true
    level: basic
    prompt: >-
      שביט מגיע ממרחק עצום אל מערכת השמש, והאנרגיה שלו $E > 0$ (עם האפס של האנרגיה הפוטנציאלית באינסוף). מה צורת המסלול
      שלו סביב השמש?
    choices:
      - text: היפרבולה.
        correct: true
        feedback: >-
          נכון. $e^2 = 1 + \dfrac{2EL^2}{\mu k^2} > 1$ כש-$E > 0$, והחתך עם $e > 1$ הוא היפרבולה. השביט חולף פעם אחת על פני
          השמש ובורח, ובאינסוף עוד נשארת לו מהירות.
      - text: פרבולה, כי הוא לא קשור לשמש.
        feedback: >-
          פרבולה, $e = 1$, היא המקרה הגבולי $E = 0$ בדיוק: הגוף מגיע לאינסוף במהירות אפס. עם $E > 0$ הוא מגיע לאינסוף
          במהירות שונה מאפס, והמסלול היפרבולה.
        misconception: MC-6-unbound-is-parabola
      - text: אליפסה מאוד מוארכת, והוא יחזור אחרי זמן רב.
        feedback: 'אליפסה מתאימה ל-$E < 0$. עם $E > 0$ אין נקודת ריחוק: $U_{\text{eff}} \to 0$ באינסוף, והקו $E$ נשאר מעליו.'
      - text: קו ישר, כי הכבידה חלשה מדי כדי לעקם את המסלול.
        feedback: 'כל עוד $L \neq 0$ הכבידה מעקמת את המסלול. גם שביט מהיר מאוד נע בהיפרבולה, רק פתוחה מאוד.'
    hints:
      - 'כתבו את $e$ בעזרת $E$ ו-$L$. מה הסימן של $e^2 - 1$?'

  - id: Q-6.4-e-rank
    type: rank
    objectives: [OBJ-6.4-2]
    qualitative: true
    level: mid
    prompt: >-
      לארבעה גופים סביב אותו מרכז כבידה יש אותו תנע זוויתי $L$ ואנרגיות שונות. נסמן $E_0 = \dfrac{\mu k^2}{2L^2}$. סדרו
      את האקסצנטריות של המסלולים, מהגדולה לקטנה.
    items:
      - { id: a, label: '$E = -E_0$' }
      - { id: b, label: '$E = -E_0/2$' }
      - { id: c, label: '$E = 0$' }
      - { id: d, label: '$E = +E_0$' }
    order: [d, c, b, a]
    correctFeedback: >-
      נכון. $e^2 = 1 + E/E_0$: $\sqrt2 \approx 1.41$ להיפרבולה ($+E_0$), $1$ לפרבולה ($0$), $1/\sqrt2 \approx 0.71$ לאליפסה
      ($-E_0/2$), ו-$0$ למעגל ($-E_0$, המינימום של $U_{\text{eff}}$). אנרגיה גבוהה יותר באותו $L$ נותנת מסלול מוארך יותר.
    wrongFeedback: 'הציבו כל אנרגיה ב-$e^2 = 1 + \dfrac{2EL^2}{\mu k^2} = 1 + E/E_0$.'
    hints:
      - 'מה $e$ כש-$E$ הוא המינימום של $U_{\text{eff}}$?'

  - id: Q-6.4-same-energy
    type: twotier
    objectives: [OBJ-6.4-2]
    qualitative: true
    level: mid
    prompt: >-
      לשני לוויינים סביב כדור הארץ אותה מסה ואותה אנרגיה $E < 0$, אבל ללוויין 1 תנע זוויתי גדול יותר מללוויין 2. לאיזה
      מהם מסלול בעל אקסצנטריות גדולה יותר?
    choices:
      - text: ללוויין 2, בעל התנע הזוויתי הקטן.
        correct: true
        feedback: >-
          נכון. $e^2 = 1 - \dfrac{2|E|L^2}{\mu k^2}$, ותנע זוויתי קטן משאיר את $e^2$ קרוב יותר ל-1. בגבול $L \to 0$ המסלול
          נעשה קו ישר שעובר דרך המרכז, $e \to 1$.
      - text: ללוויין 1, בעל התנע הזוויתי הגדול.
        feedback: 'תנע זוויתי גדול פירושו תנועה משיקית רבה, כמו במסלול מעגלי. באותה אנרגיה, למסלול המעגלי יש התנע הזוויתי הגדול ביותר.'
      - text: לשניהם אותה אקסצנטריות, כי האנרגיה שלהם שווה.
        feedback: >-
          האנרגיה קובעת את חצי הציר הראשי, $a = -k/(2E)$, אבל לא את האקסצנטריות. באותו $a$ יכולים להיות מעגל ואליפסה
          מוארכת, לפי $L$.
        misconception: MC-6-e-depends-on-energy-only
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: '$e^2 = 1 + \dfrac{2EL^2}{\mu k^2}$ עם $E < 0$: ככל ש-$L$ קטן, מחסירים פחות מ-1.'
        correct: true
        feedback: 'זה הנימוק. $E$ קבוע ושלילי, ולכן $e^2$ יורד כש-$L^2$ גדל, עד $e = 0$ במסלול המעגלי.'
      - text: האקסצנטריות נקבעת רק על ידי האנרגיה.
        feedback: 'בנוסחה ל-$e$ מופיעה המכפלה $EL^2$: שני הגדלים קובעים אותה יחד.'
        misconception: MC-6-e-depends-on-energy-only
      - text: לוויין עם תנע זוויתי גדול נע מהר יותר, ולכן מתרחק יותר.
        feedback: 'באותה אנרגיה שני הלוויינים מגיעים לאותו ממוצע של נקודת הקרבה ונקודת הריחוק, $a$. $L$ קובע איך המרחק הזה מתחלק.'
    hints:
      - 'כתבו את הנוסחה ל-$e^2$ ושימו לב לסימן של $E$.'

  - id: Q-6.4-e-from-el
    type: numeric
    objectives: [OBJ-6.4-2]
    level: mid
    prompt: >-
      ללוויין סביב כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$, מסת הלוויין זניחה) יש אנרגיה ליחידת מסה
      $\varepsilon = -1.5\cdot10^{7}\,\text{J/kg}$ ותנע זוויתי ליחידת מסה $h = 6.5\cdot10^{10}\,\text{m}^2/\text{s}$. מה
      האקסצנטריות של המסלול?
    answer: 0.448
    unit: ''
    correctFeedback: >-
      נכון. ליחידת מסה $e^2 = 1 + \dfrac{2\varepsilon h^2}{(GM_E)^2} = 1 - \dfrac{2\cdot1.5\cdot10^{7}\cdot(6.5\cdot10^{10})^2}{(3.98\cdot10^{14})^2} = 0.201$,
      ולכן $e = 0.448$. $0 < e < 1$: אליפסה, כמו שמתאים ל-$E < 0$.
    wrongFeedback: 'בנוסחה $e^2 = 1 + 2EL^2/(\mu k^2)$ חלקו מונה ומכנה ב-$m^3$: מתקבל $e^2 = 1 + 2\varepsilon h^2/(GM_E)^2$.'
    commonWrong:
      - value: 0.201

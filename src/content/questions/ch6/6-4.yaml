    correctFeedback: >-
      נכון. ליחידת מסה, $h = r_pv_p$ ו-$\varepsilon = \tfrac12v_p^2 - GM_S/r_p$. הצבה ב-$e^2 = 1 + 2\varepsilon h^2/(GM_S)^2$
      נותנת ריבוע שלם:
      $$e^2 = \left(\frac{r_pv_p^2}{GM_S} - 1\right)^2\ \Rightarrow\ e = \frac{r_pv_p^2}{GM_S} - 1 = \frac{7.5\cdot10^{10}\cdot(5.5\cdot10^{4})^2}{1.33\cdot10^{20}} - 1 = 0.709$$
      $e < 1$, ולכן השביט קשור לשמש. **בדיקת גבולות:** כש-$v_p = \sqrt{GM_S/r_p}$, המהירות המעגלית, $e = 0$; וכש-$v_p = \sqrt{2GM_S/r_p}$,

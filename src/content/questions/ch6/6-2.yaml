#   μ(3M_S, M_S) = 0.75 M_S = 1.49e30 kg (sum 7.96e30, lighter 1.99e30);
#   2.0 kg + 6.0 kg at 0.50 m: F = 3.20e-9 N, a_rel = G(m₁+m₂)/d² = 2.13e-9 m/s² (one body fixed: 1.60e-9);
#   asteroids 1e12 + 3e12 kg from 10 km to 1 km: v_rel = √(2G(m₁+m₂)(1/d − 1/d₀)) = 0.693 m/s

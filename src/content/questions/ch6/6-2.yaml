#     radius 1188 km): D·m_C/(m_P+m_C) = 2140 km from Pluto's centre, outside Pluto (midpoint 9800, from Charon
#     17500). It replaced an Earth–Moon question (4670 km), because the lesson computes the Earth–Moon number.

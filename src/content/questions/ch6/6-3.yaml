  - id: Q-6.3-circular-radius
    type: numeric
    objectives: [OBJ-6.3-2]
    level: mid
    prompt: >-
      ללוויין בעל מסה $m = 1000\,\text{kg}$ סביב כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$) יש תנע זוויתי
      $L = 7.0\cdot10^{13}\,\text{kg}\cdot\text{m}^2/\text{s}$, ו-$\mu \approx m$. מה הרדיוס של המסלול המעגלי בעל התנע
      הזוויתי הזה?
    answer: 1.23e7
    unit: m
    correctFeedback: >-
      נכון. המסלול המעגלי במינימום של $U_{\text{eff}}$:
      $$\frac{dU_{\text{eff}}}{dr} = -\frac{L^2}{mr^3} + \frac{GM_Em}{r^2} = 0$$
      ולכן $r_0 = \dfrac{L^2}{m^2GM_E} = 1.23\cdot10^{7}\,\text{m}$,
      כשתי פעמים רדיוס כדור הארץ. בדיקה: $v = L/(mr_0) = 5.69\,\text{km/s} = \sqrt{GM_E/r_0}$, המהירות המעגלית.
    wrongFeedback: 'גזרו את $U_{\text{eff}}(r)$ לפי $r$, השוו לאפס ובודדו את $r$.'
    commonWrong:
      - value: 6.16e6
        feedback: >-
          זו הנקודה שבה $U_{\text{eff}} = 0$, כלומר $r = L^2/(2m^2GM_E)$. המסלול המעגלי לא שם אלא במינימום, שבו
          **הנגזרת** מתאפסת, רחוק פי 2.
        misconception: MC-6-circular-where-ueff-zero
      - value: 1.23e10
        feedback: 'במכנה צריך $m^2$: אחת מהמחסום $L^2/(2mr^2)$ ואחת מהכבידה $GM_Em/r$. בדקו שהיחידות יוצאות מטרים.'
    hints:
      - '$U_{\text{eff}}(r) = \dfrac{L^2}{2mr^2} - \dfrac{GM_Em}{r}$.'

  - id: Q-6.3-periapsis-from-h-eps
    type: numeric
    objectives: [OBJ-6.3-2]
    level: mid
    prompt: >-
      ללוויין שמסתו זניחה, סביב כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$), יש תנע זוויתי ליחידת מסה
      $h = 6.6\cdot10^{10}\,\text{m}^2/\text{s}$ ואנרגיה ליחידת מסה $\varepsilon = -1.4\cdot10^{7}\,\text{J/kg}$. מה המרחק של נקודת
      הקרבה שלו ממרכז כדור הארץ?
    answer: 7.40e6
    unit: m
    correctFeedback: >-
      נכון. בנקודות המפנה $\dot r = 0$, ולכן $u_{\text{eff}}(r) = \varepsilon$, ואחרי כפל ב-$r^2$:
      $$\varepsilon r^2 + GM_E\,r - \tfrac12h^2 = 0$$
      $$r = \frac{-GM_E \pm \sqrt{(GM_E)^2 + 2\varepsilon h^2}}{2\varepsilon}$$
      $\varepsilon$ שלילית, ולכן השורש עם הסימן $+$ הוא הקטן, נקודת הקרבה: $r_p = 7.40\cdot10^{6}\,\text{m}$, והשני נקודת הריחוק, $r_a = 2.10\cdot10^{7}\,\text{m}$.
      **בדיקה:** סכום השורשים $GM_E/|\varepsilon| = 2.84\cdot10^{7}\,\text{m}$, כמו שצריך, והמינימום של הבור, ב-$h^2/GM_E = 1.09\cdot10^{7}\,\text{m}$,
      נמצא ביניהם.
    wrongFeedback: >-
      בנקודת מפנה $\dot r = 0$, ולכן $\varepsilon = \dfrac{h^2}{2r^2} - \dfrac{GM_E}{r}$. כפלו ב-$r^2$ ופתרו את המשוואה
      הריבועית. נקודת הקרבה היא השורש הקטן.
    commonWrong:
      - value: 2.10e7
        feedback: 'זה השורש הגדול, נקודת הריחוק. השאלה מבקשת את נקודת הקרבה, השורש הקטן.'
      - value: 1.09e7
        feedback: >-
          זה $h^2/GM_E$, הרדיוס של המסלול המעגלי בעל אותו תנע זוויתי, המינימום של הבור. כאן $\varepsilon$ גבוהה מהמינימום,
          ולכן הקו חותך את הבור בשתי נקודות, משני צדי המינימום.
      - value: 2.84e7
        feedback: 'זה $GM_E/|\varepsilon|$, סכום שני השורשים, $r_p + r_a$, ולא אחד מהם.'
      - value: 5.47e6
        feedback: >-
          זה $h^2/(2GM_E)$, הרדיוס שבו $u_{\text{eff}} = 0$: נקודת המפנה של מסלול שבו $\varepsilon = 0$. כאן $\varepsilon$
          שלילית, והקו חותך את העקומה נמוך יותר, רחוק יותר מהמרכז.
    hints:
      - 'בנקודת מפנה $\dot r = 0$, ולכן $\varepsilon = u_{\text{eff}}(r)$.'
      - 'אחרי כפל ב-$r^2$ מקבלים משוואה ריבועית ב-$r$. לה שני שורשים חיוביים; איזה מהם נקודת הקרבה?'

  - id: Q-6.3-turning-points
    type: numeric
    objectives: [OBJ-6.3-2]
    level: bagrut
    prompt: >-
      לוויין שמסתו זניחה נמצא ברגע מסוים במרחק $r = 9.0\cdot10^{6}\,\text{m}$ ממרכז כדור הארץ
      ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$). רכיב המהירות שלו לאורך הרדיוס, החוצה, הוא $2.0\,\text{km/s}$, והרכיב
      הניצב לרדיוס הוא $7.0\,\text{km/s}$. המנועים כבויים. מה המרחק המקסימלי שהלוויין יגיע אליו ממרכז כדור הארץ?
    answer: 1.50e7
    unit: m
    correctFeedback: >-
      נכון. ליחידת מסה, עם $v_\theta$ הרכיב הניצב לרדיוס: $h = rv_\theta = 6.30\cdot10^{10}\,\text{m}^2/\text{s}$ (רק הרכיב הניצב), ו-$\varepsilon = \tfrac12(v_r^2 + v_\theta^2) - GM_E/r = -1.77\cdot10^{7}\,\text{J/kg}$
      (כל המהירות). $\varepsilon < 0$, ולכן המסלול קשור. בנקודות המפנה $\dot r = 0$, כלומר $\varepsilon = h^2/(2r^2) - GM_E/r$,
      ואחרי כפל ב-$r^2$:
      $$\varepsilon r^2 + GM_E\,r - \tfrac12h^2 = 0$$
      השורשים: $r_p = 7.47\cdot10^{6}\,\text{m}$ ו-$r_a = 1.50\cdot10^{7}\,\text{m}$. הנקודה הנתונה, $9.0\cdot10^{6}\,\text{m}$, ביניהם,
      כמו שצריך. **בדיקת גבולות:** אילו $v_r$ היה אפס, הנקודה הנתונה הייתה בעצמה נקודת מפנה, ואחד השורשים היה יוצא
      $9.0\cdot10^{6}\,\text{m}$ בדיוק.
    wrongFeedback: >-
      קודם מצאו את $h$ ואת $\varepsilon$ מהמצב הנתון: ב-$h$ נכנס רק הרכיב הניצב לרדיוס, וב-$\varepsilon$ שני הרכיבים. אחר כך
      נקודות המפנה: $\varepsilon = h^2/(2r^2) - GM_E/r$, משוואה ריבועית ב-$r$. הנקודה הנתונה איננה נקודת מפנה, כי $v_r \neq 0$.
    commonWrong:
      - value: 7.47e6
        feedback: 'זה השורש הקטן, נקודת הקרבה. השאלה מבקשת את נקודת הריחוק, השורש הגדול.'
      - value: 2.24e7
        feedback: 'זה $GM_E/|\varepsilon|$, סכום שני השורשים, $r_p + r_a$. כדי לקבל את $r_a$ צריך לפתור את המשוואה עד הסוף.'
      - value: 1.34e7
        feedback: >-
          חישבתם את $h$ עם כל המהירות, $r\sqrt{v_r^2 + v_\theta^2}$. אבל התנע הזוויתי ליחידת מסה הוא $|\vec r\times\vec v| = rv_\theta$:
          הרכיב לאורך הרדיוס לא תורם לו.
      - value: 1.12e7
        feedback: >-
          השמטתם את $\tfrac12v_r^2$ מהאנרגיה, כאילו הנקודה הנתונה היא נקודת מפנה. היא לא: $v_r = 2.0\,\text{km/s}$, והאנרגיה
          הקינטית הרדיאלית הזו חלק מ-$\varepsilon$.
      - value: 9.97e6
        feedback: >-
          זה $h^2/GM_E$, הרדיוס של המסלול המעגלי בעל אותו תנע זוויתי, המינימום של הפוטנציאל האפקטיבי. ל-$\varepsilon$ של הלוויין
          יש יותר אנרגיה מהמינימום, והוא נע בין שתי נקודות מפנה משני צדדיו.
    hints:
      - 'ליחידת מסה: $h = |\vec r\times\vec v| = rv_\theta$, כש-$v_\theta$ הרכיב הניצב לרדיוס, ו-$\varepsilon = \tfrac12v^2 - GM_E/r$ עם כל המהירות.'
      - 'בנקודת מפנה $\dot r = 0$: $\varepsilon = \dfrac{h^2}{2r^2} - \dfrac{GM_E}{r}$. משוואה ריבועית ב-$r$, והשורש הגדול הוא נקודת הריחוק.'

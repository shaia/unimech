chapter: 6
questions:
  # ---------------------------------------------------------------- OBJ-6.3-1 the energy with the effective potential
  - id: Q-6.3-l-conserved
    type: mc
    objectives: [OBJ-6.3-1]
    qualitative: true
    level: basic
    prompt: >-
      על גוף פועל רק כוח מרכזי, $\vec F = f(r)\,\hat r$, שכיוונו תמיד לאורך הקו אל נקודה קבועה. איזה גודל נשמר בתנועה,
      ולמה?
    choices:
      - text: 'התנע הזוויתי $\vec L$ סביב הנקודה, כי מומנט הכוח $\vec r\times\vec F$ אפס.'
        correct: true
        feedback: >-
          נכון. $\vec F \parallel \vec r$, ולכן $\vec r\times\vec F = 0$ ו-$d\vec L/dt = 0$. מכאן גם שהתנועה כולה במישור
          אחד, המישור הניצב ל-$\vec L$, ושאפשר לתאר אותה בשתי קואורדינטות קוטביות, $r$ ו-$\theta$.
      - text: התנע הזוויתי, אבל רק כשהמסלול מעגלי.
        feedback: >-
          ההוכחה, $\vec r\times\vec F = 0$, לא משתמשת בצורת המסלול. גם באליפסה ארוכה $L = \mu r^2\dot\theta$ קבוע: כש-$r$
          קטן, $\dot\theta$ גדל.
        misconception: MC-6-l-only-circular
      - text: 'התנע הקווי $\vec p$, כי הכוח מרכזי.'
        feedback: 'על הגוף פועל כוח, ולכן $d\vec p/dt = \vec F \neq 0$. מה שמתאפס הוא המומנט של הכוח, לא הכוח עצמו.'
      - text: גודל המהירות, כי הכוח תמיד ניצב לתנועה.
        feedback: >-
          הכוח ניצב לתנועה רק במסלול מעגלי. במסלול כללי יש לו רכיב לאורך המהירות, והגוף מאיץ ומאט: הוא מהיר ליד נקודת
          הקרבה ואיטי ליד נקודת הריחוק.
    hints:
      - '$\dfrac{d\vec L}{dt} = \vec r\times\vec F$. מה המכפלה הווקטורית של שני וקטורים מקבילים?'

  - id: Q-6.3-ueff-form
    type: mc
    objectives: [OBJ-6.3-1]
    level: basic
    prompt: >-
      בתנועה היחסית של שני גופים בכבידה, עם $k = Gm_1m_2$, מסה מצומצמת $\mu$ ותנע זוויתי $L$, כותבים את האנרגיה בצורה
      $E =\tfrac12\mu\dot r^2 + U_{\text{eff}}(r)$. מה $U_{\text{eff}}(r)$?
    choices:
      - text: '$\dfrac{L^2}{2\mu r^2} - \dfrac{k}{r}$'
        correct: true
        feedback: >-
          נכון. האנרגיה הקינטית היא $\tfrac12\mu\dot r^2 + \tfrac12\mu r^2\dot\theta^2$, ועם $\dot\theta = L/(\mu r^2)$ החלק
          הזוויתי הוא $L^2/(2\mu r^2)$. הוא מצטרף לאנרגיה הפוטנציאלית $-k/r$, ונשארת משוואה במשתנה אחד, $r$.
      - text: '$-\dfrac{L^2}{2\mu r^2} - \dfrac{k}{r}$'
        feedback: 'האיבר $L^2/(2\mu r^2)$ הוא אנרגיה קינטית, ולכן חיובי. הוא מה שמונע מגוף עם $L \neq 0$ ליפול למרכז.'
      - text: '$\dfrac{L^2}{2\mu r} - \dfrac{k}{r}$'
        feedback: >-
          בדקו יחידות: $L^2/(\mu r)$ ביחידות $\text{J}\cdot\text{m}$, לא אנרגיה. מ-$\tfrac12\mu r^2\dot\theta^2$ עם
          $\dot\theta = L/(\mu r^2)$ יוצא $1/r^2$.
      - text: '$\tfrac12\mu\dot r^2 + \dfrac{L^2}{2\mu r^2} - \dfrac{k}{r}$'
        feedback: 'זו האנרגיה כולה, $E$. הפוטנציאל האפקטיבי הוא מה שנשאר אחרי שמוציאים את האנרגיה הקינטית של התנועה הרדיאלית.'
    hints:
      - 'פרקו את המהירות לרכיב רדיאלי $\dot r$ ולרכיב משיקי $r\dot\theta$, והחליפו את $\dot\theta$ בעזרת $L = \mu r^2\dot\theta$.'

  - id: Q-6.3-centrifugal-term
    type: twotier
    objectives: [OBJ-6.3-1]
    qualitative: true
    level: mid
    prompt: >-
      בפוטנציאל האפקטיבי $U_{\text{eff}}(r) = \dfrac{L^2}{2\mu r^2} - \dfrac{k}{r}$ יש איבר דוחה, $\dfrac{L^2}{2\mu r^2}$,
      שגדל מאוד כש-$r \to 0$. מה הוא מבחינה פיזיקלית?
    choices:
      - text: האנרגיה הקינטית של התנועה המשיקית, כתובה בעזרת התנע הזוויתי.
        correct: true
        feedback: >-
          נכון. $\tfrac12\mu(r\dot\theta)^2 = \dfrac{L^2}{2\mu r^2}$. כש-$L$ קבוע, התקרבות למרכז מחייבת מהירות משיקית
          גדולה יותר, והאנרגיה לכך באה מהתנועה הרדיאלית: לכן היא מתנהגת כמו מחסום.
      - text: האנרגיה הפוטנציאלית של כוח אמיתי שדוחף את הגוף החוצה, הכוח הצנטריפוגלי.
        feedback: >-
          במערכת אינרציאלית פועלת על הגוף רק הכבידה, והיא מושכת פנימה. האיבר הוא אנרגיה קינטית, שכתבנו כפונקציה של $r$
          כדי שהבעיה תהיה חד-ממדית. "כוח" צנטריפוגלי מופיע רק כשעוברים למערכת מסתובבת.
        misconception: MC-6-centrifugal-real-force
      - text: תיקון שנובע מהתנועה של הגוף הכבד.
        feedback: 'התנועה של שני הגופים כבר נכנסה דרך $\mu$. האיבר קיים גם כשהגוף הכבד קבוע לגמרי, ואז $\mu = m$.'
      - text: האנרגיה הפוטנציאלית הכבידתית במרחקים קטנים, שבהם חוק הכבידה משתנה.
        feedback: 'חוק הכבידה לא משתנה במרחקים קטנים. האיבר לא תלוי בכלל ב-$G$: הוא קיים בכל כוח מרכזי, וגם בגוף חופשי.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: '$L = \mu r^2\dot\theta$ קבוע, ולכן $\dot\theta = L/(\mu r^2)$ ו-$\tfrac12\mu r^2\dot\theta^2 = L^2/(2\mu r^2)$.'
        correct: true
        feedback: 'זה הנימוק. החלפנו משתנה שמשתנה, $\dot\theta$, בקבוע $L$, והאנרגיה הקינטית המשיקית הפכה לפונקציה של $r$ בלבד.'
      - text: במערכת האינרציאלית פועל על הגוף כוח צנטריפוגלי שדוחף אותו החוצה.
        feedback: >-
          במערכת אינרציאלית אין כוח כזה. גוף שנע בקו ישר, בלי כוח בכלל, מתקרב לכל נקודה שאינה על הקו עד מרחק מינימלי,
          ואז מתרחק ממנה: גם לגוף חופשי $r(t)$ יורד עד מינימום ואז עולה, וזה כל מה שהאיבר מתאר.
        misconception: MC-6-centrifugal-real-force
      - text: האיבר קבוע, כי התנע הזוויתי נשמר.
        feedback: '$L$ קבוע, אבל $r$ משתנה, ולכן $L^2/(2\mu r^2)$ משתנה עם $r$. זה מה שהופך אותו לחלק מהפוטנציאל.'
    hints:
      - 'בדקו מה מקבלים עבור גוף חופשי, $k = 0$. האם יש לו "מחסום"?'

  - id: Q-6.3-ueff-value
    type: numeric
    objectives: [OBJ-6.3-1]
    level: mid
    prompt: >-
      גשושית בעלת מסה $m = 200\,\text{kg}$ נמצאת במרחק $r = 1.0\cdot10^{7}\,\text{m}$ ממרכז כדור הארץ
      ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$). רכיב המהירות שלה לאורך הרדיוס, החוצה, הוא $3.0\,\text{km/s}$,
      והרכיב הניצב לרדיוס הוא $5.0\,\text{km/s}$. המסה של הגשושית זניחה ביחס לכדור הארץ, ולכן $\mu \approx m$. מה ערך
      הפוטנציאל האפקטיבי $U_{\text{eff}}(r)$ בנקודה הזו?
    answer: -5.46e9
    unit: J
    correctFeedback: >-
      נכון. $L = m r v_\theta$, כש-$v_\theta$ הרכיב הניצב לרדיוס, ולכן $\dfrac{L^2}{2mr^2} = \tfrac12 m v_\theta^2 = 2.50\cdot10^{9}\,\text{J}$, ו-$-\dfrac{GM_Em}{r} = -7.96\cdot10^{9}\,\text{J}$.
      סכומם $U_{\text{eff}} = -5.46\cdot10^{9}\,\text{J}$. האנרגיה הכוללת גדולה ממנו באנרגיה הקינטית הרדיאלית,
      $\tfrac12mv_r^2 = 9.0\cdot10^{8}\,\text{J}$: $E = -4.56\cdot10^{9}\,\text{J}$.
    wrongFeedback: >-
      $U_{\text{eff}}$ כולל את האנרגיה הפוטנציאלית ואת האנרגיה הקינטית של הרכיב **המשיקי** בלבד. חשבו את
      $L^2/(2mr^2) = \tfrac12mv_\theta^2$ והוסיפו את $-GM_Em/r$.
    commonWrong:
      - value: -4.56e9
        feedback: 'זו האנרגיה הכוללת $E$: הוספתם גם את האנרגיה הקינטית הרדיאלית, $\tfrac12mv_r^2$. היא מה שמבדיל בין $E$ ל-$U_{\text{eff}}$.'
      - value: -7.96e9
        feedback: 'זו האנרגיה הפוטנציאלית הכבידתית בלבד. הפוטנציאל האפקטיבי כולל גם את האיבר $L^2/(2mr^2)$.'
      - value: 2.5e9
        feedback: 'זה רק האיבר $L^2/(2mr^2)$. הוסיפו את האנרגיה הפוטנציאלית הכבידתית $-GM_Em/r$, שהיא שלילית.'
      - value: -2.73e7
        feedback: >-
          זה הפוטנציאל האפקטיבי ליחידת מסה, $u_{\text{eff}}$, ביחידות $\text{J/kg}$. השאלה שואלת על $U_{\text{eff}}$ של
          הגשושית כולה, בג'אולים: הכפילו במסה, $200\,\text{kg}$.
    hints:
      - 'הביעו את $L$ בעזרת הרכיב הניצב לרדיוס בלבד: $L = m r v_\theta$.'

  - id: Q-6.3-inverse-cube
    type: mc
    objectives: [OBJ-6.3-1, OBJ-6.3-2]
    qualitative: true
    level: bagrut
    prompt: >-
      נניח שבעולם אחר הכוח המרכזי בין שני גופים היה $\vec F = -\dfrac{c}{r^3}\hat r$ (עם $c > 0$), ולכן
      $U(r) = -\dfrac{c}{2r^2}$. התנע הזוויתי $L \neq 0$. מה נכון לגבי המסלולים?
    choices:
      - text: 'אין מסלול מעגלי במינימום של $U_{\text{eff}}$: $U_{\text{eff}} = \dfrac{L^2 - \mu c}{2\mu r^2}$ הולך כמו $1/r^2$ ואין לו מינימום.'
        correct: true
        feedback: >-
          נכון. האיבר הדוחה והמושך הולכים שניהם כמו $1/r^2$, ולכן $U_{\text{eff}}$ מונוטוני. אם $L^2 > \mu c$, $U_{\text{eff}}$
          חיובי ויורד: הגוף נדחה ובורח לאינסוף. אם $L^2 < \mu c$, אין מחסום: $U_{\text{eff}}$ שלילי ועולה לאפס, וגוף עם
          $E < 0$, או גוף שנע פנימה, נופל אל המרכז. רק כש-$L^2 = \mu c$ בדיוק $U_{\text{eff}} = 0$ בכל $r$, וכל $r$ יכול להיות
          מעגל; אבל הפרעה קטנה מוציאה את הגוף ממנו, כי אין מינימום שמחזיר אותו: אין כאן שיווי משקל יציב, במובן של שיעור 3.3. בכבידה,
          $-k/r$ חזק יותר מהמחסום רחוק ($1/r$ מול $1/r^2$) וחלש ממנו קרוב, ולכן יש מינימום.
      - text: 'יש מסלול מעגלי במינימום של $U_{\text{eff}}$, כמו בכבידה.'
        feedback: >-
          כתבו את $U_{\text{eff}}$: $\dfrac{L^2}{2\mu r^2} - \dfrac{c}{2r^2} = \dfrac{L^2 - \mu c}{2\mu r^2}$. זו פונקציה
          מהצורה $\text{const}/r^2$, בלי מינימום. בכבידה המינימום נוצר מפני שהמשיכה והמחסום הולכים בחזקות שונות של $r$.
      - text: כל המסלולים קשורים, כי הכוח מושך.
        feedback: >-
          כוח מושך לא מבטיח מסלול קשור. גם בכבידה גוף עם $E \ge 0$ בורח. כאן, עם $L^2 > \mu c$, $U_{\text{eff}}$ חיובי
          ויורד לאפס, וכל גוף בורח לאינסוף.
      - text: התנע הזוויתי לא נשמר, כי הכוח לא הולך כמו $1/r^2$.
        feedback: 'שימור התנע הזוויתי דורש רק שהכוח יהיה מרכזי: $\vec r\times\vec F = 0$ לכל $f(r)$. החזקה של $r$ לא משנה.'
        misconception: MC-6-l-needs-inverse-square
    hints:
      - 'כתבו את $U_{\text{eff}}$ לכוח הזה, וחפשו נקודה שבה $dU_{\text{eff}}/dr = 0$.'

  # ---------------------------------------------------------------- OBJ-6.3-2 reading orbits from U_eff
  - id: Q-6.3-circular-at-minimum
    type: mc
    objectives: [OBJ-6.3-2]
    qualitative: true
    level: basic
    prompt: >-
      בגרף של $U_{\text{eff}}(r) = \dfrac{L^2}{2\mu r^2} - \dfrac{k}{r}$, עבור $L$ נתון, משרטטים קו אופקי בגובה האנרגיה
      $E$. מתי המסלול מעגלי?
    choices:
      - text: 'כש-$E$ שווה לערך המינימלי של $U_{\text{eff}}$, ואז $r$ קבוע ברדיוס של המינימום.'
        correct: true
        feedback: >-
          נכון. אז $\tfrac12\mu\dot r^2 = E - U_{\text{eff}}(r) \ge 0$ מתקיים רק בנקודה אחת, ו-$\dot r = 0$ כל הזמן. במינימום
          גם $dU_{\text{eff}}/dr = 0$: הכבידה היא בדיוק הכוח השקול הרדיאלי שתנועה מעגלית ברדיוס הזה דורשת.
      - text: 'כש-$E = 0$, ואז $r$ קבוע ברדיוס שבו $U_{\text{eff}} = 0$.'
        feedback: >-
          $U_{\text{eff}} = 0$ ברדיוס שבו המחסום והמשיכה שווים בגודלם, אבל שם הנגזרת לא אפס, והגוף לא נשאר שם. זו רק
          נקודת המפנה של המסלול שבו $E = 0$, מסלול לא קשור. המעגל נמצא במינימום, שבו **הנגזרת** מתאפסת, ברדיוס כפול.
        misconception: MC-6-circular-where-ueff-zero
      - text: 'בכל רדיוס שבו $E = U_{\text{eff}}(r)$, כי שם $\dot r = 0$.'
        feedback: >-
          בנקודה שבה $E = U_{\text{eff}}(r)$ אכן $\dot r = 0$, אבל רק לרגע: זו נקודת מפנה, ו-$r$ מתחיל לחזור. המסלול
          מעגלי רק כש-$\dot r = 0$ **כל הזמן**, כלומר כשהנקודה היא המינימום.
      - text: 'כש-$E$ גדולה מאוד, כי אז $U_{\text{eff}}$ זניח.'
        feedback: 'כש-$E \ge 0$ המסלול אפילו לא קשור. המסלול המעגלי הוא בעל האנרגיה **הנמוכה** ביותר עבור $L$ נתון.'
    hints:
      - '$\tfrac12\mu\dot r^2 = E - U_{\text{eff}}(r)$. מתי $\dot r = 0$ לאורך כל התנועה?'

  - id: Q-6.3-bound-statements
    type: multi
    objectives: [OBJ-6.3-2]
    qualitative: true
    level: mid
    prompt: >-
      לוויין נע בשדה הכבידה של כדור הארץ, ו-$L \neq 0$. האנרגיה שלו $E$ נמצאת בין המינימום של $U_{\text{eff}}$ לבין אפס.
      סמנו את כל הטענות הנכונות.
    choices:
      - text: 'יש שתי נקודות מפנה, $r_p$ ו-$r_a$, שבהן $E = U_{\text{eff}}(r)$.'
        correct: true
        feedback: 'נכון. הקו האופקי $E$ חותך את בור הפוטנציאל האפקטיבי בשתי נקודות: נקודת הקרבה ונקודת הריחוק.'

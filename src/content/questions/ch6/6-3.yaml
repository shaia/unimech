    answer: 1.23e7
    unit: m
    correctFeedback: >-
      נכון. המסלול המעגלי במינימום של $U_{\text{eff}}$:
      $$\frac{dU_{\text{eff}}}{dr} = -\frac{L^2}{mr^3} + \frac{GM_Em}{r^2} = 0\ \Rightarrow\ r_0 = \frac{L^2}{m^2GM_E} = 1.23\cdot10^{7}\,\text{m}$$
      כשתי פעמים רדיוס כדור הארץ. בדיקה: $v = L/(mr_0) = 5.69\,\text{km/s} = \sqrt{GM_E/r_0}$, המהירות המעגלית.

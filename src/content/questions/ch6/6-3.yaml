    hints:
      - '$U_{\text{eff}}(r) = \dfrac{L^2}{2mr^2} - \dfrac{GM_Em}{r}$.'

  - id: Q-6.3-turning-points
    type: numeric
    objectives: [OBJ-6.3-2]
    level: bagrut
    prompt: >-
      ללוויין סביב כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$, מסת הלוויין זניחה) יש אנרגיה ליחידת מסה
      $\varepsilon = E/m = -2.0\cdot10^{7}\,\text{J/kg}$ ותנע זוויתי ליחידת מסה $h = L/m = 6.0\cdot10^{10}\,\text{m}^2/\text{s}$.
      מה המרחק המקסימלי שלו ממרכז כדור הארץ (נקודת הריחוק)?
    answer: 1.30e7
    unit: m
    correctFeedback: >-
      נכון. בנקודות המפנה $\dot r = 0$, ולכן $\varepsilon = \dfrac{h^2}{2r^2} - \dfrac{GM_E}{r}$, כלומר
      $$\varepsilon r^2 + GM_E\,r - \tfrac12h^2 = 0\ \Rightarrow\ r = \frac{-GM_E \mp \sqrt{(GM_E)^2 + 2\varepsilon h^2}}{2\varepsilon}$$
      השורשים: $r_p = 6.94\cdot10^{6}\,\text{m}$ ו-$r_a = 1.30\cdot10^{7}\,\text{m}$. **בדיקת גבולות:** כש-$\varepsilon$
      יורדת לערך המינימלי $-\dfrac{(GM_E)^2}{2h^2} = -2.20\cdot10^{7}\,\text{J/kg}$, השורש מתאפס, ושני השורשים מתלכדים
      במסלול המעגלי, $h^2/GM_E = 9.04\cdot10^{6}\,\text{m}$. וסכום השורשים, $GM_E/|\varepsilon|$, לא תלוי ב-$h$.
    wrongFeedback: >-
      בנקודת מפנה כל האנרגיה הקינטית משיקית: $\varepsilon = h^2/(2r^2) - GM_E/r$. כפלו ב-$r^2$ ופתרו משוואה ריבועית. לשני
      השורשים משמעות: הקטן נקודת הקרבה, והגדול נקודת הריחוק.
    commonWrong:
      - value: 6.94e6
        feedback: 'זה השורש הקטן, נקודת הקרבה. השאלה מבקשת את נקודת הריחוק, השורש הגדול.'
      - value: 1.99e7
        feedback: 'זה $GM_E/|\varepsilon|$, סכום שני השורשים, $r_p + r_a$. כדי לקבל את $r_a$ צריך לפתור את המשוואה עד הסוף.'
      - value: 9.04e6
        feedback: >-
          זה $h^2/GM_E$, הרדיוס של המסלול המעגלי בעל אותו תנע זוויתי. אבל ל-$\varepsilon$ הנתונה יש יותר אנרגיה מהמינימום,
          והמסלול נע בין שתי נקודות מפנה משני צדדיו.
    hints:

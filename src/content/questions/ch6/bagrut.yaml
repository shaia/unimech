  # ------------------------------------------------------------ 4: a Hohmann transfer from the Earth to Mars
  - id: Q-6-bagrut-4
    type: bagrut
    title: מסע הוהמן מכדור הארץ למאדים
    prompt: >-
      חללית יוצאת מכדור הארץ למאדים במסלול הוהמן סביב השמש ($GM_S = 1.33\cdot10^{20}\,\text{m}^3/\text{s}^2$). המסלולים של
      כדור הארץ ושל מאדים מעגליים ובאותו מישור, ברדיוסים $r_1 = 1.00\,\text{AU}$ ו-$r_2 = 1.52\,\text{AU}$
      ($1\,\text{AU} = 1.5\cdot10^{11}\,\text{m}$). הזניחו את הכבידה של כדור הארץ ושל מאדים: כל המהירויות הן ביחס לשמש,
      והחללית יוצאת ממסלול כדור הארץ במהירות של כדור הארץ.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-6.6-1]
        prompt: מה המהירות של כדור הארץ במסלולו? ענו ב-$\text{km/s}$.
        answer: 29.7
        unit: km/s
        correctFeedback: 'נכון: $v_E = \sqrt{GM_S/r_1} = \sqrt{\dfrac{1.33\cdot10^{20}}{1.5\cdot10^{11}}} = 29.7\,\text{km/s}$.'
        wrongFeedback: 'במסלול מעגלי הכבידה של השמש היא הכוח הצנטריפטלי: $v^2/r = GM_S/r^2$.'
        commonWrong:
          - value: 42.1
            feedback: 'זו מהירות המילוט מהשמש במרחק $1\,\text{AU}$, $\sqrt{2GM_S/r_1}$. במסלול מעגלי המהירות קטנה ממנה פי $\sqrt2$.'
          - value: 885
            feedback: 'זה $GM_S/r_1$ ביחידות $\text{km}^2/\text{s}^2$, כלומר $v^2$. הוציאו שורש.'
        hints:
          - '$v = \sqrt{GM_S/r}$.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-6.4-2]
        prompt: מה האקסצנטריות של אליפסת המעבר?
        answer: 0.206
        unit: ''
        correctFeedback: >-
          נכון. $r_p = a(1 - e)$ ו-$r_a = a(1 + e)$, ולכן $e = \dfrac{r_a - r_p}{r_a + r_p} = \dfrac{0.52}{2.52} = 0.206$:
          אליפסה כמעט עגולה, ובכל זאת הדרך שונה מאוד ממסלולי שני כוכבי הלכת.
        wrongFeedback: 'נקודת הקרבה של אליפסת המעבר ב-$r_1$ ונקודת הריחוק ב-$r_2$. כתבו כל אחת בעזרת $a$ ו-$e$ ופתרו.'
        commonWrong:
          - value: 0.342
            feedback: 'חילקתם את ההפרש ב-$r_2$. המכנה הוא סכום המרחקים, $2a = r_1 + r_2$.'
          - value: 0.52
            feedback: 'זה ההפרש $r_2 - r_1$ ב-$\text{AU}$. האקסצנטריות חסרת ממדים: חלקו בסכום, $r_1 + r_2$.'
        hints:
          - '$r_p = a(1 - e)$, $r_a = a(1 + e)$.'

      - label: ג
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-6.6-2, OBJ-6.6-1]
        prompt: מה שינוי המהירות $\Delta v_1$ שצריך בדחיפה הראשונה, ביציאה ממסלול כדור הארץ? ענו ב-$\text{km/s}$.
        answer: 2.93
        unit: km/s
        correctFeedback: >-
          נכון. על אליפסת המעבר, עם $a = 1.26\,\text{AU}$, vis-viva נותן בנקודת הקרבה
          $v_p = \sqrt{GM_S\left(\dfrac{2}{r_1} - \dfrac{1}{a}\right)} = 32.7\,\text{km/s}$, ולכן $\Delta v_1 = v_p - v_E = 2.93\,\text{km/s}$,
          בכיוון התנועה של כדור הארץ.
        wrongFeedback: 'חשבו את המהירות שהחללית צריכה בנקודת הקרבה של אליפסת המעבר (vis-viva), והחסירו את מהירות כדור הארץ שכבר יש לה.'
        commonWrong:
          - value: 5.62
            feedback: 'זה ההפרש בין המהירויות המעגליות של כדור הארץ ושל מאדים. הדחיפה הראשונה היא ההפרש בין $v_p$ של אליפסת המעבר לבין $v_E$, באותה נקודה.'
            misconception: MC-6-dv-is-speed-difference
          - value: 4.71
            feedback: 'הצבתם $a = r_2$ ב-vis-viva. חצי הציר הראשי של אליפסת המעבר הוא הממוצע, $(r_1 + r_2)/2 = 1.26\,\text{AU}$.'
          - value: 32.7
            feedback: 'זו המהירות שהחללית צריכה על אליפסת המעבר. אבל היא כבר נעה עם כדור הארץ ב-$29.7\,\text{km/s}$: חסר רק ההפרש.'
            misconception: MC-6-delta-v-from-rest
        hints:
          - 'vis-viva: $v^2 = GM_S(2/r - 1/a)$.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-6.5-2, OBJ-6.6-2]
        prompt: >-
          החללית צריכה להגיע לנקודת הריחוק של אליפסת המעבר בדיוק כשמאדים שם. כמה זמן נמשכת הדרך, ובאיזו זווית צריך מאדים
          להקדים את כדור הארץ (כפי שנמדדת מהשמש) ברגע היציאה?
        hints:
          - 'נקודת הריחוק נמצאת מול נקודת היציאה, $180^\circ$ סביב השמש. כמה מעלות עובר מאדים בזמן הדרך?'
        solution:
          - { kind: law, text: 'החוק השלישי של קפלר: $T = 2\pi\sqrt{a^3/(GM_S)}$ לכל מסלול סביב השמש. הדרך היא חצי אליפסת המעבר, $a = (r_1 + r_2)/2 = 1.26\,\text{AU}$.' }
          - { kind: manipulation, text: 'זמן הדרך: $t = \pi\sqrt{a^3/(GM_S)}$. מאדים נע במהירות זוויתית קבועה $360^\circ/T_M$, עם $T_M = 2\pi\sqrt{r_2^3/(GM_S)}$, ובזמן $t$ הוא עובר $\Delta\varphi = 360^\circ\cdot t/T_M = 180^\circ\left(\dfrac{a}{r_2}\right)^{3/2}$. החללית מגיעה לנקודה שמול נקודת היציאה, ולכן מאדים צריך להקדים בזווית $$\theta = 180^\circ - 180^\circ\left(\frac{a}{r_2}\right)^{3/2}$$' }
          - { kind: limit, text: 'כש-$r_2 \to r_1$, $a \to r_2$ ו-$\theta \to 0$: מעבר בין שני מסלולים כמעט שווים לא דורש הקדמה. וכש-$r_2 \gg r_1$, $a \approx r_2/2$, ו-$\theta \to 180^\circ(1 - 2^{-3/2}) \approx 116^\circ$: כוכב לכת רחוק ואיטי זז מעט בזמן הדרך.' }
          - { kind: units, text: '$\sqrt{a^3/(GM_S)}$ ביחידות $\sqrt{\text{m}^3/(\text{m}^3/\text{s}^2)} = \text{s}$, ו-$(a/r_2)^{3/2}$ חסר ממדים, ולכן $\theta$ זווית.' }
          - { kind: substitution, text: '$t = \pi\sqrt{\dfrac{(1.89\cdot10^{11})^3}{1.33\cdot10^{20}}} = 2.24\cdot10^{7}\,\text{s}$, כ-259 ימים. $(1.26/1.52)^{3/2} = 0.755$, ולכן מאדים עובר $135.9^\circ$, ו-$\theta = 44.1^\circ$.' }
          - { kind: result, text: 'הדרך נמשכת כ-259 ימים. ברגע היציאה מאדים צריך להקדים את כדור הארץ בכ-$44^\circ$.' }
        rubric:
          - text: חישבתי את זמן הדרך כחצי זמן המחזור של אליפסת המעבר, עם $a = 1.26\,\text{AU}$, וקיבלתי כ-259 ימים.
          - text: חישבתי את הזווית שמאדים עובר בזמן הדרך, כ-$136^\circ$, מזמן המחזור שלו.
          - text: הבנתי שהחללית מגיעה לנקודה שמול נקודת היציאה, וקיבלתי הקדמה של כ-$44^\circ$.
          - text: בדקתי גבול, למשל ש-$r_2 \to r_1$ נותן הקדמה אפס.


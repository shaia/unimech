          - value: 1.07e31
            feedback: 'חילקתם ב-$\sin^2 i$. גם $a$ גדל פי $1/\sin i$, ו-$m_1 + m_2 = \omega^2a^3/G$: שלוש חזקות של $\sin i$.'

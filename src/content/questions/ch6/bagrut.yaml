          - text: 'אי אפשר לדעת, כי זמן המחזור של הלוויין תלוי במסה שלו.'
            feedback: 'זמן המחזור, $T^2 = 4\pi^2a^3/(G(M_E + m))$, כמעט לא תלוי במסה הזניחה של הלוויין.'
            misconception: MC-6-period-depends-on-planet-mass
        hints:
          - 'חשבו את זמן המחזור של הלוויין מהחוק השלישי, והשוו לחלק ב.'

      - label: ה
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-6.6-1, OBJ-6.1-1, OBJ-6.1-2]
        prompt: >-
          (1) בחרו $U(\infty) = 0$, והראו שבתוך כדור הארץ, במרחק $r \le R_E$ מהמרכז, האנרגיה הפוטנציאלית של הכדור היא
          $$U(r) = -\frac{GM_Em}{2R_E^3}\left(3R_E^2 - r^2\right)$$

          (2) בטאו באמצעות $G$, $M_E$ ו-$R_E$ את המהירות המינימלית שצריך לתת לכדור במרכז כדור הארץ, לאורך המנהרה, כדי
          שייצא ממנה וימשיך עד אינסוף. חשבו אותה ב-$\text{km/s}$.
        hints:
          - 'מה העבודה של הכוח מחלק ב, $F_r = -\dfrac{GM_Em}{R_E^3}\,r$, בדרך מ-$R_E$ עד $r$?'
          - 'חברו אנרגיות, לא מהירויות: בדרך מהמרכז עד אינסוף $U$ עולה מ-$U(0)$ עד אפס.'
        solution:
          - { kind: law, text: 'אנרגיה פוטנציאלית של כוח משמר: $U(r) = U(R_E) - \displaystyle\int_{R_E}^{r}F_r(s)\,ds$. מחוץ לכדור $U(R_E) = -\dfrac{GM_Em}{R_E}$, ובתוכו, מחלק ב, $F_r(s) = -\dfrac{GM_Em}{R_E^3}\,s$.' }
          - { kind: manipulation, text: '$$U(r) = -\frac{GM_Em}{R_E} + \frac{GM_Em}{R_E^3}\int_{R_E}^{r}s\,ds = -\frac{GM_Em}{R_E} + \frac{GM_Em}{2R_E^3}\left(r^2 - R_E^2\right) = -\frac{GM_Em}{2R_E^3}\left(3R_E^2 - r^2\right)$$ ובמרכז $U(0) = -\dfrac{3GM_Em}{2R_E}$.' }
          - { kind: manipulation, text: 'שימור אנרגיה מהמרכז עד אינסוף, שם $U = 0$ ובמהירות המינימלית גם האנרגיה הקינטית מגיעה לאפס: $\tfrac12mv^2 - \dfrac{3GM_Em}{2R_E} = 0$, ולכן $$v = \sqrt{\frac{3GM_E}{R_E}}$$' }
          - { kind: limit, text: 'ב-$r = R_E$ הביטוי נותן $U(R_E) = -GM_Em/R_E$, הערך שמחוץ לכדור: $U$ רציפה על פני השטח. ו-$v^2 = \dfrac{GM_E}{R_E} + \dfrac{2GM_E}{R_E}$: ריבוע המהירות במרכז מחלק ג ועוד ריבוע מהירות המילוט מפני השטח. בלי החלק שבתוך המנהרה נשארת מהירות המילוט מפני השטח, ולכן התשובה גדולה ממנה.' }
          - { kind: units, text: '$\dfrac{GM_E}{R_E}$ ביחידות $\dfrac{\text{N}\cdot\text{m}^2/\text{kg}^2\cdot\text{kg}}{\text{m}} = \dfrac{\text{N}\cdot\text{m}}{\text{kg}} = \text{m}^2/\text{s}^2$, ולכן $v$ ב-$\text{m/s}$.' }
          - { kind: substitution, text: '$v = \sqrt{\dfrac{3\cdot6.67\cdot10^{-11}\cdot5.97\cdot10^{24}}{6.37\cdot10^{6}}} = 13.7\,\text{km/s}$, לעומת $11.2\,\text{km/s}$ מפני השטח. חיבור המהירויות, $7.91 + 11.2 = 19.1$, שגוי: האנרגיות מתחברות, לא המהירויות.' }
          - { kind: result, text: 'בתוך כדור הארץ $U(r) = -\dfrac{GM_Em}{2R_E^3}(3R_E^2 - r^2)$, ובמרכז היא עמוקה פי $1.5$ מאשר על פני השטח. המהירות המינימלית מהמרכז היא $v = \sqrt{3GM_E/R_E} = 13.7\,\text{km/s}$.' }
        rubric:
          - text: 'כתבתי את $U(r)$ כאינטגרל של הכוח מחלק ב, החל מ-$U(R_E) = -GM_Em/R_E$, וקיבלתי את הביטוי.'
          - text: 'השתמשתי בשימור אנרגיה מהמרכז עד אינסוף, וקיבלתי $v = \sqrt{3GM_E/R_E}$.'
          - text: 'בדקתי ש-$U$ רציפה ב-$R_E$, ושהתוצאה גדולה ממהירות המילוט מפני השטח.'
          - text: 'חישבתי כ-$13.7\,\text{km/s}$.'

  # ------------------------------------------------------------ 4: a Hohmann transfer from the Earth to Ceres
  - id: Q-6-bagrut-4
    type: bagrut
    title: מסע הוהמן מכדור הארץ לקרס
    prompt: >-
      חללית יוצאת מכדור הארץ אל קרס, כוכב הלכת הננסי שבחגורת האסטרואידים, במסלול הוהמן סביב השמש
      ($GM_S = 1.33\cdot10^{20}\,\text{m}^3/\text{s}^2$). נקרב את המסלולים של כדור הארץ ושל קרס למעגלים באותו מישור, ברדיוסים
      $r_1 = 1.00\,\text{AU}$ ו-$r_2 = 2.77\,\text{AU}$ ($1\,\text{AU} = 1.5\cdot10^{11}\,\text{m}$). הזניחו את הכבידה של כדור הארץ
      ושל קרס: כל המהירויות הן ביחס לשמש, והחללית יוצאת ממסלול כדור הארץ במהירות של כדור הארץ.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-6.6-1]
        prompt: מה המהירות של כדור הארץ במסלולו? ענו ב-$\text{km/s}$.
        answer: 29.8
        unit: km/s
        correctFeedback: 'נכון: $v_E = \sqrt{GM_S/r_1} = \sqrt{\dfrac{1.33\cdot10^{20}}{1.5\cdot10^{11}}} = 29.8\,\text{km/s}$.'
        wrongFeedback: 'במסלול מעגלי הכבידה של השמש היא הכוח השקול, והוא מכוון למרכז: $v^2/r = GM_S/r^2$.'
        commonWrong:
          - value: 42.1
            feedback: 'זו מהירות המילוט מהשמש במרחק $1\,\text{AU}$, $\sqrt{2GM_S/r_1}$. במסלול מעגלי המהירות קטנה ממנה פי $\sqrt2$.'
          - value: 887
            feedback: 'זה $GM_S/r_1$ ביחידות $\text{km}^2/\text{s}^2$, כלומר $v^2$. הוציאו שורש.'
        hints:
          - '$v = \sqrt{GM_S/r}$.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-6.6-2, OBJ-6.6-1]
        prompt: מה שינוי המהירות $\Delta v_1$ שצריך בדחיפה הראשונה, ביציאה ממסלול כדור הארץ? ענו ב-$\text{km/s}$.
        answer: 6.32
        unit: km/s
        correctFeedback: >-
          נכון. על אליפסת המעבר, עם $a = \tfrac12(r_1 + r_2) = 1.885\,\text{AU}$, vis-viva נותן בנקודת הקרבה
          $v_p = \sqrt{GM_S\left(\dfrac{2}{r_1} - \dfrac{1}{a}\right)} = 36.1\,\text{km/s}$, ולכן $\Delta v_1 = v_p - v_E = 6.32\,\text{km/s}$,
          בכיוון התנועה של כדור הארץ.
        wrongFeedback: 'חשבו את המהירות שהחללית צריכה בנקודת הקרבה של אליפסת המעבר (vis-viva), והחסירו את מהירות כדור הארץ שכבר יש לה.'
        commonWrong:
          - value: 11.9
            feedback: 'זה ההפרש בין המהירויות המעגליות של כדור הארץ ושל קרס. הדחיפה הראשונה היא ההפרש בין $v_p$ של אליפסת המעבר לבין $v_E$, באותה נקודה.'
            misconception: MC-6-dv-is-speed-difference
          - value: 8.34
            feedback: 'הצבתם $a = r_2$ ב-vis-viva. חצי הציר הראשי של אליפסת המעבר הוא הממוצע, $(r_1 + r_2)/2 = 1.885\,\text{AU}$.'
          - value: 36.1
            feedback: 'זו המהירות שהחללית צריכה על אליפסת המעבר. אבל היא כבר נעה עם כדור הארץ ב-$29.8\,\text{km/s}$: חסר רק ההפרש.'
            misconception: MC-6-delta-v-from-rest
        hints:
          - 'vis-viva: $v^2 = GM_S(2/r - 1/a)$.'

      - label: ג
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-6.6-2, OBJ-6.6-1]
        prompt: >-
          בנקודת הריחוק של אליפסת המעבר החללית צריכה שינוי מהירות שני, $\Delta v_2$, כדי להישאר במסלול המעגלי של קרס.

          (1) בטאו באמצעות $GM_S$, $r_1$ ו-$r_2$ את גודל המהירות $v_a$ של החללית בנקודת הריחוק, והשוו אותו למהירות
          המעגלית ב-$r_2$. האם החללית צריכה להאיץ או להאט?

          (2) בטאו את $\Delta v_2$, וחשבו אותו ואת סך שינויי המהירות, $\Delta v_1 + \Delta v_2$. השוו להפרש בין המהירויות
          המעגליות של כדור הארץ ושל קרס.
        hints:
          - 'vis-viva בנקודת הריחוק, עם $a = (r_1 + r_2)/2$. או: שימור התנע הזוויתי בין נקודת הקרבה לנקודת הריחוק.'
          - 'אל תשוו את מסלול קרס למסלול כדור הארץ, אלא למהירות שיש לחללית עכשיו.'
        solution:
          - { kind: law, text: 'על אליפסת המעבר vis-viva: $v^2 = GM_S\left(\dfrac{2}{r} - \dfrac{1}{a}\right)$ עם $a = \dfrac{r_1 + r_2}{2}$. במסלול מעגלי ברדיוס $r$: $v = \sqrt{GM_S/r}$.' }
          - { kind: manipulation, text: 'ב-$r = r_2$: $v_a^2 = GM_S\left(\dfrac{2}{r_2} - \dfrac{2}{r_1 + r_2}\right) = \dfrac{GM_S}{r_2}\cdot\dfrac{2r_1}{r_1 + r_2}$, ולכן $$v_a = \sqrt{\frac{GM_S}{r_2}}\,\sqrt{\frac{2r_1}{r_1 + r_2}}$$ כש-$r_1 < r_2$ השורש השני קטן מ-1: החללית איטית מהמהירות המעגלית ב-$r_2$, וצריך **להאיץ**. אותה תוצאה משימור התנע הזוויתי בין שתי נקודות המפנה: $r_1v_p = r_2v_a$.' }
          - { kind: manipulation, text: 'המסלול של קרס אמנם איטי ממסלול כדור הארץ, אבל זה לא אומר שבולמים: ההשוואה היא למהירות של החללית עכשיו, אחרי שהאטה בעלייה נגד הכבידה של השמש. ובנקודת הריחוק רק הרכיב הרדיאלי של המהירות אפס; החללית נעה שם משיקית למסלול, היא לא עומדת.' }
          - { kind: manipulation, text: '$$\Delta v_2 = \sqrt{\frac{GM_S}{r_2}}\left(1 - \sqrt{\frac{2r_1}{r_1 + r_2}}\right)$$ בכיוון התנועה.' }
          - { kind: limit, text: 'כש-$r_2 \to r_1$: $\sqrt{2r_1/(r_1 + r_2)} \to 1$ ו-$\Delta v_2 \to 0$, וכך גם $\Delta v_1$: אין לאן לעבור. כש-$r_2 \to \infty$: גם $v_a \to 0$ וגם המהירות המעגלית שם שואפת לאפס, ולכן $\Delta v_2 \to 0$.' }
          - { kind: units, text: '$\sqrt{GM_S/r_2}$ ביחידות $\sqrt{(\text{m}^3/\text{s}^2)/\text{m}} = \text{m/s}$, והשורש השני חסר ממדים.' }
          - { kind: substitution, text: '$\sqrt{\dfrac{GM_S}{r_2}} = \sqrt{\dfrac{1.33\cdot10^{20}}{2.77\cdot1.5\cdot10^{11}}} = 17.9\,\text{km/s}$ ו-$\sqrt{2/3.77} = 0.728$, ולכן $v_a = 13.0\,\text{km/s}$ ו-$\Delta v_2 = 4.86\,\text{km/s}$. עם $\Delta v_1 = 6.32\,\text{km/s}$ מחלק ב, סך הכול $11.2\,\text{km/s}$, פחות מההפרש בין המהירויות המעגליות, $29.8 - 17.9 = 11.9\,\text{km/s}$.' }
          - { kind: result, text: '$v_a = \sqrt{GM_S/r_2}\,\sqrt{2r_1/(r_1 + r_2)} = 13.0\,\text{km/s}$, איטית מקרס, ולכן מאיצים ב-$\Delta v_2 = 4.86\,\text{km/s}$. סך שינויי המהירות $11.2\,\text{km/s}$.' }
        rubric:
          - text: 'כתבתי vis-viva בנקודת הריחוק עם $a = (r_1 + r_2)/2$, או את שימור התנע הזוויתי, וקיבלתי את $v_a$.'
          - text: 'השוויתי ל-$\sqrt{GM_S/r_2}$ וקבעתי שצריך להאיץ, לא להאט.'
          - text: 'בדקתי ש-$\Delta v_2 \to 0$ כש-$r_2 \to r_1$.'
          - text: 'חישבתי $\Delta v_2 \approx 4.9\,\text{km/s}$ וסך הכול כ-$11.2\,\text{km/s}$, פחות מ-$11.9$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-6.5-2, OBJ-6.6-2]
        prompt: >-
          החללית צריכה להגיע לנקודת הריחוק של אליפסת המעבר בדיוק כשקרס שם. בטאו באמצעות $GM_S$, $r_1$ ו-$r_2$ את זמן
          הדרך $t$ ואת הזווית $\varphi$ שבה קרס צריך להקדים את כדור הארץ (כפי שנמדדת מהשמש) ברגע היציאה. בדקו את $\varphi$
          בגבולות, וחשבו את $t$ בימים ואת $\varphi$.
        hints:
          - 'נקודת הריחוק נמצאת מול נקודת היציאה, $180^\circ$ סביב השמש. כמה מעלות עובר קרס בזמן הדרך?'
        solution:
          - { kind: law, text: 'החוק השלישי של קפלר: $T = 2\pi\sqrt{a^3/(GM_S)}$ לכל מסלול סביב השמש. הדרך היא חצי אליפסת המעבר, $a = (r_1 + r_2)/2 = 1.885\,\text{AU}$.' }
          - { kind: manipulation, text: 'זמן הדרך: $t = \pi\sqrt{a^3/(GM_S)}$. קרס נע במהירות זוויתית קבועה $360^\circ/T_C$, עם $T_C = 2\pi\sqrt{r_2^3/(GM_S)}$, ובזמן $t$ הוא עובר $\Delta\varphi = 360^\circ\cdot t/T_C = 180^\circ\left(\dfrac{a}{r_2}\right)^{3/2}$. החללית מגיעה לנקודה שמול נקודת היציאה, ולכן קרס צריך להקדים בזווית $$\varphi = 180^\circ - 180^\circ\left(\frac{a}{r_2}\right)^{3/2}$$' }
          - { kind: limit, text: 'כש-$r_2 \to r_1$, $a \to r_2$ ו-$\varphi \to 0$: מעבר בין שני מסלולים כמעט שווים לא דורש הקדמה. וכש-$r_2 \gg r_1$, $a \approx r_2/2$, ו-$\varphi \to 180^\circ(1 - 2^{-3/2}) \approx 116^\circ$: גוף רחוק ואיטי זז מעט בזמן הדרך.' }
          - { kind: units, text: '$\sqrt{a^3/(GM_S)}$ ביחידות $\sqrt{\text{m}^3/(\text{m}^3/\text{s}^2)} = \text{s}$, ו-$(a/r_2)^{3/2}$ חסר ממדים, ולכן $\varphi$ זווית.' }
          - { kind: substitution, text: '$t = \pi\sqrt{\dfrac{(2.83\cdot10^{11})^3}{1.33\cdot10^{20}}} = 4.10\cdot10^{7}\,\text{s}$, כ-474 ימים. $(1.885/2.77)^{3/2} = 0.561$, ולכן קרס עובר $101.0^\circ$, ו-$\varphi = 79.0^\circ$.' }
          - { kind: result, text: 'הדרך נמשכת כ-474 ימים, יותר משנה. ברגע היציאה קרס צריך להקדים את כדור הארץ בכ-$79^\circ$.' }
        rubric:
          - text: חישבתי את זמן הדרך כחצי זמן המחזור של אליפסת המעבר, עם $a = 1.885\,\text{AU}$, וקיבלתי כ-474 ימים.
          - text: חישבתי את הזווית שקרס עובר בזמן הדרך, כ-$101^\circ$, מזמן המחזור שלו.
          - text: הבנתי שהחללית מגיעה לנקודה שמול נקודת היציאה, וקיבלתי הקדמה של כ-$79^\circ$.
          - text: בדקתי גבול, למשל ש-$r_2 \to r_1$ נותן הקדמה אפס.

  # ------------------------------------------------------------ 5: a satellite hit by debris falling toward the Earth
  - id: Q-6-bagrut-5
    type: bagrut
    title: לוויין שנפגע מגוש פסולת
    prompt: >-
      לוויין בעל מסה $M$ נע סביב כדור הארץ במסלול מעגלי ברדיוס $r_0$, במהירות $v_c = \sqrt{GM_E/r_0}$. גוש פסולת קטן
      בעל מסה $m$ נע בקו ישר אל מרכז כדור הארץ, במהירות $v_d$, פוגע בלוויין ונצמד אליו. ההתנגשות קצרה מאוד לעומת זמן
      המחזור, ומתרחשת במרחק $r_0$ מהמרכז. מסות הלוויין והגוש זניחות לעומת מסת כדור הארץ, ולכן כדור הארץ נשאר במנוחה
      במערכת ייחוס אינרציאלית. $\hat r$ פונה מהמרכז החוצה, ו-$\hat\theta$ בכיוון התנועה של הלוויין.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-4.4-1, OBJ-3.5-2]
        prompt: מה נכון לגבי המערכת לוויין ועוד גוש בזמן ההתנגשות הקצרה?
        choices:
          - text: התנע הכולל נשמר בקירוב טוב מאוד, והאנרגיה הקינטית הכוללת קטנה.

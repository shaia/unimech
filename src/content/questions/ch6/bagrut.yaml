  # ------------------------------------------------------------ 3: a tunnel through the Earth and a grazing satellite
  - id: Q-6-bagrut-3
    type: bagrut
    title: מנהרה דרך כדור הארץ ולוויין צמוד לקרקע
    prompt: >-
      מודל: כדור הארץ הוא כדור אחיד בעל מסה $M_E = 5.97\cdot10^{24}\,\text{kg}$ ורדיוס $R_E = 6.37\cdot10^{6}\,\text{m}$,
      בלי אוויר ובלי סיבוב, ו-$G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$. קודחים מנהרה ישרה וצרה, בלי חיכוך,
      דרך המרכז, מנקודה A על פני השטח לנקודה B שמולה. ברגע $t = 0$ משחררים כדור ממנוחה בפתח A. באותו רגע עובר מעל A לוויין
      במסלול מעגלי צמוד לפני הקרקע (ברדיוס $R_E$), שהמישור שלו מכיל את המנהרה.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-6.1-2]
        prompt: איך תלוי גודל תאוצת הכבידה $g$ במרחק $r$ מהמרכז, בתוך המנהרה?
        choices:
          - text: '$g = g_s\,r/R_E$: גדל בקו ישר עם $r$, ואפס במרכז.'
            correct: true
            feedback: >-
              נכון. לפי משפט הקליפה מושכת רק המסה שבתוך הרדיוס $r$, $M_E r^3/R_E^3$, ולכן $g = \dfrac{GM_Er}{R_E^3} = g_s\dfrac{r}{R_E}$,
              עם $g_s = GM_E/R_E^2 = 9.81\,\text{m/s}^2$.
          - text: '$g = GM_E/r^2$: גדל ככל שמתקרבים למרכז.'
            feedback: 'זה נכון רק מחוץ לכדור. בתוכו, השכבות שמעל הכדור לא מושכות, ורק המסה שמתחתיו מושכת, והיא קטנה ככל שיורדים.'
            misconception: MC-6-inside-full-mass
          - text: '$g = g_s$, קבוע לאורך כל המנהרה.'
            feedback: '$g$ כמעט קבוע רק בעומקים קטנים לעומת $R_E$. לאורך המנהרה המסה המושכת קטנה מ-$M_E$ עד אפס.'
            misconception: MC-6-mgh-everywhere
          - text: '$g = 0$ בכל המנהרה, כי לפי משפט הקליפה אין כבידה בתוך כדור.'
            feedback: 'משפט הקליפה אומר שהקליפות **שמעל** הגוף לא מושכות. המסה שמתחת לגוף, בתוך הרדיוס $r$, מושכת כמו מסה נקודתית במרכז.'

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-6.1-2]
        prompt: >-
          הראו שהכדור נע בתנועה הרמונית, ומצאו ביטוי לזמן המחזור שלה. בדקו את היחידות של הביטוי, וחשבו את זמן המחזור
          בדקות.
        hints:
          - 'כתבו את הכוח על הכדור במרחק $x$ מהמרכז לאורך המנהרה. האם הוא מהצורה $-\kappa x$?'
        solution:
          - { kind: law, text: 'משפט הקליפה: במרחק $|x|$ מהמרכז מושכת רק המסה $M(x) = M_E|x|^3/R_E^3$, כאילו היא במרכז. החוק השני לאורך המנהרה: $m\ddot x = F_x$.' }
          - { kind: manipulation, text: '$F_x = -\dfrac{GM(x)m}{x^2}\,\dfrac{x}{|x|} = -\dfrac{GM_Em}{R_E^3}\,x$. לכן $\ddot x = -\omega^2x$ עם $\omega^2 = \dfrac{GM_E}{R_E^3}$: תנועה הרמונית סביב המרכז, באמפליטודה $R_E$, ו-$$T = \frac{2\pi}{\omega} = 2\pi\sqrt{\frac{R_E^3}{GM_E}} = 2\pi\sqrt{\frac{R_E}{g_s}}$$' }
          - { kind: limit, text: 'זמן המחזור לא תלוי במסת הכדור ולא באמפליטודה: כדור שמשחררים בעומק כלשהו במנהרה חוזר אחרי אותו זמן. והביטוי $2\pi\sqrt{R_E^3/(GM_E)}$ הוא בדיוק החוק השלישי של קפלר למסלול ברדיוס $R_E$.' }
          - { kind: units, text: '$\sqrt{\dfrac{\text{m}^3}{\text{m}^3/\text{s}^2}} = \text{s}$, וגם $\sqrt{R_E/g_s}$ ביחידות $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$.' }
          - { kind: substitution, text: '$T = 2\pi\sqrt{\dfrac{(6.37\cdot10^{6})^3}{6.67\cdot10^{-11}\cdot5.97\cdot10^{24}}} = 5.06\cdot10^{3}\,\text{s}$.' }
          - { kind: result, text: 'תנועה הרמונית עם $T = 2\pi\sqrt{R_E^3/(GM_E)} = 5.06\cdot10^{3}\,\text{s} = 84.4\,\text{min}$: הכדור מגיע ל-B אחרי $42.2$ דקות וחוזר ל-A אחרי $84.4$.' }
        rubric:
          - text: השתמשתי במשפט הקליפה, וכתבתי את המסה המושכת $M_E x^3/R_E^3$.
          - text: קיבלתי כוח מחזיר ליניארי, $-\dfrac{GM_Em}{R_E^3}x$, וזיהיתי תנועה הרמונית עם $\omega^2 = GM_E/R_E^3$.
          - text: בדקתי שהיחידות של $T$ הן שניות.
          - text: חישבתי $T \approx 84$ דקות.

      - label: ג
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-6.1-2]
        prompt: מה גודל המהירות של הכדור כשהוא עובר במרכז כדור הארץ? ענו ב-$\text{km/s}$.
        answer: 7.91
        unit: km/s
        correctFeedback: >-
          נכון. בתנועה הרמונית המהירות המקסימלית היא $\omega R_E = \sqrt{GM_E/R_E} = 7.91\,\text{km/s}$. בדרך אחרת, מאנרגיה:
          העבודה של הכוח $-\kappa x$ מ-$R_E$ עד 0 היא $\tfrac12\kappa R_E^2 = \tfrac12 m\,GM_E/R_E$. זו בדיוק המהירות של הלוויין.
        wrongFeedback: 'השתמשו בתנועה ההרמונית מחלק ב: המהירות במרכז היא $\omega$ כפול האמפליטודה. או חשבו את העבודה של הכוח $-\kappa x$.'
        commonWrong:
          - value: 11.2
            feedback: >-
              זה $\sqrt{2g_sR_E}$, נפילה מגובה $R_E$ עם $g$ קבוע. אבל $g$ קטן בדרך עד אפס במרכז, ובממוצע הוא חצי מ-$g_s$:
              $\sqrt{2\cdot\tfrac12g_s\cdot R_E} = 7.91\,\text{km/s}$.
            misconception: MC-6-mgh-everywhere
        hints:
          - 'בתנועה הרמונית $v_{\max} = \omega A$.'

      - label: ד
        type: numeric
        points: 5
        level: bagrut
        objectives: [OBJ-6.6-1, OBJ-6.1-1]
        prompt: >-
          מה המהירות המינימלית שצריך לתת לכדור במרכז כדור הארץ, לאורך המנהרה, כדי שייצא ממנה וימשיך עד אינסוף? ענו
          ב-$\text{km/s}$.
        answer: 13.7
        unit: km/s
        correctFeedback: >-
          נכון. ליחידת מסה, היציאה מהמרכז אל פני השטח דורשת $\tfrac12\dfrac{GM_E}{R_E}$ (חלק ג), ומפני השטח עד אינסוף עוד
          $\dfrac{GM_E}{R_E}$. סך הכול $\tfrac12v^2 = \dfrac{3GM_E}{2R_E}$, ולכן $v = \sqrt{3GM_E/R_E} = 13.7\,\text{km/s}$. כלומר
          $U(0) = -\dfrac{3GM_Em}{2R_E}$, עמוק פי 1.5 מאשר על פני השטח. **בדיקת גבולות:** בלי החלק שבתוך המנהרה נשארת מהירות
          המילוט מפני השטח, $\sqrt{2GM_E/R_E} = 11.2\,\text{km/s}$, וזה הגבול התחתון שהתשובה עוברת.
        wrongFeedback: 'חברו אנרגיות, לא מהירויות: העבודה נגד הכבידה מהמרכז לפני השטח, ועוד העבודה מפני השטח עד אינסוף.'
        commonWrong:
          - value: 11.2
            feedback: 'זו מהירות המילוט מפני השטח. מהמרכז הכדור צריך קודם לטפס במנהרה, נגד כבידה שגדלה בדרך, ולכן צריך יותר.'
          - value: 19.1
            feedback: 'חיברתם מהירויות, $7.91 + 11.2$. האנרגיות מתחברות, לא המהירויות: $v^2 = 7.91^2 + 11.2^2$.'
        hints:
          - 'מה האנרגיה הקינטית שהכדור מאבד בדרך מהמרכז לפני השטח? (חלק ג)'

      - label: ה
        type: mc
        points: 4
        level: bagrut
        qualitative: true
        objectives: [OBJ-6.5-2, OBJ-6.1-2]
        prompt: >-
          בלי תוספת מהירות, הכדור מחלק ב חוזר על התנועה שלו. איפה נמצא הלוויין כשהכדור עובר, בפעם הראשונה, במרכז כדור הארץ?
        choices:
          - text: 'ברבע הדרך סביב כדור הארץ, מעל המרכז בכיוון הניצב למנהרה; ושם מהירותו שווה למהירות הכדור, ומקבילה לה.'
            correct: true
            feedback: >-
              נכון. לזמן המחזור של הלוויין, מהחוק השלישי עם $a = R_E$, אותו ערך כמו של הכדור. אם הוא במקום
              $(R_E\cos\omega t,\ R_E\sin\omega t)$, ההיטל שלו על המנהרה הוא $R_E\cos\omega t$, בדיוק מקום הכדור. ב-$t = T/4$
              הלוויין עבר רבע מעגל, ומהירותו $7.91\,\text{km/s}$ בכיוון המנהרה, כמו של הכדור.
          - text: מעל B, כי הלוויין מהיר יותר מהכדור.
            feedback: >-
              הלוויין לא מהיר יותר: מהירותו $7.91\,\text{km/s}$ כל הזמן, והכדור מגיע לאותה מהירות במרכז. הלוויין מגיע מעל B
              אחרי חצי מחזור, באותו רגע שבו הכדור מגיע ל-B.
          - text: עדיין קרוב ל-A, כי הדרך שלו סביב כדור הארץ ארוכה יותר.
            feedback: 'הדרך שלו ארוכה פי $\pi/2$, אבל הוא נע כל הזמן במהירות המקסימלית של הכדור. זמני המחזור שווים, ושניהם עוברים רבע מחזור.'
          - text: 'אי אפשר לדעת, כי זמן המחזור של הלוויין תלוי במסה שלו.'
            feedback: 'זמן המחזור, $T^2 = 4\pi^2a^3/(G(M_E + m))$, כמעט לא תלוי במסה הזניחה של הלוויין.'
            misconception: MC-6-period-depends-on-planet-mass
        hints:

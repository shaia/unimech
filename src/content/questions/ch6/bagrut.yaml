  # ------------------------------------------------------------ 3: a tunnel through the Earth and a grazing satellite
  - id: Q-6-bagrut-3
    type: bagrut
    title: מנהרה דרך כדור הארץ ולוויין צמוד לקרקע
    prompt: >-
      מודל: כדור הארץ הוא כדור אחיד בעל מסה $M_E = 5.97\cdot10^{24}\,\text{kg}$ ורדיוס $R_E = 6.37\cdot10^{6}\,\text{m}$,
      בלי אוויר ובלי סיבוב, ו-$G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$. קודחים מנהרה ישרה וצרה, בלי חיכוך,
      דרך המרכז, מנקודה A על פני השטח לנקודה B שמולה. ברגע $t = 0$ משחררים כדור ממנוחה בפתח A. באותו רגע עובר מעל A לוויין
      במסלול מעגלי צמוד לפני הקרקע (ברדיוס $R_E$), שהמישור שלו מכיל את המנהרה.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-6.1-2]
        prompt: איך תלוי גודל תאוצת הכבידה $g$ במרחק $r$ מהמרכז, בתוך המנהרה?
        choices:
          - text: '$g = g_s\,r/R_E$: גדל בקו ישר עם $r$, ואפס במרכז.'
            correct: true
            feedback: >-
              נכון. לפי משפט הקליפה מושכת רק המסה שבתוך הרדיוס $r$, $M_E r^3/R_E^3$, ולכן $g = \dfrac{GM_Er}{R_E^3} = g_s\dfrac{r}{R_E}$,
              עם $g_s = GM_E/R_E^2 = 9.81\,\text{m/s}^2$.
          - text: '$g = GM_E/r^2$: גדל ככל שמתקרבים למרכז.'
            feedback: 'זה נכון רק מחוץ לכדור. בתוכו, השכבות שמעל הכדור לא מושכות, ורק המסה שמתחתיו מושכת, והיא קטנה ככל שיורדים.'
            misconception: MC-6-inside-full-mass
          - text: '$g = g_s$, קבוע לאורך כל המנהרה.'
            feedback: '$g$ כמעט קבוע רק בעומקים קטנים לעומת $R_E$. לאורך המנהרה המסה המושכת קטנה מ-$M_E$ עד אפס.'
            misconception: MC-6-mgh-everywhere
          - text: '$g = 0$ בכל המנהרה, כי לפי משפט הקליפה אין כבידה בתוך כדור.'
            feedback: 'משפט הקליפה אומר שהקליפות **שמעל** הגוף לא מושכות. המסה שמתחת לגוף, בתוך הרדיוס $r$, מושכת כמו מסה נקודתית במרכז.'

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-6.1-2]
        prompt: >-
          הראו שהכדור נע בתנועה הרמונית, ומצאו ביטוי לזמן המחזור שלה. בדקו את היחידות של הביטוי, וחשבו את זמן המחזור
          בדקות.
        hints:
          - 'כתבו את הכוח על הכדור במרחק $x$ מהמרכז לאורך המנהרה. האם הוא מהצורה $-\kappa x$?'
        solution:
          - { kind: law, text: 'משפט הקליפה: במרחק $|x|$ מהמרכז מושכת רק המסה $M(x) = M_E|x|^3/R_E^3$, כאילו היא במרכז. החוק השני לאורך המנהרה: $m\ddot x = F_x$.' }
          - { kind: manipulation, text: '$F_x = -\dfrac{GM(x)m}{x^2}\,\dfrac{x}{|x|} = -\dfrac{GM_Em}{R_E^3}\,x$. לכן $\ddot x = -\omega^2x$ עם $\omega^2 = \dfrac{GM_E}{R_E^3}$: תנועה הרמונית סביב המרכז, באמפליטודה $R_E$, ו-$$T = \frac{2\pi}{\omega} = 2\pi\sqrt{\frac{R_E^3}{GM_E}} = 2\pi\sqrt{\frac{R_E}{g_s}}$$' }
          - { kind: limit, text: 'זמן המחזור לא תלוי במסת הכדור ולא באמפליטודה: כדור שמשחררים בעומק כלשהו במנהרה חוזר אחרי אותו זמן. והביטוי $2\pi\sqrt{R_E^3/(GM_E)}$ הוא בדיוק החוק השלישי של קפלר למסלול ברדיוס $R_E$.' }
          - { kind: units, text: '$\sqrt{\dfrac{\text{m}^3}{\text{m}^3/\text{s}^2}} = \text{s}$, וגם $\sqrt{R_E/g_s}$ ביחידות $\sqrt{\text{m}/(\text{m/s}^2)} = \text{s}$.' }
          - { kind: substitution, text: '$T = 2\pi\sqrt{\dfrac{(6.37\cdot10^{6})^3}{6.67\cdot10^{-11}\cdot5.97\cdot10^{24}}} = 5.06\cdot10^{3}\,\text{s}$.' }
          - { kind: result, text: 'תנועה הרמונית עם $T = 2\pi\sqrt{R_E^3/(GM_E)} = 5.06\cdot10^{3}\,\text{s} = 84.4\,\text{min}$: הכדור מגיע ל-B אחרי $42.2$ דקות וחוזר ל-A אחרי $84.4$.' }
        rubric:
          - text: השתמשתי במשפט הקליפה, וכתבתי את המסה המושכת $M_E x^3/R_E^3$.
          - text: קיבלתי כוח מחזיר ליניארי, $-\dfrac{GM_Em}{R_E^3}x$, וזיהיתי תנועה הרמונית עם $\omega^2 = GM_E/R_E^3$.
          - text: בדקתי שהיחידות של $T$ הן שניות.
          - text: חישבתי $T \approx 84$ דקות.


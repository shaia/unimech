          - { kind: substitution, text: '$\sin^3 60^\circ = 0.650$, ולכן $m_1 = \dfrac{8.02\cdot10^{30}}{0.650} = 1.23\cdot10^{31}\,\text{kg}$, כ-$6.2\,M_S$. אילו התעלמנו מהנטייה היינו מקבלים $8.02\cdot10^{30}\,\text{kg}$, ואילו חילקנו ב-$\sin i$ פעם אחת בלבד, $9.26\cdot10^{30}\,\text{kg}$.' }

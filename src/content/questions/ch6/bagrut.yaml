          - 'החלק של $m_1$ בסכום המסות: $\dfrac{m_1}{m_1 + m_2} = \dfrac{r_2}{r_1 + r_2}$.'
        solution:
          - { kind: law, text: 'המהירויות האמיתיות הן $v_1 = K_1/\sin i$ ו-$v_2 = K_2/\sin i$. מחלק ג, $m_1 + m_2 = \dfrac{(v_1 + v_2)^3T}{2\pi G}$. ממרכז המסה, כמו בחלק א, $\dfrac{m_1}{m_1 + m_2} = \dfrac{r_2}{r_1 + r_2} = \dfrac{v_2}{v_1 + v_2}$.' }
          - { kind: manipulation, text: 'כופלים: $$m_1 = \frac{v_2(v_1 + v_2)^2T}{2\pi G} = \frac{K_2(K_1 + K_2)^2T}{2\pi G\sin^3 i}$$ כל המהירויות גדלות פי $1/\sin i$ ו-$T$ לא משתנה, ולכן המסה גדלה פי $1/\sin^3 i$. מלבד $\sin^3 i$, באגף ימין רק גדלים שנמדדו: מהמדידות לבדן יוצא $m_1\sin^3 i = \dfrac{K_2(K_1 + K_2)^2T}{2\pi G}$.' }

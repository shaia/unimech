        rubric:
          - text: 'כתבתי $v = K/\sin i$, והצבתי בסכום המסות של חלק ג ובחלק של $m_1$ מתוך יחס המהירויות.'
          - text: 'הגעתי ל-$m_1 = K_2(K_1 + K_2)^2T/(2\pi G\sin^3 i)$, והסברתי שבלי לדעת את $i$ נמדד רק $m_1\sin^3 i$.'
          - text: 'בדקתי ש-$i = 90^\circ$ מחזיר את חלק ג, ושהערך בלי התיקון הוא גבול תחתון.'

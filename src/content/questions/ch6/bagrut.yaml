# Chapter 6 review problems (שאלות חזרה): a shared scenario with lettered parts (א, ב, ג…) that climb from
# basic to exam level, 25 points each. Each problem joins at least two lessons; together they touch 6.1–6.6.
#   1: a tangential kick (6.3, 6.4, 6.5, 6.6)   2: a binary star from Doppler speeds (6.2, 6.5)
#   3: a tunnel through the Earth and a grazing satellite (6.1, 6.5, 6.6)   4: Earth to Ceres (6.4, 6.5, 6.6)
# Open parts follow the course format: law → manipulation → limit → units → substitution → result.
# Notation as in lessons 6.3–6.6: per unit mass ε, h, u_eff; μ, e, p, a, GM; r⃗ = r⃗₁ − r⃗₂. YAML note: never "…" for TeX.
#
# Every number is computed from the values the prompt prints (GM_E = 3.98e14 and GM_S = 1.33e20 m³/s² where printed,
# otherwise G, M_E, R_E, M_S of src/physics/constants.ts); independent recompute .scratch/review/ch6/bagrut.ts:
#   1: r₀ = 7.0e6 m: v_c = 7.54 km/s (√2 v_c 10.7); λ = 1.20: ε = −0.28 GM_E/r₀, u_eff minimum at λ²r₀ = 1.44 r₀;
#      e = λ² − 1 = 0.440 (λ − 1 0.20, λ² 1.44, 2(λ − 1) 0.40); r_a = 1.80e7 m, a = 1.25e7 m (+78.6 %),
#      T = 13919 s = 232 min (old orbit 97.2, a = r_a 401); T/T₀ = 2.386: the satellite left on the circle is
#      139° past P when the kicked one first returns (T ∝ a would give 1.79 laps).
#   2: v₁ = 60, v₂ = 120 km/s, T = 10.0 d = 8.64e5 s: m₁/m₂ = 2.00; a = (v₁ + v₂)T/(2π) = 2.48e10 m = 0.17 AU
#      (r₁ only 8.25e9, r₂ only 1.65e10, no 2π 1.56e11); M = (v₁ + v₂)³T/(2πG) = 1.20e31 kg = 6.04 M_S;
#      edge-on m₁ = 8.02e30 kg (4.03 M_S), m₂ = 4.01e30. Plane tilted, i = 60° (Doppler gives v sin i):
#      m₁ = 8.02e30/sin³60° = 1.23e31 kg = 6.20 M_S (ignoring the tilt 8.02e30, ÷ sin i 9.26e30, ÷ sin² i 1.07e31,
#      × sin i 6.94e30; none within 3 % of another).
#   3: g_s = 9.81 m/s², T = 2π√(R³/GM) = 5.06e3 s = 84.4 min; speed at the centre √(GM/R) = 7.91 km/s (constant g:
#      √(2g_sR) = 11.2); escape from the centre √(3GM/R) = 13.7 km/s (surface value 11.2, speeds added 19.1).
#   4: r₁ = 1.00, r₂ = 2.77 AU: v_E = 29.8 km/s (escape from the Sun 42.1, GM/r without the root 887);
#      e = (r₂ − r₁)/(r₂ + r₁) = 0.469 ((r₂ − r₁)/r₂ 0.639, r₂ − r₁ 1.77); a_t = 1.885 AU = 2.83e11 m;
#      v_p = 36.1, Δv₁ = 6.32 km/s (v_E − v_C 11.9, a = r₂ in vis-viva 8.34); t = 4.10e7 s = 474 d,
#      T_C = 1689 d, Ceres moves 101.0°, lead angle 79.0°; at arrival v_a = 13.0, v_C = 17.9, Δv₂ = 4.86,
#      total 11.2 km/s.
# Review 2026-11-11: problem 4 was Earth → Mars, whose numbers the 6.6 workbook (W-6.6-c2) and ladder
# (Q-6.6-transfer-time) already compute; its keys also used GM_S = 1.327e20 against the printed 1.33e20
# (v_E 29.7 → 29.8, v_M 24.1 → 24.2). Part 1ה (escape at λ = √2, printed in lessons 6.4 and 6.6) became the
# phasing question; part 2ד (m₁ = ⅔ of the sum) became the tilted plane, so both problems end above the text.

chapter: 6
questions:
  # ------------------------------------------------------------ 1: a satellite given a tangential kick
  - id: Q-6-bagrut-1
    type: bagrut
    title: לוויין שמקבל דחיפה בכיוון התנועה
    prompt: >-
      לוויין נע סביב כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$) במסלול מעגלי ברדיוס $r_0 = 7.0\cdot10^{6}\,\text{m}$.
      מסת הלוויין זניחה לעומת מסת כדור הארץ, ולכן $\mu \approx m$, ונעבוד ליחידת מסה: $\varepsilon$ האנרגיה ליחידת מסה
      ו-$h$ התנע הזוויתי ליחידת מסה, ביחס למרכז כדור הארץ. בנקודה P המנוע פועל לזמן קצר מאוד, בכיוון התנועה: גודל
      המהירות גדל מהמהירות המעגלית $v_c$ ל-$\lambda v_c$, עם $\lambda = 1.20$, והכיוון נשאר משיק למעגל. אחרי הדחיפה המנוע
      כבוי.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-6.3-2]
        prompt: מה המהירות המעגלית $v_c$ לפני הדחיפה? ענו ב-$\text{km/s}$.
        answer: 7.54
        unit: km/s
        correctFeedback: >-
          נכון. במסלול המעגלי הכבידה היא הכוח השקול הרדיאלי, $\dfrac{mv_c^2}{r_0} = \dfrac{GM_Em}{r_0^2}$, ולכן
          $v_c = \sqrt{GM_E/r_0} = 7.54\,\text{km/s}$. זה גם המינימום של $u_{\text{eff}}$ עבור $h = r_0v_c$.
        wrongFeedback: 'כתבו את החוק השני ללוויין במסלול מעגלי: הכבידה היא הכוח השקול, והוא מכוון למרכז.'
        commonWrong:
          - value: 10.7
            feedback: 'זו מהירות המילוט ב-$r_0$, $\sqrt{2GM_E/r_0}$. במסלול מעגלי המהירות קטנה ממנה פי $\sqrt2$.'
        hints:
          - '$\dfrac{v_c^2}{r_0} = \dfrac{GM_E}{r_0^2}$.'

      - label: ב
        type: open
        points: 7
        level: mid
        qualitative: true
        objectives: [OBJ-6.3-1, OBJ-6.3-2]
        prompt: >-
          (1) כתבו את $\varepsilon$ של הלוויין אחרי הדחיפה בעזרת הפוטנציאל האפקטיבי ליחידת מסה, $u_{\text{eff}}(r)$, והראו ש-P
          היא נקודת הקרבה של המסלול החדש.

          (2) הראו שהמסלול החדש קשור, ומצאו את ה-$\lambda$ הגדול ביותר שבו הוא עדיין קשור.
        hints:
          - 'מה $\dot r$ מיד אחרי הדחיפה? ואיפה נמצא עכשיו המינימום של $u_{\text{eff}}$, ביחס ל-$r_0$?'
        solution:
          - { kind: law, text: 'בכוח מרכזי $\varepsilon$ ו-$h$ נשמרים, ו-$\varepsilon = \tfrac12\dot r^2 + u_{\text{eff}}(r)$ עם $u_{\text{eff}}(r) = \dfrac{h^2}{2r^2} - \dfrac{GM_E}{r}$.' }
          - { kind: manipulation, text: 'מיד אחרי הדחיפה המהירות משיקה למעגל, ניצבת לרדיוס: $\dot r = 0$, ולכן P היא נקודת מפנה, $\varepsilon = u_{\text{eff}}(r_0)$. התנע הזוויתי החדש $h = r_0\lambda v_c$, והמינימום של $u_{\text{eff}}$ זז ל-$r = \dfrac{h^2}{GM_E} = \lambda^2r_0 > r_0$, כי $v_c^2 = GM_E/r_0$. P נמצאת משמאל למינימום, בצד הפנימי של הבור: זו נקודת המפנה הפנימית, נקודת הקרבה.' }
          - { kind: manipulation, text: 'האנרגיה: $\varepsilon = \tfrac12\lambda^2v_c^2 - \dfrac{GM_E}{r_0} = \left(\dfrac{\lambda^2}{2} - 1\right)\dfrac{GM_E}{r_0}$. המסלול קשור כש-$\varepsilon < 0$, כלומר כש-$\lambda < \sqrt2$. עם $\lambda = 1.20$: $\varepsilon = -0.28\,GM_E/r_0 < 0$.' }
          - { kind: limit, text: 'כש-$\lambda = 1$: $\varepsilon = -\dfrac{GM_E}{2r_0}$, המינימום של $u_{\text{eff}}$, והמסלול נשאר המעגל. כש-$\lambda = \sqrt2$: $\varepsilon = 0$, והלוויין בורח בפרבולה, ו-$\lambda v_c = \sqrt{2GM_E/r_0}$ היא מהירות המילוט.' }
          - { kind: units, text: '$\dfrac{GM_E}{r_0}$ ביחידות $\dfrac{\text{m}^3/\text{s}^2}{\text{m}} = \text{m}^2/\text{s}^2 = \text{J/kg}$, כמו $\varepsilon$, ו-$\lambda$ חסר ממדים.' }
          - { kind: result, text: 'P היא נקודת הקרבה של מסלול קשור (אליפסה), כי $\dot r = 0$ בה והמינימום החדש של $u_{\text{eff}}$ רחוק יותר, ב-$\lambda^2r_0$. המסלול קשור כל עוד $\lambda < \sqrt2 \approx 1.41$.' }
        rubric:
          - text: כתבתי את האנרגיה כ-$\tfrac12\dot r^2 + u_{\text{eff}}(r)$ וקבעתי ש-$\dot r = 0$ מיד אחרי הדחיפה, ולכן P נקודת מפנה.
          - text: נימקתי למה P היא נקודת הקרבה ולא נקודת הריחוק, למשל מכך שהמינימום של $u_{\text{eff}}$ זז החוצה, ל-$\lambda^2r_0$.
          - text: 'חישבתי $\varepsilon = (\lambda^2/2 - 1)GM_E/r_0$ ומצאתי שהמסלול קשור כש-$\lambda < \sqrt2$.'
          - text: בדקתי ש-$\lambda = 1$ מחזיר את המסלול המעגלי ו-$\lambda = \sqrt2$ נותן $\varepsilon = 0$.

      - label: ג
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-6.4-2]
        prompt: מה האקסצנטריות של המסלול החדש?
        answer: 0.44
        unit: ''
        correctFeedback: >-
          נכון. $\varepsilon = (\lambda^2/2 - 1)GM_E/r_0$ ו-$h^2 = \lambda^2r_0GM_E$, ולכן
          $$e^2 = 1 + \frac{2\varepsilon h^2}{(GM_E)^2} = 1 + (\lambda^2 - 2)\lambda^2 = (\lambda^2 - 1)^2$$
          ולכן $e = \lambda^2 - 1 = 0.44$. בדרך אחרת: $p = h^2/GM_E = \lambda^2r_0$, וב-P, $r_0 = p/(1 + e)$. **בדיקת גבולות:**
          $\lambda = 1$ נותן $e = 0$, מעגל, ו-$\lambda = \sqrt2$ נותן $e = 1$, פרבולה.
        wrongFeedback: 'הציבו את $\varepsilon$ ואת $h$ שאחרי הדחיפה ב-$e^2 = 1 + 2\varepsilon h^2/(GM_E)^2$, או השתמשו ב-$r_p = p/(1 + e)$ עם $p = h^2/GM_E$.'
        commonWrong:
          - value: 0.2
            feedback: 'זה $\lambda - 1$. האקסצנטריות תלויה בריבוע המהירות: $e = \lambda^2 - 1$.'
          - value: 1.44
            feedback: 'זה $\lambda^2$, בלי להחסיר 1. בבדיקת הגבול: בלי דחיפה, $\lambda = 1$, האקסצנטריות חייבת להיות אפס.'
          - value: 0.4
            feedback: 'זה $2(\lambda - 1)$, הקירוב לדחיפה קטנה. עם $\lambda = 1.20$ הדחיפה לא קטנה: $\lambda^2 - 1 = 0.44$.'
        hints:
          - '$p = h^2/GM_E = \lambda^2r_0$, ו-P היא נקודת הקרבה.'

      - label: ד
        type: numeric
        points: 5
        level: bagrut
        standalone: false
        objectives: [OBJ-6.5-2, OBJ-6.4-1]
        prompt: מה זמן המחזור של המסלול החדש, בדקות?
        answer: 232
        unit: min
        correctFeedback: >-
          נכון. נקודת הריחוק: $r_a = r_0\dfrac{1 + e}{1 - e} = 1.80\cdot10^{7}\,\text{m}$, ולכן $a = \dfrac{r_0 + r_a}{2} = 1.25\cdot10^{7}\,\text{m}$
          (וגם $a = r_0/(2 - \lambda^2)$ מ-$\varepsilon = -GM_E/(2a)$). מהחוק השלישי $T = 2\pi\sqrt{a^3/GM_E} = 1.39\cdot10^{4}\,\text{s} = 232\,\text{min}$,
          יותר מכפליים מ-$97.2\,\text{min}$ של המסלול המעגלי: דחיפה של $20\%$ הגדילה את $a$ ב-$79\%$.
        wrongFeedback: 'מצאו את $a$: מנקודת הקרבה ונקודת הריחוק, או מהאנרגיה, $\varepsilon = -GM_E/(2a)$. אחר כך החוק השלישי.'
        commonWrong:
          - value: 97.2
            feedback: 'זה זמן המחזור של המסלול המעגלי לפני הדחיפה, עם $a = r_0$. הדחיפה הגדילה את האנרגיה, ולכן גם את $a$.'
          - value: 401
            feedback: 'הצבתם את נקודת הריחוק, $1.80\cdot10^{7}\,\text{m}$, במקום $a$. חצי הציר הראשי הוא הממוצע של $r_0$ ושל $r_a$.'
        hints:
          - '$r_a = r_p\dfrac{1 + e}{1 - e}$.'

      - label: ה
        type: mc
        points: 4
        level: bagrut
        qualitative: true
        standalone: false
        objectives: [OBJ-6.5-2, OBJ-6.6-2]
        prompt: >-
          לוויין שני נשאר על המסלול המעגלי המקורי, וברגע הדחיפה עבר ב-P צמוד ללוויין הראשון. איפה נמצא הלוויין השני כשהלוויין
          שקיבל את הדחיפה חוזר בפעם הראשונה ל-P? (הזוויות נמדדות ממרכז כדור הארץ, בכיוון התנועה.)
        choices:
          - text: 'הוא השלים בינתיים כ-$2.4$ סיבובים, ונמצא כ-$139^\circ$ אחרי P, בכיוון התנועה.'
            correct: true
            feedback: >-
              נכון. $T/T_0 = (a/r_0)^{3/2} = (2 - \lambda^2)^{-3/2} = 2.39$: בזמן שהלוויין שנדחף עושה סיבוב אחד, $232\,\text{min}$,
              הלוויין השני עושה $2.39$ סיבובים, והחלק העודף, $0.386$ סיבוב, הוא $139^\circ$. דחיפה **קדימה** השאירה את הלוויין
              מאחור: הוא מהיר יותר רק ליד P, ועולה למסלול ארוך ואיטי. זו הסיבה שבג׳מיני 4 דחיפה לכיוון המטרה לא קירבה אליה.
          - text: 'ב-P, צמוד לראשון: דחיפה בכיוון התנועה משנה את צורת המסלול, אבל לא את זמן המחזור.'
            feedback: 'זמן המחזור תלוי ב-$a$, ו-$a$ נקבע מהאנרגיה, $\varepsilon = -GM_E/(2a)$. הדחיפה הגדילה את $\varepsilon$, ולכן את $a$ ואת $T$: $232$ במקום $97.2\,\text{min}$.'
          - text: 'הוא עוד לא חזר ל-P: הלוויין הראשון קיבל דחיפה קדימה, ולכן הוא מקדים את השני.'
            feedback: >-
              הלוויין הראשון מהיר יותר רק ליד נקודת הקרבה. בדרך אל נקודת הריחוק, ב-$1.80\cdot10^{7}\,\text{m}$, הוא מאט מאוד, והסיבוב
              שלו נמשך $232\,\text{min}$ לעומת $97.2$. בזמן הזה השני עבר את P פעמיים.
          - text: 'הוא השלים כ-$1.8$ סיבובים, כי $a$ גדל פי $1.79$ ולכן גם זמן המחזור.'
            feedback: 'לפי החוק השלישי $T \propto a^{3/2}$, לא $T \propto a$: $1.79^{3/2} = 2.39$.'
        hints:
          - 'השוו את זמן המחזור מחלק ד לזמן המחזור של המסלול המעגלי. כמה סיבובים עושה הלוויין השני בזמן שהראשון עושה אחד?'

  # ------------------------------------------------------------ 2: a binary star from Doppler speeds
  - id: Q-6-bagrut-2
    type: bagrut
    title: מסות של כוכב כפול מתוך אפקט דופלר
    prompt: >-
      אסטרונומים צופים בכוכב כפול שמישור המסלול שלו נראה מהצד, ולכן אפקט דופלר מראה את גודל המהירות המלא של כל כוכב. שני
      הכוכבים נעים במסלולים מעגליים סביב מרכז המסה המשותף. גודל המהירות של כוכב 1 הוא $v_1 = 60\,\text{km/s}$, של כוכב
      2 $v_2 = 120\,\text{km/s}$, וזמן המחזור $T = 10.0$ ימים (יום הוא $8.64\cdot10^{4}\,\text{s}$).
      $G = 6.67\cdot10^{-11}\,\text{N}\cdot\text{m}^2/\text{kg}^2$ ומסת השמש $M_S = 1.99\cdot10^{30}\,\text{kg}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-6.2-2]
        prompt: מה היחס בין המסות, $m_1/m_2$?
        answer: 2.0
        unit: ''
        correctFeedback: >-
          נכון. לשני הכוכבים אותו זמן מחזור, ולכן $v_1/v_2 = r_1/r_2$. ממרכז המסה, $m_1r_1 = m_2r_2$, ולכן
          $\dfrac{m_1}{m_2} = \dfrac{r_2}{r_1} = \dfrac{v_2}{v_1} = 2.0$. הכוכב האיטי הוא הכבד.
        wrongFeedback: 'מרכז המסה: $m_1r_1 = m_2r_2$. ואיך קשורים הרדיוסים למהירויות כשזמן המחזור משותף?'
        commonWrong:
          - value: 0.5
            feedback: 'הפכתם את היחס. הכוכב הכבד קרוב יותר למרכז המסה, נע במעגל קטן ולכן לאט: $m_1/m_2 = v_2/v_1$.'
          - value: 4
            feedback: 'העליתם בריבוע. יחס המסות שווה ליחס ההפוך של המהירויות בחזקה ראשונה, מ-$m_1v_1 = m_2v_2$, שימור התנע במערכת מרכז המסה.'
        hints:
          - 'במערכת מרכז המסה התנע הכולל אפס.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-6.2-2]
        prompt: מה המרחק $a$ בין שני הכוכבים?
        answer: 2.48e10
        unit: m
        correctFeedback: >-
          נכון. $r_i = \dfrac{v_iT}{2\pi}$, ו-$a = r_1 + r_2 = \dfrac{(v_1 + v_2)T}{2\pi} = \dfrac{1.8\cdot10^{5}\cdot8.64\cdot10^{5}}{2\pi} = 2.48\cdot10^{10}\,\text{m}$,
          כ-$0.17\,\text{AU}$: הכוכבים קרובים זה לזה הרבה יותר מכדור הארץ לשמש.
        wrongFeedback: 'מצאו את רדיוס המסלול של כל כוכב מהמהירות שלו ומזמן המחזור. מרכז המסה ביניהם, ולכן $a = r_1 + r_2$.'
        commonWrong:
          - value: 8.25e9
            feedback: 'זה $r_1$, רדיוס המסלול של כוכב 1 בלבד. המרחק בין הכוכבים הוא $r_1 + r_2$, כי מרכז המסה ביניהם.'
          - value: 1.65e10
            feedback: 'זה $r_2$ בלבד, כאילו כוכב 1 עומד במרכז. גם הוא נע, במעגל ברדיוס $r_1$, בצד השני של מרכז המסה.'
            misconception: MC-6-heavy-body-fixed
          - value: 1.56e11
            feedback: 'כפלתם מהירות בזמן מחזור: זה היקף, לא רדיוס. $2\pi r = vT$.'
        hints:
          - '$2\pi r_i = v_iT$.'

      - label: ג
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-6.2-1, OBJ-6.5-1]
        prompt: >-
          הראו, מתוך משוואת התנועה היחסית, שסכום המסות הוא
          $$m_1 + m_2 = \frac{(v_1 + v_2)^3\,T}{2\pi G}$$
          בדקו את הביטוי בגבול שבו כוכב אחד קל מאוד ובדקו את היחידות שלו. אחר כך חשבו אותו, בקילוגרמים ובמסות שמש, ומצאו
          את המסה של כל כוכב.
        hints:
          - 'במסלול מעגלי ברדיוס $a$, $|\ddot{\vec r}| = \omega^2a$. מה נשאר אחרי שמחלקים את משוואת התנועה היחסית ב-$\mu$?'
        solution:
          - { kind: law, text: 'התנועה היחסית, עם $\vec r = \vec r_1 - \vec r_2$ (מכוכב 2 אל כוכב 1): $\mu\ddot{\vec r} = -\dfrac{Gm_1m_2}{r^2}\hat r$, עם $\mu = \dfrac{m_1m_2}{m_1 + m_2}$.' }
          - { kind: manipulation, text: 'המרחק קבוע, $r = a$, והקו בין הכוכבים מסתובב במהירות זוויתית $\omega = 2\pi/T$, ולכן $|\ddot{\vec r}| = \omega^2a$: $$\mu\omega^2a = \frac{Gm_1m_2}{a^2}\ \Rightarrow\ \omega^2a^3 = G(m_1 + m_2)$$ (החוק השלישי של קפלר). מחלק ב, $a = (v_1 + v_2)/\omega$, ולכן $$m_1 + m_2 = \frac{\omega^2a^3}{G} = \frac{(v_1 + v_2)^3}{G\omega} = \frac{(v_1 + v_2)^3\,T}{2\pi G}$$' }
          - { kind: limit, text: 'כש-$m_2 \to 0$, כוכב 1 עומד ($v_1 \to 0$), ו-$m_1 = \dfrac{v_2^3T}{2\pi G}$. עם $v_2 = 2\pi a/T$ זה $m_1 = \dfrac{4\pi^2a^3}{GT^2}$: המסה של כוכב מתוך מסלול של כוכב לכת קל, כמו שמחשבים את מסת השמש ממסלול כדור הארץ.' }
          - { kind: units, text: '$\dfrac{(\text{m/s})^3\cdot\text{s}}{\text{N}\cdot\text{m}^2/\text{kg}^2} = \dfrac{\text{m}^3/\text{s}^2}{\text{m}^3/(\text{kg}\cdot\text{s}^2)} = \text{kg}$.' }
          - { kind: substitution, text: '$m_1 + m_2 = \dfrac{(1.8\cdot10^{5})^3\cdot8.64\cdot10^{5}}{2\pi\cdot6.67\cdot10^{-11}} = 1.20\cdot10^{31}\,\text{kg}$. מחלק א, $m_1 = 2m_2$, ולכן $m_1 = \tfrac23\cdot1.20\cdot10^{31} = 8.02\cdot10^{30}\,\text{kg}$ ו-$m_2 = 4.01\cdot10^{30}\,\text{kg}$.' }
          - { kind: result, text: '$m_1 + m_2 = \dfrac{(v_1 + v_2)^3T}{2\pi G} = 1.20\cdot10^{31}\,\text{kg}$, כ-$6.0$ מסות שמש: $m_1 = 8.02\cdot10^{30}\,\text{kg}$ (כ-$4.0\,M_S$) ו-$m_2 = 4.01\cdot10^{30}\,\text{kg}$ (כ-$2.0\,M_S$).' }
        rubric:
          - text: כתבתי את משוואת התנועה היחסית עם $\mu$, והשתמשתי בתאוצה הצנטריפטלית $\omega^2a$ של המרחק ביניהם.
          - text: קיבלתי $\omega^2a^3 = G(m_1 + m_2)$, והצבתי $a = (v_1 + v_2)T/(2\pi)$.
          - text: בדקתי שבגבול של כוכב קל מאוד מתקבל החוק השלישי של קפלר לכוכב לכת.
          - text: בדקתי שהיחידות של הביטוי הן קילוגרמים.
          - text: חישבתי $1.20\cdot10^{31}\,\text{kg}$, כ-6 מסות שמש, עם $T$ בשניות, וחילקתי לפי היחס מחלק א.

      - label: ד
        type: numeric
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-6.2-2, OBJ-6.5-2]
        prompt: >-
          נניח שאותן מדידות, $60$ ו-$120\,\text{km/s}$ וזמן מחזור של $10.0$ ימים, התקבלו מכוכב כפול אחר, שמישור המסלול שלו
          **לא** נראה מהצד: הניצב למישור המסלול יוצר זווית $i = 60^\circ$ עם קו הראייה. אז אפקט דופלר מראה מכל מהירות רק את
          הרכיב שלה לאורך קו הראייה, והגדול ביותר מהרכיבים האלה הוא $v\sin i$. מה המסה של כוכב 1 בכוכב הכפול הזה, בקילוגרמים?
        answer: 1.23e31
        unit: kg
        correctFeedback: >-
          נכון. המהירויות האמיתיות הן $v_1 = 60/\sin i$ ו-$v_2 = 120/\sin i\ \text{km/s}$. היחס ביניהן לא השתנה, ולכן $m_1 = 2m_2$,
          וגם $T$ לא השתנה. אבל סכום המסות הולך כמו **שלישית** המהירות: $m_1 + m_2 = \dfrac{(v_1 + v_2)^3T}{2\pi G}$ גדל פי
          $1/\sin^3 60^\circ = 1.54$, ל-$1.85\cdot10^{31}\,\text{kg}$. לכן $m_1 = \tfrac23\cdot1.85\cdot10^{31} = 1.23\cdot10^{31}\,\text{kg}$,
          כ-$6.2$ מסות שמש. **בדיקת גבולות:** ב-$i = 90^\circ$ חוזרים לחלק ג; כש-$i \to 0$ דופלר לא מראה כלום. כשהנטייה לא

      - label: ב
        type: open
        points: 6
        level: mid
        objectives: [OBJ-3.5-2, OBJ-4.1-1, OBJ-4.2-2]
        prompt: >-
          בטאו באמצעות $M$, $m$, $v_d$ ו-$v_c$ את הרכיבים $V_r$ ו-$V_\theta$ של מהירות הגוף המשותף מיד אחרי ההתנגשות,
          ואת האנרגיה הקינטית $\Delta K$ שהלכה לאיבוד בהתנגשות.
        hints:
          - 'הרכיב המשיקי של התנע בא רק מהלוויין, והרכיב הרדיאלי רק מהגוש.'
        solution:
          - { kind: law, text: 'שימור התנע בזמן ההתנגשות (חלק א). מיד לפניה תנע הלוויין $Mv_c\,\hat\theta$ ותנע הגוש $\vec p_d = -mv_d\,\hat r$, פנימה; אחריה יש גוף אחד, בעל מסה $M + m$ ומהירות $\vec V$: $(M + m)\vec V = Mv_c\,\hat\theta - mv_d\,\hat r$.' }
          - { kind: manipulation, text: 'ברכיבים: $V_\theta = \dfrac{M}{M + m}v_c$ ו-$V_r = -\dfrac{m}{M + m}v_d$. הגוף המשותף איטי מ-$v_c$ ונע מעט פנימה.' }
          - { kind: manipulation, text: 'לפני: $K_0 = \tfrac12Mv_c^2 + \tfrac12mv_d^2$. אחרי: $K_1 = \dfrac{M^2v_c^2 + m^2v_d^2}{2(M + m)}$. על מכנה משותף: $$\Delta K = K_0 - K_1 = \frac{(M + m)(Mv_c^2 + mv_d^2) - M^2v_c^2 - m^2v_d^2}{2(M + m)} = \frac12\,\frac{Mm}{M + m}\left(v_c^2 + v_d^2\right)$$ זה $\tfrac12\mu v_{\text{rel}}^2$, עם המסה המצומצמת $\mu$ וגודל המהירות היחסית $\sqrt{v_c^2 + v_d^2}$ (שתי המהירויות ניצבות): בהתנגשות פלסטית כל האנרגיה של התנועה היחסית הולכת לאיבוד.' }
          - { kind: limit, text: 'כש-$m \ll M$: $V_\theta \to v_c$, $V_r \to 0$ ו-$\Delta K \to \tfrac12m(v_c^2 + v_d^2)$, כל האנרגיה הקינטית של הגוש במערכת של הלוויין: לוויין כבד כמעט לא מרגיש את הפגיעה. וכש-$v_d = 0$, גוש שעומד במערכת האינרציאלית, $\Delta K = \tfrac12\mu v_c^2$.' }
          - { kind: units, text: '$\dfrac{Mm}{M + m}$ ביחידות $\text{kg}$, ולכן $\Delta K$ ב-$\text{kg}\cdot\text{m}^2/\text{s}^2 = \text{J}$.' }
          - { kind: result, text: '$V_\theta = \dfrac{Mv_c}{M + m}$ ו-$V_r = -\dfrac{mv_d}{M + m}$ (פנימה). האנרגיה שהלכה לאיבוד: $\Delta K = \tfrac12\dfrac{Mm}{M + m}\left(v_c^2 + v_d^2\right)$.' }
        rubric:
          - text: 'כתבתי שימור תנע וקטורי ופירקתי אותו לרכיב משיקי ולרכיב רדיאלי.'
          - text: 'קיבלתי $\Delta K = \tfrac12\mu(v_c^2 + v_d^2)$, וזיהיתי בו את האנרגיה של התנועה היחסית.'
          - text: 'בדקתי שכש-$m \ll M$ מהירות הלוויין כמעט לא משתנה.'

      - label: ג
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-6.3-1, OBJ-6.3-2, OBJ-3.8-1]
        prompt: >-
          סמנו $\kappa = \dfrac{M}{M + m}$ ו-$w = \dfrac{mv_d}{M + m}$, כך שמחלק ב $V_\theta = \kappa v_c$ ו-$V_r = -w$.

          (1) בטאו באמצעות $\kappa$, $w$, $v_c$ ו-$r_0$ את התנע הזוויתי $h$ ואת האנרגיה $\varepsilon$, ליחידת מסה, של
          הגוף המשותף אחרי ההתנגשות. הראו ש-$h$ יוצא גם משימור התנע הזוויתי של שני הגופים יחד.

          (2) הראו שנקודת הפגיעה אינה נקודת קרבה ואינה נקודת ריחוק של המסלול החדש, וקבעו אל איזו מהן הגוף נע מיד אחרי
          הפגיעה. מה התנאי לכך שהמסלול החדש קשור?
        hints:
          - 'בנקודת מפנה $\dot r = 0$. מה $\dot r$ מיד אחרי הפגיעה?'
          - 'מה התנע הזוויתי של הגוש סביב מרכז כדור הארץ, כשהוא נע לאורך הרדיוס?'
        solution:
          - { kind: law, text: 'בכוח מרכזי נשמרים $h = rV_\theta$ ו-$\varepsilon = \tfrac12V^2 - \dfrac{GM_E}{r} = \tfrac12\dot r^2 + u_{\text{eff}}(r)$, עם $u_{\text{eff}}(r) = \dfrac{h^2}{2r^2} - \dfrac{GM_E}{r}$. בזמן ההתנגשות הכוח החיצוני היחיד הוא הכבידה, שהמומנט שלה סביב המרכז אפס, ולכן התנע הזוויתי הכולל של שני הגופים נשמר.' }
          - { kind: manipulation, text: '$h = r_0\kappa v_c$. בדרך השנייה: לגוש, שנע לאורך הרדיוס, אין תנע זוויתי סביב המרכז, ולכן $(M + m)h = Mr_0v_c$, ושוב $h = \kappa r_0v_c$. עם $GM_E/r_0 = v_c^2$: $$\varepsilon = \tfrac12\left(\kappa^2v_c^2 + w^2\right) - v_c^2$$' }
          - { kind: manipulation, text: 'מיד אחרי הפגיעה $\dot r = V_r = -w \ne 0$, ולכן זו לא נקודת מפנה: לא נקודת קרבה ולא נקודת ריחוק. $\dot r < 0$: הגוף מתקרב לכדור הארץ, בדרך אל נקודת הקרבה. המסלול קשור כש-$\varepsilon < 0$, כלומר כש-$\kappa^2v_c^2 + w^2 < 2v_c^2$.' }
          - { kind: limit, text: 'כש-$m \to 0$: $\kappa \to 1$ ו-$w \to 0$, ולכן $\varepsilon \to -\tfrac12v_c^2 = -\dfrac{GM_E}{2r_0}$, האנרגיה של המסלול המעגלי, ו-$\dot r \to 0$: הלוויין נשאר על המעגל. גוש קל ואיטי משאיר את המסלול קשור, כי אז $\kappa < 1$ ו-$w \ll v_c$.' }
          - { kind: units, text: '$h$ ביחידות $\text{m}\cdot\text{m/s} = \text{m}^2/\text{s}$, ו-$\varepsilon$ ביחידות $\text{m}^2/\text{s}^2 = \text{J/kg}$.' }
          - { kind: result, text: '$h = \kappa r_0v_c$ ו-$\varepsilon = \tfrac12(\kappa^2v_c^2 + w^2) - v_c^2$. נקודת הפגיעה אינה נקודת מפנה, והגוף נע ממנה אל נקודת הקרבה. המסלול קשור כש-$\kappa^2v_c^2 + w^2 < 2v_c^2$.' }
        rubric:
          - text: 'כתבתי $h = \kappa r_0v_c$ ובדקתי אותו משימור התנע הזוויתי של שני הגופים, שבו לגוש תנע זוויתי אפס.'
          - text: 'כתבתי את $\varepsilon$ עם שני רכיבי המהירות והשתמשתי ב-$GM_E/r_0 = v_c^2$.'
          - text: 'נימקתי מ-$\dot r \ne 0$ שנקודת הפגיעה אינה נקודת מפנה, ומ-$\dot r < 0$ שהגוף נע אל נקודת הקרבה.'
          - text: 'בדקתי שכש-$m \to 0$ חוזרים לאנרגיה של המסלול המעגלי.'


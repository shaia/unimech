      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-6.5-2, OBJ-6.6-2]
        prompt: >-
          החללית צריכה להגיע לנקודת הריחוק של אליפסת המעבר בדיוק כשקרס שם. כמה זמן נמשכת הדרך, ובאיזו זווית צריך קרס
          להקדים את כדור הארץ (כפי שנמדדת מהשמש) ברגע היציאה?
        hints:
          - 'נקודת הריחוק נמצאת מול נקודת היציאה, $180^\circ$ סביב השמש. כמה מעלות עובר קרס בזמן הדרך?'
        solution:
          - { kind: law, text: 'החוק השלישי של קפלר: $T = 2\pi\sqrt{a^3/(GM_S)}$ לכל מסלול סביב השמש. הדרך היא חצי אליפסת המעבר, $a = (r_1 + r_2)/2 = 1.885\,\text{AU}$.' }
          - { kind: manipulation, text: 'זמן הדרך: $t = \pi\sqrt{a^3/(GM_S)}$. קרס נע במהירות זוויתית קבועה $360^\circ/T_C$, עם $T_C = 2\pi\sqrt{r_2^3/(GM_S)}$, ובזמן $t$ הוא עובר $\Delta\varphi = 360^\circ\cdot t/T_C = 180^\circ\left(\dfrac{a}{r_2}\right)^{3/2}$. החללית מגיעה לנקודה שמול נקודת היציאה, ולכן קרס צריך להקדים בזווית $$\varphi = 180^\circ - 180^\circ\left(\frac{a}{r_2}\right)^{3/2}$$' }
          - { kind: limit, text: 'כש-$r_2 \to r_1$, $a \to r_2$ ו-$\varphi \to 0$: מעבר בין שני מסלולים כמעט שווים לא דורש הקדמה. וכש-$r_2 \gg r_1$, $a \approx r_2/2$, ו-$\varphi \to 180^\circ(1 - 2^{-3/2}) \approx 116^\circ$: גוף רחוק ואיטי זז מעט בזמן הדרך.' }
          - { kind: units, text: '$\sqrt{a^3/(GM_S)}$ ביחידות $\sqrt{\text{m}^3/(\text{m}^3/\text{s}^2)} = \text{s}$, ו-$(a/r_2)^{3/2}$ חסר ממדים, ולכן $\varphi$ זווית.' }
          - { kind: substitution, text: '$t = \pi\sqrt{\dfrac{(2.83\cdot10^{11})^3}{1.33\cdot10^{20}}} = 4.10\cdot10^{7}\,\text{s}$, כ-474 ימים. $(1.885/2.77)^{3/2} = 0.561$, ולכן קרס עובר $101.0^\circ$, ו-$\varphi = 79.0^\circ$.' }
          - { kind: result, text: 'הדרך נמשכת כ-474 ימים, יותר משנה. ברגע היציאה קרס צריך להקדים את כדור הארץ בכ-$79^\circ$.' }
        rubric:
          - text: חישבתי את זמן הדרך כחצי זמן המחזור של אליפסת המעבר, עם $a = 1.885\,\text{AU}$, וקיבלתי כ-474 ימים.
          - text: חישבתי את הזווית שקרס עובר בזמן הדרך, כ-$101^\circ$, מזמן המחזור שלו.
          - text: הבנתי שהחללית מגיעה לנקודה שמול נקודת היציאה, וקיבלתי הקדמה של כ-$79^\circ$.
          - text: בדקתי גבול, למשל ש-$r_2 \to r_1$ נותן הקדמה אפס.


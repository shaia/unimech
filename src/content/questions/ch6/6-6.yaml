      $$\Delta v_1 = v_p - v_1 = 2.43\,\text{km/s},\qquad \Delta v_2 = v_2 - v_a = 1.47\,\text{km/s}$$
      והסכום $3.89\,\text{km/s}$; הדרך נמשכת $5.3$ שעות. **בדיקת גבולות:** כש-$r_2 \to r_1$, $v_p$ ו-$v_a$ שואפים שניהם ל-$v_1$,

  - id: Q-6.6-hohmann-vs-escape
    type: numeric
    objectives: [OBJ-6.6-2, OBJ-6.6-1]
    level: bagrut
    prompt: >-
      לוויין נע במסלול מעגלי ברדיוס $r_1$ סביב כוכב לכת. למפעילים שתי אפשרויות: (א) להעביר אותו במסלול הוהמן למסלול מעגלי
      ברדיוס $5r_1$; (ב) להוציא אותו מהשדה של כוכב הלכת לגמרי, בדחיפה אחת בכיוון התנועה. מה היחס בין סכום הגדלים של שינויי
      המהירות באפשרות (א) לשינוי המהירות באפשרות (ב)?
    answer: 1.16
    unit: ''
    correctFeedback: >-
      נכון, והמעבר ל-$5r_1$ **יקר** יותר מבריחה. ביחידות של $v_1 = \sqrt{GM/r_1}$, עם $x = r_2/r_1 = 5$:
      $$\frac{\Delta v_1}{v_1} = \sqrt{\frac{2x}{1 + x}} - 1 = 0.291$$
      $$\frac{\Delta v_2}{v_1} = \frac{1}{\sqrt x}\left(1 - \sqrt{\frac{2}{1 + x}}\right) = 0.189$$
      הסכום $0.480\,v_1$, והבריחה $(\sqrt2 - 1)v_1 = 0.414\,v_1$; היחס $1.16$. דחיפת הבריחה גדולה מ-$\Delta v_1$ רק
      ב-$0.123\,v_1$, ובבריחה אין דחיפה שנייה; במעבר הוהמן הדחיפה השנייה מוסיפה $0.189\,v_1$, יותר מזה. זה גם הרעיון של
      המעבר בשלוש דחיפות שבשיעור: לעלות רחוק מאוד זול כמעט כמו לברוח. **בדיקת גבולות:** כש-$x \to 1$ היחס שואף ל-$0$; כש-$x \to \infty$, $\Delta v_1 \to (\sqrt2 - 1)v_1$
      ו-$\Delta v_2 \to 0$, והיחס שואף ל-$1$ מלמעלה.
    wrongFeedback: >-
      כתבו את שתי הדחיפות של הוהמן ואת דחיפת הבריחה כולן ביחידות של $v_1$; $GM$ ו-$r_1$ מצטמצמים ביחס. השתמשו ב-vis-viva בשני
      הקצוות של אליפסת המעבר, עם $a = 3r_1$.
    commonWrong:
      - value: 1.33
        feedback: >-
          חישבתם את המעבר כהפרש בין המהירויות המעגליות, $v_1 - v_2 = (1 - 1/\sqrt5)v_1$. אבל שתי הדחיפות מגדילות את המהירות,
          ובאמצע החללית מאטה בלי מנוע: הסכום הוא $\Delta v_1 + \Delta v_2 = 0.480\,v_1$.
        misconception: MC-6-dv-is-speed-difference
      - value: 0.703
        feedback: 'זה רק $\Delta v_1$ חלקי הבריחה. בלי הדחיפה השנייה, $\Delta v_2 = 0.189\,v_1$, החללית חוזרת אל $r_1$.'
      - value: 0.339
        feedback: >-
          חילקתם במהירות המילוט כולה, $\sqrt2\,v_1$. אבל הלוויין כבר נע ב-$v_1$, ולבריחה חסר רק $(\sqrt2 - 1)v_1$.
        misconception: MC-6-delta-v-from-rest
    hints:
      - 'במסלול הוהמן $a = \tfrac12\left(r_1 + 5r_1\right) = 3r_1$; כתבו כל מהירות כמכפלה של $v_1$.'
      - 'לבריחה ממסלול מעגלי צריך להגיע למהירות $\sqrt2\,v_1$.'

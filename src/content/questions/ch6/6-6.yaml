  - id: Q-6.6-leo-geo
    type: numeric
    objectives: [OBJ-6.6-2]
    level: mid
    prompt: >-
      לוויין עובר ממסלול מעגלי נמוך בגובה $300\,\text{km}$ (רדיוס $r_1 = 6.67\cdot10^{6}\,\text{m}$ ממרכז כדור הארץ) למסלול
      גאוסטציונרי ברדיוס $r_2 = 4.22\cdot10^{7}\,\text{m}$, במסלול הוהמן. $GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$.
      מה הסכום של גדלי שני שינויי המהירות? ענו ב-$\text{km/s}$.
    answer: 3.89
    unit: km/s
    correctFeedback: >-
      נכון. המהירויות המעגליות: $v_1 = 7.72$ ו-$v_2 = 3.07\,\text{km/s}$. על אליפסת המעבר, עם $a = (r_1 + r_2)/2 = 2.44\cdot10^{7}\,\text{m}$,
      vis-viva נותן $v_p = 10.15$ בנקודת הקרבה ו-$v_a = 1.60\,\text{km/s}$ בנקודת הריחוק. לכן
      $$\Delta v_1 = v_p - v_1 = 2.43\,\text{km/s},\qquad \Delta v_2 = v_2 - v_a = 1.47\,\text{km/s}$$
      והסכום $3.89\,\text{km/s}$; הדרך נמשכת $5.3$ שעות. **בדיקת גבולות:** כש-$r_2 \to r_1$, $v_p$ ו-$v_a$ שואפים שניהם ל-$v_1$,
      ושני השינויים לאפס.
    wrongFeedback: >-
      חשבו ארבע מהירויות: המעגלית ב-$r_1$, המעגלית ב-$r_2$, ושתי המהירויות על אליפסת המעבר בקצותיה (vis-viva עם
      $a = (r_1 + r_2)/2$). כל שינוי מהירות הוא ההפרש באותה נקודה.
    commonWrong:
      - value: 4.65
        feedback: >-
          זה ההפרש בין המהירויות המעגליות, $v_1 - v_2$. אבל שתי הדחיפות **מגדילות** את המהירות. באמצע, בעלייה, החללית מאטה

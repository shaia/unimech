      - value: 2.43
        feedback: 'זה רק $\Delta v_1$, ביציאה מהמסלול הנמוך. בנקודת הריחוק צריך דחיפה שנייה כדי להישאר במעגל: $v_2 - v_a = 1.47\,\text{km/s}$.'
      - value: 0.960
        feedback: >-
          חישבתם את הדחיפה השנייה כהאטה, $\Delta v_1 - \Delta v_2$. בנקודת הריחוק החללית איטית מהמהירות המעגלית ב-$r_2$,
          ולכן גם שם מאיצים, ושני הגדלים מתחברים.
        misconception: MC-6-outer-orbit-slower-so-brake
    hints:

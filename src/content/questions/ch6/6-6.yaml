      הוהמן. שני המסלולים מעגליים ובאותו מישור. $GM_S = 1.33\cdot10^{20}\,\text{m}^3/\text{s}^2$ ו-$1\,\text{AU} = 1.5\cdot10^{11}\,\text{m}$.

# Lesson 6.6 question bank: the comprehension ladder of "מילוט ומסלולי מעבר".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). Notation: vis-viva v² = GM(2/r − 1/a); a Hohmann transfer between circles r₁ < r₂ is half
# an ellipse with a = (r₁ + r₂)/2. YAML note: never "…" for TeX.
#
# Every number is computed from the values the prompt states (GM_E = 3.98e14, GM_S = 1.33e20 m³/s²,
# 1 AU = 1.5e11 m), as the learner computes it; recomputed for lesson 6.6 by .scratch/ch6/6-6/bank.ts and
# perigee.ts (src/physics/orbit.ts, transfer.ts):
#   Earth's surface: v_esc = √(2GM/R) = 11.2 km/s (v_c 7.90, 2GM/R without the root 125);
#   r = 2.0 AU, a = 4.0 AU: v = 25.8 km/s (v_c(r) 21.1, v_c(a) 14.9, v_esc(r) 29.8);
#   circular orbit 400 km up (r = 6.77e6 m): v_c = 7.67 km/s, Δv = (√2 − 1)v_c = 3.18 km/s (v_esc(r) 10.8,
#     surface v_esc − v_c 3.51, surface v_esc 11.2);
#   ellipse r_p = 7.0e6 m, r_a = 3.0e7 m: v_p = 9.60 km/s, v_esc(r_p) = 10.7 km/s, Δv at perigee 1.06 km/s
#     (at apogee 2.91, v_esc − v_c at r_p 3.12, all of v_esc 10.7);
#   Earth → Mars (1.00 → 1.52 AU): a = 1.26 AU, t = T/2 = 259 days (full ellipse 518, half Mars year 343,
#     half Earth year 183);
#   LEO 300 km (r₁ = 6.67e6 m) → GEO (r₂ = 4.22e7 m): v₁ = 7.72, v_p = 10.15, v_a = 1.60, v₂ = 3.07 km/s;
#     Δv₁ = 2.43, Δv₂ = 1.47, total 3.89 km/s (v₁ − v₂ 4.65, Δv₁ − Δv₂ 0.960); transfer time 5.28 h;
#   Hohmann r₁ → 5r₁ against escape from r₁, in units of v₁: Δv₁ 0.291, Δv₂ 0.189, total 0.480, escape
#     √2 − 1 = 0.414, ratio 1.16 (v₁ − v₂ gives 1.33, Δv₁ alone 0.703, total/(√2 v₁) 0.339).
# Review for lesson 6.6 (2026-11-11): v_c(2 AU) 21.0 → 21.1 and v_esc(2 AU) 29.7 → 29.8, full ellipse 519 → 518
# and half Mars year 344 → 343 (the keys had used GM_S = 1.327e20, not the prompt's 1.33e20); 10.85 → 10.8 and
# 0.961 → 0.960 in feedback. Q-6.6-escape-from-orbit and Q-6.6-leo-geo move to mid, because the lesson prints the
# formulas that answer them; two new exam rungs (escape-from-perigee, hohmann-vs-escape) climb above the text.

chapter: 6
questions:
  # ---------------------------------------------------------------- OBJ-6.6-1 escape speed and vis-viva
  - id: Q-6.6-escape-direction
    type: mc
    objectives: [OBJ-6.6-1]
    qualitative: true
    level: basic
    prompt: >-
      מתותח על פני ירח חסר אוויר יורים קליעים. מה נכון לגבי המהירות המינימלית שקליע צריך כדי לא לחזור לעולם?
    choices:
      - text: היא זהה לכל כיוון ירי (שבו הקליע לא פוגע בירח) ולכל מסה של קליע.
        correct: true
        feedback: >-
          נכון. התנאי לבריחה הוא $E \ge 0$: $\tfrac12mv^2 - \dfrac{GMm}{R} \ge 0$, כלומר $v \ge \sqrt{2GM/R}$. האנרגיה היא
          סקלר, ולכן הכיוון לא משנה, ו-$m$ מצטמצם.
      - text: היא הקטנה ביותר בירי אנכי, ובכל כיוון אחר צריך יותר.
        feedback: >-
          בירי אנכי הקליע עולה בקו ישר, ובירי משופע במסלול מעוקל, אבל האנרגיה שלו זהה ותלויה רק בגודל המהירות. כל קליע עם
          $E \ge 0$ בורח, באיזה כיוון שנורה.
        misconception: MC-6-escape-vertical
      - text: קליע כבד צריך מהירות גדולה יותר, כי הכבידה מושכת אותו חזק יותר.
        feedback: >-
          הכבידה מושכת אותו חזק יותר, אבל גם האנרגיה הקינטית שלו גדולה יותר באותה מהירות. שני האגפים פרופורציוניים
          ל-$m$, ומהירות המילוט לא תלויה במסה.
        misconception: MC-6-escape-depends-on-mass
      - text: היא המהירות של מסלול מעגלי צמוד לפני הירח.
        feedback: 'במהירות המעגלית $\sqrt{GM/R}$ הקליע מקיף את הירח ולא בורח: $E = -GMm/(2R) < 0$. מהירות המילוט גדולה ממנה פי $\sqrt2$.'
    hints:
      - 'מה צריכה להיות האנרגיה הכוללת של קליע שמגיע לאינסוף?'

  - id: Q-6.6-escape-earth
    type: numeric
    objectives: [OBJ-6.6-1]
    level: basic
    prompt: >-
      מה מהירות המילוט מפני כדור הארץ, אם מזניחים את האוויר ואת הסיבוב? $GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$ ו-$R_E = 6.37\cdot10^{6}\,\text{m}$.
      ענו ב-$\text{km/s}$.
    answer: 11.2
    unit: km/s
    correctFeedback: 'נכון: $v_{\text{esc}} = \sqrt{\dfrac{2GM_E}{R_E}} = \sqrt{1.25\cdot10^{8}}\,\text{m/s} = 11.2\,\text{km/s}$.'
    wrongFeedback: 'השוו את האנרגיה הכוללת לאפס: $\tfrac12v^2 = GM_E/R_E$ ליחידת מסה.'
    commonWrong:
      - value: 7.90
        feedback: 'זו המהירות של מסלול מעגלי צמוד לקרקע, $\sqrt{GM_E/R_E}$. בה הגוף מקיף ולא בורח: מהירות המילוט גדולה ממנה פי $\sqrt2$.'
      - value: 125
        feedback: 'זה $2GM_E/R_E$ ביחידות $\text{km}^2/\text{s}^2$, כלומר $v^2$. הוציאו שורש.'
    hints:
      - 'ב-$E = 0$ הגוף מגיע לאינסוף במהירות אפס.'

  - id: Q-6.6-vis-viva-speed
    type: numeric
    objectives: [OBJ-6.6-1]
    level: mid
    prompt: >-
      אסטרואיד נע סביב השמש ($GM_S = 1.33\cdot10^{20}\,\text{m}^3/\text{s}^2$) באליפסה שחצי הציר הראשי שלה $4.0\,\text{AU}$.
      מה מהירותו כשהוא במרחק $2.0\,\text{AU}$ מהשמש? ($1\,\text{AU} = 1.5\cdot10^{11}\,\text{m}$.) ענו ב-$\text{km/s}$.
    answer: 25.8
    unit: km/s
    correctFeedback: >-
      נכון. משימור אנרגיה עם $E = -GM_Sm/(2a)$:
      $$v^2 = GM_S\left(\frac{2}{r} - \frac{1}{a}\right) = 1.33\cdot10^{20}\left(\frac{2}{3.0\cdot10^{11}} - \frac{1}{6.0\cdot10^{11}}\right)$$
      ולכן $v = 25.8\,\text{km/s}$. זה יותר מהמהירות המעגלית ב-$2.0\,\text{AU}$, $21.1\,\text{km/s}$, כי $r < a$: במרחק
      הזה $2/r - 1/a > 1/r$. אותה מהירות בדרך החוצה ובדרך פנימה; vis-viva נותן רק את הגודל.
    wrongFeedback: 'כתבו את שימור האנרגיה בין הנקודה הזו לבין האנרגיה של המסלול כולו, $-GM_Sm/(2a)$, ובודדו את $v$.'
    commonWrong:
      - value: 21.1
        feedback: >-
          זו המהירות של מסלול **מעגלי** ברדיוס $2.0\,\text{AU}$, $\sqrt{GM_S/r}$. באליפסה המהירות במרחק נתון תלויה גם ב-$a$,
          לפי $v^2 = GM_S(2/r - 1/a)$.
        misconception: MC-6-speed-from-circular-formula
      - value: 14.9
        feedback: 'זו המהירות המעגלית ברדיוס $a$, $\sqrt{GM_S/a}$. היא שווה למהירות באליפסה רק בנקודה שבה $r = a$.'
        misconception: MC-6-speed-from-circular-formula
      - value: 29.8
        feedback: 'זו מהירות המילוט ב-$2.0\,\text{AU}$, $\sqrt{2GM_S/r}$: שכחתם את האיבר $-1/a$. האסטרואיד קשור, ולכן מהירותו קטנה ממנה.'
    hints:
      - 'ליחידת מסה, $\tfrac12v^2 - \dfrac{GM_S}{r} = -\dfrac{GM_S}{2a}$.'

  - id: Q-6.6-minor-axis
    type: twotier
    objectives: [OBJ-6.6-1]
    qualitative: true
    level: mid
    prompt: >-
      לוויין נע באליפסה בעלת חצי ציר ראשי $a$ סביב כוכב לכת. בקצה הציר המשני של האליפסה המרחק של הלוויין מהמוקד, שבו
      כוכב הלכת, הוא בדיוק $a$ (תכונה גיאומטרית של כל אליפסה). איך משווה מהירותו שם למהירות של לוויין במסלול מעגלי ברדיוס $a$?
    choices:
      - text: שווה.
        correct: true
        feedback: >-
          נכון. לפי vis-viva, $v^2 = GM\left(\dfrac{2}{a} - \dfrac{1}{a}\right) = \dfrac{GM}{a}$, בדיוק כמו במסלול המעגלי. אבל
          הכיוון שונה: באליפסה המהירות שם לא ניצבת לרדיוס.
      - text: גדולה יותר, כי באליפסה הלוויין צריך יותר אנרגיה כדי להגיע רחוק.
        feedback: >-
          לשני המסלולים אותו $a$ ולכן אותה אנרגיה, $-GMm/(2a)$. באותו מרחק גם האנרגיה הפוטנציאלית שווה, ולכן גם הקינטית.
      - text: קטנה יותר, כי באליפסה הלוויין איטי יותר במרחקים גדולים.
        feedback: 'הלוויין איטי רק כשהוא רחוק יותר מ-$a$. במרחק $a$ בדיוק, vis-viva נותן את אותה מהירות כמו המסלול המעגלי.'
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: 'באותו $a$ האנרגיה זהה, ובאותו מרחק $r = a$ גם האנרגיה הפוטנציאלית זהה, ולכן גם גודל המהירות.'
        correct: true
        feedback: 'זה הנימוק, וזה בדיוק vis-viva: $v^2 = GM(2/r - 1/a)$ עם $r = a$.'
      - text: 'בכל מסלול המהירות היא $\sqrt{GM/r}$, וכאן $r = a$.'
        feedback: >-
          התשובה יוצאת נכונה במקרה. $\sqrt{GM/r}$ נכון רק במסלול מעגלי: בנקודת הקרבה של אליפסה המהירות גדולה ממנו,
          ובנקודת הריחוק קטנה ממנו.
        misconception: MC-6-speed-from-circular-formula
      - text: 'בקצה הציר המשני הלוויין נמצא באמצע הדרך בזמן בין נקודת הקרבה לנקודת הריחוק.'
        feedback: 'לפי החוק השני, הלוויין מגיע לקצה הציר המשני לפני שעבר חצי מהזמן שבין נקודת הקרבה לנקודת הריחוק, כי בצד הקרוב הוא מהיר. ובכל מקרה, הזמן לא קובע את המהירות; האנרגיה כן.'
    hints:
      - 'כתבו את vis-viva בנקודה שבה $r = a$.'

  - id: Q-6.6-escape-from-orbit
    type: numeric
    objectives: [OBJ-6.6-1]
    level: mid
    prompt: >-
      חללית נמצאת במסלול מעגלי בגובה $400\,\text{km}$ מעל פני כדור הארץ ($R_E = 6.37\cdot10^{6}\,\text{m}$,
      $GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$). המנוע שלה פועל לזמן קצר מאוד. מה שינוי המהירות המינימלי
      $\Delta v$ שיוציא אותה מהשדה של כדור הארץ? ענו ב-$\text{km/s}$.
    answer: 3.18
    unit: km/s
    correctFeedback: >-
      נכון. ב-$r = 6.77\cdot10^{6}\,\text{m}$ המהירות המעגלית $v_c = \sqrt{GM_E/r} = 7.67\,\text{km/s}$, ומהירות המילוט
      $\sqrt2\,v_c = 10.8\,\text{km/s}$. הדחיפה הזולה ביותר היא בכיוון התנועה, ואז $\Delta v = (\sqrt2 - 1)v_c = 3.18\,\text{km/s}$.
      **בדיקת גבולות:** כש-$r \to \infty$ גם $v_c$ וגם $\Delta v$ שואפים לאפס: רחוק מכדור הארץ קל לברוח ממנו.
    wrongFeedback: >-
      החללית כבר נעה במהירות המעגלית. מצאו את מהירות המילוט ב-$r = R_E + 400\,\text{km}$, ובדקו כמה חסר לה כשהדחיפה
      בכיוון התנועה.
    commonWrong:
      - value: 10.8
        feedback: 'זו מהירות המילוט מהמסלול. אבל החללית כבר נעה ב-$7.67\,\text{km/s}$, ודחיפה בכיוון התנועה צריכה להוסיף רק את ההפרש.'
        misconception: MC-6-delta-v-from-rest
      - value: 3.51
        feedback: 'החסרתם את המהירות המעגלית ממהירות המילוט **מפני הקרקע**. במסלול החללית כבר גבוהה יותר, ומהירות המילוט שם קטנה יותר: $\sqrt{2GM_E/r}$ עם $r = R_E + 400\,\text{km}$.'
      - value: 11.2
        feedback: 'זו מהירות המילוט מפני הקרקע, ממנוחה. החללית כבר במסלול: גבוהה יותר, ובתנועה.'
        misconception: MC-6-delta-v-from-rest
    hints:
      - 'במסלול מעגלי, $v_{\text{esc}} = \sqrt2\,v_c$ באותו רדיוס.'

  - id: Q-6.6-escape-from-perigee
    type: numeric
    objectives: [OBJ-6.6-1]
    level: bagrut
    prompt: >-
      לוויין נע סביב כדור הארץ ($GM_E = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$) באליפסה: נקודת הקרבה במרחק
      $7.0\cdot10^{6}\,\text{m}$ ממרכז כדור הארץ, ונקודת הריחוק במרחק $3.0\cdot10^{7}\,\text{m}$. בנקודת הקרבה המנוע
      פועל לזמן קצר מאוד, בכיוון התנועה. מה שינוי המהירות $\Delta v$ הקטן ביותר שבו הלוויין יוצא מהשדה של כדור
      הארץ ולא חוזר? ענו ב-$\text{km/s}$.
    answer: 1.06
    unit: km/s
    correctFeedback: >-
      נכון. חצי הציר הראשי $a = \tfrac12\left(r_p + r_a\right) = 1.85\cdot10^{7}\,\text{m}$, ו-vis-viva בנקודת הקרבה נותן
      $v_p = \sqrt{GM_E\left(2/r_p - 1/a\right)} = 9.60\,\text{km/s}$. מהירות המילוט שם $\sqrt{2GM_E/r_p} = 10.7\,\text{km/s}$,
      ולכן
      $$\Delta v = \sqrt{\frac{2GM_E}{r_p}} - \sqrt{GM_E\left(\frac{2}{r_p} - \frac{1}{a}\right)} = 1.06\,\text{km/s}$$
      **בדיקת גבולות:** כש-$r_a \to r_p$ המסלול מעגלי, ו-$\Delta v \to (\sqrt2 - 1)v_c$; כש-$r_a \to \infty$, $a \to \infty$
      ו-$\Delta v \to 0$: מסלול שכבר כמעט פרבולה צריך רק דחיפה קטנה. (בנקודת הריחוק אותה בריחה הייתה עולה $2.91\,\text{km/s}$:
      הלוויין איטי שם, אבל גם מהירות המילוט קטנה, וההפרש גדול יותר.)
    wrongFeedback: >-
      מצאו קודם את המהירות של הלוויין בנקודת הקרבה מתוך $a$ (vis-viva), ואחר כך את מהירות המילוט באותו מרחק. הדחיפה
      בכיוון התנועה צריכה להשלים רק את ההפרש.
    commonWrong:
      - value: 3.12
        feedback: >-
          חישבתם את מהירות הלוויין בנקודת הקרבה כמהירות מעגלית, $\sqrt{GM_E/r_p} = 7.54\,\text{km/s}$. אבל הלוויין באליפסה,
          ובנקודת הקרבה שלה הוא מהיר יותר: $v_p = 9.60\,\text{km/s}$ לפי vis-viva.
        misconception: MC-6-speed-from-circular-formula
      - value: 2.91
        feedback: >-
          זה שינוי המהירות שהיה נדרש **בנקודת הריחוק**, $\sqrt{2GM_E/r_a} - v_a$ עם $v_a = 2.24\,\text{km/s}$. השאלה על דחיפה
          בנקודת הקרבה, ושם הוא קטן בהרבה.
      - value: 10.7
        feedback: 'זו מהירות המילוט כולה בנקודת הקרבה. אבל הלוויין כבר נע שם ב-$9.60\,\text{km/s}$, וחסר רק ההפרש.'
        misconception: MC-6-delta-v-from-rest
    hints:
      - 'vis-viva בנקודת הקרבה: $v_p^2 = GM_E\left(2/r_p - 1/a\right)$ עם $a = \tfrac12\left(r_p + r_a\right)$.'
      - 'בורחים כשהאנרגיה ליחידת מסה מגיעה ל-$0$, כלומר כשהמהירות מגיעה ל-$\sqrt{2GM_E/r}$ באותו מרחק.'

  # ---------------------------------------------------------------- OBJ-6.6-2 Hohmann transfers
  - id: Q-6.6-transfer-a
    type: mc
    objectives: [OBJ-6.6-2]
    qualitative: true
    level: basic
    prompt: >-
      במסלול הוהמן חללית עוברת ממסלול מעגלי ברדיוס $r_1$ למסלול מעגלי ברדיוס $r_2 > r_1$, לאורך חצי אליפסה שמשיקה לשני
      המעגלים. מה חצי הציר הראשי של אליפסת המעבר?
    choices:
      - text: '$\dfrac{r_1 + r_2}{2}$'
        correct: true
        feedback: >-
          נכון. נקודת הקרבה של האליפסה על המעגל הפנימי ונקודת הריחוק על החיצוני, משני צדי כוכב הלכת, ולכן הציר הראשי
          כולו הוא $r_1 + r_2$.
      - text: '$r_2 - r_1$'
        feedback: 'זה המרחק בין המעגלים לאורך רדיוס אחד. אבל אליפסת המעבר עוברת סביב כוכב הלכת: נקודת הקרבה בצד אחד, ונקודת הריחוק בצד השני.'
      - text: '$\sqrt{r_1r_2}$'
        feedback: 'זה הממוצע הגיאומטרי של שני המרחקים. אבל הציר הראשי עובר מנקודת הקרבה, דרך כוכב הלכת, אל נקודת הריחוק: אורכו סכום המרחקים, $r_1 + r_2$, וחצי ממנו הוא הממוצע הרגיל.'
      - text: '$r_2$, כי החללית מגיעה עד המעגל החיצוני.'

# Lesson 5.1 question bank: the comprehension ladder of "התנודה ההרמונית הפשוטה".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut (exam level).
# Convention throughout (the lesson's): x(t) = A cos(ω₀t + φ), ω₀ = √(k/m), so x0 = A cos φ and v0 = −Aω₀ sin φ.
# Every prompt stands alone (the chapter test draws at random).
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was recomputed with src/physics/oscillator.ts and shm.ts (G = 9.8), in .scratch/ch5/5-1/bank.ts:
#   m = 0.50 kg, k = 200 N/m: ω₀ = 20 rad/s, T = 0.314 s (f = 3.18 Hz, 1/ω₀ = 0.050 s, 2πω₀ = 126);
#   x0 = 3.0 cm, v0 = +80 cm/s: A = 5.00 cm (x0 + v0/ω₀ = 7, v0/ω₀ = 4, √(x0² + v0²) = 80.1);
#   φ = atan2(−0.8, 0.6) = −0.927 rad (+0.927, 0.644 = atan(x0ω₀/v0), π − 0.927 = 2.21);
#   first pass through x = 0 at t = (π/2 − φ)/ω₀ = 0.125 s (T/4 = 0.0785, (π/2 + φ)/ω₀ = 0.0322, (3π/2 − φ)/ω₀ = 0.282);
#   k1 = 300, k2 = 600 N/m in series, m = 2.0 kg: k = 200 N/m, ω₀ = 10.0 rad/s (parallel 21.2, k/m = 100, mean k 15.0);
#   m = 0.40 kg, k = 40 N/m, at the relaxed length moving down at 0.70 m/s: Δ = mg/k = 9.80 cm, v0/ω₀ = 7.00 cm,
#     A = 12.04 cm, max stretch Δ + A = 21.8 cm (2Δ = 19.6, Δ + v0/ω₀ = 16.8, A = 12.0, Δ = 9.8, v0/ω₀ = 7.0; energy check 0);
#   between two walls, k1 = 100 and k2 = 50 N/m, m = 0.60 kg: k = 150 N/m, T = 0.397 s
#     (series 0.843, k1 alone 0.487, k2 alone or k1 − k2 0.688).

chapter: 5
questions:
  # ---------------------------------------------------------------- OBJ-5.1-1 the oscillator equation, A and φ
  - id: Q-5.1-which-solves
    type: multi
    objectives: [OBJ-5.1-1]
    qualitative: true
    level: basic
    prompt: >-
      גוף בעל מסה $m$ קשור לקפיץ אופקי בעל קבוע קפיץ $k$, ונע על משטח בלי חיכוך. $x$ הוא ההעתק שלו מנקודת שיווי
      המשקל, ומשוואת התנועה היא $m\ddot x = -kx$. נסמן $\omega_0 = \sqrt{k/m}$. אילו מהפונקציות הבאות פותרות את
      המשוואה? ($A$, $B$, $C$ ו-$\varphi$ הם קבועים.) סמנו את כל התשובות הנכונות.
    choices:
      - text: '$x(t) = A\cos(\omega_0 t + \varphi)$'
        correct: true
        feedback: >-
          נכון. גזירה פעמיים נותנת $\ddot x = -\omega_0^2 A\cos(\omega_0 t + \varphi) = -\omega_0^2 x$, ובהכפלה ב-$m$
          מקבלים $m\ddot x = -m\omega_0^2 x = -kx$.
      - text: '$x(t) = B\cos\omega_0 t + C\sin\omega_0 t$'
        correct: true
        feedback: >-
          נכון. כל אחד מהאיברים פותר את המשוואה, והמשוואה ליניארית, ולכן גם הסכום. זו אותה משפחה של פתרונות כמו
          $A\cos(\omega_0 t + \varphi)$, עם $B = A\cos\varphi$ ו-$C = -A\sin\varphi$.
      - text: '$x(t) = A\cos\omega_0 t + 1$'
        feedback: >-
          הנגזרת השנייה היא $-\omega_0^2 A\cos\omega_0 t$, אבל $-\omega_0^2 x = -\omega_0^2 A\cos\omega_0 t - \omega_0^2$.
          האיבר הקבוע לא מתאזן. קבוע מתווסף לפתרון רק כשיש כוח קבוע נוסף, כמו הכובד בקפיץ אנכי, ואז הוא מזיז את
          נקודת שיווי המשקל.
      - text: '$x(t) = A e^{\omega_0 t}$'
        feedback: >-
          כאן $\ddot x = +\omega_0^2 x$: זו משוואה של גוף שהכוח **מרחיק** אותו מהנקודה, כמו בשיווי משקל לא יציב.
          הסימן המינוס ב-$-kx$ הוא מה שהופך גדילה אקספוננציאלית לתנודה.
      - text: '$x(t) = A\cos\left(\dfrac{k}{m}t\right)$'
        feedback: >-
          גזירה פעמיים מוציאה את המקדם של $t$ בריבוע: $\ddot x = -\dfrac{k^2}{m^2}x$. כדי לקבל $-\dfrac{k}{m}x$ המקדם
          צריך להיות השורש, $\omega_0 = \sqrt{k/m}$. בדיקת יחידות מגלה את זה מיד: $k/m$ ביחידות $\text{s}^{-2}$.
    hints:
      - 'הציבו כל פונקציה במשוואה: גזרו פעמיים, והשוו ל-$-\omega_0^2 x$.'

  - id: Q-5.1-period-value
    type: numeric
    objectives: [OBJ-5.1-1]
    level: basic
    prompt: >-
      גוף בעל מסה $m = 0.50\,\text{kg}$ קשור לקפיץ אופקי בעל קבוע קפיץ $k = 200\,\text{N/m}$, ונע בלי חיכוך. מה זמן
      המחזור של התנודות?
    answer: 0.314
    unit: s
    correctFeedback: >-
      נכון. $\omega_0 = \sqrt{k/m} = \sqrt{200/0.50} = 20\,\text{rad/s}$, וזמן המחזור
      $T = \dfrac{2\pi}{\omega_0} = 0.314\,\text{s}$. שימו לב שהוא לא תלוי באמפליטודה.
    wrongFeedback: 'חשבו קודם את התדירות הזוויתית $\omega_0 = \sqrt{k/m}$. במחזור אחד הארגומנט $\omega_0 t$ גדל ב-$2\pi$.'
    commonWrong:
      - value: 0.05
        feedback: 'זה $1/\omega_0$. במחזור שלם הארגומנט של הקוסינוס גדל ב-$2\pi$, ולכן $T = 2\pi/\omega_0$.'
      - value: 3.18
        feedback: 'זו התדירות $f = \omega_0/(2\pi)$, ביחידות $\text{Hz}$: מספר המחזורים בשנייה. זמן המחזור הוא ההופכי שלה.'
      - value: 125.7
        feedback: 'כפלתם את $\omega_0$ ב-$2\pi$ במקום לחלק. בדקו יחידות: $\omega_0$ ביחידות $\text{s}^{-1}$, וזמן מחזור בשניות.'
    hints:
      - 'מה היחידות של $\sqrt{k/m}$? מה צריך לעשות כדי לקבל שניות?'

  - id: Q-5.1-amplitude-from-ic
    type: numeric
    objectives: [OBJ-5.1-1]
    level: mid
    prompt: >-
      גוף בעל מסה $m = 0.50\,\text{kg}$ קשור לקפיץ אופקי בעל קבוע קפיץ $k = 200\,\text{N/m}$ ונע בלי חיכוך. ברגע
      $t = 0$ הוא נמצא ב-$x_0 = 3.0\,\text{cm}$ מנקודת שיווי המשקל, ונע במהירות $v_0 = 80\,\text{cm/s}$ בכיוון
      החיובי. מה האמפליטודה של התנודה, בסנטימטרים?
    answer: 5.0
    unit: cm
    correctFeedback: >-
      נכון. $\omega_0 = \sqrt{k/m} = 20\,\text{rad/s}$. מ-$x = A\cos(\omega_0 t + \varphi)$: $x_0 = A\cos\varphi$
      ו-$v_0/\omega_0 = -A\sin\varphi$. סכום הריבועים מבטל את הפאזה:
      $$\begin{aligned} A &= \sqrt{x_0^2 + \left(\frac{v_0}{\omega_0}\right)^2} \\ &= \sqrt{3.0^2 + 4.0^2} = 5.0\,\text{cm} \end{aligned}$$
      **בדיקת גבולות:** כש-$v_0 = 0$ מקבלים $A = x_0$, הגוף שוחרר ממנוחה בקצה התנועה.
    wrongFeedback: 'כתבו את $x(0)$ ואת $\dot x(0)$ מתוך $A\cos(\omega_0 t + \varphi)$, העלו את שתיהן בריבוע וחברו.'
    commonWrong:
      - value: 3.0
        feedback: 'זה $x_0$. האמפליטודה שווה להעתק ההתחלתי רק כשהגוף מתחיל ממנוחה. כאן הוא עוד נע החוצה, ולכן יגיע רחוק יותר.'
        misconception: MC-5-amplitude-is-x0
      - value: 7.0
        feedback: 'חיברתם $x_0 + v_0/\omega_0$. שני הגדלים הם רכיבים ניצבים של אותו "וקטור" (קוסינוס וסינוס של הפאזה), ולכן מחברים את הריבועים.'
      - value: 4.0
        feedback: 'זה $v_0/\omega_0$ בלבד: כך היה אילו הגוף יצא מנקודת שיווי המשקל. כאן הוא כבר במרחק $3.0\,\text{cm}$ ממנה.'
      - value: 80.1
        feedback: 'חיברתם ריבועים של העתק ושל מהירות, $\sqrt{x_0^2 + v_0^2}$, ויחידות לא מסתדרות. צריך לחלק את המהירות ב-$\omega_0$ כדי לקבל אורך.'
    hints:
      - 'מה היחידות של $v_0/\omega_0$?'
      - 'זהות עזר: $\cos^2\varphi + \sin^2\varphi = 1$.'

  - id: Q-5.1-phase-from-ic
    type: numeric
    objectives: [OBJ-5.1-1]
    level: mid
    prompt: >-
      גוף על קפיץ מתנודד בלי חיכוך בתדירות זוויתית $\omega_0 = 20\,\text{rad/s}$. ברגע $t = 0$ הוא ב-$x_0 = 3.0\,\text{cm}$
      מנקודת שיווי המשקל ונע במהירות $v_0 = +80\,\text{cm/s}$, ולכן האמפליטודה $A = 5.0\,\text{cm}$. כותבים
      $x(t) = A\cos(\omega_0 t + \varphi)$ עם $-\pi < \varphi \le \pi$. מה הפאזה $\varphi$, ברדיאנים?
    answer: -0.927
    unit: rad
    correctFeedback: >-
      נכון. $\cos\varphi = x_0/A = 0.6$ ו-$\sin\varphi = -\dfrac{v_0}{A\omega_0} = -0.8$. הקוסינוס חיובי והסינוס שלילי,
      ולכן $\varphi$ ברביע הרביעי: $\varphi = -0.927\,\text{rad}$, זווית של כ-$53^\circ$ מתחת לציר $x$ במעגל הייחוס. סימן הפאזה הפוך לסימן
      של $v_0$, בגלל המינוס בנגזרת של הקוסינוס.
    wrongFeedback: >-
      מצאו את $\cos\varphi$ ואת $\sin\varphi$ בנפרד, ובחרו את הרביע לפי הסימנים של שניהם. $\tan\varphi$ לבדו לא קובע את
      הרביע.
    commonWrong:
      - value: 0.927
        feedback: 'הגודל נכון והסימן הפוך. $\dot x(0) = -A\omega_0\sin\varphi$: מהירות חיובית פירושה $\sin\varphi < 0$.'
        misconception: MC-5-phase-sign-of-velocity
      - value: 0.644
        feedback: 'הפכתם את המנה: $\arctan(x_0\omega_0/v_0)$. כאן $\tan\varphi = -\dfrac{v_0}{\omega_0 x_0}$, המהירות במונה.'
      - value: 2.21
        feedback: >-
          זו התשובה השנייה של $\tan\varphi = -4/3$, ברביע השני. שם $\cos\varphi < 0$, כלומר $x_0 < 0$, והגוף מתחיל
          בצד השלילי. בדקו את הסימן של $\cos\varphi = x_0/A$.
    hints:
      - 'כתבו $x_0 = A\cos\varphi$ ו-$v_0 = -A\omega_0\sin\varphi$. מה הסימן של כל אחד מהם?'

  - id: Q-5.1-first-zero
    type: numeric
    objectives: [OBJ-5.1-1]
    level: bagrut
    prompt: >-
      גוף על קפיץ מתנודד בלי חיכוך בתדירות זוויתית $\omega_0 = 20\,\text{rad/s}$. ברגע $t = 0$ הוא ב-$x_0 = 3.0\,\text{cm}$
      מנקודת שיווי המשקל ונע במהירות $v_0 = +80\,\text{cm/s}$: הוא מתרחק תחילה מנקודת שיווי המשקל, נעצר בקצה וחוזר.
      באיזה רגע הוא עובר לראשונה בנקודת שיווי המשקל, $x = 0$?
    answer: 0.125
    unit: s
    correctFeedback: >-
      נכון. מתנאי ההתחלה $A = 5.0\,\text{cm}$ ו-$\varphi = -0.927\,\text{rad}$. $x = 0$ כש-$\omega_0 t + \varphi = \dfrac{\pi}{2}$
      (המעבר הראשון, אחרי הקצה), ולכן
      $$\begin{aligned} t &= \frac{\pi/2 - \varphi}{\omega_0} \\ &= \frac{1.571 + 0.927}{20} = 0.125\,\text{s} \end{aligned}$$
      **בדיקת גבולות:** כש-$v_0 \to 0$, $\varphi \to 0$ ו-$t \to \dfrac{\pi}{2\omega_0} = T/4$, רבע מחזור מהקצה עד
      המרכז, כצפוי.
    wrongFeedback: >-
      מצאו קודם את $\varphi$ מתנאי ההתחלה. הקוסינוס מתאפס כשהארגומנט שלו $\pi/2$ או $3\pi/2$. איזה מהם מגיע ראשון
      כש-$\varphi < 0$?
    commonWrong:
      - value: 0.0785
        feedback: 'זה $T/4$, הזמן מהקצה עד המרכז. הגוף לא מתחיל בקצה: הוא צריך קודם להגיע לקצה ($A = 5.0\,\text{cm}$) ורק אז לחזור.'
        misconception: MC-5-amplitude-is-x0
      - value: 0.0322
        feedback: 'השתמשתם ב-$\varphi = +0.927$. עם הסימן הזה הגוף היה נע ברגע $t = 0$ **לכיוון** המרכז, ולא מתרחק ממנו.'
        misconception: MC-5-phase-sign-of-velocity
      - value: 0.282
        feedback: 'זה $(3\pi/2 - \varphi)/\omega_0$, המעבר השני במרכז, אחרי שהגוף ביקר גם בקצה השלילי. השאלה על המעבר הראשון.'
    hints:
      - 'מתי לראשונה $\omega_0 t + \varphi = \pi/2$, אם $\varphi$ שלילי?'

  # ---------------------------------------------------------------- OBJ-5.1-2 recognising SHM: springs, vertical spring
  - id: Q-5.1-series-value
    type: numeric
    objectives: [OBJ-5.1-2]
    level: basic
    prompt: >-
      שני קפיצים, $k_1 = 300\,\text{N/m}$ ו-$k_2 = 600\,\text{N/m}$, מחוברים **בטור**: הקצה של הראשון קשור לקיר, הקצה
      של השני לגוף בעל מסה $m = 2.0\,\text{kg}$ על משטח בלי חיכוך. מה התדירות הזוויתית של התנודות?
    answer: 10.0
    unit: rad/s
    correctFeedback: >-
      נכון. בטור שני הקפיצים מושכים באותו כוח, וההתארכויות מתחברות: $\dfrac{1}{k} = \dfrac{1}{k_1} + \dfrac{1}{k_2}$,
      ולכן $k = 200\,\text{N/m}$ ו-$\omega_0 = \sqrt{200/2.0} = 10.0\,\text{rad/s}$. קבוע הקפיץ השקול קטן מהקטן
      ביניהם: הטור רך יותר מכל קפיץ לבד.
    wrongFeedback: 'בטור כל קפיץ מותח באותו כוח $F$. כתבו את ההתארכות של כל אחד, חברו, וחלקו את $F$ בהתארכות הכוללת.'
    commonWrong:
      - value: 21.2
        feedback: 'חיברתם את הקבועים, $k_1 + k_2$. זה החיבור **במקביל**, כששני הקפיצים מתארכים באותו מרחק. בטור הם מתארכים יחד, וההתארכויות מתחברות.'
        misconception: MC-5-series-springs-add
      - value: 100
        feedback: 'זה $k/m$, כלומר $\omega_0^2$, ביחידות $\text{s}^{-2}$. הוציאו שורש.'
      - value: 15.0
        feedback: 'לקחתם את הממוצע של שני הקבועים. קבוע הקפיץ השקול בטור קטן מכל אחד מהם, לא באמצע ביניהם.'
    hints:
      - 'משיכה בכוח $F$ מאריכה את הראשון ב-$F/k_1$ ואת השני ב-$F/k_2$.'

  - id: Q-5.1-springs-rank
    type: rank
    objectives: [OBJ-5.1-2]
    qualitative: true
    level: mid
    prompt: >-
      בכל אחת מהמערכות גוף בעל אותה מסה $m$ נע על משטח בלי חיכוך, וכל הקפיצים זהים, בעלי קבוע קפיץ $k$ ואורך רפוי
      $L$. דרגו את המערכות לפי התדירות הזוויתית של התנודות, מהגדולה לקטנה. סמנו מערכות שוות כקשורות.
    items:
      - { id: single, label: 'קפיץ אחד בין קיר לגוף' }
      - { id: series, label: 'שני קפיצים בטור, זה אחרי זה, בין קיר לגוף' }
      - { id: parallel, label: 'שני קפיצים זה לצד זה, שניהם בין קיר לגוף' }
      - { id: half, label: 'קפיץ אחד שנחתך לחצי, באורך L/2, בין קיר לגוף' }
    order: [[parallel, half], single, series]
    correctFeedback: >-
      נכון. במקביל $k_{\text{eq}} = 2k$, ובטור $k_{\text{eq}} = k/2$. וחצי קפיץ? כל חצי של קפיץ מתוח נושא את כל
      הכוח ומתארך בחצי מהקפיץ כולו, ולכן קבוע הקפיץ שלו $2k$: קפיץ שלם הוא שני חצאים בטור. לכן מקביל וחצי קפיץ
      שווים, $\omega_0 = \sqrt{2k/m}$, אחריהם $\sqrt{k/m}$, ובסוף $\sqrt{k/(2m)}$.
    wrongFeedback: >-
      חשבו לכל מערכת את קבוע הקפיץ השקול: באיזה כוח צריך למשוך כדי להזיז את הגוף ב-$1\,\text{cm}$? במקביל כל קפיץ
      מתארך באותו מרחק, בטור כל קפיץ נושא את אותו כוח. ומה קורה לקבוע של קפיץ כשחותכים אותו לחצי?
    hints:
      - 'קפיץ שלם הוא שני חצאים זהים מחוברים בטור.'

  - id: Q-5.1-vertical-same-omega
    type: twotier
    objectives: [OBJ-5.1-2]
    qualitative: true
    level: mid
    prompt: >-
      קפיץ וגוף מתנודדים על שולחן אופקי בלי חיכוך בתדירות זוויתית $\omega_0$. תולים את אותו קפיץ ואת אותו גוף אנכית,
      מהתקרה, ונותנים לגוף לתנודד למעלה ולמטה. מה התדירות הזוויתית עכשיו?
    choices:
      - text: 'אותה $\omega_0$ בדיוק.'
        correct: true
        feedback: 'נכון. הכובד מזיז את מרכז התנודה, אבל לא את התדירות.'
      - text: 'גדולה מ-$\omega_0$, כי הכובד מוסיף כוח מחזיר.'
        feedback: >-
          הכובד הוא כוח **קבוע**: הוא לא גדל כשהגוף מתרחק מהמרכז, ולכן הוא לא כוח מחזיר. כוח מחזיר הוא כוח שתלוי
          בהעתק, וכזה יש רק לקפיץ.
        misconception: MC-5-gravity-changes-omega
      - text: 'קטנה מ-$\omega_0$, כי הקפיץ כבר מתוח והכובד מתנגד לו בעלייה.'
        feedback: >-
          בעלייה הכובד אכן מושך למטה, אבל בירידה הוא מושך באותו כוח לאותו כיוון. השפעה קבועה כזו מתאזנת עם המתיחה
          ההתחלתית של הקפיץ, ומה שנשאר הוא $-kx$ סביב הנקודה החדשה.
        misconception: MC-5-gravity-changes-omega
    reasons:
      - text: 'סביב נקודת שיווי המשקל החדשה, בהתארכות $mg/k$, הכוח השקול הוא $-kx$, כאשר $x$ ההעתק מהנקודה הזו.'
        correct: true
        feedback: >-
          זה הנימוק. עם ציר כלפי מעלה ו-$y$ המקום מהנקודה שבה הקפיץ רפוי, $m\ddot y = -ky - mg$. בהצבה
          $y = x - mg/k$ הקבועים מתבטלים: $m\ddot x = -kx$, אותה משוואה כמו על השולחן.
      - text: 'התדירות תלויה ב-$g$, כמו של מטוטלת.'
        feedback: >-
          במטוטלת הכוח המחזיר **הוא** רכיב של הכובד, ולכן $g$ נכנס לתדירות. בקפיץ הכוח המחזיר בא מהקפיץ, והכובד רק
          מזיז את המרכז.
        misconception: MC-5-gravity-changes-omega
      - text: 'הכובד מאריך את הקפיץ, וקפיץ ארוך יותר הוא רך יותר.'
        feedback: >-
          קבוע הקפיץ של קפיץ נתון לא משתנה כשמותחים אותו (בתחום חוק הוק). "קפיץ ארוך רך יותר" נכון לקפיץ שנבנה ארוך יותר,
          עם יותר כריכות, לא לאותו קפיץ במתיחה.
    hints:
      - 'כתבו את החוק השני לגוף התלוי, עם הכובד ועם הקפיץ, ומצאו את הנקודה שבה השקול אפס.'

  - id: Q-5.1-between-walls
    type: numeric
    objectives: [OBJ-5.1-2]
    level: bagrut
    prompt: >-
      גוף בעל מסה $m = 0.60\,\text{kg}$ מונח על משטח אופקי בלי חיכוך בין שני קירות. קפיץ בעל קבוע $k_1 = 100\,\text{N/m}$
      מחבר אותו לקיר השמאלי, וקפיץ בעל קבוע $k_2 = 50\,\text{N/m}$ מחבר אותו לקיר הימני. בנקודת שיווי המשקל שני
      הקפיצים מתוחים מעט. מזיזים את הגוף לאורך הקפיצים ומשחררים. מה זמן המחזור של התנודות?
    answer: 0.397
    unit: s
    correctFeedback: >-
      נכון. ציר $x$ ימינה, מנקודת שיווי המשקל. כשהגוף זז ב-$x$, הקפיץ השמאלי מתארך ב-$x$ ומושך שמאלה בתוספת
      $k_1x$, והימני מתקצר ב-$x$ ודוחף (או מושך פחות) שמאלה בתוספת $k_2x$. המתיחות ההתחלתיות מתאזנות בשיווי המשקל,
      ולכן $m\ddot x = -(k_1 + k_2)x$: הקפיצים פועלים **במקביל**, אף שהם בצדדים מנוגדים.
      $$\begin{aligned} T &= 2\pi\sqrt{\frac{m}{k_1 + k_2}} \\ &= 2\pi\sqrt{\frac{0.60}{150}} = 0.397\,\text{s} \end{aligned}$$
      **בדיקת גבולות:** כש-$k_2 \to 0$ נשאר קפיץ אחד, $T = 2\pi\sqrt{m/k_1}$. וכש-$k_1 = k_2$ זה כמו קפיץ אחד של $2k_1$.
    wrongFeedback: >-
      הזיזו את הגוף ב-$x$ ימינה, וכתבו את **השינוי** בכוח של כל קפיץ: לאן מושך כל אחד מהם יותר מאשר בשיווי המשקל?
    commonWrong:
      - value: 0.843
        feedback: >-
          חיברתם את הקפיצים בטור. בטור שני הקפיצים נושאים את אותו כוח ומתארכים יחד; כאן כל קפיץ מתארך או מתקצר בדיוק
          ב-$x$, כמו במקביל, והכוחות הנוספים שלהם פונים שניהם אל שיווי המשקל.
      - value: 0.487
        feedback: 'זה זמן המחזור עם הקפיץ השמאלי בלבד. גם הקפיץ הימני מחזיר: כשהגוף זז ימינה הוא מתקצר ודוחף שמאלה.'
      - value: 0.688
        feedback: >-
          זה $2\pi\sqrt{m/(k_1 - k_2)}$ (או הקפיץ הימני לבדו). הקפיצים לא "מושכים זה נגד זה" בתנודה: המתיחות ההתחלתיות
          מתבטלות בשיווי המשקל, והשינויים בכוחות שלהם פונים שניהם אל המרכז ומתחברים.
    hints:
      - 'בהזזה $x$ ימינה: בכמה משתנה הכוח של הקפיץ השמאלי, ובכמה של הימני, ולאיזה כיוון כל שינוי?'
      - 'קפיץ שמתקצר מושך פחות (או דוחף): גם השינוי בכוח שלו פונה אל נקודת שיווי המשקל. השוו לקפיצים במקביל.'

  - id: Q-5.1-relaxed-push
    type: numeric
    objectives: [OBJ-5.1-2, OBJ-5.1-1]
    level: bagrut
    prompt: >-
      גוף בעל מסה $m = 0.40\,\text{kg}$ תלוי על קפיץ אנכי בעל קבוע קפיץ $k = 40\,\text{N/m}$. ברגע $t = 0$ הקפיץ באורכו
      הרפוי, והגוף נע **כלפי מטה** במהירות $0.70\,\text{m/s}$. מה ההתארכות המרבית של הקפיץ בתנועה שאחר כך, בסנטימטרים?
    answer: 21.8
    unit: cm
    correctFeedback: >-
      נכון. נקודת שיווי המשקל בהתארכות $\Delta = mg/k = 9.80\,\text{cm}$, וסביבה הגוף מתנודד ב-$\omega_0 = \sqrt{k/m} = 10\,\text{rad/s}$.
      ברגע $t = 0$ הוא במרחק $\Delta$ **מעליה** ונע במהירות $0.70\,\text{m/s}$, ולכן
      $$\begin{aligned} A &= \sqrt{\Delta^2 + \left(\frac{v_0}{\omega_0}\right)^2} \\ &= \sqrt{9.80^2 + 7.00^2} = 12.0\,\text{cm} \end{aligned}$$
      וההתארכות המרבית $\Delta + A = 21.8\,\text{cm}$. בדיקה באנרגיה, מהאורך הרפוי עד הנקודה הנמוכה, עם $s$ ההתארכות:
      $\tfrac12mv_0^2 + mgs = \tfrac12ks^2$ נותן אותו $s$.
      **בדיקת גבולות:** כש-$v_0 \to 0$ מקבלים $A = \Delta$ וההתארכות המרבית $2\Delta$. וכש-$g \to 0$ מקבלים $A = v_0/\omega_0$, כמו על שולחן.
    wrongFeedback: >-
      מצאו את נקודת שיווי המשקל. סביבה הגוף מתנודד כמו על שולחן: מה ההעתק ההתחלתי ממנה, ומה המהירות ההתחלתית?
      משם האמפליטודה, וההתארכות המרבית נמדדת מהאורך הרפוי.
    commonWrong:
      - value: 19.6
        feedback: >-
          זה $2mg/k$: כך היה אילו הגוף שוחרר ממנוחה. כאן הוא כבר נע ברגע $t = 0$, והמהירות ההתחלתית מגדילה את
          האמפליטודה מעבר להעתק ההתחלתי.
        misconception: MC-5-amplitude-is-x0
      - value: 16.8
        feedback: 'חיברתם $\Delta + v_0/\omega_0$ ישירות. ההעתק ההתחלתי ו-$v_0/\omega_0$ מתחברים כמו רכיבים ניצבים: בשורש של סכום הריבועים.'
      - value: 12.0
        feedback: >-
          זו האמפליטודה, המרחק **מנקודת שיווי המשקל**. ההתארכות נמדדת מהאורך הרפוי, ונקודת שיווי המשקל עצמה כבר
          בהתארכות $9.80\,\text{cm}$.
      - value: 9.8
        feedback: >-
          זו ההתארכות בשיווי המשקל, $mg/k$. הגוף לא נעצר שם: בנקודת שיווי המשקל השקול אפס, אבל המהירות מרבית, והוא
          ממשיך מעבר לה עד מרחק $A$.
        misconception: MC-5-stops-at-equilibrium
      - value: 7.0
        feedback: 'זה $v_0/\omega_0$: כך היה בלי כובד. הכובד מזיז את נקודת שיווי המשקל ב-$mg/k$ כלפי מטה, והגוף מתחיל רחוק ממנה.'
    hints:
      - 'מדדו העתק מנקודת שיווי המשקל, בהתארכות $mg/k$. היכן הגוף ביחס אליה ברגע $t = 0$?'

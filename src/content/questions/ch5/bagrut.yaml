        answer: 227
        unit: ''
        correctFeedback: >-
          נכון. אחרי $N$ תנודות, $t = N\cdot2\pi/\omega_0$, והאמפליטודה $e^{-\gamma t/2} = e^{-\pi N/Q} = \tfrac12$. לכן
          $$Q = \frac{\pi N}{\ln2} = \frac{50\pi}{0.693} = 227$$
          **בדיקת גבולות:** אם האמפליטודה הייתה נשארת קבועה ($N \to \infty$), $Q \to \infty$.
        wrongFeedback: 'כתבו את הזמן של $N$ תנודות, הציבו ב-$e^{-\gamma t/2}$ עם $\gamma = \omega_0/Q$, והשוו ל-$\tfrac12$.'
        commonWrong:
          - value: 453
            feedback: 'השתמשתם ב-$e^{-\gamma t}$ לאמפליטודה. זו הדעיכה של האנרגיה; האמפליטודה דועכת כמו $e^{-\gamma t/2}$.'
            misconception: MC-5-energy-decays-like-amplitude
          - value: 72.1

      - label: ג
        type: open
        points: 8
        level: mid
        objectives: [OBJ-5.5-1, OBJ-0.3-2]
        prompt: >-
          (1) הציבו את האופן ההפוך, $x_2 = -x_1$, במשוואות התנועה, ומצאו את התדירות שלו, $\omega_2$. בטאו את ההפרש
          $\Delta\omega = \omega_2 - \omega_1$ באמצעות $g$, $L$, $k_c$ ו-$m$, והראו שבצימוד חלש, $k_c \ll mg/L$,
          $\Delta\omega \approx \dfrac{k_c}{m\omega_1}$.

          (2) בדקו את התוצאה בגבול $k_c \to 0$ ואת היחידות, וחשבו את $\Delta\omega$. (ההפרש קטן: שמרו מספיק ספרות.)
        hints:
          - 'באופן ההפוך, בכמה מתארך הקפיץ כשמשקולת 1 זזה $x_1$?'
          - '$\sqrt{1 + \epsilon} \approx 1 + \tfrac12\epsilon$ כש-$\epsilon \ll 1$.'
        solution:
          - kind: law
            text: >-
              אופן תנודה הוא תנועה שבה שתי המשקולות מתנודדות באותה תדירות: מציבים $x_2 = -x_1$ ומקבלים משוואה של מתנד
              אחד, $\ddot x_1 = -\omega^2x_1$, ומזהים ממנה את $\omega$ (שיעור 5.5).
          - kind: manipulation
            text: >-
              עם $x_2 = -x_1$ הקפיץ מתארך ב-$x_1 - x_2 = 2x_1$, ולכן $m\ddot x_1 = -\dfrac{mg}{L}x_1 - 2k_cx_1$, כלומר
              $$\omega_2 = \sqrt{\frac gL + \frac{2k_c}{m}},\qquad \Delta\omega = \sqrt{\frac gL + \frac{2k_c}{m}} - \sqrt{\frac gL}$$
              (המשוואה של $x_2$ נותנת אותו דבר, ולכן $(1, -1)$ אכן אופן.)
          - kind: manipulation
            text: >-
              צימוד חלש: $\omega_2 = \omega_1\sqrt{1 + \dfrac{2k_c}{m\omega_1^2}} \approx \omega_1\left(1 + \dfrac{k_c}{m\omega_1^2}\right)$
              (פיתוח טיילור, שיעור 0.3), ולכן $\Delta\omega \approx \dfrac{k_c}{m\omega_1}$. ריבועי התדירויות מתחברים, לא
              התדירויות: $\omega_2$ קטן בהרבה מ-$\omega_1 + \sqrt{2k_c/m}$.
          - kind: limit
            text: >-
              כש-$k_c \to 0$: $\omega_2 \to \omega_1$ ו-$\Delta\omega \to 0$: בלי קפיץ שתי המטוטלות זהות ובלתי תלויות, ולשני
              האופנים אותה תדירות. ו-$\Delta\omega$ גדל ליניארית עם $k_c$ כל עוד הצימוד חלש.
          - kind: units
            text: >-
              $\dfrac gL$ ו-$\dfrac{k_c}{m}$ שניהם ביחידות $\text{s}^{-2}$ ($\dfrac{\text{N/m}}{\text{kg}} = \text{s}^{-2}$), ולכן
              אפשר לחבר אותם, והשורש ב-$\text{rad/s}$. גם $\dfrac{k_c}{m\omega_1}$ ביחידות $\dfrac{\text{s}^{-2}}{\text{s}^{-1}} = \text{s}^{-1}$.
          - kind: substitution
            text: >-
              $\omega_1 = \sqrt{19.6} = 4.427\,\text{rad/s}$, $\omega_2^2 = 19.6 + 0.4 = 20.0\,\text{s}^{-2}$ ו-$\omega_2 = 4.472\,\text{rad/s}$:
              $\Delta\omega = 0.0449\,\text{rad/s}$. הקירוב: $\dfrac{0.10}{0.50\cdot4.427} = 0.0452\,\text{rad/s}$, קרוב ב-$0.5\%$.
              (עם $k_c$ במקום $2k_c$, כאילו הקפיץ מתארך רק ב-$x_1$, היה יוצא חצי, $0.0225\,\text{rad/s}$.)
          - kind: result
            text: >-
              $\omega_2 = \sqrt{g/L + 2k_c/m}$, ו-$\Delta\omega = \sqrt{g/L + 2k_c/m} - \sqrt{g/L} = 0.0449\,\text{rad/s}$, ובצימוד חלש $\Delta\omega \approx \dfrac{k_c}{m\omega_1} = 0.0452\,\text{rad/s}$:
              הפרש של כ-$1\%$ בין התדירויות של שני האופנים.
        rubric:
          - text: הצבתי $x_2 = -x_1$ וזיהיתי שהקפיץ מתארך ב-$2x_1$, ולכן $\omega_2^2 = g/L + 2k_c/m$.
          - text: פיתחתי את השורש בצימוד חלש וקיבלתי $\Delta\omega \approx k_c/(m\omega_1)$.
          - text: בדקתי שב-$k_c \to 0$ ההפרש מתאפס, ובדקתי את היחידות.
          - text: חישבתי $\Delta\omega \approx 0.0449\,\text{rad/s}$ (או $0.0452$ בקירוב).

      - label: ד
        type: open
        points: 9
        level: bagrut
        standalone: false
        objectives: [OBJ-5.5-2, OBJ-5.5-1]
        prompt: >-
          מסיטים רק את משקולת 1 למרחק $a$, מחזיקים את משקולת 2 במקומה, ומשחררים את שתיהן ממנוחה.

          (1) כתבו את $x_1(t)$ ואת $x_2(t)$ כסופרפוזיציה של שני אופני התנודה, והראו שהן תנודות מהירות בתוך מעטפות איטיות.
          מצאו ביטוי לזמן $T_s$ מהשחרור עד שהמעטפת של התנודה של משקולת 1 מתאפסת לראשונה, וכמעט כל האנרגיה עברה
          למשקולת 2.

          (2) בדקו את הביטוי בגבול $k_c \to 0$ ואת היחידות שלו, וחשבו את $T_s$ בשניות עם הנתונים.
        hints:
          - 'כתבו את $(a, 0)$ כצירוף של $(1, 1)$ ושל $(1, -1)$.'
          - '$\cos\alpha + \cos\beta = 2\cos\tfrac{\alpha - \beta}{2}\cos\tfrac{\alpha + \beta}{2}$.'
        solution:
          - { kind: law, text: 'המשוואות ליניאריות, ולכן כל פתרון הוא סופרפוזיציה של אופני התנודה: $(1, 1)$ בתדירות $\omega_1 = \sqrt{g/L}$, ו-$(1, -1)$ בתדירות $\omega_2 = \sqrt{g/L + 2k_c/m}$.' }
          - { kind: manipulation, text: 'ממנוחה, כל אופן מתחיל כקוסינוס. מ-$(a, 0) = \tfrac a2(1, 1) + \tfrac a2(1, -1)$: $$x_1 = \tfrac a2\left(\cos\omega_1t + \cos\omega_2t\right),\qquad x_2 = \tfrac a2\left(\cos\omega_1t - \cos\omega_2t\right)$$' }
          - { kind: manipulation, text: 'עם $\bar\omega = \tfrac12(\omega_1 + \omega_2)$ ו-$\Delta\omega = \omega_2 - \omega_1$: $$x_1 = a\cos\frac{\Delta\omega\,t}{2}\cos\bar\omega t,\qquad x_2 = a\sin\frac{\Delta\omega\,t}{2}\sin\bar\omega t$$ תנודה מהירה, $\bar\omega$, בתוך מעטפת איטית. המעטפת של $x_1$ מתאפסת לראשונה כש-$\Delta\omega\,t/2 = \pi/2$, ובאותו רגע המעטפת של $x_2$ מרבית: $T_s = \dfrac{\pi}{\omega_2 - \omega_1} \approx \dfrac{\pi m\omega_1}{k_c}$.' }
          - { kind: limit, text: 'כש-$k_c \to 0$: $\omega_2 \to \omega_1$, $\Delta\omega \to 0$ ו-$T_s \to \infty$. ואכן $x_2 = a\sin(\Delta\omega\,t/2)\sin\bar\omega t \to 0$: בלי קפיץ, משקולת 2 נשארת במקום, ומשקולת 1 מתנודדת לבד, $x_1 \to a\cos\omega_1t$. וב-$t = 0$ מתקבל $x_1 = a$, $x_2 = 0$, כפי שנדרש.' }
          - { kind: units, text: '$\Delta\omega$ ב-$\text{s}^{-1}$, ולכן $\pi/\Delta\omega$ בשניות. ובקירוב: $\dfrac{m\omega_1}{k_c}$ ביחידות $\dfrac{\text{kg}\cdot\text{s}^{-1}}{\text{kg}\cdot\text{s}^{-2}} = \text{s}$.' }
          - { kind: substitution, text: '$T_s = \dfrac{\pi}{0.0449} = 69.9\,\text{s}$ (בקירוב $\pi m\omega_1/k_c = 69.5\,\text{s}$). בזמן הזה משקולת 1 מבצעת כ-50 תנודות, שהולכות וקטנות עד שהמעטפת שלהן מתאפסת. (משקולת 1 עוצרת לרגע בכל קצה של תנודה מהירה, אבל רק ב-$T_s$ היא נשארת כמעט בלי אנרגיה. "כמעט", כי ב-$T_s$ עצמו $x_1 = 0$ אבל המהירות שלה, $\tfrac12a\Delta\omega$ כפול קוסינוס מהיר, לא בדיוק אפס: אנרגיה שקטנה פי $(\Delta\omega/2\bar\omega)^2$ בערך, כ-$3\cdot10^{-5}$.) שימו לב: $2\pi/\Delta\omega = 140\,\text{s}$ הוא הזמן עד שהאנרגיה **חוזרת** למשקולת 1, ו-$\pi/(2\Delta\omega) = 34.9\,\text{s}$ שוכח שהמעטפת היא $\cos(\Delta\omega\,t/2)$.' }
          - { kind: result, text: '$x_1 = a\cos\dfrac{\Delta\omega\,t}{2}\cos\bar\omega t$, $x_2 = a\sin\dfrac{\Delta\omega\,t}{2}\sin\bar\omega t$, והאנרגיה עוברת כמעט כולה למשקולת 2 אחרי $T_s = \dfrac{\pi}{\omega_2 - \omega_1} = 69.9\,\text{s}$ (בצימוד חלש $T_s \approx \pi m\omega_1/k_c$), וחוזרת אחרי $2T_s$.' }
        rubric:
          - text: פירקתי את תנאי ההתחלה $(a, 0)$ לשני האופנים, חצי מכל אחד.
          - text: כתבתי את $x_1$ ואת $x_2$ כמכפלה של מעטפת איטית, בתדירות $\Delta\omega/2$, ותנודה מהירה $\bar\omega$.
          - text: מצאתי $T_s = \pi/(\omega_2 - \omega_1)$, מהאיפוס הראשון של המעטפת של $x_1$.
          - text: בדקתי שב-$k_c \to 0$ משקולת 2 לא זזה ו-$T_s \to \infty$, ושהיחידות שניות; חישבתי כ-$70\,\text{s}$.

  # ------------------------------------------------------------ 5: a clay ball, two blocks and a spring (3.4, 4.x + 5.x)
  - id: Q-5-bagrut-5
    type: bagrut
    title: כדור פלסטלינה, שני גושים וקפיץ
    prompt: >-
      על רצפה אופקית חלקה מונחים שני גושים, A ו-B, כל אחד בעל מסה $M$, וביניהם קפיץ קל בעל קבוע קפיץ $k$, שמחובר לשניהם
      ונמצא באורכו הרפוי. הגושים במנוחה. כדור פלסטלינה קטן בעל מסה $m$ נע לאורך הקו של הקפיץ במהירות $v$, פוגע ב-A
      מהצד הרחוק מ-B ונדבק אליו. ההתנגשות קצרה מאוד. ציר $x$ בכיוון של $v$, מ-A אל B.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-4.4-1, OBJ-4.1-1]
        prompt: 'מה המהירויות של A ושל B מיד אחרי ההתנגשות, לפני שהקפיץ הספיק להתכווץ?'
        choices:
          - text: 'A (עם הכדור) נעה ב-$\dfrac{mv}{M + m}$, ו-B עדיין במנוחה.'
            correct: true
            feedback: >-
              נכון. בזמן ההתנגשות הקצר הקפיץ כמעט לא מתכווץ, והכוח שלו, $k$ כפול הכיווץ, זניח לעומת הכוח בין הכדור ל-A. לכן
              זו התנגשות פלסטית של הכדור ושל A בלבד: $mv = (M + m)u$. על B עוד לא פעל שום כוח.
          - text: 'A ו-B נעות יחד ב-$\dfrac{mv}{2M + m}$, כי הקפיץ מחבר ביניהן.'
            feedback: >-
              זו מהירות מרכז המסה של כל המערכת. קפיץ אינו מוט קשיח: הוא מפעיל כוח רק כשהוא מכווץ, ובזמן ההתנגשות הקצר
              הכיווץ זעיר. B מתחילה לזוז רק אחר כך, כשהקפיץ נדחס.
          - text: 'A נעה ב-$v$, ו-B במנוחה.'
            feedback: 'הכדור נדבק ל-A: ההתנגשות פלסטית, והתנע $mv$ מתחלק על המסה $M + m$, ולכן A נעה לאט מ-$v$.'
          - text: 'A נעה ב-$\dfrac{mv}{M + m}$, ו-B נרתעת לאחור באותה מהירות.'
            feedback: 'בזמן ההתנגשות לא פעל על B שום כוח, ולכן המהירות שלה לא השתנתה: היא עדיין אפס.'

      - label: ב
        type: open
        points: 6
        level: mid
        objectives: [OBJ-3.4-2, OBJ-4.1-2]
        prompt: >-
          (1) בטאו באמצעות $m$, $M$ ו-$v$ את המהירות $V$ של מרכז המסה של המערכת כדור + A + B, ונמקו למה היא לא משתנה
          מרגע ההתנגשות והלאה, גם כשהקפיץ מתכווץ ומתארך.

          (2) בטאו את האנרגיה הקינטית שאבדה בהתנגשות. בדקו את שתי התוצאות בגבולות $m \ll M$ ו-$m \gg M$ ואת היחידות.
        hints:
          - 'מה הכוחות החיצוניים האופקיים על המערכת כדור + A + B? והקפיץ, האם הוא חיצוני לה?'
        solution:
          - kind: law
            text: >-
              על המערכת כדור + A + B לא פועל שום כוח חיצוני אופקי: הרצפה חלקה, והכובד והכוח הנורמלי אנכיים. כוח הקפיץ
              וכוח ההתנגשות פנימיים. לכן התנע הכולל נשמר, ומרכז המסה נע במהירות קבועה (שיעור 3.4). בהתנגשות עצמה, כמו
              בחלק א, רק הכדור ו-A משתתפים: $mv = (M + m)u$.
          - kind: manipulation
            text: >-
              $$V = \frac{mv}{2M + m},\qquad u = \frac{mv}{M + m}$$
              האנרגיה שאבדה:
              $$\Delta K = \tfrac12mv^2 - \tfrac12(M + m)u^2 = \tfrac12mv^2\left(1 - \frac{m}{M + m}\right) = \tfrac12mv^2\,\frac{M}{M + m}$$
          - kind: limit
            text: >-
              כש-$m \ll M$: $V \approx \dfrac{mv}{2M} \to 0$, וכמעט כל האנרגיה של הכדור אובדת, כמו קליע שנתקע בגוש כבד.
              כש-$m \gg M$: $V \to v$, והחלק שאובד, $\dfrac{M}{M + m}$, שואף לאפס: הכדור הכבד כמעט לא מרגיש את A וממשיך
              כמעט באותה מהירות. ($\Delta K$ עצמו לא שואף לאפס אלא ל-$\tfrac12Mv^2$: במערכת של הכדור הכבד A מתקרבת
              ב-$v$ ונעצרת עליו. אבל זה חלק זעיר מ-$\tfrac12mv^2$.)
          - kind: units
            text: '$\dfrac{m}{2M + m}$ ו-$\dfrac{M}{M + m}$ חסרי ממדים, ולכן $V$ במטר לשנייה ו-$\Delta K$ בג׳ול, כמו $\tfrac12mv^2$.'
          - kind: result
            text: >-
              $V = \dfrac{mv}{2M + m}$, קבועה לתמיד; בהתנגשות אובד החלק $\dfrac{M}{M + m}$ מהאנרגיה של הכדור,
              $\Delta K = \tfrac12mv^2\,\dfrac{M}{M + m}$.
        rubric:
          - text: נימקתי שאין כוח חיצוני אופקי על כל המערכת, ולכן $V$ קבועה, וכתבתי $V = mv/(2M + m)$.
          - text: חישבתי את מהירות A מיד אחרי ההתנגשות, $u = mv/(M + m)$, ואת האנרגיה שאבדה, $\tfrac12mv^2\,M/(M + m)$.
          - text: בדקתי את הגבולות $m \ll M$ ו-$m \gg M$ ואת היחידות.

      - label: ג
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-4.2-2, OBJ-4.1-2]
        prompt: >-
          נסמן ב-$s$ את הכיווץ של הקפיץ ($s > 0$ כשהוא מכווץ).

          (1) בעזרת הפירוק של האנרגיה הקינטית לאנרגיה של מרכז המסה ולאנרגיה של התנועה היחסית (שיעור 4.2), ובלי לפתור
          את משוואות התנועה, בטאו את הכיווץ המרבי $s_{\max}$ באמצעות $m$, $M$, $k$ ו-$v$.

          (2) הראו שהחלק מהאנרגיה הקינטית ההתחלתית של הכדור שנאגר בקפיץ ברגע הכיווץ המרבי הוא
          $$\eta = \frac{mM}{(M + m)(2M + m)}$$
          באיזו מסה $m$ של הכדור, באמצעות $M$, החלק הזה הכי גדול, ומה ערכו?

          (3) בדקו את $\eta$ בגבולות $m \ll M$ ו-$m \gg M$, ואת היחידות של $s_{\max}$.
        hints:
          - 'מה המהירויות של A ושל B מיד אחרי ההתנגשות (חלק א)? ומה המהירות היחסית שלהן ברגע הכיווץ המרבי?'
          - 'כתבו $\eta$ באמצעות $x = m/M$, וגזרו לפי $x$.'
        solution:
          - kind: law
            text: >-
              אחרי ההתנגשות אין כוח חיצוני אופקי, ולכן מרכז המסה נע במהירות קבועה $V$ (חלק ב), והאנרגיה שלו,
              $\tfrac12(2M + m)V^2$, לא יכולה להשתנות. האנרגיה הקינטית מתפרקת:
              $K = \tfrac12(2M + m)V^2 + \tfrac12\mu v_{\text{rel}}^2$, עם המסה המצומצמת של A עם הכדור ושל B,
              $\mu = \dfrac{(M + m)M}{2M + m}$ (שיעור 4.2). אחרי ההתנגשות כוח הקפיץ משמר, ולכן האנרגיה המכנית נשמרת.
          - kind: manipulation
            text: >-
              (1) מיד אחרי ההתנגשות (חלק א) A עם הכדור נעה ב-$u = \dfrac{mv}{M + m}$ ו-B עומדת: $v_{\text{rel}} = u$. ברגע
              הכיווץ המרבי $s$ לא גדל ולא קטן, ולכן לשני הגושים אותה מהירות, והאנרגיה היחסית כולה בקפיץ:
              $\tfrac12ks_{\max}^2 = \tfrac12\mu u^2$, ולכן
              $$s_{\max} = u\sqrt{\frac\mu k} = mv\sqrt{\frac{M}{k(M + m)(2M + m)}}$$
          - kind: manipulation
            text: >-
              (2) $\eta = \dfrac{\tfrac12\mu u^2}{\tfrac12mv^2} = \dfrac{(M + m)M}{2M + m}\cdot\dfrac{m}{(M + m)^2} = \dfrac{mM}{(M + m)(2M + m)}$.
              זו מכפלה של שני הפסדים: $\dfrac{m}{M + m}$ מהאנרגיה של הכדור שורד את ההתנגשות הפלסטית (חלק ב), ומזה רק
              החלק $\dfrac{\mu}{M + m} = \dfrac{M}{2M + m}$ הוא אנרגיה יחסית. עם $x = m/M$:
              $\eta = \dfrac{x}{(1 + x)(2 + x)}$, והנגזרת מתאפסת כש-$(1 + x)(2 + x) - x(3 + 2x) = 2 - x^2 = 0$, כלומר
              $x = \sqrt2$:
              $$m = \sqrt2\,M,\qquad \eta_{\max} = \frac{\sqrt2}{\left(1 + \sqrt2\right)\left(2 + \sqrt2\right)} = \frac{\sqrt2}{4 + 3\sqrt2} = 3 - 2\sqrt2 \approx 0.17$$
              (בדיקה: $\left(3 - 2\sqrt2\right)\left(4 + 3\sqrt2\right) = 12 + 9\sqrt2 - 8\sqrt2 - 12 = \sqrt2$.)
          - kind: limit
            text: >-
              כש-$m \ll M$: $\eta \approx \dfrac{m}{2M} \to 0$: כמעט כל האנרגיה של כדור קל אובדת בהתנגשות הפלסטית, כמו קליע
              שנתקע בגוש כבד. כש-$m \gg M$: $\eta \approx \dfrac Mm \to 0$: הכדור הכבד כמעט לא מאבד אנרגיה בהתנגשות, אבל
              כמעט כולה נשארת בתנועה של מרכז המסה, והמערכת פשוט ממשיכה הלאה. אפס בשני הקצוות, ולכן יש מקסימום ביניהם,
              ב-$m = \sqrt2\,M$.
          - kind: units
            text: >-
              $\eta$ הוא מסה בריבוע חלקי מסה בריבוע, חסר ממדים, כמו שחלק צריך להיות.
              $\sqrt{\dfrac{M}{k(M + m)(2M + m)}}$ ביחידות $\sqrt{\dfrac{1}{(\text{kg/s}^2)\,\text{kg}}} = \dfrac{\text{s}}{\text{kg}}$, ולכן
              $s_{\max}$ ביחידות $\text{kg}\cdot\dfrac{\text{m}}{\text{s}}\cdot\dfrac{\text{s}}{\text{kg}} = \text{m}$.
          - kind: result
            text: >-
              $s_{\max} = mv\sqrt{\dfrac{M}{k(M + m)(2M + m)}}$, והקפיץ אוגר את החלק $\eta = \dfrac{mM}{(M + m)(2M + m)}$
              מהאנרגיה של הכדור: לכל היותר $3 - 2\sqrt2 \approx 17\%$, כש-$m = \sqrt2\,M$.
        rubric:
          - text: >-
              פירקתי את האנרגיה הקינטית שאחרי ההתנגשות לחלק של מרכז המסה ולחלק היחסי, $\tfrac12\mu u^2$, ונימקתי שברגע
              הכיווץ המרבי החלק היחסי כולו בקפיץ.
          - text: קיבלתי $s_{\max} = u\sqrt{\mu/k} = mv\sqrt{M/(k(M + m)(2M + m))}$.
          - text: הראיתי ש-$\eta = \dfrac{mM}{(M + m)(2M + m)}$, ומצאתי שהוא מרבי ב-$m = \sqrt2\,M$, עם $\eta_{\max} = 3 - 2\sqrt2 \approx 0.17$.
          - text: בדקתי ש-$\eta \to 0$ גם ב-$m \ll M$ וגם ב-$m \gg M$, והסברתי למה, ובדקתי את היחידות.

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-5.5-1, OBJ-5.1-1, OBJ-3.4-2, OBJ-5.5-2]
        prompt: >-
          (1) כתבו את משוואות התנועה של A (עם הכדור) ושל B, והראו ש-$\mu\ddot s = -ks$, עם $\mu$ של חלק ג. מה התדירות
          הזוויתית $\omega$ של התנודה?

          (2) הראו שהמהירות של B היא $v_B(t) = V\left(1 - \cos\omega t\right)$, כאשר $t = 0$ רגע ההתנגשות, מצאו את
          $v_A(t)$ באמצעות $V$, $m$, $M$ ו-$\omega$, ובדקו שהתנע הכולל נשמר בכל רגע.

          (3) האם A או B נעים אי-פעם לאחור, נגד ציר $x$? מה המהירות המרבית של B, ומתי היא מתקבלת? בדקו את
          התוצאות בגבולות $m \to \infty$ ו-$m \ll M$.
        hints:
          - 'קפיץ מכווץ דוחף את A לאחור ואת B קדימה, באותו גודל $ks$.'
          - 'כתבו את המקום של B כמקום מרכז המסה ועוד חלק מהמרחק בין A ל-B. איזה חלק?'
        solution:
          - kind: law
            text: >-
              החוק השני לכל גוף. הקפיץ המכווץ ב-$s$ מפעיל על A כוח $F_A = -ks$ ועל B כוח $F_B = +ks$ (זוג כוחות של החוק
              השלישי דרך קפיץ קל): $(M + m)\ddot x_A = -ks$ ו-$M\ddot x_B = +ks$, עם $s = \ell_0 - \left(x_B - x_A\right)$.
              מרכז המסה נע במהירות קבועה $V$ (חלק ב).
          - kind: manipulation
            text: >-
              (1) $\ddot s = \ddot x_A - \ddot x_B = -ks\left(\dfrac{1}{M + m} + \dfrac1M\right) = -\dfrac{ks}{\mu}$: משוואת המתנד,
              $$\omega = \sqrt{\frac k\mu} = \sqrt{\frac{k(2M + m)}{M(M + m)}}$$
              זה אחד משני אופני התנודה של המערכת; השני, $\ddot x_{\text{cm}} = 0$, הוא תנועה של כולה יחד בתדירות אפס.
              מחלק א: $s(0) = 0$ ו-$\dot s(0) = u - 0 = u$, ולכן $s = \dfrac u\omega\sin\omega t$ ו-$\dot s = u\cos\omega t$.
          - kind: manipulation
            text: >-
              (2) מהגדרת מרכז המסה, $x_B - x_{\text{cm}} = \dfrac{M + m}{2M + m}\left(x_B - x_A\right)$ ו-$x_A - x_{\text{cm}} = -\dfrac{M}{2M + m}\left(x_B - x_A\right)$,
              ו-$\dfrac{d}{dt}\left(x_B - x_A\right) = -\dot s$. לכן
              $v_B = V - \dfrac{M + m}{2M + m}\,u\cos\omega t$ ו-$v_A = V + \dfrac{M}{2M + m}\,u\cos\omega t$. אבל
              $\dfrac{M + m}{2M + m}\,u = \dfrac{mv}{2M + m} = V$, ולכן
              $$v_B = V\left(1 - \cos\omega t\right),\qquad v_A = V\left(1 + \frac{M}{M + m}\cos\omega t\right)$$
              בדיקה: ב-$t = 0$, $v_B = 0$ ו-$v_A = V\dfrac{2M + m}{M + m} = u$, כמו בחלק א; והתנע
              $(M + m)v_A + Mv_B = (2M + m)V + \left(M - M\right)V\cos\omega t = mv$ בכל רגע.
          - kind: manipulation
            text: >-
              (3) $v_B \ge 0$ תמיד, ומקסימום $2V$ כש-$\omega t = \pi$, כלומר חצי מחזור אחרי ההתנגשות, כשהקפיץ חוזר לאורכו
              הרפוי ($s = 0$). $v_A$ מינימלית באותו רגע, $V\dfrac{m}{M + m} > 0$. לכן אף גוש לא נע לאחור: B מתקדמת בקפיצות,
              נעצרת לרגע בכל מחזור, ו-A מאטה ומאיצה.
          - kind: limit
            text: >-
              כש-$m \to \infty$: $\mu \to M$, $V \to v$, $v_A \to v$ קבועה, ו-$v_B = v(1 - \cos\omega t)$ מגיעה ל-$2v$: כמו גוף קל
              שנפגע אלסטית מגוף כבד, שהמהירות היחסית שלהם מתהפכת. כש-$m \ll M$: $\mu \to M/2$, $\omega \to \sqrt{2k/M}$,
              $v_A \approx V(1 + \cos\omega t)$ ו-$v_B = V(1 - \cos\omega t)$: שני גושים שווים, שמחליפים ביניהם את המהירות בכל
              חצי מחזור סביב $V$.
          - kind: units
            text: >-
              $\mu$ ביחידות מסה, ו-$\sqrt{k/\mu}$ ביחידות $\sqrt{\text{kg}\cdot\text{s}^{-2}/\text{kg}} = \text{s}^{-1}$. $\cos\omega t$
              ו-$\dfrac{M}{M + m}$ חסרי ממדים, ולכן $v_A$ ו-$v_B$ במטר לשנייה, כמו $V$.
          - kind: result
            text: >-
              $\mu\ddot s = -ks$ עם $\omega = \sqrt{\dfrac{k(2M + m)}{M(M + m)}}$; $v_B = V(1 - \cos\omega t)$ ו-$v_A = V\left(1 + \dfrac{M}{M + m}\cos\omega t\right)$,
              עם $V = \dfrac{mv}{2M + m}$. אף גוש לא נע לאחור; B מגיעה ל-$2V$ בכל $\omega t = \pi, 3\pi, \dots$, כשהקפיץ רפוי.
        rubric:
          - text: כתבתי את החוק השני ל-A עם הכדור (מסה $M + m$) ול-B עם כוחות קפיץ הפוכים, וקיבלתי $\mu\ddot s = -ks$ ו-$\omega = \sqrt{k/\mu}$.
          - text: כתבתי את המהירויות כמהירות מרכז המסה ועוד חלק מהמהירות היחסית, עם המקדמים $\dfrac{M + m}{2M + m}$ ו-$\dfrac{M}{2M + m}$.
          - text: זיהיתי ש-$\dfrac{M + m}{2M + m}\,u = V$, קיבלתי $v_B = V(1 - \cos\omega t)$ ואת $v_A$, ובדקתי את התנע בכל רגע.
          - text: הראיתי ששתי המהירויות לא שליליות, ושהמרבית של B היא $2V$ כשהקפיץ רפוי.
          - text: בדקתי את הגבולות $m \to \infty$ ו-$m \ll M$.

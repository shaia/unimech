      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-5.5-2, OBJ-5.5-1]
        prompt: >-
          מסיטים רק את משקולת 1 למרחק $a$, מחזיקים את משקולת 2 במקומה, ומשחררים את שתיהן ממנוחה.

          (1) כתבו את $x_1(t)$ ואת $x_2(t)$ כסופרפוזיציה של שני אופני התנודה, והראו שהן תנודות מהירות בתוך מעטפות איטיות.
          מצאו ביטוי לזמן $T_s$ מהשחרור עד שמשקולת 1 נעצרת לראשונה וכל האנרגיה במשקולת 2.

          (2) בדקו את הביטוי בגבול $k_c \to 0$ ואת היחידות שלו.
        hints:
          - 'כתבו את $(a, 0)$ כצירוף של $(1, 1)$ ושל $(1, -1)$.'
          - '$\cos\alpha + \cos\beta = 2\cos\tfrac{\alpha - \beta}{2}\cos\tfrac{\alpha + \beta}{2}$.'
        solution:
          - { kind: law, text: 'המשוואות ליניאריות, ולכן כל פתרון הוא סופרפוזיציה של אופני התנודה: $(1, 1)$ בתדירות $\omega_1 = \sqrt{g/L}$, ו-$(1, -1)$ בתדירות $\omega_2 = \sqrt{g/L + 2k_c/m}$.' }
          - { kind: manipulation, text: 'ממנוחה, כל אופן מתחיל כקוסינוס. מ-$(a, 0) = \tfrac a2(1, 1) + \tfrac a2(1, -1)$: $$x_1 = \tfrac a2\left(\cos\omega_1t + \cos\omega_2t\right),\qquad x_2 = \tfrac a2\left(\cos\omega_1t - \cos\omega_2t\right)$$' }
          - { kind: manipulation, text: 'עם $\bar\omega = \tfrac12(\omega_1 + \omega_2)$ ו-$\Delta\omega = \omega_2 - \omega_1$: $$x_1 = a\cos\frac{\Delta\omega\,t}{2}\cos\bar\omega t,\qquad x_2 = a\sin\frac{\Delta\omega\,t}{2}\sin\bar\omega t$$ תנודה מהירה, $\bar\omega$, בתוך מעטפת איטית. המעטפת של $x_1$ מתאפסת לראשונה כש-$\Delta\omega\,t/2 = \pi/2$, ובאותו רגע המעטפת של $x_2$ מרבית: $T_s = \dfrac{\pi}{\omega_2 - \omega_1} \approx \dfrac{\pi m\omega_1}{k_c}$.' }
          - { kind: limit, text: 'כש-$k_c \to 0$: $\omega_2 \to \omega_1$, $\Delta\omega \to 0$ ו-$T_s \to \infty$. ואכן $x_2 = a\sin(\Delta\omega\,t/2)\sin\bar\omega t \to 0$: בלי קפיץ, משקולת 2 נשארת במקום, ומשקולת 1 מתנודדת לבד, $x_1 \to a\cos\omega_1t$. וב-$t = 0$ מתקבל $x_1 = a$, $x_2 = 0$, כפי שנדרש.' }
          - { kind: units, text: '$\Delta\omega$ ב-$\text{s}^{-1}$, ולכן $\pi/\Delta\omega$ בשניות. ובקירוב: $\dfrac{m\omega_1}{k_c}$ ביחידות $\dfrac{\text{kg}\cdot\text{s}^{-1}}{\text{kg}\cdot\text{s}^{-2}} = \text{s}$.' }
          - { kind: result, text: '$x_1 = a\cos\dfrac{\Delta\omega\,t}{2}\cos\bar\omega t$, $x_2 = a\sin\dfrac{\Delta\omega\,t}{2}\sin\bar\omega t$, והאנרגיה עוברת כולה למשקולת 2 אחרי $T_s = \dfrac{\pi}{\omega_2 - \omega_1} \approx \dfrac{\pi m\omega_1}{k_c}$, וחוזרת אחרי $2T_s$.' }
        rubric:
          - text: פירקתי את תנאי ההתחלה $(a, 0)$ לשני האופנים, חצי מכל אחד.
          - text: כתבתי את $x_1$ ואת $x_2$ כמכפלה של מעטפת איטית, בתדירות $\Delta\omega/2$, ותנודה מהירה $\bar\omega$.
          - text: מצאתי $T_s = \pi/(\omega_2 - \omega_1)$, מהאיפוס הראשון של המעטפת של $x_1$.
          - text: בדקתי שב-$k_c \to 0$ משקולת 2 לא זזה ו-$T_s \to \infty$, ושהיחידות שניות.


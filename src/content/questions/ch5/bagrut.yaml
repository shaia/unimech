  # ------------------------------------------------------------ 3: a pendulum clock
  - id: Q-5-bagrut-3
    type: bagrut
    title: שעון מטוטלת
    prompt: >-
      המטוטלת של שעון היא משקולת קטנה בעלת מסה $m = 0.20\,\text{kg}$ על מוט קל באורך $L = 1.00\,\text{m}$. המשקולת
      מתנודדת בזוויות קטנות, וכוח הריסון עליה ליניארי במהירות. נכתוב את משוואת התנועה של הזווית בצורה
      $\ddot\theta + \gamma\dot\theta + \omega_0^2\theta = 0$, עם $Q = \omega_0/\gamma$. ההספק שמנגנון השעון מספק מחזיק
      את האמפליטודה קבועה, $\theta_0 = 0.10\,\text{rad}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-5.2-2]
        prompt: מה זמן המחזור של המטוטלת בתנודות קטנות? הזניחו את הריסון.
        answer: 2.01
        unit: s
        correctFeedback: >-
          נכון. $U(\theta) = mgL(1 - \cos\theta) \approx \tfrac12mgL\theta^2$, ועם הקשת $s = L\theta$ זה $\tfrac12\cdot\dfrac{mg}{L}s^2$.
          לכן $\omega_0^2 = \dfrac{mg/L}{m} = \dfrac{g}{L}$, ו-$T = 2\pi\sqrt{L/g} = 2.01\,\text{s}$: כל חצי מחזור, "תיק" אחד, נמשך
          כשנייה.
        wrongFeedback: 'קרבו את $U(\theta) = mgL(1 - \cos\theta)$ בקירוב הרמוני, ומצאו את $\omega_0^2$.'
        commonWrong:
          - value: 19.7
            feedback: 'חישבתם $2\pi\sqrt{g/L}$. בדקו יחידות: $\sqrt{g/L}$ ביחידות $\text{s}^{-1}$, ולכן $T = 2\pi\sqrt{L/g}$.'
          - value: 0.319
            feedback: 'שכחתם את $2\pi$: $\sqrt{L/g} = 1/\omega_0$.'
          - value: 3.13
            feedback: 'זו $\omega_0 = \sqrt{g/L}$ ב-$\text{rad/s}$. זמן המחזור הוא $2\pi/\omega_0$.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-5.2-1, OBJ-5.2-2]
        prompt: מה גודל המהירות המרבית של המשקולת כשהאמפליטודה $\theta_0 = 0.10\,\text{rad}$?
        answer: 0.313
        unit: m/s
        correctFeedback: >-
          נכון. בקירוב ההרמוני האנרגיה $E = \tfrac12mgL\theta_0^2$ הופכת כולה לקינטית בתחתית: $v_{\max} = \sqrt{gL}\,\theta_0 = 3.13\cdot0.10 = 0.313\,\text{m/s}$.
          זה גם $\omega_0\cdot L\theta_0$, תדירות כפול אמפליטודה בקשת. החישוב המדויק, $\sqrt{2gL(1 - \cos\theta_0)}$, נותן
          $0.3129\,\text{m/s}$: הקירוב טוב כאן ל-0.04%.
        wrongFeedback: 'השוו את האנרגיה הפוטנציאלית בקצה, $mgL(1 - \cos\theta_0) \approx \tfrac12mgL\theta_0^2$, לקינטית בתחתית.'
        commonWrong:
          - value: 0.443
            feedback: 'קיבלתם $\sqrt{2gL}\,\theta_0$: הגובה בקצה הוא $L(1 - \cos\theta_0) \approx \tfrac12L\theta_0^2$, עם החצי.'
          - value: 0.100
            feedback: 'זו האמפליטודה בקשת, $L\theta_0$, במטרים. המהירות המרבית היא האמפליטודה כפול $\omega_0$.'

      - label: ג
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-5.3-2]
        prompt: >-
          כשהמנגנון מנותק, המטוטלת מתנודדת בחופשיות, והאמפליטודה שלה יורדת מ-$0.10\,\text{rad}$ ל-$0.05\,\text{rad}$ תוך 50

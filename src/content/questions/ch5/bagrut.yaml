          - value: 50
            feedback: '$Q$ אינו מספר התנודות עד שהאמפליטודה יורדת לחצי. הוא מספר התנודות עד שהאנרגיה יורדת פי $e^{2\pi}$, הרבה יותר מפי 4.'
        hints:
          - 'אחרי $N$ תנודות, $\gamma t/2 = \pi N/Q$.'

      - label: ד
        type: numeric
        points: 5
        level: bagrut
        objectives: [OBJ-5.2-2]
        prompt: >-
          מעבירים את השעון, שהיה מכוון במדויק, לראש הר שבו $g$ קטן ב-$0.10\%$. כמה שניות בדיוק יפגר השעון ביממה אחת?
        answer: 43.2
        unit: s
        correctFeedback: >-
          נכון. $T \propto g^{-1/2}$, ולכן $\dfrac{T}{T_0} = \dfrac{1}{\sqrt{0.999}} = 1.0005$: כל תנודה ארוכה ב-$0.05\%$, והשעון
          סופר פחות תנודות. ביממה הוא מראה $86400\cdot\sqrt{0.999}$ שניות, ומפגר ב-$86400\left(1 - \sqrt{0.999}\right) = 43.2\,\text{s}$.
          באופן כללי, $\dfrac{\Delta T}{T} \approx \tfrac12\cdot\dfrac{\Delta L}{L} - \tfrac12\cdot\dfrac{\Delta g}{g}$: שעון מטוטלת רגיש לשינוי של $g$

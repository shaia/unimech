        prompt: >-
          מעבירים את השעון, שהיה מכוון במדויק, לראש הר שבו תאוצת הכובד קטנה בחלק יחסי $\varepsilon$: $g' = g(1 - \varepsilon)$.
          נסמן $D = 86400\,\text{s}$, יממה.

          (1) בטאו באמצעות $D$ ו-$\varepsilon$ את מספר השניות שהשעון מפגר ביממה, והראו שכאשר $\varepsilon \ll 1$ הפיגור הוא בערך
          $\tfrac12\varepsilon D$.

          (2) בדקו את הביטוי המדויק בגבולות $\varepsilon \to 0$ ו-$\varepsilon \to 1$ ואת היחידות, וחשבו את הפיגור כש-$g$ קטן
          ב-$0.10\%$.
        hints:
          - 'השעון סופר תנודות: כל תנודה שלמה מזיזה את המחוגים בזמן המחזור $T_0$ של המטוטלת בשפלה.'
          - '$\sqrt{1 - \varepsilon} \approx 1 - \tfrac12\varepsilon$ כש-$\varepsilon \ll 1$.'
        solution:
          - kind: law
            text: >-
              בקירוב ההרמוני $\omega_0^2 = g/L$, ולכן $T = 2\pi\sqrt{L/g} \propto g^{-1/2}$. השעון סופר תנודות, ומקדם כל
              תנודה ב-$T_0$, זמן המחזור שלפיו כוונן.
          - kind: manipulation
            text: >-
              על ההר $T = T_0/\sqrt{1 - \varepsilon}$. ביממה אמיתית המטוטלת מבצעת $D/T$ תנודות, והשעון מראה
              $\dfrac DT\,T_0 = D\sqrt{1 - \varepsilon}$. הפיגור:
              $$\Delta t = D\left(1 - \sqrt{1 - \varepsilon}\right) \approx D\left[1 - \left(1 - \tfrac12\varepsilon\right)\right] = \tfrac12\varepsilon D$$
              באופן כללי $\dfrac{\Delta T}{T} \approx \tfrac12\dfrac{\Delta L}{L} - \tfrac12\dfrac{\Delta g}{g}$: השעון רגיש לשינוי
              של $g$ בחצי מהשינוי היחסי, ולא בכולו, כמו שהיה אילו $T \propto 1/g$.
          - kind: limit
            text: >-
              כש-$\varepsilon \to 0$: $\Delta t \to 0$, השעון מדויק. כש-$\varepsilon \to 1$ ($g' \to 0$): $T \to \infty$, המטוטלת
              לא חוזרת, השעון עומד, ו-$\Delta t \to D$: הוא מפגר ביממה שלמה, כמו שהביטוי המדויק נותן (והקירוב $\tfrac12D$
              כבר לא, כי $\varepsilon$ אינו קטן).
          - kind: units
            text: '$\varepsilon$ חסר ממדים, ולכן $\Delta t$ בשניות, כמו $D$.'
          - kind: substitution
            text: >-
              $\varepsilon = 0.0010$: $\Delta t = 86400\left(1 - \sqrt{0.999}\right) = 43.2\,\text{s}$, והקירוב $\tfrac12\cdot0.0010\cdot86400 = 43.2\,\text{s}$
              (ההפרש ביניהם $0.01\,\text{s}$). כל תנודה ארוכה ב-$0.05\%$. אילו $T \propto 1/g$, היה יוצא כפול, $86.4\,\text{s}$.
          - kind: result
            text: >-
              $\Delta t = D\left(1 - \sqrt{1 - \varepsilon}\right) \approx \tfrac12\varepsilon D = 43.2\,\text{s}$ ביממה. שעון מטוטלת
              מדויק הוא מד כובד רגיש: שינוי של $0.1\%$ ב-$g$ מופיע כ-$43\,\text{s}$ ביום.
        rubric:
          - text: כתבתי $T \propto g^{-1/2}$ מהקירוב ההרמוני, ולא $T \propto 1/g$.
          - text: >-
              מצאתי שהשעון מראה $D\sqrt{1 - \varepsilon}$ ביממה, והפיגור $D\left(1 - \sqrt{1 - \varepsilon}\right) \approx \tfrac12\varepsilon D$.
          - text: בדקתי את הגבולות $\varepsilon \to 0$ ו-$\varepsilon \to 1$ ואת היחידות, וחישבתי $43.2\,\text{s}$.


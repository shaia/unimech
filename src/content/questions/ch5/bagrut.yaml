chapter: 5
questions:
  # ------------------------------------------------------------ 1: Q from a free decay, then the resonance
  - id: Q-5-bagrut-1
    type: bagrut
    title: מקדם איכות מדעיכה, ומה הוא מנבא לתהודה
    prompt: >-
      גוף בעל מסה $m = 0.25\,\text{kg}$ קשור לקפיץ אופקי בעל קבוע קפיץ $k = 100\,\text{N/m}$, ועל הגוף פועל כוח ריסון
      חלש $F_b = -b\dot x$. נכתוב את משוואת התנועה בצורה $\ddot x + \gamma\dot x + \omega_0^2x = \dfrac{F(t)}{m}$, עם $\gamma = b/m$,
      $\omega_0^2 = k/m$ ומקדם איכות $Q = \omega_0/\gamma$.

      בשלב הראשון אין כוח חיצוני, $F = 0$. מושכים את הגוף ומשחררים, ומודדים שהאמפליטודה יורדת מ-$4.0\,\text{cm}$
      ל-$1.0\,\text{cm}$ תוך $10.0\,\text{s}$.

      בשלב השני מחברים מנוע שמפעיל על הגוף כוח מאלץ $F(t) = F_0\cos\omega t$ עם $F_0 = 0.10\,\text{N}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-5.1-2]
        prompt: מה התדירות העצמית $\omega_0$ של המתנד?
        answer: 20.0
        unit: rad/s
        correctFeedback: 'נכון. $\omega_0 = \sqrt{k/m} = \sqrt{100/0.25} = 20.0\,\text{rad/s}$. הריסון חלש, ולכן גם התנודות החופשיות בתדירות הזו כמעט בדיוק.'
        wrongFeedback: '$\omega_0 = \sqrt{k/m}$. בדקו שהיחידות יוצאות $\text{s}^{-1}$.'
        commonWrong:
          - value: 400
            feedback: 'זה $k/m = \omega_0^2$. הוציאו שורש.'
          - value: 3.18
            feedback: 'זו התדירות $f = \omega_0/(2\pi)$ ב-$\text{Hz}$. השאלה על התדירות הזוויתית.'

      - label: ב
        type: numeric
        points: 4
        level: mid
        objectives: [OBJ-5.3-2]
        prompt: מהמדידה בשלב הראשון, מה קצב הריסון $\gamma$?
        answer: 0.277
        unit: 1/s
        correctFeedback: >-
          נכון. האמפליטודה דועכת כמו $e^{-\gamma t/2}$, ולכן $e^{-\gamma\cdot10/2} = \dfrac{1.0}{4.0}$,
          ולכן $\gamma = \dfrac{2\ln4}{10.0} = 0.277\,\text{s}^{-1}$. בזמן הזה הגוף מבצע כ-32 תנודות.
        wrongFeedback: 'כתבו את יחס האמפליטודות כאקספוננט, $A(t)/A(0) = e^{-\gamma t/2}$, וקחו לוגריתם טבעי.'
        commonWrong:
          - value: 0.139
            feedback: 'השתמשתם ב-$e^{-\gamma t}$ לאמפליטודה. זו הדעיכה של האנרגיה; האמפליטודה דועכת כמו $e^{-\gamma t/2}$, ולכן $\gamma$ גדול פי 2.'
            misconception: MC-5-energy-decays-like-amplitude
          - value: 0.120
            feedback: 'השתמשתם ב-$\log_{10}$ במקום בלוגריתם הטבעי. ההפוך של $e^x$ הוא $\ln$.'
        hints:
          - 'כמה זה $\ln 4$?'

      - label: ג
        type: numeric
        points: 3
        level: mid
        standalone: false
        objectives: [OBJ-5.3-2]
        prompt: מה מקדם האיכות $Q$ של המתנד?
        answer: 72.1
        unit: ''
        correctFeedback: >-
          נכון. $Q = \dfrac{\omega_0}{\gamma} = \dfrac{20.0}{0.277} = 72.1$. כלומר האנרגיה יורדת פי $e^{2\pi}$ אחרי כ-72
          תנודות, ו-$\gamma \ll 2\omega_0$: תת-ריסון חלש מאוד.
        wrongFeedback: 'חלקו את $\omega_0$ מחלק א ב-$\gamma$ מחלק ב.'
        commonWrong:
          - value: 144
            feedback: 'זה $Q$ עם $\gamma = 0.139\,\text{s}^{-1}$, הקצב של האנרגיה שהוצב כקצב של האמפליטודה. תקנו את חלק ב.'
            misconception: MC-5-energy-decays-like-amplitude
          - value: 0.0139
            feedback: 'חילקתם הפוך. $Q$ גדול כשהריסון חלש: $\gamma$ במכנה.'
          - value: 36.1
            feedback: 'זה $\omega_0/(2\gamma)$, מוסכמה אחרת. בצורה $\ddot x + \gamma\dot x + \omega_0^2x$ ההגדרה היא $Q = \omega_0/\gamma$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-5.4-1, OBJ-5.4-2]
        prompt: >-
          בשלב השני המנוע פועל בתדירות $\omega = \omega_0$.

          (1) מצאו בשיטה המרוכבת את האמפליטודה של המצב היציב ואת הפיגור $\delta$ של ההעתק אחרי הכוח, וכתבו את
          האמפליטודה בעזרת $Q$ ו-$F_0/k$. בדקו את התוצאה בגבולות $\gamma \to 0$ ו-$\omega \to 0$ ואת היחידות שלה.

          (2) הראו שרוחב התהודה $\Delta\omega$, הרוחב המלא של $A^2(\omega)$ בחצי הגובה, הוא בערך $\gamma = \omega_0/Q$,
          וחשבו את האמפליטודה בתהודה ואת $\Delta\omega$.
        hints:
          - 'הציבו $z = \tilde Xe^{i\omega t}$ ב-$\ddot z + \gamma\dot z + \omega_0^2z = (F_0/m)e^{i\omega t}$.'
          - 'ליד התהודה $\omega_0^2 - \omega^2 \approx 2\omega_0(\omega_0 - \omega)$.'
        solution:
          - { kind: law, text: 'החוק השני: $m\ddot x = -kx - b\dot x + F_0\cos\omega t$, כלומר $\ddot x + \gamma\dot x + \omega_0^2x = \dfrac{F_0}{m}\cos\omega t$. פותרים $\ddot z + \gamma\dot z + \omega_0^2z = \dfrac{F_0}{m}e^{i\omega t}$ ולוקחים $x = \operatorname{Re}z$.' }
          - { kind: manipulation, text: 'הצבת $z = \tilde Xe^{i\omega t}$ נותנת $\left(\omega_0^2 - \omega^2 + i\gamma\omega\right)\tilde X = F_0/m$. ב-$\omega = \omega_0$ נשאר $i\gamma\omega_0\tilde X = F_0/m$, ולכן $\tilde X = -i\dfrac{F_0}{m\gamma\omega_0}$: $$x(t) = \frac{F_0}{m\gamma\omega_0}\cos\left(\omega_0t - \frac{\pi}{2}\right) = Q\frac{F_0}{k}\sin\omega_0t$$ כי $\dfrac{F_0}{m\gamma\omega_0} = \dfrac{\omega_0}{\gamma}\cdot\dfrac{F_0}{m\omega_0^2} = Q\dfrac{F_0}{k}$. הארגומנט של $\tilde X$ הוא $\arg\tilde X = -\pi/2$: ההעתק מפגר אחרי הכוח בפיגור $\delta = \pi/2$.' }
          - { kind: manipulation, text: 'רוחב: $A^2 = \dfrac{(F_0/m)^2}{\left(\omega_0^2 - \omega^2\right)^2 + \gamma^2\omega^2}$. ליד התהודה המכנה $\approx 4\omega_0^2(\omega_0 - \omega)^2 + \gamma^2\omega_0^2$, והוא כפול מערכו בשיא כש-$\left|\omega - \omega_0\right| = \gamma/2$. הרוחב המלא $\Delta\omega \approx \gamma = \omega_0/Q$.' }
          - { kind: limit, text: 'כש-$\gamma \to 0$, $Q \to \infty$ והאמפליטודה בתהודה שואפת לאין-סוף: בלי ריסון אין מצב יציב בתהודה, והתנודה גדלה בלי גבול. והתוצאה $QF_0/k$ מדויקת ב-$\omega = \omega_0$ (רק הרוחב מקורב). ואותה משוואה לאמפליטודה המרוכבת, $\left(\omega_0^2 - \omega^2 + i\gamma\omega\right)\tilde X = F_0/m$, נותנת כש-$\omega \to 0$ את $\tilde X = \dfrac{F_0}{m\omega_0^2} = \dfrac{F_0}{k}$: כוח קבוע מותח את הקפיץ בדיוק ב-$F_0/k$, בלי פיגור. בתהודה האמפליטודה גדולה מזה פי $Q$.' }
          - { kind: units, text: '$\dfrac{F_0}{m\gamma\omega_0}$ ביחידות $\dfrac{\text{N}}{\text{kg}\cdot\text{s}^{-1}\cdot\text{s}^{-1}} = \dfrac{\text{kg}\cdot\text{m/s}^2}{\text{kg/s}^2} = \text{m}$. ו-$Q$ חסר ממדים, כך ש-$QF_0/k$ באותן יחידות כמו $F_0/k$, מטרים.' }
          - { kind: substitution, text: '$A = 72.1\cdot\dfrac{0.10}{100} = 0.0721\,\text{m}$, ו-$\Delta\omega \approx \gamma = 0.277\,\text{rad/s}$. היחס $\Delta\omega/\omega_0 = 1/Q \approx 1.4\%$.' }
          - { kind: result, text: 'בתהודה $x = Q\dfrac{F_0}{k}\sin\omega_0t$: אמפליטודה $7.2\,\text{cm}$, פי 72 מההתארכות הסטטית $0.10\,\text{cm}$, וההעתק מפגר ב-$90^\circ$ אחרי הכוח. רוחב התהודה $\Delta\omega \approx 0.28\,\text{rad/s}$: מספיק להזיז את המנוע ב-$0.14\,\text{rad/s}$ מהתהודה כדי ש-$A^2$ ירד לחצי.' }
        rubric:
          - text: הצבתי $z = \tilde Xe^{i\omega t}$ וקיבלתי $\left(\omega_0^2 - \omega^2 + i\gamma\omega\right)\tilde X = F_0/m$.
          - text: מצאתי שבתהודה $\left|\tilde X\right| = \dfrac{F_0}{m\gamma\omega_0} = QF_0/k$ ושההעתק מפגר אחרי הכוח ב-$\delta = \pi/2$.
          - text: הראיתי שרוחב התהודה המלא הוא בערך $\gamma = \omega_0/Q$.
          - text: בדקתי שבגבול $\gamma \to 0$ האמפליטודה בתהודה שואפת לאין-סוף, שב-$\omega \to 0$ מתקבלת ההתארכות הסטטית $F_0/k$, ושהיחידות מטרים.
          - text: קיבלתי אמפליטודה של כ-$7.2\,\text{cm}$ ורוחב של כ-$0.28\,\text{rad/s}$.

      - label: ה
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-5.4-2, OBJ-5.3-1]
        prompt: >-
          הפעם מפעילים את המנוע ברגע $t = 0$, בתדירות $\omega = \omega_0$, אבל הגוף לא מתחיל במנוחה בשיווי המשקל: מושכים
          אותו קודם להעתק $A_0 = Q\dfrac{F_0}{k}$, האמפליטודה של המצב היציב מחלק ד, ומשחררים אותו ממנוחה בדיוק כשהמנוע
          מתחיל לפעול. כלומר $x(0) = A_0$ ו-$\dot x(0) = 0$.

          (1) כתבו את התנועה כמצב היציב של חלק ד ועוד תגובה מעברית,
          $x_h = e^{-\gamma t/2}\left(C\cos\omega_dt + D\sin\omega_dt\right)$ עם $\omega_d = \sqrt{\omega_0^2 - \gamma^2/4}$
          (שיעור 5.3). קבעו את $C$ ואת $D$ מתנאי ההתחלה, והראו שבריסון חלש, $\gamma \ll \omega_0$,
          $$x(t) \approx A_0\left[\left(1 - e^{-\gamma t/2}\right)\sin\omega_0t + e^{-\gamma t/2}\cos\omega_0t\right]$$

          (2) האמפליטודה של התנועה לא נשארת $A_0$ לאורך כל הדרך. הראו שהיא יורדת עד $A_0/\sqrt2$, ובטאו באמצעות $Q$
          ו-$\omega_0$ את הרגע $t^*$ שבו זה קורה. בדקו את האמפליטודה ב-$t = 0$ וכש-$t \gg 2/\gamma$, את $t^*$ בגבול
          $\gamma \to 0$, ואת היחידות; וחשבו את $t^*$ ואת האמפליטודה המזערית.
        hints:
          - 'התגובה המעברית פותרת את המשוואה בלי הכוח המאלץ. בריסון חלש $\omega_d \approx \omega_0$.'
          - >-
            כשהמקדמים $a(t)$ ו-$b(t)$ של $\sin\omega_0t$ ושל $\cos\omega_0t$ משתנים לאט לעומת המחזור, האמפליטודה היא
            $\sqrt{a^2 + b^2}$. סמנו $\varepsilon = e^{-\gamma t/2}$, ומצאו את המינימום כפונקציה של $\varepsilon$.
        solution:
          - kind: law
            text: >-
              המשוואה ליניארית, ולכן הפתרון הכללי הוא פתרון פרטי ועוד הפתרון הכללי של המשוואה ההומוגנית (שיעור 5.4): המצב
              היציב $x_p = A_0\sin\omega_0t$ עם $A_0 = Q\dfrac{F_0}{k}$ (חלק ד), ועוד התגובה המעברית, תנודה חופשית מרוסנת
              $x_h = e^{-\gamma t/2}\left(C\cos\omega_dt + D\sin\omega_dt\right)$ (שיעור 5.3). תנאי ההתחלה חלים על הסכום.
          - kind: manipulation
            text: >-
              $x(0) = 0 + C = A_0$, ולכן $C = A_0$. הנגזרת ב-$t = 0$:
              $\dot x(0) = A_0\omega_0 - \tfrac12\gamma C + D\omega_d = 0$, ולכן $D = -\dfrac{A_0\left(\omega_0 - \gamma/2\right)}{\omega_d} \approx -A_0$,
              כי $\gamma \ll \omega_0$ ו-$\omega_d \approx \omega_0$. עם $\omega_d \approx \omega_0$:
              $$x(t) \approx A_0\sin\omega_0t + A_0e^{-\gamma t/2}\left(\cos\omega_0t - \sin\omega_0t\right) = A_0\left[\left(1 - e^{-\gamma t/2}\right)\sin\omega_0t + e^{-\gamma t/2}\cos\omega_0t\right]$$
          - kind: manipulation
            text: >-
              עם $\varepsilon = e^{-\gamma t/2}$ המקדמים הם $A_0(1 - \varepsilon)$ ו-$A_0\varepsilon$, והם משתנים לאט, ולכן
              האמפליטודה היא $a = A_0\sqrt{(1 - \varepsilon)^2 + \varepsilon^2}$. הנגזרת לפי $\varepsilon$ מתאפסת כש-$2\varepsilon - 2(1 - \varepsilon) = 0$,
              כלומר $\varepsilon = \tfrac12$, ושם $a_{\min} = A_0\sqrt{\tfrac14 + \tfrac14} = \dfrac{A_0}{\sqrt2}$. הרגע:
              $e^{-\gamma t^*/2} = \tfrac12$, ולכן
              $$t^* = \frac{2\ln2}{\gamma} = \frac{2Q\ln2}{\omega_0}$$
              הסיבה: התנודה החופשית שמתחילה ב-$x = A_0$ היא קוסינוס, והמצב היציב הוא סינוס, מוזז ב-$90^\circ$. האמפליטודות
              שלהם מתחברות בריבוע, ובזמן שהאחת דועכת והשנייה נבנית, באמצע הדרך כל אחת מהן $A_0/2$, והסכום
              בריבוע נותן $A_0/\sqrt2$. באותו רגע נשאר במתנד רק חצי מהאנרגיה של המצב היציב, כי האנרגיה היא $\tfrac12ka^2$.
          - kind: limit
            text: >-
              ב-$t = 0$: $\varepsilon = 1$ ו-$a = A_0$, ההעתק ההתחלתי. כש-$t \gg 2/\gamma$: $\varepsilon \to 0$ ו-$a \to A_0$,
              והתנועה היא $A_0\sin\omega_0t$, המצב היציב של חלק ד, שלא זוכר את תנאי ההתחלה. כש-$\gamma \to 0$: $t^* \to \infty$,
              כי בלי ריסון התנודה החופשית לעולם לא דועכת. (ואילו היינו מתחילים ב-$x(0) = 0$, $\dot x(0) = A_0\omega_0$, המצב
              של $x_p$ עצמו ב-$t = 0$, היה יוצא $C = D = 0$: בלי תגובה מעברית, והאמפליטודה $A_0$ כל הזמן.)
          - kind: units
            text: >-
              $\gamma t$ חסר ממדים, ולכן $\varepsilon$ ו-$\sqrt{(1 - \varepsilon)^2 + \varepsilon^2}$ חסרי ממדים, ו-$a$ במטרים כמו
              $A_0$. $\dfrac{2Q\ln2}{\omega_0}$ ביחידות $1/\text{s}^{-1} = \text{s}$.
          - kind: substitution
            text: >-
              $t^* = \dfrac{2\cdot72.1\cdot0.693}{20.0} = \dfrac{2\cdot0.693}{0.277} = 5.00\,\text{s}$, כ-16 תנודות, ו-$a_{\min} = \dfrac{7.21}{\sqrt2} = 5.10\,\text{cm}$.
          - kind: result
            text: >-
              $x \approx A_0\left[\left(1 - e^{-\gamma t/2}\right)\sin\omega_0t + e^{-\gamma t/2}\cos\omega_0t\right]$: האמפליטודה יורדת
              מ-$A_0$ ל-$A_0/\sqrt2 = 5.10\,\text{cm}$ ברגע $t^* = \dfrac{2Q\ln2}{\omega_0} = 5.00\,\text{s}$, וחוזרת ל-$A_0$. מתחילים
              באמפליטודה הנכונה אבל בפאזה הלא נכונה, ומשלמים על זה בחצי מהאנרגיה.
        rubric:
          - text: כתבתי את הפתרון כמצב יציב ועוד תגובה מעברית, וקבעתי $C = A_0$ ו-$D \approx -A_0$ מתנאי ההתחלה של הסכום.
          - text: קיבלתי $x \approx A_0\left[\left(1 - e^{-\gamma t/2}\right)\sin\omega_0t + e^{-\gamma t/2}\cos\omega_0t\right]$.
          - text: >-
              כתבתי את האמפליטודה $A_0\sqrt{(1 - \varepsilon)^2 + \varepsilon^2}$, מצאתי את המינימום $A_0/\sqrt2$ ב-$\varepsilon = \tfrac12$,
              ו-$t^* = \dfrac{2Q\ln2}{\omega_0}$.
          - text: בדקתי את $t = 0$, את $t \gg 2/\gamma$ (המצב היציב) ואת $\gamma \to 0$, ואת היחידות; חישבתי $5.00\,\text{s}$ ו-$5.10\,\text{cm}$.

  # ------------------------------------------------------------ 2: a ball dropped onto a spring
  - id: Q-5-bagrut-2
    type: bagrut
    title: כדור שנופל על קפיץ
    prompt: >-
      קפיץ אנכי בעל קבוע קפיץ $k = 100\,\text{N/m}$ עומד על הרצפה, ועל הקצה העליון שלו לוחית שהמסה שלה זניחה. כדור
      בעל מסה $m = 0.50\,\text{kg}$ משתחרר ממנוחה בגובה $h = 0.10\,\text{m}$ מעל הלוחית, נופל עליה ונדבק אליה. ההתנגשות
      לא מאבדת אנרגיה: המסה של הלוחית זניחה, ולכן המסה המצומצמת של הכדור והלוחית, וגם האנרגיה הזמינה בהתנגשות,
      $\tfrac12\mu v^2$, שואפות לאפס (שיעור 4.2). אחר כך הכדור והלוחית נעים יחד, והכדור לא ניתק מהלוחית. הזניחו
      את התנגדות האוויר.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-5.1-2]
        prompt: 'בכמה סנטימטרים, $d$, מכווץ הקפיץ כשהכדור מונח עליו בשיווי משקל?'
        answer: 4.90
        unit: cm
        correctFeedback: 'נכון. בשיווי המשקל $kd = mg$, ולכן $d = \dfrac{mg}{k} = \dfrac{0.50\cdot9.8}{100} = 0.049\,\text{m} = 4.90\,\text{cm}$.'
        wrongFeedback: 'בשיווי המשקל כוח הקפיץ מאזן את הכובד: $kd = mg$.'
        commonWrong:
          - value: 9.80
            feedback: 'זה $2mg/k$, הכיווץ המרבי כשמניחים את הכדור על הקפיץ הרפוי ומשחררים. בשיווי המשקל $kd = mg$, בלי 2.'

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-5.1-1, OBJ-5.1-2]
        prompt: >-
          אחרי המגע הכדור מתנודד סביב נקודת שיווי המשקל של חלק א. מה האמפליטודה של התנודה, בסנטימטרים?
        answer: 11.0
        unit: cm
        correctFeedback: >-
          נכון. נמדוד $y$ כלפי מטה מנקודת שיווי המשקל. סביבה $m\ddot y = -ky$, עם $\omega_0 = \sqrt{k/m} = 14.1\,\text{rad/s}$.
          ברגע המגע הכדור $4.90\,\text{cm}$ **מעל** שיווי המשקל, $y_0 = -4.90\,\text{cm}$, ונע מטה ב-$v_0 = \sqrt{2gh} = 1.40\,\text{m/s}$:
          $$A = \sqrt{y_0^2 + \left(\frac{v_0}{\omega_0}\right)^2} = \sqrt{4.90^2 + 9.90^2} = 11.0\,\text{cm}$$
        wrongFeedback: >-
          תנאי ההתחלה של התנודה הם ההעתק מנקודת שיווי המשקל ברגע המגע (לא אפס: הלוחית נמצאת בקצה הרפוי של הקפיץ) והמהירות
          של הכדור ברגע המגע.
        commonWrong:
          - value: 9.90
            feedback: 'זה $v_0/\omega_0$ לבד, כאילו המגע קרה בנקודת שיווי המשקל. הוא קורה $4.90\,\text{cm}$ מעליה, וגם ההעתק הזה נכנס לאמפליטודה.'
          - value: 14.8
            feedback: 'חיברתם $|y_0| + v_0/\omega_0$. שני הגדלים הם רכיבים של הקוסינוס והסינוס של הפאזה, ומחברים את הריבועים.'
          - value: 4.90
            feedback: 'זה ההעתק ברגע המגע בלבד. הכדור מגיע במהירות, ולכן הוא ממשיך הרבה מעבר לו.'
            misconception: MC-5-amplitude-is-x0
        hints:
          - 'מה מהירות הכדור ברגע המגע, ואיפה הוא אז ביחס לנקודת שיווי המשקל?'

      - label: ג
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-5.2-1, OBJ-5.1-2]
        prompt: >-
          (1) בעזרת שימור האנרגיה בלבד, מצאו ביטוי לכיווץ המרבי $x_{\max}$ של הקפיץ, בעזרת $m$, $g$, $k$ ו-$h$. הראו שהוא שווה
          ל-$d + A$ מחלקים א ו-ב.

          (2) בדקו את הביטוי בשני גבולות, $h \to 0$ ו-$h \gg mg/k$, ובדקו את היחידות שלו. חשבו את $x_{\max}$.
        hints:
          - 'השוו את המצב ההתחלתי (מנוחה בגובה $h$ מעל הלוחית) למצב של הכיווץ המרבי, שבו הכדור שוב במנוחה.'
        solution:
          - { kind: law, text: 'שימור אנרגיה מכנית, כי ההתנגשות עם לוחית חסרת מסה לא מאבדת אנרגיה: בין השחרור לכיווץ המרבי הכדור יורד $h + x_{\max}$, ושם הוא שוב במנוחה, כך ש-$mg\left(h + x_{\max}\right) = \tfrac12kx_{\max}^2$.' }
          - { kind: manipulation, text: 'זו משוואה ריבועית: $\tfrac12kx^2 - mgx - mgh = 0$. השורש החיובי: $$x_{\max} = \frac{mg}{k} + \sqrt{\left(\frac{mg}{k}\right)^2 + \frac{2mgh}{k}}$$ והאיבר הראשון הוא $d$. בשני: $\left(\dfrac{v_0}{\omega_0}\right)^2 = \dfrac{2gh\cdot m}{k}$, ולכן השורש הוא $\sqrt{d^2 + (v_0/\omega_0)^2} = A$: $x_{\max} = d + A$, הקצה התחתון של התנודה סביב $d$.' }
          - { kind: manipulation, text: 'אותו דבר בשפת האנרגיה: עם $x = d + y$, $\tfrac12kx^2 - mgx = \tfrac12ky^2 + \text{const}$. הכובד והקפיץ יחד הם קפיץ אחד סביב הנקודה $d$, והאנרגיה $\tfrac12ky^2 + \tfrac12m\dot y^2$ נשמרת: זו התנודה של חלק ב.' }
          - { kind: limit, text: 'כש-$h \to 0$: $x_{\max} \to 2mg/k$, הכיווץ המרבי כשמשחררים את הכדור על הקפיץ הרפוי, פעמיים נקודת שיווי המשקל. כש-$h \gg mg/k$: $x_{\max} \approx \sqrt{2mgh/k}$, כלומר $\tfrac12kx^2 \approx mgh$: העבודה של הכובד בזמן הכיווץ עצמו זניחה לעומת האנרגיה מהנפילה.' }
          - { kind: units, text: '$mg/k$ ביחידות $\dfrac{\text{N}}{\text{N/m}} = \text{m}$, ו-$\dfrac{2mgh}{k}$ ביחידות $\text{m}\cdot\text{m}$, ולכן השורש שלו במטרים.' }
          - { kind: substitution, text: '$\dfrac{mg}{k} = 0.049\,\text{m}$ ו-$\dfrac{2mgh}{k} = \dfrac{2\cdot0.50\cdot9.8\cdot0.10}{100} = 0.0098\,\text{m}^2$: $x_{\max} = 0.049 + \sqrt{0.0024 + 0.0098} = 0.049 + 0.110 = 0.159\,\text{m}$.' }
          - { kind: result, text: '$x_{\max} = \dfrac{mg}{k} + \sqrt{\left(\dfrac{mg}{k}\right)^2 + \dfrac{2mgh}{k}} = d + A = 15.9\,\text{cm}$. בגבול $h \to 0$ זה $2mg/k$, ובגבול $h \gg mg/k$ זה $\sqrt{2mgh/k}$.' }
        rubric:
          - text: כתבתי שימור אנרגיה בין השחרור לכיווץ המרבי, עם ירידה של $h + x_{\max}$ ולא רק $h$.
          - text: פתרתי את המשוואה הריבועית ובחרתי את השורש החיובי.
          - text: הראיתי שהתוצאה היא $d + A$, הקצה התחתון של התנודה סביב נקודת שיווי המשקל.
          - text: בדקתי את הגבולות $h \to 0$ (מתקבל $2mg/k$) ו-$h \gg mg/k$, ואת היחידות.
          - text: קיבלתי כיווץ מרבי של כ-$15.9\,\text{cm}$.

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-5.1-1, OBJ-5.1-2]
        prompt: >-
          (1) מצאו את הזמן $t_1$ מרגע המגע עם הלוחית עד הכיווץ המרבי. בטאו אותו קודם באמצעות $\omega_0$, $d$ ו-$A$, ואחר
          כך באמצעות $m$, $k$, $g$ ו-$h$ בלבד.

          (2) בדקו את הביטוי בגבולות $h \to 0$ ו-$h \to \infty$ ואת היחידות שלו, וחשבו את $t_1$.
        hints:
          - 'הכדור עובר קודם את נקודת שיווי המשקל ורק אחר כך מגיע לקצה התחתון.'
          - 'מחלק ב: $\left(v_0/\omega_0\right)^2 = 2gh\cdot\dfrac mk = 2dh$.'
        solution:
          - kind: law
            text: >-
              סביב נקודת שיווי המשקל, עם $y$ כלפי מטה, $\ddot y = -\omega_0^2y$ ו-$\omega_0 = \sqrt{k/m}$, ולכן
              נכתוב $y = A\sin\left(\omega_0t - \alpha\right)$, עם $t = 0$ ברגע המגע. תנאי ההתחלה (חלק ב): $y_0 = -d$ (הכדור
              מעל שיווי המשקל) ו-$\dot y_0 = v_0 > 0$ (נע מטה).
          - kind: manipulation
            text: >-
              ב-$t = 0$: $y_0 = -A\sin\alpha$, ולכן $\sin\alpha = d/A$; ו-$\dot y_0 = A\omega_0\cos\alpha = v_0 > 0$, ולכן
              $\cos\alpha > 0$. זווית שהסינוס שלה $d/A$ והקוסינוס שלה חיובי היא $\alpha = \arcsin(d/A)$, בין $0$ ל-$\pi/2$.
              כלומר הכדור יגיע לשיווי המשקל, $y = 0$, כש-$\omega_0t = \alpha$. הכיווץ המרבי הוא $y = A$, כש-$\omega_0t - \alpha = \pi/2$:
              $$t_1 = \frac{1}{\omega_0}\left(\frac\pi2 + \arcsin\frac dA\right)$$
              כלומר $\arcsin(d/A)/\omega_0$ מהמגע עד שיווי המשקל, ועוד רבע מחזור עד הקצה.
          - kind: manipulation
            text: >-
              עם $d = mg/k$ ו-$A = \sqrt{d^2 + (v_0/\omega_0)^2} = \sqrt{d^2 + 2dh}$:
              $\dfrac dA = \dfrac{1}{\sqrt{1 + 2h/d}}$, ולכן
              $$t_1 = \sqrt{\frac mk}\left[\frac\pi2 + \arcsin\frac{1}{\sqrt{1 + 2kh/(mg)}}\right]$$
          - kind: limit
            text: >-
              כש-$h \to 0$: $d/A \to 1$, $\arcsin1 = \pi/2$, ו-$t_1 \to \pi/\omega_0 = T/2$: הכדור מונח על הלוחית ומשתחרר
              ממנוחה בקצה העליון של התנודה, וחצי מחזור אחר כך הוא בקצה התחתון. כש-$h \to \infty$: $d/A \to 0$ ו-$t_1 \to T/4$:
              הכדור מגיע מהר כל כך שהמגע הוא כמעט בשיווי המשקל, ומשם רבע מחזור. התוצאה בין $T/4$ ל-$T/2$, כמו שצריך.
          - kind: units
            text: >-
              $\arcsin$ של יחס בין שני אורכים חסר ממדים, וגם $\dfrac{kh}{mg}$ חסר ממדים ($\text{N/m}\cdot\text{m}$ חלקי $\text{N}$).
              $\sqrt{m/k}$ ביחידות $\sqrt{\text{kg}/(\text{kg/s}^2)} = \text{s}$.
          - kind: substitution
            text: >-
              $\dfrac dA = \dfrac{4.90}{11.0} = 0.444$, $\arcsin0.444 = 0.460\,\text{rad}$, ולכן
              $t_1 = \dfrac{1.571 + 0.460}{14.1} = 0.144\,\text{s}$: $0.033\,\text{s}$ עד שיווי המשקל ועוד $T/4 = 0.111\,\text{s}$.
              (מי שמחסר את הזמן עד שיווי המשקל מקבל $0.079\,\text{s}$: זה כדור שמתחיל מתחת לשיווי המשקל.)
          - kind: result
            text: >-
              $t_1 = \dfrac{1}{\omega_0}\left(\dfrac\pi2 + \arcsin\dfrac dA\right) = \sqrt{\dfrac mk}\left[\dfrac\pi2 + \arcsin\dfrac{1}{\sqrt{1 + 2kh/(mg)}}\right] = 0.144\,\text{s}$,
              בין רבע מחזור ($h \to \infty$) לחצי מחזור ($h \to 0$).
        rubric:
          - text: >-
              כתבתי את תנאי ההתחלה ביחס לנקודת שיווי המשקל, $y_0 = -d$ ו-$\dot y_0 = v_0$, ומצאתי את הפאזה ברביע הנכון
              (או חיברתי את הזמן עד שיווי המשקל לרבע מחזור).
          - text: קיבלתי $t_1 = \dfrac{1}{\omega_0}\left(\dfrac\pi2 + \arcsin\dfrac dA\right)$, ובטאתי אותו באמצעות $m$, $k$, $g$ ו-$h$.
          - text: בדקתי שב-$h \to 0$ מתקבל $T/2$ וב-$h \to \infty$ מתקבל $T/4$, ובדקתי את היחידות.
          - text: חישבתי $t_1 \approx 0.144\,\text{s}$.

  # ------------------------------------------------------------ 3: a pendulum clock
  - id: Q-5-bagrut-3
    type: bagrut
    title: שעון מטוטלת
    prompt: >-
      המטוטלת של שעון היא משקולת קטנה בעלת מסה $m = 0.20\,\text{kg}$ על מוט קל באורך $L = 1.00\,\text{m}$. המשקולת
      מתנודדת בזוויות קטנות, וכוח הריסון עליה ליניארי במהירות. נכתוב את משוואת התנועה של הזווית בצורה
      $\ddot\theta + \gamma\dot\theta + \omega_0^2\theta = 0$, עם $Q = \omega_0/\gamma$. ההספק שמנגנון השעון מספק מחזיק
      את האמפליטודה קבועה, $\theta_0 = 0.10\,\text{rad}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-5.2-2]

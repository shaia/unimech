        wrongFeedback: 'איך $T$ תלוי ב-$g$? שינוי יחסי קטן ב-$g$ נותן חצי ממנו ב-$T$ (בסימן הפוך).'
        commonWrong:
          - value: 86.4
            feedback: 'הנחתם $T \propto 1/g$. בקירוב ההרמוני $\omega_0^2 = g/L$, ולכן $T \propto g^{-1/2}$, וההשפעה חצי.'

      - label: ה
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-5.3-2, OBJ-5.2-1]
        prompt: >-
          (1) הראו שההספק הממוצע שהריסון מפזר כשהאמפליטודה קבועה הוא $P = \gamma E$, כאשר $E$ האנרגיה של המטוטלת, והראו
          שבכל תנודה הולך לאיבוד חלק $2\pi/Q$ מהאנרגיה.

          (2) בדקו את התוצאה בגבול $Q \to \infty$ ואת היחידות שלה, וחשבו את ההספק שהמנגנון צריך לספק.
        hints:
          - 'כוח הריסון על המשקולת הוא $-m\gamma v$ (מהצורה של המשוואה), וההספק שלו $m\gamma v^2$.'
          - 'הממוצע של $\sin^2$ על מחזור הוא $\tfrac12$.'
        solution:
          - { kind: law, text: 'ההספק של כוח הוא $\vec F\cdot\vec v$. מהמשוואה, כוח הריסון על המשקולת לאורך הקשת הוא $-m\gamma v$, ולכן הוא מפזר הספק $m\gamma v^2$.' }
          - { kind: manipulation, text: 'באמפליטודה קבועה $v = v_{\max}\sin(\omega_0t + \varphi)$, והממוצע של $\sin^2$ על מחזור הוא $\tfrac12$: $$\langle P\rangle = \tfrac12m\gamma v_{\max}^2 = \gamma\cdot\tfrac12mv_{\max}^2 = \gamma E$$ כי האנרגיה כולה קינטית בתחתית. בתנודה אחת, בזמן $2\pi/\omega_0$, הולך לאיבוד $\gamma E\cdot\dfrac{2\pi}{\omega_0} = \dfrac{2\pi}{Q}E$.' }
          - { kind: limit, text: 'כש-$Q \to \infty$ ($\gamma \to 0$): $P \to 0$, מטוטלת בלי ריסון לא צריכה מנגנון. וההפסד לתנודה $2\pi/Q$ מסכים עם הדעיכה החופשית: אחרי $Q$ תנודות האנרגיה יורדת פי $e^{2\pi}$, כמו $\left(1 - 2\pi/Q\right)^Q \approx e^{-2\pi}$.' }
          - { kind: units, text: '$\gamma$ ב-$\text{s}^{-1}$ ו-$E$ ב-$\text{J}$, ולכן $\gamma E$ ב-$\text{J/s} = \text{W}$.' }
          - { kind: substitution, text: '$E = \tfrac12mgL\theta_0^2 = \tfrac12\cdot0.20\cdot9.8\cdot1.00\cdot0.010 = 9.8\cdot10^{-3}\,\text{J}$, $\gamma = \dfrac{\omega_0}{Q} = \dfrac{3.13}{227} = 0.0138\,\text{s}^{-1}$, ולכן $P = 0.0138\cdot9.8\cdot10^{-3} = 1.35\cdot10^{-4}\,\text{W}$. בכל תנודה הולך לאיבוד $2\pi/227 = 2.8\%$ מהאנרגיה.' }
          - { kind: result, text: '$P = \gamma E = \dfrac{\omega_0}{Q}E \approx 1.4\cdot10^{-4}\,\text{W}$, והפסד של $2\pi/Q \approx 2.8\%$ מהאנרגיה בכל תנודה. זה ההספק שהמנגנון צריך להכניס כדי שהאמפליטודה לא תדעך.' }
        rubric:
          - text: כתבתי את ההספק של כוח הריסון, $m\gamma v^2$, ומיצעתי אותו על מחזור עם $\langle\sin^2\rangle = \tfrac12$.
          - text: זיהיתי ש-$\tfrac12mv_{\max}^2 = E$, וקיבלתי $P = \gamma E$ ואת ההפסד $2\pi/Q$ לתנודה.
          - text: בדקתי שב-$Q \to \infty$ ההספק אפס, ושהיחידות וואט.
          - text: חישבתי את $E$ ואת $\gamma$ מחלקים קודמים, וקיבלתי כ-$1.4\cdot10^{-4}\,\text{W}$.


# Chapter 5 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג…), 25 points each, the parts
# climbing basic → mid → bagrut (exam level). Each problem joins objectives of at least two lessons, and the four
# together touch every lesson of the chapter:
#   1: 5.1, 5.3, 5.4 (Q from a free decay, then the resonance it predicts)
#   2: 5.1, 5.2     (a ball dropped onto a spring: the shifted equilibrium, energy, phase)
#   3: 5.2, 5.3     (a pendulum clock: harmonic approximation, Q from a decay, the power that keeps it going)
#   4: 5.2, 5.5     (two pendulums and a weak spring: modes and beats)
# Open parts are solved in the course format: law → manipulation → limit → units → substitution → result.
# Damping convention throughout (stated in every prompt): ẍ + γẋ + ω0²x = (F0/m) cos ωt, Q = ω0/γ.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (G = 9.8, DAY = 86400 s), in .scratch/ch5/review.ts:
#   1: m = 0.25 kg, k = 100 N/m: ω0 = 20.0 rad/s (k/m = 400, f = 3.18); amplitude 4.0 → 1.0 cm in 10 s:
#      γ = 2 ln 4/10 = 0.277 s⁻¹ (energy law 0.139, log10: 0.120); Q = 72.1 (144, 0.0139, 36.1);
#      F0 = 0.10 N at ω0: A = F0/(mγω0) = 7.21 cm, Δω ≈ γ = 0.277 rad/s; transient to 5%: 2 ln 20/γ = 21.6 s
#      (ln 20/γ = 10.8, 2/γ = 7.21);
#   2: k = 100 N/m, m = 0.50 kg, h = 0.10 m: d = mg/k = 4.90 cm (2mg/k = 9.80), ω0 = 14.1 rad/s, v = 1.40 m/s,
#      A = √(d² + (v/ω0)²) = 11.0 cm (v/ω0 = 9.90, d + v/ω = 14.8); x_max = d + A = 15.9 cm (energy check 15.9,
#      without the mg·x term 9.90); contact to x_max = (π/2 + arcsin(d/A))/ω = 0.144 s (T/4 = 0.111,
#      (π/2 − arcsin(d/A))/ω = 0.0786, T/2 = 0.222);
#   3: L = 1.00 m: T = 2.01 s (19.7, 0.319, ω0 = 3.13); m = 0.20 kg, θ0 = 0.10 rad: v_max = √(gL)θ0 = 0.313 m/s
#      (exact 0.3129; √(2gL)θ0 = 0.443, Lθ0 = 0.100); amplitude halves in 50 oscillations: Q = 50π/ln 2 = 227
#      (453, 72.1, 50); g lower by 0.10 %: loses 86400(1 − √0.999) = 43.2 s a day (86.4);
#      E = ½mgLθ0² = 9.80e-3 J, γ = ω0/Q = 0.0138 s⁻¹, P = γE = 1.35e-4 W, 2π/Q = 2.77 % per oscillation;
#   4: L = 0.50 m, m = 0.50 kg, k_c = 0.10 N/m: ω1 = 4.43 rad/s (g/L = 19.6, √(L/g) = 0.226), ω2 = √20 = 4.472,
#      Δω = 0.0449 rad/s (≈ k_c/(mω1) = 0.0452; with k_c for 2k_c 0.0225; √(2k_c/m) = 0.632);
#      swap π/Δω = 69.9 s (2π/Δω = 140, π/(2Δω) = 34.9), about 49.5 oscillations of bob 1.
# Review 2026-11-11 (.scratch/review/ch5/bagrut.ts, independent): every answer, commonWrong and rubric number agrees
#   except π/(2Δω) = 34.948 → 34.9 (was 35.0). Problem 2 writes the natural frequency ω₀ (was ω), as the chapter;
#   2ג is marked standalone: false (it uses d and A of א and ב); 4ג defines ω₁ in its own prompt; 1ד names the lag δ.

chapter: 5
questions:
  # ------------------------------------------------------------ 1: Q from a free decay, then the resonance
  - id: Q-5-bagrut-1
    type: bagrut
    title: מקדם איכות מדעיכה, ומה הוא מנבא לתהודה
    prompt: >-
      גוף בעל מסה $m = 0.25\,\text{kg}$ קשור לקפיץ אופקי בעל קבוע קפיץ $k = 100\,\text{N/m}$, ועל הגוף פועל ריסון חלש
      $-b\dot x$. נכתוב את משוואת התנועה בצורה $\ddot x + \gamma\dot x + \omega_0^2x = \dfrac{F(t)}{m}$, עם $\gamma = b/m$,
      $\omega_0^2 = k/m$ ומקדם איכות $Q = \omega_0/\gamma$.

      בשלב הראשון אין כוח חיצוני, $F = 0$. מושכים את הגוף ומשחררים, ומודדים שהאמפליטודה יורדת מ-$4.0\,\text{cm}$
      ל-$1.0\,\text{cm}$ תוך $10.0\,\text{s}$.

      בשלב השני מחברים מנוע שמפעיל על הגוף כוח מאלץ $F(t) = F_0\cos\omega t$ עם $F_0 = 0.10\,\text{N}$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-5.1-2]
        prompt: מה התדירות העצמית $\omega_0$ של המתנד?
        answer: 20.0
        unit: rad/s
        correctFeedback: 'נכון. $\omega_0 = \sqrt{k/m} = \sqrt{100/0.25} = 20.0\,\text{rad/s}$. הריסון חלש, ולכן גם התנודות החופשיות בתדירות הזו כמעט בדיוק.'
        wrongFeedback: '$\omega_0 = \sqrt{k/m}$. בדקו שהיחידות יוצאות $\text{s}^{-1}$.'
        commonWrong:
          - value: 400
            feedback: 'זה $k/m = \omega_0^2$. הוציאו שורש.'
          - value: 3.18
            feedback: 'זו התדירות $f = \omega_0/(2\pi)$ ב-$\text{Hz}$. השאלה על התדירות הזוויתית.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-5.3-2]
        prompt: מהמדידה בשלב הראשון, מה קצב הריסון $\gamma$?
        answer: 0.277
        unit: 1/s
        correctFeedback: >-
          נכון. האמפליטודה דועכת כמו $e^{-\gamma t/2}$, ולכן $e^{-\gamma\cdot10/2} = \dfrac{1.0}{4.0}$, ו-
          $\gamma = \dfrac{2\ln4}{10.0} = 0.277\,\text{s}^{-1}$. בזמן הזה הגוף מבצע כ-32 תנודות.
        wrongFeedback: 'כתבו את יחס האמפליטודות כאקספוננט, $A(t)/A(0) = e^{-\gamma t/2}$, וקחו לוגריתם טבעי.'
        commonWrong:
          - value: 0.139
            feedback: 'השתמשתם ב-$e^{-\gamma t}$ לאמפליטודה. זו הדעיכה של האנרגיה; האמפליטודה דועכת כמו $e^{-\gamma t/2}$, ולכן $\gamma$ גדול פי 2.'
            misconception: MC-5-energy-decays-like-amplitude
          - value: 0.120
            feedback: 'השתמשתם ב-$\log_{10}$ במקום בלוגריתם הטבעי. ההפוך של $e^x$ הוא $\ln$.'
        hints:
          - 'כמה זה $\ln 4$?'

      - label: ג
        type: numeric
        points: 4
        level: mid
        standalone: false
        objectives: [OBJ-5.3-2]
        prompt: מה מקדם האיכות $Q$ של המתנד?
        answer: 72.1
        unit: ''
        correctFeedback: >-
          נכון. $Q = \dfrac{\omega_0}{\gamma} = \dfrac{20.0}{0.277} = 72.1$. כלומר האנרגיה יורדת פי $e^{2\pi}$ אחרי כ-72
          תנודות, ו-$\gamma \ll 2\omega_0$: תת-ריסון חלש מאוד.
        wrongFeedback: 'חלקו את $\omega_0$ מחלק א ב-$\gamma$ מחלק ב.'
        commonWrong:
          - value: 144
            feedback: 'זה $Q$ עם $\gamma = 0.139\,\text{s}^{-1}$, הקצב של האנרגיה שהוצב כקצב של האמפליטודה. תקנו את חלק ב.'
            misconception: MC-5-energy-decays-like-amplitude
          - value: 0.0139
            feedback: 'חילקתם הפוך. $Q$ גדול כשהריסון חלש: $\gamma$ במכנה.'
          - value: 36.1
            feedback: 'זה $\omega_0/(2\gamma)$, מוסכמה אחרת. בצורה $\ddot x + \gamma\dot x + \omega_0^2x$ ההגדרה היא $Q = \omega_0/\gamma$.'

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-5.4-1, OBJ-5.4-2]
        prompt: >-
          בשלב השני המנוע פועל בתדירות $\omega = \omega_0$.

          (1) מצאו בשיטה המרוכבת את האמפליטודה ואת הפאזה של המצב היציב, וכתבו את האמפליטודה בעזרת $Q$ ו-$F_0/k$.
          בדקו את התוצאה בגבול $\gamma \to 0$ ואת היחידות שלה.

          (2) חשבו את האמפליטודה בתהודה ואת רוחב התהודה $\Delta\omega$, הרוחב המלא של $A^2(\omega)$ בחצי הגובה.
        hints:
          - 'הציבו $z = \tilde Xe^{i\omega t}$ ב-$\ddot z + \gamma\dot z + \omega_0^2z = (F_0/m)e^{i\omega t}$.'
          - 'ליד התהודה $\omega_0^2 - \omega^2 \approx 2\omega_0(\omega_0 - \omega)$.'
        solution:
          - { kind: law, text: 'החוק השני: $m\ddot x = -kx - b\dot x + F_0\cos\omega t$, כלומר $\ddot x + \gamma\dot x + \omega_0^2x = \dfrac{F_0}{m}\cos\omega t$. פותרים $\ddot z + \gamma\dot z + \omega_0^2z = \dfrac{F_0}{m}e^{i\omega t}$ ולוקחים $x = \operatorname{Re}z$.' }
          - { kind: manipulation, text: 'הצבת $z = \tilde Xe^{i\omega t}$ נותנת $\left(\omega_0^2 - \omega^2 + i\gamma\omega\right)\tilde X = F_0/m$. ב-$\omega = \omega_0$ נשאר $i\gamma\omega_0\tilde X = F_0/m$, ולכן $\tilde X = -i\dfrac{F_0}{m\gamma\omega_0}$: $$x(t) = \frac{F_0}{m\gamma\omega_0}\cos\left(\omega_0t - \frac{\pi}{2}\right) = Q\frac{F_0}{k}\sin\omega_0t$$ כי $\dfrac{F_0}{m\gamma\omega_0} = \dfrac{\omega_0}{\gamma}\cdot\dfrac{F_0}{m\omega_0^2} = Q\dfrac{F_0}{k}$. הארגומנט של $\tilde X$ הוא $-\pi/2$: ההעתק מפגר אחרי הכוח בפיגור $\delta = \pi/2$.' }
          - { kind: manipulation, text: 'רוחב: $A^2 = \dfrac{(F_0/m)^2}{\left(\omega_0^2 - \omega^2\right)^2 + \gamma^2\omega^2}$. ליד התהודה המכנה $\approx 4\omega_0^2(\omega_0 - \omega)^2 + \gamma^2\omega_0^2$, והוא כפול מערכו בשיא כש-$\left|\omega - \omega_0\right| = \gamma/2$. הרוחב המלא $\Delta\omega \approx \gamma = \omega_0/Q$.' }
          - { kind: limit, text: 'כש-$\gamma \to 0$, $Q \to \infty$ והאמפליטודה בתהודה שואפת לאין-סוף: בלי ריסון אין מצב יציב בתהודה, והתנודה גדלה בלי גבול. והתוצאה $QF_0/k$ מדויקת ב-$\omega = \omega_0$ (רק הרוחב מקורב): כש-$Q = 1$ היא בדיוק ההתארכות הסטטית $F_0/k$, כמו שמצפים כשאין תהודה של ממש.' }
          - { kind: units, text: '$\dfrac{F_0}{m\gamma\omega_0}$ ביחידות $\dfrac{\text{N}}{\text{kg}\cdot\text{s}^{-1}\cdot\text{s}^{-1}} = \dfrac{\text{kg}\cdot\text{m/s}^2}{\text{kg/s}^2} = \text{m}$. ו-$Q$ חסר ממדים, כך ש-$QF_0/k$ באותן יחידות כמו $F_0/k$, מטרים.' }
          - { kind: substitution, text: '$A = 72.1\cdot\dfrac{0.10}{100} = 0.0721\,\text{m}$, ו-$\Delta\omega \approx \gamma = 0.277\,\text{rad/s}$. היחס $\Delta\omega/\omega_0 = 1/Q \approx 1.4\%$.' }
          - { kind: result, text: 'בתהודה $x = Q\dfrac{F_0}{k}\sin\omega_0t$: אמפליטודה $7.2\,\text{cm}$, פי 72 מההתארכות הסטטית $0.10\,\text{cm}$, וההעתק מפגר ב-$90^\circ$ אחרי הכוח. רוחב התהודה $\Delta\omega \approx 0.28\,\text{rad/s}$: מספיק להזיז את המנוע ב-$0.14\,\text{rad/s}$ מהתהודה כדי ש-$A^2$ ירד לחצי.' }
        rubric:
          - text: הצבתי $z = \tilde Xe^{i\omega t}$ וקיבלתי $\left(\omega_0^2 - \omega^2 + i\gamma\omega\right)\tilde X = F_0/m$.
          - text: מצאתי שבתהודה $\left|\tilde X\right| = \dfrac{F_0}{m\gamma\omega_0} = QF_0/k$ ושההעתק מפגר אחרי הכוח ב-$\delta = \pi/2$.
          - text: הראיתי שרוחב התהודה המלא הוא בערך $\gamma = \omega_0/Q$.
          - text: בדקתי שבגבול $\gamma \to 0$ האמפליטודה בתהודה שואפת לאין-סוף, ושהיחידות מטרים.
          - text: קיבלתי אמפליטודה של כ-$7.2\,\text{cm}$ ורוחב של כ-$0.28\,\text{rad/s}$.

      - label: ה
        type: numeric
        points: 5
        level: bagrut
        standalone: false
        objectives: [OBJ-5.4-2]
        prompt: >-
          המנוע מופעל ברגע $t = 0$, בתדירות $\omega = \omega_0$, כשהגוף במנוחה בנקודת שיווי המשקל. התנועה היא המצב היציב
          ועוד תגובה מעברית, שבהתחלה האמפליטודה שלה כמעט שווה לזו של המצב היציב (כי $x(0) = 0$ ו-$\dot x(0) = 0$). אחרי כמה
          זמן האמפליטודה של התגובה המעברית יורדת ל-5% מהאמפליטודה של המצב היציב?
        answer: 21.6
        unit: s
        correctFeedback: >-
          נכון. התגובה המעברית היא תנודה חופשית מרוסנת, ולכן היא דועכת כמו $e^{-\gamma t/2}$: $e^{-\gamma t/2} = 0.05$
          ו-$t = \dfrac{2\ln20}{\gamma} = \dfrac{2\cdot3.00}{0.277} = 21.6\,\text{s}$. בקירוב $x \approx Q\dfrac{F_0}{k}\left(1 - e^{-\gamma t/2}\right)\sin\omega_0t$:
          האמפליטודה גדלה בהדרגה. ככל ש-$Q$ גדול יותר, השיא גבוה יותר, אבל גם לוקח יותר זמן להגיע אליו.
        wrongFeedback: 'באיזה קצב דועכת התגובה המעברית? היא פתרון של המשוואה בלי הכוח המאלץ.'
        commonWrong:
          - value: 10.8
            feedback: 'זה $\ln20/\gamma$, הזמן שבו **האנרגיה** של התגובה המעברית יורדת פי 20. האמפליטודה שלה דועכת לאט פי 2, $e^{-\gamma t/2}$.'
            misconception: MC-5-energy-decays-like-amplitude
          - value: 7.21
            feedback: 'זה $2/\gamma$, קבוע הזמן של האמפליטודה. אחריו התגובה המעברית היא עדיין $e^{-1} \approx 37\%$ מהמצב היציב, לא 5%.'
            misconception: MC-2-time-constant-is-full-time
        hints:
          - 'השוו $e^{-\gamma t/2}$ ל-$0.05$, עם $\gamma$ מחלק ב.'

  # ------------------------------------------------------------ 2: a ball dropped onto a spring
  - id: Q-5-bagrut-2
    type: bagrut
    title: כדור שנופל על קפיץ
    prompt: >-
      קפיץ אנכי בעל קבוע קפיץ $k = 100\,\text{N/m}$ עומד על הרצפה, ועל הקצה העליון שלו לוחית שהמסה שלה זניחה. כדור
      בעל מסה $m = 0.50\,\text{kg}$ משתחרר ממנוחה בגובה $h = 0.10\,\text{m}$ מעל הלוחית, נופל עליה ונדבק אליה. מכיוון
      שהמסה של הלוחית זניחה, ההתנגשות לא מאבדת אנרגיה. אחר כך הכדור והלוחית נעים יחד, והכדור לא ניתק מהלוחית. הזניחו
      את התנגדות האוויר.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-5.1-2]
        prompt: בכמה סנטימטרים מכווץ הקפיץ כשהכדור מונח עליו בשיווי משקל?
        answer: 4.90
        unit: cm
        correctFeedback: 'נכון. בשיווי המשקל $kd = mg$, ולכן $d = \dfrac{mg}{k} = \dfrac{0.50\cdot9.8}{100} = 0.049\,\text{m} = 4.90\,\text{cm}$.'
        wrongFeedback: 'בשיווי המשקל כוח הקפיץ מאזן את הכובד: $kd = mg$.'
        commonWrong:
          - value: 9.80
            feedback: 'זה $2mg/k$, הכיווץ המרבי כשמניחים את הכדור על הקפיץ הרפוי ומשחררים. בשיווי המשקל $kd = mg$, בלי 2.'

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-5.1-1, OBJ-5.1-2]
        prompt: >-
          אחרי המגע הכדור מתנודד סביב נקודת שיווי המשקל של חלק א. מה האמפליטודה של התנודה, בסנטימטרים?
        answer: 11.0
        unit: cm
        correctFeedback: >-
          נכון. נמדוד $y$ כלפי מטה מנקודת שיווי המשקל. סביבה $m\ddot y = -ky$, עם $\omega_0 = \sqrt{k/m} = 14.1\,\text{rad/s}$.
          ברגע המגע הכדור $4.90\,\text{cm}$ **מעל** שיווי המשקל, $y_0 = -4.90\,\text{cm}$, ונע מטה ב-$v_0 = \sqrt{2gh} = 1.40\,\text{m/s}$:
          $$A = \sqrt{y_0^2 + \left(\frac{v_0}{\omega_0}\right)^2} = \sqrt{4.90^2 + 9.90^2} = 11.0\,\text{cm}$$
        wrongFeedback: >-
          תנאי ההתחלה של התנודה הם ההעתק מנקודת שיווי המשקל ברגע המגע (לא אפס: הלוחית נמצאת בקצה הרפוי של הקפיץ) והמהירות
          של הכדור ברגע המגע.
        commonWrong:
          - value: 9.90
            feedback: 'זה $v_0/\omega_0$ לבד, כאילו המגע קרה בנקודת שיווי המשקל. הוא קורה $4.90\,\text{cm}$ מעליה, וגם ההעתק הזה נכנס לאמפליטודה.'
          - value: 14.8
            feedback: 'חיברתם $|y_0| + v_0/\omega_0$. שני הגדלים הם רכיבים של הקוסינוס והסינוס של הפאזה, ומחברים את הריבועים.'
          - value: 4.90
            feedback: 'זה ההעתק ברגע המגע בלבד. הכדור מגיע במהירות, ולכן הוא ממשיך הרבה מעבר לו.'
            misconception: MC-5-amplitude-is-x0
        hints:
          - 'מה מהירות הכדור ברגע המגע, ואיפה הוא אז ביחס לנקודת שיווי המשקל?'

      - label: ג
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-5.2-1, OBJ-5.1-2]
        prompt: >-
          (1) בעזרת שימור האנרגיה בלבד, מצאו ביטוי לכיווץ המרבי $x_{\max}$ של הקפיץ, בעזרת $m$, $g$, $k$ ו-$h$. הראו שהוא שווה
          ל-$d + A$ מחלקים א ו-ב.

          (2) בדקו את הביטוי בשני גבולות, $h \to 0$ ו-$h \gg mg/k$, ובדקו את היחידות שלו. חשבו את $x_{\max}$.
        hints:
          - 'השוו את המצב ההתחלתי (מנוחה בגובה $h$ מעל הלוחית) למצב של הכיווץ המרבי, שבו הכדור שוב במנוחה.'
        solution:
          - { kind: law, text: 'שימור אנרגיה מכנית, כי ההתנגשות עם לוחית חסרת מסה לא מאבדת אנרגיה: בין השחרור לכיווץ המרבי הכדור יורד $h + x_{\max}$, ושם הוא שוב במנוחה, כך ש-$mg\left(h + x_{\max}\right) = \tfrac12kx_{\max}^2$.' }
          - { kind: manipulation, text: 'זו משוואה ריבועית: $\tfrac12kx^2 - mgx - mgh = 0$. השורש החיובי: $$x_{\max} = \frac{mg}{k} + \sqrt{\left(\frac{mg}{k}\right)^2 + \frac{2mgh}{k}}$$ והאיבר הראשון הוא $d$. בשני: $\left(\dfrac{v_0}{\omega_0}\right)^2 = \dfrac{2gh\cdot m}{k}$, ולכן השורש הוא $\sqrt{d^2 + (v_0/\omega_0)^2} = A$: $x_{\max} = d + A$, הקצה התחתון של התנודה סביב $d$.' }
          - { kind: manipulation, text: 'אותו דבר בשפת האנרגיה: עם $x = d + y$, $\tfrac12kx^2 - mgx = \tfrac12ky^2 + \text{const}$. הכובד והקפיץ יחד הם קפיץ אחד סביב הנקודה $d$, והאנרגיה $\tfrac12ky^2 + \tfrac12m\dot y^2$ נשמרת: זו התנודה של חלק ב.' }
          - { kind: limit, text: 'כש-$h \to 0$: $x_{\max} \to 2mg/k$, הכיווץ המרבי כשמשחררים את הכדור על הקפיץ הרפוי, פעמיים נקודת שיווי המשקל. כש-$h \gg mg/k$: $x_{\max} \approx \sqrt{2mgh/k}$, כלומר $\tfrac12kx^2 \approx mgh$: העבודה של הכובד בזמן הכיווץ עצמו זניחה לעומת האנרגיה מהנפילה.' }
          - { kind: units, text: '$mg/k$ ביחידות $\dfrac{\text{N}}{\text{N/m}} = \text{m}$, ו-$\dfrac{2mgh}{k}$ ביחידות $\text{m}\cdot\text{m}$, ולכן השורש שלו במטרים.' }
          - { kind: substitution, text: '$\dfrac{mg}{k} = 0.049\,\text{m}$ ו-$\dfrac{2mgh}{k} = \dfrac{2\cdot0.50\cdot9.8\cdot0.10}{100} = 0.0098\,\text{m}^2$: $x_{\max} = 0.049 + \sqrt{0.0024 + 0.0098} = 0.049 + 0.110 = 0.159\,\text{m}$.' }
          - { kind: result, text: '$x_{\max} = \dfrac{mg}{k} + \sqrt{\left(\dfrac{mg}{k}\right)^2 + \dfrac{2mgh}{k}} = d + A = 15.9\,\text{cm}$. בגבול $h \to 0$ זה $2mg/k$, ובגבול $h \gg mg/k$ זה $\sqrt{2mgh/k}$.' }
        rubric:
          - text: כתבתי שימור אנרגיה בין השחרור לכיווץ המרבי, עם ירידה של $h + x_{\max}$ ולא רק $h$.
          - text: פתרתי את המשוואה הריבועית ובחרתי את השורש החיובי.
          - text: הראיתי שהתוצאה היא $d + A$, הקצה התחתון של התנודה סביב נקודת שיווי המשקל.
          - text: בדקתי את הגבולות $h \to 0$ (מתקבל $2mg/k$) ו-$h \gg mg/k$, ואת היחידות.
          - text: קיבלתי כיווץ מרבי של כ-$15.9\,\text{cm}$.


      $$\begin{aligned} m\ddot x_1 &= -\frac{mg}{L}x_1 - k_c(x_1 - x_2) \\ m\ddot x_2 &= -\frac{mg}{L}x_2 - k_c(x_2 - x_1) \end{aligned}$$

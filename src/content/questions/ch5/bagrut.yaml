          - { kind: manipulation, text: 'באמפליטודה קבועה $v = v_{\max}\sin(\omega_0t + \varphi)$, והממוצע של $\sin^2$ על מחזור הוא $\tfrac12$: $$\langle P\rangle = \tfrac12m\gamma v_{\max}^2 = \gamma\cdot\tfrac12mv_{\max}^2 = \gamma E$$ כי האנרגיה כולה קינטית בתחתית. בתנודה אחת, בזמן $2\pi/\omega_0$, הולך לאיבוד $\gamma E\cdot\dfrac{2\pi}{\omega_0} = \dfrac{2\pi}{Q}E$.' }
          - { kind: limit, text: 'כש-$Q \to \infty$ ($\gamma \to 0$): $P \to 0$, מטוטלת בלי ריסון לא צריכה מנגנון. וההפסד לתנודה $2\pi/Q$ מסכים עם הדעיכה החופשית של שיעור 5.3: שם האנרגיה דועכת כמו $e^{-\gamma t}$, ובמחזור אחד, $t = 2\pi/\omega_0$, נשאר ממנה $e^{-2\pi/Q}$. כש-$Q \gg 1$, $e^{-2\pi/Q} \approx 1 - 2\pi/Q$ (פיתוח טיילור, שיעור 0.3), כלומר הולך לאיבוד $2\pi/Q$, אותו חלק.' }

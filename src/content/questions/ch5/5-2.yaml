chapter: 5
questions:
  # ---------------------------------------------------------------- OBJ-5.2-1 energy of the oscillator
  - id: Q-5.2-energy-at-half
    type: mc
    objectives: [OBJ-5.2-1]
    qualitative: true
    level: basic
    prompt: >-
      גוף על קפיץ מתנודד בלי חיכוך באמפליטודה $A$, והאנרגיה הכוללת שלו $E = \tfrac12kA^2$. איזה חלק מהאנרגיה הוא
      אנרגיה קינטית ברגע שהגוף נמצא ב-$x = A/2$?
    choices:
      - text: '$\tfrac34$'
        correct: true
        feedback: >-
          נכון. האנרגיה הפוטנציאלית $\tfrac12k(A/2)^2 = \tfrac14\cdot\tfrac12kA^2 = E/4$, ולכן הקינטית $E - E/4 = \tfrac34E$.
          בחצי הדרך לקצה הגוף עדיין נע ב-$\sqrt{3}/2 \approx 87\%$ מהמהירות המרבית שלו.
      - text: '$\tfrac12$'
        feedback: >-
          האנרגיה הפוטנציאלית לא ליניארית בהעתק: היא $\tfrac12kx^2$, ריבועית. בחצי האמפליטודה היא רק רבע מהמרבית,
          לא חצי.
        misconception: MC-5-energy-linear-in-x
      - text: '$\tfrac14$'
        feedback: 'רבע הוא החלק **הפוטנציאלי**, $\tfrac12k(A/2)^2 = E/4$. השאלה על החלק הקינטי, מה שנשאר.'
      - text: 'אי אפשר לדעת בלי לדעת את $m$ ואת $k$.'
        feedback: >-
          היחס לא תלוי בהם: $U/E = (x/A)^2$ בכל מתנד הרמוני. $m$ ו-$k$ קובעים את התדירות ואת האנרגיה עצמה, לא איך היא
          מתחלקת.
    hints:
      - 'חשבו את $U = \tfrac12kx^2$ ב-$x = A/2$ כחלק מ-$\tfrac12kA^2$.'

  - id: Q-5.2-speed-at-x
    type: numeric
    objectives: [OBJ-5.2-1]
    level: mid
    prompt: >-
      גוף בעל מסה $m = 0.50\,\text{kg}$ על קפיץ אופקי בעל קבוע קפיץ $k = 50\,\text{N/m}$ מתנודד בלי חיכוך באמפליטודה
      $A = 10\,\text{cm}$. מה גודל המהירות שלו כשהוא נמצא $6.0\,\text{cm}$ מנקודת שיווי המשקל?
    answer: 0.80
    unit: m/s
    correctFeedback: >-
      נכון. משימור האנרגיה, $\tfrac12mv^2 + \tfrac12kx^2 = \tfrac12kA^2$, ולכן
      $$v = \sqrt{\frac{k}{m}\left(A^2 - x^2\right)} = 10\cdot\sqrt{0.10^2 - 0.060^2} = 10\cdot0.080 = 0.80\,\text{m/s}$$
      **בדיקת גבולות:** ב-$x = 0$ זה $A\omega_0 = 1.0\,\text{m/s}$, המהירות המרבית, וב-$x = A$ אפס, נקודת המפנה.
    wrongFeedback: 'כתבו את שימור האנרגיה בין הקצה (שם הכול פוטנציאלית) לבין הנקודה $x$, ובודדו את $v$.'
    commonWrong:
      - value: 1.0
        feedback: 'זו המהירות המרבית, $A\omega_0$, במרכז. ב-$6.0\,\text{cm}$ חלק מהאנרגיה כבר פוטנציאלית.'
      - value: 0.40
        feedback: 'חישבתם $\omega_0(A - x)$. האנרגיה ריבועית בהעתק, ולכן מופיע $A^2 - x^2$, לא $A - x$.'
        misconception: MC-5-energy-linear-in-x
      - value: 0.60
        feedback: 'זה $\omega_0x$, ביטוי שגדל עם ההעתק. אבל ככל שהגוף רחוק יותר מהמרכז הוא איטי יותר.'
      - value: 0.064
        feedback: 'שכחתם להוציא שורש: $\omega_0\left(A^2 - x^2\right)$ ביחידות $\text{m}^2/\text{s}$, לא מהירות.'
    hints:
      - 'מה האנרגיה הכוללת? כמה ממנה פוטנציאלית ב-$x = 6.0\,\text{cm}$?'

  - id: Q-5.2-average-kinetic
    type: mc
    objectives: [OBJ-5.2-1]
    qualitative: true
    level: mid
    prompt: >-
      מתנד הרמוני בלי ריסון, באנרגיה כוללת $E$. מה הממוצע **בזמן**, על מחזור שלם, של האנרגיה הקינטית שלו?
    choices:
      - text: '$E/2$, וגם הממוצע של האנרגיה הפוטנציאלית $E/2$.'
        correct: true
        feedback: >-
          נכון. $K = E\sin^2(\omega_0t + \varphi)$ ו-$U = E\cos^2(\omega_0t + \varphi)$, והממוצע של $\sin^2$ ושל $\cos^2$
          על מחזור הוא $\tfrac12$. זה נכון לכל פאזה, כי הממוצע על מחזור שלם לא תלוי בנקודת ההתחלה.
      - text: 'יותר מ-$E/2$, כי הגוף נמצא רוב הזמן ליד המרכז, שם הוא מהיר.'
        feedback: >-
          ההפך: ליד המרכז הגוף מהיר, ולכן הוא עובר שם **מהר** ומבלה שם מעט זמן. ליד נקודות המפנה הוא איטי ומבלה שם
          את רוב הזמן. בכל זאת הממוצעים יוצאים שווים, כי $\sin^2$ ו-$\cos^2$ הם אותה פונקציה מוזזת ברבע מחזור.
        misconception: MC-5-most-time-at-center
      - text: '$E$, כי האנרגיה נשמרת.'
        feedback: 'הסכום $K + U = E$ נשמר, אבל $K$ לבד משתנה בין $0$ ל-$E$. הממוצע שלו קטן מ-$E$.'
      - text: 'זה תלוי בפאזה ההתחלתית.'
        feedback: 'הממוצע על מחזור **שלם** לא תלוי בנקודה שממנה מתחילים לספור, כי בכל מחזור הגוף עובר את כל השלבים פעם אחת.'
    hints:
      - 'כתבו את $K(t)$ בעזרת $x = A\cos(\omega_0t + \varphi)$, ומצאו את הממוצע של $\sin^2$ על מחזור.'

  - id: Q-5.2-bullet-block
    type: numeric
    objectives: [OBJ-5.2-1]
    level: bagrut
    prompt: >-
      גוש בעל מסה $M = 0.99\,\text{kg}$ קשור לקפיץ אופקי בעל קבוע קפיץ $k = 400\,\text{N/m}$ ונח בנקודת שיווי המשקל על
      משטח בלי חיכוך. קליע בעל מסה $m = 0.010\,\text{kg}$, שנע במהירות $300\,\text{m/s}$ לאורך ציר הקפיץ, נתקע בגוש.
      ההתנגשות קצרה מאוד, והקפיץ לא מתכווץ בזמן ההתנגשות. מה האמפליטודה של התנודה שאחריה, בסנטימטרים?
    answer: 15.0
    unit: cm
    correctFeedback: >-
      נכון. שני שלבים. בהתנגשות התנע נשמר והאנרגיה לא: $V = \dfrac{mv}{M + m} = 3.0\,\text{m/s}$. אחריה האנרגיה
      נשמרת, $\tfrac12(M + m)V^2 = \tfrac12kA^2$:
      $$A = V\sqrt{\frac{M + m}{k}} = \frac{mv}{\sqrt{k(M + m)}} = \frac{3.0}{20} = 0.150\,\text{m}$$
      **בדיקת גבולות:** כש-$k \to \infty$, $A \to 0$; וכש-$m \to 0$ גם $A \to 0$. מתוך $450\,\text{J}$ של הקליע
      נשארים לתנודה רק $4.5\,\text{J}$.
    wrongFeedback: >-
      הפרידו את הבעיה לשני שלבים: התנגשות פלסטית (איזה גודל נשמר בה?), ואחריה תנודה שבה האנרגיה נשמרת.
    commonWrong:
      - value: 150
        feedback: >-
          השוויתם את האנרגיה הקינטית של הקליע לאנרגיה של הקפיץ, $\tfrac12mv^2 = \tfrac12kA^2$. אבל בהתנגשות פלסטית
          רוב האנרגיה הופכת לחום ולעיוות: נשמר רק התנע. ההבדל פי 10 באמפליטודה הוא פי 100 באנרגיה.
      - value: 1500
        feedback: 'הצבתם את מהירות הקליע, $300\,\text{m/s}$, כמהירות הגוש. מהירות הגוש אחרי ההתנגשות באה משימור התנע, והיא קטנה פי 100.'
    hints:
      - 'בשלב הראשון: מה מהירות הגוש והקליע יחד מיד אחרי ההתנגשות?'
      - 'בשלב השני: מה מקבלים בשימור אנרגיה בין נקודת שיווי המשקל לקצה התנודה?'

  # ---------------------------------------------------------------- OBJ-5.2-2 harmonic approximation near a minimum
  - id: Q-5.2-curvature-sets-omega
    type: mc
    objectives: [OBJ-5.2-2]
    qualitative: true
    level: basic
    prompt: >-
      חלקיק בעל מסה $m$ נע בקו ישר בפוטנציאל $U(x)$ שיש לו מינימום ב-$x_0$, ומבצע תנודות קטנות סביבו. איזו תכונה של
      $U$ קובעת את התדירות של התנודות הקטנות?
    choices:
      - text: 'הנגזרת השנייה $U''''(x_0)$, העקמומיות של הבור בתחתית: $\omega_0^2 = U''''(x_0)/m$.'
        correct: true
        feedback: >-
          נכון. בפיתוח טיילור סביב המינימום, $U(x) \approx U(x_0) + \tfrac12U''(x_0)(x - x_0)^2$, כי $U'(x_0) = 0$.
          זה בדיוק פוטנציאל של קפיץ עם $k = U''(x_0)$.
      - text: 'העומק של הבור, ההפרש בין $U$ בשפה לבין $U(x_0)$.'
        feedback: >-
          העומק קובע עד איזו אנרגיה החלקיק נשאר כלוא, לא כמה מהר הוא מתנודד. שני בורות באותו עומק, אחד צר ואחד רחב,
          נותנים תדירויות שונות: הצר מתעקם חזק יותר בתחתית.
        misconception: MC-5-frequency-from-depth
      - text: 'הערך $U(x_0)$.'
        feedback: 'הוספת קבוע ל-$U$ לא משנה את הכוח $F = -dU/dx$, ולכן לא משנה שום דבר בתנועה. רק הפרשים ונגזרות של $U$ קובעים.'
      - text: 'השיפוע $U''(x_0)$.'
        feedback: 'במינימום השיפוע אפס: זה מה שהופך את $x_0$ לנקודת שיווי משקל. הוא לא יכול לקבוע תדירות.'
    hints:
      - 'פתחו את $U(x)$ בטור טיילור סביב $x_0$. איזה איבר ראשון לא מתאפס?'

  - id: Q-5.2-moon-clocks
    type: twotier
    objectives: [OBJ-5.2-2]
    qualitative: true
    level: mid
    prompt: >-
      שני שעונים, אחד עם מטוטלת פשוטה (משקולת על חוט) ואחד עם גוף על קפיץ אופקי, מכוונים כך שעל כדור הארץ זמני
      המחזור שלהם שווים. מעבירים את שניהם לירח, שם תאוצת הנפילה קטנה בערך פי 6. מה קורה לזמני המחזור?
    choices:
      - text: 'רק זמן המחזור של המטוטלת משתנה: הוא גדל, בערך פי $\sqrt6$.'
        correct: true
        feedback: 'נכון. $T_{\text{pend}} = 2\pi\sqrt{L/g}$ גדל פי $\sqrt6 \approx 2.4$, ו-$T = 2\pi\sqrt{m/k}$ של הקפיץ לא משתנה.'
      - text: 'שניהם גדלים, כי על הירח הכול "קל יותר".'
        feedback: >-
          הקפיץ לא יודע על הכובד: הכוח המחזיר שלו הוא $-kx$, והמסה (ההתמדה) לא משתנה על הירח. רק המשקל משתנה, והוא לא
          משתתף בתנודה של קפיץ אופקי.
        misconception: MC-5-gravity-changes-omega
      - text: 'אף אחד לא משתנה, כי זמן המחזור של מתנד לא תלוי במסה.'
        feedback: >-
          נכון שזמן המחזור של מטוטלת לא תלוי במסה, אבל הוא תלוי ב-$g$: הכוח המחזיר של מטוטלת **הוא** רכיב של הכובד.
      - text: 'רק זמן המחזור של המטוטלת משתנה: הוא קטן פי $\sqrt6$.'
        feedback: 'כובד חלש יותר פירושו כוח מחזיר חלש יותר, ולכן תנודה **איטית** יותר: $\omega_0 = \sqrt{g/L}$ קטנה, ו-$T$ גדל.'
    reasons:
      - text: 'במטוטלת $U = mgL(1 - \cos\theta)$, ובקירוב הרמוני $\omega_0^2 = g/L$. בקפיץ $\omega_0^2 = k/m$, בלי $g$.'
        correct: true
        feedback: >-
          זה הנימוק. עם הקשת $s = L\theta$, $U \approx \tfrac12\cdot\dfrac{mg}{L}s^2$ לזוויות קטנות, כלומר "קבוע קפיץ"
          $mg/L$, ו-$\omega_0^2 = \dfrac{mg/L}{m} = \dfrac{g}{L}$.
      - text: 'כל מתנד מתנודד לאט יותר כשהכובד חלש יותר.'
        feedback: 'רק מתנד שהכוח המחזיר שלו בא מהכובד. בקפיץ אנכי הכובד רק מזיז את נקודת שיווי המשקל, ובקפיץ אופקי הוא לא משתתף בכלל.'
        misconception: MC-5-gravity-changes-omega
      - text: 'על הירח המסה של המשקולת קטנה.'
        feedback: 'המסה של גוף זהה בכל מקום; רק המשקל שלו, $mg$, משתנה.'
    hints:
      - 'מאיפה בא הכוח המחזיר בכל אחד מהשעונים?'

  - id: Q-5.2-wide-swing
    type: twotier
    objectives: [OBJ-5.2-2]
    qualitative: true
    level: mid
    prompt: >-
      שעון מטוטלת (משקולת קטנה על מוט קל) מכוון כך שהוא מדויק כשהמטוטלת מתנודדת באמפליטודה של $5^\circ$. בגלל תקלה
      במנגנון, המטוטלת מתחילה להתנודד באמפליטודה של $40^\circ$. מה יקרה לשעון?
    choices:
      - text: 'הוא יפגר: כל תנודה תימשך מעט יותר.'
        correct: true
        feedback: >-
          נכון. זמן המחזור של מטוטלת גדל עם האמפליטודה. בזווית $40^\circ$ הוא ארוך ב-3% בערך מזמן המחזור של תנודות
          קטנות, ולכן השעון סופר פחות תנודות ביממה.
      - text: 'הוא ימשיך להיות מדויק, כי זמן המחזור של מטוטלת לא תלוי באמפליטודה.'
        feedback: >-
          זה נכון רק בקירוב ההרמוני, כלומר לזוויות קטנות. הנוסחה $T = 2\pi\sqrt{L/g}$ נגזרה מ-$\sin\theta \approx \theta$,
          והקירוב הזה כבר לא מדויק ב-$40^\circ$.
        misconception: MC-5-isochronous-always
      - text: 'הוא ימהר, כי המשקולת נעה מהר יותר באמפליטודה גדולה.'
        feedback: >-
          המשקולת אכן מהירה יותר, אבל גם הדרך שלה ארוכה יותר. במתנד הרמוני שני השינויים מתקזזים בדיוק; במטוטלת הכוח
          המחזיר גדל לאט יותר מהזווית, והדרך "מנצחת".
      - text: 'הוא ימהר, כי הכוח המחזיר גדל עם הזווית.'
        feedback: >-
          הכוח גדל, אבל פחות מפרופורציונית לזווית: $mg\sin\theta \lt mg\theta$. כוח מחזיר חלש מזה של "הקפיץ" שהקירוב
          מניח פירושו תנודה איטית יותר, לא מהירה יותר.
    reasons:
      - text: 'הכוח המחזיר, $mg\sin\theta$, חלש מ-$mg\theta$ שהקירוב ההרמוני מניח, ובזוויות גדולות ההבדל כבר לא זניח.'
        correct: true
        feedback: >-
          זה הנימוק. בשפת האנרגיה: $U = mgL(1 - \cos\theta)$ נמצאת **מתחת** לפרבולה $\tfrac12mgL\theta^2$, הבור רחב
          ממה שהפרבולה מנבאת, והמשקולת מבלה יותר זמן רחוק מהמרכז.
      - text: 'זמן המחזור של כל מתנד הוא $2\pi\sqrt{m/k}$, בלי תלות באמפליטודה.'
        feedback: 'רק כשהכוח המחזיר ליניארי בהעתק בכל התחום של התנודה. במטוטלת הוא ליניארי רק בקירוב, ליד התחתית.'
        misconception: MC-5-isochronous-always
      - text: 'באמפליטודה גדולה המשקולת נעה מהר יותר, ולכן מסיימת כל תנודה מהר יותר.'
        feedback: 'צריך להשוות את הדרך למהירות. במטוטלת הדרך גדלה מהר יותר מהמהירות, ולכן הזמן גדל.'
    hints:
      - 'השוו את הכוח המחזיר האמיתי, $mg\sin\theta$, לכוח $mg\theta$ של הקירוב ההרמוני.'

  - id: Q-5.2-double-well
    type: numeric
    objectives: [OBJ-5.2-2]
    level: mid
    prompt: >-
      חלקיק בעל מסה $m = 0.20\,\text{kg}$ נע לאורך ציר $x$ בפוטנציאל
      $$U(x) = U_0\left[\left(\frac{x}{a}\right)^4 - 2\left(\frac{x}{a}\right)^2\right]$$
      עם $U_0 = 0.50\,\text{J}$ ו-$a = 0.10\,\text{m}$.
      לפוטנציאל יש שני מינימומים, ב-$x = \pm a$. מה התדירות הזוויתית של תנודות קטנות סביב $x = a$?
    answer: 44.7
    unit: rad/s
    correctFeedback: >-
      נכון. $U''(x) = U_0\left(\dfrac{12x^2}{a^4} - \dfrac{4}{a^2}\right)$, וב-$x = a$: $U''(a) = \dfrac{8U_0}{a^2} = 400\,\text{N/m}$.
      לכן $\omega_0 = \sqrt{400/0.20} = 44.7\,\text{rad/s}$. ב-$x = 0$, לעומת זאת, $U''(0) = -4U_0/a^2 < 0$: מקסימום,
      שיווי משקל לא יציב.
    wrongFeedback: 'גזרו את $U$ פעמיים, הציבו $x = a$, והשתמשו ב-$\omega_0^2 = U''''(a)/m$.'
    commonWrong:
      - value: 22.4
        feedback: >-
          הנחתם שהבור הוא פרבולה עם אותו עומק, $\tfrac12ka^2 = U_0$. אבל העומק והרוחב של הבור לא קובעים את
          העקמומיות בתחתית: רק $U''(a)$ קובע.
        misconception: MC-5-frequency-from-depth
      - value: 54.8
        feedback: 'שכחתם את התרומה של $-2(x/a)^2$ לנגזרת השנייה, $-4U_0/a^2$. בלעדיה מקבלים $12U_0/a^2$ במקום $8U_0/a^2$.'
      - value: 2000
        feedback: 'זה $U''''(a)/m = \omega_0^2$, ביחידות $\text{s}^{-2}$. הוציאו שורש.'
    hints:
      - 'במינימום $U''(a) = 0$, ו-$U''''(a)$ משחק את התפקיד של $k$.'

  - id: Q-5.2-transverse-springs
    type: numeric
    objectives: [OBJ-5.2-2]
    level: bagrut
    prompt: >-
      חרוז בעל מסה $m = 0.10\,\text{kg}$ מונח על שולחן אופקי בלי חיכוך, ומחובר בארבעה קפיצים זהים לארבעה קירות: שני
      קפיצים לאורך ציר $x$, אחד מכל צד של החרוז, ושני קפיצים לאורך ציר $y$, אחד מכל צד. בשיווי המשקל החרוז בראשית,
      כל קפיץ מתוח לאורך $L = 0.25\,\text{m}$, והמתיחות בכל קפיץ $T_0 = 5.0\,\text{N}$. קבוע הקפיץ של כל קפיץ
      $k = 40\,\text{N/m}$. מזיזים את החרוז מעט לאורך ציר $x$, למרחק $x_0 \ll L$, ומשחררים ממנוחה. מה התדירות
      הזוויתית $\omega_0$ של התנודות הקטנות?
    answer: 34.6
    unit: rad/s
    correctFeedback: >-
      נכון. ציר $x$ חיובי ימינה, והחרוז ב-$x$. **הקפיצים שלאורך $x$:** אחד מתארך ב-$x$ והשני מתקצר ב-$x$, והשינוי בכוח
      של כל אחד הוא $-kx$; יחד $-2kx$ (המתיחות $T_0$ שלהם מתבטלת, כמו בשיווי המשקל). **הקפיצים שלאורך $y$:** האורך
      שלהם $\sqrt{L^2 + x^2} \approx L + \dfrac{x^2}{2L}$ משתנה רק בסדר שני, ולכן המתיחות נשארת $T_0$, אבל היא כבר לא
      ניצבת לציר $x$: הרכיב שלה לאורך $x$ הוא $-T_0x/L$ לכל קפיץ. ה"קבועים" מתחברים:
      $$\begin{aligned} m\ddot x &= -\left(2k + \frac{2T_0}{L}\right)x \\ \omega_0 &= \sqrt{\frac{80 + 40}{0.10}} = 34.6\,\text{rad/s} \end{aligned}$$
      **בדיקת גבולות:** כש-$T_0 \to 0$ (קפיצים רפויים בשיווי המשקל) נשארים רק הקפיצים שלאורך התנועה,
      $\omega_0 = \sqrt{2k/m}$: הקפיצים הניצבים מחזירים רק בזכות המתיחות שכבר יש בהם, ו-$k$ שלהם לא נכנס לתוצאה.
    wrongFeedback: >-
      כתבו את הכוח לאורך $x$ מכל אחד מארבעת הקפיצים, עד סדר ראשון ב-$x$. בקפיץ שלאורך ההזזה משתנה האורך; בקפיץ
      שניצב לה משתנה הכיוון. חברו את ה"קבועים".
    commonWrong:
      - value: 28.3
        feedback: >-
          זה $\sqrt{2k/m}$, רק עם שני הקפיצים שלאורך ההזזה. גם הקפיצים הניצבים מחזירים: הם מתוחים, וכשהחרוז זז המתיחות
          שלהם נוטה ומקבלת רכיב לאורך $x$, $-T_0x/L$ מכל אחד.
      - value: 40.0
        feedback: >-
          זה $\sqrt{4k/m}$: טיפלתם בקפיצים הניצבים כמו בקפיצים שלאורך ההזזה. בהזזה ניצבת קפיץ כמעט לא משנה את אורכו, והכוח
          המחזיר שלו בא מהמתיחות שכבר יש בו, $T_0/L$ לכל קפיץ, לא מ-$k$.
        misconception: MC-5-transverse-like-longitudinal
      - value: 20.0
        feedback: 'זה $\sqrt{2T_0/(mL)}$, רק התרומה של הקפיצים הניצבים. שני הקפיצים שלאורך ציר $x$ מתארך ומתקצר ב-$x$, ותורמים יחד $2k$.'
      - value: 24.5
        feedback: 'זה $\sqrt{(k + T_0/L)/m}$: ספרתם קפיץ אחד מכל זוג. בכל זוג שני הקפיצים מחזירים, אחד מושך ואחד דוחף (או מושך פחות).'
    hints:
      - 'פרקו את הכוח לשתי תרומות: הקפיצים שלאורך ההזזה, והקפיצים שניצבים לה. מה משתנה בכל אחד בסדר ראשון ב-$x$: האורך או הכיוון?'
      - 'לקפיץ ניצב, הכוח לאורך $x$ הוא המתיחות כפול $\sin\alpha \approx x/L$. האם המתיחות משתנה בסדר ראשון ב-$x$?'

  - id: Q-5.2-lennard-jones
    type: numeric
    objectives: [OBJ-5.2-2]
    level: bagrut
    prompt: >-
      במודל של מולקולה דו-אטומית, האנרגיה הפוטנציאלית כפונקציה של המרחק $r$ בין שני האטומים היא פוטנציאל לנרד-ג׳ונס
      $$U(r) = \varepsilon\left[\left(\frac{r_0}{r}\right)^{12} - 2\left(\frac{r_0}{r}\right)^{6}\right]$$
      עם $\varepsilon = 1.0\cdot10^{-20}\,\text{J}$ ו-$r_0 = 1.2\cdot10^{-10}\,\text{m}$. המסה של כל אטום
      $3.0\cdot10^{-26}\,\text{kg}$, והמרחק ביניהם מקיים $\mu\ddot r = -dU/dr$ עם $\mu = m/2$ (המסה המצומצמת של שני
      אטומים זהים). מה התדירות הזוויתית של תנודות קטנות של המולקולה?
    answer: 5.77e13
    unit: rad/s
    correctFeedback: >-
      נכון. $U'(r) = \dfrac{\varepsilon}{r}\left[-12\left(\dfrac{r_0}{r}\right)^{12} + 12\left(\dfrac{r_0}{r}\right)^{6}\right]$
      מתאפס ב-$r = r_0$, וגזירה נוספת שם נותנת $U''(r_0) = \dfrac{\varepsilon}{r_0^2}(156 - 84) = \dfrac{72\varepsilon}{r_0^2} = 50\,\text{N/m}$.
      לכן
      $$\omega_0 = \sqrt{\frac{72\varepsilon}{\mu r_0^2}} = \sqrt{\frac{50}{1.5\cdot10^{-26}}} = 5.77\cdot10^{13}\,\text{rad/s}$$
      **בדיקת יחידות:** $\varepsilon/r_0^2$ ביחידות $\text{J/m}^2 = \text{N/m}$, כמו קבוע קפיץ. "קפיץ" של $50\,\text{N/m}$
      בין שני אטומים, ותדירות בתחום האינפרה-אדום.
    wrongFeedback: >-
      גזרו את $U$ פעמיים (כל איבר הוא חזקה של $r$), הציבו $r = r_0$, וחלקו ב-$\mu$, לא ב-$m$.
    commonWrong:
      - value: 4.08e13
        feedback: 'חילקתם במסה של אטום אחד. המרחק בין האטומים משתנה כששניהם זזים, ולכן המסה האפקטיבית היא $\mu = m/2$.'
      - value: 1.05e14
        feedback: 'קיבלתם $240\varepsilon/r_0^2$: האיבר המושך תורם לנגזרת השנייה $-84\varepsilon/r_0^2$, לא $+84$. בדקו את הסימן.'
      - value: 8.50e13
        feedback: 'השתמשתם רק באיבר הדוחה, $156\varepsilon/r_0^2$. גם האיבר המושך, $-2(r_0/r)^6$, תורם לעקמומיות.'
      - value: 9.62e12
        feedback: >-
          הנחתם פרבולה בעומק $\varepsilon$ וברוחב $r_0$, $\tfrac12kr_0^2 = \varepsilon$. העקמומיות בתחתית הבור לא
          נקבעת מהעומק: את $k$ נותנת רק הנגזרת השנייה.
        misconception: MC-5-frequency-from-depth
    hints:
      - 'הנגזרת השנייה של $r^{-n}$ היא $n(n + 1)r^{-n-2}$.'

# Lesson 5.5 question bank: the comprehension ladder of "מתנדים מצומדים ואופני תנודה" (enrichment: its place in
# 77101 is unverified). Every objective has ≥ 3 questions, one of them qualitative; basic → mid → bagrut (exam level).
# The system throughout: two masses m on a frictionless line, an outer spring k from each wall to its mass, and a
# coupling spring k_c between the masses; x1, x2 measured from equilibrium. Modes: in phase (1, 1) with ω1² = k/m,
# opposite (1, −1) with ω2² = (k + 2k_c)/m.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every question stands alone (the chapter test draws at random): each prompt describes its own system.
# Every number was computed in .scratch/ch5/q.ts and recomputed against src/physics/coupled.ts in
# .scratch/ch5/5-5/numbers.ts (lesson 5.5, 2026-11-11; every key confirmed):
#   m = 0.50 kg, k = 50 N/m, k_c = 12 N/m: ω1 = 10.0, ω2 = √148 = 12.2 rad/s
#     (√((k + k_c)/m) = 11.1, √(2k_c/m) = 6.93, √((2k + k_c)/m) = 15.0);
#   three equal springs: ω2/ω1 = √3 = 1.73 (√2 = 1.41, 3, 1 + √2 = 2.41);
#   wall–k–m–k–m (free end), k/m = 100 s⁻²: ω² = (k/m)(3 ∓ √5)/2, ω_low = 6.18, ω_high = 16.2 rad/s
#     (√(k/m) = 10, √(k/(2m)) = 7.07, 10·(3 − √5)/2 = 3.82);
#   k_c = 2.0 N/m (weak): ω2 = √108 = 10.39 rad/s, Δω = 0.392 rad/s, full transfer at π/Δω = 8.01 s
#     (2π/Δω = 16.0, π/(2Δω) = 4.00; approximation Δω ≈ k_c/(mω0) = 0.40 gives 7.85 s, inside tolerance);
#   unequal outer springs k1 = 3k, k2 = k, k_c = k, k/m = 25 s⁻²: (4 − λ)(2 − λ) = 1, λ = 3 ∓ √2,
#     ω_low = 6.30, ω_high = 10.5 rad/s (k_c dropped from the diagonal 3.83; 5·λ 7.93; √(k/m) 5.00; √((k2 + k_c)/m) 7.07).
# Review 2026-11-11 (.scratch/review/ch5/l55.ts, own closed forms, no import of coupled.ts): every key and
# commonWrong recomputed and confirmed; Q-5.5-unequal-springs added (mid rung between the identical-body questions
# and Q-5.5-free-end, after the student read); ω0 = √(k/m) is the chapter's natural frequency of one body alone.

chapter: 5
questions:
  # ---------------------------------------------------------------- OBJ-5.5-1 normal modes and their frequencies
  - id: Q-5.5-in-phase-mode
    type: mc
    objectives: [OBJ-5.5-1]
    qualitative: true
    level: basic
    prompt: >-
      שני גופים בעלי מסה $m$ על משטח בלי חיכוך. קפיץ $k$ מחבר כל גוף לקיר שלידו, וקפיץ צימוד $k_c$ מחבר את שני הגופים.
      באחד מאופני התנודה שני הגופים נעים יחד, $x_1(t) = x_2(t)$. מה התדירות של האופן הזה?
    choices:
      - text: '$\sqrt{k/m}$: קפיץ הצימוד לא נמתח בכלל.'
        correct: true
        feedback: >-
          נכון. כש-$x_1 = x_2$ המרחק בין הגופים לא משתנה, ולכן קפיץ הצימוד שומר על אורכו ולא מפעיל כוח. כל גוף מרגיש רק
          את הקפיץ החיצוני שלו, $m\ddot x_1 = -kx_1$.
      - text: '$\sqrt{(k + k_c)/m}$'
        feedback: >-
          $k + k_c$ היה מתקבל אילו הגוף השני עמד במקום וקפיץ הצימוד נמתח ב-$x_1$. אבל באופן הזה הגוף השני זז יחד עם
          הראשון, והצימוד לא נמתח.
      - text: '$\sqrt{(k + 2k_c)/m}$'
        feedback: 'זו התדירות של האופן **השני**, שבו הגופים נעים בכיוונים הפוכים וקפיץ הצימוד נמתח ונלחץ פי 2.'
      - text: 'אין תדירות אחת: כל גוף מתנודד בתדירות משלו.'
        feedback: >-
          באופן תנודה כל חלקי המערכת מתנודדים **באותה** תדירות ובפאזה קבועה זה ביחס לזה. זו ההגדרה של אופן תנודה, וכאן
          שני הגופים זהים, ולכן גם הסימטריה מחייבת זאת.
        misconception: MC-5-modes-each-mass-own-frequency
    hints:
      - 'כש-$x_1 = x_2$, בכמה נמתח קפיץ הצימוד?'

  - id: Q-5.5-opposite-frequency
    type: numeric
    objectives: [OBJ-5.5-1]
    level: basic
    prompt: >-
      שני גופים בעלי מסה $m = 0.50\,\text{kg}$ על משטח בלי חיכוך. קפיץ $k = 50\,\text{N/m}$ מחבר כל גוף לקיר שלידו, וקפיץ
      צימוד $k_c = 12\,\text{N/m}$ מחבר את שני הגופים; $x_1$ ו-$x_2$ הם ההעתקים מנקודות שיווי המשקל. מה התדירות הזוויתית
      של האופן שבו הגופים נעים בכיוונים הפוכים, $x_2 = -x_1$?
    answer: 12.2
    unit: rad/s
    correctFeedback: >-
      נכון. כש-$x_2 = -x_1$, קפיץ הצימוד מתארך ב-$x_1 - x_2 = 2x_1$, ולכן $m\ddot x_1 = -kx_1 - k_c\cdot2x_1$. לכן
      $\omega_2 =\sqrt{\dfrac{k + 2k_c}{m}} = \sqrt{\dfrac{74}{0.50}} = 12.2\,\text{rad/s}$. האופן הזה מהיר מהאופן שבו
      הגופים נעים יחד ($10.0\,\text{rad/s}$), כי בו גם הצימוד מושך בחזרה.
    wrongFeedback: 'כתבו את החוק השני לגוף 1 כש-$x_2 = -x_1$. בכמה מתארך קפיץ הצימוד?'
    commonWrong:
      - value: 11.1
        feedback: 'זה $\sqrt{(k + k_c)/m}$. קפיץ הצימוד מתארך ב-$x_1 - x_2$, וכשהגופים נעים הפוך זה $2x_1$, לא $x_1$.'
        misconception: MC-5-coupling-spring-single-stretch
      - value: 6.93
        feedback: 'זה $\sqrt{2k_c/m}$, בלי הקפיצים החיצוניים. גם הם מושכים כל גוף בחזרה, ב-$-kx_1$.'
      - value: 15.0
        feedback: 'זה $\sqrt{(2k + k_c)/m}$: החלפתם את התפקידים. על כל גוף פועל קפיץ חיצוני **אחד**, והצימוד הוא שנמתח פי 2.'
    hints:
      - 'ההתארכות של קפיץ הצימוד היא $x_1 - x_2$.'

  - id: Q-5.5-mode-shape
    type: twotier
    objectives: [OBJ-5.5-1]
    qualitative: true
    level: mid
    prompt: >-
      שני גופים בעלי מסה $m$ על משטח בלי חיכוך. קפיץ $k$ מחבר כל גוף לקיר שלידו, וקפיץ צימוד $k_c$ מחבר את שני הגופים.
      מחפשים אופני תנודה בניחוש $x_1 = a_1\cos\omega t$, $x_2 = a_2\cos\omega t$. משוואות התנועה הן
      $$\begin{aligned} m\ddot x_1 &= -kx_1 + k_c(x_2 - x_1) \\ m\ddot x_2 &= -kx_2 - k_c(x_2 - x_1) \end{aligned}$$
      באופן בעל התדירות הגבוהה, $\omega_2^2 = (k + 2k_c)/m$, מה היחס $a_2/a_1$?
    choices:
      - text: '$a_2/a_1 = -1$'
        correct: true
        feedback: 'נכון. הגופים נעים באותה אמפליטודה ובכיוונים הפוכים, סימטרית סביב האמצע.'
      - text: '$a_2/a_1 = +1$'
        feedback: 'יחס $+1$ שייך לאופן בעל התדירות הנמוכה, $\omega_1^2 = k/m$, שבו קפיץ הצימוד לא נמתח.'
      - text: 'היחס תלוי בתנאי ההתחלה.'
        feedback: >-
          תנאי ההתחלה קובעים **כמה** מכל אופן יש בתנועה, לא את הצורה של האופן. הצורה, כמו התדירות, נקבעת מהמערכת
          עצמה: מהמשוואה האלגברית ל-$a_1$ ול-$a_2$.
        misconception: MC-5-modes-each-mass-own-frequency
    reasons:
      - text: 'מהמשוואה הראשונה, $\left(k + k_c - m\omega^2\right)a_1 = k_ca_2$. ב-$m\omega_2^2 = k + 2k_c$ אגף שמאל $-k_ca_1$, ולכן $a_2 = -a_1$.'
        correct: true
        feedback: >-
          זה הנימוק. הצבת הניחוש הופכת את משוואות התנועה למערכת ליניארית ב-$a_1$, $a_2$. יש לה פתרון שבו $a_1$ ו-$a_2$ לא שניהם אפס רק
          כשהדטרמיננטה מתאפסת, $\left(k + k_c - m\omega^2\right)^2 = k_c^2$, וזה נותן את שתי התדירויות. הצבה של כל אחת מחזירה את
          היחס.
      - text: 'הגוף הראשון דוחף את השני דרך הקפיץ, ולכן השני תמיד נע לכיוון ההפוך.'
        feedback: 'אילו זה היה נכון, לא היה אופן שבו הם נעים יחד. יש כזה, ב-$\omega_1 = \sqrt{k/m}$. הכיוון היחסי נקבע מהתדירות של האופן.'
      - text: 'בתדירות גבוהה יותר הגופים נעים מהר יותר, ולכן הם מתרחקים זה מזה.'
        feedback: 'התדירות לא קובעת את הכיוון היחסי ישירות. היחס בא מהצבת $\omega_2$ במשוואות, וזה מה שצריך לעשות.'
    hints:
      - 'הציבו את הניחוש במשוואה הראשונה. $\ddot x_1 = -\omega^2x_1$.'

  - id: Q-5.5-equal-springs
    type: numeric
    objectives: [OBJ-5.5-1]
    level: mid
    prompt: >-
      שני גופים בעלי מסה $m$ על משטח בלי חיכוך. קפיץ $k$ מחבר כל גוף לקיר שלידו, וקפיץ צימוד מחבר את שני הגופים,
      ושלושת הקפיצים זהים: $k_c = k$. מה היחס $\omega_2/\omega_1$ בין התדירות של האופן שבו הגופים נעים בכיוונים הפוכים
      לתדירות של האופן שבו הם נעים יחד?
    answer: 1.73
    unit: ''
    correctFeedback: >-
      נכון. $\omega_1^2 = k/m$ ו-$\omega_2^2 = (k + 2k)/m = 3k/m$, ולכן $\omega_2/\omega_1 = \sqrt3 = 1.73$. היחס לא תלוי
      ב-$k$ ולא ב-$m$, רק ביחס בין הקפיצים: $\omega_2/\omega_1 = \sqrt{1 + 2k_c/k}$.
    wrongFeedback: 'כתבו את שתי התדירויות כש-$k_c = k$, וחלקו.'
    commonWrong:
      - value: 1.41
        feedback: 'זה $\sqrt2$, מ-$\omega_2^2 = (k + k_c)/m$. באופן ההפוך קפיץ הצימוד מתארך פי 2, ולכן $\omega_2^2 = (k + 2k_c)/m$.'
        misconception: MC-5-coupling-spring-single-stretch
      - value: 3
        feedback: 'זה היחס בין **ריבועי** התדירויות. הוציאו שורש.'
      - value: 2.41
        feedback: 'השתמשתם ב-$\omega_2 = \omega_1 + \sqrt{2k_c/m}$, וחיברתם תדירויות. מה שמתחבר הם קבועי הקפיצים, $k + 2k_c$, ואיתם ריבועי התדירויות, לא התדירויות עצמן.'
    hints:
      - 'מה $\omega_2^2/\omega_1^2$?'

  - id: Q-5.5-unequal-springs
    type: numeric
    objectives: [OBJ-5.5-1]
    level: mid
    prompt: >-
      שני גופים בעלי מסה $m$ על משטח בלי חיכוך. גוף 1 קשור לקיר השמאלי בקפיץ $3k$, גוף 2 קשור לקיר הימני בקפיץ $k$,
      וקפיץ צימוד $k_c = k$ מחבר ביניהם; $k/m = 25\,\text{s}^{-2}$. בציר $x$ ימינה, עם ההעתקים מנקודות שיווי המשקל,
      משוואות התנועה הן
      $$\begin{aligned} m\ddot x_1 &= -3kx_1 + k\left(x_2 - x_1\right) \\ m\ddot x_2 &= -kx_2 - k\left(x_2 - x_1\right) \end{aligned}$$
      מה התדירות הזוויתית הנמוכה מבין שני אופני התנודה?
    answer: 6.30
    unit: rad/s
    correctFeedback: >-
      נכון. הניחוש $x_j = a_j\cos\omega t$ עם $\lambda = m\omega^2/k$ נותן $(4 - \lambda)a_1 - a_2 = 0$ ו-$-a_1 + (2 - \lambda)a_2 = 0$.
      הדטרמיננטה מתאפסת כש-$(4 - \lambda)(2 - \lambda) = 1$, כלומר $\lambda^2 - 6\lambda + 7 = 0$ ו-$\lambda = 3 \mp \sqrt2$:
      $$\omega_{\text{low}} = 5\sqrt{1.586} = 6.30\,\text{rad/s}$$
      והגבוהה $10.5\,\text{rad/s}$. באופן הנמוך $a_2/a_1 = 4 - \lambda = 2.41$: שני הגופים נעים יחד, והגוף שעל הקפיץ הרך נע
      יותר. **בדיקה:** $\lambda_1 + \lambda_2 = 6$, ואכן $(k_1 + k_c)/m + (k_2 + k_c)/m = 4k/m + 2k/m$.
    wrongFeedback: >-
      הציבו $x_1 = a_1\cos\omega t$ ו-$x_2 = a_2\cos\omega t$ בשתי המשוואות, העבירו הכול לאגף אחד ודרשו שהדטרמיננטה תתאפס.
    commonWrong:
      - value: 3.83
        feedback: >-
          זה מתקבל מ-$(3 - \lambda)(1 - \lambda) = 1$, בלי $k_c$ באיברים שעל האלכסון. קפיץ הצימוד מושך את גוף 1 גם בגלל
          ההעתק שלו עצמו: $k(x_2 - x_1)$ מכיל $-kx_1$, ולכן המקדם של $a_1$ במשוואה הראשונה הוא $3k + k - m\omega^2$.
      - value: 7.93
        feedback: 'לקחתם $5\cdot1.586$. $1.586$ הוא $\lambda = m\omega^2/k$, ולכן $\omega = 5\sqrt{1.586}$.'
      - value: 5.00
        feedback: 'זה $\sqrt{k/m}$, התדירות של גוף אחד על קפיץ $k$. כאן שני הגופים קשורים זה לזה, ותדירויות האופנים נקבעות מהדטרמיננטה.'
        misconception: MC-5-modes-each-mass-own-frequency
      - value: 7.07
        feedback: >-
          זה $\sqrt{(k_2 + k_c)/m}$, התדירות של גוף 2 כשגוף 1 מוחזק במקום. באופן תנודה שני הגופים זזים, ותדירות האופן
          לא שייכת לגוף אחד.
        misconception: MC-5-modes-each-mass-own-frequency
    hints:
      - 'סמנו $\lambda = m\omega^2/k$. מה המקדם של $a_1$ במשוואה הראשונה אחרי ההצבה?'

  - id: Q-5.5-free-end
    type: numeric
    objectives: [OBJ-5.5-1]
    level: bagrut
    prompt: >-
      מערכת אחרת: קפיץ $k$ מחבר קיר לגוף 1, קפיץ $k$ זהה מחבר את גוף 1 לגוף 2, ולגוף 2 אין קפיץ נוסף: הוא חופשי בצד
      השני. שני הגופים בעלי מסה $m$, ו-$k/m = 100\,\text{s}^{-2}$. מה התדירות הזוויתית הנמוכה מבין שני אופני התנודה?
    answer: 6.18
    unit: rad/s
    correctFeedback: >-
      נכון. $m\ddot x_1 = -kx_1 - k(x_1 - x_2)$ ו-$m\ddot x_2 = -k(x_2 - x_1)$. עם $\lambda = m\omega^2/k$, הניחוש
      $x_j = a_j\cos\omega t$ נותן $(2 - \lambda)a_1 = a_2$ ו-$(1 - \lambda)a_2 = a_1$. הדטרמיננטה מתאפסת כש-$(2 - \lambda)(1 - \lambda) = 1$,
      כלומר $\lambda^2 - 3\lambda + 1 = 0$:
      $$\begin{aligned} \lambda &= \frac{3 \mp \sqrt5}{2} \\ \omega_{\text{low}} &= 10\cdot\sqrt{0.382} = 6.18\,\text{rad/s} \end{aligned}$$
      והגבוהה $16.2\,\text{rad/s}$. באופן הנמוך $a_2/a_1 = 2 - \lambda = 1.62$: שני הגופים נעים יחד, והחופשי יותר.
      **בדיקה:** סכום שני הפתרונות של $\lambda^2 - 3\lambda + 1 = 0$ הוא 3, ולכן סכום ריבועי התדירויות $3k/m$. ואכן
      $(k_1 + k_c)/m_1 + (k_2 + k_c)/m_2 = 2k/m + k/m$, כאן עם $k_1 = k_c = k$ ו-$k_2 = 0$.
    wrongFeedback: >-
      כתבו את שתי משוואות התנועה (לגוף 2 יש רק הקפיץ האמצעי), הציבו ניחוש של אופן תנודה, ואפסו את הדטרמיננטה.
    commonWrong:
      - value: 10
        feedback: 'זה $\sqrt{k/m}$, התדירות של גוף אחד על קפיץ אחד. כאן גוף 2 "תלוי" על גוף 1, והמערכת רכה יותר באופן הנמוך.'
        misconception: MC-5-modes-each-mass-own-frequency
      - value: 7.07
        feedback: >-
          זה $\sqrt{k/(2m)}$, כאילו שני הגופים צמודים ונעים כגוף אחד על הקפיץ הראשון. אבל הקפיץ האמצעי נמתח גם הוא,
          ולכן התדירות נמוכה עוד יותר.
      - value: 3.82
        feedback: 'לקחתם $\sqrt{k/m}\cdot0.382$. $0.382$ הוא $\lambda = m\omega^2/k$, ולכן צריך להוציא ממנו שורש: $\omega = \sqrt{0.382}\cdot10$.'
    hints:
      - 'סמנו $\lambda = m\omega^2/k$ וקבלו משוואה ריבועית ב-$\lambda$.'

  # ---------------------------------------------------------------- OBJ-5.5-2 superposition of modes, beats
  - id: Q-5.5-decompose
    type: mc
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: basic
    prompt: >-
      שני גופים זהים על משטח בלי חיכוך; קפיץ $k$ מחבר כל גוף לקיר שלידו, וקפיץ צימוד $k_c$ מחבר ביניהם. מזיזים את גוף 1 למרחק $a$, מחזיקים את גוף 2
      בשיווי המשקל, ומשחררים את שניהם ממנוחה. $\omega_1$ ו-$\omega_2$ הן התדירויות של האופן המשותף והאופן ההפוך. מה
      התנועה?
    choices:
      - text: '$x_1 = \tfrac a2\left(\cos\omega_1t + \cos\omega_2t\right)$ ו-$x_2 = \tfrac a2\left(\cos\omega_1t - \cos\omega_2t\right)$'
        correct: true
        feedback: >-
          נכון. התנאי ההתחלתי $(a, 0)$ הוא סכום של שני האופנים, $\tfrac a2(1, 1) + \tfrac a2(1, -1)$, וכל אופן ממשיך
          בתדירות שלו. ב-$t = 0$: $x_1 = a$, $x_2 = 0$, ושתי המהירויות אפס.
      - text: '$x_1 = a\cos\omega_1t$ ו-$x_2 = a\cos\omega_2t$'
        feedback: >-
          כאן כל גוף מתנודד בתדירות משלו, וזה לא נכון: תדירות אחת שייכת לתנועה **משותפת** של שני הגופים, לא לגוף אחד.
          וגם תנאי ההתחלה לא מתקיים: ב-$t = 0$ מתקבל $x_2 = a$.
        misconception: MC-5-modes-each-mass-own-frequency
      - text: '$x_1 = a\cos\omega_1t$ ו-$x_2 = 0$'
        feedback: 'גוף 2 לא יכול להישאר במקום: ברגע שגוף 1 זז, קפיץ הצימוד נמתח ומושך את גוף 2.'
      - text: '$x_1 = a\left(\cos\omega_1t + \cos\omega_2t\right)$ ו-$x_2 = a\left(\cos\omega_1t - \cos\omega_2t\right)$'
        feedback: 'הצורה נכונה, אבל ב-$t = 0$ זה נותן $x_1 = 2a$. כל אופן נושא חצי מההעתק ההתחלתי.'
    hints:
      - 'כתבו את $(a, 0)$ כצירוף של $(1, 1)$ ושל $(1, -1)$.'

  - id: Q-5.5-weak-coupling
    type: twotier
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: mid
    prompt: >-
      שני גופים זהים על משטח בלי חיכוך. קפיץ $k$ מחבר כל גוף לקיר שלידו, וקפיץ צימוד חלש מאוד, $k_c \ll k$, מחבר את
      שני הגופים. מזיזים את גוף 1, משאירים את גוף 2 במקומו ומשחררים ממנוחה. מה קורה
      לאורך זמן רב?
    choices:
      - text: 'גוף 1 נרגע בהדרגה עד עצירה כמעט מלאה, בזמן שגוף 2 מתנודד יותר ויותר, ואז הכול חוזר. האנרגיה עוברת שוב ושוב בין הגופים.'
        correct: true
        feedback: 'נכון. אלה פעימות: ההעברה איטית, אבל מלאה.'
      - text: 'גוף 2 מתנודד רק מעט, כי הצימוד חלש, וכמעט כל האנרגיה נשארת בגוף 1.'
        feedback: >-
          צימוד חלש קובע כמה **מהר** האנרגיה עוברת, לא כמה ממנה עוברת. כל תנודה מעבירה מעט, אבל ההעברות מצטברות, כי שני
          הגופים מתנודדים כמעט באותה תדירות ובפאזה שמתאימה להעברה.
        misconception: MC-5-weak-coupling-small-transfer
      - text: 'האנרגיה מתחלקת מהר שווה בשווה בין הגופים, ונשארת כך.'
        feedback: 'אין ריסון ואין מנגנון שיקבע חלוקה שווה. החלוקה ממשיכה להתנדנד: כל האנרגיה בגוף 1, אחר כך כולה בגוף 2, וחוזר חלילה.'
    reasons:
      - text: 'התנועה היא סכום של שני אופנים בתדירויות קרובות, $\omega_1$ ו-$\omega_2$, וההפרש הקטן ביניהן יוצר מעטפת איטית, $\cos\tfrac{(\omega_2 - \omega_1)t}{2}$.'
        correct: true
        feedback: >-
          זה הנימוק. $x_1 = a\cos\dfrac{(\omega_2 - \omega_1)t}{2}\cos\dfrac{(\omega_1 + \omega_2)t}{2}$ ו-$x_2 = a\sin\dfrac{(\omega_2 - \omega_1)t}{2}\sin\dfrac{(\omega_1 + \omega_2)t}{2}$.
          כשהמעטפת של $x_1$ מתאפסת, המעטפת של $x_2$ מרבית. ככל שהצימוד חלש יותר, $\omega_2 - \omega_1$ קטן, וההעברה
          איטית יותר.
      - text: 'קפיץ חלש יכול להעביר רק כוח קטן, ולכן רק אנרגיה קטנה.'
        feedback: 'כוח קטן שפועל במשך זמן רב, באותה פאזה עם התנועה של גוף 2, עושה עבודה גדולה. זה אותו עיקרון כמו בתהודה: גוף 2 מאולץ בתדירות העצמית שלו.'
        misconception: MC-5-weak-coupling-small-transfer
      - text: 'האנרגיה נשמרת, ולכן היא חייבת להתחלק שווה.'
        feedback: 'שימור האנרגיה קובע את הסכום, לא את החלוקה. החלוקה בין הגופים משתנה בזמן, והסכום קבוע.'
    hints:
      - 'השתמשו בזהות $\cos(u + v) + \cos(u - v) = 2\cos u\cos v$, עם $u + v = \omega_2t$ ו-$u - v = \omega_1t$.'

  - id: Q-5.5-swap-time
    type: numeric
    objectives: [OBJ-5.5-2]
    level: mid
    prompt: >-
      שני גופים בעלי מסה $m = 0.50\,\text{kg}$ על משטח בלי חיכוך. קפיץ $k = 50\,\text{N/m}$ מחבר כל גוף לקיר שלידו, וקפיץ
      צימוד חלש $k_c = 2.0\,\text{N/m}$ מחבר ביניהם. מזיזים את גוף 1, משאירים את גוף 2 במקומו ומשחררים ממנוחה. אחרי כמה
      זמן האמפליטודה של גוף 1 יורדת לראשונה כמעט לאפס, וכמעט כל האנרגיה נמצאת בגוף 2?
    answer: 8.01
    unit: s
    correctFeedback: >-
      נכון. $\omega_1 = \sqrt{k/m} = 10.0\,\text{rad/s}$ ו-$\omega_2 = \sqrt{(k + 2k_c)/m} = 10.39\,\text{rad/s}$, ולכן $\Delta\omega = 0.392\,\text{rad/s}$.
      המעטפת של גוף 1, $\cos\dfrac{\Delta\omega\,t}{2}$, מתאפסת לראשונה כש-$\dfrac{\Delta\omega\,t}{2} = \dfrac{\pi}{2}$:
      $t = \dfrac{\pi}{\Delta\omega} = 8.01\,\text{s}$. בזמן הזה גוף 1 מבצע כ-13 תנודות שהולכות וקטנות. בקירוב של צימוד
      חלש, $\Delta\omega \approx \dfrac{k_c}{m\omega_0} = 0.40\,\text{rad/s}$ עם $\omega_0 = \sqrt{k/m}$, ו-$t \approx 7.9\,\text{s}$.
    wrongFeedback: >-
      חשבו את שתי התדירויות (ושימו לב שההפרש ביניהן קטן: שמרו מספיק ספרות), וכתבו את $x_1(t)$ כמכפלה של מעטפת איטית
      ותנודה מהירה. מתי המעטפת מתאפסת לראשונה?
    commonWrong:
      - value: 16.0
        feedback: 'זה $2\pi/\Delta\omega$, הזמן עד שהאנרגיה **חוזרת** לגוף 1. היא נמצאת כולה בגוף 2 באמצע הדרך.'
      - value: 4.00
        feedback: 'זה $\pi/(2\Delta\omega)$. המעטפת היא $\cos(\Delta\omega\,t/2)$, עם חצי ההפרש, והיא מתאפסת כשהארגומנט שלה $\pi/2$.'
    hints:
      - 'ההפרש $\omega_2 - \omega_1$ קטן מאוד. אפשר לחשב אותו מהקירוב $\sqrt{1 + \epsilon} \approx 1 + \epsilon/2$.'

  - id: Q-5.5-detuned
    type: mc
    objectives: [OBJ-5.5-2]
    qualitative: true
    level: bagrut
    prompt: >-
      שתי מטוטלות מחוברות בקפיץ חלש, אבל הן **לא** זהות: אחת ארוכה מעט מהשנייה. ההפרש בין התדירויות שלהן לבד גדול פי
      כמה מההפרש $\omega_2 - \omega_1$ שאותו קפיץ היה יוצר בין שתי מטוטלות זהות. מסיטים רק את הראשונה ומשחררים ממנוחה. מה
      נכון?
    choices:
      - text: 'ההעברה לא מלאה: הראשונה אף פעם לא נעצרת לגמרי, ורק חלק קטן מהאנרגיה עובר לשנייה.'
        correct: true
        feedback: >-
          נכון. במתנדים זהים אופני התנודה הם $(1, 1)$ ו-$(1, -1)$, ולכן התנאי $(a, 0)$ מעורר את שניהם בשווה, והם מבטלים זה
          את זה בגוף 1 כשהמעטפת מתאפסת. כשהמתנדים שונים מאוד ביחס לצימוד, כל אופן מרוכז בעיקר במטוטלת אחת. תנאי
          ההתחלה מעורר בעיקר את האופן של הראשונה, והביטול בגוף 1 לא מלא. זה כמו מתנד שמאולץ רחוק מהתהודה שלו.
      - text: 'ההעברה מלאה כמו במטוטלות זהות, רק בזמן אחר.'
        feedback: >-
          העברה מלאה דורשת שהתרומות של שני האופנים לתנועה של מטוטלת 1 יהיו שוות בגודלן, כדי שיוכלו להתבטל. זה קורה
          רק כשהמטוטלות זהות, ואז האופנים סימטריים.
      - text: 'אין העברה בכלל: מטוטלות בתדירויות שונות לא מעבירות אנרגיה.'
        feedback: 'קפיץ הצימוד מעביר כוח, ולכן גם אנרגיה, בכל מקרה. כשהתדירויות רחוקות זו מזו ההעברה **חלקית** וחוזרת אחורה מהר, אבל היא לא אפס.'
      - text: 'האנרגיה עוברת לשנייה ונשארת בה, כי הצימוד חלש מכדי להחזיר אותה.'
        feedback: 'בלי ריסון התנועה היא סכום של שני אופנים בתדירויות קבועות, והיא חוזרת על עצמה. מה שעובר בכיוון אחד חוזר בכיוון השני.'
    hints:
      - 'איך נראים אופני התנודה כשהמתנדים כמעט לא מצומדים ושונים זה מזה? ממה בנוי התנאי $(a, 0)$?'

# Lesson 9.3 question bank: the comprehension ladder of "טרנספורמציות לורנץ".
# Convention in every prompt: S′ moves at +v along x relative to S, the origins coincide at t = t′ = 0,
# x′ = γ(x − vt), t′ = γ(t − vx/c²). Every objective has ≥ 3 questions, one of them qualitative.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (C_LIGHT = 3.0e8), .scratch/ch9/nums.ts:
#   event x = 9.0e8 m, t = 2.0 s, β = 0.6 (γ = 1.25): vx/c² = 1.80 s; x′ = 6.75e8 m, t′ = 0.250 s;
#   wrong x − vt = 5.40e8, (x − vt)/γ = 4.32e8, γ(x + vt) = 1.575e9; t = 2.00, γt = 2.50,
#   γ(t + vx/c²) = 4.75, t − vx/c² = 0.200; check c²t² − x² = −5 (light-s)² in both frames;
#   beacons Δx = 1.5e9 m, simultaneous in S, β = 0.6: Δt′ = −γβΔx/c = −3.75 s (wrong −3.00, −2.40);
#   A = (0, 0), B = (1.5e9 m, 3.0 s): simultaneous in β = c Δt/Δx·c = 0.600, where Δx′ = 1.2e9 m = √(−s²).
# Rechecked by the lesson author with .scratch/ch9/9-3/bank.ts (every key and commonWrong above was right; each
# commonWrong is > 3% from the answer and the others). Once lesson 9.3 was written, two exam rungs that its text
# answers were rebuilt: Q-9.3-derive-gamma now sends the pulse toward −x (the lesson sends it toward +x;
# ct′ = γ(c + v)t, ct = γ(c − v)t′, the same γ), and Q-9.3-contraction-from-lt now measures a rod at rest in S from
# S′ (the lesson does the rod at rest in S′; Δt′ = 0 ⇒ Δt = vL₀/c², Δx′ = γL₀(1 − β²) = L₀/γ; Δt = 0 gives γL₀).
# Q-9.3-same-place-same-time was added (a basic rung for OBJ-9.3-2). The lesson's own numbers (β = 0.8, the figure's
# strikes, the examples) appear in no question.
# Chapter-9 review (2026-11-12, .scratch/review/ch9/r34.ts, independent closed forms): every key and commonWrong
# right. Q-9.3-event-t now restates its event (it stands alone), Q-9.3-same-place-same-time uses a collision (a bell
# rings after it is hit), and the sim-shift feedback states the rule as the lesson does.

chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.3-1 derive and use the transformation
  - id: Q-9.3-assumptions
    type: multi
    objectives: [OBJ-9.3-1]
    qualitative: true
    level: basic
    prompt: >-
      בגזירה של טרנספורמציית לורנץ בין מערכת $S$ למערכת $S'$ שנעה ביחס אליה במהירות $v$ לאורך $x$, אילו מההנחות
      הבאות משתמשים? סמנו את כולן.
    choices:
      - text: >-
          הטרנספורמציה ליניארית ב-$x$ וב-$t$, כי המרחב והזמן אחידים, וגוף שנע במהירות קבועה במערכת אחת נע במהירות קבועה
          גם בשנייה.
        correct: true
        feedback: >-
          נכון. אילו הטרנספורמציה הייתה כוללת, למשל, $x^2$, לנקודה $x = 0$ היה מעמד מיוחד, ותנועה במהירות קבועה הייתה
          נראית מואצת במערכת השנייה.
      - text: מהירות האור היא $c$ בשתי המערכות.
        correct: true
        feedback: >-
          נכון. זו ההנחה השנייה, וממנה נקבע $\gamma$: פולס אור $x = ct$ ב-$S$ חייב לצאת $x' = ct'$ ב-$S'$.
      - text: >-
          לפי עקרון היחסות, הטרנספורמציה ההפוכה, מ-$S'$ ל-$S$, נראית אותו דבר כשמחליפים את $v$ ב-$(-v)$.
        correct: true
        feedback: >-
          נכון. $S$ נעה ביחס ל-$S'$ במהירות $(-v)$, ושתי המערכות שקולות. לכן אותו $\gamma$ מופיע בשני הכיוונים.
      - text: הזמן זהה בשתי המערכות, $t' = t$.
        feedback: >-
          זו בדיוק ההנחה שהגזירה מוותרת עליה. עם $t' = t$ מקבלים את טרנספורמציית גליליי, ובה האור נע במהירות $c - v$
          ב-$S'$, בניגוד להנחה השנייה.
        misconception: MC-9-absolute-time
      - text: יש מערכת ייחוס מועדפת, האתר, שבה האור נע במהירות $c$.
        feedback: >-
          הגזירה לא נזקקת לאתר, וההנחה הראשונה שוללת מערכת מועדפת. ניסוי מייקלסון-מורלי לא מצא אותה.

  - id: Q-9.3-event-x
    type: numeric
    objectives: [OBJ-9.3-1]
    level: basic
    prompt: >-
      מאורע קורה ב-$S$ במקום $x = 9.0\cdot10^8\,\text{m}$ (שלוש שניות אור) ובזמן $t = 2.0\,\text{s}$. מערכת $S'$ נעה
      ביחס ל-$S$ במהירות $0.6c$ לאורך $+x$, והראשיות מתלכדות ב-$t = t' = 0$. מה המקום $x'$ של המאורע ב-$S'$?
    answer: 6.75e8
    unit: m
    correctFeedback: >-
      נכון. $\gamma = 1.25$ ו-$vt = 1.8\cdot10^8\cdot2.0 = 3.6\cdot10^8\,\text{m}$, ולכן
      $x' = \gamma(x - vt) = 1.25\cdot5.4\cdot10^8 = 6.75\cdot10^8\,\text{m}$.
    wrongFeedback: 'הציבו ב-$x'' = \gamma(x - vt)$, עם $v = 0.6c$ ו-$\gamma = 1/\sqrt{1 - 0.36}$.'
    commonWrong:
      - value: 5.4e8
        feedback: >-
          זה $x - vt$, טרנספורמציית גליליי. ביחסות יש עוד גורם $\gamma = 1.25$. רק כש-$v \ll c$ הוא קרוב ל-1.
      - value: 4.32e8
        feedback: >-
          חילקתם ב-$\gamma$ במקום לכפול. בדקו בעזרת פולס אור: עם $x = ct$ צריך לצאת $x' = ct'$, וזה עובד רק עם
          $x' = \gamma(x - vt)$.
      - value: 1.575e9
        feedback: >-
          הוספתם $vt$ במקום להחסיר. $S'$ נעה לכיוון $+x$, ולכן הראשית שלה נמצאת ב-$x = vt$, ומקום ביחס אליה הוא $x - vt$.

  - id: Q-9.3-event-t
    type: numeric
    objectives: [OBJ-9.3-1]
    level: mid
    prompt: >-
      מאורע קורה ב-$S$ במקום $x = 9.0\cdot10^8\,\text{m}$ (שלוש שניות אור) ובזמן $t = 2.0\,\text{s}$. מערכת $S'$ נעה
      ביחס ל-$S$ במהירות $0.6c$ לאורך $+x$, והראשיות מתלכדות ב-$t = t' = 0$. מה הזמן $t'$ של המאורע ב-$S'$?
    answer: 0.25
    unit: s
    correctFeedback: >-
      נכון. $\dfrac{vx}{c^2} = \dfrac{0.6\cdot9.0\cdot10^8}{3.0\cdot10^8} = 1.8\,\text{s}$, ולכן
      $t' = \gamma\left(t - \dfrac{vx}{c^2}\right) = 1.25\cdot(2.0 - 1.8) = 0.25\,\text{s}$. בדיקה: $c^2t^2 - x^2$ יוצא
      מינוס 5 שניות אור בריבוע בשתי המערכות, כפי שתראו בשיעור 9.5.
    wrongFeedback: >-
      $t' = \gamma\left(t - vx/c^2\right)$. חשבו קודם את $vx/c^2$ בשניות, ורק אחר כך כפלו ב-$\gamma$.
    commonWrong:
      - value: 2.0
        feedback: >-
          זה $t' = t$, הזמן המוחלט של גליליי. בטרנספורמציית לורנץ הזמן במערכת החדשה תלוי גם במקום של המאורע.
        misconception: MC-9-absolute-time
      - value: 2.5
        feedback: >-
          חישבתם $\gamma t$ ושכחתם את האיבר $vx/c^2$. האיבר הזה הוא יחסיות הבו-זמניות: מאורעות שבו-זמניים ב-$S$ ובמקומות
          שונים מקבלים ב-$S'$ זמנים שונים.
        misconception: MC-9-simultaneity-absolute
      - value: 4.75
        feedback: 'סימן: $t'' = \gamma(t - vx/c^2)$, עם מינוס. הפלוס שייך לטרנספורמציה ההפוכה, מ-$S''$ ל-$S$.'
      - value: 0.2
        feedback: 'שכחתם לכפול ב-$\gamma = 1.25$.'
    hints:
      - 'מה היחידות של $vx/c^2$? חשבו אותו לבד.'

  - id: Q-9.3-derive-gamma
    type: mc
    objectives: [OBJ-9.3-1]
    qualitative: true
    level: bagrut
    prompt: >-
      בגזירה מניחים $x' = \gamma(x - vt)$, ולפי עקרון היחסות גם $x = \gamma(x' + vt')$, עם אותו $\gamma$. הפעם פולס האור
      יוצא מהראשית המשותפת ב-$t = t' = 0$ לכיוון $(-x)$, כלומר $x = -ct$ ב-$S$ ו-$x' = -ct'$ ב-$S'$ (עם $t, t' > 0$). אילו
      משוואות מתקבלות מהצבת הפולס בשתי המשוואות, ומה יוצא מהן ל-$\gamma$?
    choices:
      - text: >-
          $ct' = \gamma(c + v)t$ ו-$ct = \gamma(c - v)t'$, ולכן שוב $\gamma^2\left(1 - v^2/c^2\right) = 1$.
        correct: true
        feedback: >-
          נכון. הראשונה נותנת $\gamma(-ct - vt) = -ct'$, והשנייה $\gamma(-ct' + vt') = -ct$. כופלים את התוצאות, אחרי הכפלה של כל אחת ב-$(-1)$: $c^2tt' = \gamma^2(c + v)(c - v)tt'$,
          ולכן $\gamma = 1/\sqrt{1 - v^2/c^2}$, אותו $\gamma$ כמו לפולס לכיוון $+x$. טוב שכך: אילו כל כיוון היה נותן $\gamma$ אחר,
          לטרנספורמציה לא היה ערך אחד. **בדיקת גבולות:** כש-$v \to 0$, $\gamma \to 1$, גליליי.
      - text: >-
          $ct' = \gamma(c - v)t$ ו-$ct = \gamma(c + v)t'$, בדיוק כמו לפולס לכיוון $+x$, ולכן אותו $\gamma$.
        feedback: >-
          ה-$\gamma$ נכון, אבל המשוואות לא. בפולס לכיוון $(-x)$, $x - vt = -ct - vt = -(c + v)t$: הפולס והראשית של $S'$ מתרחקים
          זה מזה, והגורם הוא $c + v$. התפקידים של $c - v$ ו-$c + v$ מתחלפים, והמכפלה שלהם לא.
      - text: >-
          $ct' = \gamma(c + v)t$, ועם $t' = t$ יוצא $\gamma = 1/(1 + v/c)$, שונה מה-$\gamma$ של פולס לכיוון $+x$.
        feedback: >-
          אסור להניח $t' = t$: זמן הפולס בכל מערכת הוא נעלם בפני עצמו, ולכן צריך את שתי המשוואות. עם $t' = t$ גם כל פולס
          היה נותן $\gamma$ אחר, וזו סתירה.
        misconception: MC-9-absolute-time
      - text: >-
          $\gamma^2\left(1 + v^2/c^2\right) = 1$, כי בפולס לכיוון $(-x)$ הסימן של $v$ מתהפך.
        feedback: >-
          בכפל מופיע $(c + v)(c - v) = c^2 - v^2$, לא $c^2 + v^2$. עם פלוס היה יוצא $\gamma < 1$, ושעונים נעים היו ממהרים, בניגוד
          לשעון האור.
    hints:
      - 'הציבו $x = -ct$ ו-$x'' = -ct''$ בשתי המשוואות, שימו לב לסימנים, וכפלו את שתיהן אחת בשנייה.'

  # ---------------------------------------------------------------- OBJ-9.3-2 dilation, contraction, simultaneity from it
  - id: Q-9.3-same-place-same-time
    type: mc
    objectives: [OBJ-9.3-2]
    qualitative: true
    level: basic
    prompt: >-
      במערכת $S$ שני מאורעות קורים באותו מקום ובאותו זמן: כדור A מגיע לנקודה P, וכדור B מגיע לאותה נקודה P באותו רגע,
      והם מתנגשים. מערכת $S'$ נעה ביחס ל-$S$
      במהירות $v$ לאורך $x$. האם במערכת $S'$ שני המאורעות בו-זמניים?
    choices:
      - text: >-
          כן, בכל מערכת: $\Delta x = 0$ ו-$\Delta t = 0$ נותנים $\Delta t' = \gamma\left(0 - v\cdot0/c^2\right) = 0$.
        correct: true
        feedback: >-
          נכון. יחסיות הבו-זמניות נובעת מהאיבר $v\Delta x/c^2$, והוא אפס כשהמאורעות באותו מקום. על מפגש, שני דברים באותו מקום
          ובאותו רגע, כל המערכות מסכימות. לכן "הכדורים התנגשו" הוא עובדה, לא עניין של מערכת.
      - text: לא. בו-זמניות תלויה במערכת, ולכן ב-$S'$ אחד מהם קודם.
        feedback: >-
          בו-זמניות תלויה במערכת רק בשני מאורעות **במקומות שונים**. בטרנספורמציה $\Delta t' = \gamma\left(\Delta t - v\Delta x/c^2\right)$,
          ועם $\Delta x = 0$ ו-$\Delta t = 0$ יוצא אפס בכל מהירות.
      - text: רק אם $v \ll c$. במהירות גבוהה אחד מהם קודם, בהפרש $\gamma - 1$ בערך.
        feedback: >-
          $\gamma$ כופל את כל הסוגריים, וכשהסוגריים אפס התוצאה אפס בכל $v$. אין כאן תיקון שגדל עם המהירות.
      - text: לא. ב-$S'$ שני המאורעות קורים במקום אחר, $x' = \gamma(x - vt)$, ולכן גם בזמנים שונים.
        feedback: >-
          שני המאורעות עוברים לאותו $x'$, כי יש להם אותו $x$ ואותו $t$. מקום אחר מאשר ב-$S$, אבל אותו מקום זה כמו זה, ולכן
          גם אותו $t'$.
    hints:
      - 'כתבו את $\Delta t''$ בטרנספורמציה להפרשים, והציבו $\Delta x = 0$ ו-$\Delta t = 0$.'

  - id: Q-9.3-sim-shift
    type: numeric
    objectives: [OBJ-9.3-2]
    level: mid
    prompt: >-
      שני משדרים נחים ב-$S$: משדר A ב-$x = 0$ ומשדר B ב-$x = 1.5\cdot10^9\,\text{m}$ (חמש שניות אור). הם מהבהבים
      בו-זמנית ב-$S$. מערכת $S'$ נעה ביחס ל-$S$ במהירות $0.6c$ לאורך $+x$. חשבו את $\Delta t' = t'_B - t'_A$, עם הסימן.
    answer: -3.75
    unit: s
    correctFeedback: >-
      נכון. עם $\Delta t = 0$: $\Delta t' = \gamma\left(\Delta t - \dfrac{v\Delta x}{c^2}\right) = -1.25\cdot0.6\cdot5.0\,\text{s}$,
      כלומר $\Delta t' = -3.75\,\text{s}$. ב-$S'$ משדר B מהבהב קודם: מבין שני מאורעות בו-זמניים ב-$S$, זה שנמצא רחוק יותר
      בכיוון התנועה של $S'$ (כאן B, ב-$x$ הגדול) קורה קודם ב-$S'$.
    wrongFeedback: >-
      שני המאורעות בו-זמניים ב-$S$, ולכן $\Delta t = 0$. הציבו בטרנספורמציה של $t'$ את ההפרשים, עם הסימן.
    commonWrong:
      - value: 3.75
        feedback: >-
          הגודל נכון, הסימן הפוך. $\Delta t' = \gamma\left(0 - v\Delta x/c^2\right)$ שלילי כש-$\Delta x > 0$: ב-$S'$ משדר B
          מהבהב לפני A.
      - value: -3.0
        feedback: 'שכחתם את $\gamma$: $v\Delta x/c^2 = 3.0\,\text{s}$, ו-$\Delta t''$ גדול ממנו פי $1.25$.'
      - value: -2.4
        feedback: 'חילקתם ב-$\gamma$ במקום לכפול: $\Delta t'' = \gamma(\Delta t - v\Delta x/c^2)$.'
    hints:
      - 'כתבו את טרנספורמציית לורנץ להפרשים: $\Delta t'' = \gamma\left(\Delta t - v\Delta x/c^2\right)$.'

  - id: Q-9.3-dilation-from-lt
    type: twotier
    objectives: [OBJ-9.3-2]
    qualitative: true
    level: mid
    prompt: >-
      שעון נח בראשית של $S'$ ומתקתק פעמיים, בהפרש $\Delta t'$ בשעון שלו. מה הזמן $\Delta t$ בין שני התקתוקים ב-$S$, לפי
      טרנספורמציית לורנץ?
    choices:
      - text: $\Delta t = \gamma\Delta t'$
        correct: true
        feedback: >-
          נכון. זו התארכות הזמן, והפעם היא נובעת מהטרנספורמציה, בלי שעון אור.
      - text: $\Delta t = \Delta t'/\gamma$
        feedback: >-
          כך יוצא אם מציבים $\Delta x = 0$ במשוואה של $t'$. אבל ב-$S$ השעון נע, ובין התקתוקים הוא זז $\Delta x = v\Delta t$.
        misconception: MC-9-same-place-wrong-frame
      - text: $\Delta t = \Delta t'$
        feedback: >-
          זה נכון רק בטרנספורמציית גליליי. בלורנץ $\Delta t = \gamma\left(\Delta t' + v\Delta x'/c^2\right)$, והגורם
          $\gamma$ נשאר גם כש-$\Delta x' = 0$.
        misconception: MC-9-absolute-time
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          בטרנספורמציה ההפוכה, $\Delta t = \gamma\left(\Delta t' + v\Delta x'/c^2\right)$, שני התקתוקים באותו מקום ב-$S'$, כלומר $\Delta x' = 0$.
        correct: true
        feedback: >-
          זה הנימוק. אפשר גם בדרך השנייה: $\Delta t' = \gamma\left(\Delta t - v\Delta x/c^2\right)$ עם $\Delta x = v\Delta t$
          נותן $\Delta t' = \gamma\Delta t\left(1 - v^2/c^2\right) = \Delta t/\gamma$, אותה תוצאה.
      - text: >-
          ב-$\Delta t' = \gamma\left(\Delta t - v\Delta x/c^2\right)$ השעון מתקתק באותו מקום, ולכן $\Delta x = 0$.
        feedback: >-
          השעון מתקתק באותו מקום רק במערכת שבה הוא נח, $S'$. ב-$S$ הוא זז בין התקתוקים, ו-$\Delta x = v\Delta t \neq 0$.
        misconception: MC-9-same-place-wrong-frame
      - text: השעונים של $S$ הם שמפגרים, כי $S$ נעה ביחס ל-$S'$.
        feedback: >-
          בעיני $S'$, שעוני $S$ אכן מפגרים, וזה סימטרי. אבל השאלה משווה שעון **אחד** של $S'$ לשעונים של $S$, ובהשוואה
          הזו השעון הבודד מודד את הזמן העצמי.
        misconception: MC-9-dilation-asymmetric
    hints:
      - 'באיזו מערכת שני התקתוקים קורים באותו מקום? כתבו את הטרנספורמציה שבה ההפרש במקום הזה מופיע.'

  - id: Q-9.3-contraction-from-lt
    type: mc
    objectives: [OBJ-9.3-2]
    qualitative: true
    level: bagrut
    prompt: >-
      הפעם המוט נח ב-$S$, בין $x = 0$ ל-$x = L_0$, ורוצים את האורך שלו במערכת $S'$, שבה הוא נע במהירות $(-v)$. משתמשים
      בטרנספורמציה הישירה, $x' = \gamma(x - vt)$ ו-$t' = \gamma\left(t - vx/c^2\right)$. איך מקבלים ממנה את האורך ב-$S'$, ומה יוצא?
    choices:
      - text: >-
          מסמנים את הקצוות באותו רגע של $S'$, $\Delta t' = 0$. ממשוואת $t'$ יוצא $\Delta t = v\Delta x/c^2 = vL_0/c^2$, ואז
          $\Delta x' = \gamma\left(L_0 - v^2L_0/c^2\right) = L_0/\gamma$.
        correct: true
        feedback: >-
          נכון. האורך ב-$S'$ הוא המרחק בין הקצוות באותו רגע **של $S'$**. שני הסימונים האלה אינם בו-זמניים ב-$S$: הקצה ב-$x = L_0$
          מסומן $vL_0/c^2$ אחרי הקצה ב-$x = 0$, ולכן צריך להציב את ה-$\Delta t$ הזה, לא אפס. **בדיקת גבולות:** כש-$v \to 0$,
          $\Delta x' \to L_0$; כש-$v \to c$, $\Delta x' \to 0$. ומה שיצא, $L_0/\gamma$, הוא אותה התקצרות כמו למוט שנח ב-$S'$: המצב סימטרי.
      - text: >-
          מסמנים את הקצוות באותו רגע של $S$, $\Delta t = 0$. אז $\Delta x' = \gamma(L_0 - 0) = \gamma L_0$: המוט ארוך יותר ב-$S'$.
        feedback: >-
          $\Delta t = 0$ פירושו בו-זמני ב-$S$, אבל ב-$S'$ שני הסימונים האלה קורים בזמנים שונים, $\Delta t' = -\gamma vL_0/c^2$, ובינתיים
          המוט זז ב-$S'$. המרחק $\gamma L_0$ בין שני המאורעות האלה הוא לא האורך של המוט ב-$S'$.
        misconception: MC-9-ends-not-simultaneous
      - text: >-
          $\Delta x' = L_0$: המוט נח ב-$S$, ולכן שום דבר במערכת אחרת לא משנה את האורך שלו.
        feedback: >-
          האורך העצמי, $L_0$, נמדד במערכת שבה המוט נח. בכל מערכת שבה הוא נע, מדידה בו-זמנית של שני הקצוות נותנת פחות. נסו
          להציב $\Delta t' = 0$ ולראות מה יוצא.
      - text: >-
          $\Delta x' = \gamma L_0$, כי ב-$S'$ המוט נע, ומוט שנע מתארך פי $\gamma$, כמו הזמן.
        feedback: >-
          הזמן העצמי הוא הקצר ביותר והאורך העצמי הוא **הארוך** ביותר. שתי ההשפעות נובעות מאותה טרנספורמציה, אבל בכיוונים
          הפוכים.
        misconception: MC-9-moving-rod-longer
    hints:
      - 'אורך ב-$S''$ פירושו $\Delta t'' = 0$. מה זה נותן ל-$\Delta t$, לפי משוואת $t''$?'

  - id: Q-9.3-simultaneous-frame
    type: numeric
    objectives: [OBJ-9.3-1, OBJ-9.3-2]
    level: bagrut
    prompt: >-
      ב-$S$ מאורע A קורה ב-$x = 0$, $t = 0$, ומאורע B ב-$x = 1.5\cdot10^9\,\text{m}$, $t = 3.0\,\text{s}$. באיזו מהירות
      $v$ לאורך $+x$ צריכה לנוע מערכת $S'$ כדי ששני המאורעות יהיו בה בו-זמניים? ענו ביחידות של $c$.
    answer: 0.6
    unit: c
    correctFeedback: >-
      נכון. $\Delta t' = \gamma\left(\Delta t - v\Delta x/c^2\right) = 0$ נותן
      $\dfrac{v}{c} = \dfrac{c\Delta t}{\Delta x} = \dfrac{9.0\cdot10^8}{1.5\cdot10^9} = 0.6$. במערכת הזו
      $\Delta x' = \gamma(\Delta x - v\Delta t) = 1.25\cdot9.6\cdot10^8 = 1.2\cdot10^9\,\text{m}$, והוא שווה ל-$\sqrt{\Delta x^2 - c^2\Delta t^2}$,
      כפי שתראו בשיעור 9.5. **בדיקת גבולות:** כש-$\Delta t \to 0$ גם $v \to 0$: מאורעות שכבר בו-זמניים לא צריכים
      מערכת אחרת. וכש-$c\Delta t$ גדל עד $\Delta x$, $v \to c$: אין מערכת כזו לשני מאורעות שאור יכול לקשר ביניהם.
    wrongFeedback: >-
      בו-זמניים ב-$S'$ פירושו $\Delta t' = 0$. הציבו בטרנספורמציה של הזמן ובודדו את $v$.
    commonWrong:
      - value: 1.67
        feedback: >-
          חישבתם $\Delta x/(c\Delta t)$, המהירות של מערכת שבה שני המאורעות קורים **באותו מקום**, $\Delta x' = 0$. התוצאה גדולה
          מ-$c$, ולכן אין מערכת כזו לזוג הזה. מה שהשאלה מבקשת הוא $\Delta t' = 0$.
        misconception: MC-9-any-pair-same-place
    hints:
      - 'הציבו $\Delta t'' = 0$ בטרנספורמציה. $\gamma$ מצטמצם.'

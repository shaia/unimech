chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.2-1 time dilation and proper time
  - id: Q-9.2-light-clock-path
    type: mc
    objectives: [OBJ-9.2-1]
    qualitative: true
    level: basic
    prompt: >-
      שעון אור הוא שתי מראות מקבילות במרחק $L$ זו מזו, ופולס אור שקופץ ביניהן. כל הלוך-חזור הוא תקתוק אחד. השעון נע
      ימינה במהירות $v$, והמראות אופקיות, כך שבמערכת של השעון האור נע אנכית. מה קורה לתקתוק במערכת שבה השעון נע?
    choices:
      - text: >-
          האור נע באלכסון, דרך ארוכה יותר מ-$2L$, באותה מהירות $c$. לכן התקתוק ארוך יותר מ-$2L/c$.
        correct: true
        feedback: >-
          נכון. בזמן שהאור עולה, המראה העליונה זזה ימינה, ולכן האור עובר צלע של משולש:
          $\left(c\Delta t/2\right)^2 = L^2 + \left(v\Delta t/2\right)^2$. מכאן $\Delta t = \gamma\cdot2L/c$, עם גורם לורנץ
          $\gamma = 1/\sqrt{1 - v^2/c^2}$, שתמיד גדול מ-1.
      - text: >-
          האור נע באלכסון, אבל גם מהר יותר, כי למהירות שלו נוסף רכיב אופקי $v$. לכן התקתוק לא משתנה.
        feedback: >-
          זה היה נכון לכדור שקופץ בין המראות. לאור, לפי ההנחה השנייה, המהירות בכל מערכת היא $c$, גם כשהדרך באלכסון.
          דרך ארוכה יותר באותה מהירות נותנת זמן ארוך יותר.
        misconception: MC-9-light-speed-adds-to-source
      - text: הדרך של האור לא משתנה, אבל המנגנון של השעון מאט בגלל התנועה.
        feedback: >-
          אין מנגנון שמאט: במערכת של השעון הכול רגיל. ההבדל הוא רק בתיאור מהמערכת השנייה, שבה האור עובר דרך אלכסונית
          ארוכה יותר.
        misconception: MC-9-own-clock-slow
      - text: התקתוק קצר יותר, כי המראות מתקרבות זו לזו בתנועה.
        feedback: >-
          המרחק בין המראות ניצב לתנועה, ולכן הוא לא משתנה. התקצרות אורך יש רק לאורך כיוון התנועה.
        misconception: MC-9-contraction-all-directions
    hints:
      - 'שרטטו את המסלול של האור בזמן שהשעון זז ימינה. איזו צורה יש לו?'

  - id: Q-9.2-heartbeats
    type: numeric
    objectives: [OBJ-9.2-1]
    level: basic
    prompt: >-
      אסטרונאוטית בחללית שנעה במהירות $0.6c$ ביחס לכדור הארץ סופרת את פעימות הלב שלה, ומודדת בשעון שלה
      $10.0\,\text{min}$ בין הפעימה הראשונה שספרה לאחרונה. כמה זמן עבר בין שתי הפעימות האלה לפי מערכת הייחוס של כדור
      הארץ?
    answer: 12.5
    unit: min
    correctFeedback: >-
      נכון. שתי הפעימות קורות באותו מקום בחללית, ולכן השעון שלה מודד את הזמן העצמי, $\Delta\tau = 10.0\,\text{min}$.
      במערכת של כדור הארץ $\Delta t = \gamma\Delta\tau$, עם $\gamma = 1/\sqrt{1 - 0.36} = 1.25$, ולכן $\Delta t = 12.5\,\text{min}$.
    wrongFeedback: >-
      קבעו קודם איזה שעון נמצא בשני המאורעות. הוא מודד את הזמן העצמי, הקצר ביותר. כל מערכת אחרת מודדת $\gamma$ פעמים
      יותר.
    commonWrong:
      - value: 8.0
        feedback: >-
          חילקתם ב-$\gamma$. זה היה נכון אם כדור הארץ היה מודד את הזמן העצמי. אבל שתי הפעימות קורות באותו מקום בחללית,
          ולכן הזמן הקצר הוא של האסטרונאוטית.
        misconception: MC-9-proper-time-rest-frame
      - value: 15.6
        feedback: 'כפלתם ב-$\gamma^2 = 1.5625$. התארכות הזמן היא פי $\gamma$ אחד: $\Delta t = \gamma\Delta\tau$.'
      - value: 6.4
        feedback: 'כפלתם ב-$1 - \beta^2 = 0.64$. גורם לורנץ הוא $1/\sqrt{1 - \beta^2}$: צריך גם שורש וגם לחלק.'
    hints:
      - 'במערכת של מי שתי הפעימות קורות באותו מקום?'

  - id: Q-9.2-who-proper
    type: twotier
    objectives: [OBJ-9.2-1]
    qualitative: true
    level: mid
    prompt: >-
      רכבת חולפת במהירות גבוהה על פני רציף ארוך. על הרציף שני עמודים, 1 ו-2, ולידם שני שעונים שמסונכרנים במערכת של
      הרציף. בקצה הקדמי של הרכבת יש שעון נוסף. מאורע א: הקצה הקדמי של הרכבת חולף על פני עמוד 1. מאורע ב: הקצה הקדמי
      חולף על פני עמוד 2. איזו מדידה של הזמן בין א ל-ב היא הזמן העצמי?
    choices:
      - text: השעון שבקצה הקדמי של הרכבת.
        correct: true
        feedback: >-
          נכון. השעון הזה נמצא גם במאורע א וגם במאורע ב. במערכת של הרכבת שני המאורעות קורים באותו מקום, בקצה הקדמי,
          ולכן השעון שלה מודד את הזמן העצמי. הרציף מודד זמן ארוך פי $\gamma$.
      - text: שני השעונים שעל הרציף, כי הרציף נח.
        feedback: >-
          "נח" תלוי במערכת: במערכת של הרכבת הרציף הוא שנע. מה שקובע הוא שבמערכת של הרציף שני המאורעות קורים במקומות
          שונים, ולכן צריך שני שעונים כדי למדוד את הזמן ביניהם, ואף אחד מהם לא נמצא בשני המאורעות.
        misconception: MC-9-proper-time-rest-frame
      - text: שתי המדידות שוות, כי זה אותו זוג מאורעות.
        feedback: >-
          זה אותו זוג מאורעות, אבל הזמן ביניהם תלוי במערכת. רק האינטרוול, שתלמדו בשיעור 9.5, משותף לכל המערכות.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: הזמן העצמי נמדד בשעון אחד שנמצא בשני המאורעות, כלומר במערכת שבה הם קורים באותו מקום.
        correct: true
        feedback: זה הכלל. לפני כל חישוב של התארכות זמן שאלו את השאלה הזו, ורק אחר כך החליטו אם לכפול ב-$\gamma$.
      - text: הזמן העצמי שייך תמיד למערכת שמחוברת לקרקע.
        feedback: >-
          לקרקע אין מעמד מיוחד ביחסות הפרטית: כל המערכות האינרציאליות שקולות. גם הרכבת היא מערכת אינרציאלית, והשעון
          שלה נמצא בשני המאורעות.
        misconception: MC-9-proper-time-rest-frame
      - text: השעון שעל הרכבת מפגר, ולכן הוא מודד את הזמן הנכון.
        feedback: >-
          אין זמן "נכון" אחד: כל מערכת מודדת זמן נכון במערכת שלה. הזמן העצמי מוגדר על ידי המקום של המאורעות, לא על ידי
          השאלה איזה שעון מפגר.
    hints:
      - 'במערכת של הרכבת, איפה קורים שני המאורעות? ובמערכת של הרציף?'

  - id: Q-9.2-symmetric
    type: mc
    objectives: [OBJ-9.2-1]
    qualitative: true
    level: mid
    prompt: >-
      צופה על כדור הארץ מוצא שהשעונים בחללית שחולפת על פניו במהירות $0.8c$ מתקתקים לאט פי $5/3$ מהשעונים שלו. מה
      מוצא הצוות של החללית על השעונים של כדור הארץ?
    choices:
      - text: שהם מתקתקים לאט פי $5/3$ מהשעונים של החללית.
        correct: true
        feedback: >-
          נכון. המצב סימטרי: כל אחד נח במערכת שלו, והשני נע במהירות $0.8c$. אין סתירה, כי כל צופה משווה שעון **אחד** של
          השני לשני שעונים **שלו**, במקומות שונים, ושני השעונים שלו מסונכרנים רק בעיניו. בשיעור 9.3 תראו את זה
          מטרנספורמציות לורנץ.
      - text: שהם מתקתקים מהר פי $5/3$ מהשעונים של החללית.
        feedback: >-
          זה היה נכון אם ההאטה הייתה תכונה של "מי שבאמת נע". אבל לפי עקרון היחסות שתי המערכות שקולות, ולכן הצוות מוצא
          בדיוק מה שמוצא הצופה על כדור הארץ: השעונים שנעים ביחס אליו מפגרים.
        misconception: MC-9-dilation-asymmetric
      - text: שהם מתקתקים באותו קצב כמו השעונים של החללית, כי רק החללית נעה.
        feedback: >-
          "רק החללית נעה" נכון במערכת של כדור הארץ. במערכת של החללית, כדור הארץ נע אחורה במהירות $0.8c$, ושום ניסוי
          לא מבחין ביניהן.
        misconception: MC-9-proper-time-rest-frame
      - text: התשובה תלויה במי שהאיץ קודם כדי להגיע למהירות הזו.
        feedback: >-
          כל עוד שתי המערכות נעות במהירות קבועה זו ביחס לזו, ההיסטוריה שלהן לא משנה את מה שכל אחת מודדת עכשיו. אסימטריה
          תופיע רק כשמישהו עובר ממערכת אינרציאלית אחת לאחרת כדי לחזור ולהשוות שעונים במקום אחד, בפרדוקס התאומים של
          שיעור 9.6.

  # ---------------------------------------------------------------- OBJ-9.2-2 length contraction and muons
  - id: Q-9.2-cube
    type: mc
    objectives: [OBJ-9.2-2]
    qualitative: true
    level: basic
    prompt: >-
      קובייה שאורך הצלע העצמי שלה $1.00\,\text{m}$ נעה במהירות $0.6c$ לאורך ציר $x$, מקבילה לאחת הצלעות. מה המידות שלה
      במערכת המעבדה?
    choices:
      - text: >-
          $0.80\,\text{m}$ לאורך $x$, ו-$1.00\,\text{m}$ לאורך $y$ ולאורך $z$.
        correct: true
        feedback: >-
          נכון. $L = L_0/\gamma = 1.00/1.25 = 0.80\,\text{m}$ לאורך התנועה. המידות הניצבות לתנועה לא משתנות, ולכן הקובייה
          הופכת לתיבה שטוחה בכיוון $x$.
      - text: >-
          $0.80\,\text{m}$ בכל שלוש המידות.
        feedback: >-
          ההתקצרות היא רק לאורך התנועה. אם גם המידות הניצבות היו מתקצרות, שתי טבעות זהות שנעות זו לקראת זו היו
          מתווכחות איזו מהן עוברת בתוך השנייה, וכל אחת הייתה רואה את השנייה קטנה ממנה. עקרון היחסות פוסל את זה.
        misconception: MC-9-contraction-all-directions
      - text: >-
          $1.25\,\text{m}$ לאורך $x$, ו-$1.00\,\text{m}$ בשאר המידות.
        feedback: >-
          כפלתם ב-$\gamma$ במקום לחלק. האורך העצמי הוא הגדול ביותר, וגוף נע נמדד קצר יותר.
        misconception: MC-9-moving-rod-longer
      - text: >-
          $0.80\,\text{m}$ לאורך $x$, ו-$1.12\,\text{m}$ לאורך $y$ ולאורך $z$, כדי שהנפח יישמר.
        feedback: >-
          אין חוק שימור לנפח של גוף בין מערכות. המידות הניצבות לא משתנות, ולכן הנפח במעבדה קטן פי $\gamma$.

  - id: Q-9.2-proper-from-measured
    type: numeric
    objectives: [OBJ-9.2-2]
    level: mid
    prompt: >-
      מוט נע לאורכו במעבדה במהירות $0.6c$. במעבדה מודדים את המקומות של שני הקצוות שלו באותו רגע, לפי השעונים
      המסונכרנים של המעבדה, ומוצאים שהמרחק ביניהם $2.40\,\text{m}$. מה האורך העצמי של המוט? ענו במטרים.
    answer: 3.0
    unit: m
    correctFeedback: >-
      נכון. המוט נע במעבדה, ולכן $2.40\,\text{m}$ הוא האורך המקוצר: $L = L_0/\gamma$. האורך העצמי, במערכת שבה המוט נח,
      ארוך יותר: $L_0 = \gamma L$, עם $\gamma = 1/\sqrt{1 - 0.36} = 1.25$, ולכן $L_0 = 1.25\cdot2.40 = 3.00\,\text{m}$.
    wrongFeedback: >-
      באיזו מערכת המוט נח? שם נמדד האורך העצמי, הארוך ביותר. בכל מערכת אחרת $L = L_0/\gamma$; הפכו את הקשר.
    commonWrong:
      - value: 1.92
        feedback: >-
          חילקתם ב-$\gamma$. אבל $2.40\,\text{m}$ כבר נמדד במעבדה, שבה המוט נע: זה האורך המקוצר. האורך העצמי ארוך ממנו,
          $L_0 = \gamma L$.
        misconception: MC-9-moving-rod-longer
      - value: 3.75
        feedback: 'כפלתם ב-$\gamma^2 = 1.5625$. ההתקצרות היא פי $\gamma$ אחד: $L_0 = \gamma L$.'
      - value: 2.4
        feedback: >-
          זה האורך במעבדה, שבה המוט נע. האורך העצמי נמדד במערכת שבה המוט נח, ושם הוא ארוך פי $\gamma$.
    hints:
      - 'המרחק $2.40\,\text{m}$ נמדד במערכת שבה המוט נע או נח?'

  - id: Q-9.2-muon-range
    type: numeric
    objectives: [OBJ-9.2-1, OBJ-9.2-2]
    level: mid
    prompt: >-
      מיואונים נוצרים בגובה רב באטמוספרה כשקרינה קוסמית פוגעת באוויר, ונעים כלפי מטה עם $\gamma = 10$, כלומר במהירות
      $v = 0.995c$. זמן החיים הממוצע של מיואון במערכת שבה הוא נח הוא $\tau_\mu = 2.2\,\mu\text{s}$. איזה מרחק עובר מיואון
      כזה בזמן חיים ממוצע אחד, במערכת הייחוס של כדור הארץ? ענו בקילומטרים.
    answer: 6.57
    unit: km
    correctFeedback: >-
      נכון. זמן החיים $\tau_\mu$ נמדד בשעון של המיואון: זה זמן עצמי. במערכת של כדור הארץ השעון הזה מפגר, וזמן החיים
      הוא $\gamma\tau_\mu = 22\,\mu\text{s}$. המרחק הוא $v\gamma\tau_\mu = 2.985\cdot10^8\cdot22\cdot10^{-6} = 6.57\,\text{km}$,
      פי 10 ממה שהיה בלי התארכות זמן.
    wrongFeedback: >-
      זמן החיים $\tau_\mu$ נמדד בשעון של המיואון. מה זמן החיים במערכת של כדור הארץ, שבה השעון הזה נע? כפלו אותו
      במהירות.
    commonWrong:
      - value: 0.657
        feedback: >-
          זה $v\tau_\mu$, המרחק בלי התארכות זמן. אבל $\tau_\mu = 2.2\,\mu\text{s}$ נמדד בשעון של המיואון, ובמערכת של כדור הארץ השעון של
          המיואון מפגר פי $\gamma = 10$.
      - value: 0.0657
        feedback: >-
          חילקתם ב-$\gamma$. זה היה נכון אם כדור הארץ היה מודד את הזמן העצמי, אבל הלידה והדעיכה של אותו מיואון קורות
          במקום אחד רק במערכת של המיואון.
        misconception: MC-9-proper-time-rest-frame
    hints:
      - 'במערכת של מי הלידה והדעיכה של מיואון קורים באותו מקום?'

  - id: Q-9.2-muon-own-frame
    type: mc
    objectives: [OBJ-9.2-2]
    qualitative: true
    level: mid
    prompt: >-
      במערכת של כדור הארץ, מיואונים מגיעים לקרקע מגובה רב כי השעון שלהם מפגר. איך מסבירים את אותה עובדה, שמיואונים
      מגיעים לקרקע, במערכת הייחוס של המיואון?
    choices:
      - text: >-
          במערכת שלו המיואון נח, והוא חי בממוצע $2.2\,\mu\text{s}$ כרגיל. אבל עובי האטמוספרה, שנעה כלפיו, קצר פי $\gamma$, ולכן
          הקרקע מגיעה אליו מהר.
        correct: true
        feedback: >-
          נכון. מספר המיואונים שמגיעים לקרקע הוא עובדה ששתי המערכות מסכימות עליה. כל מערכת מסבירה אותה בדרך שלה: כדור
          הארץ בהתארכות זמן, המיואון בהתקצרות אורך.
      - text: במערכת שלו השעון של המיואון מפגר, ולכן הוא חי יותר.
        feedback: >-
          במערכת שלו המיואון נח, ושעון נח אינו מפגר. אילו המיואון היה "מרגיש" שהזמן שלו מאט, הוא היה יכול לגלות שהוא
          נע, בניגוד לעקרון היחסות.
        misconception: MC-9-own-clock-slow
      - text: >-
          במערכת שלו גם השעון שלו מפגר וגם האטמוספרה קצרה יותר, ולכן הוא מגיע לקרקע בקלות.
        feedback: >-
          זה סופר את אותה השפעה פעמיים. במערכת של המיואון יש רק התקצרות אורך. אם תפעילו גם את התארכות הזמן, תקבלו
          הרבה יותר מיואונים ממה שמודדים.
        misconception: MC-9-double-counting
      - text: אין הסבר במערכת של המיואון, כי רק במערכת של כדור הארץ היחסות חלה.
        feedback: >-
          לפי עקרון היחסות, החוקים זהים בכל מערכת אינרציאלית, גם במערכת של המיואון. התורה חייבת לתת שם את אותה
          תוצאה, והיא נותנת.

  - id: Q-9.2-muon-survive
    type: numeric
    objectives: [OBJ-9.2-2, OBJ-9.2-1]
    level: bagrut
    prompt: >-
      מיואונים נוצרים בראש האטמוספרה ונעים ישר כלפי מטה עם $\gamma = 10.0$, כלומר במהירות $v = 0.995c$. זמן החיים
      הממוצע של מיואון במערכת שבה הוא נח הוא $\tau_\mu = 2.2\,\mu\text{s}$, ומתוך הרבה מיואונים, החלק שנשאר אחרי זמן
      עצמי $\Delta\tau$ הוא $e^{-\Delta\tau/\tau_\mu}$. גלאי על פני הים מוצא ש-$21.8\%$ מהמיואונים שנוצרו מגיעים אליו. באיזה גובה, במערכת
      הייחוס של כדור הארץ, נוצרו המיואונים? פתרו במערכת אחת ובדקו במערכת השנייה. ענו בקילומטרים.
    answer: 10.0
    unit: km
    correctFeedback: >-
      נכון. מחוק הדעיכה, הזמן העצמי של הנפילה הוא $\Delta\tau = \tau_\mu\ln(1/0.218) = 2.2\cdot1.52 = 3.35\,\mu\text{s}$. במערכת
      של המיואון, האטמוספרה חולפת על פניו במהירות $v$, ולכן העובי שלה שם הוא $v\Delta\tau = 1.00\,\text{km}$. זה העובי
      המקוצר; במערכת של כדור הארץ, שבה האטמוספרה נחה, הגובה הוא $\gamma\cdot1.00 = 10.0\,\text{km}$. בדיקה במערכת של
      כדור הארץ: הנפילה נמשכת $H/v = 33.5\,\mu\text{s}$, וזמן החיים שם הוא $\gamma\tau_\mu = 22\,\mu\text{s}$, ושוב
      $e^{-33.5/22} = 0.218$. **בדיקת גבולות:** בלי יחסות, $\gamma \to 1$, מגובה כזה היה מגיע רק $2\cdot10^{-7}$ מהם.
    wrongFeedback: >-
      התחילו מחוק הדעיכה: איזה זמן עצמי נותן $e^{-\Delta\tau/\tau_\mu} = 0.218$? אחר כך שאלו באיזו מערכת המרחק שהמיואון עובר
      בזמן הזה הוא העובי המקוצר, ובאיזו הוא הגובה האמיתי של האטמוספרה.
    commonWrong:
      - value: 1.0
        feedback: >-
          זה $v\tau_\mu\ln(1/0.218)$, העובי של האטמוספרה **במערכת של המיואון**, שבה היא מקוצרת. השאלה שואלת על המערכת של
          כדור הארץ, שבה האטמוספרה נחה ואורכה העצמי ארוך פי $\gamma$. (זה גם החשבון בלי יחסות בכלל.)
      - value: 100
        feedback: >-
          הפעלתם את $\gamma$ פעמיים: גם התארכות זמן וגם התקצרות אורך, באותו חשבון. בכל מערכת יש רק אחת מהשתיים.
        misconception: MC-9-double-counting
      - value: 1.43
        feedback: >-
          כפלתם את המרחק הממוצע $\gamma v\tau_\mu = 6.57\,\text{km}$ ב-$0.218$. החלק ששורד הוא $e^{-H/(\gamma v\tau_\mu)}$, ולכן
          צריך לקחת לוגריתם: $H = \gamma v\tau_\mu\ln(1/0.218)$.
    hints:
      - 'מה הזמן העצמי $\Delta\tau$ שבו $e^{-\Delta\tau/\tau_\mu} = 0.218$? קחו $\ln$ של שני האגפים: $\Delta\tau = \tau_\mu\ln(1/0.218)$.'
      - 'במערכת של המיואון, כמה אטמוספרה עוברת על פניו בזמן הזה? ובמערכת של כדור הארץ, היא ארוכה או קצרה יותר?'

  - id: Q-9.2-clock-along
    type: numeric
    objectives: [OBJ-9.2-1, OBJ-9.2-2]
    level: bagrut
    prompt: >-
      שעון אור נע במעבדה במהירות קבועה, כשהמראות שלו עומדות זו מול זו **לאורך** כיוון התנועה. במעבדה מודדים: המרחק בין
      המראות הוא $0.60\,\text{m}$, והדרך של האור מהמראה האחורית לקדמית נמשכת פי 3 מהדרך חזרה. מה משך תקתוק אחד, הלוך
      וחזור, במערכת שבה השעון נח? ענו בננו-שניות.
    answer: 4.62
    unit: ns
    correctFeedback: >-
      נכון. במעבדה הרגליים הן $\dfrac{L}{c - v}$ ו-$\dfrac{L}{c + v}$, והיחס ביניהן $\dfrac{1 + \beta}{1 - \beta} = 3$, ולכן
      $\beta = 0.5$ ו-$\gamma = 1.155$. המרחק $0.60\,\text{m}$ נמדד במעבדה, שבה השעון נע, ולכן הוא מקוצר: האורך העצמי
      $L_0 = \gamma L = 0.693\,\text{m}$, והתקתוק העצמי $2L_0/c = 4.62\,\text{ns}$. בדיקה: במעבדה $4.00 + 1.33 = 5.33\,\text{ns} = \gamma\cdot4.62$.
      **בדיקת גבולות:** כשהיחס בין הרגליים שואף ל-1, $\beta \to 0$, והתקתוק $2L/c$.
    wrongFeedback: >-
      מהיחס בין הרגליים מצאו את $\beta$. אחר כך שאלו: המרחק $0.60\,\text{m}$ נמדד במערכת שבה השעון נע או נח?
    commonWrong:
      - value: 4.0
        feedback: >-
          חישבתם $2L/c$ עם המרחק שנמדד במעבדה. אבל שם השעון נע, והמרחק מקוצר; במערכת של השעון המראות רחוקות יותר, פי $\gamma$.
      - value: 5.33
        feedback: >-
          זה התקתוק **במעבדה**, $4.00 + 1.33\,\text{ns}$. השאלה שואלת על המערכת שבה השעון נח, ושם הוא קצר פי $\gamma$: זה הזמן העצמי.
        misconception: MC-9-proper-time-rest-frame
      - value: 3.46
        feedback: >-
          חילקתם את $0.60\,\text{m}$ ב-$\gamma$. האורך העצמי הוא הארוך ביותר, ולכן במערכת של השעון המרחק $\gamma L$, לא $L/\gamma$.
        misconception: MC-9-moving-rod-longer
    hints:
      - 'כתבו את שתי הרגליים במעבדה, $L/(c - v)$ ו-$L/(c + v)$, והשוו את היחס ביניהן ל-3.'
      - 'באיזו מערכת נמדד המרחק $0.60\,\text{m}$: זו שבה השעון נע, או זו שבה הוא נח?'

# Lesson 9.4 question bank: the comprehension ladder of "חיבור מהירויות ואפקט דופלר".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# All motion is along one line; speeds are given and answered in units of c where that is natural.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (C_LIGHT = 3.0e8), .scratch/ch9/nums.ts:
#   0.6c ⊕ 0.6c = 1.2/1.36 = 0.882c (wrong 1.20, 1.2/1.6 = 0.750); u′ = c gives u = c for any v;
#   0.8c ⊕ 0.8c = 1.6/1.64 = 0.976c;
#   probe at 0.95c from a ship at 0.8c: u′ = 0.15/0.24 = 0.625c; 3.0 light-min ahead in the ship frame after
#   3.0/0.625 = 4.80 min of ship time (wrong Galilean 3.0/0.15 = 20.0, sign 3.0/0.0852 = 35.2, Earth speed
#   3.0/0.95 = 3.16, extra γ(0.8) = 5/3 → 8.00);
# Recomputed by the lesson author in .scratch/ch9/9-4/bank.ts (2026-11-12): every key above was right. Changed
# with the lesson text: Q-9.4-launch-speed now needs a second step (the lesson prints the inverse rule), the last
# distractor of Q-9.4-never-exceeds is a new wrong argument (the lesson proves the limit by monotonicity), and the
# 2000 nm feedback of Q-9.4-galaxy names c/f.
#   D(0.6) = √(1.6/0.4) = 2: 5.0e14 Hz approaching → 1.0e15 Hz (wrong f₀/(1 − β) = 1.25e15,
#   f₀(1 + β) = 8.0e14, receding 2.5e14);
#   D(0.8) = 3: 400 nm receding → 1200 nm (wrong λ₀(1 + β) = 720, λ₀/D = 133, λ₀/(1 − β) = 2000);
#   f/f₀ = 1/2 receding: (1 − β)/(1 + β) = 1/4 → β = 0.600 (wrong classical 1 − β = 1/2 → 0.500,
#   no square root (1 − β)/(1 + β) = 1/2 → 0.333).
# Chapter-9 review (2026-11-12, .scratch/review/ch9/r34.ts, independent closed forms): every key and commonWrong
# right. The Doppler feedback of Q-9.4-galaxy and Q-9.4-doppler-beta now uses the course convention (β > 0

chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.4-1 velocity addition and the limit c
  - id: Q-9.4-probe-speed
    type: numeric
    objectives: [OBJ-9.4-1]
    level: basic
    prompt: >-
      חללית נעה במהירות $0.6c$ ביחס לכדור הארץ ומשגרת קדימה גשושית, שנעה במהירות $0.6c$ ביחס לחללית. מה המהירות של
      הגשושית ביחס לכדור הארץ? ענו ביחידות של $c$.
    answer: 0.882
    unit: c
    correctFeedback: >-
      נכון. $u = \dfrac{u' + v}{1 + u'v/c^2} = \dfrac{1.2c}{1 + 0.36} = 0.882c$. המכנה גדול מ-1 ומקטין את הסכום כך שהוא
      נשאר מתחת ל-$c$.
    wrongFeedback: >-
      הציבו בכלל החיבור היחסותי, $u = (u' + v)/(1 + u'v/c^2)$, עם $u' = v = 0.6c$.
    commonWrong:
      - value: 1.2
        feedback: >-
          זה החיבור של גליליי, $u' + v$, והוא נותן מהירות גדולה מ-$c$. ביחסות מחלקים ב-$1 + u'v/c^2$.
        misconception: MC-9-galilean-velocity-addition
      - value: 0.75
        feedback: >-
          חילקתם ב-$1 + v/c = 1.6$. במכנה מופיעה **מכפלת** שתי המהירויות, $u'v/c^2 = 0.6\cdot0.6 = 0.36$.
    hints:
      - 'מה $u''v/c^2$ כששתי המהירויות $0.6c$?'

  - id: Q-9.4-light-from-ship
    type: mc
    objectives: [OBJ-9.4-1]
    qualitative: true
    level: basic
    prompt: >-
      חללית נעה במהירות $v < c$ ביחס לכדור הארץ ושולחת קדימה פולס אור. הציבו את מהירות האור במערכת של החללית,
      $u' = c$, בכלל החיבור $u = \dfrac{u' + v}{1 + u'v/c^2}$. מה יוצא?
    choices:
      - text: $u = c$, בכל מהירות $v$ של החללית.
        correct: true
        feedback: >-
          נכון. $u = \dfrac{c + v}{1 + v/c} = \dfrac{c + v}{(c + v)/c} = c$. כלל החיבור מקיים את ההנחה השנייה, ולא במקרה: הוא
          נגזר ממנה, דרך טרנספורמציית לורנץ.
      - text: $u = c + v$
        feedback: >-
          זה החיבור של גליליי, בלי המכנה. עם המכנה, $1 + v/c$, הסכום מצטמצם בדיוק ל-$c$.
        misconception: MC-9-galilean-velocity-addition
      - text: $u = c$ רק כשהחללית איטית, $v \ll c$.
        feedback: >-
          הצמצום מדויק בכל מהירות: $(c + v)/(1 + v/c) = c$ זהותית. כשהחללית איטית דווקא קשה יותר לראות את ההבדל מגליליי.
      - text: $u$ קטן מ-$c$, כי המכנה גדול מ-1.
        feedback: >-
          המכנה אכן גדול מ-1, אבל גם המונה גדול מ-$c$, ושניהם גדלים פי $1 + v/c$ בדיוק. המנה היא $c$.

  - id: Q-9.4-closing
    type: twotier
    objectives: [OBJ-9.4-1]
    qualitative: true
    level: mid
    prompt: >-
      במערכת של כדור הארץ, חללית A נעה ימינה במהירות $0.8c$ וחללית B נעה שמאלה במהירות $0.8c$, זו לקראת זו. צופה על
      כדור הארץ מודד שהמרחק בין החלליות קטן בקצב של $1.6c$. האם זה סותר את תורת היחסות?
    choices:
      - text: לא. $1.6c$ הוא קצב השינוי של מרחק במערכת של כדור הארץ, ולא מהירות של גוף כלשהו.
        correct: true
        feedback: >-
          נכון. כל אחת מהחלליות נעה ביחס לכדור הארץ לאט מ-$c$. במערכת של A, חללית B נעה במהירות
          $\dfrac{1.6c}{1 + 0.64} = 0.976c$, גם היא מתחת ל-$c$.
      - text: כן. לכן אי אפשר ששתי החלליות ינועו במהירות $0.8c$ זו לקראת זו.
        feedback: >-
          אין שום מניעה: כל חללית לבדה נעה במהירות $0.8c$ ביחס לכדור הארץ. ההגבלה חלה על מהירות של גוף, לא על קצב שבו
          מרחק בין שני גופים משתנה במערכת שלישית.
        misconception: MC-9-closing-speed-limited
      - text: לא, כי במערכת של A חללית B נעה במהירות $1.6c$, ומותר לגופים לנוע מהר מהאור כשהם מתקרבים.
        feedback: >-
          במערכת של A המהירות של B היא $0.976c$, לפי כלל החיבור היחסותי. שום גוף לא נע ביחס למערכת אינרציאלית מהר מהאור.
        misconception: MC-9-galilean-velocity-addition
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          המגבלה חלה על המהירות של גוף או של אות ביחס למערכת אינרציאלית. במערכת של A, חללית B נעה לאט מ-$c$.
        correct: true
        feedback: >-
          זה הנימוק. קצב ההתקרבות במערכת שלישית יכול להגיע עד $2c$, למשל בשני פולסי אור שנעים זה לקראת זה, ואף אות לא
          עובר ביניהם מהר מ-$c$.
      - text: >-
          לפי ההנחה השנייה, שום מרחק לא יכול להשתנות בקצב גדול מ-$c$.
        feedback: >-
          ההנחה השנייה מדברת על מהירות האור בכל מערכת, לא על קצבי שינוי של מרחקים בין גופים. שני פולסי אור שנעים זה
          לקראת זה מקרבים את המרחק ביניהם בקצב $2c$, וכל פולס נע במהירות $c$ בדיוק.
        misconception: MC-9-closing-speed-limited
      - text: המהירות היחסית היא תמיד סכום המהירויות, ולכן היא $1.6c$.
        feedback: >-
          הסכום הוא כלל של גליליי, שנכון רק במהירויות נמוכות. המהירות של B במערכת של A מתקבלת מכלל החיבור היחסותי.
        misconception: MC-9-galilean-velocity-addition
    hints:
      - 'מה המהירות של B במערכת המנוחה של A? השתמשו בכלל החיבור.'

  - id: Q-9.4-inverse-speed
    type: numeric
    objectives: [OBJ-9.4-1]
    level: mid
    prompt: >-
      במערכת של כדור הארץ, חללית נעה במהירות $0.6c$ לאורך $+x$, ומטאור נע לפניה באותו כיוון במהירות $0.9c$. מה המהירות של
      המטאור במערכת של החללית? ענו ביחידות של $c$.
    answer: 0.652
    unit: c
    correctFeedback: >-
      נכון. במערכת של החללית כדור הארץ נע במהירות $(-v)$, ולכן אותו כלל עם $(-v)$ במקום $v$:
      $u' = \dfrac{u - v}{1 - uv/c^2} = \dfrac{0.3c}{1 - 0.54} = 0.652c$. בדיקה בכלל החיבור: $\dfrac{0.652 + 0.6}{1 + 0.391} = 0.900$.
    wrongFeedback: >-
      במערכת של החללית כדור הארץ נע במהירות $(-v)$. הציבו בכלל החיבור $(-v)$ במקום $v$, ושימו לב לסימן במכנה.
    commonWrong:
      - value: 0.3
        feedback: >-
          זה $u - v$, ההפרש של גליליי. במהירויות כאלה המכנה $1 - uv/c^2 = 0.46$ רחוק מ-1.
        misconception: MC-9-galilean-velocity-addition
      - value: 0.195
        feedback: >-
          חילקתם ב-$1 + uv/c^2$. כשמחליפים את $v$ ב-$(-v)$, הסימן מתהפך גם במכנה: $u' = (u - v)/(1 - uv/c^2)$.
      - value: 0.974
        feedback: >-
          חיברתם את המהירויות בכלל היחסותי. אבל $0.9c$ היא כבר המהירות במערכת של כדור הארץ; את המהירות במערכת של
          החללית מקבלים בכלל ההפוך, עם $(-v)$.
    hints:
      - 'מה המהירות של כדור הארץ במערכת של החללית?'

  - id: Q-9.4-launch-speed
    type: numeric
    objectives: [OBJ-9.4-1]
    level: bagrut
    prompt: >-
      חללית נעה במהירות $0.8c$ ביחס לכדור הארץ, ומשגרת קדימה גשושית שנעה במהירות $0.95c$ ביחס לכדור הארץ. כמה זמן
      אחרי השיגור, לפי השעונים של החללית, תהיה הגשושית $3.0$ דקות אור לפני החללית, כשהמרחק נמדד במערכת של החללית?
      ענו בדקות.
    answer: 4.8
    unit: min
    correctFeedback: >-
      נכון. קודם המהירות של הגשושית במערכת של החללית, שבה כדור הארץ נע במהירות $(-v)$:
      $u' = \dfrac{u - v}{1 - uv/c^2} = \dfrac{0.15c}{1 - 0.76} = 0.625c$. בדיקה: $\dfrac{0.625 + 0.8}{1 + 0.5} = 0.95$. עכשיו
      הכול במערכת אחת, של החללית: הגשושית מתרחקת מהחללית הנחה במהירות $0.625c$, ולכן $3.0$ דקות אור לוקחות
      $3.0/0.625 = 4.80\,\text{min}$ בשעונים של החללית. **בדיקת גבולות:** כש-$v \to 0$, $u' \to u$ והזמן $3.0/0.95$;
      וכש-$u \to c$, גם $u' \to c$, והזמן $3.0\,\text{min}$, כמו לאור.
    wrongFeedback: >-
      שני צעדים: מצאו את המהירות של הגשושית במערכת של החללית, ואז חשבו זמן כמרחק חלקי מהירות, הכול באותה מערכת.
    commonWrong:
      - value: 20.0
        feedback: >-
          חילקתם ב-$0.15c$, ההפרש של גליליי, $u - v$. במהירויות כאלה המכנה $1 - uv/c^2 = 0.24$ רחוק מאוד מ-1: במערכת
          של החללית הגשושית נעה פי ארבעה יותר מהר.
        misconception: MC-9-galilean-velocity-addition
      - value: 35.2
        feedback: >-
          חילקתם ב-$0.0852c$, שיוצא מ-$(u - v)/(1 + uv/c^2)$. כשמחסירים מהירויות, גם הסימן במכנה מתהפך:
          $u' = (u - v)/(1 - uv/c^2)$. בדקו את $u'$ בהצבה בכלל החיבור.
      - value: 3.16
        feedback: >-
          חילקתם ב-$0.95c$, המהירות של הגשושית ביחס לכדור הארץ. המרחק והזמן נמדדים במערכת של החללית, ולכן גם המהירות
          צריכה להיות זו שבמערכת שלה.
      - value: 8.0
        feedback: >-
          כפלתם ב-$\gamma = 5/3$ של החללית. המרחק, המהירות $u'$ והשעונים כולם של אותה מערכת, $S'$; בתוך מערכת אחת אין
          התארכות זמן, והזמן הוא מרחק חלקי מהירות.
    hints:
      - 'במערכת של החללית, כדור הארץ נע במהירות $(-v)$. מה המהירות של הגשושית שם?'
      - 'אחרי שמצאתם את $u''$, כל השאלה היא בתוך מערכת אחת.'

  - id: Q-9.4-never-exceeds
    type: mc
    objectives: [OBJ-9.4-1]
    qualitative: true
    level: bagrut
    prompt: >-
      סמנו $\beta' = u'/c$ ו-$\beta = v/c$, והניחו $|\beta'| < 1$ ו-$|\beta| < 1$. איזו טענה מוכיחה שהמהירות
      $u = \dfrac{u' + v}{1 + u'v/c^2}$ קטנה מ-$c$?
    choices:
      - text: >-
          $1 - \dfrac{u}{c} = \dfrac{(1 - \beta')(1 - \beta)}{1 + \beta'\beta}$, ושלושת הגורמים חיוביים.
        correct: true
        feedback: >-
          נכון. $1 + \beta'\beta - \beta' - \beta = (1 - \beta')(1 - \beta)$, ולכן הזהות נכונה. המונה חיובי כי
          $\beta', \beta < 1$, והמכנה חיובי כי $|\beta'\beta| < 1$. לכן $u < c$, ובאותה דרך $1 + u/c > 0$, כלומר $u > -c$.
          **בדיקת גבולות:** כש-$\beta' \to 1$ המונה מתאפס ו-$u \to c$, כמו בפולס אור. זו דרך שנייה, אלגברית, לאותה
          מסקנה שבשיעור הוכחנו בנגזרת ובקצוות.
      - text: >-
          המכנה $1 + u'v/c^2$ גדול מ-1, ולכן $u < u' + v$.
        feedback: >-
          זה נכון כששתי המהירויות חיוביות, אבל לא מספיק: $u' + v$ יכול להגיע עד כמעט $2c$, ו-$u$ קטן ממנו עדיין יכול
          להיות גדול מ-$c$ לפי הטענה הזו לבדה.
      - text: >-
          אם $u > c$, בגורם $\gamma$ של הגוף היה שורש של מספר שלילי, ולכן $u < c$.
        feedback: >-
          זה מראה שמהירות כזו בעייתית, לא שכלל החיבור לא יכול לתת אותה. כדי להוכיח שהוא לא נותן אותה, צריך לבדוק
          את הביטוי עצמו.
      - text: >-
          לפי ההנחה השנייה של איינשטיין שום גוף לא נע מהר מהאור, ולכן גם $u < c$.
        feedback: >-
          ההנחה השנייה אומרת שמהירות האור זהה בכל מערכת אינרציאלית; היא לא אומרת בעצמה ששום דבר לא נע מהר יותר. זו
          מסקנה, וכאן בדיוק מבקשים להוכיח אותה מתוך כלל החיבור. הזהות לנוסחה של $1 - u/c$ עושה את זה בשורה אחת.
    hints:
      - 'חשבו את $1 - u/c$ על מכנה משותף, ופרקו את המונה לגורמים.'

  # ---------------------------------------------------------------- OBJ-9.4-2 longitudinal Doppler
  - id: Q-9.4-doppler-approach
    type: numeric
    objectives: [OBJ-9.4-2]
    level: basic
    prompt: >-
      חללית שמתקרבת לכדור הארץ במהירות $0.6c$ משדרת אור בתדירות $f_0 = 5.0\cdot10^{14}\,\text{Hz}$ במערכת שלה. באיזו
      תדירות קולטים את האור על כדור הארץ?
    answer: 1.0e15
    unit: Hz
    correctFeedback: >-
      נכון. בהתקרבות $f = f_0\sqrt{\dfrac{1 + \beta}{1 - \beta}} = 5.0\cdot10^{14}\cdot\sqrt{\dfrac{1.6}{0.4}} = 5.0\cdot10^{14}\cdot2 = 1.0\cdot10^{15}\,\text{Hz}$.
      אור כתום, $600\,\text{nm}$, הופך לאולטרה-סגול, $300\,\text{nm}$.
    wrongFeedback: >-
      בהתקרבות התדירות עולה. הציבו $\beta = 0.6$ ב-$\sqrt{(1 + \beta)/(1 - \beta)}$.
    commonWrong:
      - value: 1.25e15
        feedback: >-
          זה $f_0/(1 - \beta)$, דופלר של קול ממקור נע. הוא לא כולל את התארכות הזמן: השעון של המקור מפגר פי $\gamma$, ולכן
          הוא משדר לאט יותר במערכת של כדור הארץ. $\dfrac{1}{\gamma(1 - \beta)} = \sqrt{\dfrac{1 + \beta}{1 - \beta}}$.
        misconception: MC-9-classical-doppler
      - value: 8.0e14
        feedback: >-
          זה $f_0(1 + \beta)$, דופלר של קול לצופה נע. לאור אין תווך, ולכן אין הבדל בין "המקור נע" ל"הצופה נע", ושתי
          הנוסחאות של הקול לא מתאימות.
        misconception: MC-9-classical-doppler
      - value: 2.5e14
        feedback: 'זו התדירות בהתרחקות. כשהמקור מתקרב, הגלים נדחסים והתדירות **עולה**.'
    hints:
      - 'בהתקרבות, האם $f$ גדול או קטן מ-$f_0$?'

  - id: Q-9.4-doppler-who-moves
    type: mc
    objectives: [OBJ-9.4-2]
    qualitative: true
    level: mid
    prompt: >-
      בקול, מקור שמתקרב במהירות $v$ לשומע שנח באוויר נותן תדירות שונה מזו של שומע שמתקרב במהירות $v$ למקור שנח באוויר.
      מה המצב באור בריק, כשהמקור והצופה מתקרבים זה לזה במהירות יחסית $v$?
    choices:
      - text: >-
          התדירות זהה בשני התיאורים, כי אין תווך: יש רק מהירות יחסית, והנוסחה $\sqrt{(1 + \beta)/(1 - \beta)}$ תלויה רק בה.
        correct: true
        feedback: >-
          נכון. "המקור נע" ו"הצופה נע" הם שתי מערכות ייחוס של אותו מצב, ולפי עקרון היחסות הן חייבות לנבא את אותה תדירות
          נקלטת. במערכת של הצופה, השעון של המקור מפגר; במערכת של המקור, השעון של הצופה מפגר. החשבון שונה, התוצאה אחת.
      - text: >-
          התדירות שונה, כי התארכות הזמן פועלת רק על מי שבאמת נע.
        feedback: >-
          אין "מי שבאמת נע" בין מערכות אינרציאליות. כל צד מוצא שהשעון של השני מפגר, וכל חשבון נכון במערכת שלו נותן אותה
          תדירות נקלטת.
        misconception: MC-9-dilation-asymmetric
      - text: >-
          התדירות שונה, כי האור נע במהירות $c$ ביחס למקור, כמו קול ביחס לאוויר.
        feedback: >-
          האור נע במהירות $c$ ביחס לכל צופה אינרציאלי, לא ביחס למקור. לכן אין לו "אוויר" שמבחין בין המקרים.
        misconception: MC-9-light-speed-adds-to-source
      - text: אין אפקט דופלר לאור, כי מהירות האור זהה לכל הצופים.
        feedback: >-
          המהירות זהה, אבל אורך הגל והתדירות משתנים, ו-$f\lambda = c$ בכל מערכת. בהתקרבות הגלים נדחסים, אורך הגל
          מתקצר והתדירות עולה.

  - id: Q-9.4-galaxy
    type: numeric
    objectives: [OBJ-9.4-2]
    level: mid
    prompt: >-
      גלקסיה מתרחקת מאיתנו במהירות $0.8c$. קו פליטה שאורך הגל שלו במעבדה הוא $\lambda_0 = 400\,\text{nm}$ נמדד בטלסקופ.
      מה אורך הגל שנמדד?
    answer: 1200
    unit: nm
    correctFeedback: >-
      נכון. בהתרחקות $\beta = -0.8$ (במוסכמה $\beta > 0$ בהתקרבות), ולכן
      $\dfrac{f}{f_0} = \sqrt{\dfrac{1 + \beta}{1 - \beta}} = \sqrt{\dfrac{0.2}{1.8}} = \dfrac13$. מכיוון ש-$f\lambda = c$,
      אורך הגל גדל פי 3: $\lambda = 3\cdot400 = 1200\,\text{nm}$. אור סגול הופך לתת-אדום.
    wrongFeedback: >-
      בהתרחקות אורך הגל גדל. חשבו את גורם דופלר עם $\beta = -0.8$, וזכרו שאורך הגל הפוך לתדירות.
    commonWrong:
      - value: 720
        feedback: >-
          זה $\lambda_0(1 + 0.8)$, דופלר של קול ממקור שמתרחק. ביחסות נוסף גם הגורם $\gamma$ של התארכות הזמן:
          $\gamma\cdot(1 + 0.8) = \sqrt{1.8/0.2} = 3$.
        misconception: MC-9-classical-doppler
      - value: 133
        feedback: 'חילקתם בגורם דופלר. כשהמקור מתרחק, הגלים נמתחים: אורך הגל **גדל**.'
      - value: 2000
        feedback: >-
          זה $c/f$ עם $f = f_0(1 - 0.8)$, דופלר של קול לשומע שמתרחק ממקור נח, כלומר $\lambda_0/(1 - 0.8)$. לאור אין
          תווך, וגם הנוסחה הזו של הקול לא מתאימה: חסרה בה התארכות הזמן של שעון השומע.
        misconception: MC-9-classical-doppler
    hints:
      - '$\sqrt{1.8/0.2}$ הוא מספר שלם.'

  - id: Q-9.4-doppler-beta
    type: numeric
    objectives: [OBJ-9.4-2]
    level: bagrut
    prompt: >-
      חללית שמתרחקת מכדור הארץ משדרת אות רדיו בתדירות $10.0\,\text{GHz}$ במערכת שלה, ועל כדור הארץ קולטים אותו
      בתדירות $5.0\,\text{GHz}$. מה מהירות החללית? ענו ביחידות של $c$.
    answer: 0.6
    unit: c
    correctFeedback: >-
      נכון. במוסכמה $\beta > 0$ בהתקרבות: $\sqrt{\dfrac{1 + \beta}{1 - \beta}} = \dfrac{f}{f_0} = \dfrac12$, ולכן
      $\dfrac{1 + \beta}{1 - \beta} = \dfrac14$, כלומר $4 + 4\beta = 1 - \beta$ ו-$\beta = -0.6$: החללית מתרחקת במהירות $0.6c$.
      **בדיקת גבולות:** כש-$|\beta| \ll 1$, $\sqrt{(1 + \beta)/(1 - \beta)} \approx 1 + \beta$, ונשאר דופלר הקול,
      $\Delta f/f_0 \approx \beta$. כאן ההבדל גדול: הקירוב נותן $0.5c$.
    wrongFeedback: >-
      כתבו $f/f_0 = \sqrt{(1 + \beta)/(1 - \beta)}$, עם $\beta < 0$ בהתרחקות, העלו בריבוע ובודדו את $\beta$.
    commonWrong:
      - value: 0.5
        feedback: >-
          פתרתם $1 + \beta = \tfrac12$, הקירוב של מהירויות נמוכות. ב-$\beta$ כזה הוא כבר רחוק מהתוצאה המדויקת.
        misconception: MC-9-classical-doppler
      - value: 0.333
        feedback: >-
          פתרתם $\dfrac{1 + \beta}{1 - \beta} = \dfrac12$ ושכחתם את השורש. העלו את שני האגפים בריבוע: $\tfrac12$ הופך ל-$\tfrac14$.
    hints:
      - 'העלו את שני האגפים בריבוע לפני שמבודדים את $\beta$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-9.6-2, OBJ-9.5-1]
        prompt: >-
          במערכת של המנהרה, $S$, הברקים לא פוגעים ברכבת: הם פוגעים $20\,\text{m}$ לפני החזית שלה ו-$20\,\text{m}$ מאחורי הקצה
          האחורי שלה. אבל במערכת של הרכבת, $S'$, שנעה ב-$+v$, המנהרה באורך $288\,\text{m}$ בלבד, והרכבת באורך $400\,\text{m}$.
          (1) מצאו ב-$S'$ את המקום והזמן של כל פגיעה, והראו שגם שם אף ברק לא פוגע ברכבת. (2) חשבו את האינטרוול בין שתי
          הפגיעות, סווגו אותו, והסבירו למה סדר הפגיעות יכול להיות שונה בשתי המערכות. (3) מצאו מאיזו מהירות הרכבת נכנסת כולה
          למנהרה במערכת של המנהרה, ובדקו מה קורה לפגיעות במהירות הזו, בשתי המערכות. ב-$S'$ זכרו שהמנהרה זזה בין שתי הפגיעות.
        hints:
          - 'ב-$S$ שימו את הכניסה ב-$x = 0$ ואת היציאה ב-$x = 360\,\text{m}$, והפגיעות ב-$t = 0$. איפה הקצוות של הרכבת?'
          - 'במערכת של הרכבת הקצוות שלה נחים, ב-$x'' = \gamma x$ של המקום שלהם ברגע $t = 0$.'
        solution:
          - kind: law
            text: >-
              טרנספורמציית לורנץ, $x' = \gamma(x - vt)$ ו-$t' = \gamma\left(t - vx/c^2\right)$, והאינטרוול $s^2 = c^2\Delta t^2 - \Delta x^2$,
              שזהה בשתי המערכות. אם ברק פוגע ברכבת זה מאורע במקום אחד, ולכן כל המערכות מסכימות עליו.
          - kind: manipulation
            text: >-
              במערכת של המנהרה, ב-$t = 0$ הרכבת בין $x = 20\,\text{m}$ ל-$x = 340\,\text{m}$. במערכת של הרכבת הקצוות נחים, ב-$x' = \gamma x$:
              הקצה האחורי ב-$25\,\text{m}$ והחזית ב-$425\,\text{m}$, אורך $400\,\text{m}$. הפגיעה בכניסה, $(x, t) = (0, 0)$, עוברת ל-$x' = 0$,
              $t' = 0$: $25\,\text{m}$ מאחורי הקצה האחורי. הפגיעה ביציאה, $(360\,\text{m}, 0)$, עוברת ל-$x' = 450\,\text{m}$ ולזמן
              $t' = -\gamma v\cdot360/c^2$, כלומר $0.90\,\mu\text{s}$ לפני הפגיעה בכניסה: $25\,\text{m}$ לפני החזית. בזמן הזה המנהרה
              זזה אחורה $0.6c\cdot0.90\,\mu\text{s} = 162\,\text{m}$. אף ברק לא פוגע ברכבת.
          - kind: manipulation
            text: >-
              $s^2 = c^2\cdot0^2 - (360\,\text{m})^2 = -1.3\cdot10^5\,\text{m}^2 < 0$: אינטרוול מרחבי. במערכת של הרכבת
              $c^2\Delta t'^2 - \Delta x'^2 = 270^2 - 450^2 = -360^2\,\text{m}^2$, אותו מספר. לזוג מרחבי אין סדר זמנים מוחלט: במנהרה
              הפגיעות בו-זמניות, ברכבת היציאה קודמת. אף פגיעה לא גורמת לשנייה, ולכן אין סתירה.
          - kind: limit
            text: >-
              הרכבת נכנסת למנהרה במערכת של המנהרה כש-$400/\gamma \le 360$, כלומר $\gamma \ge 10/9$ ו-$\beta \ge 0.436$. במהירות הזו
              בדיוק, הרכבת באורך $360\,\text{m}$ במנהרה, ושני הברקים פוגעים בדיוק בשני הקצוות שלה. במערכת של הרכבת המנהרה באורך
              $324\,\text{m}$, והיא זזה $\beta c\cdot\gamma\beta\cdot360\,\text{m}/c = 76\,\text{m}$ בין הפגיעות: $324 + 76 = 400$, שוב בדיוק
              הקצוות. ההסכמה על "נגע או לא נגע" נשמרת גם בגבול.
          - kind: units
            text: >-
              $vx/c^2$ ביחידות $\dfrac{\text{m/s}\cdot\text{m}}{\text{m}^2/\text{s}^2} = \text{s}$, זמן, ו-$\gamma$ חסר ממדים. $s^2$ במטרים
              רבועים, כמו $c^2\Delta t^2$.
          - kind: result
            text: >-
              במערכת של הרכבת הברק ביציאה פוגע $25\,\text{m}$ לפני החזית, ו-$0.90\,\mu\text{s}$ אחר כך הברק בכניסה פוגע
              $25\,\text{m}$ מאחורי הקצה האחורי. הרכבת לא נפגעת בשתי המערכות. האינטרוול מרחבי, $s^2 = -(360\,\text{m})^2$, ולכן סדר הפגיעות
              תלוי במערכת והוא לא יוצר סתירה.
        rubric:
          - text: מצאתי את הקצוות של הרכבת במערכת שלה, $25\,\text{m}$ ו-$425\,\text{m}$, ואת המקום והזמן של כל פגיעה בטרנספורמציה.
          - text: הראיתי ששתי הפגיעות מחוץ לרכבת, $25\,\text{m}$ לפני החזית ו-$25\,\text{m}$ מאחורי הקצה האחורי.
          - text: חישבתי $s^2 < 0$ בשתי המערכות, סיווגתי את האינטרוול כמרחבי, והסברתי שלכן הסדר בזמן יכול להתהפך.
          - text: מצאתי את המהירות $\beta = 0.436$ ובדקתי שבה הברקים פוגעים בדיוק בקצוות, בשתי המערכות.

# Chapter 9 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג, ד) worth 25 points,
# climbing basic → mid → exam level. Each problem joins at least two lessons; together they touch all six:
#   1 (beacons): 9.2, 9.3, 9.5 · 2 (twins with yearly signals): 9.6, 9.4 · 3 (probe from a ship): 9.4, 9.2 ·
#   4 (train, tunnel, lightning): 9.1, 9.2, 9.3, 9.5, 9.6.
# Open parts follow the course format: law → manipulation → limit → units → substitution → result.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (C_LIGHT = 3.0e8), .scratch/ch9/review.ts:
#   1: X = 12 light-min, β = 0.6: Earth 20.0 min to B, ship clock 16.0 (wrong 25.0, 12.8); A–B in the ship
#      frame 9.60 light-min (wrong 15.0, 7.68); B's flash at t = 0: t′ = −γβX = −9.00 min (wrong +9.00,
#      −7.20, −5.76), x′ = 15.0; received at t = X/(1 + β) = 7.50 min, x = 4.50, ship clock 6.00 = −9 + 15.
#   2: L = 4 light-years, β = 0.8: traveller 6.00 years; D = 3: Earth signals every 3.00 years outbound
#      (wrong γ = 1.67, classical 1/(1 − β) = 5.00, 1 + β = 1.80), 1 + 9 = 10 received (wrong 6, 3.6);
#      Earth sees the turnaround at 9.00 years: 3 + 3 = 6 received; out at β₁, back at β₂: L/(γ₁β₁) years of
#      her clock seen before the turnaround, L/(γ₂β₂) after (t₁ = L/β₁ + L, t₂ − t₁ = L(1 − β₂)/β₂).
# Reviewed 2026-11-12: independent recompute in .scratch/review/ch9/bagrut/recompute.ts (closed forms); every
#   number above agreed. 4ג: 0.72 is also 288 m with γ, 0.576 is 288 m without γ.
#   3: 0.6c ⊕ 0.6c = 15/17 c = 0.882c (wrong 1.20, 0.750); γ = 17/8: 2.13 μs between flashes on Earth
#      (wrong γ(0.6)² = 1.56, 1/γ = 0.471, 1.25); received every D(15/17) = 4.00 μs = D(0.6)² (wrong 2.13,
#      classical 1 + u/c = 1.88, D(0.6) = 2.00).
#   4: train 400 m, tunnel 360 m, β = 0.6: train in the tunnel frame 320 m (wrong 500, 256); strikes in the
#      train frame γβL/c = 0.900 μs apart (wrong 0.720, 0.576, L/c = 1.20); train [20, 340] m at t = 0 →
#      train frame rear 25 m, front 425 m, strikes at x′ = 0 (t′ = 0) and x′ = 450 m (t′ = −0.900 μs);
#      s² = −360² m²; fits in the tunnel frame once γ > 10/9, β > 0.436.

chapter: 9
questions:
  # ------------------------------------------------------------ 1: a spaceship flying past two beacons
  - id: Q-9-bagrut-1
    type: bagrut
    title: חללית חולפת על פני שני משדרים
    prompt: >-
      שני משדרים, A ו-B, נחים במערכת $S$ של כדור הארץ על ציר $x$: A ב-$x = 0$ ו-B ב-$x = 12$ דקות אור. חללית נעה
      במהירות $0.6c$ לכיוון $+x$, וחולפת על פני A ברגע $t = 0$. ברגע הזה שעון החללית מאופס, $t' = 0$, והראשית של מערכת
      החללית, $S'$, נמצאת בחללית. גם ברגע $t = 0$ במערכת $S$, משדר B שולח הבזק אור לכיוון A. עבדו בדקות ובדקות אור,
      כך ש-$c = 1$.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-9.2-1]
        prompt: מה מראה שעון החללית כשהיא חולפת על פני B? ענו בדקות.
        answer: 16.0
        unit: min
        correctFeedback: >-
          נכון. במערכת $S$ החללית מגיעה ל-B אחרי $12/0.6 = 20\,\text{min}$. השעון שלה נמצא בשני המאורעות, ולכן הוא מודד את
          הזמן העצמי: $20/\gamma = 20/1.25 = 16.0\,\text{min}$.
        wrongFeedback: >-
          חשבו קודם את הזמן במערכת $S$. אחר כך שאלו איזה שעון נמצא גם במעבר ליד A וגם במעבר ליד B.
        commonWrong:
          - value: 25.0
            feedback: >-
              כפלתם ב-$\gamma$. השעון של החללית נמצא בשני המאורעות, ולכן הוא מודד את הזמן הקצר ביותר.
            misconception: MC-9-proper-time-rest-frame
          - value: 20.0
            feedback: 'זה הזמן במערכת $S$, שבה שני המאורעות במקומות שונים. שעון החללית מפגר במערכת הזו פי $\gamma$.'
          - value: 12.8
            feedback: 'כפלתם ב-$1 - \beta^2 = 0.64$. החלוקה היא ב-$\gamma = 1/\sqrt{1 - \beta^2} = 1.25$.'

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-9.2-2]
        prompt: >-
          מה המרחק בין A ל-B במערכת של החללית? ענו בדקות אור, ובדקו שהתשובה מתאימה לחלק א.
        answer: 9.6
        unit: דקות אור
        correctFeedback: >-
          נכון. המשדרים נחים ב-$S$, ולכן $12$ דקות אור הוא האורך העצמי, ובמערכת של החללית $12/1.25 = 9.6$ דקות אור. בדיקה:
          במערכת של החללית B מגיע אליה במהירות $0.6c$, אחרי $9.6/0.6 = 16\,\text{min}$, בדיוק מה שהשעון שלה מראה בחלק א.
        wrongFeedback: 'במערכת של החללית, שני המשדרים נעים. המרחק ביניהם מתקצר: $L = L_0/\gamma$.'
        commonWrong:
          - value: 15.0
            feedback: 'כפלתם ב-$\gamma$. האורך העצמי, במערכת שבה המשדרים נחים, הוא הארוך ביותר.'
            misconception: MC-9-moving-rod-longer
          - value: 7.68
            feedback: 'כפלתם ב-$1 - \beta^2$. ההתקצרות היא פי $\gamma$, עם שורש.'
          - value: 12.0
            feedback: 'זה המרחק ב-$S$. במערכת של החללית הקטע בין המשדרים נע, ולכן הוא קצר יותר.'

      - label: ג
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-9.3-2, OBJ-9.3-1]
        prompt: >-
          ב-$S$, ההבזק של B בו-זמני עם המעבר של החללית ליד A. מה הזמן $t'$ של מאורע ההבזק במערכת של החללית, $S'$? (זה
          הזמן ששעון שנח ב-$S'$ ליד B, ומסונכרן במערכת הזו עם שעון החללית, מראה ברגע ההבזק; לא הרגע שבו החללית רואה את
          ההבזק.) ענו בדקות, עם הסימן.
        answer: -9.0
        unit: min
        correctFeedback: >-
          נכון. המאורע הוא $x = 12$, $t = 0$, ולכן $t' = \gamma(t - \beta x) = 1.25\cdot(0 - 0.6\cdot12)$, כלומר $t' = -9.0\,\text{min}$:
          במערכת של החללית, B הבזיק 9 דקות **לפני** שהיא חלפה על פני A. במערכת הזו ההבזק קרה ב-$x' = \gamma(x - \beta t) = 15$ דקות אור.
        wrongFeedback: >-
          הציבו את המאורע, $x = 12$ ו-$t = 0$, בטרנספורמציה של הזמן, $t' = \gamma\left(t - vx/c^2\right)$.
        commonWrong:
          - value: 9.0
            feedback: >-
              הסימן הפוך. $t' = \gamma(0 - \beta x)$ שלילי כש-$x > 0$: מבין שני מאורעות בו-זמניים ב-$S$, זה שנמצא קדימה בכיוון
              התנועה של החללית קרה במערכת שלה קודם.
          - value: -7.2
            feedback: 'שכחתם את $\gamma = 1.25$.'
          - value: -5.76
            feedback: 'חילקתם ב-$\gamma$ במקום לכפול.'
        hints:
          - 'בדקות ובדקות אור, $vx/c^2 = \beta x$.'

      - label: ד
        type: open
        points: 8
        level: bagrut
        standalone: false
        objectives: [OBJ-9.5-2, OBJ-9.3-1]
        prompt: >-
          (1) מתי, לפי שעון החללית, מגיע אליה ההבזק של B? חשבו פעם במערכת $S$ ופעם במערכת $S'$, והראו ששתי הדרכים נותנות
          אותה תשובה. מצאו גם ביטוי כללי, למרחק $X$ ולמהירות $\beta$, ובדקו אותו בגבולות.

          (2) תארו את המצב בדיאגרמת מינקובסקי של $S$: קו העולם של החללית, ציר $x'$, מאורע ההבזק וקו העולם של האור.
          איפה נמצא מאורע ההבזק ביחס לציר $x'$, ומה זה אומר?
        hints:
          - 'ב-$S$, קו העולם של האור הוא $x = 12 - t$ וקו העולם של החללית $x = 0.6t$.'
          - 'ב-$S''$ החללית נחה ב-$x'' = 0$, והאור נע אליה במהירות $c$ מהמקום ומהזמן שמצאתם בחלק ג.'
        solution:
          - kind: law
            text: >-
              טרנספורמציית לורנץ, $x' = \gamma(x - \beta ct)$ ו-$ct' = \gamma(ct - \beta x)$, ומהירות האור $c$ בשתי המערכות.
              הקבלה של ההבזק בחללית היא מאורע אחד, במקום אחד, ולכן כל המערכות חייבות להסכים על מה שהשעון שלה מראה בו.
          - kind: manipulation
            text: >-
              ב-$S$: האור יוצא מ-$x = X$ ב-$t = 0$ ונע שמאלה, $x = X - t$. החללית ב-$x = \beta t$. הם נפגשים כש-$X - t = \beta t$,
              כלומר $t = \dfrac{X}{1 + \beta} = \dfrac{12}{1.6} = 7.5\,\text{min}$, ב-$x = 4.5$ דקות אור. שעון החללית מראה
              $t' = \dfrac{t}{\gamma} = \dfrac{7.5}{1.25} = 6.0\,\text{min}$.
          - kind: manipulation
            text: >-
              ב-$S'$: מחלק ג, ההבזק קרה ב-$x' = \gamma X = 15$ ובזמן $t' = -\gamma\beta X$, כלומר 9 דקות לפני האפס. האור עובר
              $15$ דקות אור אל החללית הנחה, ומגיע אחרי 15 דקות, כשהשעון מראה $15 - 9 = 6.0\,\text{min}$. אותה תשובה.
          - kind: manipulation
            text: >-
              באופן כללי, $t' = \gamma X(1 - \beta) = X\sqrt{\dfrac{1 - \beta}{1 + \beta}} = X/D(\beta)$, עם גורם דופלר $D(\beta)$ של
              שיעור 9.4: החללית מתקרבת ל-B. בדיאגרמה:
              קו העולם של החללית הוא ציר $ct'$, שנוטה ב-$31^\circ$ מציר $ct$. ציר $x'$ הוא הקו $ct = 0.6x$, שנוטה ב-$31^\circ$
              מעל ציר $x$. מאורע ההבזק, $(x, ct) = (12, 0)$, נמצא על ציר $x$, כלומר **מתחת** לציר $x'$: במערכת של החללית הוא
              קרה לפני $t' = 0$. ממנו יוצא קו ב-$45^\circ$, למעלה ושמאלה, ופוגש את קו העולם של החללית ב-$(4.5,\ 7.5)$.
          - kind: limit
            text: >-
              כש-$\beta \to 0$, $t' \to X = 12\,\text{min}$: חללית שעומדת ליד A מקבלת את האור אחרי שהוא עובר 12 דקות אור. כש-$\beta \to 1$,
              $t' \to 0$: החללית נעה כמעט כמו האור, והקבלה קורה כמעט מיד בשעון שלה.
          - kind: units
            text: >-
              $X$ בדקות אור ו-$c = 1$ דקת אור לדקה, ולכן $X/c$ בדקות, ו-$\sqrt{(1 - \beta)/(1 + \beta)}$ חסר ממדים.
          - kind: substitution
            text: >-
              $t' = 12\cdot\sqrt{\dfrac{0.4}{1.6}} = 12\cdot0.5 = 6.0\,\text{min}$.
          - kind: result
            text: >-
              שעון החללית מראה $6.0\,\text{min}$ כשההבזק מגיע, בשתי המערכות. בדיאגרמה מאורע ההבזק מתחת לציר $x'$: במערכת של
              החללית הוא קרה 9 דקות לפני שחלפה על פני A, ולכן האור הגיע אליה מוקדם, אחרי 6 דקות ולא אחרי 15.
        rubric:
          - text: מצאתי במערכת $S$ את נקודת המפגש בין קו העולם של האור לקו העולם של החללית, וחילקתי את הזמן ב-$\gamma$.
          - text: חזרתי על החשבון ב-$S'$, מהזמן ומהמקום של ההבזק בחלק ג, וקיבלתי אותה תשובה.
          - text: כתבתי ביטוי כללי, $\gamma X(1 - \beta)$ או בצורה השקולה $X\sqrt{(1 - \beta)/(1 + \beta)}$, ובדקתי את הגבולות $\beta \to 0$ ו-$\beta \to 1$.
          - text: שרטטתי את ציר $ct'$ ואת ציר $x'$ נוטים לקראת קו האור, וקבעתי שמאורע ההבזק מתחת לציר $x'$.

  # ------------------------------------------------------------ 2: twins who send a signal every year
  - id: Q-9-bagrut-2
    type: bagrut
    title: תאומים ששולחים אות בכל שנה
    prompt: >-
      תאומה יוצאת מכדור הארץ במהירות $0.8c$ לכוכב במרחק 4 שנות אור, מסתובבת מיד וחוזרת באותה מהירות. אחיה נשאר על כדור
      הארץ. כל אחד מהם שולח אל השני אות רדיו בכל פעם שהשעון שלו מראה שנה שלמה נוספת מרגע היציאה. הזניחו את זמני ההאצה.
      עבדו בשנים ובשנות אור, כך ש-$c = 1$. במערכת של כדור הארץ המסע נמשך 10 שנים.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-9.6-1]
        prompt: בכמה שנים הזדקנה התאומה הנוסעת כשהיא חוזרת?
        answer: 6.0
        unit: שנים
        correctFeedback: >-
          נכון. במערכת של כדור הארץ, שאינרציאלית לכל אורך המסע, $\gamma = 5/3$, והנוסעת מזדקנת $10/\gamma = 6.0$ שנים.
        wrongFeedback: 'השתמשו בהתארכות זמן במערכת של כדור הארץ, שהיא אינרציאלית כל הזמן.'
        commonWrong:
          - value: 16.7
            feedback: 'כפלתם ב-$\gamma$. השעון של הנוסעת מודד את הזמן העצמי לאורך המסע שלה, והוא הקצר.'
            misconception: MC-9-proper-time-rest-frame
          - value: 10
            feedback: 'זה הזמן על כדור הארץ. בפגישה הנוסעת צעירה מאחיה.'
            misconception: MC-9-twins-same-age

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-9.4-2]
        prompt: >-
          בדרך ההליכה, כל כמה שנים, לפי השעון שלה, מקבלת הנוסעת אות מאחיה?
        answer: 3.0
        unit: שנים
        correctFeedback: >-
          נכון. היא מתרחקת מהמקור במהירות $\beta = 0.8$, ולכן הזמן בין האותות ארוך פי גורם דופלר
          $D = \sqrt{\dfrac{1 + \beta}{1 - \beta}} = \sqrt{\dfrac{1.8}{0.2}} = 3$: אות כל 3 שנים בשעון שלה. (במוסכמה של שיעור 9.4,
          עם $\beta > 0$ בהתקרבות, זה $f = f_0D(-0.8) = f_0/3$.) בדרך החזרה היא מתקרבת, ומקבלת אות כל שליש שנה.
        wrongFeedback: >-
          זה אפקט דופלר בהתרחקות במהירות $\beta$: הזמן בין אותות נקלטים ארוך פי $\sqrt{(1 + \beta)/(1 - \beta)}$ מהזמן בין
          השליחות.
        commonWrong:
          - value: 1.67
            feedback: >-
              זה $\gamma$ לבד, התארכות הזמן בלי ההשפעה של המרחק שגדל. כל אות צריך לעבור דרך ארוכה יותר מקודמו, וזה מוסיף
              עוד גורם $1 + \beta$: $\gamma(1 + \beta) = 3$.
          - value: 5.0
            feedback: >-
              זה $1/(1 - \beta)$, נוסחת הקול לשומע שמתרחק, כפי שהיא נראית במערכת של כדור הארץ: שם האותות מגיעים אליה כל 5
              שנים. חסר הפיגור של השעון שלה, פי $\gamma$ במערכת הזו: $5/\gamma = 3$.
            misconception: MC-9-classical-doppler
          - value: 1.8
            feedback: 'זה $1 + \beta$, דופלר של קול ממקור שמתרחק, בלי התארכות הזמן של שעון המקור.'
            misconception: MC-9-classical-doppler

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-9.4-2, OBJ-9.6-1]
        prompt: >-
          כמה אותות מאחיה מקבלת הנוסעת בכל המסע, הלוך וחזור? כללו אות שמגיע בדיוק ברגע הסיבוב או ברגע הפגישה.
        answer: 10
        unit: אותות
        correctFeedback: >-
          נכון. בדרך ההליכה, 3 שנים בקצב של אות ל-3 שנים: אות אחד, שמגיע בדיוק בסיבוב. בדרך החזרה, 3 שנים בקצב של 3 אותות
          לשנה: 9 אותות. יחד 10, כלומר האח הזדקן 10 שנים, כמו בחלק א. הספירה הזו לא תלויה באף מערכת: אלה מאורעות קבלה
          שאפשר לספור.
        wrongFeedback: >-
          חשבו בנפרד את הקצב בכל דרך, מחלק ב, וכפלו בזמן של הנוסעת בכל דרך, 3 שנים.
        commonWrong:
          - value: 6
            feedback: 'זה מספר השנים שעברו על הנוסעת. האותות של האח נשלחים כל שנה **שלו**, והוא הזדקן יותר.'
            misconception: MC-9-twins-same-age
          - value: 3.6
            feedback: >-
              חילקתם את 6 השנים שלה ב-$\gamma$. זה מה שהשעון של האח מתקדם בשתי הדרכים לפי קו הבו-זמניות של הנוסעת, בלי
              הקפיצה בסיבוב. האותות שהיא מקבלת
              סופרים את כל 10 השנים, וחושפים את הקפיצה: 9 מהם מגיעים בדרך החזרה.

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-9.6-1, OBJ-9.4-2]
        prompt: >-
          עכשיו מהצד של האח. (1) מתי, לפי השעון של כדור הארץ, רואה האח את אחותו מסתובבת? (2) כמה אותות הוא מקבל ממנה לפני
          הרגע הזה וכמה אחריו? האות שהיא שולחת ברגע הסיבוב מגיע אליו בדיוק ברגע הזה: ספרו אותו "לפני". הראו שהספירה מתאימה
          לחלק א. (3) במסע אחר היא יוצאת במהירות $\beta_1c$ לאותו כוכב, במרחק $L$, וחוזרת במהירות **אחרת**, $\beta_2c$. מצאו
          בביטוי כללי, עם $L$, $\beta_1$ ו-$\beta_2$, כמה שנים של השעון שלה האח רואה עוברות לפני שהוא רואה את הסיבוב וכמה
          אחרי, והראו שהסכום הוא הזמן העצמי של הנוסעת בכל המסע. בדקו את הביטוי בגבולות $\beta_2 = \beta_1$ ו-$\beta_2 \to 1$.
        hints:
          - 'הסיבוב קורה במערכת של כדור הארץ ב-$t = 5$ שנים, 4 שנות אור מכאן. מתי האור ממנו מגיע לכדור הארץ?'
          - 'ב-(3) עבדו כמו ב-(1) ו-(2), אבל עם $D(\beta_1)$ לפני שהאח רואה את הסיבוב ועם $D(\beta_2)$ אחריו. מתי היא חוזרת לכדור הארץ?'
        solution:
          - kind: law
            text: >-
              אפקט דופלר היחסותי: אותות ממקור שמתרחק במהירות $\beta c$ נקלטים בקצב קטן פי $D(\beta) = \sqrt{(1 + \beta)/(1 - \beta)}$
              מקצב השליחה בשעון של המקור, ואותות ממקור שמתקרב באותה מהירות בקצב גדול פי $D(\beta)$. האח נשאר במערכת אינרציאלית
              אחת, ולכן מותר לו לחשב הכול במערכת שלו, $S$, בשנים ובשנות אור ($c = 1$).
          - kind: manipulation
            text: >-
              הסיבוב הוא המאורע $x = L$, $t = L/v$. האור ממנו מגיע לכדור הארץ ב-$t_1 = \dfrac{L}{v} + \dfrac{L}{c} = 5 + 4 = 9$ שנים.
              עד אז האח מקבל את האותות של ההליכה בקצב $1/D = 1/3$ לשנה: $9/3 = 3$ אותות, האחרון בדיוק ב-9. בשנה האחרונה, מ-9
              עד 10, הוא מקבל את אותות החזרה בקצב $D = 3$ לשנה: עוד 3, האחרון ברגע הפגישה. יחד $6$, כמו 6 השנים של חלק א.
          - kind: manipulation
            text: >-
              מהירויות שונות: האח רואה את הסיבוב ב-$t_1 = \dfrac{L}{\beta_1} + L$, והיא חוזרת ב-$t_2 = \dfrac{L}{\beta_1} + \dfrac{L}{\beta_2}$.
              לפני הסיבוב הוא רואה עוברות
              $$N_1 = \frac{t_1}{D(\beta_1)} = \frac{L(1 + \beta_1)}{\beta_1}\sqrt{\frac{1 - \beta_1}{1 + \beta_1}} = \frac{L\sqrt{1 - \beta_1^2}}{\beta_1} = \frac{L}{\gamma_1\beta_1}$$
              שנים שלה, ואחריו, בזמן $t_2 - t_1 = L(1 - \beta_2)/\beta_2$,
              $$N_2 = (t_2 - t_1)\,D(\beta_2) = \frac{L(1 - \beta_2)}{\beta_2}\sqrt{\frac{1 + \beta_2}{1 - \beta_2}} = \frac{L}{\gamma_2\beta_2}$$
              כל אחד מהם הוא הזמן העצמי של הנוסעת בדרך אחת, $\dfrac{L}{\beta}$ שנים במערכת של כדור הארץ חלקי $\gamma$. הספירה
              של האח עובדת דרך אחרי דרך, גם כשהדרכים שונות.
          - kind: limit
            text: >-
              $\beta_2 = \beta_1$: $N_1 + N_2 = \dfrac{2L}{\gamma\beta}$, ועם $L = 4$, $\beta = 0.8$: $6$, כמו ב-(2). $\beta_2 \to 1$: $t_2 - t_1 \to 0$
              ו-$N_2 \to 0$: היא חוזרת צמודה לאור של הסיבוב, האח רואה את כל דרך החזרה ברגע אחד, ועל השעון שלה הדרך הזו לא
              לוקחת זמן.
          - kind: units
            text: >-
              $L/\beta$ בשנים כש-$L$ בשנות אור ו-$c = 1$ שנת אור לשנה. $D$ ו-$\gamma$ חסרי ממדים, ולכן $N_1$ ו-$N_2$ בשנים, שנה
              לכל אות.
          - kind: result
            text: >-
              האח רואה את הסיבוב אחרי 9 שנים, ומקבל 3 אותות לפניו ו-3 אחריו, יחד 6, כמו בחלק א. באופן כללי הוא רואה
              $\dfrac{L}{\gamma_1\beta_1}$ שנים שלה לפני שהוא רואה את הסיבוב ו-$\dfrac{L}{\gamma_2\beta_2}$ אחריו, ביחד הזמן העצמי שלה
              בכל המסע. שני התאומים מסכימים על כל ספירה.
        rubric:
          - text: מצאתי שהאור מהסיבוב מגיע לכדור הארץ אחרי 9 שנים, ולא אחרי 5.
          - text: ספרתי 3 אותות בקצב שליש לשנה ו-3 אותות בקצב 3 לשנה, וקיבלתי 6, כמו בחלק א.
          - text: >-
              במהירויות שונות מצאתי $t_1 = L/\beta_1 + L$ ו-$t_2 - t_1 = L(1 - \beta_2)/\beta_2$, וקיבלתי $L/(\gamma_1\beta_1)$ לפני
              ו-$L/(\gamma_2\beta_2)$ אחרי.
          - text: בדקתי שב-$\beta_2 = \beta_1$ חוזר $2L/(\gamma\beta)$, ושב-$\beta_2 \to 1$ דרך החזרה לא מוסיפה דבר.

  # ------------------------------------------------------------ 3: a probe launched from a ship
  - id: Q-9-bagrut-3
    type: bagrut
    title: גשושית שמשוגרת מחללית
    prompt: >-
      חללית מתרחקת מכדור הארץ במהירות $0.6c$ ומשגרת קדימה, הלאה מכדור הארץ, גשושית שנעה במהירות $0.6c$ ביחס לחללית. כל
      התנועות לאורך אותו קו. על הגשושית מנורה שמהבהבת פעם במיקרו-שנייה, $T_0 = 1.0\,\mu\text{s}$, בשעון של הגשושית.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-9.4-1]
        prompt: מה המהירות של הגשושית ביחס לכדור הארץ? ענו ביחידות של $c$.
        answer: 0.882
        unit: c
        correctFeedback: >-
          נכון. $u = \dfrac{0.6 + 0.6}{1 + 0.36}c = \dfrac{15}{17}c = 0.882c$.
        wrongFeedback: 'השתמשו בכלל החיבור היחסותי, $u = (u'' + v)/(1 + u''v/c^2)$.'
        commonWrong:
          - value: 1.2
            feedback: 'זה החיבור של גליליי, מהר מהאור. ביחסות מחלקים ב-$1 + u''v/c^2 = 1.36$.'
            misconception: MC-9-galilean-velocity-addition
          - value: 0.75
            feedback: 'במכנה מכפלת שתי המהירויות, $0.6\cdot0.6$, ולא $0.6$ לבד.'

      - label: ב
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-9.2-1]
        prompt: >-
          כמה זמן עובר במערכת של כדור הארץ בין שני הבהובים רצופים של המנורה (בין שני מאורעות הפליטה, לא בין שתי הקליטות)?
          ענו במיקרו-שניות.
        answer: 2.13
        unit: μs
        correctFeedback: >-
          נכון. עם $u = 15c/17$: $\gamma = \dfrac{1}{\sqrt{1 - 225/289}} = \dfrac{17}{8} = 2.125$, ולכן $\Delta t = \gamma T_0 = 2.13\,\mu\text{s}$.
          השעון של הגשושית נמצא בכל הבהוב, ולכן $T_0$ הוא זמן עצמי.
        wrongFeedback: 'מצאו את $\gamma$ של הגשושית ביחס לכדור הארץ, מהמהירות של חלק א, וכפלו בזמן העצמי.'
        commonWrong:
          - value: 1.56
            feedback: >-
              כפלתם את $\gamma$ של החללית ביחס לכדור הארץ ב-$\gamma$ של הגשושית ביחס לחללית, $1.25\cdot1.25$. גורמי לורנץ לא
              מוכפלים כך: צריך את $\gamma$ של המהירות היחסית בין הגשושית לכדור הארץ.
          - value: 0.471
            feedback: 'חילקתם ב-$\gamma$. הזמן העצמי הוא הקצר, ובמערכת של כדור הארץ עובר יותר.'
            misconception: MC-9-proper-time-rest-frame
          - value: 1.25
            feedback: 'זה $\gamma$ של החללית. מה שקובע הוא המהירות של הגשושית עצמה ביחס לכדור הארץ.'

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-9.4-2]
        prompt: כל כמה זמן **מגיע** הבהוב לטלסקופ על כדור הארץ? ענו במיקרו-שניות.
        answer: 4.0
        unit: μs
        correctFeedback: >-
          נכון. בין שני הבהובים הגשושית מתרחקת עוד $u\Delta t$, ולכן כל הבהוב צריך יותר זמן להגיע:
          $\Delta t(1 + u/c) = 2.125\cdot\dfrac{32}{17} = 4.0\,\mu\text{s}$. זה גורם דופלר בהתרחקות במהירות $15c/17$:
          $\sqrt{\dfrac{1 + 15/17}{1 - 15/17}} = \sqrt{16} = 4$.
        wrongFeedback: >-
          לזמן מחלק ב הוסיפו את הזמן שהאור צריך כדי לעבור את המרחק הנוסף שהגשושית התרחקה בין שני הבהובים.
        commonWrong:
          - value: 2.13
            feedback: >-
              זה הזמן בין הפליטות, מחלק ב. ההבהוב השני נפלט רחוק יותר, ולכן מגיע לטלסקופ מאוחר יותר עוד $u\Delta t/c$.
          - value: 1.88
            feedback: 'זה $T_0(1 + u/c)$, דופלר של קול בלי התארכות הזמן של שעון הגשושית.'
            misconception: MC-9-classical-doppler
          - value: 2.0
            feedback: >-
              זה גורם דופלר של $0.6c$ לבד. הגשושית מתרחקת במהירות $0.882c$, ולכן הגורם גדול יותר. בחלק ד תראו שהוא מכפלה של
              שני גורמים של $0.6c$.

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-9.4-1, OBJ-9.4-2]
        prompt: >-
          כאן $D(\beta) = \sqrt{(1 + \beta)/(1 - \beta)}$ הוא הגורם שבו הזמן בין הבהובים נקלטים ארוך מהזמן העצמי בין
          הפליטות, כשהמקור והקולט מתרחקים זה מזה במהירות $\beta c$ (במוסכמה של שיעור 9.4, עם $\beta > 0$ בהתקרבות, זה
          $1/D(-\beta)$, ושווה ל-$D(\beta)$). לקיצור נכתוב $D(u)$ במקום $D(u/c)$.

          (1) כל כמה זמן, בשעון החללית, עוברים בה ההבהובים שהגשושית שולחת אחורה?

          (2) נניח שהחללית שולחת הבהוב משלה בכל רגע שבו הבהוב של הגשושית עובר בה. הסבירו למה ההבהובים של החללית מגיעים
          לכדור הארץ באותם רגעים כמו ההבהובים של הגשושית, והסיקו ש-$D(u) = D(u')\,D(v)$.

          (3) גזרו מהשוויון הזה את כלל חיבור המהירויות, ובדקו את התוצאה בשני גבולות: מהירויות קטנות, ו-$u' = c$.
        hints:
          - >-
            ב-(2): הבהוב של הגשושית וההבהוב שהחללית שולחת באותו רגע יוצאים מאותו מקום, ושניהם נעים במהירות $c$ לכיוון כדור
            הארץ. האם אחד מהם יכול לעקוף את השני? ולגבי כדור הארץ, ההבהובים של החללית הם של מקור שמתרחק במהירות $v$.
          - 'כתבו $K = D(u'')^2D(v)^2$ ובודדו את $\beta$ מתוך $(1 + \beta)/(1 - \beta) = K$.'
        solution:
          - kind: law
            text: >-
              אפקט דופלר היחסותי: מקור שמתרחק במהירות $\beta c$ נקלט עם זמן בין הבהובים ארוך פי $D(\beta)$. כל ההבהובים נעים
              במהירות $c$ בכל מערכת.
          - kind: manipulation
            text: >-
              ההבהובים שהגשושית שולחת אחורה עוברים דרך החללית ואז מגיעים לכדור הארץ. הגשושית מתרחקת מהחללית במהירות $u'$,
              ולכן ההבהובים עוברים בחללית כל $D(u')T_0$ בשעון של החללית. הבהוב שהחללית שולחת ברגע שהבהוב של הגשושית עובר
              בה יוצא מאותו מקום באותו רגע, ושניהם נעים במהירות $c$: הם נוסעים יחד ומגיעים לכדור הארץ באותו רגע. לגבי כדור הארץ, ההבהובים שלה הם של מקור שמתרחק במהירות $v$, עם זמן
              עצמי $D(u')T_0$ בין ההבהובים, ולכן הם מגיעים בהפרש $D(v)D(u')T_0$. ההבהובים הישירים מגיעים בהפרש $D(u)T_0$,
              ולכן $D(u) = D(u')D(v)$.
          - kind: manipulation
            text: >-
              מעלים בריבוע: $\dfrac{1 + \beta}{1 - \beta} = K$, עם $K = \dfrac{(1 + \beta_1)(1 + \beta_2)}{(1 - \beta_1)(1 - \beta_2)}$,
              $\beta_1 = u'/c$, $\beta_2 = v/c$. מכאן $\beta = \dfrac{K - 1}{K + 1}$. במכנה המשותף,
              $(1 + \beta_1)(1 + \beta_2) - (1 - \beta_1)(1 - \beta_2) = 2(\beta_1 + \beta_2)$ ו-$(1 + \beta_1)(1 + \beta_2) + (1 - \beta_1)(1 - \beta_2) = 2(1 + \beta_1\beta_2)$,
              ולכן $$\beta = \frac{\beta_1 + \beta_2}{1 + \beta_1\beta_2},\qquad u = \frac{u' + v}{1 + u'v/c^2}$$
          - kind: limit
            text: >-
              מהירויות קטנות: $D(\beta) \approx 1 + \beta$, והמכפלה $(1 + \beta_1)(1 + \beta_2) \approx 1 + \beta_1 + \beta_2$, כלומר
              $u \approx u' + v$, החיבור של גליליי. ו-$u' = c$: $D(u') \to \infty$, ולכן גם $D(u) \to \infty$ ו-$u = c$, בכל $v$, כמו
              בהנחה השנייה.
          - kind: units
            text: >-
              $\beta_1$, $\beta_2$, $D$ ו-$K$ חסרי ממדים, ו-$u$ יוצא ביחידות של $c$, כמו מהירות.
          - kind: substitution
            text: >-
              כאן $D(0.6) = 2$, ולכן $D(u) = 4$, $K = 16$ ו-$\beta = \dfrac{15}{17} = 0.882$, כמו בחלק א, ו-$4\,\mu\text{s}$ בין
              הבהובים, כמו בחלק ג.
          - kind: result
            text: >-
              גורמי דופלר במהירויות על אותו קו מוכפלים, $D(u) = D(u')D(v)$, וכלל החיבור היחסותי נובע מזה. בגבול האיטי הוא חוזר
              לגליליי, ועם $u' = c$ הוא נותן $c$.
        rubric:
          - text: הסברתי שההבהובים עוברים בחללית בהפרש $D(u')T_0$ ומגיעים לכדור הארץ כמו הבהובים של מקור שמתרחק במהירות $v$.
          - text: העליתי בריבוע ובודדתי $\beta = (K - 1)/(K + 1)$, וקיבלתי את כלל החיבור.
          - text: בדקתי שבמהירויות קטנות יוצא $u' + v$, ושעם $u' = c$ יוצא $c$.
          - text: בדקתי במספרים שהתוצאה מתאימה לחלקים א ו-ג.

  # ------------------------------------------------------------ 4: a train in a tunnel, struck by lightning
  - id: Q-9-bagrut-4
    type: bagrut
    title: רכבת במנהרה וברקים בשני הקצוות
    prompt: >-
      רכבת שאורכה העצמי $400\,\text{m}$ נוסעת במהירות $0.6c$ דרך מנהרה שאורכה העצמי $360\,\text{m}$. במערכת של המנהרה,
      ברגע שהרכבת כולה בתוך המנהרה, בדיוק באמצעה, שני ברקים פוגעים בו-זמנית בפתח הכניסה ובפתח היציאה של המנהרה. השאלה
      היא אם ברק כלשהו פוגע ברכבת עצמה: פגיעה כזו הייתה משאירה עליה סימן חריכה.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-9.2-2]
        prompt: מה אורך הרכבת במערכת של המנהרה?
        answer: 320
        unit: m
        correctFeedback: >-
          נכון. $\gamma = 1.25$, ו-$400/1.25 = 320\,\text{m}$. הרכבת קצרה מהמנהרה ב-$40\,\text{m}$, ולכן במערכת הזו יש רגע
          שבו היא כולה בפנים, $20\,\text{m}$ מכל פתח.
        wrongFeedback: 'במערכת של המנהרה הרכבת נעה ומתקצרת: $L = L_0/\gamma$.'
        commonWrong:
          - value: 500
            feedback: 'כפלתם ב-$\gamma$. האורך העצמי של הרכבת הוא הארוך ביותר.'
            misconception: MC-9-moving-rod-longer
          - value: 256
            feedback: 'כפלתם ב-$1 - \beta^2 = 0.64$. ההתקצרות היא פי $\gamma$, עם שורש.'

      - label: ב
        type: mc
        points: 6
        level: mid
        qualitative: true
        objectives: [OBJ-9.1-2]
        prompt: >-
          נוסעת יושבת באמצע הרכבת. איזה הבזק מגיע אליה קודם, ואיזה ברק פגע קודם במערכת של הרכבת?
        choices:
          - text: ההבזק מפתח היציאה מגיע קודם, ובמערכת של הרכבת הברק בפתח היציאה גם פגע קודם.
            correct: true
            feedback: >-
              נכון. ברגע הפגיעות, במערכת של המנהרה, הנוסעת באמצע המנהרה ונעה לכיוון היציאה, ולכן ההבזק משם מגיע אליה ראשון:
              מאורע קליטה שכל המערכות מסכימות עליו. והסדר במערכת של הרכבת: מבין שני מאורעות בו-זמניים במערכת של המנהרה, זה
              שנמצא קדימה בכיוון התנועה של הרכבת קורה בה קודם, $\Delta t' = -\gamma v\Delta x/c^2$ (שיעור 9.3). בחלק ד תראו
              גם ששם שתי הפגיעות במרחקים שווים ממנה.
          - text: ההבזק מפתח היציאה מגיע קודם, אבל הברקים פגעו בו-זמנית גם במערכת של הרכבת.
            feedback: >-

  - id: Q-9-bagrut-3
    type: bagrut
    title: גשושית שמשוגרת מחללית
    prompt: >-
      חללית מתרחקת מכדור הארץ במהירות $0.6c$ ומשגרת קדימה, הלאה מכדור הארץ, גשושית שנעה במהירות $0.6c$ ביחס לחללית. כל
      התנועות לאורך אותו קו. על הגשושית מנורה שמהבהבת פעם במיקרו-שנייה, $T_0 = 1.0\,\mu\text{s}$, בשעון של הגשושית.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-9.4-1]
        prompt: מה המהירות של הגשושית ביחס לכדור הארץ? ענו ביחידות של $c$.
        answer: 0.882
        unit: c
        correctFeedback: >-
          נכון. $u = \dfrac{0.6 + 0.6}{1 + 0.36}c = \dfrac{15}{17}c = 0.882c$.
        wrongFeedback: 'השתמשו בכלל החיבור היחסותי, $u = (u'' + v)/(1 + u''v/c^2)$.'
        commonWrong:
          - value: 1.2
            feedback: 'זה החיבור של גליליי, מהר מהאור. ביחסות מחלקים ב-$1 + u''v/c^2 = 1.36$.'
            misconception: MC-9-galilean-velocity-addition
          - value: 0.75
            feedback: 'במכנה מכפלת שתי המהירויות, $0.6\cdot0.6$, ולא $0.6$ לבד.'

      - label: ב
        type: open
        points: 7
        level: mid
        standalone: false
        objectives: [OBJ-9.2-1, OBJ-9.4-1]
        prompt: >-
          כמה זמן עובר במערכת של כדור הארץ בין שני הבהובים רצופים של המנורה (בין שני מאורעות הפליטה, לא בין שתי הקליטות)?
          סמנו ב-$u'$ את המהירות של הגשושית ביחס לחללית, ב-$v$ את מהירות החללית וב-$u$ את המהירות של הגשושית ביחס לכדור
          הארץ, וב-$\gamma_u$, $\gamma_{u'}$, $\gamma_v$ את גורמי לורנץ שלהן. הראו מכלל החיבור ש-$\gamma_u = \gamma_{u'}\gamma_v\left(1 + u'v/c^2\right)$,
          בטאו בעזרתו את הזמן בין הפליטות באמצעות $T_0$, ובדקו את הביטוי בגבולות $v \to 0$ ו-$u' \to 0$. אחר כך הציבו,
          ובדקו מול המהירות של חלק א.
        hints:
          - 'כתבו $\beta_1 = u''/c$, $\beta_2 = v/c$, והציבו את כלל החיבור ב-$1 - \beta^2$ על מכנה משותף. המונה מתפרק למכפלה.'
          - 'איזה שעון נמצא בשני מאורעות הפליטה?'
        solution:
          - kind: law
            text: >-
              כלל החיבור היחסותי, $\beta = \dfrac{\beta_1 + \beta_2}{1 + \beta_1\beta_2}$ עם $\beta_1 = u'/c$ ו-$\beta_2 = v/c$
              (שיעור 9.4). השעון של הגשושית נמצא בכל פליטה, ולכן $T_0$ הוא זמן עצמי, ובמערכת של כדור הארץ
              $\Delta t = \gamma_uT_0$ (שיעור 9.2).
          - kind: manipulation
            text: >-
              $$1 - \beta^2 = \frac{(1 + \beta_1\beta_2)^2 - (\beta_1 + \beta_2)^2}{(1 + \beta_1\beta_2)^2} = \frac{1 - \beta_1^2 - \beta_2^2 + \beta_1^2\beta_2^2}{(1 + \beta_1\beta_2)^2} = \frac{(1 - \beta_1^2)(1 - \beta_2^2)}{(1 + \beta_1\beta_2)^2}$$
              האיברים $2\beta_1\beta_2$ מתבטלים. מוציאים שורש והופכים: $\gamma_u = \gamma_{u'}\gamma_v(1 + \beta_1\beta_2)$, ולכן
              $$\Delta t = \gamma_{u'}\gamma_v\left(1 + \frac{u'v}{c^2}\right)T_0$$
          - kind: manipulation
            text: >-
              גורמי לורנץ לא פשוט מוכפלים: $\gamma_{u'}\gamma_v$ לבד קטן מ-$\gamma_u$ כשהמהירויות באותו כיוון, והגורם
              $1 + u'v/c^2$ משלים את ההפרש. זו אותה מכפלה שבמכנה של כלל החיבור.
          - kind: limit
            text: >-
              $v \to 0$: $\gamma_v = 1$ והגורם $1 + u'v/c^2 \to 1$, ולכן $\gamma_u = \gamma_{u'}$: החללית נחה ביחס לכדור הארץ.
              $u' \to 0$: $\gamma_u = \gamma_v$: הגשושית נוסעת יחד עם החללית. ובמהירויות קטנות, עם $\gamma \approx 1 + \beta^2/2$,
              $\beta^2 \approx \beta_1^2 + \beta_2^2 + 2\beta_1\beta_2 = (\beta_1 + \beta_2)^2$: החיבור של גליליי.
          - kind: units
            text: '$u''v/c^2$ חסר ממדים, וגם כל $\gamma$, ולכן $\Delta t$ ביחידות של $T_0$.'
          - kind: substitution
            text: >-
              $\gamma_u = 1.25\cdot1.25\cdot(1 + 0.36) = 2.125$. בדיקה מחלק א, $u = 15c/17$:
              $\gamma_u = 1/\sqrt{1 - 225/289} = 17/8 = 2.125$. לכן $\Delta t = 2.125\cdot1.0\,\mu\text{s} = 2.13\,\mu\text{s}$.
          - kind: result
            text: >-
              $\gamma_u = \gamma_{u'}\gamma_v\left(1 + u'v/c^2\right)$, ו-$\Delta t = \gamma_uT_0 = 2.13\,\mu\text{s}$ בין שתי פליטות
              במערכת של כדור הארץ, ולא $1.25\cdot1.25 = 1.56\,\mu\text{s}$.
        rubric:
          - text: הצבתי את כלל החיבור ב-$1 - \beta^2$, ופירקתי את המונה ל-$(1 - \beta_1^2)(1 - \beta_2^2)$.
          - text: קיבלתי $\gamma_u = \gamma_{u'}\gamma_v(1 + u'v/c^2)$, ובדקתי את הגבולות $v \to 0$ ו-$u' \to 0$.
          - text: קבעתי ש-$T_0$ הוא זמן עצמי, וקיבלתי $2.13\,\mu\text{s}$, בהתאמה ל-$\gamma = 17/8$ של המהירות מחלק א.


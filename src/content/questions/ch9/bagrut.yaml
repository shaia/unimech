      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-9.4-2, OBJ-9.2-1]
        prompt: >-
          בדרך ההליכה, כל כמה זמן, לפי השעון שלה, מקבלת הנוסעת אות מאחיה? גזרו ביטוי כללי באמצעות הזמן $T$ בין שני אותות
          בשעון של האח ו-$\beta$, בחישוב במערכת של כדור הארץ, ואחר כך הציבו $T = 1$ שנה ו-$\beta = 0.8$. בדקו את הביטוי
          בגבולות $\beta \to 0$ ו-$\beta \to 1$.
        hints:
          - 'במערכת של כדור הארץ, האות ה-$n$ יוצא מ-$x = 0$ ברגע $t = nT$, והנוסעת נמצאת ב-$x = \beta t$. מתי האות משיג אותה?'
          - 'שתי קליטות רצופות קורות שתיהן אצל הנוסעת. איזה שעון מודד ביניהן זמן עצמי?'
        solution:
          - kind: law
            text: >-
              נעבוד במערכת כדור הארץ $S$, בשנים ובשנות אור ($c = 1$). האח ב-$x = 0$ שולח את האות ה-$n$ ברגע $t = nT$, ובדרך
              ההליכה הנוסעת ב-$x = \beta t$. האות נע במהירות $c$ במערכת $S$. שתי קליטות רצופות קורות שתיהן אצל הנוסעת, ולכן השעון שלה מודד ביניהן זמן עצמי,
              $\Delta\tau = \Delta t/\gamma$ (שיעור 9.2).
          - kind: manipulation
            text: >-
              האות ה-$n$ נמצא ב-$x = t - nT$. הוא משיג אותה כש-$t - nT = \beta t$, כלומר ב-$t_n = \dfrac{nT}{1 - \beta}$. לכן
              $\Delta t = t_{n+1} - t_n = \dfrac{T}{1 - \beta}$, ובשעון שלה
              $$\Delta\tau = \frac{T\sqrt{1 - \beta^2}}{1 - \beta} = T\sqrt{\frac{1 + \beta}{1 - \beta}}$$
          - kind: manipulation
            text: >-
              שתי השפעות נכנסות: $T/(1 - \beta)$ הוא העיכוב של אות שרודף אחרי מישהי שמתרחקת, כמו בקול, והשעון שלה מפגר פי
              $\gamma$. נוסחה קלאסית, $T/(1 - \beta)$ או $T(1 + \beta)$, מחמיצה את אחת מהן. התוצאה היא גורם דופלר
              $D(\beta)$ בהתרחקות (במוסכמה של שיעור 9.4, עם $\beta > 0$ בהתקרבות, $f = f_0D(-0.8) = f_0/3$).
          - kind: limit
            text: >-
              כש-$\beta \to 0$, $\Delta\tau \to T$: אות בכל שנה, כמו שנשלח. כש-$\beta \to 1$, $\Delta\tau \to \infty$: אות לא יכול
              להשיג נוסעת שבורחת כמעט במהירות האור.
          - kind: units
            text: '$\beta$ חסר ממדים, ולכן $\Delta\tau$ ביחידות של $T$, שנים.'
          - kind: substitution
            text: >-
              $\Delta\tau = 1\cdot\sqrt{\dfrac{1.8}{0.2}} = 3.0$ שנים. במערכת של כדור הארץ האותות מגיעים אליה כל $1/0.2 = 5$
              שנים, ו-$5/\gamma = 5\cdot0.6 = 3$. בדרך החזרה היא מתקרבת ($\beta \to -\beta$), ומקבלת אות כל שליש שנה.
          - kind: result
            text: '$\Delta\tau = T\sqrt{(1 + \beta)/(1 - \beta)} = 3.0$ שנים בשעון של הנוסעת: אות אחד כל 3 שנים בדרך ההליכה.'
        rubric:
          - text: מצאתי במערכת של כדור הארץ את רגעי הקליטה, $t_n = nT/(1 - \beta)$, וחילקתי את ההפרש ב-$\gamma$.
          - text: הגעתי ל-$T\sqrt{(1 + \beta)/(1 - \beta)}$ ובדקתי את הגבולות $\beta \to 0$ ו-$\beta \to 1$.
          - text: קיבלתי $3.0$ שנים, ולא $5$ (בלי התארכות הזמן) או $1.67$ ($\gamma$ לבד).


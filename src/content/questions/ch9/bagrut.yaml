          - value: 1.88
            feedback: 'זה $T_0(1 + u/c)$, דופלר של קול בלי התארכות הזמן של שעון הגשושית.'
            misconception: MC-9-classical-doppler
          - value: 2.0
            feedback: >-
              זה גורם דופלר של $0.6c$ לבד. הגשושית מתרחקת במהירות $0.882c$, ולכן הגורם גדול יותר. בחלק ד תראו שהוא מכפלה של
              שני גורמים של $0.6c$.

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-9.4-1, OBJ-9.4-2]
        prompt: >-
          כאן $D(\beta) = \sqrt{(1 + \beta)/(1 - \beta)}$ הוא הגורם שבו הזמן בין הבהובים נקלטים ארוך מהזמן העצמי בין
          הפליטות, כשהמקור והקולט מתרחקים זה מזה במהירות $\beta c$ (במוסכמה של שיעור 9.4, עם $\beta > 0$ בהתקרבות, זה
          $1/D(-\beta)$, ושווה ל-$D(\beta)$). לקיצור נכתוב $D(u)$ במקום $D(u/c)$.

          (1) כל כמה זמן, בשעון החללית, עוברים בה ההבהובים שהגשושית שולחת אחורה?

          (2) נניח שהחללית שולחת הבהוב משלה בכל רגע שבו הבהוב של הגשושית עובר בה. הסבירו למה ההבהובים של החללית מגיעים
          לכדור הארץ באותם רגעים כמו ההבהובים של הגשושית, והסיקו ש-$D(u) = D(u')\,D(v)$.

          (3) גזרו מהשוויון הזה את כלל חיבור המהירויות, ובדקו את התוצאה בשני גבולות: מהירויות קטנות, ו-$u' = c$.
        hints:
          - >-
            ב-(2): הבהוב של הגשושית וההבהוב שהחללית שולחת באותו רגע יוצאים מאותו מקום, ושניהם נעים במהירות $c$ לכיוון כדור
            הארץ. האם אחד מהם יכול לעקוף את השני? ולגבי כדור הארץ, ההבהובים של החללית הם של מקור שמתרחק במהירות $v$.
          - 'כתבו $K = D(u'')^2D(v)^2$ ובודדו את $\beta$ מתוך $(1 + \beta)/(1 - \beta) = K$.'
        solution:
          - kind: law
            text: >-
              אפקט דופלר היחסותי: מקור שמתרחק במהירות $\beta c$ נקלט עם זמן בין הבהובים ארוך פי $D(\beta)$. כל ההבהובים נעים
              במהירות $c$ בכל מערכת.
          - kind: manipulation
            text: >-
              ההבהובים שהגשושית שולחת אחורה עוברים דרך החללית ואז מגיעים לכדור הארץ. הגשושית מתרחקת מהחללית במהירות $u'$,
              ולכן ההבהובים עוברים בחללית כל $D(u')T_0$ בשעון של החללית. הבהוב שהחללית שולחת ברגע שהבהוב של הגשושית עובר
              בה יוצא מאותו מקום באותו רגע, ושניהם נעים במהירות $c$: הם נוסעים יחד ומגיעים לכדור הארץ באותו רגע. לגבי כדור הארץ, ההבהובים שלה הם של מקור שמתרחק במהירות $v$, עם זמן
              עצמי $D(u')T_0$ בין ההבהובים, ולכן הם מגיעים בהפרש $D(v)D(u')T_0$. ההבהובים הישירים מגיעים בהפרש $D(u)T_0$,
              ולכן $D(u) = D(u')D(v)$.
          - kind: manipulation
            text: >-
              מעלים בריבוע: $\dfrac{1 + \beta}{1 - \beta} = K$, עם $K = \dfrac{(1 + \beta_1)(1 + \beta_2)}{(1 - \beta_1)(1 - \beta_2)}$,
              $\beta_1 = u'/c$, $\beta_2 = v/c$. מכאן $\beta = \dfrac{K - 1}{K + 1}$. במכנה המשותף,
              $(1 + \beta_1)(1 + \beta_2) - (1 - \beta_1)(1 - \beta_2) = 2(\beta_1 + \beta_2)$ ו-$(1 + \beta_1)(1 + \beta_2) + (1 - \beta_1)(1 - \beta_2) = 2(1 + \beta_1\beta_2)$,
              ולכן $$\beta = \frac{\beta_1 + \beta_2}{1 + \beta_1\beta_2},\qquad u = \frac{u' + v}{1 + u'v/c^2}$$
          - kind: limit
            text: >-
              מהירויות קטנות: $D(\beta) \approx 1 + \beta$, והמכפלה $(1 + \beta_1)(1 + \beta_2) \approx 1 + \beta_1 + \beta_2$, כלומר
              $u \approx u' + v$, החיבור של גליליי. ו-$u' = c$: $D(u') \to \infty$, ולכן גם $D(u) \to \infty$ ו-$u = c$, בכל $v$, כמו
              בהנחה השנייה.
          - kind: units
            text: >-
              $\beta_1$, $\beta_2$, $D$ ו-$K$ חסרי ממדים, ו-$u$ יוצא ביחידות של $c$, כמו מהירות.
          - kind: substitution
            text: >-
              כאן $D(0.6) = 2$, ולכן $D(u) = 4$, $K = 16$ ו-$\beta = \dfrac{15}{17} = 0.882$, כמו בחלק א, ו-$4\,\mu\text{s}$ בין
              הבהובים, כמו בחלק ג.
          - kind: result
            text: >-
              גורמי דופלר במהירויות על אותו קו מוכפלים, $D(u) = D(u')D(v)$, וכלל החיבור היחסותי נובע מזה. בגבול האיטי הוא חוזר
              לגליליי, ועם $u' = c$ הוא נותן $c$.
        rubric:
          - text: הסברתי שההבהובים עוברים בחללית בהפרש $D(u')T_0$ ומגיעים לכדור הארץ כמו הבהובים של מקור שמתרחק במהירות $v$.
          - text: העליתי בריבוע ובודדתי $\beta = (K - 1)/(K + 1)$, וקיבלתי את כלל החיבור.
          - text: בדקתי שבמהירויות קטנות יוצא $u' + v$, ושעם $u' = c$ יוצא $c$.
          - text: בדקתי במספרים שהתוצאה מתאימה לחלקים א ו-ג.

  # ------------------------------------------------------------ 4: a train in a tunnel, struck by lightning
  - id: Q-9-bagrut-4
    type: bagrut
    title: רכבת במנהרה וברקים בשני הקצוות
    prompt: >-
      רכבת שאורכה העצמי $L_0 = 400\,\text{m}$ נוסעת במהירות $v = 0.6c$ דרך מנהרה שאורכה העצמי $\ell_0 = 360\,\text{m}$. במערכת של המנהרה,
      ברגע שהרכבת כולה בתוך המנהרה, בדיוק באמצעה, שני ברקים פוגעים בו-זמנית בפתח הכניסה ובפתח היציאה של המנהרה. השאלה
      היא אם ברק כלשהו פוגע ברכבת עצמה: פגיעה כזו הייתה משאירה עליה סימן חריכה.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-9.2-2]
        prompt: מה אורך הרכבת במערכת של המנהרה?
        answer: 320
        unit: m
        correctFeedback: >-
          נכון. $\gamma = 1.25$, ו-$400/1.25 = 320\,\text{m}$. הרכבת קצרה מהמנהרה ב-$40\,\text{m}$, ולכן במערכת הזו יש רגע
          שבו היא כולה בפנים, $20\,\text{m}$ מכל פתח.
        wrongFeedback: 'במערכת של המנהרה הרכבת נעה ומתקצרת: $L = L_0/\gamma$.'
        commonWrong:
          - value: 500
            feedback: 'כפלתם ב-$\gamma$. האורך העצמי של הרכבת הוא הארוך ביותר.'
            misconception: MC-9-moving-rod-longer
          - value: 256
            feedback: 'כפלתם ב-$1 - \beta^2 = 0.64$. ההתקצרות היא פי $\gamma$, עם שורש.'

      - label: ב
        type: mc
        points: 5
        level: mid
        qualitative: true
        objectives: [OBJ-9.1-2]
        prompt: >-
          נוסעת יושבת באמצע הרכבת. איזה הבזק מגיע אליה קודם, ואיזה ברק פגע קודם במערכת של הרכבת?
        choices:
          - text: ההבזק מפתח היציאה מגיע קודם, ובמערכת של הרכבת הברק בפתח היציאה גם פגע קודם.
            correct: true
            feedback: >-
              נכון. ברגע הפגיעות, במערכת של המנהרה, הנוסעת באמצע המנהרה ונעה לכיוון היציאה, ולכן ההבזק משם מגיע אליה ראשון:
              מאורע קליטה שכל המערכות מסכימות עליו. והסדר במערכת של הרכבת: מבין שני מאורעות בו-זמניים במערכת של המנהרה, זה
              שנמצא קדימה בכיוון התנועה של הרכבת קורה בה קודם, $\Delta t' = -\gamma v\Delta x/c^2$ (שיעור 9.3). בחלק ד תראו
              גם ששם שתי הפגיעות במרחקים שווים ממנה.
          - text: ההבזק מפתח היציאה מגיע קודם, אבל הברקים פגעו בו-זמנית גם במערכת של הרכבת.
            feedback: >-
              ההבדל בזמני ההגעה אינו רק עיכוב של האות. הסדר במערכת של הרכבת נקבע בטרנספורמציה: $\Delta t' = -\gamma v\Delta x/c^2 \ne 0$
              כש-$\Delta t = 0$ ו-$\Delta x \ne 0$, והפגיעה ביציאה, קדימה בכיוון התנועה, קודמת. הפגיעות בו-זמניות רק במערכת של
              המנהרה.
            misconception: MC-9-simultaneity-is-signal-delay
          - text: שני ההבזקים מגיעים אליה יחד, כי הברקים פגעו בו-זמנית.
            feedback: >-
              הם בו-זמניים במערכת של המנהרה, שבה הנוסעת נעה לקראת היציאה ומתרחקת מהכניסה. לכן ההבזקים לא מגיעים אליה יחד,
              וזו עובדה שכל המערכות מסכימות עליה.
            misconception: MC-9-simultaneity-absolute
          - text: ההבזק מפתח הכניסה מגיע קודם, כי הוא נע בכיוון התנועה של הרכבת.
            feedback: >-
              האור מהכניסה צריך לרדוף אחרי נוסעת שמתרחקת ממנו, ולכן הוא מגיע אחרון. גם הוא נע במהירות $c$ בכל מערכת.
            misconception: MC-9-light-speed-adds-to-source

      - label: ג
        type: open
        points: 7
        level: mid
        objectives: [OBJ-9.3-2, OBJ-9.3-1]
        prompt: >-
          כמה זמן עובר במערכת של הרכבת בין שתי הפגיעות, ואיזו מהן קודמת? בטאו את התשובה באמצעות $\ell_0$, $v$ ו-$c$, ואחר כך
          הציבו וענו במיקרו-שניות. בדקו את הביטוי בגבול $v \ll c$.
        hints:
          - 'במערכת של המנהרה שימו את הכניסה ב-$x = 0$ ואת היציאה ב-$x = \ell_0$, ושתי הפגיעות ב-$t = 0$.'
          - 'איזה $\Delta x$ נכנס לטרנספורמציה: האורך של המנהרה במערכת שבה הפגיעות בו-זמניות, או במערכת של הרכבת?'
        solution:
          - kind: law
            text: >-
              טרנספורמציית לורנץ של הזמן, $t' = \gamma\left(t - vx/c^2\right)$, כש-$S'$, הרכבת, נעה ב-$+v$. במערכת של המנהרה,
              $S$, הפגיעה בכניסה ב-$(x, t) = (0, 0)$, והפגיעה ביציאה ב-$(\ell_0, 0)$.
          - kind: manipulation
            text: >-
              בכניסה $t' = 0$, וביציאה $t' = -\gamma v\ell_0/c^2$. לכן
              $$\Delta t' = t'_{\text{in}} - t'_{\text{out}} = \frac{\gamma v\ell_0}{c^2} > 0$$
              במערכת של הרכבת הפגיעה ביציאה, קדימה בכיוון התנועה, קודמת, כמו בחלק ב. ה-$\Delta x$ שנכנס הוא $\ell_0$, המרחק
              במערכת שבה $\Delta t = 0$, ולא אורך המנהרה במערכת של הרכבת, $288\,\text{m}$.
          - kind: limit
            text: >-
              כש-$v \ll c$, $\gamma \approx 1$ ו-$\Delta t' \approx v\ell_0/c^2 \to 0$: במהירויות רגילות הבו-זמניות מוחלטת, כמו אצל
              גליליי. ההיסט הוא מסדר ראשון ב-$v/c$, וגדל עם המרחק $\ell_0$ בין המאורעות.
          - kind: units
            text: '$\dfrac{v\ell_0}{c^2}$ ביחידות $\dfrac{\text{m/s}\cdot\text{m}}{\text{m}^2/\text{s}^2} = \text{s}$, ו-$\gamma$ חסר ממדים.'
          - kind: substitution
            text: >-
              $\Delta t' = 1.25\cdot\dfrac{0.6\cdot360}{3.0\cdot10^8} = 9.0\cdot10^{-7}\,\text{s} = 0.90\,\mu\text{s}$. (בלי $\gamma$,
              או עם $288\,\text{m}$ ובלי $\gamma$, היה יוצא $0.72$ או $0.576\,\mu\text{s}$.)
          - kind: result
            text: >-
              $\Delta t' = \gamma v\ell_0/c^2 = 0.90\,\mu\text{s}$: במערכת של הרכבת הברק בפתח היציאה פוגע $0.90\,\mu\text{s}$ לפני
              הברק בפתח הכניסה.
        rubric:
          - text: הצבתי בטרנספורמציה של הזמן $\Delta t = 0$ ו-$\Delta x = \ell_0$, אורך המנהרה במערכת שלה, ולא $288\,\text{m}$.
          - text: קבעתי שהפגיעה ביציאה קודמת, בהתאמה לחלק ב.
          - text: בדקתי שב-$v \ll c$, $\Delta t' \approx v\ell_0/c^2 \to 0$, וקיבלתי $0.90\,\mu\text{s}$.

      - label: ד
        type: open
        points: 8
        level: bagrut
        objectives: [OBJ-9.6-2, OBJ-9.5-1]
        prompt: >-
          במערכת של המנהרה, $S$, הברקים לא פוגעים ברכבת: הם פוגעים $20\,\text{m}$ לפני החזית שלה ו-$20\,\text{m}$ מאחורי הקצה
          האחורי שלה. אבל במערכת של הרכבת, $S'$, שנעה ב-$+v$, המנהרה באורך $288\,\text{m}$ בלבד, והרכבת באורך $400\,\text{m}$.
          (1) מצאו ב-$S'$ את המקום והזמן של כל פגיעה, והראו שגם שם אף ברק לא פוגע ברכבת. (2) חשבו את האינטרוול בין שתי
          הפגיעות, סווגו אותו, והסבירו למה סדר הפגיעות יכול להיות שונה בשתי המערכות. (3) מצאו בביטוי כללי, באמצעות $L_0$
          ו-$\ell_0$, את המהירות $\beta^*$ שממנה הרכבת נכנסת כולה למנהרה במערכת של המנהרה, ובדקו אותו בגבולות $\ell_0 \to L_0$
          ו-$\ell_0 \ll L_0$. הראו שבמהירות הזו הברקים פוגעים בדיוק בשני הקצוות של הרכבת, בשתי המערכות. ב-$S'$ זכרו שהמנהרה
          זזה בין שתי הפגיעות.
        hints:
          - 'ב-$S$ שימו את הכניסה ב-$x = 0$ ואת היציאה ב-$x = 360\,\text{m}$, והפגיעות ב-$t = 0$. איפה הקצוות של הרכבת?'
          - 'במערכת של הרכבת הקצוות שלה נחים, ב-$x'' = \gamma x$ של המקום שלהם ברגע $t = 0$.'
        solution:
          - kind: law
            text: >-
              טרנספורמציית לורנץ, $x' = \gamma(x - vt)$ ו-$t' = \gamma\left(t - vx/c^2\right)$, והאינטרוול $s^2 = c^2\Delta t^2 - \Delta x^2$,
              שזהה בשתי המערכות. אם ברק פוגע ברכבת זה מאורע במקום אחד, ולכן כל המערכות מסכימות עליו.
          - kind: manipulation
            text: >-
              במערכת של המנהרה, ב-$t = 0$ הרכבת בין $x = 20\,\text{m}$ ל-$x = 340\,\text{m}$. במערכת של הרכבת הקצוות נחים, ב-$x' = \gamma x$:
              הקצה האחורי ב-$25\,\text{m}$ והחזית ב-$425\,\text{m}$, אורך $400\,\text{m}$. הפגיעה בכניסה, $(x, t) = (0, 0)$, עוברת ל-$x' = 0$,
              $t' = 0$: $25\,\text{m}$ מאחורי הקצה האחורי. הפגיעה ביציאה, $(360\,\text{m}, 0)$, עוברת ל-$x' = 450\,\text{m}$ ולזמן
              $t' = -\gamma v\cdot360/c^2$, כלומר $0.90\,\mu\text{s}$ לפני הפגיעה בכניסה: $25\,\text{m}$ לפני החזית. בזמן הזה המנהרה
              זזה אחורה $0.6c\cdot0.90\,\mu\text{s} = 162\,\text{m}$. אף ברק לא פוגע ברכבת.
          - kind: manipulation
            text: >-
              $s^2 = c^2\cdot0^2 - (360\,\text{m})^2 = -1.3\cdot10^5\,\text{m}^2 < 0$: אינטרוול מרחבי. במערכת של הרכבת
              $c^2\Delta t'^2 - \Delta x'^2 = 270^2 - 450^2 = -360^2\,\text{m}^2$, אותו מספר. לזוג מרחבי אין סדר זמנים מוחלט: במנהרה
              הפגיעות בו-זמניות, ברכבת היציאה קודמת. אף פגיעה לא גורמת לשנייה, ולכן אין סתירה.
          - kind: manipulation
            text: >-
              הרכבת נכנסת למנהרה במערכת של המנהרה כש-$L_0/\gamma \le \ell_0$, כלומר $\gamma \ge L_0/\ell_0$, ו-$1 - \beta^2 \le (\ell_0/L_0)^2$:
              $$\beta^* = \sqrt{1 - \left(\frac{\ell_0}{L_0}\right)^2},\qquad \gamma^* = \frac{L_0}{\ell_0}$$
              במהירות הזו בדיוק הרכבת באורך $\ell_0$ במערכת של המנהרה, ושני הברקים פוגעים בדיוק בשני הקצוות שלה. במערכת של
              הרכבת המנהרה באורך $\ell_0/\gamma^*$, ובין הפגיעות, $\gamma^*\beta^*\ell_0/c$ לפי חלק ג, היא זזה
              $\beta^*c\cdot\gamma^*\beta^*\ell_0/c = \gamma^*\beta^{*2}\ell_0$. יחד
              $$\frac{\ell_0}{\gamma^*} + \gamma^*\beta^{*2}\ell_0 = \gamma^*\ell_0\left(\frac{1}{\gamma^{*2}} + \beta^{*2}\right) = \gamma^*\ell_0 = L_0$$
              שוב בדיוק הקצוות. ההסכמה על "נגע או לא נגע" נשמרת גם בגבול.
          - kind: limit
            text: >-
              כש-$\ell_0 \to L_0$, $\beta^* \to 0$: מנהרה ארוכה כמו הרכבת מכילה אותה כבר במנוחה. כש-$\ell_0 \ll L_0$, $\beta^* \to 1$:
              כדי להכניס רכבת ארוכה למנהרה קצרה צריך מהירות קרובה ל-$c$, אבל תמיד קטנה ממנה.
          - kind: units
            text: >-
              $vx/c^2$ ביחידות $\dfrac{\text{m/s}\cdot\text{m}}{\text{m}^2/\text{s}^2} = \text{s}$, זמן, ו-$\gamma$ חסר ממדים. $s^2$ במטרים
              רבועים, כמו $c^2\Delta t^2$. ב-$\beta^*$ נכנס רק היחס $\ell_0/L_0$, חסר ממדים, כמו שמהירות ביחידות של $c$ צריכה.
          - kind: substitution
            text: >-
              $\beta^* = \sqrt{1 - (360/400)^2} = \sqrt{0.19} = 0.436$, $\gamma^* = 10/9$. במערכת של הרכבת המנהרה באורך
              $360\cdot0.9 = 324\,\text{m}$, והיא זזה $\tfrac{10}{9}\cdot0.19\cdot360 = 76\,\text{m}$ בין הפגיעות: $324 + 76 = 400\,\text{m}$.
          - kind: result
            text: >-
              במערכת של הרכבת הברק ביציאה פוגע $25\,\text{m}$ לפני החזית, ו-$0.90\,\mu\text{s}$ אחר כך הברק בכניסה פוגע
              $25\,\text{m}$ מאחורי הקצה האחורי. הרכבת לא נפגעת בשתי המערכות. האינטרוול מרחבי, $s^2 = -(360\,\text{m})^2$, ולכן סדר הפגיעות
              תלוי במערכת והוא לא יוצר סתירה. הרכבת נכנסת כולה למנהרה מ-$\beta^* = \sqrt{1 - (\ell_0/L_0)^2} = 0.436$, ובמהירות הזו
              הברקים פוגעים בדיוק בקצוות שלה, בשתי המערכות.
        rubric:
          - text: מצאתי את הקצוות של הרכבת במערכת שלה, $25\,\text{m}$ ו-$425\,\text{m}$, ואת המקום והזמן של כל פגיעה בטרנספורמציה.
          - text: הראיתי ששתי הפגיעות מחוץ לרכבת, $25\,\text{m}$ לפני החזית ו-$25\,\text{m}$ מאחורי הקצה האחורי.
          - text: חישבתי $s^2 < 0$ בשתי המערכות, סיווגתי את האינטרוול כמרחבי, והסברתי שלכן הסדר בזמן יכול להתהפך.
          - text: >-
              מצאתי $\beta^* = \sqrt{1 - (\ell_0/L_0)^2} = 0.436$, בדקתי את הגבולות $\ell_0 \to L_0$ ו-$\ell_0 \ll L_0$, והראיתי ש-$\ell_0/\gamma^* + \gamma^*\beta^{*2}\ell_0 = L_0$:
              במהירות הזו הברקים פוגעים בדיוק בקצוות, בשתי המערכות.

  # ------------------------------------------------------------ 5: a clock on a satellite (joins 9.2 with 2.6, 6.4–6.6, 0.3)
  - id: Q-9-bagrut-5
    type: bagrut
    title: שעון על לוויין
    prompt: >-
      לוויין נושא שעון ונע סביב כדור הארץ, שמסתו $M$, במסלול מעגלי ברדיוס $r$. $S$ היא מערכת הייחוס של מרכז כדור הארץ,
      ונחשיב אותה אינרציאלית (מזניחים את הסיבוב של כדור הארץ ואת התנועה שלו סביב השמש), ו-$t$ הוא הזמן שמראים שעונים
      שנחים ב-$S$ ומסונכרנים בה. בודקים כאן רק את ההשפעה של **התנועה** על קצב השעון, ומתעלמים מההשפעה של הכבידה עצמה על
      קצב שעונים, שהיא נושא של תורת היחסות הכללית, מחוץ לקורס. כמו בקו העולם השבור של שיעור 9.6, שסוכמים לאורכו את הזמן
      העצמי קטע אחרי קטע, שעון שנע מתקדם בכל פרק זמן קצר $dt$ של $S$ בזמן עצמי $d\tau = \sqrt{1 - v^2/c^2}\,dt$, כאשר $v$
      גודל המהירות שלו באותו רגע, גם כשהכיוון שלה משתנה.
    parts:
      - label: א
        type: twotier
        points: 5
        level: basic
        qualitative: true
        objectives: [OBJ-9.2-1, OBJ-2.6-1]
        prompt: >-
          לוויין אחד נע במסלול מעגלי ברדיוס $r$, ולוויין שני במסלול מעגלי ברדיוס $4r$. השעון של איזה מהם מפגר יותר אחרי
          אותו זמן $t$ של המערכת $S$?
        choices:
          - text: הלוויין הנמוך, ברדיוס $r$.
            correct: true
            feedback: >-
              נכון. הקצב של כל שעון תלוי רק בגודל המהירות שלו, והלוויין הנמוך מהיר יותר: $v = \sqrt{GM/r}$, פי 2 מהגבוה.
          - text: הלוויין הגבוה, ברדיוס $4r$.
            feedback: >-
              הגבוה עובר בכל הקפה דרך ארוכה יותר, אבל השאלה היא על אותו זמן $t$, והוא איטי יותר: $v = \sqrt{GM/r}$ קטנה
              כש-$r$ גדל. (בחלק ג תראו שבכל **הקפה** דווקא הגבוה מפגר יותר, כי ההקפה שלו ארוכה פי 8.)
          - text: אף אחד מהם. כל שעון נח במערכת של עצמו, ומתקתק שם בקצב רגיל.
            feedback: >-
              נכון שבמערכת שבה השעון נח הוא מתקתק בקצב רגיל, אבל ההשוואה כאן היא לזמן $t$ של $S$, שבה הוא נע. ב-$S$ הוא
              מתקדם רק $\sqrt{1 - v^2/c^2}\,dt$ בכל $dt$.
        reasonPrompt: ומה הנימוק?
        reasons:
          - text: >-
              $d\tau/dt = \sqrt{1 - v^2/c^2}$ תלוי רק בגודל המהירות, ובמסלול מעגלי המהירות קטנה כשהרדיוס גדל.
            correct: true
            feedback: >-
              זה הנימוק. מהחוק השני בכיוון הרדיאלי, $GMm/r^2 = mv^2/r$, ולכן $v = \sqrt{GM/r}$: ברדיוס $4r$ המהירות חצי,
              והפיגור ליחידת זמן, שתלוי ב-$v^2$, קטן פי 4.
          - text: לתאוצה הצנטריפטלית של הלוויין הנמוך, $GM/r^2$, גודל גדול יותר, והתאוצה היא שמאטה את השעון.
            feedback: >-
              בנוסחה $d\tau = \sqrt{1 - v^2/c^2}\,dt$ אין תאוצה: שני שעונים באותה מהירות מתקדמים באותו קצב, גם אם רק אחד
              מהם מאיץ. במסלולים מעגליים המהירות והתאוצה גדלות יחד כש-$r$ קטן, אבל הסיבה היא המהירות.
            misconception: MC-9-acceleration-slows-clock
          - text: הלוויין הנמוך קרוב יותר לכדור הארץ, והכבידה החזקה שם מאטה את השעון שלו.
            feedback: >-
              בשאלה הזו מתעלמים מההשפעה של הכבידה על קצב השעונים. הפיגור כאן נובע רק מהתנועה, דרך גודל המהירות.
          - text: ההשפעות מתקזזות, כי גם מהלוויין השעונים של $S$ נראים מפגרים.
            feedback: >-
              כל קביעה כזו נכונה רק במערכת אינרציאלית אחת, והלוויין משנה כל הזמן את כיוון התנועה שלו: הוא לא נח באף מערכת
              אינרציאלית אחת. ב-$S$, שהיא אינרציאלית, החשבון פשוט, ובכל פעם שהלוויין חוזר לאותה נקודה של $S$ השעון שלו
              מראה פחות מהשעון של $S$ שנח שם, כמו התאום הנוסע.
            misconception: MC-9-twins-same-age
        hints:
          - 'מה המהירות של לוויין במסלול מעגלי? כתבו את החוק השני בכיוון הרדיאלי.'

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-2.6-1, OBJ-6.5-2, OBJ-9.2-1]
        prompt: >-
          בטאו באמצעות $G$, $M$, $r$ ו-$c$: (1) את המהירות $v$ של הלוויין ואת זמן המחזור $T$ שלו במערכת $S$; (2) את הזמן
          העצמי $\tau$ שהשעון של הלוויין מודד בהקפה אחת. בדקו את הביטוי ל-$\tau$ בגבול $r \to \infty$, ובדקו ש-$GM/(rc^2)$
          חסר ממדים.
        hints:
          - 'כוח הכבידה הוא הכוח השקול הרדיאלי (שיעור 2.6).'
          - 'גודל המהירות קבוע לאורך כל ההקפה. מה זה אומר על האינטגרל של $d\tau$?'
        solution:
          - kind: law
            text: >-
              החוק השני בכיוון הרדיאלי, עם כוח הכבידה $GMm/r^2$ ככוח השקול: $\dfrac{GMm}{r^2} = \dfrac{mv^2}{r}$. וקצב השעון,
              $d\tau = \sqrt{1 - v^2/c^2}\,dt$.
          - kind: manipulation
            text: >-
              $v = \sqrt{GM/r}$, ו-$T = \dfrac{2\pi r}{v} = 2\pi\sqrt{\dfrac{r^3}{GM}}$, החוק השלישי של קפלר למעגל. גודל המהירות
              קבוע, ולכן האינטגרל של $d\tau$ על הקפה הוא מכפלה:
              $$\tau = T\sqrt{1 - \frac{v^2}{c^2}} = 2\pi\sqrt{\frac{r^3}{GM}}\,\sqrt{1 - \frac{GM}{rc^2}}$$
          - kind: limit
            text: >-
              כש-$r \to \infty$, $GM/(rc^2) \to 0$ ו-$\tau/T \to 1$: לוויין רחוק ואיטי שומר על הזמן של $S$. הביטוי דורש
              $GM/(rc^2) < 1$, כלומר $v < c$. לכדור הארץ $GM/c^2 \approx 4.4\,\text{mm}$, ולכן בכל מסלול אמיתי, מחוץ לכדור
              הארץ, $GM/(rc^2)$ זעיר.
          - kind: units
            text: >-
              מ-$F = GMm/r^2$, $GM$ ביחידות $\text{N·m}^2/\text{kg} = \text{m}^3/\text{s}^2$. לכן $\dfrac{GM}{rc^2}$ ביחידות
              $\dfrac{\text{m}^3/\text{s}^2}{\text{m}\cdot\text{m}^2/\text{s}^2} = 1$, ו-$\sqrt{r^3/GM}$ בשניות.
          - kind: result
            text: >-
              $v = \sqrt{GM/r}$, $T = 2\pi\sqrt{r^3/GM}$, ו-$\tau = T\sqrt{1 - GM/(rc^2)}$: השעון של הלוויין מודד בכל הקפה פחות
              מ-$T$.
        rubric:
          - text: כתבתי את החוק השני בכיוון הרדיאלי, עם כוח הכבידה כשקול, וקיבלתי $v = \sqrt{GM/r}$ ו-$T = 2\pi\sqrt{r^3/GM}$.
          - text: הסברתי שגודל המהירות קבוע, ולכן $\tau = T\sqrt{1 - v^2/c^2}$, וקיבלתי $\tau = T\sqrt{1 - GM/(rc^2)}$.
          - text: בדקתי שב-$r \to \infty$ חוזר $\tau = T$, ושהביטוי $GM/(rc^2)$ חסר ממדים.

      - label: ג
        type: open
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-0.3-2, OBJ-9.2-1]
        prompt: >-
          הפיגור בהקפה אחת, $\Delta = T - \tau$, קטן מאוד לעומת $T$. (1) בקירוב מסדר ראשון, בטאו את $\Delta$ ואת הפיגור
          ליחידת זמן של $S$, $\Delta/T$, באמצעות $G$, $M$, $r$ ו-$c$.

          (2) לוויין ניווט נע במסלול מעגלי ברדיוס $r = 2.66\cdot10^7\,\text{m}$, ולכדור הארץ $GM = 3.98\cdot10^{14}\,\text{m}^3/\text{s}^2$.
          חשבו את $T$, את $\Delta$ ואת הפיגור ביממה של $S$, $86400\,\text{s}$.

          (3) לפי חלק א, לוויין ברדיוס $4r$ מפגר ליחידת זמן פחות מלוויין ברדיוס $r$. הראו שבכל הקפה שלו הוא מפגר דווקא
          יותר, ובדקו את שני הביטויים בגבול $r \to \infty$.
        hints:
          - 'פיתוח טיילור משיעור 0.3, כמו בשיעור 9.2: $\sqrt{1 - x} \approx 1 - x/2$ כש-$x \ll 1$.'
        solution:
          - kind: law
            text: >-
              פיתוח טיילור מסדר ראשון: $\sqrt{1 - x} \approx 1 - x/2$ כש-$x \ll 1$ (שיעור 0.3). כאן $x = GM/(rc^2)$, מחלק ב.
          - kind: manipulation
            text: >-
              $\Delta = T\left(1 - \sqrt{1 - x}\right) \approx \dfrac{Tx}{2}$. מציבים את $T$ מחלק ב:
              $$\Delta \approx 2\pi\sqrt{\frac{r^3}{GM}}\cdot\frac{GM}{2rc^2} = \frac{\pi\sqrt{GMr}}{c^2},\qquad \frac{\Delta}{T} \approx \frac{GM}{2rc^2} = \frac{v^2}{2c^2}$$
          - kind: limit
            text: >-
              כש-$r \to \infty$, $\Delta/T \to 0$, כמו $1/r$: הלוויין איטי יותר. אבל $\Delta$ גדל כמו $\sqrt r$, כי ההקפה מתארכת
              כמו $r^{3/2}$. ברדיוס $4r$: הפיגור ליחידת זמן קטן פי 4, ההקפה ארוכה פי 8, והפיגור בהקפה גדל פי 2. והקירוב טוב:
              האיבר הבא בפיתוח, $x^2/8$, קטן מ-$x/2$ פי $x/4 \approx 4\cdot10^{-11}$.
          - kind: units
            text: >-
              $\dfrac{\sqrt{GMr}}{c^2}$ ביחידות $\dfrac{\sqrt{\text{m}^3/\text{s}^2\cdot\text{m}}}{\text{m}^2/\text{s}^2} = \dfrac{\text{m}^2/\text{s}}{\text{m}^2/\text{s}^2} = \text{s}$,
              זמן, ו-$\Delta/T$ חסר ממדים.
          - kind: substitution
            text: >-
              $T = 2\pi\sqrt{\dfrac{(2.66\cdot10^7)^3}{3.98\cdot10^{14}}} = 4.32\cdot10^4\,\text{s} = 12.0\,\text{h}$, ו-$v = 3.87\,\text{km/s}$.
              $\dfrac{\Delta}{T} = \dfrac{3.98\cdot10^{14}}{2\cdot2.66\cdot10^7\cdot(3.0\cdot10^8)^2} = 8.31\cdot10^{-11}$, ולכן
              $\Delta = 3.59\,\mu\text{s}$ בהקפה, ו-$86400\cdot8.31\cdot10^{-11} = 7.18\,\mu\text{s}$ ביממה, שתי הקפות.
          - kind: result
            text: >-
              $\Delta \approx \pi\sqrt{GMr}/c^2 = 3.59\,\mu\text{s}$ בהקפה, ו-$\Delta/T \approx GM/(2rc^2)$, כ-$7.2\,\mu\text{s}$ ביממה.
              (בלוויינים אמיתיים ההשפעה של הכבידה, שמחוץ לקורס, גדולה מזו ובכיוון ההפוך.)
        rubric:
          - text: השתמשתי בקירוב $\sqrt{1 - x} \approx 1 - x/2$, וקיבלתי $\Delta \approx \pi\sqrt{GMr}/c^2$ ו-$\Delta/T \approx GM/(2rc^2)$.
          - text: הסברתי למה ברדיוס $4r$ הפיגור ליחידת זמן קטן פי 4 והפיגור בהקפה גדל פי 2, ובדקתי את הגבול $r \to \infty$.
          - text: קיבלתי $T \approx 12\,\text{h}$, $\Delta \approx 3.6\,\mu\text{s}$ בהקפה ובערך $7.2\,\mu\text{s}$ ביממה.

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-6.6-1, OBJ-6.4-2, OBJ-6.5-2, OBJ-9.2-1]
        prompt: >-
          לוויין אחר נע במסלול אליפטי, שחצי הציר הראשי שלו $a$ והאקסצנטריות שלו $e$, ולכן גודל המהירות שלו משתנה לאורך המסלול.
          הראו שבקירוב מסדר ראשון הפיגור של השעון שלו בהקפה אחת הוא $\Delta = \pi\sqrt{GMa}/c^2$, כמו במסלול מעגלי ברדיוס
          $a$, בלי תלות ב-$e$. היעזרו ב-vis-viva, $v^2 = GM\left(2/r - 1/a\right)$ (שיעור 6.6), במשוואת המסלול
          $r = p/(1 + e\cos\theta)$ עם $p = h^2/GM$ (שיעור 6.4), וב-$h = r^2\dot\theta$, התנע הזוויתי ליחידת מסה, שנשמר. בדקו
          את התוצאה בגבול $e \to 0$.
        hints:
          - >-
            בסדר ראשון $d\tau \approx \left(1 - \dfrac{v^2}{2c^2}\right)dt$, ולכן $\Delta \approx \dfrac{1}{2c^2}\displaystyle\oint v^2\,dt$.
            אחרי הצבת vis-viva, הנעלם היחיד הוא $\oint dt/r$.
          - >-
            החליפו משתנה, $dt = r^2\,d\theta/h$. מטבלת אינטגרלים, $\displaystyle\int_0^{2\pi}\frac{d\theta}{1 + e\cos\theta} = \frac{2\pi}{\sqrt{1 - e^2}}$,
            ו-$p = a(1 - e^2)$.
        solution:
          - kind: law
            text: >-
              $d\tau = \sqrt{1 - v^2/c^2}\,dt \approx \left(1 - \dfrac{v^2}{2c^2}\right)dt$, כמו בחלק ג. vis-viva,
              $v^2 = GM(2/r - 1/a)$. החוק השלישי של קפלר, $T = 2\pi\sqrt{a^3/GM}$. ושימור התנע הזוויתי, $h = r^2\dot\theta$, עם
              $r = p/(1 + e\cos\theta)$, $p = h^2/GM = a(1 - e^2)$.
          - kind: manipulation
            text: >-
              $$\Delta = \oint(dt - d\tau) \approx \frac{1}{2c^2}\oint v^2\,dt = \frac{GM}{2c^2}\left(2\oint\frac{dt}{r} - \frac{T}{a}\right)$$
              ב-$\oint dt/r$ מחליפים משתנה, $dt = r^2\,d\theta/h$:
              $$\oint\frac{dt}{r} = \frac{1}{h}\int_0^{2\pi}r\,d\theta = \frac{p}{h}\int_0^{2\pi}\frac{d\theta}{1 + e\cos\theta} = \frac{p}{h}\cdot\frac{2\pi}{\sqrt{1 - e^2}}$$
              עם $h = \sqrt{GMp}$, $\dfrac{p}{h} = \sqrt{\dfrac{p}{GM}}$, ו-$\dfrac{\sqrt p}{\sqrt{1 - e^2}} = \sqrt{\dfrac{a(1 - e^2)}{1 - e^2}} = \sqrt a$.
              לכן $\oint\dfrac{dt}{r} = 2\pi\sqrt{\dfrac{a}{GM}} = \dfrac{T}{a}$, ו-
              $$\Delta \approx \frac{GM}{2c^2}\left(\frac{2T}{a} - \frac{T}{a}\right) = \frac{GMT}{2ac^2} = \frac{\pi\sqrt{GMa}}{c^2}$$
          - kind: manipulation
            text: >-
              הממוצע בזמן של $1/r$ לאורך ההקפה הוא בדיוק $1/a$, ולכן הממוצע בזמן של $v^2$ הוא $GM(2/a - 1/a) = GM/a$, בדיוק
              $v^2$ של מסלול מעגלי ברדיוס $a$. ליד נקודת הקרבה הלוויין מהיר, אבל עובר אותה מהר; ליד נקודת הריחוק הוא איטי,
              ושוהה שם זמן רב.
          - kind: limit
            text: >-
              כש-$e \to 0$, $r = a$ לאורך כל המסלול, ו-$\Delta = \pi\sqrt{GMa}/c^2$ היא התוצאה של חלק ג עם $r = a$. ולכל $e < 1$
              התשובה זהה: כמו האנרגיה וזמן המחזור (שיעור 6.5), הפיגור בהקפה תלוי רק ב-$a$.
          - kind: units
            text: 'כמו בחלק ג, $\sqrt{GMa}/c^2$ בשניות. ו-$\oint dt/r$ ביחידות $\text{s/m}$, כמו $T/a$.'
          - kind: result
            text: >-
              $\Delta \approx \dfrac{GMT}{2ac^2} = \dfrac{\pi\sqrt{GMa}}{c^2}$, בלי תלות באקסצנטריות: לוויין במסלול אליפטי מפגר
              בכל הקפה כמו לוויין במסלול מעגלי ברדיוס $a$.
        rubric:
          - text: כתבתי $\Delta \approx \frac{1}{2c^2}\oint v^2\,dt$, הצבתי vis-viva, ונשאר לי לחשב $\oint dt/r$.
          - text: החלפתי משתנה, $dt = r^2\,d\theta/h$, חישבתי את האינטגרל, וקיבלתי $\oint dt/r = T/a$.
          - text: קיבלתי $\Delta = \pi\sqrt{GMa}/c^2$, ובדקתי שב-$e \to 0$ חוזרת התוצאה של חלק ג.

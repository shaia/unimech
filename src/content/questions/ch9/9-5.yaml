chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.5-1 interval, classification, causality
  - id: Q-9.5-invariant
    type: mc
    objectives: [OBJ-9.5-1]
    qualitative: true
    level: basic
    prompt: >-
      שני מאורעות נמדדים על ידי צופים בכמה מערכות ייחוס אינרציאליות שנעות זו ביחס לזו לאורך $x$. על איזה גודל
      **כולם** מסכימים?
    choices:
      - text: $s^2 = c^2\Delta t^2 - \Delta x^2$
        correct: true
        feedback: >-
          נכון. האינטרוול זהה בכל המערכות. אפשר לבדוק זאת בהצבה של טרנספורמציית לורנץ: האיבר המעורב
          $2\gamma^2 v\Delta x\Delta t$ מופיע עם מינוס גם ב-$c^2\Delta t'^2$ וגם ב-$\Delta x'^2$, ומתבטל בהפרש, ונשאר $\gamma^2(1 - \beta^2)\left(c^2\Delta t^2 - \Delta x^2\right)$, כלומר אותו $s^2$.
      - text: $\Delta x^2 + c^2\Delta t^2$
        feedback: >-
          זה "פיתגורס" במרחב-זמן, והוא משתנה ממערכת למערכת. במערכת שבה שני המאורעות באותו מקום, למשל, הוא $c^2\tau^2$,
          ובמערכת אחרת גדול ממנו. הגודל הקבוע הוא ההפרש, עם מינוס.
        misconception: MC-9-euclidean-interval
      - text: הזמן $\Delta t$ ביניהם.
        feedback: 'הזמן בין מאורעות תלוי במערכת: זו התארכות הזמן, ובמאורעות במקומות שונים גם יחסיות הבו-זמניות.'
        misconception: MC-9-absolute-time
      - text: המרחק $\Delta x$ ביניהם.
        feedback: >-
          גם המרחק תלוי במערכת. במערכת שבה שני המאורעות קורים באותו מקום הוא אפס, ובמערכות אחרות לא.

  - id: Q-9.5-light-cone
    type: multi
    objectives: [OBJ-9.5-1]
    qualitative: true
    level: basic
    prompt: >-
      מאורע O קורה בראשית, $x = 0$ ו-$t = 0$. מרחקים בשניות אור וזמנים בשניות, כך שאור עובר שנייה אור אחת בשנייה. על
      אילו מהמאורעות הבאים O יכול להשפיע? סמנו את כולם.
    choices:
      - text: A, ב-$x = 1$ וב-$t = 3$.
        correct: true
        feedback: >-
          נכון. $s^2 = 9 - 1 = 8 > 0$, אינטרוול זמני, ו-A בעתיד של O. גוף שנע במהירות $c/3$ יכול לעבור מ-O ל-A.
      - text: C, ב-$x = -2$ וב-$t = 2$.
        correct: true
        feedback: >-
          נכון. $s^2 = 4 - 4 = 0$, אינטרוול אורי: C על חרוט האור של O, ופולס אור שיוצא מ-O שמאלה מגיע בדיוק אליו.
      - text: B, ב-$x = 3$ וב-$t = 1$.
        feedback: >-
          $s^2 = 1 - 9 = -8 < 0$, אינטרוול מרחבי. אות מ-O ל-B צריך לנוע במהירות $3c$. B מחוץ לחרוט האור של O, ובמערכות
          שנעות מהר מספיק ימינה B אף קורה לפני O.
        misconception: MC-9-ftl-harmless
      - text: D, ב-$x = 1$ וב-$t = -2$.
        feedback: >-
          $s^2 = 4 - 1 = 3 > 0$, אינטרוול זמני, אבל D ב**עבר** של O: הוא בתוך החרוט התחתון. D יכול להשפיע על O, ולא להפך.
          לאינטרוול זמני יש סדר זמנים שכל המערכות מסכימות עליו.
    hints:
      - 'לכל מאורע חשבו $s^2 = t^2 - x^2$ ובדקו את הסימן של $t$.'

  - id: Q-9.5-proper-time
    type: numeric
    objectives: [OBJ-9.5-1]
    level: mid
    prompt: >-
      בין שני מאורעות עוברים במערכת $S$ זמן $\Delta t = 5.0\,\text{s}$ ומרחק $\Delta x = 9.0\cdot10^8\,\text{m}$ (שלוש
      שניות אור). מה הזמן העצמי ביניהם, כלומר הזמן שמודד שעון שנמצא בשני המאורעות?
    answer: 4.0
    unit: s
    correctFeedback: >-
      נכון. $c^2\tau^2 = s^2 = c^2\Delta t^2 - \Delta x^2$, ובשניות אור $s^2 = 25 - 9 = 16$, ולכן $\tau = 4.0\,\text{s}$.
      זה השעון שנע במהירות $\Delta x/\Delta t = 0.6c$, ואכן $5.0/\gamma = 5.0/1.25 = 4.0\,\text{s}$.
    wrongFeedback: >-
      במערכת של השעון שני המאורעות באותו מקום, ולכן שם $s^2 = c^2\tau^2$, עם $\tau$ הזמן העצמי. האינטרוול זהה בכל המערכות: חשבו אותו
      ב-$S$.
    commonWrong:
      - value: 5.83
        feedback: >-
          חישבתם $\sqrt{25 + 9}$, פיתגורס. באינטרוול יש מינוס: $c^2\Delta t^2 - \Delta x^2$. הזמן העצמי תמיד **קצר** מ-$\Delta t$.
        misconception: MC-9-euclidean-interval
      - value: 5.0
        feedback: >-
          זה הזמן ב-$S$, שבה המאורעות במקומות שונים. הזמן העצמי נמדד במערכת שבה הם באותו מקום, והוא הקצר ביותר.
        misconception: MC-9-proper-time-rest-frame
    hints:
      - 'כתבו את $\Delta x$ בשניות אור. כמה זה $c^2\Delta t^2 - \Delta x^2$?'

  - id: Q-9.5-causal
    type: twotier
    objectives: [OBJ-9.5-1]
    qualitative: true
    level: mid
    prompt: >-
      מאורע A: הבזק על כדור הארץ, ב-$t = 0$. מאורע B: פיצוץ בתחנת חלל שנחה במרחק 10 דקות אור מכדור הארץ, ב-$t = 6.0\,\text{min}$
      במערכת של כדור הארץ. האם A יכול להיות הסיבה של B?
    choices:
      - text: לא. האינטרוול ביניהם מרחבי, ושום אות לא מגיע מ-A ל-B בזמן.
        correct: true
        feedback: >-
          נכון. $s^2 = (6.0)^2 - (10)^2 = -64 < 0$ (בדקות אור בריבוע). אור מ-A מגיע לתחנה רק ב-$t = 10\,\text{min}$, ארבע
          דקות אחרי הפיצוץ.
      - text: כן, אם A שולח לתחנה אות שנע במהירות $1.67c$.
        feedback: >-
          אות כזה מהיר מהאור. מעבר לכך שאין אות כזה, זוג המאורעות הזה מרחבי, ובמערכות שנעות מהר מ-$0.6c$ מכדור הארץ
          לכיוון התחנה B קורה **לפני** A. אז האות היה מגיע לפני שנשלח.
        misconception: MC-9-ftl-harmless
      - text: זה תלוי בצופה. במערכות מסוימות כן ובאחרות לא.
        feedback: >-
          $s^2$ זהה בכל המערכות, ולכן גם הסימן שלו. בכל מערכת האינטרוול מרחבי, ובכל מערכת אור מ-A לא מגיע ל-B בזמן. רק
          **הסדר** בזמן של A ו-B תלוי במערכת.
        misconception: MC-9-causality-frame-dependent
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          $|\Delta x| > c\Delta t$, ולזוג כזה יש מערכות שבהן הסדר בזמן מתהפך. סיבה חייבת לקדום לתוצאה בכל מערכת.
        correct: true
        feedback: >-
          זה הנימוק. מאורעות שיכולים להיות קשורים סיבתית הם רק אלה עם אינטרוול זמני או אורי, וסדר הזמנים שלהם זהה בכל
          המערכות.
      - text: B קורה אחרי A, ולכן A יכול להיות הסיבה שלו.
        feedback: >-
          "אחרי" נכון במערכת של כדור הארץ בלבד. לזוג עם אינטרוול מרחבי אין סדר זמנים שכל המערכות מסכימות עליו, ולכן
          סדר בזמן לבד לא מספיק לסיבתיות.
        misconception: MC-9-simultaneity-absolute
      - text: האינטרוול שלילי, ולכן הזמן ביניהם מדומה ואין להם משמעות פיזיקלית.
        feedback: >-
          שני המאורעות אמיתיים לגמרי. אינטרוול שלילי אומר רק שאין שעון שנמצא בשניהם; יש במקום זה מערכת שבה הם
          בו-זמניים, ובה המרחק ביניהם הוא $\sqrt{-s^2} = 8$ דקות אור.
    hints:
      - 'אחרי כמה דקות מגיע לתחנה אור שיצא מכדור הארץ ב-$t = 0$?'

  - id: Q-9.5-order-reversal
    type: numeric
    objectives: [OBJ-9.5-1]
    level: bagrut
    prompt: >-
      מאורע A: הבזק על כדור הארץ ברגע $t = 0$. מאורע B: פיצוץ בתחנת חלל שנחה במרחק 10 דקות אור מכדור הארץ, ברגע
      $t = 6.0\,\text{min}$, שניהם במערכת של כדור הארץ. חללית נעה מכדור הארץ לכיוון התחנה, ובמערכת שלה הפיצוץ קורה
      $3.0\,\text{min}$ **לפני** ההבזק. מה המהירות של החללית? ענו כשבר של $c$.
    answer: 0.786
    unit: c
    correctFeedback: >-
      נכון. בדקות ובדקות אור, $c\Delta t' = \gamma\left(c\Delta t - \beta\Delta x\right)$, וצריך $\gamma(6.0 - 10\beta) = -3.0$,
      כלומר $10\beta - 6 = 3\sqrt{1 - \beta^2}$. בריבוע: $109\beta^2 - 120\beta + 27 = 0$, עם השורשים $\beta = 0.786$ ו-$\beta = 0.315$.
      השורש הקטן נותן $10\beta - 6 < 0$: שם הפיצוץ קורה $3.0\,\text{min}$ **אחרי** ההבזק, והוא נכנס רק מפני שהעלינו בריבוע.
      בדיקה: $\gamma = 1.62$ ו-$1.62\cdot(6.0 - 7.86) = -3.0$; $\Delta x' = 8.54$ דקות אור, ו-$3.0^2 - 8.54^2 = -64$, אותו $s^2$
      כמו ב-$6^2 - 10^2$. **בדיקת גבולות:** הסדר מתהפך רק מעל $\beta = c\Delta t/\Delta x = 0.6$, שם המאורעות בו-זמניים, ו-$\beta$
      של התשובה אכן גדול ממנו; וכש-$\beta \to 1$, $c\Delta t' \to -\infty$.
    wrongFeedback: >-
      כתבו $c\Delta t' = \gamma\left(c\Delta t - \beta\Delta x\right)$ בדקות ובדקות אור, הציבו $c\Delta t' = -3.0$, והעבירו את השורש
      לאגף אחד לפני שאתם מעלים בריבוע.
    commonWrong:
      - value: 0.315
        feedback: >-
          זה השורש השני של המשוואה הריבועית. הציבו אותו בחזרה: $6.0 - 3.15 > 0$, ולכן בחללית הזו הפיצוץ קורה $3.0\,\text{min}$
          **אחרי** ההבזק. העלאה בריבוע מוסיפה פתרון שלא מקיים את המשוואה המקורית.
      - value: 0.9
        feedback: 'פתרתם $6.0 - 10\beta = -3.0$, בלי $\gamma$. ההפרש בזמן ב-$S''$ כפול $\gamma$.'
      - value: 0.3
        feedback: >-
          פתרתם $6.0 - 10\beta = 3.0$: בלי $\gamma$, ועם הסימן הפוך. "לפני" פירושו $\Delta t' = t'_B - t'_A < 0$.
      - value: 0.6
        feedback: >-
          זו המהירות שבה שני המאורעות **בו-זמניים**, $c\Delta t/\Delta x$. כדי שהפיצוץ יקדים ב-$3.0\,\text{min}$ החללית צריכה
          לנוע מהר יותר.
    hints:
      - 'עבדו בדקות ובדקות אור, כך ש-$c = 1$. מה הסימן של $\Delta t''$ שמבקשים?'
      - 'אחרי ההעלאה בריבוע יש שני פתרונות. הציבו כל אחד בחזרה במשוואה עם $\gamma$.'

  # ---------------------------------------------------------------- OBJ-9.5-2 Minkowski diagrams with a moving frame
  - id: Q-9.5-axes-tilt
    type: numeric
    objectives: [OBJ-9.5-2]
    level: basic
    prompt: >-
      בדיאגרמת מינקובסקי של $S$, עם ציר $x$ אופקי וציר $ct$ אנכי, משרטטים את ציר $ct'$ של מערכת שנעה במהירות $0.6c$.
      הציר הזה הוא קו העולם של הראשית של $S'$. באיזו זווית הוא נוטה מציר $ct$? ענו במעלות.
    answer: 31.0
    unit: °
    correctFeedback: >-
      נכון. על ציר $ct'$, $x = vt = \beta\cdot ct$, ולכן $\tan\alpha = \dfrac{x}{ct} = \beta = 0.6$ ו-$\alpha = 31.0^\circ$. קו
      האור נוטה ב-$45^\circ$, ו-$\beta < 1$ שומר על ציר $ct'$ בתוך חרוט האור.
    wrongFeedback: >-
      כתבו את קו העולם של $x' = 0$, כלומר $x = vt$, וחשבו את היחס בין $x$ ל-$ct$ לאורכו.
    commonWrong:
      - value: 59.0
        feedback: >-
          זו הזווית מציר $x$. הזווית מציר $ct$ היא המשלימה, עם $\tan\alpha = x/(ct) = \beta$.
      - value: 36.9
        feedback: >-
          זה $\arcsin 0.6$ (וגם הזווית של מערכת שנעה ב-$0.75c$). כאן $0.6$ הוא היחס בין $x$ ל-$ct$ לאורך הציר, כלומר טנגנס הזווית,
          לא סינוס.
    hints:
      - 'כמה $x$ מתקדם הקו לכל שנייה אור של $ct$?'

  - id: Q-9.5-unit-tick
    type: numeric
    objectives: [OBJ-9.5-2]
    level: mid
    prompt: >-
      בדיאגרמת מינקובסקי של $S$ (ציר $x$ אופקי וציר $ct$ אנכי, בשניות אור) משרטטים את ציר $ct'$ של מערכת $S'$ שנעה במהירות
      $0.8c$ לאורך $x$, והראשיות מתלכדות ב-$t = t' = 0$. מסמנים על הציר את השנתה $ct' = 2$ שניות אור, כלומר את המאורע שבו
      השעון בראשית של $S'$ מראה $2\,\text{s}$. באיזה גובה $ct$ בדיאגרמה נמצאת השנתה? ענו בשניות אור.
    answer: 3.33
    unit: שניות אור
    correctFeedback: >-
      נכון. השנתה היא המאורע $x' = 0$, $ct' = 2$, ובטרנספורמציה ההפוכה $(x,\ ct) = (2\gamma\beta,\ 2\gamma)$. עם $\gamma = 5/3$:
      $(2.67,\ 3.33)$. בדיקה בהיפרבולת הכיול: $3.33^2 - 2.67^2 = 4.00 = 2^2$, ולכן השנתה על $c^2t^2 - x^2 = 4$. המרחק שלה
      מהראשית על הנייר, $4.27$, גדול מ-2: קנה המידה של ציר נוטה נקבע בהיפרבולה, לא בסרגל. **בדיקת גבולות:** כש-$\beta \to 0$,
      $\gamma \to 1$ והשנתה חוזרת ל-$ct = 2$, על ציר $ct$.
    wrongFeedback: >-
      השנתה היא מאורע שבו $x' = 0$ ו-$ct' = 2$. העבירו אותו ל-$S$ בטרנספורמציה ההפוכה, $ct = \gamma\left(ct' + \beta x'\right)$.
    commonWrong:
      - value: 2.0
        feedback: >-
          סימנתם את השנתה בגובה 2, כאילו ציר $ct'$ מכויל כמו ציר $ct$. השעון בראשית של $S'$ נע ב-$S$, ולכן לפי $S$ הוא מגיע ל-2
          שניות מאוחר יותר, ב-$ct = 2\gamma$.
        misconception: MC-9-minkowski-euclidean
      - value: 1.2
        feedback: >-
          חילקתם ב-$\gamma$ במקום לכפול. השעון של $S'$ נע ב-$S$ ומפגר, ולכן ב-$S$ עובר **יותר** זמן עד שהוא מראה 2.
        misconception: MC-9-proper-time-rest-frame
      - value: 2.67
        feedback: >-
          זה ה-$x$ של השנתה, $2\gamma\beta$. הגובה בדיאגרמה הוא $ct = 2\gamma$.
    hints:
      - 'השנתה $ct'' = 2$ היא המאורע $x'' = 0$, $ct'' = 2$. מה $ct$ שלו בטרנספורמציה ההפוכה?'

  - id: Q-9.5-xprime-axis
    type: mc
    objectives: [OBJ-9.5-2]
    qualitative: true
    level: mid
    prompt: >-
      בדיאגרמת מינקובסקי של $S$, עם ציר $x$ אופקי וציר $ct$ אנכי, משורטט ציר $ct'$ של מערכת $S'$ שנעה במהירות $0.6c$
      לאורך $x$: הוא נוטה ימינה מציר $ct$ ב-$31^\circ$. איפה נמצא ציר $x'$, כלומר כל המאורעות שבהם $t' = 0$?
    choices:
      - text: >-
          על הקו $ct = 0.6x$: הוא נוטה **מעל** ציר $x$ ב-$31^\circ$, לקראת קו האור.
        correct: true
        feedback: >-
          נכון. $t' = \gamma\left(t - vx/c^2\right) = 0$ פירושו $ct = \beta x$. שני הצירים של $S'$ נסגרים כמו מספריים סביב קו
          האור, $ct = x$, וכשהמהירות מתקרבת ל-$c$ שניהם מתקרבים אליו.
      - text: מתחת לציר $x$ ב-$31^\circ$, כך שיישאר ניצב לציר $ct'$.
        feedback: >-
          כך נראה סיבוב של צירים במישור, שבו המרחק נשמר לפי פיתגורס. טרנספורמציית לורנץ שומרת על $c^2t^2 - x^2$, ולכן
          הצירים נוטים זה **לקראת** זה ואינם ניצבים בשרטוט. הציבו $t' = 0$ ובדקו.
        misconception: MC-9-minkowski-euclidean
      - text: על ציר $x$ עצמו, כי מאורעות שבו-זמניים ב-$S$ בו-זמניים גם ב-$S'$.
        feedback: >-
          המאורעות על ציר $x$ מקיימים $t = 0$, ולכן $t' = -\gamma vx/c^2$, שונה מאפס לכל $x \neq 0$. זו יחסיות הבו-זמניות
          בשרטוט: הקו של "עכשיו" נוטה.
        misconception: MC-9-simultaneity-absolute
      - text: על קו האור, $ct = x$.
        feedback: >-
          קו האור הוא ציר משותף רק כש-$v \to c$. ב-$0.6c$ הציר $x'$ נמצא בין ציר $x$ לקו האור.

  - id: Q-9.5-read-event
    type: mc
    objectives: [OBJ-9.5-2]
    qualitative: true
    level: mid
    prompt: >-
      בדיאגרמת מינקובסקי של $S$ מסומן מאורע O בראשית, ומאורע P ב-$x = 4$ שניות אור, $ct = 2$ שניות אור. קו ישר שעובר דרך
      O ו-P הוא ציר $x'$ של מערכת $S'$ שנעה במהירות $0.5c$. מה נכון לגבי O ו-P?
    choices:
      - text: במערכת $S'$, P ו-O בו-זמניים.
        correct: true
        feedback: >-
          נכון. ציר $x'$ הוא אוסף המאורעות עם $t' = 0$, כמו O. בדיקה: $ct' = \gamma\left(ct - \beta x\right)$, וכשהזמן
          בשניות והמרחק בשניות אור, $\gamma(2 - 0.5\cdot4) = 0$. ומ-$s^2 = 4 - 16 = -12$: המרחק ביניהם ב-$S'$ הוא $\sqrt{12} = 3.46$ שניות אור.
      - text: P נמצא על קו העולם של גוף שעבר ב-O ונע במהירות $0.5c$.
        feedback: >-
          קו עולם של גוף איטי מ-$c$ נוטה מציר $ct$, כמו ציר $ct'$, ולא מציר $x$. גוף שעובר ב-O וב-P צריך לנוע במהירות
          $4/2 = 2c$, וזה אינו קו עולם של שום גוף.
        misconception: MC-9-any-pair-same-place
      - text: O יכול לגרום ל-P, כי P מאוחר ממנו ב-$S$.
        feedback: >-
          $s^2 = 4 - 16 < 0$: P מחוץ לחרוט האור של O. ב-$S$ הוא אכן מאוחר יותר, ב-$S'$ בו-זמני, ובמערכות מהירות מ-$0.5c$
          מוקדם יותר. אין קשר סיבתי.
        misconception: MC-9-ftl-harmless
      - text: בכל מערכת ייחוס P קורה אחרי O.
        feedback: >-
          ב-$S'$ הם בו-זמניים, ובמערכת שנעה מהר יותר מ-$0.5c$ הסדר מתהפך. לזוג עם אינטרוול מרחבי אין סדר מוחלט.
        misconception: MC-9-simultaneity-absolute
    hints:
      - 'מה מאפיין את כל המאורעות על ציר $x''$?'

  - id: Q-9.5-rank-by-tprime
    type: rank
    objectives: [OBJ-9.5-2]
    qualitative: true
    level: mid
    prompt: >-
      בדיאגרמת מינקובסקי של $S$ מסומנים ארבעה מאורעות, ב-$(x,\ ct)$ בשניות אור: P1 ב-$(0,\ 2)$, P2 ב-$(3,\ 2)$, P3 ב-$(-2,\ 1)$
      ו-P4 ב-$(4,\ 3)$. דרגו אותם לפי הזמן $t'$ במערכת $S'$ שנעה במהירות $0.5c$, מהמאוחר ביותר למוקדם ביותר. מאורעות עם
      אותו $t'$ שימו באותה דרגה.
    items:
      - { id: p1, label: P1 }
      - { id: p2, label: P2 }
      - { id: p3, label: P3 }
      - { id: p4, label: P4 }
    order: [[p1, p3], p4, p2]
    correctFeedback: >-
      נכון. קווי הבו-זמניות של $S'$ מקבילים לציר $x'$, $ct = 0.5x + \text{const}$, ולכן $ct'$ פרופורציוני ל-$ct - 0.5x$: P1 ו-P3
      נותנים 2, P4 נותן 1 ו-P2 נותן 0.5 (כפול $\gamma$, שלא משנה את הסדר). ב-$S$ הסדר אחר: שם P4 הכי מאוחר ו-P3 הכי מוקדם, וב-$S'$ דווקא P3 בין המאוחרים. בדיאגרמה
      מעבירים דרך כל מאורע קו מקביל לציר $x'$ ורואים איפה הוא חותך את ציר $ct'$.
    wrongFeedback: >-
      הסדר לפי $t'$ לא נקבע לפי הגובה בדיאגרמה, אלא לפי קווים **מקבילים לציר** $x'$, שנוטים מעל ציר $x$, $ct = 0.5x + \text{const}$.
      חשבו לכל מאורע את $ct - 0.5x$.
    hints:
      - 'שני מאורעות בו-זמניים ב-$S''$ אם הקו שמחבר אותם מקביל לציר $x''$.'

  - id: Q-9.5-read-tilted-axis
    type: numeric
    objectives: [OBJ-9.5-2, OBJ-9.5-1]
    level: bagrut
    prompt: >-
      בדיאגרמת מינקובסקי של $S$ (ציר $x$ אופקי וציר $ct$ אנכי, בשניות אור) משורטטים הצירים של מערכת $S'$, שנעה לאורך $x$
      במהירות שלא נתונה. ציר $x'$ עובר דרך הראשית O ודרך המאורע Q, ב-$x = 6$ ו-$ct = 2$ שניות אור. מאורע P נמצא על ציר $ct'$,
      בגובה $ct = 9$ שניות אור. שעון שנח בראשית של $S'$ מראה אפס ב-O. מה הוא מראה ב-P? ענו בשניות.
    answer: 8.49
    unit: s
    correctFeedback: >-
      נכון. ציר $x'$ הוא הקו $ct = \beta x$, ולכן $\beta = 2/6 = 1/3$. ציר $ct'$ הוא $x = \beta\,ct$, ולכן P ב-$x = 9/3 = 3$
      שניות אור. P על ציר $ct'$, כלומר $x' = 0$, ולכן ב-$S'$, $s^2 = c^2t'^2$. מ-$S$: $s^2 = 81 - 9 = 72$, ולכן
      $ct' = \sqrt{72} = 8.49$ שניות אור ו-$t' = 8.49\,\text{s}$. אותו דבר מהטרנספורמציה: $\gamma = 1.061$ ו-$ct' = \gamma(9 - 1) = 8.49$.
      **בדיקת גבולות:** כש-$\beta \to 0$ ציר $x'$ נצמד לציר $x$, ציר $ct'$ לציר $ct$, ו-$t' \to 9\,\text{s}$. שימו לב: על הנייר
      הקטע OP **ארוך** מ-9 יחידות, אבל הוא מייצג פחות מ-9 שניות.
    wrongFeedback: >-
      שלושה צעדים: מהשיפוע של ציר $x'$ מוצאים את $\beta$; מציר $ct'$ מוצאים את ה-$x$ של P; ואז האינטרוול מ-O, שזהה בשתי
      המערכות, כשב-$S'$ P קורה ב-$x' = 0$.
    commonWrong:
      - value: 9.49
        feedback: >-
          מדדתם את אורך הקטע OP על הנייר, $\sqrt{3^2 + 9^2}$. דיאגרמת מינקובסקי היא לא מפה רגילה: הזמן לאורך קו עולם נקבע
          באינטרוול, $\sqrt{c^2t^2 - x^2}$.
        misconception: MC-9-minkowski-euclidean
      - value: 9.0
        feedback: >-
          זה הזמן ב-$S$. השעון בראשית של $S'$ נמצא גם ב-O וגם ב-P, ולכן הוא מודד את הזמן העצמי, הקצר יותר.
        misconception: MC-9-proper-time-rest-frame
      - value: 6.71
        feedback: >-
          לקחתם את ה-$x$ של Q, $6$, במקום את ה-$x$ של P. Q על ציר $x'$, ו-P על ציר $ct'$: על ציר $ct'$, $x = \beta\,ct = 3$.
    hints:
      - 'ציר $x''$ הוא $ct = \beta x$. מה $\beta$, אם הוא עובר ב-Q?'
      - 'מה $x''$ של P? מה זה אומר על $s^2$ במערכת $S''$?'

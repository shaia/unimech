# Lesson 9.5 question bank: the comprehension ladder of "מרחב-זמן ודיאגרמות מינקובסקי".
# Conventions in every prompt: s² = c²Δt² − Δx²; a Minkowski diagram has x to the right and ct up, so
# light runs at 45°; S′ moves at +v along x. Distances are often in light-seconds (or light-minutes) and
# times in seconds (or minutes), so c = 1 in those units.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was recomputed with src/physics/constants.ts (C_LIGHT = 3.0e8) and src/physics/relativity.ts by
# .scratch/ch9/9-5/bank.ts (lesson 9.5 written, 2026-11-12):
#   Δt = 5.0 s, Δx = 9.0e8 m = 3 light-s: s² = 16 (light-s)², proper time 4.00 s (wrong √34 = 5.83, 5.00);
#   axes tilt at β = 0.6: atan 0.6 = 31.0° (wrong 90° − 31.0° = 59.0°, asin 0.6 = 36.9°);
#   A → B: Δx = 10 light-min, Δt = 6.0 min, s² = −64 (simultaneous at β = 0.6, 8 light-min apart there);
#   order-reversal (rebuilt at exam level when the lesson printed Δt′ = γ(Δt − βΔx) with its own numbers): the
#   explosion 3.0 min BEFORE the flash: γ(6 − 10β) = −3 → 109β² − 120β + 27 = 0, β = 0.786 (the other root 0.315
#   gives +3.0 min; wrong 0.900 without γ, 0.300 without γ and sign, 0.600 the simultaneous frame);
#   Δx′ there 8.54 light-min (check 3² − 8.54² = −64);
#   P = (4, 2) lies on ct = 0.5 x, the x′ axis of β = 0.5; x′ = √12 = 3.46;
#   rank at β = 0.5: ct − 0.5x = 2 (P1), 0.5 (P2), 2 (P3), 1 (P4) → [P1 = P3], P4, P2;
#   read-tilted-axis (rebuilt: the lesson reads an event on the ct′ axis by the interval at β = 0.75): the x′ axis
#   passes through Q = (6, 2) → β = 1/3; P on the ct′ axis at ct = 9 → x = 3, s² = 72, t′ = 8.49 s
#   (wrong ruler √90 = 9.49, t = 9.00, Q's x instead of P's √45 = 6.71).
# Review 2026-11-12 (.scratch/review/ch9/r56.ts, closed forms): every key, commonWrong and feedback number holds.
#   Added Q-9.5-unit-tick (the lesson's calibration had no ladder question): β = 0.8, tick ct′ = 2 at

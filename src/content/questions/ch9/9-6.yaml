      המוט כולו בפנים; במערכת של האסם, לעומת זאת, המוט באורך $10/1.25 = 8.0\,\text{m}$ ונכנס.
    wrongFeedback: 'במערכת של המוט האסם נע, ולכן הוא שמתקצר: $L = L_0/\gamma$.'
    commonWrong:

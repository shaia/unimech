chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.6-1 the twin paradox
  - id: Q-9.6-twin-ages
    type: numeric
    objectives: [OBJ-9.6-1]
    level: basic
    prompt: >-
      תאומה נוסעת טסה במהירות $0.8c$ לכוכב שנמצא במרחק 4 שנות אור מכדור הארץ, ומיד חוזרת באותה מהירות. אחיה התאום נשאר
      על כדור הארץ. הזניחו את זמני ההאצה. במערכת של כדור הארץ המסע נמשך 10 שנים. בכמה שנים הזדקנה הנוסעת?
    answer: 6.0
    unit: שנים
    correctFeedback: >-
      נכון. במערכת של כדור הארץ, שהיא אינרציאלית לכל אורך המסע, השעון של הנוסעת מפגר פי $\gamma = 5/3$, ולכן היא
      הזדקנה $10/\gamma = 6.0$ שנים, 3 בכל כיוון. אחיה הזדקן 10.
    wrongFeedback: >-
      חשבו במערכת של כדור הארץ, שהיא אינרציאלית כל הזמן. השעון של מי שנע במערכת הזו מפגר פי $\gamma$.
    commonWrong:
      - value: 16.7
        feedback: >-
          כפלתם ב-$\gamma$. השעון של הנוסעת נמצא בכל המאורעות של המסע שלה, ולכן הוא מודד את הזמן העצמי, הקצר יותר.
        misconception: MC-9-proper-time-rest-frame
      - value: 10
        feedback: >-
          זה הזמן במערכת של כדור הארץ. הגילים לא שווים בפגישה: היא חוזרת צעירה מאחיה ב-4 שנים.
        misconception: MC-9-twins-same-age
      - value: 3.0
        feedback: 'זה כיוון אחד בלבד. המסע הלוך וחזור, ובכל כיוון היא מזדקנת 3 שנים.'
    hints:
      - 'מה $\gamma$ ב-$0.8c$? ובאיזו מערכת מותר להשתמש בהתארכות זמן לכל המסע?'

  - id: Q-9.6-symmetry-break
    type: twotier
    objectives: [OBJ-9.6-1]
    qualitative: true
    level: mid
    prompt: >-
      תאומה טסה במהירות $0.8c$ לכוכב במרחק 4 שנות אור, מסתובבת מיד וחוזרת באותה מהירות. אחיה נשאר על כדור הארץ. הנוסעת
      טוענת: "במערכת שלי כדור הארץ הוא שנע במהירות $0.8c$, ולכן השעון של אחי מפגר. כשנפגש, הוא יהיה הצעיר." מי צעיר יותר
      בפגישה?
    choices:
      - text: הנוסעת.
        correct: true
        feedback: >-
          נכון. החשבון של כדור הארץ נכון לכל המסע, כי כדור הארץ נמצא כל הזמן במערכת אינרציאלית אחת. החשבון של הנוסעת
          משתמש ב"מערכת שלי" כאילו הייתה אחת, אבל יש לה שתיים: מערכת ההליכה ומערכת החזרה.
      - text: האח, כפי שהנוסעת טוענת.
        feedback: >-
          הטענה שלה נכונה בכל אחת משתי הדרכים לחוד: בכל אחת מהן היא מוצאת שהשעון של אחיה מפגר. אבל אין לה מערכת אינרציאלית
          אחת לכל המסע, ולכן אסור לה לחבר את שתי הדרכים כאילו היו במערכת אחת. התשובה היא הזמן העצמי לאורך קו העולם של כל אחד,
          במערכת של כדור הארץ: 10 שנים לאח ו-6 לה. (אם היא בכל זאת מחשבת בשתי המערכות שלה, עליה להוסיף את הקפיצה של
          "עכשיו" על כדור הארץ כשהיא מחליפה מערכת.)
      - text: הם בני אותו גיל, כי כל אחד מוצא שהשעון של השני מפגר באותו גורם.
        feedback: >-
          ההשפעות היו מתקזזות רק אם המצב היה סימטרי. הנוסעת עוברת ממערכת אינרציאלית אחת לאחרת, ואחיה לא. אפשר להבחין בזה:
          רק היא מרגישה תאוצה בסיבוב. אבל התאוצה רק מסמנת את המעבר; את הגילים קובע הזמן העצמי לאורך קו העולם של כל אחד.
        misconception: MC-9-twins-same-age
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          האח נמצא כל המסע במערכת אינרציאלית אחת, והנוסעת מחליפה מערכת בנקודת הסיבוב. לכן רק החשבון של האח מותר מתחילתו
          ועד סופו.
        correct: true
        feedback: >-
          זה הנימוק. גם הנוסעת יכולה לחשב נכון, אם היא מחברת את שתי המערכות שלה ומוסיפה את הקפיצה של קו הבו-זמניות
          בסיבוב.
      - text: הנוסעת היא שבאמת נעה, והאח באמת נח.
        feedback: >-
          בין מערכות אינרציאליות אין "באמת נע". בדרך ההליכה, למשל, אין שום ניסוי שמבחין בין "הנוסעת נעה" ל"כדור הארץ נע".
          ההבדל הוא רק בשינוי הכיוון.
        misconception: MC-9-motion-absolute
      - text: בזמן הסיבוב הנוסעת מאיצה, והתאוצה מאטה את השעון שלה.
        feedback: >-
          אפשר לעשות את הסיבוב קצר כרצוננו, והשעון שלה מתקתק בו כרגיל. הפרש הגילים, 4 שנים, נצבר לאורך הדרך ולא בסיבוב.
          התאוצה רק מסמנת את המעבר בין שתי המערכות.
        misconception: MC-9-acceleration-slows-clock
    hints:
      - 'מי משני התאומים נמצא כל הזמן במערכת אינרציאלית אחת?'

  - id: Q-9.6-outbound-earth
    type: numeric
    objectives: [OBJ-9.6-1]
    level: mid
    prompt: >-
      תאומה טסה במהירות $0.8c$ לכוכב במרחק 4 שנות אור, מסתובבת מיד וחוזרת באותה מהירות; אחיה נשאר על כדור הארץ. בשעון
      שלה כל דרך נמשכת 3 שנים. במערכת ההליכה שלה כדור הארץ נע, והשעון שלו מפגר פי $\gamma = 5/3$. לפי מערכת ההליכה, מה
      מראה השעון של כדור הארץ ברגע שהיא מגיעה לכוכב?
    answer: 1.8
    unit: שנים
    correctFeedback: >-
      נכון. $3.0/\gamma = 3.0\cdot\tfrac35 = 1.8$ שנים. אותו דבר בדרך החזרה, ולכן משתי הדרכים יחד רק 3.6 שנים, ולא 10.
      חסרות 6.4 שנים, והן נמצאות בסיבוב: שם קו הבו-זמניות שלה קופץ על קו העולם של כדור הארץ.
    wrongFeedback: >-
      במערכת ההליכה של הנוסעת, השעון של כדור הארץ הוא שנע, ולכן הוא מפגר פי $\gamma$ ביחס לשעון שלה.
    commonWrong:
      - value: 5.0
        feedback: >-
          זה מה שהשעון של כדור הארץ מראה ברגע ההגעה לכוכב **במערכת של כדור הארץ**. במערכת ההליכה של הנוסעת, הרגע על כדור
          הארץ שבו-זמני עם ההגעה הוא אחר: שם השעון מראה 1.8 שנים.
        misconception: MC-9-simultaneity-absolute
      - value: 3.0
        feedback: 'זה הזמן בשעון של הנוסעת. השעון של כדור הארץ נע במערכת שלה, ולכן מתקתק לאט ממנו פי $\gamma$.'
    hints:
      - 'במערכת של הנוסעת היא נחה וכדור הארץ נע. השעון של מי מפגר?'

  - id: Q-9.6-turnaround-jump
    type: numeric
    objectives: [OBJ-9.6-1]
    level: bagrut
    prompt: >-
      תאומה טסה מכדור הארץ במהירות $0.8c$ לכוכב במרחק 4 שנות אור, מסתובבת מיד, וחוזרת לאט יותר, במהירות $0.6c$. אחיה נשאר
      על כדור הארץ. הזניחו את זמן הסיבוב ועבדו בשנים ובשנות אור, כך ש-$c = 1$. רגע לפני הסיבוב היא במערכת ההליכה שלה, ורגע
      אחריו במערכת החזרה. בכמה שנים קופצת, בסיבוב, הקריאה של שעון כדור הארץ שהמערכת שלה מכנה "עכשיו"?
    answer: 5.6
    unit: שנים
    correctFeedback: >-
      נכון. במערכת של כדור הארץ הסיבוב הוא המאורע $x = 4$, $t = 5$. קו הבו-זמניות של מערכת שנעה במהירות $u$ (ביחידות של
      $c$) דרך המאורע הוא $t - ux = \text{const}$, והוא פוגש את כדור הארץ, $x = 0$, בקריאה $t - ux$. במערכת ההליכה, $u = 0.8$:
      $5 - 3.2 = 1.8$ שנים. במערכת החזרה, $u = -0.6$: $5 + 2.4 = 7.4$ שנים. הקפיצה היא $5.6$ שנים. בדיקה: בדרך החזרה, 6.67
      שנים במערכת של כדור הארץ, השעון שלה מראה $6.67/1.25 = 5.33$ שנים, ושעון כדור הארץ מפגר במערכת החזרה פי $1.25$: עוד
      $4.27$ שנים. $7.4 + 4.27 = 11.7$, בדיוק משך המסע במערכת של כדור הארץ, $5 + 6.67$. **בדיקת גבולות:** כשמהירות החזרה
      שווה למהירות ההליכה, הקפיצה חוזרת ל-$2\beta L/c$.
    wrongFeedback: >-
      כתבו את קו הבו-זמניות שעובר דרך מאורע הסיבוב, $t - ux = \text{const}$, פעם עם $u = 0.8$ ופעם עם $u = -0.6$, ומצאו איפה
      כל אחד פוגש את קו העולם של כדור הארץ, $x = 0$.
    commonWrong:
      - value: 6.4
        feedback: >-
          זה $2\beta L/c$ עם $0.8$, הקפיצה של מסע שחוזר במהירות ההליכה. כאן קו הבו-זמניות של מערכת החזרה נוטה פחות: מערכת
          ההליכה תורמת $0.8\cdot4 = 3.2$ ומערכת החזרה רק $0.6\cdot4 = 2.4$.
      - value: 4.8
        feedback: >-
          זה $2\beta L/c$ עם $0.6$. מערכת ההליכה נעה ב-$0.8c$, ולכן הקו שלה תורם $0.8\cdot4 = 3.2$, ולא $2.4$.
      - value: 3.2
        feedback: >-
          זו רק התרומה של מערכת ההליכה: ההפרש בין "עכשיו" שלה על כדור הארץ, $1.8$, לבין $t = 5$. במערכת החזרה הקו נוטה לצד
          השני ומוסיף עוד $0.6\cdot4 = 2.4$.
    hints:
      - 'במערכת של כדור הארץ, איפה ומתי מסתובבת הנוסעת?'
      - 'קו הבו-זמניות של מערכת שנעה במהירות $u$ עובר דרך המאורע, ובדיאגרמה של כדור הארץ השיפוע שלו $u$: $ct = ux + \text{const}$.'

  - id: Q-9.6-acceleration-role
    type: mc
    objectives: [OBJ-9.6-1]
    qualitative: true
    level: bagrut
    prompt: >-
      דנה ונועה יוצאות יחד מכדור הארץ במהירות $0.8c$, ואחיהן נשאר על כדור הארץ. דנה טסה לכוכב במרחק 4 שנות אור, מסתובבת
      וחוזרת באותה מהירות, 10 שנים אחרי היציאה בשעון של כדור הארץ. נועה מסתובבת כבר שנה אחרי היציאה (בשעון של כדור הארץ),
      חוזרת באותה מהירות, ומחכה על כדור הארץ עד שדנה חוזרת. שתיהן יוצאות, מסתובבות ונוחתות באותה דרך בדיוק: אותן תאוצות,
      באותם משכי זמן קצרים, שאפשר להזניח. מה נכון כשדנה חוזרת?
    choices:
      - text: >-
          נועה הזדקנה 9.2 שנים ודנה 6.0, כי הזמן העצמי לאורך קו העולם קטן יותר ככל שהנוסעת נעה מהר זמן רב יותר; אותן
          תאוצות לא נותנות אותו גיל.
        correct: true
        feedback: >-
          נכון. נועה: שנתיים של כדור הארץ בתנועה, $2/\gamma = 1.2$ שנים בשעון שלה, ועוד 8 שנים על כדור הארץ, יחד 9.2. דנה:
          $10/\gamma = 6.0$. האח: 10. **בדיקת גבולות:** אילו נועה הייתה מסתובבת מיד, כמעט בלי לזוז, היא הייתה מזדקנת 10 שנים,
          כמו אחיה, עם אותן תאוצות בדיוק.
      - text: >-
          שתיהן הזדקנו 6.0 שנים, כי עברו את אותן תאוצות, והתאוצה היא שמאטה את השעון.
        feedback: >-
          נועה הזדקנה 9.2 שנים ודנה 6.0: אותן תאוצות וגילים שונים, ולכן התאוצה עצמה אינה הסיבה. השעונים נבדלים לפי משך
          הזמן שבו כל אחת נעה מהר.
        misconception: MC-9-acceleration-slows-clock
      - text: >-
          שתיהן הזדקנו 10 שנים, כמו אחיהן, כי כל אחת מהן מוצאת שדווקא השעונים של האחרים מפגרים.
        feedback: >-
          כל נוסעת מחליפה מערכת אינרציאלית בסיבוב שלה, והאח לא, ולכן המצב לא סימטרי. בחשבון במערכת של כדור הארץ, שאינרציאלית
          כל הזמן: האח 10 שנים, נועה 9.2, דנה 6.0.
        misconception: MC-9-twins-same-age
      - text: >-
          נועה הזדקנה 9.2 שנים ודנה 6.0, כי דנה היא זו שבאמת נעה רחוק, ומי שבאמת נע מזדקן לאט.
        feedback: >-
          התוצאה נכונה, אבל לא הנימוק. בין מערכות אינרציאליות אין "באמת נע": בדרך ההליכה כל צד יכול לומר שהשני נע. מה
          שקובע הוא הזמן העצמי לאורך כל קו עולם, שמחשבים במערכת אינרציאלית אחת.
        misconception: MC-9-motion-absolute
    hints:
      - 'חשבו את הגיל של כל אחת במערכת של כדור הארץ, שאינרציאלית כל הזמן.'

  # ---------------------------------------------------------------- OBJ-9.6-2 the pole and the barn
  - id: Q-9.6-pole-fits
    type: mc
    objectives: [OBJ-9.6-2]
    qualitative: true
    level: basic
    prompt: >-

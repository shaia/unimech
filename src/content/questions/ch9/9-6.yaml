    answer: 35.6
    unit: ns
    correctFeedback: >-
      נכון. $\Delta t' = \gamma v\Delta x/c^2$, כלומר $\dfrac53\cdot\dfrac{0.8\cdot8.0}{3.0\cdot10^8}\,\text{s}$, שזה
      $35.6\,\text{ns}$. בדיקה, כשהמוט באמצע האסם (מטר פנוי בכל צד, במערכת של האסם): לפי טרנספורמציית לורנץ, במערכת של
      המוט דלת היציאה פועלת $1.7\,\text{m}$ לפני החזית שלו, ודלת הכניסה פועלת $35.6\,\text{ns}$ אחר כך, $1.7\,\text{m}$

        misconception: MC-9-contraction-is-compression
      - text: האם הדלת פוגעת במוט תלוי במערכת, ולכן אין צורך להסביר.
        feedback: >-
          דלת שפוגעת במוט היא מאורע במקום אחד, ועל מאורעות כאלה כל המערכות מסכימות. רק הבו-זמניות של מאורעות במקומות
          **שונים** תלויה במערכת.
    hints:
      - 'לשני מאורעות שבו-זמניים במערכת של האסם, איזה מהם קודם במערכת של המוט: זה שמאחור או זה שקדימה בכיוון התנועה של המוט?'

  - id: Q-9.6-door-gap
    type: numeric

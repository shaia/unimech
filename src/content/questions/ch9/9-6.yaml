      בדיוק באמצע האסם, שתי הדלתות נסגרות ונפתחות מיד, באותו רגע. אחר כך החזית של המוט ממשיכה ועוברת בדלת היציאה. במערכת
      של המוט, כמה זמן עובר בין פעולת דלת היציאה לבין הרגע שבו החזית של המוט עוברת בה? ענו בננו-שניות.
    answer: 6.94
    unit: ns
    correctFeedback: >-
      נכון. במערכת של האסם המוט באורך $10/\gamma = 6.0\,\text{m}$, ובאמצע האסם נשאר מטר פנוי לפני החזית. החזית עוברת אותו
      אחרי $1.0\,\text{m}/(0.8c) = 4.17\,\text{ns}$. שני המאורעות, פעולת הדלת ומעבר החזית, קורים באותו מקום במערכת של האסם,
      בדלת היציאה, ולכן $4.17\,\text{ns}$ הוא הזמן העצמי ביניהם, ובמערכת של המוט עובר יותר: $\gamma\cdot4.17 = 6.94\,\text{ns}$.
      בדיקה במערכת של המוט: הדלת פועלת $\gamma\cdot1.0 = 1.67\,\text{m}$ לפני החזית, והאסם נע לעבר המוט במהירות $0.8c$:
      $1.67\,\text{m}/(0.8c) = 6.94\,\text{ns}$. **בדיקת גבולות:** אילו המוט היה נכנס לאסם בדיוק, בלי מרווח, שני המאורעות

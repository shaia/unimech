    choices:
      - text: >-
          דלת היציאה נסגרת ונפתחת קודם, לפני שהחזית של המוט מגיעה אליה. אחר כך החזית עוברת בה, ורק אחרי שהקצה האחורי
          נכנס, דלת הכניסה נסגרת ונפתחת מאחוריו.
        correct: true
        feedback: >-
          נכון. אף דלת לא פוגעת במוט, ובזה שתי המערכות מסכימות. הן חלוקות רק על השאלה אם הדלתות פעלו בו-זמנית.
      - text: שתי הדלתות נסגרות באותו רגע, והמוט נשבר.
        feedback: >-
          במערכת של האסם המוט לא נפגע, ופגיעה של דלת במוט היא מאורע במקום אחד, שכל המערכות מסכימות עליו. לכן גם במערכת
          של המוט הוא לא נפגע, והדלתות לא נסגרות בו-זמנית.
        misconception: MC-9-simultaneity-absolute
      - text: המוט נדחס ל-$4.8\,\text{m}$ ונכנס לאסם, והדלתות נסגרות עליו יחד.
        feedback: >-
          במערכת שלו המוט נח ואורכו $10\,\text{m}$. אין שום כוח שדוחס אותו.
        misconception: MC-9-contraction-is-compression
      - text: דלת הכניסה נסגרת קודם, כשהקצה האחורי של המוט כבר בפנים, ואז דלת היציאה.
        feedback: >-
          אם דלת הכניסה הייתה נסגרת קודם, כשהמוט בן $10\,\text{m}$ והאסם בן $4.8\,\text{m}$, החזית שלו כבר הייתה מזמן
          מחוץ לדלת היציאה, ודלת היציאה הייתה נסגרת עליו. הסדר הוא הפוך.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          מאורעות שבו-זמניים במערכת של האסם, במקומות שונים, אינם בו-זמניים במערכת של המוט. במערכת של המוט, מבין שני
          המאורעות קודם זה שנמצא קדימה בכיוון התנועה של המוט: דלת היציאה.
        correct: true
        feedback: >-
          זה הנימוק. מטרנספורמציית לורנץ, $t' = \gamma\left(t - vx/c^2\right)$: לשני מאורעות עם $t = 0$, זה שב-$x$ הגדול יותר,
          בכיוון התנועה של המוט, מקבל $t'$ קטן יותר. ההפרש הוא $\gamma v\Delta x/c^2$, עם $\Delta x = 8.0\,\text{m}$.
      - text: במערכת של המוט, הוא עצמו מתקצר, ולכן אין בעיה.

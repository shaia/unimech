# Lesson 9.6 question bank: the comprehension ladder of "פרדוקסים ביחסות".
# Every objective has ≥ 3 questions, one of them qualitative; the lesson climbs basic → mid → bagrut.
# Distances in light-years and times in years, so c = 1 in those units.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (C_LIGHT = 3.0e8), .scratch/ch9/nums.ts:
#   twins: star at L = 4 light-years, β = 0.8 (γ = 5/3): Earth 2L/v = 10.0 years, traveller 10/γ = 6.00
#   (wrong 10γ = 16.7, one way 3.00); traveller's account: Earth ages 3.00/γ = 1.80 per leg,
#   jump of the simultaneity line at the turnaround 2βL = 6.40 (Earth reading 1.80 → 8.20);
#   1.80 + 6.40 + 1.80 = 10.0; wrong βL = 3.20, 2γβL = 10.7; trip to 8 light-years: 20.0 vs 12.0;
#   pole L₀ = 10 m, barn 8.0 m, β = 0.8: pole in the barn frame 6.00 m, barn in the pole frame 4.80 m
#   (wrong 8γ = 13.3, 8(1 − β²) = 2.88); door events 8.0 m apart: Δt′ = γβΔx/c = 35.6 ns
#   (wrong βΔx/c = 21.3, βΔx/(γc) = 12.8, Δx/c = 26.7). Pole [1, 7] m in the barn at t = 0: in the
#   pole frame rear at 1.67 m, front 11.7 m; entrance door event at x′ = 0, t′ = 0; exit at x′ = 13.3 m,
#   t′ = −35.6 ns: each door acts outside the pole.

chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.6-1 the twin paradox
  - id: Q-9.6-twin-ages
    type: numeric
    objectives: [OBJ-9.6-1]
    level: basic
    prompt: >-
      תאומה נוסעת טסה במהירות $0.8c$ לכוכב שנמצא במרחק 4 שנות אור מכדור הארץ, ומיד חוזרת באותה מהירות. אחיה התאום נשאר
      על כדור הארץ. הזניחו את זמני ההאצה. במערכת של כדור הארץ המסע נמשך 10 שנים. בכמה שנים הזדקנה הנוסעת?
    answer: 6.0
    unit: שנים
    correctFeedback: >-
      נכון. במערכת של כדור הארץ, שהיא אינרציאלית לכל אורך המסע, השעון של הנוסעת מפגר פי $\gamma = 5/3$, ולכן היא
      הזדקנה $10/\gamma = 6.0$ שנים, 3 בכל כיוון. אחיה הזדקן 10.
    wrongFeedback: >-
      חשבו במערכת של כדור הארץ, שהיא אינרציאלית כל הזמן. השעון של מי שנע במערכת הזו מפגר פי $\gamma$.
    commonWrong:
      - value: 16.7
        feedback: >-
          כפלתם ב-$\gamma$. השעון של הנוסעת נמצא בכל המאורעות של המסע שלה, ולכן הוא מודד את הזמן העצמי, הקצר יותר.
        misconception: MC-9-proper-time-rest-frame
      - value: 10
        feedback: >-
          זה הזמן במערכת של כדור הארץ. הגילים לא שווים בפגישה: היא חוזרת צעירה מאחיה ב-4 שנים.
        misconception: MC-9-twins-same-age
      - value: 3.0
        feedback: 'זה כיוון אחד בלבד. המסע הלוך וחזור, ובכל כיוון היא מזדקנת 3 שנים.'
    hints:
      - 'מה $\gamma$ ב-$0.8c$? ובאיזו מערכת מותר להשתמש בהתארכות זמן לכל המסע?'

  - id: Q-9.6-symmetry-break
    type: twotier
    objectives: [OBJ-9.6-1]
    qualitative: true
    level: mid
    prompt: >-
      באותו מסע, הנוסעת טוענת: "במערכת שלי כדור הארץ הוא שנע במהירות $0.8c$, ולכן השעון של אחי מפגר. כשנפגש, הוא יהיה
      הצעיר." מי צעיר יותר בפגישה?
    choices:
      - text: הנוסעת.
        correct: true
        feedback: >-
          נכון. החשבון של כדור הארץ נכון לכל המסע, כי כדור הארץ נמצא כל הזמן במערכת אינרציאלית אחת. החשבון של הנוסעת
          משתמש ב"מערכת שלי" כאילו הייתה אחת, אבל יש לה שתיים: מערכת ההליכה ומערכת החזרה.
      - text: האח, כפי שהנוסעת טוענת.
        feedback: >-
          הטענה שלה נכונה בכל אחת משתי הדרכים לחוד: בכל אחת מהן היא רואה את השעון של אחיה מפגר. אבל כשהיא מחליפה מערכת
          בנקודת הסיבוב, מה ש"עכשיו" על כדור הארץ קופץ בבת אחת קדימה, והקפיצה הזו חסרה בטענה שלה.
      - text: הם בני אותו גיל, כי כל אחד רואה את השעון של השני מפגר באותו גורם.
        feedback: >-
          ההשפעות היו מתקזזות רק אם המצב היה סימטרי. המסע של הנוסעת כולל שינוי כיוון, ושל אחיה לא, וזה ניתן לבדיקה: רק
          היא מרגישה את התאוצה בסיבוב.
        misconception: MC-9-twins-same-age
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          האח נמצא כל המסע במערכת אינרציאלית אחת, והנוסעת מחליפה מערכת בנקודת הסיבוב. לכן רק החשבון של האח מותר מתחילתו
          ועד סופו.
        correct: true
        feedback: >-
          זה הנימוק. גם הנוסעת יכולה לחשב נכון, אם היא מחברת את שתי המערכות שלה ומוסיפה את הקפיצה של קו הבו-זמניות
          בסיבוב. תחשבו אותו בשאלות הבאות.
      - text: הנוסעת היא שבאמת נעה, והאח באמת נח.
        feedback: >-
          בין מערכות אינרציאליות אין "באמת נע". בדרך ההליכה, למשל, אין שום ניסוי שמבחין בין "הנוסעת נעה" ל"כדור הארץ נע".
          ההבדל הוא רק בשינוי הכיוון.
        misconception: MC-9-motion-absolute
      - text: בזמן הסיבוב הנוסעת מאיצה, והתאוצה מאטה את השעון שלה.
        feedback: >-
          אפשר לעשות את הסיבוב קצר כרצוננו, והשעון שלה מתקתק בו כרגיל. הפרש הגילים, 4 שנים, נצבר לאורך הדרך ולא בסיבוב.
          התאוצה רק מסמנת את המעבר בין שתי המערכות.
        misconception: MC-9-acceleration-slows-clock
    hints:
      - 'מי משני התאומים נמצא כל הזמן במערכת אינרציאלית אחת?'

  - id: Q-9.6-outbound-earth
    type: numeric
    objectives: [OBJ-9.6-1]
    level: mid
    prompt: >-
      עכשיו החשבון במערכות של הנוסעת. בדרך ההליכה ($0.8c$, 3 שנים בשעון שלה) היא רואה את השעון של כדור הארץ מפגר פי
      $\gamma = 5/3$. בכמה שנים מזדקן אחיה בדרך ההליכה, לפי קו הבו-זמניות של מערכת ההליכה שלה?
    answer: 1.8
    unit: שנים
    correctFeedback: >-
      נכון. $3.0/\gamma = 3.0\cdot\tfrac35 = 1.8$ שנים. אותו דבר בדרך החזרה, ולכן משתי הדרכים יחד רק 3.6 שנים, ולא 10.
      חסרות 6.4 שנים, ובשאלה הבאה תמצאו אותן בסיבוב.
    wrongFeedback: >-
      במערכת ההליכה של הנוסעת, השעון של כדור הארץ הוא שנע, ולכן הוא מפגר פי $\gamma$ ביחס לשעון שלה.
    commonWrong:
      - value: 5.0
        feedback: >-
          זה מה שהשעון של כדור הארץ מראה ברגע ההגעה לכוכב **במערכת של כדור הארץ**. במערכת ההליכה של הנוסעת, הרגע על כדור
          הארץ שבו-זמני עם ההגעה הוא אחר: שם השעון מראה 1.8 שנים.
        misconception: MC-9-simultaneity-absolute
      - value: 3.0
        feedback: 'זה הזמן בשעון של הנוסעת. השעון של כדור הארץ נע במערכת שלה, ולכן מתקתק לאט ממנו פי $\gamma$.'
    hints:
      - 'במערכת של הנוסעת היא נחה וכדור הארץ נע. השעון של מי מפגר?'

  - id: Q-9.6-turnaround-jump
    type: numeric
    objectives: [OBJ-9.6-1]
    level: bagrut
    prompt: >-
      רגע לפני הסיבוב, במערכת ההליכה של הנוסעת, המאורע על כדור הארץ שבו-זמני עם ההגעה לכוכב הוא הרגע שבו השעון של
      כדור הארץ מראה 1.8 שנים. רגע אחרי הסיבוב היא במערכת החזרה, שנעה במהירות $0.8c$ לכיוון כדור הארץ. כמה מראה השעון של
      כדור הארץ "עכשיו" במערכת החזרה, ובכמה שנים קפץ? ענו בגודל הקפיצה.
    answer: 6.4
    unit: שנים
    correctFeedback: >-
      נכון. במערכת של כדור הארץ ההגעה לכוכב היא המאורע $x = 4$, $t = 5$ (שנים ושנות אור). קו הבו-זמניות של מערכת
      במהירות $\beta$ שעובר דרכו הוא $t - \beta x = \text{const}$. במערכת ההליכה, $\beta = 0.8$, על כדור הארץ ($x = 0$) הוא
      פוגש את $t = 5 - 0.8\cdot4 = 1.8$. במערכת החזרה $\beta$ מתהפך, ו-$t = 5 + 3.2 = 8.2$. הקפיצה היא
      $2\beta L/c = 6.4$ שנים, והחשבון של הנוסעת נסגר: $1.8 + 6.4 + 1.8 = 10$ שנים לאחיה. **בדיקת גבולות:** כש-$\beta \to 0$
      הקפיצה מתאפסת וגם הפרש הגילים, וכש-$L \to 0$, מסע בלי מרחק, אין קפיצה.
    wrongFeedback: >-
      כתבו את קו הבו-זמניות שעובר דרך מאורע ההגעה, $t - \beta x/c = \text{const}$, פעם עם $\beta = 0.8$ ופעם עם המהירות
      ההפוכה, ומצאו איפה כל אחד פוגש את קו העולם של כדור הארץ, $x = 0$.
    commonWrong:
      - value: 3.2
        feedback: >-
          זו רק חצי מהקפיצה: ההפרש בין "עכשיו" של מערכת ההליכה לבין "עכשיו" של כדור הארץ, $\beta L/c$. במערכת החזרה הקו
          נוטה לצד השני, ומוסיף עוד $\beta L/c$.
      - value: 10.7
        feedback: >-
          כפלתם ב-$\gamma$. בהיסט של $\beta x/c$ בשעון של כדור הארץ אין $\gamma$: הוא נקרא ישירות מהמשוואה של קו הבו-זמניות
          במערכת של כדור הארץ.
    hints:
      - 'במערכת של כדור הארץ, איפה ומתי מגיעה הנוסעת לכוכב?'
      - 'קו הבו-זמניות של מערכת שנעה במהירות $v$ הוא ציר $x''$ שלה, $ct = \beta x$, מוזז כך שיעבור דרך המאורע.'

  - id: Q-9.6-acceleration-role
    type: mc
    objectives: [OBJ-9.6-1]
    qualitative: true
    level: bagrut
    prompt: >-
      שתי נוסעות יוצאות מכדור הארץ במהירות $0.8c$, ומסתובבות בדיוק באותה דרך: אותה תאוצה במשך אותו זמן קצר. אחת מסתובבת
      ליד כוכב במרחק 4 שנות אור, והשנייה ליד כוכב במרחק 8 שנות אור. מה זה מלמד על הסיבה להפרש הגילים?
    choices:
      - text: >-
          הפרש הגילים מכדור הארץ הוא 4 שנים לראשונה ו-8 לשנייה, עם אותו סיבוב בדיוק. לכן ההפרש לא נוצר בתאוצה עצמה. הוא
          נובע מאורך הדרכים שבהן כל נוסעת נמצאת במערכת אחרת מזו של כדור הארץ.
        correct: true
        feedback: >-
          נכון. לשנייה: 20 שנים על כדור הארץ מול $20/\gamma = 12$ שלה. ההפרש פרופורציוני לאורך המסע, $2L/v\cdot(1 - 1/\gamma)$,
          ולא לשום דבר בסיבוב. בחשבון של הנוסעת הוא מופיע כקפיצה $2\beta L/c$, שגם היא גדלה עם $L$. **בדיקת גבולות:**
          כש-$L \to 0$ ההפרש מתאפס, גם עם אותה תאוצה.
      - text: >-
          לשתיהן אותו הפרש גילים, כי לשתיהן אותה תאוצה, והתאוצה היא שמאטה את השעון.
        feedback: >-
          לשנייה המסע כפול, 20 שנים על כדור הארץ מול 12 שלה, והפרש של 8 שנים, לעומת 4 של הראשונה. התאוצה זהה וההפרש
          לא, ולכן התאוצה עצמה אינה הסיבה.
        misconception: MC-9-acceleration-slows-clock
      - text: >-
          לשתיהן אין הפרש גילים בכלל, כי מבחינת כל נוסעת כדור הארץ הוא שנע.
        feedback: >-
          כל נוסעת מחליפה מערכת בסיבוב ואחיה לא, ולכן המצב לא סימטרי. החשבון במערכת של כדור הארץ, שאינרציאלית כל הזמן,
          נותן הפרשים של 4 ו-8 שנים.
        misconception: MC-9-twins-same-age
      - text: >-
          השנייה צעירה יותר כי היא נעה יותר זמן, ומי שנע הוא שמזדקן לאט.
        feedback: >-
          התוצאה נכונה, אבל לא הנימוק. "מי שנע" אינו מושג מוחלט: בדרך ההליכה כל צד יכול לומר שהשני נע. מה שמבדיל את
          הנוסעת הוא שהיא מחליפה מערכת אינרציאלית.
        misconception: MC-9-motion-absolute
    hints:
      - 'חשבו את הפרש הגילים לכל נוסעת במערכת של כדור הארץ.'

  # ---------------------------------------------------------------- OBJ-9.6-2 the pole and the barn
  - id: Q-9.6-pole-fits
    type: mc
    objectives: [OBJ-9.6-2]
    qualitative: true
    level: basic
    prompt: >-
      מוט שאורכו העצמי $10\,\text{m}$ נע במהירות $0.8c$ דרך אסם שאורכו העצמי $8.0\,\text{m}$, עם שתי דלתות פתוחות בשני
      הקצוות. במערכת של האסם המוט באורך $6.0\,\text{m}$, ובמערכת של המוט האסם באורך $4.8\,\text{m}$. מה נכון?
    choices:
      - text: >-
          שתי המערכות צודקות. במערכת של האסם יש רגע שבו המוט כולו בפנים. במערכת של המוט אין רגע כזה. הן חלוקות על השאלה
          מה קורה "באותו רגע" בשני הקצוות.
        correct: true
        feedback: >-
          נכון. "המוט כולו בפנים" פירושו ששני הקצוות של המוט בין הדלתות **באותו רגע**, ו"באותו רגע" במקומות שונים תלוי
          במערכת. על מה שקורה במקום אחד, למשל אם דלת פגעה במוט, כל המערכות מסכימות.
      - text: >-
          רק מערכת האסם צודקת, כי האסם נח והמוט נע.
        feedback: >-
          במערכת של המוט, המוט נח והאסם נע. לפי עקרון היחסות שתי המערכות שקולות, ולכל אחת זכות שווה לתאר את המצב.
        misconception: MC-9-motion-absolute
      - text: >-
          המוט נדחס באמת ל-$6.0\,\text{m}$, ולכן הוא נכנס לאסם בשתי המערכות.
        feedback: >-
          במערכת של המוט הוא נח, ואורכו האורך העצמי, $10\,\text{m}$. אין כוח שדוחס אותו: ההתקצרות היא תוצאה של מדידת
          הקצוות באותו רגע במערכת שבה הוא נע.
        misconception: MC-9-contraction-is-compression
      - text: >-
          יש כאן סתירה אמיתית, שמראה שהתקצרות אורך היא רק אשליה.
        feedback: >-
          אין סתירה: שתי הטענות עוסקות בבו-זמניות בשני מקומות, והיא שונה בכל מערכת. וההתקצרות אינה אשליה; היא מה
          שנמדד כשמסמנים את שני הקצוות באותו רגע.
        misconception: MC-9-simultaneity-absolute

  - id: Q-9.6-barn-length
    type: numeric
    objectives: [OBJ-9.6-2]
    level: basic
    prompt: >-
      במצב של השאלה הקודמת (מוט באורך עצמי $10\,\text{m}$, אסם באורך עצמי $8.0\,\text{m}$, מהירות יחסית $0.8c$), חשבו את
      אורך האסם במערכת של המוט.
    answer: 4.8
    unit: m
    correctFeedback: >-
      נכון. $\gamma = 5/3$, ו-$L = L_0/\gamma = 8.0\cdot\tfrac35 = 4.8\,\text{m}$. האסם קצר מהמוט פי יותר משניים, ולכן במערכת של
      המוט אין רגע שבו שתי הדלתות סגורות עליו.
    wrongFeedback: 'במערכת של המוט האסם נע, ולכן הוא שמתקצר: $L = L_0/\gamma$.'
    commonWrong:
      - value: 13.3
        feedback: 'כפלתם ב-$\gamma$. גוף נע נמדד קצר מהאורך העצמי שלו, לא ארוך.'
        misconception: MC-9-moving-rod-longer
      - value: 2.88
        feedback: 'כפלתם ב-$1 - \beta^2 = 0.36$. ההתקצרות היא פי $\gamma = 1/\sqrt{1 - \beta^2}$: צריך שורש.'
    hints:
      - 'במערכת של המוט, מה האורך העצמי של האסם, ומה $\gamma$?'

  - id: Q-9.6-doors
    type: twotier
    objectives: [OBJ-9.6-2]
    qualitative: true
    level: mid
    prompt: >-
      במערכת של האסם, ברגע שבו המוט ($6.0\,\text{m}$) כולו בתוך האסם ($8.0\,\text{m}$), שתי הדלתות נסגרות לרגע ונפתחות
      מיד, באותו רגע. המוט נע מדלת הכניסה לכיוון דלת היציאה. מה קורה במערכת של המוט, שבה האסם באורך $4.8\,\text{m}$
      והמוט באורך $10\,\text{m}$?
    choices:
      - text: >-
          דלת היציאה נסגרת ונפתחת קודם, לפני שהחזית של המוט מגיעה אליה. אחר כך החזית עוברת בה, ורק אחרי שהקצה האחורי
          נכנס, דלת הכניסה נסגרת ונפתחת מאחוריו.
        correct: true
        feedback: >-
          נכון. אף דלת לא פוגעת במוט, ובזה שתי המערכות מסכימות. הן חלוקות רק על השאלה אם הדלתות פעלו בו-זמנית.
      - text: שתי הדלתות נסגרות באותו רגע, והמוט נשבר.
        feedback: >-
          במערכת של האסם המוט לא נפגע, ופגיעה של דלת במוט היא מאורע במקום אחד, שכל המערכות מסכימות עליו. לכן גם במערכת
          של המוט הוא לא נפגע, והדלתות לא נסגרות בו-זמנית.
        misconception: MC-9-simultaneity-absolute
      - text: המוט נדחס ל-$4.8\,\text{m}$ ונכנס לאסם, והדלתות נסגרות עליו יחד.
        feedback: >-
          במערכת שלו המוט נח ואורכו $10\,\text{m}$. אין שום כוח שדוחס אותו.
        misconception: MC-9-contraction-is-compression
      - text: דלת הכניסה נסגרת קודם, כשהקצה האחורי של המוט כבר בפנים, ואז דלת היציאה.
        feedback: >-
          אם דלת הכניסה הייתה נסגרת קודם, כשהמוט בן $10\,\text{m}$ והאסם בן $4.8\,\text{m}$, החזית שלו כבר הייתה מזמן
          מחוץ לדלת היציאה, ודלת היציאה הייתה נסגרת עליו. הסדר הוא הפוך.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          מאורעות שבו-זמניים במערכת של האסם, במקומות שונים, אינם בו-זמניים במערכת של המוט. במערכת של המוט, האסם נע לקראתו,
          ומבין שני המאורעות זה שבחלק האחורי של האסם, דלת היציאה, קורה קודם.
        correct: true
        feedback: >-
          זה הנימוק: המוט ממשיך לנוע ימינה, ולכן במערכת שלו האסם נע שמאלה, ודלת היציאה היא הקצה האחורי שלו. בשאלה הבאה
          תחשבו כמה זמן עובר בין שתי הדלתות.
      - text: במערכת של המוט, הוא עצמו מתקצר, ולכן אין בעיה.
        feedback: >-
          במערכת שבה גוף נח הוא באורכו העצמי. המוט מתקצר רק במערכת שבה הוא נע.
        misconception: MC-9-contraction-is-compression
      - text: האם הדלת פוגעת במוט תלוי במערכת, ולכן אין צורך להסביר.
        feedback: >-
          דלת שפוגעת במוט היא מאורע במקום אחד, ועל מאורעות כאלה כל המערכות מסכימות. רק הבו-זמניות של מאורעות במקומות
          **שונים** תלויה במערכת.
    hints:
      - 'במערכת של המוט, לאיזה כיוון נע האסם? איזו דלת היא הקצה האחורי שלו?'

  - id: Q-9.6-door-gap
    type: numeric
    objectives: [OBJ-9.6-2]
    level: bagrut
    prompt: >-
      בשאלה הקודמת, שתי הדלתות פועלות בו-זמנית במערכת של האסם, במרחק $8.0\,\text{m}$ זו מזו, והמהירות היחסית $0.8c$. כמה
      זמן עובר במערכת של המוט בין פעולת דלת היציאה לפעולת דלת הכניסה? ענו בננו-שניות.
    answer: 35.6
    unit: ns
    correctFeedback: >-
      נכון. $\Delta t' = \gamma\dfrac{v\Delta x}{c^2} = \dfrac53\cdot\dfrac{0.8\cdot8.0}{3.0\cdot10^8} = 3.56\cdot10^{-8}\,\text{s} = 35.6\,\text{ns}$.
      בדיקה, כשהמוט באמצע האסם (מטר פנוי בכל צד, במערכת של האסם): לפי טרנספורמציית לורנץ, במערכת של המוט דלת היציאה
      פועלת $1.7\,\text{m}$ לפני החזית שלו, ודלת הכניסה פועלת $35.6\,\text{ns}$ אחר כך, $1.7\,\text{m}$ מאחורי הקצה האחורי
      שלו. אף דלת לא נוגעת במוט. **בדיקת גבולות:** כש-$v \to 0$ גם $\Delta t' \to 0$, והבו-זמניות של שתי הדלתות חוזרת.
    wrongFeedback: >-
      הדלתות בו-זמניות במערכת של האסם, $\Delta t = 0$, ו-$\Delta x = 8.0\,\text{m}$. הציבו בטרנספורמציה של הזמן.
    commonWrong:
      - value: 21.3
        feedback: 'שכחתם את $\gamma$: $v\Delta x/c^2 = 21.3\,\text{ns}$, ו-$\Delta t''$ גדול ממנו פי $5/3$.'
      - value: 12.8
        feedback: >-
          חילקתם ב-$\gamma$, אולי כי השתמשתם באורך המקוצר של האסם, $4.8\,\text{m}$. בטרנספורמציה נכנס $\Delta x$ **במערכת של
          האסם**, שבה המאורעות בו-זמניים: $8.0\,\text{m}$.
        misconception: MC-9-ends-not-simultaneous
      - value: 26.7
        feedback: 'זה $\Delta x/c$, הזמן שאור עובר את האסם. בטרנספורמציה המרחק מוכפל גם ב-$v/c$ וגם ב-$\gamma$.'
    hints:
      - '$\Delta t'' = \gamma\left(\Delta t - v\Delta x/c^2\right)$, עם $\Delta t = 0$. הגודל מספיק.'

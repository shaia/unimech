      - 'במערכת של המוט, מה האורך העצמי של האסם, ומה $\gamma$?'

  - id: Q-9.6-doors
    type: twotier
    objectives: [OBJ-9.6-2]
    qualitative: true
    level: mid
    prompt: >-
      מוט שאורכו העצמי $10\,\text{m}$ נע במהירות $0.8c$ דרך אסם שאורכו העצמי $8.0\,\text{m}$, מדלת הכניסה לכיוון דלת היציאה.
      במערכת של האסם המוט באורך $6.0\,\text{m}$, וברגע שבו הוא כולו בתוך האסם שתי הדלתות נסגרות לרגע ונפתחות מיד, באותו רגע.

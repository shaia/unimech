#   twins: star at L = 4 light-years, β = 0.8 (γ = 5/3): Earth 2L/v = 10.0 years, traveller 10/γ = 6.00
#   (wrong 10γ = 16.7, one way 3.00); traveller's account: Earth ages 3.00/γ = 1.80 per leg,
#   jump of the simultaneity line at the turnaround 2βL = 6.40 (Earth reading 1.80 → 8.20);
#   1.80 + 6.40 + 1.80 = 10.0; wrong βL = 3.20, 2γβL = 10.7; trip to 8 light-years: 20.0 vs 12.0;
#   pole L₀ = 10 m, barn 8.0 m, β = 0.8: pole in the barn frame 6.00 m, barn in the pole frame 4.80 m
#   (wrong 8γ = 13.3, 8(1 − β²) = 2.88); door events 8.0 m apart: Δt′ = γβΔx/c = 35.6 ns
#   (wrong βΔx/c = 21.3, βΔx/(γc) = 12.8, Δx/c = 26.7). Pole [1, 7] m in the barn at t = 0: in the
#   pole frame rear at 1.67 m, front 11.7 m; entrance door event at x′ = 0, t′ = 0; exit at x′ = 13.3 m,
#   t′ = −35.6 ns: each door acts outside the pole.

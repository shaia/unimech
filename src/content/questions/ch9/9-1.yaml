# Lesson 9.1 question bank: the comprehension ladder of "הרקע הניסיוני והנחות היסוד".
# A conceptual lesson: the Michelson-Morley experiment, Einstein's two postulates and the relativity of
# simultaneity. Every objective has ≥ 3 questions, one of them qualitative; basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (C_LIGHT = 3.0e8), src/physics/relativity.ts and
# src/physics/ether.ts, .scratch/ch9/9-1/nums.ts (the lesson author's recompute; the first draft's keys were right):
#   arm-times (rebuilt so it does not reuse the lesson's 11 m apparatus): Michelson's 1881 arms L = 1.2 m,
#   v = 3.0e4 m/s, β = 1.0e-4: t∥ − t⊥ = Lβ²/c = 4.0e-17 s (exact and expanded agree to 4 figures), 2% of the
#   1.83e-15 s period of 550 nm light; wrong 2Lβ²/c = 8.0e-17 (Michelson's own 1881 slip), Lβ/c = 4.0e-13;
#   fringe (rebuilt, the lesson prints 2Lβ²/λ = 0.40): unequal arms L₁ = 2.0 m, L₂ = 3.0 m, λ = 633 nm, 90° turn:
#   (L₁ + L₂)β²/λ = 0.0790 (exact 0.07899); wrong 2(L₁ + L₂)β²/λ = 0.158, 2L₁β²/λ = 0.0632, 2L₂β²/λ = 0.0948;
#   null-rules-out: 0.4 fringe expected, about 0.01 seen (1887 paper: "probably less than the fortieth part");
#   headlight of a rocket at 0.5c: c = 3.0e8 m/s; wrong c + v = 4.5e8, c − v = 1.5e8.
# Review (.scratch/review/ch9/r12.ts) recomputed every key, commonWrong and feedback number: none wrong. History checked
# against the Wikipedia article "Michelson–Morley experiment" (opened 2026-11-12): 1881 arms 1.2 m and Michelson's
# 0.04-vs-0.02 fringe slip (Potier, Lorentz); 1887 "one-fortieth", "probably less than one-sixth"; Kennedy 1926 no
# seasonal effect, Joos 1930 < 1.5 km/s; Miller claimed a small positive signal, so null-rules-out says the later
# repetitions did not find the predicted shift, not that every one found zero.

chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.1-1 Michelson-Morley
  - id: Q-9.1-mm-purpose
    type: mc
    objectives: [OBJ-9.1-1]
    qualitative: true
    level: basic
    prompt: >-
      בשנת 1887 מייקלסון ומורלי שלחו אור בשתי זרועות ניצבות של אינטרפרומטר, הלוך וחזור, ובדקו אם תבנית פסי
      ההתאבכות זזה כשמסובבים את המכשיר. לפי הפיזיקה של אותה תקופה, האור נע במהירות $c$ ביחס לתווך שנקרא אתר.
      מה הם ניסו למדוד?
    choices:
      - text: את המהירות של כדור הארץ ביחס לאתר, מתוך ההפרש בין זמני המעבר של האור בשתי הזרועות.
        correct: true
        feedback: >-
          נכון. אם כדור הארץ נע דרך האתר, "רוח אתר" נושבת דרך המעבדה. האור שנע לאורך הרוח וחזרה אמור להתעכב יותר
          מהאור שנע לרוחבה, וסיבוב המכשיר מחליף בין הזרועות ומזיז את הפסים.
      - text: את הערך של מהירות האור, $c$.
        feedback: >-
          המכשיר לא מודד את $c$ עצמו: הוא משווה בין **שני** זמני מעבר באותו מכשיר. הפסים זזים רק אם יש הפרש ביניהם,
          כלומר אם מהירות האור תלויה בכיוון. מהירות האור נמדדה בניסויים אחרים.
      - text: האם מהירות האור תלויה במהירות של המנורה ששולחת אותו.
        feedback: >-
          המנורה במכשיר נחה ביחס לזרועות, ולכן הניסוי לא בודק תנועה של המקור. הוא בודק אם מהירות האור במעבדה תלויה
          בכיוון, כפי שהיא אמורה להיות אם המעבדה נעה ביחס לאתר.
      - text: את אורך הגל של האור, מתוך המרחק בין הפסים.
        feedback: >-
          אורך הגל ידוע מראש וקובע רק את קנה המידה: הזזה של פס אחד היא הפרש של זמן מחזור אחד של האור. מה שמחפשים הוא
          **שינוי** בתבנית כשמסובבים את המכשיר.
    hints:
      - 'אם האור נע במהירות $c$ ביחס לאתר, מה המהירות שלו ביחס למעבדה שנעה דרך האתר?'

  - id: Q-9.1-mm-arm-times
    type: numeric
    objectives: [OBJ-9.1-1]
    level: mid
    prompt: >-
      לפי תאוריית האתר, כשהמעבדה נעה במהירות $v$ דרך האתר, זמן ההלוך-חזור של האור בזרוע באורך $L$ שמקבילה לתנועה,
      ובזרוע באותו אורך שניצבת לה, הם
      $$t_\parallel = \frac{2L/c}{1 - v^2/c^2},\qquad t_\perp = \frac{2L/c}{\sqrt{1 - v^2/c^2}}$$
      במכשיר הראשון של מייקלסון, ב-1881, כל זרוע הייתה באורך $L = 1.2\,\text{m}$. המהירות הצפויה היא מהירות כדור
      הארץ במסלולו, $v = 3.0\cdot10^4\,\text{m/s}$. חשבו את ההפרש $t_\parallel - t_\perp$. השתמשו בקירוב
      $(1 - x)^{n} \approx 1 - nx$ עבור $x \ll 1$.
    answer: 4.0e-17
    unit: s
    correctFeedback: >-
      נכון. עם $\beta = v/c = 1.0\cdot10^{-4}$: $t_\parallel \approx \dfrac{2L}{c}\left(1 + \beta^2\right)$ ו-$t_\perp \approx
      \dfrac{2L}{c}\left(1 + \dfrac{\beta^2}{2}\right)$, ולכן
      $$\begin{aligned} t_\parallel - t_\perp &\approx \frac{2L}{c}\cdot\frac{\beta^2}{2} = \frac{L\beta^2}{c} \\ &= \frac{1.2\cdot10^{-8}}{3.0\cdot10^8}\,\text{s} = 4.0\cdot10^{-17}\,\text{s} \end{aligned}$$
      הפרש זעיר: זמן מחזור של אור נראה הוא כ-$2\cdot10^{-15}\,\text{s}$, וההפרש הוא כ-2% ממנו. במכשיר של 1887 הזרועות
      היו ארוכות פי 9 בערך, וההפרש גדל באותו יחס.
    wrongFeedback: >-
      פתחו כל זמן לסדר ראשון ב-$\beta^2$: $(1 - \beta^2)^{-1} \approx 1 + \beta^2$, ו-$(1 - \beta^2)^{-1/2} \approx
      1 + \beta^2/2$. החסירו, והציבו $\beta = v/c$.
    commonWrong:
      - value: 8.0e-17
        feedback: >-
          קיבלתם $2L\beta^2/c$: פיתחתם את $t_\perp$ כאילו הוא $\dfrac{2L}{c}$ בדיוק, ושכחתם שגם הזרוע הניצבת מתעכבת,
          בחצי מהעיכוב של המקבילה. החזקה מינוס חצי נותנת $1 + \beta^2/2$. זו בדיוק הטעות שמייקלסון עצמו עשה ב-1881,
          ואחרים תיקנו אותה אחר כך.
      - value: 4.0e-13
        feedback: >-
          השתמשתם ב-$\beta$ במקום ב-$\beta^2$. העיכוב בכיוון אחד, $L/(c - v)$, והקיצור בכיוון ההפוך, $L/(c + v)$,
          מבטלים זה את זה בסדר ראשון, ונשאר רק אפקט מסדר שני.
    hints:
      - 'כתבו $x = v^2/c^2$. מה $n$ בכל אחד משני הביטויים?'

  - id: Q-9.1-null-rules-out
    type: multi
    objectives: [OBJ-9.1-1]
    qualitative: true
    level: mid
    prompt: >-
      מייקלסון ומורלי לא מצאו את ההזזה של הפסים שתאוריית האתר ניבאה כשסובבו את המכשיר. גם חזרות מדויקות יותר על
      הניסוי בעשורים שאחר כך, בין השאר בעונות שונות של השנה, כשכדור הארץ נע בכיוונים אחרים במסלולו, לא מצאו אותה. סמנו
      את כל המסקנות שנובעות מהתוצאה הזו.
    choices:
      - text: מהירות האור במעבדה זהה בכל הכיוונים, בגבולות הדיוק של הניסוי.
        correct: true
        feedback: >-
          נכון. הזזה של פסים הייתה נובעת מהפרש בין זמני המעבר בזרועות, והפרש כזה היה נובע ממהירות אור שתלויה בכיוון.
          אפס הזזה פירושו שאין הפרש כזה.
      - text: >-
          אין "רוח אתר" במהירות של כדור הארץ במסלולו. אם המעבדה נעה ביחס לאתר, המהירות הזו קטנה בהרבה מ-$30\,\text{km/s}$.
        correct: true
        feedback: >-
          נכון. הניסוי היה רגיש מספיק כדי לגלות רוח אתר של כמה קילומטרים בשנייה, ולא מצא אותה. איינשטיין הסיק מכאן
          שהאתר מיותר: אין מערכת ייחוס מועדפת לאור.
      - text: כדור הארץ נח במקרה ביחס לאתר.
        feedback: >-
          גם אם זה היה נכון ביום אחד, חצי שנה אחר כך כדור הארץ נע בכיוון ההפוך, וההפרש בין שתי המהירויות הוא כ-$60\,\text{km/s}$.
          תוצאות אפס בעונות שונות שוללות את האפשרות הזו.
        misconception: MC-9-null-means-earth-at-rest
      - text: המכשיר לא היה רגיש מספיק, ולכן התוצאה לא שוללת שום דבר.
        feedback: >-
          ההזזה הצפויה הייתה כ-0.4 פס, והמכשיר הבחין בהזזה של כ-0.01 פס. ההזזה הצפויה הייתה גדולה פי 40 ממה שהמכשיר
          יכול היה לראות.
        misconception: MC-9-mm-not-sensitive
      - text: מהירות האור לא תלויה במהירות המקור שלו.
        feedback: >-
          המנורה במכשיר נחה ביחס לזרועות, ולכן הניסוי הזה לא בודק מקור נע. שמהירות האור לא תלויה בתנועת המקור נבדק
          בניסויים אחרים, למשל באור של כוכבים כפולים ובפוטונים שנפלטים מחלקיקים מהירים.
    hints:
      - 'שאלו על כל מסקנה: מה במכשיר היה צריך להשתנות כדי שהניסוי יוכל לבדוק אותה?'

  - id: Q-9.1-mm-fringe
    type: numeric
    objectives: [OBJ-9.1-1]
    level: bagrut
    prompt: >-
      לפי תאוריית האתר, כשהמעבדה נעה במהירות $v$ דרך האתר, זמן ההלוך-חזור של האור בזרוע באורך $L$ שמקבילה לתנועה
      הוא $t_\parallel = \dfrac{2L/c}{1 - v^2/c^2}$, ובזרוע באורך $L$ שניצבת לה הוא $t_\perp = \dfrac{2L/c}{\sqrt{1 - v^2/c^2}}$.
      באינטרפרומטר במעבדה הזרועות **לא שוות**: זרוע 1, באורך $L_1 = 2.0\,\text{m}$, מקבילה לתנועה, וזרוע 2, באורך
      $L_2 = 3.0\,\text{m}$, ניצבת לה. אורך הגל של האור $\lambda = 633\,\text{nm}$, ומהירות המעבדה דרך האתר
      $v = 3.0\cdot10^4\,\text{m/s}$. מסובבים את המכשיר ב-$90^\circ$, כך שעכשיו זרוע 1 ניצבת לתנועה וזרוע 2 מקבילה
      לה. כל שינוי של זמן מחזור אחד של האור, $\lambda/c$, בהפרש בין זמני ההלוך-חזור של שתי הזרועות מזיז את תבנית
      פסי ההתאבכות בפס אחד. בכמה פסים (בגודל) הייתה התבנית אמורה לזוז לפי תאוריית האתר? השתמשו בקירוב
      $(1 - x)^{n} \approx 1 - nx$ עבור $x \ll 1$.
    answer: 0.079
    unit: פסים
    correctFeedback: >-
      נכון. נסמן $\beta = v/c$ ונפתח: $t_\parallel \approx \dfrac{2L}{c}(1 + \beta^2)$, $t_\perp \approx \dfrac{2L}{c}\left(1 + \dfrac{\beta^2}{2}\right)$.
      לפני הסיבוב ההפרש הוא
      $$\begin{aligned} \Delta t_{\text{before}} &\approx \frac{2L_1}{c}(1 + \beta^2) \\ &- \frac{2L_2}{c}\left(1 + \frac{\beta^2}{2}\right) \end{aligned}$$
      ואחריו הזרועות מחליפות את הגורמים. בשינוי, $\Delta t_{\text{before}} - \Delta t_{\text{after}}$, החלק הגדול $2(L_1 - L_2)/c$
      מתבטל, ונשאר
      $$\begin{aligned} &\frac{2L_1}{c}\cdot\frac{\beta^2}{2} + \frac{2L_2}{c}\cdot\frac{\beta^2}{2} \\ &= \frac{(L_1 + L_2)\beta^2}{c} \end{aligned}$$
      ולכן $\Delta N = \dfrac{(L_1 + L_2)\beta^2}{\lambda} = \dfrac{5.0\cdot10^{-8}}{6.33\cdot10^{-7}} = 0.079$ פס.
      **בדיקת גבולות:** כש-$L_1 = L_2 = L$ מקבלים $2L\beta^2/\lambda$, התוצאה של זרועות שוות; כש-$v \to 0$, $\Delta N \to 0$.
      ובגלל שההפרש הקבוע בין הזרועות מתבטל, אין צורך לבנות זרועות שוות בדיוק של אורך גל: מה שנמדד הוא רק השינוי בסיבוב.
    wrongFeedback: >-
      כתבו את ההפרש $t_1 - t_2$ לפני הסיבוב ואחריו, כל זמן מפותח לסדר ראשון ב-$\beta^2$. החסירו, וחלקו בזמן מחזור אחד, $\lambda/c$.
    commonWrong:
      - value: 0.158
        feedback: >-
          הצבתם $L = L_1 + L_2$ בנוסחה של זרועות שוות, $2L\beta^2/\lambda$. בנוסחה ההיא $L$ הוא אורך של **זרוע אחת**, והשינוי
          בסיבוב הוא $(L_1 + L_2)\beta^2/\lambda$: כל זרוע תורמת חצי מ-$2L\beta^2/\lambda$ שלה.
      - value: 0.0632
        feedback: >-
          השתמשתם בנוסחה של זרועות שוות עם $L = L_1$. כששתי הזרועות שונות, כל אחת תורמת לשינוי לפי האורך שלה, $L_i\beta^2/\lambda$.
      - value: 0.0948
        feedback: >-
          השתמשתם בנוסחה של זרועות שוות עם $L = L_2$. כששתי הזרועות שונות, כל אחת תורמת לשינוי לפי האורך שלה, $L_i\beta^2/\lambda$.
    hints:
      - 'כתבו את $t_1 - t_2$ לפני הסיבוב, כשזרוע 1 מקבילה לתנועה, ואחריו, כשזרוע 1 ניצבת לה.'
      - 'איזה חלק של ההפרש לא משתנה בסיבוב?'

  # ---------------------------------------------------------------- OBJ-9.1-2 postulates and simultaneity
  - id: Q-9.1-postulates
    type: mc
    objectives: [OBJ-9.1-2]
    qualitative: true
    level: basic
    prompt: אילו שתי טענות הן הנחות היסוד של איינשטיין בתורת היחסות הפרטית?
    choices:
      - text: >-
          חוקי הפיזיקה זהים בכל מערכות הייחוס האינרציאליות, ומהירות האור בריק היא $c$ בכל מערכות הייחוס האינרציאליות,
          בלי קשר לתנועת המקור.
        correct: true
        feedback: >-
          נכון. הראשונה היא עקרון היחסות של גליליי, מורחב לכל הפיזיקה ולא רק למכניקה. השנייה היא החדשה. מהשתיים יחד
          נובעים התארכות הזמן, התקצרות האורך ויחסיות הבו-זמניות.
      - text: חוקי הפיזיקה זהים בכל מערכות הייחוס האינרציאליות, ושום גוף לא נע מהר מהאור.
        feedback: >-
          שגוף לא יכול לעבור את מהירות האור היא **תוצאה** של התורה, לא הנחה. מקבלים אותה מכלל חיבור המהירויות
          היחסותי ומהסיבתיות, בשיעורים 9.4 ו-9.5.
      - text: >-
          חוקי הפיזיקה זהים בכל מערכות הייחוס האינרציאליות, ומהירות האור היא $c$ ביחס למקור שלו.
        feedback: >-
          אם האור נע במהירות $c$ ביחס למקור, אור ממנורה שנעה במהירות $v$ היה נע במהירות $c + v$, כמו כדור שנזרק מרכבת.
          ההנחה השנייה אומרת שכל צופה מודד $c$, גם כשהמקור נע ביחס אליו.
        misconception: MC-9-light-speed-adds-to-source
      - text: חוקי הפיזיקה זהים בכל מערכות הייחוס, גם במערכות מאיצות, והזמן זהה בכולן.
        feedback: >-
          ביחסות הפרטית העיקרון חל רק על מערכות אינרציאליות, ובמערכת מאיצה מופיעים כוחות מדומים. וזמן משותף לכל
          המערכות הוא בדיוק מה שהתורה מוותרת עליו.

  - id: Q-9.1-headlight
    type: numeric
    objectives: [OBJ-9.1-2]
    level: basic
    prompt: >-
      חללית חולפת על פני כדור הארץ במהירות $0.5c$ ומדליקה פנס קדמי, שמאיר בכיוון התנועה שלה. באיזו מהירות נע אור
      הפנס לפי צופה על כדור הארץ? ענו במטרים לשנייה.
    answer: 3.0e8
    unit: m/s
    correctFeedback: >-
      נכון: $c = 3.0\cdot10^8\,\text{m/s}$, לפי ההנחה השנייה. גם הצוות בחללית מודד לאור הפנס $c$. שניהם צודקים, וזה
      מה שמכריח לוותר על זמן ועל אורך מוחלטים.
    wrongFeedback: >-
      ההנחה השנייה אומרת שכל צופה אינרציאלי מודד לאור בריק את אותה מהירות, בלי קשר לתנועת המקור.
    commonWrong:
      - value: 4.5e8
        feedback: >-
          חיברתם מהירויות כמו גליליי, $c + 0.5c$. הכלל הזה עובד לכדור שנזרק מרכבת, אבל נכשל באור: כל צופה מודד לאור $c$.
        misconception: MC-9-light-speed-adds-to-source
      - value: 1.5e8
        feedback: >-
          החסרתם את מהירות החללית. אבל צופה על כדור הארץ מודד לאור מהירות $c$, כמו לכל אור אחר.
        misconception: MC-9-light-speed-adds-to-source


# Lesson 9.1 question bank: the comprehension ladder of "הרקע הניסיוני והנחות היסוד".
# A conceptual lesson: the Michelson-Morley experiment, Einstein's two postulates and the relativity of
# simultaneity. Every objective has ≥ 3 questions, one of them qualitative; basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed with src/physics/constants.ts (C_LIGHT = 3.0e8), .scratch/ch9/nums.ts:
#   arms L = 11 m, ether wind v = 3.0e4 m/s, β = 1.0e-4: t∥ − t⊥ = Lβ²/c = 3.67e-16 s (exact and
#   expanded agree to 4 figures); wrong 2Lβ²/c = 7.33e-16, Lβ/c = 3.67e-12;
#   λ = 550 nm: fringe shift on a 90° turn 2Lβ²/λ = 0.400; wrong Lβ²/λ = 0.200, 2Lβ/λ = 4000;
#   resolution 0.01 fringe is 40 times smaller, and corresponds to an ether wind of 4.7 km/s;
#   headlight of a rocket at 0.5c: c = 3.0e8 m/s; wrong c + v = 4.5e8, c − v = 1.5e8.

chapter: 9
questions:
  # ---------------------------------------------------------------- OBJ-9.1-1 Michelson-Morley
  - id: Q-9.1-mm-purpose
    type: mc
    objectives: [OBJ-9.1-1]
    qualitative: true
    level: basic
    prompt: >-
      בשנת 1887 מייקלסון ומורלי שלחו אור בשתי זרועות ניצבות של אינטרפרומטר, הלוך וחזור, ובדקו אם תבנית פסי
      ההתאבכות זזה כשמסובבים את המכשיר. לפי הפיזיקה של אותה תקופה, האור נע במהירות $c$ ביחס לתווך שנקרא אתר.
      מה הם ניסו למדוד?
    choices:
      - text: את המהירות של כדור הארץ ביחס לאתר, מתוך ההפרש בין זמני המעבר של האור בשתי הזרועות.
        correct: true
        feedback: >-
          נכון. אם כדור הארץ נע דרך האתר, "רוח אתר" נושבת דרך המעבדה. האור שנע לאורך הרוח וחזרה אמור להתעכב יותר
          מהאור שנע לרוחבה, וסיבוב המכשיר מחליף בין הזרועות ומזיז את הפסים.
      - text: את הערך של מהירות האור, $c$.
        feedback: >-
          המכשיר לא מודד את $c$ עצמו: הוא משווה בין **שני** זמני מעבר באותו מכשיר. הפסים זזים רק אם יש הפרש ביניהם,
          כלומר אם מהירות האור תלויה בכיוון. מהירות האור נמדדה בניסויים אחרים.
      - text: האם מהירות האור תלויה במהירות של המנורה ששולחת אותו.
        feedback: >-
          המנורה במכשיר נחה ביחס לזרועות, ולכן הניסוי לא בודק תנועה של המקור. הוא בודק אם מהירות האור במעבדה תלויה
          בכיוון, כפי שהיא אמורה להיות אם המעבדה נעה ביחס לאתר.
      - text: את אורך הגל של האור, מתוך המרחק בין הפסים.
        feedback: >-
          אורך הגל ידוע מראש וקובע רק את קנה המידה: הזזה של פס אחד היא הפרש של זמן מחזור אחד של האור. מה שמחפשים הוא
          **שינוי** בתבנית כשמסובבים את המכשיר.
    hints:
      - 'אם האור נע במהירות $c$ ביחס לאתר, מה המהירות שלו ביחס למעבדה שנעה דרך האתר?'

  - id: Q-9.1-mm-arm-times
    type: numeric
    objectives: [OBJ-9.1-1]
    level: mid
    prompt: >-
      לפי תאוריית האתר, כשהמעבדה נעה במהירות $v$ דרך האתר, זמן ההלוך-חזור של האור בזרוע באורך $L$ שמקבילה לתנועה,
      ובזרוע באותו אורך שניצבת לה, הם
      $$t_\parallel = \frac{2L/c}{1 - v^2/c^2},\qquad t_\perp = \frac{2L/c}{\sqrt{1 - v^2/c^2}}$$
      במכשיר של מייקלסון ומורלי, מראות מקפלות את הדרך כך שכל זרוע שקולה ל-$L = 11\,\text{m}$. המהירות הצפויה היא
      מהירות כדור הארץ במסלולו, $v = 3.0\cdot10^4\,\text{m/s}$. חשבו את ההפרש $t_\parallel - t_\perp$. השתמשו
      בקירוב $(1 - x)^{n} \approx 1 - nx$ עבור $x \ll 1$.
    answer: 3.67e-16
    unit: s
    correctFeedback: >-
      נכון. עם $\beta = v/c = 1.0\cdot10^{-4}$: $t_\parallel \approx \dfrac{2L}{c}\left(1 + \beta^2\right)$ ו-$t_\perp \approx
      \dfrac{2L}{c}\left(1 + \dfrac{\beta^2}{2}\right)$, ולכן
      $$t_\parallel - t_\perp \approx \frac{2L}{c}\cdot\frac{\beta^2}{2} = \frac{L\beta^2}{c} = \frac{11\cdot10^{-8}}{3.0\cdot10^8} = 3.67\cdot10^{-16}\,\text{s}$$
      הפרש זעיר, אבל זמן מחזור של אור נראה הוא כ-$2\cdot10^{-15}\,\text{s}$, ולכן הוא חלק ניכר ממחזור.
    wrongFeedback: >-
      פתחו כל זמן לסדר ראשון ב-$\beta^2$: $(1 - \beta^2)^{-1} \approx 1 + \beta^2$, ו-$(1 - \beta^2)^{-1/2} \approx
      1 + \beta^2/2$. החסירו, והציבו $\beta = v/c$.
    commonWrong:
      - value: 7.33e-16
        feedback: >-
          קיבלתם $2L\beta^2/c$: פיתחתם את $t_\perp$ כאילו הוא $\dfrac{2L}{c}$ בדיוק, ושכחתם שגם הזרוע הניצבת מתעכבת,
          בחצי מהעיכוב של המקבילה. החזקה מינוס חצי נותנת $1 + \beta^2/2$.
      - value: 3.67e-12
        feedback: >-
          השתמשתם ב-$\beta$ במקום ב-$\beta^2$. העיכוב בכיוון אחד, $L/(c - v)$, והקיצור בכיוון ההפוך, $L/(c + v)$,
          מבטלים זה את זה בסדר ראשון, ונשאר רק אפקט מסדר שני.
    hints:
      - 'כתבו $x = v^2/c^2$. מה $n$ בכל אחד משני הביטויים?'

  - id: Q-9.1-null-rules-out
    type: multi
    objectives: [OBJ-9.1-1]
    qualitative: true
    level: mid
    prompt: >-
      מייקלסון ומורלי לא מצאו שום הזזה של הפסים כשסובבו את המכשיר, וגם לא כשחזרו על הניסוי חצי שנה אחר כך, כשכדור
      הארץ נע בכיוון ההפוך במסלולו. סמנו את כל המסקנות שנובעות מהתוצאה הזו.
    choices:
      - text: מהירות האור במעבדה זהה בכל הכיוונים, בדיוק של הניסוי.
        correct: true
        feedback: >-
          נכון. הזזה של פסים הייתה נובעת מהפרש בין זמני המעבר בזרועות, והפרש כזה היה נובע ממהירות אור שתלויה בכיוון.
          אפס הזזה פירושו שאין הפרש כזה.
      - text: >-
          אין "רוח אתר" במהירות של כדור הארץ במסלולו. אם המעבדה נעה ביחס לאתר, המהירות הזו קטנה בהרבה מ-$30\,\text{km/s}$.
        correct: true
        feedback: >-
          נכון. הניסוי היה רגיש מספיק כדי לגלות רוח אתר של כמה קילומטרים בשנייה, ולא מצא אותה. איינשטיין הסיק מכאן
          שהאתר מיותר: אין מערכת ייחוס מועדפת לאור.
      - text: כדור הארץ נח במקרה ביחס לאתר.
        feedback: >-
          גם אם זה היה נכון ביום אחד, חצי שנה אחר כך כדור הארץ נע בכיוון ההפוך, וההפרש בין שתי המהירויות הוא כ-$60\,\text{km/s}$.
          תוצאת אפס בשתי המדידות שוללת את האפשרות הזו.
        misconception: MC-9-null-means-earth-at-rest
      - text: המכשיר לא היה רגיש מספיק, ולכן התוצאה לא שוללת שום דבר.
        feedback: >-
          ההזזה הצפויה הייתה כ-0.4 פס, והמכשיר הבחין בהזזה של כ-0.01 פס. ההזזה הצפויה הייתה גדולה פי 40 ממה שהמכשיר
          יכול היה לראות.
        misconception: MC-9-mm-not-sensitive
      - text: מהירות האור לא תלויה במהירות המקור שלו.
        feedback: >-
          המנורה במכשיר נחה ביחס לזרועות, ולכן הניסוי הזה לא בודק מקור נע. שמהירות האור לא תלויה בתנועת המקור נבדק
          בניסויים אחרים, למשל באור של כוכבים כפולים ובפוטונים שנפלטים מחלקיקים מהירים.
    hints:
      - 'שאלו על כל מסקנה: מה במכשיר היה צריך להשתנות כדי שהניסוי יוכל לבדוק אותה?'

  - id: Q-9.1-mm-fringe
    type: numeric
    objectives: [OBJ-9.1-1]
    level: bagrut
    prompt: >-
      במכשיר מהשאלה הקודמת ($L = 11\,\text{m}$, $v = 3.0\cdot10^4\,\text{m/s}$), האור באורך גל
      $\lambda = 550\,\text{nm}$. כשמסובבים את המכשיר ב-$90^\circ$, הזרועות מחליפות תפקיד. הפרש של זמן מחזור אחד של
      האור, $\lambda/c$, בין שתי הדרכים מזיז את התבנית בפס אחד. בכמה פסים הייתה התבנית אמורה לזוז לפי תאוריית האתר?
    answer: 0.4
    unit: פסים
    correctFeedback: >-
      נכון. לפני הסיבוב ההפרש הוא $\Delta t = L\beta^2/c$, ואחריו הוא מתהפך ל-$(-\Delta t)$, כי הזרועות התחלפו. השינוי הוא $2\Delta t$,
      ומספר הפסים הוא
      $$\Delta N = \frac{2\Delta t}{\lambda/c} = \frac{2L\beta^2}{\lambda} = \frac{2\cdot11\cdot10^{-8}}{5.5\cdot10^{-7}} = 0.40$$
      **בדיקת גבולות:** כש-$v \to 0$ גם $\Delta N \to 0$, כמו שצריך במעבדה שנחה באתר. המכשיר הבחין בהזזה של כ-0.01 פס,
      ולכן תוצאת האפס מגבילה את רוח האתר לפחות מ-$5\,\text{km/s}$ בערך.
    wrongFeedback: >-
      חשבו את השינוי בהפרש הזמנים בסיבוב (לא את ההפרש עצמו), וחלקו בזמן מחזור אחד, $\lambda/c$.
    commonWrong:
      - value: 0.2
        feedback: >-
          זה ההפרש בכיוון אחד של המכשיר, $L\beta^2/\lambda$. אבל רואים רק את **השינוי** בתבנית, וסיבוב ב-$90^\circ$ הופך את
          סימן ההפרש, ולכן השינוי כפול.
      - value: 4000
        feedback: >-
          השתמשתם ב-$\beta$ במקום ב-$\beta^2$. אפקט מסדר ראשון מתבטל בדרך הלוך-חזור: מה שהאור מפסיד בכיוון אחד הוא מרוויח
          כמעט כולו בחזרה.
    hints:
      - 'לפני הסיבוב $t_\parallel - t_\perp = \Delta t$. מה ההפרש אחרי שהזרועות מתחלפות?'
      - 'כמה זמני מחזור של האור נכנסים בשינוי הזה?'

  # ---------------------------------------------------------------- OBJ-9.1-2 postulates and simultaneity
  - id: Q-9.1-postulates
    type: mc
    objectives: [OBJ-9.1-2]
    qualitative: true
    level: basic
    prompt: אילו שתי טענות הן הנחות היסוד של איינשטיין בתורת היחסות הפרטית?
    choices:
      - text: >-
          חוקי הפיזיקה זהים בכל מערכות הייחוס האינרציאליות, ומהירות האור בריק היא $c$ בכל מערכות הייחוס האינרציאליות,
          בלי קשר לתנועת המקור.
        correct: true
        feedback: >-
          נכון. הראשונה היא עקרון היחסות של גליליי, מורחב לכל הפיזיקה ולא רק למכניקה. השנייה היא החדשה. מהשתיים יחד
          נובעים התארכות הזמן, התקצרות האורך ויחסיות הבו-זמניות.
      - text: חוקי הפיזיקה זהים בכל מערכות הייחוס האינרציאליות, ושום גוף לא נע מהר מהאור.
        feedback: >-
          שגוף לא יכול לעבור את מהירות האור היא **תוצאה** של התורה, לא הנחה. מקבלים אותה מכלל חיבור המהירויות
          היחסותי ומהסיבתיות, בשיעורים 9.4 ו-9.5.
      - text: >-
          חוקי הפיזיקה זהים בכל מערכות הייחוס האינרציאליות, ומהירות האור היא $c$ ביחס למקור שלו.
        feedback: >-
          אם האור נע במהירות $c$ ביחס למקור, אור ממנורה שנעה במהירות $v$ היה נע במהירות $c + v$, כמו כדור שנזרק מרכבת.
          ההנחה השנייה אומרת שכל צופה מודד $c$, גם כשהמקור נע ביחס אליו.
        misconception: MC-9-light-speed-adds-to-source
      - text: חוקי הפיזיקה זהים בכל מערכות הייחוס, גם במערכות מאיצות, והזמן זהה בכולן.
        feedback: >-
          ביחסות הפרטית העיקרון חל רק על מערכות אינרציאליות, ובמערכת מאיצה מופיעים כוחות מדומים. וזמן משותף לכל
          המערכות הוא בדיוק מה שהתורה מוותרת עליו.

  - id: Q-9.1-headlight
    type: numeric
    objectives: [OBJ-9.1-2]
    level: basic
    prompt: >-
      חללית חולפת על פני כדור הארץ במהירות $0.5c$ ומדליקה פנס קדמי, שמאיר בכיוון התנועה שלה. באיזו מהירות נע אור
      הפנס לפי צופה על כדור הארץ? ענו במטרים לשנייה.
    answer: 3.0e8
    unit: m/s
    correctFeedback: >-
      נכון: $c = 3.0\cdot10^8\,\text{m/s}$, לפי ההנחה השנייה. גם הצוות בחללית מודד לאור הפנס $c$. שניהם צודקים, וזה
      מה שמכריח לוותר על זמן ועל אורך מוחלטים.
    wrongFeedback: >-
      ההנחה השנייה אומרת שכל צופה אינרציאלי מודד לאור בריק את אותה מהירות, בלי קשר לתנועת המקור.
    commonWrong:
      - value: 4.5e8
        feedback: >-
          חיברתם מהירויות כמו גליליי, $c + 0.5c$. הכלל הזה עובד לכדור שנזרק מרכבת, אבל נכשל באור: כל צופה מודד לאור $c$.
        misconception: MC-9-light-speed-adds-to-source
      - value: 1.5e8
        feedback: >-
          החסרתם את מהירות החללית. אבל צופה על כדור הארץ מודד לאור מהירות $c$, כמו לכל אור אחר.
        misconception: MC-9-light-speed-adds-to-source

  - id: Q-9.1-train-lightning
    type: twotier
    objectives: [OBJ-9.1-2]
    qualitative: true
    level: mid
    prompt: >-
      רכבת נוסעת מזרחה במהירות קרובה למהירות האור. שני ברקים פוגעים בשני קצות הרכבת, ומשאירים סימני חריכה גם על
      הרכבת וגם על הפסים. צופה שעומד על הרציף בדיוק באמצע בין שני סימני החריכה שעל הפסים רואה את שני ההבזקים באותו
      רגע, ולכן לפי הרציף הברקים פגעו בו-זמנית. נוסעת יושבת בדיוק באמצע הרכבת. לפי מערכת הייחוס של הרכבת, איזה ברק
      פגע קודם?
    choices:
      - text: הברק בקצה הקדמי, המזרחי.
        correct: true
        feedback: >-
          נכון. לפי הרציף, הנוסעת נעה לקראת ההבזק הקדמי ומתרחקת מהאחורי, ולכן ההבזק הקדמי מגיע אליה קודם. זו עובדה שכל
          הצופים מסכימים עליה. במערכת של הרכבת הנוסעת נחה באמצע, ושני ההבזקים נעים אליה במהירות $c$ מאותו מרחק. מכיוון
          שהקדמי הגיע קודם, הוא פגע קודם.
      - text: הם פגעו בו-זמנית גם במערכת של הרכבת.
        feedback: >-
          זו ההנחה של זמן מוחלט. אבל ההבזק הקדמי מגיע לנוסעת לפני האחורי, והיא נמצאת באמצע הרכבת, ושני ההבזקים נעים
          אליה במהירות $c$. אם הם היו פוגעים בו-זמנית, הם היו מגיעים אליה יחד.
        misconception: MC-9-simultaneity-absolute
      - text: הברק בקצה האחורי, המערבי.
        feedback: >-
          הנוסעת נעה לקראת ההבזק הקדמי, ולכן הוא מגיע אליה ראשון. מהסדר הזה, ומהמרחקים השווים במערכת של הרכבת, נובע
          שהקדמי פגע קודם.
    reasonPrompt: ומה הנימוק?
    reasons:
      - text: >-
          ההבזק הקדמי מגיע לנוסעת ראשון. במערכת שלה שני ההבזקים עברו את אותו מרחק במהירות $c$, ולכן הקדמי יצא קודם.
        correct: true
        feedback: >-
          זה הנימוק. שימו לב ששתי הנחות היסוד נכנסו: מהירות האור $c$ גם במערכת של הרכבת, ושתי המערכות שקולות, כך שאין
          סיבה להעדיף את הסדר של הרציף.
      - text: >-
          ההבזקים מגיעים אליה בזמנים שונים רק בגלל העיכוב של האור. אחרי שמתקנים את העיכוב, הם בו-זמניים.
        feedback: >-
          הנוסעת מתקנת את העיכוב במערכת שלה: שני ההבזקים עברו חצי מאורך הרכבת במהירות $c$, ולכן העיכוב שווה. גם אחרי
          התיקון, הקדמי קודם. התיקון של הרציף נותן בו-זמניות רק במערכת של הרציף.
        misconception: MC-9-simultaneity-is-signal-delay
      - text: ההבזק הקדמי נע לקראתה מהר יותר, $c + v$, ולכן הגיע ראשון.
        feedback: >-
          לפי ההנחה השנייה, כל צופה מודד לאור $c$, ולכן במערכת של הרכבת שני ההבזקים נעים במהירות $c$.
        misconception: MC-9-light-speed-adds-to-source
    hints:
      - 'איזה הבזק מגיע לנוסעת ראשון? חשבו על כך במערכת של הרציף, שבה היא נעה.'
      - 'עכשיו עברו למערכת של הרכבת: איפה הנוסעת, ובאיזו מהירות נע כל הבזק?'

  - id: Q-9.1-train-reverse
    type: mc
    objectives: [OBJ-9.1-2]
    qualitative: true
    level: bagrut
    prompt: >-
      הפעם שני הבזקים נפלטים משתי מנורות בשני קצות רכבת שנוסעת מזרחה, והם **בו-זמניים במערכת של הרכבת**: נוסעת
      באמצע הרכבת רואה אותם באותו רגע. לפי מערכת הייחוס של הרציף, איזו מנורה הבזיקה קודם, ולמה?
    choices:
      - text: >-
          האחורית. לפי הרציף הנוסעת נעה לקראת האור מהמנורה הקדמית, ולכן לאור הזה דרך קצרה יותר. כדי ששני ההבזקים יגיעו
          אליה יחד, האחורי חייב לצאת קודם.
        correct: true
        feedback: >-
          נכון. שני ההבזקים מגיעים לנוסעת באותו מאורע, ובזה כל הצופים מסכימים. לפי הרציף, האור מהמנורה האחורית צריך
          לרדוף אחרי נוסעת שמתרחקת ממנו, ולכן הוא צריך יותר זמן ויצא קודם. זה הכלל: מאורעות שבו-זמניים במערכת נעה,
          המאורע **שבחלק הקדמי** שלה קורה מאוחר יותר במערכת שהיא חולפת על פניה.
      - text: הקדמית, כי הנוסעת נעה לקראתה.
        feedback: >-
          הנוסעת אכן נעה לקראת האור מהמנורה הקדמית, ולכן לאור הזה דרך **קצרה** יותר. כדי שיגיע אליה באותו רגע עם האור
          מאחור, הוא חייב לצאת מאוחר יותר, לא מוקדם יותר.
      - text: שתיהן באותו רגע, כי מה שבו-זמני ברכבת בו-זמני גם על הרציף.
        feedback: >-
          שני המצבים, זה וזה של השאלה הקודמת, הפוכים זה לזה: שם הברקים היו בו-זמניים לפי הרציף ולא לפי הרכבת. אין סיבה
          שהבו-זמניות תעבור דווקא מהרכבת לרציף, ושתי המערכות שקולות לפי ההנחה הראשונה.
        misconception: MC-9-simultaneity-absolute
      - text: זה תלוי איפה על הרציף עומד הצופה, כי האור מגיע לכל צופה בזמן אחר.
        feedback: >-
          הזמן שבו האור **מגיע** לצופה תלוי במקומו, אבל הזמן שבו המאורע **קרה** הוא מה שנשאר אחרי שמחסירים את זמן
          המעבר של האור. כל הצופים שנחים ביחס לרציף, אחרי התיקון הזה, מקבלים את אותו סדר.
        misconception: MC-9-simultaneity-is-signal-delay
    hints:
      - 'כל הצופים מסכימים ששני ההבזקים מגיעים לנוסעת באותו רגע. עכשיו תארו את מה שקורה לאור בכל כיוון במערכת של הרציף.'

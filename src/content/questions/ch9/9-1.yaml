  - id: Q-9.1-train-reverse
    type: mc
    objectives: [OBJ-9.1-2]
    qualitative: true
    level: bagrut
    prompt: >-
      שני הבזקים נפלטים משתי מנורות בשני קצות רכבת שנוסעת מזרחה ביחס לרציף, והם **בו-זמניים במערכת של הרכבת**: האור
      משניהם מגיע באותו רגע לנוסעת שיושבת בדיוק באמצע הרכבת. לפי מערכת הייחוס של הרציף, איזו מנורה הבזיקה קודם, ולמה?
    choices:
      - text: >-
          האחורית. לפי הרציף הנוסעת נעה לקראת האור מהמנורה הקדמית, ולכן לאור הזה דרך קצרה יותר. כדי ששני ההבזקים יגיעו
          אליה יחד, האחורי חייב לצאת קודם.
        correct: true
        feedback: >-
          נכון. שני ההבזקים מגיעים לנוסעת באותו מאורע, ובזה כל הצופים מסכימים. לפי הרציף, האור מהמנורה האחורית צריך
          לרדוף אחרי נוסעת שמתרחקת ממנו, ולכן הוא צריך יותר זמן ויצא קודם. זה אותו כלל כמו ברכבת והברקים, מהצד השני:
          מאורעות שבו-זמניים במערכת אחת אינם בו-זמניים במערכת שנעה ביחס אליה, ובה קודם המאורע **שבכיוון התנועה של
          המערכת השנייה**. ברכבת והברקים, הרכבת נעה מזרחה ביחס לרציף, ולכן אצלה הברק המזרחי, הקדמי, קודם. כאן, ביחס
          לרכבת הרציף נע מערבה, ולכן אצלו ההבזק המערבי, האחורי, קודם.
      - text: הקדמית, כי הנוסעת נעה לקראתה.
        feedback: >-
          הנוסעת אכן נעה לקראת האור מהמנורה הקדמית, ולכן לאור הזה דרך **קצרה** יותר. כדי שיגיע אליה באותו רגע עם האור
          מאחור, הוא חייב לצאת מאוחר יותר, לא מוקדם יותר.
      - text: שתיהן באותו רגע, כי מה שבו-זמני ברכבת בו-זמני גם על הרציף.
        feedback: >-
          אם ההבזקים היו בו-זמניים גם לפי הרציף, האור מהמנורה האחורית, שרודף אחרי נוסעת שמתרחקת ממנו, היה מגיע אליה
          אחרי האור מהקדמית, ולא באותו רגע. ושתי המערכות שקולות לפי ההנחה הראשונה: אין סיבה שהבו-זמניות של הרכבת תעבור
          דווקא לרציף.
        misconception: MC-9-simultaneity-absolute
      - text: זה תלוי איפה על הרציף עומד הצופה, כי האור מגיע לכל צופה בזמן אחר.
        feedback: >-
          הזמן שבו האור **מגיע** לצופה תלוי במקומו, אבל הזמן שבו המאורע **קרה** הוא מה שנשאר אחרי שמחסירים את זמן
          המעבר של האור. כל הצופים שנחים ביחס לרציף, אחרי התיקון הזה, מקבלים את אותו סדר.
        misconception: MC-9-simultaneity-is-signal-delay
    hints:
      - 'כל הצופים מסכימים ששני ההבזקים מגיעים לנוסעת באותו רגע. עכשיו תארו את מה שקורה לאור בכל כיוון במערכת של הרציף.'

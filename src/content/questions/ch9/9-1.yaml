      הרכבת וגם על הפסים. צופה שעומד על הרציף בדיוק באמצע בין שני סימני החריכה שעל הפסים מקבל את האור משני ההבזקים
      באותו רגע. האור משניהם עבר אליו מרחקים שווים במהירות $c$, ולכן לפי הרציף הברקים פגעו בו-זמנית. נוסעת יושבת בדיוק באמצע הרכבת. לפי מערכת הייחוס של הרכבת, איזה ברק

          המשפט תקף ביחסות כמו אצל ניוטון, עם האנרגיה היחסותית: אין צורך לדעת איך המהירות השתנתה בדרך.
        wrongFeedback: 'העבודה של כוח קבוע לאורך $L$ היא $FL$, והיא שווה לשינוי באנרגיה, כלומר לאנרגיה הקינטית בסוף.'
        commonWrong:

chapter: 10
questions:
  # ------------------------------------------------------------ 1: a pion decaying in flight
  - id: Q-10-bagrut-1
    type: bagrut
    title: פיון שדועך בתנועה
    prompt: >-
      פיון $\pi^+$ נע במעבדה בכיוון $+x$ עם אנרגיה יחסותית $E_\pi = 490\,\text{MeV}$, ודועך למיואון ולנייטרינו,
      $\pi^+ \to \mu^+ + \nu$. אנרגיות המנוחה: פיון $m_\pi c^2 = 140\,\text{MeV}$, מיואון $m_\mu c^2 = 106\,\text{MeV}$, ואת
      הנייטרינו נחשיב לחסר מסה. בדעיכה הזו הנייטרינו יוצא בדיוק קדימה, בכיוון $+x$, והמיואון נע לאורך אותו ציר. כמו
      בשיעור 10.3, המעבדה היא $S$, ומערכת המנוחה של הפיון היא $S'$, שנעה ביחס למעבדה בכיוון $+x$. גדלים שנמדדים ב-$S'$
      מסומנים בתג: $E'$, $p'$.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-10.1-1, OBJ-10.1-2]
        prompt: מה התנע של הפיון במעבדה? ענו ב-$\text{MeV}/c$.
        answer: 469.6
        unit: MeV/c
        correctFeedback: >-
          נכון. $p_\pi c = \sqrt{E_\pi^2 - (m_\pi c^2)^2} = \sqrt{490^2 - 140^2} = 469.6\,\text{MeV}$. כאן $\gamma = 490/140 = 3.5$
          ו-$\beta = \sqrt{1 - 1/\gamma^2} = 0.9583$, ואכן $\gamma\beta\,m_\pi c^2 = 3.5\cdot0.9583\cdot140 = 469.6\,\text{MeV}$.
        wrongFeedback: 'השתמשו בקשר $E^2 = (pc)^2 + (mc^2)^2$, או מצאו את $\gamma$ ואת $\beta$ וחשבו $p = \gamma mv$.'
        commonWrong:
          - value: 134.2
            feedback: 'זה $m_\pi v$ עם $v = 0.958c$, התנע של ניוטון. התנע היחסותי גדול ממנו פי $\gamma = 3.5$.'
            misconception: MC-10-newtonian-momentum
          - value: 490
            feedback: '$pc = E$ נכון רק לחלקיק חסר מסה. לפיון $(pc)^2 = E^2 - (mc^2)^2$.'
        hints:
          - '$\gamma = E_\pi/(m_\pi c^2)$.'

      - label: ב
        type: open
        points: 8
        level: mid
        objectives: [OBJ-10.3-1]
        prompt: >-
          עברו למערכת המנוחה של הפיון, $S'$. מצאו בה, בביטוי כללי ובמספרים, את האנרגיה היחסותית $E'_\mu$ של המיואון ואת
          גודל התנע $p'$ של שני התוצרים. בדקו את הביטוי לתנע בשני גבולות ובדקו את היחידות.
        hints:
          - 'במערכת המנוחה של הפיון התנע הכולל אפס. מה זה אומר על התנעים של שני התוצרים?'
        solution:
          - kind: law
            text: >-
              שימור אנרגיה ותנע במערכת המנוחה של הפיון: $E'_\mu + E'_\nu = m_\pi c^2$ ו-$\vec p\,'_\mu + \vec p\,'_\nu = 0$.
              לכל חלקיק $E^2 = (pc)^2 + (mc^2)^2$, ולנייטרינו חסר המסה $E'_\nu = p'c$.
          - kind: manipulation
            text: >-
              התוצרים יוצאים גב אל גב עם אותו גודל תנע $p'$. מציבים $E'_\mu = m_\pi c^2 - p'c$ בקשר של המיואון,
              $E'^2_\mu = (p'c)^2 + (m_\mu c^2)^2$, ופותחים את הריבוע באגף שמאל:
              $$(m_\pi c^2)^2 - 2m_\pi c^2\,p'c + (p'c)^2 = (p'c)^2 + (m_\mu c^2)^2$$
              האיבר $(p'c)^2$ מתבטל משני האגפים, ונשארת משוואה ליניארית ב-$p'$: $2m_\pi c^2\,p'c = (m_\pi c^2)^2 - (m_\mu c^2)^2$. לכן
              $$p' = \frac{(m_\pi^2 - m_\mu^2)c}{2m_\pi},\qquad E'_\mu = m_\pi c^2 - p'c = \frac{(m_\pi^2 + m_\mu^2)c^2}{2m_\pi}$$
              זו הנוסחה של שיעור 10.3 לדעיכה לשני חלקיקים, עם תוצר חסר מסה.
          - kind: limit
            text: >-
              כש-$m_\mu \to 0$, $p' \to m_\pi c/2$: שני חלקיקים חסרי מסה מתחלקים שווה באנרגיה. כש-$m_\mu \to m_\pi$, $p' \to 0$: לא
              נשארת אנרגיה לתנועה. ו-$E'_\mu \ge m_\mu c^2$ תמיד, כי $m_\pi^2 + m_\mu^2 - 2m_\pi m_\mu = (m_\pi - m_\mu)^2 \ge 0$.
          - kind: units
            text: >-
              אם המסות ב-$\text{MeV}/c^2$, אז $(m_\pi^2 - m_\mu^2)c/(2m_\pi)$ יוצא ב-$\text{MeV}/c$, יחידות של תנע, ו-$E'_\mu$
              ב-$\text{MeV}$.
          - kind: substitution
            text: >-
              $p'c = \dfrac{140^2 - 106^2}{280} = \dfrac{8364}{280} = 29.9\,\text{MeV}$, ו-$E'_\mu = \dfrac{140^2 + 106^2}{280} = 110.1\,\text{MeV}$.
          - kind: result
            text: >-
              $E'_\mu = 110.1\,\text{MeV}$ (אנרגיה קינטית של $4.1\,\text{MeV}$ בלבד) ו-$p' = 29.9\,\text{MeV}/c$ לשני התוצרים, בכיוונים
              מנוגדים. הנייטרינו נושא $E'_\nu = 29.9\,\text{MeV}$.
        rubric:
          - text: כתבתי שימור אנרגיה ושימור תנע, וקבעתי שלשני התוצרים אותו גודל תנע.
          - text: השתמשתי ב-$E'_\nu = p'c$ לנייטרינו וב-$E^2 = (pc)^2 + (mc^2)^2$ למיואון, ופתרתי ל-$p'$ ול-$E'_\mu$.
          - text: בדקתי את הגבולות $m_\mu \to 0$ ו-$m_\mu \to m_\pi$, ובדקתי שהיחידות של $p'$ הן יחידות של תנע.
          - text: קיבלתי $p' \approx 29.9\,\text{MeV}/c$ ו-$E'_\mu \approx 110\,\text{MeV}$.

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-10.2-1]
        prompt: >-
          הנייטרינו יוצא קדימה, בכיוון $+x$, גם ב-$S'$. העבירו את הארבעה-וקטור שלו בטרנספורמציית לורנץ למעבדה, ומצאו את
          האנרגיה שלו שם.
        answer: 204.7
        unit: MeV
        correctFeedback: >-
          נכון. $S'$ נעה ביחס למעבדה ב-$\beta = 0.9583$, עם $\gamma = 3.5$. הטרנספורמציה ההפוכה, מ-$S'$ למעבדה, היא עם סימן
          פלוס, כמו בשיעור 10.3:
          $$E_\nu = \gamma\left(E'_\nu + \beta\,p'_xc\right) = 3.5\cdot29.87\cdot(1 + 0.9583) = 204.7\,\text{MeV}$$
          פי $6.85$ מהאנרגיה ב-$S'$: נוסחת דופלר, $\sqrt{(1 + \beta)/(1 - \beta)} = 6.85$.
        wrongFeedback: >-
          ב-$S'$, $E'_\nu = p'_xc = 29.9\,\text{MeV}$. המעבדה נעה ביחס ל-$S'$ במהירות $0.958c$ בכיוון $-x$, ולכן
          $E_\nu = \gamma\left(E'_\nu + \beta\,p'_xc\right)$.
        commonWrong:
          - value: 104.5
            feedback: >-
              חישבתם $\gamma E'_\nu$ והשמטתם את איבר התנע. לנייטרינו יש תנע, $p'_xc = E'_\nu$, והוא מוסיף עוד
              $\gamma\beta\,p'_xc$.
          - value: 29.9
            feedback: 'זו האנרגיה במערכת המנוחה של הפיון. אנרגיה משתנה בין מערכות: היא רכיב של ארבעה-וקטור.'
            misconception: MC-10-energy-invariant
          - value: 4.36
            feedback: >-
              השתמשתם בסימן מינוס, כאילו המעבדה נעה בכיוון $+x$ ביחס לפיון. הפיון נע במעבדה בכיוון $+x$, ולכן נייטרינו
              שיוצא קדימה מקבל במעבדה **יותר** אנרגיה.
        hints:
          - >-
            המעבר מ-$S'$ למעבדה הוא הטרנספורמציה ההפוכה: מחליפים בה את $\beta$ במינוס $\beta$, ולכן הסימן בין האיברים
            פלוס.

      - label: ד
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-10.2-1, OBJ-10.2-2]
        prompt: >-
          מצאו את האנרגיה ואת התנע של המיואון במעבדה בשתי דרכים: משימור אנרגיה ותנע במעבדה, ובטרנספורמציית לורנץ
          מ-$S'$. בדקו בעזרת הגודל האינווריאנטי שזה אכן מיואון. לאיזה כיוון הוא נע במעבדה?
        hints:
          - 'ב-$S''$ המיואון נע בכיוון $-x$, כי הנייטרינו יוצא ב-$+x$.'
        solution:
          - kind: law
            text: >-
              שימור ארבעה-וקטור האנרגיה-תנע במעבדה: $E_\mu = E_\pi - E_\nu$ ו-$p_{\mu x} = p_\pi - p_{\nu x}$. ולחלופין, טרנספורמציית
              לורנץ מ-$S'$: $E_\mu = \gamma\left(E'_\mu + \beta\,p'_{\mu x}c\right)$ ו-$p_{\mu x}c = \gamma\left(p'_{\mu x}c + \beta E'_\mu\right)$.
          - kind: manipulation
            text: >-
              שימור: לנייטרינו $p_{\nu x}c = E_\nu$, ולכן $E_\mu = E_\pi - E_\nu$ ו-$p_{\mu x}c = p_\pi c - E_\nu$. טרנספורמציה: ב-$S'$
              המיואון נע אחורה, $p'_{\mu x} = -p'$, ולכן
              $$E_\mu = \gamma\left(E'_\mu - \beta\,p'c\right),\qquad p_{\mu x}c = \gamma\left(\beta E'_\mu - p'c\right)$$
              המיואון נע במעבדה קדימה אם $p_{\mu x} > 0$, כלומר אם $\beta > p'c/E'_\mu$: אם הפיון נע במעבדה מהר יותר
              מהמיואון ב-$S'$.
          - kind: limit
            text: >-
              בגבול $\beta \to 0$, פיון נח, הטרנספורמציה מחזירה את $E'_\mu$ ואת התנע $p_{\mu x} = -p'$ של חלק ב, והשימור נותן
              $E_\nu = p'c$, כמו שם. והגודל האינווריאנטי בשתי הדרכים: $E_\mu^2 - (p_{\mu x}c)^2 = \gamma^2(1 - \beta^2)\left(E'^2_\mu - (p'c)^2\right) = (m_\mu c^2)^2$.
          - kind: units
            text: 'כל האנרגיות ב-$\text{MeV}$, וכל התנעים ב-$\text{MeV}/c$, ולכן $p_\mu c$ ב-$\text{MeV}$ ומותר להחסיר אותו מ-$E_\mu$ בריבוע.'
          - kind: substitution
            text: >-
              שימור: $E_\mu = 490 - 204.74 = 285.26\,\text{MeV}$ ו-$p_{\mu x}c = 469.57 - 204.74 = 264.83\,\text{MeV}$. טרנספורמציה:
              $E_\mu = 3.5(110.13 - 0.9583\cdot29.87) = 285.3\,\text{MeV}$ ו-$p_{\mu x}c = 3.5(0.9583\cdot110.13 - 29.87) = 264.8\,\text{MeV}$.
              שתי הדרכים מסכימות. האינווריאנט: $\sqrt{285.26^2 - 264.83^2} = 106.0\,\text{MeV}$, אנרגיית המנוחה של המיואון.
          - kind: result
            text: >-
              $E_\mu = 285.3\,\text{MeV}$ ו-$p_\mu = 264.8\,\text{MeV}/c$ **בכיוון $+x$**, במהירות $264.8/285.3 = 0.928c$. ב-$S'$ המיואון
              נע אחורה, במהירות $p'c/E'_\mu = 0.27c$, אבל הפיון עצמו נע ב-$0.958c$, מהר יותר, ולכן במעבדה גם המיואון נע קדימה.
        rubric:
          - text: חישבתי את $E_\mu$ ואת $p_\mu$ משימור במעבדה, עם $p_\nu c = E_\nu$.
          - text: העברתי את הארבעה-וקטור של המיואון מ-$S'$, עם $p'_{\mu x} < 0$, וקיבלתי אותם ערכים.
          - text: בדקתי ש-$E_\mu^2 - (p_\mu c)^2 = (106\,\text{MeV})^2$.
          - text: קבעתי שהמיואון נע במעבדה בכיוון $+x$, והסברתי למה.

  # ------------------------------------------------------------ 2: making omega mesons
  - id: Q-10-bagrut-2
    type: bagrut
    title: ייצור מזוני אומגה
    prompt: >-
      מזון $\omega$ נוצר בתגובה $p + p \to p + p + \omega$. אנרגיית המנוחה של הפרוטון $mc^2 = 938\,\text{MeV}$, ושל
      המזון $m_\omega c^2 = 783\,\text{MeV}$. משווים שתי דרכים: (1) קרן של פרוטונים פוגעת בפרוטונים נייחים במטרה, (2) שתי
      קרניים של פרוטונים, באותה אנרגיה, מתנגשות חזיתית.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-10.3-2]
        prompt: מה נכון לגבי שלושת התוצרים באנרגיית הסף, בכל אחת משתי הדרכים?
        choices:
          - text: בהתנגשות החזיתית הם נחים במעבדה. במטרה הנייחת הם נעים יחד, באותה מהירות.
            correct: true
            feedback: >-
              נכון. בסף, התוצרים נחים במערכת מרכז המסה. בהתנגשות החזיתית זו המעבדה עצמה, כי התנע הכולל אפס. במטרה
              הנייחת מרכז המסה נע עם התנע של הקרן, והתוצרים נעים איתו.
          - text: בשתי הדרכים הם נחים במעבדה.
            feedback: >-
              במטרה נייחת התנע הכולל לפני ההתנגשות הוא התנע של הקרן, ולא אפס. אם התוצרים היו נחים, התנע לא היה נשמר.
            misconception: MC-10-threshold-is-mass-gain
          - text: בשתי הדרכים הם נעים, כי חלק מהאנרגיה תמיד הולך לתנועה.
            feedback: 'בהתנגשות חזיתית של קרניים זהות התנע הכולל אפס, ולכן התוצרים יכולים לנוח, וכל האנרגיה הקינטית הופכת למסה.'
          - text: במטרה הנייחת הם נחים, ובהתנגשות החזיתית הם נעים זה מזה.
            feedback: 'הפוך: במטרה הנייחת יש תנע כולל, והתוצרים חייבים לשאת אותו.'
        hints:
          - 'מה התנע הכולל לפני ההתנגשות בכל אחת מהדרכים?'

      - label: ב
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-10.3-2]
        prompt: מה האנרגיה הקינטית המזערית של כל פרוטון בהתנגשות החזיתית?
        answer: 391.5
        unit: MeV
        correctFeedback: >-
          נכון. בסף התוצרים נחים במעבדה, ולכן $2E = (2m + m_\omega)c^2$, ו-$K = E - mc^2 = \tfrac12m_\omega c^2 = 391.5\,\text{MeV}$
          לכל קרן. בסך הכול $m_\omega c^2$: בדיוק המסה החדשה.
        wrongFeedback: 'בסף שלושת התוצרים נחים, ולכן האנרגיה הכוללת של שתי הקרניים היא $(2m + m_\omega)c^2$.'
        commonWrong:
          - value: 783
            feedback: 'זו כל המסה החדשה. שתי הקרניים תורמות אותה יחד, חצי כל אחת.'
            misconception: MC-10-threshold-is-mass-gain
          - value: 1330
            feedback: >-
              זו האנרגיה היחסותית של כל פרוטון, $E = \tfrac12(2m + m_\omega)c^2$. האנרגיה הקינטית היא מה שנשאר אחרי שמחסירים
              את אנרגיית המנוחה, $K = E - mc^2$.
            misconception: MC-10-total-vs-kinetic
          - value: 946

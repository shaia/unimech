  # ------------------------------------------------------------ 3: Compton scattering at a right angle
  - id: Q-10-bagrut-3
    type: bagrut
    title: פיזור קומפטון בזווית ישרה
    prompt: >-
      פוטון באנרגיה $E = 0.400\,\text{MeV}$ פוגע באלקטרון חופשי ונייח, ונפזר בזווית $\theta = 90^\circ$ מהכיוון המקורי
      שלו. אנרגיית המנוחה של האלקטרון $m_ec^2 = 0.511\,\text{MeV}$, ואורך הגל של קומפטון שלו
      $\lambda_C = h/(m_ec) = 2.43\,\text{pm}$. לפוטון $E = pc = hc/\lambda$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-10.4-1]
        prompt: מה אורך הגל של הפוטון לפני הפיזור? ענו ב-$\text{pm}$.
        answer: 3.10
        unit: pm
        correctFeedback: >-
          נכון. $hc = \lambda_C\cdot m_ec^2$, ולכן $\lambda = \dfrac{hc}{E} = \lambda_C\cdot\dfrac{m_ec^2}{E} = 2.43\cdot\dfrac{0.511}{0.400} = 3.10\,\text{pm}$.
        wrongFeedback: 'כפלו את $\lambda_C = h/(m_ec)$ ב-$m_ec^2$ כדי לקבל את $hc$, וחלקו ב-$E$.'
        commonWrong:
          - value: 1.9
            feedback: 'הפכתם את היחס. פוטון בעל אנרגיה **קטנה** מ-$m_ec^2$ ארוך גל מ-$\lambda_C$: $\lambda = \lambda_C\,m_ec^2/E$.'
          - value: 2.43
            feedback: 'זה $\lambda_C$ עצמו, אורך הגל של פוטון באנרגיה $m_ec^2$ בדיוק. כאן האנרגיה קטנה יותר, ולכן אורך הגל ארוך יותר.'
        hints:
          - '$hc = \lambda_C\,m_ec^2$, כי $\lambda_C = h/(m_ec)$.'

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-10.4-1, OBJ-10.2-2]
        prompt: >-
          הראו משימור ארבעה-וקטור האנרגיה-תנע ש-$\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta)$. השתמשו במכפלה
          הפנימית של ארבעה-וקטורים, $A\cdot B = A^0B^0 - \vec A\cdot\vec B$, שזהה בכל מערכת ייחוס. בדקו את התוצאה בגבולות
          ובדקו את היחידות.
        hints:
          - 'סמנו $P$, $P_e$, $P''$, $P''_e$ לארבעה-וקטורים של הפוטון ושל האלקטרון לפני ואחרי. בודדו את $P''_e$ והעלו בריבוע.'
          - 'לפוטון $P\cdot P = 0$, ולאלקטרון $P_e\cdot P_e = (m_ec)^2$.'
        solution:
          - kind: law
            text: >-
              שימור ארבעה-וקטור האנרגיה-תנע: $P + P_e = P' + P'_e$, עם $P = (E/c,\ \vec p)$ לפוטון ו-$P_e = (m_ec,\ \vec 0)$
              לאלקטרון הנייח. ריבוע של ארבעה-וקטור הוא המסה בריבוע כפול $c^2$: $P\cdot P = P'\cdot P' = 0$ ו-$P_e\cdot P_e = P'_e\cdot P'_e = (m_ec)^2$.
          - kind: manipulation
            text: >-
              מבודדים את האלקטרון שלא מודדים: $P'_e = P + P_e - P'$. מעלים בריבוע:
              $$(m_ec)^2 = 0 + (m_ec)^2 + 0 + 2P\cdot P_e - 2P'\cdot P_e - 2P\cdot P'$$
              עם $P\cdot P_e = Em_e$, $P'\cdot P_e = E'm_e$ ו-$P\cdot P' = \dfrac{EE'}{c^2}(1 - \cos\theta)$, מתקבל
              $m_e(E - E') = \dfrac{EE'}{c^2}(1 - \cos\theta)$, כלומר $\dfrac1{E'} - \dfrac1E = \dfrac{1 - \cos\theta}{m_ec^2}$.
              כופלים ב-$hc$ ומשתמשים ב-$\lambda = hc/E$: $\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta)$.
          - kind: limit
            text: >-
              ב-$\theta = 0$ אין שינוי: הפוטון לא נפזר. ב-$\theta = 180^\circ$ השינוי מרבי, $2\lambda_C$. וכשהמטרה כבדה מאוד,
              $m \to \infty$, השינוי שואף לאפס: אור שנפזר מגרעין כבד או מגוף מקרוסקופי שומר על אורך הגל שלו, כמו בפיזיקה
              הקלאסית.
          - kind: units
            text: '$\dfrac{h}{m_ec}$ ביחידות $\dfrac{\text{J·s}}{\text{kg·m/s}} = \dfrac{\text{kg·m}^2/\text{s}}{\text{kg·m/s}} = \text{m}$: אורך, כמו $\lambda'' - \lambda$.'
          - kind: result
            text: >-
              $\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta) = \lambda_C(1 - \cos\theta)$. השינוי לא תלוי באורך הגל
              ההתחלתי, ולכן הוא בולט רק כש-$\lambda$ קרוב ל-$\lambda_C$, בקרני רנטגן וגמא.
        rubric:
          - text: כתבתי את שימור ארבעה-וקטור האנרגיה-תנע, ובודדתי את הארבעה-וקטור של האלקטרון אחרי הפיזור.
          - text: העליתי בריבוע והשתמשתי ב-$P\cdot P = 0$ לפוטון וב-$(m_ec)^2$ לאלקטרון.
          - text: חישבתי את שלוש המכפלות הפנימיות, וקיבלתי $1/E' - 1/E = (1 - \cos\theta)/(m_ec^2)$.
          - text: עברתי לאורכי גל, ובדקתי את הגבולות $\theta = 0$ ו-$m \to \infty$ ואת היחידות.

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-10.4-1]
        prompt: מה האנרגיה של הפוטון אחרי הפיזור, בזווית $90^\circ$?
        answer: 0.224
        unit: MeV
        correctFeedback: >-
          נכון. ב-$90^\circ$, $\lambda' = \lambda + \lambda_C = 3.10 + 2.43 = 5.53\,\text{pm}$, ולכן
          $E' = E\cdot\dfrac{\lambda}{\lambda'} = 0.400\cdot\dfrac{3.10}{5.53} = 0.224\,\text{MeV}$. אותו דבר מ-$1/E' = 1/E + 1/(m_ec^2)$.
        wrongFeedback: 'מצאו את $\lambda''$ ואז $E'' = hc/\lambda''$, או השתמשו ישירות ב-$1/E'' - 1/E = (1 - \cos\theta)/(m_ec^2)$.'
        commonWrong:
          - value: 0.4
            feedback: 'זו האנרגיה לפני הפיזור. הפוטון מסר לאלקטרון חלק מהתנע ומהאנרגיה שלו, ולכן אורך הגל גדל והאנרגיה קטנה.'
          - value: 0.176
            feedback: 'זו האנרגיה הקינטית של האלקטרון, $E - E''$. השאלה שואלת על הפוטון המפוזר.'

      - label: ד
        type: numeric
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-10.1-1, OBJ-10.1-2]
        prompt: >-
          מה המהירות של האלקטרון אחרי הפיזור? ענו ביחידות של $c$. (רמז: התנע של האלקטרון הוא ההפרש בין התנע של הפוטון
          לפני הפיזור לבין התנע שלו אחריו.)
        answer: 0.668
        unit: c
        correctFeedback: >-
          נכון. התנעים של הפוטון לפני ואחרי ניצבים זה לזה, ולכן $p_ec = \sqrt{0.400^2 + 0.224^2} = 0.459\,\text{MeV}$. האנרגיה
          של האלקטרון $E_e = 0.511 + 0.176 = 0.687\,\text{MeV}$, ולכן $\beta = \dfrac{p_ec}{E_e} = 0.668$.
          בדיקה: $\sqrt{E_e^2 - (p_ec)^2} = 0.511\,\text{MeV}$, אנרגיית המנוחה של האלקטרון. שימור התנע ושימור האנרגיה מסכימים.
        wrongFeedback: >-
          מצאו את התנע של האלקטרון כהפרש וקטורי, $\vec p_e = \vec p - \vec p\,'$, ואת האנרגיה שלו, $m_ec^2 + (E - E')$. אז
          $\beta = p_ec/E_e$.
        commonWrong:
          - value: 0.829
            feedback: >-
              זה $\sqrt{2K/(m_ec^2)}$ עם $K = 0.176\,\text{MeV}$, הקשר של ניוטון. $K$ הוא כשליש מ-$m_ec^2$, והקירוב כבר לא
              טוב: הוא מגזים במהירות ב-$24\%$.
            misconception: MC-10-classical-ke
          - value: 0.583
            feedback: >-
              לקחתם רק את התנע ההתחלתי של הפוטון, $0.400\,\text{MeV}/c$. הפוטון המפוזר נושא תנע בכיוון ניצב, והאלקטרון נושא
              את ההפרש הווקטורי, שגודלו $0.459\,\text{MeV}/c$.
        hints:
          - 'המהירות של חלקיק היא $v = pc^2/E$, כלומר $\beta = pc/E$.'

  # ------------------------------------------------------------ 4: an electron under a constant force
  - id: Q-10-bagrut-4
    type: bagrut
    title: אלקטרון תחת כוח קבוע
    prompt: >-
      אלקטרון ($m_e = 9.11\cdot10^{-31}\,\text{kg}$) מתחיל ממנוחה בשדה חשמלי אחיד, שמפעיל עליו כוח קבוע
      $F = 1.6\cdot10^{-14}\,\text{N}$ בכיוון קבוע. מהירות האור $c = 3.0\cdot10^8\,\text{m/s}$. שני גדלים אופייניים לתנועה
      הם $mc/F = 17.1\,\text{ns}$ ו-$mc^2/F = 5.12\,\text{m}$.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-10.5-1]
        prompt: איזה תיאור מתאים לגרפים של התנע $p(t)$ ושל המהירות $v(t)$ של האלקטרון?
        choices:
          - text: $p(t)$ קו ישר שעולה בלי גבול. $v(t)$ עולה, ומתקרב לקו האופקי $v = c$ בלי לגעת בו.
            correct: true
            feedback: >-
              נכון. $p = Ft$ מ-$F = dp/dt$. המהירות עולה בהתחלה כמו $Ft/m$, בשיפוע $F/m$, והשיפוע קטן ככל שהיא מתקרבת
              ל-$c$.
          - text: שני הגרפים קווים ישרים, ו-$v(t)$ עובר את $c$ אחרי $17.1\,\text{ns}$.
            feedback: >-
              כך היה אצל ניוטון, עם תאוצה קבועה $F/m$. ביחסות הכוח קובע את קצב השינוי של התנע, והמהירות לא עוברת את
              $c$.
            misconception: MC-10-constant-force-constant-accel
          - text: $v(t)$ קו ישר עד $c$, ושם נעצר. $p(t)$ קו ישר כל הזמן.
            feedback: >-
              אם $v$ היה קבוע מרגע מסוים, גם $p = \gamma mv$ היה קבוע, אבל $p = Ft$ ממשיך לגדול. המהירות מתקרבת ל-$c$
              בהדרגה, ולא נעצרת בפתאומיות.
            misconception: MC-10-constant-force-constant-accel
          - text: שני הגרפים מתקרבים לקווים אופקיים.
            feedback: '$dp/dt = F$ קבוע, ולכן התנע גדל בקצב קבוע כל הזמן. רק המהירות מתקרבת לגבול.'
        hints:
          - 'מה החוק השני ביחסות? מה הוא אומר על $p(t)$ כש-$F$ קבוע?'

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-10.5-1]
        prompt: >-
          פתרו את החוק השני, $F = dp/dt$, ומצאו את $v(t)$. בדקו את התוצאה בזמנים קצרים ובזמנים ארוכים, ובדקו את היחידות.
        hints:
          - 'אינטגרלו פעם אחת וקבלו $\gamma mv = Ft$. אחר כך בודדו את $v$.'
        solution:
          - kind: law
            text: 'החוק השני ביחסות: $F = \dfrac{dp}{dt}$, עם התנע היחסותי $p = \gamma mv = \dfrac{mv}{\sqrt{1 - v^2/c^2}}$.'
          - kind: manipulation
            text: >-
              $F$ קבוע ו-$p(0) = 0$, ולכן $p = Ft$, כלומר $\dfrac{mv}{\sqrt{1 - v^2/c^2}} = Ft$. מעלים בריבוע:
              $m^2v^2 = F^2t^2\left(1 - v^2/c^2\right)$, ולכן $v^2\left(m^2 + F^2t^2/c^2\right) = F^2t^2$, ו-
              $$v(t) = \frac{Ft/m}{\sqrt{1 + \left(\dfrac{Ft}{mc}\right)^2}}$$
          - kind: limit
            text: >-
              כש-$t \ll mc/F$, המכנה כמעט 1 ו-$v \approx Ft/m$: תאוצה קבועה $F/m$, כמו אצל ניוטון. כש-$t \gg mc/F$,
              $v \approx \dfrac{Ft/m}{Ft/(mc)} = c$, ותמיד $v < c$ כי המונה קטן מהמכנה כפול $c$.
          - kind: units
            text: '$Ft/(mc)$ חסר ממדים: $\dfrac{\text{N·s}}{\text{kg·m/s}} = 1$. ולכן $v$ ביחידות של $Ft/m$, כלומר $\text{m/s}$.'
          - kind: result
            text: >-
              $v(t) = \dfrac{Ft/m}{\sqrt{1 + (Ft/(mc))^2}}$: עולה כמו $Ft/m$ בהתחלה, ומתקרבת ל-$c$ בלי להגיע אליה. הזמן
              האופייני הוא $mc/F = 17.1\,\text{ns}$.
        rubric:
          - text: כתבתי $F = dp/dt$ עם $p = \gamma mv$, ואינטגרלתי ל-$\gamma mv = Ft$.
          - text: בודדתי את $v$ בלי לשכוח ש-$\gamma$ תלוי ב-$v$, וקיבלתי את הביטוי.
          - text: בדקתי שבזמנים קצרים $v \approx Ft/m$ ושבזמנים ארוכים $v \to c$.
          - text: בדקתי ש-$Ft/(mc)$ חסר ממדים.

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-10.5-1]
        prompt: אחרי כמה זמן מגיע האלקטרון ל-$0.99c$? ענו בננו-שניות.
        answer: 120
        unit: ns
        correctFeedback: >-
          נכון. מ-$p = Ft$: $t = \dfrac{\gamma\beta\,mc}{F}$. ב-$\beta = 0.99$, $\gamma = 7.09$ ו-$\gamma\beta = 7.02$, ולכן
          $t = 7.02\cdot17.1\,\text{ns} = 120\,\text{ns}$.
        wrongFeedback: 'הפכו את $p = Ft$: $t = p/F = \gamma\beta\,mc/F$. חשבו את $\gamma\beta$ ב-$\beta = 0.99$.'
        commonWrong:
          - value: 16.9
            feedback: >-
              זה $0.99\,mc/F$, הזמן בתאוצה קבועה $F/m$. ביחסות התאוצה קטנה ככל שהמהירות גדלה, ולכן צריך פי 7 יותר זמן.
            misconception: MC-10-constant-force-constant-accel
        hints:
          - '$\gamma\beta = \beta/\sqrt{1 - \beta^2}$.'

      - label: ד
        type: numeric
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-10.5-2, OBJ-10.1-1]
        prompt: איזה מרחק עובר האלקטרון עד שהוא מגיע ל-$0.99c$?
        answer: 31.2
        unit: m
        correctFeedback: >-
          נכון. לפי משפט עבודה-אנרגיה, $Fx = \Delta E = (\gamma - 1)mc^2$, ולכן $x = (\gamma - 1)\dfrac{mc^2}{F} = 6.09\cdot5.12 = 31.2\,\text{m}$.
          אותו דבר נותן האינטגרל של $v(t)$ מחלק ב. **בדיקת גבולות:** כש-$\beta \ll 1$, $(\gamma - 1) \approx \beta^2/2$, ו-$x \approx v^2/(2a)$
          עם $a = F/m$, כמו אצל ניוטון.
        wrongFeedback: >-
          אין צורך באינטגרל: העבודה של כוח קבוע לאורך $x$ היא $Fx$, והיא שווה לשינוי באנרגיה היחסותית.
        commonWrong:

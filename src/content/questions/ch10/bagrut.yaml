#   5: cos φ = K₃K₄/(p₃c·p₄c) checked against a CM-frame construction boosted with fourvector.boostX at four (γ, θ*)
#      (agreement ≤ 1e-12); P₁·P₂ = P₃·P₄; symmetric γ = 3 (K = 2mc²): cos φ = 1/3, φ = 70.5°, γ_c = √2, β_c = 0.707,
#      half-angle 35.3° = atan(1/γ_c); φ(γ = 1.0001) = 90.0°, φ(γ = 100) = 16.0°.

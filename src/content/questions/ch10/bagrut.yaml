            misconception: MC-10-threshold-is-mass-gain
          - value: 141.5
            feedback: 'השתמשתם ב-$E_{\text{th}} = 2830.8\,\text{MeV}$. הפרוטון מתחיל ממנוחה עם $mc^2$, והעבודה צריכה לספק רק את האנרגיה הקינטית.'
            misconception: MC-10-total-vs-kinetic

      - label: ה
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-10.2-2, OBJ-10.3-2]
        prompt: >-
          במטרה הנייחת, באנרגיית הסף, שלושת התוצרים נעים יחד. הראו שגורם לורנץ שלהם במעבדה הוא
          $\gamma = \dfrac{\sum m_f}{2m}$, בטאו את מהירותם באמצעות $m$ ו-$\sum m_f$, ובדקו את הביטוי בגבולות $\sum m_f \to 2m$
          ו-$\sum m_f \gg m$. אחר כך הציבו, וחשבו גם כמה מהאנרגיה הקינטית של הקרן נשארת בתנועה של התוצרים.
        hints:
          - 'בסף כל התוצרים נחים במערכת מרכז המסה, ולכן הם נעים במעבדה במהירות שלה, עם $\gamma = E_{\text{tot}}/\sqrt s$.'
          - 'את $E_{\text{th}}$ כבר מצאתם בחלק ג. מה $E_{\text{tot}} = E_{\text{th}} + mc^2$?'
        solution:
          - kind: law
            text: >-
              בסף התוצרים נחים במערכת מרכז המסה, ולכן הם נעים במעבדה יחד, במהירות שלה. לכל מערכת $E_{\text{tot}} = \gamma\sqrt s$,
              כאשר $\sqrt s = \left(\sum m_f\right)c^2$ בסף, ו-$\beta = p_{\text{tot}}c/E_{\text{tot}}$, כמו $v = pc^2/E$ לחלקיק אחד.
          - kind: manipulation
            text: >-
              מחלק ג, $E_{\text{th}} = \dfrac{\left(\sum m_f\right)^2 - 2m^2}{2m}c^2$, ולכן
              $E_{\text{tot}} = E_{\text{th}} + mc^2 = \dfrac{\left(\sum m_f\right)^2c^2}{2m}$. מחלקים ב-$\sqrt s$:
              $$\gamma = \frac{E_{\text{tot}}}{\left(\sum m_f\right)c^2} = \frac{\sum m_f}{2m},\qquad \beta = \sqrt{1 - \frac{1}{\gamma^2}} = \sqrt{1 - \left(\frac{2m}{\sum m_f}\right)^2}$$
              האנרגיה הקינטית שנשארת בתנועת התוצרים היא $(\gamma - 1)\left(\sum m_f\right)c^2$.
          - kind: limit
            text: >-
              כש-$\sum m_f \to 2m$, תגובה שלא יוצרת דבר, $\gamma \to 1$ ו-$\beta \to 0$: אנרגיית הסף אפס, הקרן נחה, ואין מה
              שינוע. כש-$\sum m_f \gg m$, $\beta \to 1$: כדי ליצור מסה גדולה ממטרה קלה צריך קרן מהירה מאוד, והתוצרים ממשיכים
              קדימה כמעט ב-$c$. התוצרים לא נחים במעבדה: הם חייבים לשאת את התנע של הקרן.
          - kind: units
            text: '$\gamma$ ו-$\beta$ הם יחסים של מסות, חסרי ממדים, ו-$(\gamma - 1)\left(\sum m_f\right)c^2$ באנרגיה.'
          - kind: substitution
            text: >-
              $\gamma = \dfrac{2659}{1876} = 1.417$, $\beta = \sqrt{1 - 1/1.417^2} = 0.709$. בדיקה בדרך אחרת:
              $E_{\text{tot}} = 2830.8 + 938 = 3768.8\,\text{MeV}$ ו-$p_{\text{tot}}c = \sqrt{2830.8^2 - 938^2} = 2670.9\,\text{MeV}$, ו-$2670.9/3768.8 = 0.709$.
              בתנועה נשארים $(1.417 - 1)\cdot2659 = 1109.8\,\text{MeV}$ מתוך $1892.8\,\text{MeV}$. (פרוטון הקרן לבד נע ב-$0.944c$.)
          - kind: result
            text: >-
              $\gamma = \sum m_f/(2m) = 1.417$ ו-$\beta = \sqrt{1 - \left(2m/\sum m_f\right)^2} = 0.709$: התוצרים נעים יחד במעבדה
              ב-$0.709c$, ונושאים $1109.8\,\text{MeV}$ של אנרגיה קינטית שלא הפכה למסה.
        rubric:
          - text: קבעתי שבסף התוצרים נעים במהירות של מרכז המסה, ומצאתי $E_{\text{tot}} = \left(\sum m_f\right)^2c^2/(2m)$.
          - text: חילקתי ב-$\sqrt s = \left(\sum m_f\right)c^2$ וקיבלתי $\gamma = \sum m_f/(2m)$ ו-$\beta = \sqrt{1 - (2m/\sum m_f)^2}$.
          - text: בדקתי שב-$\sum m_f \to 2m$ התוצרים נחים ושב-$\sum m_f \gg m$ הם נעים כמעט ב-$c$, וקיבלתי $0.709c$.

  # ------------------------------------------------------------ 3: Compton scattering at a right angle
  - id: Q-10-bagrut-3
    type: bagrut
    title: פיזור קומפטון בזווית ישרה
    prompt: >-
      פוטון באנרגיה $E = 0.400\,\text{MeV}$ פוגע באלקטרון חופשי ונייח, ונפזר בזווית $\theta = 90^\circ$ מהכיוון המקורי
      שלו. אנרגיית המנוחה של האלקטרון $m_ec^2 = 0.511\,\text{MeV}$, ואורך גל קומפטון שלו
      $\lambda_C = h/(m_ec) = 2.43\,\text{pm}$. לפוטון $E = pc = hc/\lambda$.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-10.4-1]
        prompt: מה אורך הגל של הפוטון לפני הפיזור? ענו ב-$\text{pm}$.
        answer: 3.10
        unit: pm
        correctFeedback: >-
          נכון. $hc = \lambda_C\cdot m_ec^2$, ולכן $\lambda = \dfrac{hc}{E} = \lambda_C\cdot\dfrac{m_ec^2}{E} = 2.43\cdot\dfrac{0.511}{0.400} = 3.10\,\text{pm}$.
        wrongFeedback: 'כפלו את $\lambda_C = h/(m_ec)$ ב-$m_ec^2$ כדי לקבל את $hc$, וחלקו ב-$E$.'
        commonWrong:
          - value: 1.9
            feedback: 'הפכתם את היחס. פוטון בעל אנרגיה **קטנה** מ-$m_ec^2$ ארוך גל מ-$\lambda_C$: $\lambda = \lambda_C\,m_ec^2/E$.'
          - value: 2.43
            feedback: 'זה $\lambda_C$ עצמו, אורך הגל של פוטון באנרגיה $m_ec^2$ בדיוק. כאן האנרגיה קטנה יותר, ולכן אורך הגל ארוך יותר.'
        hints:
          - '$hc = \lambda_C\,m_ec^2$, כי $\lambda_C = h/(m_ec)$.'

      - label: ב
        type: open
        points: 9
        level: mid
        objectives: [OBJ-10.4-1, OBJ-10.2-2]
        prompt: >-
          הראו משימור ארבעה-וקטור האנרגיה-תנע ש-$\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta)$. השתמשו במכפלת
          מינקובסקי של שיעור 10.2, $A\cdot B = A_0B_0 - A_1B_1 - A_2B_2 - A_3B_3$, שזהה בכל מערכת ייחוס. בדקו את התוצאה
          בגבולות ובדקו את היחידות.
        hints:
          - 'סמנו $P$, $P_e$, $P''$, $P''_e$ לארבעה-וקטורים של הפוטון ושל האלקטרון לפני ואחרי. בודדו את $P''_e$ והעלו בריבוע.'
          - 'לפוטון $P\cdot P = 0$, ולאלקטרון $P_e\cdot P_e = (m_ec)^2$.'
        solution:
          - kind: law
            text: >-
              שימור ארבעה-וקטור האנרגיה-תנע: $P + P_e = P' + P'_e$, עם $P = (E/c,\ \vec p)$ לפוטון ו-$P_e = (m_ec,\ \vec 0)$
              לאלקטרון הנייח. ריבוע של ארבעה-וקטור הוא המסה בריבוע כפול $c^2$: $P\cdot P = P'\cdot P' = 0$ ו-$P_e\cdot P_e = P'_e\cdot P'_e = (m_ec)^2$.
          - kind: manipulation
            text: >-
              מבודדים את האלקטרון שלא מודדים: $P'_e = P + P_e - P'$. מעלים בריבוע:
              $$(m_ec)^2 = 0 + (m_ec)^2 + 0 + 2P\cdot P_e - 2P'\cdot P_e - 2P\cdot P'$$
              את המכפלות נחשב במעבדה. האלקטרון נח, ולכן $P\cdot P_e = \dfrac{E}{c}\,m_ec = Em_e$ ו-$P'\cdot P_e = E'm_e$. בין שני
              הפוטונים יש זווית $\theta$, ו-$|\vec p\,| = E/c$, $|\vec p\,'| = E'/c$, ולכן
              $P\cdot P' = \dfrac{EE'}{c^2} - \dfrac{E}{c}\dfrac{E'}{c}\cos\theta = \dfrac{EE'}{c^2}(1 - \cos\theta)$. מתקבל
              $m_e(E - E') = \dfrac{EE'}{c^2}(1 - \cos\theta)$, כלומר $\dfrac1{E'} - \dfrac1E = \dfrac{1 - \cos\theta}{m_ec^2}$.
              כופלים ב-$hc$ ומשתמשים ב-$\lambda = hc/E$: $\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta)$.
          - kind: limit
            text: >-
              ב-$\theta = 0$ אין שינוי: הפוטון לא נפזר. ב-$\theta = 180^\circ$ השינוי מרבי, $2\lambda_C$. וכשהמטרה כבדה מאוד,
              $m \to \infty$, השינוי שואף לאפס: אור שנפזר מגרעין כבד או מגוף מקרוסקופי שומר על אורך הגל שלו, כמו בפיזיקה
              הקלאסית.
          - kind: units
            text: '$\dfrac{h}{m_ec}$ ביחידות $\dfrac{\text{J·s}}{\text{kg·m/s}} = \dfrac{\text{kg·m}^2/\text{s}}{\text{kg·m/s}} = \text{m}$: אורך, כמו $\lambda'' - \lambda$.'
          - kind: result
            text: >-
              $\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta) = \lambda_C(1 - \cos\theta)$. השינוי לא תלוי באורך הגל
              ההתחלתי, ולכן הוא בולט רק כש-$\lambda$ קרוב ל-$\lambda_C$, בקרני רנטגן וגמא.
        rubric:
          - text: כתבתי את שימור ארבעה-וקטור האנרגיה-תנע, ובודדתי את הארבעה-וקטור של האלקטרון אחרי הפיזור.
          - text: העליתי בריבוע והשתמשתי ב-$P\cdot P = 0$ לפוטון וב-$(m_ec)^2$ לאלקטרון.
          - text: חישבתי את שלוש המכפלות הפנימיות, וקיבלתי $1/E' - 1/E = (1 - \cos\theta)/(m_ec^2)$.
          - text: עברתי לאורכי גל, ובדקתי את הגבולות $\theta = 0$ ו-$m \to \infty$ ואת היחידות.


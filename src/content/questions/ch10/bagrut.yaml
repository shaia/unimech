# Chapter 10 review problems (שאלות חזרה): a scenario with lettered parts (א, ב, ג…), 25 points each, the parts
# climbing basic → mid → bagrut (exam level). Each problem joins objectives from at least two lessons, and the four
# together touch every lesson: 1 (10.1, 10.2, 10.3), 2 (10.2, 10.3, 10.5), 3 (10.1, 10.2, 10.4), 4 (10.1, 10.5).
# Open parts are solved in the course format: law → manipulation → limit → units → substitution → result.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed by .scratch/ch10/q.ts and q2.ts (constants.ts: C_LIGHT = 3.0e8, E_CHARGE = 1.6e-19,
# M_ELECTRON = 9.11e-31; rest energies given in the prompts):
#   1: π⁺ (140 MeV) with E = 280 MeV: γ = 2, β = 0.866, pc = 242 MeV (mv: 121); rest frame E*_μ = 110.1 MeV,
#      p* = 29.9 MeV/c; forward neutrino E_ν = γ(1 + β)·29.9 = 111.5 MeV (γE* = 59.7, wrong sign 8.0);
#      muon E_μ = 168.5 MeV, p_μ = +131.0 MeV/c, √(168.5² − 131.0²) = 106 MeV.
#   2: head-on, per beam K = 938 MeV; fixed target K = 6mc² = 5628 MeV; linac at 20 MeV/m: 281 m (2mc²: 93.8,
#      7mc²: 328); products at threshold β = √48/8 = 0.866, γ = 2 (beam proton β = 0.990).
#   3: E = 0.400 MeV, λ = λ_C·mc²/E = 3.10 pm (inverted 1.90); at 90°: λ' = 5.53 pm, E' = 0.224 MeV;
#      electron K = 0.176 MeV, pc = √(0.400² + 0.224²) = 0.459 MeV, β = pc/E = 0.668 (classical 0.829; p = E/c only 0.583).
#   4: electron, F = 1.6e-14 N: mc/F = 17.1 ns, mc²/F = 5.12 m; to 0.99c: γβ = 7.02, t = 120 ns (classical 16.9 ns);
#      x = (γ − 1)mc²/F = 31.2 m (classical 2.51 m, ct = 36.0 m).

chapter: 10
questions:
  # ------------------------------------------------------------ 1: a pion decaying in flight
  - id: Q-10-bagrut-1
    type: bagrut
    title: פיון שדועך בתנועה
    prompt: >-
      פיון $\pi^+$ נע במעבדה בכיוון $+x$ עם אנרגיה יחסותית $E_\pi = 280\,\text{MeV}$, ודועך למיואון ולנייטרינו,
      $\pi^+ \to \mu^+ + \nu$. אנרגיות המנוחה: פיון $m_\pi c^2 = 140\,\text{MeV}$, מיואון $m_\mu c^2 = 106\,\text{MeV}$, ואת
      הנייטרינו נחשיב לחסר מסה. בדעיכה הזו הנייטרינו יוצא בדיוק קדימה, בכיוון $+x$, והמיואון נע לאורך אותו ציר.
    parts:
      - label: א
        type: numeric
        points: 5
        level: basic
        objectives: [OBJ-10.1-1, OBJ-10.1-2]
        prompt: מה התנע של הפיון במעבדה? ענו ב-$\text{MeV}/c$.
        answer: 242
        unit: MeV/c
        correctFeedback: >-
          נכון. $p_\pi c = \sqrt{E_\pi^2 - (m_\pi c^2)^2} = \sqrt{280^2 - 140^2} = 242\,\text{MeV}$. כאן $\gamma = 280/140 = 2$
          ו-$\beta = 0.866$, ואכן $\gamma\beta\,m_\pi c^2 = 2\cdot0.866\cdot140 = 242\,\text{MeV}$.
        wrongFeedback: 'השתמשו בקשר $E^2 = (pc)^2 + (mc^2)^2$, או מצאו את $\gamma$ ואת $\beta$ וחשבו $p = \gamma mv$.'
        commonWrong:
          - value: 121
            feedback: 'זה $m_\pi v$ עם $v = 0.866c$, התנע של ניוטון. התנע היחסותי גדול ממנו פי $\gamma = 2$.'
            misconception: MC-10-newtonian-momentum
          - value: 280
            feedback: '$pc = E$ נכון רק לחלקיק חסר מסה. לפיון $(pc)^2 = E^2 - (mc^2)^2$.'
        hints:
          - '$\gamma = E_\pi/(m_\pi c^2)$.'

      - label: ב
        type: open
        points: 8
        level: mid
        objectives: [OBJ-10.3-1]
        prompt: >-
          עברו למערכת המנוחה של הפיון. מצאו בה, בביטוי כללי ובמספרים, את האנרגיה היחסותית $E^*_\mu$ של המיואון ואת
          גודל התנע $p^*$ של שני התוצרים. בדקו את הביטוי לתנע בשני גבולות ובדקו את היחידות.
        hints:
          - 'במערכת המנוחה של הפיון התנע הכולל אפס. מה זה אומר על התנעים של שני התוצרים?'
        solution:
          - kind: law
            text: >-
              שימור אנרגיה ותנע במערכת המנוחה של הפיון: $E^*_\mu + E^*_\nu = m_\pi c^2$ ו-$\vec p^{\,*}_\mu + \vec p^{\,*}_\nu = 0$.
              לכל חלקיק $E^2 = (pc)^2 + (mc^2)^2$, ולנייטרינו חסר המסה $E^*_\nu = p^*c$.
          - kind: manipulation
            text: >-
              התוצרים יוצאים גב אל גב עם אותו גודל תנע $p^*$. מציבים $E^*_\mu = m_\pi c^2 - p^*c$ ב-$E^{*2}_\mu = (p^*c)^2 + (m_\mu c^2)^2$:
              $(m_\pi c^2)^2 - 2m_\pi c^2\,p^*c = (m_\mu c^2)^2$, ולכן
              $$p^* = \frac{(m_\pi^2 - m_\mu^2)c}{2m_\pi},\qquad E^*_\mu = m_\pi c^2 - p^*c = \frac{(m_\pi^2 + m_\mu^2)c^2}{2m_\pi}$$
          - kind: limit
            text: >-
              כש-$m_\mu \to 0$, $p^* \to m_\pi c/2$: שני חלקיקים חסרי מסה מתחלקים שווה באנרגיה. כש-$m_\mu \to m_\pi$, $p^* \to 0$: לא
              נשארת אנרגיה לתנועה. ו-$E^*_\mu \ge m_\mu c^2$ תמיד, כי $m_\pi^2 + m_\mu^2 - 2m_\pi m_\mu = (m_\pi - m_\mu)^2 \ge 0$.
          - kind: units
            text: >-
              אם המסות ב-$\text{MeV}/c^2$, אז $(m_\pi^2 - m_\mu^2)c/(2m_\pi)$ יוצא ב-$\text{MeV}/c$, יחידות של תנע, ו-$E^*_\mu$
              ב-$\text{MeV}$.
          - kind: substitution
            text: >-
              $p^*c = \dfrac{140^2 - 106^2}{280} = \dfrac{8364}{280} = 29.9\,\text{MeV}$, ו-$E^*_\mu = \dfrac{140^2 + 106^2}{280} = 110.1\,\text{MeV}$.
          - kind: result
            text: >-
              $E^*_\mu = 110.1\,\text{MeV}$ (אנרגיה קינטית של $4.1\,\text{MeV}$ בלבד) ו-$p^* = 29.9\,\text{MeV}/c$ לשני התוצרים, בכיוונים
              מנוגדים. הנייטרינו נושא $E^*_\nu = 29.9\,\text{MeV}$.
        rubric:
          - text: כתבתי שימור אנרגיה ושימור תנע, וקבעתי שלשני התוצרים אותו גודל תנע.
          - text: השתמשתי ב-$E_\nu = pc$ לנייטרינו וב-$E^2 = (pc)^2 + (mc^2)^2$ למיואון, ופתרתי ל-$p^*$ ול-$E^*_\mu$.
          - text: בדקתי את הגבולות $m_\mu \to 0$ ו-$m_\mu \to m_\pi$, ובדקתי שהיחידות של $p^*$ הן יחידות של תנע.
          - text: קיבלתי $p^* \approx 29.9\,\text{MeV}/c$ ו-$E^*_\mu \approx 110\,\text{MeV}$.

      - label: ג
        type: numeric
        points: 6
        level: mid
        standalone: false
        objectives: [OBJ-10.2-1]
        prompt: >-
          הנייטרינו יוצא קדימה, בכיוון $+x$, גם במערכת המנוחה של הפיון. העבירו את הארבעה-וקטור שלו בטרנספורמציית לורנץ
          למעבדה, ומצאו את האנרגיה שלו שם.
        answer: 111.5
        unit: MeV
        correctFeedback: >-
          נכון. מערכת המנוחה של הפיון נעה ביחס למעבדה ב-$\beta = 0.866$, עם $\gamma = 2$. הטרנספורמציה ההפוכה, מהמערכת הנעה
          למעבדה, היא עם סימן פלוס:
          $$E_\nu = \gamma\left(E^*_\nu + \beta\,p^*_xc\right) = 2\cdot29.9\cdot(1 + 0.866) = 111.5\,\text{MeV}$$
          פי $3.7$ מהאנרגיה במערכת המנוחה: נוסחת דופלר, $\sqrt{(1 + \beta)/(1 - \beta)} = 3.73$.
        wrongFeedback: >-
          במערכת המנוחה של הפיון, $E^*_\nu = p^*_xc = 29.9\,\text{MeV}$. המעבדה נעה ביחס אליה במהירות $0.866c$ בכיוון $-x$,
          ולכן $E_\nu = \gamma\left(E^* + \beta\,p^*_xc\right)$.
        commonWrong:
          - value: 59.7
            feedback: 'חישבתם $\gamma E^*_\nu$ והשמטתם את איבר התנע. לנייטרינו יש תנע, $p^*_xc = E^*_\nu$, והוא מוסיף עוד $\gamma\beta\,p^*_xc$.'
          - value: 29.9
            feedback: 'זו האנרגיה במערכת המנוחה של הפיון. אנרגיה משתנה בין מערכות: היא רכיב של ארבעה-וקטור.'
            misconception: MC-10-energy-invariant
          - value: 8.0
            feedback: >-
              השתמשתם בסימן מינוס, כאילו המעבדה נעה בכיוון $+x$ ביחס לפיון. הפיון נע במעבדה בכיוון $+x$, ולכן נייטרינו
              שיוצא קדימה מקבל במעבדה **יותר** אנרגיה.
        hints:
          - 'המעבר ממערכת המנוחה של הפיון למעבדה הוא טרנספורמציה עם $-\beta$, כלומר עם סימן פלוס.'

      - label: ד
        type: open
        points: 6
        level: bagrut
        standalone: false
        objectives: [OBJ-10.2-1, OBJ-10.2-2]
        prompt: >-
          מצאו את האנרגיה ואת התנע של המיואון במעבדה בשתי דרכים: משימור אנרגיה ותנע במעבדה, ובטרנספורמציית לורנץ
          מהמערכת של הפיון. בדקו בעזרת הגודל האינווריאנטי שזה אכן מיואון. לאיזה כיוון הוא נע במעבדה?
        hints:
          - 'במערכת המנוחה של הפיון המיואון נע בכיוון $-x$, כי הנייטרינו יוצא ב-$+x$.'
        solution:
          - kind: law
            text: >-
              שימור ארבעה-וקטור האנרגיה-תנע במעבדה: $E_\mu = E_\pi - E_\nu$ ו-$p_\mu = p_\pi - p_\nu$. ולחלופין, טרנספורמציית
              לורנץ מהמערכת של הפיון: $E_\mu = \gamma\left(E^*_\mu + \beta\,p^*_{\mu x}c\right)$ ו-$p_{\mu x}c = \gamma\left(p^*_{\mu x}c + \beta E^*_\mu\right)$.
          - kind: manipulation
            text: >-
              שימור: $E_\mu = 280 - 111.5 = 168.5\,\text{MeV}$, ו-$p_\mu c = 242.5 - 111.5 = 131.0\,\text{MeV}$, כי לנייטרינו
              $p_\nu c = E_\nu$. טרנספורמציה, עם $p^*_{\mu x}c = -29.9\,\text{MeV}$: $E_\mu = 2(110.1 - 0.866\cdot29.9) = 168.5\,\text{MeV}$
              ו-$p_{\mu x}c = 2(-29.9 + 0.866\cdot110.1) = 131.0\,\text{MeV}$. שתי הדרכים מסכימות.
          - kind: limit
            text: >-
              בדיקת האינווריאנט: $\sqrt{E_\mu^2 - (p_\mu c)^2} = \sqrt{168.5^2 - 131.0^2} = 106\,\text{MeV}$, אנרגיית המנוחה של
              המיואון. ובגבול $\beta \to 0$, פיון נח, הטרנספורמציה מחזירה את $E^*_\mu$ ואת $-p^*$ מחלק ב.
          - kind: units
            text: 'כל האנרגיות ב-$\text{MeV}$, וכל התנעים ב-$\text{MeV}/c$, ולכן $p_\mu c$ ב-$\text{MeV}$ ומותר להחסיר אותו מ-$E_\mu$ בריבוע.'
          - kind: result
            text: >-
              $E_\mu = 168.5\,\text{MeV}$ ו-$p_\mu = 131\,\text{MeV}/c$ **בכיוון $+x$**. במערכת המנוחה של הפיון המיואון נע
              אחורה, במהירות $0.27c$, אבל הפיון עצמו נע ב-$0.866c$, ולכן במעבדה גם המיואון נע קדימה.
        rubric:
          - text: חישבתי את $E_\mu$ ואת $p_\mu$ משימור במעבדה, עם $p_\nu c = E_\nu$.
          - text: העברתי את הארבעה-וקטור של המיואון מהמערכת של הפיון, עם $p^*_{\mu x} < 0$, וקיבלתי אותם ערכים.
          - text: בדקתי ש-$E_\mu^2 - (p_\mu c)^2 = (106\,\text{MeV})^2$.
          - text: קבעתי שהמיואון נע במעבדה בכיוון $+x$, והסברתי למה.

  # ------------------------------------------------------------ 2: making antiprotons
  - id: Q-10-bagrut-2
    type: bagrut
    title: ייצור אנטי-פרוטונים
    prompt: >-
      אנטי-פרוטונים נוצרים בתגובה $p + p \to p + p + p + \bar p$. לאנטי-פרוטון אותה מסה כמו לפרוטון,
      $mc^2 = 938\,\text{MeV}$. משווים שתי דרכים: (1) קרן של פרוטונים פוגעת בפרוטונים נייחים במטרה, (2) שתי קרנות של
      פרוטונים, באותה אנרגיה, מתנגשות חזיתית.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-10.3-2]
        prompt: מה נכון לגבי ארבעת התוצרים באנרגיית הסף, בכל אחת משתי הדרכים?
        choices:
          - text: בהתנגשות החזיתית הם נחים במעבדה. במטרה הנייחת הם נעים יחד, באותה מהירות.
            correct: true
            feedback: >-
              נכון. בסף, התוצרים נחים במערכת מרכז המסה. בהתנגשות החזיתית זו המעבדה עצמה, כי התנע הכולל אפס. במטרה
              הנייחת מרכז המסה נע עם התנע של הקרן, והתוצרים נעים איתו.
          - text: בשתי הדרכים הם נחים במעבדה.
            feedback: >-
              במטרה נייחת התנע הכולל לפני ההתנגשות הוא התנע של הקרן, ולא אפס. אם התוצרים היו נחים, התנע לא היה נשמר.
            misconception: MC-10-threshold-is-mass-gain
          - text: בשתי הדרכים הם נעים, כי חלק מהאנרגיה תמיד הולך לתנועה.
            feedback: 'בהתנגשות חזיתית של קרנות זהות התנע הכולל אפס, ולכן התוצרים יכולים לנוח, וכל האנרגיה הקינטית הופכת למסה.'
          - text: במטרה הנייחת הם נחים, ובהתנגשות החזיתית הם נעים זה מזה.
            feedback: 'הפוך: במטרה הנייחת יש תנע כולל, והתוצרים חייבים לשאת אותו.'
        hints:
          - 'מה התנע הכולל לפני ההתנגשות בכל אחת מהדרכים?'

      - label: ב
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-10.3-2]
        prompt: מה האנרגיה הקינטית המזערית של כל פרוטון בהתנגשות החזיתית?
        answer: 938
        unit: MeV
        correctFeedback: >-
          נכון. בסף, $2E = 4mc^2$, ולכן $K = E - mc^2 = mc^2 = 938\,\text{MeV}$ לכל קרן, ובסך הכול $2mc^2$: בדיוק המסה
          החדשה.
        wrongFeedback: 'בסף ארבעת התוצרים נחים, ולכן האנרגיה הכוללת של שתי הקרנות היא $4mc^2$.'
        commonWrong:
          - value: 1876
            feedback: 'זו כל המסה החדשה. שתי הקרנות תורמות אותה יחד, חצי כל אחת.'
          - value: 2814
            feedback: 'חילקתם את התשובה של מטרה נייחת בין שתי קרנות. בהתנגשות חזיתית שום אנרגיה לא הולכת לתנועת מרכז המסה, ולכן צריך פחות.'
            misconception: MC-10-available-is-lab-energy

      - label: ג
        type: open
        points: 8
        level: mid
        objectives: [OBJ-10.2-2, OBJ-10.3-2]
        prompt: >-
          הראו בעזרת הגודל האינווריאנטי $s = E_{\text{tot}}^2 - (p_{\text{tot}}c)^2$ שאנרגיית הסף במטרה נייחת היא
          $K_{\text{th}} = 6mc^2$. כתבו קודם ביטוי כללי לקרן ולמטרה בעלות אותה מסה $m$ ותוצרים בעלי מסה כוללת $M_f$,
          ובדקו אותו בגבול.
        hints:
          - 'חשבו את $s$ במעבדה, לפני ההתנגשות, ובמערכת מרכז המסה בסף, אחריה.'
        solution:
          - kind: law
            text: >-
              $s$ זהה בכל מערכת ייחוס, ונשמר בהתנגשות. במעבדה, לפני: $E_{\text{tot}} = E + mc^2$ ו-$p_{\text{tot}}c = pc$, עם
              $(pc)^2 = E^2 - (mc^2)^2$. בסף, במערכת מרכז המסה, כל התוצרים נחים: $s = (M_fc^2)^2$.
          - kind: manipulation
            text: >-
              $s = (E + mc^2)^2 - E^2 + (mc^2)^2 = 2(mc^2)^2 + 2mc^2E$. משווים ל-$(M_fc^2)^2$:
              $$E_{\text{th}} = \frac{M_f^2 - 2m^2}{2m}\,c^2,\qquad K_{\text{th}} = E_{\text{th}} - mc^2 = \frac{M_f^2 - (2m)^2}{2m}\,c^2$$
              כאן $M_f = 4m$: $K_{\text{th}} = \dfrac{16 - 4}{2}\,mc^2 = 6mc^2$.
          - kind: limit
            text: >-
              כש-$M_f = 2m$, תגובה שלא יוצרת שום דבר, $K_{\text{th}} = 0$, כמו שצריך. ותגובה שיוצרת מסה קטנה $\Delta m \ll m$,
              $M_f = 2m + \Delta m$, נותנת $K_{\text{th}} \approx 2\Delta m\,c^2$: מטרה שקלה כמו הקרן דורשת פי 2 מהמסה החדשה.
          - kind: units
            text: '$\dfrac{M_f^2}{m}c^2$ ביחידות של מסה כפול $c^2$, כלומר אנרגיה. עם מסות ב-$\text{MeV}/c^2$ התשובה ב-$\text{MeV}$.'
          - kind: substitution
            text: '$K_{\text{th}} = 6\cdot938 = 5628\,\text{MeV} \approx 5.6\,\text{GeV}$, ו-$E_{\text{th}} = 7mc^2 = 6566\,\text{MeV}$.'
          - kind: result
            text: >-
              $K_{\text{th}} = 6mc^2 \approx 5.6\,\text{GeV}$ במטרה נייחת, לעומת $2mc^2$ בסך הכול בהתנגשות חזיתית: פי 3. רק
              שליש מהאנרגיה הקינטית של הקרן הופך למסה.
        rubric:
          - text: חישבתי את $s$ במעבדה עם פרוטון נייח, וקיבלתי $2(mc^2)^2 + 2mc^2E$.
          - text: קבעתי שבסף התוצרים נחים במערכת מרכז המסה, ולכן $s = (4mc^2)^2$.
          - text: בודדתי את $E$, ובסוף הפחתתי את $mc^2$ כדי לקבל אנרגיה קינטית.
          - text: בדקתי את הגבול $M_f = 2m$, שבו $K_{\text{th}} = 0$.

      - label: ד
        type: numeric
        points: 4
        level: mid
        standalone: false

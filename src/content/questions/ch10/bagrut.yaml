#   or workbooks (.scratch/review/ch10/bagrut/collide.ts): 1 had E_π = 280 MeV, whose γE′ = 59.7 MeV equals lesson
#   10.3's forward neutrino at β = 0.6, now E_π = 490 MeV (350 is bank 10.2's pion); 2 was the antiproton

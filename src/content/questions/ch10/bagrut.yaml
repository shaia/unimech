      - label: ג
        type: open
        points: 8
        level: mid
        objectives: [OBJ-10.2-2, OBJ-10.3-2]
        prompt: >-
          מצאו בעזרת הגודל האינווריאנטי $s = E_{\text{tot}}^2 - (p_{\text{tot}}c)^2$ את אנרגיית הסף $K_{\text{th}}$ במטרה
          נייחת. כתבו קודם ביטוי כללי לקרן ולמטרה בעלות אותה מסה $m$ ותוצרים שסכום המסות שלהם $\sum m_f$, כמו בשיעור 10.3,
          ובדקו אותו בגבול. פי כמה גדולה $K_{\text{th}}$ מהאנרגיה הקינטית הכוללת של שתי הקרניים בהתנגשות החזיתית?
        hints:
          - 'חשבו את $s$ במעבדה, לפני ההתנגשות, ובמערכת מרכז המסה בסף, אחריה.'
        solution:
          - kind: law
            text: >-
              $s$ זהה בכל מערכת ייחוס, ונשמר בהתנגשות. במעבדה, לפני: $E_{\text{tot}} = E + mc^2$ ו-$p_{\text{tot}}c = pc$, עם
              $(pc)^2 = E^2 - (mc^2)^2$. בסף, במערכת מרכז המסה, כל התוצרים נחים: $s = \left(\sum m_f\right)^2c^4$.
          - kind: manipulation
            text: >-
              מציבים את $(pc)^2$ ופותחים את הריבוע: $s = E^2 + 2mc^2E + (mc^2)^2 - E^2 + (mc^2)^2 = 2(mc^2)^2 + 2mc^2E$.
              האיבר $E^2$ מתבטל, ו-$s$ ליניארי ב-$E$. משווים ל-$\left(\sum m_f\right)^2c^4$ ומבודדים את $E$:
              $$E_{\text{th}} = \frac{\left(\sum m_f\right)^2 - 2m^2}{2m}\,c^2,\qquad K_{\text{th}} = E_{\text{th}} - mc^2 = \frac{\left(\sum m_f\right)^2 - (2m)^2}{2m}\,c^2$$
              כאן $\sum m_f = 2m + m_\omega$, והמונה הוא הפרש של ריבועים, $m_\omega(4m + m_\omega)$:
              $$K_{\text{th}} = \frac{m_\omega(4m + m_\omega)}{2m}\,c^2 = 2m_\omega c^2 + \frac{m_\omega^2}{2m}\,c^2$$
          - kind: limit
            text: >-
              כש-$\sum m_f = 2m$, תגובה שלא יוצרת שום דבר, $K_{\text{th}} = 0$, כמו שצריך. וכשהמסה החדשה קטנה, $m_\omega \ll m$,
              נשאר האיבר הראשון, $K_{\text{th}} \approx 2m_\omega c^2$: מטרה שקלה כמו הקרן דורשת פי 2 מהמסה החדשה. זו התשובה של
              ניוטון משיעור 4.2: רק חצי מהאנרגיה הקינטית של הקרן זמין. האיבר $m_\omega^2c^2/(2m)$ הוא התוספת של היחסות.
          - kind: units
            text: '$\dfrac{\left(\sum m_f\right)^2}{m}c^2$ ביחידות של מסה כפול $c^2$, כלומר אנרגיה. עם מסות ב-$\text{MeV}/c^2$ התשובה ב-$\text{MeV}$.'
          - kind: substitution
            text: >-
              $K_{\text{th}} = \dfrac{783\cdot(3752 + 783)}{1876}\,\text{MeV} = 1566 + 326.8 = 1892.8\,\text{MeV} \approx 1.89\,\text{GeV}$,
              ו-$E_{\text{th}} = K_{\text{th}} + mc^2 = 2830.8\,\text{MeV}$. בהתנגשות החזיתית שתי הקרניים יחד צריכות
              $m_\omega c^2 = 783\,\text{MeV}$, ו-$1892.8/783 = 2.42$.
          - kind: result
            text: >-
              $K_{\text{th}} = 2m_\omega c^2 + m_\omega^2c^2/(2m) \approx 1.89\,\text{GeV}$ במטרה נייחת, לעומת $783\,\text{MeV}$ בסך הכול
              בהתנגשות חזיתית: פי $2.42$. רק $783/1892.8 = 41\%$ מהאנרגיה הקינטית של הקרן הופכים למסה.
        rubric:
          - text: חישבתי את $s$ במעבדה עם פרוטון נייח, וקיבלתי $2(mc^2)^2 + 2mc^2E$.
          - text: קבעתי שבסף התוצרים נחים במערכת מרכז המסה, ולכן $s = \left((2m + m_\omega)c^2\right)^2$.
          - text: בודדתי את $E$, ובסוף הפחתתי את $mc^2$ כדי לקבל אנרגיה קינטית.
          - text: בדקתי את הגבול $\sum m_f = 2m$, שבו $K_{\text{th}} = 0$, או את הגבול $m_\omega \ll m$, שבו $K_{\text{th}} \approx 2m_\omega c^2$.
          - text: קיבלתי $K_{\text{th}} \approx 1890\,\text{MeV}$, פי $2.4$ מהאנרגיה של שתי הקרניים בהתנגשות החזיתית.

      - label: ד
        type: numeric
        points: 4
        level: mid
        standalone: false
        objectives: [OBJ-10.5-2]
        prompt: >-
          מאיץ קווי מאיץ את פרוטוני הקרן ממנוחה בכוח קבוע $F = 3.2\cdot10^{-12}\,\text{N}$, כלומר $20\,\text{MeV}$ של עבודה
          לכל מטר. כמה ארוך צריך להיות המאיץ כדי שהקרן תגיע לאנרגיית הסף של מטרה נייחת?
        answer: 94.6
        unit: m
        correctFeedback: >-
          נכון. לפי משפט עבודה-אנרגיה, $FL = \Delta E = K_{\text{th}}$, ולכן $L = \dfrac{1892.8\,\text{MeV}}{20\,\text{MeV/m}} = 94.6\,\text{m}$.
          המשפט תקף ביחסות כמו אצל ניוטון, עם האנרגיה היחסותית: אין צורך לדעת איך המהירות השתנתה בדרך.
        wrongFeedback: 'העבודה של כוח קבוע לאורך $L$ היא $FL$, והיא שווה לשינוי באנרגיה, כלומר לאנרגיה הקינטית בסוף.'
        commonWrong:
          - value: 39.2

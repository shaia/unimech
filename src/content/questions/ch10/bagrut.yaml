      - label: ה
        type: numeric
        points: 5
        level: bagrut
        standalone: false
        objectives: [OBJ-10.2-2, OBJ-10.3-2]
        prompt: >-
          במטרה הנייחת, באנרגיית הסף, שלושת התוצרים נעים יחד. מה מהירותם במעבדה? ענו ביחידות של $c$.
        answer: 0.709
        unit: c
        correctFeedback: >-
          נכון. התוצרים נעים יחד במהירות של מרכז המסה. $E_{\text{tot}} = E_{\text{th}} + mc^2 = 3768.8\,\text{MeV}$ ו-$p_{\text{tot}}c = \sqrt{2830.8^2 - 938^2} = 2670.9\,\text{MeV}$,
          ולכן $\beta = \dfrac{p_{\text{tot}}c}{E_{\text{tot}}} = 0.709$, עם $\gamma = \dfrac{E_{\text{tot}}}{\sqrt s} = \dfrac{3768.8}{2659} = 1.417$. בדיקה:
          $(2m + m_\omega)c^2\cdot\gamma = E_{\text{tot}}$, והאנרגיה נשמרת. מתוך $1892.8\,\text{MeV}$ של אנרגיה קינטית, $1109.8\,\text{MeV}$

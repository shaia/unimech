        level: bagrut
        standalone: false
        objectives: [OBJ-10.2-2, OBJ-10.3-2]
        prompt: >-
          במטרה הנייחת, באנרגיית הסף, ארבעת התוצרים נעים יחד. מה מהירותם במעבדה? ענו ביחידות של $c$.
        answer: 0.866
        unit: c
        correctFeedback: >-
          נכון. התוצרים נעים יחד במהירות של מרכז המסה, $\beta = \dfrac{p_{\text{tot}}c}{E_{\text{tot}}} = \dfrac{\sqrt{48}\,mc^2}{8mc^2} = 0.866$,
          עם $\gamma = 2$. בדיקה: $4mc^2\cdot\gamma = 8mc^2 = E_{\text{th}} + mc^2$, והאנרגיה נשמרת. מתוך $6mc^2$ של אנרגיה

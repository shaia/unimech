# climbing basic → mid → bagrut (exam level). Each problem joins objectives from at least two lessons, and the four
# together touch every lesson: 1 (10.1, 10.2, 10.3), 2 (10.2, 10.3, 10.5), 3 (10.1, 10.2, 10.4), 4 (10.1, 10.5).
# Open parts are solved in the course format: law → manipulation → limit → units → substitution → result.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed by .scratch/ch10/q.ts and q2.ts (constants.ts: C_LIGHT = 3.0e8, E_CHARGE = 1.6e-19,
# M_ELECTRON = 9.11e-31; rest energies given in the prompts):
#   1: π⁺ (140 MeV) with E = 490 MeV: γ = 3.5, β = 0.9583, pc = 469.6 MeV (mv: 134.2, pc = E: 490); rest frame S′
#      (lesson 10.3's primes) E′_μ = 110.1 MeV, p′ = 29.9 MeV/c; forward neutrino E_ν = γ(1 + β)·29.87 = 204.7 MeV
#      (γE′ = 104.5, wrong sign 4.36, Doppler 6.85); muon E_μ = 285.3 MeV, p_μ = +264.8 MeV/c (0.928c),
#      √(285.26² − 264.83²) = 106 MeV.
#   2: p + p → p + p + ω (m_ω c² = 783 MeV): head-on, per beam K = m_ω c²/2 = 391.5 MeV (783, E = 1330, half the
#      fixed-target K 946); fixed target K_th = m_ω(4m + m_ω)/(2m) c² = 1566 + 326.8 = 1892.8 MeV, E_th = 2830.8,
#      2.42 × 783, 41% into mass; linac at 20 MeV/m: 94.6 m (m_ω: 39.2, E_th: 141.5); products at threshold
#      E_tot = 3768.8, p_tot c = 2670.9, β = 0.709, γ = 1.417, kinetic 1109.8 (beam proton β = 0.944).
#   3: E = 0.400 MeV, λ = λ_C·mc²/E = 3.10 pm (inverted 1.90); at 90°: λ' = 5.53 pm, E' = 0.224 MeV;
#      electron K = 0.176 MeV, pc = √(0.400² + 0.224²) = 0.459 MeV, β = pc/E = 0.668 (classical 0.829; p = E/c only 0.583).
#   4: electron, F = 1.6e-14 N: mc/F = 17.1 ns, mc²/F = 5.12 m; to 0.99c: γβ = 7.02, t = 120 ns (classical 16.9 ns);
#      x = (γ − 1)mc²/F = 31.2 m (classical 2.51 m, ct = 36.0 m).
# Reviewed 2026-11-17: independent recompute in .scratch/review/ch10/bagrut/recompute.ts (closed forms, plus a
#   quadrature of v(t) for 4ד); every number above agreed, and every commonWrong is > 3% from its answer and from
#   the others (closest pair 4.2%, 1א). Notation aligned with the lessons: 1 uses S′ and primes for the pion's rest
#   frame (10.3), 2ג uses Σm_f (10.3), 3ב names the Minkowski product A·B = A₀B₀ − A₁B₁ − A₂B₂ − A₃B₃ (10.2).
#   Also checked: 1ד muon in S′ at p′c/E′_μ = 0.271c; λ_C = h/(m_e c) = 2.426 pm from constants.
#   Revised the same day so that no key or intermediate result repeats a number printed in the ch10 lessons, banks
#   or workbooks (.scratch/review/ch10/bagrut/collide.ts): 1 had E_π = 280 MeV, whose γE′ = 59.7 MeV equals lesson
#   10.3's forward neutrino at β = 0.6, now E_π = 490 MeV (350 is bank 10.2's pion); 2 was the antiproton

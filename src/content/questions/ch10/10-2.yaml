# Lesson 10.2 question bank: the comprehension ladder of "ארבעה-וקטורים".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed by .scratch/ch10/q.ts (rest energies given in the prompts):
#   proton at rest seen from 0.60c: E' = 1.25·938 = 1172.5 MeV (938/1.25 = 750);
#   pion, 140 MeV, E = 350 MeV: pc = 320.8 MeV; boost 0.80c along +x: E' = 155.6 MeV, p'c = 68.0 MeV,
#     E'² − (p'c)² = 140² (wrong sign 1001, no γ 40.8);
#   photon 10 MeV, frame at 0.60c along the photon: E' = 5.00 MeV (approaching 20, γE 12.5, E/γ 8.0);
#   two 100 MeV photons at 90°: M = √(2·100·100) = 141 MeV/c²;
#   30 GeV proton on a fixed proton (0.938 GeV): √s = √(2m² + 2mE) = 7.62 GeV (E + m = 30.9, √(mE) = 5.30).

chapter: 10
questions:
  # ---------------------------------------------------------------- OBJ-10.2-1 the energy-momentum four-vector and its Lorentz transformation
  - id: Q-10.2-components
    type: mc
    objectives: [OBJ-10.2-1]
    qualitative: true
    level: basic
    prompt: >-
      לחלקיק בעל מסה $m$ יש במערכת ייחוס $S$ אנרגיה יחסותית $E$ ותנע $\vec p = (p_x, p_y, p_z)$. איזו רביעייה היא
      ארבעה-וקטור האנרגיה-תנע שלו, כלומר רביעייה שעוברת בטרנספורמציית לורנץ בדיוק כמו $(ct, x, y, z)$?
    choices:
      - text: $(E/c,\ p_x,\ p_y,\ p_z)$
        correct: true
        feedback: >-
          נכון. הרכיב הראשון הוא $E/c = \gamma mc$, והשלושה האחרים הם $\gamma m\vec v$: כל הרכיבים ביחידות של תנע,
          והרביעייה היא $m$ כפול ארבעה-וקטור המהירות. במערכת המנוחה היא $(mc, 0, 0, 0)$.
      - text: $(K/c,\ p_x,\ p_y,\ p_z)$, עם האנרגיה הקינטית $K$.
        feedback: >-
          הרכיב הראשון צריך לכלול את אנרגיית המנוחה. עם $K$ במקום $E$ הגודל $(K/c)^2 - p^2$ משתנה ממערכת למערכת,
          ולכן הרביעייה לא עוברת כמו ארבעה-וקטור. במנוחה, למשל, היא הייתה $(0, 0, 0, 0)$ לכל חלקיק.
        misconception: MC-10-total-vs-kinetic
      - text: $(mc,\ p_x,\ p_y,\ p_z)$
        feedback: >-
          $mc$ זהה בכל מערכת ייחוס, ואילו הרכיב הראשון של ארבעה-וקטור משתנה בטרנספורמציה, כמו $ct$. הרכיב הראשון הוא
          $E/c = \gamma mc$, ורק במערכת המנוחה הוא שווה ל-$mc$.
        misconception: MC-10-energy-invariant
      - text: $(E,\ p_x,\ p_y,\ p_z)$
        feedback: >-
          לרכיבים של ארבעה-וקטור צריכות להיות אותן יחידות, כמו $ct$ ו-$x$ שתיהן במטרים. $E$ בג׳אול ו-$p$ ב-$\text{kg·m/s}$:
          צריך לחלק את האנרגיה ב-$c$.
    hints:
      - 'במערכת המנוחה, מה צריכים להיות הרכיבים? ומה היחידות של כל רכיב?'

  - id: Q-10.2-rest-boost
    type: numeric
    objectives: [OBJ-10.2-1]
    level: basic
    prompt: >-
      פרוטון ($mc^2 = 938\,\text{MeV}$) נח במערכת $S$. מה האנרגיה שלו במערכת $S'$, שנעה ביחס ל-$S$ במהירות $0.60c$
      לאורך ציר $x$?
    answer: 1172.5
    unit: MeV
    correctFeedback: >-
      נכון. ב-$S$ הארבעה-וקטור הוא $(mc, 0)$, ולכן $E' = \gamma\left(E - \beta\,p_xc\right) = \gamma mc^2 = 1.25\cdot938 \approx 1170\,\text{MeV}$.
      ב-$S'$ הפרוטון נע במהירות $0.60c$, והתוספת היא האנרגיה הקינטית שלו שם.
    wrongFeedback: >-
      כתבו את הטרנספורמציה של הרכיב הראשון, $E' = \gamma\left(E - \beta\,p_xc\right)$, עם $p_x = 0$ במערכת המנוחה.
    commonWrong:
      - value: 938
        feedback: >-
          זו האנרגיה במערכת המנוחה. האנרגיה נשמרת בכל מערכת, אבל היא **אינה** זהה בין מערכות: ב-$S'$ הפרוטון נע,
          ויש לו גם אנרגיה קינטית.
        misconception: MC-10-energy-invariant
      - value: 750
        feedback: >-
          חילקתם ב-$\gamma$, כמו בהתקצרות אורך. אנרגיה היא הרכיב הראשון של ארבעה-וקטור, ועוברת כמו $ct$: מכפילים
          ב-$\gamma$.
    hints:
      - '$\gamma = 1/\sqrt{1 - 0.36}$.'

  - id: Q-10.2-pion-boost
    type: numeric
    objectives: [OBJ-10.2-1]
    level: mid
    prompt: >-
      פיון ($mc^2 = 140\,\text{MeV}$) נע במעבדה בכיוון $+x$ עם אנרגיה יחסותית $E = 350\,\text{MeV}$. מה רכיב התנע
      $p'_x$ שלו במערכת $S'$, שנעה ביחס למעבדה במהירות $0.80c$ בכיוון $+x$? ענו ב-$\text{MeV}/c$.
    answer: 68.0
    unit: MeV/c
    correctFeedback: >-
      נכון. במעבדה $p_xc = \sqrt{350^2 - 140^2} = 320.8\,\text{MeV}$. עם $\gamma = 5/3$:
      $$p'_xc = \gamma\left(p_xc - \beta E\right) = \tfrac53\left(320.8 - 0.8\cdot350\right) = 68.0\,\text{MeV}$$
      בדיקה: $E' = \gamma\left(E - \beta\,p_xc\right) = 155.6\,\text{MeV}$, ו-$\sqrt{155.6^2 - 68.0^2} = 140\,\text{MeV}$, אנרגיית
      המנוחה של הפיון, כמו שצריך.
    wrongFeedback: >-
      מצאו קודם את $p_xc$ מתוך $E^2 = (pc)^2 + (mc^2)^2$. אחר כך $p'_xc = \gamma\left(p_xc - \beta E\right)$, כמו
      $x' = \gamma\left(x - \beta\,ct\right)$.
    commonWrong:
      - value: 1001
        feedback: >-
          השתמשתם בסימן פלוס, כאילו $S'$ נעה בכיוון $-x$. $S'$ נעה באותו כיוון כמו הפיון, ולכן בה הוא נע לאט יותר,
          והתנע שלו **קטן**.
      - value: 40.8
        feedback: 'שכחתם את $\gamma$: $p_xc - \beta E = 40.8\,\text{MeV}$, וצריך להכפיל ב-$\gamma = 5/3$.'
    hints:
      - 'הטרנספורמציה: $p''_xc = \gamma\left(p_xc - \beta E\right)$ ו-$E'' = \gamma\left(E - \beta\,p_xc\right)$.'
      - 'אחרי החישוב, בדקו ש-$E''^2 - (p''_xc)^2$ יצא $140^2$.'

  - id: Q-10.2-least-energy
    type: twotier
    objectives: [OBJ-10.2-1, OBJ-10.2-2]
    qualitative: true
    level: mid
    prompt: >-
      חלקיק בעל מסה $m$ נמדד ממערכות ייחוס אינרציאליות שונות, שנעות זו ביחס לזו. באיזו מערכת האנרגיה היחסותית שלו
      הקטנה ביותר?
    choices:
      - text: במערכת המנוחה שלו, ושם היא $mc^2$.
        correct: true
        feedback: >-
          נכון. בכל מערכת אחרת החלקיק נע, ויש לו גם אנרגיה קינטית. אנרגיית המנוחה היא הערך הקטן ביותר שהאנרגיה יכולה
          לקבל.
      - text: האנרגיה זהה בכל המערכות.
        feedback: >-
          האנרגיה **נשמרת** בכל מערכת: היא לא משתנה בזמן בתוך מערכת אחת. אבל בין מערכות שונות היא שונה, כי היא רכיב
          של ארבעה-וקטור, כמו $ct$.
        misconception: MC-10-energy-invariant
      - text: אין מינימום. במערכת שנעה מהר מספיק בכיוון החלקיק, האנרגיה שלו קטנה כרצוננו.
        feedback: >-
          כשמגבירים את מהירות המערכת בכיוון החלקיק, האנרגיה קטנה עד שהמערכת נעה בדיוק עם החלקיק, ושם היא $mc^2$.
          במהירות גדולה יותר החלקיק נע אחורה, והאנרגיה שוב גדלה.
    reasons:
      - text: '$E^2 = (pc)^2 + (mc^2)^2$ בכל מערכת, ולכן $E \ge mc^2$, עם שוויון רק כש-$p = 0$.'
        correct: true
        feedback: >-
          זה הנימוק. $E^2 - (pc)^2$ הוא הגודל האינווריאנטי של הארבעה-וקטור, ו-$(pc)^2 \ge 0$, ולכן $E$ קטן ככל
          האפשר כש-$p = 0$.
      - text: אנרגיה נשמרת, ולכן היא שווה בכל המערכות.
        feedback: 'שימור הוא שוויון בין לפני לאחרי באותה מערכת. אינווריאנטיות היא שוויון בין מערכות. האנרגיה נשמרת, אבל אינה אינווריאנטית.'
        misconception: MC-10-energy-invariant
      - text: '$E'' = \gamma E$ ו-$\gamma \ge 1$, ולכן האנרגיה הקטנה ביותר היא זו שבמעבדה.'
        feedback: >-
          הנוסחה $E' = \gamma E$ נכונה רק כשהחלקיק נח במערכת המקורית. באופן כללי $E' = \gamma\left(E - \beta\,p_xc\right)$,
          ואם $p_x \ne 0$ האנרגיה יכולה לקטון.
    hints:
      - 'מה הגודל שזהה בכל המערכות? מה הוא אומר על $E$?'

  - id: Q-10.2-photon-doppler
    type: numeric
    objectives: [OBJ-10.2-1]
    level: bagrut
    prompt: >-
      פוטון (חלקיק אור, חסר מסה, ולכן $E = pc$) באנרגיה $E = 10\,\text{MeV}$ נע במעבדה בכיוון $+x$. מה האנרגיה שלו
      במערכת $S'$, שנעה ביחס למעבדה במהירות $0.60c$ באותו כיוון, $+x$?
    answer: 5
    unit: MeV
    correctFeedback: >-
      נכון. עם $p_xc = E$:
      $$E' = \gamma\left(E - \beta E\right) = E\sqrt{\frac{1 - \beta}{1 + \beta}} = 10\cdot\sqrt{\frac{0.4}{1.6}} = 5.0\,\text{MeV}$$
      זו נוסחת דופלר היחסותית לאורך קו הראייה (שיעור 9.4), כי אנרגיית הפוטון פרופורציונית לתדירות שלו.
      **בדיקת גבולות:** כש-$\beta \to 0$ מקבלים $E' \to E$, וכש-$\beta \to 1$, מערכת שכמעט משיגה את הפוטון,
      $E' \to 0$. גם $p'_xc = \gamma(E - \beta E) = E'$: גם ב-$S'$ הפוטון חסר מסה.
    wrongFeedback: >-
      כתבו את הארבעה-וקטור של הפוטון, $(E/c,\ E/c,\ 0,\ 0)$, והעבירו את הרכיב הראשון: $E' = \gamma\left(E - \beta\,p_xc\right)$.
    commonWrong:
      - value: 20
        feedback: >-
          השתמשתם ב-$E' = \gamma(E + \beta E)$, כאילו המערכת נעה לקראת הפוטון. מערכת שנעה באותו כיוון כמו הפוטון
          רואה אותו באנרגיה **קטנה** יותר: הסטה לאדום.
      - value: 12.5
        feedback: >-
          חישבתם $\gamma E$, והשמטתם את האיבר $-\gamma\beta\,p_xc$. ההכפלה ב-$\gamma$ לבד מתאימה לחלקיק שנח
          במעבדה. לפוטון יש תנע, $p_xc = E$.
      - value: 8
        feedback: >-
          חילקתם ב-$\gamma$, כמו בהתארכות זמן. אנרגיה היא רכיב של ארבעה-וקטור, והיא עוברת בטרנספורמציה עם שני
          איברים, $\gamma(E - \beta\,p_xc)$.
    hints:
      - 'לפוטון שנע בכיוון $+x$, $p_xc = E$.'

  # ---------------------------------------------------------------- OBJ-10.2-2 the invariant shortens a calculation
  - id: Q-10.2-invariant-what
    type: mc
    objectives: [OBJ-10.2-2]
    qualitative: true
    level: basic
    prompt: >-
      איזה מהגדלים הבאים, שמחושבים לאותו חלקיק, יוצא זהה בכל מערכת ייחוס אינרציאלית?
    choices:
      - text: $E^2 - (pc)^2$
        correct: true
        feedback: >-
          נכון. זה הגודל האינווריאנטי של ארבעה-וקטור האנרגיה-תנע, כפול $c^2$, כמו $(ct)^2 - x^2$ של אינטרוול. הוא שווה
          ל-$(mc^2)^2$, וכך במערכת המנוחה רואים מיד את ערכו.
      - text: האנרגיה $E$
        feedback: >-
          האנרגיה היא הרכיב הראשון של הארבעה-וקטור, והיא משתנה בין מערכות: במערכת המנוחה היא $mc^2$, ובמערכת שבה
          החלקיק נע היא גדולה יותר.
        misconception: MC-10-energy-invariant
      - text: גודל התנע $p$
        feedback: 'במערכת המנוחה $p = 0$, ובכל מערכת אחרת $p > 0$. התנע משתנה בין מערכות, וכך גם $E$, אבל ההפרש בין ריבועיהם לא.'
      - text: האנרגיה הקינטית $K$
        feedback: 'במערכת המנוחה $K = 0$, ובכל מערכת אחרת $K > 0$. רק $E^2 - (pc)^2$ זהה בכל המערכות.'
    hints:
      - 'חשבו כל אחד מהגדלים במערכת המנוחה ובמערכת שבה החלקיק נע מהר.'

  - id: Q-10.2-two-photons
    type: numeric
    objectives: [OBJ-10.2-2]
    level: mid
    prompt: >-
      שני פוטונים, כל אחד באנרגיה $100\,\text{MeV}$, נעים במעבדה בכיוונים ניצבים זה לזה. מה המסה האינווריאנטית של
      המערכת של שניהם? ענו ב-$\text{MeV}/c^2$.
    answer: 141
    unit: MeV/c²
    correctFeedback: >-
      נכון. האנרגיה הכוללת $200\,\text{MeV}$, והתנעים ניצבים, ולכן $p_{\text{tot}}c = \sqrt{100^2 + 100^2} = 141\,\text{MeV}$.
      $$Mc^2 = \sqrt{E_{\text{tot}}^2 - (p_{\text{tot}}c)^2} = \sqrt{40000 - 20000} = 141\,\text{MeV}$$
      זה מקרה פרטי של $(Mc^2)^2 = 2E_1E_2(1 - \cos\theta)$ לשני פוטונים בזווית $\theta$. לכל פוטון מסה אפס, אבל למערכת
      שלהם יש מסה.
    wrongFeedback: >-
      המסה האינווריאנטית של מערכת היא $Mc^2 = \sqrt{E_{\text{tot}}^2 - (p_{\text{tot}}c)^2}$, עם התנע הכולל **כווקטור**.
    commonWrong:
      - value: 0
        feedback: >-
          חיברתם את המסות של הפוטונים, אפס ועוד אפס. מסה של מערכת אינה סכום המסות: היא נקבעת על ידי האנרגיה והתנע
          הכוללים, ושני פוטונים שנעים בכיוונים שונים הם מערכת בעלת מסה.
        misconception: MC-10-mass-additive
      - value: 200
        feedback: >-
          זו האנרגיה הכוללת. היא שווה ל-$Mc^2$ רק כשהתנע הכולל אפס, למשל בשני פוטונים שנעים בכיוונים מנוגדים. כאן
          התנע הכולל $141\,\text{MeV}/c$, וצריך להפחית את ריבועו.
        misconception: MC-10-available-is-lab-energy
    hints:
      - 'חברו את התנעים כווקטורים. מה גודל הסכום של שני וקטורים ניצבים באורך שווה?'

  - id: Q-10.2-system-mass
    type: twotier
    objectives: [OBJ-10.2-2]
    qualitative: true
    level: mid
    prompt: >-
      שני חלקיקים זהים, כל אחד בעל מסה $m$, נעים זה לקראת זה באותו גודל מהירות, עם גורם לורנץ $\gamma$ לכל אחד.
      מה המסה האינווריאנטית $M$ של המערכת של שניהם?
    choices:
      - text: $M = 2\gamma m$
        correct: true
        feedback: >-
          נכון. המסה של המערכת גדולה מסכום המסות, וההפרש הוא האנרגיה הקינטית של החלקיקים חלקי $c^2$. אם הם יתנגשו
          ויידבקו, יתקבל גוף נח שמסתו $2\gamma m$.
      - text: $M = 2m$
        feedback: >-
          מסה של מערכת אינה סכום המסות של החלקיקים. היא כוללת גם את האנרגיה הקינטית שלהם במערכת מרכז המסה.
        misconception: MC-10-mass-additive
      - text: $M = 0$, כי התנע הכולל אפס.
        feedback: 'התנע הכולל אפס פירושו שהמערכת "נחה", ואז $Mc^2$ שווה לאנרגיה הכוללת, $2\gamma mc^2$. זה ההפך מאפס.'
    reasons:
      - text: 'התנע הכולל אפס, ולכן $Mc^2 = \sqrt{E_{\text{tot}}^2 - 0} = 2\gamma mc^2$.'
        correct: true
        feedback: זה הנימוק. במערכת שבה התנע הכולל אפס, מסת המערכת היא פשוט האנרגיה הכוללת חלקי $c^2$.
      - text: מסה היא תכונה של כל חלקיק לחוד, ולכן מסת המערכת היא סכום המסות.
        feedback: >-
          לכל חלקיק לחוד, נכון. אבל המסה של מערכת נקבעת מהאנרגיה ומהתנע הכוללים שלה, ולכן תלויה גם בתנועה היחסית של
          חלקיה.
        misconception: MC-10-mass-additive
      - text: התנעים מבטלים זה את זה, ואיתם גם האנרגיות.
        feedback: 'תנע הוא וקטור, ושני תנעים מנוגדים מתבטלים. אנרגיה היא סקלר חיובי: אנרגיות לא מבטלות זו את זו.'
    hints:
      - 'מה התנע הכולל של המערכת? מה האנרגיה הכוללת שלה?'

  - id: Q-10.2-cm-energy
    type: numeric
    objectives: [OBJ-10.2-2]
    level: bagrut
    prompt: >-
      קרן פרוטונים באנרגיה יחסותית $E = 30\,\text{GeV}$ פוגעת בפרוטונים נייחים במטרה ($mc^2 = 0.938\,\text{GeV}$).
      האנרגיה במערכת מרכז המסה, $\sqrt{s}$, מוגדרת על ידי $s = E_{\text{tot}}^2 - (p_{\text{tot}}c)^2$, והיא האנרגיה
      שעומדת לרשות יצירת חלקיקים חדשים. מה $\sqrt{s}$ בהתנגשות של פרוטון מהקרן בפרוטון מהמטרה?
    answer: 7.62
    unit: GeV
    correctFeedback: >-
      נכון. במעבדה $E_{\text{tot}} = E + mc^2$ ו-$p_{\text{tot}}c = pc$, עם $(pc)^2 = E^2 - (mc^2)^2$. לכן
      $$s = (E + mc^2)^2 - (pc)^2 = 2(mc^2)^2 + 2mc^2E = 58.0\,\text{GeV}^2,\qquad \sqrt s = 7.62\,\text{GeV}$$
      **בדיקת גבולות:** כש-$E = mc^2$, קרן נייחת, מקבלים $\sqrt s = 2mc^2$, שני פרוטונים נחים. כש-$E \gg mc^2$,
      $\sqrt s \approx \sqrt{2mc^2E}$: היא גדלה רק כמו השורש של אנרגיית הקרן. רוב האנרגיה הולכת לתנועה של מרכז המסה.
    wrongFeedback: >-
      $s$ זהה בכל מערכת. חשבו אותו במעבדה, עם האנרגיה הכוללת של שני הפרוטונים ועם התנע הכולל, שהוא התנע של פרוטון
      הקרן לבד.
    commonWrong:
      - value: 30.9
        feedback: >-
          זה $E + mc^2$, האנרגיה הכוללת במעבדה. למערכת יש תנע גדול, ולכן רוב האנרגיה הזו היא אנרגיה של תנועת מרכז
          המסה, שאינה זמינה ליצירת חלקיקים.
        misconception: MC-10-available-is-lab-energy

  - id: Q-10.3-why-colliders
    type: twotier
    objectives: [OBJ-10.3-2]
    qualitative: true
    level: bagrut
    prompt: >-
      במאיץ עם מטרה נייחת ובמאיץ של התנגשות חזיתית, עם שתי קרנות זהות, מגדילים פי 2 את האנרגיה של כל קרן. האנרגיות
      גבוהות בהרבה מאנרגיית המנוחה של הפרוטון. פי כמה גדלה בערך האנרגיה במערכת מרכז המסה, $\sqrt s$, בכל אחד
      מהמאיצים?
    choices:
      - text: במטרה נייחת פי $\sqrt2 \approx 1.4$, ובהתנגשות חזיתית פי 2.
        correct: true
        feedback: >-
          נכון. למשל, קרן של $100\,\text{GeV}$ על מטרה נייחת נותנת $\sqrt s = 13.8\,\text{GeV}$, וקרן של $200\,\text{GeV}$
          רק $19.4\,\text{GeV}$. בהתנגשות חזיתית כל האנרגיה זמינה. לכן מאיצי החלקיקים הגדולים של היום מתנגשים חזיתית.
      - text: בשני המאיצים פי 2.
        feedback: >-
          זה נכון רק בהתנגשות חזיתית. במטרה נייחת רוב האנרגיה של הקרן הולכת לתנועה של מרכז המסה, והחלק הזמין גדל רק
          כמו שורש האנרגיה.
        misconception: MC-10-available-is-lab-energy
      - text: במטרה נייחת פי 2, ובהתנגשות חזיתית פי 4.
        feedback: 'בהתנגשות חזיתית $\sqrt s = 2E$, ולכן הכפלת $E$ מכפילה את $\sqrt s$, לא פי 4. במטרה נייחת הגידול קטן יותר.'
    reasons:
      - text: 'במטרה נייחת $s \approx 2mc^2E$, ולכן $\sqrt s \propto \sqrt E$. בהתנגשות חזיתית התנע הכולל אפס, ו-$\sqrt s = 2E$.'
        correct: true
        feedback: זה הנימוק. האינווריאנט נותן את שני הביטויים בשורה אחת כל אחד.
      - text: כל האנרגיה של הקרן עומדת לרשות יצירת חלקיקים, בכל סוג של מאיץ.
        feedback: 'במטרה נייחת התוצרים חייבים לשאת את התנע של הקרן, והאנרגיה הקינטית שלהם אינה זמינה ליצירת מסה.'
        misconception: MC-10-available-is-lab-energy
      - text: האנרגיה במערכת מרכז המסה היא סכום האנרגיות הקינטיות של שני החלקיקים במעבדה.
        feedback: >-
          זה נכון רק כשהתנע הכולל אפס, ועוד צריך להוסיף את אנרגיות המנוחה. במטרה נייחת התנע הכולל גדול, ו-$\sqrt s$
          קטן בהרבה מסכום האנרגיות.
    hints:
      - 'כתבו את $s$ לשני המקרים, והשאירו רק את האיבר הגדול כש-$E \gg mc^2$.'

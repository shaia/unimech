# Lesson 10.3 question bank: the comprehension ladder of "דעיכות והתנגשויות יחסותיות".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed by .scratch/ch10/q.ts and q2.ts (rest energies given in the prompts:
# π⁺ 140 MeV, μ⁺ 106 MeV, ν massless, p 938 MeV, π⁰ 135 MeV, Λ⁰ 1116 MeV, π⁻ 140 MeV):
#   π⁺ → μ⁺ν at rest: E_μ = (140² + 106²)/280 = 110.1 MeV, K_μ = 4.13 MeV, p = (140² − 106²)/280 = 29.9 MeV/c
#     (all of Q = 34 MeV to the muon; half 17; ½-share wrong);
#   Λ⁰ → pπ⁻ at rest: p* = √[(M² − (m₁+m₂)²)(M² − (m₁−m₂)²)]/(2M) = 101 MeV/c (classical √(2Qμ) = 96.2;
#     equal share of Q = 38 MeV gives the pion 75.4 MeV/c);
#   p + p → p p p p̄: fixed target K = 6mc² = 5628 MeV (2mc² = 1876, E = 7mc² = 6566); head-on, per beam, mc² = 938 MeV;
#   p + p → p p π⁰: K = 2m_π + m_π²/(2m_p) = 279.7 MeV (E = 1218 MeV; head-on m_π/2 = 67.5 MeV);
#   fixed target 100 → 200 GeV: √s = 13.8 → 19.4 GeV, ×1.41.

chapter: 10
questions:
  # ---------------------------------------------------------------- OBJ-10.3-1 two-body decay from conservation of energy and momentum
  - id: Q-10.3-back-to-back
    type: vector
    objectives: [OBJ-10.3-1]
    qualitative: true
    level: basic
    prompt: >-
      פיון $\pi^+$ שנח במעבדה דועך למיואון ולנייטרינו, $\pi^+ \to \mu^+ + \nu$. במבט מלמעלה על הדף, המיואון יוצא
      מזרחה, ימינה בדף. לאיזה כיוון נע הנייטרינו?
    answer: w
    correctFeedback: >-
      נכון. לפני הדעיכה התנע הכולל אפס, והוא נשמר. לכן $\vec p_\nu = -\vec p_\mu$: מערבה, ובאותו גודל תנע כמו
      המיואון. בדעיכה לשני חלקיקים במערכת המנוחה, שני התוצרים יוצאים תמיד גב אל גב.
    wrong:
      - dir: e
        feedback: 'אם שניהם נעים מזרחה, התנע הכולל אחרי הדעיכה מזרחה, ולפניה הוא היה אפס. התנע לא נשמר.'
      - dir: zero
        feedback: >-
          הנייטרינו כמעט חסר מסה, אבל יש לו תנע, $p = E/c$, ובלעדיו התנע לא היה נשמר. חלקיק חסר מסה תמיד נע, במהירות
          $c$.
        misconception: MC-10-massless-no-momentum
      - dir: n
        feedback: 'אם הנייטרינו נע צפונה, לתנע הכולל יש רכיב מזרחה ורכיב צפונה, ולפני הדעיכה הוא היה אפס.'
    wrongFeedback: 'מה היה התנע הכולל לפני הדעיכה? מה הוא צריך להיות אחריה?'
    hints:
      - 'התנע הכולל של פיון נח הוא אפס.'

  - id: Q-10.3-who-more-kinetic
    type: twotier
    objectives: [OBJ-10.3-1]
    qualitative: true
    level: mid
    prompt: >-
      באותה דעיכה, $\pi^+ \to \mu^+ + \nu$ של פיון נח, אנרגיית המנוחה של הפיון $140\,\text{MeV}$, של המיואון
      $106\,\text{MeV}$, והנייטרינו חסר מסה. לאיזה מהתוצרים אנרגיה קינטית גדולה יותר?
    choices:
      - text: לנייטרינו.
        correct: true
        feedback: >-
          נכון. מתוך $34\,\text{MeV}$ שמשתחררים, הנייטרינו לוקח $29.9\,\text{MeV}$ והמיואון רק $4.1\,\text{MeV}$. באותו
          תנע, חלקיק קל מקבל הרבה יותר אנרגיה קינטית מחלקיק כבד.
      - text: למיואון, כי הוא הכבד מבין השניים.
        feedback: >-
          לחלקיק כבד יש יותר אנרגיה קינטית **באותה מהירות**. כאן לשניהם אותו גודל תנע, ובאותו תנע לחלקיק הכבד אנרגיה
          קינטית קטנה יותר.
      - text: האנרגיה מתחלקת שווה בשווה, $17\,\text{MeV}$ לכל אחד.
        feedback: >-
          שימור האנרגיה לא קובע את החלוקה. מה שקובע אותה הוא שימור התנע: לשני התוצרים אותו גודל תנע, ולכן החלוקה לפי
          המסות.
        misconception: MC-10-equal-share
    reasons:
      - text: 'גודל התנע של שניהם שווה. באותו $p$, הנייטרינו מקבל $K = pc$, והמיואון $K = \sqrt{(pc)^2 + (mc^2)^2} - mc^2 < pc$.'
        correct: true
        feedback: >-
          זה הנימוק. לחלקיק בעל מסה $\sqrt{(pc)^2 + (mc^2)^2} < pc + mc^2$, ולכן האנרגיה הקינטית שלו קטנה מ-$pc$.
          כשהמסה גדולה בהרבה מ-$p/c$, היא בקירוב $p^2/(2m)$, קטנה מאוד.
      - text: האנרגיה נשמרת, ולכן כל תוצר מקבל חצי מהאנרגיה שמשתחררת.
        feedback: 'שימור האנרגיה נותן רק את הסכום. כדי לדעת איך הוא מתחלק צריך גם את שימור התנע.'
        misconception: MC-10-equal-share
      - text: לגוף כבד יש יותר אנרגיה בכל מהירות.
        feedback: 'נכון באותה מהירות, אבל כאן המהירויות שונות מאוד: הנייטרינו נע ב-$c$, והמיואון ב-$0.27c$. מה שזהה הוא התנע.'
    hints:
      - 'מה משותף לשני התוצרים לפי שימור התנע?'

  - id: Q-10.3-muon-kinetic
    type: numeric
    objectives: [OBJ-10.3-1]
    level: mid
    prompt: >-
      פיון $\pi^+$ ($m_\pi c^2 = 140\,\text{MeV}$) נח ודועך, $\pi^+ \to \mu^+ + \nu$, למיואון ($m_\mu c^2 = 106\,\text{MeV}$)
      ולנייטרינו חסר מסה. מה האנרגיה הקינטית של המיואון?
    answer: 4.13
    unit: MeV
    correctFeedback: >-
      נכון. שימור תנע: לשני התוצרים אותו גודל תנע $p$, ולנייטרינו $E_\nu = pc$. שימור אנרגיה: $E_\mu + pc = m_\pi c^2$.
      מציבים $pc = m_\pi c^2 - E_\mu$ ב-$E_\mu^2 = (pc)^2 + (m_\mu c^2)^2$ ומקבלים
      $$E_\mu = \frac{(m_\pi^2 + m_\mu^2)c^2}{2m_\pi} = \frac{140^2 + 106^2}{280} = 110.1\,\text{MeV}$$
      ולכן $K_\mu = 110.1 - 106 = 4.13\,\text{MeV}$. הנייטרינו לוקח את השאר, $29.9\,\text{MeV}$.
    wrongFeedback: >-
      כתבו שימור אנרגיה ושימור תנע. בדעיכה של חלקיק נח לשניים, גודל התנע של שני התוצרים זהה. השתמשו גם ב-$E_\nu = pc$.
    commonWrong:
      - value: 34
        feedback: >-
          זו כל האנרגיה שמשתחררת, $140 - 106$. גם לנייטרינו יש אנרגיה, ובגלל שימור התנע הוא לוקח את רובה.
      - value: 17
        feedback: 'חילקתם את $34\,\text{MeV}$ שווה בשווה. שימור התנע קובע חלוקה אחרת: באותו תנע, הנייטרינו מקבל הרבה יותר.'
        misconception: MC-10-equal-share
      - value: 110
        feedback: 'זו האנרגיה היחסותית של המיואון, $E_\mu$. האנרגיה הקינטית קטנה ממנה ב-$m_\mu c^2 = 106\,\text{MeV}$.'
        misconception: MC-10-total-vs-kinetic
    hints:
      - 'שתי משוואות: $E_\mu + E_\nu = m_\pi c^2$, ו-$|\vec p_\mu| = |\vec p_\nu| = p$.'
      - 'העבירו את $E_\mu$ לצד אחד: $pc = m_\pi c^2 - E_\mu$, ואז העלו בריבוע.'

  - id: Q-10.3-lambda-decay
    type: numeric
    objectives: [OBJ-10.3-1]
    level: bagrut
    prompt: >-
      חלקיק $\Lambda^0$ ($Mc^2 = 1116\,\text{MeV}$) נח ודועך לפרוטון ($m_1c^2 = 938\,\text{MeV}$) ולפיון
      $\pi^-$ ($m_2c^2 = 140\,\text{MeV}$). לשני התוצרים יש מסה. מה גודל התנע של כל אחד מהם?
    answer: 101
    unit: MeV/c
    correctFeedback: >-
      נכון. שימור אנרגיה, $\sqrt{(pc)^2 + (m_1c^2)^2} + \sqrt{(pc)^2 + (m_2c^2)^2} = Mc^2$, עם אותו $p$ לשניהם. מעבירים
      שורש אחד לצד השני ומעלים בריבוע פעמיים:
      $$pc = \frac{\sqrt{\left[M^2 - (m_1 + m_2)^2\right]\left[M^2 - (m_1 - m_2)^2\right]}}{2M}\,c^2 = 101\,\text{MeV}$$
      **בדיקת גבולות:** כש-$M = m_1 + m_2$ אין אנרגיה לתנועה, ו-$p = 0$. כש-$m_1 \to 0$ מקבלים
      $pc = (M^2 - m_2^2)c^2/(2M)$, הנוסחה של דעיכת הפיון למיואון ולנייטרינו.
    wrongFeedback: >-
      כתבו את שימור האנרגיה עם שני שורשים ואותו $p$. מעבירים שורש אחד לאגף השני, מעלים בריבוע, מבודדים את השורש
      שנשאר ומעלים שוב בריבוע.
    commonWrong:
      - value: 96.2
        feedback: >-
          זה הפתרון של ניוטון, $\dfrac{p^2}{2m_1} + \dfrac{p^2}{2m_2} = Q$ עם $Q = 38\,\text{MeV}$. לפרוטון הוא כמעט נכון,
          אבל לפיון $pc$ קרוב ל-$m_2c^2$, והקירוב $K \approx p^2/(2m)$ לא תקף לו.
        misconception: MC-10-classical-ke
      - value: 75.4
        feedback: >-
          זה התנע של פיון שמקבל חצי מ-$38\,\text{MeV}$. האנרגיה לא מתחלקת שווה: לשני התוצרים אותו תנע, והפיון הקל
          לוקח כ-$32.6\,\text{MeV}$ מתוך ה-38.
        misconception: MC-10-equal-share
    hints:
      - 'גודל התנע של שני התוצרים זהה. כתבו את האנרגיה של כל אחד כשורש של $(pc)^2 + (mc^2)^2$.'
      - 'אפשר לקצר: $E_1 = \dfrac{(M^2 + m_1^2 - m_2^2)c^2}{2M}$, ואז $pc = \sqrt{E_1^2 - (m_1c^2)^2}$.'

  # ---------------------------------------------------------------- OBJ-10.3-2 threshold energy, fixed target vs head-on
  - id: Q-10.3-threshold-why
    type: mc
    objectives: [OBJ-10.3-2]
    qualitative: true
    level: basic
    prompt: >-
      בתגובה $p + p \to p + p + p + \bar p$, פרוטון מהקרן פוגע בפרוטון נייח במטרה ויוצר זוג של פרוטון ואנטי-פרוטון.
      אנרגיית המנוחה של הזוג החדש היא $2mc^2$. מדוע האנרגיה הקינטית המזערית של פרוטון הקרן גדולה מ-$2mc^2$?
    choices:
      - text: לפני ההתנגשות יש תנע, והוא נשמר, ולכן ארבעת החלקיקים בסוף חייבים לנוע. חלק מהאנרגיה הולך לתנועה הזו.
        correct: true
        feedback: >-
          נכון. התוצרים לא יכולים לעמוד במעבדה, כי אז התנע הכולל היה אפס. באנרגיית הסף הם נעים יחד, במהירות של
          מרכז המסה, והאנרגיה הקינטית שלהם לא זמינה ליצירת מסה. החישוב נותן $6mc^2$.
      - text: היא לא גדולה מ-$2mc^2$. אנרגיה קינטית של $2mc^2$ מספיקה בדיוק.
        feedback: >-
          זה נכון רק אם התוצרים נחים בסוף. אבל לפני ההתנגשות יש תנע, ובלי תנועה של התוצרים הוא לא היה נשמר.
        misconception: MC-10-threshold-is-mass-gain
      - text: כי חלק מהאנרגיה הולך לחימום המטרה.
        feedback: >-
          אנרגיית הסף נובעת משימור תנע ואנרגיה בהתנגשות של שני פרוטונים בודדים. גם בלי שום הפסד, $2mc^2$ לא מספיק.
      - text: כי צריך ליצור מחדש גם את אנרגיית המנוחה של שני הפרוטונים המקוריים.
        feedback: >-
          שני הפרוטונים המקוריים כבר קיימים לפני התגובה, ואנרגיית המנוחה שלהם נמצאת באגף השמאלי. המסה החדשה היא רק
          $2mc^2$.
    hints:
      - 'אילו כל ארבעת התוצרים היו נחים במעבדה, מה היה התנע הכולל אחרי ההתנגשות?'

  - id: Q-10.3-head-on
    type: numeric
    objectives: [OBJ-10.3-2]
    level: basic
    prompt: >-
      שתי קרנות של פרוטונים ($mc^2 = 938\,\text{MeV}$), באותה אנרגיה, מתנגשות חזיתית, ויוצרות את התגובה
      $p + p \to p + p + p + \bar p$. מה האנרגיה הקינטית המזערית של כל פרוטון?
    answer: 938
    unit: MeV
    correctFeedback: >-
      נכון. בהתנגשות חזיתית של קרנות זהות התנע הכולל אפס, והמעבדה היא מערכת מרכז המסה. בסף, ארבעת התוצרים נחים:
      $2E = 4mc^2$, ולכן $E = 2mc^2$ ו-$K = mc^2 = 938\,\text{MeV}$ לכל פרוטון. כל האנרגיה הקינטית, $2mc^2$, הופכת
      למסה של הזוג החדש.
    wrongFeedback: >-
      כמה תנע יש למערכת לפני ההתנגשות? אם הוא אפס, התוצרים יכולים לעמוד במקום בסף.
    commonWrong:
      - value: 1876
        feedback: 'זו כל המסה החדשה, $2mc^2$. שתי הקרנות תורמות אותה יחד, ולכן כל פרוטון צריך רק חצי, $mc^2$.'
      - value: 2814
        feedback: >-
          חילקתם את אנרגיית הסף של מטרה נייחת, $6mc^2$, בין שתי הקרנות. בהתנגשות חזיתית התנע הכולל אפס, ושום אנרגיה
          לא הולכת לתנועה של מרכז המסה, ולכן צריך הרבה פחות.
        misconception: MC-10-available-is-lab-energy
    hints:
      - 'בסף, בהתנגשות חזיתית, מה המהירות של התוצרים?'

  - id: Q-10.3-pp-threshold
    type: numeric
    objectives: [OBJ-10.3-2]
    level: mid
    prompt: >-
      פרוטון מהקרן פוגע בפרוטון נייח במטרה ($mc^2 = 938\,\text{MeV}$), ויוצר את התגובה $p + p \to p + p + p + \bar p$.
      השתמשו בגודל האינווריאנטי $s = E_{\text{tot}}^2 - (p_{\text{tot}}c)^2$ ומצאו את אנרגיית הסף, האנרגיה הקינטית
      המזערית של פרוטון הקרן.
    answer: 5628
    unit: MeV
    correctFeedback: >-
      נכון. במעבדה $s = (E + mc^2)^2 - (pc)^2 = 2(mc^2)^2 + 2mc^2E$. בסף, במערכת מרכז המסה, ארבעת התוצרים נחים, ולכן
      $s = (4mc^2)^2$. משווים: $2mc^2E = 14(mc^2)^2$, כלומר $E = 7mc^2$ ו-$K = 6mc^2 = 5630\,\text{MeV}$, כ-$5.6\,\text{GeV}$.
      רק שליש מזה הופך למסה חדשה.
    wrongFeedback: >-
      חשבו את $s$ פעמיים: במעבדה, עם פרוטון נייח ופרוטון בעל אנרגיה $E$, ובמערכת מרכז המסה בסף, שבה שלושה פרוטונים
      ואנטי-פרוטון נחים. השוו ובודדו את $E$.
    commonWrong:
      - value: 1876
        feedback: 'זו רק המסה החדשה, $2mc^2$. מטרה נייחת דורשת יותר, כי התוצרים חייבים לשאת את התנע של הקרן.'
        misconception: MC-10-threshold-is-mass-gain
      - value: 6566
        feedback: 'זו האנרגיה היחסותית של פרוטון הקרן בסף, $E = 7mc^2$. אנרגיית הסף היא האנרגיה הקינטית, $E - mc^2$.'
        misconception: MC-10-total-vs-kinetic
    hints:
      - 'בסף, במערכת מרכז המסה, כל התוצרים נחים. מה $s$ שם?'

  - id: Q-10.3-pi0-threshold
    type: numeric
    objectives: [OBJ-10.3-2]
    level: bagrut
    prompt: >-
      פרוטון מהקרן פוגע בפרוטון נייח ויוצר פיון ניטרלי: $p + p \to p + p + \pi^0$. אנרגיות המנוחה: פרוטון
      $m_pc^2 = 938\,\text{MeV}$, פיון ניטרלי $m_\pi c^2 = 135\,\text{MeV}$. מה אנרגיית הסף של התגובה?
    answer: 279.7
    unit: MeV
    correctFeedback: >-
      נכון. בסף, $s = (2m_p + m_\pi)^2c^4$, ובמעבדה $s = 2(m_pc^2)^2 + 2m_pc^2E$. מכאן
      $$K_{\text{th}} = E - m_pc^2 = \frac{(2m_p + m_\pi)^2 - (2m_p)^2}{2m_p}\,c^2 = \left(2m_\pi + \frac{m_\pi^2}{2m_p}\right)c^2 = 280\,\text{MeV}$$
      **בדיקת גבולות:** הנוסחה הכללית לקרן בעלת מסה $m$ על מטרה בעלת מסה $M$ היא
      $K_{\text{th}} = \dfrac{(\Sigma m_f)^2 - (m + M)^2}{2M}c^2$. כשהמטרה כבדה מאוד, $M \to \infty$, היא שואפת ל-$m_\pi c^2$:
      מטרה כבדה בולעת את התנע בלי לקחת אנרגיה. מטרה שקלה כמו הקרן גוזלת בערך פי 2.
    wrongFeedback: >-
      השוו את $s$ במעבדה ל-$s$ בסף, שבו שני הפרוטונים והפיון נחים במערכת מרכז המסה, ובודדו את האנרגיה הקינטית של
      פרוטון הקרן.
    commonWrong:
      - value: 135
        feedback: 'זו רק המסה החדשה. התוצרים חייבים לשאת את התנע של הקרן, ולכן צריך כמעט פי 2.'

# Lesson 10.4 question bank: the comprehension ladder of "פוטונים ומסה חסרה".
# Every objective has ≥ 3 questions, one of them qualitative, and the lesson climbs basic → mid → bagrut.
# YAML note: plain, single-quoted and >- strings keep backslashes literally; never use "…" for TeX.
#
# Every number was computed by .scratch/ch10/q.ts and q2.ts with constants.ts (E_CHARGE = 1.6e-19, C_LIGHT = 3.0e8)
# and the data given in the prompts (λ_C = 2.43 pm, m_e c² = 0.511 MeV, nuclear rest energies in MeV):
#   2.0 eV photon: p = E/c = 1.07e-27 kg·m/s (E/c² = 3.56e-36, E·c = 9.6e-11);
#   λ = 10.0 pm at 60°: λ' = 10.0 + 2.43·0.5 = 11.2 pm (λ + λ_C = 12.4, 1 + cos → 13.6, minus → 8.79);
#   1.00 MeV photon backscattered: E' = E/(1 + 2E/mc²) = 0.204 MeV, electron K = 0.796 MeV;
#   deuteron: B = 938.272 + 939.565 − 1875.613 = 2.22 MeV (938 + 940 − 1875.613 = 2.39);
#   d + d → ⁴He (3727.379 MeV): Q = 2·1875.613 − 3727.379 = 23.8 MeV (B_He = 28.3, 2B_d = 4.45);
#   water: ≈3 eV / 1.7e4 MeV ≈ 2e-10 of the rest energy.

chapter: 10
questions:
  # ---------------------------------------------------------------- OBJ-10.4-1 the photon's energy and momentum, Compton scattering
  - id: Q-10.4-photon-momentum
    type: numeric
    objectives: [OBJ-10.4-1]
    level: basic
    prompt: >-
      פוטון של אור אדום נושא אנרגיה $E = 2.0\,\text{eV}$. מה גודל התנע שלו? ענו ביחידות SI.
      ($1\,\text{eV} = 1.6\cdot10^{-19}\,\text{J}$, $c = 3.0\cdot10^8\,\text{m/s}$.)
    answer: 1.07e-27
    unit: kg·m/s
    correctFeedback: >-
      נכון. לפוטון $m = 0$, ולכן $E = pc$ ו-$p = \dfrac{E}{c} = \dfrac{3.2\cdot10^{-19}}{3.0\cdot10^8} = 1.07\cdot10^{-27}\,\text{kg·m/s}$.
      זה זעיר, אבל במיליארדי מיליארדי פוטונים בשנייה זה לחץ קרינה שאפשר למדוד.
    wrongFeedback: 'הציבו $m = 0$ בקשר $E^2 = (pc)^2 + (mc^2)^2$. המירו את האנרגיה לג׳אול לפני שמחלקים.'
    commonWrong:
      - value: 0
        feedback: 'לפוטון אין מסה, אבל יש לו תנע: $p = E/c$. התנע של חלקיק חסר מסה אינו $mv$.'
        misconception: MC-10-massless-no-momentum
      - value: 3.56e-36
        feedback: 'חילקתם ב-$c^2$. כך מקבלים מסה ($E/c^2$, בקילוגרמים), לא תנע. התנע של פוטון הוא $E/c$.'
      - value: 9.6e-11
        feedback: 'כפלתם ב-$c$ במקום לחלק. בדקו יחידות: $\text{J}\cdot\text{m/s}$ אינן יחידות של תנע, ו-$\text{J}/(\text{m/s}) = \text{kg·m/s}$.'
    hints:
      - 'לחלקיק חסר מסה, $E = pc$.'

  - id: Q-10.4-compton-shift
    type: numeric
    objectives: [OBJ-10.4-1]
    level: mid
    prompt: >-
      קרינת גמא באורך גל $\lambda = 10.0\,\text{pm}$ נפזרת מאלקטרון חופשי ונייח, והפוטון יוצא בזווית $\theta = 60^\circ$
      מהכיוון המקורי שלו. בפיזור קומפטון $\Delta\lambda = \lambda_C(1 - \cos\theta)$, כאשר אורך הגל של קומפטון של
      האלקטרון הוא $\lambda_C = h/(m_ec) = 2.43\,\text{pm}$. מה אורך הגל של הפוטון המפוזר?
    answer: 11.2
    unit: pm
    correctFeedback: >-
      נכון. $\Delta\lambda = 2.43\cdot(1 - 0.5) = 1.22\,\text{pm}$, ולכן $\lambda' = 11.2\,\text{pm}$. אורך הגל גדל:
      הפוטון מסר לאלקטרון חלק מהאנרגיה ומהתנע שלו.
    wrongFeedback: 'חשבו $1 - \cos60^\circ$, כפלו ב-$\lambda_C$, והוסיפו לאורך הגל המקורי.'
    commonWrong:
      - value: 10
        feedback: >-
          זה אורך הגל המקורי. הפוטון לא "מתנגש ומחזיר" בלי שינוי: הוא מוסר לאלקטרון תנע, ולכן מאבד אנרגיה ואורך הגל
          שלו גדל.
      - value: 12.43
        feedback: 'הוספתם את $\lambda_C$ כולו. השינוי הוא $\lambda_C(1 - \cos\theta)$, ו-$\lambda_C$ כולו מתקבל רק ב-$90^\circ$.'
      - value: 13.65
        feedback: 'השתמשתם ב-$1 + \cos\theta$. הנוסחה היא $1 - \cos\theta$: בפיזור קדימה, $\theta = 0$, אין שינוי.'
      - value: 8.79
        feedback: 'הפחתתם את השינוי. הפוטון מאבד אנרגיה לאלקטרון, ולכן אורך הגל שלו **גדל**.'
    hints:
      - '$\cos60^\circ = 0.5$.'

  - id: Q-10.4-compton-max
    type: twotier
    objectives: [OBJ-10.4-1]
    qualitative: true
    level: mid
    prompt: >-
      בפיזור קומפטון של פוטון מאלקטרון חופשי ונייח, באיזו זווית פיזור $\theta$ אורך הגל של הפוטון גדל ביותר?
    choices:
      - text: $\theta = 180^\circ$, כשהפוטון חוזר לאחור.
        correct: true
        feedback: >-
          נכון. שם $\Delta\lambda = 2\lambda_C = 4.86\,\text{pm}$, המקסימום. בפיזור קדימה, $\theta = 0$, אין שינוי בכלל,
          כי הפוטון ממשיך כמעט בלי לגעת באלקטרון.
      - text: $\theta = 90^\circ$
        feedback: >-
          ב-$90^\circ$ השינוי הוא $\lambda_C$, חצי מהמקסימום. $1 - \cos\theta$ ממשיך לגדול עד $\theta = 180^\circ$.
      - text: השינוי זהה בכל הזוויות.
        feedback: 'השינוי תלוי בזווית דרך $1 - \cos\theta$, מאפס בפיזור קדימה עד $2\lambda_C$ בפיזור לאחור.'
    reasons:
      - text: 'הגורם $1 - \cos\theta$ מרבי ב-$180^\circ$. שם האלקטרון מקבל את התנע הגדול ביותר, ואיתו את האנרגיה הגדולה ביותר.'
        correct: true
        feedback: >-
          זה הנימוק. כשהפוטון חוזר לאחור, גודל התנע שהאלקטרון מקבל הוא הסכום של גודל התנע ההתחלתי והסופי של
          הפוטון, ולכן הוא הגדול ביותר.
      - text: ב-$90^\circ$ הפוטון דוחף את האלקטרון הכי חזק הצידה.
        feedback: 'האנרגיה שהאלקטרון מקבל, $E - E''$, גדלה עם הזווית כל הדרך עד $180^\circ$, ואיתה התנע שלו. ב-$90^\circ$ היא רק חלק מהמקסימום.'
      - text: הפוטון המפוזר נע לאט יותר, ולכן אורך הגל שלו גדל.
        feedback: >-
          פוטון נע תמיד במהירות $c$. אורך הגל גדל כי האנרגיה והתנע של הפוטון קטנים, $\lambda = h/p$, לא כי הוא מאט.
        misconception: MC-10-massless-speed-varies
    hints:
      - 'מתי $\cos\theta$ קטן ככל האפשר?'

  - id: Q-10.4-compton-edge
    type: numeric
    objectives: [OBJ-10.4-1]
    level: bagrut
    prompt: >-
      פוטון באנרגיה $E = 1.00\,\text{MeV}$ נפזר לאחור ($\theta = 180^\circ$) מאלקטרון חופשי ונייח
      ($m_ec^2 = 0.511\,\text{MeV}$). מה האנרגיה הקינטית שהאלקטרון מקבל? היעזרו בנוסחת קומפטון,
      $\lambda' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta)$, ובקשר $E = hc/\lambda$ של פוטון.
    answer: 0.796
    unit: MeV
    correctFeedback: >-
      נכון. מחלקים את נוסחת קומפטון ב-$hc$: $\dfrac1{E'} - \dfrac1E = \dfrac{1 - \cos\theta}{m_ec^2}$. לכן
      $$E' = \frac{E}{1 + \dfrac{E}{m_ec^2}(1 - \cos\theta)} = \frac{1.00}{1 + 2\cdot1.00/0.511} = 0.204\,\text{MeV}$$
      והאלקטרון מקבל $K = E - E' = 0.796\,\text{MeV}$. זו האנרגיה הגדולה ביותר שפוטון כזה יכול למסור לאלקטרון.
      **בדיקת גבולות:** כש-$E \ll m_ec^2$, $E' \to E$: פוטון רך כמעט לא מאבד אנרגיה, כמו פיזור קלאסי של אור.
      כש-$E \gg m_ec^2$ לאחור, $E' \to m_ec^2/2 = 0.256\,\text{MeV}$, בלי קשר לאנרגיה ההתחלתית.
    wrongFeedback: >-
      החליפו כל אורך גל ב-$hc/E$ ומצאו את $E'$. האנרגיה הקינטית של האלקטרון היא מה שהפוטון איבד.
    commonWrong:
      - value: 1
        feedback: >-
          זו כל האנרגיה של הפוטון. אלקטרון חופשי לא יכול לבלוע פוטון לגמרי: אי אפשר לשמור כך גם על האנרגיה וגם
          על התנע. הפוטון ממשיך, עם $0.204\,\text{MeV}$.
        misconception: MC-10-energy-only
      - value: 0.5
        feedback: 'חילקתם את האנרגיה שווה בשווה. החלוקה נקבעת משימור האנרגיה והתנע יחד, ותלויה בזווית ובאנרגיה.'
        misconception: MC-10-equal-share
      - value: 0.204
        feedback: 'זו האנרגיה של הפוטון המפוזר, $E''$. האלקטרון מקבל את ההפרש, $E - E''$.'
    hints:
      - 'עם $\lambda = hc/E$, נוסחת קומפטון הופכת ל-$1/E'' - 1/E = (1 - \cos\theta)/(m_ec^2)$.'

  - id: Q-10.4-free-electron-absorb
    type: mc
    objectives: [OBJ-10.4-1]
    qualitative: true
    level: bagrut
    prompt: >-
      האם אלקטרון חופשי ונייח יכול לבלוע פוטון לגמרי, כך שאחרי התהליך יש רק אלקטרון אחד שנע?
    choices:
      - text: 'לא. אי אפשר לשמור גם על האנרגיה וגם על התנע.'
        correct: true
        feedback: >-
          נכון. לפני התהליך $s = (m_ec^2 + E)^2 - E^2 = (m_ec^2)^2 + 2m_ec^2E$, ואחריו, לאלקטרון לבד, $s = (m_ec^2)^2$.
          השניים שווים רק כש-$E = 0$. לכן בפיזור קומפטון תמיד יוצא פוטון, ובליעה של פוטון אפשרית רק כשחלקיק נוסף,
          כמו גרעין, לוקח חלק מהתנע.
      - text: כן, אם האנרגיה של הפוטון מספיקה כדי לשחרר את האלקטרון.
        feedback: >-
          אלקטרון חופשי לא צריך שחרור. הבעיה איננה כמות האנרגיה אלא שימור התנע: האלקטרון אחרי התהליך צריך לשאת גם את
          האנרגיה $m_ec^2 + E$ וגם את התנע $E/c$, ואין מהירות שעושה את שניהם.
        misconception: MC-10-energy-only
      - text: כן. האלקטרון מקבל את האנרגיה ואת התנע של הפוטון, ושניהם נשמרים.
        feedback: >-
          נסו: $E_e = m_ec^2 + E$ ו-$p_ec = E$. אז $E_e^2 - (p_ec)^2 = (m_ec^2)^2 + 2m_ec^2E$, גדול מ-$(m_ec^2)^2$. לאלקטרון
          כזה הייתה צריכה להיות מסה גדולה יותר. שימור שני הגדלים בנפרד נראה אפשרי, אבל יחד הם סותרים.
        misconception: MC-10-energy-only
      - text: כן, אבל רק אם אנרגיית הפוטון שווה בדיוק ל-$m_ec^2$.
        feedback: 'שום אנרגיה חיובית לא עובדת: הגודל האינווריאנטי לפני התהליך גדול מ-$(m_ec^2)^2$ בכל $E > 0$.'
    hints:
      - 'חשבו את $s = E_{\text{tot}}^2 - (p_{\text{tot}}c)^2$ לפני התהליך ואחריו.'

  # ---------------------------------------------------------------- OBJ-10.4-2 binding energy from the mass defect
  - id: Q-10.4-bound-lighter
    type: mc
    objectives: [OBJ-10.4-2]
    qualitative: true
    level: basic
    prompt: >-
      דאוטרון, הגרעין של דאוטריום, הוא פרוטון ונייטרון שקשורים זה לזה. כדי להפריד ביניהם צריך להשקיע אנרגיה. מה
      נכון לגבי המסה של הדאוטרון?
    choices:
      - text: היא קטנה מסכום המסות של פרוטון חופשי ונייטרון חופשי.
        correct: true
        feedback: >-
          נכון. פרוטון ונייטרון נפרדים ונחים הם הדאוטרון ועוד האנרגיה $B$ שהשקענו, ולכן $m_p + m_n = m_d + B/c^2$. המסה
          החסרה, $B/c^2$, היא אנרגיית הקשר.
      - text: היא שווה לסכום המסות שלהם.
        feedback: >-
          מסה של מערכת אינה סכום המסות של חלקיה. היא כוללת את כל האנרגיה במערכת המנוחה, גם את אנרגיית הקשר, שהיא
          שלילית.
        misconception: MC-10-mass-additive
      - text: היא גדולה מסכום המסות שלהם, כי אנרגיית הקשר מוסיפה מסה.
        feedback: >-
          אנרגיית הקשר היא האנרגיה ש**חסרה** למערכת הקשורה: צריך להוסיף אותה כדי להפריד את החלקיקים. לכן המערכת הקשורה
          קלה יותר.
        misconception: MC-10-bound-heavier
    hints:
      - 'השוו את האנרגיה של המערכת לפני ההפרדה ואחריה. מה הוספנו?'

  - id: Q-10.4-deuteron
    type: numeric
    objectives: [OBJ-10.4-2]
    level: mid
    prompt: >-
      אנרגיות המנוחה: פרוטון $938.272\,\text{MeV}$, נייטרון $939.565\,\text{MeV}$, דאוטרון $1875.613\,\text{MeV}$.
      מה אנרגיית הקשר של הדאוטרון?
    answer: 2.224
    unit: MeV
    correctFeedback: >-
      נכון. $B = (m_p + m_n - m_d)c^2 = 1877.837 - 1875.613 = 2.22\,\text{MeV}$. זו בערך $0.12\%$ מאנרגיית המנוחה
      של הדאוטרון: מסה חסרה קטנה, אבל גדולה פי מיליון בערך מאנרגיות קשר כימיות.
    wrongFeedback: 'אנרגיית הקשר היא המסה החסרה כפול $c^2$: סכום אנרגיות המנוחה של החלקים פחות זו של הגרעין.'
    commonWrong:
      - value: 2.387
        feedback: >-
          עיגלתם את המסות ל-$938$ ו-$940\,\text{MeV}$. כשמחסירים מספרים כמעט שווים, ההפרש רגיש מאוד לעיגול: כאן העיגול
          הוסיף $7\%$ לתשובה. שמרו את כל הספרות עד ההחסרה.
      - value: -2.224
        feedback: >-
          חישבתם $m_d - m_p - m_n$. המסה של הגרעין קטנה מסכום החלקים, ואנרגיית הקשר מוגדרת כחיובית: האנרגיה שצריך
          להשקיע כדי לפרק אותו.
        misconception: MC-10-bound-heavier
    hints:
      - 'השאירו את כל הספרות: ההפרש קטן בהרבה מהמספרים עצמם.'

  - id: Q-10.4-chemical-defect
    type: twotier
    objectives: [OBJ-10.4-2]
    qualitative: true
    level: mid
    prompt: >-
      כשמימן נשרף עם חמצן ונוצרים מים, משתחררת אנרגיה של כ-$3\,\text{eV}$ לכל מולקולת מים. אנרגיית המנוחה של מולקולת
      מים היא כ-$1.7\cdot10^4\,\text{MeV}$. האם מסת המים שנוצרו קטנה ממסת המימן והחמצן שנשרפו?
    choices:
      - text: כן, אבל בחלק זעיר, כ-$2\cdot10^{-10}$ מהמסה.
        correct: true
        feedback: >-
          נכון. $\dfrac{3\cdot10^{-6}\,\text{MeV}}{1.7\cdot10^4\,\text{MeV}} \approx 2\cdot10^{-10}$. מאזניים לא יכולים
          למדוד הפרש כזה, ולכן בכימיה מסה "נשמרת". בתגובות גרעיניות החלק גדול פי מיליונים.
      - text: לא. מסה חסרה יש רק בתגובות גרעיניות.
        feedback: >-
          הקשר בין אנרגיה למסה לא תלוי בסוג הכוח. כל מערכת שמשחררת אנרגיה $\Delta E$ מאבדת מסה $\Delta E/c^2$, גם בתגובה
          כימית. שם ההפרש פשוט קטן מכדי למדוד.
        misconception: MC-10-mass-defect-nuclear-only
      - text: לא. מסה נשמרת תמיד, ורק האטומים מסתדרים מחדש.
        feedback: >-
          מה שנשמר הוא האנרגיה, כולל אנרגיית המנוחה. המסה של מערכת אינה סכום המסות של חלקיה: היא כוללת גם את אנרגיית
          הקשר ביניהם.
        misconception: MC-10-mass-additive
    reasons:
      - text: 'כל אנרגיה שיוצאת מהמערכת מקטינה את המסה שלה ב-$\Delta E/c^2$, בלי קשר לסוג הכוח.'
        correct: true
        feedback: זה הנימוק. מסה של מערכת היא כל האנרגיה שלה במערכת המנוחה, חלקי $c^2$.
      - text: בתגובה כימית האטומים לא משתנים, ולכן המסה לא משתנה.
        feedback: >-
          האטומים זהים, אבל אנרגיית הקשר בין האטומים השתנתה. אנרגיה זו חלק מהמסה של המולקולה.
        misconception: MC-10-mass-defect-nuclear-only
      - text: המסה החסרה היא המסה של אלקטרונים שעוברים מאטום לאטום.

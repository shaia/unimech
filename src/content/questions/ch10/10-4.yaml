      ההליום היא $28.3\,\text{MeV}$, ושל שני הדאוטרונים יחד $4.45\,\text{MeV}$, וההפרש הוא אותו $23.8\,\text{MeV}$.
      בדיקת סבירות: $Q$ הוא $0.64\%$ מאנרגיית המנוחה של המגיבים, לעומת כ-$10^{-10}$ בבעירה.

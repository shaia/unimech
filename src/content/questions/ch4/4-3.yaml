chapter: 4
questions:
  # ---------------------------------------------------------------- OBJ-4.3-1 momentum components plus one extra fact
  - id: Q-4.3-unknowns
    type: mc
    objectives: [OBJ-4.3-1]
    qualitative: true
    level: basic
    prompt: >-
      דיסקית נעה על שולחן אוויר אופקי ופוגעת, לא במרכז, בדיסקית שעומדת במנוחה. ההתנגשות אלסטית, והמסות והמהירות
      ההתחלתית ידועות. מה צריך כדי לחשב את שתי המהירויות אחרי ההתנגשות, כגודל וככיוון?
    choices:
      - text: נתון נוסף אחד, כמו הזווית שבה אחת הדיסקיות נעה אחרי ההתנגשות.
        correct: true
        feedback: >-
          נכון. יש ארבעה נעלמים, שני רכיבים לכל מהירות, ושלוש משוואות: שני רכיבים של שימור התנע ושימור האנרגיה. את
          הנתון הרביעי קובע איפה בדיוק הדיסקיות נגעו זו בזו, ולכן הוא חייב לבוא מבחוץ, למשל ממדידה של זווית.
      - text: שום דבר נוסף. שימור התנע ושימור האנרגיה מספיקים, כמו בממד אחד.
        feedback: >-
          בממד אחד יש שני נעלמים ושתי משוואות. בשני ממדים יש ארבעה נעלמים ורק שלוש משוואות, ולכן אותה דיסקית, באותה
          מהירות, יכולה לצאת בזוויות שונות, לפי המקום שבו פגעה.
        misconception: MC-4-momentum-enough-2d
      - text: שום דבר נוסף. שימור התנע בשני הצירים לבדו קובע את התוצאה.
        feedback: >-
          שימור התנע בשני צירים נותן שתי משוואות בלבד, לארבעה נעלמים. אפילו עם שימור האנרגיה חסר עוד נתון אחד.
        misconception: MC-4-momentum-enough-2d
      - text: שני נתונים נוספים, כי לכל דיסקית יש כיוון אחר.
        feedback: >-
          כך היה בהתנגשות לא אלסטית שבה לא ידוע כמה אנרגיה אבדה. כאן ההתנגשות אלסטית, ושימור האנרגיה הוא משוואה
          שלישית, ולכן חסר נתון אחד בלבד.
    hints:
      - 'ספרו את הנעלמים: כמה מספרים מתארים שתי מהירויות במישור? וכמה משוואות שימור יש?'

  - id: Q-4.3-wreck-direction
    type: vector
    objectives: [OBJ-4.3-1]
    qualitative: true
    level: basic
    prompt: >-
      על שולחן אוויר, דיסקית A בעלת מסה $2m$ נעה מזרחה, כלומר ימינה בדף, במהירות $v$. דיסקית B בעלת מסה $m$ נעה
      צפונה, כלומר למעלה בדף, במהירות $2v$. הדיסקיות מתנגשות ונצמדות זו לזו. לאיזה כיוון נעות הדיסקיות הצמודות?
    answer: ne
    correctFeedback: >-
      נכון. התנע של A הוא $2mv$ מזרחה והתנע של B הוא $2mv$ צפונה. שני רכיבי התנע נשמרים בנפרד, ולכן התנע של הזוג
      שווה ברכיביו, והזוג נע בדיוק צפונה-מזרחה, ב-$45^\circ$.
    wrong:
      - dir: n
        feedback: >-
          B אכן מהירה יותר, אבל הכיוון נקבע על ידי **התנעים**, לא על ידי המהירויות. התנע של B, $m\cdot2v$, שווה לתנע
          של A, $2m\cdot v$.
        misconception: MC-4-direction-from-velocities
      - dir: e
        feedback: >-
          A אכן כבדה יותר, אבל B מהירה יותר. הכיוון נקבע על ידי התנע, מסה כפול מהירות, ושני התנעים שווים.
      - dir: zero
        feedback: >-
          הזוג נעצר רק אם התנע הכולל אפס. כאן שני התנעים ניצבים זה לזה, ולא יכולים לבטל זה את זה.
    wrongFeedback: 'חשבו את רכיבי התנע הכולל, מזרחה וצפונה. הם נשמרים בנפרד.'
    hints:
      - 'כתבו את התנע של כל דיסקית כמכפלת המסה במהירות. השוו את שני הרכיבים.'

  - id: Q-4.3-puck-speed
    type: numeric
    objectives: [OBJ-4.3-1]
    level: mid
    prompt: >-
      על שולחן אוויר, דיסקית A בעלת מסה $0.20\,\text{kg}$ נעה לאורך ציר $x$ במהירות $3.0\,\text{m/s}$, ופוגעת בדיסקית B
      בעלת מסה $0.30\,\text{kg}$ שעומדת במנוחה. אחרי ההתנגשות A נעה לאורך ציר $y$ החיובי במהירות $1.0\,\text{m/s}$. מה
      גודל המהירות של B אחרי ההתנגשות?
    answer: 2.11
    unit: m/s
    correctFeedback: >-
      נכון. ברכיב $x$: $0.20\cdot3.0 = 0.30\,v_{Bx}$, ולכן $v_{Bx} = 2.0\,\text{m/s}$. ברכיב $y$: $0 = 0.20\cdot1.0 + 0.30\,v_{By}$,
      ולכן $v_{By} = -0.667\,\text{m/s}$. הגודל $\sqrt{2.0^2 + 0.667^2} = 2.11\,\text{m/s}$, בזווית $18^\circ$ מתחת לציר $x$.
      בדיקה: האנרגיה הקינטית ירדה מ-$0.900$ ל-$0.767\,\text{J}$, ולכן ההתנגשות אפשרית, אבל לא אלסטית.
    wrongFeedback: >-
      כתבו שימור תנע בכל ציר בנפרד, ומצאו את שני הרכיבים של המהירות של B. הגודל הוא שורש סכום הריבועים.
    commonWrong:
      - value: 2.0
        feedback: 'זה רק הרכיב $x$ של המהירות. ברכיב $y$ גם B חייבת לנוע, כדי לבטל את התנע של A לאורך $y$.'
      - value: 2.67
        feedback: 'חיברתם את גודלי הרכיבים, $2.0 + 0.667$. רכיבים ניצבים מתחברים בפיתגורס.'
      - value: 1.33
        feedback: >-
          השוויתם את **גודל** התנע הכולל לפני ואחרי, $0.60 = 0.20\cdot1.0 + 0.30\,v_B$. התנע הוא וקטור: כל רכיב נשמר
          בנפרד, והגדלים לא מתחברים כמספרים.
        misconception: MC-4-speeds-add-like-scalars
    hints:
      - 'לפני ההתנגשות התנע בציר $y$ אפס. מה זה אומר על הרכיב $y$ של B אחרי ההתנגשות?'

  - id: Q-4.3-intersection
    type: numeric
    objectives: [OBJ-4.3-1]
    level: mid
    prompt: >-
      בצומת, מכונית בעלת מסה $1200\,\text{kg}$ שנוסעת מזרחה במהירות $15\,\text{m/s}$ מתנגשת במכונית בעלת מסה
      $1600\,\text{kg}$ שנוסעת צפונה במהירות $10\,\text{m/s}$. המכוניות נצמדות. בזמן ההתנגשות החיכוך עם הכביש זניח.
      בכמה מעלות מצפון לכיוון מזרח נע הזוג מיד אחרי ההתנגשות?
    answer: 41.6
    unit: '°'
    correctFeedback: >-
      נכון. $p_x = 1200\cdot15 = 1.80\cdot10^4$ ו-$p_y = 1600\cdot10 = 1.60\cdot10^4\,\text{kg}\cdot\text{m/s}$. הכיוון
      $\theta = \arctan\dfrac{p_y}{p_x} = \arctan\dfrac{1.60}{1.80} = 41.6^\circ$ מעל כיוון מזרח, והמהירות
      $\dfrac{\sqrt{p_x^2 + p_y^2}}{2800} = 8.60\,\text{m/s}$.
    wrongFeedback: 'מצאו את שני הרכיבים של התנע הכולל. הזוג נע בכיוון של וקטור התנע הזה.'
    commonWrong:
      - value: 33.7
        feedback: >-
          חישבתם $\arctan(10/15)$, מהמהירויות. הכיוון נקבע על ידי התנעים: המכונית שנוסעת צפונה איטית יותר, אבל כבדה
          יותר.
        misconception: MC-4-direction-from-velocities
      - value: 48.4
        feedback: 'זו הזווית מכיוון צפון. השאלה מבקשת את הזווית מעל כיוון מזרח: $\arctan(p_y/p_x)$.'
    hints:
      - '$\tan\theta = p_y/p_x$.'

  - id: Q-4.3-neutron-90
    type: numeric
    objectives: [OBJ-4.3-1]
    level: bagrut
    prompt: >-
      נייטרון בעל מסה $m$ פוגע בגרעין פחמן בעל מסה $M = 12m$ שעומד במנוחה, וההתנגשות אלסטית. אחרי ההתנגשות
      הנייטרון נע בניצב לכיוון התנועה ההתחלתי שלו. איזה חלק מהאנרגיה הקינטית ההתחלתית שלו נשאר לנייטרון?
    answer: 0.846
    unit: ''
    correctFeedback: >-
      נכון. עם $x$ בכיוון ההתחלתי ו-$y$ בכיוון היציאה של הנייטרון, התנע נותן לגרעין $MV_x = mv$ ו-$MV_y = -mv_1$.
      הצבה באנרגיה, $mv^2 = mv_1^2 + M\left(V_x^2 + V_y^2\right)$:
      $$mv^2 = mv_1^2 + \frac{m^2\left(v^2 + v_1^2\right)}{M}\quad\Rightarrow\quad\frac{v_1^2}{v^2} = \frac{M - m}{M + m} = \frac{11}{13} = 0.846$$
      **בדיקת גבולות:** כש-$M \to \infty$ החלק שואף ל-1, נייטרון שנרתע מקיר בלי לאבד אנרגיה. כש-$M = m$ החלק אפס:
      במסות שוות הגופים נפרדים בזווית ישרה, ולכן אם הפוגע יוצא בניצב לכיוונו, המטרה יוצאת בכיוון ההתחלתי. זו הפגיעה
      החזיתית, שבה הפוגע נעצר.
    wrongFeedback: >-
      כתבו שימור תנע בשני הרכיבים ושימור אנרגיה. בטאו את רכיבי המהירות של הגרעין במהירויות של הנייטרון, והציבו
      במשוואת האנרגיה.
    commonWrong:
      - value: 0.716
        feedback: >-
          זו התוצאה של התנגשות **חזיתית**, $\left(\dfrac{M - m}{M + m}\right)^2$, שבה הנייטרון חוזר לאחור. כאן הוא יוצא
          בניצב, ומאבד פחות.
      - value: 0.92
        feedback: 'זה היחס בין המהירויות, $v_1/v$. היחס בין האנרגיות הוא הריבוע שלו.'
    hints:
      - 'כשהנייטרון יוצא לאורך $y$, כל התנע ההתחלתי לאורך $x$ עובר לגרעין.'
      - 'הציבו $V_x = mv/M$ ו-$V_y = -mv_1/M$ במשוואת האנרגיה.'

  # ---------------------------------------------------------------- OBJ-4.3-2 equal masses at 90°, maximum scattering angle
  - id: Q-4.3-heavy-on-light
    type: mc
    objectives: [OBJ-4.3-2]
    qualitative: true
    level: basic
    prompt: >-
      כדור פלדה פוגע התנגשות אלסטית בכדור זכוכית שעומד במנוחה, ומסתו כפולה ממסת כדור הזכוכית. מכוונים את הפגיעה
      למקומות שונים על כדור הזכוכית, ממרכזו ועד שוליו. האם יש פגיעה שבה כדור הפלדה נרתע לאחור?
    choices:
      - text: לא. כדור הפלדה תמיד ממשיך קדימה, וזווית הפיזור שלו קטנה מ-$90^\circ$, ואף מוגבלת לזווית מרבית.
        correct: true
        feedback: >-
          נכון. בפגיעה חזיתית הוא ממשיך קדימה ב-$\dfrac{m_1 - m_2}{m_1 + m_2}\,v = \dfrac{v}{3}$. בפגיעה לא במרכז הוא
          מוסט, אבל לכל היותר בזווית $\theta_{\max}$ שבה $\sin\theta_{\max} = \dfrac{m_2}{m_1} = \dfrac12$, כלומר $30^\circ$.
      - text: כן, אם מכוונים נכון אפשר לקבל כל זווית פיזור, גם אחורה.
        feedback: >-
          כך זה כשהפוגע **קל** מהמטרה: כדור קל נרתע מכדור כבד לכל כיוון. כשהפוגע כבד מהמטרה, מרכז המסה נע קדימה מהר
          יותר ממה שהפוגע נע ביחס אליו, ולכן הפוגע לא יכול לחזור.
        misconception: MC-4-any-scattering-angle
      - text: כן, בפגיעה חזיתית בדיוק, כמו כדור שפוגע בקיר.
        feedback: >-
          קיר כבד מאוד מהכדור. כאן הפוגע הוא הכבד, ובפגיעה חזיתית הוא ממשיך קדימה ב-$v/3$, כפי שנותנת הנוסחה של
          התנגשות אלסטית בממד אחד.
        misconception: MC-4-any-scattering-angle
      - text: לא, כי כדור הפלדה לא מוסט כלל. הוא תמיד ממשיך ישר.
        feedback: >-
          בפגיעה שאינה חזיתית הכוח בין הכדורים פועל לאורך הקו שבין המרכזים, ויש לו רכיב ניצב לתנועה. לכן כדור הפלדה
          כן מוסט, אבל רק עד זווית מרבית.
    hints:
      - 'התחילו מפגיעה חזיתית: מה סימן המהירות של הפוגע אחריה, כש-$m_1 > m_2$?'

  - id: Q-4.3-billiard
    type: numeric
    objectives: [OBJ-4.3-2]
    level: basic
    prompt: >-
      כדור ביליארד לבן נע במהירות $2.0\,\text{m/s}$ ופוגע, לא במרכז, בכדור שעומד ושמסתו שווה לשלו. ההתנגשות אלסטית,
      והסיבוב של הכדורים זניח. אחרי ההתנגשות הכדור הלבן נע בזווית $30^\circ$ לכיוון התנועה ההתחלתי שלו. מה גודל
      המהירות של הכדור השני?
    answer: 1.73
    unit: m/s
    correctFeedback: >-
      נכון. במסות שוות, כשאחת עומדת, הכדורים נפרדים בזווית ישרה, ולכן הכדור השני נע ב-$60^\circ$ לצד השני. משולש
      התנע ישר זווית, $\vec v = \vec v_1' + \vec v_2'$, ולכן $v_2' = v\cos30^\circ = 1.73\,\text{m/s}$ ו-$v_1' = v\sin30^\circ = 1.0\,\text{m/s}$.
      בדיקה: $1.73^2 + 1.0^2 = 4.0 = v^2$, האנרגיה נשמרת.
    wrongFeedback: >-
      שני הכדורים נפרדים בזווית ישרה. שרטטו את משולש המהירויות: $\vec v$ הוא היתר, ו-$\vec v_1'$ ו-$\vec v_2'$ הם
      הניצבים.
    commonWrong:
      - value: 1.0
        feedback: >-
          זו המהירות של הכדור הלבן, $v\sin30^\circ$. הכדור השני נע בזווית $60^\circ$ מהכיוון ההתחלתי, ולכן הרכיב
          שלו הוא $v\cos30^\circ$.
      - value: 2.0
        feedback: >-
          כל המהירות עוברת לכדור השני רק בפגיעה חזיתית, שבה הלבן נעצר. כאן הלבן ממשיך ב-$30^\circ$ ושומר חלק מהמהירות.
      - value: 1.41
        feedback: >-
          חילקתם את המהירות שווה בשווה, $v/\sqrt2$. זה קורה רק כששני הכדורים יוצאים ב-$45^\circ$. כאן הזוויות
          $30^\circ$ ו-$60^\circ$.
    hints:
      - 'מה הזווית בין שני הכדורים אחרי ההתנגשות?'

  - id: Q-4.3-right-angle
    type: twotier
    objectives: [OBJ-4.3-2]
    qualitative: true
    level: mid
    prompt: >-
      בתא בועות, פרוטון מהיר פוגע בפרוטון שעומד במנוחה, וההתנגשות אלסטית ולא חזיתית. מה הזווית בין המסלולים של
      שני הפרוטונים מיד אחרי ההתנגשות?
    choices:
      - text: $90^\circ$, בכל פגיעה שאינה חזיתית.
        correct: true
        feedback: >-
          נכון. המקום שבו הפרוטונים נגעו קובע איך מתחלקת הזווית בין שניהם, אבל הסכום תמיד $90^\circ$. כך מזהים
          בתמונות של תא בועות התנגשות אלסטית של חלקיקים בעלי מסה שווה.
      - text: היא תלויה במקום הפגיעה, ויכולה להיות כל זווית.
        feedback: >-
          המקום שבו נגעו קובע את הזווית של **כל אחד** מהפרוטונים לכיוון ההתחלתי, אבל לא את הזווית ביניהם, שהיא תמיד
          $90^\circ$.
      - text: $180^\circ$, כי הם נדחים זה מזה.
        feedback: >-
          אילו הפרוטונים נעו בכיוונים הפוכים על קו אחד, שימור התנע היה נותן $p_1' - p_2' = p$, ושימור האנרגיה
          $p_1'^2 + p_2'^2 = p^2$. משתי המשוואות יוצא $p_1'p_2' = 0$: אחד מהם לא נע כלל. פרוטונים לא נדחים לכיוונים
          הפוכים; שניהם ממשיכים קדימה, בזווית ישרה זה לזה.
    reasons:
      - text: >-
          מהתנע, $\vec p = \vec p_1' + \vec p_2'$; מהאנרגיה, במסות שוות, $p^2 = p_1'^2 + p_2'^2$. יחד הם נותנים
          $\vec p_1'\cdot\vec p_2' = 0$.
        correct: true
        feedback: >-
          זה הנימוק. מעלים בריבוע את משוואת התנע: $p^2 = p_1'^2 + p_2'^2 + 2\vec p_1'\cdot\vec p_2'$. האנרגיה, כפול
          $2m$, נותנת את אותו ביטוי בלי המכפלה הסקלרית, ולכן היא אפס. זה משפט פיתגורס במשולש התנע.
      - text: כל שני גופים בעלי מסה שווה נפרדים בזווית ישרה אחרי התנגשות.
        feedback: >-
          רק בהתנגשות אלסטית, וכשאחד מהם עומד. בהתנגשות לא אלסטית הזווית קטנה מ-$90^\circ$, ובהתנגשות פלסטית הגופים
          נעים יחד, בזווית אפס.
        misconception: MC-4-equal-masses-always-90
      - text: הכוח בין הפרוטונים ניצב למסלול של הפרוטון המהיר.
        feedback: >-
          הכוח פועל לאורך הקו שבין שני הפרוטונים ברגע הפגיעה, והוא לא ניצב למסלול. הזווית הישרה באה מחוקי השימור,
          לא מכיוון הכוח.
    hints:
      - 'העלו בריבוע את משוואת התנע הווקטורית, והשוו למשוואת האנרגיה כפול $2m$.'

  - id: Q-4.3-max-angle
    type: numeric
    objectives: [OBJ-4.3-2]
    level: mid
    prompt: >-
      חלקיק אלפא, בעל מסה $4\,\text{u}$, פוגע התנגשות אלסטית בפרוטון בעל מסה $1\,\text{u}$ שעומד במנוחה. בזוויות שונות
      של פגיעה, חלקיק האלפא מוסט בזוויות שונות. מה זווית הפיזור הגדולה ביותר שאפשר לקבל לחלקיק האלפא?
    answer: 14.5
    unit: '°'
    correctFeedback: >-
      נכון. כשהפוגע כבד מהמטרה, $\sin\theta_{\max} = \dfrac{m_2}{m_1} = \dfrac14$, ולכן $\theta_{\max} = 14.5^\circ$.
      חלקיק אלפא כמעט לא מוסט מחלקיקים קלים ממנו, ולא יכול להירתע מהם לאחור. לכן הפיזור לאחור שנמדד בניסוי של
      רתרפורד העיד על מטרה כבדה מחלקיק האלפא: הגרעין.
    wrongFeedback: >-
      במערכת מרכז המסה הפוגע יכול לצאת לכל כיוון, במהירות $u_1 = \dfrac{m_2}{m_1 + m_2}\,v$. במערכת המעבדה מוסיפים לה
      את $V = \dfrac{m_1}{m_1 + m_2}\,v$. מתי הזווית בין הסכום ל-$\vec V$ הכי גדולה?
    commonWrong:
      - value: 90
        feedback: >-
          זה כלל המסות השוות: הזווית **בין** שני הגופים. כאן המסות לא שוות, ולפוגע הכבד יש זווית פיזור מרבית קטנה בהרבה.
        misconception: MC-4-equal-masses-always-90
      - value: 75.5
        feedback: 'זה $\arccos(1/4)$. את הזווית המרבית נותן הסינוס: $\sin\theta_{\max} = m_2/m_1$.'
      - value: 11.5
        feedback: >-
          זה $\arcsin\dfrac{m_2}{m_1 + m_2}$. היחס הנכון הוא בין מהירות הפוגע במערכת מרכז המסה, $u_1$, למהירות מרכז המסה,
          $V$, וזה $m_2/m_1$.
    hints:
      - 'שרטטו את $\vec V$, ובקצה שלו מעגל ברדיוס $u_1$. כל וקטור מהראשית לנקודה על המעגל הוא מהירות אפשרית במעבדה.'

  - id: Q-4.3-speed-at-max
    type: numeric
    objectives: [OBJ-4.3-2]
    level: bagrut
    prompt: >-
      חלקיק האלפא מהשאלה הקודמת ($4\,\text{u}$, אל פרוטון של $1\,\text{u}$ במנוחה, התנגשות אלסטית) מוסט בדיוק
      בזווית הפיזור המרבית. איזה חלק מהמהירות ההתחלתית שלו נשאר לו?
    answer: 0.775
    unit: ''
    correctFeedback: >-
      נכון. בזווית המרבית מהירות המעבדה $\vec v_1'$ משיקה למעגל שרדיוסו $u_1$ ומרכזו בקצה של $\vec V$, ולכן היא ניצבת
      לרדיוס, ונוצר משולש ישר זווית:
      $$v_1' = \sqrt{V^2 - u_1^2} = v\,\frac{\sqrt{m_1^2 - m_2^2}}{m_1 + m_2} = v\,\frac{\sqrt{15}}{5} = 0.775\,v$$
      **בדיקת גבולות:** כש-$m_2 \to 0$ היחס שואף ל-1: מטרה זעירה לא מאטה את הפוגע. כש-$m_2 \to m_1$ הוא שואף לאפס,
      ואיתו $\theta_{\max} \to 90^\circ$: במסות שוות הפוגע יוצא בזווית קרובה ל-$90^\circ$ רק כשהפגיעה כמעט חזיתית,
      ואז הוא כמעט נעצר.
    wrongFeedback: >-
      בזווית המרבית הקו מהראשית משיק למעגל של המהירויות האפשריות. המשיק ניצב לרדיוס: השתמשו בפיתגורס במשולש שצלעותיו
      $V$, $u_1$ ו-$v_1'$.
    commonWrong:
      - value: 0.6
        feedback: >-
          זה $\dfrac{m_1 - m_2}{m_1 + m_2}$, היחס בפגיעה **חזיתית**, שבה החלקיק לא מוסט כלל. (במקרה, 0.6 הוא גם
          החלק מהאנרגיה שנשאר לו בזווית המרבית: הריבוע של התשובה.)
      - value: 0.968
        feedback: >-
          זה $\cos\theta_{\max}$. היחס $v_1'/V$ אכן שווה ל-$\cos\theta_{\max}$, אבל השאלה שואלת על החלק מהמהירות
          ההתחלתית $v$, ו-$V = 0.8\,v$.
      - value: 1.0
        feedback: >-
          בהתנגשות אלסטית האנרגיה הכוללת נשמרת, אבל חלק ממנה עובר לפרוטון. חלקיק האלפא שומר את כל המהירות רק אם לא
          פגע בכלום.
    hints:
      - 'כמה הם $V$ ו-$u_1$, כשבר מ-$v$?'
      - 'במשולש ישר זווית שבו $V$ הוא היתר, $v_1'' = \sqrt{V^2 - u_1^2}$.'

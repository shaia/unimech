chapter: 4
questions:
  # ---------------------------------------------------------------- OBJ-4.4-1 neglecting external forces; ballistic pendulum
  - id: Q-4.4-why-neglect
    type: mc
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: basic
    prompt: >-
      קליע נתקע בגוש עץ שתלוי על חוטים. ההתנגשות נמשכת אלפית שנייה בערך, ובזמן הזה פועל על הקליע ועל הגוש גם כוח
      הכובד. מדוע מותר לכתוב שימור תנע לקליע ולגוש בין הרגע שלפני ההתנגשות לרגע שאחריה?
    choices:
      - text: >-
          כוח הכובד סופי, והמתקף שלו בזמן הקצר הזה, $F\,\Delta t$, זניח לעומת התנע של הקליע. הכוח בין הקליע לגוש
          עצום, אבל הוא פנימי.
        correct: true
        feedback: >-
          נכון. התנע הכולל משתנה רק במתקף של הכוחות החיצוניים, $\Delta\vec P = \int\vec F_{\text{ext}}\,dt$. כוח חיצוני
          סופי בזמן שואף לאפס נותן מתקף שואף לאפס. הכוח הפנימי עצום, אבל הוא מבטל את עצמו בסכום, זוג של פעולה ותגובה.
      - text: מפני שכוח הכובד אנכי, והקליע נע אופקית, ולכן הכובד לא משפיע על ההתנגשות.
        feedback: >-
          זה מסביר למה התנע **האופקי** נשמר תמיד, גם בזמן ארוך. אבל המשפט צריך גם את התנע האנכי: הכובד כן משנה אותו,
          ורק משך ההתנגשות הקצר הופך את השינוי לזניח.
      - text: מפני שבזמן התנגשות תמיד מותר להזניח את כל הכוחות החיצוניים.
        feedback: >-
          לא תמיד. כוח של קיר, של רצפה או של ציר יכול להיות עצום בדיוק כמו הכוח בהתנגשות, ואז המתקף שלו לא זניח. מזניחים
          רק כוחות חיצוניים **סופיים**.
        misconception: MC-4-external-always-negligible
      - text: אסור. כוח הכובד פועל על הגוף, ולכן התנע לא נשמר בהתנגשות.
        feedback: >-
          הכובד משנה את התנע ב-$(m + M)g\,\Delta t$, ובאלפית שנייה זה שינוי זעיר לעומת התנע של הקליע. לכן התנע נשמר
          בקירוב מצוין בין הרגע שלפני ההתנגשות לרגע שאחריה.
        misconception: MC-4-finite-force-spoils-momentum
    hints:
      - 'כמה משנה כוח הכובד את התנע של המערכת באלפית שנייה? השוו לתנע של הקליע.'

  - id: Q-4.4-impact-force
    type: numeric
    objectives: [OBJ-4.4-1]
    level: basic
    prompt: >-
      קליע נתקע בגוש בעל מסה $2.0\,\text{kg}$ שתלוי על חוטים. ההתנגשות נמשכת $0.50\,\text{ms}$, ובסופה הגוש נע במהירות
      $0.990\,\text{m/s}$. מה גודל הכוח האופקי הממוצע שהקליע מפעיל על הגוש בזמן ההתנגשות?
    answer: 3960
    unit: N
    correctFeedback: >-
      נכון. $\bar F = \dfrac{\Delta p}{\Delta t} = \dfrac{2.0\cdot0.990}{0.50\cdot10^{-3}} = 3.96\cdot10^3\,\text{N}$, פי 200 בערך
      מהמשקל של הגוש עם הקליע, $19.7\,\text{N}$. לכן בזמן ההתנגשות הכובד והמתיחות בחוטים, שהם בסדר גודל של המשקל,
      זניחים לעומתו.
    wrongFeedback: 'השתמשו במשפט המתקף-תנע לגוש: $\bar F\,\Delta t = \Delta p$. המירו מילישניות לשניות.'
    commonWrong:
      - value: 1.98
        feedback: 'זה המתקף, $\Delta p$, ביחידות $\text{N}\cdot\text{s}$. כדי לקבל כוח ממוצע, חלקו במשך ההתנגשות.'
      - value: 19.6
        feedback: 'זה משקל הגוש. הכוח בהתנגשות גדול ממנו פי מאתיים בערך, ולכן מותר להזניח את המשקל בזמן הזה.'
      - value: 3.96
        feedback: 'חילקתם ב-$0.50$ במקום ב-$0.50\cdot10^{-3}\,\text{s}$. המירו את משך ההתנגשות לשניות.'
    hints:
      - '$0.50\,\text{ms} = 5.0\cdot10^{-4}\,\text{s}$.'

  - id: Q-4.4-ballistic-speed
    type: numeric
    objectives: [OBJ-4.4-1]
    level: mid
    prompt: >-
      במטוטלת בליסטית, קליע בעל מסה $10\,\text{g}$ נתקע בגוש בעל מסה $2.0\,\text{kg}$ שתלוי על חוטים ארוכים וקלים.
      אחרי ההתנגשות הגוש עם הקליע עולה לגובה $5.0\,\text{cm}$ מעל נקודת ההתחלה שלו. מה הייתה מהירות הקליע?
    answer: 199
    unit: m/s
    correctFeedback: >-
      נכון. בשלב השני, העלייה, האנרגיה נשמרת: $V = \sqrt{2gh} = \sqrt{2\cdot9.8\cdot0.050} = 0.990\,\text{m/s}$. בשלב הראשון,
      ההתנגשות, נשמר רק התנע: $mv = (m + M)V$, ולכן $v = \dfrac{2.01}{0.010}\cdot0.990 = 199\,\text{m/s}$.
    wrongFeedback: >-
      הפרידו לשני שלבים. בהתנגשות הפלסטית נשמר התנע, ובעלייה שאחריה נשמרת האנרגיה. התחילו מהסוף: מה מהירות הגוש
      מיד אחרי ההתנגשות?
    commonWrong:
      - value: 14.0
        feedback: >-
          השוויתם את האנרגיה הקינטית של הקליע ל-$(m + M)gh$. אבל בהתנגשות הפלסטית אובדת כמעט כל האנרגיה של הקליע:
          חוק שימור האנרגיה תקף רק בעלייה, אחרי ההתנגשות.
        misconception: MC-4-energy-through-collision
      - value: 0.99
        feedback: 'זו מהירות הגוש מיד אחרי ההתנגשות. מהירות הקליע גדולה ממנה פי $(m + M)/m = 201$.'
    hints:
      - 'גובה העלייה נותן את המהירות מיד אחרי ההתנגשות: $V = \sqrt{2gh}$.'

  - id: Q-4.4-energy-shortcut
    type: twotier
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: mid
    prompt: >-
      סטודנטית פותרת מטוטלת בליסטית (קליע $m$ נתקע בגוש $M$ שעולה לגובה $h$) במשוואה אחת:
      $\tfrac12mv^2 = (m + M)gh$. מה נכון לגבי הפתרון שלה?
    choices:
      - text: הוא שגוי, ונותן מהירות קטנה בהרבה מהאמיתית.
        correct: true
        feedback: >-
          נכון. רק חלק זעיר מהאנרגיה של הקליע, $\dfrac{m}{m + M}$, מגיע לתנועה של הגוש, ולכן הקליע צריך מהירות גדולה בהרבה
          ממה שהמשוואה שלה נותנת. עם $10\,\text{g}$ ו-$2.0\,\text{kg}$ היא תקבל $14\,\text{m/s}$ במקום $199\,\text{m/s}$.
      - text: הוא נכון, כי אין חיכוך ואין התנגדות אוויר.
        feedback: >-
          אין חיכוך בין הגוש לאוויר, אבל יש "חיכוך" בין הקליע לעץ: הקליע נעצר בתוך הגוש, מעוות אותו ומחמם אותו. זו
          התנגשות פלסטית, ובה אנרגיה קינטית אובדת.
        misconception: MC-4-energy-through-collision
      - text: הוא שגוי, כי צריך לכתוב שימור תנע לכל התהליך, גם לעלייה.
        feedback: >-
          בעלייה פועלים על הגוש הכובד והמתיחות בזמן ארוך, והם משנים את התנע שלו: בנקודה הגבוהה הגוש עומד. שימור תנע
          מתאים רק לשלב ההתנגשות הקצר.
        misconception: MC-4-momentum-through-all-stages
    reasons:
      - text: >-
          בשלב ההתנגשות נשמר רק התנע, והאנרגיה הקינטית יורדת פי $\dfrac{m + M}{m}$; האנרגיה נשמרת רק בשלב העלייה.
        correct: true
        feedback: >-
          זה הנימוק. אחרי ההתנגשות $K' = \dfrac{(mv)^2}{2(m + M)} = \dfrac{m}{m + M}\cdot\tfrac12mv^2$. כל מה שחסר הפך
          לחום ולעיוות בגוש.
      - text: התנע והאנרגיה נשמרים שניהם בכל שלב, ולכן מותר לבחור באחד מהם.
        feedback: >-
          אילו שניהם היו נשמרים בהתנגשות, היא הייתה אלסטית, והקליע לא היה נתקע. בהתנגשות פלסטית רק התנע נשמר.
        misconception: MC-4-energy-through-collision
      - text: חלק מהאנרגיה של הקליע הולך לסיבוב הגוש, ולכן צריך להוסיף אנרגיה סיבובית.
        feedback: >-
          כשהגוש תלוי על שני חוטים מקבילים הוא לא מסתובב, אלא נע במקביל לעצמו. האנרגיה החסרה הלכה לעיוות ולחום.
    hints:
      - 'כמה אנרגיה קינטית יש לגוש עם הקליע מיד אחרי ההתנגשות, בהשוואה לקליע לפניה?'

  - id: Q-4.4-which-conserved
    type: multi
    objectives: [OBJ-4.4-1]
    qualitative: true
    level: bagrut
    prompt: >-
      בכל אחד מהמצבים, האם התנע הכולל (או הרכיב שלו שמצוין) של שני הגופים המתנגשים נשמר בין הרגע שלפני ההתנגשות
      לרגע שאחריה? סמנו את כל המצבים שבהם הוא נשמר.
    choices:
      - text: קליע אופקי נתקע בגוש שתלוי על חוט אנכי. התנע האופקי של הקליע והגוש.
        correct: true
        feedback: >-
          נכון. המתיחות בחוט אנכית בזמן ההתנגשות, והכובד אנכי, ולכן אף כוח חיצוני לא פועל אופקית.
      - text: קליע אופקי נתקע בגוש שמונח על רצפה מחוספסת, עם מקדם חיכוך $0.40$. התנע האופקי של הקליע והגוש.
        correct: true
        feedback: >-
          נכון. החיכוך הוא לכל היותר $0.40(m + M)g$, כוח סופי, והמתקף שלו בזמן ההתנגשות הקצר זניח. הוא יעצור את
          הגוש אחר כך, בזמן ארוך.
      - text: כדור נזרק אופקית אל גוש שצמוד לקיר, ודוחף אותו אל הקיר. התנע האופקי של הכדור והגוש.
        feedback: >-
          לא נשמר. הקיר מונע מהגוש לזוז, ולכן הוא מפעיל עליו כוח שגדול כמו הכוח בהתנגשות עצמה. זה כוח חיצוני מתקפי,
          והמתקף שלו לא זניח.
        misconception: MC-4-external-always-negligible
      - text: גוש פלסטלינה נופל אנכית על עגלה שנוסעת על רצפה ונדבק אליה. התנע האופקי של הפלסטלינה והעגלה.
        correct: true
        feedback: >-
          נכון. הרצפה דוחפת אנכית בלבד, והחיכוך בגלגלים זניח, ולכן אין מתקף חיצוני אופקי. העגלה מאטה כי מסתה גדלה.
      - text: אותה פלסטלינה ואותה עגלה. התנע האנכי של הפלסטלינה והעגלה.
        feedback: >-
          לא נשמר. הרצפה עוצרת את התנועה האנכית של הפלסטלינה דרך העגלה: הכוח הנורמלי גדל לרגע בהרבה מעבר למשקל, והמתקף
          שלו מאפס את התנע האנכי.
        misconception: MC-4-external-always-negligible
    hints:
      - 'בכל מצב, חפשו כוח חיצוני שגדל לרגע כמו הכוח בהתנגשות: קיר, רצפה או ציר שמונעים תנועה.'

  # ---------------------------------------------------------------- OBJ-4.4-2 multi-stage processes
  - id: Q-4.4-stages
    type: mc
    objectives: [OBJ-4.4-2]
    qualitative: true
    level: basic
    prompt: >-
      גוש מחליק על שולחן בלי חיכוך, מתנגש בגוש שני שעומד ונדבק אליו. הזוג ממשיך ומכווץ קפיץ קל שמחובר לקיר, עד
      שהוא נעצר לרגע. אילו חוקי שימור מתאימים לכל שלב?
    choices:
      - text: בהתנגשות שימור תנע בלבד; בכיווץ הקפיץ שימור אנרגיה בלבד.
        correct: true
        feedback: >-
          נכון. ההתנגשות פלסטית, ולכן האנרגיה הקינטית לא נשמרת בה, אבל המתקף החיצוני זניח והתנע נשמר. בכיווץ הקפיץ
          פועל כוח הקפיץ, שהקיר מחזיק, בזמן ארוך: התנע של הזוג יורד לאפס, אבל הכוח משמר, והאנרגיה המכנית נשמרת.
      - text: שימור אנרגיה בשני השלבים, כי אין חיכוך.
        feedback: >-
          אין חיכוך עם השולחן, אבל ההתנגשות פלסטית: הגושים נצמדים, ואנרגיה קינטית הופכת לחום ולעיוות. אחרי ההתנגשות
          אנרגיה נשמרת, ולכן צריך להתחיל את שלב הקפיץ מהמהירות המשותפת.
        misconception: MC-4-energy-through-collision
      - text: שימור תנע בשני השלבים, כי אין חיכוך.
        feedback: >-
          בשלב הקפיץ הזוג נעצר, ולכן התנע שלו משתנה. הקפיץ מחובר לקיר, ודרכו הקיר מפעיל על הזוג כוח חיצוני בזמן ארוך.
        misconception: MC-4-momentum-through-all-stages
      - text: שימור תנע ושימור אנרגיה בשני השלבים.
        feedback: >-
          בהתנגשות פלסטית האנרגיה הקינטית לא נשמרת, ובשלב הקפיץ התנע לא נשמר. כל חוק שימור תקף רק בשלב שבו תנאיו מתקיימים.
        misconception: MC-4-energy-through-collision
    hints:
      - 'לכל שלב שאלו שתי שאלות: האם פועל כוח חיצוני לאורך זמן? והאם יש הפיכה של אנרגיה לחום?'

  - id: Q-4.4-stick-then-slide
    type: numeric
    objectives: [OBJ-4.4-2]
    level: mid
    prompt: >-
      גוש בעל מסה $1.0\,\text{kg}$ נע במהירות $6.0\,\text{m/s}$ ונדבק לגוש בעל מסה $2.0\,\text{kg}$ שעומד על רצפה.
      מקדם החיכוך הקינטי בין הגושים לרצפה הוא $0.20$, וההתנגשות קצרה מאוד. כמה מטרים מחליק הזוג עד שהוא נעצר?
    answer: 1.02
    unit: m
    correctFeedback: >-
      נכון. בהתנגשות: $V = \dfrac{1.0\cdot6.0}{3.0} = 2.0\,\text{m/s}$. בהחלקה, משפט עבודה-אנרגיה:
      $\mu_k(m_1 + m_2)g\,d = \tfrac12(m_1 + m_2)V^2$, ולכן $d = \dfrac{V^2}{2\mu_kg} = \dfrac{4.0}{2\cdot0.20\cdot9.8} = 1.02\,\text{m}$.
    wrongFeedback: >-
      שני שלבים: בהתנגשות הקצרה התנע נשמר, ובהחלקה החיכוך עושה עבודה עד שהאנרגיה הקינטית של הזוג מתאפסת.
    commonWrong:
      - value: 3.06
        feedback: >-
          השוויתם את כל האנרגיה של הגוש הראשון, $18\,\text{J}$, לעבודת החיכוך. אבל בהתנגשות הפלסטית אבדו $12\,\text{J}$,
          ולזוג נשארו רק $6.0\,\text{J}$.
        misconception: MC-4-energy-through-collision
      - value: 9.18
        feedback: >-
          השתמשתם במהירות של הגוש הראשון לפני ההתנגשות. אחרי שהגושים נצמדים הם נעים במהירות המשותפת, $2.0\,\text{m/s}$.
    hints:
      - 'המסה מצטמצמת ב-$d = V^2/(2\mu_kg)$: מרחק העצירה לא תלוי במסה.'

  - id: Q-4.4-pendulum-bob
    type: numeric
    objectives: [OBJ-4.4-2]
    level: mid
    prompt: >-
      משחררים ממנוחה משקולת של מטוטלת מגובה $0.80\,\text{m}$ מעל הנקודה הנמוכה שלה. בנקודה הנמוכה היא פוגעת חזיתית
      בכדור שמסתו פי 3 ממסתה, ושתלוי במנוחה על חוט באותו אורך. ההתנגשות אלסטית. לאיזה גובה עולה המשקולת אחרי
      ההתנגשות?
    answer: 0.2
    unit: m
    correctFeedback: >-
      נכון. שלב 1, אנרגיה: $v = \sqrt{2gh_0} = 3.96\,\text{m/s}$. שלב 2, התנגשות אלסטית:
      $v_1' = \dfrac{m - 3m}{m + 3m}\,v = -\dfrac{v}{2}$, והמשקולת נרתעת לאחור בחצי מהירות. שלב 3, אנרגיה: הגובה
      פרופורציוני לריבוע המהירות, $h_1 = \dfrac{h_0}{4} = 0.20\,\text{m}$. גם הכדור הכבד יוצא ב-$\dfrac{2m}{4m}\,v = \dfrac{v}{2}$,
      ועולה לאותו גובה.
    wrongFeedback: >-
      שלושה שלבים: אנרגיה בירידה, התנגשות אלסטית בנקודה הנמוכה, ואנרגיה בעלייה. היחס בין הגבהים הוא ריבוע היחס בין
      המהירויות.
    commonWrong:
      - value: 0.4
        feedback: >-
          המהירות אכן קטנה פי 2, אבל הגובה פרופורציוני לריבוע המהירות, $h = v^2/(2g)$, ולכן הוא קטן פי 4.
      - value: 0.8
        feedback: >-
          המשקולת חוזרת לגובה ההתחלתי רק אם היא נרתעת מגוף כבד מאוד, כמו קיר. הכדור כבד ממנה רק פי 3, והוא לוקח חלק
          מהאנרגיה.
      - value: 0
        feedback: >-
          המשקולת נעצרת רק כשהמסות שוות. כאן הכדור כבד ממנה, והיא נרתעת לאחור.
        misconception: MC-4-equal-masses-share
    hints:
      - '$v_1'' = \dfrac{m_1 - m_2}{m_1 + m_2}\,v_1$ כשגוף 2 במנוחה.'

  - id: Q-4.4-spring-bumper
    type: numeric
    objectives: [OBJ-4.4-2]
    level: bagrut
    prompt: >-
      על מסילה בלי חיכוך, עגלה בעלת מסה $m_1 = 2.0\,\text{kg}$ נעה במהירות $3.0\,\text{m/s}$ אל עגלה בעלת מסה
      $m_2 = 1.0\,\text{kg}$ שעומדת. לעגלה העומדת מחובר מלפנים קפיץ קל עם קבוע $k = 600\,\text{N/m}$. מה הכיווץ המרבי
      של הקפיץ?
    answer: 0.1
    unit: m
    correctFeedback: >-
      נכון. בכיווץ המרבי העגלות לא נעות זו ביחס לזו, ולכן שתיהן נעות במהירות מרכז המסה, $V = 2.0\,\text{m/s}$: זה רגע
      של התנגשות פלסטית. האנרגיה שאובדת לתנועה נאגרת כולה בקפיץ:
      $$\tfrac12kx^2 = \tfrac12\mu v^2,\qquad x = v\sqrt{\frac{\mu}{k}} = 3.0\sqrt{\frac{0.667}{600}} = 0.10\,\text{m}$$
      **בדיקת גבולות:** כש-$m_2 \to \infty$, הקפיץ צמוד לקיר, $\mu \to m_1$, ו-$x \to v\sqrt{m_1/k}$: כל האנרגיה נאגרת.
      כש-$m_2 \to 0$, $\mu \to 0$ ו-$x \to 0$: עגלה חסרת מסה לא מתנגדת לכיווץ.
    wrongFeedback: >-
      ברגע הכיווץ המרבי המהירות היחסית של העגלות אפס. התנע נשמר, ולכן הן נעות אז במהירות מרכז המסה. השוו את
      האנרגיה הקינטית לפני ובאותו רגע.
    commonWrong:
      - value: 0.173
        feedback: >-
          הנחתם שכל האנרגיה הקינטית, $9.0\,\text{J}$, נאגרת בקפיץ. אבל ברגע הכיווץ המרבי שתי העגלות עדיין נעות
          ב-$2.0\,\text{m/s}$, ואנרגיה של $6.0\,\text{J}$ נשארת בתנועה של מרכז המסה.
        misconception: MC-4-all-ke-lost
      - value: 0.141
        feedback: >-
          שמתם בקפיץ את האנרגיה של מרכז המסה, $6.0\,\text{J}$. זה החלק שחייב להישאר בתנועה. בקפיץ נאגר החלק השני,
          $\tfrac12\mu v^2 = 3.0\,\text{J}$.
    hints:
      - 'מה המהירות היחסית של העגלות ברגע שהקפיץ מכווץ ביותר?'
      - 'האנרגיה שנאגרת בקפיץ היא האנרגיה הזמינה בהתנגשות, $\tfrac12\mu v_{\text{rel}}^2$.'

  - id: Q-4.4-bullet-through
    type: numeric
    objectives: [OBJ-4.4-1, OBJ-4.4-2]
    level: bagrut
    prompt: >-
      קליע בעל מסה $5.0\,\text{g}$ נע אופקית במהירות $400\,\text{m/s}$, עובר דרך גוש עץ בעל מסה $1.0\,\text{kg}$ שתלוי
      על חוטים ארוכים, ויוצא ממנו במהירות $150\,\text{m/s}$. החלק של העץ שהקליע הוציא זניח. לאיזה גובה עולה הגוש?
    answer: 0.0797
    unit: m
    correctFeedback: >-
      נכון. בזמן המעבר הקצר התנע נשמר: $0.0050\cdot400 = 0.0050\cdot150 + 1.0\cdot V$, ולכן $V = 1.25\,\text{m/s}$.
      אחר כך הגוש עולה, ואנרגיה נשמרת: $h = \dfrac{V^2}{2g} = \dfrac{1.25^2}{2\cdot9.8} = 0.0797\,\text{m}$, כ-$8.0\,\text{cm}$.
      **בדיקת גבולות:** אם הקליע יוצא במהירות שבה נכנס, הגוש לא זז, $h = 0$. אם הקליע נתקע, הגוש והקליע עולים
      לגובה של מטוטלת בליסטית רגילה.
    wrongFeedback: >-
      שני שלבים. במעבר הקליע דרך הגוש נשמר התנע של הקליע והגוש; אחר כך הגוש לבדו עולה, ואנרגיה נשמרת.
    commonWrong:
      - value: 0.202
        feedback: >-
          פתרתם כאילו הקליע נתקע בגוש. כאן הקליע יוצא, ולוקח איתו את רוב התנע שלו: הגוש מקבל רק את ההפרש,
          $0.0050\cdot250\,\text{kg}\cdot\text{m/s}$.
      - value: 35.1
        feedback: >-
          הנחתם שכל האנרגיה שהקליע איבד, $344\,\text{J}$, עברה לגוש. רוב האנרגיה הזו הפכה לחום ולעיוות של העץ: בזמן
          המעבר נשמר רק התנע.
        misconception: MC-4-energy-through-collision
    hints:
      - 'כתבו שימור תנע עם שלושה איברים: הקליע לפני, הקליע אחרי, והגוש אחרי.'

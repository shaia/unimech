chapter: 4
questions:
  # ---------------------------------------------------------------- OBJ-4.1-1 elastic and perfectly inelastic in 1D
  - id: Q-4.1-equal-masses
    type: mc
    objectives: [OBJ-4.1-1]
    qualitative: true
    level: basic
    prompt: >-
      שתי עגלות בעלות אותה מסה $m$ נמצאות על מסילה אופקית בלי חיכוך. עגלה A נעה במהירות $v$ אל עגלה B, שעומדת
      במנוחה. ההתנגשות ביניהן אלסטית: האנרגיה הקינטית הכוללת אחריה שווה לזו שלפניה. מה קורה אחרי ההתנגשות?
    choices:
      - text: A נעצרת, ו-B נעה במהירות $v$.
        correct: true
        feedback: >-
          נכון. כשגוף 2 במנוחה, הפתרון של התנגשות אלסטית בממד אחד הוא
          $v_1' = \dfrac{m_1 - m_2}{m_1 + m_2}\,v_1$ ו-$v_2' = \dfrac{2m_1}{m_1 + m_2}\,v_1$. כשהמסות שוות הראשונה
          נעצרת והשנייה מקבלת את כל המהירות: העגלות מחליפות מהירויות. זה מה שרואים בעריסת ניוטון.
      - text: שתיהן נעות יחד במהירות $v/2$.
        feedback: >-
          התנע אכן נשמר כך, $mv = 2m\cdot\tfrac{v}{2}$, אבל האנרגיה הקינטית יורדת מ-$\tfrac12mv^2$ ל-$\tfrac14mv^2$.
          זו התנגשות פלסטית. בהתנגשות אלסטית צריך לקיים גם את שימור האנרגיה, והפתרון היחיד שבו משהו קרה הוא
          החלפת המהירויות.
        misconception: MC-4-equal-masses-share
      - text: A חוזרת לאחור במהירות $v$, ו-B נשארת במנוחה.
        feedback: >-
          אז התנע הכולל היה מתהפך, מ-$mv$ ימינה ל-$mv$ שמאלה. כדי לשנות את התנע הכולל צריך מתקף של כוח חיצוני,
          ובהתנגשות בין שתי העגלות אין כזה. כך חוזר כדור מקיר כבד מאוד, לא מעגלה שמסתה כמו שלו.
      - text: כל אחת נעה במהירות $v/\sqrt2$ קדימה.
        feedback: >-
          האנרגיה אכן נשמרת כך, $2\cdot\tfrac12m\cdot\tfrac{v^2}{2} = \tfrac12mv^2$, אבל התנע לא:
          $2m\cdot\tfrac{v}{\sqrt2} = \sqrt2\,mv$, גדול מ-$mv$. צריך לקיים את שני חוקי השימור יחד.
    hints:
      - 'כתבו את שימור התנע ואת שימור האנרגיה הקינטית לשתי העגלות. איזה זוג מהירויות מקיים את שניהם?'

  - id: Q-4.1-elastic-carts
    type: numeric
    objectives: [OBJ-4.1-1]
    level: basic
    prompt: >-
      עגלה בעלת מסה $m_1 = 2.0\,\text{kg}$ נעה במהירות $3.0\,\text{m/s}$ על מסילה בלי חיכוך, ומתנגשת התנגשות
      חזיתית ואלסטית בעגלה בעלת מסה $m_2 = 1.0\,\text{kg}$ שעומדת במנוחה. מה גודל המהירות של העגלה הקלה אחרי
      ההתנגשות?
    answer: 4.0
    unit: m/s
    correctFeedback: >-
      נכון. $v_2' = \dfrac{2m_1}{m_1 + m_2}\,v_1 = \dfrac{2\cdot2.0}{3.0}\cdot3.0 = 4.0\,\text{m/s}$, והעגלה הכבדה
      ממשיכה קדימה ב-$v_1' = \dfrac{m_1 - m_2}{m_1 + m_2}\,v_1 = 1.0\,\text{m/s}$. בדיקה: התנע
      $2.0\cdot1.0 + 1.0\cdot4.0 = 6.0\,\text{kg}\cdot\text{m/s}$, כמו לפני, והאנרגיה
      $\tfrac12\cdot2.0\cdot1.0^2 + \tfrac12\cdot1.0\cdot4.0^2 = 9.0\,\text{J}$, גם כמו לפני.
    wrongFeedback: >-
      כתבו שתי משוואות, שימור תנע ושימור אנרגיה קינטית, עם שני נעלמים, $v_1'$ ו-$v_2'$. דרך קצרה: בהתנגשות
      אלסטית בממד אחד מהירות ההתרחקות שווה למהירות ההתקרבות, $v_2' - v_1' = 3.0\,\text{m/s}$.
    commonWrong:
      - value: 2.0
        feedback: >-
          זו המהירות המשותפת בהתנגשות פלסטית, $\dfrac{m_1v_1}{m_1 + m_2}$. כאן ההתנגשות אלסטית, והעגלות לא נעות
          יחד: הן מתרחקות זו מזו באותה מהירות שבה התקרבו.
      - value: 6.0
        feedback: >-
          הנחתם שהעגלה הכבדה נעצרת ומוסרת את כל התנע שלה. זה קורה רק כשהמסות שוות. כאן היא ממשיכה ב-$1.0\,\text{m/s}$,
          ובתשובה שלכם האנרגיה הייתה גדלה מ-$9.0$ ל-$18\,\text{J}$.
      - value: 4.24
        feedback: >-
          הנחתם שכל האנרגיה הקינטית, $9.0\,\text{J}$, עוברת לעגלה הקלה. אז התנע שלה היה $4.24\,\text{kg}\cdot\text{m/s}$
          ולא $6.0$: התנע לא היה נשמר. העגלה הכבדה ממשיכה לנוע ושומרת חלק מהאנרגיה.
      - value: 1.0
        feedback: 'זו המהירות של העגלה הכבדה אחרי ההתנגשות. השאלה שואלת על העגלה הקלה.'
    hints:
      - 'מהירות ההתרחקות אחרי התנגשות אלסטית שווה למהירות ההתקרבות לפניה. צרפו את זה לשימור התנע.'

  - id: Q-4.1-plastic-head-on
    type: numeric
    objectives: [OBJ-4.1-1]
    level: mid
    prompt: >-
      על מסילה בלי חיכוך, עגלה בעלת מסה $1.5\,\text{kg}$ נעה ימינה במהירות $4.0\,\text{m/s}$, ועגלה בעלת מסה
      $2.5\,\text{kg}$ נעה שמאלה במהירות $2.0\,\text{m/s}$. העגלות מתנגשות חזיתית ונצמדות זו לזו. מה המהירות המשותפת
      שלהן אחרי ההתנגשות? ענו עם סימן, כשהכיוון החיובי ימינה.
    answer: 0.25
    unit: m/s
    correctFeedback: >-
      נכון. עם ציר חיובי ימינה התנע הכולל הוא $1.5\cdot4.0 + 2.5\cdot(-2.0) = 1.0\,\text{kg}\cdot\text{m/s}$, והוא
      נשמר: $V = \dfrac{1.0}{4.0} = 0.25\,\text{m/s}$, ימינה. העגלה הכבדה איטית יותר, והתנע ימינה גדול רק במעט.
    wrongFeedback: >-
      בחרו ציר, וכתבו כל מהירות עם הסימן שלה. התנע הכולל לפני ההתנגשות שווה ל-$(m_1 + m_2)V$ אחריה.
    commonWrong:
      - value: 2.75
        feedback: >-
          חיברתם את גודלי התנעים, $6.0 + 5.0$. התנע הוא וקטור: העגלה שנעה שמאלה תורמת תנע שלילי, ולכן מחסרים.
      - value: 1.0
        feedback: >-
          זה הממוצע הפשוט של המהירויות, $\dfrac{4.0 + (-2.0)}{2}$. המהירות המשותפת היא מהירות מרכז המסה, ממוצע
          **משוקלל** במסות. הוא שווה לממוצע הפשוט רק כשהמסות שוות.
        misconception: MC-4-vcm-plain-average
      - value: -0.25
        feedback: >-
          הגודל נכון, הכיוון לא. התנע ימינה, $6.0\,\text{kg}\cdot\text{m/s}$, גדול מהתנע שמאלה, $5.0$, ולכן השקול ימינה.
    hints:
      - 'חשבו את התנע של כל עגלה עם סימן, וחברו.'

  - id: Q-4.1-relative-speed
    type: twotier
    objectives: [OBJ-4.1-1]
    qualitative: true
    level: mid
    prompt: >-
      כדור A נע ימינה במהירות $5.0\,\text{m/s}$ ומשיג את כדור B, שנע לפניו ימינה במהירות $2.0\,\text{m/s}$. הכדורים
      מתנגשים התנגשות חזיתית ואלסטית. המסות שלהם לא ידועות. מה אפשר לומר בוודאות על התנועה אחרי ההתנגשות?
    choices:
      - text: B נע ימינה מהר יותר מ-A, ובדיוק ב-$3.0\,\text{m/s}$, לכל זוג מסות.
        correct: true
        feedback: >-
          נכון. את המהירויות עצמן קובעות המסות, אבל את ההפרש ביניהן לא: לפני ההתנגשות A התקרב אל B ב-$3.0\,\text{m/s}$,
          ואחריה B מתרחק מ-A באותה מהירות.
      - text: בלי המסות אי אפשר לומר דבר על המהירויות אחרי ההתנגשות.
        feedback: >-
          את כל אחת מהמהירויות אכן אי אפשר למצוא בלי המסות. את ההפרש ביניהן אפשר, והוא לא תלוי במסות כלל.
        misconception: MC-4-separation-depends-on-masses
      - text: שני הכדורים נעים יחד ימינה במהירות $3.5\,\text{m/s}$.
        feedback: >-
          תנועה משותפת היא התנגשות פלסטית, שבה מהירות ההתרחקות אפס ואנרגיה הולכת לאיבוד. וגם אז המהירות המשותפת
          היא ממוצע משוקלל במסות, לא הממוצע הפשוט $3.5\,\text{m/s}$.
      - text: A נעצר, ו-B ממשיך ימינה במהירות $7.0\,\text{m/s}$.
        feedback: >-
          כאן מהירות ההתרחקות היא $7.0\,\text{m/s}$, גדולה ממהירות ההתקרבות. אם המסות שוות התנע נשמר כך, אבל
          האנרגיה הקינטית גדלה, מ-$\tfrac12m(25 + 4)$ ל-$\tfrac12m\cdot49$ ביחידות SI. משהו היה צריך להוסיף אנרגיה.
    reasons:
      - text: >-
          בהתנגשות אלסטית בממד אחד, שימור התנע ושימור האנרגיה יחד נותנים $v_2' - v_1' = -(v_2 - v_1)$: המהירות
          היחסית מתהפכת.
        correct: true
        feedback: >-
          זה הנימוק. כתבו את התנע כ-$m_1(v_1 - v_1') = m_2(v_2' - v_2)$ ואת האנרגיה כ-$m_1(v_1^2 - v_1'^2) = m_2(v_2'^2 - v_2^2)$.
          חלקו את השנייה בראשונה, והמסות מתבטלות: $v_1 + v_1' = v_2 + v_2'$.
      - text: התנע הכולל נשמר, ולכן גם ההפרש בין המהירויות נשמר.
        feedback: >-
          שימור התנע לבדו לא קובע את ההפרש: הוא מתקיים גם בהתנגשות פלסטית, שבה ההפרש מתאפס. וההפרש גם לא נשמר
          אלא מתהפך: לפני ההתנגשות A מהיר יותר, ואחריה B. את ההיפוך נותן שימור האנרגיה.
      - text: מהירות מרכז המסה נשמרת, והיא הממוצע של שתי המהירויות.
        feedback: >-
          מהירות מרכז המסה אכן נשמרת, אבל היא ממוצע משוקלל, $\dfrac{m_1v_1 + m_2v_2}{m_1 + m_2}$, ולכן היא תלויה
          במסות. מהידיעה שהיא נשמרת לבד לא יוצא ההפרש בין המהירויות.
        misconception: MC-4-vcm-plain-average
    hints:
      - 'העבירו את כל מה ששייך לכדור A לאגף אחד בשתי משוואות השימור, ואז חלקו משוואה במשוואה.'

  - id: Q-4.1-light-target
    type: mc
    objectives: [OBJ-4.1-1]
    qualitative: true
    level: mid
    prompt: >-
      כדור באולינג מתגלגל במהירות $u$ ופוגע חזיתית בכדור פינג-פונג שעומד במנוחה. מסת כדור הבאולינג גדולה פי מאות
      ממסת כדור הפינג-פונג, וההתנגשות אלסטית. מה בערך גודל המהירות של כדור הפינג-פונג מיד אחרי ההתנגשות?
    choices:
      - text: $2u$
        correct: true
        feedback: >-
          נכון. ב-$v_2' = \dfrac{2m_1}{m_1 + m_2}\,u$, כש-$m_1 \gg m_2$ השבר שואף ל-2. ובלי נוסחה: כדור הבאולינג כמעט
          לא מאט, ובמערכת הייחוס שלו כדור הפינג-פונג מגיע אליו במהירות $u$ ונרתע ממנו במהירות $u$. במערכת המעבדה
          מוסיפים את $u$ של כדור הבאולינג, ויוצא $2u$.
      - text: $u$
        feedback: >-
          כך היה אם הכדורים היו נעים יחד אחרי ההתנגשות, כלומר בהתנגשות פלסטית. בהתנגשות אלסטית מהירות ההתרחקות
          שווה למהירות ההתקרבות, $u$. כדור הבאולינג ממשיך כמעט ב-$u$, ולכן כדור הפינג-פונג מתרחק ממנו ב-$2u$.
        misconception: MC-4-light-target-same-speed
      - text: מהירות גדולה בהרבה מ-$2u$, כי כל התנע של כדור הבאולינג עובר אליו.
        feedback: >-
          אם כל התנע היה עובר, מהירות הפינג-פונג הייתה $\dfrac{m_1}{m_2}\,u$ והאנרגיה שלו הייתה גדולה פי
          $\dfrac{m_1}{m_2}$ מכל האנרגיה של כדור הבאולינג. כדור הבאולינג מוסר רק חלק זעיר מהתנע שלו,
          $m_2\cdot2u \ll m_1u$.
      - text: כמעט אפס, כי כדור הבאולינג פשוט דוחף אותו לפניו.
        feedback: >-
          אם כדור הפינג-פונג היה נשאר כמעט במנוחה, כדור הבאולינג היה עובר דרכו. כדי שלא ייכנס לתוכו, הפינג-פונג חייב
          לנוע לפחות במהירות $u$, ובהתנגשות אלסטית הוא נרתע מהר יותר.
    hints:
      - 'עברו למערכת הייחוס של כדור הבאולינג. מה קורה שם לכדור קל שפוגע בקיר כבד?'

  - id: Q-4.1-slingshot
    type: numeric
    objectives: [OBJ-4.1-1]
    level: bagrut
    prompt: >-
      כדור טניס נע ימינה במהירות $10\,\text{m/s}$ אל חזית של קטר שנע שמאלה, לקראתו, במהירות $4.0\,\text{m/s}$. מסת
      הקטר גדולה מאוד ממסת הכדור, וההתנגשות חזיתית ואלסטית. מה גודל המהירות של הכדור אחרי ההתנגשות?
    answer: 18
    unit: m/s
    correctFeedback: >-
      נכון. במערכת הייחוס של הקטר הכדור מתקרב ב-$10 + 4.0 = 14\,\text{m/s}$ ונרתע ב-$14\,\text{m/s}$, כמו מקיר
      שעומד. במערכת המעבדה מוסיפים את מהירות הקטר: $14 + 4.0 = 18\,\text{m/s}$, שמאלה. מהנוסחה הכללית, עם ציר ימינה
      ו-$m_1/m_2 \to 0$:
      $$v_1' = \frac{(m_1 - m_2)v_1 + 2m_2v_2}{m_1 + m_2} \to -v_1 + 2v_2 = -10 + 2\cdot(-4.0) = -18\,\text{m/s}$$
      **בדיקת גבולות:** כשהקטר עומד, $v_2 = 0$, הכדור חוזר ב-$10\,\text{m/s}$, ההחזרה הרגילה מקיר. וכשהקטר מתרחק
      מהכדור, הכדור חוזר לאט יותר. הכדור צובר אנרגיה מהקטר. באותו עיקרון פועל תמרון הקלע של חללית שחולפת ליד כוכב לכת.
    wrongFeedback: >-
      עברו למערכת הייחוס של הקטר, שבה הוא קיר כבד שעומד. מצאו שם את מהירות הכדור לפני ההתנגשות ואחריה, ואז חזרו
      למערכת המעבדה.
    commonWrong:
      - value: 10
        feedback: >-
          זה נכון לקיר שעומד. כאן הקיר נע לקראת הכדור, ונשמרת המהירות **יחסית לקטר**, $14\,\text{m/s}$. במעבדה
          מוסיפים לה את מהירות הקטר.
        misconception: MC-4-moving-wall-same-speed
      - value: 14
        feedback: >-
          זו מהירות הכדור יחסית לקטר אחרי ההתנגשות. כדי לחזור למערכת המעבדה מוסיפים את מהירות הקטר, $4.0\,\text{m/s}$,
          שגם היא שמאלה.
      - value: 6.0
        feedback: >-
          חיסרתם את מהירות הקטר במקום להוסיף אותה. הקטר נע לקראת הכדור, והוא מחזיר אותו מהר יותר, לא לאט יותר.
    hints:
      - 'במערכת הייחוס של הקטר, הוא קיר שעומד. מה מהירות הכדור יחסית אליו לפני ההתנגשות?'
      - 'מהירות במעבדה שווה למהירות יחסית לקטר ועוד מהירות הקטר.'

  # ---------------------------------------------------------------- OBJ-4.1-2 coefficient of restitution, KE lost
  - id: Q-4.1-restitution-meaning
    type: mc
    objectives: [OBJ-4.1-2]
    qualitative: true
    level: basic
    prompt: >-
      בהתנגשות חזיתית, **מקדם התקומה** $e$ הוא היחס בין מהירות ההתרחקות של הגופים אחרי ההתנגשות למהירות ההתקרבות
      שלהם לפניה:
      $$e = -\frac{v_2' - v_1'}{v_2 - v_1}$$
      מה פירוש הדבר שבהתנגשות מסוימת $e = 0$?
    choices:
      - text: הגופים נעים יחד אחרי ההתנגשות. זו התנגשות פלסטית.
        correct: true
        feedback: >-
          נכון. מהירות ההתרחקות אפס, כלומר $v_1' = v_2'$. הגופים לא חייבים לעצור: הם נעים יחד במהירות של מרכז המסה,
          כי התנע נשמר. כש-$e = 1$ ההתנגשות אלסטית, וכש-$0 < e < 1$ היא לא אלסטית ואנרגיה קינטית אובדת.
      - text: שני הגופים נעצרים, וכל האנרגיה הקינטית שלהם הופכת לחום.
        feedback: >-
          הם נעצרים רק אם התנע הכולל היה אפס מלכתחילה. אחרת התנע שנשמר מחייב תנועה משותפת במהירות
          $V = \dfrac{m_1v_1 + m_2v_2}{m_1 + m_2}$, ואנרגיה קינטית של $\tfrac12(m_1 + m_2)V^2$ נשארת.
        misconception: MC-4-all-ke-lost
      - text: ההתנגשות אלסטית, והאנרגיה הקינטית נשמרת.
        feedback: >-
          זה המקרה $e = 1$: מהירות ההתרחקות שווה למהירות ההתקרבות. ב-$e = 0$ אין התרחקות כלל, וזה המקרה שבו אובדת
          האנרגיה הקינטית הגדולה ביותר שאפשר.
        misconception: MC-4-ke-always-conserved
      - text: הגוף הפוגע נעצר, והגוף השני ממשיך במהירות שהייתה לפוגע.
        feedback: >-
          כאן מהירות ההתרחקות שווה למהירות ההתקרבות, כלומר $e = 1$. זו התנגשות אלסטית של מסות שוות.
    hints:
      - 'מה המונה של $e$ כשהמקדם שווה לאפס?'

  - id: Q-4.1-ke-lost
    type: numeric
    objectives: [OBJ-4.1-2]
    level: basic
    prompt: >-
      גוש פלסטלינה בעל מסה $1.2\,\text{kg}$ נע במהירות $5.0\,\text{m/s}$ על משטח בלי חיכוך, פוגע בגוש בעל מסה
      $0.80\,\text{kg}$ שעומד במנוחה ונדבק אליו. כמה אנרגיה קינטית אבדה בהתנגשות?
    answer: 6.0
    unit: J
    correctFeedback: >-
      נכון. משימור התנע $V = \dfrac{1.2\cdot5.0}{2.0} = 3.0\,\text{m/s}$. לפני ההתנגשות
      $K = \tfrac12\cdot1.2\cdot5.0^2 = 15\,\text{J}$, ואחריה $\tfrac12\cdot2.0\cdot3.0^2 = 9.0\,\text{J}$. אבדו
      $6.0\,\text{J}$, שהם 40% מהאנרגיה, בדיוק $\dfrac{m_2}{m_1 + m_2} = \dfrac{0.80}{2.0}$.
    wrongFeedback: >-
      מצאו את המהירות המשותפת משימור התנע, ואז השוו את האנרגיה הקינטית לפני ההתנגשות ואחריה.
    commonWrong:
      - value: 0
        feedback: >-
          בהתנגשות פלסטית האנרגיה הקינטית לא נשמרת: חלק ממנה הופך לחום ולעיוות של הפלסטלינה. נשמר רק התנע.
        misconception: MC-4-ke-always-conserved
      - value: 9.0
        feedback: 'זו האנרגיה הקינטית שנשארה אחרי ההתנגשות. השאלה שואלת כמה אבדה: חסרו אותה מ-$15\,\text{J}$.'
      - value: 15
        feedback: >-
          זו כל האנרגיה ההתחלתית. היא לא יכולה ללכת לאיבוד כולה: התנע נשמר, ולכן הגושים ממשיכים לנוע יחד
          ב-$3.0\,\text{m/s}$.
        misconception: MC-4-all-ke-lost
    hints:
      - 'משימור התנע: $m_1v_1 = (m_1 + m_2)V$.'

  - id: Q-4.1-truck-or-car
    type: twotier
    objectives: [OBJ-4.1-2]
    qualitative: true
    level: mid
    prompt: >-
      מכונית בעלת מסה $1000\,\text{kg}$ ומשאית בעלת מסה $4000\,\text{kg}$. במקרה הראשון המכונית נוסעת במהירות $v$
      ופוגעת במשאית חונה; במקרה השני המשאית נוסעת באותה מהירות $v$ ופוגעת במכונית חונה. בשני המקרים הרכבים נצמדים
      זה לזה, והחיכוך עם הכביש זניח בזמן ההתנגשות. באיזה מקרה אובד **חלק** גדול יותר מהאנרגיה הקינטית ההתחלתית?
    choices:
      - text: כשהמכונית פוגעת במשאית החונה.
        correct: true
        feedback: >-
          נכון: 80% מהאנרגיה אובדים, לעומת 20% כשהמשאית היא הפוגעת. המשאית הנוסעת ממשיכה כמעט באותה מהירות וגוררת
          איתה את המכונית, ושומרת את רוב האנרגיה שלה.
      - text: כשהמשאית פוגעת במכונית החונה, כי למשאית יש יותר אנרגיה קינטית.
        feedback: >-
          למשאית אכן פי 4 אנרגיה. אבל הכמות שאובדת שווה בשני המקרים, $0.8\cdot\tfrac12\cdot1000v^2 = 0.2\cdot\tfrac12\cdot4000v^2$,
          ולכן אצל המשאית זה חלק קטן מהאנרגיה. האנרגיה שאובדת לא נקבעת על ידי האנרגיה הכוללת.
        misconception: MC-4-loss-set-by-total-ke
      - text: אותו חלק בשני המקרים, כי המסות והמהירות זהות.
        feedback: >-
          המסות אותן מסות, אבל התפקידים התהפכו. החלק שאובד תלוי בשאלה מי עמד: מסת הגוף העומד מופיעה במונה.
    reasons:
      - text: >-
          כשגוף 2 עומד, $V = \dfrac{m_1v}{m_1 + m_2}$, והחלק מהאנרגיה שאובד הוא $\dfrac{m_2}{m_1 + m_2}$, כאשר $m_2$
          היא מסת הגוף שעמד.
        correct: true
        feedback: >-
          זה הנימוק. $\dfrac{K_f}{K_i} = \dfrac{(m_1 + m_2)V^2}{m_1v^2} = \dfrac{m_1}{m_1 + m_2}$, ולכן החלק שאובד הוא
          $\dfrac{m_2}{m_1 + m_2}$: $\dfrac{4000}{5000} = 0.80$ כשהמשאית עומדת, ו-$\dfrac{1000}{5000} = 0.20$ כשהמכונית
          עומדת.
      - text: הגוף הכבד מפעיל כוח גדול יותר בהתנגשות, ולכן הוא הורס יותר ומאבד יותר.
        feedback: >-
          לפי החוק השלישי, הכוחות של הרכבים זה על זה שווים בגודלם בכל רגע, מי שלא יהיה הפוגע. ההבדל בין המקרים הוא
          במהירות שבה הזוג ממשיך אחרי ההתנגשות.
        misconception: MC-4-loss-set-by-total-ke
      - text: האנרגיה שאובדת שווה תמיד לאנרגיה הקינטית של הרכב הקל.
        feedback: >-
          כשהמשאית פוגעת, למכונית החונה אין אנרגיה קינטית כלל, ובכל זאת אובדת אנרגיה. את האנרגיה שאובדת קובעים התנע
          שנשמר והמסות של שניהם.
    hints:
      - 'חשבו את היחס $K_f/K_i$ כשגוף 2 עומד: כתבו את $V$ משימור התנע.'

  - id: Q-4.1-third-bounce
    type: numeric
    objectives: [OBJ-4.1-2]
    level: mid
    prompt: >-
      משחררים כדור ממנוחה מגובה $h_0 = 2.0\,\text{m}$ מעל רצפה כבדה. אחרי הפגיעה הראשונה ברצפה הוא עולה לגובה
      $1.28\,\text{m}$. מקדם התקומה זהה בכל פגיעה, והתנגדות האוויר זניחה. לאיזה גובה יעלה הכדור אחרי הפגיעה
      **השלישית** ברצפה?
    answer: 0.524
    unit: m
    correctFeedback: >-
      נכון. הרצפה לא זזה, ולכן $e$ הוא היחס בין מהירות העלייה למהירות הפגיעה. הגובה פרופורציוני לריבוע המהירות,
      $h = \dfrac{v^2}{2g}$, ולכן בכל פגיעה הגובה קטן פי $e^2$: $e^2 = \dfrac{1.28}{2.0} = 0.64$, ו-$e = 0.80$. אחרי שלוש
      פגיעות $h_3 = h_0e^6 = 2.0\cdot0.64^3 = 0.524\,\text{m}$.
    wrongFeedback: >-
      מצאו קודם את $e$ מהגובה הראשון. זכרו: $e$ הוא יחס בין **מהירויות**, והגובה תלוי בריבוע המהירות.
    commonWrong:
      - value: 1.02
        feedback: >-
          כפלתם בכל פגיעה ב-$e = 0.80$, כאילו $e$ הוא יחס הגבהים. $e$ הוא יחס המהירויות, והגובה קטן בכל פגיעה פי $e^2 = 0.64$.
        misconception: MC-4-restitution-is-height-ratio
      - value: 0.336
        feedback: >-
          התחלתם מ-$1.28\,\text{m}$ וכפלתם עוד שלוש פעמים ב-0.64: זה הגובה אחרי הפגיעה הרביעית. הגובה $1.28\,\text{m}$
          הוא כבר אחרי הפגיעה הראשונה.
      - value: 0.819
        feedback: 'זה הגובה אחרי הפגיעה השנייה, $2.0\cdot0.64^2$. צריך עוד פגיעה אחת.'
    hints:
      - 'מהירות פגיעה מגובה $h$ היא $\sqrt{2gh}$. מה היחס בין שני גבהים עוקבים, בביטוי עם $e$?'

  - id: Q-4.1-bounce-time
    type: numeric
    objectives: [OBJ-4.1-2]
    level: bagrut
    prompt: >-
      אותו כדור ($h_0 = 2.0\,\text{m}$, $e = 0.80$ בכל פגיעה) מקפץ שוב ושוב על הרצפה עד שהוא נח. משך כל פגיעה זניח.
      כמה זמן עובר מרגע השחרור עד שהכדור מפסיק לקפץ?
    answer: 5.75
    unit: s
    correctFeedback: >-
      נכון. זמן הנפילה הראשונה הוא $t_0 = \sqrt{2h_0/g} = 0.639\,\text{s}$. אחרי הפגיעה ה-$n$ הכדור עולה במהירות
      $e^n v_0$, ועף זמן $2e^n t_0$, עלייה וירידה. הסכום הוא טור הנדסי:
      $$T = t_0 + 2t_0\left(e + e^2 + \dots\right) = t_0\left(1 + \frac{2e}{1 - e}\right) = t_0\,\frac{1 + e}{1 - e} = 0.639\cdot9 = 5.75\,\text{s}$$
      **בדיקת גבולות:** כש-$e \to 0$ הכדור נעצר בפגיעה הראשונה, ו-$T \to t_0$. כש-$e \to 1$ הוא מקפץ לנצח, ו-$T \to \infty$.
      יש אינסוף קפיצות, אבל הזמן הכולל סופי.
    wrongFeedback: >-
      כתבו את זמן המעוף אחרי כל פגיעה: מהירות העלייה אחרי הפגיעה ה-$n$ היא $e^n$ כפול מהירות הפגיעה הראשונה, והזמן
      באוויר פרופורציוני למהירות. סכמו טור הנדסי.
    commonWrong:
      - value: 3.19
        feedback: >-
          חישבתם $t_0/(1 - e)$, כאילו כל קפיצה נמשכת $e^n t_0$. אבל אחרי כל פגיעה הכדור גם עולה וגם יורד, ולכן כל קפיצה
          נמשכת $2e^n t_0$. רק הנפילה הראשונה היא חצי קפיצה.
      - value: 2.91
        feedback: >-
          השתמשתם ב-$e^2 = 0.64$ כיחס בין זמני קפיצות עוקבות. פי $e^2$ קטן הגובה; זמן המעוף פרופורציוני למהירות,
          ולכן הוא קטן פי $e$.
        misconception: MC-4-restitution-is-height-ratio
    hints:
      - 'זמן המעוף של קפיצה שמתחילה במהירות $u$ כלפי מעלה הוא $2u/g$.'
      - '$e + e^2 + e^3 + \dots = \dfrac{e}{1 - e}$ כש-$e < 1$.'

        prompt: >-
          (1) נמקו למה ההתנגשות אלסטית, ובטאו באמצעות $m_A$, $m_B$ ו-$v$ את המהירויות של שתי העגלות אחרי שהקפיץ חוזר
          לאורכו הרפוי. פתרו במערכת מרכז המסה.

          (2) בדקו את התוצאה בגבולות $m_B \to \infty$ ו-$m_B = m_A$ ואת היחידות, וחשבו את המהירויות.
        hints:
          - 'כמה אנרגיה נשארת בקפיץ כשהוא חוזר לאורכו הרפוי?'
          - 'במערכת מרכז המסה, התנגשות אלסטית בממד אחד רק הופכת את הסימן של כל מהירות.'
        solution:
          - kind: law
            text: >-
              אין כוח חיצוני אופקי, ולכן התנע נשמר. כוח הקפיץ משמר, וכשהקפיץ חוזר לאורכו הרפוי האנרגיה שנאגרה בו
              חוזרת כולה לתנועה: האנרגיה הקינטית בסוף שווה לזו שבהתחלה, וההתנגשות אלסטית. במערכת מרכז המסה, התנגשות
              אלסטית בממד אחד הופכת את הסימן של כל מהירות.
          - kind: manipulation
            text: >-
              ציר ימינה. $V = \dfrac{m_Av}{m_A + m_B}$. במערכת מרכז המסה $u_A = v - V = \dfrac{m_Bv}{m_A + m_B}$ ו-$u_B = -V$.
              אחרי ההתנגשות $u_A' = -u_A$ ו-$u_B' = +V$. חזרה למעבדה, מוסיפים את $V$:
              $$v_A' = V - u_A = \frac{m_A - m_B}{m_A + m_B}\,v,\qquad v_B' = 2V = \frac{2m_A}{m_A + m_B}\,v$$
              בדיקה: $m_Av_A' + m_Bv_B' = \dfrac{m_A^2 - m_Am_B + 2m_Am_B}{m_A + m_B}\,v = m_Av$.
          - kind: limit
            text: >-
              כש-$m_B \to \infty$, B היא קיר: $v_A' \to -v$ ו-$v_B' \to 0$. כש-$m_B = m_A$, העגלות מחליפות מהירויות: A
              נעצרת ו-B יוצאת ב-$v$. כש-$m_B \to 0$: $v_B' \to 2v$, כמו כדור קל שנפגע ממחבט כבד. ובכל המקרים המהירות
              היחסית מתהפכת: $v_B' - v_A' = v$, כמו מהירות ההתקרבות.
          - kind: units
            text: 'בכל ביטוי מהירות כפול יחס מסות חסר ממדים, ולכן התוצאות במטר לשנייה.'
          - kind: substitution
            text: >-
              $V = 1.0\,\text{m/s}$, $v_A' = \dfrac{1.0 - 3.0}{4.0}\cdot4.0 = -2.0\,\text{m/s}$, $v_B' = \dfrac{2.0}{4.0}\cdot4.0 = 2.0\,\text{m/s}$.
              בדיקה: תנע $1.0\cdot(-2.0) + 3.0\cdot2.0 = 4.0\,\text{kg}\cdot\text{m/s}$, ואנרגיה
              $\tfrac12\cdot1.0\cdot2.0^2 + \tfrac12\cdot3.0\cdot2.0^2 = 8.0\,\text{J}$, כמו בהתחלה.
          - kind: result
            text: >-
              $v_A' = \dfrac{m_A - m_B}{m_A + m_B}\,v = -2.0\,\text{m/s}$ (A נרתעת שמאלה) ו-$v_B' = \dfrac{2m_A}{m_A + m_B}\,v = 2.0\,\text{m/s}$.
              הקפיץ הקל עושה את ההתנגשות אלסטית, כי הוא מחזיר את כל האנרגיה שאגר.
        rubric:
          - text: נימקתי שההתנגשות אלסטית, כי הקפיץ משמר ומחזיר את כל האנרגיה כשהוא חוזר לאורכו הרפוי.
          - text: חסרתי $V$, הפכתי את הסימן של כל מהירות במערכת מרכז המסה, והוספתי $V$ בחזרה.
          - text: >-
              קיבלתי $v_A' = \dfrac{m_A - m_B}{m_A + m_B}\,v$ ו-$v_B' = \dfrac{2m_A}{m_A + m_B}\,v$, ובמספרים
              $v_A' = -2.0\,\text{m/s}$ ו-$v_B' = 2.0\,\text{m/s}$, ובדקתי שהתנע והאנרגיה נשמרים.
          - text: בדקתי את הגבולות של B כבדה מאוד ושל מסות שוות.

      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-4.2-2, OBJ-4.4-2]
        prompt: >-
          חוזרים על הניסוי, אבל הפעם B לא עומדת: היא נעה שמאלה, לקראת A, במהירות $u = 2.0\,\text{m/s}$, ו-A נעה ימינה
          ב-$v = 4.0\,\text{m/s}$ כמו קודם.

          (1) בטאו את הכיווץ המרבי של הקפיץ באמצעות $m_A$, $m_B$, $k$, $v$ ו-$u$.

          (2) בדקו את הביטוי בגבולות $u \to 0$ ו-$m_B \to \infty$ ואת היחידות שלו, וחשבו את הכיווץ.
        hints:
          - 'האנרגיה הזמינה היא $\tfrac12\mu v_{\text{rel}}^2$. מה המהירות היחסית של העגלות כשהן נעות זו לקראת זו?'
        solution:
          - kind: law
            text: >-
              אין כוח חיצוני אופקי, ולכן מרכז המסה נע במהירות קבועה, והאנרגיה המכנית נשמרת. האנרגיה הקינטית מתפרקת
              לחלק של מרכז המסה ולחלק היחסי, $\tfrac12\mu v_{\text{rel}}^2$ עם $\mu = \dfrac{m_Am_B}{m_A + m_B}$ (שיעור 4.2).
              ברגע הכיווץ המרבי לשתי העגלות אותה מהירות, והתנועה היחסית נעצרה.
          - kind: manipulation
            text: >-
              ציר ימינה: $v_A = v$ ו-$v_B = -u$, ולכן $v_{\text{rel}} = v - (-u) = v + u$. החלק של מרכז המסה לא משתנה, וכל
              האנרגיה היחסית נאגרת בקפיץ: $\tfrac12kx^2 = \tfrac12\mu(v + u)^2$, כלומר
              $$x = (v + u)\sqrt{\frac{m_Am_B}{k\left(m_A + m_B\right)}}$$
          - kind: limit
            text: >-
              כש-$u \to 0$, B עומדת, ו-$x = v\sqrt{\mu/k}$: הכיווץ של חלק ב. כש-$m_B \to \infty$: $\mu \to m_A$, ו-$x \to (v + u)\sqrt{m_A/k}$:
              B היא קיר שנע לקראת A, ובמערכת של הקיר A מתקרבת ב-$v + u$ ונעצרת כולה. הכיווץ תלוי במהירויות רק דרך
              המהירות היחסית; חיסור הגדלים, $v - u$, היה נותן כיווץ קטן מזה של B עומדת, אף שהעגלות נפגשות מהר יותר.
          - kind: units
            text: '$\sqrt{\text{kg}/(\text{N/m})} = \sqrt{\text{s}^2} = \text{s}$, ומהירות כפול שניות היא מטרים.'
          - kind: substitution
            text: >-
              $\mu = \dfrac{1.0\cdot3.0}{4.0} = 0.75\,\text{kg}$, $v + u = 6.0\,\text{m/s}$, האנרגיה הזמינה
              $\tfrac12\cdot0.75\cdot6.0^2 = 13.5\,\text{J}$, ו-$x = \sqrt{\dfrac{2\cdot13.5}{300}} = 0.30\,\text{m}$. בדיקה במעבדה: המהירות
              המשותפת $\dfrac{1.0\cdot4.0 - 3.0\cdot2.0}{4.0} = -0.50\,\text{m/s}$, ו-$8.0 + 6.0 - \tfrac12\cdot4.0\cdot0.50^2 = 13.5\,\text{J}$.
          - kind: result
            text: >-
              $x = (v + u)\sqrt{\dfrac{m_Am_B}{k(m_A + m_B)}} = 0.30\,\text{m}$, כמו כיווץ שבו B עומדת ו-A נעה
              ב-$6.0\,\text{m/s}$.
        rubric:
          - text: השתמשתי באנרגיה הזמינה $\tfrac12\mu v_{\text{rel}}^2$, או בשימור תנע ואנרגיה במעבדה עם המהירות המשותפת.
          - text: 'לקחתי מהירות יחסית $v + u$, סכום הגדלים, כי העגלות נעות זו לקראת זו.'
          - text: קיבלתי $x = (v + u)\sqrt{\mu/k}$ ובדקתי ש-$u \to 0$ מחזיר את $0.20\,\text{m}$ של חלק ב.
          - text: בדקתי את הגבול $m_B \to \infty$ ואת היחידות, וחישבתי $0.30\,\text{m}$.


    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-4.4-2]
        prompt: מה גודל המהירות של שתי העגלות ברגע שבו הקפיץ מכווץ ביותר?
        answer: 1.0
        unit: m/s
        correctFeedback: >-
          נכון. ברגע הכיווץ המרבי הקפיץ לא מתקצר ולא מתארך, ולכן לעגלות אותה מהירות. התנע נשמר:
          $V = \dfrac{1.0\cdot4.0}{4.0} = 1.0\,\text{m/s}$, מהירות מרכז המסה.
        wrongFeedback: 'מה המהירות היחסית של העגלות כשהקפיץ מפסיק להתכווץ? השתמשו בשימור התנע.'
        commonWrong:
          - value: 2.0
            feedback: 'זה הממוצע הפשוט של המהירויות. המהירות המשותפת היא ממוצע משוקלל במסות, ו-B כבדה פי 3.'
            misconception: MC-4-vcm-plain-average
          - value: 0
            feedback: >-
              אילו שתי העגלות היו נעצרות, התנע הכולל היה הופך לאפס. אין כוח חיצוני אופקי, ולכן הן ממשיכות יחד ימינה.
            misconception: MC-4-all-ke-lost

      - label: ב
        type: numeric
        points: 6
        level: mid
        objectives: [OBJ-4.2-2, OBJ-4.4-2]
        prompt: מה הכיווץ המרבי של הקפיץ?
        answer: 0.2
        unit: m
        correctFeedback: >-
          נכון. האנרגיה שנאגרת בקפיץ היא האנרגיה הזמינה, $\tfrac12\mu v_{\text{rel}}^2$, עם $\mu = \dfrac{1.0\cdot3.0}{4.0} = 0.75\,\text{kg}$:
          $\tfrac12\cdot0.75\cdot4.0^2 = 6.0\,\text{J}$. לכן $\tfrac12kx^2 = 6.0\,\text{J}$ ו-$x = \sqrt{\dfrac{2\cdot6.0}{300}} = 0.20\,\text{m}$.
          בדיקה: $8.0\,\text{J}$ לפני, ו-$\tfrac12\cdot4.0\cdot1.0^2 + 6.0 = 8.0\,\text{J}$ ברגע הכיווץ.
        wrongFeedback: >-
          השוו את האנרגיה הקינטית לפני ההתנגשות לאנרגיה ברגע הכיווץ המרבי: קינטית של שתי העגלות במהירות המשותפת, ועוד
          האנרגיה בקפיץ.
        commonWrong:
          - value: 0.231
            feedback: >-
              הנחתם שכל האנרגיה, $8.0\,\text{J}$, נאגרת בקפיץ. ברגע הכיווץ המרבי העגלות עדיין נעות ב-$1.0\,\text{m/s}$,
              ו-$2.0\,\text{J}$ נשארים בתנועה של מרכז המסה.
            misconception: MC-4-all-ke-lost
          - value: 0.04
            feedback: 'זה $x^2$, ביחידות $\text{m}^2$. הוציאו שורש.'

      - label: ג
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-4.2-1, OBJ-4.1-1]
        prompt: >-
          מצאו את המהירויות של שתי העגלות אחרי שהקפיץ חוזר לאורכו הרפוי. נמקו למה ההתנגשות אלסטית, ופתרו אותה
          במערכת מרכז המסה. בדקו את התוצאה בגבולות.
        hints:
          - 'כמה אנרגיה נשארת בקפיץ כשהוא חוזר לאורכו הרפוי?'
          - 'במערכת מרכז המסה, התנגשות אלסטית בממד אחד רק הופכת את הסימן של כל מהירות.'
        solution:
          - kind: law
            text: >-
              אין כוח חיצוני אופקי, ולכן התנע נשמר. כוח הקפיץ משמר, וכשהקפיץ חוזר לאורכו הרפוי האנרגיה שנאגרה בו
              חוזרת כולה לתנועה: האנרגיה הקינטית בסוף שווה לזו שבהתחלה, וההתנגשות אלסטית. במערכת מרכז המסה, התנגשות
              אלסטית בממד אחד הופכת את הסימן של כל מהירות.
          - kind: manipulation
            text: >-
              עם ציר ימינה, $V = 1.0\,\text{m/s}$. במערכת מרכז המסה $u_A = 4.0 - 1.0 = 3.0\,\text{m/s}$ ו-$u_B = 0 - 1.0 = -1.0\,\text{m/s}$.
              אחרי ההתנגשות $u_A' = -3.0\,\text{m/s}$ ו-$u_B' = 1.0\,\text{m/s}$. חזרה למעבדה, מוסיפים את $V$:
              $$v_A' = -3.0 + 1.0 = -2.0\,\text{m/s},\qquad v_B' = 1.0 + 1.0 = 2.0\,\text{m/s}$$
              בדיקה: תנע $1.0\cdot(-2.0) + 3.0\cdot2.0 = 4.0\,\text{kg}\cdot\text{m/s}$, ואנרגיה $\tfrac12\cdot1.0\cdot2.0^2 + \tfrac12\cdot3.0\cdot2.0^2 = 8.0\,\text{J}$, כמו בהתחלה.
          - kind: limit
            text: >-
              באופן כללי, $v_A' = \dfrac{m_A - m_B}{m_A + m_B}\,v$ ו-$v_B' = \dfrac{2m_A}{m_A + m_B}\,v$. כש-$m_B \to \infty$, B היא
              קיר: $v_A' \to -v$ ו-$v_B' \to 0$. כש-$m_B = m_A$, העגלות מחליפות מהירויות: A נעצרת ו-B יוצאת ב-$v$.
              המהירות היחסית מתהפכת: $v_B' - v_A' = 4.0\,\text{m/s}$, כמו מהירות ההתקרבות.
          - kind: units
            text: 'בכל ביטוי מהירות כפול יחס מסות חסר ממדים, ולכן התוצאות במטר לשנייה.'
          - kind: result
            text: >-
              אחרי שהקפיץ חוזר לאורכו, A נרתעת שמאלה ב-$2.0\,\text{m/s}$ ו-B נעה ימינה ב-$2.0\,\text{m/s}$. הקפיץ הקל
              עושה את ההתנגשות אלסטית, כי הוא מחזיר את כל האנרגיה שאגר.
        rubric:
          - text: נימקתי שההתנגשות אלסטית, כי הקפיץ משמר ומחזיר את כל האנרגיה כשהוא חוזר לאורכו הרפוי.
          - text: חסרתי $V$, הפכתי את הסימן של כל מהירות במערכת מרכז המסה, והוספתי $V$ בחזרה.
          - text: 'קיבלתי $v_A'' = -2.0\,\text{m/s}$ ו-$v_B'' = 2.0\,\text{m/s}$, ובדקתי שהתנע והאנרגיה נשמרים.'
          - text: בדקתי את הגבולות של B כבדה מאוד ושל מסות שוות.

      - label: ד
        type: numeric
        points: 6
        level: bagrut
        objectives: [OBJ-4.2-2]
        prompt: >-
          חוזרים על הניסוי, אבל הפעם B לא עומדת: היא נעה שמאלה, לקראת A, במהירות $2.0\,\text{m/s}$, ו-A נעה ימינה
          ב-$4.0\,\text{m/s}$ כמו קודם. מה הכיווץ המרבי של הקפיץ עכשיו?
        answer: 0.3
        unit: m
        correctFeedback: >-
          נכון. עכשיו $v_{\text{rel}} = 4.0 - (-2.0) = 6.0\,\text{m/s}$, והאנרגיה הזמינה $\tfrac12\mu v_{\text{rel}}^2 = \tfrac12\cdot0.75\cdot6.0^2 = 13.5\,\text{J}$.
          לכן $x = \sqrt{\dfrac{2\cdot13.5}{300}} = 0.30\,\text{m}$. הכיווץ תלוי רק במהירות היחסית: הוא כמו כיווץ שבו B עומדת
          ו-A נעה ב-$6.0\,\text{m/s}$. **בדיקת גבולות:** כש-B עומדת חוזרים ל-$0.20\,\text{m}$ של חלק ב.
        wrongFeedback: >-
          הכיווץ המרבי נקבע על ידי האנרגיה של התנועה היחסית. מה המהירות היחסית של העגלות כשהן נעות זו לקראת זו?
        commonWrong:
          - value: 0.2
            feedback: 'זה הכיווץ של חלק ב, כש-B עומדת. התנועה של B לקראת A מגדילה את המהירות היחסית.'
          - value: 0.1
            feedback: >-
              חיסרתם את הגדלים, $4.0 - 2.0$. העגלות נעות זו לקראת זו, ולכן המהירות היחסית היא סכום הגדלים, $6.0\,\text{m/s}$.
        hints:
          - 'האנרגיה הזמינה היא $\tfrac12\mu v_{\text{rel}}^2$, ו-$\mu$ לא השתנתה.'

  # ------------------------------------------------------------ 4: neutrons slowed by carbon nuclei
  - id: Q-4-bagrut-4
    type: bagrut
    title: האטת נייטרונים בפחמן
    prompt: >-
      בכור גרעיני מאטים נייטרונים מהירים בעזרת התנגשויות אלסטיות בגרעיני פחמן שעומדים בקירוב במנוחה. מסת גרעין
      הפחמן היא $M = 12m$, כאשר $m$ מסת הנייטרון. נייטרון נוצר עם אנרגיה קינטית של $2.0\,\text{MeV}$, וצריך להאט אותו
      עד $0.025\,\text{eV}$. כל ההתנגשויות אלסטיות.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-4.1-1]
        prompt: >-
          בהתנגשות **חזיתית** של נייטרון בגרעין פחמן, איזה חלק מהאנרגיה הקינטית שלו נשאר לנייטרון?
        answer: 0.716
        unit: ''
        correctFeedback: >-
          נכון. בהתנגשות אלסטית חזיתית $v_1' = \dfrac{m - M}{m + M}\,v = -\dfrac{11}{13}\,v$, והנייטרון נרתע לאחור. החלק
          מהאנרגיה שנשאר לו הוא $\left(\dfrac{11}{13}\right)^2 = 0.716$, ו-28% עוברים לגרעין.
        wrongFeedback: 'מצאו את מהירות הנייטרון אחרי התנגשות אלסטית חזיתית, וחשבו את היחס בין האנרגיות.'
        commonWrong:
          - value: 0.846
            feedback: 'זה היחס בין **המהירויות**, $11/13$. האנרגיה פרופורציונית לריבוע המהירות.'
          - value: 0.284
            feedback: 'זה החלק שעובר לגרעין, $\dfrac{4mM}{(m + M)^2}$. השאלה שואלת על החלק שנשאר לנייטרון.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        standalone: false
        objectives: [OBJ-4.1-1, OBJ-4.1-2]
        prompt: >-
          התנגשות חזיתית מאטה את הנייטרון יותר מכל התנגשות אחרת. מה המספר הקטן ביותר של התנגשויות שאחריו האנרגיה של
          הנייטרון יורדת מ-$2.0\,\text{MeV}$ אל $0.025\,\text{eV}$ או פחות?
        answer: 55
        unit: ''
        tolerance: 0.01
        correctFeedback: >-
          נכון. אחרי $N$ התנגשויות חזיתיות נשארת אנרגיה $0.716^N\cdot2.0\,\text{MeV}$. צריך
          $0.716^N \le \dfrac{0.025}{2.0\cdot10^6} = 1.25\cdot10^{-8}$, ולכן
          $N \ge \dfrac{\ln\left(1.25\cdot10^{-8}\right)}{\ln0.716} = 54.5$: לפחות 55 התנגשויות. בכור אמיתי רוב ההתנגשויות
          אינן חזיתיות, ולכן צריך יותר.
        wrongFeedback: >-
          בכל התנגשות האנרגיה נכפלת ב-0.716. כתבו את התנאי $0.716^N \le E_f/E_0$, וקחו לוגריתם. שימו לב ש-$\ln0.716 < 0$,
          ולכן הכיוון של אי-השוויון מתהפך כשמחלקים בו.
        commonWrong:
          - value: 109
            feedback: 'השתמשתם ביחס המהירויות, $11/13$, כגורם של האנרגיה. בכל התנגשות האנרגיה נכפלת בריבוע שלו, 0.716.'

      - label: ג
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-4.3-1, OBJ-4.2-1]
        prompt: >-
          בהתנגשות שאינה חזיתית, גרעין הפחמן נרתע בזווית $\varphi$ לכיוון התנועה ההתחלתי של הנייטרון. הראו שהחלק
          מהאנרגיה של הנייטרון שעובר לגרעין הוא
          $$f(\varphi) = \frac{4mM}{(m + M)^2}\cos^2\varphi$$
          ובדקו את הביטוי בגבולות.
        hints:
          - 'במערכת מרכז המסה, באיזו מהירות נע הגרעין לפני ההתנגשות, ובאיזו אחריה?'
          - 'במערכת המעבדה $\vec v_2'' = \vec V + \vec u_2''$, ושני הווקטורים באותו אורך. מה זה אומר על המשולש שהם יוצרים?'
        solution:
          - kind: law
            text: >-
              התנע נשמר, ולכן מרכז המסה נע במהירות קבועה $V = \dfrac{mv}{m + M}$. במערכת מרכז המסה הגרעין, שעמד
              במעבדה, נע לפני ההתנגשות במהירות $-\vec V$. בהתנגשות אלסטית הגודל נשמר, ולכן אחריה $|\vec u_2'| = V$,
              בכיוון כלשהו. חזרה למעבדה: $\vec v_2' = \vec V + \vec u_2'$.
          - kind: manipulation
            text: >-
              $\vec V$ ו-$\vec u_2'$ באותו אורך, $V$, ולכן המשולש שהם יוצרים עם $\vec v_2'$ שווה שוקיים, ו-$\vec v_2'$ חוצה
              את הזווית ביניהם. ההיטל של כל אחד מהם על כיוון $\vec v_2'$ הוא $V\cos\varphi$, ולכן
              $v_2' = 2V\cos\varphi = \dfrac{2mv\cos\varphi}{m + M}$. החלק מהאנרגיה:
              $$f = \frac{\tfrac12Mv_2'^2}{\tfrac12mv^2} = \frac{M}{m}\cdot\frac{4m^2\cos^2\varphi}{(m + M)^2} = \frac{4mM}{(m + M)^2}\cos^2\varphi$$
          - kind: limit
            text: >-
              כש-$\varphi = 0$, התנגשות חזיתית: $f = \dfrac{4mM}{(m + M)^2} = 1 - \left(\dfrac{M - m}{M + m}\right)^2 = 0.284$,
              בדיוק מה שהנייטרון איבד בחלק א. כש-$\varphi \to 90^\circ$, פגיעה משיקית: $f \to 0$, הגרעין כמעט לא זז.
              כש-$M = m$ ו-$\varphi = 0$: $f = 1$, הנייטרון נעצר ומוסר הכול, כמו במסות שוות. ובכל פגיעה $\varphi < 90^\circ$:
              המטרה תמיד נרתעת קדימה.
          - kind: units
            text: '$\dfrac{4mM}{(m + M)^2}$ הוא מסה בריבוע חלקי מסה בריבוע, ו-$\cos^2\varphi$ חסר ממדים: $f$ חסר ממדים, כמו שחלק צריך להיות.'
          - kind: result
            text: >-
              $f(\varphi) = \dfrac{4mM}{(m + M)^2}\cos^2\varphi$. לפחמן $\dfrac{4\cdot12}{13^2} = 0.284$ כפול $\cos^2\varphi$:
              הכי הרבה בפגיעה חזיתית, ושום דבר בפגיעה משיקית.
        rubric:
          - text: כתבתי שבמערכת מרכז המסה הגרעין נע לפני ההתנגשות ואחריה באותו גודל מהירות, $V = mv/(m + M)$.
          - text: חיברתי $\vec v_2' = \vec V + \vec u_2'$, וזיהיתי משולש שווה שוקיים שנותן $v_2' = 2V\cos\varphi$.
          - text: חישבתי את יחס האנרגיות וקיבלתי $f(\varphi)$.
          - text: בדקתי ש-$\varphi = 0$ מחזיר את התוצאה החזיתית של חלק א, ושפגיעה משיקית נותנת אפס.


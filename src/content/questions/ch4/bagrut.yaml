    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-3.5-2, OBJ-3.3-1]
        prompt: 'הגוש הקטן יוצא מתחתית המסילה במהירות שגודלה $v_1$. מה נכון?'
        choices:
          - text: '$v_1 < \sqrt{2gh}$: הגוש הגדול נרתע ימינה ולוקח חלק מהאנרגיה.'
            correct: true
            feedback: >-
              נכון. אין כוח חיצוני אופקי, ולכן רכיב $x$ של התנע נשאר אפס, והגוש הגדול נע ימינה כשהקטן נע שמאלה. האנרגיה
              $mgh$ מתחלקת בין שניהם: הכוח הנורמלי עושה עבודה שלילית על הגוש הקטן ועבודה חיובית, שווה בגודלה, על הגדול.
          - text: '$v_1 = \sqrt{2gh}$, כי המסילה חלקה, והכוח הנורמלי ניצב לה ולכן לא עושה עבודה.'
            feedback: >-
              הנורמלי ניצב למסילה, אבל המסילה זזה: התזוזה של הגוש הקטן ביחס לרצפה איננה לאורך המסילה, ולכן הנורמלי
              עושה עליו עבודה, שלילית. רק העבודה הכוללת של זוג הכוחות הנורמליים בין הגושים אפס.
            misconception: MC-3-moving-surface-no-work
          - text: '$v_1 > \sqrt{2gh}$, כי הגוש הגדול נרתע ודוחף את הקטן קדימה.'
            feedback: >-
              כל האנרגיה במערכת היא $mgh$. אילו $v_1 > \sqrt{2gh}$, לגוש הקטן לבדו הייתה יותר אנרגיה מזה, ולגדול גם
              אנרגיה קינטית משלו.
          - text: 'אי אפשר לדעת בלי לדעת את הצורה של המסילה.'
            feedback: >-
              הצורה קובעת איך הגושים נעים בדרך, אבל לא את המצב בסוף: רכיב $x$ של התנע ושימור האנרגיה נותנים שתי משוואות
              לשני הנעלמים, $v_1$ ו-$V_1$, בכל צורה של מסילה שמסתיימת אופקית.

      - label: ב
        type: open
        points: 7
        level: mid
        objectives: [OBJ-3.5-2, OBJ-3.3-1, OBJ-4.4-2]
        prompt: >-
          בטאו באמצעות $m$, $M$, $g$ ו-$h$ את גודל המהירות $v_1$ של הגוש הקטן ואת גודל המהירות $V_1$ של הגוש הגדול ברגע
          שהגוש הקטן יוצא מתחתית המסילה. בדקו את התוצאה בגבולות $M \to \infty$ ו-$M = m$ ואת היחידות שלה.
        hints:
          - 'אילו רכיבים של כוח חיצוני פועלים על שני הגושים יחד? איזה רכיב של התנע נשמר?'
          - 'בתחתית המסילה אופקית. מה זה אומר על הכיוון של מהירות הגוש הקטן שם?'
        solution:
          - kind: law
            text: >-
              על שני הגושים יחד פועלים מבחוץ רק הכובד והכוח הנורמלי של הרצפה, ושניהם אנכיים. לכן רכיב $x$ של התנע נשמר,
              ונשאר אפס. האנרגיה המכנית נשמרת: אין חיכוך, והעבודה הכוללת של זוג הכוחות הנורמליים בין הגושים אפס, כי
              התנועה היחסית היא לאורך המסילה, ניצבת להם (שיעור 3.5).
          - kind: manipulation
            text: >-
              בתחתית המסילה אופקית, ולכן גם מהירות הגוש הקטן אופקית: הוא נע שמאלה ב-$v_1$, והגדול ימינה ב-$V_1$.
              תנע: $MV_1 - mv_1 = 0$, כלומר $V_1 = \dfrac mM\,v_1$. אנרגיה:
              $mgh = \tfrac12mv_1^2 + \tfrac12MV_1^2 = \tfrac12mv_1^2\left(1 + \dfrac mM\right)$. לכן
              $$v_1 = \sqrt{\frac{2ghM}{m + M}},\qquad V_1 = \frac mM\sqrt{\frac{2ghM}{m + M}}$$
          - kind: limit
            text: >-
              כש-$M \to \infty$: $v_1 \to \sqrt{2gh}$ ו-$V_1 \to 0$: מסילה קבועה, וכל האנרגיה לגוש הקטן. כש-$M = m$:
              $v_1 = V_1 = \sqrt{gh}$, והאנרגיה מתחלקת שווה בשווה. ותמיד $v_1 < \sqrt{2gh}$, כמו בחלק א.
          - kind: units
            text: '$\dfrac{M}{m + M}$ חסר ממדים, ו-$gh$ ביחידות $\text{m/s}^2\cdot\text{m} = \text{m}^2/\text{s}^2$, ולכן השורש במטר לשנייה.'
          - kind: result
            text: >-
              $v_1 = \sqrt{\dfrac{2ghM}{m + M}}$ שמאלה ו-$V_1 = \dfrac mM\,v_1$ ימינה: מרכז המסה של שני הגושים לא זז
              אופקית.
        rubric:
          - text: כתבתי שימור של רכיב $x$ של התנע ושל האנרגיה המכנית, ונימקתי למה כל אחד מהם נשמר.
          - text: השתמשתי בכך שבתחתית המסילה מהירות הגוש הקטן אופקית.
          - text: קיבלתי $v_1 = \sqrt{2ghM/(m + M)}$ ו-$V_1 = (m/M)v_1$.
          - text: בדקתי ש-$M \to \infty$ מחזיר את $\sqrt{2gh}$ של מסילה קבועה, ואת המקרה $M = m$.

      - label: ג
        type: mc
        points: 4
        level: mid
        qualitative: true
        standalone: false
        objectives: [OBJ-4.1-1, OBJ-4.4-1]
        prompt: 'הגוש הקטן נרתע מהקיר ונע ימינה, אחרי הגוש הגדול. באיזה תנאי הוא מגיע שוב אל המסילה?'
        choices:
          - text: 'רק אם $M > m$.'
            correct: true
            feedback: >-
              נכון. בהתנגשות אלסטית חזיתית בקיר קבוע (מסה אין-סופית) המהירות מתהפכת, והגוש הקטן חוזר ימינה ב-$v_1$.
              הגוש הגדול נע ימינה ב-$V_1 = (m/M)v_1$, והקטן משיג אותו רק אם $v_1 > V_1$, כלומר $M > m$. כש-$M = m$
              הם נעים באותה מהירות, והמרחק ביניהם לא משתנה.
          - text: 'תמיד: אחרי הקיר הגוש הקטן נע ימינה, לכיוון הגוש הגדול.'
            feedback: >-
              גם הגוש הגדול נע ימינה, ב-$V_1 = (m/M)v_1$. הקטן מגיע אליו רק אם הוא מהיר ממנו. כשהגוש הגדול קל מהקטן,
              הוא נרתע מהר יותר, והקטן לעולם לא ישיג אותו.
          - text: 'רק אם $M < m$, כי אז הגוש הגדול נע לאט.'
            feedback: 'הפוך: $V_1 = (m/M)v_1$, ולכן גוש גדול **קל** נרתע **מהר**. גוש כבד נרתע לאט, והקטן משיג אותו.'
          - text: 'אף פעם: התנע של שני הגושים יחד היה אפס, ולכן הם לא יכולים להתקרב שוב.'
            feedback: >-
              הקיר הוא כוח חיצוני על המערכת. בהתנגשות הקצרה בו הכוח שלו גדל כמו כל כוח בהתנגשות, והמתקף שלו לא זניח: הוא
              משנה את התנע של המערכת מאפס ל-$2mv_1$ ימינה.
            misconception: MC-4-external-always-negligible

      - label: ד
        type: open
        points: 10
        level: bagrut
        standalone: false
        objectives: [OBJ-4.2-2, OBJ-4.4-2, OBJ-3.5-2]
        prompt: >-
          נניח $M > m$. הגוש הקטן משיג את הגוש הגדול ועולה במסילה.

          (1) מצאו את המהירות המשותפת $u$ של שני הגושים ברגע שבו הגוש הקטן מגיע לגובה המרבי שלו במסילה, באמצעות
          $m$, $M$ ו-$v_1$.

          (2) הראו שהגובה המרבי הזה הוא
          $$h' = h\left(\frac{M - m}{M + m}\right)^2$$

          (3) בדקו את התוצאה בגבולות $M \to \infty$ ו-$M \to m$ ואת היחידות שלה.
        hints:
          - 'הקיר שינה את התנע של המערכת. מאיזה רגע והלאה רכיב $x$ של התנע שוב נשמר, ומה ערכו?'
          - 'בגובה המרבי הגוש הקטן נח ביחס למסילה. מה זה אומר על המהירויות של שני הגושים?'
          - 'אפשר בשתי דרכים: אנרגיה במעבדה, או האנרגיה הזמינה $\tfrac12\mu v_{\text{rel}}^2$ של שיעור 4.2.'
        solution:
          - kind: law
            text: >-
              מהרגע שהגוש הקטן עוזב את הקיר אין כוח חיצוני אופקי, ולכן רכיב $x$ של התנע שוב נשמר, אבל בערך חדש: הקיר
              שינה אותו. האנרגיה המכנית נשמרת לאורך כל הדרך (הקיר אלסטי, והמסילה חלקה), ולכן היא עדיין $mgh$. בגובה
              המרבי הגוש הקטן נח ביחס למסילה, ולכן לשני הגושים אותה מהירות אופקית $u$.
          - kind: manipulation
            text: >-
              אחרי הקיר שני הגושים נעים ימינה: הקטן ב-$v_1$ והגדול ב-$V_1 = \dfrac mM\,v_1$. התנע $mv_1 + MV_1 = 2mv_1$, ולכן
              $$u = \frac{2mv_1}{m + M}$$
          - kind: manipulation
            text: >-
              אנרגיה בגובה המרבי: $mgh = \tfrac12(m + M)u^2 + mgh'$. עם $v_1^2 = \dfrac{2ghM}{m + M}$ מחלק ב:
              $\tfrac12(m + M)u^2 = \dfrac{2m^2v_1^2}{m + M} = \dfrac{4m^2Mgh}{(m + M)^2}$. לכן
              $$mgh' = mgh\,\frac{(m + M)^2 - 4mM}{(m + M)^2} = mgh\left(\frac{M - m}{M + m}\right)^2$$
          - kind: manipulation
            text: >-
              בדרך האנרגיה הזמינה: המהירות היחסית $v_1 - V_1 = v_1\dfrac{M - m}{M}$, ובגובה המרבי התנועה היחסית נעצרת,
              ולכן $mgh' = \tfrac12\mu\left(v_1 - V_1\right)^2$ עם $\mu = \dfrac{mM}{m + M}$:
              $\tfrac12\cdot\dfrac{mM}{m + M}\cdot\dfrac{2ghM}{m + M}\cdot\dfrac{(M - m)^2}{M^2} = mgh\left(\dfrac{M - m}{M + m}\right)^2$, אותה תוצאה.
          - kind: limit
            text: >-
              כש-$M \to \infty$: $h' \to h$ ו-$u \to 0$: מסילה קבועה וקיר אלסטי, והגוש חוזר לגובה שממנו יצא. כש-$M \to m$:
              $h' \to 0$ ו-$u \to v_1$: הגוש הקטן בקושי משיג את המסילה, כמו בחלק ג. ותמיד $h' < h$: חלק מהאנרגיה נשאר
              בתנועה של מרכז המסה, שהקיר נתן לה.
          - kind: units
            text: '$\left(\dfrac{M - m}{M + m}\right)^2$ חסר ממדים, ולכן $h''$ במטרים, כמו $h$; ו-$u$ הוא מהירות כפול יחס מסות.'
          - kind: result
            text: >-
              $u = \dfrac{2mv_1}{m + M}$ ו-$h' = h\left(\dfrac{M - m}{M + m}\right)^2$. למשל, כש-$M = 3m$ הגוש הקטן עולה רק
              לרבע מהגובה ההתחלתי.
        rubric:
          - text: השתמשתי בשימור רכיב $x$ של התנע מהרגע שאחרי הקיר, עם התנע החדש $2mv_1$, ולא עם אפס.
          - text: זיהיתי שבגובה המרבי לשני הגושים אותה מהירות, וקיבלתי $u = 2mv_1/(m + M)$.
          - text: >-
              כתבתי שימור אנרגיה (או את האנרגיה הזמינה $\tfrac12\mu v_{\text{rel}}^2$) וקיבלתי
              $h' = h\left(\dfrac{M - m}{M + m}\right)^2$.
          - text: בדקתי את הגבולות $M \to \infty$ (מתקבל $h$) ו-$M \to m$ (מתקבל אפס), ואת היחידות.

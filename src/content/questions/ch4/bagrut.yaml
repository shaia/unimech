chapter: 4
questions:
  # ------------------------------------------------------------ 1: a 2D elastic collision in the lab and CM frames
  - id: Q-4-bagrut-1
    type: bagrut
    title: דיסקית כבדה פוגעת בדיסקית קלה
    prompt: >-
      על שולחן אוויר אופקי, דיסקית בעלת מסה $m_1 = 0.20\,\text{kg}$ נעה במהירות $v = 3.0\,\text{m/s}$ ופוגעת, לא
      במרכז, בדיסקית בעלת מסה $m_2 = 0.10\,\text{kg}$ שעומדת במנוחה. ההתנגשות אלסטית, והחיכוך והסיבוב של הדיסקיות
      זניחים. הנקודה שבה הדיסקיות נוגעות זו בזו משתנה מניסוי לניסוי, ואיתה זווית הפיזור $\theta$ של הדיסקית הכבדה.
    parts:
      - label: א
        type: numeric
        points: 4
        level: basic
        objectives: [OBJ-4.2-1]
        prompt: מה גודל המהירות של מרכז המסה של שתי הדיסקיות?
        answer: 2.0
        unit: m/s
        correctFeedback: >-
          נכון. $V = \dfrac{m_1v}{m_1 + m_2} = \dfrac{0.20\cdot3.0}{0.30} = 2.0\,\text{m/s}$, בכיוון של $\vec v$. היא לא
          משתנה בהתנגשות, בכל נקודה שבה הדיסקיות ייגעו.
        wrongFeedback: 'מהירות מרכז המסה היא התנע הכולל חלקי המסה הכוללת.'
        commonWrong:
          - value: 1.5
            feedback: 'זה הממוצע הפשוט של המהירויות. מהירות מרכז המסה היא ממוצע משוקלל במסות.'
            misconception: MC-4-vcm-plain-average
          - value: 1.0
            feedback: 'כפלתם את המהירות במסה של הדיסקית העומדת. כל מהירות נכפלת במסה של הגוף שלה.'

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-4.2-2]
        prompt: >-
          כמה מהאנרגיה הקינטית של הדיסקיות שייכת לתנועה היחסית, כלומר זמינה בהתנגשות?
        answer: 0.3
        unit: J
        correctFeedback: >-
          נכון. $\mu = \dfrac{0.20\cdot0.10}{0.30} = 0.0667\,\text{kg}$, ו-$\tfrac12\mu v^2 = \tfrac12\cdot0.0667\cdot3.0^2 = 0.30\,\text{J}$.
          השאר, $\tfrac12(m_1 + m_2)V^2 = 0.60\,\text{J}$, שייך למרכז המסה, והסכום $0.90\,\text{J}$ הוא $\tfrac12m_1v^2$.
          ההתנגשות אלסטית, ולכן גם האנרגיה הזמינה לא אובדת: היא רק מחליפה כיוון.
        wrongFeedback: 'חשבו את המסה המצומצמת. המהירות היחסית היא $3.0\,\text{m/s}$, כי הדיסקית השנייה עומדת.'
        commonWrong:
          - value: 0.9
            feedback: 'זו כל האנרגיה הקינטית. $0.60\,\text{J}$ ממנה שייכים לתנועה של מרכז המסה, ותמיד נשארים בה.'
            misconception: MC-4-all-ke-lost
          - value: 0.6
            feedback: 'זו האנרגיה של מרכז המסה, $\tfrac12(m_1 + m_2)V^2$. השאלה שואלת על החלק השני.'
          - value: 1.35
            feedback: 'הצבתם את המסה הכוללת במקום המסה המצומצמת, $\mu = \dfrac{m_1m_2}{m_1 + m_2}$.'

      - label: ג
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-4.3-2, OBJ-4.2-1]
        prompt: >-
          בשיעור 4.3 מצאנו שזווית הפיזור של הדיסקית הכבדה לא עוברת זווית מרבית $\theta_{\max}$, שבה
          $\sin\theta_{\max} = \dfrac{m_2}{m_1}$, ושבה המהירות $\vec v_1'$ של הדיסקית הכבדה משיקה למעגל המהירויות; מותר
          להשתמש בזה. בניסוי אחד הדיסקית הכבדה מוסטת בדיוק בזווית $\theta_{\max}$.

          (1) הראו שבמערכת מרכז המסה הדיסקית הקלה נעה, לפני ההתנגשות ואחריה, במהירות שגודלה $V$, מהירות מרכז המסה.

          (2) הראו שבניסוי הזה הזווית בין המסלולים של שתי הדיסקיות אחרי ההתנגשות היא $45^\circ + \tfrac12\theta_{\max}$.

          (3) בדקו את התוצאה בגבולות $m_2 \to m_1$ ו-$m_2 \to 0$, וחשבו אותה לדיסקיות שלנו.
        hints:
          - >-
            במערכת מרכז המסה $m_1\vec u_1' + m_2\vec u_2' = 0$. מה זה אומר על הכיוון של $\vec u_2'$ ביחס לכיוון של
            $\vec u_1'$?
          - >-
            בזווית המרבית $\vec v_1'$ ניצב ל-$\vec u_1'$. ואחר כך $\vec v_2' = \vec V + \vec u_2'$, ושני הווקטורים באותו
            אורך: איזה משולש הם יוצרים?
          - >-
            דרך קצרה: בדוגמה 6 של שיעור 4.3 מצאנו שבזווית המרבית $\cos2\varphi = m_2/m_1$, כאשר $\varphi$ הזווית בין
            הכיוון של $\vec v$ לקו המרכזים ברגע המגע. לאורך איזה קו יוצאת הדיסקית הקלה, שעמדה? והשוו את $\cos2\varphi$
            ל-$\sin\theta_{\max}$.
        solution:
          - kind: law
            text: >-
              התנע הכולל נשמר, ולכן מרכז המסה נע במהירות קבועה $\vec V$, ומערכת מרכז המסה אינרציאלית. בה התנע הכולל
              אפס, ובהתנגשות אלסטית כל מהירות במערכת הזו שומרת על גודלה ורק מסתובבת (שיעור 4.3). החזרה למעבדה:
              $\vec v_i' = \vec V + \vec u_i'$.
          - kind: manipulation
            text: >-
              (1) הדיסקית הקלה עומדת במעבדה, ולכן במערכת מרכז המסה היא נעה לפני ההתנגשות במהירות $\vec u_2 = -\vec V$,
              שגודלה $V$. אחרי ההתנגשות הגודל לא משתנה: $u_2' = V$.
          - kind: manipulation
            text: >-
              (2) ציר $x$ בכיוון $\vec V$, ציר $y$ לצד שאליו מוסטת הדיסקית הכבדה. בזווית המרבית $\vec v_1'$ נמצא
              ב-$\theta_{\max}$ מעל ציר $x$ ומשיק למעגל, ולכן $\vec u_1'$, הרדיוס, ניצב לו. נסתכל על המשולש שקודקודיו
              הראשית $O$, הקצה $C$ של $\vec V$ (מרכז המעגל) והקצה $P$ של $\vec v_1'$: הזווית ב-$P$ ישרה והזווית ב-$O$ היא
              $\theta_{\max}$, ולכן הזווית ב-$C$ היא $90^\circ - \theta_{\max}$. הצלע $CO$ מצביעה לכיוון $180^\circ$, ו-$P$ מעל
              ציר $x$, ולכן $\vec u_1'$, מ-$C$ אל $P$, מצביע לכיוון $180^\circ - \left(90^\circ - \theta_{\max}\right) = 90^\circ + \theta_{\max}$.
              מהתנע במערכת מרכז המסה, $\vec u_2' = -\dfrac{m_1}{m_2}\,\vec u_1'$, בכיוון ההפוך:
              $90^\circ - \theta_{\max}$ מתחת לציר $x$.
          - kind: manipulation
            text: >-
              $\vec v_2' = \vec V + \vec u_2'$, ושני הווקטורים באורך $V$: המשולש שווה שוקיים, ו-$\vec v_2'$ חוצה את
              הזווית ביניהם. לכן הדיסקית הקלה נעה בזווית $\varphi = \tfrac12\left(90^\circ - \theta_{\max}\right)$ מתחת
              לציר $x$, והזווית בין המסלולים היא
              $$\theta_{\max} + \varphi = 45^\circ + \tfrac12\theta_{\max}$$
          - kind: limit
            text: >-
              כש-$m_2 \to m_1$: $\theta_{\max} \to 90^\circ$, והזווית בין המסלולים שואפת ל-$90^\circ$, הזווית הישרה של
              מסות שוות. כש-$m_2 \to 0$: $\theta_{\max} \to 0$, הפוגע לא סוטה, והמטרה הזעירה יוצאת ב-$45^\circ$, כמו
              $b^* \to D/\sqrt2$ בדוגמה 6 של שיעור 4.3.
          - kind: units
            text: >-
              כל האיברים זוויות; $\sin\theta_{\max}$ הוא יחס של שתי מסות, חסר ממדים, ו-$u_2' = V$ הוא שוויון בין שתי
              מהירויות.
          - kind: substitution
            text: >-
              $\theta_{\max} = 30^\circ$, ולכן הדיסקית הקלה יוצאת ב-$\varphi = 30^\circ$ לצד השני, והזווית בין המסלולים
              $45^\circ + 15^\circ = 60^\circ$.
          - kind: result
            text: >-
              בזווית הפיזור המרבית הזווית בין המסלולים היא $45^\circ + \tfrac12\theta_{\max}$; לדיסקיות שלנו $60^\circ$,
              פחות מהזווית הישרה של מסות שוות.
        rubric:
          - text: נימקתי שהדיסקית הקלה נעה במערכת מרכז המסה ב-$V$, לפני ההתנגשות ואחריה.
          - text: >-
              השתמשתי בכך שבזווית המרבית $\vec v_1'$ ניצב ל-$\vec u_1'$, ושהכיוון של $\vec u_2'$ הפוך לכיוון של
              $\vec u_1'$.
          - text: >-
              מצאתי שהדיסקית הקלה נעה ב-$45^\circ - \tfrac12\theta_{\max}$ לצד השני, מהמשולש שווה השוקיים, או בדרך שקולה:
              המטרה יוצאת לאורך קו המרכזים, או שימור התנע ברכיבים עם $v_1' = V\cos\theta_{\max}$.
          - text: קיבלתי שהזווית בין המסלולים היא $45^\circ + \tfrac12\theta_{\max}$.
          - text: בדקתי את הגבולות $m_2 \to m_1$ ו-$m_2 \to 0$, וחישבתי $60^\circ$.

      - label: ד
        type: open
        points: 7
        level: bagrut
        standalone: false
        objectives: [OBJ-4.3-2, OBJ-4.3-1, OBJ-4.2-1]
        prompt: >-
          באותו ניסוי, שבו הדיסקית הכבדה מוסטת בדיוק בזווית הפיזור המרבית. בחלק ג מצאנו שהדיסקית הקלה יוצאת בזווית
          $\varphi = 45^\circ - \tfrac12\theta_{\max}$ מתחת לכיוון של $\vec v$, לצד השני.

          (1) בטאו את גודל המהירות $v_2'$ של הדיסקית הקלה אחרי ההתנגשות באמצעות $v$, $m_1$ ו-$m_2$ בלבד, ובדקו שהאנרגיה
          הקינטית של שתי הדיסקיות שווה לזו שלפני ההתנגשות.

          (2) בדקו את הביטוי בגבולות $m_2 \to m_1$ ו-$m_2 \to 0$ ואת היחידות שלו, וחשבו את $v_2'$ לדיסקיות שלנו.
        hints:
          - >-
            במשולש שווה השוקיים של חלק ג, $\vec v_2' = \vec V + \vec u_2'$, ושני הווקטורים באורך $V$: ההיטל של כל אחד
            מהם על הכיוון של $\vec v_2'$ הוא $V\cos\varphi$. אל תעצרו ב-$V$ עצמו: זו המהירות של הדיסקית הקלה במערכת
            מרכז המסה, לא במעבדה.
          - '$2\cos^2\alpha = 1 + \cos2\alpha$, ו-$\cos\left(90^\circ - \theta_{\max}\right) = \sin\theta_{\max}$.'
        solution:
          - kind: law
            text: >-
              מחלק ג: $\vec v_2' = \vec V + \vec u_2'$ עם $u_2' = V = \dfrac{m_1v}{m_1 + m_2}$, והדיסקית הקלה יוצאת בזווית
              $\varphi = 45^\circ - \tfrac12\theta_{\max}$ לצד השני, כאשר $\sin\theta_{\max} = m_2/m_1$. הדיסקית הכבדה
              משיקה למעגל המהירויות, ולכן $v_1' = V\cos\theta_{\max}$.
          - kind: manipulation
            text: >-
              במשולש שווה השוקיים $v_2' = 2V\cos\varphi$, ולכן
              $$v_2'^2 = 4V^2\cos^2\varphi = 2V^2\left[1 + \cos\left(90^\circ - \theta_{\max}\right)\right] = 2V^2\left(1 + \frac{m_2}{m_1}\right)$$
              עם $V = \dfrac{m_1v}{m_1 + m_2}$: $v_2'^2 = \dfrac{2m_1^2v^2}{(m_1 + m_2)^2}\cdot\dfrac{m_1 + m_2}{m_1}$, כלומר
              $$v_2' = v\sqrt{\frac{2m_1}{m_1 + m_2}}$$
          - kind: manipulation
            text: >-
              בדיקת אנרגיה: $\tfrac12m_1v_1'^2 = \tfrac12m_1V^2\left(1 - \dfrac{m_2^2}{m_1^2}\right) = \tfrac12m_1v^2\,\dfrac{m_1 - m_2}{m_1 + m_2}$,
              ו-$\tfrac12m_2v_2'^2 = \tfrac12m_1v^2\,\dfrac{2m_2}{m_1 + m_2}$. הסכום $\tfrac12m_1v^2\,\dfrac{m_1 - m_2 + 2m_2}{m_1 + m_2} = \tfrac12m_1v^2$,
              האנרגיה שלפני ההתנגשות, כמו שצריך בהתנגשות אלסטית.
          - kind: limit
            text: >-
              כש-$m_2 \to m_1$: $v_2' \to v$, ו-$\theta_{\max} \to 90^\circ$ עם $v_1' = V\cos90^\circ = 0$: הדיסקית הכבדה
              נעצרת ומוסרת הכול, כמו בפגיעה חזיתית של מסות שוות. כש-$m_2 \to 0$: $v_2' \to \sqrt2\,v$, ב-$45^\circ$: עכשיו
              $\theta_{\max} \to 0$, ולכן $\vec u_2'$ ניצב ל-$\vec V$, ושניהם באורך $V \to v$, והסכום שלהם הוא האלכסון של ריבוע.
          - kind: units
            text: '$\dfrac{2m_1}{m_1 + m_2}$ הוא יחס של מסות, חסר ממדים, ולכן $v_2''$ במטר לשנייה, כמו $v$.'
          - kind: substitution
            text: >-
              $v_2' = 3.0\sqrt{\dfrac{0.40}{0.30}} = 3.46\,\text{m/s}$, ב-$30^\circ$ לצד השני; $v_1' = 2.0\cos30^\circ = 1.73\,\text{m/s}$.
              אנרגיה: $\tfrac12\cdot0.20\cdot1.73^2 + \tfrac12\cdot0.10\cdot3.46^2 = 0.30 + 0.60 = 0.90\,\text{J}$, ותנע ברכיב $y$:
              $0.20\cdot1.73\sin30^\circ - 0.10\cdot3.46\sin30^\circ = 0$.
          - kind: result
            text: >-
              $v_2' = v\sqrt{\dfrac{2m_1}{m_1 + m_2}} = 3.46\,\text{m/s}$: יותר מ-$v$, אבל פחות מ-$4.0\,\text{m/s}$ של פגיעה
              חזיתית. הדיסקית הקלה מקבלת $\dfrac{2m_2}{m_1 + m_2} = \tfrac23$ מהאנרגיה.
        rubric:
          - text: השתמשתי במשולש שווה השוקיים של חלק ג וכתבתי $v_2' = 2V\cos\varphi$, לא $V$ לבד.
          - text: פישטתי בעזרת $\sin\theta_{\max} = m_2/m_1$ וקיבלתי $v_2' = v\sqrt{2m_1/(m_1 + m_2)}$.
          - text: בדקתי שסכום האנרגיות הקינטיות אחרי ההתנגשות הוא $\tfrac12m_1v^2$.
          - text: בדקתי את הגבולות $m_2 \to m_1$ (מתקבל $v$) ו-$m_2 \to 0$ (מתקבל $\sqrt2\,v$), וחישבתי $3.46\,\text{m/s}$.

  # ------------------------------------------------------------ 2: a ballistic pendulum and a bouncing ball
  - id: Q-4-bagrut-2
    type: bagrut
    title: מטוטלת בליסטית וכדור שנרתע
    prompt: >-
      גוש עץ בעל מסה $M = 0.98\,\text{kg}$ תלוי על שני חוטים ארוכים, קלים ומקבילים. קליע בעל מסה $m = 20\,\text{g}$
      נע אופקית, נתקע בגוש, והגוש עם הקליע עולה לגובה $h = 0.20\,\text{m}$ מעל נקודת ההתחלה. ההתנגשות קצרה מאוד.
      התנגדות האוויר זניחה.
    parts:
      - label: א
        type: mc
        points: 4
        level: basic
        qualitative: true
        objectives: [OBJ-4.4-1]
        prompt: מה נשמר בין הרגע שלפני ההתנגשות לרגע שמיד אחריה?
        choices:
          - text: התנע של הקליע והגוש, אבל לא האנרגיה הקינטית שלהם.
            correct: true
            feedback: >-
              נכון. המתקף של הכובד ושל החוטים בזמן ההתנגשות הקצר זניח, ולכן התנע נשמר. ההתנגשות פלסטית, ולכן רוב
              האנרגיה הקינטית הופכת לחום ולעיוות.
          - text: גם התנע וגם האנרגיה הקינטית.
            feedback: >-
              אילו האנרגיה הקינטית נשמרה, הקליע היה צריך להירתע מהגוש, כמו בהתנגשות אלסטית. כשהוא נתקע, ההתנגשות פלסטית.
            misconception: MC-4-energy-through-collision
          - text: האנרגיה הקינטית בלבד; התנע לא נשמר, כי כוח הכובד פועל על הגוש.
            feedback: >-
              הכובד אכן פועל, אבל המתקף שלו בזמן ההתנגשות, $(m + M)g\,\Delta t$, זניח. ודווקא האנרגיה הקינטית היא זו
              שלא נשמרת.
            misconception: MC-4-finite-force-spoils-momentum
          - text: שום דבר. החוטים מושכים את הגוש ומשנים את התנע שלו.
            feedback: >-
              בזמן ההתנגשות החוטים אנכיים, והם לא מפעילים כוח אופקי. הם משנים את התנע של הגוש רק בעלייה, בזמן ארוך.

      - label: ב
        type: numeric
        points: 5
        level: mid
        objectives: [OBJ-4.4-1, OBJ-4.4-2]
        prompt: מה הייתה מהירות הקליע לפני ההתנגשות?
        answer: 99.0
        unit: m/s
        correctFeedback: >-
          נכון. בעלייה: $V = \sqrt{2gh} = \sqrt{2\cdot9.8\cdot0.20} = 1.98\,\text{m/s}$. בהתנגשות:
          $v = \dfrac{m + M}{m}\,V = \dfrac{1.00}{0.020}\cdot1.98 = 99.0\,\text{m/s}$.
        wrongFeedback: >-
          התחילו מהסוף. גובה העלייה נותן את מהירות הגוש עם הקליע מיד אחרי ההתנגשות; שימור התנע בהתנגשות נותן את מהירות
          הקליע.
        commonWrong:
          - value: 14.0
            feedback: >-
              השוויתם את האנרגיה של הקליע ל-$(m + M)gh$. האנרגיה נשמרת רק בעלייה, אחרי ההתנגשות; בהתנגשות עצמה נשמר
              רק התנע.
            misconception: MC-4-energy-through-collision
          - value: 1.98
            feedback: 'זו מהירות הגוש עם הקליע מיד אחרי ההתנגשות. מהירות הקליע גדולה ממנה פי $(m + M)/m = 50$.'

      - label: ג
        type: open
        points: 7
        level: mid
        objectives: [OBJ-4.1-2, OBJ-4.4-2]
        prompt: >-
          (1) בטאו באמצעות $m$, $M$, $g$ ו-$h$ את האנרגיה הקינטית $Q_{\text{th}}$ שהפכה לחום ולעיוות בהתנגשות, והראו שהיא
          החלק $\dfrac{M}{m + M}$ מהאנרגיה הקינטית של הקליע.

          (2) בדקו את התוצאה בגבולות $M \to 0$ ו-$m \ll M$ ואת היחידות שלה, וחשבו את $Q_{\text{th}}$.
        hints:
          - >-
            התחילו מהסוף: גובה העלייה נותן את מהירות הגוש עם הקליע מיד אחרי ההתנגשות, ושימור התנע בהתנגשות נותן את
            מהירות הקליע. אחר כך כתבו את שתי האנרגיות הקינטיות, וחסרו.
        solution:
          - kind: law
            text: >-
              בהתנגשות הקצרה התנע נשמר: $mv = (m + M)V$. אחריה, בעלייה, האנרגיה המכנית נשמרת:
              $\tfrac12(m + M)V^2 = (m + M)gh$. האנרגיה שהפכה לחום היא ההפרש בין האנרגיה הקינטית לפני ההתנגשות לזו שמיד
              אחריה.
          - kind: manipulation
            text: >-
              $V = \sqrt{2gh}$ ו-$v = \dfrac{m + M}{m}V$. לפני: $K_0 = \tfrac12mv^2 = \dfrac{(m + M)^2}{2m}V^2 = \dfrac{(m + M)^2gh}{m}$.
              אחרי: $K_1 = (m + M)gh$. לכן
              $$Q_{\text{th}} = K_0 - K_1 = (m + M)gh\left(\frac{m + M}{m} - 1\right) = \frac Mm\,(m + M)gh$$
              והחלק: $\dfrac{Q_{\text{th}}}{K_0} = \dfrac{M(m + M)gh/m}{(m + M)^2gh/m} = \dfrac{M}{m + M}$.
          - kind: limit
            text: >-
              כש-$M \to 0$: $Q_{\text{th}} \to 0$. אין במה להיתקע, והקליע עולה לבדו לגובה $h = v^2/(2g)$. כש-$m \ll M$: החלק
              $\dfrac{M}{m + M} \to 1$: כמעט כל האנרגיה של הקליע הופכת לחום, ורק החלק הזעיר $m/(m + M)$ מרים את הגוש.
              זו הסיבה שמטוטלת בליסטית מודדת את מהירות הקליע דרך התנע ולא דרך האנרגיה.
          - kind: units
            text: '$\dfrac Mm$ חסר ממדים, ו-$(m + M)gh$ ביחידות $\text{kg}\cdot\text{m/s}^2\cdot\text{m} = \text{J}$.'
          - kind: substitution
            text: >-
              $Q_{\text{th}} = \dfrac{0.98}{0.020}\cdot1.00\cdot9.8\cdot0.20 = 49\cdot1.96 = 96.0\,\text{J}$. בדיקה: $K_0 = \tfrac12\cdot0.020\cdot99.0^2 = 98.0\,\text{J}$,
              $K_1 = 1.96\,\text{J}$, וההפרש $96.0\,\text{J}$, שהם $98\%$, בדיוק $\dfrac{0.98}{1.00}$. ושתי טעויות שהחשבון
              הזה מונע: מי שמשווה את האנרגיה של הקליע ל-$(m + M)gh$ מניח שהאנרגיה עוברת את ההתנגשות בשלמותה, ומקבל מהירות
              קליע קטנה פי 7; ומי שמניח שכל $98.0\,\text{J}$ אבדו שוכח שהגוש בכל זאת עולה.
          - kind: result
            text: >-
              $Q_{\text{th}} = \dfrac Mm\,(m + M)gh = 96.0\,\text{J}$, החלק $\dfrac{M}{m + M} = 98\%$ מהאנרגיה של הקליע. רק
              $1.96\,\text{J}$ מרימים את הגוש.
        rubric:
          - text: כתבתי שימור תנע להתנגשות ושימור אנרגיה לעלייה בלבד, ולא שימור אנרגיה דרך ההתנגשות.
          - text: >-
              הבעתי את $K_0$ ואת $K_1$ באמצעות $m$, $M$, $g$ ו-$h$, וקיבלתי $Q_{\text{th}} = \dfrac Mm(m + M)gh$ והחלק
              $\dfrac{M}{m + M}$.
          - text: בדקתי את הגבולות $M \to 0$ ו-$m \ll M$ ואת היחידות, וחישבתי $96.0\,\text{J}$.

      - label: ד
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-4.1-2, OBJ-4.1-1]
        prompt: >-
          מחליפים את הקליע בכדור גומי קשיח בעל אותה מסה $m$ ואותה מהירות $v$, שפוגע בגוש חזיתית ונרתע ממנו לאחור.
          מקדם התקומה בין הכדור לגוש הוא $e$.

          (1) הראו שהגוש (עכשיו בלי הכדור) עולה לגובה $h_e = (1 + e)^2h$, כאשר $h$ הוא הגובה עם הקליע שנתקע.

          (2) בדקו את הביטוי בגבולות ואת היחידות שלו, וחשבו לאיזה גובה עולה הגוש כש-$e = 0.50$.
        hints:
          - 'כתבו שימור תנע ואת ההגדרה של מקדם התקומה. יש שני נעלמים: מהירות הכדור ומהירות הגוש.'
        solution:
          - kind: law
            text: >-
              ציר חיובי בכיוון התנועה של הכדור לפני ההתנגשות; $v_b$ ו-$V_b$ הן המהירויות של הכדור ושל הגוש מיד
              אחריה, עם סימן. בהתנגשות הקצרה התנע נשמר, $mv = mv_b + MV_b$, ומקדם התקומה קובע את מהירות ההתרחקות:
              $V_b - v_b = e\,v$. אחרי ההתנגשות הגוש עולה, ואנרגיה נשמרת: $h_e = \dfrac{V_b^2}{2g}$.
          - kind: manipulation
            text: >-
              מהשנייה $v_b = V_b - ev$; הצבה בראשונה: $mv = mV_b - mev + MV_b$, ולכן $V_b = \dfrac{m(1 + e)v}{m + M}$.
              עם הקליע שנתקע $V_0 = \dfrac{mv}{m + M}$, ולכן $V_b = (1 + e)V_0$. הגובה פרופורציוני לריבוע המהירות,
              ולכן $h_e = (1 + e)^2h$.
          - kind: limit
            text: >-
              כש-$e = 0$, הכדור לא נרתע אלא נע יחד עם הגוש, וזו בדיוק המטוטלת הבליסטית: $h_e = h$. כש-$e = 1$,
              $h_e = 4h$: כדור שנרתע דוחף את הגוש גם כשהוא נעצר וגם כשהוא נזרק לאחור, ולכן מהירות הגוש כפולה, והגובה
              פי 4. כדור שנרתע מרים את הגוש גבוה יותר מקליע שנתקע.
          - kind: units
            text: '$(1 + e)^2$ חסר ממדים, ולכן $h_e$ במטרים, כמו $h$. גם $\dfrac{m(1 + e)v}{m + M}$ במטר לשנייה.'
          - kind: substitution
            text: >-
              $h_e = (1 + 0.50)^2\cdot0.20 = 2.25\cdot0.20 = 0.45\,\text{m}$. שימו לב: הריבוע הוא של $1 + e$ כולו,
              $(1 + e)^2 = 1 + 2e + e^2$. $(1 + e)h = 0.30\,\text{m}$ שוכח שהגובה פרופורציוני לריבוע המהירות, ו-$(1 + e^2)h = 0.25\,\text{m}$
              מפרק את הריבוע לא נכון.
          - kind: result
            text: >-
              $V_b = \dfrac{m(1 + e)v}{m + M} = (1 + e)V_0$, ולכן $h_e = (1 + e)^2h$: מ-$h$ בהתנגשות פלסטית ועד $4h$
              בהתנגשות אלסטית. כש-$e = 0.50$, $h_e = 0.45\,\text{m}$.
        rubric:
          - text: כתבתי שימור תנע עם שלושה איברים, ואת ההגדרה של מקדם התקומה עם הסימנים הנכונים.
          - text: פתרתי ומצאתי $V_b = \dfrac{m(1 + e)v}{m + M}$, והשוויתי למהירות $V_0$ של הגוש עם הקליע.
          - text: עברתי מהמהירות לגובה דרך שימור אנרגיה, וקיבלתי את הריבוע $(1 + e)^2$.
          - text: בדקתי שב-$e = 0$ מתקבל $h$ וב-$e = 1$ מתקבל $4h$, והסברתי את שניהם; חישבתי $0.45\,\text{m}$.

  # ------------------------------------------------------------ 3: two carts and a spring bumper
  - id: Q-4-bagrut-3
    type: bagrut
    title: שתי עגלות וקפיץ פגוש

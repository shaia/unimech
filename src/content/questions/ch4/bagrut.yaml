      - label: ג
        type: open
        points: 9
        level: bagrut
        objectives: [OBJ-4.3-1, OBJ-4.2-1]
        prompt: >-
          בהתנגשות שאינה חזיתית, גרעין הבריליום נרתע בזווית $\varphi$ ביחס לכיוון התנועה ההתחלתי של הנייטרון.

          (1) הראו שהחלק מהאנרגיה של הנייטרון שעובר לגרעין הוא
          $$f(\varphi) = \frac{4mM}{(m + M)^2}\cos^2\varphi$$

          (2) בדקו את הביטוי בגבולות $\varphi = 0$ ו-$\varphi \to 90^\circ$, ובמקרה $M = m$, ואת היחידות שלו. בניסוי בתא ענן
          רואים גרעין בריליום שנרתע בזווית $30^\circ$ ביחס לכיוון של נייטרון שהאנרגיה שלו $2.0\,\text{MeV}$: חשבו את האנרגיה
          הקינטית של הגרעין, ב-$\text{MeV}$.
        hints:
          - 'במערכת מרכז המסה, באיזו מהירות נע הגרעין לפני ההתנגשות, ובאיזו אחריה?'
          - 'במערכת המעבדה $\vec v_2'' = \vec V + \vec u_2''$, ושני הווקטורים באותו אורך. מה זה אומר על המשולש שהם יוצרים?'
          - >-
            דרך אחרת, במתקף, כמו בדיסקיות החלקות של שיעור 4.3: הגרעין עמד, ולכן הוא יוצא בכיוון של המתקף שקיבל. מה
            מהירות ההתקרבות לאורך הכיוון הזה, ומה המתקף $J$ בהתנגשות אלסטית?
        solution:
          - kind: law
            text: >-
              התנע נשמר, ולכן מרכז המסה נע במהירות קבועה $V = \dfrac{mv}{m + M}$. במערכת מרכז המסה הגרעין, שעמד
              במעבדה, נע לפני ההתנגשות במהירות $\vec u_2 = -\vec V$. בהתנגשות אלסטית הגודל נשמר, ולכן אחריה $|\vec u_2'| = V$,
              בכיוון כלשהו. חזרה למעבדה: $\vec v_2' = \vec V + \vec u_2'$.
          - kind: manipulation
            text: >-
              $\vec V$ ו-$\vec u_2'$ באותו אורך, $V$, ולכן המשולש שהם יוצרים עם $\vec v_2'$ שווה שוקיים, ו-$\vec v_2'$ חוצה
              את הזווית ביניהם. ההיטל של כל אחד מהם על כיוון $\vec v_2'$ הוא $V\cos\varphi$, ולכן
              $v_2' = 2V\cos\varphi = \dfrac{2mv\cos\varphi}{m + M}$. החלק מהאנרגיה:
              $$f = \frac{\tfrac12Mv_2'^2}{\tfrac12mv^2} = \frac{M}{m}\cdot\frac{4m^2\cos^2\varphi}{(m + M)^2} = \frac{4mM}{(m + M)^2}\cos^2\varphi$$
          - kind: manipulation
            text: >-
              דרך שקולה, במתקף, כמו בדיסקיות חלקות של שיעור 4.3: הגרעין עמד, ולכן הוא יוצא בכיוון של המתקף שקיבל, ב-$\varphi$.
              לאורך הכיוון הזה ההתנגשות היא התנגשות אלסטית בממד אחד, עם מהירות התקרבות $v\cos\varphi$, ולכן
              $J = 2\mu v\cos\varphi$ עם $\mu = \dfrac{mM}{m + M}$, ו-$v_2' = \dfrac JM = \dfrac{2mv\cos\varphi}{m + M}$, אותה תוצאה.
              נייטרון וגרעין אינם דיסקיות, אבל הטיעון לא צריך דיסקיות: המתקף הכולל על הגרעין הוא בכיוון אחד, $\varphi$,
              והמתקף על הנייטרון הפוך לו (שימור תנע). לכן בכיוון הניצב ל-$\varphi$ אף מהירות לא משתנה, ושימור האנרגיה
              הופך את מה שקורה לאורך $\varphi$ להתנגשות אלסטית בממד אחד.
          - kind: limit
            text: >-
              כש-$\varphi = 0$, התנגשות חזיתית: $f = \dfrac{4mM}{(m + M)^2} = 1 - \left(\dfrac{M - m}{M + m}\right)^2 = 0.36$,
              בדיוק מה שהנייטרון איבד בחלק א. כש-$\varphi \to 90^\circ$, פגיעה משיקית: $f \to 0$, הגרעין כמעט לא זז. כש-$M = m$
              ו-$\varphi = 0$: $f = 1$, הנייטרון נעצר ומוסר הכול, כמו בהתנגשות חזיתית של מסות שוות. וכש-$M \gg m$:
              $f \approx \dfrac{4m}{M}\cos^2\varphi \to 0$, כמו כדור שנרתע מקיר בלי לאבד אנרגיה.
          - kind: units
            text: '$\dfrac{4mM}{(m + M)^2}$ הוא מסה בריבוע חלקי מסה בריבוע, ו-$\cos^2\varphi$ חסר ממדים: $f$ חסר ממדים, כמו שחלק צריך להיות.'
          - kind: substitution
            text: >-
              $f(30^\circ) = 0.36\cdot\cos^2 30^\circ = 0.36\cdot0.75 = 0.27$, ולכן לגרעין $0.27\cdot2.0 = 0.54\,\text{MeV}$, ולנייטרון
              נשארו $1.46\,\text{MeV}$. שימו לב שהאנרגיה פרופורציונית ל-$\cos^2\varphi$, לא ל-$\cos\varphi$ (שהיה נותן
              $0.62\,\text{MeV}$), ושהזווית נמדדת מכיוון הנייטרון: $\sin^2$ במקומו היה נותן $0.18\,\text{MeV}$.
          - kind: result
            text: >-
              $f(\varphi) = \dfrac{4mM}{(m + M)^2}\cos^2\varphi$. לבריליום $\dfrac{4\cdot9}{10^2} = 0.36$ כפול $\cos^2\varphi$:
              הכי הרבה בפגיעה חזיתית, ושום דבר בפגיעה משיקית. בזווית $30^\circ$ הגרעין מקבל $0.54\,\text{MeV}$.
        rubric:
          - text: >-
              כתבתי שבמערכת מרכז המסה הגרעין נע לפני ההתנגשות ואחריה באותו גודל מהירות, $V = mv/(m + M)$; או, בדרך
              המתקף, שהגרעין יוצא בכיוון המתקף, ושלאורך הכיוון הזה ההתנגשות אלסטית בממד אחד.
          - text: >-
              חיברתי $\vec v_2' = \vec V + \vec u_2'$, וזיהיתי משולש שווה שוקיים שנותן $v_2' = 2V\cos\varphi$; או מצאתי
              $J = 2\mu v\cos\varphi$ ו-$v_2' = J/M$.
          - text: חישבתי את יחס האנרגיות וקיבלתי $f(\varphi)$.
          - text: >-
              בדקתי ש-$\varphi = 0$ מחזיר את התוצאה החזיתית של חלק א, שפגיעה משיקית נותנת אפס, ושב-$M = m$ ו-$\varphi = 0$
              מתקבל 1; וחישבתי $0.54\,\text{MeV}$ בזווית $30^\circ$.

      - label: ד
        type: open
        points: 7
        level: bagrut
        objectives: [OBJ-4.1-1, OBJ-4.1-2, OBJ-0.3-2]
        prompt: >-
          נכליל לכל גרעין מאט: נסמן $A = M/m$, ואת האנרגיה ההתחלתית והסופית של הנייטרון $E_0$ ו-$E_f$.

          (1) הראו שבהתנגשות חזיתית אחת הנייטרון מאבד את החלק $\dfrac{4A}{(A + 1)^2}$ מהאנרגיה שלו, ובדקו את הביטוי
          ב-$A = 1$ ובגבול $A \to \infty$.

          (2) הראו שכאשר $A \gg 1$, מספר ההתנגשויות החזיתיות שמוריד את האנרגיה מ-$E_0$ ל-$E_f$ (לפני העיגול למספר שלם)
          הוא בערך $N \approx \dfrac A4\ln\dfrac{E_0}{E_f}$, ובדקו את היחידות. השוו את הקירוב לתוצאה המדויקת של חלק ב
          לבריליום, ולפחמן, $A = 12$, עם אותן אנרגיות.
        hints:
          - 'מחלק א: איזה חלק מהאנרגיה נשאר לנייטרון בהתנגשות אחת? כתבו אותו באמצעות $A$.'
          - '$\ln\dfrac{A + 1}{A - 1} = \ln\left(1 + \dfrac1A\right) - \ln\left(1 - \dfrac1A\right)$, ו-$\ln(1 + x) \approx x$ כש-$x$ קטן.'
        solution:
          - kind: law
            text: >-
              בהתנגשות אלסטית חזיתית עם גרעין שעומד, $v_1' = \dfrac{m - M}{m + M}\,v = -\dfrac{A - 1}{A + 1}\,v$ (שיעור 4.1).
              לכן בכל התנגשות נשאר לנייטרון החלק $r = \left(\dfrac{A - 1}{A + 1}\right)^2$ מהאנרגיה, ואחרי $N$ התנגשויות
              $E_N = r^NE_0$.
          - kind: manipulation
            text: >-
              (1) החלק שאובד: $1 - r = \dfrac{(A + 1)^2 - (A - 1)^2}{(A + 1)^2} = \dfrac{4A}{(A + 1)^2}$, וזה גם החלק שעובר
              לגרעין, $\dfrac{4mM}{(m + M)^2}$ של חלק ג ב-$\varphi = 0$.
          - kind: manipulation
            text: >-
              (2) $r^NE_0 = E_f$, ולוקחים לוגריתם: $N = \dfrac{\ln\left(E_0/E_f\right)}{\ln(1/r)}$, עם
              $\ln\dfrac1r = 2\ln\dfrac{A + 1}{A - 1} = 2\left[\ln\left(1 + \dfrac1A\right) - \ln\left(1 - \dfrac1A\right)\right] \approx 2\left(\dfrac1A + \dfrac1A\right) = \dfrac4A$
              (פיתוח טיילור, שיעור 0.3). לכן
              $$N \approx \frac{A}{4}\ln\frac{E_0}{E_f}$$
              מספר ההתנגשויות גדל ליניארית עם מסת הגרעין.
          - kind: limit
            text: >-
              (1) ב-$A = 1$ (נייטרון על פרוטון): $\dfrac{4A}{(A + 1)^2} = 1$, הנייטרון מאבד הכול בהתנגשות אחת, כי מסות שוות
              מחליפות מהירויות. ומכיוון שמספר ההתנגשויות שלם ומעגלים אותו כלפי מעלה, צריך התנגשות אחת. כש-$A \to \infty$:
              $\dfrac{4A}{(A + 1)^2} \approx \dfrac4A \to 0$, ו-$N \to \infty$: נייטרון שפוגע בגרעין כבד מאוד נרתע כמעט בלי לאבד
              אנרגיה, כמו כדור מקיר. (2) הקירוב נבנה ל-$A \gg 1$, ולכן ב-$A = 1$ הוא לא אמור לעבוד: הוא נותן
              $\tfrac14\ln\left(2.0\cdot10^6\right) = 3.6$ במקום 1.
          - kind: units
            text: >-
              $E_0/E_f$ הוא יחס של שתי אנרגיות, חסר ממדים, ולכן אפשר לקחת ממנו לוגריתם; $N$ חסר ממדים, כמו מספר
              התנגשויות. לכן היחידה ($\text{eV}$ או $\text{MeV}$) לא משנה, כל עוד היא אותה יחידה בשתי האנרגיות.
          - kind: substitution
            text: >-
              $\ln\dfrac{2.0\cdot10^6}{1.0} = 14.5$. בריליום, $A = 9$: הקירוב $N \approx \tfrac94\cdot14.5 = 32.6$, והמדויק
              $\dfrac{14.5}{2\ln(10/8)} = 32.5$, כמו בחלק ב: הפרש של $0.4\%$. פחמן, $A = 12$: הקירוב $3\cdot14.5 = 43.5$,
              והמדויק $\dfrac{14.5}{2\ln(13/11)} = 43.4$, הפרש של $0.2\%$. הקירוב משתפר כש-$A$ גדל, וכבר ב-$A = 9$ הוא טוב.
          - kind: result
            text: >-
              בכל התנגשות חזיתית אובד החלק $\dfrac{4A}{(A + 1)^2}$, ו-$N \approx \dfrac A4\ln\dfrac{E_0}{E_f}$ כש-$A \gg 1$.
              מאט טוב בנוי מגרעינים קלים: לבריליום 33 התנגשויות חזיתיות, לפחמן 44, ולפרוטון אחת.
        rubric:
          - text: כתבתי את החלק שנשאר אחרי התנגשות אחת, $\left(\dfrac{A - 1}{A + 1}\right)^2$, וקיבלתי שהחלק שאובד הוא $\dfrac{4A}{(A + 1)^2}$.
          - text: בדקתי שב-$A = 1$ אובד הכול (התנגשות אחת), ושב-$A \to \infty$ כמעט כלום.
          - text: כתבתי $N = \ln(E_0/E_f)/\ln(1/r)$, פיתחתי את הלוגריתם כש-$A \gg 1$ וקיבלתי $N \approx \dfrac A4\ln\dfrac{E_0}{E_f}$.
          - text: בדקתי את היחידות, וקיבלתי לבריליום $32.6$ בקירוב מול $32.5$, ולפחמן $43.5$ מול $43.4$.

  # ------------------------------------------------------------ 5: a block, a free track and a wall (3.3, 3.5 + 4.x)
  - id: Q-4-bagrut-5
    type: bagrut
    title: גוש על מסילה חופשית, קיר, וחזרה למסילה
    prompt: >-
      בגוש גדול בעל מסה $M$ חצובה מסילה חלקה: היא מתחילה בגובה $h$ מעל הרצפה, יורדת שמאלה, ומסתיימת אופקית בגובה
      הרצפה, בדופן השמאלית של הגוש. הגוש הגדול מונח על רצפה חלקה. גוש קטן בעל מסה $m$ משתחרר ממנוחה בראש המסילה,
      ושני הגושים מתחילים במנוחה. משמאל לגוש הגדול, במרחק כלשהו ממנו, עומד על הרצפה קיר קבוע ואנכי. הגוש הקטן יוצא
      מתחתית המסילה ומחליק שמאלה על הרצפה, פוגע חזיתית בקיר ונרתע ממנו בהתנגשות אלסטית, ואחר כך נע ימינה, בעקבות
      הגוש הגדול. ציר $x$ ימינה. הזניחו חיכוך והתנגדות אוויר, והתייחסו לגוש הקטן כאל גוף נקודתי.

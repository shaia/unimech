  - id: Q-4.2-rank-mu
    type: rank
    objectives: [OBJ-4.2-2]
    level: mid
    prompt: >-
      סדרו את זוגות הגופים לפי המסה המצומצמת שלהם, $\mu = \dfrac{m_1m_2}{m_1 + m_2}$, מהגדולה לקטנה.
    items:
      - id: a
        label: '$1\,\text{kg}$ ו-$1\,\text{kg}$'
      - id: b
        label: '$1\,\text{kg}$ ו-$100\,\text{kg}$'
      - id: c
        label: '$2\,\text{kg}$ ו-$2\,\text{kg}$'
      - id: d
        label: '$1\,\text{kg}$ ו-$3\,\text{kg}$'
    order: [c, b, d, a]
    correctFeedback: >-
      נכון: $1.0$, $0.99$, $0.75$ ו-$0.5\,\text{kg}$. המסה המצומצמת קטנה תמיד מהמסה הקטנה בזוג, וכשגוף אחד כבד מאוד
      היא שואפת למסת הקל: גוף שפוגע בקיר כבד יכול לאבד את כל האנרגיה שלו. לשתי מסות שוות $\mu = m/2$.
    wrongFeedback: >-
      חשבו את $\mu$ לכל זוג. שימו לב שהיא לא גדלה עם המסה הכוללת: כשאחת המסות גדלה בלי גבול, $\mu$ שואפת למסה
      השנייה.
    hints:
      - 'מה $\mu$ כש-$m_2 \gg m_1$? חלקו מונה ומכנה ב-$m_2$.'

  - id: Q-4.2-available-energy
    type: numeric
    objectives: [OBJ-4.2-2]
    level: bagrut
    prompt: >-
      כדי לשבור מטרה בעלת מסה $m_2 = 1.5\,\text{kg}$, שעומדת על משטח בלי חיכוך, צריך שבהתנגשות יהפכו לפחות
      $30\,\text{J}$ של אנרגיה קינטית לעיוות. יורים אליה קליע בעל מסה $m_1 = 0.50\,\text{kg}$, שנדבק אליה. מה המהירות
      הקטנה ביותר של הקליע שבה המטרה נשברת?
    answer: 12.6
    unit: m/s
    correctFeedback: >-
      נכון. בהתנגשות פלסטית אובדת $\tfrac12\mu v^2$, עם $\mu = \dfrac{0.50\cdot1.5}{2.0} = 0.375\,\text{kg}$:
      $$v = \sqrt{\frac{2E}{\mu}} = \sqrt{\frac{2\cdot30}{0.375}} = 12.6\,\text{m/s}$$
      **בדיקת גבולות:** כש-$m_2 \to \infty$, המטרה היא קיר, $\mu \to m_1$, ומספיק $\sqrt{2E/m_1} = 11.0\,\text{m/s}$:
      כל האנרגיה של הקליע זמינה. כש-$m_2 \to 0$ גם $\mu \to 0$: מטרה קלה מאוד פשוט נדחפת קדימה, וקשה לשבור אותה.
    wrongFeedback: >-
      לא כל האנרגיה של הקליע זמינה: מרכז המסה ממשיך לנוע. השוו את האנרגיה הזמינה, $\tfrac12\mu v^2$, ל-$30\,\text{J}$.
    commonWrong:
      - value: 11.0
        feedback: >-
          השוויתם את כל האנרגיה של הקליע, $\tfrac12m_1v^2$, ל-$30\,\text{J}$. אבל הקליע והמטרה ממשיכים לנוע יחד, וחלק
          מהאנרגיה נשאר בתנועה של מרכז המסה. זמינה רק $\tfrac12\mu v^2$.
        misconception: MC-4-all-ke-lost
      - value: 5.48
        feedback: >-
          הצבתם את המסה הכוללת, $2.0\,\text{kg}$, במקום המסה המצומצמת. $\mu$ קטנה מכל אחת מהמסות, ולכן צריך מהירות
          גדולה יותר.
    hints:
      - 'אילו חלק מהאנרגיה הקינטית יכול להפוך לעיוות, ואיזה חייב להישאר?'

# Lesson 4.2 question bank: the comprehension ladder of "מערכת מרכז המסה".
# Every objective has ≥ 3 questions, at least one qualitative, and the lesson climbs basic → mid → bagrut
# (exam level). Strings may hold $inline$ / $$display$$ TeX and **bold**; never use "…" for TeX.
#
# Every number was computed by .scratch/ch4/q42.ts with src/physics/constants.ts:
#   2.0 kg at 6.0 m/s on 4.0 kg at rest: V = 2.0 m/s (plain average 3.0; weights swapped 4.0);
#   CM velocities u1 = +4.0, u2 = −2.0; elastic: u1' = −4.0, u2' = +2.0; lab v1' = −2.0, v2' = +4.0 m/s;
#   K = 36 J = K_cm 12 J + K_rel 24 J, μ = 4/3 kg;
#   e = 0.5, 1.0 kg at 8.0 m/s on 3.0 kg at rest: V = 2.0, v1' = −1.0, v2' = 3.0 m/s (elastic 4.0; u2' 1.0);
#   μ of (1,1) 0.5, (1,100) 0.990, (2,2) 1.0, (1,3) 0.75 kg;
#   identical cars, 50 + 50 km/h head-on vs 100 km/h on a parked one: equal K_rel, the second has twice the K;
#   0.50 kg on 1.5 kg at rest, 30 J needed: μ = 0.375 kg, v = √(2E/μ) = 12.6 m/s (with m1 11.0; with M 5.48).

chapter: 4
questions:
  # ---------------------------------------------------------------- OBJ-4.2-1 into the CM frame, solve, and back
  - id: Q-4.2-vcm
    type: numeric
    objectives: [OBJ-4.2-1]
    level: basic
    prompt: >-
      על מסילה בלי חיכוך, עגלה בעלת מסה $m_1 = 2.0\,\text{kg}$ נעה במהירות $6.0\,\text{m/s}$ אל עגלה בעלת מסה
      $m_2 = 4.0\,\text{kg}$ שעומדת במנוחה. מה גודל המהירות של מרכז המסה של שתי העגלות?
    answer: 2.0
    unit: m/s
    correctFeedback: >-
      נכון. $V = \dfrac{m_1v_1 + m_2v_2}{m_1 + m_2} = \dfrac{2.0\cdot6.0 + 0}{6.0} = 2.0\,\text{m/s}$: התנע הכולל חלקי
      המסה הכוללת. התנע הכולל נשמר בהתנגשות, ולכן $V$ זהה לפניה, בזמנה ואחריה.
    wrongFeedback: 'מהירות מרכז המסה היא התנע הכולל חלקי המסה הכוללת.'
    commonWrong:
      - value: 3.0
        feedback: >-
          זה הממוצע הפשוט של המהירויות, $\dfrac{6.0 + 0}{2}$. מהירות מרכז המסה היא ממוצע משוקלל במסות, והעגלה העומדת
          כבדה פי 2.
        misconception: MC-4-vcm-plain-average
      - value: 4.0
        feedback: 'החלפתם בין המשקלות: כפלתם את המהירות של עגלה 1 במסה של עגלה 2. כל מהירות נכפלת במסה של אותה עגלה.'
    hints:
      - '$V = \dfrac{\sum m_iv_i}{\sum m_i}$'

  - id: Q-4.2-cm-reverse
    type: mc
    objectives: [OBJ-4.2-1]
    qualitative: true
    level: basic
    prompt: >-
      שני גופים מתנגשים התנגשות חזיתית ואלסטית. במערכת מרכז המסה, כלומר במערכת הייחוס שנעה עם מרכז המסה, הגופים
      מתקרבים זה לזה לפני ההתנגשות. מה קורה להם במערכת הזו אחרי ההתנגשות?
    choices:
      - text: כל גוף נע אחורה, באותו גודל מהירות שהיה לו לפני ההתנגשות.
        correct: true
        feedback: >-
          נכון. במערכת מרכז המסה התנע הכולל אפס, לפני ההתנגשות ואחריה, ולכן $m_1u_1' = -m_2u_2'$: מספיק לדעת מהירות
          אחת. שימור האנרגיה קובע את הגודל, והפתרון היחיד שבו משהו קרה הוא $u_1' = -u_1$ ו-$u_2' = -u_2$.
      - text: שני הגופים נעצרים.
        feedback: >-
          זה קורה במערכת מרכז המסה בהתנגשות **פלסטית**: התנע הכולל אפס, והגוף המשותף עומד. בהתנגשות אלסטית האנרגיה
          הקינטית נשמרת, ולכן היא לא יכולה להתאפס.
        misconception: MC-4-cm-elastic-both-stop
      - text: הגופים מחליפים ביניהם מהירויות.
        feedback: >-
          החלפת מהירויות היא מה שקורה למסות שוות **במערכת המעבדה**, כשאחת עומדת. במערכת מרכז המסה, אם המסות שונות,
          החלפה הייתה נותנת תנע כולל שונה מאפס: $m_1u_2 + m_2u_1 \ne 0$.
      - text: כל גוף ממשיך באותה מהירות, כי במערכת הזו אין תנע כולל שיכול להשתנות.
        feedback: >-
          זה הפתרון "לא קרה כלום": שני הגופים עוברים זה דרך זה. הוא מקיים את חוקי השימור, אבל לא מתאר התנגשות.
    hints:
      - 'מה התנע הכולל במערכת מרכז המסה? ומה קובע את גודל המהירויות אחרי ההתנגשות?'

  - id: Q-4.2-cm-elastic-solve
    type: numeric
    objectives: [OBJ-4.2-1]
    level: mid
    prompt: >-
      העגלות משאלת מהירות מרכז המסה ($m_1 = 2.0\,\text{kg}$ במהירות $6.0\,\text{m/s}$ אל $m_2 = 4.0\,\text{kg}$
      במנוחה) מתנגשות התנגשות אלסטית. פתרו את ההתנגשות במערכת מרכז המסה וחזרו למערכת המעבדה. מה המהירות של
      העגלה **הראשונה** אחרי ההתנגשות? ענו עם סימן, כשהכיוון החיובי הוא כיוון התנועה ההתחלתי שלה.
    answer: -2.0
    unit: m/s
    correctFeedback: >-
      נכון. $V = 2.0\,\text{m/s}$. במערכת מרכז המסה $u_1 = 6.0 - 2.0 = 4.0\,\text{m/s}$ ו-$u_2 = 0 - 2.0 = -2.0\,\text{m/s}$.
      בהתנגשות אלסטית שתיהן מתהפכות: $u_1' = -4.0$ ו-$u_2' = 2.0\,\text{m/s}$. חזרה למעבדה, מוסיפים את $V$:
      $v_1' = -4.0 + 2.0 = -2.0\,\text{m/s}$ ו-$v_2' = 2.0 + 2.0 = 4.0\,\text{m/s}$. העגלה הקלה נרתעת לאחור.
    wrongFeedback: >-
      שלושה שלבים: חסרו את $V$ מכל מהירות, הפכו את הסימן של כל מהירות במערכת מרכז המסה, והוסיפו את $V$ בחזרה.
    commonWrong:
      - value: 2.0
        feedback: >-
          הגודל נכון, הכיוון לא. העגלה הראשונה קלה מהשנייה, ולכן היא נרתעת לאחור: $v_1' = \dfrac{m_1 - m_2}{m_1 + m_2}\,v_1 < 0$.
      - value: -4.0
        feedback: >-
          זו המהירות של העגלה הראשונה **במערכת מרכז המסה**. כדי לחזור למערכת המעבדה מוסיפים לה את מהירות מרכז המסה,
          $2.0\,\text{m/s}$.
        misconception: MC-4-cm-frame-is-lab-answer
      - value: 4.0
        feedback: 'זו המהירות של העגלה השנייה, הכבדה, אחרי ההתנגשות. השאלה שואלת על העגלה הראשונה.'
    hints:
      - 'במערכת מרכז המסה: $u_i = v_i - V$.'

  - id: Q-4.2-cm-inertial
    type: twotier
    objectives: [OBJ-4.2-1]
    qualitative: true
    level: mid
    prompt: >-
      שני גופים על משטח בלי חיכוך מתנגשים, ובזמן ההתנגשות הם מפעילים זה על זה כוחות גדולים. האם מערכת מרכז המסה
      היא מערכת ייחוס אינרציאלית גם בזמן ההתנגשות עצמה?
    choices:
      - text: כן. מהירות מרכז המסה קבועה לפני ההתנגשות, בזמנה ואחריה.
        correct: true
        feedback: >-
          נכון. לכן מותר לכתוב בה את החוקים של ניוטון ואת חוקי השימור כרגיל, ולכן גם המעבר אליה וחזרה הוא רק חיסור
          והוספה של מהירות קבועה אחת, $V$.
      - text: לא. בזמן ההתנגשות הכוחות הגדולים מאיצים את מרכז המסה.
        feedback: >-
          כל גוף אכן מאיץ בזמן ההתנגשות, אבל הכוחות הם כוחות פנימיים, זוג של פעולה ותגובה. בסכום הם מתבטלים, ולכן
          מרכז המסה לא מאיץ.
      - text: רק בהתנגשות אלסטית. בהתנגשות פלסטית מרכז המסה מאט, כי אנרגיה אובדת.
        feedback: >-
          האנרגיה שאובדת היא אנרגיה של התנועה **היחסית**. מהירות מרכז המסה תלויה רק בתנע הכולל, והוא נשמר בכל התנגשות
          שבה אין מתקף חיצוני.
        misconception: MC-4-all-ke-lost
    reasons:
      - text: >-
          הכוחות שהגופים מפעילים זה על זה שווים והפוכים, ולכן התנע הכולל קבוע, ואיתו $V = P/M$.
        correct: true
        feedback: >-
          זה הנימוק. $M\dfrac{dV}{dt} = \sum F_{\text{ext}}$, והכוחות הפנימיים לא נכנסים לסכום. בלי כוח חיצוני
          $V$ קבוע, ומערכת שנעה במהירות קבועה ביחס למערכת אינרציאלית היא אינרציאלית.
      - text: מרכז המסה הוא נקודה גאומטרית, ולכן כוחות לא פועלים עליו.
        feedback: >-
          מרכז המסה הוא אכן נקודה, אבל היא מאיצה בכל פעם שפועל על המערכת כוח חיצוני שקול: מרכז המסה של כדור שנזרק
          נע בפרבולה. כאן הוא לא מאיץ כי אין כוח חיצוני, לא כי הוא נקודה.
      - text: בזמן ההתנגשות הגופים צמודים, ולכן הם נעים כגוף אחד.
        feedback: >-
          גם כשהגופים צמודים לרגע, כל אחד מאיץ באופן אחר. מה שמבטיח שמרכז המסה לא מאיץ הוא שהכוחות הפנימיים מתבטלים
          בסכום.
    hints:
      - 'כתבו את החוק השני למערכת כולה. אילו כוחות נכנסים לסכום?'

  - id: Q-4.2-cm-restitution
    type: numeric
    objectives: [OBJ-4.2-1]
    level: bagrut
    prompt: >-
      גוף בעל מסה $1.0\,\text{kg}$ נע במהירות $8.0\,\text{m/s}$ ופוגע חזיתית בגוף בעל מסה $3.0\,\text{kg}$ שעומד
      במנוחה. מקדם התקומה הוא $e = 0.50$. במערכת מרכז המסה, התנגשות עם מקדם תקומה $e$ הופכת את המהירות של כל גוף
      ומקטינה אותה פי $e$. מה גודל המהירות של הגוף הכבד אחרי ההתנגשות, במערכת המעבדה?
    answer: 3.0
    unit: m/s
    correctFeedback: >-
      נכון. $V = \dfrac{1.0\cdot8.0}{4.0} = 2.0\,\text{m/s}$. במערכת מרכז המסה הגוף הכבד נע ב-$u_2 = -V = -2.0\,\text{m/s}$,
      ואחרי ההתנגשות ב-$u_2' = eV = 1.0\,\text{m/s}$. במעבדה $v_2' = u_2' + V = (1 + e)V = 3.0\,\text{m/s}$.
      **בדיקת גבולות:** כש-$e = 1$ יוצא $2V = 4.0\,\text{m/s}$, התוצאה האלסטית $\dfrac{2m_1}{m_1 + m_2}\,v_1$. כש-$e = 0$
      יוצא $V$: הגופים נעים יחד, התנגשות פלסטית. בדיקה נוספת: $v_1' = -e\cdot6.0 + 2.0 = -1.0\,\text{m/s}$, והתנע
      $1.0\cdot(-1.0) + 3.0\cdot3.0 = 8.0\,\text{kg}\cdot\text{m/s}$ נשמר.
    wrongFeedback: >-
      מצאו את $V$, חסרו אותו מהמהירות של הגוף הכבד, הפכו את הסימן וכפלו ב-$e$, ואז הוסיפו את $V$ בחזרה.
    commonWrong:
      - value: 4.0
        feedback: >-
          זו התוצאה של התנגשות אלסטית, $e = 1$. כאן המהירויות במערכת מרכז המסה קטנות פי 2 אחרי ההתנגשות.
        misconception: MC-4-ke-always-conserved
      - value: 2.0
        feedback: >-
          זו מהירות מרכז המסה, התוצאה של התנגשות פלסטית, $e = 0$. כאן הגוף הכבד מתרחק ממרכז המסה ב-$eV = 1.0\,\text{m/s}$.
      - value: 1.0
        feedback: >-
          זו המהירות של הגוף הכבד במערכת מרכז המסה. במעבדה מוסיפים לה את $V = 2.0\,\text{m/s}$.
        misconception: MC-4-cm-frame-is-lab-answer
    hints:
      - 'במערכת מרכז המסה, $u_2 = v_2 - V$. מה $u_2$ כשהגוף הכבד עומד במעבדה?'

  # ---------------------------------------------------------------- OBJ-4.2-2 K = K_cm + K_rel, the energy available
  - id: Q-4.2-ke-split
    type: numeric
    objectives: [OBJ-4.2-2]
    level: basic
    prompt: >-
      האנרגיה הקינטית של שני גופים מתפרקת לשני חלקים: $K = \tfrac12MV^2 + \tfrac12\mu v_{\text{rel}}^2$, כאשר $M$
      המסה הכוללת, $V$ מהירות מרכז המסה, $v_{\text{rel}} = v_1 - v_2$ המהירות היחסית, ו-$\mu = \dfrac{m_1m_2}{m_1 + m_2}$
      המסה המצומצמת. עבור $m_1 = 2.0\,\text{kg}$ במהירות $6.0\,\text{m/s}$ ו-$m_2 = 4.0\,\text{kg}$ במנוחה, מה האנרגיה
      הקינטית של התנועה היחסית, $\tfrac12\mu v_{\text{rel}}^2$?
    answer: 24
    unit: J
    correctFeedback: >-
      נכון. $\mu = \dfrac{2.0\cdot4.0}{6.0} = 1.33\,\text{kg}$, ו-$\tfrac12\mu v_{\text{rel}}^2 = \tfrac12\cdot1.33\cdot6.0^2 = 24\,\text{J}$.
      בדיקה: $\tfrac12MV^2 = \tfrac12\cdot6.0\cdot2.0^2 = 12\,\text{J}$, והסכום $36\,\text{J}$ הוא בדיוק $\tfrac12m_1v_1^2$.
    wrongFeedback: >-
      חשבו את $\mu$ מהמסות. המהירות היחסית היא ההפרש בין המהירויות, וכאן גוף 2 עומד.
    commonWrong:
      - value: 36
        feedback: >-
          זו כל האנרגיה הקינטית. חלק ממנה, $\tfrac12MV^2 = 12\,\text{J}$, שייך לתנועה של מרכז המסה, ורק השאר שייך
          לתנועה היחסית.
        misconception: MC-4-all-ke-lost
      - value: 12
        feedback: 'זו האנרגיה של מרכז המסה, $\tfrac12MV^2$, עם $V = 2.0\,\text{m/s}$. השאלה שואלת על החלק השני.'
      - value: 108
        feedback: >-
          הצבתם את המסה הכוללת במקום המסה המצומצמת. $\mu = \dfrac{m_1m_2}{m_1 + m_2}$ קטנה תמיד מכל אחת מהמסות.
    hints:
      - '$\mu = \dfrac{m_1m_2}{m_1 + m_2}$, ו-$v_{\text{rel}} = 6.0\,\text{m/s}$.'

  - id: Q-4.2-max-loss
    type: mc
    objectives: [OBJ-4.2-2]
    qualitative: true
    level: basic
    prompt: >-
      שני גופים מתנגשים התנגשות פלסטית, והכוחות החיצוניים זניחים. כמה אנרגיה קינטית אובדת בהתנגשות?
    choices:
      - text: בדיוק האנרגיה של התנועה היחסית, $\tfrac12\mu v_{\text{rel}}^2$.
        correct: true
        feedback: >-
          נכון. התנע נשמר, ולכן $V$ לא משתנה והחלק $\tfrac12MV^2$ נשאר. אחרי ההתנגשות אין תנועה יחסית, ולכן כל
          $\tfrac12\mu v_{\text{rel}}^2$ אבד. זו האנרגיה הגדולה ביותר שהתנגשות יכולה לאבד, ולכן היא נקראת האנרגיה
          הזמינה בהתנגשות.
      - text: כל האנרגיה הקינטית, כי הגופים נצמדים.
        feedback: >-
          אם כל האנרגיה הייתה אובדת, הגופים היו נעצרים, והתנע הכולל היה הופך לאפס. התנע נשמר, ולכן הגוף המשותף ממשיך
          במהירות $V$ ושומר את $\tfrac12MV^2$.
        misconception: MC-4-all-ke-lost
      - text: תמיד מחצית מהאנרגיה הקינטית.
        feedback: >-
          מחצית אובדת במקרה מיוחד, שתי מסות שוות כשאחת עומדת. באופן כללי החלק שאובד תלוי במסות ובמהירויות: כשהמהירות
          היחסית אפס, למשל, לא אובד דבר.
      - text: האנרגיה של מרכז המסה, $\tfrac12MV^2$.
        feedback: >-
          זה החלק היחיד שלא יכול לאבד: הוא נקבע על ידי התנע הכולל, והתנע נשמר.
    hints:
      - 'פרקו את $K$ לחלק של מרכז המסה ולחלק היחסי. איזה מהם חייב להישאר, ולמה?'

  - id: Q-4.2-head-on-cars
    type: twotier
    objectives: [OBJ-4.2-2]
    qualitative: true
    level: mid
    prompt: >-
      שתי מכוניות זהות. בתאונה A הן נוסעות זו מול זו, כל אחת במהירות $50\,\text{km/h}$, ומתנגשות חזיתית. בתאונה B
      מכונית אחת נוסעת במהירות $100\,\text{km/h}$ ופוגעת מאחור במכונית השנייה, שעומדת. בשתי התאונות המכוניות
      נצמדות. באיזו תאונה אובדת יותר אנרגיה קינטית, כלומר הופכת לעיוות ולחום?
    choices:
